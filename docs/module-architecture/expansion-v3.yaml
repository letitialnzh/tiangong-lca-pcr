status: draft
canonical_module: false
purpose: >-
  Third forward-designed expansion for non-service goods. These candidates cover quality-state
  decisions, composition changes, stability preservation, and product presentation without deriving
  module identity from a product or classification leaf.

design_basis:
  - docs/module-architecture.md
  - docs/module-architecture/abstraction-test-cases.yaml
  - docs/module-architecture/expansion-v2.yaml

records:
  - candidate_id: ACT-009
    working_name: grading-sorting-node
    kind: activity
    activation_question: >-
      Does the route independently classify, sort, or grade incoming material into two or more
      declared quality or destination states?
    stable_invariants:
      - incoming material state
      - classification or sorting responsibility
      - multiple declared output states or destinations
      - explicit hand-off for each state
    owns:
      - grade and destination role slots
      - classification boundary and completeness questions
      - reconciliation of accepted, downgraded, and rejected states
    does_not_own:
      - material or product identity
      - grade thresholds or market values
      - quantities, factors, and flow UUIDs
    test_cases:
      - cross-domain-grading-sorting
    decision:
      outcome: canonical_candidate
      reason: >-
        Sorting and grading changes declared quality or destination states without necessarily
        transforming material identity, and recurs across biological, mineral, and manufactured goods.

  - candidate_id: ACT-010
    working_name: formulation-blending-node
    kind: activity
    activation_question: >-
      Does the route combine two or more input substances or materials according to a declared
      composition responsibility into one or more formulated output states?
    stable_invariants:
      - multiple composition inputs
      - formulation or blending responsibility
      - declared output composition state
      - explicit hand-off
    owns:
      - ingredient or component role slots
      - composition boundary and reconciliation questions
      - checks for formulation losses and off-spec outputs
    does_not_own:
      - substance or product identity
      - recipe, concentration, or performance value
      - quantities, factors, and flow UUIDs
    test_cases:
      - cross-domain-formulation-blending
    decision:
      outcome: canonical_candidate
      reason: >-
        Formulation changes composition through a multi-input rule and is not equivalent to assembly,
        treatment, or simple material mixing without a declared composition responsibility.

  - candidate_id: ACT-011
    working_name: preservation-stabilization-node
    kind: activity
    activation_question: >-
      Does the route independently preserve, stabilize, or extend the declared usable state of a
      product or material through a bounded intervention?
    stable_invariants:
      - pre-preservation usable state
      - preservation or stabilization responsibility
      - post-intervention usable state
      - explicit hand-off and condition declaration
    owns:
      - stability-state interface slots
      - preservation boundary and condition questions
      - checks for intervention inputs, losses, and residuals
    does_not_own:
      - product identity or shelf-life value
      - preservation technology or treatment factor
      - quantities, factors, and flow UUIDs
    test_cases:
      - cross-domain-preservation-stabilization
    decision:
      outcome: canonical_candidate
      reason: >-
        Preservation changes the usable or stable state while leaving product identity to the PCR;
        the same responsibility can appear in different non-service goods routes.

  - candidate_id: ACT-012
    working_name: packaging-presentation-node
    kind: activity
    activation_question: >-
      Does the route independently enclose, protect, label, or present a product before its declared
      product hand-off, while remaining inside the product system boundary?
    stable_invariants:
      - unpackaged or prior product state
      - packaging or presentation responsibility
      - protected or presented output state
      - explicit boundary and hand-off
    owns:
      - package and product interface slots
      - packaging boundary and material-role questions
      - checks for packaging inputs, rejects, reuse, and end-of-use hand-off
    does_not_own:
      - product identity or market channel
      - packaging material choice or distribution service
      - quantities, factors, and flow UUIDs
    test_cases:
      - cross-domain-packaging-presentation
    decision:
      outcome: canonical_candidate
      reason: >-
        Product packaging can be a distinct product-route responsibility, but this candidate keeps
        distribution and logistics outside its boundary and does not infer packaging from a CPC label.

technology_decision:
  outcome: retain_existing_generic_module
  reason: >-
    Technology differences in grading, formulation, preservation, and packaging remain parent-relative
    deltas. No technology child is added from a process label alone.
