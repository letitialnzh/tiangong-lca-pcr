status: draft
canonical_module: false
ruleset: docs/module-architecture.md#abstraction-tests
test_cases: docs/module-architecture/abstraction-test-cases.yaml

review:
  - candidate: independent-process-node
    tested_against:
      - agriculture-managed-production-node
      - mining-extraction-and-treatment
      - electricity-generation-route
    provisional_outcome: canonical_candidate
    reason: >-
      The responsibility is defined by an independent process/interface role rather than
      by a product label. It remains a candidate until the process-slot and evidence contract
      is implemented and reviewed.

  - candidate: alternative-technology-route
    tested_against:
      - agriculture-managed-production-node
      - mining-extraction-and-treatment
      - electricity-generation-route
    provisional_outcome: canonical_candidate
    reason: >-
      The responsibility is valid only when a parent activity and a stable delta are explicit.
      No technology-specific module is promoted by this review.

  - candidate: multi-output-attribution
    tested_against:
      - cross-domain-multi-output
      - agriculture-multi-output-production
      - mining-multi-output-treatment
      - electricity-multi-output-generation
    provisional_outcome: canonical_candidate
    reason: >-
      The responsibility survives materially different agriculture, mining, and electricity
      route classes. It remains a candidate until the shared output-interface contract,
      evidence prompts, and coexistence rules are reviewed; no default allocation method is
      implied by this decision.

  - candidate: multi-period-attribution
    tested_against:
      - cross-domain-multi-period
      - agriculture-managed-production-node
      - agriculture-multi-period-production
      - mining-multi-period-asset
      - electricity-multi-period-asset
    provisional_outcome: design_record_only
    reason: >-
      The overlay survives distinct agriculture, mining, and electricity lifecycle shapes, but
      the shared phase, replacement, termination, and attribution interfaces are not yet stable
      enough to author a canonical conditional module.

  - candidate: managed-biological-production
    tested_against:
      - agriculture-managed-production-node
      - forestry-managed-production-node
      - aquaculture-managed-production-node
    provisional_outcome: canonical_candidate
    reason: >-
      The responsibility survives materially different land-based and aquatic managed-production
      routes. It remains a candidate until its boundary is separated from harvesting, conditioning,
      and the always-on process contract.

  - candidate: alternative-production-route
    tested_against:
      - agriculture-managed-production-node
      - forestry-managed-production-node
      - aquaculture-managed-production-node
    provisional_outcome: canonical_candidate
    reason: >-
      The parent-and-delta pattern is reusable across managed biological production routes. No
      named production technology is promoted by this review.

rejected_as_module:
  - product-family-rule
  - classification-leaf-rule
  - copied-product-practice
  - source-cache-without-current-product-activation
