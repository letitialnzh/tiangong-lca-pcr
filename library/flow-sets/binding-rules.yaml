schema_version: 1
description: >-
  Human-reviewed semantic aliases used by the generic PCR Flow Set binding audit.
  Flow Cards remain unchanged; rules are evaluated against existing row_id, role,
  name, and description text.

defaults:
  ignored_group_tokens:
    - air
    - ambient
    - water
    - soil
    - supply
    - service
    - input
    - output
    - material
    - resource
    - withdrawal
    - function
    - process
    - packaging
  derive_required_tokens_from_group_id: true

groups:
  electricity-supply:
    required_any: [electricity, electric power, electrical energy, 电力, 电能]
  purchased-process-heat:
    required_any: [process heat, thermal energy, heating service, hot water, 供热, 工艺热, 热能, 热水]
  steam-supply:
    required_any: [steam, steam supply, 蒸汽]
  stationary-combustion-fuel:
    required_any: [stationary combustion, stationary fuel, boiler fuel, furnace fuel, fuel or process heat, fuel or heat, 固定燃烧, 锅炉燃料]
  mobile-machinery-fuel:
    required_any: [mobile machinery, machinery fuel, machinery service, fuel or machinery, field machinery, tractor fuel, harvest machinery, 农机燃料, 田间机械]
  nitrogen-supply:
    required_any: [nitrogen fertilizer, nitrogen nutrient, urea fertilizer, ammonium nitrate, 氮肥, 尿素]
  phosphorus-supply:
    required_any: [phosphorus fertilizer, phosphate fertilizer, phosphorus nutrient, 磷肥, 磷酸盐肥料]
  potassium-supply:
    required_any: [potassium fertilizer, potassium nutrient, potash, 钾肥, 钾盐]
  organic-nutrient-supply:
    required_any: [organic fertilizer, organic nutrient, manure, compost, digestate, 有机肥, 粪肥, 堆肥]
  process-water:
    required_any: [process water, washing water, cooling water, fresh water, tap water, water supply, 工艺水, 清洗水, 冷却水, 淡水, 自来水]
    forbidden_any: [irrigation, irrigation water, 灌溉, 灌溉水]
  irrigation-water:
    required_any: [irrigation water, irrigation, 灌溉水, 灌溉]
  road-freight-transport:
    required_any: [road transport, road freight, truck transport, lorry transport, 公路运输, 道路货运, 卡车运输]
  water-freight-transport:
    required_any: [water transport, maritime transport, sea freight, inland waterway, barge transport, 水路运输, 海运, 驳船运输]
  flexible-packaging:
    required_any: [flexible packaging, packaging film, pouch, sachet, bag packaging, liner, stretch film, 柔性包装, 包装膜, 袋装]
  rigid-container-packaging:
    required_any: [rigid packaging, rigid container, bottle, jar, can packaging, container packaging, closure, drum packaging, 刚性包装, 瓶, 罐, 容器包装, 封口]
  carton-and-box-packaging:
