  pallet-and-crate-packaging:
    required_any: [pallet, crate, pallet packaging, 托盘, 板条箱]
  recycled-metal-material:
    required_any: [recycled metal, secondary metal, metal scrap, scrap metal, 再生金属, 金属废料]
  recycled-paper-fibre:
    required_any: [recycled paper, recycled fibre, secondary paper, paper scrap, 再生纸, 再生纤维, 纸废料]
  site-clearing-and-preparation:
