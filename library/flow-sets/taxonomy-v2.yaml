schema_version: 1
status: current-draft
title: PCR-first Flow Set taxonomy

binding_policy:
  priority:
    - applicable_flow_set_group
    - exact_verified_uuid_for_uncovered_flow
    - unmapped_coverage
  rule: "A PCR first cites the narrowest applicable reviewed Flow Set group. Resolve a fixed UUID only when no group covers the exchange."
  group_required: true
  candidate_count_policy:
    default_minimum: 5
    exception: "A group below the minimum is retained only when it is a high-importance, recurring PCR concept."
  candidate_role: "Candidate UUIDs are supporting registry evidence; they do not define PCR category coverage."

sets:
  - id: energy-supply
    coordinate: product-input
    groups:
      - id: electricity-supply
      - id: purchased-process-heat
      - id: steam-supply
      - id: stationary-combustion-fuel
      - id: mobile-machinery-fuel

  - id: agricultural-nutrient-supply
    coordinate: product-input
    groups:
      - id: nitrogen-supply
      - id: phosphorus-supply
      - id: potassium-supply
      - id: organic-nutrient-supply

  - id: water-use
    coordinate: product-input
    groups:
      - id: process-water
      - id: irrigation-water

  - id: transport-service
    coordinate: product-input
    groups:
      - id: road-freight-transport
      - id: water-freight-transport

  - id: packaging-function
    coordinate: product-input
    groups:
      - id: flexible-packaging
      - id: rigid-container-packaging
      - id: carton-and-box-packaging
      - id: pallet-and-crate-packaging

  - id: recovered-material-input
    coordinate: product-input
    groups:
      - id: recycled-metal-material
      - id: recycled-paper-fibre

  - id: construction-service
    coordinate: product-input
    groups:
      - id: site-clearing-and-preparation
      - id: earthwork-and-excavation
      - id: backfill-and-compaction
      - id: demolition-service

  - id: waste-treatment-service
    coordinate: product-input
    groups:
      - id: non-hazardous-waste-incineration
      - id: wastewater-treatment-service
        importance: high

  - id: resource-withdrawal
    coordinate: elementary-input
    groups:
      - id: water-resource-withdrawal
        importance: high
      - id: land-occupation
        importance: high
      - id: land-transformation
        importance: high

  - id: environmental-emission
    coordinate: elementary-output
    groups:
      - id: air-ambient-ammonia
        importance: high
      - id: air-ambient-nitrogen-oxides
        importance: high
      - id: air-ambient-nitrous-oxide
        importance: high
      - id: air-ambient-carbon-dioxide
        importance: high
      - id: air-ambient-carbon-monoxide
      - id: air-ambient-methane
        importance: high
      - id: air-ambient-sulfur-dioxide
        importance: high
      - id: air-ambient-sulfur-trioxide
      - id: air-ambient-sulfur-oxides-aggregate
      - id: air-ambient-particulate-matter
        importance: high
      - id: water-nitrate
        importance: high
      - id: water-phosphate
        importance: high
      - id: soil-nitrate
        importance: high
      - id: soil-phosphate
        importance: high
      - id: soil-arsenic
      - id: soil-antimony
      - id: soil-cadmium
        importance: high
      - id: soil-chromium
      - id: soil-lead
        importance: high
      - id: soil-mercury
        importance: high
      - id: soil-nickel
      - id: soil-thallium
      - id: soil-zinc
