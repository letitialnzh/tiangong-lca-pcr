review_metadata:
  methodology_review: required
  identity_review:
    semantic_boundary: distinct formulated water-in-oil product; refined-oil PCRs
      explicitly exclude formulation; dairy butter is a different feed/route
    existing_material_equivalent: none_found
    coverage_limit: Soya/palm full-fat plant-only emulsion; not full CPC21700 coverage
  electricity_identity_condition: Selected electricity UUID is CN user-side 1–35 kV
    grid-average consumption mix only; other countries, voltages or generation-side
    supplies require a newly verified identity and matching supplier data. Neither
    UUID nor provider is a global default; product methodology is not CN-restricted.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: ingredient_water
      reason: Process Water does not establish potable ingredient grade; Tap water,
        process candidate references CTUe rather than a usable physical
        quantity. No exact public potable ingredient identity confirmed.
    - row_id: salt
      reason: Published Sodium chloride is industrial chemical feedstock; powder
        candidate uses Volume without a verified bulk-density conversion.
        Food-grade dry salt identity remains unconfirmed.
    - row_id: lecithin
      reason: Search refined with lecithin and soya lecithin. Hydrogenated soy
        phosphatidylcholine is a different substance/grade; no exact
        non-hydrogenated food lecithin identity confirmed.
    - row_id: pp_tub
      reason: Container candidate is a recycling-treatment route; polypropylene resin
        is not a finished new food-contact tub. No exact matching component
        identity confirmed.
    - row_id: pp_lid
      reason: No exact finished polypropylene lid public identity confirmed; resin and
        recycled container identities rejected.
    - row_id: reference_product_margarine
      reason: Margarine, exact category and Chinese searches returned unrelated
        candidates; no semantically matching public reference product identity
        confirmed.
    - row_id: rejected_emulsion
      reason: Broad Food Debris lacks the specific emulsified-oil treatment state;
        waste frying oil and refinery soapstock describe different routes. Exact
        waste identity unresolved.
    - row_id: cip_effluent
      reason: Direct reads of Wastewater from cleaning and Wastewater, untreated
        specify discharge to water rather than external treatment. Exact
        margarine CIP treatment-bound flow remains unresolved.
  evidence_limitations:
    - Current Codex2024 original could not be acquired; retained official2009
      PDF is used only for historical nomenclature, not current food compliance.
    - SPX2012 process stages corroborated by current manufacturer catalogue,
      with no historical temperatures, leak rates, yields or energy values
      adopted.
    - "No foreground measurements supplied: every non-reference amount requires
      collection; scientific and food-grade applicability review remains
      outstanding."
    - No current factory observation of the exact minimal plant-only
      soya/palm/lecithin recipe; current manufacturer counterevidence includes
      other oils/dairy/additives and cannot establish exact target composition.
      Applicability requires real recipe, composition and acceptance records.
  blocking:
    - Independent scientific review and unresolved
      product/component/ingredient/treatment identities required before approval
      or publication.
