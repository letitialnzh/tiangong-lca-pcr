    used_for: "Historical naming distinction and representative subset; retained edition only, not current additive/safety/labelling/analytical compliance or current legal approval"
  - id: "spx-margarine-2012"
    type: "handbook"
    reference: "SPX, Margarine Production - Technology and Process, issued 07/2012 GB, pages 4–8, phase preparation, emulsion, thermal conditioning, crystallization/working, filling, remelting and CIP. https://www.spxflow.com/assets/pdf/gerstenberg-schroder-margarine-production-gb.pdf"
    used_for: "Historical qualitative process decomposition only; no numeric settings, energy savings, universal cleaning interval or obligatory refrigerant adopted"
  - id: "spx-margarine-current"
    type: "handbook"
    reference: "SPX FLOW / ITT Flow Technologies, Margarine & Shortening Processing Solutions, undated manufacturer catalogue, SSHE, Pin Rotor Machine, Plate Pasteurizer Unit and Hot Water Unit entries. https://www.spxflow.com/product-applications/margarine-shortening/"
    used_for: "Contemporary catalogue corroboration of available route equipment, not an independent factory observation or industry factor"
  - id: "landolakes-margarine"
    type: "handbook"
    reference: "Land O'Lakes, Margarine Sticks, undated official manufacturer listing, Ingredients. https://www.landolakes.com/products/margarine/margarine-sticks/"
    used_for: "Current commercial recipe counterevidence; contains palm-kernel oil, buttermilk and additional additives, not proof of this representative recipe/tub configuration"
