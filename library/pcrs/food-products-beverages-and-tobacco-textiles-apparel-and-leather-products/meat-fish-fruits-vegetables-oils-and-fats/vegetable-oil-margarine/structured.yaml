allocation_rules:
  - rule_id: al_direct
    applies_to: "all foreground consumption"
    rule: "First separate line/batch measurements and meter loads directly. Accepted margarine is the only normal saleable output of this recipe; rejected emulsion is waste unless destination and saleable specification establish a real co-product. Do not grant an avoided-product credit to internal rework."
    source_ids: []
  - rule_id: al_shared
    applies_to: "shared utilities and cleaning"
    rule: "Use cp_allocation to measure common load and operation shares. Time/load attribution is allowed only when logs and meter trials support the physical relation. Include start-up, standby, remelting and cleaning duty in the period. Do not prescribe mass allocation for all utilities or an unsupported economic split."
    source_ids: []
  - rule_id: al_residual
    applies_to: "unresolved multifunctionality"
    rule: "If a real co-product or shared-load relation cannot be separated, retain output quantities, disposition, measured drivers and alternative allocations for scientific review; disclose residual uncertainty instead of selecting an arbitrary fraction."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_recipe
      process_id: "prepare"
      flow_role: "Each ingredient and internal phase transfer"
      record_type: "Measured records"
      raw_fields: "lot; supplier; recipe; wet mass; stocks; grade; fat/water/salt; density; temperature; rework links"
      collection_method: "Calibrated tank load cells or mass meters; supplier specifications and batch issue reconciled to receipt/stocks"
      unit: "kg"
      frequency: "Each receipt and batch"
      temporal_coverage: "One representative full reporting period covering production, changeovers, cleaning and service events; disclose dates and gaps"
      site_scope: "Named factory and lines only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, supplier specs, reconciliations and uncertainty retained  ; aggregation detail: Net external ingredient consumption / accepted net margarine kg; internal transfers retained separately"
    - protocol_id: cp_thermal
      process_id: "thermal"
      flow_role: "Process configuration and quality state"
      record_type: "Measured records"
      raw_fields: "lot; emulsion transfer mass; thermal steps; temperatures; holding records; cooling/working arrangement; test/acceptance status"
      collection_method: "Record actual line recipe and calibrated instrument traces; no externally assumed safe temperature or time"
      unit: "kg; °C; s"
      frequency: "Each batch and change"
      temporal_coverage: "One representative full reporting period covering production, changeovers, cleaning and service events; disclose dates and gaps"
      site_scope: "Named factory and lines only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, supplier specs, reconciliations and uncertainty retained  ; aggregation detail: Link actual operation/quality records to output lots; quality readings are not inventory quantities"
    - protocol_id: cp_output
      process_id: "pack"
      flow_role: "Accepted net product"
      record_type: "Measured records"
      raw_fields: "lot; accepted net margarine kg; gross/tare weights; fat/water content; closure; rejected mass; stocks"
      collection_method: "Calibrated net-content weighing or gross less measured component tare; reconcile batch acceptance and stock changes"
      unit: "kg"
      frequency: "Each batch"
      temporal_coverage: "One representative full reporting period covering production, changeovers, cleaning and service events; disclose dates and gaps"
      site_scope: "Named factory and lines only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, supplier specs, reconciliations and uncertainty retained  ; aggregation detail: Sum accepted net wet margarine kg; exclude packaging, rejects and internal rework; basis per 1 kg reference flow"
    - protocol_id: cp_utilities
      process_id: "prepare_thermal_crystal_pack_cip_rework"
      flow_role: "Each electricity and heat row"
      record_type: "Measured records"
      raw_fields: "meter id; readings; unit; operation; electricity supply country/supplier; voltage; user/generation-side and transformer boundary; heat supplier/fuel; supply/return state; operating/standby time; driver"
      collection_method: "Calibrated submeter intervals and utility invoices reconciled with cp_allocation; record start-up/storage/CIP/rework load"
      unit: "kWh; MJ"
      frequency: "Continuous meters with batch/shift reconciliation"
      temporal_coverage: "One representative full reporting period covering production, changeovers, cleaning and service events; disclose dates and gaps"
      site_scope: "Named factory and lines only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, supplier specs, reconciliations and uncertainty retained  ; aggregation detail: Attributable measured energy / accepted net margarine kg; each carrier independently"
    - protocol_id: cp_pack
      process_id: "pack"
      flow_role: "Tub and lid independently"
      record_type: "Measured records"
      raw_fields: "component id; polymer; new/recycled state; mass; count; issues; rejects; stocks; supplier manufacturing"
      collection_method: "Weigh representative individual components on calibrated scales; reconcile issue counts and stock; supplier bill of materials"
      unit: "kg"
      frequency: "Each delivery/configuration and batch"
      temporal_coverage: "One representative full reporting period covering production, changeovers, cleaning and service events; disclose dates and gaps"
      site_scope: "Named factory and lines only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, supplier specs, reconciliations and uncertainty retained  ; aggregation detail: Separate total issued component kg / accepted net margarine kg; never normalize by gross package mass"
    - protocol_id: cp_water
      process_id: "cip"
      flow_role: "Purchased process water and direct well abstraction separately"
      record_type: "Measured records"
      raw_fields: "source; meter; m3 or kg; density; temperature; treatment; purchased/internal state; returns; basin"
      collection_method: "Calibrated water meters and measured density where required; well/purchase boundaries reconciled"
      unit: "kg; m3"
      frequency: "Each shift and cleaning event"
      temporal_coverage: "One representative full reporting period covering production, changeovers, cleaning and service events; disclose dates and gaps"
      site_scope: "Named factory and lines only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, supplier specs, reconciliations and uncertainty retained  ; aggregation detail: Each external supply or resource quantity / accepted net margarine kg; exclude duplicate internal distribution"
    - protocol_id: cp_cleaning
      process_id: "cip"
      flow_role: "Fresh NaOH solution"
      record_type: "Measured records"
      raw_fields: "product id; solution kg; concentration; CIP cycle; tank opening/closing; purge; reused volume"
      collection_method: "Weigh fresh solution issue and verify concentration certificate or analysis; document dilution/recirculation"
      unit: "kg"
      frequency: "Each cleaning event"
      temporal_coverage: "One representative full reporting period covering production, changeovers, cleaning and service events; disclose dates and gaps"
      site_scope: "Named factory and lines only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, supplier specs, reconciliations and uncertainty retained  ; aggregation detail: Fresh external solution kg / accepted net margarine kg; do not count recirculated tank solution again"
    - protocol_id: cp_refrigerant
      process_id: "crystal"
      flow_role: "NH3 charge and actual loss"
      record_type: "Measured records"
      raw_fields: "chemical; purity; opening/closing charge; make-up; recovery; transfers; event; medium/submedium; product share"
      collection_method: "Weighed charge/service records and leak events; reconcile system balance with uncertainty and shared-service allocation"
      unit: "kg"
      frequency: "Each service event and period balance"
      temporal_coverage: "One representative full reporting period covering production, changeovers, cleaning and service events; disclose dates and gaps"
      site_scope: "Named factory and lines only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, supplier specs, reconciliations and uncertainty retained  ; aggregation detail: Separately normalize attributable purchased NH3 and actual outdoor-air loss / accepted net margarine kg"
    - protocol_id: cp_waste
      process_id: "pack_cip"
      flow_role: "Rejected emulsion and external CIP effluent separately"
      record_type: "Measured records"
      raw_fields: "stream; wet mass/volume; density; composition; COD; oil; pH; destination; internal recovery; manifest"
      collection_method: "Calibrated weighing and effluent flowmeters; representative samples; destination transfer evidence"
      unit: "kg; m3"
      frequency: "Each batch disposal and cleaning discharge"
      temporal_coverage: "One representative full reporting period covering production, changeovers, cleaning and service events; disclose dates and gaps"
      site_scope: "Named factory and lines only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, supplier specs, reconciliations and uncertainty retained  ; aggregation detail: Each exported waste quantity / accepted net margarine kg; no internal rework or duplicate elementary discharge"
    - protocol_id: cp_allocation
      process_id: "prepare_thermal_crystal_pack_cip_rework"
      flow_role: "Shared utilities/cleaning attribution"
      record_type: "Measured records"
      raw_fields: "total load; submeter load; operating time; measured driver; product lots; fractions; residual; trials"
      collection_method: "Compare driver shares against actual meter trials; retain all product shares and uncertainties; prefer direct measurement"
      unit: "kWh; MJ; kg; m3"
      frequency: "Each shared cycle and reporting period"
      temporal_coverage: "One representative full reporting period covering production, changeovers, cleaning and service events; disclose dates and gaps"
      site_scope: "Named factory and lines only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, original logs, supplier specs, reconciliations and uncertainty retained  ; aggregation detail: Attributed load must sum to measured total; each row normalized per 1 kg reference flow"
  calculation_rules:
    - id: normalization
      applies_to: "all inventory rows"
      rule: "For each non-reference row, divide its attributable external measured amount in its declared numerator unit by total accepted net wet margarine kg from cp_output. The reference-product row is exactly 1 kg; its source total is not divided by itself as another input."
      inputs:
        - cp_output
        - "relevant row protocol"
      output: "Row quantity per 1 kg reference flow"
      source_ids: []
    - id: mass_conversion
      applies_to: "ingredient_water; cleaning_water; pp_tub; pp_lid"
      rule: "Water mass kg = measured m3 × measured density kg/m3; each component mass kg = issued count × measured mean component net kg. Retain sampling dispersion and temperature."
      inputs:
        - cp_recipe
        - cp_water
        - cp_pack
      output: "Measured mass before normalization"
      source_ids: []
    - id: refrigerant_balance
      applies_to: "ammonia_air"
      rule: "Actual loss = opening charge + fresh additions + documented incoming transfers − closing charge − recovered outgoing transfers, with reconciliation of all system movements. Negative residual or uncertain recovery requires review, not a forced zero. Normalize only the share attributable to margarine."
      inputs:
        - cp_refrigerant
        - cp_allocation
        - cp_output
      output: "kg NH3 to declared air subcompartment per 1 kg reference flow"
      source_ids: []
    - id: product_balance
      applies_to: "recipe and output period"
      rule: "Reconcile external ingredient wet masses and opening stock against accepted net output, closing stock, externally removed emulsion, effluent entrainment and measured other losses. Internal remelting cancels as mass transfer but retains energy. Do not assume fat inputs equal total wet output or impose a universal yield."
      inputs:
        - cp_recipe
        - cp_output
        - cp_waste
      output: "Documented wet mass and fat/water balance residuals"
      source_ids: []
  data_quality_requirements:
    - id: dq_recipe
      applies_to: "product and feeds"
      requirement: "Supplier food-grade/unmodified-oil identity, lecithin composition and measured wet fat/water/salt match accepted recipe; record actual product specification and test status. PCR interpretation is not food safety or health approval."
      evidence: "Supplier certificates; recipe; tests; release records"
    - id: dq_coverage
      applies_to: "whole period and processes"
      requirement: "Use one consistent period covering all selected operations, utilities, cleaning, storage and losses. Explain each conditional absence, zero and unmeasured amount; no universal cut-off removes minor ingredients or leaks."
      evidence: "Period logs; BOM; event records; reconciliations"
    - id: dq_identity
      applies_to: "linked flows and datasets"
      requirement: "Verify chemical/grade, property/unit, supply geography, electrical voltage and user/generation-side boundary, heat fuel and release compartment. Accept electricity UUID 3d76981f-964a-4865-b588-0e067a2a1163 only for matching CN user-side 1–35 kV grid-average consumption mix; reject its use for other countries, voltages or generation-side supplies and require a newly verified identity with matching supplier data. Neither the UUID nor its provider is a global default. Identity matching does not establish temporal or supplier-dataset representativeness; document supplier datasets and all proxies separately."
      evidence: "Published identity and upstream source records"
    - id: dq_uncertainty
      applies_to: "balances and attribution"
      requirement: "Retain instrument accuracy, density/packaging samples, recipe changes and allocations; set site-derived tolerance from uncertainty, not invented PCR yield or energy ranges. Unresolved balance/identity remains explicit."
      evidence: "Calibration; samples; allocation trials; sensitivity records"
validation_rules:
  - rule_id: val_scope
    applies_to: "product applicability"
    rule: "Require plant-only recipe with the named unmodified oils, lecithin, measured 80–90% wet fat and declared primary packaging. Other formulations/routes require separate applicability review and cannot inherit full coverage."
    source_ids:
      - codex-fat-spreads-2009
  - rule_id: val_measure
    applies_to: "reference and every row"
    rule: "Reference output name must match the output card; reference quantity is 1 kg net wet food. Check protocol links and normalization denominator, density/count conversions, solution concentration and units; reject gross/dry-fat denominators or energy/volume/mass substitutions."
    source_ids: []
  - rule_id: val_boundary
    applies_to: "completeness and balances"
    rule: "All actual ingredients, utilities, cleaning and wastes must be atomic exchanges. Reconcile wet/fat/water balance, common loads, internal rework and net filling. Missing measurements, unknown destinations or unexplained residuals yield incomplete validation, not a passing zero."
    source_ids: []
  - rule_id: val_identity
    applies_to: "flow identity and review"
    rule: "Check each selected public flow including its reference property, route and medium/submedium; retain exact localized names. Keep unconfirmed identities unresolved and distinguish performed/skipped checks. Structural checks do not establish scientific, food-grade, safety or methodology approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground gate-to-gate margarine manufacture"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "A documented recipe/site/period margarine manufacturing contribution with explicit upstream and external-treatment links for expanded studies"
  excluded_use: "Unqualified full CPC21700 coverage; complete cradle-to-gate without linked stages; food-safety, shelf-life or health approval; comparison across differing fat/function/configuration without review"
  required_metadata: "All reference qualifiers; reference/output name; wet mass; process map; dates; geography; upstream sources; waste destination; allocations; exact identity gaps"
  required_quality_disclosure: "Measured versus absent/unmeasured exchanges; balance residuals; uncertainty; coverage of supplier manufacture; proxies; scientific review status and original source limitations"
  update_trigger: "Changed oil recipe, fat fraction, emulsifier, processing/thermal route, refrigerant, water/heat/power supply, package, site, allocation or upstream identity"
data_sources:
  - id: "unsd-cpc-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, PDF/printed page 94, 21693 and 21700. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context; 21700 heading has no substantive explanation; does not establish complete product coverage"
