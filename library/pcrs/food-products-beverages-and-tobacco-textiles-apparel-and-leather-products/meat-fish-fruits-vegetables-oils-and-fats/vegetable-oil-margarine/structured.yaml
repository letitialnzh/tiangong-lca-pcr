measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted net wet food on calibrated scales using cp_output; all inventory denominators are per 1 kg reference flow. Never use gross tub mass or dry-fat mass."
  - id: energy_conversion
    applies_to: "electricity and purchased heat"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh; MJ"
    rule: "Preserve the published reference property. Energy unit conversion uses 1 kWh = 3.6 MJ; meter useful delivered heat separately. Heat quantity is not a steam mass or water volume."
  - id: solution_basis
    applies_to: "naoh30"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Delivered 30% NaOH solution mass is the exchange. Record measured concentration c as mass fraction; active NaOH mass = delivered solution mass × c; do not add active mass as a second product input."
  - id: water_basis
    applies_to: "ingredient and cleaning water; groundwater; effluent"
    required_property_ref:
      name: "Mass or Volume as declared per row"
      uuid: ""
    required_unit: "kg; m3"
    rule: "Volume-to-mass conversion requires measured density in kg/m3 at recorded temperature, not a universal assumed density. Retain m3 for resource abstraction and external effluent."
