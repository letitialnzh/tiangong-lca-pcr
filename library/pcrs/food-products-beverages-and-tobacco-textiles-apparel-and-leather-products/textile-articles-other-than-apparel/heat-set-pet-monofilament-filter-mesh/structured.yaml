allocation_rules:
  - rule_id: allocation_direct
    applies_to: "co-production and shared equipment"
    rule: "First subdivide by lot and submeter. Attribute shared loom, stabilization and climate-control burdens using measured electricity or verified operating-time/load drivers. Net-mass allocation within comparable runs is allowed only with observed equal process/resource relationships; different mesh geometries are not assumed equally energy intensive per kg."
    source_ids: []
  - rule_id: allocation_internal
    applies_to: "internal reuse and waste"
    rule: "Transfer internal beams/cloth burdens once; retain accumulated burdens in rework. Link PET waste treatment to actual destinations without presumed avoided-virgin-PET credit from sale or recovery; oil and wastewater treatment are not omitted."
    source_ids: []
  - rule_id: allocation_coproduct
    applies_to: "marketable downgraded mesh"
    rule: "Distinguish waste from saleable downgraded mesh and record grade, use and net mass. Subdivide separable lots first, then allocate remaining shared burdens by observed physical relationships. Where none is supported, use actual contemporaneous revenue allocation with price evidence and sensitivity, rather than burden-free downgraded cloth."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "warp/weft yarn, beams, remnants, preparation power"
      record_type: "batch ledger; weighing; meter"
      raw_fields: "lot; virgin PET/monofilament certificate; diameter/drawn-state/finish/moisture; net warp/weft issues; returns/stocks; PET scrap kg; kWh"
      collection_method: "Calibrated scales less tare; submeter and work orders; reconcile beam transfers"
      unit: "kg; kWh"
      frequency: "each lot; continuous meter readings"
      temporal_coverage: "current representative consecutive production period, declaring dates, downtime and seasonality; no invented duration"
      site_scope: "one identified factory with shared-utility attribution"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, work orders, raw records, stock/balance reconciliation, detection limits and gaps"
    - protocol_id: cp_weave
      process_id: "weave"
      flow_role: "weaving, electricity, lubricant and PET waste"
      record_type: "work orders; weighing; meter; maintenance logs"
      raw_fields: "lot; loom/insertion type; tension/counts; kWh; mineral-oil formulation and net make-up kg; oil drain kg; clean PET waste kg; captured dust and gaps"
      collection_method: "Submeter; calibrated scales; oil-container stocks and maintenance logs; lot-segregated waste"
      unit: "kg; kWh"
      frequency: "each lot; continuous meter readings"
      temporal_coverage: "current representative consecutive production period, declaring dates, downtime and seasonality; no invented duration"
      site_scope: "one identified factory with shared-utility attribution"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, work orders, raw records, stock/balance reconciliation, detection limits and gaps"
    - protocol_id: cp_rinse
      process_id: "rinse"
      flow_role: "fresh water, rinse power, exported wastewater"
      record_type: "flow/weighing records; water quality; transfer slips"
      raw_fields: "lot; presence/absence evidence; water quality; fresh water kg; circulation; wastewater kg; m3 and measured density kg/m3; finish and suspended PET; treatment provider; kWh"
      collection_method: "Calibrated flowmeter and density determination or weighing; treatment-transfer slips; exclude repeated circulation"
      unit: "kg; kWh; m3; kg/m3"
      frequency: "each lot; continuous meter readings"
      temporal_coverage: "current representative consecutive production period, declaring dates, downtime and seasonality; no invented duration"
      site_scope: "one identified factory with shared-utility attribution"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, work orders, raw records, stock/balance reconciliation, detection limits and gaps"
    - protocol_id: cp_stabilize
      process_id: "stabilize"
      flow_role: "heat-setting/calendering, moisture and rejects"
      record_type: "work orders; submeters; thermal/pressure and weighing records"
      raw_fields: "lot; kWh; actual temperature/time/tension/width; calender presence, pressure/speed; pre/post moisture and mass; condensate; clean PET rejects kg"
      collection_method: "Submeter heater and auxiliaries; thermal logs/work orders; matched moisture tests/calibrated scales; separate optional calendering records"
      unit: "kg; kWh"
      frequency: "each lot; continuous meter readings"
      temporal_coverage: "current representative consecutive production period, declaring dates, downtime and seasonality; no invented duration"
      site_scope: "one identified factory with shared-utility attribution"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, work orders, raw records, stock/balance reconciliation, detection limits and gaps"
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "accepted net output, packaging and rejects"
      record_type: "quality tests; weighing; meter; release records"
      raw_fields: "lot; net roll mesh kg; each packaging component tare kg; rejects kg; L m, W m, G g/m2; measured openings/open area/diameter/counts/thickness; stability; conditioning; kWh"
      collection_method: "Calibrated scales gross less individual tares; matched release lots; geometry/conditioning tests; area conversion verified only within the same lot"
      unit: "kg; kWh; m; g/m2; µm"
      frequency: "each lot; continuous meter readings"
      temporal_coverage: "current representative consecutive production period, declaring dates, downtime and seasonality; no invented duration"
      site_scope: "one identified factory with shared-utility attribution"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, work orders, raw records, stock/balance reconciliation, detection limits and gaps"
    - protocol_id: cp_releases
      process_id: "weave_stabilize"
      flow_role: "airborne particles and evaporated water"
      record_type: "monitoring; water-balance records"
      raw_fields: "lot; stage; release source and immediacy; compartment/subcompartment; particulate sampling before/after capture kg; size status; incoming/drained/moisture/condensate kg; evaporation kg; detection limit and uncertainty"
      collection_method: "Actual release monitoring; full measured water balance over matched period; use specific flows when subcompartment is known; missing measurement is not zero"
      unit: "kg"
      frequency: "each lot; continuous meter readings"
      temporal_coverage: "current representative consecutive production period, declaring dates, downtime and seasonality; no invented duration"
      site_scope: "one identified factory with shared-utility attribution"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, work orders, raw records, stock/balance reconciliation, detection limits and gaps"
  calculation_rules:
    - id: normalize_batch
      applies_to: "all inventory rows"
      rule: "For each row divide the exchange total attributable to the matched accepted lot by its net mesh mass; the finished output is 1 kg per 1 kg reference flow. Measure conditional rows only where actual, without numerical defaults."
      inputs:
        - cp_prepare
        - cp_weave
        - cp_rinse
        - cp_stabilize
        - cp_release
        - cp_releases
      output: "row amount per 1 kg reference flow"
      source_ids: []
    - id: matched_area
      applies_to: "area records"
      rule: "A = L × W; net mesh kg = A × G / 1000; use matched-lot final-finish measured L, W and G, reconciled against calibrated weighed output."
      inputs:
        - cp_release
      output: "mass reconciled to net output"
      source_ids: []
    - id: water_mass
      applies_to: "water volume records"
      rule: "Water/wastewater kg = V (m3) × measured rho (kg/m3) at matched temperature/state; wet wastewater mass includes measured carried constituents."
      inputs:
        - cp_rinse
      output: "water and wastewater mass"
      source_ids: []
    - id: energy_conversion
      applies_to: "electricity unit conversion"
      rule: "MJ = kWh × 3.6; retain Net calorific value property."
      inputs:
        - cp_prepare
        - cp_weave
        - cp_rinse
        - cp_stabilize
        - cp_release
      output: "consistent energy units"
      source_ids: []
    - id: balance_pet_water
      applies_to: "materials and moisture"
      rule: "Reconcile dry PET and wet mass separately across issues, stocks, finished cloth, scrap, carried constituents and measured releases; water balance includes fresh input, yarn/wet-cloth moisture, drains, condensate returns and final moisture. Do not label unexplained residuals as inevitable air releases; report residual uncertainty."
      inputs:
        - cp_prepare
        - cp_weave
        - cp_rinse
        - cp_stabilize
        - cp_release
        - cp_releases
      output: "evidenced closure and remaining residual"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "feed and product"
      requirement: "Verify virgin PET monofilament/no-size, incoming processing state and all final mesh qualifiers; reference product and output row names remain identical."
      evidence: "supplier certificates, work orders and acceptance tests"
    - id: quality_basis
      applies_to: "measurement"
      requirement: "Every row uses matched accepted net mesh denominator; exclude packaging from mesh mass; record moisture, finish and dry polymer separately with calibration/unit traceability."
      evidence: "cp_release; cp_prepare; cp_rinse"
    - id: quality_coverage
      applies_to: "representativeness/completeness"
      requirement: "Disclose actual period, geography/supply, product mix, downtime/rework, optional stages, release monitoring, gaps and allocation; absence and missing measurement are not collapsed to zero."
      evidence: "production logs, submeters, monitoring and gap ledger"
    - id: quality_evidence
      applies_to: "external sources"
      requirement: "Sources support product/process context; historical handbook does not supply current quantitative defaults. Virgin yarn upstream burdens, wastewater treatment and final releases require separate links."
      evidence: "source applicability, supplier data and actual treatment chain"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Reference product name matches finished_mesh; reference output is 1 kg accepted net mesh in the same state with all qualifiers. Do not equate a mass declared unit with equivalent screening function."
    source_ids: []
  - rule_id: validate_route
    applies_to: "actual route"
    rule: "Verify mechanical insertion, electric heat-setting and actual optional stages. Finishing chemicals, fuel heat or on-site wastewater treatment make this narrow route incomplete until extended."
    source_ids: []
  - rule_id: validate_atomic
    applies_to: "all exchanges"
    rule: "Each row is one specific physical/chemical exchange; public UUID property/unit group, material origin, feed state and compartment/subcompartment must match. Do not force unresolved identities or represent them as verified."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "amounts and allocation"
    rule: "Amounts are finite and nonnegative; reconcile matched stocks/inputs/output/wastes/water without duplicate internal transfers. Explain residuals and allocation sensitivity without unsupported tolerance thresholds."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Report performed, skipped, not-applicable, unmeasured and identity-unresolved checks separately. Missing release measurements do not prove no release; unlinked upstream prevents whole-lifecycle claims."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site- and specification-specific mesh manufacturing foreground process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing modelling of matching material/geometry/finish screening cloth; downstream assembly linkage after explicit matching"
  excluded_use: "Whole CPC27998 coverage; agriculture/food manufacture; food/medical approval; lifetime screening service or complete cradle-to-gate claims; products outside this route"
  required_metadata: "monofilament/feed state, mesh/quality qualifiers, actual route, site/period/voltage, net mass, packaging configuration, upstream/treatment links, allocation and stage status"
  required_quality_disclosure: "representativeness, calibration/raw records, denominator, moisture/finish, monitoring/detection limits, gaps, unresolved identities and sensitivity; no implied methodology approval"
  update_trigger: "change in polymer/monofilament state, geometry, finishing/cleaning chemistry, heat source, electricity, packaging, treatment chain or acceptance"
