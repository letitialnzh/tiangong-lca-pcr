    reference: "SAATI, Polyester Woven Meshes, undated manufacturer page, accessed 2026-10-06, sections Explore Our Polyester Woven Meshes and SAATIfil. https://www.saati.com/products/filtration/filter-meshes-fabrics/pet/"
    used_for: "Current commercial PET woven filtration-product and aperture context; no compliance, lifetime or numeric default adopted."
  - id: "saati-ecofiltra-2022"
    type: "handbook"
    reference: "SAATI, Ecofiltra brochure, March 2022, PDF p. 5 / printed pp. 6–7, Monofilament Mesh; PDF p. 6 / printed pp. 8–9, weave distinctions. https://www.saati.com/media/wc5dcx45/emea_ecofiltra_brochure_mar-2022_eng_v5.pdf"
    used_for: "Historical monofilament versus multifilament/staple construction and weaving distinctions; optional calendering context. No historical specification values or performance claims transferred to current production."
