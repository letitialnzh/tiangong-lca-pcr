review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review:
    status: pending
    limitations:
      - Candidate methodology; scientific review and methodology approval remain
        pending; no publication or accepted mapping.
      - Narrow virgin PET monofilament woven, undyed uncoated electrically
        heat-set mesh route only; not whole CPC27998 coverage.
      - No foreground factory data supplied. Temperatures, dwell times, recipes,
        energy, losses, outputs and lifetime are not numerical defaults.
      - Sefar historical PDF could not be acquired (HTTP 429/404); not used as
        evidence. SAATI March2022 brochure used only for historical construction
        descriptions, corroborated by current manufacturer product context.
  semantic_boundary_decision:
    decision: new_narrow_semantic_method
    rationale: The existing generic >=85% man-made-filament woven method does
      include conditional heat-setting, but excludes separately governed special
      fabrics and has no dedicated precision monofilament screening endpoint or
      final mesh-opening/open-area and dimensional-stability qualification. The
      batch high-tenacity PET method stops at untreated greige, while
      nylon6/cotton tyre cord has a different composition/construction. Common
      weaving and mass-accounting principles are reusable, but none establishes
      exact applicability to this heat-set precision PET mesh endpoint. The
      legacy technical-textile leaf is an empty scaffold and remains untouched.
      New identity is justified by the product/method boundary, not CPC code or
      electric equipment alone.
  unresolved_flow_identities:
    - row_id: mineral_lubricant
      selected_flow: Mineral lubricating oil
      reason: Closest public lubricating-oil record specifies fully synthetic PAO,
        conflicting with mineral oil despite generic mineral-oil commentary.
    - row_id: spent_mineral_oil
      selected_flow: Spent mineral lubricating oil
      reason: Exact spent mineral lubricant composition and waste-to-treatment
        identity remain unconfirmed after public candidate searches and direct
        reads.
    - row_id: rinse_wastewater
      selected_flow: Untreated PET mesh rinse wastewater
      reason: Public textile-wastewater candidates specify to water, not transfer of
        untreated rinse wastewater to a technosphere treatment provider; sizing
        wastewater also has the wrong route.
    - row_id: corrugated_carton
      selected_flow: Corrugated paperboard shipping carton
      reason: Confirmed corrugated-box identity fixes 16.6% primary and 83.4% recycled
        fibre; no foreground carton composition was supplied to establish this
        condition.
    - row_id: finished_mesh
      selected_flow: Heat-set PET monofilament filter mesh
      reason: Public Polyester Mesh Fabric describes clothing-oriented woven or
        knitted mesh and does not confirm precision monofilament screening
        construction or heat-set endpoint; broader technical-textile entries are
        not this exact product. Direct-read Filter cloth candidate also leaves
        polymer, monofilament construction and finishing endpoint unspecified.
  unresolved:
    - Complete independent scientific methodology review before
      activation/publication.
    - Unresolved exact product and waste-to-treatment identities prevent
      pretending that every row has verified public identity.
    - Actual factories must demonstrate the narrow electric/no-chemical route
      and provide records; different supplies, finishing chemistry and treatment
      routes require extension.
