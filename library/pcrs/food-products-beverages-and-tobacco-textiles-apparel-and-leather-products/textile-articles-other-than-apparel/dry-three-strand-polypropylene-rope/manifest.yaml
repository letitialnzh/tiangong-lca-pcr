  semantic_boundary: Purchased spun/drawn PP filament yarn to accepted dry
    three-strand PP rope. Existing man-made cabled-yarn method ends at
    industrial yarn; existing netting method expressly excludes unconverted rope
    and treats rope manufacture as upstream. Neither supplies this rope
    reference/output or three-strand laying responsibility. Legacy 27310 remains
    empty; current batch jobs contain no competing rope author.
