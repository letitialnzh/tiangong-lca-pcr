allocation_rules:
  - rule_id: allocation_direct
    applies_to: "different rope products and shared machinery"
    rule: "Use cp_energy stage meters and orders for direct attribution, avoiding allocation first. Do not allocate by length unconditionally across different linear mass, twist and machine settings. Remaining shared use requires contemporaneously measured running time/load relationship. Mass allocation needs evidence of equivalent process settings and consumption relationship, with sensitivity disclosed."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rework and offcuts"
    rule: "Keep actual extra electricity for internal rework/strand transfers; cancel internal material loops in the combined system and avoid duplicate upstream burdens. Weigh exported waste separately from accepted rope; intended recycling gives no automatic substitution credit. Saleable co-products require boundary, allocation basis and reproducible quantities."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "inspection_packing"
      flow_role: "reference output"
      record_type: "weighing"
      raw_fields: "lot; net mass; packaging tare; length; diameter; lay length; acceptance result"
      collection_method: "Calibrated-scale weighing of the same accepted lot, subtract packaging/spool tare; calibrate length counter and sample same-configuration linear mass, retain weighing and release originals"
      unit: "kg; m"
      frequency: "each batch"
      temporal_coverage: "complete representative consecutive period, actual dates and exceptional batches"
      site_scope: "selected site and same rope configuration"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/length calibration; batch release and sampling records"
    - protocol_id: cp_material
      process_id: "strand_preparation"
      flow_role: "incoming yarn"
      record_type: "mass balance"
      raw_fields: "receipts; returns; opening/closing stock; net consumption; yarn composition/state"
      collection_method: "Calibrated weighing plus lot issue/return ledger, verify supplier processing state and composition"
      unit: "kg"
      frequency: "each batch and period reconciliation"
      temporal_coverage: "same period as cp_output"
      site_scope: "yarn preparation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier lots; weights; stock ledger"
    - protocol_id: cp_transfer
      process_id: "all"
      flow_role: "internal intermediate"
      record_type: "weighing"
      raw_fields: "transfer lot; strand/rope net mass; opening/closing stock; rework amount"
      collection_method: "Match calibrated weights at stage exit/entry for the same lot; rope length cannot substitute strand mass"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "same period as cp_output"
      site_scope: "strand to laying to inspection"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired lot IDs, stock and rework records"
    - protocol_id: cp_energy
      process_id: "all"
      flow_role: "electricity"
      record_type: "meter reading"
      raw_fields: "stage meter readings; voltage; region; running/idle time; order; shared-use basis"
      collection_method: "Submeter or measured power and run time including attributable idle/auxiliary load; reconcile main meter, never use nameplate rated power as actual power"
      unit: "kWh; MJ"
      frequency: "each shift/batch"
      temporal_coverage: "same period as cp_output"
      site_scope: "three manufacturing stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; voltage/order; allocation record"
    - protocol_id: cp_waste
      process_id: "all"
      flow_role: "PP offcut waste"
      record_type: "weighing"
      raw_fields: "stage; material; contamination; net waste mass; destination; internal rework"
      collection_method: "Weigh segregated PP waste separately by stage, excluding packaging and unidentified waste mixtures"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "same period as cp_output"
      site_scope: "each generating stage"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; segregation/handover records"
    - protocol_id: cp_pack
      process_id: "inspection_packing"
      flow_role: "cardboard input and cardboard waste"
      record_type: "weighing"
      raw_fields: "cardboard grade; recycled share; consumption; waste; dispatched packaging mass"
      collection_method: "Separately weigh actual cardboard input, cut waste and delivered packaging; do not substitute purchase-lot mass for consumption"
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "same period as cp_output"
      site_scope: "rope coil packing"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "packing weights; purchase specifications; dispatch reconciliation"
  calculation_rules:
    - id: normalize_batch
      applies_to: "all inventory rows"
      rule: "Divide each actual exchange amount by accepted net rope mass of the same batch, per 1 kg reference flow; finished output is 1 kg. Incoming yarn mass is not the accepted-output denominator."
      inputs:
        - cp_output
        - cp_material
        - cp_transfer
        - cp_energy
        - cp_waste
        - cp_pack
      output: "exchange quantity per 1 kg reference flow"
      source_ids: []
    - id: convert_electricity
      applies_to: "strand_electricity; laying_electricity; packing_electricity"
      rule: "Multiply metered kWh by 3.6 for MJ, then normalize by the same accepted batch net rope mass."
      inputs:
        - cp_energy
        - cp_output
      output: "MJ/kg"
      source_ids:
        - si-units
    - id: reconcile_mass
      applies_to: "yarn, intermediates and wastes"
      rule: "Within the same period, inputs plus opening stocks equal accepted output plus exported waste plus closing stocks and explained measurement residual; cancel internal transfers, balance packaging separately. Unbalanced mass is not automatically dust or gaseous emission."
      inputs:
        - cp_material
        - cp_transfer
        - cp_output
        - cp_waste
        - cp_pack
      output: "batch mass balance and residual"
      source_ids: []
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "rope and yarn"
      requirement: "Verify actual composition/state, filament form, colour/finish, lay length, diameter, linear mass and test method; different configurations are not service-equivalent."
      evidence: "cp_material; cp_output; deyuan-pp-rope"
    - id: quality_coverage
      applies_to: "all stages"
      requirement: "Cover changeover, setup, rework and rejects; disclose dates, production, measurement coverage, gaps, exclusions, allocation and uncertainty. Never invent energy, losses or recipes."
      evidence: "cp_output; cp_energy; cp_waste"
    - id: quality_identity
      applies_to: "public identities"
