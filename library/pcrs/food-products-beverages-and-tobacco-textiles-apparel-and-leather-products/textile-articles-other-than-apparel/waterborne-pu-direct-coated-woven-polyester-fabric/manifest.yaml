review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review: pending
  scope_review: Narrow direct aqueous unpigmented non-foamed single coating on
    coating-ready woven continuous-filament PET, electric drying and off-site
    wastewater treatment handover only. No whole-leaf coverage or accepted
    mapping.
  unresolved_flow_identities:
    - row_id: ready_woven_pet
      reason: Public mesh,fibre,nonwoven and unspecified standard fabric records do
        not establish coating-ready finished woven continuous-filament PET
        fabric state.
    - row_id: aqueous_pu_dispersion
      reason: Direct-read neat polyurethane and water-based adhesive do not establish
        aqueous aliphatic polyester-PU coating dispersion composition and supply
        state.
    - row_id: pu_dispersion_residue
      reason: Direct-read waste paint does not establish segregated wet aqueous
        polyester-PU dispersion composition.
    - row_id: finished_coated_fabric
      reason: Public waterproof fabric has Area property and unspecified
        composition/route; measured areal mass could support a real conversion
        but cannot establish waterborne PU-on-woven-PET product identity. Keep 1
        kg Mass reference without forcing UUID.
    - row_id: coated_pet_pu_scrap
      reason: Generic waste fibre fabric does not specify composite PET/PU composition
        or segregation state.
    - row_id: pe_wrap_offcuts
      reason: PE product film is not a waste identity; no exact directly verified
        clean PE wrapping-film offcut waste selected.
    - row_id: pu_rinse_wastewater
      reason: Direct-read cleaning wastewater specifies discharged-to-water route,
        incompatible with untreated treatment-handover effluent; preserve the
        specific waste row.
  evidence_limits:
    - Official CPC note gives27997 heading only,not a universal manufacturing
      route.
    - JRC2023 supports process typology and formulation-dependent emission
      assessment; underlying historical examples are not universal/current
      emission factors.
    - Current Covestro product page supports aqueous polyester-PU material
      availability; supplier film-test formulation,solids,temperatures and
      storage periods are not adopted factory defaults or fabric
      performance/lifetime.
    - Actual factory recipe,additives,water,energy,loss,moisture,area-to-mass
      conversion and net production must be collected.
    - Scientific review and reference product identity remain unresolved.
    - PALTEX2020 is a historical independent woven polyester water-based PU
      market example only;not proof of current recipe,electric dryer or
      single-layer profile.
