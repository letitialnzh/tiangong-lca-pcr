  scientific_review:
    status: pending
    limitations:
      - Candidate methodology; no publication, scientific approval or accepted
        mapping.
      - Narrow undipped nylon 6/cotton-weft mechanical route only; does not
        cover all CPC27996.
      - No foreground factory data supplied; no numerical default recipes,
        twist, temperature, loss, yield, energy or durability.
  semantic_boundary_decision:
    decision: new_narrow_semantic_method
    rationale: Material generic filament woven method excludes tyre cord; new batch
      high-tenacity PET greige method has PET construction and no tyre-cord
      cording/spacing endpoint. Rubberized-fabric record explicitly excludes
      tyre cord. Narrow cording and sparse cotton-weft greige method is
      distinct.
  unresolved_flow_identities:
    - row_id: nylon_yarn
      selected_flow: High-tenacity nylon 6 multifilament yarn
      reason: Public Nylon 6 filament identity describes civilian filament, not
        verified industrial high-tenacity tyre-cord grade; other cabled yarn
        expressly excludes high-tenacity yarn.
    - row_id: mineral_oil
      selected_flow: Mineral lubricating oil
      reason: Public lubricating oil candidate specifies synthetic PAO; mineral-oil
        formulation not confirmed.
    - row_id: cord_output
      selected_flow: Untreated plied nylon 6 tyre cord
      reason: No confirmed public untreated high-tenacity nylon 6 tyre-cord identity;
        generic cabled yarn excludes the required grade.
    - row_id: nylon_offcuts
      selected_flow: Nylon 6 yarn offcuts
      reason: Generic man-made fibre waste candidate is a Product flow; apparent waste
        cord has conflicting garment-thread commentary, not verified nylon 6
        scrap.
    - row_id: cord_input
      selected_flow: Untreated plied nylon 6 tyre cord
      reason: Same unresolved untreated nylon 6 cord identity as cord_output.
    - row_id: greige_output
      selected_flow: Uninspected nylon 6 cotton-weft greige tyre cord fabric
      reason: No confirmed public fabric identity for the specified nylon 6/cotton
        construction and undipped state.
    - row_id: cotton_offcuts
      selected_flow: Undyed cotton weft yarn offcuts
      reason: Public cotton waste candidate is a Product flow, not a confirmed
        waste-to-treatment identity for this row.
    - row_id: greige_input
      selected_flow: Uninspected nylon 6 cotton-weft greige tyre cord fabric
      reason: Same unresolved fabric identity as greige_output.
    - row_id: finished_greige
      selected_flow: Nylon 6 cotton-weft greige tyre cord fabric
      reason: Public searches and direct-read candidates did not confirm this polymer,
        sparse-cotton-weft cord construction and undipped endpoint. Rubberized
        textile identity explicitly excludes tyre cord; identity remains
        unresolved, not database absence.
    - row_id: fabric_scrap
      selected_flow: Nylon 6 cotton-weft greige fabric scrap
      reason: Generic waste fabric candidate has unknown multi-fibre composition and
        fast-fashion context; specified greige nylon 6/cotton waste-to-treatment
        not verified.
    - row_id: humidity_drain
      selected_flow: Humidifier purge wastewater
      reason: Direct-read wastewater candidate is specific to washing manganese-slag
        materials, incompatible with humidifier purge; matching untreated purge
        identity unresolved.
