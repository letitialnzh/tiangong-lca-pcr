allocation_rules:
  - rule_id: alloc_subdivision
    applies_to: "shared operations"
    rule: "Use stage submetering and measured machine time/load records to separate products first. A shared-meter share must have factory evidence, total shares sum to one, and sensitivity disclosed; mass allocation is not assumed for unlike twisting/weaving routes."
    source_ids: []
  - rule_id: alloc_scrap
    applies_to: "scrap; rejects; internal returns"
    rule: "Assign actual rejected-product and sampling burdens to accepted production of the campaign. Do not give scrap an avoided-virgin-material credit automatically. If sold scrap becomes a co-product, document status, subdivision and physical/economic allocation basis with measured quantities/prices and governing programme; identify the change of role. Internal return is not a co-product."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "release"
      flow_role: "finished_greige"
      record_type: "weighing"
      raw_fields: "batch; roll; gross and tare; accepted net kg; conditioning; width; mass per area; acceptance; rejected kg"
      collection_method: "Calibrated weighing of conditioned accepted rolls excluding cores/wrap; reconcile acceptance and stock. Area records need actual width/length and measured conditioned mass per area, confirmed against weighing."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "representative full campaign and seasonal conditions"
      site_scope: "same site composition and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; tare; acceptance; conditioning"
    - protocol_id: cp_exchange
      process_id: "cording_weaving_release"
      flow_role: "atomic mass exchanges"
      record_type: "mass balance"
      raw_fields: "batch; row_id; composition; state; issued kg; returns; stock; transfer; scrap; destination"
      collection_method: "Weigh each atomic stream separately; reconcile issues, stock, internal returns, stage transfers and off-site manifests. Record oil grade, inherited finish, textile moisture and packaging separately."
      unit: "kg"
      frequency: "each batch with campaign reconciliation"
      temporal_coverage: "same period as accepted output"
      site_scope: "same production stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing receipts; composition; stock; manifests"
    - protocol_id: cp_energy
      process_id: "cording_weaving_release_humidification"
      flow_role: "electricity"
      record_type: "meter"
      raw_fields: "stage; kWh; meter; voltage; geography; source; shared share; compressor load"
      collection_method: "Submeter stage and allocated auxiliary electricity; match supply voltage/geography. Reconcile transformer/meter boundary and do not duplicate compressor or room conditioning consumption."
      unit: "kWh"
      frequency: "continuous metering linked to batches"
      temporal_coverage: "same full campaign"
      site_scope: "same site meter boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; bills; allocation load logs"
    - protocol_id: cp_releases
      process_id: "weaving"
      flow_role: "residual airborne particles"
      record_type: "monitoring"
      raw_fields: "release point; controls; concentration; air flow; operating duration; size method; compartment"
      collection_method: "Use representative measured residual outlet release and actual operating time; retain measurement integration and capture balance. No unmeasured factor or invented mandatory dust release."
      unit: "kg"
      frequency: "representative monitoring and changed conditions"
      temporal_coverage: "same output period"
      site_scope: "actual release points"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "method; calibration; control conditions; uncertainty"
    - protocol_id: cp_water
      process_id: "humidification"
      flow_role: "tap water; purge; vapour"
      record_type: "water balance"
      raw_fields: "intake mass or volume; measured density; purge kg; evaporation kg; textile moisture change; stock; period"
      collection_method: "Meter tap water and purge separately; volume-to-mass uses measured density at actual state. Determine net vapour by documented balance or measurement including textile retention; retain uncertainty."
      unit: "kg"
      frequency: "each campaign and seasonal changes"
      temporal_coverage: "same output period"
      site_scope: "actual humidification equipment only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "water meter; measured density; purge test; moisture balance"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "Divide each attributable campaign exchange by accepted net textile mass in kg for per 1 kg reference flow. Keep original numerator unit; balance intermediate transfer pairs before site aggregation."
      inputs:
        - cp_output
        - cp_exchange
        - cp_energy
        - cp_releases
        - cp_water
      output: "normalized row quantity"
      source_ids: []
    - id: mass_from_volume
      applies_to: "tap_water; humidity_drain"
      rule: "Convert measured volume to mass using measured liquid density at actual collection state; preserve source volume, density and uncertainty, without a default 1000 kg/m3."
      inputs:
        - cp_water
      output: "measured water mass"
      source_ids: []
  data_quality_requirements:
    - id: dq_product
      applies_to: "reference product"
      requirement: "Prove nylon 6, drawn high-tenacity yarn, ply/twist construction, pure cotton weft, absence of dip/heat-set/rubber, conditioning and buyer acceptance. Do not use marketing durability claims as lifetime."
      evidence: "cp_output; cp_exchange; century-nylon-cord"
    - id: dq_completeness
      applies_to: "all inventory rows"
      requirement: "Reconcile nylon and cotton separately, finish inherited with yarn, internal returns, final cloth, samples, scrap and moisture. Capture actual unlisted auxiliaries as atomic rows and disclose coverage gaps."
      evidence: "cp_exchange; cp_output"
    - id: dq_representative
      applies_to: "all records"
      requirement: "Declare site, technology, full campaign, seasonal humidity, meter calibration and uncertainty. Missing measurements remain missing; do not fill with this PCR as a default recipe."
      evidence: "cp_energy; cp_water; cp_releases"
validation_rules:
  - rule_id: val_scope
    applies_to: "dataset"
    rule: "Reject claimed whole-classification, dipped, PET/rayon/nylon66 or cradle-to-gate completeness on this foreground-only method. Qualifiers and actual included stages are required."
    source_ids:
