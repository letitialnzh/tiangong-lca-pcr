  - rule_id: val_mass
    applies_to: "all inventory rows"
    rule: "Require positive accepted net mass, consistent conditioning and same-period denominator; check nylon/cotton balance and internal transfer cancellation, packaging exclusion and no duplicate upstream yarn burdens."
    source_ids: []
  - rule_id: val_identity
    applies_to: "flow identities"
    rule: "Unresolved UUIDs require explicit row-specific review; no silent generic substitution. Match public flow type, reference property, unit group and environmental subcompartment, including immediate versus long-term releases."
    source_ids: []
  - rule_id: val_quantities
    applies_to: "foreground records"
    rule: "No unsupported temperature, recipe, energy, loss, yield or use-life defaults. Separate captured waste from direct release; distinguish purchased water from resource abstraction and liquid purge from vapour."
