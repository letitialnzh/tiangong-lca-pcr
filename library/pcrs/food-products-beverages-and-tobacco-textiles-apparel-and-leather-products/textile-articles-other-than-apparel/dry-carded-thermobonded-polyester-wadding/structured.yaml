allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "all processes"
    rule: "First subdivide lots and meters. Shared electricity, suction and compressor services use measured stage runtime/load or delivered service demonstrably related to consumption, reconciled to plant totals. If that relation cannot be measured, document another physical basis and sensitivity; do not invent a universal factor. Foreground protocol cp_energy owns the evidence."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "material ledger"
    rule: "Track internal trim return and rework once; do not award an avoided-virgin-fibre credit. Record exported wastes with destination. If saleable downgraded wadding is produced, separately measure its net mass/specification and directly assign separable operations; unresolved joint burdens require a documented physical relation or justified economic alternative with actual price/quantity records and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "prepare"
      flow_role: "pet_staple; binder_fibre"
      record_type: "lot weighing and stock ledger"
      raw_fields: "lot; issued kg; returned kg; opening/closing stock; fibre polymer; virgin status; finish; moisture; length; fineness; crimp; core/sheath ratio"
      collection_method: "Calibrated scale and supplier specification; measure each feed separately and reconcile inventory change."
      unit: "kg"
      frequency: "each lot/meter interval or representative emission test"
      temporal_coverage: "Actual declared reporting period including starts, idle time and rejects"
      site_scope: "Declared connected wadding line and allocated site auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ledger; lot identity; reconciliation; uncertainty and detection limit where applicable"
    - protocol_id: cp_energy
      process_id: "prepare_bond_finish"
      flow_role: "electricity"
      record_type: "submeters and operating logs"
      raw_fields: "stage; meter; start/end kWh; location; voltage; runtime; load; oven heating/fan kWh; compressor allocation; downtime"
      collection_method: "Read calibrated stage meters; attribute shared services with real measured driver and reconcile totals; multiply kWh by 3.6 for MJ."
      unit: "MJ"
      frequency: "each lot/meter interval or representative emission test"
      temporal_coverage: "Actual declared reporting period including starts, idle time and rejects"
      site_scope: "Declared connected wadding line and allocated site auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ledger; lot identity; reconciliation; uncertainty and detection limit where applicable"
    - protocol_id: cp_output
      process_id: "finish"
      flow_role: "finished_wadding"
      record_type: "net weighing and quality release"
      raw_fields: "lot; gross kg; actual core/wrap tare kg; net accepted kg; rejected kg; moisture; GSM; width; length; thickness; pressure; bond integrity; composition"
      collection_method: "Weigh accepted net wadding with calibrated scale and actual packaging tare; retain matched conditioning, lot tests and purchaser acceptance."
      unit: "kg"
      frequency: "each lot/meter interval or representative emission test"
      temporal_coverage: "Actual declared reporting period including starts, idle time and rejects"
      site_scope: "Declared connected wadding line and allocated site auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ledger; lot identity; reconciliation; uncertainty and detection limit where applicable"
    - protocol_id: cp_waste
      process_id: "prepare_finish"
      flow_role: "captured_fibre; wadding_trim"
      record_type: "segregated weighing and destination record"
      raw_fields: "stage; stream; gross kg; tare kg; dry/conditioned basis; composition; contamination; internal return; exported kg; destination"
      collection_method: "Weigh each segregated stream; reconcile internal transfers separately from exported residuals; retain treatment acceptance records."
      unit: "kg"
      frequency: "each lot/meter interval or representative emission test"
      temporal_coverage: "Actual declared reporting period including starts, idle time and rejects"
      site_scope: "Declared connected wadding line and allocated site auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ledger; lot identity; reconciliation; uncertainty and detection limit where applicable"
    - protocol_id: cp_air
      process_id: "prepare"
      flow_role: "particulate_air"
      record_type: "conditional release monitoring"
      raw_fields: "source; controls; concentration; exhaust volume; duration; particle fraction; air subcompartment; detection limit; captured kg"
      collection_method: "Measure released particulate concentration and matched dry/normalised exhaust volume; multiply consistently to obtain kg. Include representative operations and fugitive release assessment. Do not substitute captured dust or set unmeasured release to zero."
      unit: "kg"
      frequency: "each lot/meter interval or representative emission test"
      temporal_coverage: "Actual declared reporting period including starts, idle time and rejects"
      site_scope: "Declared connected wadding line and allocated site auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ledger; lot identity; reconciliation; uncertainty and detection limit where applicable"
    - protocol_id: cp_packaging
      process_id: "finish"
      flow_role: "ldpe_film; paper_core"
      record_type: "component issues, returns and tare"
      raw_fields: "component; composition; count; weighed net kg; unused returns; actual reuse/return; losses; shipped configuration"
      collection_method: "Weigh each actual packaging component separately and reconcile net issue and documented reuse. Count records require measured component mass; no assumed lifetime."
      unit: "kg"
      frequency: "each lot/meter interval or representative emission test"
      temporal_coverage: "Actual declared reporting period including starts, idle time and rejects"
      site_scope: "Declared connected wadding line and allocated site auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; source ledger; lot identity; reconciliation; uncertainty and detection limit where applicable"
  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "Divide each matched-period attributable net exchange by accepted net wadding kg from cp_output, preserving the numerator unit. The finished output is 1 kg."
      inputs:
        - "net exchange"
        - "accepted net kg"
        - cp_output
      output: "exchange unit per 1 kg reference flow"
      source_ids: []
    - id: calc_balance
      applies_to: "material ledger"
      rule: "Compare external fibre/binder input plus stock decrease with accepted product, each exported residual, actual emissions and stock increase on a consistent moisture basis; report and investigate residual, not an assumed loss factor. Internal transfers cancel."
      inputs:
        - cp_material
        - cp_output
        - cp_waste
        - cp_air
        - stock
      output: "mass balance and residual"
      source_ids: []
    - id: calc_electricity
      applies_to: "prepare_electricity; bond_electricity; finish_electricity"
      rule: "Convert measured attributable kWh to MJ by multiplication by 3.6 before normalization; reconcile stages and avoid counting common suction twice."
      inputs:
        - cp_energy
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: calc_air_release
      applies_to: "particulate_air"
      rule: "Obtain released kg from consistent measured concentration and exhaust volume for the matched period, accounting for operating duration; disclose extrapolation and detection limits. Then normalize with cp_output."
      inputs:
        - cp_air
        - cp_output
      output: "kg per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all rows"
      requirement: "Verify polymer, physical state, supplied finish, mass basis and exact selected flow conditions; preserve official localized names. Blank UUID is an identity gap, never a missing exchange."
      evidence: "Supplier certificates and flow identity documents"
    - id: quality_representative
      applies_to: "all processes"
      requirement: "Use actual period, product specification, line, oven type and yields; report coverage of all runs, rejects and downtime and uncertainty. No default recipe, temperature, energy, waste factor or health approval."
      evidence: "Production ledger; calibration; actual operating logs"
    - id: quality_completeness
      applies_to: "site boundary"
      requirement: "Screen every real auxiliary, packaging component and release; add specific rows if applicable. Disclose omissions and LCIA coverage, especially unspecified particulate; no missing-data zero."
      evidence: "Site survey and balance/coverage checklist"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Require documented wadding rather than felt/nonwoven/medical/converted article identity, declared virgin and binder composition, electric heat route and every reference qualifier. Reject application to unreviewed routes."
    source_ids:
      - un-cpc3-notes-2025
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require matched denominator, measured net mass, linked collection protocols, actual tare, energy-property preservation and explicit conversions; check all stage totals and balance residual. Missing measurements are inconclusive."
    source_ids: []
