review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review:
    status: pending
    limitations:
      - Candidate authored methodology; no scientific approval, publication or accepted mapping.
      - Narrow virgin PET and PET-core/copolyester-sheath binder, dry-carded electric hot-air route only; no full CPC coverage.
      - No measured factory recipe, temperature, yield, energy, lifetime or emission default supplied.
  semantic_boundary_decision:
    decision: new_narrow_semantic_method
    rationale: Existing 27991 directory is empty_scaffold; nonwovens explicitly excludes wadding and felt addresses felting. Read-only integration library and current batch candidates contain no same wadding product route. Purchased staple preparation and yarn methods end at different products.
  unresolved_flow_identities:
    - row_id: binder_fibre
      selected_flow: PET-core copolyester-sheath low-melt bicomponent staple fibre
      reason: "No reviewed public read establishes PET-core/copolyester-sheath low-melt bicomponent staple. Generic virgin polyester staple cannot establish the binder architecture."
    - row_id: captured_fibre
      selected_flow: Captured PET and copolyester fibre dust
      reason: "No read establishes captured loose PET/copolyester dust waste with actual contamination; airborne particulate and fabric wastes are not equivalent."
    - row_id: finished_wadding
      selected_flow: Thermobonded polyester wadding
      reason: "Bounded specific and exact-title searches and public reads do not establish thermobonded polyester wadding; generic nonwoven, cotton blend and medical wadding identities are not substitutes."
    - row_id: wadding_trim
      selected_flow: PET and copolyester wadding edge trim
      reason: "Generic fabric wastes do not establish bonded PET/copolyester cushioning-wadding trim and treatment state."
