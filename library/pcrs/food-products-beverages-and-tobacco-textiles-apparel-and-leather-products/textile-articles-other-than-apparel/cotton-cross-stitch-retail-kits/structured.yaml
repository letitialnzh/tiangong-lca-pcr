      collection_method: "Measure lengths and weigh conditioned floss by colour; separately weigh finished organizer cards and returned stock"
      unit: "kg"
      frequency: "Each lot or metering/monitoring interval"
      temporal_coverage: "Declared representative reporting period including normal operation, changeovers and rejects; disclose seasonality"
      site_scope: "Declared kitting site and single SKU; all in-scope stages"
