  calculation_rules:
    - id: batch_normalization
      applies_to: "all inventory rows"
      rule: "Divide each attributable exchange total in its declared unit by Q kg accepted net contents; report per 1 kg reference flow. The reference output is 1 kg. Exclude incomplete kits from Q and retain their consumed materials as losses."
      inputs:
        - "batch exchange totals"
        - Q
        - cp_output
      output: "normalized exchange quantities"
      source_ids: []
    - id: meter_energy
      applies_to: "cutting_electricity; sorting_electricity; packing_electricity"
      rule: "Convert attributable measured electricity kWh to MJ by multiplying by 3.6 before batch normalization; use the verified Units of energy conversion."
      inputs:
        - "kWh meter records"
        - "attribution records"
      output: "MJ"
      source_ids: []
    - id: sample_mass_conversion
      applies_to: "received_aida; cotton_floss; thread_card; tapestry_needle; printed_chart; retail_carton"
      rule: "When collected by area, length or count, multiply the recorded area, length or count by corresponding measured net mass per area, length or item of that same lot. Weighing remains primary; document sample spread and uncertainty."
      inputs:
        - "area/length/count"
        - "traceable measured mass ratios"
      output: "kg"
      source_ids: []
    - id: air_mass
      applies_to: "airborne_particulates"
      rule: "Multiply measured released particulate concentration by compatible actual exhaust volume over the covered interval, converting to kg. Do not convert workplace concentration to emission mass without a release-volume model and evidence."
      inputs:
        - cp_air
      output: "released particulate kg"
      source_ids: []
  data_quality_requirements:
    - id: dq_configuration
      applies_to: "accepted kit"
      requirement: "Maintain design-specific BOM, colour lengths and complete component checklist; no quantity, cotton purity, finish, needle alloy or life claim without records. Separate different configurations."
      evidence: "SKU BOM, supplier specification and acceptance records"
    - id: dq_balance
      applies_to: "all components and utilities"
      requirement: "Reconcile issued stock, accepted kit content, returned stock, internal transfer, rejects and waste by component; investigate gaps including dust and defective cards/needles/charts. Set reconciliation tolerance from measurement uncertainty, not a guessed percentage."
      evidence: "Lot ledger, calibration and residual investigation"
    - id: dq_representativeness
      applies_to: "reporting period and upstream links"
      requirement: "Record actual site/time, supplier route and voltage; assess both production and standby/changeover coverage. Unknown data remain missing with uncertainty and replacement plans, never zero by default."
      evidence: "Period log and dataset selection record"
    - id: dq_identity
      applies_to: "every exchange"
      requirement: "Match material, production state, compartment and actual reference property before using a UUID; resolve site-specific chemical or waste identities separately. Database quantities are not factory evidence."
      evidence: "Supplier specification, measurement records and verified flow identity"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_product_output"
    rule: "Check Q > 0, net-content tare/conditioning and complete accepted-kit configuration; reference output must be exactly 1 kg and use the same name as the reference flow. No extrapolation to completed decoration or all CPC 27140."
    source_ids:
      - unsd-cpc3-2025
      - caterpillar-kit-components
  - rule_id: validate_completeness
    applies_to: "foreground inventory"
    rule: "Check each actual material, electricity share, loss and ambient release against ledgers. Conditional absence requires evidence. Quantify and add missing chart/card/needle rejects, cleaning, captured dust or packaging components as separate exchanges before claiming complete coverage. Do not sum cotton solid waste and airborne particulate twice."
    source_ids: []
  - rule_id: validate_identity_basis
    applies_to: "all UUID-bearing rows"
    rule: "Verify actual CN <1 kV electricity scope and retain Net calorific value/MJ; check waste versus product and air versus captured dust. Known particulate size/subcompartment needs a specific identity. Review every empty UUID explicitly; none implies acceptable publication."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "shared activity attribution"
    rule: "Reconcile allocation shares to measured totals and ensure no component transfers or electricity meters are counted twice. Justify co-product status and sensitivity of alternatives."
    source_ids:
      - ghg-product-2011
published_dataset_profile:
  dataset_role: "Foreground factory dry component-to-kit production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Configured cotton kit supply after applicability, scientific and data-quality review; link each upstream component separately"
  excluded_use: "Full CPC 27140 coverage; finished embroidery/furnishing production; consumer use; comparison of designs by mass alone; complete cradle-to-gate assertions with missing upstream data"
  required_metadata: "SKU/BOM/revision; all section-3 qualifiers; site/period; manual or powered steps; supplier starting states; Q and accepted count; normalization and allocation; upstream links; waste routes"
  required_quality_disclosure: "Meter/sample uncertainty; missing exchanges and identities; conditional flow evidence; upstream completeness; scientific review status and method limits"
  update_trigger: "Change in design/BOM, cotton source/finish, supplier state, hoop or accessory configuration, packaging, voltage, processing route or measured loss profile"
