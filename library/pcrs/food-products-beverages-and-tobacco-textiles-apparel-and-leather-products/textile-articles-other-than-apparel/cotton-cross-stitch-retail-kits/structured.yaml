    required_unit: "kg"
    rule: "Retain actual counted items, fabric area and thread length as raw records; use measured supplier-lot-specific mass per item, area or length to obtain exchange kg. Never relabel an Area or Number-of-items public property as Mass; no nominal density or piece weight is supplied."
