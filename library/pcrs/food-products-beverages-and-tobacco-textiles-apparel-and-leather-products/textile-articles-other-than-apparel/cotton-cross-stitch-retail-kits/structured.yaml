allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared cutting, sorting and packing"
    rule: "First separate SKU lots, metered operations and component issue records. A kit has one combined product output; do not allocate its burden among the components delivered together."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_shared_energy
    applies_to: "unavoidable shared utilities"
    rule: "Use a documented causal physical relationship such as measured machine operating time with observed power, before a justified alternative. Do not assume every SKU has identical mass or energy intensity. Disclose driver, denominator, uncertainty and conservation to meter total."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_scrap
    applies_to: "offcuts and rejected components"
    rule: "Usable stock returned internally is not a co-product. Classify discarded cotton and packaging by actual recipient and route. If sold as a secondary product, disclose that status and apply a justified subdivision/physical allocation or evidenced alternative consistently; never apply an automatic avoided-production credit."
    source_ids:
      - ghg-product-2011
