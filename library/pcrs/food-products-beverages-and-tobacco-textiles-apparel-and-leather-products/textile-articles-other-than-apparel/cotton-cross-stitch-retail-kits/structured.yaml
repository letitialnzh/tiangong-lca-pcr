        - dmc-kit-components
    - rule_id: boundary_upstream
      applies_to: "component sourcing"
      rule: "Carry upstream component production separately. A supplier specification is not proof of a complete cradle-to-gate model; disclose all missing upstream links."
      source_ids:
        - unsd-cpc3-2025
    - rule_id: boundary_auxiliary
      applies_to: "site operation and wastes"
      rule: "Inspect equipment, cleaning and ventilation logs. No process water, fuel, heat or wastewater is assumed for dry kitting. If used, add each specific atomic exchange with collected quantity and identity review. Captured dust, damaged needles, rejected charts or organizer cards, incoming packing waste and any other actual loss require separate rows; missing material flows block completeness."
