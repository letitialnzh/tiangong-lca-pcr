system_boundary:
  rules:
    - rule_id: boundary_dry_route
      applies_to: "all foreground operations"
      rule: "Include receipt checks, cutting, length measuring, sorting, matching, inspection, attributable utilities, retail packaging and generated waste at the site. Dyeing, wet washing, chemical finish, printed-substrate manufacture or consumer stitching require a different disclosed route; do not conceal them upstream if performed on site."
