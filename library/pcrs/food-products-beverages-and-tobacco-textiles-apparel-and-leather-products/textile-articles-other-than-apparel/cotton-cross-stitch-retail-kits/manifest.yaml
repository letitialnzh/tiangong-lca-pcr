review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review:
    status: pending
    limitations: Candidate restricted to dry kitting of finished pure-cotton
      cross-stitch components without hoop; not approved or published; no
      factory data supplied.
  unresolved_flow_identities:
    - row_id: received_aida
      reason: Direct reads of Cotton Fabric are water-treatment-qualified or
        classified as raw cotton; wet-processed embroidery substrate is CN
        generic material, not a verified finished pure-cotton Aida retail
        substrate. Construction and finishing not established.
    - row_id: cotton_floss
      reason: Dyed Cotton Yarns direct read is yarn dyed before weaving, not finished
        stranded embroidery floss; broader cotton yarn identities do not
        establish the supplied finish and construction.
    - row_id: thread_card
      reason: Printed card sheets are pre-die-cut sheets, while Cardboard candidate is
        optical-assembly material; neither is the finished punched organizer
        card.
    - row_id: cotton_fabric_offcuts
      reason: Public fabric scrap/cotton waste candidates directly read are Product
        flows, not the selected disposal waste exchange; keep waste role and
        actual route.
    - row_id: cotton_thread_trimmings
      reason: Cotton waste direct read is Product flow and unspecified treatment; it
        does not establish this segregated discarded dyed embroidery floss
        exchange.
    - row_id: tapestry_needle
      reason: Direct-read category is an aggregate of needles, clasps, rivets and
        decorations; not the selected finished tapestry needle with its
        alloy/plating.
    - row_id: printed_chart
      reason: Direct-read paper insert explicitly concerns toy packaging; no
        cross-stitch design chart identity with matching state confirmed.
    - row_id: reference_product_output
      reason: Bounded retail-kit, furnishing-title and CPC searches did not establish
        a complete unstitched cotton cross-stitch kit identity. Finished
        embroidery and fabric cannot represent a complete kit. No claim of
        database absence.
  unresolved:
    - Independent scientific review and site-specific collection remain
      required. Resolve eight inventory identities before publication; adopted
      electricity and particulate identities are conditional. Retail carton
      example is an admissible configuration, not a universal packaging
      requirement.
  semantic_decision:
    decision: new_narrow_methodology
    reason: Unstitched fabric/floss retail kit assembly differs from finished
      embroidery, cut-and-sew household linen and curtains; current scope does
      not cover other 27140 furnishing routes.
