review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review: pending
  scope_review: Dry sewn-edge knitted PET cleaning cloth subset only; no whole-leaf coverage or accepted mapping asserted.
  unresolved_flow_identities:
    - row_id: finished_fabric
      reason: "Public candidates are mesh, cotton blend, nonwoven fabric or fibre, not the finished knitted PET microfibre input state."
    - row_id: pet_cutting_offcuts
      reason: "Public textile solid waste candidate does not specify PET-only composition; retain the segregated physical offcut stream."
    - row_id: pet_collected_dust
      reason: "No directly verified PET filter-dust waste identity; elementary airborne particulate and mixed textile waste are different exchanges."
    - row_id: pet_sewing_thread
      reason: "Public yarn candidate explicitly excludes sewing thread; fibre and yarn cannot establish sewing-thread identity."
    - row_id: mineral_lubricating_oil
      reason: "Direct-read lubricating oil candidate specifies fully synthetic PAO, incompatible with the mineral-oil row; actual mineral grade requires a verified compatible identity."
    - row_id: corrugated_box
      reason: "Directly read corrugated-box identity fixes 16.6% primary and 83.4% recycled fibre; this PCR requires actual supplier composition and cannot impose that ratio."
    - row_id: finished_cloth
      reason: "No exact finished sewn-edge PET microfibre cleaning-cloth product identity verified from bounded English and Chinese candidates; no raw fabric substitution."
    - row_id: rejected_cloth
      reason: "No exact rejected sewn PET cleaning-cloth waste identity directly verified; not generic mixed textile waste."
    - row_id: pe_film_waste
      reason: "Need clean unlaminated PE packaging-film offcut waste identity, not mixed plastic or a product film."
  evidence_limits:
    - Manufacturer catalogue establishes a market example, not manufacturing recipe, current universal composition, performance approval or lifetime.
    - Historical EPA source is used only for process typology; no current regulatory threshold or numeric consumption or emissions adopted.
    - Foreground recipes, energy, losses, moisture, packaging and accepted net production require actual factory measurements.
    - Scientific and applicability review remains pending; product flow identity is unresolved.
