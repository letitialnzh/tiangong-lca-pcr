  calculation_rules:
    - id: normalize_batch
      applies_to: "all inventory rows"
      rule: "Divide attributable batch exchange by accepted net finished-cloth mass in kg; retain each exchange numerator unit. The final product row is 1 kg."
      inputs:
        - "attributable batch exchange"
        - "accepted net mass"
        - cp_output
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: convert_electricity
      applies_to: "cut_electricity; sew_electricity; pack_electricity"
      rule: "Convert measured kWh to MJ with 3.6 MJ/kWh before batch normalization; preserve the declared public energy property and unit group."
      inputs:
        - "metered kWh"
        - "unit conversion"
        - "electricity protocol"
        - cp_output
      output: "MJ per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "fabric, thread and cloth"
      requirement: "Verify PET composition, knit and finishing state, fibre fineness and sewn-edge route. Separate virgin and recycled profiles; do not infer current formulation from a catalogue edition."
      evidence: "supplier certificate, product specification and route map"
    - id: dq_mass_balance
      applies_to: "all solid textile rows"
      requirement: "Reconcile issued fabric and thread with accepted cloth, offcuts, collected dust, rejects, rework and stock change on the same moisture basis; investigate unexplained loss instead of treating it as emitted dust."
      evidence: "measured batch balance and uncertainty"
    - id: dq_period
      applies_to: "all rows"
      requirement: "Use one declared period covering representative production, idle/rework and maintenance; disclose site/date, calibration, missing data and allocation fraction. No default throughput, temperature, energy or loss value."
      evidence: "dated records, meter and scale calibration"
    - id: dq_release
      applies_to: "airborne_particulates"
      requirement: "No observed release is not proof of zero; document controls, test coverage and detection limits. Unknown emissions remain an explicit completeness gap. Preserve actual size and environmental medium; avoid double counting captured dust."
      evidence: "emission test, capture evidence and uncertainty"
    - id: dq_upstream
      applies_to: "fabric and packaging"
      requirement: "Match supplier material, geography, processing state and recycled content; disclose all unlinked upstream stages and actual transport coverage."
      evidence: "upstream dataset references and supplier records"
validation_rules:
  - rule_id: validate_scope
    applies_to: "product and route"
    rule: "Require declared qualifiers and the dry knitted PET sewn-edge route; reject flotation, nonwoven, impregnated, blended-fibre or on-site wet-processing claims under this profile."
    source_ids:
      - unsd-cpc3-notes-2025
  - rule_id: validate_reference
    applies_to: "all rows"
    rule: "Require positive measured accepted net cloth mass excluding packaging, the finished_cloth link and common per-1-kg denominator; area/count inputs need traceable measured mass conversion."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "receipt_cut; edge_sew; inspect_pack"
    rule: "Require material and energy reconciliation including internal transfers and rework, not duplicated accepted output. Distinguish PET waste, collected dust and actual environmental release."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "UUID-bearing rows"
    rule: "Check public flow type, actual material, electricity geography/voltage, reference property and unit group. Blank UUIDs must remain disclosed; no search rank or fibre flow can establish product identity."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "final dataset"
    rule: "Record each actual chemical, packaging component, utility, waste and release as one specific exchange; document conditional absence with evidence. Missing measurement or uncertain release cannot be represented as complete validation."
    source_ids: []
published_dataset_profile:
  dataset_role: "Manufacturing foreground inventory for dry sewn-edge knitted PET microfibre cleaning cloths"
  downstream_use: "secondary_dataset; background_dataset only after review of represented product, technology and supply chain"
  allowed_use: "Declared PET cleaning-cloth route and product configuration, combined with compatible upstream fabric/thread/packaging and disclosed transport"
  excluded_use: "Entire broad classification; flotation safety claims; cleaning-service equivalence; lifespan or wash-cycle claims; automatically complete cradle-to-gate or cradle-to-grave footprint"
  required_metadata: "qualifiers; factory and period; supplier processing state; PET/recycled profiles; accepted net output and moisture basis; stage utilities; packaging; upstream and transport links; conditional presence; unresolved identities"
  required_quality_disclosure: "measurement and allocation coverage; material balance; missing/estimated exchanges; dust capture and release uncertainty; offcut/reject fate; excluded wet routes and use stage"
  update_trigger: "Changes to fibre composition, knit, edge process, supplier finishing, recycled profile, site electricity, package, recovery route, new verified identity or measured operating evidence"
