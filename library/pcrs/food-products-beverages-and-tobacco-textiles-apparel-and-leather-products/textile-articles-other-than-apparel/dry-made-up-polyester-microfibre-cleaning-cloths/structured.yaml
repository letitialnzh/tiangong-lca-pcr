allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared production"
    rule: "First separate batches and meter subprocesses. If unavoidable, use measured load and logged runtime for electricity, and traced material issues for materials; document causal coverage and sensitivity rather than assume equal mass intensity across cloth sizes or seams."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: allocation_coproduct
    applies_to: "downgraded cloth or saleable offcuts"
    rule: "Decide waste versus co-product from actual quality, recipient and market records. If allocation cannot be avoided, justify a physical relation; only if unavailable justify another relation such as economic value at separation with sensitivity. No default price or burden-free credit."
    source_ids:
      - ghg-product-allocation-2011
  - rule_id: allocation_rework
    applies_to: "internal reuse and rework"
    rule: "Retain rework utilities and thread in the same batch; count each accepted cloth once. Record exported scrap treatment separately and do not subtract a speculative displaced-fabric credit."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "The cited standard is used for general attribution reasoning; it does not make this cloth dataset a certified GHG inventory or prescribe an LCIA method. Foreground measured drivers remain necessary."
    source_ids: []
