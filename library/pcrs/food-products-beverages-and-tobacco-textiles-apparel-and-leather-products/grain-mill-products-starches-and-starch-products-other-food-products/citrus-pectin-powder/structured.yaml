allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Shared equipment and utilities"
    rule: "Use product-campaign submetering and separately observed operations first. cp_utilities records measured causal drivers and reconciles the allocated shares to the site total. Do not allocate steam, electricity or cleaning from assumed market averages."
    source_ids: []
  - rule_id: allocation_spent_peel
    applies_to: "Spent citrus peel"
    rule: "Classify each physical spent-peel shipment once as waste or documented usable feed co-product using cp_residue. For co-production collect all product quantities, dry matter, metered separable operations and the evidence for the remaining physical relationship. A remaining shared burden without a verified relationship requires methodological review; no automatic wet-mass allocation or avoided-feed credit is provided."
    source_ids:
      - vincent-citrus-2015
  - rule_id: allocation_internal_recycle
    applies_to: "Solvent, water and pectin rework"
    rule: "Account internal recycling by mass balance, not negative purchases or external co-products. Include recovery utilities and purge treatment; only actual exported recovered solvent is a potential co-product and requires a separate verified row, identity, quantity and allocation assessment."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "dry_blend_pack"
      flow_role: "reference product"
      record_type: "weighing"
      raw_fields: "batch_id; net accepted powder mass B; gross/tare; moisture; sucrose fraction; esterification; lot test results"
      collection_method: "Calibrated net weighing and lot release records excluding packaging, rejects and duplicate rework; retain actual gel/viscosity method"
      unit: "kg Calculation: Sum accepted B; express output as 1 kg reference flow."
      frequency: "Each batch"
      temporal_coverage: "One complete reporting campaign with all accepted lots"
      site_scope: "Declared powder line at one site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; release certificate; batch and stock reconciliation"
    - protocol_id: cp_material
      process_id: "all"
      flow_role: "atomic incoming material"
      record_type: "weighing_and_metering"
      raw_fields: "row_id; lot; gross/tare; meter totals; stock start/end; moisture; solution concentration; supplier assay; density if volume used"
      collection_method: "Separate material issue records, calibrated scales and water meters; convert volume only with measured temperature-specific density; retain atomically separate packaging components"
      unit: "kg Calculation: Attributable net external consumption / B; per 1 kg reference flow."
      frequency: "Every batch and campaign reconciliation"
      temporal_coverage: "Same reporting campaign as B"
      site_scope: "Actual process inlet, including production cleaning"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Invoices; assays; receipts/issues; stock balance; calibration"
    - protocol_id: cp_intermediate
      process_id: "extract_clarify_concentrate_precipitate_dry_blend_pack"
      flow_role: "paired pectin intermediate"
      record_type: "weighing"
      raw_fields: "transfer_id; source/destination; wet mass; water fraction; ethanol fraction; dissolved solids"
      collection_method: "Calibrated tank/transfer weighing and paired batch samples; link the same intermediate on both sides"
      unit: "kg Calculation: Matched transfer mass / B; per 1 kg reference flow; cancel internal transfers in aggregated foreground."
      frequency: "Every transfer"
      temporal_coverage: "Same campaign as B, include work-in-progress stock changes"
      site_scope: "Internal process interfaces only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Transfer pairing; concentration assays; stock reconciliation"
    - protocol_id: cp_utilities
      process_id: "all"
      flow_role: "electricity and steam heat separately"
      record_type: "metering"
      raw_fields: "process_id; meter start/end; kWh; voltage; grid location; MJ heat; steam mass; supply/return pressure and enthalpy; causal allocation driver"
      collection_method: "Submeter equipment including evaporation, solvent recovery and cleaning; use heat meter or measured steam/enthalpy; reconcile site totals"
      unit: "MJ Calculation: Attributable MJ / B; per 1 kg reference flow."
      frequency: "Continuous meters reconciled by campaign"
      temporal_coverage: "Same complete campaign as B including startup/shutdown"
      site_scope: "User-side electricity and delivered steam heat only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; grid/steam delivery records; documented drivers"
    - protocol_id: cp_solvent
      process_id: "concentrate_precipitate_dry_blend_pack"
      flow_role: "ethanol makeup and recovery balance"
      record_type: "mass_balance"
      raw_fields: "fresh makeup mass; ethanol assay; gross circulation; recovered liquor mass/assay; opening/closing stocks; purges; cake retention; measured releases"
      collection_method: "Weigh transfers and tank stocks, assay each solution, and retain solvent recovery operating records. Monitor cooling water/heat and electricity in cp_utilities"
      unit: "kg Calculation: Fresh delivered makeup / B; per 1 kg reference flow; internal circulation excluded from external consumption."
      frequency: "Every batch; campaign balance"
      temporal_coverage: "Same campaign as B"
      site_scope: "Entire solvent circuit and dryer retention"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Tank calibration; ethanol assays; recovery and purge records"
    - protocol_id: cp_residue
      process_id: "extract_clarify_dry_blend_pack"
      flow_role: "spent peel and discarded pectin separately"
      record_type: "weighing"
      raw_fields: "row_id; shipment; wet mass; dry matter; discard or feed status; recipient; separable-operation meters; all co-product amounts"
      collection_method: "Weigh each physical residue shipment and verify waste treatment or feed acceptance; reconcile rejected powder and rework"
      unit: "kg Calculation: Each mutually exclusive outlet mass / B; per 1 kg reference flow."
      frequency: "Each shipment/batch"
      temporal_coverage: "Same campaign as B"
      site_scope: "Process residue outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Manifests; recipient acceptance; moisture assay; allocation evidence"
    - protocol_id: cp_effluent
      process_id: "concentrate_precipitate_sanitation"
      flow_role: "process and cleaning effluent separately"
      record_type: "metering_and_sampling"
      raw_fields: "outlet; liquid mass; volume; density/temperature; ethanol concentration; pH; sampled composition; receiving treatment"
      collection_method: "Separate effluent metering and representative sampling; use measured density for volume-to-mass conversion; distinguish external transfer from internal condensate reuse"
      unit: "kg Calculation: Transferred liquid mass / B; per 1 kg reference flow."
      frequency: "Each discharge with campaign reconciliation"
      temporal_coverage: "Same campaign as B including cleaning"
      site_scope: "External wastewater treatment handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meters; density; analysis; treatment receipt"
    - protocol_id: cp_emissions
      process_id: "concentrate_precipitate_dry_blend_pack"
      flow_role: "ethanol and water vapour separately"
      record_type: "monitoring_and_balance"
      raw_fields: "species; gas flow; concentration; operating duration; release location; water/ethanol inputs and stocks; collected condensate; product retention; abatement"
      collection_method: "Use chemical-specific monitoring or independently closed species balances; distinguish outdoor air from indoor air and long-term releases. Do not assign unexplained solvent losses to air"
      unit: "kg Calculation: Measured species mass / B; per 1 kg reference flow."
      frequency: "Representative production/startup/shutdown monitoring"
      temporal_coverage: "Same campaign as B; state any monitoring gaps"
      site_scope: "Actual releases crossing site boundary only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sampling QA; uncertainty; mass-balance closure; medium evidence"
  calculation_rules:
    - id: normalize_campaign
      applies_to: "all inventory rows"
      rule: "Divide each attributable campaign exchange by accepted net powder mass B in kg; report per 1 kg reference flow. Reference product output is 1 kg. Pair internal transfers before aggregation."
      inputs:
        - B
        - cp_product
        - cp_material
        - cp_intermediate
        - cp_utilities
        - cp_solvent
        - cp_residue
        - cp_effluent
        - cp_emissions
      output: "Exchange amount per 1 kg reference flow"
      source_ids: []
    - id: energy_conversion
      applies_to: "Electricity rows"
      rule: "Convert kWh to MJ by multiplying by 3.6; retain the verified Net calorific value property and actual supply state."
      inputs:
        - cp_utilities
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: composition_balance
      applies_to: "Peel, pectin cake, product and solvent"
      rule: "For balance checks use distinct measured fractions on the same wet-mass basis: nonvolatile dry solids = wet stream mass × (1 - water fraction - ethanol fraction - other volatile fraction); ethanol mass = wet stream mass × ethanol fraction. Establish absent volatile fractions before using zero and avoid double subtraction when an assay includes volatile loss. Reconcile water, ethanol, nonvolatile solids, internal recovery and stock change separately. Sucrose is part of nonvolatile solids but not pectin solids; retained ethanol is neither. Keep actual wet mass for transfers and delivered product mass for the reference flow."
      inputs:
        - cp_material
        - cp_intermediate
        - cp_solvent
        - cp_product
      output: "Separate water, ethanol and solids balances with disclosed residuals"
      source_ids: []
  data_quality_requirements:
    - id: quality_product
      applies_to: "Accepted powder"
      requirement: "Retain lot-specific pectin identity, esterification, sucrose fraction, moisture and functional test results. Do not extrapolate a supplier declaration into food safety or use authorization. Historical JECFA evidence informs identity only."
      evidence: "cp_product; jecfa-pectins-2007; hf-pectin-2026"
    - id: quality_complete
      applies_to: "Foreground campaign"
      requirement: "Cover all batches, startup/shutdown, cleaning, reject disposition and recycle stock changes. Extend the atomic inventory for actual omitted auxiliaries, filter media or packaging components; do not replace them with collection labels."
      evidence: "cp_material; cp_utilities; cp_residue"
    - id: quality_identity
      applies_to: "All rows"
      requirement: "Use verified public identity, original reference property/unit and actual route/compartment. Unresolved identities and upstream representativeness gaps remain visible; do not silently substitute generic food or wastewater flows."
      evidence: "Supplier assays; medium records; verified flow definitions"
    - id: quality_uncertainty
      applies_to: "Balances and monitoring"
      requirement: "Report meter/assay uncertainty, missing periods, balances and unresolved allocation; assess residuals against measured uncertainty, not invented universal tolerances."
      evidence: "cp_intermediate; cp_solvent; cp_effluent; cp_emissions"
validation_rules:
  - rule_id: validate_reference
    applies_to: "Reference product"
    rule: "Require 1 kg accepted net mixed powder output, the reference_product_output link, all qualifiers and cp_product. Do not validate pure pectin, wet cake or sugar-only output as this product."
    source_ids:
      - jecfa-pectins-2007
  - rule_id: validate_route
    applies_to: "Process inventory"
    rule: "Require evidence for every declared process, matching intermediate transfers and site utilities. Conditional residue/feed, caustic, packaging and elementary rows need measured inclusion or an explicit absence explanation. Missing required records are incomplete, not zero."
    source_ids:
      - ippa-process
  - rule_id: validate_balance
    applies_to: "Solvent, water, solids and allocation"
    rule: "Check nonnegative physical exchanges, positive B, solution assay consistency, matched transfers, mass-balance closure and no duplicate waste/feed or recycle credits. Unresolved residuals, composition, identity or allocation prevent a conclusive dataset claim."
    source_ids: []
  - rule_id: validate_electricity_supply
    applies_to: "Electricity rows and linked providers"
    rule: "Verify country, voltage, consumption/production mix and user-side/generation-side boundary against supply records. UUID 3d76981f-964a-4865-b588-0e067a2a1163 is restricted to matching CN grid-average 1–35 kV user-side consumption mix; other supplies require a newly verified identity and supplier data. Do not use this UUID or its provider as a global default. This identity condition does not restrict the product methodology to CN. Preserve the original Net calorific value reference, verified energy unit chain and 1 kWh = 3.6 MJ conversion."
    source_ids: []
  - rule_id: validate_boundary_claim
    applies_to: "Dataset completeness"
    rule: "A gate-to-gate foreground cannot be called complete cradle-to-gate without verified upstream and external-treatment links. LCA validation does not establish food safety, health claims or regulatory approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Gate-to-gate manufacturing foreground dataset for the declared pectin powder route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Link the matching powder ingredient to downstream food formulation with declared composition and upstream coverage"
  excluded_use: "Whole CPC 23999 coverage; pure-pectin functional equivalence; generic other-food dataset; other pectin routes; safety approval; complete cradle-to-gate without upstream links"
  required_metadata: "Product/lot, composition and moisture, function-test method, extraction and solvent route, site/year, net output B, supplier and treatment links, utility state, recovery arrangement, residue status and allocation basis"
  required_quality_disclosure: "Actual metering/sample coverage, uncertainty, missing identities, upstream/treatment gaps, balance residuals, excluded operations and unresolved allocation"
  update_trigger: "Change in citrus feed preparation, formulation, acid/solvent grade, de-esterification/amidation, energy supply, recovery system, residue destination, packaging or material data coverage"
data_sources:
  - id: "unsd-cpc-2025"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF p.112, 23999. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf (accessed 2026-10-05 UTC)"
    used_for: "Narrow pectic-substance classification context only"
  - id: "jecfa-pectins-2007"
    type: "official_guidance"
