measurement_rules:
  - id: reference_mass
    applies_to: "reference_product_output"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use accepted net powder mass B over the reporting campaign, excluding packaging, rejected lots and duplicate internal rework. Collect B using cp_product. Normalize every exchange to per 1 kg reference flow."
  - id: wet_dry_basis
    applies_to: "Peel, cake, powder and residue"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record each stream as received wet mass with measured water fraction w, ethanol fraction e and any other measured volatile fraction v, all on the same wet-mass basis. Nonvolatile dry solids = wet mass × (1 - w - e - v); use e or v = 0 only when absence is established. Do not count ethanol as dry solids or subtract it twice when an assay already includes volatile loss. Never use dry-solids mass as delivered product mass."
  - id: solution_basis
    applies_to: "Acid, ethanol and caustic"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve actual solution mass and mass-fraction assay c; active substance = solution mass × c is a separate balance quantity, not a silent rewrite of the flow reference property."
  - id: utility_basis
    applies_to: "Electricity and steam heat"
    required_property_ref:
      name: "Energy, retaining the verified property"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve electricity Net calorific value and heat Gross calorific value references. Convert metered kWh with 1 kWh = 3.6 MJ. Steam mass requires measured supply/return enthalpy, not an invented heat-per-kg factor."
