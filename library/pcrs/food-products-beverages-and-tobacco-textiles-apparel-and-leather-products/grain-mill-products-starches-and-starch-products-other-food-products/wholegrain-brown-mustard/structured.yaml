    type: "literature"
    reference: "Charbonneaux-Brabant, A mustard seed rich in character, sections seed/verjuice and Whole Grain mustard (undated manufacturer page). https://www.vinaigre.com/en/expertise/the-mustard"
    used_for: "Independent manufacturer evidence for brown-seed wholegrain identity and no husk sieving; does not establish industry-wide recipe, safety or electricity use"
