      raw_fields: "component specification; tare kg; count; received/issued/rejected/returned stock; fibre/coating/seal composition"
      collection_method: "Weigh representative complete supplied components and reconcile count and stock records; keep each component separate"
      unit: "kg"
      frequency: "each component lot"
      temporal_coverage: "same production period as cp_output"
      site_scope: "filling and pack-out"
