allocation_rules:
  - rule_id: allocate_direct_records
    applies_to: "all processes"
    rule: "Use submeters, order issue/returns and time/lot pairing to separate actual stage loads first. Shared line cleaning, startup/shutdown and site-service assignment requires measured attribution or a transparent recorded physical-causality protocol; no default mass-based energy factor."
    source_ids: []
  - rule_id: allocate_offgrade
    applies_to: "inspect_pack"
    rule: "Do not presume coproduct allocation when there is one accepted product and other outputs are actual wastes. Add a product output for saleable off-grade fabric and attempt subdivision first; remaining allocation must report the measured physical relationship or justified economic records and sensitivity when no physical relationship is established. No unsupported avoided-burden credit."
    source_ids: []
  - rule_id: allocate_internal_transfer
    applies_to: "fixed_fabric_out; fixed_fabric_in; washed_fabric_out; washed_fabric_in"
    rule: "Cancel matched internal exchanges in the aggregate boundary. Q_f is the common denominator for every stage; never add inventories separately normalized to different intermediate wet masses."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_fabric
      process_id: "print_fix"
      flow_role: "prepared_union_fabric"
      record_type: "foreground_record"
      raw_fields: "lot_id; supplier; yarn_family; filament_state; silk_degumming_state; warp_weft; pretreatment; issued_net_kg; returned_net_kg; moisture_wet_fraction; retained_nonfibre_dry_kg; dry_viscose_kg; dry_silk_kg; residual_sericin_dry_kg; sizing_dry_kg; fibre_test_method; test_uncertainty; accepted_final_net_kg"
      collection_method: "Weigh net issued fabric minus returns with a calibrated scale. Confirm supplier yarn route, filament state, degumming and ready-to-print condition against tests. Determine dry component masses independently of incoming moisture and sizing/finish. Divide actual lot consumption by the same lot accepted final net fabric mass Q_f."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier declaration, yarn traceability, component test method and uncertainty; calibrated weights."
    - protocol_id: cp_ink
      process_id: "print_fix"
      flow_role: "reactive_ink_black; reactive_ink_cyan; reactive_ink_magenta; reactive_ink_yellow"
      record_type: "foreground_record"
      raw_fields: "order_id; colour; SKU; SDS; print_equipment; printhead; actual_recipe; drying_temperature; drying_time; fixation_temperature; fixation_time; fixation_medium; actual_pH; compatibility_trial; density; measured_issue_kg; measured_return_kg; opening_closing_stock; water_fraction; dry_solids_fraction; retained_solids; accepted_final_net_kg"
      collection_method: "Record actual equipment, recipe, pH, drying/fixation settings and same-lot compatibility trial, then use formulation-specific stock and weighing records; deduct returned unused ink, not unrecovered purge. For volume records use measured/formulation-specific density at recorded temperature. Divide each individual formulation consumed by Q_f. Reconcile supplied carrier water, retained solids and discarded ink without counting one input twice."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Manufacturer SKU and SDS; stock and balance sheets; measured density if needed."
    - protocol_id: cp_transfer_fixed
      process_id: "print_fix_wash_dry"
      flow_role: "fixed_fabric_out; fixed_fabric_in"
      record_type: "foreground_record"
      raw_fields: "lot_id; transferred_net_kg; moisture_wet_fraction; retained_dry_solids_kg; start_end_stock; transfer_loss_kg; accepted_final_net_kg"
      collection_method: "Weigh the same steam-fixed lot at both transfer points with state and storage loss reconciliation. Divide transfer mass by Q_f; output and input must be identical after explicit inventory-stock/loss adjustments. Cancel the internal exchange in the aggregated manufacturing dataset."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Paired lot transfer tickets and moisture sampling."
    - protocol_id: cp_transfer_washed
      process_id: "wash_dry_inspect_pack"
      flow_role: "washed_fabric_out; washed_fabric_in"
      record_type: "foreground_record"
      raw_fields: "lot_id; transferred_net_kg; moisture_wet_fraction; retained_dry_solids_kg; fibre_losses_kg; transfer_loss_kg; accepted_final_net_kg"
      collection_method: "Pair washed/dried transfer weights and state measurements; divide by Q_f and cancel internal transfers after reconciliation. Do not equate this stage output with accepted final yield before inspection."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Matched transfer tickets, fibre-loss assessment and drying records."
    - protocol_id: cp_wash_water
      process_id: "wash_dry"
      flow_role: "wash_tap_water"
      record_type: "foreground_record"
      raw_fields: "meter_id; volume_m3; density_kg_per_m3; temperature; measured_mass_kg; water_quality; washer_id; wash_recipe; wash_temperature; wash_time; wash_pH; rinse_cycles; dryer_id; drying_temperature; drying_time; recirculation; line_cleaning; accepted_final_net_kg"
      collection_method: "Record actual wash recipe, pH, time, temperature, rinse and drying settings, then measure external supplied water only; convert any volume with documented water density at stated conditions. Keep recirculation separate. Divide supplied mass by Q_f; reconcile evaporation, effluent, retained moisture and inventories, including ink-carrier water."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated meter, density method and water-quality records."
    - protocol_id: cp_print_waste
      process_id: "print_fix"
      flow_role: "unprinted_union_reject; aqueous_ink_purge"
      record_type: "foreground_record"
      raw_fields: "lot_id; stream_id; net_mass_kg; moisture; composition; recipient; waste_or_sale; treatment_route; accepted_final_net_kg"
      collection_method: "Segregate each named stream and weigh its actual shipment net mass; divide each stream by Q_f. Trace recipients and classify actual waste versus saleable product; do not infer ink purge quantity from nominal ink consumption."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighing tickets, recipient and treatment receipts."
    - protocol_id: cp_effluent
      process_id: "wash_dry"
      flow_role: "reactive_wash_effluent"
      record_type: "foreground_record"
      raw_fields: "sampling_point; volume_m3; density_kg_per_m3; temperature; effluent_net_kg; COD; suspended_solids; dissolved_solids; sampling_method; fibre_losses; ink_losses; recipient; treatment_route; accepted_final_net_kg"
      collection_method: "Measure effluent sent to external treatment; volume requires measured density, no assumed factor. Take representative samples for pollutant and solids characterization and trace the treatment destination. Divide liquid effluent mass by Q_f. COD is an analytical oxygen-demand parameter, not an emitted chemical mass. Add individually verified elementary discharges only if the treatment boundary is explicitly extended."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Effluent meter, sampling/laboratory methods, recipient contract."
    - protocol_id: cp_packaging
      process_id: "inspect_pack"
      flow_role: "paperboard_core; ldpe_wrap; corrugated_box"
      record_type: "foreground_record"
      raw_fields: "component_id; polymer_or_board; issue_kg; return_kg; count; measured_piece_net_kg; reuse; accepted_final_net_kg"
      collection_method: "Weigh each packaging component consumed; where count records are used, multiply count by measured component net mass, stating sampling and uncertainty. Divide each physical component mass by Q_f. Do not include packaging in Q_f; document allocation of actual reusable packaging use."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "BOM and measured component weights; issue/return and reuse records."
    - protocol_id: cp_final
      process_id: "inspect_pack"
      flow_role: "finished_printed_union"
      record_type: "foreground_record"
      raw_fields: "lot_id; accepted_roll_ids; calibrated_scale; gross_roll_kg; measured_core_wrap_kg; accepted_final_net_kg; conditioning_protocol; moisture_wet_fraction; retained_nonfibre_dry_kg; dry_viscose_kg; dry_silk_kg; area_m2; length_m; fibre_test_method; retained_solids_test_method; moisture_test_method; uncertainty; acceptance_spec; test_results"
      collection_method: "Measure Q_f as accepted dispatch net fabric mass: gross roll mass minus measured core and wrapping, at recorded conditioning state. Confirm accepted fabric composition, dimensions, integrity and print checks against the declared buyer/manufacturer specification. Measure dry fibre masses and retained non-fibre solids separately. Output is exactly 1 kg per reference flow; no default yield, moisture or areal mass is allowed. State the analytical treatment of residual sericin, sizing and retained reactive-dye solids in dry-component measurements; validate separation and uncertainty rather than assuming complete removal."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated scale, measured tare, conditioning/test protocols, accepted lot register."
    - protocol_id: cp_final_waste
      process_id: "inspect_pack"
      flow_role: "printed_union_reject"
      record_type: "foreground_record"
      raw_fields: "rejected_roll_ids; net_kg; moisture; disposition; offgrade_sale; accepted_final_net_kg"
      collection_method: "Weigh rejected printed fabric net mass at stated moisture and trace disposition; divide actual waste mass by Q_f. Saleable off-grade fabric must be a separate product output and trigger the coproduct decision."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Acceptance/rejection register and destination tickets."
    - protocol_id: cp_printhead_service
      process_id: "print_fix"
      flow_role: "reactive_ink_maintenance_liquid; reactive_ink_cleaning_solution; spent_printhead_cleaning_liquid"
      record_type: "foreground_record"
      raw_fields: "lot_id; SKU; SDS; chemistry; physical_state; issued_net_kg; returned_net_kg; spent_liquid_kg; contamination; recipient; treatment_route; accepted_final_net_kg"
      collection_method: "Use weighing and stock records for each single supplied formulation and separately collected spent liquid. Divide each distinct mass by Q_f. Match service events to the order, include documented startup/shutdown cleaning and avoid duplicate purge/waste counts. No formulation ingredient or emission is assumed without SDS or foreground evidence."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier formulation and SDS; service logs, weights and waste destination."
    - protocol_id: cp_print_fix_energy
      process_id: "print_fix"
      flow_role: "print_fix_electricity"
      record_type: "foreground_record"
      raw_fields: "stage_id; meter_id; kWh_open_close; measured_MJ; voltage; country; supply_mix; shared_service_meter; accepted_final_net_kg"
      collection_method: "Collect this stage electricity consumption at a calibrated submeter; reconcile startup, shutdown and shared services to the order. Preserve raw kWh, convert to MJ using 3.6 MJ/kWh, and divide by Q_f. Document measured shared-load assignment, not a default fabric-mass energy factor."
      unit: "MJ"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, time/order log, declared country and voltage."
    - protocol_id: cp_wash_dry_energy
      process_id: "wash_dry"
      flow_role: "wash_dry_electricity"
      record_type: "foreground_record"
      raw_fields: "stage_id; meter_id; kWh_open_close; measured_MJ; voltage; country; supply_mix; shared_service_meter; accepted_final_net_kg"
      collection_method: "Collect this stage electricity consumption at a calibrated submeter; reconcile startup, shutdown and shared services to the order. Preserve raw kWh, convert to MJ using 3.6 MJ/kWh, and divide by Q_f. Document measured shared-load assignment, not a default fabric-mass energy factor."
      unit: "MJ"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, time/order log, declared country and voltage."
    - protocol_id: cp_inspect_pack_energy
      process_id: "inspect_pack"
      flow_role: "inspect_pack_electricity"
      record_type: "foreground_record"
      raw_fields: "stage_id; meter_id; kWh_open_close; measured_MJ; voltage; country; supply_mix; shared_service_meter; accepted_final_net_kg"
      collection_method: "Collect this stage electricity consumption at a calibrated submeter; reconcile startup, shutdown and shared services to the order. Preserve raw kWh, convert to MJ using 3.6 MJ/kWh, and divide by Q_f. Document measured shared-load assignment, not a default fabric-mass energy factor."
      unit: "MJ"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, time/order log, declared country and voltage."
    - protocol_id: cp_print_fix_steam
      process_id: "print_fix"
      flow_role: "print_fix_steam; print_fix_condensate_return"
      record_type: "foreground_record"
      raw_fields: "stage_id; delivered_steam_kg; pressure; temperature; steam_quality; condensate_return_kg; condensate_temperature; supplier_terms; accepted_final_net_kg"
      collection_method: "Meter each distinct steam supply and external liquid-condensate return. Divide each mass separately by Q_f. If supply billing is heat rather than mass, obtain measured steam mass and documented thermodynamic conditions; do not convert energy to steam mass with an invented factor. Link the actual supplier service without automatic condensate credit."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier meter and terms; pressure/temperature/quality records."
    - protocol_id: cp_print_fix_air
      process_id: "print_fix"
      flow_role: "print_fix_water_vapour"
      record_type: "foreground_record"
      raw_fields: "stage_id; release_point; air_subcompartment; measured_evaporated_water_kg; balance_inputs_outputs; condensed_water; retained_moisture; uncertainty; accepted_final_net_kg"
      collection_method: "Use a documented emission measurement or validated water balance specific to this stage to quantify actual immediate water-vapour release. Account for condensate, retained water, effluent and ink carrier without double counting. Divide air-release mass by Q_f. Unknown releases remain a data gap rather than zero."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Measurement/water-balance method and uncertainty, air-medium classification."
    - protocol_id: cp_wash_dry_steam
      process_id: "wash_dry"
      flow_role: "wash_dry_steam; wash_dry_condensate_return"
      record_type: "foreground_record"
      raw_fields: "stage_id; delivered_steam_kg; pressure; temperature; steam_quality; condensate_return_kg; condensate_temperature; supplier_terms; accepted_final_net_kg"
      collection_method: "Meter each distinct steam supply and external liquid-condensate return. Divide each mass separately by Q_f. If supply billing is heat rather than mass, obtain measured steam mass and documented thermodynamic conditions; do not convert energy to steam mass with an invented factor. Link the actual supplier service without automatic condensate credit."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier meter and terms; pressure/temperature/quality records."
    - protocol_id: cp_wash_dry_air
      process_id: "wash_dry"
      flow_role: "wash_dry_water_vapour"
      record_type: "foreground_record"
      raw_fields: "stage_id; release_point; air_subcompartment; measured_evaporated_water_kg; balance_inputs_outputs; condensed_water; retained_moisture; uncertainty; accepted_final_net_kg"
      collection_method: "Use a documented emission measurement or validated water balance specific to this stage to quantify actual immediate water-vapour release. Account for condensate, retained water, effluent and ink carrier without double counting. Divide air-release mass by Q_f. Unknown releases remain a data gap rather than zero."
      unit: "kg"
      frequency: "each lot; continuous meters assigned to lots"
      temporal_coverage: "declared production period and covered lots"
      site_scope: "same site, orders and accepted final output"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Measurement/water-balance method and uncertainty, air-medium classification."
  calculation_rules:
    - id: calculate_net_output
      applies_to: "finished_printed_union"
      rule: "Q_f = accepted gross roll mass − measured core and wrapping mass; sum only accepted lots of the same reporting period/state, and require positive Q_f."
      inputs:
        - cp_final
      output: "kg accepted net printed fabric"
      source_ids: []
    - id: calculate_normalization
      applies_to: "all inventory rows"
      rule: "x_i = X_i / Q_f; X_i is each exchange quantity after returns, stocks and measured shared-service attribution; Q_f is final accepted net mass for the same covered lots. Every collection protocol implements this relationship."
      inputs:
        - "individual protocol"
        - cp_final
      output: "kg or MJ per 1 kg reference flow"
      source_ids: []
    - id: calculate_dry_components
      applies_to: "prepared_union_fabric; finished_printed_union"
      rule: "D_f = Q_f × (1 − w_f) − R_f; D_f = D_v + D_s; p_v = D_v / (D_v + D_s). w_f is wet-basis moisture fraction and R_f retained dry non-fibre solids. D_v and D_s require traceable component measurements, not subtraction from labels alone. Require viscose principal and p_v < 0.85; independently confirm incoming composition using its own moisture and residues."
      inputs:
        - cp_fabric
        - cp_final
      output: "dry fibre masses/fractions and applicability decision"
      source_ids: []
    - id: calculate_meter_conversion
      applies_to: "all inventory rows"
      rule: "Electricity E_MJ = E_kWh × 3.6; liquid m = V × rho with compatible units and matching conditions; convert area A or length L records with measured net mass/area or net mass/length from the same lot. No guessed density, default areal mass or process-page recipe values."
      inputs:
        - "stage energy protocols"
        - cp_wash_water
        - cp_ink
        - cp_final
        - cp_packaging
      output: "kg or MJ quantity normalized to the common denominator"
      source_ids: []
    - id: calculate_component_balance
      applies_to: "print_fix; wash_dry; inspect_pack"
      rule: "Reconcile viscose dry mass, silk dry mass, water and non-fibre dry solids separately across receipt, returns, net product, wastes, effluent, evaporation and stock changes. Never assume proportional losses of both fibres. Total-mass closure does not replace component closure. Disclose measured uncertainty and unexplained differences, with no invented universal tolerance."
      inputs:
        - "all stage protocols"
      output: "component balances and unexplained differences"
      source_ids: []
  data_quality_requirements:
    - id: quality_applicability
      applies_to: "all processes"
      requirement: "Confirm specific viscose regenerated-cellulose route, both continuous-filament states, silk source and degumming/residual sericin, warp/weft arrangement, exactly two components and dry fractions. Unknown gates mean not applicable; do not infer them from the official 82/18 example."
      evidence: "supplier lot records and composition/incoming tests"
    - id: quality_compatibility
      applies_to: "print_fix; wash_dry"
      requirement: "Confirm same-lot protein/cellulose substrate, supplier pretreatment and actual reactive-ink compatibility through actual plant trials and acceptance. Collect actual temperature, time, pH, formulation and equipment settings; do not generalize webpage or experimental recipes."
      evidence: "plant trial, process logs and buyer/manufacturer specification/results"
    - id: quality_completeness
      applies_to: "all inventory rows"
      requirement: "Match all actual inputs, rework, retained solids, internal losses, wastes and actual releases. Add individual atomic rows for unlisted SKUs, wash auxiliaries, maintenance fluids and site emissions. Mark each conditional row as occurring, evidenced absent or data gap; unknown is not zero."
      evidence: "material audit, SDS, meters and destination receipts"
    - id: quality_representativeness
      applies_to: "all processes"
      requirement: "Record period, all relevant lots, shutdown cleaning, net yield, rework and sampling; do not pool products of differing composition, incoming state, printing route or delivery moisture, and invent no statistical ranges."
      evidence: "lot register, meter coverage, sampling and uncertainty"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "All applicability gates must be confirmed; below-85% man-made filaments is not below-85% total man-made fibres. Staple, unde-gummed raw silk or unknown-family packages fail the scope gate."
    source_ids:
      - un-cpc-3-0-notes-2025
      - wco-hs-2022-chapter-54
  - rule_id: validate_net_basis
    applies_to: "all inventory rows"
    rule: "Reference product name exactly matches final output; every row and protocol uses per 1 kg reference flow. Measured net mass is positive, moisture/retained solids/packaging tare traceable, and internal transfers paired without double counting."
    source_ids: []
  - rule_id: validate_physical_identity
    applies_to: "all inventory rows"
    rule: "Public UUID substance, origin, technological/elementary role, medium, geography, voltage, actual reference property and unit group must match. Blank UUID is an unresolved identity, never a forced name match; a data package must disclose and complete actual linkage verification."
    source_ids: []
  - rule_id: validate_balance_acceptance
    applies_to: "all processes"
    rule: "Complete component, ink-solids and water balances with unexplained differences and measurement uncertainty; supply actual print integrity and acceptance results, not uncollected factory quantities or supplier-page substitutes."
    source_ids: []
published_dataset_profile:
  dataset_role: "Specified-incoming-state reactive printing manufacturing foreground; completed actual packages may serve as secondary_dataset/background_dataset"
  downstream_use: "Compatible printed union fabric inputs to apparel or other textile manufacture"
  allowed_use: "Only products matching composition, filament state, degummed incoming state, pretreatment and reactive-print route"
  excluded_use: "Whole-26730 coverage; substitution for silk-principal or at-least-85% man-made filament fabric; staple routes; complete cradle-to-gate claim without upstream links; health, lifetime or compliance approval"
  required_metadata: "all reference qualifiers, sources, site/period; route, net yield/normalization; component tests; actual formulations; upstream/waste links; conditional rows and identity gaps"
  required_quality_disclosure: "factory-data coverage/gaps, measurement uncertainty, component/water balances, acceptance records, shared-load assignment and unverified identities"
  update_trigger: "changes in fibre family/composition/state, sericin residue, supplier pretreatment, ink, equipment route, electricity, effluent boundary or delivery moisture"
data_sources:
  - id: "un-cpc-3-0-notes-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 explanatory notes, 30 June 2025, p. 123. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "26720 requires at least 85% by weight of such filaments; 26730 is residual. Classification context only, not recipe or accepted mapping."
  - id: "hk-common-product-names-2026"
    type: "official_guidance"
    reference: "Hong Kong Census and Statistics Department, Common Product Name 2026, printed p. 11, 54083400: 82% rayon filament/18% silk woven fabric, printed. https://www.censtatd.gov.hk/FileManager/EN/Content_93/alpha_list.pdf"
    used_for: "Concrete printed artificial-filament/silk product example; no verified viscose family, silk state, dry basis, recipe or factory measurements. Retained document metadata identifies 2026; URL is mutable."
  - id: "wco-hs-2022-chapter-54"
    type: "official_guidance"
    reference: "WCO, HS 2022 Chapter 54, pp. 1 and 4, Note 1 and 5408.31–5408.34. https://www.wcoomd.org/-/media/wco/public/global/pdf/topics/nomenclature/instruments-and-tools/hs-nomenclature-2022/2022/1154_2022e.pdf"
    used_for: "Artificial versus synthetic definition and other woven artificial-filament fabrics including printed. Does not establish an exact CPC 3.0 crosswalk."
  - id: "dystar-reactive-printing"
    type: "extension_guidance"
    reference: "DyStar, Reactive Dyes in Screen Printing Application, public course overview. https://www.dystar.com/training/courses/reactive-dyes-in-screen-printing-application/"
    used_for: "Reactive printing on cellulosic viscose and silk/blends; printing, drying, steaming and wash-off. Public overview supports candidate sequence, not a validated union-fabric recipe."
  - id: "dystar-jettex-r"
    type: "extension_guidance"
    reference: "DyStar, Jettex R inks, manufacturer product overview. https://www.dystar.com/products/dyes/jettex-r-inks/"
    used_for: "Reactive digital-ink applicability to cotton, viscose and silk as substrates; neither exact two-fibre lot performance nor factory conditions are proved."
  - id: "aleph-reactive-printing"
    type: "extension_guidance"
    reference: "Aleph, Reactive Inks, manufacturer product page, Ink Colours and Processing Steps. https://alephteam.com/textile-ink/reactive-inks/"
    used_for: "Individual ink colours and preprocessing, printing, drying, steaming, washing and finishing. Supplier process values are not adopted as universal temperatures or recipes."
