  unresolved_method_relations:
    - relation: factory_applicability_and_measurements
      explanation: No factory foreground package is asserted. Actual viscose family,
        both filament states, dry composition, degumming/sericin residue,
        supplier pretreatment, reactive-ink compatibility, conditioning, net
        yield, operating settings and balances must be confirmed and measured
        under section 8 before a data package is usable.
    - relation: classification_correspondence
      explanation: CPC 3.0 title/notes and HS 2022 Chapter 54 were verified
        separately. The official HK printed example supports a residual
        artificial-filament/silk family but not an accepted exact CPC 3.0-HS
        edge or whole-leaf coverage.
