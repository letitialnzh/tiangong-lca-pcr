      record_type: "measurement"
      raw_fields: "emission point; particulate concentration; dry standardized exhaust volume; duration; moisture; size definition; abatement status"
      collection_method: "Use representative stack tests or documented monitoring; combine matching concentration and gas volume bases; separately assess fugitive discharge. Unmeasured emissions remain a disclosed gap, not zero"
      unit: "kg"
      frequency: "Representative operating conditions and control states"
      temporal_coverage: "Same reporting period or justified temporal adjustment"
      site_scope: "Brushing exhaust points"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Test report; concentration/volume basis; control uptime; uncertainty"
    - protocol_id: cp_allocation
      process_id: "brushing"
      flow_role: "joint outputs and shared operations"
      record_type: "record"
      raw_fields: "grade kg; tow kg; moisture; net revenue; invoice period; dedicated/shared meter; causal driver"
      collection_method: "Retain production/sales ledgers and measured physical partition evidence; explain choice and sensitivity. No default prices or allocation factors"
      unit: "kg"
      frequency: "Each reporting period"
      temporal_coverage: "Same as production inventory"
      site_scope: "All joint outputs at this factory"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Production, sales and reconciliation records"
  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "q_norm = allocated batch exchange amount / accepted net main-fibre mass in kg; report per 1 kg reference flow. Internal transfers reconcile without repeated upstream burdens."
      inputs:
        - cp_mass_baling
        - cp_allocation
      output: "Normalized exchange in its declared unit"
      source_ids: []
    - id: calc_energy
      applies_to: "receipt_electricity; brushing_electricity; baling_electricity"
      rule: "E_MJ = measured allocated electricity_kWh × 3.6; then apply calc_normalize."
      inputs:
        - cp_energy_receipt
        - cp_energy_brushing
        - cp_energy_baling
        - cp_mass_baling
      output: "E_MJ"
      source_ids: []
    - id: calc_moisture
      applies_to: "all fibre mass rows"
      rule: "m_dry = m_wet × (1 − w); w is measured wet-basis water mass fraction. Use dry solids for balance only; the reference remains dispatch net mass."
      inputs:
        - cp_mass_baling
      output: "m_dry"
      source_ids: []
    - id: calc_air
      applies_to: "particulate_air"
      rule: "Emitted kg = measured concentration in mg/m3 × matching exhaust m3 / 1000000; retain matched dry/wet, temperature and pressure bases; apply calc_normalize after allocation."
      inputs:
        - cp_air
        - cp_mass_baling
        - cp_allocation
      output: "Emitted particulate mass"
      source_ids: []
    - id: calc_partition
      applies_to: "joint brushing burdens"
      rule: "Retain separation and causal physical evidence first. Where economic partition is justified, a_i = observed net revenue_i / sum of joint-product net revenues in the same period; fractions sum to one. Calculate moisture-adjusted mass alternative from measured dry product masses and disclose sensitivity."
      inputs:
        - cp_allocation
      output: "a_i"
      source_ids: []
  data_quality_requirements:
    - id: dq_route
      applies_to: "all processes"
      requirement: "Confirm species purity, incoming extraction/drying state and absence of wet/chemical treatment; no classification-wide extrapolation"
      evidence: "Supplier records and process walk-through"
    - id: dq_balance
      applies_to: "fibre transfers"
      requirement: "Reconcile opening stock + inputs − closing stock with main fibre, tow, rejects and dust on measured dry-solids basis; quantify unexplained differences and sampling uncertainty. No universal loss threshold"
      evidence: "Batch mass and moisture reconciliation"
    - id: dq_coverage
      applies_to: "data package"
      requirement: "Cover representative operations, downtime, grades, supplier/geographic mix and period. Disclose missing inventories and allocation uncertainty; no invented temperature, yield, moisture or lifetime"
      evidence: "Meter/production coverage and uncertainty report"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Require exact main-fibre state and qualifiers, matching reference output and 1 kg net mass. An unresolved product UUID must be declared and confirmed before release; a broader fibre or yarn identity is not interchangeable."
    source_ids: []
  - rule_id: validate_measurements
    applies_to: "all inventory rows"
    rule: "Require linked protocols, same reporting-period mass denominator, unit conversions and documented allocation. Reject kg/kWh/MJ confusion, gross-mass reference, missing moisture basis or unexplained stock differences."
    source_ids: []
  - rule_id: validate_atomic_boundary
    applies_to: "route and emissions"
    rule: "Require one atomic exchange per row; distinguish solid dust from emitted air particulate, technosphere water from resources and wastewater. Check actual ancillary inputs and waste handling; gaps fail completeness and cannot be replaced by assumed zero."
    source_ids: []
  - rule_id: validate_upstream_claim
    applies_to: "dataset profile"
    rule: "Gate-to-gate finishing alone cannot establish complete cradle-to-gate coverage or equivalence between grades. Require audited upstream links and disclosure before extending scope."
    source_ids:
      - unsd-cpc-2025
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Route-specific unspun sisal finishing input to later spinning or product manufacture, with grade and moisture compatibility"
  excluded_use: "Whole CPC coverage; raw leaf production; wet treatment; spun yarn; use-stage performance; automatic full cradle-to-gate claims"
  required_metadata: "Site, period, species, incoming state, output grade, length, moisture, net mass, packaging, upstream links, allocation and actual route"
  required_quality_disclosure: "Measured and estimated shares; mass reconciliation; missing exchanges; upstream/transport extent; identities; emission coverage and uncertainty; sensitivity"
  update_trigger: "Changed species, route, moisture convention, grade specification, equipment, electricity supply, packaging or allocation evidence"
