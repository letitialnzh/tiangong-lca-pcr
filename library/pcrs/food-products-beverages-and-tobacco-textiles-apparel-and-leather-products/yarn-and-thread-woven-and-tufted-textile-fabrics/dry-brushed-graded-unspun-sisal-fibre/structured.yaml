allocation_rules:
  - rule_id: avoid_allocation
    applies_to: "main fibre and tow"
    rule: "Separate metered operations and grade-specific packing first. For joint brushing, cp_allocation shall test whether measured operation/material relationships justify physical partition. Never infer an allocation ratio from the classification title or assume all short fibre is waste."
    source_ids:
      - grosso-sisal
  - rule_id: joint_partition
    applies_to: "unseparated joint burdens"
    rule: "If separation and a causal physical relationship cannot be established, disclose economic partition as a study-specific choice based on actual same-period net revenues for main-fibre grades and saleable tow. Report quantities, prices, period, factor and sensitivity to moisture-adjusted mass partition; unresolved evidence prevents comparability. No fixed factor is supplied by this PCR."
    source_ids: []
  - rule_id: waste_no_credit
    applies_to: "discarded fibre and captured dust"
    rule: "Document product-versus-waste status using actual contracts and destination. Assign treatment burdens consistently with the study method and disclose any substitution scenario separately; no automatic avoided-product credit. Include treatment and transport once."
    source_ids: []
