      flow_role: "electricity"
      record_type: "meter readings"
      raw_fields: "stage; meter ID; start and end kWh; operating hours; idle time; allocation share; supplier"
      collection_method: "Dedicated meters or documented tested submetering balance; separate noil-only from common electricity"
      unit: "kWh"
      frequency: "each shift and campaign"
      temporal_coverage: "Complete declared campaign covering all included shifts; disclose seasonality and missing records"
      site_scope: "Named mill and actual included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceable lot records; reconciliation; gap assessment"
    - protocol_id: cp_auxiliary
      process_id: "joint_combing"
      flow_role: "mineral oil and spent oil"
      record_type: "maintenance records"
      raw_fields: "oil identity; issued mass; retained stock; collected spent mass; destination; shared-line hours"
