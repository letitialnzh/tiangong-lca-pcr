      output: "MJ per reference flow"
      source_ids: []
    - id: moisture_reconciliation
      applies_to: "carded_wool_input; unbaled_noils_output; unbaled_noils_input; combed_wool_coproduct; reference_product_noils; rejected_noil_fibre"
      rule: "Dry mass = net wet mass × (1 − measured wet-basis moisture fraction). Compare opening stocks + input against outputs + closing stocks on dry basis and explain residuals."
