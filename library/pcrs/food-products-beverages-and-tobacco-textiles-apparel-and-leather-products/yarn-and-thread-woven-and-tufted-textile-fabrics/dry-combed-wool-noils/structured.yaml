  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "Attributable campaign exchange / accepted net noil mass in kg; output per 1 kg reference flow. Keep gross joint masses and the allocation ledger separately."
      inputs:
        - cp_joint
        - cp_noil
        - cp_energy
        - cp_auxiliary
