allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "joint_combing; noil_finishing"
    rule: "First separate metered noil-only activities and top-only activities. Attribute noil-only sorting and packing directly to noils. Noil is not automatically burden-free because it is a short-fibre by-product."
    source_ids:
      - ghg-product-2011
      - woolmark-topmaking
  - rule_id: allocation_shared
    applies_to: "joint inputs and burdens"
    rule: "For inseparable common operations, justify an underlying physical relationship before choosing a physical allocation. Mass fraction alone is not evidence of causality. If physical allocation cannot be supported, document contemporaneous gate prices and quantities for top, saleable noils and each other marketable co-product and justify economic allocation. Economic share a_noil = noil gate value / sum of all co-product gate values, using consistent currency, period and moisture basis. Retain prices, outputs, method and sensitivity to a plausible alternative. No default noil/top price ratio is permitted."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_balance
    applies_to: "co-product and waste ledgers"
    rule: "Apply one coherent share to common upstream carded-sliver burdens and common-stage activity, without allocating downstream top finishing to noils. Shares sum to one across marketable outputs. Retain waste treatment burdens with their generating operation; do not create negative credits for assumed replacement of virgin wool. Gross physical outputs are not shrunk by the burden share."
    source_ids:
      - ghg-product-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_joint
      process_id: "joint_combing"
      flow_role: "feed and separated outputs"
      record_type: "lot weighing"
      raw_fields: "lot; species; received state; net feed; top mass; unbaled noil mass; stock movements; measured moisture; existing oil"
      collection_method: "Calibrated scale and lot-linked moisture tests at receipt and separation; reconcile supplier and mill records"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "Complete declared campaign covering all included shifts; disclose seasonality and missing records"
      site_scope: "Named mill and actual included stages"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceable lot records; reconciliation; gap assessment"
    - protocol_id: cp_noil
      process_id: "noil_finishing"
