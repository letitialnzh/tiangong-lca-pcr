validation_rules:
  - rule_id: validate_scope
    applies_to: "dataset"
    rule: "Require all reference qualifiers and exact dry-route starting state; flag fine hair, wet treatment or yarn manufacture as uncovered."
    source_ids:
      - woolmark-topmaking
  - rule_id: validate_balance
    applies_to: "mass and internal transfers"
    rule: "Verify positive accepted net noil denominator, identical EN/ZH reference row, calibrated weighing, moisture conversion, stock reconciliation and cancellation of internal noil transfer. Investigate unexplained mass discrepancies; no invented tolerance."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "joint ledger"
    rule: "Verify separation gate, all marketable outputs, directly attributed stages, evidence for common allocation and shares summing to one. Reject zero-burden noils without a separately justified method."
    source_ids:
      - ghg-product-2011
  - rule_id: validate_interfaces
    applies_to: "flow identities and emissions"
    rule: "Match exact property, unit, environmental compartment and route for every identity. Missing emission monitoring is inconclusive, not zero. Unresolved identities remain declared gaps; no substitution by spinning waste or generic raw wool."
    source_ids: []
