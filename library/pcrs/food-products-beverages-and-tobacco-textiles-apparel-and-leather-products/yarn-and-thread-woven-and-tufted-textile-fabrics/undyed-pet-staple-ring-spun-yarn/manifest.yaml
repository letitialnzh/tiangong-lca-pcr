  semantic_boundary_decision:
    decision: new_narrow_semantic_method
    rationale: Existing CPC 26430 leaf is empty_scaffold and read-only. Material synthetic-staple blend-yarn method explicitly covers below 85% and starts at blended sliver; fibre-preparation PCR ends before yarn. Neither covers this uncarded virgin PET staple-to-ring-yarn product and foreground route.
  unresolved_flow_identities:
    - row_id: finished_pet_yarn
      selected_flow: Undyed virgin PET staple ring-spun yarn
      reason: Bounded searches and direct public reads did not establish this virgin PET staple single ring-yarn identity. Retrieved yarn candidates include sewing/generic yarn, filament, artificial staple and synthetic staple below 85%; none is adopted. This is an unresolved identity, not proof of database absence.
    - row_id: pp_winding_tube
      selected_flow: Polypropylene winding tube
      reason: Retrieved polypropylene filament yarn and broad plastic candidates do not identify a formed winding tube; retain atomic component without substituting resin or yarn.
    - row_id: corrugated_box
      selected_flow: Corrugated cardboard box
      reason: Public corrugated-box candidate 4f197bec-7b3b-11dd-ad8b-0800200c9a66 specifies 16.6% primary and 83.4% recycled fibre. No foreground box recipe supports this restriction; leave UUID unresolved.
