allocation_rules:
  - rule_id: allocate_direct
    applies_to: "all stage records"
    rule: "Separate product lines and lots first. Directly measured fibre, yarn, rejects and dedicated-meter utilities belong to the matching lot."
    source_ids: []
  - rule_id: allocate_shared
    applies_to: "shared electricity and auxiliaries"
    rule: "Use a site-verified physical driver: measured power integrated over operating time for motors, or metered air volume for a shared compressor. Include idle load consistently. Mass allocation is allowed only when site evidence supports comparable per-mass demand. Preserve driver records, excluded products and a sensitivity comparison; no fixed allocation coefficient is supplied."
    source_ids: []
  - rule_id: allocate_returns
    applies_to: "PET waste and internal returns"
    rule: "Measure each internal return once and reconcile inventory stocks; do not count it as both virgin input and exported waste. Exported waste carries no automatic avoided-virgin-PET credit. A saleable co-product requires documented physical/economic relationship and explicit allocation sensitivity, rather than a silent waste credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_material
      process_id: "prepare"
      flow_role: "pet_staple_input"
      record_type: "warehouse issue and supplier specification"
      raw_fields: "lot; issued kg; returned kg; opening/closing stock; PET grade; virgin status; length; fineness; crimp; finish; moisture; supplier"
      collection_method: "Calibrated weighing, warehouse reconciliation and supplier certificate; verify uncarded incoming state; Net issued mass / matched accepted yarn kg; adjust stock change"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "Actual declared reporting period, representative of all included runs and downtime"
      site_scope: "Declared mill and connected PET ring-yarn line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; lot certificate; stock ledger"
    - protocol_id: cp_energy
      process_id: "prepare_spin_finish"
      flow_role: "electricity"
      record_type: "submeter and runtime records"
      raw_fields: "subprocess; meter; start/end kWh; idle time; operating time; compressor volume; allocation driver; voltage; location"
      collection_method: "Read calibrated submeters for each subprocess; reconcile motors, suction, compressor and conditioning with the plant total; Assigned meter difference / matched accepted yarn kg"
      unit: "kWh"
      frequency: "each meter interval"
      temporal_coverage: "Actual declared reporting period, representative of all included runs and downtime"
      site_scope: "Declared mill and connected PET ring-yarn line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter export; equipment map; allocation worksheet"
    - protocol_id: cp_output
      process_id: "finish"
      flow_role: "finished_pet_yarn"
      record_type: "lot weighing and quality release"
      raw_fields: "lot; gross yarn package kg; measured tube tare kg; box tare kg; rejected kg; accepted net kg; conditioning; fibre composition; count; twist; acceptance criteria and results"
      collection_method: "Weigh released net yarn with calibrated scale and actual configuration tare; reconcile rejects and matched moisture test; Sum accepted net yarn kg; reference output is 1 kg reference flow"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "Actual declared reporting period, representative of all included runs and downtime"
      site_scope: "Declared mill and connected PET ring-yarn line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; tare sampling; release record; composition evidence"
    - protocol_id: cp_waste
      process_id: "prepare_spin_finish"
      flow_role: "PET fibre and yarn waste separately"
      record_type: "segregated waste weighing"
      raw_fields: "stage; stream; gross kg; container tare kg; moisture; finish; composition; destination; returned kg"
      collection_method: "Weigh labelled containers per stage; separate loose fibre from yarn and internal recovery from exported waste; Each exported stream net kg / matched accepted yarn kg"
      unit: "kg"
      frequency: "each removal"
      temporal_coverage: "Actual declared reporting period, representative of all included runs and downtime"
      site_scope: "Declared mill and connected PET ring-yarn line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "waste transfer; scale record; destination and classification"
    - protocol_id: cp_air
      process_id: "prepare"
      flow_role: "pet_dust_air"
      record_type: "conditional emission monitoring"
      raw_fields: "source; air subcompartment; particle definition; concentration; exhaust volume; duration; uncertainty; captured fraction"
      collection_method: "Use site air monitoring with consistent concentration and volume basis and actual operating coverage; keep captured fibre out of the released amount; Measured released kg / matched accepted yarn kg; no missing-data zero"
      unit: "kg"
      frequency: "each representative measurement and reporting interval"
      temporal_coverage: "Actual declared reporting period, representative of all included runs and downtime"
      site_scope: "Declared mill and connected PET ring-yarn line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitoring report; exhaust flow calibration; scope and detection limit"
    - protocol_id: cp_packaging
      process_id: "finish"
      flow_role: "PP tube and corrugated box separately"
      record_type: "conditional issue, tare and return records"
      raw_fields: "component; count; measured net kg; composition; supplier; unused return; actual reuse rotations; loss; replacement; shipped configuration"
      collection_method: "Weigh each packaging component separately; establish actual count-to-kg relationship and measured reuse history, without assumed tube life; Each attributable component net kg / matched accepted yarn kg"
      unit: "kg"
      frequency: "each issue/dispatch lot"
      temporal_coverage: "Actual declared reporting period, representative of all included runs and downtime"
      site_scope: "Declared mill and connected PET ring-yarn line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; issue/return ledger; composition certificate; reuse ledger"
  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "Divide each matched-period attributable net exchange amount by the same accepted net yarn mass in kg from cp_output; preserve original quantity and unit. The finished yarn output equals 1 kg."
      inputs:
        - "net exchange"
        - "accepted net yarn kg"
        - cp_output
      output: "exchange unit per 1 kg reference flow"
      source_ids: []
    - id: calc_reconcile
      applies_to: "material rows"
      rule: "Compare external net fibre input and measured stock decrease with accepted net yarn, each exported waste, measured emissions and stock increase on one moisture basis. Report the unclosed difference; investigate returns and finish/moisture movement rather than inventing a loss factor."
      inputs:
        - cp_material
        - cp_output
        - cp_waste
        - cp_air
        - "stock and moisture records"
      output: "mass balance and disclosed residual"
      source_ids: []
    - id: calc_particle_release
      applies_to: "pet_dust_air"
      rule: "Multiply measured particulate concentration by exhaust volume for the same sampling state and time; convert reported concentration units explicitly, integrate actual operating intervals and preserve uncertainty. This is not an assumed emission factor."
      inputs:
        - cp_air
      output: "measured released particulate kg"
      source_ids: []
    - id: calc_packaging_mass
      applies_to: "pp_winding_tube; corrugated_box"
      rule: "Convert counted components using their contemporaneously measured unit tare mass; assign replacement consumption only from documented actual return and rotation records."
      inputs:
        - cp_packaging
      output: "attributable packaging kg"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "incoming and finished fibre composition"
      requirement: "Verify virgin PET, staple rather than filament, incoming processing state, residual finish and conditioning; retain composition and lot links."
      evidence: "supplier and lot test records"
    - id: quality_acceptance
      applies_to: "finished_pet_yarn"
      requirement: "Use actual yarn count, twist, evenness and strength specification and rejection records; no health or regulatory approval is inferred."
      evidence: "quality release and customer specification"
    - id: quality_coverage
      applies_to: "all inventory"
      requirement: "Cover all included subprocesses and ancillary exchanges; document actual absent rows, measurement gaps, meter overlaps, stock changes and reporting representativeness. No default recipe, temperature, energy, loss or output yield is provided."
      evidence: "line map, meter reconciliation and completeness ledger"
    - id: quality_uncertainty
      applies_to: "measurements and allocation"
      requirement: "Declare calibration, detection limits, sampling coverage, actual measurement uncertainty and allocation sensitivities; proposed ranges require evidence before use."
      evidence: "calibration and uncertainty records"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product and route"
    rule: "Reject this route for recycled fibre, blends, non-PET polymers, filament, sewing thread or an alternative spinning/treatment route; require all reference qualifiers and composition evidence."
    source_ids:
      - unsd-cpc-2025
  - rule_id: validate_mass
    applies_to: "reference and inventory"
    rule: "Require positive accepted net yarn mass, tube/box tare exclusion, matching moisture basis and per 1 kg reference-flow denominator. Investigate unreconciled polymer/finish/water balance without inventing tolerances."
    source_ids: []
  - rule_id: validate_atomic_identity
    applies_to: "all flow rows"
    rule: "Check one exchange per row, correct product/waste/elementary type, public identity qualifiers and actual reference property/unit. Blank UUIDs remain explicit identity gaps. Air particulate is not captured fibre waste; no assumed direct emissions from purchased electricity."
    source_ids: []
  - rule_id: validate_complete_boundary
    applies_to: "dataset coverage"
    rule: "Require stage and ancillary completeness, conditional-row applicability decisions, dated collection and defensible allocation. Missing emissions monitoring is inconclusive, not zero. Foreground-only results cannot claim complete cradle-to-gate coverage."
    source_ids: []
published_dataset_profile:
  dataset_role: "Mill foreground process dataset for one declared PET ring-yarn specification"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible weaving/knitting supply modelling after identity and boundary review; upstream links added separately"
  excluded_use: "Automatic whole-CPC coverage; comparison of unlike yarn functions; other polymers, recycled routes, sewing thread or wet finishing; methodology approval from structural checks"
