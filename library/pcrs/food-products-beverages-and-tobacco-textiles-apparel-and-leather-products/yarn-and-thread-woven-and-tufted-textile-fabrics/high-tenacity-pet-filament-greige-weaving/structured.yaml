allocation_rules:
  - rule_id: allocation_direct
    applies_to: "batch records"
    rule: "Prefer measured submetering and dedicated issue records to assign loads directly to actual batches, retaining factory evidence; do not allocate a second burden to internal beams or fabric intermediates."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared equipment"
    rule: "Allocate motor load using site-validated measured power integrated over runtime; shared suction/compressors use measured service demand or validated operating load, including idle load. Mass allocation requires evidence that demand is proportional to mass; retain drivers, denominators and sensitivity, with no default coefficient."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "returns, waste and secondary grades"
    rule: "Reconcile internal returns/stocks by mass. Exported waste gets no automatic recycling substitution credit. Saleable secondary-grade cloth requires actual price/quantity and co-product status; separate attributable operations first. If separation is impossible, use and disclose actual physical relationship or measured revenue with allocation sensitivity and boundary."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "release"
      flow_role: "accepted net cloth"
      record_type: "weighing and quality release"
      raw_fields: "lot; gross mass; core/wrap tare; conditioning; accepted length; usable width; mass per area; tests"
      collection_method: "Calibrated scale measures accepted net kg after tare and rejects; area records use measured area_conversion only"
      unit: "kg"
      frequency: "each lot and roll"
      temporal_coverage: "All batches in actual reporting period"
      site_scope: "Declared weaving mill and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; inspection and conditioning records"
    - protocol_id: cp_material
      process_id: "prepare_weave"
      flow_role: "warp/weft yarn and machinery oil"
      record_type: "weighing, issue/return and stocks"
      raw_fields: "grade; composition; high-tenacity certificate; mass; finish; moisture; issues/returns; stocks; residual beam yarn; oil make-up"
      collection_method: "Calibrated weighing reconciled with purchases, lot and stock records; distinguish warp/weft and machinery oil"
      unit: "kg"
      frequency: "each lot and oil make-up event"
      temporal_coverage: "Matched lots and period stocks"
      site_scope: "warping/weaving and attributed auxiliaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier records; scale calibration; stock reconciliation"
    - protocol_id: cp_energy
      process_id: "prepare_weave_release"
      flow_role: "stage electricity"
      record_type: "submeter and runtime"
      raw_fields: "start/end kWh; equipment; runtime/idle; suction/climate scope; geography; voltage; allocation drivers"
      collection_method: "Match batches and meter intervals; reconcile stages/auxiliaries with plant totals without double counting"
      unit: "kWh"
      frequency: "each meter interval"
      temporal_coverage: "All matched running and idle periods"
      site_scope: "declared factory and equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; invoices and allocation sheets"
    - protocol_id: cp_waste
      process_id: "prepare_weave_release"
      flow_role: "PET waste and spent oil"
      record_type: "segregated weighing and transfer"
      raw_fields: "lot; substance; form; tare-adjusted mass; contamination; internal reuse; destination"
      collection_method: "Weigh each waste separately against manifests and internal reuse; separate oil from yarn/fabric"
      unit: "kg"
      frequency: "each collection/dispatch"
      temporal_coverage: "matched reporting period"
      site_scope: "foreground and site gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "transfer receipts; calibration; evidence of absence"
    - protocol_id: cp_air
      process_id: "weave"
      flow_role: "airborne particles"
      record_type: "exhaust and fugitive monitoring"
      raw_fields: "source; concentration; air flow; duration; size; compartment; capture; detection limit"
      collection_method: "Sample actual release points; integrate matched concentration, air volume and duration to kg; declare size/compartment; captured material is not emitted; unmonitored is not zero"
      unit: "kg"
      frequency: "actual sampling linked to batches"
      temporal_coverage: "declare representativeness and uncovered intervals"
      site_scope: "actual weaving/suction outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitoring reports; detection limits; capture and representativeness"
    - protocol_id: cp_pack
      process_id: "release"
      flow_role: "paper cores and PE film"
      record_type: "packing weights/issues"
      raw_fields: "component; composition; net issues/returns; reuse; lot and tare"
      collection_method: "Measure each component net mass separately; reconcile purchases/reuse and attribute actual consumption"
      unit: "kg"
      frequency: "each packing lot"
      temporal_coverage: "matched reporting period"
      site_scope: "product roll packing"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "specifications; weights; reuse ledger"
  calculation_rules:
    - id: normalize_batch
      applies_to: "all inventory rows"
      rule: "Divide each non-reference measured net exchange by matched accepted net fabric kg from cp_output; finished output is fixed at 1 kg. Apply site-evidenced attribution first."
      inputs:
        - cp_output
        - cp_material
        - cp_energy
        - cp_waste
        - cp_air
        - cp_pack
      output: "exchanges per 1 kg reference flow"
      source_ids: []
    - id: convert_area_records
      applies_to: "finished_greige"
      rule: "Apply measured L, W, G under area_conversion for area and mass, reconcile against weighing; unverified nominal parameters cannot be used."
      inputs:
        - cp_output
        - area_conversion
      output: "accepted net fabric kg"
      source_ids: []
    - id: reconcile_pet
      applies_to: "warp_pet_yarn; weft_pet_yarn; prepare_pet_waste; weave_pet_waste; release_pet_waste"
      rule: "Reconcile net yarn issue against accepted fabric, PET wastes, actual releases and work-in-process stock change on a consistent moisture/finish basis; disclose residual and uncertainty, never invent emissions from the residual."
      inputs:
        - cp_material
        - cp_output
        - cp_waste
        - cp_air
      output: "mass reconciliation and residual"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "yarn and reference product"
      requirement: "Both yarn systems need high-tenacity/PET evidence and actual unsized untreated start/end state; a manufacturer example does not certify this plant."
      evidence: "supplier certificates; order; route and acceptance"
    - id: quality_coverage
      applies_to: "all records"
      requirement: "Disclose actual period, throughput, changeovers/idle and all foreground/auxiliary coverage; a single test does not establish an industry range."
      evidence: "lot, meter and production logs"
    - id: quality_uncertainty
      applies_to: "measurements and releases"
      requirement: "Record calibration, sampling, detection limits and actual uncertainty; missing measurement, absence and differing applicability are distinct."
      evidence: "calibration and monitoring reports"
    - id: quality_sources
      applies_to: "public evidence"
      requirement: "Classification supports classification boundaries and manufacturers support product/process existence only; they do not supply default recipes, energy, losses, life or environmental performance."
