validation_rules:
  - rule_id: validate_applicability
    applies_to: "product and route"
    rule: "Verify all-PET high-tenacity warp/weft, unsized mechanical weaving and untreated greige endpoint. An excluded operation makes this route inapplicable; classification code cannot substitute for validation."
    source_ids:
      - unsd-cpc-2025
      - mehler-company-2025
  - rule_id: validate_measurement
    applies_to: "reference and inventory"
    rule: "Finished reference row must be 1 kg accepted net cloth matching reference name. All rows require linked protocols and matched batch kg denominator; area needs measured conversion and electricity retains energy property."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Check inputs, outputs, internal transfers, wastes, utilities and conditions by stage, disclosing real gaps; missing monitoring or unclear boundary is inconclusive, not complete validation."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "each exchange"
    rule: "One substance/exchange per row; verify public material, route, geography, compartment and reference property. Disclose unresolved UUIDs rather than forcing them; a blank candidate reference is an evidence gap, not methodology approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Route-verified mill-gate greige-fabric foreground data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Link to subsequent finishing/industrial fabric models when composition, strength, construction and foreground gate match; add and verify upstream first"
  excluded_use: "Entire-CPC coverage; bonded scrim, other polymer, air/water-jet or finished routes; unsupported complete lifecycle, lifetime or functional-equivalence claims"
  required_metadata: "All reference qualifiers; lots/stages; measured net mass, area conversion, meters and allocation; high-tenacity yarn grade/upstream; core/wrap; utilities/releases"
  required_quality_disclosure: "gate-to-gate and unlinked upstream; measurement/sampling coverage, uncertainty, evidence of conditional absence, unmeasured exchanges and unresolved identities; equipment/infrastructure exclusions"
  update_trigger: "Changes to material/yarn grade/feed state, sizing/finishing, insertion, weave, mass per area, moisture, supply, utilities, packaging or allocation"
