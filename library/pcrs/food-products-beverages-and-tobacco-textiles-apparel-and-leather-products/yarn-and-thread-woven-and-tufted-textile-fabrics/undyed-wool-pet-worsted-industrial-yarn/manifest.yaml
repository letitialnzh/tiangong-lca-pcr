  unresolved_flow_identities:
    - row_id: pet_sliver_input
      selected_flow: Polyethylene terephthalate staple-fibre sliver, unblended and
        prepared for worsted spinning
      reason: Bounded searches and public direct reads identify loose PET staple and
        blended slivers, not unblended PET sliver prepared for worsted spinning;
        preparation state remains unverified.
    - row_id: ester_lubricant_input
      selected_flow: Synthetic ester spinning lubricant, neat formulated product
      reason: POY oil belongs to partially oriented filament manufacture; no matching
        neat ester staple-spinning formulation was established. A direct-read
        generic lubricant additionally specifies wax mixed with solvent, not
        this neat synthetic ester formulation.
    - row_id: rub_roving_output
      selected_flow: Undyed wool–PET rub roving
      reason: Available blended-sliver identities do not establish rub-roving cohesion
        and preparation state.
    - row_id: prep_captured_fibre_waste
      selected_flow: Captured wool–PET loose fibre waste
      reason: Public wool-spinning waste omits PET blend composition; fabric-waste
        identities are not loose captured fibre.
    - row_id: rub_roving_input
      selected_flow: Undyed wool–PET rub roving
      reason: Available blended-sliver identities do not establish rub-roving cohesion
        and preparation state.
    - row_id: wound_yarn_output
      selected_flow: Undyed wool–PET single yarn, wound and awaiting final release
      reason: Generic Yarn includes route/recycled qualifiers and does not establish
        this wool/PET intermediate; other classification yarns are not forced
        into this identity.
    - row_id: clearing_yarn_waste
      selected_flow: Wool–PET yarn clearing waste
      reason: Captured wool-spinning waste is loose fibre and does not establish
        cleared wool/PET yarn waste.
    - row_id: spin_captured_fibre_waste
      selected_flow: Captured wool–PET loose fibre waste
      reason: Public wool-spinning waste omits PET blend composition; fabric-waste
        identities are not loose captured fibre.
    - row_id: wound_yarn_input
      selected_flow: Undyed wool–PET single yarn, wound and awaiting final release
      reason: Generic Yarn includes route/recycled qualifiers and does not establish
        this wool/PET intermediate; other classification yarns are not forced
        into this identity.
    - row_id: finished_yarn_output
      selected_flow: Undyed wool–PET worsted industrial yarn, wool below 85% by fibre mass
      reason: Two bounded 28/30-result product searches did not establish a matching
        low-wool wool/PET industrial finished-yarn identity. Direct reads of
        generic Yarn, synthetic-staple yarn and animal-hair yarn do not
        establish the exact product boundary. No claim of database-wide absence.
