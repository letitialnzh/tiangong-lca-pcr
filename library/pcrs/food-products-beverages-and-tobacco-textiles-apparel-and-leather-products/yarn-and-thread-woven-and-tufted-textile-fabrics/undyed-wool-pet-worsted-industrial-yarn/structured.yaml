system_boundary:
  rules:
    - rule_id: method_selection
      applies_to: "starting condition and process responsibility"
      rule: "Require separately received wool top and PET sliver and on-site blending/gilling for this PCR. For already blended sliver that satisfies the existing low-synthetic-fibre blended-yarn method, reuse that method. Incoming supplier datasets end at the respective unblended prepared inputs and must exclude wool/PET blending and gilling passages already counted here. Retain processing location, transfer lot, measured inputs and a boundary diagram as reconciliation evidence."
