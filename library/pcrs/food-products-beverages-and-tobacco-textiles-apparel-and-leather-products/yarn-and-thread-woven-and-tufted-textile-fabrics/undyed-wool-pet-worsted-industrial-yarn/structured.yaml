allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared electricity and services"
    rule: "Prefer process subdivision and direct meters. For a shared motor, suction or compressor, document a measured physical demand or operation-time basis and test its representativeness; mass allocation alone is not a default for unlike counts or technologies."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_recovery
    applies_to: "internal returns and exported waste"
    rule: "Reconcile internal re-feed once without a second virgin-fibre charge or avoided-burden credit. Weigh exported fibre waste and clearing waste separately and record treatment. A sold recovered stream needs documented waste/co-product status before allocation."
    source_ids:
      - ghg-product-2011
  - rule_id: allocation_coproduct
    applies_to: "actual co-product"
    rule: "If subdivision cannot avoid allocation, justify the underlying physical relationship; only where unavailable may a documented economic or other relationship be used. Disclose shares, period, prices where used, and sensitivity. No fixed credit or price is supplied."
    source_ids:
      - ghg-product-2011
