    - protocol_id: cp_final_yarn
      process_id: "inspection_packing"
      flow_role: "finished_yarn_output"
      record_type: "accepted lot and scale record"
      raw_fields: "lot; gross yarn-package mass; core tare; box tare; other individually weighed packaging tare; net accepted yarn mass; moisture; dry-fibre composition; count; twist; acceptance result"
      collection_method: "Calibrated scale plus laboratory/supplier composition and purchaser acceptance evidence; maintain lot-level moisture measurements"
      unit: "kg"
      frequency: "Every accepted lot"
      temporal_coverage: "All released lots in the reporting period"
      site_scope: "Same plant and declared winding configuration"
      aggregation_rule: "Sum accepted net yarn mass; finished_yarn_output is 1 kg per 1 kg reference flow"
      quality_evidence: "Scale calibration; tare trials; moisture/quality tests; release record"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "Divide each attributable reporting-period exchange by net accepted final yarn mass from the same linked lots and moisture basis. Retain both stage transfer masses; intermediate output is not an extra functional unit."
      inputs:
        - "exchange record"
        - cp_final_yarn
        - "allocation record"
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: net_yarn_mass
      applies_to: "finished_yarn_output"
      rule: "Net yarn mass equals gross package mass minus separately measured cores, boxes and every other actual packaging component; never use an assumed tare or moisture correction."
      inputs:
        - cp_final_yarn
      output: "accepted net yarn kg"
      source_ids: []
    - id: pm10_mass
      applies_to: "prep_pm10_air; spin_pm10_air"
      rule: "For compatible dry reference conditions, emitted kg = PM10 mg/m3 multiplied by exhaust m3 divided by 1000000; for flow-rate records integrate over matched operating time. Retain size fraction and detection limits before normalization."
      inputs:
        - cp_prep_pm10
        - cp_spin_pm10
      output: "measured PM10 kg"
      source_ids: []
  data_quality_requirements:
    - id: dq_blend_control
      applies_to: "on-site blending and gilling"
      requirement: "Retain lot-level dry-fibre mass evidence for both inputs, weighed recipe, passage counts, blend-uniformity tests and matching roving transfers. Determine different fibre moisture contents and retained finish separately from actual measurements/supplier evidence; wet wool mass cannot establish wool fraction. Missing evidence leaves composition unverified."
      evidence: "supplier preparation records; moisture/finish analysis; recipe weights; uniformity tests; passage trace"
    - id: dq_composition
      applies_to: "top to yarn chain"
      requirement: "Trace separately issued wool and PET, supplier treatment/finish and composition of the accepted lot; distinguish dry fibre fraction from moist yarn mass."
      evidence: "supplier certificates; formulation; test results"
    - id: dq_mass
      applies_to: "all material transfers"
      requirement: "Reconcile received, returned, stocked, transferred, accepted, rejected and waste quantities on one moisture basis; investigate unexplained differences without a default loss allowance."
      evidence: "batch balances; scale and moisture records"
    - id: dq_energy
      applies_to: "electricity"
      requirement: "Map meter boundaries including suction/compressed-air and ventilation; avoid omission and double counting, and disclose shared allocation uncertainty."
      evidence: "meter map; allocation worksheet"
    - id: dq_emission
      applies_to: "PM10 and waste"
      requirement: "Separate capture from release; a total-dust test is not PM10 evidence. Missing monitoring is unknown, not zero; record non-detect limits and discharge conditions."
      evidence: "sampling reports; waste transfer evidence"
    - id: dq_representative
      applies_to: "dataset"
      requirement: "Record site, period, product count/recipe mix, covered production and missing stages; retain route-specific records rather than transferring another mill yield."
      evidence: "production calendar; coverage and uncertainty report"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Require the actual wool/PET recipe, wool below 85% dry fibre mass, non-retail single yarn and undyed/unsized worsted route. Check classification justification independently; no entire-CPC coverage follows from this PCR."
    source_ids:
      - unsd-cpc-2025
  - rule_id: validate_basis
    applies_to: "all rows"
    rule: "Require 1 kg net accepted reference yarn, complete required qualifiers, linked collection protocols and one final-yarn denominator. Match intermediate transfer masses and exclude packing from yarn net mass."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "included processes"
    rule: "Reject an unexpanded dataset with re-combing, wet finishing, steaming or different co-fibres. Record every actual material and utility atomically; omissions and unmeasured direct emissions remain incomplete coverage."
    source_ids:
      - woolmark-spinning-2020
  - rule_id: validate_uuid
    applies_to: "flow identities"
    rule: "For each selected UUID verify public identity, reference property, material state, route and elementary receiving compartment; keep an unresolved row concrete and declared. Candidate identity gaps are not publication or methodology approval."
    source_ids: []
  - rule_id: validate_pm10
    applies_to: "PM10 rows"
    rule: "Use PM10 kg only with particle-size-resolved evidence and the selected air subcompartment; never substitute total dust, captured fibre waste or urban/high-stack flows without corresponding conditions."
    source_ids: []
published_dataset_profile:
  dataset_role: "Manufacturing foreground inventory for a declared wool/PET worsted industrial yarn"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "A matched intermediate input to textile manufacture after applicability, identity and data review"
  excluded_use: "Whole CPC coverage; full cradle-to-gate or consumer footprint without linked upstream/downstream processes; other co-fibres or excluded routes; comparative performance or certification claims"
  required_metadata: "All reference qualifiers; site/period; process map; supplier and upstream dataset identities; flow-property units; inventory denominator; allocation; packing/tare; waste destinations"
  required_quality_disclosure: "Mass balance; calibration; production coverage; exclusions; unmeasured emissions; unresolved UUIDs; supply proxies and sensitivity; uncertainty"
  update_trigger: "Changes in formulation, top/sliver treatment, spinning or winding route, supply mix, packing, monitoring evidence or material data quality"
data_sources:
  - id: "unsd-cpc-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division. CPC Version 3.0 Explanatory Notes, 30 June 2025, PDF/printed page 119, 26320–26340. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Wool-content and non-retail classification context only; the page does not specify a manufacturing route"
  - id: "woolmark-spinning-2020"
    type: "handbook"
    reference: "The Woolmark Company. Worsted and woollen spinning — Facilitator Guide, 2020. PDF/printed pages 50, 66–67, 72, 74, 83 and 247. https://www.woolmarklearningcentre.com/globalassets/woolmark-learning-centre/10-resources/facilitator-guides/gd2891-worsted-woollen-spinning-facilitator-guide_2020_final.pdf"
    used_for: "Wool/polyester worsted blend, preparation, moisture, roving, spinning and post-spinning distinctions. Educational process context; no historic trial value, recipe, performance or trademark requirement adopted"
  - id: "ghg-product-2011"
    type: "official_guidance"
    reference: "WRI/WBCSD. Product Life Cycle Accounting and Reporting Standard, 2011, printed page 63, PDF page 65, Tables 9.1–9.2. https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Historical generic allocation hierarchy supporting disclosed choices; no textile-specific numeric ratio or full LCA approval"
  - id: "woolmark-worsted-spinning"
    type: "handbook"
    reference: "The Woolmark Company. Worsted Spinning, undated current publisher page, sections Drawing and Worsted Spinning. https://www.woolmark.com/industry/product-development/wool-processing/worsted-spinning/"
    used_for: "Current drawing/rub-roving, single-yarn and clearing/winding route context; no performance or production parameters adopted"
