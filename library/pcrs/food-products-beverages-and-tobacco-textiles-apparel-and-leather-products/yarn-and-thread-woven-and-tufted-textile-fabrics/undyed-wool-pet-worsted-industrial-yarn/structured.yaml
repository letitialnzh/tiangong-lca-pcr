    - rule_id: boundary_required
      applies_to: "manufacturing route"
      rule: "Include actual mixing, gilling/drawing, rub-roving, ring spinning, clearing/winding, inspection and packing with their controlled direct exchanges. Passage counts, temperatures and yields come from factory records."
      source_ids:
        - woolmark-spinning-2020
        - woolmark-worsted-spinning
    - rule_id: boundary_water
      applies_to: "dry route and wet processing"
      rule: "Scouring/dyeing wastewater belongs to the appropriate upstream or expanded wet process. Humidification, an aqueous finish or wet cleaning on site requires separate supplied-water and actual effluent rows and a documented expansion; resource water must not stand for supplied water or wastewater."
      source_ids:
        - woolmark-spinning-2020
    - rule_id: boundary_emissions
      applies_to: "direct exchanges"
      rule: "Measure and add each actual chemical, fuel, refrigerant, waste and emission as an individual exchange. Electricity supply emissions stay upstream; no combustion CO2 or dust mass is assumed merely because yarn is spun."
