measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use measured Q kg net accepted finished cigarettes during the collection period, excluding packaging. All rows are per 1 kg reference flow. Q must be positive."
  - id: piece_to_mass
    applies_to: "count-based production records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure m kg/piece from representative accepted finished cigarettes of the same SKU, including all cigarette components and stated moisture, with a tared calibrated scale; record sample count n and sample net mass W, m=W/n. When production is recorded as N accepted pieces, Q=N*m. Never invent m or use tobacco fill mass instead."
  - id: electricity_conversion
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the public electricity energy property. For meter E kWh, use 3.6*E MJ, then divide by Q kg. Energy is not mass."
  - id: water_conversion
    applies_to: "purchased water and liquid effluent"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "If collected in m3, obtain density rho kg/m3 at recorded temperature/quality and use X=V*rho before X/Q; do not adopt a default density or equate delivered water with extracted resource."
