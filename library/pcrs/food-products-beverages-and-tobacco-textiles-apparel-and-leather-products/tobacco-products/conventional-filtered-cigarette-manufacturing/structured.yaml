allocation_rules:
  - rule_id: internal_rework
    applies_to: "foreground_burden_allocation"
    rule: "Own reject splitting and returned rag receive no avoided-product credit or second upstream tobacco burden; retain the extra electricity, handling and unrecoverable losses on the accepted output. Recovered material crossing the site boundary requires explicit mass/fate records."
    source_ids:
      - hmrc-cigarette-process
  - rule_id: shared_resource_assignment
    applies_to: "foreground_burden_allocation"
    rule: "First subdivide by SKU/line/time using direct meters and job records. When subdivision is infeasible, use documented physical drivers: operating time with measured load for electric equipment, actual withdrawals for ingredients/packaging and measured exhaust for emissions. Disclose the driver and reconciliation to site totals; do not allocate by cigarette count across unequal configurations without net-mass/configuration correction."
    source_ids: []
  - rule_id: external_residue
    applies_to: "foreground_burden_allocation"
    rule: "Outgoing tobacco scrap and packaging scrap are waste or separately documented recovered products according to actual fate, not automatically revenue co-products. Retain waste-treatment links and disclose cut-off conventions. If a marketable co-product exists, document separate output mass, quality and economic/physical relationship and review allocation; no default recycling or displacement credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_receipt
      process_id: "receipt"
      flow_role: "cut_rag_input"
      record_type: "lot and stock record"
      raw_fields: "lot; blend components; purchased processing state; incoming/closing stock; gross withdrawals/returns; tobacco moisture"
      collection_method: "Calibrated net weighing, supplier specifications and period stock reconciliation"
      unit: "kg"
      frequency: "each lot and period close"
      temporal_coverage: "Same declared representative period as Q; include start-up, changeover, rejects and normal downtime; disclose seasonality and missing intervals"
      site_scope: "supplier/receipt lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/SKU specifications, reconciliation, sampling/detection evidence and uncertainty"
    - protocol_id: cp_making
      process_id: "making"
      flow_role: "paper/filter/tipping/glue/rejects"
      record_type: "production and material balance"
      raw_fields: "SKU; paper reel masses; filter rod count/mass; tipping use; glue wet mass/solids; reject routing; dust collected; internal transfer"
      collection_method: "Reconcile line issues, unused returns, reel weighing, filter sampling and separated reject weighing"
      unit: "kg"
      frequency: "batch/shift"
      temporal_coverage: "Same declared representative period as Q; include start-up, changeover, rejects and normal downtime; disclose seasonality and missing intervals"
      site_scope: "forming/filter-joining line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/SKU specifications, reconciliation, sampling/detection evidence and uncertainty"
    - protocol_id: cp_recovery
      process_id: "recovery"
      flow_role: "internal tobacco return and unusable fractions"
      record_type: "separation balance"
      raw_fields: "reject mass received; returned rag; unusable tobacco; filter segment; separated paper; moisture; downtime"
      collection_method: "Weigh separation outputs separately, reconcile internal return with making logs and record handling energy"
      unit: "kg"
      frequency: "each recovery run"
      temporal_coverage: "Same declared representative period as Q; include start-up, changeover, rejects and normal downtime; disclose seasonality and missing intervals"
      site_scope: "actual recovery line only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/SKU specifications, reconciliation, sampling/detection evidence and uncertainty"
    - protocol_id: cp_packing
      process_id: "packing"
      flow_role: "accepted net product and packaging"
      record_type: "acceptance/packing record"
      raw_fields: "SKU; N; sample n; sample net W; m; Q; moisture; acceptance/reject count; carton/foil/film/case/glue issues and returns; component scrap"
      collection_method: "Count accepted pieces and sample unwrapped intact cigarettes with calibrated tared scale; weigh each packaging issue/return and scrap separately"
      unit: "kg"
      frequency: "SKU batch and shipment; resample after specification/moisture change"
      temporal_coverage: "Same declared representative period as Q; include start-up, changeover, rejects and normal downtime; disclose seasonality and missing intervals"
      site_scope: "packing and factory-gate acceptance"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/SKU specifications, reconciliation, sampling/detection evidence and uncertainty"
    - protocol_id: cp_utilities
      process_id: "utilities"
      flow_role: "electricity/water/effluent/evaporation"
      record_type: "meter and water balance"
      raw_fields: "E kWh by operation; meter boundaries; allocated loads; water V and rho; effluent V and rho; moisture stocks; condensate; ventilation; temperature"
      collection_method: "Submeter electric loads; meter actual water/effluent and measure density; close water balance with product moisture and retained condensate, retaining uncertainty"
      unit: "MJ; kg"
      frequency: "shift meters and period reconciliation"
      temporal_coverage: "Same declared representative period as Q; include start-up, changeover, rejects and normal downtime; disclose seasonality and missing intervals"
      site_scope: "declared electric-only manufacturing boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/SKU specifications, reconciliation, sampling/detection evidence and uncertainty"
    - protocol_id: cp_air
      process_id: "making"
      flow_role: "residual particulate to air"
      record_type: "release monitoring"
      raw_fields: "outlet concentration c mg/m3; exhaust volume V m3; time; gas basis; controls; detection limits; fugitive estimate basis"
      collection_method: "Use representative release tests with paired concentration/volume under compatible dry/wet and temperature conditions; distinguish pre-control capture and residual release"
      unit: "kg"
      frequency: "representative production/control states and changes"
      temporal_coverage: "Same declared representative period as Q; include start-up, changeover, rejects and normal downtime; disclose seasonality and missing intervals"
      site_scope: "actual air releases at manufacturing outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/SKU specifications, reconciliation, sampling/detection evidence and uncertainty"
  calculation_rules:
    - id: net_product
      applies_to: "cp_packing and reference product"
      rule: "m=W/n kg/piece; Q=sum(N_j*m_j) kg for accepted SKU batches j. Use direct net weighing where available and reconcile count conversion. Do not use a nominal tobacco-fill weight."
      inputs:
        - N
        - n
        - W
        - m
      output: "Q kg, excluding packaging"
      source_ids: []
    - id: normalization
      applies_to: "all exchange rows and collection protocols"
      rule: "q_i=X_i/Q per 1 kg reference flow; no normalization by gross production including rejects. Q>0 and X_i must cover the same output period."
      inputs:
        - X_i
        - Q
      output: "kg/kg or MJ/kg as appropriate"
      source_ids: []
    - id: electricity_mj
      applies_to: "plant_electricity; cp_utilities"
      rule: "X_E=3.6*E kWh in MJ; q_E=X_E/Q. Reconcile allocated operation totals to the plant meter without duplicating compressor/HVAC/extraction."
      inputs:
        - E
        - Q
      output: "MJ/kg"
      source_ids: []
    - id: materials_conversion
      applies_to: "cp_making and cp_packing"
      rule: "Convert filter/carton counts using measured net component kg/item; convert paper/film area with actual batch grammage kg/m2. For wet glue use measured wet mass, with solids and water separately disclosed; do not replace delivered mass with dry polymer mass."
      inputs:
        - count
        - "net sample mass"
        - area
        - "batch grammage"
        - solids
      output: "X_i kg then X_i/Q"
      source_ids: []
    - id: water_balance
      applies_to: "cp_utilities; water_vapour_air"
      rule: "Liquid X=V*rho. Evaporation = actual water entering the boundary plus incoming moisture minus outgoing liquid water, outgoing product/waste moisture and measured net water-stock increase; include condensate transfers consistently. Report residual and uncertainty; negative or unexplained residual is review, not an emission."
      inputs:
        - V
        - rho
        - moisture
        - "water stocks"
        - condensate
      output: "kg evaporated water and uncertainty then /Q"
      source_ids: []
    - id: air_monitoring
      applies_to: "dust_air; cp_air"
      rule: "X_PM=sum(c_k*V_k)*10^-6 kg for paired mg/m3 and m3 observations; add only separately justified non-overlapping fugitive mass. Normalize X_PM/Q. No smoke-toxicant or default PM factor."
      inputs:
        - c_k
        - V_k
        - "fugitive mass"
        - Q
      output: "kg/kg"
      source_ids: []
  data_quality_requirements:
    - id: sku_composition
      applies_to: "input/reference identity"
      requirement: "Retain brand/SKU composition, moisture, filter/paper/adhesive and packaging state; disclose supplier ingredients already included in purchased rag and avoid counting them twice."
      evidence: "Supplier specification and accepted-product sample records"
    - id: complete_period
      applies_to: "all processes"
      requirement: "Cover actual operation modes, rework and rejects, stock change and site utilities; quantify missing records and attribution uncertainty. No unmeasured flow is silently zero."
      evidence: "Meter/stock reconciliation and collection completeness statement"
    - id: mass_and_water_closure
      applies_to: "tobacco/filter/paper/packaging/cleaning"
      requirement: "Reconcile separate material streams and moisture; reject discrepancies exceeding measured instrument/sampling uncertainty for investigation without inventing a universal tolerance."
      evidence: "Mass balances, calibrated weights, uncertainty and moisture tests"
    - id: no_default_ranges
      applies_to: "amounts and release monitoring"
      requirement: "Collect recipes, energy, temperature if relevant, yields, losses and net output from the actual plant. No boundary-compatible empirical ranges established here; do not treat descriptive sources or UUID comments as numerical benchmarks."
      evidence: "Raw factory evidence; unresolved range needs retained in manifest"
validation_rules:
  - rule_id: reference_and_measurement
    applies_to: "foreground_dataset_conformance"
    rule: "Require the stated qualifiers, Q>0, same-period exchange numerator and denominator, complete-component net mass and packaging exclusion. Count-based records must carry measured m=W/n and Q=N*m; no invented piece weight."
    source_ids: []
  - rule_id: route_and_inventory
    applies_to: "foreground_dataset_conformance"
    rule: "Check purchased input state and all actual process stages against this narrow route; validate individual atomic identities and public reference property/unit chain. Unresolved UUIDs remain explicit gaps, not approved substitutions. Confirm optional rows present/absent from evidence."
    source_ids:
      - hmrc-cigarette-process
  - rule_id: rework_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile accepted output, rejects, internal rag return, outgoing tobacco/paper/filter waste and moisture. Prevent duplicate accounting of whole rejected cigarettes and separately counted constituent fractions."
    source_ids:
      - hmrc-cigarette-process
  - rule_id: release_and_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "Validate particulate monitoring gas basis and control boundary; water vapour is only justified evaporation to air. Wastewater to external treatment is technosphere waste, never a freshwater-resource input or unmeasured elementary discharge. State performed, skipped and unresolved checks and characterization coverage; missing evidence is inconclusive."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site/SKU-specific foreground manufacturing process dataset"
  downstream_use: "secondary_dataset; background_dataset only with disclosed gate-to-gate scope and verified links"
  allowed_use: "Declared electric forming/packing route inventory per kg net accepted cigarette; expanded studies with explicit upstream/downstream linking"
  excluded_use: "Whole-CPC coverage, integrated leaf processing/filter manufacture, full cradle-to-gate claim without linked evidence, health/risk reduction or regulatory conformance endorsement, cross-SKU smoking-service comparison"
  required_metadata: "PCR version; SKU; site/geography/year; input state; tobacco/ingredient/filter/paper composition and moisture; Q/count conversion; process map; packaging; meters; allocation; internal loops; waste fate; upstream links"
  required_quality_disclosure: "UUID gaps, scientific review status, missing/range evidence, collection coverage, uncertainty, material/water closure, skipped emission checks and LCIA characterization limitations"
  update_trigger: "SKU/material/filter/adhesive/packaging change; boundary or utility route change; new supplier evidence; revised public identity; new measured loss or release data"
data_sources:
  - id: "unsd-cpc-2025"
    type: "official_guidance"
    reference: "UNSD. CPC Ver. 3.0 Explanatory Notes, 30 June 2025, printed/PDF page 116, division 25 and code 25020. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification context only; narrower route is an explicit methodology choice, not CPC-wide acceptance"
  - id: "hmrc-cigarette-process"
    type: "official_guidance"
    reference: "HMRC. Tobacco Products Duty, TPD6130 Manufacture: The Cigarette Manufacturing Process (text version), Primary/Secondary Stage and Additional notes; manual updated 18 December 2025. https://www.gov.uk/hmrc-internal-manuals/tobacco-products-duty/tpd6130"
    used_for: "Qualitative rag-to-making/packing interface and reject return/offal fate; UK duty-accounting description, not a universal process or factor"
  - id: "pmi-cigarette-process"
    type: "extension_guidance"
    reference: "Philip Morris International. How cigarettes are made, undated manufacturer webpage, Manufacturing cigarettes and Preparing the final pack. https://www.pmi.com/faq-section/smoking-and-cigarettes/how-cigarettes-are-made"
    used_for: "Rod/filter/tipping and pack assembly context only; self-description does not establish universal recipes, energy or quality approval"
  - id: "bat-cigarette-components"
    type: "extension_guidance"
    reference: "British American Tobacco. Tobacco, undated manufacturer webpage, How cigarettes work. https://www.bat.com/brands-and-innovation/product-categories/tobacco"
    used_for: "Conventional components and distinction from special filters; descriptive context, not an endorsement or measured amount source"
