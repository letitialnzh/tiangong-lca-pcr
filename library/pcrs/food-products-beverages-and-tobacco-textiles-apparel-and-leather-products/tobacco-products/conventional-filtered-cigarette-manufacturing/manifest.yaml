  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: cut_rag_input
      name: Prepared cut tobacco filler
      reason: Public blended tobacco candidate 46391a52-1ece-4784-82fb-50c1e9a577ed is
        a mass-based intermediate for manufactured tobacco, but its public
        record does not establish cut-rag size, moisture-conditioned
        ready-to-form state or cigarette route. Retain the physically specific
        prepared filler row without asserting that broader state is equivalent.
    - row_id: filter_rods
      name: Wrapped cellulose acetate cigarette filter rod
      reason: Public functional cellulose acetate tow is an upstream fibre, not a
        wrapped finished filter rod.
    - row_id: tipping_paper
      name: Printed cigarette tipping paper
      reason: Bounded searches and refined physical names did not establish a directly
        verified public identity matching this exact processed state and route.
        Retain the atomic row; no claim that the database lacks such a flow.
    - row_id: tobacco_dust_waste
      name: Collected tobacco dust
      reason: Public Tobacco dust candidate 23ac278b-87d1-48ca-a7c0-c891d54986e1 has
        Aluminium content as reference property, not total tobacco-dust mass;
        not adopted.
    - row_id: unrecovered_reject_cigarette
      name: Rejected assembled filter cigarette
      reason: Bounded searches and refined physical names did not establish a directly
        verified public identity matching this exact processed state and route.
        Retain the atomic row; no claim that the database lacks such a flow.
    - row_id: recovery_tobacco_waste
      name: Unusable recovered cut tobacco
      reason: Public Off-spec tobacco candidate 5c2302e1-9275-4cbc-9a24-b1a6a99dd62b
        is explicitly for reprocessing/rework; this outgoing row is unusable
        tobacco with external treatment fate. Do not force the rework-loop
        identity.
    - row_id: recovery_filter_waste
      name: Rejected wrapped cellulose acetate filter segment
      reason: Bounded searches and refined physical names did not establish a directly
        verified public identity matching this exact processed state and route.
        Retain the atomic row; no claim that the database lacks such a flow.
    - row_id: recovery_paper_waste
      name: Tobacco-contaminated cigarette wrapping paper
      reason: Bounded searches and refined physical names did not establish a directly
        verified public identity matching this exact processed state and route.
        Retain the atomic row; no claim that the database lacks such a flow.
    - row_id: overwrap_input
      name: Biaxially oriented polypropylene overwrap film
      reason: Refined BOPP and polypropylene-film searches returned packing tape
        rather than verified BOPP overwrap film; preserve the film state and
        blank UUID.
    - row_id: shipping_case_input
      name: Corrugated fibreboard shipping case
      reason: Public corrugated box candidate specifies a fixed primary/recycled fibre
        mix; not imposed on site-specific cases.
    - row_id: reference_product_output
      name: Finished conventional filtered tobacco cigarette
      reason: Public Cigarette candidate 815f7e67-d1dc-451c-9afa-21f22389e8cf has
        Number of items as reference property and no declared mass conversion.
        Preserve 1 kg reference and blank UUID until a verified mass-compatible
        identity or supported conversion is reviewed.
    - row_id: foil_waste
      name: Aluminium foil packaging offcut
      reason: Bounded searches and refined physical names did not establish a directly
        verified public identity matching this exact processed state and route.
        Retain the atomic row; no claim that the database lacks such a flow.
    - row_id: film_waste
      name: Biaxially oriented polypropylene film offcut
      reason: Public polypropylene-waste candidate has Product flow type and lacks
        confirmed BOPP-offcut identity; not adopted.
    - row_id: cleaning_wastewater
      name: Untreated tobacco-plant cleaning wastewater
      reason: Public untreated wastewater candidate has Product flow type; retained
        waste row and no unreviewed reclassification.
