  semantic_scope_decision: "New narrower methodology: conventional single-segment
    cellulose-acetate-filter tobacco cigarettes assembled from purchased
    ready-to-form cut rag and finished filter rods. The corresponding CPC leaf
    remains an empty scaffold. Material manufactured-tobacco guidance explicitly
    excludes cigarettes; cured stemmed/stripped tobacco covers upstream
    unmanufactured leaf; products-containing-tobacco covers
    non-combustion/nicotine routes, not conventional combustible cigarettes. No
    material equivalent identified. No accepted mapping or classification-wide
    coverage decision."
