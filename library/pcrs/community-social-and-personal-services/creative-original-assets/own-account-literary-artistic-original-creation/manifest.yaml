review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review: pending
  translation_review: pending_independent_review
  semantic_boundary:
    decision: "New original-expression methodology needed: own-account
      manuscript/score/eligible artistic expression with actual fixation and
      version acceptance. Existing legacy original-works directory is empty and
      untouched. Material software, research, data, design, brand, download,
      broadcast and recording candidates have different output boundaries;
      resource-attribution patterns may inform data collection but do not
      substitute reference identity."
    classification_scope: 96330 own-account origin without prior contract/known
      buyer; original musical score distinct from copyrighted sound-recording
      master; performers, painters and sculptors excluded.
  unresolved_flow_identities:
    - row_id: conception_electricity_site
      selected_flow: Alternating current
      reason: Actual region, voltage and supply must be collected; verified CN
        voltage-specific identities are conditional alternatives only.
    - row_id: creation_electricity_site
      selected_flow: Alternating current
      reason: Actual region, voltage and supply must be collected; verified CN
        voltage-specific identities are conditional alternatives only.
    - row_id: fixation_electricity_site
      selected_flow: Alternating current
      reason: Actual region, voltage and supply must be collected; verified CN
        voltage-specific identities are conditional alternatives only.
    - row_id: graphite_pencil
      selected_flow: Wood-cased graphite pencil
      reason: Public direct-read cbcf36d2 is a combined stationery class, not an
        atomic wood-cased graphite pencil identity. Retain exact row pending
        narrower verification.
    - row_id: prior_original_input
      selected_flow: Previously completed creative original
      reason: Earlier original identity, actual share, upstream scope and permissions
        need confirmation; prior works must not be represented by manufactured
        copy identities.
    - row_id: external_copyedit
      selected_flow: Manuscript copyediting delivery
      reason: Bounded editing search has no directly verified manuscript copyediting
        delivery with compatible supplier boundary and item unit.
    - row_id: creative_original_output
      selected_flow: Completed own-account creative original
      reason: Bounded public original/manuscript/composition searches did not yield a
        directly verified complete own-account original item identity.
        Direct-read 0bbb62f1 represents manufactured printed music for
        distribution, not this original asset. Mass property alone is not the
        rejection reason; no supported original-delivery relationship exists.
        Blank reference UUID is declared here under the candidate contract; no
        database-wide absence claim.
    - row_id: upright_piano
      selected_flow: Acoustic upright piano
      reason: Bounded public instrument candidates do not directly verify the specific
        acoustic upright-piano identity/configuration.
    - row_id: creation_server
      selected_flow: Rack-mounted creation server computer
      reason: Bounded public server candidates do not directly verify this complete
        configured rack-mounted creation-server boundary.
  unresolved_evidence:
    - Scientific and independent translation review remain pending. No published
      or methodology-approved claim.
    - Actual project/version acceptance, own-account provenance, full
      material/utility route, supplier inventories, apparatus mass/life and
      allocation records must be collected before dataset creation.
    - Other eligible artistic routes require explicit classification
      applicability; the broad category is not an unrestricted artwork method.
    - No numerical page count, artistic quality, service life, energy, material
      recipe, yield, reuse population or emission factor is assumed. Equipment
      non-computing allocation and joint-original allocation need actual causal
      evidence; missing relationships remain unresolved.
    - Apparatus ledger must reconcile cumulative manufacturing shares across
      every project and period to no more than one. Unknown lifetime/cumulative
      service or unsupported expected-life evidence requires review; period
      allocation can only use its justified portion, never repeat entire
      manufacture.
  range_evidence_needs:
    - row_ids:
        - conception_electricity_lv
        - conception_electricity_mv
        - conception_electricity_site
        - creation_electricity_lv
        - creation_electricity_mv
        - creation_electricity_site
        - fixation_electricity_lv
        - fixation_electricity_mv
        - fixation_electricity_site
        - draft_paper
        - graphite_pencil
        - prior_original_input
        - external_copyedit
        - portable_computer
        - still_camera
        - upright_piano
        - creation_server
      reason: No independently verified representative per-original numeric ranges for
        the actual genre, medium, project and sites. Collect project-specific
        amounts; omit arbitrary default ranges.
  measurement_review:
    status: passed_finite_basis_protocol_check
    prior_code: PCR_MEASUREMENT_REVIEW_REQUIRED
    rule_id: apparatus_share
    row_ids:
      - portable_computer
      - still_camera
      - upright_piano
      - creation_server
    physical_quantity: Device measured net mass kg × evidenced dimensionless
      manufacturing share / real accepted-original output count in the identical
      share scope. Original output remains 1 item; device inputs retain Mass/kg.
      Machine normalization reserved symbols and Apply directives have been
      removed as physically inappropriate.
    independent_apparatus_semantic_review: pending_coordinator_review
    actual_data_review: Required when net mass, share/lifetime denominator, count
      equivalence or cumulative ledger evidence is unknown. Finite
      basis/protocol checks do not establish actual measurements.
    scope: Finite reference/row/protocol-basis and bilingual consistency only; not
      general apparatus formula computation, empirical lifetime/net-mass proof
      or scientific approval.
