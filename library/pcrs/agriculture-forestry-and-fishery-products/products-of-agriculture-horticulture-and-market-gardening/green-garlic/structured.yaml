allocation_rules:
  - rule_id: allocation_avoid_subdivision
    applies_to: "shared field, protected-unit, and packing activities"
    rule: "Prefer subdivision or direct metering of activities by crop, field, campaign, product grade, and gate before applying allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_inputs
    applies_to: "shared irrigation, electricity, machinery, storage, and packing loads"
    rule: "Allocate a shared input using the most physically causal documented driver, such as measured mass, area-time, operating time, or container count. Report the driver and residual unallocated amount."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_co_products
    applies_to: "downgraded green garlic, feed, compost, or other recipient-bound outputs"
    rule: "Treat downgraded or recovered material as waste unless a documented recipient, intended use, quality, and hand-off demonstrate a co-product function. If allocation is required, use the stated physical driver first and disclose the alternative scenario."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "crop_establishment"
      flow_role: "planting_material_input; establishment_water_input; establishment_fuel_input; land_occupation_establishment"
      record_type: "planting log, supplier invoice, meter, fuel issue, and field register"
      raw_fields: "field or unit; lot; planting date; planted area; material mass or count; water meter or delivery; fuel quantity; occupation period"
      collection_method: "reconcile supplier, field, meter, and equipment records for each planting unit"
      unit: "kg, count, m3, L, ha, and days"
      frequency: "each planting event and monthly close"
      temporal_coverage: "full establishment period"
      site_scope: "each field, bed, or protected unit"
      aggregation_rule: "aggregate by planting unit and crop cycle before output normalization"
      quality_evidence: "signed field log, supplier record, meter reading, and source-lot trace"
    - protocol_id: cp_crop_management_records
      process_id: "crop_management"
      flow_role: "irrigation_water_input; fertilizer_soil_amendment_input; crop_protection_input; management_electricity_input; management_fuel_input; land_occupation_management"
      record_type: "irrigation log, input invoice, nutrient plan, application record, meter, fuel log, and field register"
      raw_fields: "product name; product mass; nutrient concentration; application date; treated area; water source and volume; electricity; fuel; crop area and occupation period"
      collection_method: "collect per application or meter interval and reconcile to field and crop-cycle identifiers"
      unit: "kg product, kg nutrient, m3, kWh, L, ha*a"
      frequency: "each application or meter interval, with monthly review"
      temporal_coverage: "full crop cycle"
      site_scope: "each field, bed, protected unit, or shared facility"
      aggregation_rule: "aggregate per crop cycle and allocate shared facility loads by declared physical driver"
      quality_evidence: "application record, supplier or laboratory specification, water record, meter, and crop map"
    - protocol_id: cp_soil_emission_inputs
      process_id: "crop_management"
      flow_role: "soil_nitrous_oxide_emission; soil_ammonia_emission; soil_nitrate_leaching"
      record_type: "nitrogen balance, soil test, drainage or water-quality record, emission-factor worksheet"
      raw_fields: "nutrient product and N content; organic input; irrigation; soil or drainage result; application method; selected factor or model"
      collection_method: "calculate from traceable nitrogen inputs and measured site evidence where available; retain method version"
      unit: "kg N, kg N2O, kg NH3, kg NO3- or kg N"
      frequency: "each crop cycle and after material method change"
      temporal_coverage: "full crop cycle"
      site_scope: "each field or protected unit"
      aggregation_rule: "calculate by field and crop cycle, then normalize to marketable output"
      quality_evidence: "signed factor worksheet, test report, sample record, and method disclosure"
    - protocol_id: cp_harvest_grade_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "harvest_reject_waste; marketable_green_garlic_output; crop_residue_output"
      record_type: "harvest ticket, scale ticket, grade sheet, residue log, and fate record"
      raw_fields: "harvest or lifting date; gross mass; marketable mass; grade; rejects; trimming; field residue; fate; moisture or condition notes"
      collection_method: "weigh each round or use a documented sampling and reconciliation method"
      unit: "kg and declared grade fraction"
      frequency: "every harvest or lifting round"
      temporal_coverage: "complete harvest campaign"
      site_scope: "each field, lot, and gate"
      aggregation_rule: "reconcile gross harvest to marketable output, rejects, residues, and losses before normalization"
      quality_evidence: "calibrated scale, signed grade sheet, lot trace, and recipient or treatment record"
    - protocol_id: cp_gate_handling_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "harvest_fuel_input; wash_water_input; gate_electricity_input; primary_container_packaging; gate_wastewater; packaging_waste_output"
      record_type: "wash batch log, water meter, electricity meter, packaging issue and return record, fuel log, and discharge record"
      raw_fields: "batch mass; wash-water input and discharge; water quality; electricity; fuel; container tare and reuse; waste quantity; destination"
      collection_method: "collect by batch or meter interval and link to harvest lot and gate"
      unit: "kg, m3, kWh, L, and kg packaging"
      frequency: "each batch or meter interval"
      temporal_coverage: "complete pre-gate campaign"
      site_scope: "pack-house, field pack station, or declared handling site"
      aggregation_rule: "aggregate by harvest campaign and allocate shared utilities by batch mass or operating time"
      quality_evidence: "calibrated meters, wash-water quality record, packaging count, discharge record, and lot trace"
    - protocol_id: cp_transport_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "pre_gate_transport_input"
      record_type: "carrier record, dispatch note, route record, and scale ticket"
      raw_fields: "transported mass; origin and destination; one-way distance; vehicle type; load factor; return leg; date"
      collection_method: "calculate service from documented shipment and route records"
      unit: "t*km, t, km, and vehicle class"
      frequency: "each shipment"
      temporal_coverage: "complete pre-gate transport period"
      site_scope: "each shipment route"
      aggregation_rule: "aggregate by shipment and normalize to marketable gate output"
      quality_evidence: "dispatch note, scale ticket, route evidence, and carrier record"
  calculation_rules:
    - id: calc_output_normalization
      applies_to: "all process inputs and outputs"
      rule: "Normalize each crop-cycle quantity as recorded quantity / measured marketable green-garlic output * 1,000 kg. Keep the unnormalized record for audit."
      inputs:
        - "field or facility record"
        - "marketable output"
      output: "PCR-normalized amount"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_basis
      applies_to: "fertilizer_soil_amendment_input"
      rule: "For each actually applied product, calculate nutrient mass as product mass * documented nutrient fraction; retain product mass and each nutrient equivalent as separate fields."
      inputs:
        - "product mass"
        - "supplier or laboratory nutrient concentration"
      output: "kg product and kg nutrient"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_area_time
      applies_to: "land_occupation_establishment; land_occupation_management"
      rule: "Calculate area-time as occupied area * declared occupation duration, then attribute it to the crop-cycle output."
      inputs:
        - area
        - "occupation dates"
      output: "ha*a"
      source_ids:
        - mass-balance-identity
    - id: calc_soil_nitrogen_emissions
      applies_to: "soil_nitrous_oxide_emission; soil_ammonia_emission; soil_nitrate_leaching"
      rule: "Apply the selected measured or factor-based nitrogen method to documented nitrogen inputs, organic additions, irrigation, soil, and drainage evidence. Record direct, indirect, or leaching components separately when supported."
      inputs:
        - "nutrient basis"
        - "soil and drainage records"
        - "selected factor or model"
      output: "declared pollutant amount"
      source_ids:
        - ipcc-2019-refinement-managed-soils
    - id: calc_harvest_mass_balance
      applies_to: "marketable_green_garlic_output; harvest_reject_waste; crop_residue_output"
      rule: "Reconcile gross harvested mass to marketable output, downgraded or rejected mass, field residue, trimming, and measured loss. Investigate any unexplained residual before normalization."
      inputs:
        - "harvest tickets"
        - "grade sheets"
        - "residue and loss records"
      output: "reconciled output and waste streams"
      source_ids:
        - mass-balance-identity
    - id: calc_wash_wastewater
      applies_to: "wash_water_input; gate_wastewater"
      rule: "Calculate wastewater as measured discharge or as wash-water input - retained water - documented evaporation or other loss; retain the chosen balance basis."
      inputs:
        - "wash-water meter"
        - "discharge meter"
        - "retained-water or loss record"
      output: "wastewater volume or mass"
      source_ids:
        - mass-balance-identity
        - codex-cxc-53-2003-fresh-produce
    - id: calc_transport_service
      applies_to: "pre_gate_transport_input"
      rule: "Calculate tonne-kilometres as transported mass in tonnes * documented one-way distance in kilometres; disclose shared loads and empty-return treatment."
      inputs:
        - "shipment mass"
        - "route distance"
        - "load and return record"
      output: "t*km"
      source_ids:
        - codex-cxc-53-2003-fresh-produce
  data_quality_requirements:
    - id: quality_identity_traceability
      applies_to: "reference flow, planting material, inputs, outputs, and gate"
      requirement: "Identify the crop variety or cultivar group, lot, production unit, route, gate, and all selected semantic flow roles. Keep platform identity resolution separate from the semantic category until verified."
      evidence: "field map, lot records, product descriptions, and identity evidence gap review"
    - id: quality_input_records
      applies_to: "planting material, water, nutrient products, crop protection, energy, packaging, and transport"
      requirement: "Provide supplier, meter, invoice, application, or carrier records with dates, quantities, units, and the production unit to which each record belongs."
      evidence: "fao-good-agricultural-practices; codex-cxc-53-2003-fresh-produce"
    - id: quality_output_reconciliation
      applies_to: "marketable output, rejects, residues, wastewater, and packaging waste"
      requirement: "Reconcile each harvest or handling round and disclose sampling, scale calibration, missing records, and final destination for each residual stream."
      evidence: "mass-balance-identity; codex-cxc-53-2003-fresh-produce"
    - id: quality_nutrient_and_emission_method
      applies_to: "fertilizer or soil amendments and soil emissions"
      requirement: "Report product nutrient basis, organic input basis, emission or leaching factors, measurement method, and method version. Do not infer pollutant amounts from product identity alone."
      evidence: "ipcc-2019-refinement-managed-soils; fao-good-agricultural-practices"
    - id: quality_temporal_and_geographic_scope
      applies_to: "complete foreground package"
      requirement: "Cover one complete crop cycle and harvest campaign, identify production geography and protected or open-field route, and explain any seasonal or site aggregation."
      evidence: "field register, crop calendar, and route declaration"
    - id: quality_water_and_hygiene
      applies_to: "irrigation, fertigation, washing, and gate preparation"
      requirement: "Record intended water use, source, quality evidence, reuse or recirculation, discharge destination, and proximity to harvest or edible plant contact."
      evidence: "codex-cxc-53-2003-fresh-produce"
    - id: quality_uncertainty_disclosure
      applies_to: "all normalized amounts and calculated emissions"
      requirement: "State measured, calculated, estimated, sampled, or missing values; retain range and allocation assumptions; and flag any provisional estimate for replacement by reviewed evidence."
      evidence: "dataset metadata, calculation worksheet, and QA log"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference flow and all inventory rows"
    rule: "Confirm that the semantic green-garlic reference product, flow property, unit group, and every resolved flow identity match the declared fresh whole product state, direction, flow type, and gate. Keep identity evidence gaps visible for later resolution."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_mass_balance
    applies_to: "harvest, grading, residue, wastewater, and packaging records"
    rule: "Check that recorded inputs, gross harvested mass, marketable output, rejects, residues, losses, wash-water balance, and packaging discards reconcile within the disclosed measurement uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_nutrient_basis
    applies_to: "fertilizer or soil-amendment input and soil emissions"
    rule: "Check that each nutrient equivalent is traceable to an actually applied product and documented concentration, that compound nutrients are not double counted, and that emission calculations use a disclosed method."
    source_ids:
      - fao-good-agricultural-practices
      - ipcc-2019-refinement-managed-soils
  - rule_id: validation_water_and_hygiene
    applies_to: "irrigation, fertigation, washing, wastewater, and gate hand-off"
    rule: "Check source, volume, intended use, quality evidence, reuse, discharge route, and timing against the declared crop and harvest route."
    source_ids:
      - codex-cxc-53-2003-fresh-produce
  - rule_id: validation_temporal_scope
    applies_to: "process map and foreground records"
    rule: "Check that every required process is represented, all planting and harvest rounds are included, and no post-gate activity or excluded infrastructure is silently mixed into the crop-cycle dataset."
    source_ids:
      - fao-good-agricultural-practices
published_dataset_profile:
  dataset_role: "Foreground green-garlic production dataset suitable for a secondary_dataset projection; a background_dataset projection requires additional regional aggregation and review"
  downstream_use: "Constructing fresh-green-garlic process datasets and lifecycle models at the declared farm-gate or pack-house boundary; optional regional background use after aggregation"
  allowed_use: "Comparative LCA and footprint modelling when crop cycle, route, gate, product qualifiers, allocation, water, nutrient, emissions, and uncertainty metadata are preserved"
  excluded_use: "Mature garlic, processed garlic, retail or consumer stages, unreported post-gate transport, infrastructure manufacture, land-use change, or cross-region extrapolation without a documented representativeness assessment"
  required_metadata: "PCR id and version; reference amount and unit; product maturity and condition; variety or cultivar group; geography; route; planting and harvest dates; planting-material source; actual nutrient products and nutrient basis; crop protection; water source and use; energy; harvest reconciliation; rejects and residues; packaging; gate; and waste fate"
  required_quality_disclosure: "temporal and geographic coverage; measured versus calculated values; factor or model versions; sampling and scale evidence; allocation drivers; missingness; provisional estimates; evidence gap flow identities; and uncertainty or sensitivity treatment"
  update_trigger: "New reviewed flow or property identity; material change in cultivation or gate route; new nutrient, water, emission, packaging, or allocation evidence; repeated QA findings; changed classification scope; or a new crop-cycle data basis"
