      applies_to: "planting material and supplied inputs"
      rule: "Record planting material and purchased agricultural inputs at the received hand-off state and require linked upstream datasets. Do not recreate production of same-category planting material inside the green-garlic foreground cycle."
      source_ids:
        - fao-good-agricultural-practices
    - rule_id: boundary_harvest_gate
      applies_to: "harvest, sorting, washing, cooling, trimming, packing, and pre-gate transport"
      rule: "End the default foreground boundary at the declared farm-gate or pack-house gate. Include pre-gate handling and transport only when they occur before that gate and are recorded for the represented crop cycle."
      source_ids:
        - codex-cxc-53-2003-fresh-produce
    - rule_id: boundary_residue_fate
      applies_to: "field residue, rejects, wastewater, and packaging waste"
      rule: "Record return to soil, composting, feed use, treatment, transport, or disposal for each residue stream. Do not assign a co-product credit without a documented recipient, intended use, quality, and hand-off."
