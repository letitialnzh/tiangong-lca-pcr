allocation_rules:
  - rule_id: allocation_outputs
    applies_to: "Multiple intended outputs"
    rule: "Use subdivision first. If shared burdens remain, use a documented causal physical relation where defensible; otherwise document the selected allocation basis and sensitivity. Waste and field residue without intended product function receive no co-product allocation."
    source_ids:
      - iso-14044-allocation
  - rule_id: allocation_periods
    applies_to: "Establishment and productive periods"
    rule: "Attribute establishment or multi-year burdens across declared productive outputs using recorded production history or an explicit forecast, and prevent duplicate attribution to each year."
    source_ids:
      - iso-14044-allocation
  - rule_id: allocation_rejects
    applies_to: "Lower grades, rejects and rework"
    rule: "Trace each lot to accepted product, lower grade, rework, recovery, soil return or discard. Count accepted material at its final handoff and include rework inputs once."
    source_ids:
      - iso-14044-allocation
  - rule_id: allocation_shared_assets
    applies_to: "Shared fields, machinery and conditioning assets"
    rule: "Prefer metered use or operating time; otherwise use a documented physical driver. Enumerate consuming nodes and periods and prevent duplicate burdens."
    source_ids:
      - iso-14044-allocation
