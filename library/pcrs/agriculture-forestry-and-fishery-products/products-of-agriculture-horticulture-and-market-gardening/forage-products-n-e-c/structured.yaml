allocation_rules:
  - rule_id: allocation_outputs
    applies_to: "Multiple intended outputs"
    rule: "Use subdivision first. If shared burdens remain, use a documented causal physical relation where defensible; otherwise document the selected allocation basis and sensitivity. Waste and field residue without intended product function receive no co-product allocation."
    source_ids:
      - iso-14044-allocation
  - rule_id: allocation_periods
    applies_to: "Establishment and productive periods"
    rule: "Attribute establishment or multi-year burdens across declared productive outputs using recorded production history or an explicit forecast, and prevent duplicate attribution to each year."
    source_ids:
      - iso-14044-allocation
  - rule_id: allocation_rejects
    applies_to: "Lower grades, rejects and rework"
    rule: "Trace each lot to accepted product, lower grade, rework, recovery, soil return or discard. Count accepted material at its final handoff and include rework inputs once."
    source_ids:
      - iso-14044-allocation
  - rule_id: allocation_shared_assets
    applies_to: "Shared fields, machinery and conditioning assets"
    rule: "Prefer metered use or operating time; otherwise use a documented physical driver. Enumerate consuming nodes and periods and prevent duplicate burdens."
    source_ids:
      - iso-14044-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_propagation
      process_id: "forage_crop_production"
      flow_role: "propagation_material"
      record_type: "supplier or transfer record"
      raw_fields: "species, variety, form, amount, date, field, source"
      collection_method: "Reconcile invoices and internal transfers"
      unit: "kg or count"
      frequency: "each planting"
      temporal_coverage: "all establishment events"
      site_scope: "declared field"
      aggregation_rule: "sum by product, field and crop period"
      quality_evidence: "invoice, lot and unit checks"
    - protocol_id: cp_nutrients
      process_id: "forage_crop_production"
      flow_role: "nutrient_inputs; soil_n2o"
      record_type: "application log and invoice"
      raw_fields: "product, mass, nutrient grade, N form, field, date, crop period"
      collection_method: "Reconcile purchases, application logs and composition"
      unit: "kg product and kg nutrient"
      frequency: "each application"
      temporal_coverage: "all crop periods"
      site_scope: "declared fields"
      aggregation_rule: "retain each product under one consolidated card and calculate nutrients"
      quality_evidence: "invoice, application calibration and method record"
    - protocol_id: cp_crop_protection
      process_id: "forage_crop_production"
      flow_role: "crop_protection_inputs"
      record_type: "application and supplier record"
      raw_fields: "product, active ingredient, amount, area, date, target"
      collection_method: "Reconcile applied quantity with purchases"
      unit: "kg product"
      frequency: "each application"
      temporal_coverage: "all crop periods"
      site_scope: "declared fields"
      aggregation_rule: "sum actual applications by lot and period"
      quality_evidence: "label, invoice and operator log"
    - protocol_id: cp_irrigation
      process_id: "forage_crop_production"
      flow_role: "irrigation_water"
      record_type: "meter or supplier record"
      raw_fields: "source, volume, date, area, field, crop period"
      collection_method: "Read calibrated meter or reconcile invoices"
      unit: "m3"
      frequency: "each event or billing period"
      temporal_coverage: "each crop period"
      site_scope: "field and water source"
      aggregation_rule: "sum by field and period; normalize to output"
      quality_evidence: "meter calibration and invoice"
    - protocol_id: cp_production_energy
      process_id: "forage_crop_production"
      flow_role: "production_energy"
      record_type: "meter, receipt and equipment log"
      raw_fields: "carrier, amount, unit, operation, date, field, shared use"
      collection_method: "Reconcile energy and operating records"
      unit: "native carrier unit"
      frequency: "each operation"
      temporal_coverage: "each crop period"
      site_scope: "site and equipment"
      aggregation_rule: "sum by carrier; allocate shared use by measured operation"
      quality_evidence: "meter, invoice and equipment log"
    - protocol_id: cp_land_history
      process_id: "forage_crop_production"
      flow_role: "land_occupation; land_transformation"
      record_type: "field and geospatial record"
      raw_fields: "boundary, area, dates, prior cover, crop period"
      collection_method: "Reconcile maps with dated land evidence"
      unit: "ha, ha·year"
      frequency: "each crop period and conversion"
      temporal_coverage: "full attribution period"
      site_scope: "declared fields"
      aggregation_rule: "calculate area-time and allocate transformation once"
      quality_evidence: "map, register and dated evidence"
    - protocol_id: cp_harvest_lot
      process_id: "forage_crop_production_forage_harvest"
      flow_role: "harvest_ready_forage; harvest_ready_batch; harvested_forage"
      record_type: "lot and scale record"
      raw_fields: "species, plant part, field, dates, gross, tare, net, moisture, destination"
      collection_method: "Weigh each lot and match handoffs"
      unit: "kg and moisture"
      frequency: "each lot"
      temporal_coverage: "each harvest"
      site_scope: "field and receiving node"
      aggregation_rule: "reconcile inter-process transfers without duplicate final output"
      quality_evidence: "scale calibration, lot and moisture record"
    - protocol_id: cp_residues
      process_id: "forage_crop_production_forage_harvest"
      flow_role: "production_residue_removed; residue_to_soil"
      record_type: "sample and disposition record"
      raw_fields: "biomass type, wet/dry mass, field, period, destination"
      collection_method: "Sample or weigh and document destination"
      unit: "kg dry matter"
      frequency: "each crop period"
      temporal_coverage: "all included periods"
      site_scope: "field and residue type"
      aggregation_rule: "partition among soil return, intended output and removal"
      quality_evidence: "sampling, dry-matter and destination evidence"
    - protocol_id: cp_harvest_energy
      process_id: "forage_harvest"
      flow_role: "harvest_energy"
      record_type: "fuel, meter and machinery log"
      raw_fields: "carrier, amount, equipment, operation, field, lot"
      collection_method: "Reconcile consumption to harvest lots"
      unit: "native carrier unit"
      frequency: "each operation"
      temporal_coverage: "each harvest"
      site_scope: "equipment and field"
      aggregation_rule: "sum by carrier and normalize to accepted output"
      quality_evidence: "invoice, meter and machinery log"
    - protocol_id: cp_grade_disposition
      process_id: "forage_harvest_primary_forage_conditioning"
      flow_role: "lower_grade_forage; harvest_rejects; conditioned_lower_grade; conditioning_rejects"
      record_type: "grade, scale and destination record"
      raw_fields: "identity, grade, mass, moisture, intended use, destination, lot"
      collection_method: "Inspect and weigh each grade and destination"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "each harvest or conditioning campaign"
      site_scope: "lot and handoff"
      aggregation_rule: "mutually exclusive accepted, lower grade, rework and waste partition"
      quality_evidence: "grade sheet, scale and disposition evidence"
    - protocol_id: cp_conditioning_batch
      process_id: "primary_forage_conditioning"
      flow_role: "raw_forage_batch; conditioned_forage"
      record_type: "receiving and output lot record"
      raw_fields: "input/output mass, moisture, species, form, grade, route, lot"
      collection_method: "Match intake and output lots and measure moisture"
      unit: "kg and moisture"
      frequency: "each batch"
      temporal_coverage: "included operations"
      site_scope: "conditioning site"
      aggregation_rule: "reconcile products, rejects, removed water and loss"
      quality_evidence: "calibrated scale, moisture and lot balance"
    - protocol_id: cp_conditioning_water
      process_id: "primary_forage_conditioning"
      flow_role: "conditioning_water"
      record_type: "meter or batch record"
      raw_fields: "source, fresh volume, recirculation, batch, date"
      collection_method: "Meter or reconcile tank and supplier records"
      unit: "m3"
      frequency: "each batch"
      temporal_coverage: "wet-conditioning periods"
      site_scope: "conditioning site"
      aggregation_rule: "separate fresh from recirculated water"
      quality_evidence: "meter/tank calibration and batch log"
    - protocol_id: cp_conditioning_energy
      process_id: "primary_forage_conditioning"
      flow_role: "conditioning_energy; conditioning_dust"
      record_type: "meter, fuel and equipment log"
      raw_fields: "carrier, amount, equipment, operation, batch, time, dust measurement"
      collection_method: "Reconcile measured energy and any emission method to batch"
      unit: "native carrier unit and kg dust"
      frequency: "each batch"
      temporal_coverage: "conditioning campaign"
      site_scope: "site and equipment"
      aggregation_rule: "sum by carrier and operation; preserve particulate fraction"
      quality_evidence: "meter, invoice, equipment and sampling record"
    - protocol_id: cp_transport
      process_id: "primary_forage_conditioning"
      flow_role: "field_transport"
      record_type: "waybill and route record"
      raw_fields: "mass, origin, destination, loaded distance, vehicle, return trip"
      collection_method: "Reconcile route and mass to lot"
      unit: "t, km and t·km"
      frequency: "each transfer"
      temporal_coverage: "included field-to-site routes"
      site_scope: "route and lot"
      aggregation_rule: "tonnes multiplied by loaded kilometres"
      quality_evidence: "waybill, route and scale record"
    - protocol_id: cp_wastewater
      process_id: "primary_forage_conditioning"
      flow_role: "wastewater_treatment; conditioning_wastewater"
      record_type: "meter, discharge and provider record"
      raw_fields: "volume, batch, operation, destination, provider, route"
      collection_method: "Meter or reconcile generated and treated quantities"
      unit: "m3"
      frequency: "each batch or billing period"
      temporal_coverage: "wet-conditioning periods"
      site_scope: "site and provider"
      aggregation_rule: "reconcile generation, reuse, discharge and treatment"
      quality_evidence: "meter, invoice and treatment evidence"
  calculation_rules:
    - id: normalize_reference
      applies_to: "All processes"
      rule: "Divide each process exchange by net reference-product mass at the selected gate while retaining crop-period and lot linkage."
      inputs:
        - "Process amount"
        - "net reference mass"
        - gate
        - "crop period and lot"
      output: "Exchange per 1 kg reference forage"
      source_ids:
        - mass-balance-identity
    - id: convert_dry_matter
      applies_to: "Fresh, wilted and dried forage"
      rule: "Dry matter = measured wet mass × (1 − moisture fraction on wet basis); inverse conversion requires the target moisture."
      inputs:
        - "Wet mass"
        - "moisture test and basis"
      output: "Dry mass or converted product mass"
      source_ids:
        - fao-grassland-forage
    - id: calculate_n2o
      applies_to: "Direct soil N2O"
      rule: "Apply the declared IPCC managed-soils equation and factor to collected N activity data; convert N2O-N to N2O when required by the method."
      inputs:
        - "N inputs"
        - factor
        - tier
        - "soil and climate fields"
      output: "kg direct N2O per reference flow"
      source_ids:
        - ipcc-2019-managed-soils
    - id: reconcile_lot
      applies_to: "Harvest and conditioning"
      rule: "On one moisture basis, input equals intended outputs plus lower grades, rejects, residues, removed water and measured loss."
      inputs:
        - "Lot masses"
        - grades
        - "moisture and destinations"
      output: "Reconciled mutually exclusive lot balance"
      source_ids:
        - mass-balance-identity
    - id: road_transport_work
      applies_to: "Field-to-conditioner transport"
      rule: "Transport work = net transported tonnes × loaded route kilometres; apply return treatment only when evidenced."
      inputs:
        - "Net mass"
        - "loaded distance and return record"
      output: "t·km by lot"
      source_ids:
        - iso-14044-allocation
  data_quality_requirements:
    - id: identity_gate
      applies_to: "Reference product"
      requirement: "Record one species/product, plant part, form, moisture/dry matter, grade, crop period, production system and exclusive gate."
      evidence: "Lot identity, product description and reviewed flow evidence"
    - id: period_coverage
      applies_to: "Production periods"
      requirement: "Include establishment and productive periods when relevant and retain period-specific yield and attribution records."
      evidence: "Field register, planting/harvest dates and yield history"
    - id: input_completeness
      applies_to: "All process inputs"
      requirement: "Reconcile propagation material, one consolidated nutrient-card detail, protection products, water, energy, transport and treatment inputs to primary records."
      evidence: "Invoices, logs, meters and Flow Set resolution evidence"
    - id: output_reconciliation
      applies_to: "All outputs"
      requirement: "Partition accepted product, lower grades, rejects, residues, wastewater and losses into mutually exclusive destinations."
      evidence: "Scale, grade, moisture and disposition records"
    - id: range_replacement
      applies_to: "Provisional ranges"
      requirement: "Use reasoned ranges only for screening and replace them with product-, region-, technology- and gate-specific evidence before reviewed or active use."
      evidence: "Reviewed records or external quantitative evidence"
    - id: unresolved_identity
      applies_to: "UUID-bearing flows"
      requirement: "Retain blank UUIDs until one exact product, property, unit group and context are confirmed; do not substitute compound feed, alfalfa or grazing-service identities."
      evidence: "Identity lookup and detail-read audit record"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Reference product"
    rule: "Require one named forage species/product, plant part or harvested portion, form, moisture or dry-matter state, crop period, grade and selected gate."
    source_ids:
      - unsd-cpc-01919
  - rule_id: validate_exclusions
    applies_to: "Category boundary"
    rule: "Reject maize forage, alfalfa, cereal straw/husks, non-forage crops, compound feed, mixtures and grazing-service inventories."
    source_ids:
      - unsd-cpc-01919
  - rule_id: validate_gate
    applies_to: "Process graph"
    rule: "Require one exclusive reference gate and reconcile every inter-process handoff without counting the same material as both intermediate and final product."
    source_ids:
      - fao-grassland-forage
  - rule_id: validate_mass_moisture
    applies_to: "Harvest and conditioning lots"
    rule: "Reconcile inputs, products, lower grades, residues, wastewater, removed moisture and losses on a consistent moisture or dry-matter basis; investigate output above input."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_flow_sets
    applies_to: "Product inputs"
    rule: "Require one set-only agricultural nutrient card in the cultivation process with no group or fixed UUID. Validate water and transport groups and set-level energy against the registry version, then resolve final foreground exchanges from actual records."
    source_ids: []
  - rule_id: validate_periods
    applies_to: "Crop periods"
    rule: "Reconcile establishment and productive periods and ensure shared assets and multi-period burdens are attributed once."
    source_ids:
      - iso-14044-allocation
  - rule_id: validate_destinations
    applies_to: "Grades, rejects and residues"
    rule: "Require mutually exclusive intended-product, lower-grade, rework, recovery, soil-return and waste destinations; do not count rejects as accepted product."
    source_ids:
      - iso-14044-allocation
  - rule_id: validate_n2o
    applies_to: "Direct soil N2O"
    rule: "Require documented nitrogen activity data, selected IPCC equation, factor and tier; keep direct and indirect pathways separate and avoid double counting."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validate_conditioning
    applies_to: "Conditional conditioning routes"
    rule: "Confirm each declared wilting, drying, chopping, baling, pelleting, cleaning or grading operation occurred and has inputs, output state, losses and handoff recorded; omit inactive routes."
    source_ids:
      - fao-grassland-forage
  - rule_id: validate_ranges
    applies_to: "All inventory cards"
    rule: "Check each Range against its amount rule, unit, denominator and route condition. Treat reasoned estimates as replaceable screening values before reviewed or active use."
    source_ids: []
published_dataset_profile:
  dataset_role: "Primary foreground production and first-handoff dataset for one named forage product"
  downstream_use: "secondary_dataset for foreground process packages and lifecyclemodel projections; background_dataset only when boundary and representativeness are suitable"
  allowed_use: "One named CPC 01919 forage at declared site, crop period, production system, moisture/dry matter, form and gate"
  excluded_use: "Average of all forage; maize forage; alfalfa; straw/husks; compound feed; grazing service; later feed manufacture"
  required_metadata: "species/product; plant part; variety when known; field and geography; crop period; production and harvest route; moisture/dry matter; form and grade; gate; input records; conditioning operations; attribution method"
  required_quality_disclosure: "UUID gaps; measurement and source coverage; period attribution; Range evidence tier; moisture and mass balance; shared-asset allocation; emission method; site and year representativeness"
  update_trigger: "New product or route; changed gate, form or moisture state; new verified reference identity; updated crop-period, attribution, emission or conditioning evidence; replacement of provisional Ranges with reviewed evidence"
