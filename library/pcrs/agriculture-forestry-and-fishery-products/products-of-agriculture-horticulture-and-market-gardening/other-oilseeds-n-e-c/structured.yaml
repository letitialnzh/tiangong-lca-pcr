allocation_rules:
  - rule_id: direct_assignment
    applies_to: "all nodes"
    rule: "Directly assign measurable species-, field-, batch-, grade- and use-specific inputs."
    source_ids:
      - mass-balance-identity
  - rule_id: multi_output
    applies_to: "saleable seed grades and species-specific co-products"
    rule: "Record every intended output separately; allocate shared burdens by mass at the declared moisture basis unless reviewed economic evidence supports another rule."
    source_ids:
      - mass-balance-identity
  - rule_id: residue_fate
    applies_to: "stalks, hulls, pods and rejects"
    rule: "Treat as a co-product only with an independent saleable destination and reference flow; otherwise record residue or waste and fate."
    source_ids:
      - mass-balance-identity
  - rule_id: shared_assets
    applies_to: "shared machinery, drying and storage"
    rule: "Attribute once by measured hours, energy or throughput and prevent duplication between field and conditioning nodes."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field
      process_id: "managed_production"
      flow_role: "field inputs"
      record_type: "primary activity record"
      raw_fields: "species, field area, planting, product IDs, nutrient composition, water and protection products"
      collection_method: "field log, invoices and meters; Raw aggregation and attribution: sum by product and field-cycle; each nutrient product once"
      unit: "ha; kg; m3; L"
      frequency: "each operation"
      temporal_coverage: "complete crop cycle"
      site_scope: "declared field or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, labels, calibrated meters"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "energy carriers"
      record_type: "meter or allocation record"
      raw_fields: "carrier, quantity, unit, equipment, hours and process"
      collection_method: "meter, fuel ticket or equipment log; Raw aggregation and attribution: sum by carrier and assign once to process"
      unit: "kWh; MJ; L; kg"
      frequency: "each operation or batch"
      temporal_coverage: "complete crop cycle and conditioning lots"
      site_scope: "named field and facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration, invoices, machine logs"
    - protocol_id: cp_yield
      process_id: "managed_production"
      flow_role: "crop yield"
      record_type: "weighing and survey record"
      raw_fields: "standing estimate, harvested mass, area and loss"
      collection_method: "calibrated scale and field survey; Raw aggregation and attribution: reconcile standing, harvested and field-loss mass"
      unit: "kg; ha"
      frequency: "each harvest lot"
      temporal_coverage: "complete harvest window"
      site_scope: "field and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale certificate and survey sheet"
    - protocol_id: cp_emissions
      process_id: "managed_production"
      flow_role: "soil emissions"
      record_type: "calculation input record"
      raw_fields: "N inputs, species, medium, soil and method factors"
      collection_method: "nutrient ledger and declared method; Raw aggregation and attribution: calculate separately by species and receiving medium"
      unit: "kg N; kg emission"
      frequency: "each crop cycle"
      temporal_coverage: "all managed periods"
      site_scope: "field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "nutrient ledger and method sheet"
    - protocol_id: cp_harvest
      process_id: "harvest_and_extraction"
      flow_role: "seed and residues"
      record_type: "lot mass record"
      raw_fields: "gross crop, raw seed, residues, losses, technology and destination"
      collection_method: "calibrated weighing and lot log; Raw aggregation and attribution: mass reconcile all outputs and stock change"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "complete harvest window"
      site_scope: "field and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale certificate and lot tickets"
    - protocol_id: cp_conditioning
      process_id: "drying_and_conditioning"
      flow_role: "moisture, product and rejects"
      record_type: "batch record"
      raw_fields: "incoming and outgoing mass, moisture, foreign matter, dust, water and route"
      collection_method: "scale, moisture test, meter and batch log; Raw aggregation and attribution: dry-matter and wet-mass reconciliation by batch"
      unit: "kg; %; m3"
      frequency: "each batch"
      temporal_coverage: "all conditioning batches"
      site_scope: "conditioning line and batch"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale and moisture calibration, batch sheet"
    - protocol_id: cp_packaging
      process_id: "grading_packaging_and_storage"
      flow_role: "packaging"
      record_type: "material issue record"
      raw_fields: "material type, mass, count, reuse and product lot"
      collection_method: "warehouse issue and packaging log; Raw aggregation and attribution: sum virgin and reused materials separately"
      unit: "kg; item"
      frequency: "each lot"
      temporal_coverage: "all packed lots"
      site_scope: "packing line and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, issue ticket, count check"
    - protocol_id: cp_final
      process_id: "grading_packaging_and_storage"
      flow_role: "grades and reference product"
      record_type: "final lot record"
      raw_fields: "species, use, moisture, grade, accepted, downgraded, rejected and stock change"
      collection_method: "calibrated scale, grade test and dispatch ticket; Raw aggregation and attribution: reconcile incoming with grades, rejects and stock change"
      unit: "kg; %"
      frequency: "each lot"
      temporal_coverage: "all released lots"
      site_scope: "facility, store and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale certificate, lab or grade report, dispatch ticket"
  calculation_rules:
    - id: normalize
      applies_to: "all inputs"
      rule: "Divide same-cycle or same-batch input by net accepted product at the declared gate."
      inputs:
        - "activity records and product mass"
      output: "inventory per kg reference product"
      source_ids: []
    - id: moisture_balance
      applies_to: "drying"
      rule: "Conserve dry matter; calculate removed water from measured incoming and outgoing moisture and check losses."
      inputs:
        - "incoming/outgoing mass and moisture"
      output: "dry-matter discrepancy"
      source_ids:
        - mass-balance-identity
    - id: lot_balance
      applies_to: "harvest and conditioning"
      rule: "Input plus stock decrease equals products, residues, wastes, releases and stock increase."
      inputs:
        - "all measured lot flows"
      output: "mass discrepancy"
      source_ids:
        - mass-balance-identity
    - id: nutrient_expand
      applies_to: "nutrient inputs"
      rule: "Emit each physical product exchange once and retain composition for analytical N/P/K; do not duplicate compound products."
      inputs:
        - "product ID"
        - "mass and composition"
      output: "concrete product exchanges and nutrient ledger"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Species, use, moisture, grade, route and gate shall all be populated."
      evidence: "lot and dispatch records"
    - id: dq_mass
      applies_to: "all processes"
      requirement: "Calibrate scales and reconcile field, harvest, conditioning and final-lot balances."
      evidence: "calibration certificates and balance sheet"
    - id: dq_route
      applies_to: "conditional processes"
      requirement: "Activate only conditioning, packaging and storage routes that actually occur."
      evidence: "operation and batch logs"
    - id: dq_binding
      applies_to: "all exchanges"
      requirement: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
      evidence: "flow identity audit"
validation_rules:
  - rule_id: validate_other
    applies_to: "product identity"
    rule: "Confirm the named species belongs in CPC 01449 and has no separate oilseed CPC leaf."
    source_ids:
      - unsd-cpc-30
  - rule_id: validate_reference
    applies_to: "reference flow"
    rule: "Check 1 kg net mass and mandatory species, use, moisture, grade and gate qualifiers."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_balance
    applies_to: "each lot"
    rule: "Reconcile inputs, outputs, losses, stock and moisture change without double-counting transfers."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_ranges
    applies_to: "every card"
    rule: "Investigate observations outside screens, but do not reject supported real measurements solely for exceeding a provisional interval."
    source_ids: []
  - rule_id: validate_sets
    applies_to: "parameterized inputs"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
published_dataset_profile:
  dataset_role: "species-, field- and batch-specific other-oilseed foreground data package"
  downstream_use: "secondary_dataset; may serve as background_dataset after geography, technology and time matching"
  allowed_use: "modelling one named CPC 01449 oilseed from production to the declared gate"
  excluded_use: "other CPC oilseeds, sowing seed, oil, meal or multi-species averages"
  required_metadata: "species, use, moisture, grade, geography, cycle, production technology, conditioning route, gate and allocation"
  required_quality_disclosure: "weighing and moisture checks, concrete flow identity verification, unresolved identities, provisional ranges and gaps"
  update_trigger: "change in species, use, technology, moisture, grade, gate, allocation or method factor"
data_sources:
  - id: "unsd-cpc-30"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0, https://unstats.un.org/unsd/classifications/Econ/cpc"
    used_for: "category boundary and residual-category decision"
  - id: "fao-grain-storage"
    type: "official_guidance"
    reference: "FAO, Grain storage techniques, https://www.fao.org/4/s1250e/S1250E0u.htm"
    used_for: "drying, cleaning, storage and moisture-record route"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation relation for mass inputs, outputs, losses and stock change"
    used_for: "batch and moisture mass reconciliation"
