      evidence: "calibration certificates and balance sheet"
    - id: dq_route
      applies_to: "conditional processes"
      requirement: "Activate only conditioning, packaging and storage routes that actually occur."
      evidence: "operation and batch logs"
    - id: dq_binding
      applies_to: "all exchanges"
      requirement: "After Flow Set expansion, each final exchange requires a verified UUID and selection evidence."
      evidence: "flow identity audit"
