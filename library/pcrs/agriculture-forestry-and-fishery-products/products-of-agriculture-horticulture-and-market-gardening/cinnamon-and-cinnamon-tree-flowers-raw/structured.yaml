allocation_rules:
  - rule_id: allocation_subdivide_routes
    applies_to: "Bark and flower routes"
    rule: "Subdivide direct route records first. Routes may coexist on a farm, but harvest and conditioning burdens are mutually exclusive for one lot."
    source_ids:
      - suriyagoda-2021-ceylon-cinnamon
      - wilson-2016-cassia-buds
  - rule_id: allocation_perennial_establishment
    applies_to: "Establishment and stand inputs"
    rule: "Attribute establishment and replacement across evidenced productive stand years and measured outputs; identify establishment, immature, productive and termination phases."
    source_ids:
      - suriyagoda-2021-ceylon-cinnamon
  - rule_id: allocation_coppice_cycles
    applies_to: "Repeated bark cycles"
    rule: "Link inputs, maintenance and output to stand year and coppice/selective-harvest cycle; prevent one event entering two cycles."
    source_ids:
      - sri-lanka-dcd-postharvest
      - suriyagoda-2021-ceylon-cinnamon
  - rule_id: allocation_intended_coproducts
    applies_to: "Bark, flowers, wood, leaves, twigs and downgraded product"
    rule: "Prefer subdivision. For inseparable burdens use documented dry-mass allocation; if the study requires economic allocation, report prices, period and sensitivity. Residues without a product destination receive no credit."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "Rework and rejects"
    rule: "Retain burdens on reworked material, link the loop once, and exclude rejects from accepted output."
    source_ids: []
  - rule_id: allocation_batch_period
    applies_to: "Lots and reporting years"
    rule: "Assign cleaning, shared handling and changeover to the causative lot or period and allocate any remainder once across measured outputs."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_stand_management
      process_id: "perennial_cinnamon_cultivation"
      flow_role: "Establishment and annual inputs"
      record_type: "field log, invoice, meter, application record"
      raw_fields: "stand_id, area, species, planting_date, planting_count, product_name, product_uuid, nutrient_composition, wet_mass, water, treated_area, date, stand_age, cycle_id"
      collection_method: "Reconcile logs to invoices and meters; retain nutrient products separately"
      unit: "item, kg, m3, ha"
      frequency: "Each event; annual aggregate"
      temporal_coverage: "Complete reporting year plus establishment records"
      site_scope: "Every included stand"
      aggregation_rule: "Sum by stand-year and identity; annualize establishment"
      quality_evidence: "invoices, labels, meters, mapped area and dated logs"
    - protocol_id: cp_energy_records
      process_id: "all_foreground_processes"
      flow_role: "Fuel and electricity"
      record_type: "invoice, fuel log, meter"
      raw_fields: "process_id, lot_id, carrier, quantity, unit, date, conversion_factor"
      collection_method: "Meter or reconcile purchases and stocks"
      unit: "native unit, MJ, kWh"
      frequency: "Each lot or monthly"
      temporal_coverage: "Complete reporting year and every included lot"
      site_scope: "Every included site"
      aggregation_rule: "Convert by carrier and assign once to process, lot and period"
      quality_evidence: "invoices, calibrated meters and conversion reference"
    - protocol_id: cp_harvest_lot_balance
      process_id: "perennial_cinnamon_cultivation_bark_harvest_conditioning"
      flow_role: "Bark inputs, products, co-products and rejects"
      record_type: "harvest mass balance"
      raw_fields: "stand_id, cycle_id, lot_id, stem_mass, bark_mass_before, bark_mass_after, bark_form, wood_mass, leaf_mass, twig_mass, reject_mass, destination, moisture"
      collection_method: "Weigh every hand-off"
      unit: "kg, mass fraction"
      frequency: "Each bark lot"
      temporal_coverage: "All bark lots in the reporting year"
      site_scope: "Every bark stand and peeling site"
      aggregation_rule: "Reconcile dry matter and aggregate accepted lots to stand-year"
      quality_evidence: "scale checks, moisture test, lot linkage and receipts"
    - protocol_id: cp_flower_lot_balance
      process_id: "perennial_cinnamon_cultivation_flower_harvest_conditioning"
      flow_role: "Flower inputs, products and rejects"
      record_type: "harvest mass balance"
      raw_fields: "stand_id, lot_id, botanical_part, maturity, harvested_mass, prepared_mass, stem_mass, foreign_matter, reject_mass, destination, moisture"
      collection_method: "Weigh every hand-off and verify plant part"
      unit: "kg, mass fraction"
      frequency: "Each flower lot"
      temporal_coverage: "All flower lots in the reporting year"
      site_scope: "Every flower stand and site"
      aggregation_rule: "Reconcile product, removed matter and moisture by lot"
      quality_evidence: "scale checks, botanical record, moisture test and lot linkage"
    - protocol_id: cp_moisture_and_drying
      process_id: "bark_harvest_conditioning_flower_harvest_conditioning"
      flow_role: "Conditional drying"
      record_type: "drying log and moisture test"
      raw_fields: "lot_id, route_id, drying_active, method, start_mass, end_mass, start_moisture, end_moisture, duration, energy"
      collection_method: "Paired mass and moisture before and after drying"
      unit: "kg, mass fraction, hour, kWh"
      frequency: "Each drying lot"
      temporal_coverage: "All drying lots in the reporting year"
      site_scope: "Every drying site"
      aggregation_rule: "Calculate dry-matter closure and evaporated water; zero when inactive"
      quality_evidence: "test method, calibrated balance, timestamps and meters"
    - protocol_id: cp_grading_balance
      process_id: "farm_gate_grading"
      flow_role: "Accepted, downgraded, reworked and rejected states"
      record_type: "grading and destination record"
      raw_fields: "lot_id, route_id, incoming_mass, grade, accepted_mass, downgraded_mass, rework_mass, reject_mass, defect, destination, price"
      collection_method: "Weigh each state and link its hand-off"
      unit: "kg, currency/kg"
      frequency: "Each lot"
      temporal_coverage: "All grading lots in the reporting year"
      site_scope: "Every grading site"
      aggregation_rule: "Incoming = accepted + downgraded + reject + documented loss after one linked rework loop"
      quality_evidence: "scale checks, grade sheet, sales and reject record"
  calculation_rules:
    - id: calc_moisture_conversion
      applies_to: "Fresh and dried states"
      rule: "dry_mass = wet_mass × (1 − moisture_fraction)"
      inputs:
        - "paired mass and moisture"
      output: "dry mass"
      source_ids:
        - iso-6539-2014
    - id: calc_drying_water
      applies_to: "Conditional drying"
      rule: "evaporated_water = start_mass × start_moisture − end_mass × end_moisture"
      inputs:
        - "paired mass and moisture"
      output: "kg water to air"
      source_ids: []
    - id: calc_perennial_attribution
      applies_to: "Establishment and shared stand burdens"
      rule: "Allocate establishment across evidenced productive years; within each year assign shared burdens to separately measured outputs by the declared allocation rule."
      inputs:
        - "productive years"
        - "stand inputs"
        - "route outputs"
      output: "burden per route and reference kg"
      source_ids:
        - suriyagoda-2021-ceylon-cinnamon
    - id: calc_lot_yield
      applies_to: "Harvest lots"
      rule: "accepted_yield = accepted_mass ÷ incoming_route_mass; report co-product and reject fractions separately"
      inputs:
        - "lot mass balance"
      output: "yield and fractions"
      source_ids: []
    - id: calc_grading_balance
      applies_to: "Grading"
      rule: "incoming = accepted + downgraded + reject + documented loss; rework is one internal loop"
      inputs:
        - "grading record"
      output: "reconciled states"
      source_ids: []
    - id: calc_managed_soil_emissions
      applies_to: "Nitrogen inputs"
      rule: "Apply the named current method and factors to product-specific nitrogen inputs, climate and management and disclose factor version."
      inputs:
        - "applied N and method parameters"
      output: "direct and indirect N emissions"
      source_ids:
        - ipcc-2019-managed-soils
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Route products"
      requirement: "Verify species/type, plant part, form, flower/bud maturity, fresh/dried state and grade for every lot."
      evidence: "identity record, photograph or botanical record and grade sheet"
    - id: dq_temporal
      applies_to: "Perennial attribution"
      requirement: "Cover a complete reporting year and all included lots; disclose establishment, productive and termination phases and partial cycles."
      evidence: "dated stand and harvest records"
    - id: dq_completeness
      applies_to: "All processes"
      requirement: "Account for at least 95 percent by mass of each harvest or conditioning lot or quantify and explain the gap."
      evidence: "signed mass balance"
    - id: dq_moisture
      applies_to: "Conversions"
      requirement: "Use paired lot-specific moisture whenever fresh and dried states are compared; identify test method and date."
      evidence: "laboratory or calibrated rapid test"
    - id: dq_nutrients
      applies_to: "Nutrient supply"
      requirement: "Preserve actual product, UUID resolution, composition, moisture basis and event although the PCR has one consolidated nutrient card."
      evidence: "labels, invoices and application logs"
    - id: dq_route_separation
      applies_to: "Alternative routes"
      requirement: "Show direct inputs and outputs assigned to one route and shared stand burdens allocated once."
      evidence: "lot-to-stand linkage and allocation worksheet"
    - id: dq_representativeness
      applies_to: "Published dataset"
      requirement: "State geography, species mix, stand-age distribution, harvest regime, technology, drying share, coverage and year."
      evidence: "metadata and coverage table"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Reject missing species/type, plant part, form, moisture status, grade/destination, harvest year, cycle position or farm-gate declaration."
    source_ids: []
  - rule_id: validate_route_exclusivity
    applies_to: "Process map"
    rule: "Exactly one harvest-conditioning route supplies a reference lot; shared cultivation may be allocated, but direct route burdens cannot appear in both."
    source_ids: []
  - rule_id: validate_nutrient_binding
    applies_to: "nutrient_supply"
    rule: "Require at most one nutrient Product-input card in cultivation, bound to flow-set.agricultural-nutrient-supply version 0.3.0 with no group; foreground records must itemize products and resolve UUIDs."
    source_ids: []
  - rule_id: validate_conditional_drying
    applies_to: "Drying"
    rule: "If inactive, drying energy and removed water are zero. If active, require paired mass, moisture, duration and energy and dry-matter closure."
    source_ids:
      - sri-lanka-dcd-postharvest
  - rule_id: validate_mass_balance
    applies_to: "Harvest, conditioning and grading"
    rule: "Require lot closure within 5 percent or a documented correction; accepted, downgraded, co-product and waste states are mutually exclusive."
    source_ids: []
  - rule_id: validate_moisture
    applies_to: "Farm-dried bark"
    rule: "Ceylon-type bark claiming the cited specification shall not exceed 15 percent moisture; other species and flowers require the declared applicable specification."
    source_ids:
      - eurlex-2020-ceylon-cinnamon
      - iso-6539-2014
  - rule_id: validate_period_attribution
    applies_to: "Perennial stand and cycles"
    rule: "Identify establishment, immature, productive and termination phases; reject double attribution across stand years or cycles."
    source_ids: []
  - rule_id: validate_multioutput
    applies_to: "Intended outputs"
    rule: "Require measured hand-off and allocation decision for every intended output; residues or discards receive no product credit."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "Rejects"
    rule: "Require one rework, downgrade, recovery or disposal path; exclude unresolved rejects and count a rework loop once."
    source_ids: []
  - rule_id: validate_exclusions
    applies_to: "Boundary"
    rule: "Reject results containing distillation, grinding, extraction or manufactured-spice formulation."
    source_ids: []
