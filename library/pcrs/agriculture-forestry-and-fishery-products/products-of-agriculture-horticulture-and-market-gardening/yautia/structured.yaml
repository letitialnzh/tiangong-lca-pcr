allocation_rules:
  - rule_id: allocation_output_classification
    applies_to: "all outputs"
    rule: "Classify each output once as reference product, downgraded product, propagation material, residue, waste, or loss; record one hand-off and prohibit double counting."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_planting_material
    applies_to: "propagation output"
    rule: "Treat internally retained material as an internal transfer. For independently sold intended products, prefer subdivision; otherwise allocate remaining shared burdens by fresh mass and disclose an economic sensitivity when values differ materially."
    source_ids: []
  - rule_id: allocation_residue
    applies_to: "residues and rejects"
    rule: "Give no co-product allocation to material returned to soil or discarded without a documented product function; include its treatment burden."
    source_ids: []
  - rule_id: allocation_shared_operations
    applies_to: "shared operations"
    rule: "Assign separable inputs directly before allocating remaining shared burdens; disclose output quantities, prices where used, method and precedence."
    source_ids: []
