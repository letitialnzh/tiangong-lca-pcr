system_boundary:
  rules:
    - rule_id: boundary_managed_crop
      applies_to: "cultivation"
      rule: "Include establishment, soil/crop management, inputs, irrigation where used, field energy and direct field emissions until harvest-ready biomass is handed to lifting."
      source_ids:
        - fao-qds-2010
        - sri-lanka-doa-kiri-ala
    - rule_id: boundary_harvest
      applies_to: "lifting"
      rule: "Model lifting separately because it creates raw collected material, soil carryover, damage and uncollected loss before conditioning."
      source_ids:
        - sri-lanka-doa-kiri-ala
        - fao-aroids-postharvest
    - rule_id: boundary_conditioning
      applies_to: "conditioning"
      rule: "Include trimming, dry cleaning and washing only when performed; keep utilities, wastewater, removed soil and trimmings explicit. Curing, storage and packaging are extensions."
      source_ids:
        - codex-tannia-224-2001
    - rule_id: boundary_grading
      applies_to: "grading"
      rule: "Sort prepared material into accepted product, downgraded edible product, propagation material and rejects, and record one hand-off for every state."
      source_ids:
        - codex-tannia-224-2001
