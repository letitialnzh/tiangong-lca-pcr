  calculation_rules:
    - id: calc_cycle_normalization
      applies_to: "all process rows"
      rule: "normalized amount = recorded amount / marketable gate output * 1,000 kg."
      inputs:
        - "block records"
        - dates
        - "gate output"
      output: "normalized amount"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_nutrient_basis
      applies_to: "fertilizer and amendment rows"
      rule: "Keep product mass and N, P2O5 and K2O mass separate; calculate only from declared evidence."
      inputs:
        - "product mass"
        - "nutrient fractions or result"
      output: "product and nutrient amount"
      source_ids:
        - globalgap-ifa-fruit-vegetables-v6
    - id: calc_soil_emissions
      applies_to: "soil emission rows"
      rule: "Apply one selected IPCC-compatible nitrogen method to documented inputs and disclose factors and conversions."
      inputs:
        - "N input"
        - factors
        - qualifiers
      output: "elementary-flow amount"
      source_ids:
        - ipcc-2019-refinement-afolu
    - id: calc_mass_reconciliation
      applies_to: "harvest, gate and residue rows"
      rule: "Reconcile harvest, marketable output, rejects, residues, recovered material and documented loss."
      inputs:
        - "lot records"
        - scale
        - "destination records"
      output: "mass balance"
      source_ids:
        - fao-postharvest-handling-ae075e
