allocation_rules:
  - rule_id: allocation_reference_product
    applies_to: "all routes"
    rule: "Attribute burdens to accepted declared species/form output; do not average unlike forms without reproducible weights."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rejects_rework
    applies_to: "rejects and returns"
    rule: "Returned material retains accumulated burdens; discarded material is not accepted output; sold downgrade needs declared co-product treatment."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_multi_period
    applies_to: "stock, culture banks and assets"
    rule: "Attribute establishment, replacement and period burdens using recorded productive periods and outputs; prevent double attribution."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_shared_assets
    applies_to: "greenhouse, irrigation, culture and nursery assets"
    rule: "Use measured service, time, area or documented causal driver consistently across nodes and periods."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_included_components
    applies_to: "containers, substrate and carrier"
    rule: "Include crossing components; attribute excluded reusable assets by recorded uses and replacement/loss events."
    source_ids:
      - mass-balance-identity
