system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The boundary starts with source stock/culture, media and container inputs and includes propagation, managed nursery/culture operation, route-specific conditioning/hardening, grading, phytosanitary examination, and presentation needed for hand-off. Distribution after hand-off and buyer cultivation are excluded."
      source_ids: []
    - rule_id: boundary_single_item
      applies_to: "all datasets"
      rule: "Model one species/cultivar and one form; prohibit mixed family-label physical reference items."
      source_ids:
        - fao-nursery-practice
    - rule_id: boundary_propagation
      applies_to: "managed_propagation"
      rule: "Include source-stock establishment, multiplication, water, nutrients, protection, utilities and shared infrastructure."
      source_ids:
        - fao-nursery-practice
    - rule_id: boundary_media_container
      applies_to: "media_container_preparation"
      rule: "Include media mixing and containers when used; declare which masses remain in the delivered item."
      source_ids:
        - fao-nursery-practice
    - rule_id: boundary_conditioning
      applies_to: "conditioning_hardening"
      rule: "Include bounded pre-hand-off hardening, root pruning, acclimation and viability preservation only when performed."
      source_ids:
        - fao-nursery-practice
    - rule_id: boundary_phytosanitary
      applies_to: "grading_phytosanitary_release"
      rule: "Include traceable examination and pest-management controls defining plantable and phytosanitary state."
      source_ids:
        - ippc-ispm-36
    - rule_id: boundary_packaging
      applies_to: "presentation_handoff"
      rule: "Include materials crossing hand-off according to declared inclusion; exclude later distribution."
      source_ids:
        - fao-nursery-practice
    - rule_id: boundary_route_separation
      applies_to: "alternative routes"
      rule: "Keep topology, inputs, yields, assets and quality gates separate until reproducible weighting exists."
      source_ids:
        - fao-nursery-practice
