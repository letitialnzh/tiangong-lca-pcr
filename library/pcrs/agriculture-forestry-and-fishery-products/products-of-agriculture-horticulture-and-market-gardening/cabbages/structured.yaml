allocation_rules:
  - rule_id: allocation_subdivide_first
    applies_to: "Cultivation and harvest processes"
    rule: "Use process subdivision and mass reconciliation before allocation; do not allocate between an internal standing-crop hand-off and the same crop after harvest."
    source_ids:
      - fao-horticultural-marketing
  - rule_id: allocation_residue_classification
    applies_to: "Outer leaves and rejected heads"
    rule: "Classify field-returned leaves as residues and off-site rejected heads by actual destination; do not treat either as an intended co-product unless evidence shows a deliberate product function and market hand-off."
    source_ids:
      - ipcc-2019-managed-soils
      - fao-postharvest-loss-manual
  - rule_id: allocation_intended_coproduct
    applies_to: "Any additional revenue-bearing intended output"
    rule: "If subdivision cannot isolate an additional intended output, apply economic allocation using documented farm-gate revenues for the same reporting period and disclose prices, currency, period, and sensitivity."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_cultivation_inputs
      process_id: "field_cultivation"
      flow_role: "planting material, nutrient products, irrigation water, crop-protection products"
      record_type: "purchase, application, meter, and field-operation records"
      raw_fields: "product identity; lot; quantity; composition; active ingredient; application date; treated area; delivered water"
      collection_method: "Reconcile invoices, application logs, composition labels, irrigation meters, and field logs"
      unit: "item; kg product; kg nutrient; kg active ingredient; m3"
      frequency: "Each delivery and application"
      temporal_coverage: "Complete crop cycle"
      site_scope: "Each field and crop cycle"
      aggregation_rule: "Sum by physical identity and convert with documented composition; retain zero-use declarations"
      quality_evidence: "invoices; labels; calibration records; application logs; meter readings"
    - protocol_id: cp_field_energy
      process_id: "field_cultivation"
      flow_role: "field-operation energy"
      record_type: "fuel, electricity, and equipment-hour records"
      raw_fields: "carrier identity; quantity; unit; equipment; operation; meter or invoice period"
      collection_method: "Reconcile carrier purchases and meters to equipment and field-operation logs"
      unit: "L; kg; kWh; MJ; h"
      frequency: "Each operation or billing period"
      temporal_coverage: "Complete crop cycle"
      site_scope: "Each field and equipment set"
      aggregation_rule: "Convert each carrier to energy with documented factors and prevent double counting purchased energy and equipment estimates"
      quality_evidence: "invoices; meters; equipment logs; conversion-factor source"
    - protocol_id: cp_crop_area_cycle
      process_id: "field_cultivation"
      flow_role: "agricultural land occupation"
      record_type: "cadastral, GIS, and crop-calendar records"
      raw_fields: "planted area; establishment date; harvest-completion date; shared-area fraction"
      collection_method: "Measure or verify field area and crop occupation dates"
      unit: "ha; date"
      frequency: "Once per field and crop cycle"
      temporal_coverage: "Establishment through harvest completion"
      site_scope: "Each field"
      aggregation_rule: "Area multiplied by occupation duration; allocate shared field area by documented occupied fraction"
      quality_evidence: "GIS or cadastral record; crop calendar"
    - protocol_id: cp_crop_output
      process_id: "field_cultivation"
      flow_role: "mature cabbage crop hand-off"
      record_type: "harvest and sample-mass records"
      raw_fields: "harvested area; head count; sampled head mass; gross harvested mass; field identifier"
      collection_method: "Weigh harvest lots or calculate from stratified head-count and mass samples"
      unit: "kg wet crop"
      frequency: "Each harvest event"
      temporal_coverage: "Full harvest window"
      site_scope: "Each field and crop cycle"
      aggregation_rule: "Sum gross mature crop and reconcile with saleable and residue outputs"
      quality_evidence: "calibrated scale records; sampling plan; harvest log"
    - protocol_id: cp_soil_emissions
      process_id: "field_cultivation"
      flow_role: "managed-soil nitrous oxide"
      record_type: "nutrient, residue, soil-amendment, volatilization, leaching, and field-management records"
      raw_fields: "N inputs by pathway; residue dry matter and N content; removal fraction; emission factors; conversion basis"
      collection_method: "Apply the declared IPCC tier or justified higher-tier model to collected field records"
      unit: "kg N; kg dry matter; fraction; kg N2O-N"
      frequency: "Each application and annual or crop-cycle calculation"
      temporal_coverage: "Complete crop cycle with declared annualization"
      site_scope: "Each field and emission stratum"
      aggregation_rule: "Calculate pathway emissions separately, sum without double counting, and normalize to crop output"
      quality_evidence: "source records; factor version; calculation workbook; independent formula check"
    - protocol_id: cp_harvest_outputs
      process_id: "harvest_field_preparation"
      flow_role: "saleable heads, outer leaves, rejected heads"
      record_type: "scale, lot, grading, and destination records"
      raw_fields: "incoming crop mass; saleable mass; leaf residue mass; rejected-head mass; destination; variety; maturity; trimming and packaging state"
      collection_method: "Weigh each output where practicable and use documented representative sampling for unweighed field residues"
      unit: "kg wet mass"
      frequency: "Each harvest or dispatch lot"
      temporal_coverage: "Full harvest and field-dispatch window"
