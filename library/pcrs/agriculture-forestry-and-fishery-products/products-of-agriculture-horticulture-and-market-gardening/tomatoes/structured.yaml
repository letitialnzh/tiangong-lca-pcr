system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "establishment and crop management"
      rule: "Include production-unit preparation attributable to the crop cycle, planting, crop management, supplied water, nutrient inputs, crop protection, energy, and direct crop emissions. Disclose prior land use and exclude unrelated infrastructure construction."
      source_ids:
        - fao-tomato-good-agricultural-practices
        - fao-greenhouse-vegetables-2013
    - rule_id: boundary_route_specificity
      applies_to: "open-field, greenhouse, hydroponic, and substrate routes"
      rule: "Keep route-specific infrastructure, heating, pumping, recirculation, substrate, drainage, and crop-cycle records separate when they materially change the inventory."
      source_ids:
        - fao-greenhouse-vegetables-2013
    - rule_id: boundary_gate_preparation
      applies_to: "harvest, grading, washing, cooling, and packing"
      rule: "End the default foreground boundary at the declared farm-gate or pack-house gate. Include grading, washing, cooling, and primary packaging only when they occur before that gate."
      source_ids:
        - codex-cxs-293-2008
        - usda-ams-tomato-grade-standard
    - rule_id: boundary_nitrogen_emissions
      applies_to: "nutrient inputs, soil, drainage, and residues"
      rule: "Estimate applicable direct and indirect nitrogen emissions with one declared method using recorded nutrient inputs, drainage or leaching evidence, and residue fate. Avoid double counting pathways."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: boundary_residue_fate
      applies_to: "rejected fruit, crop residues, wash solids, and wastewater"
      rule: "Record field return, composting, feed use, treatment, transport, or disposal for each residue stream. A credit requires documented recipient, intended use, and allocation treatment."
      source_ids:
        - fao-tomato-good-agricultural-practices
        - iso-14044-2006
boundary_abstraction:
  declared_starting_condition: "Prepared field, greenhouse, hydroponic, or substrate production unit receiving tomato seed or transplant material, with prior land use and excluded infrastructure work disclosed"
  starting_condition_role: "Start of the declared tomato crop cycle and foreground input accounting"
  product_classification_scope: "Fresh whole tomatoes under CPC 3.0:01234 through the declared farm-gate or pack-house gate"
  recursive_input_rule: "Purchased tomato seed or transplants are recorded at their received hand-off state and linked once to an upstream dataset; their own production is outside this PCR unless a separate upstream dataset is supplied."
  upstream_dataset_requirement: "Require upstream datasets for seed or transplants, nutrient products, growing media, crop-protection products, irrigation water, energy, packaging, and purchased transport or treatment services when used."
  disclosure: "Declare production geography, tomato type and cultivar group, route, crop-cycle dates, planting density, irrigation and fertigation method, nutrient basis, crop-protection program, harvest rounds, accepted and rejected mass, washing and cooling, packaging, water recirculation or drainage, residue fate, and gate location."
