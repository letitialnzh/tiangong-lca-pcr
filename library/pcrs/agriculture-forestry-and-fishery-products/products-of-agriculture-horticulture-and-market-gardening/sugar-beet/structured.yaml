allocation_rules:
  - rule_id: al_01
    applies_to: "all nodes"
    rule: "Prefer subdivision; assign each field, machine-period and batch burden once."
    source_ids:
      - mass-balance-identity
  - rule_id: al_02
    applies_to: "roots and tops"
    rule: "Field-retained tops receive no product allocation. Intentionally collected tops use documented economic allocation with mass sensitivity."
    source_ids:
      - mass-balance-identity
  - rule_id: al_03
    applies_to: "grade states"
    rule: "Subdivide when possible; otherwise economically allocate accepted and marketed downgraded roots. Waste receives no product allocation."
    source_ids:
      - mass-balance-identity
  - rule_id: al_04
    applies_to: "rejects"
    rule: "Reworked material retains accumulated burden and is counted only at final hand-off."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "field_production"
      flow_role: "seed, nutrient, protection"
      record_type: "invoices/logs"
      raw_fields: "identity; mass; composition; area; date"
      collection_method: "issue-return/application reconciliation; Raw aggregation and attribution: sum by product and field"
      unit: "kg; ha"
      frequency: "event"
      temporal_coverage: "crop cycle"
      site_scope: "field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, composition, logs"
    - protocol_id: cp_irrigation
      process_id: "field_production"
      flow_role: "water"
      record_type: "meter/pump log"
      raw_fields: "meter; flow; duration; area"
      collection_method: "meter or flow×duration; Raw aggregation and attribution: sum events"
      unit: "m3; kg"
      frequency: "event"
      temporal_coverage: "season"
      site_scope: "field/source"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration/pump test"
    - protocol_id: cp_energy
      process_id: "all_operating_nodes"
      flow_role: "energy"
      record_type: "meter/fuel/machine log"
      raw_fields: "carrier; quantity; period; field/load"
      collection_method: "direct meter or documented allocation; Raw aggregation and attribution: assign once"
      unit: "L; kWh; MJ"
      frequency: "period"
      temporal_coverage: "full cycle"
      site_scope: "machine/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter and invoice reconciliation"
    - protocol_id: cp_field_yield
      process_id: "field_production"
      flow_role: "roots"
      record_type: "load and survey"
      raw_fields: "lifted mass; loss sample; area"
      collection_method: "calibrated loads plus sampling; Raw aggregation and attribution: lifted + scaled loss"
      unit: "kg; ha"
      frequency: "field"
      temporal_coverage: "harvest"
      site_scope: "field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale and sampling plan"
    - protocol_id: cp_harvest_loss
      process_id: "field_production_harvest_lifting"
      flow_role: "loss"
      record_type: "survey/balance"
      raw_fields: "mass; area; damage; destination"
      collection_method: "pre/post harvest sampling; Raw aggregation and attribution: scale and reconcile"
      unit: "kg; ha"
      frequency: "field"
      temporal_coverage: "harvest"
      site_scope: "field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "sample evidence"
    - protocol_id: cp_harvest_loads
      process_id: "harvest_lifting"
      flow_role: "lifted roots"
      record_type: "load tickets"
      raw_fields: "gross; tare; field; date; soil correction"
      collection_method: "calibrated weighing; Raw aggregation and attribution: corrected sum"
      unit: "kg"
      frequency: "load"
      temporal_coverage: "campaign"
      site_scope: "field/load"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale certificate"
    - protocol_id: cp_residues
      process_id: "harvest_lifting"
      flow_role: "tops"
      record_type: "load/destination"
      raw_fields: "mass; basis; destination"
      collection_method: "calibrated weighing; Raw aggregation and attribution: sum hand-offs"
      unit: "kg"
      frequency: "load"
      temporal_coverage: "campaign"
      site_scope: "field/destination"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "ticket/receiver"
    - protocol_id: cp_conditioning_balance
      process_id: "farm_conditioning"
      flow_role: "roots/rejects"
      record_type: "batch record"
      raw_fields: "input; output; rejects; destination"
      collection_method: "calibrated mass balance; Raw aggregation and attribution: reconcile states"
      unit: "kg"
      frequency: "batch"
      temporal_coverage: "campaign"
      site_scope: "site/field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scales and batch sheet"
    - protocol_id: cp_grading
      process_id: "grading_handoff"
      flow_role: "grades"
      record_type: "delivery record"
      raw_fields: "input; accepted; downgraded; reject; sugar; tare"
      collection_method: "scale and receiving test; Raw aggregation and attribution: reconcile grades"
      unit: "kg; %"
      frequency: "batch"
      temporal_coverage: "delivery"
      site_scope: "batch"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale, lab, receiver"
  calculation_rules:
    - id: cr_01
      applies_to: "normalization"
      rule: "field amount / same-field accepted mass × 1000 kg"
      inputs:
        - "input/emission"
        - "accepted mass"
      output: "per reference flow"
      source_ids:
        - mass-balance-identity
    - id: cr_02
      applies_to: "water"
      rule: "metered m3 × density; rainfall excluded"
      inputs:
        - "meter/flow"
        - density
      output: "kg irrigation"
      source_ids:
        - fao-crop-yield-water-2012
    - id: cr_03
      applies_to: "root balance"
      rule: "standing = lifted + field loss; input = accepted + downgraded + rejected + measured loss"
      inputs:
        - "linked mass records"
      output: "reconciled states"
      source_ids:
        - mass-balance-identity
    - id: cr_04
      applies_to: "N2O"
      rule: "declared IPCC tier applied to collected N inputs"
      inputs:
        - "N records"
        - factors
      output: "kg N2O"
      source_ids:
        - ipcc-2019-managed-soils
    - id: cr_05
      applies_to: "route aggregation"
      rule: "area-weight area intensities and accepted-mass-weight reference intensities"
      inputs:
        - "stratum records"
      output: "production mix"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_01
      applies_to: "traceability"
      requirement: "Link field, load, batch and delivery identifiers."
      evidence: "registers and tickets"
    - id: dq_02
      applies_to: "completeness"
      requirement: "Cover the full cycle and reconcile all root/residue states."
      evidence: "completeness and balance report"
    - id: dq_03
      applies_to: "measurement"
      requirement: "Use calibrated instruments or disclose method and uncertainty."
      evidence: "calibration and workbook"
    - id: dq_04
      applies_to: "route"
      requirement: "Separate material route differences before weighting."
      evidence: "route register"
    - id: dq_05
      applies_to: "range maturity"
      requirement: "Replace reasoned screens with reviewed evidence before publication-critical use."
      evidence: "review record"
validation_rules:
  - rule_id: vr_01
    applies_to: "reference"
    rule: "Verify UUIDs, 1000 kg accepted roots, qualifiers and exclusions."
    source_ids:
      - mass-balance-identity
  - rule_id: vr_02
    applies_to: "boundary"
    rule: "Reject factory slicing, diffusion, sugar, pulp or molasses within the farm system."
    source_ids:
      - us-epa-sugarbeet-processing-ap42
  - rule_id: vr_03
    applies_to: "nutrients"
    rule: "Record each actual nutrient product once with its composition and nutrient basis; do not misclassify non-fertilizer inputs as agricultural fertilizer."
    source_ids: []
  - rule_id: vr_04
    applies_to: "routes"
    rule: "Verify parent, evidenced deltas, strata and weighting."
    source_ids:
      - fao-crop-yield-water-2012
  - rule_id: vr_05
    applies_to: "periods"
    rule: "Resolve each record to one field/period/load/batch and count once."
    source_ids:
      - mass-balance-identity
  - rule_id: vr_06
    applies_to: "outputs"
    rule: "Verify every hand-off, residue/waste route and allocation decision."
    source_ids:
      - mass-balance-identity
  - rule_id: vr_07
    applies_to: "rejects"
    rule: "Rejected mass has a destination and never appears in accepted output."
    source_ids:
      - mass-balance-identity
  - rule_id: vr_08
    applies_to: "ranges"
    rule: "Investigate out-of-range values; ranges do not replace foreground records."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset or background_dataset"
  downstream_use: "Fresh sugar-beet farm supply and models adding post-gate transport/factory processing"
  allowed_use: "Declared regions, crop years and route shares"
  excluded_use: "Seed, fodder/table beet, factory gate, sugar, pulp or molasses"
  required_metadata: "Reference qualifiers, routes, yield, quality, loss/residue destinations, allocation and evidence"
  required_quality_disclosure: "Coverage, calibration, estimates, weighting, mass-balance difference and data gaps"
  update_trigger: "Material change in region, route, inputs, yield/quality basis, allocation or representativeness period"
data_sources:
  - id: "fao-crop-yield-water-2012"
    type: "official_guidance"
    reference: "FAO, *Crop yield response to water* (2012), https://www.fao.org/4/i2800e/i2800e.pdf"
    used_for: "water and route"
  - id: "fao-sugar-beet-white-sugar-2009"
    type: "official_guidance"
    reference: "FAO, *Sugar beet: white sugar* (2009), https://www.fao.org/fileadmin/user_upload/tci/docs/AH1-%28eng%29Sugar%20beet%20white%20sugar.pdf"
    used_for: "identity, route, yield"
  - id: "fao-land-management-root-crops"
    type: "official_guidance"
    reference: "FAO land-management/root-harvest guidance, https://www.fao.org/4/x5648e/x5648e0f.htm"
    used_for: "harvest, soil, loss"
  - id: "us-epa-sugarbeet-processing-ap42"
    type: "official_guidance"
    reference: "US EPA AP-42 9.10.1.2, https://www.ams.usda.gov/sites/default/files/media/Vinasse.pdf"
    used_for: "factory exclusion"
  - id: "usda-ers-sugarbeet-harvest-loss-2019"
    type: "dataset"
    reference: "USDA ERS sugarbeet harvest (2019), https://www.ers.usda.gov/data-products/chart-gallery/95396"
    used_for: "loss context"
  - id: "uk-defra-sugar-beet-2024"
    type: "dataset"
    reference: "UK Defra, Agriculture in the UK 2024, https://www.gov.uk/government/statistics/agriculture-in-the-united-kingdom-2024/chapter-7-crops"
    used_for: "yield/sugar context"
  - id: "uk-nvz-nitrogen-2026"
    type: "official_guidance"
    reference: "UK nitrogen fertiliser guidance, https://www.gov.uk/guidance/using-nitrogen-fertilisers-in-nitrate-vulnerable-zones"
    used_for: "N check"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC 2019 Refinement, Volume 4 Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/vol4.html"
    used_for: "managed-soil N2O"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation-of-mass identity applied to linked foreground records"
    used_for: "transfers, balance, allocation"
