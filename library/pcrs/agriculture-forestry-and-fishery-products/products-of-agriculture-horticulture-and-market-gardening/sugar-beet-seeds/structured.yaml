validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "The flow UUID, mass property, unit group, 1,000 kg amount, market state and required qualifiers shall all be present and consistent."
    source_ids: []
  - rule_id: validate_route_exclusivity
    applies_to: "parent production"
    rule: "Exactly one direct-seeded or steckling route shall be declared per foreground package, with all required phases linked."
    source_ids:
      - cfia-sugar-beet-biology
  - rule_id: validate_period_once
    applies_to: "multi-period attribution"
    rule: "Each establishment, vernalization, reproductive and termination event shall be attributed once and only once to released outputs."
    source_ids: []
  - rule_id: validate_isolation_pollination
    applies_to: "reproductive production"
    rule: "Verify isolation evidence, parent identity, flowering/pollination management and male-parent disposition before accepting varietal-identity claims."
    source_ids:
      - oecd-sugar-fodder-beet-seed-scheme
      - usda-aphis-sugar-beet-seed-production
  - rule_id: validate_batch_changeover
    applies_to: "conditioning and grading"
    rule: "Runs, shared energy, cleaning and changeover residues shall carry run and lot keys and shall not be double counted."
    source_ids: []
  - rule_id: validate_output_states
    applies_to: "grading"
    rule: "Accepted, downgraded viable, rejected, sample and residue states shall have distinct quantities and hand-offs; rejected material cannot enter the reference output."
    source_ids: []
  - rule_id: validate_rework_loop
    applies_to: "re-cleaning or re-grading"
    rule: "Every rework loop shall return to a named node, retain prior burdens and close before release."
    source_ids: []
  - rule_id: validate_treatment_exclusion
    applies_to: "product state"
    rule: "Reject a dataset that includes polishing, washing, priming, coating, pelleting or chemical seed treatment while claiming this reference state."
    source_ids:
      - imanishi-et-al-2019
  - rule_id: validate_mass_balance
    applies_to: "all material nodes"
    rule: "Investigate unexplained mass-balance differences and disclose accepted uncertainty before use as secondary or background data."
    source_ids:
      - mass-balance-identity
