system_boundary:
  rules:
    - rule_id: boundary_seed_state
      applies_to: "product hand-off"
      rule: "End at untreated, uncoated, unpelleted cleaned and size-graded sowing seed; exclude washing, polishing, priming, coating, pelleting and chemical treatment."
      source_ids:
        - imanishi-et-al-2019
    - rule_id: boundary_route_choice
      applies_to: "parent establishment"
      rule: "Select exactly one direct-seeded or steckling route and include its complete establishment, vernalization and transfer records."
      source_ids:
        - cfia-sugar-beet-biology
    - rule_id: boundary_pollination_identity
      applies_to: "reproductive production"
      rule: "Include isolation, parent-line placement, flowering synchronization, off-type removal and male-parent disposition needed to preserve the intended cross."
      source_ids:
        - cfia-sugar-beet-biology
        - usda-aphis-sugar-beet-seed-production
    - rule_id: boundary_harvest_independence
      applies_to: "harvest"
      rule: "Model harvest separately because standing crop becomes dry collected material and field residues and shattering losses require an independent hand-off."
      source_ids:
        - usda-aphis-sugar-beet-seed-production
    - rule_id: boundary_stabilization
      applies_to: "stabilization"
      rule: "Declare the usable pre-intervention state, field or supplemental drying input, stable dry state and losses before threshing."
      source_ids:
        - usda-aphis-sugar-beet-seed-production
boundary_abstraction:
  declared_starting_condition: "Acquired parent seed or selected steckling material with declared genetic identity enters one specified seed-production route"
  starting_condition_role: "Upstream propagation input to the foreground seed campaign"
  product_classification_scope: "Sugar beet reproductive material produced for sowing; excludes commercial root production and downstream enhanced or treated seed states"
  recursive_input_rule: "Purchased sugar beet parent seed in the same category is an upstream product input with supplier dataset or disclosed proxy; it is not expanded recursively inside the same foreground campaign"
  upstream_dataset_requirement: "Require geography, crop year, parent-line identity, treatment state, quantity and supplier dataset or proxy disclosure for purchased propagation material"
  disclosure: "Declare route, periods, parent arrangement, isolation control, pollination responsibility, harvest/stabilization method, conditioning technology, lot tests, grades and every reject destination"
