allocation_rules:
  - rule_id: allocation_phase_linkage
    applies_to: "multi-period campaign"
    rule: "Attribute first-period establishment/vernalization and second-period reproductive burdens once to the resulting lot using traceable field and crop-year links; do not duplicate burdens across annual datasets."
    source_ids:
      - cfia-sugar-beet-biology
  - rule_id: allocation_parent_routes
    applies_to: "route alternatives"
    rule: "Direct-seeded and steckling routes are mutually exclusive. Do not average both unless a production-weighted aggregate reports each route separately before aggregation."
    source_ids:
      - cfia-sugar-beet-biology
  - rule_id: allocation_intended_outputs
    applies_to: "accepted and downgraded seed"
    rule: "Treat accepted seed and any intentionally marketed downgraded viable seed as the complete intended output set. Prefer physical mass allocation when subdivision cannot avoid shared burdens; disclose prices and sensitivity if economic allocation is used."
    source_ids: []
  - rule_id: allocation_residue_waste
    applies_to: "parent biomass, field residue, chaff and rejects"
    rule: "Treat material without intended product hand-off as residue or waste; do not assign avoided burden without a documented recovery function and destination."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "re-cleaned or re-graded seed"
    rule: "Return rework to the producing lot, retain its processing burdens once, and exclude it from accepted output until it passes release criteria."
    source_ids: []
  - rule_id: allocation_batch_shared
    applies_to: "shared runs and changeovers"
