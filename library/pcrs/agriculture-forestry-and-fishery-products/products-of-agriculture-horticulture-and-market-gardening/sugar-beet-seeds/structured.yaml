      collection_method: "weigh transferred material and reconcile field observations"
      unit: "row unit"
      frequency: "each field and harvest run"
      temporal_coverage: "harvest through stable hand-off"
      site_scope: "all fields and drying locations"
      aggregation_rule: "mass-weight by lot after separate route reporting"
      quality_evidence: "weigh tickets, meter logs, moisture tests and loss checks"
    - protocol_id: cp_conditioning
      process_id: "threshing_primary_cleaning"
      flow_role: "received material, energy and separated states"
      record_type: "run and meter records"
      raw_fields: "lot; run; received mass; energy; cleaned mass; chaff; foreign matter; dust control"
