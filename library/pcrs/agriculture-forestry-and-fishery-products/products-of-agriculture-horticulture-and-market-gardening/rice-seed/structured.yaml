allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "field, conditioning, and storage processes"
    rule: "First avoid allocation by subdividing seed multiplication, conditioning, treatment, packaging, storage, rejected-lot handling, and residue management when records permit."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_output_completeness
    applies_to: "rice seed and non-reference outputs"
    rule: "Enumerate accepted seed, intentionally sold co-products, rejected seed, screenings, losses, residues, and waste fates before selecting an allocation method."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_method_selection
    applies_to: "shared burdens"
    rule: "If allocation remains necessary, declare the selected physical or economic relationship, data period, and sensitivity; do not use a default product quantity from a module."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_seed_quality
    applies_to: "seed classes and grades"
    rule: "Do not allocate by seed quality claims alone unless a documented physical or economic relationship supports the choice; keep accepted seed and off-grade fate traceable."
    source_ids:
      - irri-rice-seed-quality
      - iso-14044-2006
