system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary runs from the declared source seed lot or production starting condition to rice seed at the declared seed gate. It includes land preparation, planting or transplanting, nutrient management, irrigation where applicable, crop protection, field operations, harvest, field-to-facility movement when inside the gate, drying, cleaning, grading, quality testing, treatment, packaging, storage, and delivery when the gate is delivered seed. Upstream production of purchased nutrient products, energy carriers, packaging, treatment materials, and treatment services is represented by linked background data. Rice paddy used as an input to seed conditioning is a product input and must be kept distinct from the final sowing-seed output. Rice milling, consumer use, downstream rice cultivation, retail, and food or feed processing are outside the default boundary."
      source_ids: []
    - rule_id: boundary_seed_production
      applies_to: "field and seed-facility route"
      rule: "Include source seed or declared starting condition, field production, harvest, conditioning, quality testing, treatment, packaging, storage, and delivery only to the declared gate."
      source_ids:
        - irri-rice-seed-quality
        - fao-rice-postharvest
    - rule_id: boundary_input_completeness
      applies_to: "all foreground routes"
      rule: "Address nutrient inputs, irrigation, crop protection, land, field energy, pumping, drying, conditioning energy, packaging, storage, and direct emissions with a collected value, justified zero, or documented exclusion."
      source_ids:
        - ipcc-2019-cropland
        - ipcc-2019-managed-soils-n2o
    - rule_id: boundary_quality_separation
      applies_to: "rice seed outputs"
      rule: "Separate accepted seed, usable co-product, screenings, rejected seed, broken kernels, dust, storage losses, and other residues by measured mass and declared fate."
      source_ids:
        - fao-rice-postharvest
        - mass-balance-identity
    - rule_id: boundary_moisture_reconciliation
      applies_to: "harvest and conditioning"
      rule: "Reconcile harvested input and conditioned outputs on one declared moisture basis and disclose drying water removal."
      source_ids:
        - fao-rice-postharvest
        - mass-balance-identity
boundary_abstraction:
  declared_starting_condition: "source_seed_lot_or_declared_seed_production_start"
  starting_condition_role: "seed_identity_and_propagation_condition"
  product_classification_scope: "current CPC 3.0 product category 01131, Rice, seed"
  recursive_input_rule: "a same-category seed input that would cause recursive tracing is recorded as the declared source seed lot with lot identity, origin, and purpose rather than recursively expanding the seed PCR"
  upstream_dataset_requirement: "use representative upstream datasets for purchased materials and disclose the selected Flow Set resolution in the foreground package"
  disclosure: "record source seed lot, variety or hybrid, seed class, location, crop year, production system, irrigation status, moisture basis, quality tests, treatment, gate, packaging, outputs, residue fates, and reporting period"
