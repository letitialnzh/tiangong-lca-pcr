allocation_rules:
  - rule_id: allocation_field
    applies_to: "cultivation"
    rule: "Attribute to linked seed cotton; residues left in field receive no product allocation."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_gin
    applies_to: "lint and cottonseed"
    rule: "Prefer subdivision; otherwise declared economic allocation with mass sensitivity."
    source_ids:
      - iso-14044
      - mass-balance-identity
  - rule_id: allocation_reject
