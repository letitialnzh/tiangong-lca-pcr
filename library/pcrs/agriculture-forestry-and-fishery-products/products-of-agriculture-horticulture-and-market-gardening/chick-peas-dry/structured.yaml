allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "all multi-output nodes"
    rule: "Subdivide directly measured field, harvest, conditioning and stabilization operations before allocation. Assign lot-specific rework and reject burdens to the producing lot."
    source_ids:
      - iso-14044-allocation
  - rule_id: allocation_residue_status
    applies_to: "straw, pods and downgraded grain"
    rule: "Classify a flow as an intended co-product only when deliberate collection, a documented destination and an economic or physical function are demonstrated. Field-returned biomass, shatter and discarded rejects are residues or losses and receive no product credit."
    source_ids:
      - iso-14044-allocation
      - saskatchewan-chickpea-harvest
  - rule_id: allocation_remaining_burdens
    applies_to: "chickpea grain and intended co-products"
    rule: "When subdivision cannot resolve shared burdens, apply one declared allocation method consistently to all intended outputs. Prefer documented economic allocation at the first independent hand-off; report quantities, prices, reference period and sensitivity to a mass allocation."
    source_ids:
      - iso-14044-allocation
  - rule_id: allocation_run_integrity
    applies_to: "batches, campaigns and rework loops"
    rule: "Assign shared cleaning, start-up and changeover burdens once across affected lots; a rework pass retains its burdens and material linkage, and rejected material is never counted as accepted output. This is single-period attribution and shared burdens do not cross the crop-cycle boundary."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_materials
      process_id: "field_production"
      flow_role: "seed and crop-protection products"
      record_type: "invoices, application logs and field records"
      raw_fields: "product identity; formulation; active ingredient; quantity; treated area; date; field"
      collection_method: "reconcile purchase, stock and application records"
      unit: "native product unit and ha"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "every included field"
      aggregation_rule: "sum by product and field, then normalize to planted area"
      quality_evidence: "invoice, calibration and application log"
    - protocol_id: cp_nutrient_inputs
      process_id: "field_production"
      flow_role: "all mineral, organic and amendment nutrient products"
      record_type: "application and composition records"
      raw_fields: "product identity; mass or volume; density; N, P or P2O5, K or K2O content; organic matter; field; date"
      collection_method: "record each product once and retain laboratory or supplier composition"
      unit: "kg or m3 product and kg nutrient"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "every included field"
      aggregation_rule: "aggregate actual products without double counting; derive nutrient masses from retained composition"
      quality_evidence: "supplier analysis, laboratory result and application log"
    - protocol_id: cp_irrigation
      process_id: "field_production"
      flow_role: "deliberately supplied water"
      record_type: "meter, pump or scheduling record"
      raw_fields: "delivered volume; field; source; pumping energy; date"
      collection_method: "meter preferred; otherwise documented flow-rate-times-duration calculation"
      unit: "m3"
      frequency: "each event"
      temporal_coverage: "full crop cycle"
      site_scope: "each irrigated field"
      aggregation_rule: "sum delivered water by field"
      quality_evidence: "meter record or pump calculation"
    - protocol_id: cp_field_energy
      process_id: "field_production"
      flow_role: "field energy carriers"
      record_type: "fuel, meter and contractor records"
      raw_fields: "carrier; quantity; operation; field; date; contractor inclusion"
      collection_method: "reconcile on-farm and contractor records"
      unit: "carrier native unit"
      frequency: "each operation"
      temporal_coverage: "full crop cycle"
      site_scope: "every included field"
      aggregation_rule: "sum once by carrier and allocate to fields using operation records"
      quality_evidence: "invoice, meter, machine or contractor log"
    - protocol_id: cp_field_area
      process_id: "field_production"
      flow_role: "land occupation"
      record_type: "geospatial and field records"
      raw_fields: "planted area; crop dates; land-use class; prior crop"
      collection_method: "verified field boundary and crop record"
      unit: "ha and days"
      frequency: "once per crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "every included field"
      aggregation_rule: "area multiplied by occupied fraction of crop cycle"
      quality_evidence: "map and field register"
    - protocol_id: cp_field_emissions
      process_id: "field_production"
      flow_role: "direct elementary emissions"
      record_type: "activity data and calculation workbook"
      raw_fields: "nutrient quantities; residue N; lime; urea; fuel; irrigation; soil and climate parameters; factor source"
      collection_method: "apply declared method to collected activity data"
      unit: "kg substance"
      frequency: "each relevant event and annual calculation"
      temporal_coverage: "full crop cycle"
      site_scope: "every included field"
      aggregation_rule: "calculate by substance and receiving medium; preserve factor version"
      quality_evidence: "calculation workbook and factor citation"
    - protocol_id: cp_harvest_energy
      process_id: "harvest_threshing"
      flow_role: "harvest energy carriers"
      record_type: "machine, fuel and contractor records"
      raw_fields: "route; carrier; quantity; field; date; run"
      collection_method: "reconcile machine or contractor record to harvest event"
      unit: "carrier native unit"
      frequency: "each event"
      temporal_coverage: "harvest period"
      site_scope: "every included field"
      aggregation_rule: "sum once by field and harvest route"
      quality_evidence: "machine or contractor log"
    - protocol_id: cp_harvest_mass_balance
      process_id: "field_production_harvest_threshing"
      flow_role: "recoverable crop, harvested bulk, residues and loss"
      record_type: "weighbridge, yield monitor and field-loss observations"
      raw_fields: "field; area; bulk mass; moisture; collected residue; pre- and post-harvest loss estimate"
      collection_method: "calibrated weighing plus documented field sampling"
      unit: "kg and kg/ha"
      frequency: "each field and harvest event"
      temporal_coverage: "harvest period"
      site_scope: "every included field"
      aggregation_rule: "reconcile recoverable grain to harvested bulk and losses"
      quality_evidence: "calibration, sample record and reconciliation"
    - protocol_id: cp_conditioning_energy
      process_id: "cleaning_grading"
      flow_role: "cleaning and grading energy"
      record_type: "meter, runtime and fuel records"
      raw_fields: "carrier; meter values; runtime; lot; shared period"
      collection_method: "meter preferred; allocate shared period by documented driver"
      unit: "carrier native unit"
      frequency: "each lot or operating period"
      temporal_coverage: "conditioning period"
      site_scope: "every included facility"
      aggregation_rule: "assign shared energy once across lots"
      quality_evidence: "meter and allocation record"
    - protocol_id: cp_grade_mass_balance
      process_id: "cleaning_grading"
      flow_role: "incoming, accepted, downgraded, rework and rejects"
      record_type: "lot weights and representative grade samples"
      raw_fields: "lot; inlet mass; moisture; class; damage; green; foreign material; size; each output mass and destination"
      collection_method: "calibrated weighing and representative sampling"
      unit: "kg and % by mass"
      frequency: "each lot and rework pass"
      temporal_coverage: "conditioning period"
      site_scope: "every included facility"
      aggregation_rule: "inlet equals accepted, downgraded, rejects and reconciled loss; rework counted once per pass"
      quality_evidence: "scale calibration, sample chain and balance closure"
    - protocol_id: cp_drying_energy
      process_id: "drying_stabilization"
      flow_role: "aeration and drying energy"
      record_type: "meter, fuel and dryer logs"
      raw_fields: "carrier; quantity; inlet and outlet time; temperature; airflow; lot"
      collection_method: "meter or reconciled fuel delivery"
      unit: "carrier native unit"
      frequency: "each lot or drying period"
      temporal_coverage: "stabilization period"
      site_scope: "every active facility"
      aggregation_rule: "assign energy to lot or documented shared period"
      quality_evidence: "meter, fuel and dryer log"
    - protocol_id: cp_drying_mass_balance
      process_id: "drying_stabilization"
      flow_role: "moist inlet, stabilized output, removed water and downgrade"
      record_type: "lot weights and moisture tests"
      raw_fields: "inlet and outlet mass; inlet and outlet moisture; temperature; downgrade mass; destination"
      collection_method: "calibrated scales and representative moisture tests"
      unit: "kg and % wet basis"
      frequency: "each lot"
      temporal_coverage: "stabilization period"
      site_scope: "every active facility"
      aggregation_rule: "conserve dry matter and calculate removed water"
      quality_evidence: "scale and moisture-meter calibration plus reconciliation"
  calculation_rules:
    - id: calc_dry_matter
      applies_to: "moisture conversion"
      rule: "dry matter = as-received mass × (1 − moisture fraction); converted mass = dry matter ÷ (1 − target moisture fraction)"
      inputs:
        - "inlet mass"
        - "inlet moisture"
        - "target moisture"
      output: "moisture-corrected mass and water removed"
      source_ids:
        - mass-balance-identity
    - id: calc_field_yield
      applies_to: "field and harvest nodes"
      rule: "harvested and lost recoverable grain divided by harvested field area; retain measured moisture"
      inputs:
        - "harvested bulk"
        - "measured losses"
        - "field area"
      output: "kg recoverable grain/ha"
      source_ids:
        - mass-balance-identity
    - id: calc_grade_balance
      applies_to: "conditioning node"
      rule: "incoming mass = accepted + downgraded + non-recoverable rejects + unresolved measurement difference; rework is an internal loop and is not added as a second final output"
      inputs:
        - "lot input and all output-state weights"
      output: "closed lot balance and unexplained difference"
      source_ids:
        - mass-balance-identity
    - id: calc_managed_soil_emissions
      applies_to: "field emissions"
      rule: "calculate direct and relevant indirect managed-soil emissions from collected nutrient and residue activity data using the declared IPCC tier or justified regional method"
      inputs:
        - "applied N"
        - "residue N"
        - "volatilization or leaching activity data"
        - factors
      output: "substance-specific elementary emissions"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_allocation
      applies_to: "intended multi-output nodes"
      rule: "allocate only residual shared burdens after subdivision using the declared method and one complete output set"
      inputs:
        - "output quantities"
        - "prices or physical driver"
        - "shared burden"
      output: "attributed burden by intended output"
      source_ids:
        - iso-14044-allocation
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and lots"
      requirement: "Preserve desi or kabuli class, cultivar where material, crop year, origin field, lot, moisture basis, grade or destination and final hand-off."
      evidence: "lot register, sample and delivery record"
    - id: dq_completeness
      applies_to: "all nodes"
      requirement: "Cover all included fields and lots and reconcile at least 95% of material and energy records by the declared collection method; disclose exclusions and unresolved differences."
      evidence: "completeness matrix and reconciliation workbook"
    - id: dq_temporal
      applies_to: "foreground package"
      requirement: "Use records from the represented crop cycle and associated post-harvest period; disclose any proxy year and reason."
      evidence: "dated field, harvest and lot records"
    - id: dq_route
      applies_to: "alternative routes"
      requirement: "Record rainfed or irrigated, direct-cut or swathed, conditioning equipment, and aeration or heated-drying route for every affected field or lot."
      evidence: "operation and equipment logs"
    - id: dq_grade_moisture
      applies_to: "accepted and downgraded outputs"
      requirement: "Use representative sampling and calibrated moisture and mass measurements; preserve the denominator used for defect fractions."
      evidence: "calibration, sample chain and test result"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require the verified product, Mass property and Mass unit-group UUIDs, plus every required qualifier."
    source_ids:
      - cgc-chickpea-grading
      - cgc-chickpea-moisture
  - rule_id: validate_nutrient_cardinality
    applies_to: "each process"
    rule: "Permit at most one consolidated mineral-fertilizer, organic-fertilizer and nutrient-amendment Product-input card per process; it must bind only to flow-set.agricultural-nutrient-supply version 0.3.0 without a group."
    source_ids: []
  - rule_id: validate_route_resolution
    applies_to: "field, harvest and stabilization routes"
    rule: "Resolve rainfed versus irrigated per field, straight-cut versus swathed per harvest event, and inactive versus aerated or heated-dried per lot; collect every claimed route delta."
    source_ids:
      - saskatchewan-chickpea-harvest
      - ndsu-pulse-field-guide-2025
  - rule_id: validate_output_handoffs
    applies_to: "all product and reject states"
    rule: "Require one physical state, classification and destination for accepted, downgraded, rework, collected residue, field loss and waste outputs; no output may be counted at two hand-offs."
    source_ids:
      - cgc-chickpea-grading
      - mass-balance-identity
  - rule_id: validate_rework
    applies_to: "conditioning and stabilization"
    rule: "Link every rework pass to its source lot, retain its added burdens, and exclude unresolved rework or rejects from accepted output."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_batch_attribution
    applies_to: "conditioning and stabilization"
    rule: "Index inputs, outputs, cleaning and changeover by lot or operating period and assign shared-run burdens once."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_mass_balance
    applies_to: "harvest, conditioning and drying"
    rule: "Reconcile measured inputs to accepted, downgraded, residue, reject, water-removal and loss outputs; investigate and disclose any difference above 5% of the node input."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_moisture_temperature
    applies_to: "accepted and stabilized grain"
    rule: "Declare moisture; flag lots above the declared safe hand-off specification; for supplemental heated drying, require recorded grain temperature and flag values at or above 45 °C for review."
    source_ids:
      - saskatchewan-chickpea-harvest
      - cgc-chickpea-moisture
  - rule_id: validate_range_completeness
    applies_to: "every flow card"
    rule: "Require exactly one complete range with role, bounds, unit, denominator or basis, basis kind, evidence kind and source-id list; provisional screens do not replace foreground records."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground dry-chickpea production data package and farm-gate process dataset"
  downstream_use: "secondary_dataset; background_dataset after independent review and UUID resolution"
  allowed_use: "Crop-production inventories and lifecycle models requiring mature dry unprocessed chickpeas at the farm gate within the declared geography, year, route, class, moisture and grade"
  excluded_use: "Green chickpeas, planting seed commodities, processed chickpea fractions or foods, and industrial post-farm-gate operations"
  required_metadata: "PCR id and version; geography; crop year; desi or kabuli; cultivar where material; field area; prior crop; rainfed or irrigated; harvest route; lot and grade; moisture basis; conditioning and stabilization route; allocation method; concrete exchange UUIDs"
  required_quality_disclosure: "Coverage and completeness; measurement and sampling methods; calibration; route-specific proxies; mass-balance closure; range-screen exceptions; unresolved flow identities; source and factor versions; allocation sensitivity"
  update_trigger: "Material change in product boundary, platform UUID identity, flow-set contract, agronomic or post-harvest route, grade or moisture specification, emission method, allocation evidence, or representative foreground records"
