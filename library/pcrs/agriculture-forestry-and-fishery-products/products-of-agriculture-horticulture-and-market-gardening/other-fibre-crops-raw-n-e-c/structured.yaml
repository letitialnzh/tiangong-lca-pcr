  calculation_rules:
    - id: normalize_mass
      applies_to: "all inventory rows"
      rule: "process exchange ÷ accepted net reference-product mass from the same lot"
      inputs:
        - "exchange amount"
        - "lot links"
        - "accepted reference mass"
      output: "amount per kg reference product"
      source_ids: []
    - id: moisture_conversion
      applies_to: "fibre states"
      rule: "dry matter = wet mass × (1 − wet-basis moisture); paired lot measurements only"
      inputs:
        - "wet mass"
        - "moisture fraction"
      output: "comparable mass state"
      source_ids: []
    - id: transport_work
      applies_to: "freight"
      rule: "t·km = net tonnes loaded × loaded route kilometres"
      inputs:
        - "dispatch mass"
        - "route distance"
      output: "transport service"
      source_ids: []
    - id: soil_n2o
      applies_to: "managed soil"
      rule: "calculate N2O-N from N inputs with declared IPCC tier and convert to N2O by 44/28"
      inputs:
        - "N inputs"
        - "emission factors"
      output: "kg N2O"
      source_ids:
        - ipcc-2019-refinement-v4-ch11
    - id: lot_mass_balance
      applies_to: "harvest and preparation"
      rule: "input = accepted product + co-products + residues/waste + stock change + measured moisture change"
      inputs:
        - "lot masses"
        - moisture
        - stock
      output: "reconciliation result"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "reference product"
      requirement: "Species, plant part, state, grade and gate are compatible with the fixed product UUID"
      evidence: "lot specification and flow detail verification"
    - id: coverage_quality
      applies_to: "foreground inventory"
      requirement: "Cover all sites, fields, lots and actual operations in the declared period; quantify missing records"
      evidence: "completeness ledger"
    - id: measurement_quality
      applies_to: "mass, moisture, water and energy"
      requirement: "Record meter, calibration, sampling method, unit conversion and outlier treatment"
      evidence: "calibration and sampling records"
    - id: temporal_quality
      applies_to: "annual/perennial route"
      requirement: "Data period matches crop cycle and identifies establishment, production, renewal and termination"
      evidence: "dated crop and asset records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Fixed UUID, Mass property and kg unit must match the named raw fibre product and declared gate"
    source_ids: []
  - rule_id: validate_gate_once
    applies_to: "route"
    rule: "Farm and first-preparation handoffs cannot both be reference outputs"
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "every flow card"
    rule: "Check nonnegative bounds, lower ≤ upper and process-consistent denominator; inactive conditional routes impose no positive amount"
    source_ids: []
  - rule_id: validate_flow_identitys
    applies_to: "parameterized inputs"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "harvest and preparation"
    rule: "Balance input, products, co-products, residues, waste and stock change on declared moisture basis"
    source_ids: []
  - rule_id: validate_outputs
    applies_to: "intended outputs and rejects"
    rule: "Every intended output has a handoff; downgraded, rejected, recovered or waste states have explicit non-duplicated destinations"
    source_ids: []
  - rule_id: validate_period_assets
    applies_to: "perennial and shared infrastructure"
    rule: "Periods and consuming nodes are complete; establishment and shared-asset burdens are attributed once"
    source_ids: []
  - rule_id: validate_route_delta
    applies_to: "alternative routes"
    rule: "Each alternative declares parent activity and real topology, inventory, calculation or validation delta; mutually exclusive routes are not averaged"
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for one named raw fibre product"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Product systems compatible in species, plant part, state, route, geography and gate"
  excluded_use: "Unqualified proxy for other species, cotton, jute/kenaf, blended fibre, yarn, fabric or finished goods"
  required_metadata: "Species; plant part; raw/retted state; preparation technology; moisture; grade; impurities; site; period; gate; allocation"
  required_quality_disclosure: "Coverage, measurement and calibration, out-of-range values, missing records, route proxies, co-product and multi-period attribution"
  update_trigger: "Material change in product state, route, gate, technology, species scope, fixed UUID compatibility or key evidence"
