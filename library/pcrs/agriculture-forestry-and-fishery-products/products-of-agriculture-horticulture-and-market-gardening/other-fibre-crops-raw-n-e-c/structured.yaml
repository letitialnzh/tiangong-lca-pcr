allocation_rules:
  - rule_id: mass_balance_first
    applies_to: "all processes"
    rule: "First reconcile inputs, accepted product, co-products, residues, waste and measured moisture change by lot"
    source_ids: []
  - rule_id: coproduct_attribution
    applies_to: "intended co-products"
    rule: "Prefer subdivision. If allocation remains necessary, declare physical or economic method, data period and sensitivity for the study goal"
    source_ids:
      - iso-14044-2006
  - rule_id: residue_classification
    applies_to: "residues and rejects"
    rule: "Only material with intended use and documented handoff is a co-product; waste, soil return and unowned loss receive no product output quantity"
    source_ids: []
  - rule_id: multi_period_attribution
    applies_to: "perennial establishment and shared assets"
    rule: "Attribute using evidenced productive years, service or lifetime output, recording replacement and termination; no burden may be counted in multiple periods"
    source_ids: []
  - rule_id: shared_asset_attribution
    applies_to: "assets serving multiple nodes"
    rule: "List consuming nodes and periods and attribute once using recorded machine hours, mass processed or other causal service"
    source_ids: []
