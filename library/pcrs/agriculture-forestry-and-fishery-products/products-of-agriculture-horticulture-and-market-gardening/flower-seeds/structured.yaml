allocation_rules:
  - rule_id: allocation_mass_reconciliation
    applies_to: "each process"
    rule: "Reconcile opening stock, inputs, outputs, moisture change, residues, rejects and closing stock on one basis."
    source_ids: []
  - rule_id: allocation_secondary_outputs
    applies_to: "saleable plant material or downgraded seed"
    rule: "Prefer subdivision or direct physical attribution; if allocation remains, disclose outputs, causal basis, formula and sensitivity."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "all rejects"
    rule: "Do not include rejected seed in released output or credit a destination before routing is evidenced."
    source_ids: []
  - rule_id: allocation_periods
    applies_to: "perennial crops and shared assets"
