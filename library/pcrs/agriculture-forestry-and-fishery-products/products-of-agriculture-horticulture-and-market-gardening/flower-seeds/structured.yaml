    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all flow cards"
    rule: "Require ordered bounds, unit, basis, basis kind and evidence kind; foreground records determine amounts."
    source_ids: []
  - rule_id: validate_binding
    applies_to: "all cards"
    rule: "Accept fixed UUIDs only after detail confirmation and parameterized bindings only under compatible Flow Sets."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground flower-seed data package and process projection"
