      requirement: "Resolve parameterized and unmapped cards to verified UUIDs before final TIDAS publication."
      evidence: "expansion and identity review"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Reject non-sowing seed, vegetative propagules, cut flowers and records without species, cultivar and lot."
    source_ids: []
  - rule_id: validate_reference
    applies_to: "reference flow"
    rule: "Require exactly 1 kg net released seed and the required quality qualifiers."
    source_ids: []
  - rule_id: validate_species_uuid
    applies_to: "reference identity"
    rule: "Keep the category UUID blank unless compatible; use 50835e31-8359-4b7c-a818-81ef48e5ed42 only for explicitly declared H. annuus after detail compatibility is rechecked."
    source_ids: []
  - rule_id: validate_nutrient_cardinality
    applies_to: "seed_crop_production"
    rule: "Permit at most one nutrient Product-input card, bound only to flow-set.agricultural-nutrient-supply 0.3.0 at set level without a group."
