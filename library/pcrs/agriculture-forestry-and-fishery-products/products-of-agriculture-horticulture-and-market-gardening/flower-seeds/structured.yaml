  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all rows"
      rule: "normalized amount = lot-attributed amount / net released seed mass"
      inputs:
        - "attributed amount"
        - "released mass"
      output: "amount per kg reference seed"
      source_ids: []
    - id: calc_irrigation
      applies_to: "irrigation"
      rule: "delivered volume = meter difference, or verified pump rate × runtime"
      inputs:
        - "meter or pump data"
      output: "m3 delivered"
      source_ids: []
    - id: calc_energy
      applies_to: "energy"
      rule: "convert carriers to declared energy and assign by evidenced driver"
      inputs:
        - quantity
        - conversion
        - driver
      output: "MJ per process output"
      source_ids: []
    - id: calc_stage_balance
      applies_to: "each process"
      rule: "loss = opening stock + inputs − intended outputs − closing stock, adjusted for moisture"
      inputs:
        - mass
        - stock
        - moisture
      output: "reconciled loss/residue"
      source_ids: []
    - id: calc_multi_period
      applies_to: "perennial/shared production"
      rule: "attributed burden = total burden × lot output / documented productive output"
      inputs:
        - burden
        - outputs
      output: "lot burden"
      source_ids: []
