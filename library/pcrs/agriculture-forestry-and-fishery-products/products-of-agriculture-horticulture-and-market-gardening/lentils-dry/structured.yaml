system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground starts with a prepared field and planting material. Field production hands standing mature crop to an independent harvest node. Harvest hands uncleaned grain to primary conditioning; grading creates accepted, downgraded and rejected states; conditional stabilization ends at farm-gate hand-off. Direct combine and swath/combine are mutually exclusive per lot. Operation records are indexed by field, lot and batch; shared burdens are assigned once by measured throughput. The dataset uses a single-period inventory for one crop cycle, with no storage beyond conditional stabilization and no cross-cycle asset events."
      source_ids: []
    - rule_id: boundary_farm_gate
      applies_to: "all processes"
      rule: "Include field work, harvest, threshing, farm cleaning, grading and conditional aeration/drying through hand-off; exclude downstream processing."
      source_ids:
        - manitoba-lentils-production-management
        - ndsu-pulse-field-guide-2019
    - rule_id: boundary_route
      applies_to: "harvest"
      rule: "Select exactly one harvest route per lot and record swath operation and shatter only when applicable."
      source_ids:
        - manitoba-lentils-production-management
        - ndsu-pulse-field-guide-2019
    - rule_id: boundary_conditioning
      applies_to: "stabilization"
      rule: "Include aeration/drying only when required and retain inlet/outlet moisture, energy, duration and reject evidence."
      source_ids:
        - manitoba-lentils-production-management
        - ndsu-pulse-field-guide-2019
