allocation_rules:
  - rule_id: allocation_single_product
    applies_to: "grain only"
    rule: "Attribute burdens to accepted dry lentils when other outputs are residues or wastes; disclose destinations without credit."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_coproduct
    applies_to: "intended outputs"
    rule: "Enumerate each independently intended straw/pod or downgraded-grain output and apply a disclosed study-specific allocation; use physical dry mass when causality supports it, otherwise disclose economic allocation and prices."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_batch
    applies_to: "fields, lots and runs"
    rule: "Link inputs, outputs, cleaning and changeover to runs; allocate shared burdens once by measured throughput."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rework
    applies_to: "returned material"
    rule: "Retain prior burdens, add only incremental rework, and count material once at its final destination."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "field_production"
      flow_role: "seed, nutrient, protection, irrigation"
      record_type: "invoices, logs, meter"
      raw_fields: "field; area; product; amount; analysis; date"
      collection_method: "reconcile applications to field; Raw aggregation and attribution: sum by product then area-normalize"
      unit: "kg; L; m3; ha"
      frequency: "each application"
      temporal_coverage: "crop cycle"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice; calibrated meter; label"
    - protocol_id: cp_energy_operations
      process_id: "all"
      flow_role: "fuel and electricity"
      record_type: "meter and machine log"
      raw_fields: "process; field/lot; carrier; quantity; factor; runtime"
      collection_method: "meter and log reconciliation; Raw aggregation and attribution: convert by documented factor; allocate once"
      unit: "L; kg; kWh; MJ"
      frequency: "each operation"
      temporal_coverage: "crop cycle to hand-off"
      site_scope: "field/facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; invoice; runtime"
    - protocol_id: cp_field_emissions
      process_id: "field_production"
      flow_role: "N2O"
      record_type: "calculated record"
      raw_fields: "N by source; residue N; factors; fractions"
      collection_method: "selected IPCC tier; Raw aggregation and attribution: calculate by field first"
      unit: "kg N; kg N2O"
      frequency: "crop cycle"
      temporal_coverage: "crop cycle"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "factor version; calculation sheet"
    - protocol_id: cp_harvest_mass_balance
      process_id: "harvest_threshing"
      flow_role: "grain, residues, losses"
      record_type: "scale, monitor, samples"
      raw_fields: "field; route; area; masses; moisture; loss"
      collection_method: "weigh and representative loss sampling; Raw aggregation and attribution: moisture-align and reconcile outputs"
      unit: "kg; %; ha"
      frequency: "field/lot"
      temporal_coverage: "harvest"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; sampling plan"
    - protocol_id: cp_conditioning_lot
      process_id: "primary_conditioning"
      flow_role: "grain and rejects"
      record_type: "scale and log"
      raw_fields: "lot; input; output; moisture; pass; reject; destination"
      collection_method: "weigh every inlet and outlet; Raw aggregation and attribution: sum passes without rework duplication"
      unit: "kg; %"
      frequency: "lot/pass"
      temporal_coverage: "conditioning"
      site_scope: "each lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; closure"
    - protocol_id: cp_grading_lot
      process_id: "grading_sorting"
      flow_role: "accepted, downgrade, reject, rework"
      record_type: "ticket and test"
      raw_fields: "lot; grade; colour; moisture; splits; damage; foreign matter; mass; destination"
      collection_method: "weigh and classify every output; Raw aggregation and attribution: reconcile exclusive destinations"
      unit: "kg; %"
      frequency: "lot"
      temporal_coverage: "grading"
      site_scope: "each lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "ticket; test; calibration"
    - protocol_id: cp_stabilization_lot
      process_id: "stabilization"
      flow_role: "grain, water, reject"
      record_type: "moisture, scale, operation log"
      raw_fields: "lot; inlet/outlet mass and moisture; reject; airflow; duration; energy"
      collection_method: "test and weigh before/after; Raw aggregation and attribution: moisture balance with rejects"
      unit: "kg; %; h"
      frequency: "lot"
      temporal_coverage: "intervention"
      site_scope: "each lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated moisture meter and scale"
  calculation_rules:
    - id: calc_normalization
      applies_to: "all"
      rule: "normalized amount = process amount × 1,000 / accepted final mass"
      inputs:
        - "process amount"
        - "final mass"
      output: "per 1,000 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: calc_moisture
      applies_to: "grain/drying"
      rule: "dry solids = wet mass × (1 − moisture fraction); reconcile water in rejects"
      inputs:
        - "wet masses and moisture"
      output: "aligned grain and water removed"
      source_ids:
        - mass-balance-identity
        - manitoba-lentils-production-management
    - id: calc_n2o
      applies_to: "soil"
      rule: "Apply disclosed IPCC tier and convert N2O-N to N2O by 44/28."
      inputs:
        - "N activity and factors"
      output: "kg N2O"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_mass_balance
      applies_to: "harvest/conditioning/grading"
      rule: "input = exclusive outputs + losses + releases + stock change within uncertainty"
      inputs:
        - "linked masses"
      output: "closure"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Retain species, class, colour, year, grade, moisture, split/broken, damage, foreign matter, harvest and conditioning route."
      evidence: "lot ticket and tests"
    - id: dq_completeness
      applies_to: "crop cycle"
      requirement: "Cover every field operation and harvest, cleaning, grading, rework and stabilization lot."
      evidence: "field-to-lot trace"
    - id: dq_mass_balance
      applies_to: "material processes"
      requirement: "Reconcile all products, residues, wastes, losses, releases and stock changes."
      evidence: "closure worksheet"
    - id: dq_representativeness
      applies_to: "dataset"
      requirement: "Report geography, crop year, fields, classes, irrigation, harvest routes, drying share and aggregation weights."
      evidence: "metadata and lot index"
