allocation_rules:
  - rule_id: allocate_periods
    applies_to: "Establishment and replacements"
    rule: "Assign recorded vine and support burdens to evidenced productive years and outputs; retain nonproductive establishment and termination events and count each burden once."
    source_ids:
      - fao-ecocrop-pepper
  - rule_id: allocate_shared
    applies_to: "Supports, pumps and dryers"
    rule: "List consumers and service years, allocate by measured use or documented physical proxy, and reconcile assigned burden to recorded total."
    source_ids:
      - fao-ecocrop-pepper
  - rule_id: allocate_grades
    applies_to: "Saleable whole grades"
    rule: "Partition common burdens by measured mass when grades have the same physical function; justify another rule if materially different. Rejects receive no co-product credit."
    source_ids:
      - un-cpc3
  - rule_id: allocate_rework
    applies_to: "Reworked or recovered berries"
    rule: "Keep prior lot burden and add incremental rework once; credit recovery only with evidenced destination and method."
    source_ids:
      - kau-pepper-harvest
