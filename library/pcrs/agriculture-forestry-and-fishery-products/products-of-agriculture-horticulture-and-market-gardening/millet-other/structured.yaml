allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Millet production"
    rule: "First avoid allocation by separately recording cultivation, harvest, residue handling, and treatment."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_straw_product
    applies_to: "Grain and removed straw or stover"
    rule: "If straw or stover has a documented economic product function, allocate inseparable burdens using representative economic values and report a mass sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_waste
    applies_to: "Chaff and broken panicles"
    rule: "Do not allocate product burdens to material without a documented product function; classify its physical identity and destination."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_millet_field
      process_id: "millet_cultivation"
      flow_role: "Seed, nutrients, irrigation, and crop-protection products"
      record_type: "Invoices, application logs, meters, and field records"
      raw_fields: "field_id; cycle; species; area; product_identity; quantity; unit; composition; water"
      collection_method: "Reconcile purchases and stock to field applications and retain labels.; Raw aggregation and attribution: Sum by physical identity and normalize by accepted grain."
      unit: "kg, L, m3, ha"
      frequency: "Each application and cycle"
      temporal_coverage: "Complete crop cycle"
      site_scope: "Each farm and field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Invoices, labels, meters, logs, and stock reconciliation"
    - protocol_id: cp_millet_emissions
      process_id: "millet_cultivation"
      flow_role: "Managed-soil N2O"
      record_type: "Field inputs and calculation record"
      raw_fields: "nitrogen_sources; nitrogen_mass; residue_N; soil; climate; water_regime; factor_identity"
      collection_method: "Apply the accepted IPCC tier to each field or stratum.; Raw aggregation and attribution: Calculate by stratum and aggregate by accepted grain."
      unit: "kg N, kg N2O-N, kg N2O"
      frequency: "Each crop cycle"
      temporal_coverage: "Complete crop cycle"
      site_scope: "Each field or stratum"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calculation workbook, factor identity, conversions, and review"
    - protocol_id: cp_millet_harvest
      process_id: "millet_harvest_preparation"
      flow_role: "Harvest fuel, grain, straw or stover, and chaff"
      record_type: "Machinery logs, scale tickets, moisture tests, and destination records"
      raw_fields: "field_id; batch_id; area; fuel; grain_mass; moisture; straw_mass; chaff_mass; destinations"
      collection_method: "Reconcile outputs and fuel by field and batch.; Raw aggregation and attribution: Aggregate by batch and normalize to accepted grain."
      unit: "kg, t, L, percent, ha"
      frequency: "Each harvest and batch"
      temporal_coverage: "Complete harvest period"
      site_scope: "Each farm and field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale checks, tickets, moisture tests, fuel logs, and receipts"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "Crop-cycle rows"
      rule: "normalized flow = crop-cycle quantity / accepted grain mass"
      inputs:
        - quantity
        - "accepted grain mass"
      output: "Quantity per kg reference grain"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_mass
      applies_to: "Nutrients"
      rule: "nutrient mass = product mass × documented nutrient fraction"
      inputs:
        - "product mass"
        - composition
      output: "kg nutrient"
      source_ids:
        - mass-balance-identity
    - id: calc_direct_n2o
      applies_to: "Managed-soil N2O"
      rule: "Apply the selected IPCC tier and convert N2O-N to N2O by 44/28."
      inputs:
        - "nitrogen inputs"
        - factors
        - conditions
      output: "kg N2O"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_moisture_mass
      applies_to: "Grain and residues"
      rule: "dry mass = as-received mass × (1 − moisture fraction)"
      inputs:
        - mass
        - "measured moisture"
      output: "dry and as-received mass"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference grain"
      requirement: "Declare species or mix, non-seed purpose, state, grade, moisture, and fixed UUID."
      evidence: "Product, field, batch, and identity records"
    - id: dq_coverage
      applies_to: "Foreground"
      requirement: "Cover a complete crop cycle and harvest and disclose missing data and averaging."
      evidence: "Dated field, input, and harvest records"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Reconcile inputs, products, residues, and emissions and preserve identity evidence gaps as coverage gaps."
      evidence: "Protocol, mass-balance, and gap checks"
