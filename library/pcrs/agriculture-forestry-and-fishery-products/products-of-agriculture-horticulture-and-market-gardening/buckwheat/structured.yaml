      record_type: "field log, invoice, application record, meter, or contractor record"
      raw_fields: "field_id; area; cultivar; input_product; amount; nutrient_content; date; operation; contractor_scope"
      collection_method: "reconcile physical inputs and operations to each field and crop cycle; Raw aggregation and attribution: sum by physical identity; calculate nutrients without merging products; normalize with same-cycle area and yield"
