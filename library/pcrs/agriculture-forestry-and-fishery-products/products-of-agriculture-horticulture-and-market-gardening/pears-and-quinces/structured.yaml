allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "orchard and handling"
    rule: "Prefer separate pear/quince block and handling records before allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_mixed_pear_quince
    applies_to: "mixed production"
    rule: "Use measured crop-year mass allocation when crop-specific records are unavailable and disclose the mix."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_orchard_establishment
    applies_to: "perennial establishment"
    rule: "Allocate establishment over the declared productive period using the same period for inputs and outputs."
    source_ids:
      - fao-good-agricultural-practices
  - rule_id: allocation_cull_and_byproducts
    applies_to: "culls and co-products"
    rule: "Subdivide by destination; use economic allocation only for documented valuable co-products when subdivision is infeasible."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_orchard_establishment_records
      process_id: "orchard_establishment"
      flow_role: "trees, inputs, land, residues"
      record_type: "planting plan, nursery invoice, field log, area record"
      raw_fields: "block_id; species; cultivar; rootstock; tree_count; planting_year; area; inputs; residue_fate"
      collection_method: "reconcile planting and replacement to blocks and allocation period; Raw aggregation and attribution: sum by block, product, and destination"
      unit: "tree; ha; kg; m3"
      frequency: "each event"
      temporal_coverage: "declared allocation period"
      site_scope: "all included blocks"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "maps; invoices; field records"
    - protocol_id: cp_orchard_activity_records
      process_id: "orchard_management"
      flow_role: "nutrients, irrigation, protection, fuel, electricity, land"
      record_type: "invoices, labels, spray log, meter, contractor record"
      raw_fields: "block_id; area; date; product; amount; nutrient_content; water; fuel; electricity"
      collection_method: "reconcile every input to block and crop year; Raw aggregation and attribution: sum by physical identity; normalize with same-year yield"
      unit: "kg; kg nutrient; m3; L; kWh; ha"
      frequency: "each event or meter period"
      temporal_coverage: "full crop year"
