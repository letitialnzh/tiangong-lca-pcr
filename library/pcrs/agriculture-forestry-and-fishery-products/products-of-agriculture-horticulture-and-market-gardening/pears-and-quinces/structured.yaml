  calculation_rules:
    - id: calc_orchard_to_reference_flow
      applies_to: "orchard inputs and emissions"
      rule: "crop-year amount per area / same-year marketable yield per area × 1,000 kg"
      inputs:
        - amount
        - area
        - "accepted fruit mass"
      output: "amount per 1,000 kg fruit"
      source_ids: []
    - id: calc_nutrient_content
      applies_to: "fertilizers and amendments"
      rule: "product mass × declared nutrient fraction"
      inputs:
        - product
        - mass
        - assay
        - basis
      output: "kg N, kg P2O5, kg K2O"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_perennial_establishment_allocation
      applies_to: "establishment"
      rule: "total burden × declared productive-period share"
      inputs:
        - "establishment amount"
        - "productive period"
      output: "allocated annual amount"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_managed_soil_emissions
      applies_to: "N2O, ammonia, nitrate"
      rule: "selected IPCC or regional factors applied to crop-year activity records"
      inputs:
        - activity
        - "soil/climate"
        - factors
      output: "pathway emissions"
      source_ids:
        - ipcc-2019-refinement
    - id: calc_handling_mass_balance
      applies_to: "harvest and handling"
      rule: "harvested input = accepted fruit + culls + handling waste + measured losses within uncertainty"
      inputs:
        - "batch masses"
        - destinations
      output: "reconciled outputs"
      source_ids: []
