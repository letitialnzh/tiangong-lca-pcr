allocation_rules:
  - rule_id: allocation_avoid_subdivision
    applies_to: "field and conditioning processes"
    rule: "Avoid allocation by separately recording seed multiplication, conditioning, treatment, packaging, rejects, and fate-specific handling whenever the processes can be subdivided."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_intended_outputs
    applies_to: "intentional product outputs"
    rule: "If a residue or off-grade stream is intentionally sold or transferred as a product, identify its destination and apply a declared attribution method only after product status is evidenced."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_seed_quality
    applies_to: "accepted seed and downgraded lots"
    rule: "Do not allocate seed-quality burdens to commodity grain or a downgraded stream unless the alternate output is intentionally produced, separately identified, and included in the declared gate."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_fallback
    applies_to: "multiple intended outputs"
    rule: "If subdivision is not possible, use a declared mass, physical-property, economic, or other defensible method, disclose the rationale, and test a materially different method as sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_reject_fate
    applies_to: "rejects and waste"
    rule: "Keep field residue, conditioning rejects, packaging waste, storage losses, treatment, recovery, and disposal distinct; do not credit a displaced product without destination and substitution evidence."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "Every rejected or off-spec seed state is explicitly routed as reworked, downgraded, recovered, or discarded. A rework loop or boundary exit is linked to the producing conditioning node, and rejected material is excluded from accepted output until a new documented quality-release event occurs. Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
