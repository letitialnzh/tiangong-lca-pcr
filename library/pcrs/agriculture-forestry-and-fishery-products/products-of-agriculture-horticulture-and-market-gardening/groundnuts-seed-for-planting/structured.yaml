      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
  calculation_rules:
    - id: normalize_to_accepted_seed
      applies_to: "all foreground rows"
      rule: "divide each measured or calculated amount by net accepted seed at the same declared gate and basis"
      inputs:
        - "output records"
        - "input records"
      output: "amount per 1 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: convert_seed_moisture_basis
      applies_to: "field and conditioning mass"
      rule: "convert only from recorded mass and moisture using an explicit water-and-dry-matter equation"
      inputs:
        - harvest
        - receiving
        - "quality records"
      output: "declared-basis mass"
      source_ids:
        - mass-balance-identity
        - fao-groundnut-drying-handling
    - id: calculate_seed_conditioning_yield
      applies_to: "conditioning output"
      rule: "accepted seed mass divided by received harvested seed-crop mass, retaining rejects and moisture change separately"
      inputs:
        - "conditioning input"
        - "accepted mass"
        - "reject mass"
      output: "yield, reject fraction, unexplained fraction"
      source_ids:
        - usda-seed-cleaning-handling
        - mass-balance-identity
    - id: calculate_land_occupation
      applies_to: "land occupation"
      rule: "planted area multiplied by declared crop-cycle occupation and normalized to accepted seed"
      inputs:
        - "land records"
        - "accepted seed mass"
      output: "area-time per reference flow"
      source_ids:
        - ipcc-2019-cropland
    - id: calculate_water_withdrawal
      applies_to: "water withdrawal"
      rule: "convert metered volume where needed and keep source withdrawal separate from delivered irrigation"
      inputs:
        - "irrigation records"
      output: "resource withdrawal per reference flow"
      source_ids:
        - ipcc-2019-cropland
    - id: calculate_managed_soil_emissions
      applies_to: "nitrogen emissions"
      rule: "apply the selected method tier to nutrient inputs and declared soil, climate, and management context; disclose species conversion"
      inputs:
        - "nutrient records"
        - "method factors"
      output: "species-specific emissions"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calculate_field_energy_emissions
      applies_to: "field energy"
      rule: "multiply recorded fuel or energy by the declared factor and normalize to accepted seed"
      inputs:
        - "field energy"
        - factor
      output: "field-energy emissions"
      source_ids:
        - ipcc-2019-cropland
    - id: calculate_conditioning_energy_emissions
      applies_to: "conditioning energy"
      rule: "multiply recorded conditioning fuel or energy by the declared factor and normalize"
      inputs:
        - "conditioning energy"
        - factor
      output: "conditioning emissions"
      source_ids:
        - fao-groundnut-drying-handling
    - id: reconcile_field_outputs
      applies_to: "field production"
      rule: "harvested seed crop plus residue, non-seed material, and documented loss reconcile to the harvest record within declared tolerance"
      inputs:
        - harvest
        - "residue records"
      output: "field output balance"
      source_ids:
        - mass-balance-identity
    - id: reconcile_conditioning_outputs
      applies_to: "conditioning"
      rule: "received mass and moisture reconcile to accepted seed, rejects, packaging waste, emissions, and documented loss"
      inputs:
        - "conditioning input"
        - "accepted seed"
        - rejects
      output: "conditioning balance"
      source_ids:
        - mass-balance-identity
        - fao-groundnut-drying-handling
    - id: reconcile_storage_outputs
      applies_to: "storage"
      rule: "stored mass reconciles to delivered seed, storage loss, and closing inventory for the declared period"
      inputs:
        - storage
        - delivery
        - "loss records"
      output: "storage balance"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_seed_identity
      applies_to: "reference product and source lots"
      requirement: "Declare seed class, cultivar and seed class, variety or source-lot identity where applicable, treatment status, moisture basis, physical purity, and germination or viability."
      evidence: "certificate, lot record, quality test"
    - id: dq_mass_records
      applies_to: "all mass rows"
      requirement: "Every mass identifies date, site or batch, unit, moisture basis where relevant, and measurement device or source record."
      evidence: "calibration, weighbridge ticket, batch sheet"
    - id: dq_temporal_coverage
      applies_to: "crop-cycle and storage data"
      requirement: "Cover the declared crop cycle and storage period and disclose single-season or multi-season aggregation."
      evidence: "dated field, input, harvest, storage, release records"
    - id: dq_input_completeness
      applies_to: "field and conditioning inputs"
      requirement: "Quantify or justify zero or exclusion for source seed, nutrients, crop protection, irrigation, field energy, land, conditioning energy, treatment, and packaging."
      evidence: "ledgers, labels, meters, logs, invoices"
    - id: dq_quality_release
      applies_to: "accepted seed output"
      requirement: "Retain lot-release basis, quality test method, moisture, purity, germination or viability, treatment status, and gate."
      evidence: "test, certificate, release record"
    - id: dq_reject_and_fate
      applies_to: "rejects, residues, waste"
      requirement: "Every non-reference stream has measured or reconciled mass and declared destination; product status is not inferred from a name."
      evidence: "reject log, residue, dispatch or treatment record"
    - id: dq_mass_balance
      applies_to: "all processes"
      requirement: "Reconcile field, conditioning, and storage outputs within declared tolerance and disclose unexplained fractions."
      evidence: "scale records, batch sheets, inventory reconciliation"
    - id: dq_binding_coordinate
      applies_to: "each inventory exchange"
      requirement: "Check actual substance or product identity, state, direction, flow type, property, unit and applicable boundary; retain only a verified matching UUID, otherwise leave it absent and register the row."
      evidence: "identity verification records"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Confirm the verified groundnut sowing-seed UUID, all qualifiers, and the declared gate; the final exchange must retain that UUID."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_scope
    applies_to: "boundary"
    rule: "Confirm that the dataset is groundnut seed for sowing and does not silently include commodity grain, forage or silage groundnut, downstream cultivation, or downstream processing."
    source_ids:
      - fao-groundnut-seed-production
  - rule_id: validation_process_map
    applies_to: "process inventory"
    rule: "Confirm field seed production, conditioning, quality release, and included storage are separate, with explicit hand-offs."
    source_ids:
      - fao-groundnut-seed-production
      - usda-seed-cleaning-handling
  - rule_id: validation_flow_coordinates
    applies_to: "inventory rows"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_nutrients_and_emissions
    applies_to: "nutrients and soil emissions"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_water_and_land
    applies_to: "irrigation, withdrawal, land"
    rule: "Keep delivered irrigation product input, natural water withdrawal, and land occupation distinct and prevent double counting."
    source_ids:
      - ipcc-2019-cropland
  - rule_id: validation_quality_release
    applies_to: "accepted seed"
    rule: "Confirm seed class, quality attributes, treatment status, lot release, packaging state, and gate for the reference output."
    source_ids:
      - fao-groundnut-seed-production
  - rule_id: validation_reject_fate
    applies_to: "rejects and waste"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids:
      - usda-seed-cleaning-handling
      - mass-balance-identity
  - rule_id: validation_mass_balance
    applies_to: "all outputs"
    rule: "Confirm field, conditioning, and storage balances reconcile within declared tolerance and accepted seed is not counted at two hand-offs."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_allocation
    applies_to: "intentional co-products"
    rule: "Confirm any intentional co-product is separately identified, destination is evidenced, and allocation or substitution treatment is disclosed."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "downstream LCA construction where seed class, route, quality attributes, geography, moisture, treatment, packaging, and gate match"
  excluded_use: "commodity grain; forage or silage groundnut; downstream cultivation; food, feed, starch, or ethanol processing; datasets omitting seed-quality or gate qualifiers"
  required_metadata: "reference flow; CPC scope; seed class; cultivar and seed class; variety or source-lot identity where applicable; geography; crop cycle; moisture; purity; germination or viability; treatment; packaging; gate; concrete flow identity verification; collection coverage; DQR"
  required_quality_disclosure: "lot and field coverage, measurement records, quality-release evidence, calculation rules, structural coordinates and concrete flow identity verification, fixed UUID evidence if any, exclusions, mass-balance results, and data-quality scores"
  update_trigger: "material change in route, cultivar or source-lot practice, conditioning technology, treatment, packaging, storage, reference qualifiers, concrete flow identity verification"
data_sources:
  - id: "fao-groundnut-seed-production"
    type: "official_guidance"
    reference: "FAO seed production and quality guidance, <https://www.fao.org/4/y4011e/y4011e0v.htm>"
    used_for: "seed classes, quality attributes, lot acceptance, and seed-production boundary"
  - id: "fao-groundnut-postharvest-operations"
    type: "handbook"
    reference: "FAO INPhO, Groundnut: Post-harvest Operations, https://www.fao.org/fileadmin/user_upload/inpho/docs/Post_Harvest_Compendium_-_Groundnut.pdf"
    used_for: "crop harvest, drying and storage context only; seed acceptance/certification needs its own declared standard"
  - id: "fao-groundnut-drying-handling"
    type: "handbook"
    reference: "FAO, Agricultural engineering in development: Grain and post-harvest systems, <https://www.fao.org/4/t0522e/T0522E03.htm>"
    used_for: "drying, moisture, cleaning, conditioning, and process hand-off"
  - id: "usda-seed-cleaning-handling"
    type: "handbook"
    reference: "USDA, Seed cleaning and handling guidance, <https://www.govinfo.gov/content/pkg/GOVPUB-A-PURL-gpo20323/pdf/GOVPUB-A-PURL-gpo20323.pdf>"
    used_for: "cleaning, grading, screenings, rejects, and handling records"
  - id: "ipcc-2019-cropland"
    type: "method_factor"
    reference: "IPCC 2019 Refinement, Volume 4, Chapter 5 Cropland, <https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch05_Cropland.pdf>"
    used_for: "cropland management, residue treatment, land, and crop-management method context"
  - id: "ipcc-2019-managed-soils-n2o"
    type: "method_factor"
    reference: "IPCC 2019 Refinement, Volume 4, Chapter 11, <https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf>"
    used_for: "managed-soil nitrogen emissions and factor selection"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines"
    used_for: "allocation hierarchy, data quality, and sensitivity expectations"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation of mass applied as a PCR calculation identity for seed harvest, conditioning, packaging, storage, rejects, and reference-flow reconciliation."
    used_for: "output reconciliation, normalization, and QA guardrails"
  - id: "declared-handoff-measurement-definition"
    type: "method_factor"
    reference: "This PCR, Sections 3, 6 and 8: measured net mass at the same state and gate is its own normalization denominator, giving a mass ratio of 1; handoff measurement adds no physical processing."
    used_for: "Same-stage and handoff measurement identities; a definition, not an observed yield, empirical default or external publication."
  - id: "fao-fertilizer-identities"
    type: "official_guidance"
    reference: "FAO Fertilizer Specifications, https://www.fao.org/agriculture/crops/thematic-sitemap/theme/spi/plantnutrition/fertspecs/en/"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
  - id: "fao-organic-nutrients"
    type: "official_guidance"
    reference: "FAO How to Make and Use Compost, https://www.fao.org/4/i2230e/i2230e.pdf"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
  - id: "fao-package-identities"
    type: "official_guidance"
    reference: "FAO Packaging for fruits, vegetables and root crops, section 4, https://www.fao.org/4/x5016e/X5016E04.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
