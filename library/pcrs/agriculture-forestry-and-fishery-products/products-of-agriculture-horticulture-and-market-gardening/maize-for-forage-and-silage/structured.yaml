system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "managed field production"
      rule: "Include crop-attributed soil preparation, sowing, nutrient and crop-protection management, irrigation, field energy, direct field emissions and standing-biomass transfer for one field-season."
      source_ids:
        - ipcc-2019-managed-soils
        - fao-crop-water-needs
    - rule_id: boundary_harvest
      applies_to: "harvest node"
      rule: "Model cutting or chopping, loading, measured harvest losses and accepted, downgraded or discarded destinations as an independent node because its equipment, lot records, losses and hand-off differ from crop growth."
      source_ids:
        - fao-forage-maize-harvest-stage
        - mass-balance-identity
    - rule_id: boundary_fresh_gate
      applies_to: "reference product"
      rule: "Stop at fresh unprocessed farm-gate hand-off. Exclude ensiling, fermentation, storage, drying, baling, feed manufacture, downstream transport and feeding."
      source_ids:
        - fao-forage-maize-harvest-stage
    - rule_id: boundary_route_strata
      applies_to: "alternative routes"
      rule: "Use managed field production as the parent. Irrigation adds delivered water, pumping energy and irrigation records; rainfed production omits those exchanges. Harvest technology changes machinery energy, cutting/chopping state and loss records. Keep mutually exclusive route strata separate until weighted aggregation."
      source_ids:
        - fao-crop-water-needs
        - mass-balance-identity
