system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground starts when seed and other technosphere inputs enter the pea field and ends with accepted whole dry pea grain at the farm gate. Include field operations and emissions, harvest/threshing, cleaning/grading and necessary conditioning. Harvest independently transfers the mature crop to a harvested lot; primary conditioning converts raw grain to classified output; active drying or aeration is a bounded stabilization node. Passive field dry-down remains in field production."
      source_ids: []
    - rule_id: boundary_field_to_gate
      applies_to: "All processes"
      rule: "Include establishment through accepted farm-gate grain and linked residues, losses, rejects and direct field emissions; exclude downstream splitting, milling, fractionation, cooking and packaging."
      source_ids:
        - ndsu-field-pea-production-2021
        - saskatchewan-dry-pea-guide
    - rule_id: boundary_harvest_routes
      applies_to: "harvest_threshing"
      rule: "Direct combining and windrowing are mutually exclusive by batch unless separate areas or lots are evidenced; include threshing."
      source_ids:
        - ndsu-field-pea-production-2021
        - saskatchewan-pea-harvest-management
    - rule_id: boundary_conditioning
      applies_to: "grading_cleaning; drying_aeration"
      rule: "Include farm cleaning, grading, aeration and drying; activate stabilization only from measured lot condition and record route, energy and moisture change."
      source_ids:
        - saskatchewan-dry-pea-guide
    - rule_id: boundary_route_separation
      applies_to: "Alternatives"
      rule: "Keep rainfed/irrigated, direct/windrow and ambient/heated route records separate until production-mass weighting."
      source_ids:
        - mass-balance-identity
