      unit: "m3; ha"
      frequency: "Event"
      temporal_coverage: "Crop cycle"
      site_scope: "Field"
      aggregation_rule: "Sum gross delivered water"
      quality_evidence: "Calibration and irrigation log"
    - protocol_id: cp_field_energy
      process_id: "field_production"
      flow_role: "Field energy"
      record_type: "fuel/electricity log"
      raw_fields: "operation; carrier; quantity; hours; area"
      collection_method: "Meter or verified rate calculation"
      unit: "L; kg; kWh; h"
      frequency: "Operation"
      temporal_coverage: "Crop cycle"
      site_scope: "Field"
      aggregation_rule: "Sum by carrier and operation"
      quality_evidence: "Invoice, meter, equipment log"
    - protocol_id: cp_field_output
      process_id: "field_production"
      flow_role: "Crop and residue"
      record_type: "field/yield record"
      raw_fields: "area; grain mass; moisture; residue; destination; loss"
      collection_method: "Weigh and moisture-test; declared residue method"
