allocation_rules:
  - rule_id: allocation_field_outputs
    applies_to: "Grain and straw/pods"
    rule: "Avoid allocation when residue remains managed in-field material. Deliberately removed residue with an evidenced product hand-off is a co-product; use declared physical or economic allocation consistently and disclose sensitivity."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_reject_routes
    applies_to: "Damage, downgrade, rework and rejects"
    rule: "Retain burdens through rework. Treat a downgraded sale/feed hand-off as intended output only with an evidenced destination; otherwise it is waste. Never count accepted and rejected mass together."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_batches
    applies_to: "All batches"
    rule: "Attribute inputs, outputs, clean-out, carryover and changeover to the causing batch. Use processed-mass allocation for shared burdens only when direct metering is absent and never allocate one shared burden twice."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_no_default_substitution
    applies_to: "Co-products"
    rule: "Do not apply avoided-burden credit by default; any downstream substitution reports the unallocated inventory, substituted product, ratio and evidence."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "field_production"
      flow_role: "Seed, nutrient and crop-management products"
      record_type: "invoices, logs, labels"
      raw_fields: "field_id; product_id; mass; composition; area; date; method"
      collection_method: "Reconcile stock and application logs; Raw aggregation and attribution: Sum by product and field; retain composition"
      unit: "kg; kg nutrient; ha"
      frequency: "Each application"
      temporal_coverage: "Crop cycle"
      site_scope: "Field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Invoice, label, applicator log"
    - protocol_id: cp_field_water
      process_id: "field_production"
      flow_role: "Irrigation"
      record_type: "meter/pump log"
      raw_fields: "source; volume; runtime; area; dates"
      collection_method: "Meter or tested pump flow × runtime; Raw aggregation and attribution: Sum gross delivered water"
      unit: "m3; ha"
      frequency: "Event"
      temporal_coverage: "Crop cycle"
      site_scope: "Field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration and irrigation log"
    - protocol_id: cp_field_energy
      process_id: "field_production"
      flow_role: "Field energy"
      record_type: "fuel/electricity log"
      raw_fields: "operation; carrier; quantity; hours; area"
      collection_method: "Meter or verified rate calculation; Raw aggregation and attribution: Sum by carrier and operation"
      unit: "L; kg; kWh; h"
      frequency: "Operation"
      temporal_coverage: "Crop cycle"
      site_scope: "Field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Invoice, meter, equipment log"
    - protocol_id: cp_field_output
      process_id: "field_production"
      flow_role: "Crop and residue"
      record_type: "field/yield record"
      raw_fields: "area; grain mass; moisture; residue; destination; loss"
      collection_method: "Weigh and moisture-test; declared residue method; Raw aggregation and attribution: Moisture-correct before aggregation"
      unit: "kg; kg DM; ha; %"
      frequency: "Harvest"
      temporal_coverage: "Crop cycle"
      site_scope: "Field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale, moisture and residue evidence"
    - protocol_id: cp_field_emissions
      process_id: "field_production"
      flow_role: "Direct N2O"
      record_type: "calculation record"
      raw_fields: "N pools; climate; EF1; residue N"
      collection_method: "IPCC calculation from collected N; Raw aggregation and attribution: Calculate by pool, sum once"
      unit: "kg N; kg N2O"
      frequency: "Crop cycle"
      temporal_coverage: "Crop cycle"
      site_scope: "Field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Input ledger and factor version"
    - protocol_id: cp_harvest_batch
      process_id: "harvest_threshing"
      flow_role: "Route, energy, outputs and losses"
      record_type: "batch log"
      raw_fields: "batch; field; route; area; fuel; masses; moisture; destinations"
      collection_method: "Weigh outputs; meter/calculate energy; loss check; Raw aggregation and attribution: Reconcile all outputs and loss"
      unit: "kg; L; kWh; ha; %"
      frequency: "Batch"
      temporal_coverage: "Harvest window"
      site_scope: "Field/route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale, moisture, route log"
    - protocol_id: cp_cleaning_lot
      process_id: "grading_cleaning"
      flow_role: "Inputs, grades, rejects, rework, energy"
      record_type: "lot/campaign log"
      raw_fields: "lot; campaign; masses; moisture; energy; grade; pass; destination"
      collection_method: "Weigh all hand-offs and meter/calculate energy; Raw aggregation and attribution: Count final destination once"
      unit: "kg; %; kWh"
      frequency: "Lot/pass"
      temporal_coverage: "Campaign"
      site_scope: "Lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale, grade test, energy record"
    - protocol_id: cp_drying_batch
      process_id: "drying_aeration"
      flow_role: "Stabilization"
      record_type: "bin/dryer log"
      raw_fields: "batch; route; input/output mass, moisture and temperature; energy; duration; rejects"
      collection_method: "Weigh/test input/output; meter energy; Raw aggregation and attribution: Dry-matter balance and water removal"
      unit: "kg; %; °C; kWh; MJ; h"
      frequency: "Batch"
      temporal_coverage: "Full intervention"
      site_scope: "Bin/batch"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibrated scale, meters, logs"
  calculation_rules:
    - id: calc_moisture
      applies_to: "Grain hand-offs"
      rule: "dry matter = wet mass × (1 − moisture fraction); equivalent target mass = dry matter ÷ (1 − target fraction)"
      inputs:
        - "wet mass"
        - moisture
      output: "dry matter and adjusted mass"
      source_ids:
        - mass-balance-identity
    - id: calc_field_normalization
      applies_to: "Field inventory"
      rule: "field amount ÷ same-field net accepted grain"
      inputs:
        - "field amount"
        - "accepted grain"
      output: "amount/kg reference"
      source_ids:
        - mass-balance-identity
    - id: calc_direct_n2o
      applies_to: "Soil N2O"
      rule: "N2O-N = Σ(N pool × EF1); N2O = N2O-N × 44/28"
      inputs:
        - "N pools"
        - EF1
      output: "kg N2O"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_batch_balance
      applies_to: "Harvest/cleaning/drying"
      rule: "input = accepted + co-products/downgrades + rejects + losses + moisture change"
      inputs:
        - "all hand-off masses and moisture"
      output: "closure and residual"
      source_ids:
        - mass-balance-identity
    - id: calc_drying_water
      applies_to: "Stabilization"
      rule: "input wet mass × input moisture − output wet mass × output moisture"
      inputs:
        - "wet masses"
        - moisture
      output: "kg water removed"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference lot"
      requirement: "Species, class, state, crop year, geography, moisture, grade/destination and routes are present."
      evidence: "Lot and grade records"
    - id: dq_completeness
      applies_to: "All processes"
      requirement: "Every card has a value; zero use requires explicit evidence."
      evidence: "Process checklist and ledgers"
    - id: dq_route_traceability
      applies_to: "Alternatives"
      requirement: "Retain separate route identifiers until weighted aggregation."
      evidence: "Field/batch/campaign identifiers"
    - id: dq_mass_balance
      applies_to: "Harvest/cleaning/drying"
      requirement: "Investigate unexplained dry-matter residual above 5% of input."
      evidence: "Moisture-corrected worksheet"
    - id: dq_temporal
      applies_to: "Dataset"
      requirement: "Include a complete crop cycle and linked post-harvest batches."
      evidence: "Dates and crop-year records"
    - id: dq_representativeness
      applies_to: "Aggregation"
      requirement: "Production-mass weight contributors and disclose exclusions."
      evidence: "Aggregation workbook"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Fail unless output is mature whole dry *Pisum sativum* grain with moisture, grade/destination and route qualifiers."
    source_ids:
      - ndsu-field-pea-production-2021
  - rule_id: validate_route_topology
    applies_to: "Process map"
    rule: "Require field, harvest and cleaning nodes; require drying/aeration only when active, and reject unweighted mixed routes."
    source_ids:
      - saskatchewan-dry-pea-guide
  - rule_id: validate_nutrient_cardinality
    applies_to: "field_production"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids:
      - ndsu-field-pea-fertility-2023
  - rule_id: validate_output_destinations
    applies_to: "Outputs"
    rule: "Require one explicit hand-off for grain, residues, damage/downgrade, rework, foreign matter, rejects and loss; reject double counting."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_rework
    applies_to: "Cleaning/stabilization"
    rule: "Link each rework return to source lot, destination and pass; accepted output excludes unresolved reject/rework mass."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_batch_mode
    applies_to: "Harvest/cleaning/stabilization"
    rule: "Require batch/campaign boundaries and assign clean-out, carryover and shared energy once."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_ranges
    applies_to: "Inventory"
    rule: "Require exactly one complete Range per quantitative card with bounds, unit, denominator/basis, basis kind, evidence and required source ids."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_mass_balance
    applies_to: "Harvest/cleaning/drying"
    rule: "Require moisture-corrected reconciliation and review residual above 5%."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_drying_condition
    applies_to: "drying_aeration"
    rule: "Require input/output moisture and temperature, route, duration and energy; destination limits override the general storage screen."
    source_ids:
      - saskatchewan-dry-pea-guide
published_dataset_profile:
  dataset_role: "Foreground cradle-to-farm-gate mature dry whole pea production dataset"
  downstream_use: "Secondary or background dataset for compatible food, feed and processing models"
  allowed_use: "Dry whole pea grain at farm gate with compatible geography, year, regime, moisture and grade/destination"
  excluded_use: "Green peas, forage/silage, planting seed products, split/milled/fractionated/concentrated/canned/cooked peas or unidentified mixed pulses"
  required_metadata: "PCR id; CPC; UUID; species/class; geography; crop year; field/lot; water regime; harvest and conditioning routes; moisture; grade/destination; allocation; sources"
  required_quality_disclosure: "Coverage; zero-use evidence; measured/estimated shares; range exceptions; mass-balance residual; rework; allocation sensitivity; representativeness"
  update_trigger: "Material change in class, geography, system, yield, nutrient/water regime, harvest, conditioning, specification, allocation, IPCC factors or evidence"
