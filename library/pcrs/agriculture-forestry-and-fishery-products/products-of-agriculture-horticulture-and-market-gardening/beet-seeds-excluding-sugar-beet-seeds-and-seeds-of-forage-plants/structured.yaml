      unit: "kg product"
      frequency: "each application"
      temporal_coverage: "complete crop cycle"
      site_scope: "each field lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice and application log"
    - protocol_id: cp_irrigation
      process_id: "field_multiplication"
      flow_role: "irrigation water"
      record_type: "meter or pumping record"
      raw_fields: "volume, source, field, date, runtime"
      collection_method: "meter preferred; pump calculation documented; Raw aggregation and attribution: sum delivered water"
      unit: "m3"
      frequency: "each event"
      temporal_coverage: "complete crop cycle"
      site_scope: "each field lot"
      aggregation_rule: "per declared reference flow"
