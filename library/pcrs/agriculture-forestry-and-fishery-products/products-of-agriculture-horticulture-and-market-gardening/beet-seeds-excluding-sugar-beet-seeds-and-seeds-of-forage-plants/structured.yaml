allocation_rules:
  - rule_id: allocation_mass_balance
    applies_to: "each process"
    rule: "Reconcile input, intended output, moisture change, residues and rejects on the declared mass and moisture basis."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "cleaning and grading"
    rule: "Do not count rejected lots or screenings as accepted seed; record the destination before applying any avoided-product treatment."
    source_ids:
      - fao-ilri-forage-seed-1996
  - rule_id: allocation_coproduct
    applies_to: "saleable secondary outputs"
    rule: "Prefer subdivision or direct physical attribution; when allocation remains necessary, disclose the outputs, prices, period, formula and sensitivity."
    source_ids: []
  - rule_id: allocation_period
    applies_to: "perennial production"
    rule: "Annualize establishment and termination over documented productive seed yield, retaining year-specific yield and loss records."
    source_ids: []
  - rule_id: allocation_batches
    applies_to: "shared runs and storage"
    rule: "Assign cleaning, changeover, testing and storage burdens using measured run time, mass throughput or another documented causal driver; do not count them twice."
    source_ids: []
