    rule: "Require exactly 1 kg net accepted seed and all required quality qualifiers; keep category UUID blank until a category-compatible row is verified."
    source_ids: []
  - rule_id: validate_lot_link
    applies_to: "all processes"
    rule: "Require unbroken field, harvest, conditioning and release lot links."
    source_ids: []
  - rule_id: validate_rejects
    applies_to: "grade_pack"
    rule: "Accepted output plus destination-specific rejects shall reconcile with conditioned input and documented stock change."
    source_ids: []
  - rule_id: validate_period
    applies_to: "perennial route"
    rule: "Require productive-period evidence and prevent establishment burdens from being charged more than once."
    source_ids: []
