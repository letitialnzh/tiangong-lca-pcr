allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "shared field and harvest operations"
    rule: "Subdivide operations when separate records exist for onion cultivars, products or destinations. When subdivision is not possible, allocate shared burdens by measured mass of marketable bulbs and co-products at the point of separation."
    source_ids:
      - iso-14044-2006-allocation
  - rule_id: allocation_rule_2
    applies_to: "culls and crop residues"
    rule: "Treat culls and residues as co-products or wastes according to their documented destination. Do not apply a credit or substitution claim unless the receiving product, displaced function and evidence are explicitly documented."
    source_ids:
      - iso-14044-2006-allocation
  - rule_id: allocation_rule_3
    applies_to: "conditioning, packing and storage"
    rule: "Allocate shared conditioning, packing and storage inputs by mass of handled output, with storage duration retained when energy depends on time."
    source_ids:
      - iso-14044-2006-allocation
dataset_production:
  collection_protocols:
    - protocol_id: cp_planting_material_records
      process_id: "field_preparation_and_establishment"
      flow_role: "planting material"
      record_type: "supplier lot record and planting log"
      raw_fields: "material form; cultivar; lot; purchased or retained; mass or viable count; planting date"
      collection_method: "reconcile supplier documents with field or protected-unit planting log"
      unit: "kg or count"
      frequency: "each lot and planting event"
      temporal_coverage: "complete crop cycle"
      site_scope: "each declared field or protected unit"
      aggregation_rule: "sum by crop cycle and convert to reference-flow basis"
      quality_evidence: "lot document; planting log; count or mass check"
    - protocol_id: cp_establishment_operation_records
      process_id: "field_preparation_and_establishment"
      flow_role: "establishment fuel"
      record_type: "fuel log, invoice, meter or contractor record"
      raw_fields: "operation; equipment; fuel type; quantity; date; treated area"
      collection_method: "collect primary fuel record and allocate by operation"
      unit: "L, kg or MJ"
      frequency: "each operation or weekly"
      temporal_coverage: "complete crop cycle"
      site_scope: "each declared field or protected unit"
      aggregation_rule: "sum by operation and allocate to onion output"
      quality_evidence: "fuel invoice or meter; equipment record"
    - protocol_id: cp_land_and_site_records
      process_id: "field_preparation_and_establishment"
      flow_role: "land occupation and transformation"
      record_type: "field register, GIS or land-use record"
      raw_fields: "field id; area; land-use history; transformation date; crop-cycle dates"
      collection_method: "verify area against field register or geospatial record"
      unit: "ha and crop-cycle dates"
      frequency: "once per crop cycle and on land-use change"
      temporal_coverage: "current crop cycle and disclosed prior history"
      site_scope: "each declared field or protected unit"
      aggregation_rule: "calculate area-time and flag only current-period transformation"
      quality_evidence: "field map; lease or land-use record; dated change evidence"
    - protocol_id: cp_fertilizer_amendment_records
      process_id: "crop_management"
      flow_role: "fertilizer and soil amendment"
      record_type: "invoice, delivery ticket, label, nutrient plan and application log"
      raw_fields: "product; formulation; mass; N/P/K content; application date; field; operator"
      collection_method: "reconcile purchase and application records with nutrient plan"
      unit: "kg product and kg nutrient"
      frequency: "each delivery and application event"
      temporal_coverage: "complete crop cycle"
      site_scope: "each declared field or protected unit"
      aggregation_rule: "sum product mass and nutrient roles without double counting compound products"
      quality_evidence: "invoice; label or specification; application log"
    - protocol_id: cp_irrigation_and_withdrawal_records
      process_id: "crop_management"
      flow_role: "irrigation delivery and source withdrawal"
      record_type: "meter, pump log, water balance and source record"
      raw_fields: "source; meter start/end; delivered volume; pumping energy; rainfall; field; date"
      collection_method: "meter readings or documented ETc/water balance with source separation"
      unit: "m3"
      frequency: "each event or weekly"
      temporal_coverage: "complete crop cycle"
      site_scope: "each declared field and water source"
      aggregation_rule: "sum delivery and withdrawal separately; reconcile losses"
      quality_evidence: "meter calibration; pump log; water permit or source record"
    - protocol_id: cp_crop_protection_records
      process_id: "crop_management"
      flow_role: "crop-protection products"
      record_type: "product label, invoice and application log"
      raw_fields: "formulation; active substance; mass or volume; date; field; treated area"
      collection_method: "reconcile purchase and application records"
      unit: "kg or L product"
      frequency: "each application event"
      temporal_coverage: "complete crop cycle"
      site_scope: "each declared field or protected unit"
      aggregation_rule: "sum by named product and application event"
      quality_evidence: "label; invoice; application log"
    - protocol_id: cp_crop_management_input_records
      process_id: "crop_management"
      flow_role: "field fuel and electricity"
      record_type: "fuel log, invoice, meter or equipment record"
      raw_fields: "operation; fuel or electricity; quantity; date; field; equipment"
      collection_method: "collect meter or primary supplier record and allocate by operation"
      unit: "L, kg, MJ or kWh"
      frequency: "each operation or weekly"
      temporal_coverage: "complete crop cycle"
      site_scope: "each declared field or protected unit"
      aggregation_rule: "sum by energy carrier and crop cycle"
      quality_evidence: "meter or invoice; equipment record"
    - protocol_id: cp_crop_emission_activity_records
      process_id: "crop_management"
      flow_role: "soil emissions and loss pathways"
      record_type: "nutrient, soil, climate, water and residue records"
      raw_fields: "N source and amount; soil and climate class; irrigation; residue; receiving medium; factor choice"
      collection_method: "calculate from reconciled activity data or retain measured emission record"
      unit: "kg N input; kg N2O-N, NH3-N, nitrate-N or phosphate-P"
      frequency: "each application and crop-cycle reconciliation"
      temporal_coverage: "complete crop cycle"
      site_scope: "each declared field or protected unit"
      aggregation_rule: "calculate each pathway once and convert N2O-N to N2O only at reporting stage"
      quality_evidence: "nutrient reconciliation; soil or climate record; method worksheet"
    - protocol_id: cp_harvest_and_cure_records
      process_id: "harvest_and_field_curing"
      flow_role: "harvest energy, harvested bulbs, culls and residues"
      record_type: "harvest log, weighbridge, field record and destination record"
      raw_fields: "date; field; harvested mass; moisture; grade; cull mass; residue mass; destination; energy"
      collection_method: "weigh or document outputs and reconcile with operation records"
      unit: "kg, mass-% moisture, L, kg or MJ"
      frequency: "each harvest lot and operation"
      temporal_coverage: "complete crop cycle"
      site_scope: "each declared field and harvest lot"
      aggregation_rule: "sum by lot and reconcile harvested bulbs, culls and residues"
      quality_evidence: "scale or weighbridge; moisture test; destination record"
    - protocol_id: cp_conditioning_and_storage_records
      process_id: "postharvest_conditioning_and_storage"
      flow_role: "conditioning, packing, storage and wastewater"
      record_type: "facility log, meter, packing record, storage log and waste record"
      raw_fields: "input and output mass; water; electricity; packaging; duration; temperature; rejects; wastewater; destination"
      collection_method: "collect facility records and lot-level mass balance"
      unit: "kg, m3, kWh, kg packaging and storage time"
      frequency: "each lot and storage campaign"
      temporal_coverage: "included conditioning or storage period"
      site_scope: "each included facility and lot"
      aggregation_rule: "allocate by handled mass and storage duration; reconcile final output and losses"
      quality_evidence: "scale; meter; packing specification; storage log; treatment record"
    - protocol_id: cp_packaging_records
      process_id: "postharvest_conditioning_and_storage"
      flow_role: "packaging materials"
      record_type: "packaging invoice, specification and packing log"
      raw_fields: "material; unit mass; quantity; reuse; lot; destination"
      collection_method: "reconcile packaging specification with packed output"
      unit: "kg material and package count"
      frequency: "each packing campaign"
      temporal_coverage: "included packing period"
      site_scope: "each included facility"
      aggregation_rule: "sum material mass and allocate by packed output"
      quality_evidence: "supplier specification; packing log; reuse record"
  calculation_rules:
    - id: calculation_rule_1
      applies_to: "reference normalization"
      rule: "Normalize each collected or calculated value to 1,000 kg of marketable farm-gate onion output: value × 1,000 / declared marketable output mass."
      inputs:
        - "collected output mass"
        - "row amount"
      output: "PCR-basis amount"
      source_ids: []
    - id: calculation_rule_2
      applies_to: "fertilizer and soil-amendment nutrients"
      rule: "For each applied product, nutrient amount = product mass × documented nutrient fraction. Sum each nutrient role separately and retain product mass as its own record."
      inputs:
        - "product mass"
        - "N/P/K fraction"
        - "application event"
      output: "kg product, kg N, kg P2O5 and/or kg K2O"
      source_ids: []
    - id: calculation_rule_3
      applies_to: "irrigation and source withdrawal"
      rule: "Use meter totals where available. If a water balance is needed, estimate delivered irrigation from ETc and effective rainfall or soil-water balance, then keep source withdrawal and delivery as separate values."
      inputs:
        - ET0
        - "onion Kc"
        - rainfall
        - "soil-water balance"
        - "meter readings"
      output: "m3 delivered irrigation and m3 source withdrawal"
      source_ids:
        - fao-56-crop-evapotranspiration
        - fao-crop-water-needs-onion
    - id: calculation_rule_4
      applies_to: "direct and indirect nitrogen emissions"
      rule: "Apply the selected IPCC managed-soils method to each documented nitrogen source and pathway. Report N2O-N first and convert to N2O with 44/28 only when the chosen reporting unit requires it."
      inputs:
        - "synthetic and organic N"
        - "residue N"
        - "climate and soil conditions"
        - "volatilization and leaching activity"
      output: "kg N2O-N, kg N2O, NH3-N and nitrate-N pathway amounts"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calculation_rule_5
      applies_to: "harvested output and co-products"
      rule: "Reconcile harvested bulbs, marketable output, culls and residues by lot. Allocate shared burdens at the first measured point of separation and retain the destination of each nonmarketable stream."
      inputs:
        - "lot masses"
        - moisture
        - grade
        - destination
      output: "marketable output, cull and residue amounts"
      source_ids:
        - iso-14044-2006-allocation
    - id: calculation_rule_6
      applies_to: "optional conditioning and storage"
      rule: "For each included lot, final marketable output = conditioning input − rejects − storage losses, with water, packaging, energy and duration allocated to handled mass."
      inputs:
        - "conditioning input"
        - rejects
        - losses
        - "handled mass"
        - "storage duration"
      output: "final reference output and loss amounts"
      source_ids: []
  data_quality_requirements:
    - id: quality_requirement_1
      applies_to: "identity and product state"
      requirement: "The dataset must identify *Allium cepa* bulb form, cultivar or commercial type, colour, geography, crop cycle, maturity, moisture, grade, size and included conditioning state."
      evidence: "Codex CXS 348-2022; product description; lot records"
    - id: quality_requirement_2
      applies_to: "input completeness"
      requirement: "Reconcile planting material, nutrient products, crop-protection products, irrigation, source withdrawal, fuel and electricity to field or facility records and explain any missing route."
      evidence: "supplier records; meters; application logs; mass balance"
    - id: quality_requirement_3
      applies_to: "temporal and geographic representativeness"
      requirement: "State the crop year or campaign, field or facility location, production system and the time period represented."
      evidence: "field register; facility register; dated records"
    - id: quality_requirement_4
      applies_to: "emissions and nutrient calculations"
      requirement: "Retain the nitrogen source basis, soil or climate conditions, factor choice, water-loss pathway and conversion units for every calculated emission."
      evidence: "IPCC 2019 Refinement method worksheet; calculation record"
    - id: quality_requirement_5
      applies_to: "output and co-product reconciliation"
      requirement: "Reconcile marketable bulbs, culls, residues, rejects and storage losses by lot, and document the destination of every stream that crosses the boundary."
      evidence: "weighbridge or scale; moisture/grade record; destination record"
    - id: quality_requirement_6
      applies_to: "disclosure and uncertainty"
      requirement: "Disclose measured, calculated and provisional values separately. Replace reasoned screening ranges with site or route evidence before active review when they constrain a publication-critical result."
      evidence: "collection protocols; calculation worksheets; review record"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "reference flow"
    rule: "Confirm that the reference amount is 1,000 kg and that product identity, maturity, moisture, grade, size, geography, crop cycle and included conditioning qualifiers are present."
    source_ids:
      - codex-cxs-348-onions-2022
  - rule_id: validation_rule_2
    applies_to: "process map and inventory"
    rule: "Confirm that every required process has an inventory section and that each flow card has a direction, flow type, amount rule, value mode, specificity, basis kind, evidence kind and collection protocol when required."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "nutrient and emission completeness"
    rule: "For every applied nutrient product, confirm documented nutrient content and a non-duplicated calculation of direct N2O, volatilization and leaching/runoff pathways when those pathways occur."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_rule_4
    applies_to: "irrigation and water withdrawal"
    rule: "Confirm that delivered irrigation and source withdrawal are separate, source and field are identified, and any ETc or water-balance estimate retains its assumptions and units."
    source_ids:
      - fao-56-crop-evapotranspiration
      - fao-crop-water-needs-onion
  - rule_id: validation_rule_5
    applies_to: "output mass balance"
    rule: "Confirm lot-level reconciliation of harvested bulbs, marketable output, culls, residues, conditioning rejects, storage losses and declared destinations. Investigate unexplained negative or excess balances."
    source_ids:
      - iso-14044-2006-allocation
  - rule_id: validation_rule_6
    applies_to: "quality and hygiene disclosure"
    rule: "Where the farm-gate state is described as fresh market produce, check the declared whole, firm, sound, clean, mature and sufficiently dry state and any applicable hygiene, pesticide-residue and contaminant disclosure."
    source_ids:
      - codex-cxs-348-onions-2022
      - codex-cxc-53-hygiene-fresh-fruit-vegetables-2003
published_dataset_profile:
  dataset_role: "Foreground crop-production dataset that may be published as a secondary_dataset; an aggregated farm-gate onion dataset may also serve as a background_dataset only when its provenance and intended technology are explicit"
  downstream_use: "Construction of onion product-system processes and lifecycle models at the declared farm-gate reference flow"
  allowed_use: "Comparative or screening LCA for the declared onion form, geography, crop cycle, production system and farm-gate state; aggregation across sites only when the stated representativeness and allocation basis remain valid"
  excluded_use: "Green onion or shallot modelling; industrial-processing products; retail or consumer-stage claims; extrapolation to another climate, irrigation regime, cultivar or grade without a documented adjustment"
  required_metadata: "PCR id and version; product and crop form; cultivar or commercial type; colour; geography; field or facility; crop-cycle dates; production system; reference amount; moisture, grade and size; included conditioning/storage; source and provider metadata for background inputs"
  required_quality_disclosure: "Measured versus calculated values; site and time coverage; input completeness; water and nutrient basis; emission method and factors; output and co-product mass balance; residue and reject destinations; uncertainty or screening-range status"
  update_trigger: "New crop year or production system; change in irrigation, nutrient, crop-protection or energy practice; changed market state or conditioning boundary; revised emission method; material change in grade, moisture or allocation basis"
