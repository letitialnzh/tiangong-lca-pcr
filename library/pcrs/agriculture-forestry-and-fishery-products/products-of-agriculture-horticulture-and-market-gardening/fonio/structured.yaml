allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "field production and primary preparation"
    rule: "Prefer separate records for field production, harvest, and primary preparation, and measure grain, useful straw, useful screenings, and disposal waste separately before applying allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_field_residue
    applies_to: "residues retained, incorporated, or burned"
    rule: "Do not treat retained residues as co-products; include their management and associated emissions in field production and prevent double counting with removed straw."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: allocation_removed_straw
    applies_to: "useful removed straw or fodder"
    rule: "If subdivision cannot resolve shared field burdens, apply economic allocation using contemporaneous farm-gate values, disclose moisture bases, and test mass allocation as a sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_primary_outputs
    applies_to: "useful screenings and grain fractions"
    rule: "Treat an intentionally marketed fraction with positive value as a co-product and other rejects as waste; allocate only the separated primary-preparation burdens when subdivision is infeasible."
    source_ids:
      - iso-14044-2006
