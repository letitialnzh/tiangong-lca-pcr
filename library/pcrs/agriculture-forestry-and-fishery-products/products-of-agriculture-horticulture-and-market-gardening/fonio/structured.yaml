measurement_rules:
  - id: reference_mass_as_received
    applies_to: "reference fonio grain"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report the as-received grain mass together with measured moisture and the basis used for any dry-matter conversion."
  - id: species_and_state_identity
    applies_to: "reference product"
    required_property_ref:
      name: "product identity"
      uuid: ""
    required_unit: "categorical"
    rule: "Identify white or black fonio and retain whether the hull is present; do not use a generic millet or dehulled-fonio flow as a substitute."
  - id: area_to_reference_conversion
    applies_to: "area-based field flows"
    required_property_ref:
      name: "activity-specific property"
      uuid: ""
    required_unit: "activity-specific unit"
    rule: "Divide crop-cycle totals per hectare by marketable grain yield from the same fields and crop year before scaling to 1,000 kg grain."
  - id: nutrient_basis
    applies_to: "nutrient applications"
    required_property_ref:
      name: "nutrient mass"
      uuid: ""
    required_unit: "kg N, kg P2O5, or kg K2O"
    rule: "Preserve formulated product mass, nutrient content, and reporting basis as separate fields."
  - id: moisture_basis_consistency
    applies_to: "grain and residue masses"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use one declared wet or dry basis within each balance; convert only with measured moisture and retain the original wet mass."
process_map:
