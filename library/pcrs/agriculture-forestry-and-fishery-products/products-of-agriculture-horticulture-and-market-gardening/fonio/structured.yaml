system_boundary:
  rules:
    - rule_id: boundary_crop_cycle_to_farm_gate
      applies_to: "all conforming datasets"
      rule: "Include field preparation, sowing, crop management, harvest, field drying, threshing, and farm-gate primary dry cleaning or drying when those operations occur before hand-off."
      source_ids:
        - fao-millets-fonio
        - cirad-fonio-production-postharvest
    - rule_id: boundary_primary_vs_food_processing
      applies_to: "post-harvest operations"
      rule: "Exclude dehulling, husk removal, washing, de-sanding, milling, precooking, parboiling, brewing, and other food preparation; declare them as downstream operations."
      source_ids:
        - cirad-fonio-production-postharvest
        - fao-fonio-postharvest
    - rule_id: boundary_direct_field_emissions
      applies_to: "managed soil and field emissions"
      rule: "Include direct and indirect nitrogen-related emissions using a geographically applicable method and the same nutrient, residue, soil, and climate activity data used for the inventory."
      source_ids:
        - ipcc-2019-managed-soils
        - emep-eea-2023-guidebook
    - rule_id: boundary_residue_fate
      applies_to: "stalks, leaves, chaff, and other residues"
      rule: "Distinguish residues retained or returned to soil, burned, removed as useful fodder, and removed as waste; prevent double counting residue nitrogen and exported biomass."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: boundary_post_gate_exclusion
      applies_to: "downstream activities"
      rule: "Exclude off-farm transport, commercial storage, packaging, dehulling, washing, milling, food manufacture, and consumption unless the study scope explicitly extends beyond this PCR."
      source_ids: []
