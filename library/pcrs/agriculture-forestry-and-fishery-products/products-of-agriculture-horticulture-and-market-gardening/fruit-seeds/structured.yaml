allocation_rules:
  - rule_id: allocation_process_subdivision
    applies_to: "shared production, harvest, extraction, conditioning, and storage burdens"
    rule: "Prefer process subdivision and direct lot records. Attribute operation-specific inputs and outputs directly to the seed lot whenever the records allow it."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_fruit_co_product
    applies_to: "edible fruit, pulp, flesh, or another intended co-product"
    rule: "First classify the stream as intended co-product, residue, or waste from recipient, function, quality, and hand-off evidence. If co-product allocation is necessary, use the declared physical or economic relationship selected by the data package, document the basis and sensitivity, and do not credit an undocumented use."
    source_ids:
      - iso-14044-2006
      - fao-local-vegetable-seed-production
  - rule_id: allocation_seed_grade_outputs
    applies_to: "accepted and downgraded seed lots"
    rule: "Treat accepted and downgraded seed as separate intended outputs only when both have declared sowing functions and hand-offs. Allocate shared burdens using the declared physical, mass, or economic basis and keep rejected seed outside the accepted reference output."
    source_ids:
      - iso-14044-2006
      - oecd-seed-schemes
  - rule_id: allocation_cross_period_mother_plants
    applies_to: "orchards, perennial mother plants, and multi-year seed gardens"
    rule: "Link establishment, productive, replacement, and termination events to reporting periods. Attribute shared perennial inputs to the seed outputs of the same declared period using a documented period basis; do not count establishment or termination burdens in more than one period."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_rejected_and_rework
    applies_to: "rejects, returns, reconditioning, and storage losses"
    rule: "Keep rejects and rework linked to their producing node. Retain burdens on material sent back for rework, add the rework operation once, and do not count reworked material as a second accepted output. Discarded material receives no product credit."
    source_ids:
      - fao-seed-production-manual
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_source_seed_lot
      process_id: "fruit_seed_multiplication"
      flow_role: "source seed or parental material"
      record_type: "lot register, invoice, seed certificate, or internal transfer record"
      raw_fields: "lot id; species; cultivar or line; class; supplier or origin; mass; moisture; treatment; date"
      collection_method: "transcribe primary lot record and verify against receipt"
      unit: "kg; percent; declared categorical fields"
      frequency: "every source lot"
      temporal_coverage: "each production cycle"
      site_scope: "each production unit and source lot"
      aggregation_rule: "retain one record per source lot; aggregate only after identity reconciliation"
      quality_evidence: "lot record, label, certificate, receiving check"
    - protocol_id: cp_field_management_inputs
      process_id: "fruit_seed_multiplication"
      flow_role: "nutrients, amendments, crop protection"
      record_type: "purchase, application, and farm-management records"
      raw_fields: "product; formulation; nutrient or active basis; quantity; date; area; method; lot; fate"
      collection_method: "reconcile purchase and application records to the production unit"
      unit: "kg product; kg nutrient or active ingredient; ha"
      frequency: "every application"
      temporal_coverage: "full crop cycle or perennial reporting period"
      site_scope: "each field, greenhouse, orchard block, or seed garden"
      aggregation_rule: "sum actual applications by production unit and period"
      quality_evidence: "invoice, label, nutrient plan, application log"
    - protocol_id: cp_irrigation_and_withdrawal
      process_id: "fruit_seed_multiplication"
      flow_role: "irrigation and water withdrawal"
      record_type: "meter, pump log, source record, drainage or discharge record"
      raw_fields: "source; meter start/end; delivered volume; recirculation; drainage; rainfall or other declared water; date"
      collection_method: "read meters and reconcile source withdrawal to delivery and discharge"
      unit: "m3 or kg"
      frequency: "each irrigation event or monthly meter"
      temporal_coverage: "full crop cycle or reporting period"
      site_scope: "each water source and production unit"
      aggregation_rule: "aggregate by source and production unit; keep withdrawal and delivery separate"
      quality_evidence: "calibrated meter, pump log, water record"
    - protocol_id: cp_field_energy
      process_id: "fruit_seed_multiplication"
      flow_role: "field energy"
      record_type: "fuel issue, machine log, electricity meter, contractor invoice"
      raw_fields: "operation; carrier; quantity; machine; area or lot; date; factor reference"
      collection_method: "collect primary carrier records and contractor activity data"
      unit: "L, kg, MJ, or kWh"
      frequency: "every operation or monthly"
      temporal_coverage: "full crop cycle or reporting period"
      site_scope: "each production unit and operation"
      aggregation_rule: "allocate only documented operations to the seed route"
      quality_evidence: "meter, fuel issue, contractor record"
    - protocol_id: cp_land_and_period
      process_id: "fruit_seed_multiplication"
      flow_role: "land occupation and periods"
      record_type: "field register, map, lease, planting and removal records"
      raw_fields: "area; production-unit id; land-use class; planting and termination dates; productive periods; replacement events"
      collection_method: "verify area and dates against field or orchard register"
      unit: "ha; m2; ha a; date"
      frequency: "each planting, replacement, or termination event"
      temporal_coverage: "full productive life for perennial units"
      site_scope: "each field, orchard block, greenhouse, or seed garden"
      aggregation_rule: "calculate area-time by declared period and output basis"
      quality_evidence: "map, register, dated field record"
    - protocol_id: cp_harvest_lot
      process_id: "fruit_seed_harvest_capture"
      flow_role: "harvest, field loss, residue, and hand-off"
      record_type: "harvest sheet, weighbridge, bin or crate record, field-loss log"
      raw_fields: "lot id; production unit; harvest date; gross and tare; mature material; loss; residue; co-product; destination"
      collection_method: "weigh or estimate with documented method at harvest"
      unit: "kg; percent moisture"
      frequency: "every harvest or collection event"
      temporal_coverage: "full harvest campaign"
      site_scope: "each production unit and lot"
      aggregation_rule: "aggregate only after lot and moisture reconciliation"
      quality_evidence: "weighbridge, tare record, harvest log"
    - protocol_id: cp_extraction_batch
      process_id: "fleshy_seed_extraction_or_dry_seed_extraction"
      flow_role: "extraction inputs, intermediates, rejects, and energy"
      record_type: "batch sheet, equipment log, meter, moisture and residence-time record"
      raw_fields: "input lot; route; method; water; energy; time; temperature where relevant; input/output mass; moisture; rejects; residuals; hand-off"
      collection_method: "record each extraction batch and link to lot ids"
      unit: "kg; m3; kWh; MJ; percent; hours or days"
      frequency: "every batch"
      temporal_coverage: "full extraction campaign"
      site_scope: "each extraction line and lot"
      aggregation_rule: "reconcile each batch before campaign aggregation"
      quality_evidence: "batch sheet, meter, moisture test, equipment log"
    - protocol_id: cp_conditioning_batch
      process_id: "seed_drying_primary_conditioning"
      flow_role: "drying, washing, cleaning, energy, output, and rejects"
      record_type: "conditioning batch sheet, dryer or cleaner log, meter, moisture record"
      raw_fields: "input lot; method; input/output mass; moisture; water; electricity; fuel or heat; screenings; dust; disposition"
      collection_method: "record each conditioning batch and verify output state"
      unit: "kg; m3; kWh; MJ; percent"
      frequency: "every batch"
      temporal_coverage: "full conditioning campaign"
      site_scope: "each line, facility, and lot"
      aggregation_rule: "aggregate by lot and declared moisture basis"
      quality_evidence: "batch sheet, meter, moisture test, waste ticket"
    - protocol_id: cp_quality_testing
      process_id: "seed_grading_testing_lot_release"
      flow_role: "grade, sample, testing, and release"
      record_type: "laboratory report, sampling record, grade sheet, release decision"
      raw_fields: "lot id; sample id; sample mass; purity; germination or viability; health; moisture; method; date; grade; disposition"
      collection_method: "use documented sampling and test methods and retain the release decision"
      unit: "kg; percent; categorical result"
      frequency: "every lot and required retest"
      temporal_coverage: "each lot and release period"
      site_scope: "each facility and laboratory"
      aggregation_rule: "weight or reconcile lots only after test method and lot identity match"
      quality_evidence: "laboratory report, sampler record, certificate, release sign-off"
    - protocol_id: cp_treatment_packaging_storage
      process_id: "seed_treatment_packaging_storage"
      flow_role: "treatment, package, storage, and presentation"
      record_type: "treatment log, package specification, issue record, inventory ledger, storage log"
      raw_fields: "lot id; treatment product and dose; package type and mass; fill count; reuse; opening and closing stock; temperature or humidity where relevant; loss; dispatch"
      collection_method: "reconcile treatment and packaging records to inventory movements and gate output"
      unit: "kg; item; kWh; percent; date; storage duration"
      frequency: "every treatment, packaging run, inventory movement, or monthly storage record"
      temporal_coverage: "included treatment and storage period"
      site_scope: "each facility, storage room, and lot"
      aggregation_rule: "use lot-level reconciliation; allocate shared storage by documented mass-time basis"
      quality_evidence: "treatment record, package spec, meter, inventory ledger"
    - protocol_id: cp_co_product_and_residue_fate
      process_id: "fruit_seed_harvest_capture_or_extraction_conditioning_process"
      flow_role: "co-product, residue, reject, and waste destination"
      record_type: "sales or transfer record, recipient confirmation, compost or disposal ticket"
      raw_fields: "stream; mass; moisture; intended use; recipient; quality; hand-off; treatment; date"
      collection_method: "link the output stream to a durable destination record"
      unit: "kg; percent; categorical fate"
      frequency: "every output stream"
      temporal_coverage: "full production and processing campaign"
      site_scope: "each production unit and receiving destination"
      aggregation_rule: "never aggregate distinct destinations without retaining stream identity"
      quality_evidence: "invoice, transfer note, waste ticket, recipient record"
    - protocol_id: cp_emission_context
      process_id: "fruit_seed_multiplication_or_seed_drying_primary_conditioning"
      flow_role: "elementary emissions and method context"
      record_type: "soil, climate, nutrient, drainage, emission, dust, and factor record"
      raw_fields: "substance; receiving medium; soil; climate; nutrient input; residue fate; irrigation; drainage; method tier; factor; measurement; date"
      collection_method: "collect method inputs and calculated result with source and unit"
      unit: "kg substance; kg N; ha; m3; factor unit"
      frequency: "each application, event, or reporting period"
      temporal_coverage: "full crop cycle, batch, or period"
      site_scope: "each production unit and emission source"
      aggregation_rule: "calculate once per declared method and reconcile to activity data"
      quality_evidence: "method sheet, laboratory or meter record, factor citation"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground rows"
      rule: "normalized amount = recorded or calculated amount × 1 kg / net accepted reference seed at the same gate and declared moisture basis"
      inputs:
        - "process amount"
        - "net accepted reference seed"
        - "moisture basis"
      output: "amount per 1 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: calc_seed_dry_matter_conversion
      applies_to: "harvest, extraction, conditioning, storage, and delivery"
      rule: "dry matter = as-received mass × (1 − moisture fraction); mass at target basis = dry matter / (1 − target moisture fraction); use a species-specific rule or retain as-received mass for recalcitrant seed"
      inputs:
        - "as-received mass"
        - "measured moisture"
        - "declared target basis"
        - "recalcitrant status"
      output: "comparable mass and moisture-basis conversion"
      source_ids:
        - fao-tree-seed-handling
        - mass-balance-identity
    - id: calc_managed_soil_emissions
      applies_to: "field nutrient and residue emissions"
      rule: "Apply one selected IPCC or regionally accepted tier to actual mineral and organic nutrient inputs, residue returns, volatilization, leaching, soil, climate, and management context; convert reported N2O-N, NH3-N, or nitrate-N only once and retain the original basis."
      inputs:
        - "nutrient records"
        - "residue fate"
        - "soil and climate"
        - "method tier and factors"
      output: "declared elementary emissions by substance and receiving medium"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calc_land_occupation
      applies_to: "productive land"
      rule: "area-time = production-unit area × declared occupation time; normalize by calc_reference_normalization; for perennial units use the declared productive, replacement, and termination periods."
      inputs:
        - area
        - dates
        - "production period"
        - "accepted seed output"
      output: "ha a or m2 a per reference flow"
      source_ids:
        - ipcc-2019-cropland
        - mass-balance-identity
    - id: calc_water_balance
      applies_to: "irrigation, extraction, conditioning, and discharge"
      rule: "Reconcile source withdrawal, delivered water, recirculation, evaporation, retained water, and discharge. Do not count source withdrawal and supplied process water as the same exchange."
      inputs:
        - "source and process-water records"
        - "meter readings"
        - "discharge and recirculation"
      output: "water inputs, withdrawal, and discharge by process"
      source_ids:
        - fao-tree-seed-handling
        - mass-balance-identity
    - id: calc_extraction_yield
      applies_to: "fleshy and dry extraction"
      rule: "extraction recovery = seed intermediate mass on declared basis / received seed-bearing material mass on the same basis; retain co-products, residuals, rejects, and unexplained fraction separately."
      inputs:
        - "input/output masses"
        - moisture
        - "co-product and reject records"
      output: "recovery ratio and reconciled extraction outputs"
      source_ids:
        - fao-local-vegetable-seed-production
        - fao-tree-seed-handling
        - mass-balance-identity
    - id: calc_conditioning_yield
      applies_to: "primary conditioning"
      rule: "conditioning recovery = conditioned seed mass / raw or extracted seed input mass after moisture conversion; reconcile accepted seed, screenings, dust, rejects, moisture loss, and unexplained fraction."
      inputs:
        - "conditioning input/output"
        - moisture
        - "screening and loss records"
      output: "conditioning recovery and mass balance"
      source_ids:
        - fao-seed-production-manual
        - mass-balance-identity
    - id: calc_quality_lot_aggregation
      applies_to: "lot release and campaign aggregation"
      rule: "Aggregate only lots with matching identity, route, moisture basis, test method, and declared quality class. Report mass-weighted quality values only when the test method permits; otherwise retain lot results separately."
      inputs:
        - "lot mass"
        - "quality results"
        - "test method"
        - "lot identity"
      output: "accepted lot set and quality disclosure"
      source_ids:
        - ista-international-rules
        - oecd-seed-schemes
    - id: calc_co_product_attribution
      applies_to: "fruit, pulp, flesh, or other intended co-products"
      rule: "Prefer subdivision. When shared burdens remain, apply the declared physical or economic allocation basis to the evidenced intended outputs and disclose sensitivity; residues and wastes receive no co-product credit."
      inputs:
        - "shared process burdens"
        - "output masses or values"
        - "intended-use evidence"
      output: "attributed seed burden and co-product burden"
      source_ids:
        - iso-14044-2006
        - fao-local-vegetable-seed-production
    - id: calc_period_attribution
      applies_to: "perennial orchards, mother plants, seed gardens, and multi-period storage"
      rule: "Link each input, asset, output, replacement, termination, and storage event to one period. Attribute shared burdens once to the declared output basis of that period and reconcile period opening and closing records."
      inputs:
        - "period records"
        - output
        - "establishment/replacement/termination"
        - "storage records"
      output: "period-attributed inventory and no-double-counting check"
      source_ids:
        - iso-14044-2006
        - mass-balance-identity
    - id: calc_reusable_packaging_mass
      applies_to: "reusable packaging"
      rule: "packaging mass per lot = package mass assigned to lot / documented service cycles, adjusted only by the documented return or loss rate. If service cycles are unknown, report the full assigned mass and the uncertainty."
      inputs:
        - "package mass"
        - capacity
        - "service cycles"
        - "return/loss rate"
        - "lot assignment"
      output: "packaging mass per reference flow"
      source_ids:
        - fao-seed-production-manual
        - mass-balance-identity
    - id: calc_storage_reconciliation
      applies_to: "included storage"
      rule: "opening stock + receipts − accepted dispatch − closing stock = documented storage loss or rework return, with moisture and lot identity reconciliation."
      inputs:
        - "opening/closing inventory"
        - receipts
        - dispatch
        - loss
        - "rework records"
      output: "storage loss and delivered reference amount"
      source_ids:
        - fao-tree-seed-handling
        - fao-seed-drying-storage-2024
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity_and_lot_traceability
      applies_to: "reference flow and all product rows"
      requirement: "Maintain species or plant identity, cultivar/line or hybrid status, seed class, lot id, production unit, route, and hand-off for every product state. Resolve all fixed UUIDs before final process publication."
      evidence: "fao-seed-systems; ista-international-rules"
    - id: dq_measurement_and_tare
      applies_to: "mass, water, energy, packaging, and emissions"
      requirement: "Retain instrument, invoice, meter, tare, conversion factor, moisture method, unit, and uncertainty or estimation basis. Distinguish measured, calculated, modelled, and provisional values."
      evidence: "mass-balance-identity; ista-international-rules"
    - id: dq_temporal_and_period_coverage
      applies_to: "annual, perennial, storage, and campaign records"
      requirement: "Cover the complete seed production cycle or declared reporting period, all harvest rounds, storage movements, replacements, terminations, and retests. Link each record to one period."
      evidence: "iso-14044-2006; mass-balance-identity"
    - id: dq_input_completeness
      applies_to: "production and processing inputs"
      requirement: "Provide a collected value, justified zero, or documented exclusion for each actual nutrient/amendment, crop-protection product, water, energy carrier, land, treatment, packaging, and storage service."
      evidence: "ipcc-2019-cropland; fao-seed-production-manual"
    - id: dq_quality_release_evidence
      applies_to: "accepted, downgraded, rejected, and reference seed"
      requirement: "Retain sampling plan, test method, sample date, physical purity, germination or viability, moisture, health/treatment state, grade, and release decision."
      evidence: "ista-international-rules; oecd-seed-schemes"
    - id: dq_co_product_and_fate_evidence
      applies_to: "intended co-products, residues, rejects, and wastes"
      requirement: "Retain recipient, function, quality, mass, hand-off, and destination evidence. Do not treat an undocumented residue or rejected stream as a co-product."
      evidence: "iso-14044-2006; fao-seed-production-manual"
    - id: dq_flow_binding_coordinates
      applies_to: "all parameterized and unmapped flows"
      requirement: "Preserve flow type, direction, coordinate, function, group, property, unit, use context, and geography. Resolve each parameterized Flow Set row and unmapped identity to one verified UUID during foreground generation."
      evidence: "mass-balance-identity"
    - id: dq_method_and_factor_provenance
      applies_to: "elementary emissions and conversions"
      requirement: "Cite the selected method tier, factor, conversion basis, receiving medium, reported substance, and geography. Do not import a factor from a module or use a factor without source and applicability evidence."
      evidence: "ipcc-2019-managed-soils-n2o; ipcc-2019-cropland"
    - id: dq_mass_balance_and_uncertainty
      applies_to: "field, extraction, conditioning, grading, packaging, and storage"
      requirement: "Reconcile incoming, accepted, downgraded, co-product, waste, sample, moisture, and unexplained streams. Report the residual and uncertainty; do not silently force a zero residual."
      evidence: "mass-balance-identity; fao-tree-seed-handling"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Confirm the final species or plant identity, sowing purpose, lot qualifiers, mass property, unit, moisture or viability basis, and declared gate. A final TIDAS process must replace the unresolved reference identity with a verified UUID."
    source_ids:
      - fao-seed-systems
      - ista-international-rules
  - rule_id: validation_scope
    applies_to: "dataset boundary"
    rule: "Confirm the dataset is fruit seed for sowing and does not silently include food fruit, commodity fruit, seedlings, transplants, grafted plants, downstream cultivation, or post-gate distribution."
    source_ids:
      - fao-seed-production-manual
      - fao-seed-systems
  - rule_id: validation_route_choice
    applies_to: "process map"
    rule: "Confirm the selected annual/perennial and field/protected/orchard route, and select fleshy or dry extraction only from current lot evidence. A route delta must change topology, inventory, calculation, data, or validation, not only the label."
    source_ids:
      - fao-local-vegetable-seed-production
      - fao-tree-seed-handling
  - rule_id: validation_process_map
    applies_to: "all processes"
    rule: "Confirm multiplication, harvest/capture, applicable extraction, conditioning, grading/testing, and included presentation/storage are distinct nodes with explicit product hand-offs."
    source_ids:
      - fao-seed-production-manual
      - fao-tree-seed-handling
  - rule_id: validation_flow_binding
    applies_to: "all inventory rows"
    rule: "Accept only applicable parameterized Flow Sets or exact verified UUIDs in final foreground data. Match flow type, direction, coordinate, group, property, unit, function, use context, and geography; otherwise retain unmapped coverage and block final publication."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_nutrient_basis
    applies_to: "nutrient and soil-emission rows"
    rule: "Confirm only actually used products are present, with product mass, nutrient basis, application record, soil context, and one declared emission method. Do not force every fertilizer type."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_water_and_land
    applies_to: "water and land rows"
    rule: "Keep irrigation product input, natural water withdrawal, process water, discharge, and land occupation distinct; verify meter or area-time records and prevent double counting."
    source_ids:
      - ipcc-2019-cropland
      - mass-balance-identity
  - rule_id: validation_quality_release
    applies_to: "accepted and reference seed"
    rule: "Confirm identity, class, physical purity, germination or viability, moisture or recalcitrant state, health/treatment status, sampling method, test date, grade, and lot release."
    source_ids:
      - ista-international-rules
      - oecd-seed-schemes
  - rule_id: validation_co_product_outputs
    applies_to: "fruit, pulp, flesh, and downgraded seed"
    rule: "Enumerate every intended output and hand-off. Apply allocation only when output function and recipient are evidenced; distinguish co-products from residues and waste."
    source_ids:
      - iso-14044-2006
      - fao-local-vegetable-seed-production
  - rule_id: validation_period_attribution
    applies_to: "perennial or multi-period routes"
    rule: "Require period/phase boundaries, link inputs and outputs to one period, record establishment/replacement/termination treatment, and prevent double attribution."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: validation_reject_rework_paths
    applies_to: "rejects, downgraded seed, returns, and losses"
    rule: "Every rejected state must be reworked, downgraded, recovered, treated, or discarded with a declared path. Rework must link to the upstream node and cannot be counted as an accepted output twice."
    source_ids:
      - fao-seed-production-manual
      - mass-balance-identity
  - rule_id: validation_mass_balance
    applies_to: "all process outputs"
    rule: "Reconcile production, harvest, extraction, conditioning, grading, packaging, and storage balances on the declared moisture basis and report any unexplained residual."
    source_ids:
      - mass-balance-identity
      - fao-tree-seed-handling
  - rule_id: validation_storage_and_gate
    applies_to: "included storage and final gate"
    rule: "Verify opening and closing inventory, storage duration, loss or rework, final moisture/viability state, packaging state, and gate hand-off."
    source_ids:
      - fao-tree-seed-handling
      - fao-seed-drying-storage-2024
  - rule_id: validation_dataset_disclosure
    applies_to: "published dataset profile"
    rule: "Confirm all qualifiers, source ids, Flow Set selections, UUID-resolution status, collection coverage, calculation rules, allocation choices, exclusions, quality evidence, and uncertainty are disclosed."
    source_ids:
      - ista-international-rules
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "Foreground secondary dataset for fruit-seed production and conditioning; it may be projected to a TIDAS flow, process, lifecyclemodel, and dataset package after all identities and exchanges are resolved."
  downstream_use: "Use as a seed-production and seed-gate dataset in agricultural, horticultural, forestry, nursery, and product-system models where the seed lot and gate qualifiers match."
  allowed_use: "Comparative or attributional modelling that preserves the declared functional unit, route, gate, quality attributes, moisture basis, period, allocation, and documented co-product and reject treatment."
  excluded_use: "Do not use as a generic fruit crop, fruit-processing, transplant, nursery-plant, or downstream cultivation dataset; do not transfer a route-specific factor or quality threshold to another species without evidence."
  required_metadata: "reference flow; CPC scope; crop or plant identity; cultivar/line or hybrid status; seed class; geography; production-unit type; annual/perennial period; extraction route; moisture or recalcitrant state; purity; germination/viability and test method; treatment; packaging; storage; gate; Flow Set selections; UUID status; collection coverage; allocation; and DQR"
  required_quality_disclosure: "lot and production-unit coverage, temporal and period coverage, meters and measurement methods, quality-release evidence, calculation and emission methods, Flow Set coordinates, unresolved identities, fixed-UUID resolution status, exclusions, mass balances, co-product decisions, reject fates, uncertainty, and data-quality limitations"
  update_trigger: "material change in crop or plant scope, seed class, production route, extraction technology, treatment, packaging, storage, gate, Flow Set contract, UUID identity, emission method, allocation decision, quality specification, or evidence coverage"
