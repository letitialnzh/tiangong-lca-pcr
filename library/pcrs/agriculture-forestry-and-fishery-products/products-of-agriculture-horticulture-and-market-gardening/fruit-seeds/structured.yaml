product_category_identity:
  canonical_pcr_id: "pcr.agriculture-forestry-and-fishery-products.products-of-agriculture-horticulture-and-market-gardening.fruit-seeds"
  classification_refs: "CPC 3.0 01360, Fruit seeds"
  covered_products: "Identifiable fruit-crop or fruit-tree seed lots intended for sowing, including seed extracted from fleshy fruits, dry fruits, pods, stones, or comparable reproductive structures; open-pollinated, hybrid, certified, commercial, farm-saved, and comparable lots when their identity and quality basis are declared"
  excluded_products: "Food or feed fruit with incidental seed; fruit-processing residues not intended as sowing seed; seedlings, transplants, grafted plants, rootstocks, cuttings, and other living planting material; internal breeding stock not sold as seed; downstream cultivation and post-gate distribution"
  representative_product: "Net accepted, identifiable fruit seed lot released for sowing at the declared gate, with declared crop or plant identity, seed class, moisture or viability state, physical purity, germination or viability result, treatment status, and package state"
  production_route: "Managed field, protected-cultivation, orchard, or seed-garden production followed by harvest, wet/fleshy or dry-fruit extraction as applicable, drying and primary conditioning, grading/testing, optional treatment, packaging, and storage"
  market_state: "Accepted seed lot at a declared conditioning-facility, seed-store, or other named gate; bulk and packaged states are allowed when package, storage, moisture, quality, and hand-off qualifiers are declared"
functional_unit:
  what: "Net accepted fruit seed for sowing at the declared seed gate"
  how_much: "1 kg"
  how_well: "Crop or plant identity; cultivar, line, or hybrid status; seed class; production geography; annual or perennial route; fleshy-fruit or dry-fruit route; extraction and treatment status; moisture or viability basis; physical purity; germination or viability result; packaging state; storage duration where included; and declared gate"
  how_long_or_cycle: "One declared seed production cycle and harvest campaign. For perennial orchards or mother plants, record the relevant establishment, productive, replacement, and termination periods and the allocation basis used to assign them to the seed lot."
  reference_flow_link: "fruit_seed_reference_flow"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary starts with a declared source seed or parental material and a prepared production unit, and ends when the accepted seed lot crosses the declared seed gate. It includes managed seed production, harvest, applicable extraction, primary drying and cleaning, grading, testing and lot release, optional seed treatment, packaging, and storage needed to reach the gate. It includes actual nutrient products and soil amendments, crop-protection products, irrigation and water withdrawal, field and processing energy, land occupation, direct managed-soil emissions where modelled, packaging, treatment products, quality testing, and documented rejects or residues. Transport is outside the boundary unless it is required to reach a delivered gate selected in the data package."
      source_ids: []
    - rule_id: boundary_field_to_seed_gate
      applies_to: "all default datasets"
      rule: "Include source or parental seed, managed seed production, harvest, applicable extraction, drying and conditioning, grading/testing, optional treatment, packaging, and storage needed to reach the declared seed gate. Exclude downstream crop cultivation and post-gate distribution."
      source_ids:
        - fao-seed-production-manual
        - fao-seed-systems
    - rule_id: boundary_route_variants
      applies_to: "annual, protected, orchard, seed-garden, fleshy-fruit, and dry-fruit routes"
      rule: "Select one or more evidenced route variants and disclose their changed topology, inventory categories, calculation requirements, or validation requirements. Do not combine mutually exclusive wet and dry extraction operations for a lot without a process record."
      source_ids:
        - fao-local-vegetable-seed-production
        - fao-tree-seed-handling
    - rule_id: boundary_recursive_seed_input
      applies_to: "source seed and parental material"
      rule: "Use the declared starting-condition abstraction for a same-category input that would recurse. Preserve lot identity and disclose the upstream dataset requirement; do not silently assign the source lot a generic zero burden."
      source_ids:
        - fao-seed-systems
        - mass-balance-identity
    - rule_id: boundary_input_completeness
      applies_to: "production, extraction, conditioning, and presentation"
      rule: "Provide a collected value, justified zero, or documented exclusion for actual nutrients and amendments, crop protection, irrigation, water withdrawal, field energy, land, extraction and conditioning energy, treatment, packaging, storage, direct emissions, and residues when they are in scope."
      source_ids:
        - ipcc-2019-cropland
        - ipcc-2019-managed-soils-n2o
        - fao-seed-production-manual
    - rule_id: boundary_output_fate
      applies_to: "all product, waste, and residue outputs"
      rule: "Separate accepted seed, seed-bearing fruit or pods, fruit flesh or pulp, downgraded seed, screenings, empty or damaged seed, crop residue, wash residue, dust, packaging waste, storage loss, and unexplained loss, and record a destination or documented boundary exit for each."
      source_ids:
        - fao-seed-production-manual
        - mass-balance-identity
    - rule_id: boundary_quality_gate
      applies_to: "accepted reference flow"
      rule: "The product crosses the boundary only after the declared identity, seed class, moisture or viability state, physical purity, germination or viability result, treatment status, package state, and lot-release decision are available."
      source_ids:
        - oecd-seed-schemes
        - ista-international-rules
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "The automatic module plan selected managed biological production, harvest/capture, material treatment, primary conditioning, grading/sorting, preservation/stabilization, packaging/presentation, filling/dosing, chemical reaction, alternative production and technology routes, multi-output attribution, multi-period attribution, and rework/reject routing. Product-specific answers are supplied below; module files do not supply product facts, UUIDs, factors, or quantities."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "source_seed_or_parental_material_and_prepared_production_unit"
  starting_condition_role: "identity_and_reproduction_condition"
  product_classification_scope: "current CPC 3.0 01360, Fruit seeds; the PCR identity remains semantic and is not created from the classification leaf alone"
  recursive_input_rule: "A same-category seed input that would recursively trace the product system is recorded as the declared source seed or parental-material starting condition, with lot identity, mass, treatment, and origin disclosure rather than a second recursive seed process."
  upstream_dataset_requirement: "Disclose the source lot or parental-material identity, lot or field origin, mass, seed class, treatment status, moisture basis, and evidence of the upstream boundary. If upstream burdens are included, link the upstream dataset explicitly and do not also treat the same source lot as a zero-burden starting condition."
  disclosure: "Declare the starting production-unit condition, land-use and infrastructure exclusions, annual or perennial period, route variant, intended outputs, quality-release state, gate, and all source-lot and reject fates."
