measurement_rules:
  - id: reference_seed_mass
    applies_to: "reference product and final lot reconciliation"
    required_property_ref:
      name: "Mass (UUID unresolved)"
      uuid: ""
    required_unit: "kg"
    rule: "Express the reference as net accepted seed at the declared gate. Preserve gross, tare, moisture basis, accepted, downgraded, rejected, sample, residue, and unexplained-loss masses separately."
  - id: seed_count_conversion
    applies_to: "count-based seed records"
    required_property_ref:
      name: "Mass (UUID unresolved)"
      uuid: ""
    required_unit: "kg; seeds or item count as supporting data"
    rule: "Convert seed counts to mass only with a measured thousand-seed mass, average seed mass, or other transparent lot-specific conversion. Do not replace a mass reference with an unqualified seed count."
  - id: seed_moisture_basis
    applies_to: "harvest, extraction, conditioning, storage, and delivery"
    required_property_ref:
      name: "Mass and moisture"
      uuid: ""
    required_unit: "kg; percent wet basis or declared dry basis"
    rule: "Declare whether each mass is as-received, wet-basis, dry-basis, or recalcitrant-seed basis. Convert only from recorded mass and moisture; do not apply a universal moisture target across species."
  - id: nutrient_product_and_element_basis
    applies_to: "fertilizer and soil-amendment inputs"
    required_property_ref:
      name: "Product mass and nutrient mass"
      uuid: ""
    required_unit: "kg product; kg N, P, or K as declared"
    rule: "Record only products actually used. Preserve product mass and the declared nutrient basis from the label, supplier specification, nutrient plan, or laboratory result. Do not infer a fertilizer type or concentration."
  - id: water_separation
    applies_to: "irrigation, source withdrawal, extraction, washing, and discharge"
    required_property_ref:
      name: "Volume or mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Keep source withdrawal, delivered irrigation, extraction or washing water, recirculated water, evaporation, retained water, and discharged water distinct. Do not count the same water as both product input and elementary withdrawal."
  - id: energy_carrier_conversion
    applies_to: "field, harvest, extraction, conditioning, testing, treatment, packaging, and storage"
    required_property_ref:
      name: "Energy or carrier quantity"
      uuid: ""
    required_unit: "kWh, MJ, L, kg, or declared carrier unit"
    rule: "Preserve measured carrier, operation, equipment or service, time period, and factor source. Convert carriers only with a declared factor and retain the original activity data."
  - id: quality_attribute_reporting
    applies_to: "released seed lots"
    required_property_ref:
      name: "Quality attribute"
      uuid: ""
    required_unit: "percent, result per test method, or declared categorical state"
    rule: "Report physical purity, germination or viability, health or treatment status, and moisture or recalcitrant state with the test method, sample date, lot id, and acceptance decision. These attributes qualify the reference flow; they are not silently converted to mass."
  - id: packaging_reuse_basis
    applies_to: "packaging and reusable containers"
    required_property_ref:
      name: "Mass or item count"
      uuid: ""
    required_unit: "kg, item, or declared package unit"
    rule: "Record packaging mass or count, capacity, material role, lot assignment, reuse cycles, return rate, and end-of-use hand-off when packaging is inside the declared boundary."
process_map:
  - id: fruit_seed_multiplication
    name: "Managed fruit-seed multiplication"
    inclusion: "required"
    inclusion_condition: "Include the production unit and management operations that generate the seed-bearing reproductive material."
    role: "foreground biological production"
    quantitative_reference: "crop-cycle inputs and mature seed-bearing material"
  - id: fruit_seed_harvest_capture
    name: "Harvest and capture of seed-bearing material"
    inclusion: "required"
    inclusion_condition: "Include harvest or collection as a distinct node when removal from the production unit is separately recorded."
    role: "foreground harvest/capture"
    quantitative_reference: "harvested seed-bearing material and field losses"
  - id: fleshy_seed_extraction
    name: "Fleshy-fruit seed extraction"
    inclusion: "conditional"
    inclusion_condition: "Include for fleshy fruits requiring maceration, soaking, fermentation, pulping, washing, or flotation before seed drying or conditioning."
    role: "alternative extraction and biochemical treatment"
    quantitative_reference: "wet seed intermediate and pulp/residual streams"
  - id: dry_seed_extraction
    name: "Dry-fruit or pod seed extraction"
    inclusion: "conditional"
    inclusion_condition: "Include for pods, dry fruits, stones, or similar structures that require drying, threshing, shelling, or mechanical separation."
    role: "alternative extraction and material treatment"
    quantitative_reference: "dry-extracted seed intermediate and husk/residual streams"
  - id: seed_drying_primary_conditioning
    name: "Seed drying and primary conditioning"
    inclusion: "required"
    inclusion_condition: "Include drying, cleaning, washing, winnowing, sieving, separation, or stabilization needed to create a prepared seed lot."
    role: "foreground conditioning"
    quantitative_reference: "conditioned seed, screenings, and conditioning losses"
  - id: seed_grading_testing_lot_release
    name: "Grading, testing, and lot release"
    inclusion: "required"
    inclusion_condition: "Include classification into declared quality or destination states and the testing/release decision."
    role: "foreground grading and quality release"
    quantitative_reference: "accepted, downgraded, rejected, and sample streams"
  - id: seed_treatment_packaging_storage
    name: "Treatment, presentation, and storage"
    inclusion: "conditional"
    inclusion_condition: "Include only when treatment, portioning, packaging, or storage is inside the declared gate."
    role: "foreground presentation and stabilization"
    quantitative_reference: "packaged reference seed and storage losses"
process_inventory:
  - id: fruit_seed_multiplication
    label: "Managed fruit-seed multiplication"
    inputs:
      product:
        - row_id: source_seed_material
          role: "Source seed or parental material"
          name: "fruit seed or parental reproductive material (unmapped; resolve the actual lot identity during foreground data generation)"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "The declared source lot or parental material enters the multiplication process as the reproductive starting condition. It is not recursively expanded when it is in the same product category."
          amount:
            expression: "measured lot mass at the declared starting condition, with moisture and treatment basis"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_source_seed_lot
              source_ids:
                - fao-seed-systems
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "0.5"
                unit: "kg source lot/kg accepted reference seed"
                basis: "broad first-pass interval across low-yield seed multiplication routes; replace with lot records"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids: []
        - row_id: fruit_seed_multiplication_agricultural_nutrient_inputs
          role: "Agricultural nutrient and fertilizer inputs"
          name: "Agricultural nutrient and fertilizer supply"
          flow_type: "product"
          binding: "parameterized"
          flow_set_ref:
            id: "flow-set.agricultural-nutrient-supply"
            version: "0.3.0"
          property_unit: "Product quantity and nutrient content / kg product, m3 product, kg N, kg P2O5, and kg K2O as applicable"
          description: "Record all mineral fertilizers, organic fertilizers, and nutrient-bearing amendments used by this process in this one consolidated card. Preserve each actual product identity, quantity, formulation, nutrient composition, application event, and allocation; do not count a compound product more than once."
          amount:
            expression: "Collect each actual product quantity once, retain its composition, and calculate declared N, P or P2O5, and K or K2O quantities without duplicating compound or organic products; foreground generation expands the records and resolves every emitted product exchange to one verified UUID."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_field_management_inputs
              source_ids:
                - ipcc-2019-managed-soils-n2o
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "10"
                unit: "kg product/kg accepted reference seed"
                basis: "broad first-pass interval across crop and perennial seed routes; replace with product and application records"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids: []
        - row_id: crop_protection_products
          role: "Crop-protection products actually used"
          name: "formulated crop-protection product (unmapped; resolve actual product identity from foreground records)"
          flow_type: "product"
          property_unit: "Mass / kg product or kg active ingredient"
          description: "Record each actual herbicide, insecticide, fungicide, biological product, or other crop-protection input when it is used in seed production. The product identity, formulation, active ingredient, dose, application, and fate are not inferred from a generic crop name."
          amount:
            expression: "measured product mass and declared active-ingredient basis"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_field_management_inputs
              source_ids:
                - fao-seed-production-manual
            ranges: []
      waste:
        - row_id: crop_residues
          role: "Crop residues and non-seed biomass leaving the production unit"
          name: "crop residue or non-seed biomass (unmapped; resolve destination-specific identity)"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Record leaves, stems, fruit skins, uncollected reproductive material, and other non-seed biomass removed from or returned within the production unit. The fate must distinguish field return, composting, feed or other intended use, burning, treatment, and disposal."
          amount:
            expression: "measured or reconciled residue mass on the declared moisture basis"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_co_product_and_residue_fate
              source_ids:
                - ipcc-2019-cropland
                - mass-balance-identity
            ranges: []
      elementary:
        []
    outputs:
      product:
        - row_id: mature_seed_bearing_material
          role: "Mature seed-bearing fruit, pod, stone, or reproductive structure"
          name: "mature fruit seed-bearing material (unmapped; resolve species- and state-specific identity)"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "The multiplication process hands off the mature seed-bearing material to harvest/capture. The material may be a fleshy fruit, dry fruit, pod, stone, or another declared reproductive structure; it is not yet the reference seed lot."
          amount:
            expression: "measured harvested-ready mass by production unit and lot"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_harvest_lot
              source_ids:
                - fao-local-vegetable-seed-production
                - fao-tree-seed-handling
            ranges: []
      waste:
        - row_id: field_harvest_loss
          role: "Uncollected or field-lost seed-bearing material"
          name: "field-lost seed-bearing material (unmapped; resolve destination-specific identity)"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Material that reaches maturity but is not collected as an intended output is recorded as a field loss or residue, with its fate and moisture basis."
          amount:
            expression: "measured or reconciled field-loss mass"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_harvest_lot
              source_ids:
                - mass-balance-identity
            ranges: []
      elementary:
        - row_id: field_nitrous_oxide
          role: "Direct managed-soil nitrous oxide"
          name: "nitrous oxide to air, receiving medium and reported substance to be resolved (unmapped within applicable emission function)"
          flow_type: "elementary"
          property_unit: "Mass / kg N2O or kg N2O-N as declared"
          description: "Include direct soil N2O only when the declared package models managed-soil emissions. Use the nutrient and residue records from this process and one declared, geographically applicable method tier."
          amount:
            expression: "calculated with calc_managed_soil_emissions from actual nutrient and residue activity data"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_emission_context
              source_ids:
                - ipcc-2019-managed-soils-n2o
            ranges: []
        - row_id: field_ammonia_to_air
          role: "Ammonia to air from managed nutrient inputs"
          name: "ammonia to air (unmapped within applicable emission function)"
          flow_type: "elementary"
          property_unit: "Mass / kg NH3-N or kg NH3 as declared"
          description: "Record volatilized ammonia only when it is included by the selected method and supported by actual nutrient, soil, climate, and application records."
          amount:
            expression: "calculated from declared nutrient inputs and the selected method factors"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_emission_context
              source_ids:
                - ipcc-2019-managed-soils-n2o
            ranges: []
        - row_id: field_nitrate_loss
          role: "Nitrate loss to water or soil"
          name: "nitrate to water or soil (unmapped within applicable emission function)"
          flow_type: "elementary"
          property_unit: "Mass / kg nitrate or kg N as declared"
          description: "Record nitrate leaching or runoff only when the selected method and field records support it, and retain the receiving compartment and reported substance."
          amount:
            expression: "calculated from actual nutrient, irrigation, soil, climate, and drainage or runoff records under the selected method"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_emission_context
              source_ids:
                - ipcc-2019-managed-soils-n2o
            ranges: []
  - id: fruit_seed_harvest_capture
    label: "Harvest and capture of seed-bearing material"
    inputs:
      product:
        - row_id: mature_seed_bearing_material_for_harvest
          role: "Mature seed-bearing material received for harvest"
          name: "mature fruit seed-bearing material (unmapped; resolve the same lot identity as the multiplication output)"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "This is the production hand-off into the distinct harvest/capture node. Its lot id and receiving mass must match the multiplication output record."
          amount:
            expression: "received mass linked to the production-unit and harvest-lot record"
            value_mode: "calculated_value"
            specificity: "product_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_harvest_lot
              source_ids:
                - mass-balance-identity
            ranges: []
        - row_id: harvest_machinery_fuel
          role: "Harvest and collection machinery fuel"
          name: "mobile machinery fuel supply function (specific carrier identity unresolved)"
          flow_type: "product"
          binding: "parameterized"
          flow_set_ref:
            id: "flow-set.energy-supply"
            version: "0.2.0"
            group: "mobile-machinery-fuel"
          property_unit: "Energy or mass / kWh, MJ, L, or kg"
          description: "Record fuel used by harvest machinery, collection vehicles, or on-site handling equipment when it crosses the foreground boundary."
          amount:
            expression: "measured fuel or carrier quantity by harvest lot and operation"
            value_mode: "foreground_record"
            specificity: "technology_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_field_energy
              source_ids:
                - ipcc-2019-cropland
            ranges: []
        - row_id: harvest_electricity
          role: "Harvest and collection electricity"
          name: "electricity supply function (specific electricity identity unresolved)"
          flow_type: "product"
          binding: "parameterized"
          flow_set_ref:
            id: "flow-set.energy-supply"
            version: "0.2.0"
            group: "electricity-supply"
          property_unit: "Energy / kWh"
          description: "Record electricity for powered harvest, sorting at collection, elevators, fans, or on-site transfer when it belongs to this process."
          amount:
            expression: "metered or supplier-recorded electricity by harvest lot"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_field_energy
              source_ids:
                - ipcc-2019-cropland
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: harvested_seed_bearing_material
          role: "Harvested seed-bearing material"
          name: "harvested fruit seed-bearing material (unmapped; resolve species- and state-specific identity)"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Harvested material is handed to the applicable fleshy-fruit or dry-fruit extraction route, or directly to primary conditioning where no separate extraction is needed."
          amount:
            expression: "weighbridge, bin, crate, or lot record after tare subtraction"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "per 1 kg net accepted reference seed"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_harvest_lot
              source_ids:
                - fao-local-vegetable-seed-production
                - fao-tree-seed-handling
            ranges: []
        - row_id: harvested_fruit_co_product
          role: "Intended fruit or pulp co-product at harvest"
          name: "intended fruit or pulp co-product (unmapped; resolve recipient-specific identity)"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "When a seed-bearing fruit is intentionally sold or transferred for food, feed, processing, or another documented function, record that stream as an intended co-product rather than as waste. If the fruit has no documented recipient or function, classify the stream as residue or waste instead."
          amount:
            expression: "measured mass and documented recipient or downstream hand-off"
