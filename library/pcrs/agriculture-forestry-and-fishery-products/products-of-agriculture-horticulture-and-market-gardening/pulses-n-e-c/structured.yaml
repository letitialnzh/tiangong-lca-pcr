  - rule_id: allocation_all_outputs
    applies_to: "each node with multiple intended outputs"
    rule: "Enumerate each intended product and its separate handoff, grade, condition, quantity, destination and use. Distinguish marketable products from residues, incidental material and waste."
    source_ids:
      - fao-pulse-postharvest-2020
      - fao-onfarm-grain-manual-2009
  - rule_id: allocation_method_choice
    applies_to: "shared burdens for intended co-products"
    rule: "When two or more intended products share a process burden that cannot be separated, declare and justify a PCR-compatible physical, economic, or other applicable allocation method using the selected standard or study method. Record the allocation factor, reference period, input measurements and source. This PCR does not impose a universal default factor."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "rejects, downgraded material and residues"
    rule: "Exclude discarded waste from accepted product quantities. Reworked or recovered material follows its linked process route; downgraded or feed-directed material is an intended output only when the actual destination and handoff are recorded."
    source_ids:
      - fao-pulse-postharvest-2020
  - rule_id: allocation_shared_assets
    applies_to: "equipment or storage shared across fields, lots or periods"
    rule: "Identify the shared asset/service, all consuming nodes and periods, and the measured driver used to assign its energy and service burden. Count each shared carrier or service once across the reporting boundary."
    source_ids: []
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "Where several grades from one sorting batch are sold, report all grades as intended outputs and designate the reference grade. Do not treat cleaning rejects, spoiled seed, chaff or other discarded material as a co-product. If residue is actually sold or deliberately used as feed, report its identity, quality, amount and destination as a separate intended output and resolve attribution explicitly. For a single intended product with no other product handoff, no co-product allocation is applied."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_crop_establishment
      process_id: "pulse_cultivation"
      flow_role: "planting seed, nutrients, irrigation, cultivation energy and crop protection"
      record_type: "field and input records"
      raw_fields: "crop species, cultivar, seed lot, field id and area, sowing date, seed source/treatment/quantity, each nutrient product/formulation/composition/application, water source and meter, carrier/product use, operation date"
      collection_method: "collect field logs, seed labels, invoices, fertilizer analyses, water meters and fuel/electricity records; identify each input by operation; Raw aggregation and attribution: sum each actual input by field-season; preserve product and nutrient identities; divide by accepted reference output after allocation"
      unit: "kg, kg nutrient, m3, L, kWh, ha"
      frequency: "each crop-season; each application or operation"
      temporal_coverage: "complete represented crop-season, batch, or included storage period"
      site_scope: "one identified field-season and any shared equipment used"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "dated field log, calibrated meter or invoice, product label/composition, area record and source dataset reference"
    - protocol_id: cp_soil_emissions
      process_id: "pulse_cultivation"
      flow_role: "direct N2O and nitrate-N to water where quantified"
      record_type: "monitored or model-calculated environmental outputs"
      raw_fields: "emission method/version, crop and field, soil/climate inputs, nutrient form/rate/timing, residue terms, irrigation/rainfall terms when required, receiving compartment, uncertainty"
      collection_method: "use one declared crop- and region-appropriate inventory or monitoring method; retain source data and calculation record; do not infer a factor from this PCR; Raw aggregation and attribution: calculate by the chosen method and normalize only after linking all method inputs to the same field-season and output"
      unit: "kg substance or N, kg product"
      frequency: "each crop-season and each receiving compartment"
      temporal_coverage: "complete represented crop-season, batch, or included storage period"
      site_scope: "one field-season; disclose spatial representativeness"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "method source and version, field input records, calculation sheet or monitoring report, receiving medium/source record"
    - protocol_id: cp_harvest_balance
      process_id: "pulse_harvest"
      flow_role: "mature field crop, harvested crop, other intended outputs and discarded material"
      record_type: "harvest and field-loss records"
      raw_fields: "field area, crop stage/date, harvested form, weighed/estimated crop mass, collected area, uncollected loss estimate, damage, co-products, destination and recipient"
      collection_method: "weigh representative lots or use a documented calibrated field sample; retain sampling method, scale and moisture state; Raw aggregation and attribution: link field output to harvested input; identify uncollected field losses separately; normalize accepted output after final conditioning"
      unit: "kg, ha, % moisture"
      frequency: "each harvest lot and field-season"
      temporal_coverage: "complete represented crop-season, batch, or included storage period"
      site_scope: "one species/cultivar, field and harvest period"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale check, sampling record, lot tickets, field notes, destination receipt or sale record"
    - protocol_id: cp_threshing_conditioning
      process_id: "pulse_threshing_pulse_conditioning"
      flow_role: "incoming and prepared seed, energy, intended outputs, rejects and moisture"
      record_type: "process batch records"
      raw_fields: "lot id, crop form, input/output masses, moisture and basis before/after drying, equipment, operation time, each carrier, drying method and weather, cleaning/reject fractions, destinations"
      collection_method: "record weigh tickets or calibrated batch scales, moisture-meter readings, equipment logs and reject disposition; preserve process-stage separation; Raw aggregation and attribution: reconcile input dry matter, accepted seed, co-products, rejects and measured losses; avoid duplicate energy between stages"
      unit: "kg, % wet or dry basis, h, kg/L/kWh/m3 by carrier"
      frequency: "each threshing and conditioning batch"
      temporal_coverage: "complete represented crop-season, batch, or included storage period"
      site_scope: "identified batch, field/campaign, shared equipment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale and moisture-meter calibration, batch sheets, equipment meter/invoice, representative sample and destination records"
    - protocol_id: cp_grading_balance
      process_id: "pulse_grading"
      flow_role: "grade input, reference grade, other intended grades and rejects"
      record_type: "grade and sale/use records"
      raw_fields: "incoming lot, declared grade standard/buyer criteria, output mass per grade, moisture, downgraded/rework/reject state, destination, recipient"
      collection_method: "weigh each grade fraction; sample and test each grade against its declared commercial criteria; link every output to a handoff; Raw aggregation and attribution: sum grade outputs and rejects against incoming conditioned mass; nominate exactly which grade is the reference product"
      unit: "kg, % moisture"
      frequency: "each sorted batch and sale lot"
      temporal_coverage: "complete represented crop-season, batch, or included storage period"
      site_scope: "one crop lot and sorting campaign"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, grade test record, buyer specification, sales/transfer receipt, mass-balance sheet"
    - protocol_id: cp_storage_balance
      process_id: "pulse_storage"
      flow_role: "stored product, storage energy and protection products, losses and exit quality"
      record_type: "storage entry/exit and facility records"
      raw_fields: "lot id, storage facility/container, entry/exit date, mass, moisture and basis, temperature/humidity when available, treatments, carrier, shared facility users, downgraded/recovered/discarded amounts"
      collection_method: "weigh and sample at entry and exit; retain facility logs, treatment records, invoices, monitoring and loss disposition; Raw aggregation and attribution: compare entry/exit dry matter at consistent moisture basis; allocate shared facility energy/treatment once"
      unit: "kg, % moisture, days, carrier-specific unit"
      frequency: "each included storage lot and monitoring interval"
      temporal_coverage: "complete represented crop-season, batch, or included storage period"
      site_scope: "declared facility, container and storage period"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale and meter, moisture readings, treatment label/log, inspection record, disposal or recipient receipt"
  calculation_rules:
    - id: normalize_to_reference_flow
      applies_to: "crop-season and all included processes"
      rule: "Allocate shared burdens first where required; multiply each attributable lot amount by 1,000 kg / accepted reference-grade output mass at the declared handoff. Keep unscaled lot records and allocation factors."
      inputs:
        - "field-season input or output records"
        - "accepted reference-grade mass"
        - "allocation factors"
      output: "amount per 1,000 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: moisture_adjusted_mass_balance
      applies_to: "drying, grading and optional storage"
      rule: "For wet-basis moisture fraction m, calculate dry matter as net mass × (1 − m). Compare entry and exit on a consistent dry-matter basis; convert to the declared gate moisture only with measured moisture and an explicit calculation."
      inputs:
        - "net mass"
        - "measured moisture fraction"
        - "entry/exit point"
      output: "dry-matter balance and mass at reference moisture state"
      source_ids:
        - mass-balance-identity
    - id: crop_emission_method
      applies_to: "direct and indirect field emissions"
      rule: "Apply the declared recognized crop/region emission method and version to the field-season inputs it requires. Report emitted substance and receiving compartment, calculation inputs, factors and uncertainty. Do not apply an unselected generic factor."
      inputs:
        - "method-specific fertilizer"
        - residue
        - water
        - climate
        - "soil and management records"
      output: "method-supported elementary flows"
      source_ids: []
    - id: shared_asset_attribution
      applies_to: "machinery, pumps, dryers, graders or storage used by multiple fields/lots"
      rule: "Assign metered carrier or service amounts using the recorded operation time, throughput, or other declared physical driver; sum assigned amounts back to the shared meter total."
      inputs:
        - "shared meter/service total"
        - "all consuming nodes"
        - "time or throughput records"
      output: "single-counted process-specific amounts"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: identity_one_crop
      applies_to: "product and field-season identity"
      requirement: "Report one pulse species/crop type, cultivar or seed lot, field, area, crop year, geography, harvest form, grade and handoff per dataset."
      evidence: "seed-lot records, field register, grade and lot records"
    - id: identity_reference_gate
      applies_to: "reference product quality"
      requirement: "Record measured net mass, moisture value and basis, sample method, grade or buyer specification, and whether storage is included."
      evidence: "calibrated scale, moisture measurement, grade test and transfer receipt"
    - id: input_records
      applies_to: "seed and managed inputs"
      requirement: "Identify actual sowing seed, fertilizer and amendment products with nutrient composition, crop-protection product/active ingredient, irrigation source and supplied carrier. A zero must be supported by records."
      evidence: "input logs, product labels, invoices, meter records and field operation log"
    - id: emission_method_quality
      applies_to: "quantified crop emissions"
      requirement: "Name method, version, geographic and crop applicability, required input records, receiving compartment and uncertainty; distinguish measured values from modeled estimates."
      evidence: "recognized method, retained input records and reproducible calculation sheet"
    - id: postharvest_balance
      applies_to: "harvest, threshing, conditioning, grading and storage"
      requirement: "Link each batch input to the main product, all intended outputs, downgraded/reworked material, rejects, waste, moisture change and measured loss without double counting."
      evidence: "batch weights, sampling, moisture records and destination evidence"
    - id: shared_equipment_quality
      applies_to: "shared field, harvest or post-harvest assets"
      requirement: "Identify all consuming processes and periods and show that shared energy or service burdens reconcile to the meter or provider total."
      evidence: "asset schedule, time/throughput logs and meter/invoice reconciliation"
    - id: technology_evidence
      applies_to: "route and technology choices"
      requirement: "Describe each claimed route delta by changed topology, input category, calculation, data requirement or validation. Do not create mutually exclusive route labels where methods occur sequentially on the same lot."
      evidence: "dated operation records and equipment/process description"
validation_rules:
  - rule_id: validate_single_product_identity
    applies_to: "dataset reference product"
    rule: "Confirm one species/crop type, cultivar or seed lot, grade, crop year and production geography; do not combine pulses with distinct CPC leaves or unlike output identities without separate records."
    source_ids:
      - unsd-cpc21-01709
  - rule_id: validate_gate_qualifiers
    applies_to: "reference flow"
    rule: "Require the declared farm or primary-conditioning handoff, net mass, moisture value and basis, grade, and storage status/duration when included."
    source_ids:
      - fao-pulse-postharvest-2020
      - fao-onfarm-grain-manual-2009
  - rule_id: validate_nutrient_cardinality
    applies_to: "pulse_cultivation product inputs"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_water_source
    applies_to: "crop water inputs"
    rule: "Use the water-use irrigation-water group only for supplied product water. Record direct surface or groundwater abstraction as a separately identified elementary resource flow, not as supplied product water."
    source_ids: []
  - rule_id: validate_emission_basis
    applies_to: "elementary crop emissions"
    rule: "Accept emissions only when the substance, receiving compartment, method/version and required field records are explicit. Keep nitrate-N separate from nitrate mass and identify a missing UUID as unresolved rather than substituting another species or compartment."
    source_ids: []
  - rule_id: validate_route_and_handoff
    applies_to: "process map and process inventory"
    rule: "Confirm the production, harvest, threshing, conditioning, sorting and included storage handoffs are linked in order. Describe actual alternatives by requirement delta and identify which alternatives coexist or are exclusive for the reported lot."
    source_ids:
      - fao-pulse-postharvest-2020
      - fao-postharvest-system-1994
  - rule_id: validate_outputs_and_rejects
    applies_to: "each multiple-output or reject node"
    rule: "Enumerate intended products and their separate handoffs; classify each off-spec fraction as downgraded, reworked, recovered, or discarded; exclude rejects and losses from accepted reference output."
    source_ids:
      - fao-pulse-postharvest-2020
  - rule_id: validate_storage_condition
    applies_to: "included farm storage"
    rule: "Check the measured entry/exit mass and moisture on a consistent basis, declared storage interval and protection route. The cited tropical/subtropical moisture guidance is a context-specific QA reference, not a universal allowed range."
    source_ids:
      - fao-pulse-postharvest-2020
      - fao-onfarm-grain-manual-2009
  - rule_id: validate_shared_burden
    applies_to: "shared machinery, pumps, dryers, graders and storage"
    rule: "Identify each consuming node and period, reconcile assigned service/energy to shared meter or provider totals, and prohibit duplicate burden."
    source_ids: []
  - rule_id: validate_provisional_ranges
    applies_to: "every provisional range"
    rule: "Treat reasoned ranges as replaceable QA screens, never as crop-specific production requirements or allowed limits. Replace them with source-backed or reviewed foreground evidence before any reviewed methodology claim."
    source_ids: []
published_dataset_profile:
  dataset_role: "Primary foreground crop-season dataset for one declared dry pulse product identity and grade"
  downstream_use: "secondary_dataset; background_dataset when a verified, complete process dataset is supplied"
  allowed_use: "LCI modelling of dry pulse seed at the declared farm or primary-conditioning handoff and product state"
  excluded_use: "Fresh green pulses; other specifically classified pulse products; seed-for-sowing products; processed foods; unspecified mixtures of crop species or grades; distribution and downstream processing"
  required_metadata: "species/crop type; cultivar or seed lot; field location and area; crop year; water regime; reference gate; grade; net mass; moisture value and basis; route and technology choices; included storage period; allocation method; source datasets and emission method/version"
  required_quality_disclosure: "temporal and geographic representativeness; field and harvest coverage; input-record completeness; measured versus modeled emissions; mass-balance completeness; unresolved flow identities; provisional ranges; shared-asset allocation and any missing background data"
  update_trigger: "CPC scope change; new crop or product boundary evidence; applicable crop or storage standard change; material change to production, harvest, conditioning or storage routes; verified flow identity or unit-group resolution; source-backed range or emission-method update"
