system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "cultivation through first product handoff"
      rule: "Include field operations and crop management assigned to the declared crop season, followed by harvest and the conditioning steps required to reach the stated dry pulse output. Include field preparation where it occurs within the declared crop campaign."
      source_ids:
        - fao-pulse-postharvest-2020
    - rule_id: boundary_first_handoff
      applies_to: "farm or primary-conditioning gate"
      rule: "End the default boundary at the first farm or primary-conditioning handoff of dry, threshed/shelled, cleaned and graded pulse seed. Exclude later distribution and food processing."
      source_ids:
        - unsd-cpc21-01709
    - rule_id: boundary_optional_storage
      applies_to: "on-farm storage"
      rule: "Include storage only when the declared handoff is after storage. Record the storage interval, facility and container, energy and treatment use, condition monitoring, and measured loss."
      source_ids:
        - fao-pulse-postharvest-2020
        - fao-onfarm-grain-manual-2009
    - rule_id: boundary_same_category_seed
      applies_to: "sowing seed input"
      rule: "Record the seed lot as a product input and link its upstream production where available. Do not count it as current-season output or recursively apply this same output dataset to the seed input."
      source_ids: []
    - rule_id: boundary_land_history
      applies_to: "land and field history"
      rule: "Disclose prior land use and any land conversion. Include conversion burdens only under an identified applicable land-use method and declared time period; do not invent an allocation period."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "The managed biological production process is the parent route. The actual field-season may be rainfed or irrigated, and establishment or field operations may be manual, mechanized, or mixed. Record a separate route case only when it changes the process topology, inventory categories, calculations, collection needs, or validation. Rainfed and irrigation strategies are mutually exclusive descriptions for the same water event, although supplementary irrigation may occur within a primarily rainfed season; retain the measured events instead of forcing a binary label. Variants on different lots or fields may coexist in one reporting organization only when each field-season remains identifiable."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "The harvest and conditioning parent route includes harvest, threshing/shelling, drying when needed, and cleaning/sorting. Manual versus mechanized threshing changes recorded service and energy inputs. Sun drying, solar-assisted drying, and powered drying change the drying equipment, batch records, and energy inputs; these methods may be sequential on the same lot, so record each stage that actually occurs. FAO describes sun drying and renewable, fossil-fuel, or electricity-powered drying options for pulses; do not infer that every lot uses all of them."
      source_ids: []
    - rule_id: boundary_route_parent
      applies_to: "alternative field production"
      rule: "Attach a claimed production variant to the managed biological production parent and report the changed topology, inventory, calculation, collection, or validation requirement. Use the actual field-season records; a route label alone is insufficient."
      source_ids:
        - fao-pulse-postharvest-2020
    - rule_id: boundary_technology_parent
      applies_to: "alternative harvest and conditioning technology"
      rule: "Attach manual, mechanical, sun, solar-assisted, or powered operations to the relevant parent process and report each actual change in inputs and process data. Declare when technologies are sequential or mutually exclusive for a batch."
      source_ids:
        - fao-pulse-postharvest-2020
        - fao-postharvest-system-1994
boundary_abstraction:
  declared_starting_condition: "Identified farm field or plot immediately before field preparation and sowing for one declared crop season"
  starting_condition_role: "Foreground field-season boundary; report location, area, prior crop or land use, soil context, crop species, cultivar or seed lot, and production regime"
  product_classification_scope: "One CPC 3.0:01709 product type; species assigned to a more specific CPC pulse class are outside this PCR"
  recursive_input_rule: "Sowing seed is a product input. If it is the same physical pulse category, use an upstream seed-production dataset or model that seed lot separately; do not recursively reuse the current crop output as its own seed input."
  upstream_dataset_requirement: "Link purchased seed, actual nutrient products, crop-protection products, supplied irrigation water, and energy carriers to appropriate upstream datasets when available. Identify missing background data."
  disclosure: "Declare the field-season, prior crop/land state, species and cultivar, water regime, inputs, harvest and conditioning route, output grade, moisture and basis, handoff, and any included storage period."
