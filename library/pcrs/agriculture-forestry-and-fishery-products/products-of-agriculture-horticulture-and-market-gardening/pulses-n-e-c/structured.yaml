measurement_rules:
  - id: reference_mass
    applies_to: "reference product and mass inventory"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record net pulse seed mass at the declared handoff. Exclude containers and separately measured foreign matter; disclose the product's moisture value and basis."
  - id: moisture_basis
    applies_to: "pulse seed before and after drying or storage"
    required_property_ref:
      name: "Moisture content"
      uuid: ""
    required_unit: "% wet basis, unless a source method explicitly requires dry basis"
    rule: "Record the measurement method, sample date, and wet- or dry-basis convention. Convert before comparing values; do not treat the FAO regional storage guidance as a universal product specification."
  - id: field_area
    applies_to: "cultivation and yield records"
    required_property_ref:
      name: "Area"
      uuid: ""
    required_unit: "ha"
    rule: "Use the measured crop area assigned to the reported field-season. Keep intercropped area and any allocation basis explicit."
process_map:
  - id: pulse_cultivation
    name: "Managed pulse crop production"
    inclusion: "required"
    inclusion_condition: "One identified field-season through crop maturity"
    role: "Managed biological production"
    quantitative_reference: "field area and crop-season inputs per 1,000 kg accepted reference product"
  - id: pulse_harvest
    name: "Pulse crop harvest and collection"
    inclusion: "required"
    inclusion_condition: "Separate collection from the standing crop"
    role: "Harvest and capture"
    quantitative_reference: "harvested crop mass and harvest losses per crop-season"
  - id: pulse_threshing
    name: "Threshing or shelling"
    inclusion: "required"
    inclusion_condition: "Separate removal of seed from pods or plant material"
    role: "Material treatment"
    quantitative_reference: "incoming crop mass, recovered pulse seed, residues and rejects"
  - id: pulse_conditioning
    name: "Primary drying and cleaning"
    inclusion: "required"
    inclusion_condition: "Include drying when needed and the first cleaning/preparation handoff"
    role: "Primary conditioning"
    quantitative_reference: "wet/dry seed mass and moisture before and after conditioning"
  - id: pulse_grading
    name: "Grading and sorting"
    inclusion: "conditional"
    inclusion_condition: "Include where incoming pulse seed is sorted into two or more declared grades or destinations"
    role: "Grading and sorting"
    quantitative_reference: "mass by accepted grade, downgraded output, rejected output and handoff"
  - id: pulse_storage
    name: "On-farm pulse storage"
    inclusion: "conditional"
    inclusion_condition: "Include only when the declared reference handoff follows on-farm storage"
    role: "Preservation and stabilization"
    quantitative_reference: "storage duration, entry/exit mass and quality, energy, treatments and loss"
