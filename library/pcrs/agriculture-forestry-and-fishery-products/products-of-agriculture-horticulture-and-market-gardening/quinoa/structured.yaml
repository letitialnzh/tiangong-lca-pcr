system_boundary:
  rules:
    - rule_id: boundary_crop_cycle_to_farm_gate
      applies_to: "all conforming datasets"
      rule: "Include field preparation, sowing, crop management, harvest, and on-farm cleaning or drying performed before the declared farm-gate hand-off."
      source_ids:
        - fao-quinoa-cultivation-guide
        - iso-14044-2006
    - rule_id: boundary_direct_field_emissions
      applies_to: "managed soil and crop inputs"
      rule: "Include direct and indirect nitrogen-related emissions using a geographically applicable method and the same activity data used for nutrient and residue accounting."
      source_ids:
        - ipcc-2019-managed-soils
        - emep-eea-2023-guidebook
    - rule_id: boundary_residue_fate
      applies_to: "quinoa residues"
      rule: "Distinguish residues returned to soil, burned, removed as a useful product, and removed as waste; do not count exported residue nitrogen as soil residue nitrogen."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: boundary_post_farm_gate_exclusion
      applies_to: "downstream activities"
      rule: "Exclude off-farm transport, storage, dehulling, milling, food or feed manufacture, packaging, and use unless the study explicitly extends beyond this PCR."
      source_ids:
        - iso-14044-2006
