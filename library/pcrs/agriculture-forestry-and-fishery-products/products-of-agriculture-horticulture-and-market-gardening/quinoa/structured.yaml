allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "field production and conditioning"
    rule: "Prefer separate records for field production, conditioning, grain, useful screenings, removed residue, and waste before applying allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_retained_residue
    applies_to: "residues returned or incorporated in the field"
    rule: "Do not treat retained residues as co-products; include their management and associated emissions in field production and prevent double counting with removed residue."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: allocation_removed_residue
    applies_to: "marketable removed residue"
    rule: "If shared field burdens cannot be subdivided, apply economic allocation using contemporaneous declared farm-gate values and disclose moisture bases; test mass allocation as a sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_conditioning_outputs
    applies_to: "useful screenings and rejected grain"
    rule: "Treat an intentionally transferred output with positive value as a co-product and other rejects as waste; use economic allocation at conditioning hand-off only when subdivision is infeasible."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_quinoa_field_activity_records
      process_id: "quinoa_field_production"
      flow_role: "seed, nutrients, water, fuel, electricity, amendments, crop protection"
      record_type: "field log, invoice, application record, meter, or contractor record"
      raw_fields: "field_id; area; cultivar; input_product; amount; nutrient_content; date; operation; irrigation; contractor_scope"
      collection_method: "reconcile physical inputs and operations to each field and crop cycle; Raw aggregation and attribution: sum by physical identity; calculate nutrient contents without merging products; normalize using same-cycle area and yield"
      unit: "kg; kg nutrient; L; m3; kWh; ha"
      frequency: "each event"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices; labels; calibrated meters; field logs"
    - protocol_id: cp_quinoa_input_identity_records
      process_id: "quinoa_field_production"
      flow_role: "seed, crop protection, amendments"
      record_type: "seed certificate, product label, invoice, supplier record"
      raw_fields: "product_name; active_ingredient; formulation; lot; supplier; amount; application_date; field_id"
      collection_method: "retain product identity and match each input to its application record; Raw aggregation and attribution: do not merge formulations with different identities or active ingredients"
      unit: "kg; percent; date"
      frequency: "each input event"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented suppliers and fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "labels; certificates; supplier documents"
    - protocol_id: cp_quinoa_harvest_output_records
      process_id: "quinoa_field_production"
      flow_role: "grain, residue, harvest loss, residue fate"
      record_type: "weighbridge, yield monitor, moisture test, bale record, field inspection"
      raw_fields: "field_id; harvest_date; grain_mass; grain_moisture; residue_mass; residue_moisture; fate; destination"
      collection_method: "reconcile harvested and removed masses to field area and crop cycle; Raw aggregation and attribution: sum accepted grain and each residue or loss destination separately"
      unit: "kg; percent; ha"
      frequency: "each harvest"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale or yield-monitor calibration; moisture records; destination evidence"
    - protocol_id: cp_quinoa_emission_activity
      process_id: "quinoa_field_production"
      flow_role: "soil and crop emissions"
      record_type: "nutrient, soil, weather, residue, drainage, and emission-model records"
      raw_fields: "fertilizer_N; organic_N; residue_N; application_method; soil; climate; drainage; factor_set; model_version"
      collection_method: "calculate each pathway with one declared geographically applicable method; Raw aggregation and attribution: calculate per field, area-weight, then normalize by same-cycle yield"
      unit: "kg N; kg emission; ha"
      frequency: "each event and crop-cycle calculation"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "source records; factor provenance; model file; nutrient-balance review"
    - protocol_id: cp_quinoa_conditioning_records
      process_id: "quinoa_grain_conditioning"
      flow_role: "incoming grain, energy, water, accepted grain, screenings, rejects"
      record_type: "batch ticket, scale, moisture test, meter, fuel, and destination record"
      raw_fields: "batch_id; incoming_mass; incoming_moisture; electricity; heat; water; accepted_mass; accepted_moisture; screenings; rejects"
      collection_method: "reconcile batches and meters to accepted output; Raw aggregation and attribution: sum matched batches; allocate shared meters by time or processed mass; close wet-mass balance"
      unit: "kg; percent; kWh; MJ; m3"
      frequency: "each batch or meter period"
      temporal_coverage: "all pre-gate conditioning"
      site_scope: "all included equipment and batches"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scales and moisture meters; meter reconciliation"
  calculation_rules:
    - id: calc_area_to_reference_flow
      applies_to: "field flows"
      rule: "crop-cycle amount per hectare / marketable grain yield per hectare × 1,000 kg"
      inputs:
        - "flow amount"
        - area
        - "same-cycle grain mass"
      output: "amount per 1,000 kg grain"
      source_ids: []
    - id: calc_nutrient_content
      applies_to: "fertilizer and amendment inputs"
      rule: "product mass × declared nutrient fraction; preserve elemental or oxide-equivalent basis"
      inputs:
        - "product identity"
        - mass
        - assay
        - "reporting basis"
      output: "kg N, kg P2O5, kg K2O by source"
      source_ids: []
    - id: calc_managed_soil_n2o
      applies_to: "soil N2O"
      rule: "apply the selected IPCC tier or regional method to fertilizer N, organic N, returned-residue N, volatilization, and leaching pathways"
      inputs:
        - "nitrogen activity"
        - "residue fate"
        - "soil and climate"
        - factors
      output: "kg N2O by pathway"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_ammonia_volatilization
      applies_to: "ammonia to air"
      rule: "calculate by fertilizer type, application method, timing, and applicable factor"
      inputs:
        - "nitrogen product records"
        - "application details"
        - factors
      output: "kg NH3"
      source_ids:
        - emep-eea-2023-guidebook
    - id: calc_conditioning_mass_balance
      applies_to: "grain conditioning"
      rule: "incoming wet grain = accepted grain + useful screenings + rejects + moisture and other measured losses within uncertainty"
      inputs:
        - masses
        - moisture
        - "loss records"
      output: "reconciled outputs per accepted grain"
      source_ids:
        - mass-balance-identity
    - id: calc_dry_matter_conversion
      applies_to: "grain and residue"
      rule: "as-received mass × (1 − measured moisture fraction) = dry-matter mass; retain both bases"
      inputs:
        - mass
        - "moisture result"
      output: "as-received and dry-matter values"
      source_ids:
        - fao-quinoa-cultivation-guide
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Confirm quinoa rather than amaranth, buckwheat, or mixed grain; retain cultivar, intended use, market state, and hand-off."
      evidence: "crop, lot, and sales records"
    - id: dq_temporal_alignment
      applies_to: "all foreground rows"
      requirement: "Use input, harvest, yield, residue, emission, and conditioning records from the same crop cycle; disclose proxy years."
      evidence: "dated field and batch records"
    - id: dq_mass_and_moisture
      applies_to: "grain and residue"
      requirement: "Retain scale or yield-monitor calibration and moisture measurements for every basis conversion."
      evidence: "calibration and moisture-test records"
    - id: dq_input_identity
      applies_to: "seed, crop protection, and amendments"
      requirement: "Retain product labels, formulation or active ingredient, supplier, lot, and application event; resolve UUIDs before final process publication."
      evidence: "labels; certificates; invoices; identity review"
    - id: dq_completeness
      applies_to: "process map and flows"
      requirement: "Reconcile every represented field and conditioning batch and distinguish zero, not applicable, proxy, and missing values."
      evidence: "field roster; batch reconciliation"
    - id: dq_emission_method
      applies_to: "elementary emissions"
      requirement: "Disclose method tier, factors, soil and climate inputs, drainage assumptions, and whether values are measured or modelled."
      evidence: "method version; factor provenance; model inputs"
validation_rules:
  - rule_id: validation_reference_output
    applies_to: "terminal output"
    rule: "Exactly one terminal quinoa grain output equals 1,000 kg after scaling, uses the fixed reference UUID, and declares moisture and quality qualifiers."
    source_ids: []
  - rule_id: validation_process_route
    applies_to: "process map"
    rule: "Include field production once; include conditioning only before farm-gate hand-off and avoid double counting embedded energy, water, or rejects."
    source_ids: []
  - rule_id: validation_crop_cycle_reconciliation
    applies_to: "field inventory"
    rule: "Area, inputs, harvest outputs, residue fates, losses, and emissions refer to the same crop cycle and represented fields."
    source_ids: []
  - rule_id: validation_nitrogen_balance
    applies_to: "nitrogen inventory"
    rule: "Reconcile nutrient content, returned and removed residue nitrogen, and emission pathways with the selected methods and factors disclosed."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validation_conditioning_balance
    applies_to: "conditioning"
    rule: "Reconcile incoming wet grain with accepted grain, screenings, rejects, moisture loss, and other measured loss within uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_flow_identity
    applies_to: "every flow"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground quinoa grain production dataset"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "farm-gate LCA of quinoa grain and downstream systems that preserve declared geography, moisture, residue, allocation, and conditioning context"
  excluded_use: "certified seed, leaves or forage, popped or dehulled products, milling, food or feed manufacture, or another crop without a reviewed proxy decision"
  required_metadata: "geography; cultivar; harvest year; field area; yield; moisture; intended use; tillage; irrigation; seed; nutrients; crop protection; residue fate; conditioning; allocation; identity resolution"
  required_quality_disclosure: "foreground coverage; proxy inputs; missing records; range exceedances; emission methods; meter and mass-balance reconciliations"
  update_trigger: "new reviewed quinoa evidence, material route change, revised emission method, changed concrete flow identity verification"
data_sources:
  - id: "fao-quinoa-cultivation-guide"
    type: "official_guidance"
    reference: "FAO, Guía de cultivo de la quínoa, https://www.fao.org/family-farming/detail/en/c/411552/"
    used_for: "quinoa crop stages, establishment, harvest, and post-harvest context"
  - id: "feedipedia-quinoa"
    type: "official_guidance"
    reference: "FAO Feedipedia, Quinoa (Chenopodium quinoa), https://feedipedia.org/node/229"
    used_for: "crop identity, seeding-rate context, harvest-loss and product-state context"
  - id: "fao-56-crop-evapotranspiration"
    type: "official_guidance"
    reference: "FAO Irrigation and drainage paper 56, Crop evapotranspiration, https://www.fao.org/4/X0490E/X0490E00.htm"
    used_for: "irrigation measurement and crop-water accounting context"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC, 2019 Refinement to the 2006 IPCC Guidelines, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "managed-soil N2O, volatilization and leaching pathways, residue nitrogen, and double-counting controls"
  - id: "emep-eea-2023-guidebook"
    type: "method_factor"
    reference: "European Environment Agency, EMEP/EEA Air Pollutant Emission Inventory Guidebook 2023, https://www.eea.europa.eu/en/analysis/publications/emep-eea-guidebook-2023"
    used_for: "agricultural ammonia and air-emission method context"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines"
    used_for: "boundary, allocation hierarchy, and disclosure"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation of mass applied to matched grain-conditioning batches"
    used_for: "conditioning mass-balance calculation and validation"
