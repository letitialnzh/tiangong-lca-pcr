allocation_rules:
  - rule_id: allocation_crop_type
    applies_to: "mixed cucumber and gherkin production"
    rule: "Attribute shared inputs to slicing cucumber, pickling cucumber, or gherkin using recorded production-unit area, crop-cycle output, or another documented physical basis. Do not average distinct crop types before their individual balances are complete."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: allocation_repeated_harvest
    applies_to: "multiple harvest rounds from one planting"
    rule: "Treat all harvest rounds attributable to one planting campaign as one crop-cycle inventory and reconcile each round before normalizing to total marketable output."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: allocation_shared_protected_unit
    applies_to: "greenhouse or other protected units with multiple crops"
    rule: "Allocate shared energy, water, and management records using declared area, occupied time, throughput, or another physical relationship. Disclose durable infrastructure separately."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_fate
    applies_to: "vines, leaves, rejected fruit, and trim"
    rule: "Do not provide a co-product credit unless a recipient, quantity, and intended use are documented. Otherwise report the material as residue or waste and retain the crop-cycle burden."
    source_ids:
      - usda-ams-cucumber-standard
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_planting_records
      process_id: "crop_establishment"
      flow_role: "seed, transplants, and establishment inputs"
      record_type: "seed lot, transplant, invoice, and planting record"
      raw_fields: "lot; crop type; cultivar; material form; viable quantity; field; date; unused quantity"
      collection_method: "reconcile supplier records to planting log; Raw aggregation and attribution: sum by planting campaign and crop type"
      unit: "kg seed or plants"
      frequency: "each planting campaign"
      temporal_coverage: "full crop cycle"
      site_scope: "each field, bed, or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier label, lot trace, and planting record"
    - protocol_id: cp_nutrient_records
      process_id: "crop_establishment_crop_management"
      flow_role: "nutrient products and nutrient equivalents"
      record_type: "nutrient plan, soil test, supplier invoice, and application log"
      raw_fields: "product; formulation; nutrient concentration; date; area; quantity; application method"
      collection_method: "reconcile product mass and application record; Raw aggregation and attribution: sum by nutrient and crop cycle"
      unit: "kg product, kg N, kg P2O5, kg K2O"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "soil test, label or supplier specification, and application log"
    - protocol_id: cp_irrigation_records
      process_id: "crop_establishment_crop_management"
      flow_role: "crop irrigation and fertigation carrier water"
      record_type: "meter, pump, controller, or water-balance record"
      raw_fields: "source; meter readings; event date; area; method; rainfall; carrier use"
      collection_method: "meter reading or documented water-balance calculation; Raw aggregation and attribution: sum by source and crop cycle"
      unit: "m3"
      frequency: "each event or meter period"
      temporal_coverage: "full crop cycle"
      site_scope: "each field, bed, or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration or documented balance inputs"
    - protocol_id: cp_field_energy_records
      process_id: "crop_establishment_crop_management"
      flow_role: "mobile machinery fuel and pumping energy"
      record_type: "fuel invoice, pump meter, and equipment activity log"
      raw_fields: "carrier; quantity; equipment; operation; field; date; allocation basis"
      collection_method: "supplier record plus activity or meter log; Raw aggregation and attribution: allocate shared use by area, hours, or throughput"
      unit: "L, MJ, or kWh"
      frequency: "each refuelling, operation, or meter period"
      temporal_coverage: "full crop cycle"
      site_scope: "each production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, meter record, and allocation calculation"
    - protocol_id: cp_crop_protection_records
      process_id: "crop_management"
      flow_role: "crop-protection products"
      record_type: "spray log and supplier record"
      raw_fields: "product; active ingredient; rate; area; date; target; lot"
      collection_method: "record each application and product lot; Raw aggregation and attribution: sum by product or active ingredient and crop cycle"
      unit: "kg product or kg active ingredient"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "application log and product label"
    - protocol_id: cp_area_and_cycle_records
      process_id: "crop_establishment"
      flow_role: "land occupation and crop-cycle dates"
      record_type: "field register or protected-unit register"
      raw_fields: "area; bed or unit; crop dates; route; structure status; land use"
      collection_method: "verify register against field map and production records; Raw aggregation and attribution: calculate area-time and normalize to output"
      unit: "ha, m2, and days"
      frequency: "each crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "each field or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "field map, register, and date evidence"
    - protocol_id: cp_harvest_reconciliation
      process_id: "crop_management_harvest_and_gate_preparation"
      flow_role: "harvest fruit, field losses, and residues"
      record_type: "harvest ticket, scale record, and residue record"
      raw_fields: "field; crop type; round; date; gross fruit; marketable fruit; reject; residue; fate"
      collection_method: "weigh each round or use documented lot reconciliation; Raw aggregation and attribution: reconcile crop-cycle fruit and residue streams"
      unit: "kg wet fruit or residue"
      frequency: "each harvest round"
      temporal_coverage: "full harvest campaign"
      site_scope: "each field, bed, or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale record, lot ticket, and fate record"
    - protocol_id: cp_residue_and_reject_records
      process_id: "crop_management_harvest_and_gate_preparation"
      flow_role: "crop residues and rejected fruit"
      record_type: "residue survey, grading sheet, and fate record"
      raw_fields: "field; crop type; round; material; mass; date; destination; recipient"
      collection_method: "weigh, estimate, and document each residue or reject stream and its fate; Raw aggregation and attribution: aggregate by material and destination and reconcile to harvest output"
      unit: "kg wet material"
      frequency: "each harvest round and final clearance"
      temporal_coverage: "full harvest campaign"
      site_scope: "each production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale record, grading sheet, and recipient or treatment record"
    - protocol_id: cp_postharvest_utility_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "wash water, wastewater, and handling loss"
      record_type: "batch sheet, utility meter, and treatment record"
      raw_fields: "batch; received mass; make-up water; recirculation; discharge; loss; fate"
      collection_method: "batch record plus meter or treatment record; Raw aggregation and attribution: aggregate by batch and normalize to gate output"
      unit: "kg and m3"
      frequency: "each batch or meter period"
      temporal_coverage: "full harvest campaign"
      site_scope: "each preparation line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter record, batch sheet, and treatment receipt"
    - protocol_id: cp_postharvest_energy_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "sorting, cooling, and packing energy"
      record_type: "electricity meter and equipment throughput record"
      raw_fields: "meter period; line; kWh; throughput; cooling time; batch"
      collection_method: "allocate meter use by throughput or run time; Raw aggregation and attribution: allocate shared energy and reconcile to batch output"
      unit: "kWh or MJ"
      frequency: "each meter period or batch"
      temporal_coverage: "full harvest campaign"
      site_scope: "each preparation line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter data and allocation calculation"
    - protocol_id: cp_packaging_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "primary packaging"
      record_type: "packaging specification, bill of materials, count, and reuse record"
      raw_fields: "material; unit mass; units; batch; output; reuse cycles"
      collection_method: "reconcile count, specification, and batch output; Raw aggregation and attribution: separate reusable and one-way material per packed output"
      unit: "kg material and units"
      frequency: "each packaging lot or batch"
      temporal_coverage: "full harvest campaign"
      site_scope: "each preparation line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier specification, count sheet, and reuse declaration"
    - protocol_id: cp_gate_output_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "marketable product and final rejects"
      record_type: "dispatch scale, grade record, and reject record"
      raw_fields: "batch; crop type; date; gate; packed mass; grade; reject; fate"
      collection_method: "final scale and lot reconciliation; Raw aggregation and attribution: sum saleable output and rejects; normalize to 1,000 kg"
      unit: "kg wet fruit"
      frequency: "each dispatch lot"
      temporal_coverage: "full harvest campaign"
      site_scope: "declared gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale or lot record and grade record"
  calculation_rules:
    - id: calc_nutrient_equivalent
      applies_to: "nutrient inputs"
      rule: "product mass × declared nutrient fraction; retain product mass and nutrient basis as separate records"
      inputs:
        - invoice
        - formulation
        - "nutrient plan"
        - "application log"
      output: "kg N, kg P2O5, or kg K2O by crop cycle"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_crop_cycle_normalization
      applies_to: "all crop-cycle inputs and outputs"
      rule: "crop-cycle quantity ÷ marketable gate output × 1,000 kg"
      inputs:
        - "crop-cycle quantity"
        - "gate output"
      output: "normalized quantity per 1,000 kg output"
      source_ids: []
    - id: calc_repeated_harvest_output
      applies_to: "harvest rounds"
      rule: "sum marketable fruit from all rounds assigned to the planting; reconcile gross fruit, rejects, losses, and residues first"
      inputs:
        - "harvest tickets"
        - "receiving records"
        - "reject records"
      output: "total marketable crop-cycle output"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_area_time
      applies_to: "land occupation"
      rule: "production area × crop occupation period, with protected structure treatment declared separately"
      inputs:
        - "area register"
        - "planting and final harvest dates"
      output: "m2*a"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_nitrogen_emission
      applies_to: "direct soil nitrous oxide"
      rule: "apply the selected IPCC-compatible factor to eligible nitrogen input and declared soil or climate method"
      inputs:
        - "nutrient records"
        - "method choice"
        - area
      output: "kg N2O emitted to air"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calc_water_balance
      applies_to: "irrigation and washing"
      rule: "sum metered deliveries or documented balance components; preserve source withdrawal, delivered water, recirculation, and discharge as distinct quantities"
      inputs:
        - "meter readings"
        - rainfall
        - "pumping or batch records"
      output: "m3 by water role"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: calc_gate_mass_balance
      applies_to: "harvest and preparation"
      rule: "received fruit = marketable output + rejects + residue or handling loss within declared measurement uncertainty"
      inputs:
        - "harvest tickets"
        - "batch records"
        - "reject and residue records"
      output: "reconciled mass balance"
      source_ids:
        - usda-ams-cucumber-standard
    - id: calc_packaging_attribution
      applies_to: "primary packaging"
      rule: "unit count × unit mass ÷ declared reuse cycles, allocated to packed output"
      inputs:
        - "packaging specification"
        - count
        - "reuse declaration"
        - output
      output: "kg packaging per 1,000 kg output"
      source_ids:
        - usda-ams-cucumber-standard
  data_quality_requirements:
    - id: quality_identity
      applies_to: "product and flow records"
      requirement: "Declare crop type, cultivar group, production route, gate, maturity, grade, and product state; resolve platform identities during foreground dataset construction where required."
      evidence: "lot record, product description, and reference-flow qualifiers"
    - id: quality_measurement
      applies_to: "water, energy, inputs, and outputs"
      requirement: "Prefer calibrated scales, meters, supplier invoices, application logs, and batch records; disclose estimates and allocation calculations when direct measurement is unavailable."
      evidence: "meter calibration, scale record, invoice, or calculation sheet"
    - id: quality_temporal
      applies_to: "crop-cycle inventory"
      requirement: "Cover the full planting campaign and harvest period, including all nutrient and protection applications, irrigation events, and harvest rounds."
      evidence: "planting date, application logs, irrigation record, harvest tickets, and dispatch records"
    - id: quality_completeness
      applies_to: "crop-cycle and gate balance"
      requirement: "Reconcile planting material, nutrients, irrigation, energy, harvest fruit, marketable output, rejects, residues, wastewater, and packaging when in scope."
      evidence: "crop-cycle inventory and mass-balance reconciliation"
    - id: quality_route_disclosure
      applies_to: "open-field and protected routes"
      requirement: "Identify protected cultivation, trellis or durable infrastructure treatment, irrigation technology, and route-specific energy use before combining observations."
      evidence: "production-unit register, energy records, and allocation note"
    - id: quality_identity_resolution
      applies_to: "parameterized and unmapped rows"
      requirement: "Resolve each parameterized row to a verified foreground UUID during data-package construction and record any remaining unmapped coverage before final process publication."
      evidence: "identity review record and foreground package check"
validation_rules:
  - rule_id: validate_reference_output
    applies_to: "reference flow"
    rule: "The reference output must be fresh whole cucumber or gherkin at the declared gate and use mass in kg; pickled, fermented, canned, cut, or retail products are outside this PCR."
    source_ids:
      - usda-ams-cucumber-standard
      - usda-ams-pickling-cucumber-standard
  - rule_id: validate_crop_type
    applies_to: "product identity and aggregation"
    rule: "Crop type and route must be declared. Slicing cucumbers, pickling cucumbers, and gherkins may be aggregated only after separate crop-cycle balances and an explicit physical allocation basis are available."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: validate_cycle_dates
    applies_to: "establishment, management, and harvest"
    rule: "Planting, applications, irrigation, harvest rounds, and gate output must fall within or be explicitly attributed to the declared crop cycle."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: validate_nutrient_basis
    applies_to: "nutrient inputs and emissions"
    rule: "Product mass, nutrient concentration, nutrient basis, and emission method must be internally consistent; do not count product mass and its nutrient equivalent as duplicate exchanges."
    source_ids:
      - ipcc-2019-managed-soils-n2o
      - fao-gap-framework-2003
  - rule_id: validate_mass_balance
    applies_to: "harvest and gate preparation"
    rule: "Harvest or receiving mass must reconcile with marketable output, rejects, residues, wastewater-related losses, and documented measurement uncertainty."
    source_ids:
      - usda-ams-cucumber-standard
  - rule_id: validate_flow_identity_resolution
    applies_to: "parameterized rows"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_qualifiers
    applies_to: "reference flow and dataset metadata"
    rule: "Required qualifiers must be present, including crop type, route, crop cycle, harvest round, grade, washing, cooling, packaging, and declared gate."
    source_ids:
      - usda-ams-cucumber-standard
      - usda-ams-pickling-cucumber-standard
published_dataset_profile:
  dataset_role: "Foreground agricultural production dataset for fresh cucumbers and gherkins at the declared farm-gate or pack-house gate"
  downstream_use: "secondary_dataset for cucumber or gherkin product systems; background_dataset only when a representative regional or market-average dataset includes the required route and quality metadata"
  allowed_use: "Crop-cycle inventory, product comparison, farm improvement, pack-house improvement, and fresh cucumber or gherkin supply-chain assessment within the declared product state and geography"
  excluded_use: "Pickled, fermented, canned, cut, prepared, retail, consumption, seed-production, or unqualified vegetable substitution; do not extrapolate between open-field and protected routes without scenario disclosure"
  required_metadata: "crop type; cultivar group; route; geography; crop-cycle dates; planting material; irrigation source and quantity; nutrient basis; crop protection; harvest rounds; yield; grade; washing and cooling; packaging; residue and reject fate; declared gate"
  required_quality_disclosure: "time coverage, site scope, measured versus calculated values, route treatment, allocation rules, mass-balance result, platform identity resolution status, and all provisional estimates requiring replacement by foreground records"
  update_trigger: "change in crop type or route, irrigation technology, nutrient program, protected-cultivation energy, harvest or grade specification, washing or cooling line, packaging format, gate definition, or evidence affecting material quantities or boundary rules"
data_sources:
  - id: "fao-crop-evapotranspiration-56"
    type: "official_guidance"
    reference: "FAO Irrigation and drainage paper 56, *Crop evapotranspiration*"
    used_for: "irrigation scheduling and water-balance context"
  - id: "ipcc-2019-managed-soils-n2o"
    type: "method_factor"
    reference: "IPCC, *2019 Refinement to the 2006 IPCC Guidelines for National Greenhouse Gas Inventories*"
    used_for: "managed-soil nitrogen-emission method and calculation rule"
  - id: "usda-ams-cucumber-standard"
    type: "official_guidance"
    reference: "USDA Agricultural Marketing Service, *Cucumber Grades and Standards*"
    used_for: "cucumber maturity, size, quality, grade, defects, and gate acceptance context"
  - id: "usda-ams-pickling-cucumber-standard"
    type: "official_guidance"
    reference: "USDA Agricultural Marketing Service, *Pickling Cucumber Grades and Standards*"
    used_for: "pickling cucumber and gherkin size, quality, grade, and reject context"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, *Environmental management — Life cycle assessment — Requirements and guidelines*"
    used_for: "allocation, co-product, and residue-treatment principles"
  - id: "fao-gap-framework-2003"
    type: "official_guidance"
    reference: "FAO Committee on Agriculture, COAG/2003/6, Development of a Framework for Good Agricultural Practices, section IV paragraphs 24–26 and Annex, https://www.fao.org/4/y8704e/y8704e.htm"
    used_for: "General record/handling context only; not a crop-specific parameter or LCA boundary/allocation rule."
  - id: "fao-fertilizer-identities"
    type: "official_guidance"
    reference: "FAO Fertilizer Specifications, https://www.fao.org/agriculture/crops/thematic-sitemap/theme/spi/plantnutrition/fertspecs/en/"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
  - id: "fao-organic-nutrients"
    type: "official_guidance"
    reference: "FAO How to Make and Use Compost, https://www.fao.org/4/i2230e/i2230e.pdf"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
  - id: "fao-package-identities"
    type: "official_guidance"
    reference: "FAO Packaging for fruits, vegetables and root crops, section 4, https://www.fao.org/4/x5016e/X5016E04.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
