data_sources:
  - id: "fao-cucumber-production-guide"
    type: "official_guidance"
    reference: "FAO, crop production and good-practice guidance for cucumber and gherkin cultivation"
    used_for: "crop route, planting, crop management, harvest rounds, residue context, and boundary decisions"
  - id: "fao-crop-evapotranspiration-56"
    type: "official_guidance"
    reference: "FAO Irrigation and drainage paper 56, *Crop evapotranspiration*"
    used_for: "irrigation scheduling and water-balance context"
  - id: "ipcc-2019-managed-soils-n2o"
    type: "method_factor"
    reference: "IPCC, *2019 Refinement to the 2006 IPCC Guidelines for National Greenhouse Gas Inventories*"
    used_for: "managed-soil nitrogen-emission method and calculation rule"
  - id: "usda-ams-cucumber-standard"
    type: "official_guidance"
