measurement_rules:
  - id: reference_cucumber_mass
    applies_to: "reference fruit, harvest, rejects, and residues"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh harvested, marketable, downgraded, rejected, and residue streams separately and reconcile them before converting the inventory to the 1,000 kg reference output."
  - id: crop_type_separation
    applies_to: "slicing cucumbers, pickling cucumbers, and gherkins"
    required_property_ref:
      name: "Product identity"
      uuid: ""
    required_unit: "declared crop type"
    rule: "Keep crop types separate where variety, harvest frequency, grade, price, or input regime differs; combine them only after each crop-cycle inventory is reconciled and the aggregation rule is recorded."
  - id: nutrient_product_basis
    applies_to: "mineral and organic nutrient inputs"
    required_property_ref:
      name: "Product and nutrient mass"
      uuid: ""
    required_unit: "kg product, kg N, kg P2O5, kg K2O"
    rule: "Record formulated product mass and documented nutrient concentration separately. Convert nutrient equivalents only from a supplier specification, label, soil plan, or laboratory result."
  - id: water_delivery_basis
    applies_to: "irrigation, fertigation, washing, and source withdrawal"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Record crop irrigation, fertigation carrier water, washing water, and source withdrawal as distinct quantities and disclose the meter or water-balance basis."
  - id: area_time_basis
    applies_to: "field beds and protected cultivation units"
    required_property_ref:
      name: "Area-time"
      uuid: ""
    required_unit: "m2*a"
    rule: "Record occupied production area and crop occupation period; durable protected structures and long-lived trellis assets require a separate declared attribution if they are included."
  - id: postharvest_mass_change
    applies_to: "washing, cooling, and packing"
    required_property_ref:
      name: "Mass and moisture"
      uuid: ""
    required_unit: "kg and percent"
    rule: "Retain measured water gain or loss during primary handling separately from harvested crop mass. Do not treat wash water uptake or cooling loss as yield without a documented mass reconciliation."
