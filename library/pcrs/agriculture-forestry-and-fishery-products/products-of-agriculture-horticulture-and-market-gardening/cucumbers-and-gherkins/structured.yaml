system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "establishment and cultivation"
      rule: "Include field or protected-bed preparation attributable to the declared crop cycle, planting, vine management, irrigation, nutrient and crop protection, and direct crop emissions; disclose prior land use and exclude unrelated infrastructure construction."
      source_ids:
        - fao-crop-evapotranspiration-56
        - ipcc-2019-managed-soils-n2o
    - rule_id: boundary_repeated_harvest
      applies_to: "harvest rounds"
      rule: "Attribute every harvest round from the planting campaign to the same crop cycle and reconcile marketable fruit, downgraded fruit, field losses, and residues before normalizing."
      source_ids:
        - fao-cucumber-production-guide
        - usda-ams-cucumber-standard
    - rule_id: boundary_gate_preparation
      applies_to: "sorting, washing, cooling, and packing"
      rule: "End the default foreground boundary at the declared farm-gate or pack-house gate. Include sorting, washing, cooling, and primary packaging only when they occur before that gate."
      source_ids:
        - usda-ams-cucumber-standard
        - usda-ams-pickling-cucumber-standard
    - rule_id: boundary_residue_fate
      applies_to: "vines, leaves, rejected fruit, and trim"
      rule: "Record field return, composting, feed use, treatment, transport, or disposal for each residue stream. Do not assign a co-product credit without a documented recipient and intended use."
      source_ids:
        - iso-14044-2006
        - fao-cucumber-production-guide
boundary_abstraction:
  declared_starting_condition: "Prepared field bed or protected cultivation unit receiving cucumber or gherkin seed or transplant material, with prior land use and excluded infrastructure work disclosed"
  starting_condition_role: "Start of the declared cucumber or gherkin crop cycle and foreground input accounting"
  product_classification_scope: "Fresh cucumbers and gherkins classified under CPC 3.0:01232 through the declared farm-gate or pack-house hand-off"
  recursive_input_rule: "Seed, transplants, and other same-category planting materials are recorded at their received hand-off state and linked to an upstream dataset; their own production is not recreated inside this PCR."
  upstream_dataset_requirement: "Use upstream datasets for seed or transplants, nutrient products, crop-protection products, supplied water, fuels, electricity, packaging, and purchased transport or treatment services when those inputs cross the boundary."
  disclosure: "Declare crop type, cultivar group, geography, route, planting density, crop-cycle dates, irrigation source and method, nutrient basis, crop-protection program, trellis or protected route, harvest rounds, grade, yield, reject and residue fates, primary handling, packaging, and gate state."
