  what: "Marketable fresh cucumber or gherkin at the declared farm-gate or pack-house hand-off"
  how_much: "1,000 kg"
  how_well: "Fresh, whole, and unprocessed fruit with declared crop type, maturity, size, grade, firmness, cleanliness, defect tolerance, moisture state, and packaging state"
