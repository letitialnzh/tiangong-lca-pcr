allocation_rules:
  - rule_id: allocation_shared_field_services
    applies_to: "shared field, irrigation, protected-unit, and packing services"
    rule: "Allocate shared services among product categories or crop cycles using area-time, operating time, water delivered, throughput, or another documented physical relationship. Use economic allocation only when a physical relationship cannot represent the shared service and disclose the price basis."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_marketable_and_off_grade
    applies_to: "marketable product, downgraded product, rejects, and residues"
    rule: "Treat marketable product as the reference output. Record downgraded product, culls, residues, and waste separately with actual fate. Do not credit feed, compost, recycling, or another use without a documented recipient, intended use, quality, and hand-off."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_reusable_containers
    applies_to: "reusable crates, bins, pallets, and liners"
    rule: "Allocate manufacture and replacement of reusable containers over documented turns or service mass, then assign cleaning, loss, and end-of-life records to the actual route."
    source_ids:
      - iso-14044-2006
      - codex-fresh-produce-hygiene
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "crop_establishment"
      flow_role: "planting material and establishment"
      record_type: "seed or transplant lot record"
      raw_fields: "species or cultivar; supplier lot; quantity; viability or plant count; field or protected unit; planting date; planted area"
      collection_method: "supplier record plus field log; Raw aggregation and attribution: sum by crop cycle and normalize to marketable output"
      unit: "kg, count, ha"
      frequency: "each planting"
      temporal_coverage: "complete crop cycle"
      site_scope: "each represented production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "lot record, planting log, area record"
    - protocol_id: cp_area_cycle_records
      process_id: "crop_establishment"
      flow_role: "occupied area and crop cycle"
      record_type: "field or protected-unit register"
      raw_fields: "area; unit; prior land-use disclosure; occupation dates; infrastructure allocation note"
      collection_method: "field register and map or protected-unit record; Raw aggregation and attribution: calculate area-time by unit and reconcile to output"
      unit: "ha, date"
      frequency: "each crop cycle"
      temporal_coverage: "complete crop cycle"
      site_scope: "each represented production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "controlled area record"
    - protocol_id: cp_irrigation_records
      process_id: "crop_establishment_and_crop_management"
      flow_role: "irrigation, fertigation, and withdrawal"
      record_type: "meter, permit, or water-balance record"
      raw_fields: "source; meter start and end; method; crop phase; recirculation; return flow"
      collection_method: "meter reading or documented water balance; Raw aggregation and attribution: sum by source and crop phase, then normalize"
      unit: "m3"
      frequency: "each event or monthly"
      temporal_coverage: "complete crop cycle"
      site_scope: "each represented production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter control, permit, or balance check"
    - protocol_id: cp_nutrient_records
