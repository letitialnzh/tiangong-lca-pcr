      unit: "kg product, ha, date"
      frequency: "each treatment"
      temporal_coverage: "complete crop cycle"
      site_scope: "each represented production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "label, log, operator or compliance record"
    - protocol_id: cp_energy_records
      process_id: "crop_management_and_harvest_and_field_sorting"
