measurement_rules:
  - id: reference_green_legume_mass
    applies_to: "marketable product, downgraded product, rejects, residues, and losses"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh marketable, downgraded, rejected, field-loss, handling-loss, and residue streams separately and reconcile them before conversion to the 1,000 kg reference output."
  - id: crop_cycle_normalization
    applies_to: "field and protected-cultivation records"
    required_property_ref:
      name: "Area and mass"
      uuid: ""
    required_unit: "ha and kg"
    rule: "Record inputs and picking rounds by field, bed, or protected unit and normalize them to marketable output from the same declared crop cycle."
  - id: fertilizer_product_and_nutrient_basis
    applies_to: "fertilizer and soil-amendment inputs"
    required_property_ref:
      name: "Product and nutrient mass"
      uuid: ""
    required_unit: "kg product and declared nutrient units"
    rule: "Record the actual product name, product mass, dry matter where relevant, and documented N, P, K, or other nutrient basis when applied. Do not require a product category that was not used and do not double count a compound product."
  - id: water_delivery_basis
    applies_to: "irrigation, fertigation carrier water, washing, and source withdrawal"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Record crop irrigation, fertigation carrier water, post-harvest washing water, and natural-resource withdrawal as distinct quantities and disclose the meter or water-balance basis."
  - id: area_time_basis
    applies_to: "open-field beds and protected units"
    required_property_ref:
      name: "Area-time"
      uuid: ""
    required_unit: "ha*a"
    rule: "Record occupied production area and crop occupation period; durable structures and equipment require separate attribution if included."
  - id: harvest_grade_reconciliation
    applies_to: "repeated harvest, grading, and packing"
    required_property_ref:
      name: "Mass and declared grade"
      uuid: ""
    required_unit: "kg and declared fraction"
    rule: "Retain each picking round, gross harvested mass, accepted mass, downgraded product, rejects, and losses so the declared grade and marketable output are reproducible."
  - id: postharvest_mass_change
    applies_to: "washing, cooling, grading, and packing"
    required_property_ref:
      name: "Mass and moisture"
      uuid: ""
    required_unit: "kg and declared fraction"
    rule: "Retain measured soil removal, water uptake, cooling loss, tare, and packing loss separately from harvested crop mass."
