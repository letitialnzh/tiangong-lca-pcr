system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "establishment and cultivation"
      rule: "Include bed preparation attributable to the declared crop cycle, planting, crop management, irrigation, fertilizer or soil amendment, crop protection, and direct crop emissions; disclose prior land use and exclude unrelated infrastructure construction."
      source_ids:
        - fao-good-agricultural-practices
    - rule_id: boundary_cpc_exclusion
      applies_to: "product identity and reference flow"
      rule: "Confirm that the represented product belongs to CPC 01249 and is not green bean CPC 01241 or green pea CPC 01242. Resolve ambiguity through product facts and review rather than changing the product boundary."
      source_ids:
        - fao-good-agricultural-practices
        - iso-14044-2006
    - rule_id: boundary_repeated_picking
      applies_to: "harvest rounds"
      rule: "Attribute every picking round from one planting to the same crop cycle and reconcile marketable product, downgraded product, rejects, field losses, and residues before normalization."
      source_ids:
        - codex-fresh-produce-hygiene
        - iso-14044-2006
    - rule_id: boundary_gate_conditioning
      applies_to: "sorting, washing, cooling, packing, and pre-gate transport"
      rule: "End the default foreground boundary at the declared farm-gate or pack-house gate. Include conditioning and pre-gate transport only when they occur before that gate."
      source_ids:
        - codex-fresh-produce-hygiene
        - fao-fresh-produce-handling
    - rule_id: boundary_residue_fate
      applies_to: "crop residues, culls, wastewater, and packaging waste"
      rule: "Record field return, composting, feed use, treatment, transport, recycling, or disposal for each stream. Do not assign a co-product credit without a documented recipient, intended use, quality, and hand-off."
      source_ids:
        - iso-14044-2006
        - codex-fresh-produce-hygiene
