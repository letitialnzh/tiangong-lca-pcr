      collection_method: "invoice, application log, specification, and plan; Raw aggregation and attribution: aggregate by actual product and nutrient basis without double counting"
      unit: "kg product, kg nutrient, ha"
      frequency: "each application"
      temporal_coverage: "complete crop cycle"
      site_scope: "each represented production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "specification, application log, plan, method check"
    - protocol_id: cp_crop_protection_records
