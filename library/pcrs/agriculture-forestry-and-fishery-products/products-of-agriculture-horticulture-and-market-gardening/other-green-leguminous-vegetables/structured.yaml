      frequency: "each transaction or monthly"
      temporal_coverage: "complete crop cycle"
      site_scope: "each represented production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "receipt, meter, machine log, allocation check"
    - protocol_id: cp_residue_fate_records
