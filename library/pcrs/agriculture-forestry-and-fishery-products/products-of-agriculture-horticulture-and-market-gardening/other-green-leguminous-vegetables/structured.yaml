      site_scope: "each represented route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "waybill, route record, carrier statement"
    - protocol_id: cp_postharvest_grade_records
      process_id: "conditioning_and_dispatch"
      flow_role: "final accepted output and conditioning rejects"
      record_type: "pack-house batch and grade record"
      raw_fields: "received mass; washed mass; cooled mass; packed mass; accepted mass; reject mass; tare; temperature; grade"
      collection_method: "scale and batch or grade record; Raw aggregation and attribution: reconcile received and final gate masses"
      unit: "kg, date, temperature"
      frequency: "each batch"
      temporal_coverage: "complete declared gate period"
      site_scope: "each conditioning facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, batch record, grade log"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "amount per 1,000 kg = recorded amount * 1,000 / total marketable gate mass kg"
      inputs:
        - "recorded amount"
        - "final marketable gate mass"
      output: "normalized row amount"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_equivalent
      applies_to: "fertilizer and soil-amendment input"
      rule: "nutrient mass = product mass * documented nutrient fraction; retain product mass and each declared nutrient basis separately"
      inputs:
        - "product mass"
        - "supplier specification"
        - plan
        - "or laboratory result"
      output: "nutrient mass by actual product role"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_area_time
      applies_to: "occupied production area"
      rule: "area-time = declared area ha * occupation time years"
      inputs:
        - area
        - "occupation dates"
      output: "ha*a"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_water_withdrawal
      applies_to: "resource withdrawal"
      rule: "reconcile source withdrawal, supplied water, return flow, and documented consumption"
      inputs:
        - "source meter"
        - "delivered water"
        - "return flow"
      output: "withdrawal and disclosed consumption"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: calc_direct_and_indirect_n2o
      applies_to: "nitrous oxide to air"
      rule: "apply one declared IPCC-compatible method to nutrient inputs, amendments, residue fate, and pathway factors; do not combine overlapping methods"
      inputs:
        - "nutrient records"
        - "residue records"
        - "method factors"
      output: "kg N2O by receiving medium"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calc_transport_work
      applies_to: "pre-gate road freight"
      rule: "transport work tkm = payload tonnes * declared route km; allocate shared movements by documented mass basis"
      inputs:
        - payload
        - distance
        - "service record"
        - "allocation basis"
      output: "tkm"
      source_ids:
        - fao-fresh-produce-handling
    - id: calc_reusable_container_service
      applies_to: "reusable harvest and packaging materials"
      rule: "allocate manufacture and replacement over documented turns or service mass, then add cleaning and loss records"
      inputs:
        - "container mass"
        - turns
        - "service mass"
        - "cleaning and loss"
      output: "allocated packaging input and waste"
      source_ids:
        - iso-14044-2006
    - id: calc_mass_reconciliation
      applies_to: "harvest, conditioning, and gate outputs"
      rule: "gross harvest = marketable + downgraded + rejects + field loss + process loss + retained or removed residue within measurement uncertainty; investigate unexplained residuals"
      inputs:
        - picking
        - grade
        - loss
        - "residue records"
      output: "reconciled crop-cycle mass balance"
      source_ids:
        - mass-balance-identity
        - iso-14044-2006
  data_quality_requirements:
    - id: quality_product_identity
      applies_to: "reference product and all product flows"
      requirement: "Verify species or cultivar group, CPC 01249 assignment, maturity, product state, and exclusion check against CPC 01241 and 01242."
      evidence: "product specification, classification review, and batch record"
    - id: quality_scale_and_meter
      applies_to: "mass, water, energy, and packaging rows"
      requirement: "Use controlled scales and meters, record reading dates, and retain the basis for estimates when direct measurement is unavailable."
      evidence: "calibration or control record, meter log, invoice, or documented estimate"
    - id: quality_temporal_coverage
      applies_to: "all crop-cycle rows"
      requirement: "Cover the complete declared planting and harvest campaign and disclose missing periods, exceptional weather, and changed route conditions."
      evidence: "field log, picking records, and gap note"
    - id: quality_completeness_reconciliation
      applies_to: "inputs, products, wastes, residues, and losses"
      requirement: "Reconcile crop-cycle inputs and all harvest and gate outputs; explain any material unexplained balance."
      evidence: "mass-balance worksheet and review sign-off"
    - id: quality_emission_method
      applies_to: "environmental emissions"
      requirement: "State the selected method, factors, receiving medium, and assumptions; avoid double counting direct, indirect, and residue pathways."
      evidence: "calculation sheet and method reference"
    - id: quality_fate_and_disclosure
      applies_to: "residues, culls, wastewater, packaging, and transport"
      requirement: "Retain recipient, destination, treatment, use, and hand-off evidence for every non-marketable or waste stream."
      evidence: "recipient statement, transfer note, treatment record, or declared field fate"
validation_rules:
  - rule_id: validate_cpc_scope
    applies_to: "PCR identity and dataset metadata"
    rule: "Confirm the product is within CPC 01249 and is not green beans CPC 01241 or green peas CPC 01242; retain species or cultivar and product-state evidence."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_reference_mass
    applies_to: "reference flow and output"
    rule: "Require 1,000 kg marketable output on the mass property and kg unit, with complete crop-cycle and gate declaration."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_crop_cycle_completeness
    applies_to: "process map and inventory"
    rule: "Require establishment, management, and harvest processes for every represented crop cycle; require conditioning and dispatch when the declared gate includes those activities."
    source_ids:
      - fao-good-agricultural-practices
      - codex-fresh-produce-hygiene
  - rule_id: validate_nutrient_product_basis
    applies_to: "fertilizer and soil-amendment input"
    rule: "Require actual product identity, product mass, nutrient or amendment basis, application date, and no double counting of compound products."
    source_ids:
      - fao-good-agricultural-practices
  - rule_id: validate_water_and_energy_separation
    applies_to: "irrigation, withdrawal, washing, cooling, fuel, and electricity"
    rule: "Keep supplied water, natural-resource withdrawal, washing water, fuel, and electricity as separate rows with declared meters or calculation bases."
    source_ids:
      - fao-crop-evapotranspiration-56
      - fao-fresh-produce-handling
  - rule_id: validate_output_reconciliation
    applies_to: "marketable, downgraded, reject, residue, wastewater, and packaging rows"
    rule: "Reconcile picking rounds, field sorting, conditioning, and final gate output; investigate unexplained residuals and disclose all declared fates."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: validate_emission_pathway
    applies_to: "direct and indirect emissions"
    rule: "Require receiving medium, calculation method, documented nutrient or residue inputs, and pathway evidence before treating an emission row as calculated."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validate_gate_and_transport
    applies_to: "conditioning and pre-gate transport"
    rule: "Confirm washing, cooling, packing, storage, and transport included in the dataset occur before the declared gate; exclude post-gate services."
    source_ids:
      - codex-fresh-produce-hygiene
      - fao-fresh-produce-handling
  - rule_id: validate_qualifiers
    applies_to: "reference flow and dataset metadata"
    rule: "Require all category qualifiers in the reference-flow table, including species or cultivar, maturity, grade, route, dates, water, nutrient, crop-protection, fate, and gate information."
    source_ids:
      - codex-fresh-produce-hygiene
published_dataset_profile:
  dataset_role: "Foreground agricultural production dataset for fresh, whole, immature green leguminous vegetables assigned to CPC 01249"
  downstream_use: "May be used as a secondary dataset for agricultural product systems and as a background-linked foreground node when the declared gate and qualifiers match."
  allowed_use: "Comparative modelling of fresh CPC 01249 products with disclosed species or cultivar, route, crop cycle, harvest campaign, gate, inputs, output grade, and residue or waste fates."
  excluded_use: "Green beans or green peas, dry pulses, processed or preserved products, unspecified mixed legume categories, retail or consumer life-cycle claims, and datasets with evidence gap mass balance or gate conditions."
  required_metadata: "CPC assignment; species or cultivar group; geography; field or protected route; planting and harvest dates; picking rounds; reference gate; product state and grade; irrigation and water source; actual fertilizer or amendment products and nutrient basis; crop protection; energy; packaging and transport; final mass reconciliation; and all waste or residue fates."
  required_quality_disclosure: "Temporal coverage, site scope, measurement versus estimate status, meter and scale controls, allocation basis, emission method, missing data, uncertainty, and evidence for every important input and output."
  update_trigger: "Change in CPC boundary interpretation, product state, production route, gate, crop-management practice, packaging route, emission method, or evidence that changes a material input, output, allocation, or validation rule."
data_sources:
  - id: "codex-fresh-produce-hygiene"
    type: "standard"
    reference: "Codex Alimentarius, CXC 53-2003, Code of Hygienic Practice for Fresh Fruits and Vegetables, FAO/WHO: https://workspace.fao.org/sites/codex/Standards/CXC%2B53-2003/CXC_053e.pdf"
    used_for: "fresh-produce hygiene, harvest, washing, packing, and data disclosure"
  - id: "fao-good-agricultural-practices"
    type: "official_guidance"
    reference: "FAO, Production practices to increase yield, quality and safety of fruits and vegetables: https://www.fao.org/family-farming/detail/en/c/1682483/"
    used_for: "crop establishment, crop management, nutrient records, and boundary disclosure"
  - id: "fao-crop-evapotranspiration-56"
    type: "official_guidance"
    reference: "FAO Irrigation and drainage paper 56, Crop evapotranspiration: https://www.fao.org/4/X0490E/X0490E00.htm"
    used_for: "irrigation, water-balance, and withdrawal measurement"
  - id: "fao-fresh-produce-handling"
    type: "handbook"
    reference: "FAO, Manual for the preparation and sale of fruits and vegetables: https://www.fao.org/4/y4893e/y4893e0a.htm"
    used_for: "conditioning, cooling, packing, transport, and post-harvest records"
  - id: "ipcc-2019-managed-soils-n2o"
    type: "method_factor"
    reference: "IPCC 2019 Refinement, Volume 4, Chapter 11, N2O Emissions from Managed Soils and CO2 Emissions from Lime and Urea Application: https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "direct and indirect agricultural emissions calculation"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines"
    used_for: "allocation, co-product handling, completeness, and validation principles"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation and reconciliation of declared mass inputs, outputs, losses, and residues"
    used_for: "normalization and mass-balance checks"
