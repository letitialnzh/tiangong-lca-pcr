system_boundary:
  rules:
    - rule_id: boundary_crop_production
      applies_to: "field production"
      rule: "Include seed-for-sowing, land occupation, soil preparation, sowing or planting, nutrient inputs, irrigation where applicable, crop protection, field operations, and direct field emissions through harvest."
      source_ids:
        - ipcc-2019-managed-soils-n2o
        - fao-crop-evapotranspiration-56
    - rule_id: boundary_harvest
      applies_to: "harvest and hand-off"
      rule: "Include harvesting, threshing or combining, field-side collection, and delivery to the declared farm or primary-conditioning hand-off when these activities are in the foreground package."
      source_ids:
        - fao-grain-postharvest-systems-1998
    - rule_id: boundary_primary_conditioning
      applies_to: "primary conditioning"
      rule: "Include primary drying, cleaning, grading, tempering, and reject handling through the declared reference gate."
      source_ids:
        - fao-grain-postharvest-systems-1998
    - rule_id: boundary_downstream_exclusion
      applies_to: "downstream processing"
      rule: "Exclude milling, malting, starch or alcohol conversion, food or feed manufacture, retail, and consumer use; model them as downstream datasets."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_input_completeness
      applies_to: "all routes"
      rule: "Quantify or justify zero/exclusion for seed, N/P/K and organic nutrients, irrigation, crop protection, land, field and harvest energy, conditioning energy, direct emissions, residues, rejects, and losses."
      source_ids:
        - ipcc-2019-managed-soils-n2o
        - mass-balance-identity
