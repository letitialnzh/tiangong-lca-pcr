system_boundary:
  rules:
    - rule_id: boundary_crop_production
      applies_to: "field production"
      rule: "Include seed-for-sowing, land occupation, soil preparation, sowing or planting, nutrient inputs, irrigation where applicable, crop protection, field operations, and direct field emissions through harvest."
