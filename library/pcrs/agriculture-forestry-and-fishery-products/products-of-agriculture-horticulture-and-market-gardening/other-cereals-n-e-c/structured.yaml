allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "crop, harvest, conditioning, and storage"
    rule: "First avoid allocation by subdividing operations whenever field, machine, batch, or storage records support separate process nodes."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_grain_and_residue
    applies_to: "accepted grain and removed residue"
    rule: "Treat field-return residue according to its declared fate. When removed residue or a co-product shares an inseparable process, apply an explicitly declared physical or economic allocation and disclose sensitivity."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_screenings_and_rejects
    applies_to: "screenings, damaged grain, and storage loss"
    rule: "Record accepted grain, screenings, rejects, and losses as separate streams with fates. Do not allocate rejected material to the reference output without documented rework or allocation."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_substitution
    applies_to: "residue or by-product use"
    rule: "Apply substitution only when the displaced product, market, route, and evidence are declared; do not infer a credit from a generic residue name."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_seed_input_records
      process_id: "other_cereal_crop_production"
      flow_role: "seed for sowing"
      record_type: "seed lot and receiving record"
      raw_fields: "crop; cultivar; supplier; lot; treatment; mass; moisture; date; field"
      collection_method: "calibrated scale, invoice, supplier record, or farm log"
      unit: "kg"
      frequency: "per seed lot"
      temporal_coverage: "crop cycle"
      site_scope: "field or farm"
      aggregation_rule: "sum by field and crop lot"
      quality_evidence: "scale calibration, invoice, supplier record"
    - protocol_id: cp_nutrient_input_records
      process_id: "other_cereal_crop_production"
      flow_role: "N, P, K, and organic nutrients"
      record_type: "purchase and application record"
      raw_fields: "product; nutrient; product mass; nutrient content; date; field; method"
      collection_method: "invoice, nutrient analysis, application log, or applicator record"
      unit: "kg product and kg nutrient"
      frequency: "per application"
      temporal_coverage: "crop cycle"
      site_scope: "field or farm"
      aggregation_rule: "sum by product and nutrient, then normalize to output"
      quality_evidence: "invoice, analysis, application log"
    - protocol_id: cp_irrigation_records
      process_id: "other_cereal_crop_production"
      flow_role: "irrigation and withdrawal"
      record_type: "meter or pumping record"
      raw_fields: "source; meter; readings; volume; pumping energy; date; field"
      collection_method: "calibrated meter, pump log, invoice, or irrigation record"
      unit: "m3, kg, and energy unit"
      frequency: "event or period"
      temporal_coverage: "irrigation season"
      site_scope: "field and source"
      aggregation_rule: "distinguish withdrawal, delivery, and consumption before summing"
      quality_evidence: "meter calibration, readings, invoice"
    - protocol_id: cp_crop_protection_records
      process_id: "other_cereal_crop_production"
      flow_role: "crop protection"
      record_type: "application record"
      raw_fields: "product; active substance; formulation; mass; date; field; method"
      collection_method: "spray log, label, invoice, or applicator record"
      unit: "kg product or active substance"
      frequency: "per application"
      temporal_coverage: "crop cycle"
      site_scope: "field or farm"
      aggregation_rule: "sum by product or active substance and normalize to output"
      quality_evidence: "label, log, applicator record"
    - protocol_id: cp_field_energy_records
      process_id: "other_cereal_crop_production"
      flow_role: "field fuel and electricity"
      record_type: "field-operation record"
      raw_fields: "operation; machine; carrier; quantity; field; date"
      collection_method: "fuel log, invoice, telematics, or meter"
      unit: "L, kg, MJ, or kWh"
      frequency: "per operation"
      temporal_coverage: "crop cycle"
      site_scope: "field or farm"
      aggregation_rule: "sum by operation and normalize to selected gate output"
      quality_evidence: "invoice, machine log, telematics"
    - protocol_id: cp_harvest_output_records
      process_id: "other_cereal_crop_production"
      flow_role: "harvested and accepted grain"
      record_type: "harvest record"
      raw_fields: "field; date; gross grain; accepted grain; moisture; grade; residue; loss"
      collection_method: "calibrated scale, harvest ticket, moisture test, and dispatch record"
      unit: "kg and percent"
      frequency: "harvest event"
      temporal_coverage: "crop year"
      site_scope: "field and farm"
      aggregation_rule: "reconcile gross, accepted, residue, and loss on common basis"
      quality_evidence: "scale calibration, ticket, moisture test"
    - protocol_id: cp_harvest_energy_records
      process_id: "other_cereal_harvest_delivery"
      flow_role: "harvest fuel"
      record_type: "machine or contractor record"
      raw_fields: "machine; carrier; quantity; harvested mass; date; period"
      collection_method: "invoice, fuel log, telematics, or meter"
      unit: "L, kg, MJ, or kWh"
      frequency: "event or period"
      temporal_coverage: "crop cycle"
      site_scope: "field to hand-off"
      aggregation_rule: "allocate by recorded harvested mass and operation"
      quality_evidence: "invoice, telematics, meter"
    - protocol_id: cp_residue_and_loss_records
      process_id: "other_cereal_harvest_delivery"
      flow_role: "residue, damaged grain, and loss"
      record_type: "residue/fate record"
      raw_fields: "stream; mass; moisture; fate; destination; field; date"
      collection_method: "scale ticket, field log, transfer, sale, or disposal record"
      unit: "kg"
      frequency: "event or campaign"
      temporal_coverage: "crop cycle"
      site_scope: "field and hand-off"
      aggregation_rule: "sum by stream and fate; do not merge with accepted grain"
      quality_evidence: "scale ticket, fate record, field log"
    - protocol_id: cp_emission_activity_records
      process_id: "other_cereal_harvest_delivery"
      flow_role: "direct emissions activity data"
      record_type: "nutrient, residue, and energy ledger"
      raw_fields: "N input; residue; fuel; factor tier; receiving compartment; period"
      collection_method: "linked activity records and method calculation sheet"
      unit: "kg N, kg residue, L, MJ, or kWh"
      frequency: "crop cycle or operation"
      temporal_coverage: "crop year"
      site_scope: "field and hand-off"
      aggregation_rule: "preserve factor selection and compartment in calculation output"
      quality_evidence: "linked records, factor declaration"
    - protocol_id: cp_conditioning_input_records
      process_id: "other_cereal_primary_conditioning"
      flow_role: "conditioning input"
      record_type: "line or batch record"
      raw_fields: "batch; input mass; moisture; grade; date; source lot"
      collection_method: "calibrated scale and quality test"
      unit: "kg and percent"
      frequency: "per batch"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and line"
      aggregation_rule: "sum batches and retain input identity"
      quality_evidence: "scale calibration, quality test"
    - protocol_id: cp_conditioning_energy_records
      process_id: "other_cereal_primary_conditioning"
      flow_role: "electricity and heat"
      record_type: "facility energy record"
      raw_fields: "line; carrier; quantity; batch; period; input/output mass"
      collection_method: "meter, bill, equipment log, or fuel record"
      unit: "kWh, MJ, L, or kg"
      frequency: "batch or campaign"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and line"
      aggregation_rule: "allocate to batch and normalize to accepted output"
      quality_evidence: "meter, bill, equipment log"
    - protocol_id: cp_conditioning_reject_records
      process_id: "other_cereal_primary_conditioning"
      flow_role: "screenings, dust, and rejects"
      record_type: "reject/fate record"
      raw_fields: "batch; stream; mass; moisture; quality; fate"
      collection_method: "calibrated scale, reject log, dust record, or transfer record"
      unit: "kg and percent"
      frequency: "batch or campaign"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and line"
      aggregation_rule: "reconcile input, accepted output, rejects, dust, and loss"
      quality_evidence: "scale, reject log, fate record"
    - protocol_id: cp_conditioned_output_records
      process_id: "other_cereal_primary_conditioning"
      flow_role: "accepted conditioned grain"
      record_type: "output and quality record"
      raw_fields: "batch; mass; moisture; grade; cleaning status; gate"
      collection_method: "calibrated scale and quality test"
      unit: "kg and percent"
      frequency: "per batch"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and gate"
      aggregation_rule: "sum accepted batches at declared basis"
      quality_evidence: "scale, quality test, dispatch record"
    - protocol_id: cp_storage_inventory_records
      process_id: "other_cereal_storage_gate"
      flow_role: "storage input and loss"
      record_type: "inventory reconciliation"
      raw_fields: "lot; opening; closing; moisture; duration; losses; transfers; fate"
      collection_method: "inventory record, scale, storage log, or dispatch record"
      unit: "kg, percent, days"
      frequency: "lot or period"
      temporal_coverage: "declared storage duration"
      site_scope: "storage site"
      aggregation_rule: "reconcile each lot on a common moisture basis"
      quality_evidence: "inventory record, scale, log"
    - protocol_id: cp_storage_energy_records
      process_id: "other_cereal_storage_gate"
      flow_role: "storage electricity"
      record_type: "meter or utility record"
      raw_fields: "lot; carrier; quantity; date; duration; allocation basis"
      collection_method: "meter, bill, or equipment log"
      unit: "kWh or MJ"
      frequency: "lot or period"
      temporal_coverage: "storage duration"
      site_scope: "storage site"
      aggregation_rule: "allocate by lot mass and duration unless dedicated meter exists"
      quality_evidence: "meter, bill, log"
    - protocol_id: cp_declared_gate_output_records
      process_id: "other_cereal_storage_gate"
      flow_role: "final accepted grain"
      record_type: "gate or dispatch record"
      raw_fields: "lot; gate; date; mass; moisture; grade; packaging state"
      collection_method: "scale, weighbridge, quality record, and dispatch ticket"
      unit: "kg and percent"
      frequency: "shipment or gate event"
      temporal_coverage: "declared gate period"
      site_scope: "declared gate"
      aggregation_rule: "sum accepted lots and preserve gate identity"
      quality_evidence: "scale, quality, dispatch record"
  calculation_rules:
    - id: normalize_to_reference_output
      applies_to: "all foreground flows"
      rule: "recorded flow amount / accepted grain mass at selected gate * 1 kg reference amount"
      inputs:
        - "applicable protocol records and declared gate output"
      output: "amount per kg reference grain"
      source_ids:
        - mass-balance-identity
    - id: convert_moisture_basis
      applies_to: "grain and residue reconciliation"
      rule: "dry-matter mass = as-is mass * (1 - moisture fraction); retain as-is mass and measured moisture"
      inputs:
        - harvest
        - conditioning
        - storage
        - "and residue records"
      output: "common comparison mass basis"
      source_ids:
        - mass-balance-identity
    - id: calculate_nutrient_amounts
      applies_to: "fertilizer inputs"
      rule: "commercial product mass * declared nutrient fraction; retain product mass and nutrient mass separately"
      inputs:
        - cp_nutrient_input_records
      output: "kg N, kg P2O5, and kg K2O inputs"
      source_ids:
        - mass-balance-identity
    - id: calculate_irrigation_withdrawal
      applies_to: "irrigation"
      rule: "source-specific metered withdrawal, delivered volume, and documented consumption are calculated and reported as distinct flows"
      inputs:
        - cp_irrigation_records
        - "gate output"
      output: "water amounts per reference output"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: calculate_direct_soil_emissions
      applies_to: "field nutrient emissions"
      rule: "apply selected IPCC tier and factor to accounted nutrient input and convert N2O-N to N2O where applicable; disclose factors and compartments"
      inputs:
        - cp_nutrient_input_records
        - cp_emission_activity_records
      output: "direct emissions per reference output"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: reconcile_harvest_outputs
      applies_to: "crop and harvest"
      rule: "accepted grain + residues removed + field-return residue + measured loss = harvest output on common moisture basis; explain residual"
      inputs:
        - cp_harvest_output_records
        - cp_residue_and_loss_records
      output: "harvest mass balance"
      source_ids:
        - mass-balance-identity
    - id: reconcile_conditioning_outputs
      applies_to: "primary conditioning"
      rule: "accepted grain + screenings + dust + rejects + measured loss = conditioning input on common moisture basis; explain residual"
      inputs:
        - cp_conditioning_input_records
        - cp_conditioning_reject_records
        - cp_conditioned_output_records
      output: "conditioning yield and loss"
      source_ids:
        - mass-balance-identity
    - id: allocate_storage_energy
      applies_to: "storage"
      rule: "allocate storage energy by lot mass and declared duration unless dedicated metering supports direct assignment"
      inputs:
        - cp_storage_energy_records
        - cp_storage_inventory_records
      output: "storage energy per reference output"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_residual_cereal_identity
      applies_to: "product identity"
      requirement: "Declare biological crop and cultivar where material and confirm that the product belongs to residual CPC 01199 rather than a named cereal leaf with a dedicated PCR."
      evidence: "product metadata, crop record, contract, or classification review"
    - id: dq_gate_and_moisture
      applies_to: "reference flow and outputs"
      requirement: "Record selected gate, as-is mass, moisture basis, and any dry-matter conversion for every reconciled stream."
      evidence: "scale, moisture test, dispatch, and calculation records"
    - id: dq_temporal_coverage
      applies_to: "crop production and harvest"
      requirement: "Cover the declared crop cycle and harvest year; disclose single-year, multi-year average, or scenario status."
      evidence: "dated farm, harvest, and input records"
    - id: dq_input_completeness
      applies_to: "field and conditioning"
      requirement: "Quantify or justify zero/exclusion for seed, nutrients, irrigation, crop protection, land, field energy, harvest energy, conditioning energy, and direct emissions."
      evidence: "ledgers, invoices, logs, meters, and method declaration"
    - id: dq_output_fate
      applies_to: "residues, rejects, and losses"
      requirement: "Record every non-reference output, its mass basis, boundary crossing, destination, and fate; evidence gap material fates block finalization."
      evidence: "scale records, field logs, disposal, transfer, or sales records"
    - id: dq_quality_descriptor
      applies_to: "grain state"
      requirement: "Record intended use, moisture, grade, cleaning status, and other quality descriptors material to the selected gate without inventing universal acceptance limits."
      evidence: "quality test, buyer specification, or local record"
    - id: dq_uuid_identity
      applies_to: "identity references"
      requirement: "Confirm every fixed UUID and receiving compartment; resolve parameterized Flow Set rows to concrete UUIDs during foreground data generation, and leave unsupported identities unmapped."
      evidence: "identity record and review metadata"
validation_rules:
  - rule_id: validation_residual_category
    applies_to: "product identity"
    rule: "Confirm the biological crop is declared, belongs to CPC 01199, and is not a named cereal with a more specific PCR; redirect to the narrower PCR when applicable."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_reference_flow
    applies_to: "reference flow"
    rule: "Confirm one 1 kg mass reference at the declared gate has crop identity, intended use, moisture basis, quality state, geography, crop year, and gate qualifiers."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_process_completeness
    applies_to: "process map and inventory"
    rule: "Confirm crop production and harvest are present, and conditioning or storage is present or explicitly excluded by the declared gate."
    source_ids:
      - fao-grain-postharvest-systems-1998
  - rule_id: validation_nutrient_and_emission_accounting
    applies_to: "nutrients and emissions"
    rule: "Confirm commercial fertilizer mass is distinct from nutrient mass, factor selection is declared, N2O-N conversion is transparent, and relevant nitrogen pathways are addressed."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_water
    applies_to: "irrigation"
    rule: "Confirm withdrawal, delivery, consumption, and discharge are distinguished and no water amount is double counted."
    source_ids:
      - fao-crop-evapotranspiration-56
  - rule_id: validation_moisture_and_mass_balance
    applies_to: "outputs"
    rule: "Confirm harvest, conditioning, storage, residue, reject, and loss reconciliation uses a common moisture basis and every stream has a fate."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_allocation
    applies_to: "co-products and residues"
    rule: "Confirm subdivision was considered first, any allocation method is declared, substitution has an evidenced displaced product, and sensitivity is reported when material."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_uuid_review
    applies_to: "identity references"
    rule: "Confirm fixed identities and receiving compartments; resolve each parameterized Flow Set row to a concrete UUID before creating a final TIDAS exchange."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "downstream grain, food, feed, industrial, or LCA data construction when the declared biological identity, residual classification, intended use, gate, geography, year, moisture, quality state, and route match the dataset metadata"
  excluded_use: "named cereals with a dedicated PCR; sowing seed; forage; flour, malt, starch, alcohol, prepared food, feed manufacture, retail, consumer use, or datasets with incompatible gate or evidence gap material fates"
  required_metadata: "reference flow; biological crop and cultivar; CPC 01199 residual status; intended use; geography; crop cycle and year; seed source; irrigation; nutrient and crop-protection records; moisture basis; quality descriptors; harvest and conditioning route; declared gate; residue, reject, and loss fates; allocation; data-quality declaration"
  required_quality_disclosure: "primary-record coverage; temporal and geographic representativeness; moisture and mass-balance treatment; nutrient and emission factors; identity coverage and unmapped-flow disclosure; omitted inputs; allocation and sensitivity; module checklist result"
  update_trigger: "change in crop identity, classification scope, route, gate, moisture or quality representation, fertilizer or crop-protection practice, irrigation, harvest or conditioning technology, storage duration, factor source, UUID binding, or evidence status"
