  - id: "nfsm-oilseeds-practices-2018"
    type: "official_guidance"
    reference: "Government of India, National Food Security Mission, Package of Practices for Oilseeds (2018), https://www.nfsm.gov.in/ReadyReckoner/Oilseeds/PackagePractice_OS2018.pdf"
    used_for: "route; sowing; nutrient; irrigation"
  - id: "niphm-mustard-ipm"
    type: "official_guidance"
    reference: "National Institute of Plant Health Management, AESA Based IPM Package: Mustard/Rapeseed, https://www.niphm.gov.in/IPMPackages/Mustard.pdf"
    used_for: "cultivation; harvest; crop protection; post-harvest"
  - id: "agmarknet-mustard-postharvest"
    type: "official_guidance"
    reference: "Directorate of Marketing and Inspection, Post-Harvest Profile of Mustard-Rapeseed, https://www.agmarknet.gov.in/Others/mustard-rapeseed-profile.pdf"
    used_for: "cleaning; drying; 8% moisture; hand-off"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC, 2019 Refinement, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "soil emissions; nutrient and residue accounting"
  - id: "iso-14044-2006"
