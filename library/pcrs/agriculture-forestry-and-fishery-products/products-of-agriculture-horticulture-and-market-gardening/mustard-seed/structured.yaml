allocation_rules:
  - rule_id: allocation_single_product
    applies_to: "Accepted seed route"
    rule: "Use accepted seed as quantitative reference; residues, losses and rejects without demonstrated product function are not co-products."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_route_outputs
    applies_to: "Downgraded or saleable output"
    rule: "First subdivide by field, lot, operation and destination; then prefer physical causality, with another relationship disclosed and tested when necessary."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rework
    applies_to: "Rework and off-spec seed"
    rule: "Keep burdens with the originating lot, return mass to the named node, count energy/loss once, and exclude it from accepted output until acceptance."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_run_period
    applies_to: "Shared runs and changeovers"
    rule: "Assign once using measured run time, throughput or another causal driver and prevent duplication."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_cultivation_records
      process_id: "managed_cultivation"
      flow_role: "seed; nutrients; water; crop protection; energy; residues"
      record_type: "field and purchase records"
      raw_fields: "field_id; cycle; area; species; product; mass; composition; water; carrier; energy; destination"
