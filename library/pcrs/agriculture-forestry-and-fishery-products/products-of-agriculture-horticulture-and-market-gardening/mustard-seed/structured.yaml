system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The boundary starts with prepared land and seed, nutrient, water, crop-protection and machinery-service inputs entering managed mustard production. It includes management, harvest/threshing, cleaning, drying/stabilization, grading, within-node rework and accepted-seed hand-off. Residues, field loss, removed foreign matter, downgraded seed and rejects are recorded. Oil/meal/condiment manufacture and downstream distribution are excluded."
      source_ids: []
    - rule_id: boundary_managed_crop
      applies_to: "Cultivation through hand-off"
      rule: "Include management, harvest, cleaning, stabilization and grading; exclude oil extraction, oil/meal and condiment manufacture."
      source_ids:
        - niphm-mustard-ipm
        - agmarknet-mustard-postharvest
    - rule_id: boundary_route_delta
      applies_to: "Alternative routes"
      rule: "Treat rainfed/irrigated, manual/mechanized and ambient/mechanical alternatives as parent-activity deltas; do not merge mutually exclusive routes for one lot."
      source_ids:
        - nfsm-oilseeds-practices-2018
        - niphm-mustard-ipm
    - rule_id: boundary_soil_emissions
      applies_to: "Managed-soil emissions"
      rule: "Calculate fertilizer-, residue-, urea- and lime-related elementary flows with the declared method and avoid double counting removed or burned residues."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: boundary_conditioning_gate
      applies_to: "Cleaning, drying, stabilization and grading"
      rule: "Retain before/after mass and moisture, grade, downgrade, rejects, foreign matter and hand-off; model storage beyond stabilization separately."
      source_ids:
        - agmarknet-mustard-postharvest
boundary_abstraction:
  declared_starting_condition: "Prepared field at crop-cycle start, with prior crop/land state and seed source disclosed"
  starting_condition_role: "Entry condition for managed biological production"
  product_classification_scope: "Mustard seed in CPC 3.0 01442; classification does not replace species and market-state qualifiers"
  recursive_input_rule: "Same-category sowing seed is an upstream input with a provider dataset or foreground source, not recursively recreated"
  upstream_dataset_requirement: "Supplier-specific or regionally representative data for seed, nutrients, energy, irrigation, crop protection and purchased services"
  disclosure: "Disclose prior crop/land state, species/cultivar, cycle, geography, irrigation, harvest, drying, moisture/grade gate, rework and upstream datasets"
