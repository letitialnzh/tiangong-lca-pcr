      collection_method: "invoices, labels, application logs"
      unit: "kg, L, kWh, item"
      frequency: "per event"
      temporal_coverage: "complete production year"
      site_scope: "orchard block"
      aggregation_rule: "sum by input and normalize to dispatched mass"
      quality_evidence: "invoice, label, field log"
    - protocol_id: cp_orchard_output_records
