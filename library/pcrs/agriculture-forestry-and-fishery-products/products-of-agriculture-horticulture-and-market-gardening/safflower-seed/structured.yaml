allocation_rules:
  - rule_id: single_seed_product
    applies_to: "Normal crop"
    rule: "Attribute crop and harvest burdens to accepted grain when straw stays in the field, uncaptured seed is lost, and screenings/rejects are discarded; these are not presumed saleable co-products."
    source_ids:
      - uc-safflower-production
      - wisconsin-safflower
  - rule_id: separate_sale
    applies_to: "Sold lower grade or residue"
    rule: "If lower-grade seed, screenings or straw actually sells, measure its mass/destination and document process subdivision or justified allocation before dataset use. No default economic split is supplied."
    source_ids:
      - uc-safflower-production
      - wisconsin-safflower
  - rule_id: run_attribution
    applies_to: "Shared runs"
    rule: "Link inputs to crop cycle and harvest, cleaning, drying and changeover energy to actual lots/runs. Assign a shared meter period once by measured throughput or documented time and include re-cleaning energy without double counting returned seed."
    source_ids:
      - uc-safflower-production
      - wisconsin-safflower
  - rule_id: reject_exclusion
    applies_to: "Rework"
    rule: "Accepted reference mass excludes rejected mass unless a linked rework pass restores accepted grade; the returning mass is not a new farm output."
    source_ids:
      - uc-safflower-production
      - wisconsin-safflower
dataset_production:
  collection_protocols:
    - protocol_id: cp_field
      process_id: "safflower_cultivation"
      flow_role: "Field inputs and irrigation"
      record_type: "Field log, invoices and meters"
      raw_fields: "field_id, area_ha, crop_year, seed_kg, product_id, applied_kg, fuel_L, irrigation_m3, pump_kWh, route"
      collection_method: "Reconcile issue log and meters; Raw aggregation and attribution: Sum by field/year/input"
      unit: "ha; kg; L; m3; kWh"
      frequency: "Each event"
      temporal_coverage: "Full crop cycle"
      site_scope: "Each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Invoices, log, meter, area record"
    - protocol_id: cp_harvest
      process_id: "safflower_harvest"
      flow_role: "Capture and field loss"
      record_type: "Work log, scale, moisture test"
      raw_fields: "lot_id, field_id, direct_or_windrow, dates, fuel_L, service_hours, grain_kg, moisture, straw_chaff_kg, uncaptured_seed_kg, residue_fate"
      collection_method: "Weigh lot and observe residue and uncaptured seed separately; Raw aggregation and attribution: One recorded path and mass per lot"
      unit: "kg; fraction; L"
      frequency: "Each lot"
      temporal_coverage: "Harvest window"
      site_scope: "Field and route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale ticket, work log, moisture test"
    - protocol_id: cp_conditioning
      process_id: "safflower_conditioning"
      flow_role: "Cleaning and screenings"
      record_type: "Run ledger and meters"
      raw_fields: "run_id, lot_id, in_kg, out_kg, screenings_kg, electricity_kWh, fuel_L, return_id, destinations"
      collection_method: "Weigh input/output and meter energy; Raw aggregation and attribution: Link returns, balance mass"
      unit: "kg; kWh or fuel unit"
      frequency: "Each run"
      temporal_coverage: "Before gate"
      site_scope: "Farm or pre-gate contractor"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale, meter and disposition tickets"
    - protocol_id: cp_grade
      process_id: "safflower_grading"
      flow_role: "Grade and handover"
      record_type: "Grade/sale ticket"
      raw_fields: "lot_id, grade, accepted_kg, downgrade_kg, reject_kg, moisture, gate_date, destinations"
      collection_method: "Apply declared buyer grade and weigh states; Raw aggregation and attribution: Sum final accepted once"
      unit: "kg; fraction"
      frequency: "Each lot"
      temporal_coverage: "Before gate"
      site_scope: "Farm gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Grade and scale tickets"
    - protocol_id: cp_stabilization
      process_id: "safflower_stabilization"
      flow_role: "Actual drying/storage"
      record_type: "Dryer and store log"
      raw_fields: "run_id, lot_id, inlet_kg, outlet_kg, inlet_moisture, outlet_moisture, dryer_fuel_L, dryer_electricity_kWh, storage_electricity_kWh, duration, reject_kg"
      collection_method: "Weigh and moisture-test both sides; meter energy; Raw aggregation and attribution: Dry-matter balance, final accepted once"
      unit: "kg; fraction; energy unit; days"
      frequency: "Each run"
      temporal_coverage: "Before gate"
      site_scope: "Farm/contractor"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale, moisture, energy records"
  calculation_rules:
    - id: accepted_yield
      applies_to: "Field crop cycle"
      rule: "Final accepted kg ÷ harvested ha at declared moisture; disclose separate lower-grade sale."
      inputs:
        - accepted_kg
        - area_ha
      output: "kg/ha"
      source_ids:
        - wisconsin-safflower
    - id: mass_balance
      applies_to: "Harvest through gate"
      rule: "Raw grain = final accepted + downgraded + rejected + process dry-matter loss + net water loss; count returned rework once and explain residual."
      inputs:
        - "Linked lot/run masses and moisture"
      output: "Balance residual and destination"
      source_ids:
        - uc-safflower-production
        - wisconsin-safflower
    - id: dry_matter_balance
      applies_to: "Drying"
      rule: "Dry mass = wet kg × (1 − measured moisture fraction) for inlet and outlet; report separately removed dry matter."
      inputs:
        - "Inlet/outlet mass and moisture"
      output: "Dry matter and evaporated water"
      source_ids:
        - wisconsin-safflower
    - id: shared_run
      applies_to: "Shared equipment period"
      rule: "Assign measured period energy once by measured throughput or justified time; record mixed-product changeover."
      inputs:
        - "Meter total"
        - runs
        - "throughput/time"
      output: "Energy per run"
      source_ids:
        - wisconsin-safflower
