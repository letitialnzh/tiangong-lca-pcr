system_boundary:
  rules:
    - rule_id: field_to_gate
      applies_to: "Foreground system"
      rule: "Include crop management, separate harvest capture, and actual first cleaning, sorting, drying and storage before handover. Standing plants and collected grain are separate states so harvest loss is visible."
      source_ids:
        - uc-safflower-production
        - wisconsin-safflower
    - rule_id: route_delta
      applies_to: "Production and harvest"
      rule: "Irrigated fields add measured water and pumping burdens; dryland fields do not. Windrow/pickup adds cutting, field drying and pickup observations; direct-combine lots omit these. Record one path per lot."
      source_ids:
        - uc-safflower-production
        - wisconsin-safflower
    - rule_id: conditional_nodes
      applies_to: "First handling"
      rule: "Cleaning, drying and storage apply only when physically performed before gate; no California or Upper Midwest moisture target is a global condition."
      source_ids:
        - uc-safflower-production
        - wisconsin-safflower
    - rule_id: downstream
      applies_to: "Exclusions"
      rule: "Oil pressing, meal processing and post-gate transport remain outside. A separately sold residue or lower grade requires recorded mass, destination and attribution."
      source_ids:
        - uc-safflower-production
        - wisconsin-safflower
