  - rule_id: valid_routes
    applies_to: "Fields and harvest lots"
    rule: "Every field has dryland/irrigated status and every lot exactly one direct or windrow/pickup path; selected irrigation and windrow routes require their additional records."
    source_ids:
      - uc-safflower-production
      - wisconsin-safflower
  - rule_id: valid_nodes
    applies_to: "Conditional handling"
    rule: "Activated cleaning or drying/storage nodes need linked input/output mass, energy and reject disposition; absent nodes get no invented default burden or global moisture threshold."
    source_ids:
