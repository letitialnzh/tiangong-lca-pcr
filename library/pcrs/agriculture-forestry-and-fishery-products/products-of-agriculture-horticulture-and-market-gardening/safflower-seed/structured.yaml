allocation_rules:
  - rule_id: single_seed_product
    applies_to: "Normal crop"
    rule: "Attribute crop and harvest burdens to accepted grain when straw stays in the field, uncaptured seed is lost, and screenings/rejects are discarded; these are not presumed saleable co-products."
    source_ids:
      - uc-safflower-production
      - wisconsin-safflower
  - rule_id: separate_sale
    applies_to: "Sold lower grade or residue"
    rule: "If lower-grade seed, screenings or straw actually sells, measure its mass/destination and document process subdivision or justified allocation before dataset use. No default economic split is supplied."
    source_ids:
      - uc-safflower-production
      - wisconsin-safflower
  - rule_id: run_attribution
    applies_to: "Shared runs"
    rule: "Link inputs to crop cycle and harvest, cleaning, drying and changeover energy to actual lots/runs. Assign a shared meter period once by measured throughput or documented time and include re-cleaning energy without double counting returned seed."
    source_ids:
      - uc-safflower-production
      - wisconsin-safflower
  - rule_id: reject_exclusion
    applies_to: "Rework"
    rule: "Accepted reference mass excludes rejected mass unless a linked rework pass restores accepted grade; the returning mass is not a new farm output."
    source_ids:
      - uc-safflower-production
      - wisconsin-safflower
