system_boundary:
  rules:
    - rule_id: field_to_gate
      applies_to: "Foreground system"
      rule: "Include crop management, separate harvest capture, and actual first cleaning, sorting, drying and storage before handover. Standing plants and collected grain are separate states so harvest loss is visible."
