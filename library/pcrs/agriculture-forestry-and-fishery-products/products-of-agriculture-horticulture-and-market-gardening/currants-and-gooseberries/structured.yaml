system_boundary:
  rules:
    - rule_id: boundary_crop_year
      applies_to: "cultivation and managed production"
      rule: "Include crop management inputs and outputs for the declared crop year or reporting period and link them to the represented fields or production units."
      source_ids:
        - fao-gaps-family-agriculture-2007
    - rule_id: boundary_perennial_stand
      applies_to: "perennial stand establishment and replacement"
      rule: "Include establishment or replacement inputs when they occur in the reporting period; otherwise annualize them only from documented stand-age and productive-phase records, with the chosen treatment disclosed."
      source_ids:
        - osu-currants-gooseberries-production
    - rule_id: boundary_harvest_hand_off
      applies_to: "harvest and farm-gate output"
      rule: "End the default foreground boundary at the declared farm-gate hand-off of marketable fresh fruit. Transport after that hand-off and downstream processing are excluded unless explicitly added as a separate scope."
      source_ids:
        - fao-codex-fresh-produce-primary-production
    - rule_id: boundary_conditional_conditioning
      applies_to: "washing, grading, packing, and short-term cooling"
      rule: "Include on-farm conditioning, packing, or cooling only when the operator controls the activity and can provide matched activity, output, and waste records; otherwise disclose the activity as outside the foreground boundary."
      source_ids:
        - fao-codex-fresh-produce-primary-production
    - rule_id: boundary_upstream_inputs
      applies_to: "purchased inputs and services"
      rule: "Represent upstream production of purchased inputs with declared secondary datasets or supplier records and do not double count their upstream activities in the foreground inventory."
      source_ids:
        - fao-gaps-family-agriculture-2007
boundary_abstraction:
  declared_starting_condition: "A declared perennial currant or gooseberry stand and its represented fields or production units at the beginning of the crop-year reporting period; establishment or replacement inputs are included when they occur in the period or are annualized from documented records"
  starting_condition_role: "Foreground production starting condition for a crop-year dataset; the stand, land occupation, production system, and productive phase must be identified"
  product_classification_scope: "Fresh currants and gooseberries from managed cultivation, harvest, and optional primary conditioning through the farm-gate hand-off"
  recursive_input_rule: "A same-category fruit input used within the foreground route is recorded as an internal product transfer or as an upstream secondary dataset with its origin disclosed; do not recursively instantiate this PCR for the same product flow"
  upstream_dataset_requirement: "Use declared upstream datasets for planting material, fertilizers and soil amendments, crop-protection products, energy carriers, water supply, packaging, and any contracted service. The PCR does not recreate upstream production processes."
  disclosure: "The data package must disclose geography, field or unit roster, crop year, stand age or productive phase, production system, irrigation source, nutrient and crop-protection practice, harvest and grading route, cooling or washing, package state, residue fate, co-product route, and farm-gate hand-off."
