measurement_rules:
  - id: measurement_reference_mass
    applies_to: "reference product and terminal marketable output"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure net marketable fruit at the declared farm-gate condition. Retain gross harvested mass, rejects, losses, and any moisture or condition adjustment separately; do not silently replace the farm-gate basis with a dry-matter basis."
  - id: measurement_crop_cycle_basis
    applies_to: "cultivation inputs, harvest, residues, and emissions"
    required_property_ref:
      name: "Mass, area, or volume as applicable"
      uuid: ""
    required_unit: "kg; ha; m3; L; kWh"
    rule: "Link each value to the same declared crop year or reporting period and to the represented fields or production units. Normalize to the net marketable reference output only after the crop-year mass balance is closed."
  - id: measurement_nutrient_basis
    applies_to: "fertilizer and soil-amendment input"
    required_property_ref:
      name: "Mass and elemental nutrient content"
      uuid: ""
    required_unit: "kg product; kg N; kg P; kg K or declared equivalent"
    rule: "Record the actual product used and its product mass. Where nutrient content is available, record N, P, and K on the supplier or laboratory reporting basis without merging products; disclose whether P or K is elemental or an oxide-equivalent basis."
  - id: measurement_water_energy
    applies_to: "irrigation, process water, fuel, and electricity"
    required_property_ref:
      name: "Volume, mass, or energy"
      uuid: ""
    required_unit: "m3; L; kg; kWh or MJ"
    rule: "Use meter, invoice, equipment, or contractor records for the declared site and operation. Convert units only with a documented conversion and retain the original record basis."
  - id: measurement_output_reconciliation
    applies_to: "harvest and primary conditioning outputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Reconcile incoming or harvested fruit to marketable output, declared co-products, rejects, spoilage, and measured losses within the stated measurement uncertainty."
