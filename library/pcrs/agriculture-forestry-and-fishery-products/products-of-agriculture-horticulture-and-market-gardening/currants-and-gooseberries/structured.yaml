allocation_rules:
  - rule_id: allocation_subdivision_first
    applies_to: "managed production, harvest, and conditioning"
    rule: "Prefer separate field, harvest, grading, packing, and cooling records so shared burdens can be assigned to measured product states before applying an allocation rule."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_mass_balance
    applies_to: "fruit, downgraded fruit, rejects, and losses"
    rule: "Close the matched fruit mass balance first. Treat a destination with documented intended use and positive transfer as a co-product; treat untransferred or inedible material according to its recorded waste or residue fate."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_perennial_output
    applies_to: "shared perennial stand inputs"
    rule: "Allocate shared stand inputs to declared marketable product and documented co-products using the reviewed, disclosed basis for the dataset. Do not substitute an undocumented economic or mass basis."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_package_and_cooling
    applies_to: "optional packing and cooling"
    rule: "Attribute package and cooling activity to the matched fruit lot or product state that receives the service; do not spread activity to excluded downstream products."
    source_ids:
      - fao-codex-fresh-produce-primary-production
dataset_production:
  collection_protocols:
    - protocol_id: cp_stand_and_planting_records
      process_id: "p_currant_gooseberry_management"
      flow_role: "planting material, land occupation, land transformation"
      record_type: "field register, planting invoice, stand map, replacement record"
      raw_fields: "field_id; area; species; cultivar; stand_age; planting_date; replacement_area; prior_land_state; production_system"
      collection_method: "reconcile field roster and stand records to the declared crop year"
      unit: "ha; years; kg or item"
      frequency: "each planting or replacement event; annual roster"
      temporal_coverage: "complete crop year and stand period"
      site_scope: "all represented fields and units"
      aggregation_rule: "sum by field and state; retain establishment or replacement events separately"
      quality_evidence: "field map; supplier invoice; stand inventory; land-use record"
    - protocol_id: cp_nutrient_and_soil_amendment_records
      process_id: "p_currant_gooseberry_management"
      flow_role: "fertilizer and soil-amendment products"
      record_type: "purchase record, application log, supplier label, assay, or laboratory result"
      raw_fields: "field_id; product_name; product_mass; application_date; nutrient_N; nutrient_P; nutrient_K; reporting_basis; method"
      collection_method: "reconcile product records to each application and preserve product-specific nutrient content"
      unit: "kg product; kg N; kg P; kg K"
      frequency: "each application"
      temporal_coverage: "complete crop year"
      site_scope: "all represented fields and units"
      aggregation_rule: "sum actual product mass and nutrient totals without merging product identities"
      quality_evidence: "invoices; labels; assays; application logs"
    - protocol_id: cp_irrigation_and_water_quality_records
      process_id: "p_currant_gooseberry_management"
      flow_role: "irrigation water and source withdrawal"
      record_type: "meter, pump record, invoice, source register, water-quality record"
      raw_fields: "field_id; source_id; volume; application_date; method; quality_test; withdrawal_volume"
      collection_method: "match water supply and source withdrawal to fields and crop year"
      unit: "m3"
      frequency: "each irrigation event or meter period"
      temporal_coverage: "complete crop year"
      site_scope: "all represented irrigation sources"
      aggregation_rule: "sum by source and field; preserve measured versus attributed volumes"
      quality_evidence: "meter calibration; source permit or register; water-quality test"
    - protocol_id: cp_crop_protection_records
      process_id: "p_currant_gooseberry_management"
      flow_role: "crop-protection products"
      record_type: "application log, product label, invoice, sprayer record"
      raw_fields: "field_id; product_name; formulation; active_ingredient; amount; date; pest_or_disease; method; preharvest_interval"
      collection_method: "reconcile products and application events to represented fields and harvest lots"
      unit: "kg; L; date"
      frequency: "each application"
      temporal_coverage: "complete crop year"
      site_scope: "all represented fields and contractors"
      aggregation_rule: "retain formulation identity and active-ingredient basis; do not combine products"
      quality_evidence: "label; calibrated sprayer; application log; harvest interval record"
    - protocol_id: cp_field_energy_records
      process_id: "p_currant_gooseberry_management"
      flow_role: "mobile machinery fuel"
      record_type: "fuel invoice, tank meter, contractor record, equipment log"
      raw_fields: "field_id; operation; equipment; fuel_type; amount; date; contractor_scope"
      collection_method: "attribute fuel to included field operations using measured or documented contractor records"
      unit: "L; kg; MJ"
      frequency: "each refuelling or operation period"
      temporal_coverage: "complete crop year"
      site_scope: "all represented field operations"
      aggregation_rule: "sum by operation and represented field; disclose attribution method"
      quality_evidence: "invoices; meter; equipment log; contractor statement"
    - protocol_id: cp_harvest_and_yield_records
      process_id: "p_currant_gooseberry_harvest"
      flow_role: "harvest-ready fruit, raw harvested fruit, harvest losses"
      record_type: "lot ticket, scale, harvest log, field inspection, yield record"
      raw_fields: "field_id; lot_id; cultivar; harvest_date; harvested_mass; accepted_mass; field_loss; grade; destination"
      collection_method: "reconcile field-level harvest lots to crop-year output"
      unit: "kg"
      frequency: "each harvest lot"
      temporal_coverage: "complete harvest period"
      site_scope: "all represented fields and units"
      aggregation_rule: "sum gross, accepted, loss, and destination outputs without double counting"
      quality_evidence: "calibrated scale; lot ticket; harvest log; grade record"
    - protocol_id: cp_residue_and_waste_fate_records
      process_id: "p_currant_gooseberry_management"
      flow_role: "pruning residues and residue fate"
      record_type: "pruning log, weigh record, field note, destination record"
      raw_fields: "field_id; residue_type; mass; moisture_basis; date; fate; destination"
      collection_method: "record removed and retained residues separately and link fate to the field"
      unit: "kg; percent"
      frequency: "each removal or management event"
      temporal_coverage: "complete crop year"
      site_scope: "all represented fields"
      aggregation_rule: "retain dry or wet basis and convert only with documented factor"
      quality_evidence: "field log; weigh record; destination evidence"
    - protocol_id: cp_conditioning_batch_records
      process_id: "p_currant_gooseberry_conditioning"
      flow_role: "incoming fruit, water, package, accepted fruit, downgraded fruit, rejects, spoilage"
      record_type: "batch ticket, scale, grade sheet, wash record, cooling record, package record"
      raw_fields: "batch_id; incoming_mass; accepted_mass; downgraded_mass; reject_mass; spoilage_mass; water; package; start_end_time; destination"
      collection_method: "match every conditioning batch to incoming lot, output state, included activity, and destination"
      unit: "kg; m3; item; time"
      frequency: "each batch"
      temporal_coverage: "complete included conditioning period"
      site_scope: "all included conditioning equipment and lots"
      aggregation_rule: "close fruit mass balance; preserve each destination and optional operation separately"
      quality_evidence: "calibrated scale; grade sheet; water meter; cooling log; package record"
    - protocol_id: cp_conditioning_energy_records
      process_id: "p_currant_gooseberry_conditioning"
      flow_role: "electricity for grading, packing, and cooling"
      record_type: "electricity meter, equipment log, invoice, runtime record"
      raw_fields: "equipment_id; batch_id; kWh; runtime; cooling_duration; allocation_method"
      collection_method: "match meter or runtime attribution to included batches and equipment"
      unit: "kWh; h"
      frequency: "meter period and batch attribution"
      temporal_coverage: "complete included conditioning period"
      site_scope: "all included equipment"
      aggregation_rule: "attribute shared meters by documented runtime or processed mass and disclose method"
      quality_evidence: "meter record; calibration; runtime log; allocation worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all foreground flows"
      rule: "Normalize each included flow to 1 kg net marketable farm-gate fruit after the crop-year and conditioning mass balances are closed."
      inputs:
        - "crop-year flow amount"
        - "net marketable output"
      output: "amount per kg reference fruit"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_content
      applies_to: "fertilizer and soil-amendment products"
      rule: "Product mass × declared nutrient fraction; preserve each product and reporting basis before summing nutrient totals."
      inputs:
        - "product identity"
        - "product mass"
        - "supplier label or assay"
        - "N/P/K basis"
      output: "kg product and kg N/P/K by source"
      source_ids: []
    - id: calc_perennial_stand_allocation
      applies_to: "establishment, replacement, and shared stand inputs"
      rule: "Allocate documented establishment or replacement activity over the declared productive period only when stand-age and productive-phase evidence support the treatment; disclose the period and method."
      inputs:
        - "establishment records"
        - "replacement records"
        - "stand age"
        - "productive phase"
        - "crop-year output"
      output: "crop-year allocated amount"
      source_ids:
        - osu-currants-gooseberries-production
        - iso-14044-2006
    - id: calc_managed_soil_emissions
      applies_to: "soil N2O, ammonia, and nitrate loss"
      rule: "Apply one geographically and methodologically applicable reviewed method to declared nutrient inputs, residue fate, soil and water context, and relevant pathways; retain factor provenance and avoid double counting."
      inputs:
        - "nutrient records"
        - "residue records"
        - "soil and climate data"
        - "application method"
        - factors
      output: "emissions by pathway and reference output"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calc_harvest_mass_balance
      applies_to: "managed production and harvest"
      rule: "Gross available fruit = raw harvested fruit + field or harvest losses within declared measurement uncertainty; document any unmeasured remainder."
      inputs:
        - "yield records"
        - "harvested mass"
        - "field-loss records"
      output: "reconciled harvest outputs"
      source_ids:
        - mass-balance-identity
    - id: calc_conditioning_mass_balance
      applies_to: "primary conditioning"
      rule: "Incoming fruit = marketable fruit + declared co-product + rejects + spoilage + measured process loss within the stated uncertainty."
      inputs:
        - "batch masses"
        - "grade records"
        - destinations
        - "loss records"
      output: "reconciled conditioning outputs"
      source_ids:
        - mass-balance-identity
    - id: calc_shared_energy_allocation
      applies_to: "conditioning electricity"
      rule: "Attribute shared electricity by measured batch meter, documented runtime, or processed mass, and retain the chosen basis with the batch records."
      inputs:
        - "meter total"
        - "runtime or processed mass"
        - "batch output"
      output: "batch electricity per reference output"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product and all product-state rows"
      requirement: "Confirm currant or gooseberry identity, cultivar or variety, harvested state, grade, production system, and farm-gate hand-off; do not use an unnamed mixed-berry proxy without disclosure."
      evidence: "field register; lot ticket; grade record; sales or hand-off record"
    - id: dq_temporal_alignment
      applies_to: "all foreground rows"
      requirement: "Inputs, harvest, emissions, conditioning, and output records must cover the same declared crop year or reporting period; proxy years and partial seasons must be disclosed."
      evidence: "dated field, application, harvest, meter, and batch records"
    - id: dq_field_and_site_completeness
      applies_to: "managed production"
      requirement: "Enumerate all represented fields, production units, and contributing sites; reconcile included and excluded areas and prevent double counting in aggregation."
      evidence: "field roster; site register; area reconciliation"
    - id: dq_mass_and_unit_basis
      applies_to: "product, waste, residue, water, and nutrient rows"
      requirement: "Retain original measurement units, conversion factors, moisture or nutrient bases, and scale or meter evidence; distinguish zero, not applicable, estimated, and missing."
      evidence: "calibration records; labels; assays; conversion worksheet"
    - id: dq_input_application_traceability
      applies_to: "nutrient, crop-protection, water, and energy rows"
      requirement: "Link each input to field, date, operation, product identity, and contractor scope where applicable; retain application and source-quality evidence."
      evidence: "invoices; labels; application logs; water tests; contractor records"
    - id: dq_output_and_waste_reconciliation
      applies_to: "harvest and conditioning"
      requirement: "Close the fruit mass balance and record every marketable, co-product, reject, spoilage, residue, and loss destination."
      evidence: "scales; batch tickets; grade sheets; destination records"
    - id: dq_identity_resolution
      applies_to: "parameterized and unmapped flows"
      requirement: "Before final TIDAS process publication, resolve each applicable Flow Set reference and each remaining physical exchange to a verified UUID, or retain the exchange as explicitly coverage finding with review evidence."
      evidence: "identity review record"
validation_rules:
  - rule_id: validation_reference_output
    applies_to: "terminal product output"
    rule: "Scale the dataset to exactly 1 kg of net marketable fresh currants or gooseberries and declare the product qualifiers required by the reference flow."
    source_ids: []
  - rule_id: validation_process_route
    applies_to: "process map"
    rule: "Include managed production and harvest once; include primary conditioning only when its activity and hand-off records are inside the declared boundary; do not duplicate embedded inputs."
    source_ids:
      - fao-codex-fresh-produce-primary-production
  - rule_id: validation_crop_cycle_reconciliation
    applies_to: "fields, inputs, outputs, and emissions"
    rule: "Confirm that field roster, stand phase, crop inputs, harvest, residues, emissions, and marketable output refer to the same crop year or reporting period."
    source_ids:
      - fao-gaps-family-agriculture-2007
  - rule_id: validation_nutrient_and_emission_basis
    applies_to: "nutrient and managed-soil emissions"
    rule: "Reconcile actual product and nutrient records, residue fate, selected emission pathways, factors, and reporting bases; disclose pathways not modelled."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_conditioning_balance
    applies_to: "optional conditioning"
    rule: "Reconcile incoming fruit to marketable fruit, documented co-product, rejects, spoilage, and measured losses within uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_water_and_crop_protection_records
    applies_to: "irrigation and crop protection"
    rule: "Confirm source, application method, water-quality evidence, product identity, application date, and pre-harvest interval or equivalent declaration for included activities."
    source_ids:
      - fao-codex-fresh-produce-primary-production
  - rule_id: validation_flow_identity
    applies_to: "every flow"
    rule: "Accept only exact verified UUIDs as fixed and applicable existing Flow Sets as parameterized; otherwise retain unmapped coverage and do not alter the real product boundary, flow type, or direction to force a match."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground fresh currant and gooseberry production dataset"
  downstream_use: "secondary_dataset; background_dataset only after review and publication"
  allowed_use: "Farm-gate LCA of fresh currants and gooseberries preserving declared species, cultivar, geography, crop year, production system, stand phase, irrigation, input practice, conditioning, package state, co-product route, and allocation basis"
  excluded_use: "Processed, frozen, dried, juiced, fermented, preserved, nursery, retail, consumer-use, or downstream processing datasets; other berry species without a reviewed proxy decision"
  required_metadata: "species or product type; cultivar; geography; field and site roster; crop year; stand age or productive phase; production system; area; yield; irrigation source and method; nutrient and crop-protection records; harvest and grade; conditioning, cooling, washing, and packaging status; residue and waste fate; allocation; farm-gate hand-off; identity resolution"
  required_quality_disclosure: "field and site coverage; crop-year coverage; proxy and estimated values; missing records; measurement and conversion bases; nutrient and emission methods; water-quality evidence; mass-balance reconciliation; package and cooling inclusions; range or uncertainty findings"
  update_trigger: "new reviewed currant or gooseberry production evidence, material route or production-system change, revised managed-soil or crop-protection method, changed Flow Set or UUID identity, changed packaging or conditioning boundary, or representative data outside the declared QA basis"
