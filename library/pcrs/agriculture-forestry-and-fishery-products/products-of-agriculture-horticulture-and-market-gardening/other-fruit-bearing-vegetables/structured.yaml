    - id: calc_energy_emissions
      applies_to: "energy-related CO2 and particulate matter"
      rule: "Multiply recorded carrier or electricity use by the declared factor and retain carrier, factor, and biogenic/fossil basis; avoid upstream double counting."
      inputs:
        - "energy record"
        - factor
      output: "elementary emissions"
      source_ids:
