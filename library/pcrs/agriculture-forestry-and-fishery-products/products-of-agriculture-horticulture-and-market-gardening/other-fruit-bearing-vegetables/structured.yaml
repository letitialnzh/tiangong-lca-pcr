    - id: calc_nutrient_content
      applies_to: "N, P, K, and organic nutrient cards"
      rule: "nutrient mass = product mass * documented nutrient fraction; retain product mass and nutrient basis as separate metadata."
      inputs:
        - "product mass"
        - "label or analysis"
      output: "nutrient mass"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_irrigation_withdrawal
      applies_to: "irrigation source withdrawal"
      rule: "Calculate source withdrawal from measured source delivery and the declared conveyance or application loss; do not replace a measured value with a generic factor."
      inputs:
        - "source meter"
        - "delivered irrigation"
        - "loss method"
      output: "source withdrawal"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_managed_soil_emissions
      applies_to: "N2O, NH3, nitrate, and phosphate rows"
      rule: "Apply one declared site or IPCC-compatible method to nutrient, amendment, residue, soil, and drainage records; document direct and indirect pathways separately."
      inputs:
        - "nutrient and residue records"
        - "method factors"
      output: "elementary emissions"
      source_ids:
        - ipcc-2019-refinement-managed-soils
        - ipcc-2006-guidelines-agriculture
    - id: calc_harvest_mass_balance
      applies_to: "marketable, off-grade, field-loss, and residue rows"
      rule: "Reconcile harvested mass with marketable output, off-grade destinations, field losses, residues, and measurement tolerance; investigate unexplained residuals."
      inputs:
        - "grade records"
        - "harvest weights"
        - "loss and residue records"
      output: "balanced output set"
      source_ids:
        - mass-balance-identity
    - id: calc_reusable_packaging
      applies_to: "reusable rigid packaging"
      rule: "Allocate packaging mass and replacement over verified service cycles and assign losses to the route where they occur."
      inputs:
        - "packaging mass"
        - "verified cycles"
        - "loss record"
      output: "per-cycle packaging input and waste"
      source_ids:
        - fao-postharvest-handling-vegetables
    - id: calc_conditioning_water_balance
      applies_to: "conditioning water and wastewater"
      rule: "wastewater = water input + retained or released product water - reuse - evaporation - measured retained water, using measured values where available."
      inputs:
        - "water input"
        - reuse
        - discharge
        - "balance terms"
      output: "wastewater volume"
