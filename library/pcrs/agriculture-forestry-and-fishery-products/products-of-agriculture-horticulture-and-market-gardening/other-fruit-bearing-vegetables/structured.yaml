measurement_rules:
  - id: reference_product_mass
    applies_to: "marketable farm-gate product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep gross harvested product, marketable product, downgraded product, rejects, and crop residues separate before normalizing to 1,000 kg marketable output."
  - id: species_route_separation
    applies_to: "mixed species, cultivars, sites, or routes"
    required_property_ref:
      name: "Mass and area"
      uuid: ""
    required_unit: "kg and ha"
    rule: "Record each declared species or cultivar, production site, route, and crop cycle separately; aggregate only after applying the declared allocation basis."
  - id: nutrient_basis
    applies_to: "mineral and organic nutrient inputs"
    required_property_ref:
      name: "Mass of product and nutrient"
      uuid: ""
    required_unit: "kg product, kg N, kg P2O5, or kg K2O"
    rule: "Record the supplied product and the declared nutrient basis. Convert product mass to nutrient mass only from documented composition; do not count one compound product more than once."
  - id: water_basis
    applies_to: "irrigation and conditioning water"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Record irrigation delivery and conditioning water separately. Keep rainfall and water-resource withdrawal distinct from purchased or delivered water."
  - id: energy_basis
    applies_to: "field, harvest, and conditioning energy"
    required_property_ref:
      name: "Mass, energy, or service"
      uuid: ""
    required_unit: "kg fuel, kWh, or service unit"
    rule: "Record each energy carrier or machinery service with its meter, receipt, or service record. Do not infer electricity or fuel from area unless the calculation method and source are disclosed."
  - id: moisture_and_grade
    applies_to: "harvested and farm-gate output"
    required_property_ref:
      name: "Mass and product state"
      uuid: ""
    required_unit: "kg and declared moisture basis"
    rule: "Report the moisture, maturity, grade, and state at farm-gate hand-off. Do not normalize water removed during washing or conditioning as product output."
process_map:
