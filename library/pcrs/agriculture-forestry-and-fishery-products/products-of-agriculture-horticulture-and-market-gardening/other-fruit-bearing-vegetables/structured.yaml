    - id: quality_destination_disclosure
      applies_to: "off-grade product, residues, wastewater, and packaging waste"
      requirement: "Declare the first destination and treatment or return pathway for every non-marketable stream."
      evidence: "delivery, treatment, compost, feed, disposal, or field-return record"
    - id: quality_uncertainty_and_estimates
      applies_to: "all rows using estimates or ranges"
      requirement: "Label estimated or missing values, preserve the range and evidence kind, and replace provisional estimates with collected records when available."
