      aggregation_rule: "calculate by carrier and retain factor basis"
      quality_evidence: "factor source, meter, and calculation review"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = recorded amount / marketable farm-gate mass * 1,000 kg"
      inputs:
        - "recorded amount"
        - "marketable farm-gate mass"
      output: "normalized row value"
