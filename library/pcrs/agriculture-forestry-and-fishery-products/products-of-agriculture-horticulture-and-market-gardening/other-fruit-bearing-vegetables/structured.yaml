allocation_rules:
  - rule_id: allocation_same_species_and_route
    applies_to: "multiple fields, sites, cultivars, or protected routes"
    rule: "Keep records separate through normalization. If aggregation is necessary, allocate shared inputs and infrastructure by marketable mass unless a more representative physical relationship is documented."
    source_ids:
      - fao-crop-production-records
  - rule_id: allocation_marketable_and_off_grade
    applies_to: "marketable and declared off-grade product streams"
    rule: "Use mass allocation when off-grade material has a declared product destination. If off-grade material is discarded or returned to soil, model its destination and do not allocate it as a marketable co-product."
    source_ids:
      - fao-postharvest-handling-vegetables
  - rule_id: allocation_reusable_packaging
    applies_to: "reusable crates and containers"
    rule: "Allocate packaging production and replacement over documented service cycles and assign losses to the relevant route. A single-use packaging record is not spread over undocumented cycles."
    source_ids:
      - fao-postharvest-handling-vegetables
  - rule_id: allocation_shared_protected_infrastructure
    applies_to: "shared greenhouse, tunnel, irrigation, cooling, or conditioning equipment"
    rule: "Allocate shared infrastructure and energy by documented occupied area, operating time, throughput, or mass. State the selected basis and avoid assigning all shared burden to one crop without evidence."
    source_ids:
      - fao-protected-cultivation-guidance
  - rule_id: allocation_residue_destination
    applies_to: "residues and rejects with different destinations"
    rule: "Preserve destination-specific rows. Field return, composting, feed, treatment, and disposal are separate pathways and are not interchangeable co-products."
    source_ids:
      - fao-crop-residue-management
