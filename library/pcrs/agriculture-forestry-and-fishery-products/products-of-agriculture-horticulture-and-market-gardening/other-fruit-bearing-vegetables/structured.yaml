    quantitative_reference: "planted area and planting-material quantity"
  - id: managed_fruiting_vegetable_production
    name: "Managed fruiting-vegetable production"
    inclusion: "required"
    inclusion_condition: "throughout the declared crop cycle"
    role: "foreground managed biological production"
    quantitative_reference: "field- or site-cycle records and marketable output"
  - id: harvest_conditioning_and_farm_gate
    name: "Harvest, conditioning, and farm-gate hand-off"
    inclusion: "required"
    inclusion_condition: "for each harvest and the final farm-gate transfer"
    role: "foreground harvest, grading, optional conditioning, and hand-off"
    quantitative_reference: "1,000 kg marketable farm-gate product"
