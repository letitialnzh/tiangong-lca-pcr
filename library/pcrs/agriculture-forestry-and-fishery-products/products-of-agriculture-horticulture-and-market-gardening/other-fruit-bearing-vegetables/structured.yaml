validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "The dataset must identify one CPC 01239-compatible fresh whole product at farm gate. An identity evidence gap remains a coverage issue and cannot be silently replaced by a named fruit-bearing vegetable or a processed flow."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_required_processes
    applies_to: "process map and process inventory"
    rule: "All three required processes must be present, and every detailed process section must match one process-map id."
    source_ids:
      - fao-crop-production-records
  - rule_id: validation_species_route_scope
    applies_to: "mixed category datasets"
    rule: "The declared species, cultivar, site, route, and cycle must be available for every aggregated row. Products covered by CPC 01231–01235 must be excluded or separately mapped."
    source_ids:
      - fao-good-agricultural-practices
  - rule_id: validation_nutrient_non_double_counting
    applies_to: "nutrient inputs"
    rule: "A compound fertilizer or amendment must be represented once on the product basis and, when nutrient normalization is needed, once through its documented nutrient allocation. Do not sum product mass as if it were separate N, P, and K products."
    source_ids:
      - fao-good-agricultural-practices
  - rule_id: validation_water_balance
    applies_to: "irrigation, withdrawal, conditioning water, and wastewater"
    rule: "Check delivered water, source withdrawal, reuse, evaporation, and discharge for the declared route. Rainfall cannot be used to close a metered irrigation row."
    source_ids:
      - fao-good-agricultural-practices
  - rule_id: validation_mass_balance
    applies_to: "product, waste, and residue outputs"
    rule: "Harvested mass, marketable output, off-grade destinations, field losses, residues, and waste must reconcile within the declared measurement tolerance."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_boundary_hand_off
    applies_to: "farm-gate preparation and transport"
    rule: "Conditioning, packaging, and transport are included only when they occur before the declared farm-gate hand-off; post-gate distribution is excluded."
    source_ids:
      - fao-postharvest-handling-vegetables
  - rule_id: validation_emission_method
    applies_to: "elementary emissions"
    rule: "Each emission row must state substance, compartment, method, factor basis, and whether the burden is already included in an upstream dataset."
    source_ids:
      - ipcc-2019-refinement-managed-soils
      - ipcc-2006-guidelines-agriculture
  - rule_id: validation_parameterized_identity_resolution
    applies_to: "parameterized rows and reference flow"
    rule: "During foreground dataset construction, resolve every parameterized row to a compatible UUID and retain its property, unit, geography, and intended-use checks. Uncovered rows remain unmapped until evidence supports a fixed identity."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_quality_disclosure
    applies_to: "published dataset profile"
    rule: "Report temporal, geographic, species, route, measurement, estimate, allocation, residue-fate, and evidence gap-identity limitations before downstream use."
    source_ids:
      - fao-good-agricultural-practices
published_dataset_profile:
  dataset_role: "Foreground production dataset for fresh whole other fruit-bearing vegetables at farm gate"
  downstream_use: "Can be used as a secondary_dataset for the declared species, route, site or geography, production year, and market state; may support a background_dataset only after the downstream model verifies compatibility"
  allowed_use: "Farm-gate LCA of the declared CPC 01239 product, route, geography, and production cycle; comparative use only when species, grade, moisture, route, and allocation are compatible"
  excluded_use: "Named CPC 01231–01235 products without reviewed equivalence; processed or post-farm-gate products; unqualified cross-species substitution; datasets with evidence gap material mass-balance or destination gaps"
  required_metadata: "species and cultivar; CPC basis; geography; production year and cycle; route; area; irrigation; nutrient basis; crop-protection program; harvest and grade; moisture; residue and reject fates; conditioning; packaging; farm-gate hand-off; UUID resolution status"
  required_quality_disclosure: "source and measurement method; temporal and geographic representativeness; species and route composition; estimated or missing values; nutrient, water, energy, and emission-factor basis; allocation decision; residue, wastewater, and packaging destinations; parameterized-flow UUID resolution; uncertainty and range treatment"
  update_trigger: "Change in CPC interpretation, species or route scope, farm-gate state, boundary or allocation method, Flow Set taxonomy, material evidence, emission method, or a new reviewed dataset showing that the residual category needs narrower PCR treatment"
