system_boundary:
  rules:
    - rule_id: boundary_declared_crop_cycle
      applies_to: "establishment through final harvest"
      rule: "Include field or protected-site establishment, planting or transplanting, crop management, and every harvest belonging to the declared species-, site-, and year-specific crop cycle."
      source_ids:
        - fao-good-agricultural-practices
        - fao-crop-production-records
    - rule_id: boundary_farm_gate
      applies_to: "harvest and conditioning"
      rule: "End the foreground boundary when the marketable whole product is transferred at the declared farm-gate hand-off. Include on-farm grading, washing, cooling, and primary packaging only when they occur before that hand-off."
      source_ids:
        - fao-postharvest-handling-vegetables
        - codex-cxc-53-2003-fresh-produce
    - rule_id: boundary_protected_route
      applies_to: "greenhouse, tunnel, or other protected cultivation"
      rule: "Include route-specific energy, water, consumables, and infrastructure services that are assigned to the declared crop cycle. Disclose infrastructure lifetime and allocation when the infrastructure is shared."
      source_ids:
        - fao-protected-cultivation-guidance
    - rule_id: boundary_managed_soils
      applies_to: "nutrient, amendment, residue, and soil flows"
      rule: "Include direct and indirect managed-soil emissions attributable to applied nutrients and returned residues under one declared method. Do not double count emissions already represented by an upstream dataset."
      source_ids:
        - ipcc-2019-refinement-managed-soils
        - ipcc-2006-guidelines-agriculture
    - rule_id: boundary_residue_and_reject_fate
      applies_to: "off-grade product, rejects, residues, wastewater, and packaging waste"
      rule: "Record the first declared destination of every non-marketable stream: field return, feed, composting, treatment, disposal, or another documented use. An unreported destination is a data-quality gap and is not an automatic co-product."
      source_ids:
        - fao-postharvest-handling-vegetables
        - fao-crop-residue-management
boundary_abstraction:
  declared_starting_condition: "Prepared agricultural field or declared protected-cultivation site receiving seed or transplants, with prior land use, infrastructure status, and pre-plant operations disclosed"
  starting_condition_role: "Beginning of the declared species- and route-specific crop cycle"
  product_classification_scope: "Fresh whole fruit-bearing vegetables classified under CPC 3.0:01239 through farm-gate hand-off"
  recursive_input_rule: "Purchased seed or transplants are upstream planting-material inputs and are linked once. A product-category output is not recreated as an internal production process merely because a nursery or propagator supplied it."
  upstream_dataset_requirement: "Require compatible upstream datasets for planting material, fertilizers or amendments, crop-protection products, irrigation or purchased water, energy and machinery services, packaging, and treatment services when used."
  disclosure: "Declare species and cultivar, site and route, prior land use, crop-cycle dates, irrigation regime, nutrient products and nutrient basis, crop-protection program, protected-cultivation infrastructure if applicable, field-emission method, residue and reject destinations, harvest and conditioning operations, packaging, and farm-gate hand-off."
