validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Confirm one 1 kg net accepted non-seed maize grain reference flow, all required qualifiers, and a reviewed Tiangong product, property, and unit-group identity before publication."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_scope
    applies_to: "boundary"
    rule: "Confirm maize seed, forage or silage routes, and downstream food, feed, starch, ethanol, milling, and distribution activities are excluded unless a separate declared dataset boundary is used."
    source_ids:
      - fao-maize-harvest-postharvest-2023
      - fao-maize-drying-handling
  - rule_id: validation_process_map
    applies_to: "process inventory"
    rule: "Confirm field production and harvest are present and that primary conditioning is included only when its condition, hand-off, inputs, outputs, and gate are explicit."
    source_ids:
      - fao-maize-drying-handling
  - rule_id: validation_mass_balance
    applies_to: "outputs"
    rule: "Confirm harvested grain, accepted grain, residues, rejects, removed moisture, and losses reconcile within the declared tolerance, with every non-reference output assigned a fate."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_moisture
    applies_to: "grain and conditioning"
    rule: "Confirm as-received mass, moisture basis, grade, dockage, and any conversion equation are retained; do not apply an undocumented default moisture factor."
    source_ids:
      - fao-maize-drying-handling
      - mass-balance-identity
  - rule_id: validation_nitrogen
    applies_to: "fertilizer and emissions"
    rule: "Confirm product mass, nutrient mass, selected IPCC tier, factor source, species, unit, and conversion are declared and not supplied by a module."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_water_and_energy
    applies_to: "water and energy"
    rule: "Confirm source, carrier, unit, operation, meter or record, and upstream versus foreground treatment are explicit and no supplied water or fuel is counted twice."
    source_ids:
      - ipcc-2019-cropland
      - mass-balance-identity
  - rule_id: validation_allocation
    applies_to: "multiple outputs"
    rule: "Confirm intentional residue co-products are distinguished from waste, the allocation decision is explicit, and an alternative defensible method is tested when allocation is material."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_identity_review
    applies_to: "all bound flow rows"
    rule: "Reject finalization when a flow binding is absent or does not match direction, flow type, property, unit group, geography, or gate."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_data_quality
    applies_to: "data package"
    rule: "Confirm every required category has a collected value, calculated value with inputs, justified zero, or documented exclusion, and disclose open review items."
    source_ids:
      - fao-maize-harvest-postharvest-2023
      - ipcc-2019-cropland
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Non-seed maize grain matching the declared variety or hybrid, end-use route, geography, production system, irrigation, crop season, moisture basis, grade, and farm or primary processing gate"
  excluded_use: "maize seed; forage or silage maize; sweet or baby corn as a vegetable; food, feed, starch, ethanol, milling, formulation, retail, distribution, consumption, or unqualified storage datasets"
  required_metadata: "reviewed reference-flow identity; variety or hybrid; end-use route; geography; field and season; seed input status; production system; irrigation; gate; grain state; moisture and grade; accepted output; residue and reject fate; allocation; source and protocol coverage"
  required_quality_disclosure: "crop seasons; field and supplier coverage; primary-record coverage; mass-balance tolerance; scale and moisture calibration; nutrient and emission methods; water source; energy carriers; gate; exclusions; allocation and sensitivity; identity coverage and unmapped-flow disclosure"
  update_trigger: "material change in gate, grain state, moisture convention, grade rule, production route, irrigation, nutrient or crop-protection practice, conditioning technology, output fate, allocation method, or representativeness"
