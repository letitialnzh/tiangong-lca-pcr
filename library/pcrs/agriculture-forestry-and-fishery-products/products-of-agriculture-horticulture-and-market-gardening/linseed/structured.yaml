allocation_rules:
  - rule_id: allocation_single_grain
    applies_to: "Grain and straw"
    rule: "First document whether sold straw or separately sold downgraded grain exists. Retained straw and field losses are residues, not co-products. Keep accepted and downgraded grain masses distinct."
    source_ids:
      - manitoba-flax-management
  - rule_id: allocation_biophysical
    applies_to: "Multiple sold outputs"
    rule: "Where a process has independent sold grain and straw, first divide separable collection, baling and handling directly. For inseparable field and harvest burdens, use a documented physically causal relationship if one is justified; otherwise use a crop-year revenue share based on actual gate prices and masses, report the shares, and test sensitivity to a mass share. Do not allocate residue returned to soil as a sold output."
    source_ids:
      - manitoba-flax-management
      - eu-pef-allocation
  - rule_id: allocation_batch
    applies_to: "Shared runs"
    rule: "Index field portions, harvest runs and conditioning lots. Attribute common cleaning, dryer startup and changeover energy once using measured run time or throughput; reconcile totals before allocating to accepted, downgraded and rejected outputs."
    source_ids:
      - manitoba-growing-flax
  - rule_id: allocation_rework
    applies_to: "Re-cleaned or downgraded grain"
    rule: "Re-cleaning adds its actual energy and losses to the linked lot; do not create extra primary grain production. Recovered sale grain is counted once at its final hand-off and discarded reject carries no product credit."
    source_ids:
      - manitoba-flax-management
  - rule_id: allocation_seed
    applies_to: "Seed and oilseed outputs"
    rule: "Assign additional seed-grade cleaning, treatment and tests directly to seed lots. Share inseparable cultivation and harvest burdens only between the final sold seed, oilseed and straw outputs under the declared joint-burden method; a downgraded seed lot becomes oilseed only at its final hand-off."
    source_ids:
      - cfia-common-seed
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_area
      process_id: "flax_cultivation"
      flow_role: "field and crop"
      record_type: "field log"
      raw_fields: "field id, crop year, variety, preceding crop, sown and harvested area, soil, irrigation"
      collection_method: "farm field records and GIS"
      unit: "ha"
      frequency: "each crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "each field"
      aggregation_rule: "sum only non-overlapping harvested area"
      quality_evidence: "field map, planting record"
    - protocol_id: cp_field_inputs
      process_id: "flax_cultivation"
      flow_role: "seed, nutrients, chemicals, fuel, water"
      record_type: "purchase and operation logs"
      raw_fields: "material identity, quantity, nutrient or active content, application date, field, machine fuel, water source"
      collection_method: "invoices, application and meter logs"
      unit: "kg, L, kWh, m3"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each field"
      aggregation_rule: "sum by material and field, then reconcile inventory"
      quality_evidence: "invoices, calibrations"
    - protocol_id: cp_soil_emissions
      process_id: "flax_cultivation"
      flow_role: "managed-soil emissions"
      record_type: "field and method record"
      raw_fields: "N inputs, manure N, residue mass and N, soil, climate, emission method and factors"
      collection_method: "field logs and stated method"
      unit: "kg N, kg N2O"
      frequency: "each crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "each field"
      aggregation_rule: "apply selected method once per N pool"
      quality_evidence: "factor version, calculations"
    - protocol_id: cp_harvest
      process_id: "flax_harvest"
      flow_role: "grain, route, fuel, field loss"
      record_type: "harvest log"
      raw_fields: "field id, run id, direct or swath route, area, wet grain mass, moisture, fuel, desiccant, estimated losses"
      collection_method: "weighbridge, combine and operation logs"
      unit: "ha, kg, %, L"
      frequency: "each run"
      temporal_coverage: "harvest season"
      site_scope: "each field/run"
      aggregation_rule: "link non-overlapping portions to lots"
      quality_evidence: "tickets, machine logs"
    - protocol_id: cp_straw_fate
      process_id: "flax_harvest"
      flow_role: "straw and residues"
      record_type: "residue and sales log"
      raw_fields: "straw mass, dry matter, sale ticket, field retention, burn or disposal, baling fuel"
      collection_method: "weighbridge, field log and invoice"
      unit: "kg dry matter, L"
      frequency: "each field/run"
      temporal_coverage: "harvest season"
      site_scope: "each field"
      aggregation_rule: "reconcile harvested, removed and retained fractions"
      quality_evidence: "buyer ticket, field photos"
    - protocol_id: cp_conditioning
      process_id: "linseed_cleaning"
      flow_role: "cleaning and stabilization"
      record_type: "lot operation log"
      raw_fields: "lot id, before and after mass and moisture, debris, spoilage, power and fuel, run time"
      collection_method: "weighbridge, moisture meter, equipment meter"
      unit: "kg, %, kWh, L"
      frequency: "each lot and run"
      temporal_coverage: "harvest-to-gate interval"
      site_scope: "each lot"
      aggregation_rule: "link passes without duplicating mass or energy"
      quality_evidence: "scale and meter calibration"
    - protocol_id: cp_grading
      process_id: "linseed_grading"
      flow_role: "accepted, downgraded, rejected"
      record_type: "gate and grade tickets"
      raw_fields: "lot id, net mass, grade, moisture, buyer, downgrade, reject and rework destination"
      collection_method: "gate scale, grade assay and sales tickets"
      unit: "kg, %"
      frequency: "each gate lot"
      temporal_coverage: "harvest-to-gate interval"
      site_scope: "each lot"
      aggregation_rule: "sum final mutually exclusive output states"
      quality_evidence: "signed sale and grade tickets"
    - protocol_id: cp_seed_grade
      process_id: "linseed_seed_grade"
      flow_role: "planting seed, downgraded grain, reject"
      record_type: "seed-lot and test records"
      raw_fields: "lot id, diverted mass, extra cleaning and treatment, purity, germination, seed grade, buyer, accepted and rejected mass"
      collection_method: "gate scale, seed test certificate, operation log"
      unit: "kg, %, kWh"
      frequency: "each seed lot"
      temporal_coverage: "harvest-to-gate interval"
      site_scope: "each seed lot"
      aggregation_rule: "reconcile seed, oilseed downgrade and reject without double counting"
      quality_evidence: "signed seed test and sale records"
  calculation_rules:
    - id: calc_lot_yield
      applies_to: "Each field"
      rule: "final grain output kg / harvested ha, retaining accepted, downgraded and reject states separately"
      inputs:
        - "gate masses"
        - "field links"
        - area
      output: "yield by grade and field"
      source_ids:
        - manitoba-flax-management
    - id: calc_moisture_balance
      applies_to: "Aerated or dried lot"
      rule: "dry matter = incoming wet mass × (1 − incoming wet-basis moisture); expected outgoing wet mass = conserved dry matter / (1 − outgoing wet-basis moisture), adjusted for measured dry-matter reject"
      inputs:
        - "paired masses and moisture"
        - reject
      output: "water removal and mass-balance residual"
      source_ids:
        - manitoba-growing-flax
    - id: calc_soil_n2o
      applies_to: "Managed field soil"
      rule: "apply declared region-specific or IPCC 2019 direct and indirect N2O method to documented synthetic, organic and residue N; subtract sold or burnt residue from returned residue pool"
      inputs:
        - "field N and residue records"
        - "method factors"
      output: "kg N2O by pathway"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_allocation
      applies_to: "Co-product crop year"
      rule: "directly assign separable operations; allocate only remaining joint burdens by justified causal basis or actual sold value shares, with mass-share sensitivity"
      inputs:
        - "sold masses"
        - prices
        - "joint burdens"
      output: "burden share per sold output"
      source_ids:
        - eu-pef-allocation
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Verify unprocessed linseed identity, variety, moisture and grade; oil, fibre or sowing-seed datasets cannot substitute."
      evidence: "gate ticket, lot assay"
    - id: dq_seed_identity
      applies_to: "Planting-seed branch"
      requirement: "A planting-seed dataset requires its distinct platform flow identity, intended-use record, purity/germination tests and seed-grade hand-off; the oilseed reference UUID alone is insufficient."
      evidence: "seed certificate, sale ticket, flow-identity check"
    - id: dq_completeness
      applies_to: "Field-to-gate chain"
      requirement: "Reconcile field area and grain lots, cleaning and moisture losses, accepted/downgraded/rejected outputs, straw and residues, and all significant applied products and energy."
      evidence: "field and lot balance"
    - id: dq_time
      applies_to: "Foreground"
      requirement: "Use one documented crop year or disclose pooling years; each operation and output must link to a field, run or lot without shared-burden duplication."
      evidence: "dated logs and tickets"
    - id: dq_method
      applies_to: "Emissions and allocation"
      requirement: "State factors, regional applicability, uncertainty and actual co-product prices or causal basis; do not silently mix residue return and burning assumptions."
      evidence: "method worksheet and sources"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Gate lot"
    rule: "Require linseed grain, actual moisture and grade, crop year and farm-gate hand-off; reject oil and fibre identities. Require a separate flow and test-backed grade for a planting-seed reference."
    source_ids:
      - manitoba-flax-management
      - cfia-common-seed
  - rule_id: validate_routes
    applies_to: "Field and lot"
    rule: "Exactly one direct-combine or swath route per field portion; a drying or aeration node appears only when logged and must contain pre/post moisture, energy and hand-off."
    source_ids:
      - manitoba-flax-management
      - manitoba-growing-flax
  - rule_id: validate_outputs
    applies_to: "Grain and straw"
    rule: "Reconcile accepted, downgraded, rejected, reworked and moisture-loss states to incoming lot; record each straw fate and any sale hand-off; do not count retained or burnt straw as a sold co-product."
    source_ids:
      - manitoba-flax-management
  - rule_id: validate_runs
    applies_to: "Field, machine and lot"
    rule: "Link shared inputs, cleaning/changeover, outputs and rework to one run or period; assign each shared burden and final product once."
    source_ids:
      - manitoba-growing-flax
  - rule_id: validate_residue_n
    applies_to: "Soil emissions"
    rule: "Show residue N returned, removed and burnt separately and avoid double-counting in N2O calculations."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validate_seed_branch
    applies_to: "Planting-seed lot"
    rule: "Reconcile diverted grain into qualified seed, oilseed downgrade and reject; require purity/germination evidence, additional conditioning records and a verified seed UUID before a planting-seed dataset is validated."
    source_ids:
      - cfia-common-seed
published_dataset_profile:
  dataset_role: "Foreground farm-gate linseed production dataset"
  downstream_use: "secondary_dataset; background_dataset when region, crop year, gate and quality are representative"
  allowed_use: "Modelling unprocessed oilseed linseed grain at the declared moisture and grade, with explicit co-product treatment; the conditional planting-seed branch requires separately verified output flow and seed-grade evidence"
  excluded_use: "Oil crushing, fibre processing, or farm-independent post-gate storage and transport; planting-seed use is allowed only under the distinct seed branch and verified seed flow"
  required_metadata: "Farm region; field and crop year; variety or solin designation; intended oilseed or sowing use; area and yield; moisture and impurity grade; harvest route; conditioning and seed tests where applicable; straw fate; allocation method; upstream input geography and year"
  required_quality_disclosure: "Missing input records, measurement and grade uncertainty, shared-equipment apportionment, soil-emission method, co-product price and sensitivity, site and temporal representativeness"
  update_trigger: "Change in crop-management or harvest route, gate quality, straw market, emission method, or data vintage that materially alters inventory"
