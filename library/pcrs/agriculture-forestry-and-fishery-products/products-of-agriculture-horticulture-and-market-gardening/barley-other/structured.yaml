allocation_rules:
  - rule_id: allocation_subdivision_priority
    applies_to: "crop, harvest, conditioning, storage, and dispatch processes"
    rule: "First avoid allocation by subdividing crop operations, harvest, drying, cleaning, grading, storage, and waste handling wherever records support separate process nodes."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_grain_and_residue
    applies_to: "barley grain and removed straw or residue"
    rule: "Treat residue left in the field according to its declared fate. When straw or another residue is removed or sold and subdivision is not possible, use an explicitly declared physical or economic allocation method and disclose sensitivity."
    source_ids:
      - iso-14044-2006
      - fao-grain-postharvest-systems-1998
  - rule_id: allocation_screenings_and_rejects
    applies_to: "screenings, damaged grain, and off-grade material"
    rule: "Record accepted grain, screenings, rejects, and losses as separate outputs with fates. Do not assign rejected material to the reference product without an explicit rework or allocation decision."
    source_ids:
      - fao-grain-postharvest-systems-1998
      - usda-barley-grain-standards
  - rule_id: allocation_substitution
    applies_to: "residue or by-product use"
    rule: "Use substitution only when the displaced product, route, market, and evidence are declared; do not infer a displacement credit from a product label or generic residue name."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_seed_input_records
      process_id: "barley_crop_production"
      flow_role: "seed for sowing input"
      record_type: "seed purchase or receiving record"
      raw_fields: "lot; variety; supplier; source; treatment; mass; moisture basis; date; field"
      collection_method: "weighbridge, calibrated scale, invoice, or supplier record"
      unit: "kg"
      frequency: "per seed lot"
      temporal_coverage: "crop cycle"
      site_scope: "production field or farm"
      aggregation_rule: "sum seed mass by field and crop lot"
      quality_evidence: "scale calibration, invoice, supplier record"
    - protocol_id: cp_fertilizer_input_records
      process_id: "barley_crop_production"
      flow_role: "fertilizer inputs"
      record_type: "purchase and application record"
      raw_fields: "product; nutrient; product mass; nutrient mass; date; field; application method"
      collection_method: "invoice, nutrient analysis, farm log, or applicator record"
      unit: "kg product and kg nutrient"
      frequency: "per application"
      temporal_coverage: "crop cycle"
      site_scope: "production field or farm"
      aggregation_rule: "sum by product and nutrient and normalize to declared output"
      quality_evidence: "invoice, nutrient analysis, application log"
    - protocol_id: cp_irrigation_records
      process_id: "barley_crop_production"
      flow_role: "irrigation and withdrawal"
      record_type: "meter or pumping record"
      raw_fields: "source; meter; readings; volume; pumping energy; date; field"
      collection_method: "calibrated meter, pumping log, or invoice"
      unit: "m3, kg, and energy unit"
      frequency: "per event or period"
      temporal_coverage: "irrigation season"
      site_scope: "field and water source"
      aggregation_rule: "sum by source and distinguish withdrawal from delivery"
      quality_evidence: "meter calibration, readings, invoice"
    - protocol_id: cp_field_energy_records
      process_id: "barley_crop_production"
      flow_role: "field energy"
      record_type: "field operation energy record"
      raw_fields: "operation; machine; energy carrier; quantity; field; date"
      collection_method: "fuel log, invoice, telematics, or meter"
      unit: "L, kg, MJ, or kWh"
      frequency: "per field operation"
      temporal_coverage: "crop cycle"
      site_scope: "production field or farm"
      aggregation_rule: "sum by operation and normalize to selected gate output"
      quality_evidence: "invoice, machine log, telematics"
    - protocol_id: cp_crop_protection_records
      process_id: "barley_crop_production"
      flow_role: "crop protection"
      record_type: "application record"
      raw_fields: "product; active substance; formulation; mass; date; field; application method"
      collection_method: "spray log, product label, or applicator record"
      unit: "kg product or kg active substance"
      frequency: "per application"
      temporal_coverage: "crop cycle"
      site_scope: "production field or farm"
      aggregation_rule: "sum by product or active substance and normalize to output"
      quality_evidence: "label, log, applicator record"
    - protocol_id: cp_land_and_output_records
      process_id: "barley_crop_production"
      flow_role: "land, harvest, and outputs"
      record_type: "field and harvest record"
      raw_fields: "field; area; crop duration; harvest date; gross grain; residue; fate; moisture; quality"
      collection_method: "field record plus calibrated scale and dispatch records"
      unit: "ha, crop duration, kg, percent"
      frequency: "per harvest and annual reconciliation"
      temporal_coverage: "crop year"
      site_scope: "production field or farm"
      aggregation_rule: "reconcile field outputs before normalization"
      quality_evidence: "field map, scale calibration, harvest ticket"
    - protocol_id: cp_harvest_and_output_records
      process_id: "barley_harvest_and_delivery"
      flow_role: "harvested grain and harvest energy"
      record_type: "harvest and delivery record"
      raw_fields: "field; machine; operation; grain mass; residue; loss; moisture; energy; date; hand-off"
      collection_method: "calibrated scale, harvest log, telematics, and delivery ticket"
      unit: "kg, percent, L, MJ, or kWh"
      frequency: "per harvest event"
      temporal_coverage: "crop cycle"
      site_scope: "field to gate hand-off"
      aggregation_rule: "sum by lot and declared hand-off"
      quality_evidence: "scale ticket, machine record, delivery record"
    - protocol_id: cp_harvest_energy_records
      process_id: "barley_harvest_and_delivery"
      flow_role: "harvest energy"
      record_type: "machine or contractor record"
      raw_fields: "machine; energy carrier; quantity; harvested mass; period"
      collection_method: "contractor invoice, fuel log, telematics, or meter"
      unit: "kg, L, MJ, or kWh"
      frequency: "per harvest event or period"
      temporal_coverage: "crop cycle"
      site_scope: "harvest operation"
      aggregation_rule: "allocate by harvested mass and declared operation"
      quality_evidence: "invoice, telematics, meter"
    - protocol_id: cp_residue_and_fate_records
      process_id: "barley_harvest_and_delivery"
      flow_role: "residue and loss fates"
      record_type: "residue or loss record"
      raw_fields: "stream; mass; moisture; fate; destination; date; field or lot"
      collection_method: "scale ticket, field log, disposal, transfer, or sales record"
      unit: "kg"
      frequency: "per event or campaign"
      temporal_coverage: "crop cycle"
      site_scope: "field and hand-off"
      aggregation_rule: "sum by stream and fate; do not merge with accepted grain"
      quality_evidence: "scale ticket, fate record, field log"
    - protocol_id: cp_conditioning_energy_records
      process_id: "barley_primary_conditioning"
      flow_role: "drying, cleaning, and grading energy"
      record_type: "facility energy record"
      raw_fields: "line; energy type; quantity; period; batch; input and output mass"
      collection_method: "meter, utility bill, equipment log, or supplier record"
      unit: "kWh, MJ, kg, or L"
      frequency: "per batch or campaign"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and line"
      aggregation_rule: "allocate to batch and normalize to accepted output"
      quality_evidence: "meter, bill, equipment log"
    - protocol_id: cp_conditioning_water_records
      process_id: "barley_primary_conditioning"
      flow_role: "conditioning water"
      record_type: "batch water record"
      raw_fields: "batch; source; volume; use; date; input and output mass"
      collection_method: "meter, batch sheet, or utility record"
      unit: "m3 or kg"
      frequency: "per batch or campaign"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and line"
      aggregation_rule: "sum by source and use"
      quality_evidence: "meter, batch sheet, utility record"
    - protocol_id: cp_conditioning_auxiliary_records
      process_id: "barley_primary_conditioning"
      flow_role: "cleaning auxiliary"
      record_type: "batch input record"
      raw_fields: "product; identity; mass; purpose; batch; date"
      collection_method: "batch sheet, invoice, label, or supplier record"
      unit: "kg"
      frequency: "per batch"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and line"
      aggregation_rule: "sum by named input and batch"
      quality_evidence: "invoice, label, batch record"
    - protocol_id: cp_conditioning_reject_records
      process_id: "barley_primary_conditioning"
      flow_role: "screenings, rejects, and dust"
      record_type: "conditioning reject record"
      raw_fields: "batch; stream; mass; moisture; quality; fate; dust-collector mass"
      collection_method: "calibrated scale, reject log, dust record, or contractor record"
      unit: "kg and percent"
      frequency: "per batch or campaign"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and line"
      aggregation_rule: "sum by stream and fate and reconcile to batch input"
      quality_evidence: "scale, reject log, fate record"
    - protocol_id: cp_conditioned_output_records
      process_id: "barley_primary_conditioning"
      flow_role: "conditioned reference output"
      record_type: "conditioning output record"
      raw_fields: "batch; accepted mass; moisture; grade; quality; cleaning status; gate"
      collection_method: "calibrated scale and quality test record"
      unit: "kg and percent"
      frequency: "per batch"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and declared gate"
      aggregation_rule: "sum accepted batches at declared basis"
      quality_evidence: "scale calibration, quality test, dispatch record"
    - protocol_id: cp_storage_and_handoff_records
      process_id: "barley_storage_and_dispatch"
      flow_role: "storage energy and loss"
      record_type: "storage inventory record"
      raw_fields: "lot; opening mass; closing mass; moisture; duration; energy; losses; fate"
      collection_method: "inventory reconciliation, meter, utility bill, or storage log"
      unit: "kg, percent, days, MJ, or kWh"
      frequency: "per lot or storage period"
      temporal_coverage: "declared storage duration"
      site_scope: "storage site"
      aggregation_rule: "reconcile mass and allocate energy by lot and duration"
      quality_evidence: "inventory record, meter, bill"
    - protocol_id: cp_packaging_records
      process_id: "barley_storage_and_dispatch"
      flow_role: "transport packaging"
      record_type: "packaging issue or dispatch record"
      raw_fields: "packaging type; item count; mass; capacity; lot; gate; date"
      collection_method: "packaging inventory, packing log, or supplier record"
      unit: "item and kg"
      frequency: "per packaged lot"
      temporal_coverage: "declared gate period"
      site_scope: "declared gate or packing site"
      aggregation_rule: "sum packaging mass or convert item count using recorded capacity and mass"
      quality_evidence: "inventory record, packing log, supplier record"
    - protocol_id: cp_declared_gate_output_records
      process_id: "barley_storage_and_dispatch"
      flow_role: "declared-gate output"
      record_type: "dispatch or gate record"
      raw_fields: "lot; gate; date; mass; moisture; quality; packaging or bulk state"
      collection_method: "weighbridge, scale, dispatch, or receiving record"
      unit: "kg and percent"
      frequency: "per shipment or gate event"
      temporal_coverage: "declared gate period"
      site_scope: "declared gate"
      aggregation_rule: "sum output lots and preserve gate identity"
      quality_evidence: "scale ticket, dispatch record, quality record"
  calculation_rules:
    - id: normalize_to_declared_gate
      applies_to: "all foreground flows"
      rule: "recorded flow amount / accepted non-seed barley grain mass at the selected declared gate * reference amount"
      inputs:
        - "all applicable protocols"
        - "declared gate output"
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: convert_moisture_basis
      applies_to: "grain mass comparisons"
      rule: "dry-matter mass = as-is mass * (1 - moisture fraction); retain both as-is and converted values and the measured moisture basis"
      inputs:
        - "harvest and conditioning mass"
        - "moisture records"
      output: "comparable mass basis"
      source_ids:
        - fao-grain-postharvest-systems-1998
        - usda-barley-grain-standards
    - id: calculate_water_withdrawal
      applies_to: "irrigation"
      rule: "source-specific metered withdrawal converted to the declared unit and normalized to selected gate output; report delivery and consumption separately"
      inputs:
        - cp_irrigation_records
        - cp_declared_gate_output_records
      output: "withdrawal per reference output"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: calculate_direct_soil_n2o
      applies_to: "fertilizer N and direct N2O"
      rule: "apply the selected IPCC tier and factor to accounted N input and convert N2O-N to N2O where applicable; disclose factor selection"
      inputs:
        - cp_fertilizer_input_records
        - "selected method factor"
      output: "direct soil N2O per reference output"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: reconcile_harvest_outputs
      applies_to: "harvest and field delivery"
      rule: "harvested grain + residue removed + measured loss + field-return or explained remainder = declared harvest input on a common moisture basis"
      inputs:
        - cp_land_and_output_records
        - cp_harvest_and_output_records
        - cp_residue_and_fate_records
      output: "mass-balance reconciliation"
      source_ids:
        - mass-balance-identity
    - id: reconcile_conditioning_outputs
      applies_to: "primary conditioning"
      rule: "accepted grain + screenings + rejects + dust or measured loss = conditioning input on a common moisture basis; explain residual"
      inputs:
        - cp_conditioning_reject_records
        - cp_conditioned_output_records
      output: "conditioning yield and loss reconciliation"
      source_ids:
        - fao-grain-postharvest-systems-1998
        - mass-balance-identity
    - id: allocate_storage_energy
      applies_to: "storage"
      rule: "storage energy is allocated by recorded lot mass and declared storage duration; avoid allocation when a dedicated meter exists"
      inputs:
        - cp_storage_and_handoff_records
      output: "storage energy per reference output"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_non_seed_identity
      applies_to: "reference product"
      requirement: "Declare that the product is non-seed barley grain and state the intended end-use class; do not use seed quality claims as a substitute."
      evidence: "product metadata, contract, quality record, or dispatch record"
    - id: dq_gate_and_moisture
      applies_to: "reference flow and outputs"
      requirement: "Record the selected gate, as-is mass, moisture basis, and any dry-matter conversion for every reconciled output stream."
      evidence: "scale, moisture test, dispatch, and calculation records"
    - id: dq_temporal_coverage
      applies_to: "crop production and harvest"
      requirement: "Cover the declared crop cycle and harvest year; disclose whether the dataset is a single year, multi-year average, or scenario."
      evidence: "dated farm, harvest, and input records"
    - id: dq_input_completeness
      applies_to: "field and conditioning inventory"
      requirement: "Quantify or justify zero or exclusion for seed-for-sowing, fertilizer, irrigation, crop protection, land, field energy, harvest energy, drying energy, storage energy, and direct emissions."
      evidence: "ledgers, invoices, logs, meters, and method declaration"
    - id: dq_output_fate
      applies_to: "residues, screenings, rejects, and losses"
      requirement: "Record every non-reference output, its mass basis, boundary crossing, destination, and fate; evidence gap fates block finalization."
      evidence: "scale records, field logs, disposal, transfer, or sales records"
    - id: dq_quality_descriptor
      applies_to: "grain identity"
      requirement: "Record quality or grade descriptors relevant to the intended end use, without turning them into universal acceptance thresholds."
      evidence: "official grade test, buyer specification, or local quality record"
    - id: dq_uuid_identity
      applies_to: "flow and elementary-flow references"
      requirement: "Every fixed UUID must be traceable to a confirmed identity record; rows without a fixed UUID use a compatible parameterized Flow Set or remain unbound rather than being silently replaced by a generic UUID."
      evidence: "local identity record and review metadata"
validation_rules:
  - rule_id: validation_non_seed_boundary
    applies_to: "product identity"
    rule: "Confirm that the reference product is non-seed barley grain and that seed for sowing, malt, flour, starch, ethanol, brewed products, and downstream food or feed processing are excluded or separately modelled."
    source_ids:
      - usda-barley-grain-standards
      - fao-grain-postharvest-systems-1998
  - rule_id: validation_reference_flow
    applies_to: "reference flow"
    rule: "Confirm one 1 kg reference flow uses the verified Barley, other identity, mass property, kg unit, declared end use, moisture basis, quality descriptors, geography, crop year, and gate."
    source_ids:
      - usda-barley-grain-standards
  - rule_id: validation_process_completeness
    applies_to: "process map and inventory"
    rule: "Confirm crop production, harvest, and the applicable primary-conditioning or storage processes are present or explicitly excluded by the declared gate."
    source_ids:
      - fao-grain-postharvest-systems-1998
  - rule_id: validation_nitrogen
    applies_to: "fertilizer and emissions"
    rule: "Confirm product mass differs from kg N, factor selection is declared, N2O-N conversion is transparent, and other nitrogen pathways are addressed or justified."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_water
    applies_to: "irrigation"
    rule: "Confirm withdrawal, delivered irrigation, consumption, and water-footprint results are distinguished and not double counted."
    source_ids:
      - fao-crop-evapotranspiration-56
  - rule_id: validation_moisture_and_mass_balance
    applies_to: "harvest and conditioning"
    rule: "Confirm mass reconciliation uses a common moisture basis and that accepted grain, residues, screenings, rejects, and losses have declared fates."
    source_ids:
      - fao-grain-postharvest-systems-1998
      - mass-balance-identity
  - rule_id: validation_allocation
    applies_to: "co-products and residues"
    rule: "Confirm subdivision was considered first, any allocation method is declared, substitution has an evidenced displaced product, and sensitivity is reported when material."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_uuid_review
    applies_to: "identity references"
    rule: "Confirm every fixed UUID and receiving compartment; resolve each parameterized Flow Set at foreground data generation before creating a final TIDAS exchange."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "downstream grain-trading, food, feed, malting, industrial, or LCA data construction when the declared non-seed end use, geography, crop year, moisture basis, quality descriptors, production route, and gate match the dataset metadata"
  excluded_use: "barley seed for sowing; malt; flour; starch; ethanol; brewed products; processed foods or feeds; datasets with an incompatible gate or evidence gap material loss or fate records"
  required_metadata: "reference flow; non-seed end use; barley type or variety where material; geography; crop cycle and year; seed-for-sowing source; irrigation status; fertilizer and crop-protection records; moisture basis; quality descriptors; harvest and conditioning route; declared gate; residue and reject fates; allocation; data-quality disclosure"
  required_quality_disclosure: "primary-record coverage; temporal and geographic representativeness; moisture and mass-balance treatment; selected factors; identity coverage and unmapped-flow disclosure; omitted inputs; allocation and sensitivity; module checklist result"
  update_trigger: "material change in route, gate, moisture or quality representation, end-use scope, fertilizer or crop-protection practice, irrigation, harvest or conditioning technology, storage duration, factor source, identity binding, or evidence status"
