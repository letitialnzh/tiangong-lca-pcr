          amount:
            expression: "measured dust-collector mass or method-calculated emission"
            value_mode: "calculated_value"
            specificity: "technology_specific"
            basis:
              text: "per declared reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
