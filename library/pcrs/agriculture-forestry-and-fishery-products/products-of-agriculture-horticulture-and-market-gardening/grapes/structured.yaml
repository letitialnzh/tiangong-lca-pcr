allocation_rules:
  - rule_id: allocation_grape_outputs
    applies_to: "harvested grapes, saleable grapes, culls, and retained-use residues"
    rule: "Reconcile all harvested mass to saleable product, co-products, retained use, and waste. Use physical mass allocation only when functions and quality are comparable; otherwise document a justified method."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_perennial_asset
    applies_to: "establishment, trellis, and replanting"
    rule: "Allocate annualized perennial-asset burdens using declared productive life and area, and disclose simultaneous crop or land uses."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_packing_losses
    applies_to: "conditional sorting and packing"
    rule: "Attribute conditioning inputs to packed product, culls, and other outputs using measured mass reconciliation unless a reviewed alternative is justified."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_vineyard_establishment_records
      process_id: "vineyard_establishment_replanting"
      flow_role: "planting stock, fuel, irrigation, land, removed material"
      record_type: "nursery invoices, maps, fuel and irrigation logs"
      raw_fields: "area, cultivar, vine count, date, fuel, water, material, destination"
      collection_method: "collect farm and contractor records; reconcile to block area; Raw aggregation and attribution: sum by block and annualize by productive life"
      unit: "kg, item, m3, L, m2 year"
      frequency: "each event"
      temporal_coverage: "establishment period annualized to crop cycle"
      site_scope: "vineyard block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, maps, meters, receipts"
