  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all rows"
      rule: "normalized amount = reported amount / saleable fresh grape output; retain original amount and basis"
      inputs:
        - "flow amount"
        - "saleable output"
        - conversion
      output: "amount per kg reference flow"
      source_ids:
        - iso-14044-2006
    - id: calc_perennial_annualization
      applies_to: "establishment"
      rule: "annualized burden = event burden × crop-cycle share of declared productive life"
      inputs:
        - "event amount"
        - life
        - duration
        - area
      output: "crop-cycle burden"
      source_ids:
        - iso-14044-2006
    - id: calc_nutrient_basis
      applies_to: "fertilizer total"
      rule: "nutrient amount = sum(product mass × declared nutrient fraction) by nutrient and event"
      inputs:
        - "product mass and nutrient fraction"
      output: "kg product and kg N, P2O5, or K2O"
      source_ids:
        - ipcc-2019-refinement-vol4
    - id: calc_mass_balance
      applies_to: "harvest and conditioning"
      rule: "inbound or harvested mass = saleable output + co-products or retained use + waste and losses"
      inputs:
        - "weigh and destination records"
      output: "reconciled amounts"
      source_ids:
        - iso-14044-2006
    - id: calc_soil_emissions
      applies_to: "soil emissions"
      rule: "apply the selected geographic factor or model to recorded nutrient, residue, soil, and drainage inputs"
      inputs:
        - "activity ledger and method"
      output: "emission amounts"
      source_ids:
        - ipcc-2019-refinement-vol4
