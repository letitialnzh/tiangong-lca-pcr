measurement_rules:
  - id: reference_mass
    applies_to: "reference product and marketable product outputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Normalize the reference flow on as-received marketable fresh mass. Record moisture or dry matter separately and do not combine dry-matter and fresh-mass quantities without a documented conversion."
  - id: crop_cycle_yield
    applies_to: "field, harvest, conditioning, and storage product rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Derive the denominator from measured marketable product for the declared crop cycle; gross harvested mass, sorted mass, and marketable mass must remain distinguishable."
  - id: area_normalization
    applies_to: "land occupation and crop-cycle records"
    required_property_ref:
      name: "Area-time"
      uuid: ""
    required_unit: "m2*year"
    rule: "Convert cultivated area and the declared crop-cycle duration to area-time per kg reference product; disclose whether a shorter protected-crop cycle or a full annual occupation period is used."
  - id: energy_measurement
    applies_to: "fuel and electricity rows"
    required_property_ref:
      name: "Energy or fuel amount"
      uuid: ""
    required_unit: "kWh or L"
    rule: "Collect electricity in meter kWh and fuel as purchased or dispensed activity data. Convert fuel to energy only with a documented fuel identity and lower-heating-value factor."
  - id: water_measurement
    applies_to: "irrigation and conditioning water rows"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Keep irrigation delivery, source withdrawal, and conditioning water separate. Record meters, estimates, or supplier records and identify any reused or recirculated water."
