              - role: qa_guardrail
                lower: "0"
                upper: "0.2"
                unit: "kg packaging waste/kg gate product"
                basis: "per 1 kg marketable fresh reference product at declared gate"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_primary_product
    applies_to: "all crop-cycle inputs and emissions"
    rule: "Assign foreground burdens to the declared marketable reference product after applying the measured crop-cycle output and any selected allocation method."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_co_product
    applies_to: "saleable co-products or off-grade products leaving the system"
    rule: "Record each co-product separately. Use mass allocation only when product comparability is documented; otherwise use economic allocation with a stated price period and source."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue
    applies_to: "crop residues, field losses, rejects, soil, and wastewater"
    rule: "Keep residues and losses as waste or elementary flows by physical fate. Do not treat returned residues or treatment outputs as co-products or avoided burdens."
    source_ids:
      - ipcc-2019-managed-soils
      - iso-14044-2006
  - rule_id: allocation_reusable_packaging
    applies_to: "reusable bins, crates, and containers"
    rule: "Allocate packaging manufacture and maintenance over documented reuse cycles and the product mass served; record losses and replacement separately."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_planting_material_records
      process_id: "field_cultivation"
      flow_role: "planting material"
      record_type: "lot ledger and supplier record"
      raw_fields: "crop identity; cultivar or type; material form; lot; mass or count; treatment; supplier; planting date; planted area"
      collection_method: "weigh on receipt and reconcile to invoice and planting log"
      unit: "kg or count"
      frequency: "each lot and crop cycle"
      temporal_coverage: "full declared crop cycle"
      site_scope: "farm and block"
      aggregation_rule: "sum lots used by crop cycle, then normalize by marketable output"
      quality_evidence: "invoice, lot label, field log, scale record"
    - protocol_id: cp_nutrient_input_records
      process_id: "field_cultivation"
      flow_role: "fertilizer or soil amendment; soil emissions"
      record_type: "input ledger, label, test, and application log"
      raw_fields: "product name; product mass or volume; N/P/K or other nutrient content; lot; application date; area; application method; lime or urea flag"
      collection_method: "reconcile invoices, product labels, tests, and application logs; retain nutrient basis"
      unit: "kg product and kg nutrient"
      frequency: "each product and application"
      temporal_coverage: "full crop cycle"
      site_scope: "farm and block"
      aggregation_rule: "sum actual products and nutrients by crop cycle; do not infer unrecorded product types"
      quality_evidence: "invoice, label, laboratory test, application log"
    - protocol_id: cp_crop_protection_records
      process_id: "field_cultivation"
      flow_role: "crop protection"
      record_type: "spray or treatment log"
      raw_fields: "product; active substance; dose; amount; area; date; application method; target"
      collection_method: "reconcile treatment log to product issue and label"
      unit: "kg product or active substance"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "farm and block"
      aggregation_rule: "sum products and active substances by crop cycle"
      quality_evidence: "application log, label, purchase record"
    - protocol_id: cp_irrigation_water_records
      process_id: "field_cultivation"
      flow_role: "irrigation water and source withdrawal"
      record_type: "meter, irrigation log, or supplier record"
      raw_fields: "source; delivery or withdrawal volume; meter id; date; crop block; irrigation method; reuse fraction"
      collection_method: "read meter or reconcile supplier/source records; record estimation method where metering is absent"
      unit: "m3"
      frequency: "each irrigation event or monthly meter"
      temporal_coverage: "full crop cycle"
      site_scope: "farm and block"
      aggregation_rule: "sum by crop block; keep delivery and source withdrawal separate"
      quality_evidence: "meter calibration, pump log, supplier statement"
    - protocol_id: cp_field_energy_records
      process_id: "field_cultivation"
      flow_role: "cultivation fuel and electricity"
      record_type: "fuel ledger and utility meter"
      raw_fields: "fuel identity; volume or mass; equipment; operation; date; electricity kWh; meter; crop block"
      collection_method: "reconcile fuel issue or invoice and utility meter to field operations"
      unit: "L, kg fuel, or kWh"
      frequency: "each issue or meter period"
      temporal_coverage: "full crop cycle"
      site_scope: "farm, block, and equipment"
      aggregation_rule: "allocate shared equipment by operating time, area, or measured use and disclose factor"
      quality_evidence: "invoice, tank record, meter record, operating log"
    - protocol_id: cp_land_and_cycle_records
      process_id: "field_cultivation"
      flow_role: "land occupation"
      record_type: "field register and crop plan"
      raw_fields: "field or greenhouse id; area; crop; planting and harvest dates; cycle duration; land-use history; protected-cover status"
      collection_method: "verify field register against GIS, lease, or production records"
      unit: "ha, m2, and days"
      frequency: "each field and crop cycle"
      temporal_coverage: "declared crop cycle and prior land disclosure"
      site_scope: "farm and block"
      aggregation_rule: "area multiplied by cycle duration, then divide by marketable output"
      quality_evidence: "field register, map, lease, crop plan"
    - protocol_id: cp_yield_and_quality_records
      process_id: "field_cultivation_harvest_and_primary_sorting"
      flow_role: "harvested and sorted products"
      record_type: "harvest tickets and grading record"
      raw_fields: "product identity; cultivar; harvest date; gross mass; sorted mass; marketable mass; rejects; moisture; grade; field"
      collection_method: "weigh lots and reconcile harvest, grading, and dispatch records"
      unit: "kg fresh product and moisture fraction"
      frequency: "each harvest lot"
      temporal_coverage: "full harvest campaign"
      site_scope: "farm, block, and lot"
      aggregation_rule: "sum by crop cycle and condition; use accepted marketable mass as denominator"
      quality_evidence: "calibrated scale, grading record, moisture test"
    - protocol_id: cp_residue_and_fate_records
      process_id: "field_cultivation_harvest_and_primary_sorting"
      flow_role: "residues, soil, clods, and losses"
      record_type: "residue and waste log"
      raw_fields: "material; fresh or dry mass; moisture; fate; field or operation; date; treatment or return"
      collection_method: "weigh or estimate with documented method and reconcile to mass balance"
      unit: "kg wet or dry material"
      frequency: "each event or crop cycle"
      temporal_coverage: "full crop cycle and harvest campaign"
      site_scope: "farm, block, and operation"
      aggregation_rule: "aggregate by physical fate; do not combine product co-products with waste"
      quality_evidence: "waste ticket, field log, dry-matter test, fate record"
    - protocol_id: cp_harvest_operation_records
      process_id: "harvest_and_primary_sorting"
      flow_role: "harvest fuel and dust"
      record_type: "equipment log and operation record"
      raw_fields: "equipment; operation; fuel; run time; throughput; dust observation or measurement; date"
      collection_method: "reconcile fuel and operating records to harvest throughput; measure dust where available"
      unit: "L, kg fuel, hours, and kg particulate"
      frequency: "each operation or campaign"
      temporal_coverage: "harvest campaign"
      site_scope: "farm, block, and equipment"
      aggregation_rule: "allocate shared operation to crop throughput or operating time"
      quality_evidence: "equipment log, fuel record, measurement or observation"
    - protocol_id: cp_conditioning_yield_records
      process_id: "postharvest_conditioning"
      flow_role: "conditioning input, output, rejects"
      record_type: "batch and grading record"
      raw_fields: "input mass; output mass; trimmings; rejects; moisture; condition; date; batch"
      collection_method: "weigh input and output batches and reconcile to water and waste records"
      unit: "kg fresh product and moisture fraction"
      frequency: "each conditioning batch"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and batch"
      aggregation_rule: "sum batches by product condition and normalize by conditioned output"
      quality_evidence: "calibrated scale, batch ticket, grade record"
    - protocol_id: cp_conditioning_water_records
      process_id: "postharvest_conditioning"
      flow_role: "conditioning water and wastewater"
      record_type: "water meter and discharge log"
      raw_fields: "water input; reuse; discharge; treatment; meter; batch; date; source"
      collection_method: "meter or batch log; reconcile discharge and treatment volumes"
      unit: "m3"
      frequency: "each batch or meter period"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and batch"
      aggregation_rule: "aggregate by product batch; disclose reuse and treatment"
      quality_evidence: "meter record, discharge log, treatment ticket"
    - protocol_id: cp_conditioning_energy_records
      process_id: "postharvest_conditioning"
      flow_role: "conditioning electricity"
      record_type: "facility meter and equipment log"
      raw_fields: "electricity; equipment; runtime; batch; cooling setpoint where relevant; date"
      collection_method: "allocate meter or equipment records to campaign throughput"
      unit: "kWh"
      frequency: "meter period or batch"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and equipment"
      aggregation_rule: "allocate shared energy by throughput or runtime and disclose method"
      quality_evidence: "meter record, equipment log"
    - protocol_id: cp_packaging_records
      process_id: "postharvest_conditioning_farm_gate_storage_and_dispatch"
      flow_role: "packaging input and waste"
      record_type: "packaging issue and return log"
      raw_fields: "material; mass or count; reusable flag; cycles; product mass served; waste or return; date"
      collection_method: "weigh or count packaging and reconcile issue, return, and waste records"
      unit: "kg, count, and cycles"
      frequency: "each issue or campaign"
      temporal_coverage: "conditioning, storage, and dispatch campaign"
      site_scope: "facility and campaign"
      aggregation_rule: "prorate reusable items over documented cycles and product mass"
      quality_evidence: "supplier record, issue log, return ticket, waste ticket"
    - protocol_id: cp_wastewater_treatment_records
      process_id: "postharvest_conditioning"
      flow_role: "wastewater treatment service"
      record_type: "treatment log or supplier ticket"
      raw_fields: "wastewater volume; treatment route; date; batch; provider; discharge or reuse"
      collection_method: "reconcile treatment ticket to conditioning discharge"
      unit: "m3"
      frequency: "each batch or treatment period"
      temporal_coverage: "conditioning campaign"
      site_scope: "facility and provider"
      aggregation_rule: "sum treated volume by campaign and keep untreated discharge separate"
      quality_evidence: "treatment ticket, provider record, discharge log"
    - protocol_id: cp_storage_dispatch_records
      process_id: "farm_gate_storage_and_dispatch"
      flow_role: "storage input, electricity, product output, loss"
      record_type: "storage and dispatch register"
      raw_fields: "intake mass; gate mass; storage duration; temperature; electricity; loss; cause; date; gate condition"
      collection_method: "reconcile intake, storage, loss, and gate dispatch records"
      unit: "kg, kWh, days, and temperature"
      frequency: "each lot and storage period"
      temporal_coverage: "selected storage and dispatch campaign"
      site_scope: "farm, store, and lot"
      aggregation_rule: "sum by lot and normalize to gate product; disclose storage duration"
      quality_evidence: "scale, meter, temperature log, dispatch ticket"
    - protocol_id: cp_dispatch_transport_records
      process_id: "farm_gate_storage_and_dispatch"
      flow_role: "road freight service"
      record_type: "route and load record"
      raw_fields: "origin; destination; distance; vehicle; load; product mass; return leg; date"
      collection_method: "verify route distance and load record; calculate tonne-kilometres"
      unit: "km, t, and tonne-km"
      frequency: "each dispatch route or lot"
      temporal_coverage: "selected dispatch campaign"
      site_scope: "route and vehicle"
      aggregation_rule: "sum tonne-kilometres for included route only; exclude post-gate transport"
      quality_evidence: "route record, weigh ticket, carrier record"
  calculation_rules:
    - id: calc_marketable_yield
      applies_to: "field and harvest product rows"
      rule: "Marketable output is the accepted fresh product mass after the declared sorting and conditioning decisions. Normalize each included activity by marketable_output_kg."
      inputs:
        - cp_yield_and_quality_records
        - "harvest tickets"
        - "grading records"
      output: "kg reference product and crop-cycle yield"
      source_ids:
        - fao-ex-act-v9-2022
    - id: calc_dry_matter_conversion
      applies_to: "residues, soil, clods, and moisture-dependent rows"
      rule: "dry_mass = fresh_mass × (1 − moisture_fraction). Record the measured or declared moisture basis and keep fresh and dry mass separate."
      inputs:
        - cp_yield_and_quality_records
        - cp_residue_and_fate_records
        - "moisture test"
      output: "kg dry matter"
      source_ids:
        - fao-ex-act-v9-2022
        - ipcc-2019-managed-soils
    - id: calc_nutrient_basis
      applies_to: "fertilizer or soil amendment"
      rule: "nutrient_mass = product_mass × declared nutrient_fraction. Retain actual product mass and each declared N, P, K, or other nutrient basis; do not fill missing nutrient content with an assumed product identity."
      inputs:
        - cp_nutrient_input_records
        - "product label"
        - "laboratory test"
      output: "kg product and kg nutrient"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_soil_n_emissions
      applies_to: "direct N2O, ammonia, nitrate, phosphate, and liming or urea CO2"
      rule: "Apply the selected IPCC tier and documented factors to collected N inputs, residue N, liming, or urea as applicable. Declare the factor tier, climate or soil stratification, and residue fate; avoid double counting."
      inputs:
        - cp_nutrient_input_records
        - cp_residue_and_fate_records
        - "selected method factors"
      output: "kg pollutant per kg marketable product"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_water_normalization
      applies_to: "irrigation, withdrawal, conditioning water, and wastewater"
      rule: "water_per_kg = recorded_volume_m3 / marketable_output_kg. Keep delivery, source withdrawal, reuse, and discharge as separate rows."
      inputs:
        - cp_irrigation_water_records
        - cp_conditioning_water_records
        - "output records"
      output: "m3 per kg reference product"
      source_ids:
        - fao-ex-act-v9-2022
    - id: calc_energy_normalization
      applies_to: "fuel and electricity"
      rule: "Convert fuel only with a documented fuel identity and lower-heating-value factor; divide fuel or kWh by marketable output and allocate shared equipment by the collected use factor."
      inputs:
        - field
        - harvest
        - conditioning
        - "and storage energy records"
      output: "L, kg fuel, or kWh per kg reference product"
      source_ids:
        - fao-ex-act-v9-2022
    - id: calc_land_occupation
      applies_to: "land occupation"
      rule: "area_time_per_kg = cultivated_area × crop_cycle_duration / marketable_output_kg; disclose area units, cycle duration, and protected-cover occupancy."
      inputs:
        - cp_land_and_cycle_records
        - cp_yield_and_quality_records
      output: "m2*year per kg reference product"
      source_ids:
        - fao-ex-act-v9-2022
    - id: calc_mass_balance
      applies_to: "product, reject, residue, wastewater, and storage rows"
      rule: "Reconcile each operation as received mass or water plus additions equals product outputs, waste outputs, measured losses, and documented stock change within the declared tolerance."
      inputs:
        - batch
        - harvest
        - waste
        - water
        - "and dispatch records"
      output: "mass-balance check and normalized rows"
      source_ids:
        - iso-14044-2006
    - id: calc_transport_service
      applies_to: "included dispatch transport"
      rule: "tonne_km = product_mass_t × one_way_distance_km × declared_load_factor; include only the route to the declared gate and state any return-leg treatment."
      inputs:
        - cp_dispatch_transport_records
        - "weigh and route records"
      output: "tonne-km per kg gate product"
      source_ids:
        - fao-ex-act-v9-2022
    - id: calc_reusable_packaging
      applies_to: "packaging input and waste"
      rule: "Allocate reusable packaging burden by documented cycles and product mass served, and reconcile returned, lost, and discarded units."
      inputs:
        - cp_packaging_records
        - "supplier and return records"
      output: "kg packaging per kg product and packaging fate"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "product, planting material, nutrient products, crop protection, packaging, and waste"
      requirement: "Identify the crop, edible organ, cultivar or type, lot, product condition, and supplier or source. Do not use a generic category name as the sole identity."
      evidence: "product records, lot labels, supplier documents, identity review"
    - id: dq_temporal
      applies_to: "all foreground rows"
      requirement: "Cover one complete declared crop cycle and the associated harvest or conditioning campaign. State missing months, substituted periods, and storage duration."
      evidence: "field log, harvest tickets, meter periods, storage register"
    - id: dq_geography
      applies_to: "field, water, energy, and transport"
      requirement: "Declare farm, block or facility, country or region, production system, irrigation source, and included route."
      evidence: "field register, facility record, meter and route records"
    - id: dq_measurement
      applies_to: "amounts and conversions"
      requirement: "Prefer calibrated scales and meters, invoices, supplier records, laboratory tests, or route tickets. Document estimation and conversion factors where direct measurement is unavailable."
      evidence: "calibration, invoices, tests, logs, conversion record"
    - id: dq_completeness
      applies_to: "all included processes and flow types"
      requirement: "Include or explicitly mark not applicable all selected process inputs, outputs, wastes, residues, water, energy, nutrient products, and direct emissions."
      evidence: "completeness checklist, process map, inventory review"
    - id: dq_mass_balance
      applies_to: "product and waste rows"
      requirement: "Reconcile input, output, reject, residue, wastewater, storage loss, and stock changes at each operation; explain any residual difference."
      evidence: "batch mass balance and waste-fate records"
    - id: dq_emissions_method
      applies_to: "elementary emissions"
      requirement: "Record N forms, nutrient basis, residue fate, selected IPCC tier, factors, receiving medium, and climate or soil stratification where used."
      evidence: "nutrient ledger, residue log, method calculation record"
    - id: dq_disclosure
      applies_to: "reference flow and published dataset"
      requirement: "Disclose product condition, moisture, marketable grade, gate, boundary extensions, allocation, proxy use, reasoned estimates, and identity evidence gaps."
      evidence: "dataset metadata, process notes, quality statement"
    - id: dq_uncertainty
      applies_to: "ranges and modelled estimates"
      requirement: "Mark provisional reasoned ranges as replaceable authoring estimates and replace them with reviewed evidence before active or published use when they constrain a decision."
      evidence: "range review, site data, source update record"
    - id: dq_resolution
      applies_to: "all parameterized and unmapped rows"
      requirement: "Resolve every Flow Set selection and unmapped physical exchange to a compatible verified UUID, flow property, and unit group before final TIDAS process publication."
      evidence: "identity review and final binding audit"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference flow and product outputs"
    rule: "Use one 1 kg fresh-mass reference flow. Confirm product identity, edible organ, condition, moisture basis, geography, crop cycle, and declared gate are present."
    source_ids:
      - unsd-cpc-3-01259
  - rule_id: validation_process_map
    applies_to: "process map and detailed inventory"
    rule: "Every required process must have matching detailed inventory. Every conditional process must state whether it is included and must carry the corresponding records when included."
    source_ids:
      - fao-ex-act-v9-2022
  - rule_id: validation_amounts
    applies_to: "every flow row"
    rule: "Every row must state amount rule, value mode, specificity, normalization basis, basis kind, evidence kind, and a valid collection protocol when evidence is collected or calculated from collection."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_mass_balance
    applies_to: "product, waste, residue, and water rows"
    rule: "Fail validation when operation-level mass or water balance is unexplained, when a product handoff is counted twice, or when a loss has no declared fate."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_nutrient_emissions
    applies_to: "nutrient and elementary-emission rows"
    rule: "Check that emission calculations use recorded nutrient products and declared factors, that pollutant species and media are explicit, and that residue or liming pathways are not double counted."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validation_flow_identity
    applies_to: "parameterized and unmapped rows"
    rule: "Accept only a compatible existing Flow Set group as parameterized or an exact verified UUID as fixed. Keep coverage finding visible and reject identity evidence gaps for final TIDAS publication."
    source_ids: []
  - rule_id: validation_boundary
    applies_to: "published dataset profile and process selection"
    rule: "Reject post-gate transport, retail, consumer use, or processing when they are not declared as a boundary extension."
    source_ids:
      - unsd-cpc-3-01259
  - rule_id: validation_bilingual_alignment
    applies_to: "English and Chinese Markdown"
    rule: "Preserve identical ordered process ids, row ids, rule ids, collection protocol ids, source ids, Flow Set ids and versions, and controlled vocabulary tokens in both language renderings."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only when independently reviewed, complete, and identity-resolved"
  downstream_use: "Foreground crop process datasets and lifecyclemodel projections for fresh covered root, bulb, rhizome, corm, or tuber vegetables at the declared farm gate"
  allowed_use: "LCA modelling and aggregation when product qualifiers, geography, crop cycle, gate condition, allocation, and data-quality disclosures match; scenario comparison only when the scenario change is declared"
  excluded_use: "Processed, preserved, dried, frozen, cooked, feed-only, seed-only, or live-plant products; consumer or retail modelling without a boundary extension; publication with evidence gap flow or unit identity"
  required_metadata: "reference flow; CPC scope; product identity and edible organ; cultivar or type; farm or block; geography; production system; area and crop cycle; planting and harvest dates; harvested and marketable mass; moisture; nutrient products and nutrient basis; crop protection; irrigation source and volume; fuel and electricity; conditioning, storage, and gate state; packaging; transport; residues and fates; Flow Set selections; identity status; collection coverage; allocation; DQR"
  required_quality_disclosure: "temporal and geographic coverage; measurement and proxy methods; mass balance; yield, reject, and loss fractions; N/P/K basis; emissions tier and factors; water and energy units; allocation; evidence gap or estimated rows; and quality score or narrative"
  update_trigger: "New reviewed crop or process evidence; material route, technology, product-condition, or gate change; revised classification scope; changed Flow Set or UUID identity; recurring data outside QA ranges; or new product-specific records that replace provisional estimates"
