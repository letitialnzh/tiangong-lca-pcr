allocation_rules:
  - rule_id: allocation_mass_balance_first
    applies_to: "all nodes"
    rule: "Complete physical and dry-matter balances before allocation; keep moisture loss, residues, field loss, rework, downgrade, rejects, and accepted seed visible."
    source_ids: []
  - rule_id: allocation_single_intended_product
    applies_to: "crop route"
    rule: "Accepted seed is the sole intended product by default. Residues and rejects retain burdens to their destination; any claimed co-product requires disclosed function and goal-consistent allocation."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rework loop"
    rule: "Retain burdens through return to separation, cleaning, drying, or grading; count returned mass once and exclude it from accepted output until it passes."
    source_ids: []
  - rule_id: allocation_run_period
    applies_to: "shared runs"
    rule: "Assign shared energy, cleaning, and changeover once with a disclosed causal driver; do not count run totals and lot shares together."
    source_ids: []
  - rule_id: allocation_multi_period
    applies_to: "perennial route"
    rule: "Separate establishment, production, replacement, and termination; attribute phases over evidenced productive output and prevent double attribution."
    source_ids:
      - fao-ecocrop-ricinus-communis
