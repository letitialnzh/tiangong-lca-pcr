    - rule_id: boundary_crop_to_seed
      applies_to: "foreground system"
      rule: "Include crop management, capsule capture, seed separation, drying, cleaning, grading, and internal transfers; exclude oil extraction."
      source_ids:
        - fao-ecocrop-ricinus-communis
        - icar-castor-depodder-2009
    - rule_id: route_separation
      applies_to: "annual and perennial routes"
      rule: "Model route-specific establishment, production, replacement, termination, and input profiles before any weighted mix."
      source_ids:
        - fao-ecocrop-ricinus-communis
    - rule_id: conditioning_gate
      applies_to: "post-harvest nodes"
      rule: "Include producer conditioning; model an external primary conditioner as foreground or with a transparent upstream process when it supplies the reference product."
      source_ids:
        - icar-castor-depodder-2009
    - rule_id: material_state_control
      applies_to: "seed and residues"
      rule: "Keep seed, pod residues, rejects, dust, and destinations separate; never presume castor residue is feed."
      source_ids:
        - fao-ecocrop-ricinus-communis
