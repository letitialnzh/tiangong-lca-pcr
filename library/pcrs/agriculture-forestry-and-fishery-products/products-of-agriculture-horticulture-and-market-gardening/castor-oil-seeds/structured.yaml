    reference: "ICAR News, April–June 2009, “Castor depodder and decorticator”, https://icar.gov.in/sites/default/files/2022-04/ICAR-News-April-June-09.pdf"
    used_for: "Pod/seed separation; cleaning/grading; moisture-sensitive mechanical route"
