validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require fixed Castor Seed UUID, Mass property/unit group, and all PCR-supplied gate, route, state, and moisture qualifiers."
    source_ids: []
  - rule_id: validate_route
    applies_to: "cultivation/harvest"
    rule: "Require one annual or perennial route and one repeated-picking or terminal-harvest declaration per unsegmented record; events reconcile to field total."
    source_ids:
      - fao-ecocrop-ricinus-communis
  - rule_id: validate_process_chain
    applies_to: "graph"
    rule: "Require cultivation, harvest, separation, drying/cleaning, and grading hand-offs; zero purchased drying energy requires moisture evidence."
    source_ids:
      - icar-castor-depodder-2009
  - rule_id: validate_mass_moisture
    applies_to: "material nodes"
    rule: "Reconcile wet mass and dry matter and report moisture removed, residues, loss, rework, downgrade, and rejects separately."
    source_ids: []
  - rule_id: validate_flow_resolution
    applies_to: "exchanges"
    rule: "Resolve each Flow Set card to verified concrete UUIDs and each deferred identity by substance/material state, direction, destination, property, and unit before final TIDAS generation."
    source_ids: []
  - rule_id: validate_nutrient_cardinality
    applies_to: "cultivation"
    rule: "Permit at most one consolidated flow-set.agricultural-nutrient-supply@0.3.0 card and no group."
    source_ids: []
  - rule_id: validate_period_attribution
    applies_to: "perennial route"
    rule: "Require establishment, production, replacement, termination, and remaining-stand treatment; prevent double attribution."
    source_ids:
      - fao-ecocrop-ricinus-communis
  - rule_id: validate_rework_reject
    applies_to: "post-harvest nodes"
    rule: "Every off-spec state ends in rework, downgrade, recovery, or waste and is excluded from accepted output until passing."
    source_ids: []
  - rule_id: validate_run_attribution
    applies_to: "runs"
    rule: "Require run/period identifier and one allocation driver; reject duplicate run totals and lot shares."
    source_ids: []
  - rule_id: validate_extraction_exclusion
    applies_to: "system"
    rule: "Reject seed crushing, castor-oil extraction, refining, or derivative manufacture inside the boundary."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground dataset for harvested unprocessed castor seed at declared producer or primary-conditioning hand-off"
  downstream_use: "secondary_dataset; background_dataset after representativeness review"
  allowed_use: "Seed supply before oil extraction; comparisons aligned on moisture, gate, route, grade, and allocation"
  excluded_use: "Oil extraction/refining; meal/derivatives; planting-seed certification; safety assessment; undisclosed route mixtures"
  required_metadata: "geography; period; cultivar; route; stand phase; harvest pattern; area; technology; drying mode; moisture; grade; impurity; gate; allocation; rework; concrete identities"
  required_quality_disclosure: "primary-data share; gaps; uncertainty; Range exceedances; balances; Flow Set expansion evidence; deferred identity decisions; perennial attribution"
  update_trigger: "changed specification, gate, route, harvest pattern, technology, moisture, grade, supplier mix, allocation, Flow Set version, or UUID evidence"
