allocation_rules:
  - rule_id: allocation_mass_balance_first
    applies_to: "all nodes"
    rule: "Complete physical and dry-matter balances before allocation; keep moisture loss, residues, field loss, rework, downgrade, rejects, and accepted seed visible."
    source_ids: []
  - rule_id: allocation_single_intended_product
    applies_to: "crop route"
    rule: "Accepted seed is the sole intended product by default. Residues and rejects retain burdens to their destination; any claimed co-product requires disclosed function and goal-consistent allocation."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rework loop"
    rule: "Retain burdens through return to separation, cleaning, drying, or grading; count returned mass once and exclude it from accepted output until it passes."
    source_ids: []
  - rule_id: allocation_run_period
    applies_to: "shared runs"
    rule: "Assign shared energy, cleaning, and changeover once with a disclosed causal driver; do not count run totals and lot shares together."
    source_ids: []
  - rule_id: allocation_multi_period
    applies_to: "perennial route"
    rule: "Separate establishment, production, replacement, and termination; attribute phases over evidenced productive output and prevent double attribution."
    source_ids:
      - fao-ecocrop-ricinus-communis
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "cultivation"
      flow_role: "nutrients and irrigation"
      record_type: "invoices, application logs, meters"
      raw_fields: "field_id; route; phase; product; composition; quantity; unit; date"
      collection_method: "reconcile purchase and field application; Raw aggregation and attribution: sum by field, material, period; retain zero-use"
      unit: "native unit plus kg"
      frequency: "every application"
      temporal_coverage: "crop cycle or productive period"
      site_scope: "every field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, meter, application, calibration"
    - protocol_id: cp_energy_records
      process_id: "all_nodes"
      flow_role: "fuels and electricity"
      record_type: "issues, meters, equipment logs"
      raw_fields: "process_id; run_id; carrier; quantity; unit; equipment; hours; driver"
      collection_method: "direct measurement or documented calculation; Raw aggregation and attribution: sum by carrier and node; allocate once"
      unit: "native unit and MJ"
      frequency: "each run or period"
      temporal_coverage: "complete foreground period"
      site_scope: "every field/facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, meter, log, factor"
    - protocol_id: cp_harvest_lots
      process_id: "harvest"
      flow_role: "capsules and field loss"
      record_type: "tickets and samples"
      raw_fields: "field_id; event_id; date; pattern; technology; mass; moisture; loss"
      collection_method: "weigh every lot; document loss sampling; Raw aggregation and attribution: sum events after moisture reconciliation"
      unit: "kg and % wet basis"
      frequency: "every event"
      temporal_coverage: "all pickings or terminal harvest"
      site_scope: "every field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, sample, trace"
    - protocol_id: cp_field_emissions
      process_id: "cultivation"
      flow_role: "substances"
      record_type: "measurements and calculations"
      raw_fields: "substance; compartment; activity; factor; result; unit; method"
      collection_method: "measure or use declared method; Raw aggregation and attribution: preserve identity and compartment"
      unit: "kg substance"
      frequency: "event or period"
      temporal_coverage: "full period"
      site_scope: "every field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "method, raw data, calculation"
    - protocol_id: cp_conditioning_lots
      process_id: "pod_seed_separation_drying_cleaning"
      flow_role: "seed, residues, moisture"
      record_type: "batch sheets and tests"
      raw_fields: "run_id; masses; moisture; residues; rejects; destination; technology"
      collection_method: "weigh inputs/outputs and sample moisture; Raw aggregation and attribution: reconcile wet and dry matter by run"
      unit: "kg and % wet basis"
      frequency: "every run/lot"
      temporal_coverage: "all supplying lots"
      site_scope: "every site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale, moisture method, trace"
    - protocol_id: cp_grading_handoff
      process_id: "grading_handoff"
      flow_role: "accepted, downgrade, rework, reject"
      record_type: "grading and dispatch records"
      raw_fields: "lot_id; masses; grade; impurity; moisture; destinations; gate"
      collection_method: "weigh each state and link dispatch/rework; Raw aggregation and attribution: accepted only into reference output; rework once"
      unit: "kg and grade measure"
      frequency: "every lot"
      temporal_coverage: "all supplying lots"
      site_scope: "every site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale, specification, trace"
  calculation_rules:
    - id: calc_moisture_conversion
      applies_to: "material hand-offs"
      rule: "dry matter = wet mass × (1 − wet-basis moisture fraction); target wet mass = dry matter ÷ (1 − target fraction)"
      inputs:
        - mass
        - "measured moisture"
        - "target moisture"
      output: "moisture-consistent mass"
      source_ids: []
    - id: calc_stage_yield
      applies_to: "all nodes"
      rule: "transferred-output dry matter ÷ input dry matter"
      inputs:
        - "linked masses and moisture"
      output: "stage yield"
      source_ids: []
    - id: calc_field_yield
      applies_to: "field route"
      rule: "accepted-output dry matter ÷ occupied area, retaining route phase and harvest events"
      inputs:
        - output
        - moisture
        - area
        - period
      output: "kg dry matter/ha-period"
      source_ids: []
    - id: calc_shared_run
      applies_to: "campaign/continuous run"
      rule: "shared burden × lot driver ÷ total run driver"
      inputs:
        - "run burden and driver"
      output: "once-allocated lot burden"
      source_ids: []
    - id: calc_perennial_attribution
      applies_to: "perennial route"
      rule: "attribute phase burden over evidenced productive output; disclose remaining-stand and termination treatment"
      inputs:
        - "phase records and outputs"
      output: "period burden"
      source_ids:
        - fao-ecocrop-ricinus-communis
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Verify species, harvested-unprocessed state, CPC context, grade, moisture, and gate for every lot."
      evidence: "specification, detail evidence, dispatch"
    - id: dq_traceability
      applies_to: "process graph"
      requirement: "Link field, event, separation run, conditioning lot, grading/rework pass, and dispatch without duplicate mass."
      evidence: "identifiers and reconciliation"
    - id: dq_temporal
      applies_to: "routes"
      requirement: "Cover the annual cycle or reported perennial period and identify establishment, replacement, and termination outside it."
      evidence: "dated records"
    - id: dq_measurement
      applies_to: "mass/moisture"
      requirement: "Use calibrated scales and documented moisture method; disclose sampling and gaps."
      evidence: "calibration and test records"
    - id: dq_completeness
      applies_to: "all cards"
      requirement: "Record zero, value, or documented gap for each applicable card and destination."
      evidence: "completed checklist and balance"
    - id: dq_technology
      applies_to: "alternatives"
      requirement: "Identify manual/mechanical harvest and separation and passive/active drying before aggregation."
      evidence: "equipment and run records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require fixed Castor Seed UUID, Mass property/unit group, and all PCR-supplied gate, route, state, and moisture qualifiers."
    source_ids: []
  - rule_id: validate_route
    applies_to: "cultivation/harvest"
    rule: "Require one annual or perennial route and one repeated-picking or terminal-harvest declaration per unsegmented record; events reconcile to field total."
    source_ids:
      - fao-ecocrop-ricinus-communis
  - rule_id: validate_process_chain
    applies_to: "graph"
    rule: "Require cultivation, harvest, separation, drying/cleaning, and grading hand-offs; zero purchased drying energy requires moisture evidence."
    source_ids:
      - icar-castor-depodder-2009
  - rule_id: validate_mass_moisture
    applies_to: "material nodes"
    rule: "Reconcile wet mass and dry matter and report moisture removed, residues, loss, rework, downgrade, and rejects separately."
    source_ids: []
  - rule_id: validate_flow_resolution
    applies_to: "exchanges"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_nutrient_cardinality
    applies_to: "cultivation"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_period_attribution
    applies_to: "perennial route"
    rule: "Require establishment, production, replacement, termination, and remaining-stand treatment; prevent double attribution."
    source_ids:
      - fao-ecocrop-ricinus-communis
  - rule_id: validate_rework_reject
    applies_to: "post-harvest nodes"
    rule: "Every off-spec state ends in rework, downgrade, recovery, or waste and is excluded from accepted output until passing."
    source_ids: []
  - rule_id: validate_run_attribution
    applies_to: "runs"
    rule: "Require run/period identifier and one allocation driver; reject duplicate run totals and lot shares."
    source_ids: []
  - rule_id: validate_extraction_exclusion
    applies_to: "system"
    rule: "Reject seed crushing, castor-oil extraction, refining, or derivative manufacture inside the boundary."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground dataset for harvested unprocessed castor seed at declared producer or primary-conditioning hand-off"
  downstream_use: "secondary_dataset; background_dataset after representativeness review"
  allowed_use: "Seed supply before oil extraction; comparisons aligned on moisture, gate, route, grade, and allocation"
  excluded_use: "Oil extraction/refining; meal/derivatives; planting-seed certification; safety assessment; undisclosed route mixtures"
  required_metadata: "geography; period; cultivar; route; stand phase; harvest pattern; area; technology; drying mode; moisture; grade; impurity; gate; allocation; rework; concrete identities"
  required_quality_disclosure: "primary-data share; gaps; uncertainty; Range exceedances; balances; concrete flow identity verification; deferred identity decisions; perennial attribution"
  update_trigger: "changed specification, gate, route, harvest pattern, technology, moisture, grade, supplier mix, allocation, concrete flow identity verification"
data_sources:
  - id: "fao-ecocrop-ricinus-communis"
    type: "official_guidance"
    reference: "FAO EcoCrop, *Ricinus communis*, https://ecocrop.apps.fao.org/ecocrop/srv/en/cropView?id=1866"
    used_for: "Species/seed identity; annual and short-lived perennial context; route and period declarations"
