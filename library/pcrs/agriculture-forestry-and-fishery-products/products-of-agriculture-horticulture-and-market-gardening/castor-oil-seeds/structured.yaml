system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary starts with a declared managed field or perennial stand and ends at accepted seed hand-off. Cultivation, harvest, separation, drying/cleaning, and grading are distinct responsibilities with separate states, losses, inputs, and hand-offs. Repeated pickings link to field block and lot; terminal harvest closes the crop cycle. Oil extraction is outside the boundary."
