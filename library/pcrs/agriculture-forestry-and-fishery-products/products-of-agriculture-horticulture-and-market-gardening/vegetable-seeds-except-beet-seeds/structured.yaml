measurement_rules:
  - id: reference_mass
    applies_to: "reference product and released lot"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report the accepted released seed on a declared as-received moisture basis. If the source record is a seed count, convert with measured thousand-seed weight or a transparent lot-specific count-to-mass record."
  - id: moisture_basis
    applies_to: "seed-bearing material, raw seed, conditioned seed, and released seed"
    required_property_ref:
      name: "Mass and moisture content"
      uuid: ""
    required_unit: "kg and %"
    rule: "Retain as-received mass, moisture measurement, and any dry or standard-moisture conversion. Do not mix wet extraction, drying, or packaging records on incompatible moisture bases."
  - id: field_to_lot_normalization
    applies_to: "field activities and harvest outputs"
    required_property_ref:
      name: "Area and mass"
      uuid: ""
    required_unit: "ha and kg"
    rule: "Normalize crop-cycle field totals by accepted released seed from the same species, variety or hybrid, geography, and production cycle before scaling to the 1 kg reference flow."
  - id: seed_quality_attributes
    applies_to: "released lot"
    required_property_ref:
      name: "Germination or viability, purity, and seed health"
      uuid: ""
    required_unit: "% or test-specific unit"
    rule: "Preserve the test method, sample date, lot identifier, and result for germination or viability, analytical purity, other-seed content, and health claims; do not replace a missing test with a generic category value."
  - id: treatment_basis
    applies_to: "treatment, coating, encrusting, or pelleting inputs"
    required_property_ref:
      name: "Product mass and active or carrier mass"
      uuid: ""
    required_unit: "kg product and kg active or carrier"
    rule: "Record the actual formulation, application rate, active ingredients or coating carrier, and treated seed mass separately; disclose whether treatment is included in the released product state."
process_map:
  - id: vegetable_seed_field_multiplication
    name: "Vegetable seed crop establishment and field multiplication"
    inclusion: "required"
    inclusion_condition: "always"
    role: "establish, isolate, manage, pollinate, and mature the declared vegetable seed crop"
    quantitative_reference: "crop-cycle field area, management inputs, and harvested seed-bearing material"
  - id: vegetable_seed_harvest_and_extraction
    name: "Vegetable seed harvest and seed extraction"
    inclusion: "required"
    inclusion_condition: "always"
    role: "harvest mature seed-bearing organs and separate seed from fruit, pod, capsule, inflorescence, or other carrier"
    quantitative_reference: "incoming harvested material, raw extracted seed, residues, water, energy, and wastewater"
  - id: vegetable_seed_conditioning_and_grading
    name: "Vegetable seed drying, cleaning, grading, and quality release"
    inclusion: "required"
    inclusion_condition: "always for a released lot; individual drying, wet-cleaning, or grading steps may be zero or not applicable when the lot route documents that state"
    role: "prepare raw seed for testing and release by moisture control, cleaning, grading, sampling, and quality checks"
    quantitative_reference: "raw seed input and conditioned seed output on a declared moisture basis"
  - id: vegetable_seed_treatment_packaging_and_storage
    name: "Vegetable seed treatment, packaging, storage, and release"
    inclusion: "conditional"
    inclusion_condition: "treatment, coating, pelleting, packaging, or pre-gate storage occurs before the declared release gate"
    role: "apply declared product treatment or physical enhancement and deliver a traceable released lot"
    quantitative_reference: "conditioned seed, treatment and packaging materials, storage energy, and released seed"
