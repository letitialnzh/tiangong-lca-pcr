allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "shared field and processing operations"
    rule: "Subdivide records by species, variety or hybrid, seed class, lot, route, and batch wherever measurement permits. Attribute inputs and outputs directly before using allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_marketable_co_products
    applies_to: "edible fruit, vegetable material, or other useful outputs from a seed crop"
    rule: "Treat a non-seed output as a co-product only when its quantity, quality, recipient, use, and hand-off are documented. If burdens cannot be subdivided, use a declared physical or economic allocation basis and disclose sensitivity."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_field_residue
    applies_to: "field residues and non-harvested biomass"
    rule: "Retained or incorporated residues remain part of the seed-crop foreground and are not credited as exported co-products. Removed material is separated into documented useful output, treatment, or waste fate."
    source_ids:
      - ipcc-2019-managed-soils-n2o
      - iso-14044-2006
  - rule_id: allocation_conditioning_and_packaging
    applies_to: "shared conditioning, treatment, packaging, storage, and testing equipment"
    rule: "Allocate shared meters, equipment, packaging service, and storage by measured seed mass, machine time, or documented service cycles. Do not allocate the full shared burden to a lot when matched batch data are available."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_failed_lots
    applies_to: "failed or diverted lots"
    rule: "Keep failed, reprocessed, diverted, and released seed as separate outputs. A reprocessed lot receives the burdens of the additional operation; a diverted lot receives no sowing-product credit unless its declared downstream use is established."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_seed_field_activity_records
      process_id: "vegetable_seed_field_multiplication"
      flow_role: "planting seed; nutrient or soil amendment; irrigation; field fuel; crop protection; land"
      record_type: "field log, input invoice, product label, application record, meter, or contractor record"
      raw_fields: "field_id; protected_or_open_route; area; species; variety_or_hybrid; seed_class; parent_role; input_product; amount; nutrient_basis; active_ingredient; date; operation; water_source; contractor_scope"
      collection_method: "reconcile physical inputs, field area, and operation records to each field and crop cycle"
      unit: "kg; kg nutrient; L; MJ; m3; ha"
      frequency: "every application or operation"
      temporal_coverage: "complete crop cycle"
      site_scope: "every represented field or protected unit"
      aggregation_rule: "sum by physical identity and field; calculate nutrient totals without merging products; normalize with same-cycle accepted released seed"
      quality_evidence: "dated logs; invoices; labels; calibrated meters; application records"
    - protocol_id: cp_seed_field_output_records
      process_id: "vegetable_seed_field_multiplication"
      flow_role: "harvested seed-bearing material; field residues"
      record_type: "weighbridge, yield monitor, harvest ticket, moisture test, residue record, or destination record"
      raw_fields: "field_id; harvest_date; seed_bearing_organ; maturity; harvested_mass; moisture; accepted_transfer_mass; residue_mass; residue_fate; co_product_destination"
      collection_method: "match harvest and residue records to field area, crop cycle, and extraction lot"
      unit: "kg; %; ha"
      frequency: "each harvest and residue transfer"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "sum each harvest and destination separately and close field-to-extraction transfer"
      quality_evidence: "scale or yield-monitor calibration; moisture tests; destination or sales records"
    - protocol_id: cp_seed_field_emission_activity
      process_id: "vegetable_seed_field_multiplication"
      flow_role: "nitrous oxide; ammonia; nitrate loss"
      record_type: "nutrient, soil, water, weather, residue, and emission-model record"
      raw_fields: "fertilizer_product; N_input; organic_N; residue_N; application_method; timing; soil; climate; drainage; runoff; factor_set; model_version"
      collection_method: "calculate each emission with one declared geographically applicable method and the same activity data used for nutrient accounting"
      unit: "kg N; kg emission; ha"
      frequency: "each event and crop-cycle calculation"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "calculate per field and pathway, then normalize with same-cycle accepted released seed"
      quality_evidence: "source records; factor provenance; model file; method review"
    - protocol_id: cp_harvest_extraction_records
      process_id: "vegetable_seed_harvest_and_extraction"
      flow_role: "harvested material; wet extraction water; extraction aids; electricity; raw seed; residue; wastewater; particulate"
      record_type: "batch ticket, scale, moisture test, water meter, formulation ledger, electricity meter, and destination record"
      raw_fields: "batch_id; source_field; seed_bearing_organ; incoming_mass; incoming_moisture; water; aid_product; electricity; recovered_seed; recovered_moisture; residue; wastewater; capture; destination"
      collection_method: "reconcile each extraction batch and distinguish dry, wet, fermentation, and mechanical routes"
      unit: "kg; %; m3; kg product; kWh"
      frequency: "each extraction batch"
      temporal_coverage: "all pre-conditioning extraction"
      site_scope: "all included equipment and batches"
      aggregation_rule: "close incoming mass to recovered seed, useful output, residue, wastewater, and measured losses on declared basis"
      quality_evidence: "calibrated scales and meters; moisture tests; formulation labels; destination and treatment records"
    - protocol_id: cp_conditioning_records
      process_id: "vegetable_seed_conditioning_and_grading"
      flow_role: "raw seed; electricity; heat; drying fuel; water; conditioned seed; screenings; wastewater; particulate"
      record_type: "batch ticket, scale, moisture and purity tests, meter, fuel record, and destination record"
      raw_fields: "batch_id; incoming_mass; incoming_moisture; electricity; heat; fuel; water; accepted_mass; accepted_moisture; grade; screenings; rejects; wastewater; capture; sample_mass"
      collection_method: "match conditioning inputs, outputs, quality tests, and meters to the same lot and batch"
      unit: "kg; %; kWh; MJ; L; m3"
      frequency: "each batch or meter period"
      temporal_coverage: "all pre-release conditioning"
      site_scope: "all included lines and batches"
      aggregation_rule: "sum matched batches and allocate shared meters by measured mass or verified machine time"
      quality_evidence: "calibrated scales, moisture and purity test records, meter reconciliation, destination evidence"
    - protocol_id: cp_treatment_packaging_records
      process_id: "vegetable_seed_treatment_packaging_and_storage"
      flow_role: "conditioned seed; treatment; coating or pelleting; packaging; electricity; released seed; failed lot; packaging waste; treatment particulate"
      record_type: "treatment log, formulation label, scale, packing ledger, warehouse record, electricity meter, quality certificate, and waste record"
      raw_fields: "lot_id; incoming_seed_mass; treatment_product; active; coating_material; dose; packaging_material; packaging_mass; reuse_cycles; electricity; storage_start; storage_end; released_mass; moisture; germination; purity; failed_mass; waste_mass; dust_capture; destination"
      collection_method: "reconcile each treatment, packaging, storage, and release batch; preserve lot identity and final quality status"
      unit: "kg; %; kWh; item; days"
      frequency: "each lot and release batch"
      temporal_coverage: "all included treatment, packaging, and pre-gate storage"
      site_scope: "all included lots and equipment"
      aggregation_rule: "sum by lot and material; allocate reusable packaging by documented service cycles; close incoming seed to released, failed, and losses"
      quality_evidence: "formulation and packaging labels; calibrated scales; quality certificates; warehouse logs; waste and take-back records"
  calculation_rules:
    - id: calc_field_to_reference_seed
      applies_to: "field inputs, land, residues, and emissions"
      rule: "Crop-cycle quantity / accepted released seed from the same cycle × 1 kg"
      inputs:
        - "field quantity"
        - area
        - "accepted released seed"
        - "moisture basis"
      output: "quantity per 1 kg released seed"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_product_basis
      applies_to: "fertilizer and soil-amendment input"
      rule: "Sum each product mass and calculate nutrient content from the declared product label or assay; preserve product and nutrient totals as separate fields"
      inputs:
        - "product mass"
        - "nutrient fraction or assay"
        - "reporting basis"
      output: "product mass and kg N, P, K, or organic matter by source"
      source_ids:
        - mass-balance-identity
    - id: calc_managed_soil_emissions
      applies_to: "nitrous oxide, ammonia, and nitrate loss"
      rule: "Apply the selected geographically applicable method to nutrient inputs, residue fate, application practice, soil, climate, drainage, and runoff; report method and factor version"
      inputs:
        - "field activity"
        - "soil and water data"
        - "residue fate"
        - factors
      output: "emission quantity by pathway and receiving medium"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calc_extraction_mass_balance
      applies_to: "extraction outputs"
      rule: "Incoming seed-bearing material = recovered raw seed + documented useful output + residue + wastewater-associated solids + measured losses on a common basis"
      inputs:
        - "incoming mass and moisture"
        - "output and loss records"
      output: "reconciled extraction outputs and difference"
      source_ids:
        - mass-balance-identity
    - id: calc_conditioning_mass_balance
      applies_to: "conditioning outputs"
      rule: "Incoming raw seed = accepted conditioned seed + screenings and rejects + moisture loss + measured other loss on a common moisture basis"
      inputs:
        - "incoming and accepted mass"
        - moisture
        - screenings
        - rejects
        - "loss records"
      output: "reconciled conditioning outputs and difference"
      source_ids:
        - mass-balance-identity
    - id: calc_treatment_and_packaging_mass
      applies_to: "treatment, coating, pelleting, and packaging"
      rule: "Keep incoming seed, added treatment or coating materials, final net seed, packaging, and waste as separate quantities; report whether additives are included in net product mass"
      inputs:
        - "lot ledger"
        - "formulation dose"
        - "packaging ledger"
        - "final mass"
      output: "treated or packaged lot mass and material inventory"
      source_ids:
        - mass-balance-identity
    - id: calc_reusable_packaging
      applies_to: "reusable pallets and crates"
      rule: "Packaging mass / documented service cycles, with return loss assigned to the applicable lots"
      inputs:
        - "packaging mass"
        - "service cycles"
        - loss
        - "lot mass"
      output: "allocated packaging service per released seed"
      source_ids:
        - iso-14044-2006
    - id: calc_reference_scaling
      applies_to: "terminal released seed"
      rule: "Scale all foreground quantities by 1 kg / measured accepted released seed, retaining moisture and quality qualifiers"
      inputs:
        - "accepted released seed"
        - "all normalized quantities"
      output: "one-kilogram reference-flow inventory"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_species_variety_identity
      applies_to: "reference flow, field lots, and all seed outputs"
      requirement: "Identify species, variety or hybrid, parent-line role, seed class, generation, intended sowing use, and seed-bearing organ; do not substitute food grain, beet seed, or another vegetable species."
      evidence: "lot records; variety or parent records; product description"
    - id: dq_lot_traceability
      applies_to: "all process transfers and released lots"
      requirement: "Retain a traceable lot identifier from field establishment through harvest, extraction, conditioning, treatment, packaging, testing, storage, and release or diversion."
      evidence: "field-to-lot ledger; batch tickets; certificates"
    - id: dq_moisture_and_mass_basis
      applies_to: "all mass flows and conversions"
      requirement: "Record calibrated mass measurement and moisture for seed-bearing material, raw seed, conditioned seed, and released seed; reconcile dry or standard-moisture conversions."
      evidence: "scale calibration; moisture tests; mass-balance worksheet"
    - id: dq_temporal_geographic_coverage
      applies_to: "field and facility records"
      requirement: "Use complete crop-cycle and pre-release batch records for the declared geography and technology; disclose proxy seasons, partial fields, contractor coverage, and storage duration."
      evidence: "dated field, batch, meter, and warehouse records"
    - id: dq_quality_release_evidence
      applies_to: "released, failed, and diverted lots"
      requirement: "Retain sampling, analytical purity, other-seed, germination or viability, health, treatment, and label evidence appropriate to the declared market or certification scheme."
      evidence: "ista-seed-testing-rules; eu-vegetable-seed-directive"
    - id: dq_completeness_and_fate
      applies_to: "all inputs, residues, screenings, wastewater, packaging, and failed lots"
      requirement: "Reconcile each material and energy input and every non-reference output to a documented destination; distinguish zero, not applicable, estimated, proxy, and missing values."
      evidence: "process records; destination evidence; mass-balance result"
    - id: dq_identity_resolution
      applies_to: "reference flow and all inventory rows"
      requirement: "Resolve every parameterized row and evidence gap physical exchange to a compatible verified UUID before final TIDAS process publication; keep coverage finding visible until then."
      evidence: "identity review record and Flow Set resolution"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Validation output must report accepted input, checks performed, checks skipped, findings, and completeness. An identity evidence gap, unexplained mass difference, missing lot-quality evidence, or inconclusive fate check remains a finding and is not converted to zero."
    source_ids: []
  - rule_id: validation_reference_output
    applies_to: "terminal released seed"
    rule: "Exactly one terminal vegetable-seed output equals 1 kg after scaling and declares species, variety or hybrid, seed class, moisture, purity, germination or viability, treatment, packaging, lot, and gate qualifiers."
    source_ids:
      - mass-balance-identity
      - eu-vegetable-seed-directive
  - rule_id: validation_seed_scope
    applies_to: "PCR identity and process map"
    rule: "Confirm that the record is vegetable seed for sowing and excludes beet seed, vegetative planting material, ornamental seed, food or feed products, and post-release crop production."
    source_ids:
      - eu-vegetable-seed-directive
  - rule_id: validation_field_cycle
    applies_to: "field multiplication"
    rule: "Confirm that inputs, area, isolation and pollination records, harvest, residues, and field emissions belong to the same species or variety or hybrid and crop cycle."
    source_ids:
      - fao-seed-systems
      - oecd-seed-schemes
  - rule_id: validation_extraction_balance
    applies_to: "harvest and extraction"
    rule: "Reconcile incoming seed-bearing material to raw extracted seed, useful outputs, residue, wastewater, and measured losses on a common moisture basis."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_conditioning_balance
    applies_to: "drying, cleaning, and grading"
    rule: "Reconcile raw seed to conditioned seed, screenings, rejects, moisture loss, wastewater, and particulate capture; explain any remaining difference."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_lot_quality
    applies_to: "sampling, tests, treatment, packaging, and release"
    rule: "Confirm homogeneous lot identity, sampling and test records, purity, germination or viability, health, treatment disclosure, packaging, sealing or label information, and declared net quantity appropriate to the selected market scheme."
    source_ids:
      - ista-seed-testing-rules
      - eu-vegetable-seed-directive
  - rule_id: validation_allocation_and_fate
    applies_to: "co-products, residues, failed lots, and waste"
    rule: "Confirm allocation basis, documented recipient or fate, treatment or discharge route, and no double counting of retained residues, reprocessed lots, shared energy, reusable packaging, or waste."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: validation_flow_identity
    applies_to: "every reference and inventory flow"
    rule: "Accept only exact verified UUIDs as fixed and applicable existing Flow Sets as parameterized; otherwise retain the row as unmapped coverage and prevent final dataset publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground vegetable seed production and released-lot dataset"
  downstream_use: "secondary_dataset; background_dataset after review, identity resolution, and publication"
  allowed_use: "LCA of vegetable seed lots, seed supply, and downstream vegetable production that preserves the declared species, variety or hybrid, seed class, geography, crop cycle, route, moisture, quality, treatment, packaging, allocation, and release gate"
  excluded_use: "Beet seed; vegetative planting material; ornamental seed; food or feed grain; edible vegetables; breeder or genebank research material; seed sowing or crop-production impacts after release; distribution or retail beyond the gate; and datasets with evidence gap product state, lot identity, quality evidence, or mass balance"
  required_metadata: "PCR id; CPC reference; species; variety or hybrid; parent-line role; seed class and generation; geography; field or protected route; crop-cycle dates; isolation and pollination practice; area; harvest and extraction route; yield; moisture; purity; germination or viability; health; treatment or coating; packaging; storage duration; residue and waste fates; allocation; Flow Set selections; collection coverage; and DQR"
  required_quality_disclosure: "field and facility coverage; measured versus calculated values; proxy and estimated fields; moisture and mass-balance results; sampling and lot-quality evidence; emission method; treatment and packaging records; allocation driverss; and range exceedances"
  update_trigger: "New reviewed seed-production or processing evidence; material route, species scope, treatment, packaging, storage, or gate change; revised emission or quality method; changed Flow Set or UUID identity; or representative records outside the provisional QA ranges"
