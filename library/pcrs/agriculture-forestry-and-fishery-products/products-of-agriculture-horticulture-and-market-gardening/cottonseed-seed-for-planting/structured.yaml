  - id: seed_cotton_harvest
    name: "Seed-cotton harvest"
    inclusion: "required"
    inclusion_condition: "Separate harvest operation and field-to-gin lot"
    role: "Capture seed cotton distinct from field growth; record field loss"
    quantitative_reference: "harvested kg and field area"
  - id: gin_separation
    name: "Ginning and primary conditioning"
    inclusion: "required"
    inclusion_condition: "On-farm or contracted gin before reference hand-off"
    role: "Separate lint and fuzzy seed as intended outputs; remove gin trash; batch production with run and changeover indexing"
    quantitative_reference: "seed-cotton input, lint, fuzzy seed, trash"
  - id: seed_delinting
    name: "Seed delinting / material treatment"
    inclusion: "conditional"
    inclusion_condition: "Mechanical, acid, or documented no-delinting route"
    role: "Remove residual lint; conditional chemical reaction with acid reactants only for acid route; alternative technology route changes reagent and waste inventory"
    quantitative_reference: "fuzzy seed, delinted seed, reagent and residues"
  - id: seed_grading
    name: "Cleaning and grading"
    inclusion: "required"
    inclusion_condition: "Seed-grade selection"
    role: "Separate accepted grade, rework, downgraded seed and waste"
    quantitative_reference: "incoming and outgoing grade masses"
  - id: seed_stabilization
    name: "Moisture stabilization and optional treatment"
    inclusion: "conditional"
    inclusion_condition: "Drying, cooling, storage or treatment before hand-off when performed"
    role: "Preserve viable seed state; record treatment materials"
    quantitative_reference: "incoming/outgoing seed, energy, treatment records"
  - id: seed_release
    name: "Accepted seed hand-off"
    inclusion: "required"
    inclusion_condition: "After testing and disposition"
    role: "Declare released seed mass and final market state"
    quantitative_reference: "accepted net kg and test results"
