      output: "kg N2O by pathway"
      source_ids:
        - ipcc-2019-soils-ch11
    - id: mix_average
      applies_to: "production mix"
      rule: "Sum route burden / sum unique accepted seed mass after route allocation."
      inputs:
        - "route burdens"
        - "accepted seed mass"
      output: "production mix per kg"
      source_ids: []
  data_quality_requirements:
    - id: identity
