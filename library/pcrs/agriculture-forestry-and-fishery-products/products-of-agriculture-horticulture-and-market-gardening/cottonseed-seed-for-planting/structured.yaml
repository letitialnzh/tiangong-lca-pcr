  calculation_rules:
    - id: normalized_input
      applies_to: "all foreground quantities"
      rule: "Quantity per kg = lot-attributed quantity / unique accepted seed kg."
      inputs:
        - "process quantity"
        - "accepted seed mass"
      output: "normalized amount"
      source_ids: []
    - id: dry_mass
      applies_to: "gin and conditioning outputs"
      rule: "Dry mass = as-received mass × (1 − measured moisture fraction); use same moisture convention for compared streams."
      inputs:
        - "as-received kg"
        - "measured moisture"
      output: "dry kg"
      source_ids: []
    - id: joint_share
      applies_to: "inseparable joint service"
      rule: "Output share = saleable output dry kg / sum saleable intended output dry kg; apply once to joint burden."
      inputs:
        - "saleable output dry masses"
        - "common service amount"
      output: "allocated burden"
