validation_rules:
  - rule_id: seed_identity
    applies_to: "reference output"
    rule: "Require verified flow UUID, net accepted kg, sowing purpose, cultivar/class, germination/purity evidence and declared moisture; reject oilseed or lint substitution."
    source_ids: []
  - rule_id: gate_completeness
    applies_to: "boundary"
    rule: "Verify every pre-handoff farm, gin, transporter and conditioner node or contracted service is included once; disclose the actual gate and ownership."
    source_ids: []
  - rule_id: mass_and_outputs
    applies_to: "gin and conditioner"
    rule: "Check seed cotton, lint, fuzzy seed, linters, accepted and downgraded seed, trash and waste disposition with moisture-compatible balance; accepted mass is unique."
    source_ids: []
  - rule_id: route_exclusivity
    applies_to: "production and treatment"
    rule: "Require irrigated/rainfed field evidence and one evidenced delinting route per lot; acid route requires reactant, neutralization and residue records; treatment status is explicit."
    source_ids: []
  - rule_id: batch_trace
    applies_to: "shared runs"
    rule: "Match meters, changeovers, cleaning and shared infrastructure to consuming lots and periods; each shared burden is assigned once."
    source_ids: []
  - rule_id: reject_resolution
    applies_to: "grading and release"
    rule: "Every off-grade mass has a rework, downgrade, recovery or disposal path; repeated passes do not create extra accepted mass."
    source_ids: []
  - rule_id: allocation_audit
    applies_to: "multi-output service"
    rule: "Require measured saleable output masses, allocation shares summing to one, direct burdens assigned first and economic sensitivity when prices exist; mark incomplete evidence inconclusive."
    source_ids: []
  - rule_id: soil_n2o_basis
    applies_to: "field emissions"
    rule: "Verify source-specific N inputs, regional factor source, direct/indirect separation and N2O-N conversion."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground planting-cottonseed production-mix dataset"
  downstream_use: "secondary_dataset; background_dataset for downstream seed supply, cotton farming process and lifecyclemodel projections"
  allowed_use: "Sowing-grade cleaned cottonseed with matching route, seed grade and declared hand-off."
  excluded_use: "Cotton lint, unprocessed seed cotton, oilseed cottonseed, cotton oil/meal, post-gate distribution or crop grown from released seed."
  required_metadata: "reference flow UUID and mass; cultivar/seed class; region and season; farm/gin/conditioner chain; irrigation, harvest, gin and delinting routes; treatment; moisture, purity and germination; output destinations and allocation shares."
  required_quality_disclosure: "Record coverage, subcontractor data gaps, tests and calibration, moisture correction, field-emission method, allocation and economic sensitivity, proxy data and uncertainty."
  update_trigger: "New seed standard or flow identity; changed route/gate; improved gin or conditioner records; changed regional field emission factors."
