allocation_rules:
  - rule_id: joint_gin_output
    applies_to: "gin separation"
    rule: "First separate physical subprocesses where meters and mass records allow. For inseparable ginning burdens jointly generating lint and fuzzy seed, use lot-specific dry-mass allocation among intentionally sold outputs; show masses and calculated shares. Gin trash receives a share only when documented as a saleable intended product; disposal waste does not. Preserve a sensitivity result using economic allocation when value data exist, because lint and seed have different economic functions."
    source_ids:
      - usda-ars-ginning-2015
  - rule_id: seed_grade_attr
    applies_to: "grading and conditioning"
    rule: "Keep planting seed, saleable non-planting cottonseed and saleable linters as distinct outputs. Attribute inseparable common conditioning burdens to saleable outputs by measured dry mass; direct delinting, grading, rework and treatment burdens to the lots that actually receive them. Disclose saleable output set and shares."
    source_ids:
      - usda-ams-acid-delinting
  - rule_id: reject_loop
    applies_to: "grading, stabilization and release"
    rule: "Rework mass and repeated energy remain linked to the producing lot until final disposition. A failed lot that becomes non-planting seed is a downgraded co-product; disposed material is waste and receives no output allocation. Never count a returned lot twice as accepted seed."
    source_ids:
      - usda-ams-acid-delinting
  - rule_id: shared_service
    applies_to: "farm, gin and conditioner"
    rule: "Attribute shared machinery, gin meters, ventilation, buildings and cleaning to documented consuming fields/lots and service periods; prefer measured machine hours or energy, then throughput only if operating conditions are comparable. Attribute each shared burden once."
    source_ids:
      - usda-ars-ginning-2015
  - rule_id: production_mix
    applies_to: "irrigated/rainfed fields and conditioning routes"
    rule: "Calculate each route separately through its own accepted seed mass, then mass-weight final results across accepted seed only. Keep mutually exclusive delinting routes and treatment states separate in inventory disclosure."
    source_ids:
      - usda-aphis-cotton-seed-2012
      - usda-ams-nop-5029
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "The dry-mass rule is this PCR's attribution decision for a common material-separation service; it is a modelling convention requiring explicit disclosure, not a claim that mass and economic functions are equivalent. Record as-received moisture and conversion basis. If output ownership or measurement is incomplete, mark allocation inconclusive instead of assigning all gin burdens to seed. [Sources: usda-ars-ginning-2015, usda-ams-acid-delinting]"
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "crop_management"
      flow_role: "planted seed, fertilizer, pesticides, irrigation and field fuel"
      record_type: "field ledger and invoices"
      raw_fields: "field ID; crop season; planted seed kg; product and nutrient kg; application dates; irrigation m3; pump energy; field area"
      collection_method: "supplier records, meters and application logs"
      unit: "kg, m3, MJ, ha"
      frequency: "each application"
      temporal_coverage: "one crop season"
      site_scope: "each seed field"
      aggregation_rule: "sum by field and allocate shared operation by actual area or machine time"
      quality_evidence: "dated invoices, calibration and irrigation meter evidence"
    - protocol_id: cp_soil_emissions
      process_id: "crop_management"
      flow_role: "managed-soil N inputs and emissions"
      record_type: "calculation worksheet"
      raw_fields: "mineral and organic N kg; crop residue N; soil/region; emission factors; irrigation status"
      collection_method: "field N ledger and declared IPCC or national method"
      unit: "kg N and kg N2O"
      frequency: "each season"
      temporal_coverage: "one crop season"
      site_scope: "each seed field"
      aggregation_rule: "calculate direct and indirect pathways separately; convert N2O-N to N2O once"
      quality_evidence: "factor source, assumptions and worksheet"
    - protocol_id: cp_harvest
      process_id: "seed_cotton_harvest"
      flow_role: "harvested seed cotton, losses and energy"
      record_type: "harvest log"
      raw_fields: "field ID; date; harvested seed-cotton kg; moisture; loss estimate; residue destination; fuel/energy"
      collection_method: "weighbridge, harvest logs and field checks"
      unit: "kg, MJ"
      frequency: "each harvest"
      temporal_coverage: "one crop season"
      site_scope: "each seed field"
      aggregation_rule: "sum matched harvested lots; reconcile to gin intake"
      quality_evidence: "scale tickets and fuel records"
    - protocol_id: cp_gin_balance
      process_id: "gin_separation"
      flow_role: "seed cotton, lint, fuzzy seed and trash"
      record_type: "gin batch ledger"
      raw_fields: "lot/run ID; source field; incoming kg/moisture; lint kg; fuzzy seed kg; trash kg; destinations"
      collection_method: "gin scales and output sale/transfer tickets"
      unit: "kg"
      frequency: "each gin run"
      temporal_coverage: "linked harvest/conditioning campaign"
      site_scope: "each gin and lot"
      aggregation_rule: "mass-balance each run, then aggregate traceable lots"
      quality_evidence: "scale calibration and sale records"
    - protocol_id: cp_delint_balance
      process_id: "seed_delinting"
      flow_role: "delinting route, reagents and residues"
      record_type: "conditioning batch ledger"
      raw_fields: "lot/run ID; mechanical/acid/bypass route; incoming fuzzy seed kg; acid/water/neutralizer kg; delinted seed kg; linters kg; effluent/waste kg"
      collection_method: "batch meter, chemical inventory and waste manifest"
      unit: "kg"
      frequency: "each conditioning run"
      temporal_coverage: "linked seed lot"
      site_scope: "each conditioner and lot"
      aggregation_rule: "reconcile dry-equivalent incoming/outgoing material and reagent inventory"
      quality_evidence: "chemical invoices, meter and waste records"
    - protocol_id: cp_shared_services
      process_id: "gin_separation"
      flow_role: "shared energy, cleaning and assets"
      record_type: "service meter log"
