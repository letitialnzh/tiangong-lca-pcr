allocation_rules:
  - rule_id: allocation_single_banana_cycle
    applies_to: "shared plantation, field, irrigation, machinery, and utility records"
    rule: "Attribute inputs and emissions to bananas using the recorded plantation unit, area, dates, crop cycle or production year, and marketable output; do not allocate to another crop or year without its own records."
    source_ids:
      - fao-banana-production-guide-2015
      - iso-14044-2006
  - rule_id: allocation_plantation_establishment
    applies_to: "establishment, replanting, ratoon renewal, and shared plantation burdens"
    rule: "Disclose plantation age and cycle number, then assign establishment or shared plantation burdens across the declared productive cycles using a documented attribution rule; do not silently assign all establishment burdens to one harvest year."
    source_ids:
      - fao-banana-production-guide-2015
      - iso-14044-2006
  - rule_id: allocation_residue_reject_fate
    applies_to: "field residue, harvest rejects, trim, recovered material, and wastewater"
    rule: "Do not assign a co-product credit to residue or rejects unless a documented recipient, quantity, quality basis, and intended use exist; otherwise retain the burden with banana production and report the fate."
    source_ids:
      - fao-banana-production-guide-2015
      - iso-14044-2006
  - rule_id: allocation_shared_conditioning
    applies_to: "shared harvest, conditioning, packing, and utilities"
    rule: "Allocate shared conditioning inputs by measured banana throughput, run time, or another documented physical relationship; disclose the allocation basis and reconcile it to gate output."
    source_ids:
      - globalgap-ifa-fruit-vegetables-v6
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "plantation_establishment"
      flow_role: "planting material and establishment inputs"
      record_type: "planting-material invoice, lot record, and plantation establishment log"
      raw_fields: "lot; material type; viable quantity; field or plantation unit; date; planting or regrowth status; product mass"
      collection_method: "retain supplier record and field establishment record; Raw aggregation and attribution: sum by campaign and normalize to marketable output"
      unit: "plant, sucker, corm, kg product, and kg nutrient"
      frequency: "each establishment or replanting campaign"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each field or plantation unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier lot trace, planting record, and cycle reconciliation"
    - protocol_id: cp_plantation_register
      process_id: "plantation_establishment_managed_banana_crop_cycle"
      flow_role: "area, crop dates, stand age, cycle number, and shared plantation attribution"
      record_type: "field, plantation-unit, and crop-cycle register"
      raw_fields: "area; unit; prior land use; planting or regrowth date; stand age; cycle number; crop dates; shared-use flag"
      collection_method: "verify register against field map and production records; Raw aggregation and attribution: calculate area-time and assign shared burdens with the declared rule"
      unit: "ha, m2, days, years, and crop-cycle identifier"
      frequency: "each crop cycle or production year"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each banana field, plantation unit, or smallholder site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "field map, production register, dates, and stand evidence"
    - protocol_id: cp_irrigation_records
      process_id: "managed_banana_crop_cycle"
      flow_role: "crop irrigation and water withdrawal"
      record_type: "meter, pump, controller, or water-balance record"
      raw_fields: "source; meter start and end; event date; area; method; rainfall adjustment; withdrawal and return flow"
      collection_method: "meter reading or documented water-balance calculation; Raw aggregation and attribution: sum delivered irrigation and withdrawal by cycle, year, and source"
      unit: "m3"
      frequency: "each event or meter period"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each banana field or plantation unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated meter or documented balance inputs"
    - protocol_id: cp_field_energy_records
      process_id: "managed_banana_crop_cycle"
      flow_role: "plantation fuel and electricity"
      record_type: "fuel invoice, equipment activity log, and electricity meter"
      raw_fields: "fuel or electricity; equipment; operation; field; date; allocation basis"
      collection_method: "supplier record plus equipment or meter log; Raw aggregation and attribution: allocate shared operations by area, hours, throughput, or declared physical basis"
      unit: "L, MJ, or kWh"
      frequency: "each refuelling, operation, or meter period"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each banana field or plantation unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, equipment log, meter record, and allocation calculation"
    - protocol_id: cp_nutrient_records
      process_id: "managed_banana_crop_cycle"
      flow_role: "nutrient and soil-amendment inputs"
      record_type: "nutrient plan, supplier invoice, and application log"
      raw_fields: "product; material description; nutrient concentration; date; area; quantity; method; soil or tissue test"
      collection_method: "reconcile product records with field application records; Raw aggregation and attribution: sum product and nutrient mass by cycle or year and declared basis"
      unit: "kg product and kg nutrient"
      frequency: "each application"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each banana field or plantation unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "label or supplier specification, soil or tissue evidence, and application log"
    - protocol_id: cp_crop_protection_records
      process_id: "managed_banana_crop_cycle"
      flow_role: "crop-protection products and biosecurity actions"
      record_type: "treatment log, supplier record, and site hygiene register"
      raw_fields: "product; active ingredient; rate; area; date; target; equipment; hygiene action; site"
      collection_method: "record each application and relevant hygiene or biosecurity action; Raw aggregation and attribution: sum by product, active ingredient, action, and cycle or year"
      unit: "kg product, kg active ingredient, and declared action count"
      frequency: "each application or action"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each banana field or plantation unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "application log, product label, and site record"
    - protocol_id: cp_residue_and_reject_records
      process_id: "managed_banana_crop_cycle_banana_harvest_and_conditioning_banana_residue_and_reject_routing"
      flow_role: "field residue, rejects, trim, recovered material, and wastewater fate"
      record_type: "residue, reject, treatment, recovery, and destination record"
      raw_fields: "source stream; field or batch; date; wet or dry mass; volume; destination; recipient; quality basis"
      collection_method: "weigh or meter each stream and retain destination evidence; Raw aggregation and attribution: reconcile each source stream to recovered product, residual waste, treatment, or downstream transfer"
      unit: "kg wet, kg dry, and m3"
      frequency: "each harvest lot, treatment batch, or routing event"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each field, plantation unit, preparation line, or treatment route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale or meter record, recipient record, and treatment or disposal receipt"
    - protocol_id: cp_harvest_records
      process_id: "managed_banana_crop_cycle_banana_harvest_and_conditioning"
      flow_role: "harvest and crop-cycle output"
      record_type: "harvest ticket, bunch or lot register, and scale record"
      raw_fields: "field; bunch or lot; date; gross mass; marketable mass; maturity; grade; reject; destination"
      collection_method: "weigh each harvest lot or use documented lot reconciliation; Raw aggregation and attribution: sum gross harvest, marketable output, rejects, and losses by cycle or year"
      unit: "kg wet bananas"
      frequency: "each harvest lot or campaign"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each banana field or plantation unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, lot ticket, and grade record"
    - protocol_id: cp_postharvest_records
      process_id: "banana_harvest_and_conditioning"
      flow_role: "washing, wastewater, rejects, and batch conditioning"
      record_type: "conditioning batch and utility records"
      raw_fields: "received mass; wash water; discharge; trim; packaging; batch; date; fate; gate state"
      collection_method: "batch record plus meter and packaging allocation; Raw aggregation and attribution: aggregate by batch and normalize to marketable gate output"
      unit: "kg, m3, kWh, and packaging units"
      frequency: "each batch or meter period"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each preparation line or pack-house"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter record, batch sheet, and waste or treatment receipt"
    - protocol_id: cp_postharvest_energy_records
      process_id: "banana_harvest_and_conditioning"
      flow_role: "cooling, grading, washing, and packing electricity or fuel"
      record_type: "electricity meter, fuel record, and throughput record"
      raw_fields: "meter period; line; kWh or fuel; throughput; cooling duration; batch"
      collection_method: "meter or fuel allocation by throughput or run time; Raw aggregation and attribution: allocate shared utility by throughput or run time and reconcile to batch output"
      unit: "kWh, MJ, or L"
      frequency: "each meter period or batch"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each in-scope preparation line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter data, fuel record, and allocation calculation"
    - protocol_id: cp_packaging_records
      process_id: "banana_harvest_and_conditioning"
      flow_role: "primary packaging"
      record_type: "packaging specification, bill of materials, and count record"
      raw_fields: "material; unit mass; units; reuse status; batch; output mass"
      collection_method: "packaging count and specification reconciliation; Raw aggregation and attribution: sum packaging material per gate output and disclose reuse"
      unit: "kg material and packaging units"
      frequency: "each packaging lot or batch"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each preparation line or pack-house"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier specification, count sheet, and reuse declaration"
    - protocol_id: cp_gate_output_records
      process_id: "banana_harvest_and_conditioning"
      flow_role: "marketable output and final rejects"
      record_type: "dispatch scale, lot record, and reject record"
      raw_fields: "lot; date; gate; packed mass; maturity; grade; reject; destination; gate state"
      collection_method: "final scale and lot reconciliation; Raw aggregation and attribution: sum marketable output and final reject streams; normalize to 1,000 kg"
      unit: "kg wet bananas"
      frequency: "each dispatch lot"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "declared gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale or lot record and grade record"
  calculation_rules:
    - id: calc_nutrient_mass
      applies_to: "fertilizer, manure, compost, mulch, and amendment rows"
      rule: "Product mass multiplied by the documented nutrient fraction; retain original product mass and nutrient basis."
      inputs:
        - "product invoice"
        - "nutrient concentration"
        - "application record"
      output: "kg N, kg P2O5, or kg K2O by cycle or year"
      source_ids:
        - fao-banana-production-guide-2015
    - id: calc_cycle_normalization
      applies_to: "all crop-cycle and production-year inputs"
      rule: "Crop-cycle or production-year quantity divided by marketable fresh banana mass and multiplied by 1,000 kg."
      inputs:
        - "input record"
        - "marketable gate output"
      output: "normalized quantity per 1,000 kg output"
      source_ids: []
    - id: calc_plantation_attribution
      applies_to: "plantation establishment, replanting, ratoon renewal, and shared plantation inputs"
      rule: "Apply the documented stand-age, cycle-number, or production-year attribution rule to shared plantation inputs, then reconcile each cycle or year to its marketable output."
      inputs:
        - "plantation register"
        - dates
        - "input records"
        - "cycle output"
      output: "crop-cycle or production-year quantity"
      source_ids:
        - fao-banana-production-guide-2015
        - iso-14044-2006
    - id: calc_area_time
      applies_to: "plantation land occupation"
      rule: "Plantation or field area multiplied by the represented occupation period; disclose prior land use and any excluded land transformation."
      inputs:
        - "plantation register"
        - "crop or production dates"
      output: "area-time quantity"
      source_ids:
        - fao-banana-production-guide-2015
    - id: calc_nitrogen_emission
      applies_to: "direct soil nitrous oxide and nutrient-loss rows"
      rule: "Apply the selected IPCC-compatible factor or site method to eligible nutrient inputs and declared residue fate; document factors and whether the result is reported as substance or element mass."
      inputs:
        - "nutrient records"
        - "residue records"
        - "method choice"
        - "soil or climate parameters"
      output: "kg substance emitted"
      source_ids:
        - ipcc-2019-refinement-afolu
    - id: calc_gate_mass_balance
      applies_to: "harvest, conditioning, and gate preparation"
      rule: "Received harvest mass equals marketable gate output plus rejects, residue, wastewater-related solids, recovered product, and documented handling loss within measurement uncertainty."
      inputs:
        - "harvest tickets"
        - "conditioning records"
        - dispatch
        - routing
        - "and reject records"
      output: "reconciled mass balance"
      source_ids:
        - fao-banana-production-guide-2015
    - id: calc_routing_balance
      applies_to: "residue and reject routing"
      rule: "Routed stream equals recovered product plus residual waste, treated wastewater, measured emissions basis, and any documented downstream transfer; do not credit an unverified destination."
      inputs:
        - "routed input"
        - "recovery record"
        - "treatment record"
        - "downstream receipt"
      output: "routing balance"
      source_ids:
        - fao-banana-production-guide-2015
        - iso-14044-2006
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all flow and product records"
      requirement: "Declare banana form, cultivar or variety group, plantation or smallholder route, establishment or ratoon status, stand age or cycle number, gate, maturity, grade, wash or cooling state, packaging state, and residue or reject fate; resolve platform identities during foreground dataset construction where required."
      evidence: "lot record, product description, and reference-flow qualifiers"
    - id: quality_measurement
      applies_to: "inputs and outputs"
      requirement: "Prefer calibrated meters, scales, supplier invoices, nutrient plans, application logs, and treatment receipts; document estimation and allocation methods where direct measurement is unavailable."
      evidence: "meter calibration, scale record, invoice, receipt, or calculation sheet"
    - id: quality_temporal
      applies_to: "crop-cycle or production-year inventory"
      requirement: "Cover the full represented establishment or ratoon renewal, active management, harvest campaign, conditioning, routing, and gate hand-off period."
      evidence: "plantation register, application log, irrigation records, harvest tickets, batch sheets, and dispatch records"
    - id: quality_completeness
      applies_to: "crop-cycle or production-year balance"
      requirement: "Reconcile planting material, nutrients, irrigation, energy, crop protection, gross harvest, marketable output, field residue, rejects, wastewater, packaging, and routing streams."
      evidence: "crop-cycle or production-year input and mass reconciliation"
    - id: quality_disclosure
      applies_to: "dataset metadata"
      requirement: "Disclose annual or ratoon route, stand age or cycle number, irrigation source, nutrient basis, crop-protection products, harvest lots, washing, cooling, packaging, gate, and residue or reject destination."
      evidence: "dataset metadata and supporting records"
validation_rules:
  - rule_id: validate_reference_output
    applies_to: "reference flow and gate output"
    rule: "The declared reference output must be marketable fresh, unprocessed bananas at the declared gate and use mass in kg; processed banana products, retail products, and unqualified Musa products are outside this PCR."
    source_ids:
      - fao-banana-production-guide-2015
  - rule_id: validate_cycle_dates
    applies_to: "establishment, management, harvest, routing, and gate preparation"
    rule: "Establishment or ratoon renewal, applications, irrigation, harvest lots, conditioning, routing, and gate output must fall within the declared crop cycle or production year or be explicitly attributed to it."
    source_ids:
      - fao-banana-production-guide-2015
      - globalgap-ifa-fruit-vegetables-v6
  - rule_id: validate_nutrient_basis
    applies_to: "nutrient inputs and emissions"
    rule: "Product mass, nutrient concentration, nutrient basis, residue treatment, and emission calculation method must be present and internally consistent; do not count product mass and nutrient mass as the same exchange."
    source_ids:
      - fao-banana-production-guide-2015
      - ipcc-2019-refinement-afolu
  - rule_id: validate_mass_balance
    applies_to: "harvest, conditioning, and routing"
    rule: "Gross harvest and received mass must reconcile with marketable output, rejects, residue, wastewater-related solids, recovered product, downstream transfers, and losses within the declared measurement uncertainty."
    source_ids:
      - fao-banana-production-guide-2015
  - rule_id: validate_flow_identity_resolution
    applies_to: "parameterized rows"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_qualifiers
    applies_to: "reference flow and dataset metadata"
    rule: "Required qualifiers must be present, including cultivar or variety group, establishment or ratoon status, stand age or cycle number, harvest lots, maturity and grade, gate, washing, cooling, packaging, and residue, reject, and wastewater fate."
    source_ids:
      - fao-banana-production-guide-2015
      - globalgap-ifa-fruit-vegetables-v6
published_dataset_profile:
  dataset_role: "foreground agricultural production dataset for fresh bananas at a farm-gate or pack-house gate"
  downstream_use: "secondary_dataset for fresh-banana product systems; background_dataset only when the provider explicitly publishes a representative regional or market-average dataset with the required metadata"
  allowed_use: "Comparative product studies, plantation or crop-cycle inventory modelling, farm improvement, and declared fresh-banana supply-chain assessments within the stated geography and product state"
  excluded_use: "Planting-material production, plantain or other Musa substitution without disclosure, dried, frozen, cooked, canned, retail, consumption, or downstream logistics after the declared gate; do not extrapolate across plantation ages, ratoon cycles, or conditioning routes without scenario disclosure"
  required_metadata: "product form; cultivar or variety group; plantation or smallholder route; establishment or ratoon status; stand age or cycle number; geography; dates or production year; harvest lots; declared gate; yield; irrigation source and quantity; nutrient basis; crop-protection program; washing and cooling; packaging; residue, reject, and wastewater fate"
  required_quality_disclosure: "temporal coverage, site scope, measurement versus calculated values, plantation-cycle attribution and allocation rules, mass-balance and routing results, platform identity resolution status, and all provisional estimates requiring replacement by foreground records"
  update_trigger: "change in cultivar or route, plantation age or cycle, irrigation method, nutrient program, crop-protection program, harvest form, wash or cooling line, packaging format, gate definition, residue or reject destination, or evidence that changes material quantities or boundary rules"
