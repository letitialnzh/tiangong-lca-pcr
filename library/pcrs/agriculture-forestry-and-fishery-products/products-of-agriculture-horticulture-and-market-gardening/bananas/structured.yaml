          description: "Record wastewater leaving an included treatment route and distinguish it from untreated conditioning wastewater transferred to a downstream service. Raw activity or stage basis: per 1,000 kg marketable fresh bananas at the declared gate."
          amount:
            expression: "Use treatment records or water balance and disclose whether the treated stream leaves to a downstream service, is reused, or is discharged within the boundary."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per declared reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_residue_and_reject_records
              source_ids:
                - fao-banana-production-guide-2015
            ranges: []
      elementary:
        - row_id: routing_treatment_emissions
          role: "Emissions from included residue or wastewater treatment"
          name: "Emissions from included banana residue or wastewater treatment"
          flow_type: "elementary"
          property_unit: "Mass / kg substance"
          description: "Record or calculate emissions from an included treatment route only when the route, method, and measured or documented inputs support the emission pathway. Raw activity or stage basis: per 1,000 kg marketable fresh bananas at the declared gate."
          amount:
            expression: "Apply the declared treatment method and documented factor or measurement; do not infer treatment emissions when the route is transferred to a separate downstream dataset."
            value_mode: "calculated_value"
            specificity: "technology_specific"
            basis:
              text: "per declared reference flow"
