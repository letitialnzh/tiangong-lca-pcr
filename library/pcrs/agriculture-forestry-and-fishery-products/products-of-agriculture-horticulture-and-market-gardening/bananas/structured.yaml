system_boundary:
  rules:
    - rule_id: boundary_banana_cycle
      applies_to: "establishment, ratoon renewal, and managed crop cycle"
      rule: "Include plantation establishment or declared ratoon-cycle renewal, crop management, irrigation, nutrient and crop-protection applications, harvest preparation, and the crop-cycle inputs that produce the declared fresh banana output; disclose prior land use and exclude unrelated infrastructure construction."
      source_ids:
        - fao-banana-production-guide-2015
        - fao-banana-production-manual
    - rule_id: boundary_gate_conditioning
      applies_to: "harvest, grading, and primary conditioning"
      rule: "End the foreground system at the declared farm-gate or pack-house gate and include cutting, bunch handling, dehanding, grading, optional washing, cooling, and primary packing when they occur before that gate."
      source_ids:
        - fao-banana-production-guide-2015
        - globalgap-ifa-fruit-vegetables-v6
    - rule_id: boundary_managed_soil_and_residue
      applies_to: "nutrients, managed soil, field residue, and reject fate"
      rule: "Estimate applicable direct and indirect soil or residue emissions using one declared method and the recorded nutrient inputs and residue fate; do not double count a nitrogen pathway or treat unsubstantiated residue use as a co-product credit."
      source_ids:
        - ipcc-2019-refinement-afolu
        - fao-banana-production-guide-2015
    - rule_id: boundary_biosecurity_records
      applies_to: "planting material, field operations, and plantation hygiene"
      rule: "Record the source and status of planting material and relevant plantation hygiene or biosecurity controls when they affect the represented crop cycle; keep treatment records within the same declared site scope."
      source_ids:
        - globalgap-tr4-banana-biosecurity
boundary_abstraction:
  declared_starting_condition: "Prepared plantation unit or field receiving banana planting material or entering a declared ratoon cycle, with prior land use and excluded infrastructure work disclosed"
  starting_condition_role: "Start of the declared establishment, annual production year, or ratoon crop cycle accounting"
  product_classification_scope: "Fresh bananas under CPC 3.0:01312 through the declared farm-gate or pack-house gate"
  recursive_input_rule: "Purchased banana planting material is an upstream product input linked once; its own nursery, tissue-culture, sucker, or corm production is outside this PCR unless a separate upstream dataset is supplied. A banana product used as an input to another banana production unit is not recursively expanded without explicit upstream evidence."
  upstream_dataset_requirement: "Require upstream datasets for planting material, fertilizers and amendments, crop-protection products, irrigation water, electricity, fuel, packaging, and purchased transport or treatment services when used."
  disclosure: "Declare geography, plantation or smallholder route, cultivar or variety group, establishment or ratoon status, stand age or cycle number, crop dates, irrigation source and method, nutrient and crop-protection program, harvest lots, declared gate, yield and reject reconciliation, washing and cooling, packaging, residue and wastewater fate, and any shared plantation allocation."
