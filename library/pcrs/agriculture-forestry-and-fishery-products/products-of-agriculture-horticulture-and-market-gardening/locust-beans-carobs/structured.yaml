allocation_rules:
  - rule_id: allocation_single_intended_pod_output
    applies_to: "a process with one deliberately transferred whole-pod product output"
    rule: "Assign the process burdens to the single intended whole-pod output. Treat field loss, rejects, and residues as waste only when their destination is not a deliberately transferred product."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_quality_destination_outputs
    applies_to: "conditioning with accepted and downgraded or alternate-destination whole-pod outputs"
    rule: "First subdivide the route when grade-specific operations are independently measured. If common burdens remain shared, allocate them between deliberately transferred whole-pod outputs using mass allocation because the outputs retain the same whole-pod physical identity; use documented economic allocation only when a product-specific study demonstrates that mass does not represent the causal relationship. Report output masses, grade, destination, reference period, and factors."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rejects_not_products
    applies_to: "field losses, harvest rejects, and conditioning rejects"
    rule: "Do not allocate burdens to a rejected or residue stream merely because it has a possible downstream use. Reclassify it as an intended co-product only when it is deliberately transferred with a declared destination and identity, then apply allocation_quality_destination_outputs or a separately justified method."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_perennial_establishment_and_replacement
    applies_to: "planting, establishment, replacement, and immature-tree activity"
    rule: "Annualize attributable events over the documented productive period and assign the annualized amount to the crop-year output basis. Retain original event mass, date, block, and assumption for audit."
    source_ids:
      - fao-feedipedia-carob
      - carob-macronutrients-water-2005
      - iso-14044-2006
  - rule_id: allocation_period_and_phase_linkage
    applies_to: "multiple crop years, bearing phases, and replacement events"
    rule: "Link every input, output, establishment event, replacement event, and allocation factor to a declared crop year or life-cycle phase. Never attribute one event to two reporting periods without an explicit reconciliation."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_carob_orchard_lifecycle_records
      process_id: "carob_orchard_production"
      flow_role: "planting stock, tree replacement, orchard area, nutrients, soil amendments, crop protection, fuel, electricity, residues, and orchard activities"
      record_type: "orchard register, block map, planting or replacement invoices, application logs, supplier records, equipment logs, and residue destination records"
      raw_fields: "block_id; species; cultivar_or_type; tree_age; bearing_area_ha; establishment_year; replacement_event; planting_material_quantity; product_name; product_mass; nutrient_basis; application_date; target; fuel; electricity; residue_mass; residue_destination; crop_year"
      collection_method: "collect event records by block and reconcile with supplier, operator, and equipment records"
      unit: "mixed activity-specific units"
      frequency: "each planting, replacement, application, energy event, and residue event; reconciled each crop year"
      temporal_coverage: "one declared crop year plus productive-period records for annualization"
      site_scope: "each managed orchard or cultivated-grove block"
      aggregation_rule: "sum by block and crop year; retain product and nutrient fields before normalization; link annualized events to the declared output basis"
      quality_evidence: "invoices, field logs, orchard register, operator confirmation, and completeness reconciliation"
    - protocol_id: cp_carob_irrigation_records
      process_id: "carob_orchard_production"
      flow_role: "irrigation water, direct water withdrawal, and pumping energy"
      record_type: "meter logs, pump records, electricity bills, water bills, permits, source records, and documented water balances"
      raw_fields: "block_id; source_type; rainfed_flag; meter_start; meter_end; irrigation_date; delivered_volume_m3; withdrawal_volume_m3; pump_kwh; source_quality; crop_year"
      collection_method: "read meters or reconcile invoices and source records to irrigation events and block area"
      unit: "m3 and kWh"
      frequency: "each irrigation event or billing period; reconciled each crop year"
      temporal_coverage: "one declared crop year and irrigation season"
      site_scope: "each source and orchard block"
      aggregation_rule: "sum by source, block, and crop year; prevent double counting delivered supply and direct withdrawal"
      quality_evidence: "meter or invoice evidence, permit or source checks, and water-balance reconciliation"
    - protocol_id: cp_carob_harvest_lot_records
      process_id: "carob_harvest_and_collection"
      flow_role: "harvestable pods, collected raw pods, harvest energy, field loss, and harvest rejects"
      record_type: "harvest log, scale ticket, block record, contractor statement, lot record, and destination record"
      raw_fields: "block_id; harvest_date; lot_id; harvest_method; harvestable_mass_kg; collected_mass_kg; field_loss_mass_kg; damaged_mass_kg; destination; fuel_quantity; electricity; crop_year"
      collection_method: "weigh or reconcile each harvest lot and record the removal and collection method"
      unit: "kg pods and activity-specific energy unit"
      frequency: "every harvest lot; reconciled each campaign"
      temporal_coverage: "one harvest campaign and crop year"
      site_scope: "each managed block and receiving lot"
      aggregation_rule: "sum harvestable, collected, lost, and rejected masses by block and lot before normalization"
      quality_evidence: "calibrated scale or verified ticket, lot traceability, contractor evidence, destination evidence, and mass-balance check"
    - protocol_id: cp_carob_conditioning_records
      process_id: "carob_primary_conditioning"
      flow_role: "incoming raw pods, drying, cleaning, sorting, grading, process water, accepted pods, downgraded pods, rejects, and water loss"
      record_type: "intake ticket, conditioning batch record, moisture test, energy meter, water meter, grade record, reject record, and destination record"
      raw_fields: "campaign_id; lot_id; input_mass_kg; input_moisture; drying_method; drying_start; drying_end; fuel; electricity; process_water_m3; cleaning_method; grade; accepted_mass_kg; downgraded_mass_kg; reject_mass_kg; reject_class; reject_destination; output_moisture; container_tare; gate"
      collection_method: "record each conditioning batch and reconcile moisture, mass, grade, energy, water, and destination records"
      unit: "kg, percent, m3, kWh, L, or MJ as recorded"
      frequency: "each conditioning batch; reconciled each campaign"
      temporal_coverage: "one declared conditioning campaign and gate"
      site_scope: "each batch, lot, and declared receiving facility"
      aggregation_rule: "sum by lot and grade; preserve incoming and output moisture and tare; calculate water loss only after mass and moisture reconciliation"
      quality_evidence: "calibrated scale, moisture method, meter records, buyer or grade specification, destination evidence, and batch balance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all crop-year, harvest, and conditioning rows"
      rule: "reference-normalized amount = measured or calculated amount x 1 kg / accepted whole-pod mass in kg; reporting tables may scale this to 1,000 kg by multiplying by 1,000"
      inputs:
        - accepted_whole_pod_mass_kg
        - process_amount
      output: "amount per 1 kg or per 1,000 kg accepted whole carob pods"
      source_ids:
        - iso-14044-2006
    - id: calc_orchard_life_annualization
      applies_to: "establishment, replacement, and immature-tree inputs"
      rule: "annualized event amount = documented event amount / declared productive-period allocation basis; link the annualized amount to the crop year and accepted output basis"
      inputs:
        - event_amount
        - productive_period
        - crop_year_link
        - accepted_output_mass
      output: "annualized perennial input amount"
      source_ids:
        - fao-feedipedia-carob
        - carob-macronutrients-water-2005
        - iso-14044-2006
    - id: calc_moisture_mass_conversion
      applies_to: "harvested, dried, accepted, downgraded, and rejected pod masses"
      rule: "dry matter = as_received_mass x (1 - moisture_fraction); water mass = as_received_mass x moisture_fraction; use only measured or declared moisture for the relevant lot"
      inputs:
        - as_received_mass
        - moisture_fraction
        - sampling_method
      output: "dry-matter mass and water mass by lot"
      source_ids:
        - carob-drying-characteristics-2016
        - carob-nutritional-characterization-2018
    - id: calc_nutrient_product_to_basis
      applies_to: "fertilizer and soil-amendment inputs"
      rule: "nutrient amount = actual product mass x documented nutrient fraction; retain product name, product mass, nutrient basis, and application event"
      inputs:
        - product_mass
        - documented_nutrient_fraction
        - nutrient_basis
      output: "product and nutrient-basis amounts"
      source_ids:
        - carob-macronutrients-water-2005
    - id: calc_water_energy_reconciliation
      applies_to: "irrigation, direct withdrawal, pumping, harvest, and conditioning energy"
      rule: "reconcile meters, invoices, contractor records, and equipment calculations by block or batch; do not sum duplicate records for the same activity"
      inputs:
        - meter_records
        - invoices
        - source_records
        - equipment_calculation
      output: "reconciled water and energy totals"
      source_ids:
        - carob-macronutrients-water-2005
    - id: calc_soil_emissions
      applies_to: "nutrient-related air, soil, and water elementary outputs"
      rule: "apply the selected geographically applicable method tier to declared nutrient, amendment, residue, soil, climate, and water activity data; disclose tier and factors"
      inputs:
        - nutrient_inputs
        - amendments
        - residues
        - soil_parameters
        - climate_parameters
        - water_records
      output: "method-calculated emission amounts"
      source_ids:
        - ipcc-2019-refinement-vol-4
    - id: calc_conditioning_mass_balance
      applies_to: "harvest and primary conditioning outputs"
      rule: "residual_mass = input_mass - accepted_mass - downgraded_mass - declared reject_mass - other evidenced destination masses; residuals may not be silently assigned to accepted product"
      inputs:
        - input_mass
        - output_masses
        - reject_masses
        - destination_masses
      output: "reconciled losses and residuals"
      source_ids:
        - iso-14044-2006
    - id: calc_shared_grade_allocation
      applies_to: "shared conditioning burdens with two or more intended whole-pod outputs"
      rule: "mass allocation factor for grade i = grade i accepted mass / sum of deliberately transferred whole-pod output masses, unless a documented physical subdivision or justified economic method applies"
      inputs:
        - grade_output_masses
        - method_decision
      output: "grade-specific allocated burdens and factors"
      source_ids:
        - iso-14044-2006
    - id: calc_drying_water_vapour
      applies_to: "drying within primary conditioning"
      rule: "water vapour = incoming water mass - accepted output water mass - downgraded output water mass - reject water mass + measured process-water addition, with negative results investigated rather than clipped"
      inputs:
        - incoming_mass
        - incoming_moisture
        - output_masses
        - output_moistures
        - process_water
      output: "water-vapour amount to declared receiving medium"
      source_ids:
        - carob-drying-characteristics-2016
  data_quality_requirements:
    - id: dq_identity_and_qualifiers
      applies_to: "reference flow, product outputs, planting stock, nutrient products, crop protection, and elementary outputs"
      requirement: "Declare species, cultivar or type, managed production status, geography, gate, product state, seed-retention status, and identity evidence. Resolve all emitted identities before final TIDAS publication."
      evidence: "dataset metadata, lot records, product documents, and identity review"
    - id: dq_period_and_phase_linkage
      applies_to: "perennial orchard production"
      requirement: "Link crop year, orchard age, bearing phase, establishment, replacement, and termination or abandonment events to the output period; unresolved attribution prevents finalization."
      evidence: "orchard register, block history, productive-period assumption, and annualization worksheet"
    - id: dq_mass_reconciliation
      applies_to: "harvest and primary conditioning"
      requirement: "Harvestable, collected, accepted, downgraded, rejected, field-loss, and water-loss masses must reconcile within documented measurement uncertainty."
      evidence: "scale tickets, moisture tests, batch records, destination records, and reconciliation worksheet"
    - id: dq_nutrient_basis_traceability
      applies_to: "fertilizer and soil-amendment inputs and related emissions"
      requirement: "Reconcile actual product, product mass, declared nutrient or amendment basis, application event, and emission method inputs. Missing product evidence cannot be replaced by a generic default."
      evidence: "supplier label or specification, invoice, application log, and calculation sheet"
    - id: dq_activity_completeness
      applies_to: "orchard, harvest, and conditioning activities"
      requirement: "Cover every declared block, harvest lot, and conditioning batch. A rainfed, manual, or no-water condition must be recorded as a justified zero with route evidence."
      evidence: "block register, operator confirmation, meter or invoice records, and campaign reconciliation"
    - id: dq_moisture_and_quality
      applies_to: "accepted and downgraded whole-pod outputs"
      requirement: "Report measurement method, sample point, moisture convention, grade or destination, seed-retention status, and buyer or local specification. Values outside the screening range require explanation, not automatic rejection."
      evidence: "moisture test, grade specification, lot record, and QA review"
    - id: dq_flow_set_and_uuid_resolution
      applies_to: "all parameterized or unresolved identity rows"
      requirement: "Before final process publication, resolve parameterized Flow Set rows and unmapped identities to compatible concrete flow, property, unit-group, direction, flow-type, geography, and provider or use evidence."
      evidence: "identity resolution record, Flow Set group decision, and final process review"
    - id: dq_boundary_and_fate_disclosure
      applies_to: "complete foreground dataset"
      requirement: "Disclose the declared gate, excluded downstream processing, wild-collection exclusion, conditioning route, reject and residue fate, packaging status, and any route extension."
      evidence: "boundary declaration, process notes, destination records, and downstream-use statement"
validation_rules:
  - rule_id: validation_reference_identity_and_state
    applies_to: "reference flow and terminal product output"
    rule: "Confirm that the terminal output is a whole ripe carob pod with pulp and seeds retained, expressed as net kg at the declared gate. A separated seed, pulp, gum, flour, or processed product must fail this PCR identity check."
    source_ids:
      - fao-feedipedia-carob
      - carob-drying-characteristics-2016
  - rule_id: validation_process_and_module_coverage
    applies_to: "process map and inventory"
    rule: "Confirm that managed production, independent harvest and collection, and the applicable primary-conditioning node are represented. Check the selected grading and multi-output obligations for incoming state, every intended output hand-off, and explicit reject or waste states."
    source_ids:
      - fao-feedipedia-carob
      - fao-carob-nwfp-chapter7
  - rule_id: validation_period_and_phase_linkage
    applies_to: "perennial production and allocation"
    rule: "Confirm that every establishment, replacement, crop-year, bearing phase, output, and allocation event has a declared period or phase and cannot be attributed twice."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_harvest_and_conditioning_mass_balance
    applies_to: "harvest and primary conditioning"
    rule: "Confirm reconciliation of harvestable, collected, accepted, downgraded, rejected, field-loss, other destination, and moisture-loss masses. Unexplained residuals block finalization."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_quality_output_attribution
    applies_to: "grading and sorting outputs"
    rule: "Confirm every deliberately transferred grade or destination output has a hand-off, output mass, quality or destination descriptor, and an explicit allocation decision. Rejected material cannot be counted as accepted output."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_nutrient_emission_linkage
    applies_to: "nutrient inputs and elementary emissions"
    rule: "Confirm that nutrient-related emissions link to actual product and amendment records, residue and soil data, the selected method tier, and the declared receiving medium."
    source_ids:
      - ipcc-2019-refinement-vol-4
  - rule_id: validation_flow_set_resolution
    applies_to: "parameterized and unmapped inventory rows"
    rule: "Before final TIDAS process publication, resolve each parameterized Flow Set row or unmapped identity to a compatible concrete UUID with property, unit, direction, flow type, geography, and intended-use evidence."
    source_ids: []
  - rule_id: validation_boundary_exclusions
    applies_to: "complete foreground dataset"
    rule: "Reject or flag datasets that include kibbling, milling, seed separation, gum, flour, roasting, syrup, downstream storage, transport after the gate, unmanaged wild collection, or packaging end-of-life unless an explicitly reviewed boundary extension is recorded."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "foreground managed-carob orchard, harvest, collection, and first-conditioning process data for downstream process and lifecyclemodel projections"
  allowed_use: "modelling whole ripe carob pods with seeds retained at the declared producing or first-conditioning gate when identity, period linkage, mass balance, moisture, grade, and route records are complete"
  excluded_use: "modelling unmanaged wild collection, separated seeds or pulp, locust bean gum, flour, powder, syrup, roasting, downstream storage or transport, consumer use, or another fruit category; unresolved identity rows are not final TIDAS exchanges"
  required_metadata: "PCR id and lifecycle state; CPC reference; species and cultivar or type; managed orchard or cultivated-grove status; geography; orchard age and area; productive-period basis; crop year; irrigation and nutrient basis; harvest method; raw, accepted, downgraded, rejected, and loss masses; moisture convention; grade and destination; conditioning inclusion; seed-retention status; declared gate"
  required_quality_disclosure: "temporal and site coverage; block, lot, and batch aggregation; measurement and calculation methods; missing-data and justified-zero treatment; moisture sampling; parameterized Flow Set decisions; identity evidence gaps; allocation factors; reject and residue fate; and boundary extensions"
  update_trigger: "change in product state, cultivar or route, orchard age or productive-period assumption, irrigation or nutrient practice, harvest technology, conditioning technology, grade or destination, Flow Set version, emission method, identity evidence, or applicable product-quality specification"
