system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary starts with the declared managed carob orchard or cultivated grove and runs through orchard management, harvest, collection, and the primary conditioning needed to reach the declared whole-pod gate. Primary conditioning may include natural or supplied-air drying, cleaning, sorting, and grading when those operations occur before the gate. It ends at transfer of accepted whole pods at the producing site or first-conditioning gate."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Upstream production of nursery stock, fertilizer and soil-amendment products, crop-protection formulations, irrigation supply, fuels, electricity, machinery services, and waste-treatment services uses compatible background datasets when those inputs cross the foreground boundary. Direct resource withdrawals and field or conditioning emissions are foreground exchanges when they are measured or calculated under this PCR."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "The boundary excludes unmanaged wild collection, orchard products other than the declared pod outputs, kibbling, milling, seed separation, gum extraction, roasting, syrup or molasses production, retail presentation, transport after the declared gate, downstream storage, consumer use, and packaging end-of-life. Rejected or downgraded material remains inside the balance until its declared hand-off or waste destination is evidenced."
      source_ids: []
    - rule_id: boundary_managed_orchard_to_pod_gate
      applies_to: "all conforming datasets"
      rule: "Include managed orchard or cultivated-grove production, harvest, collection, and the declared primary conditioning up to transfer of accepted whole pods at the producing or first-conditioning gate."
      source_ids:
        - fao-feedipedia-carob
        - fao-carob-nwfp-chapter7
        - iso-14044-2006
    - rule_id: boundary_perennial_asset_period
      applies_to: "establishment, replacement, and non-bearing periods"
      rule: "Link establishment, replacement, and immature-tree inputs to the declared productive period and accepted pod output; disclose the annualization horizon, crop-year linkage, and any non-bearing period."
      source_ids:
        - fao-feedipedia-carob
        - carob-macronutrients-water-2005
        - iso-14044-2006
    - rule_id: boundary_primary_conditioning_only
      applies_to: "drying, cleaning, sorting, and grading"
      rule: "Include only first conditioning needed to reach the declared whole-pod gate. Stop before kibbling, milling, seed separation, gum extraction, roasting, syrup, flour, or other downstream transformation."
      source_ids:
        - fao-feedipedia-carob
        - carob-drying-characteristics-2016
    - rule_id: boundary_unmanaged_wild_exclusion
      applies_to: "wild or feral-tree harvest"
      rule: "Exclude unmanaged wild collection from this managed-production PCR; if the declared route has no managed production boundary, use a separately reviewed resource-removal methodology."
      source_ids:
        - fao-carob-nwfp-chapter7
    - rule_id: boundary_direct_exchange_completeness
      applies_to: "resources, nutrients, residues, and emissions"
      rule: "Include measured or method-calculated land occupation, irrigation or direct withdrawal, energy, nutrient-related environmental exchanges, residues, rejects, and losses when they occur within the declared boundary."
      source_ids:
        - carob-macronutrients-water-2005
        - ipcc-2019-refinement-vol-4
        - iso-14044-2006
    - rule_id: boundary_recursive_product_input
      applies_to: "same-category product inputs"
      rule: "Do not recursively expand a whole-pod product input. Record the external input identity and upstream dataset requirement, or document why no same-category input crossed the boundary."
      source_ids:
        - iso-14044-2006
boundary_abstraction:
  declared_starting_condition: "established or newly established managed carob orchard or cultivated grove at the beginning of the declared crop year, with planting or replacement records and prior land condition disclosed"
  starting_condition_role: "start of managed perennial carob production and orchard-asset accounting"
  product_classification_scope: "current CPC 3.0 product category 01356, Locust beans (carobs), semantically limited to whole ripe carob pods with seeds retained at a primary gate"
  recursive_input_rule: "Whole carob pods transferred between the production, harvest, and conditioning nodes are internal process links, not additional market outputs. A same-category pod input crossing the external boundary is recorded as an upstream product dataset and is not recursively expanded into another whole-pod production system."
  upstream_dataset_requirement: "Use compatible upstream datasets for nursery stock, nutrient and soil-amendment products, crop-protection formulations, supplied irrigation water, fuels, electricity, machinery services, and waste treatment when these activities are not measured as foreground activity."
  disclosure: "species and cultivar or type; orchard or grove status; block and area; tree age and bearing status; productive-period assumption; crop year; prior land condition; irrigation source and volume; nutrient and soil-amendment records; crop protection; energy; harvest method; raw and accepted pod masses; moisture; grade and destination; reject and loss fate; conditioning operations; and declared gate"
