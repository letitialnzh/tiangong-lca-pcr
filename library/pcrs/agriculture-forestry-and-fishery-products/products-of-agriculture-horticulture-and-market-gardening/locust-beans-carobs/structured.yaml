    required_property_ref:
      name: "product mass and nutrient mass"
      uuid: ""
    required_unit: "kg product and kg N, P2O5, K2O, or declared organic basis"
    rule: "Record only products actually used, their product mass, and the declared nutrient or amendment basis. Do not infer a fertilizer type from a nutrient total."
  - id: water_energy_unit
    applies_to: "irrigation, direct withdrawal, orchard work, harvest, and conditioning"
    required_property_ref:
      name: "volume, mass, or energy"
      uuid: ""
    required_unit: "m3, kg, L, MJ, or kWh"
    rule: "Preserve the measured activity unit, carrier or source, equipment or operation, period, and any conversion equation. Do not add supplied water to direct withdrawal when they describe the same volume."
  - id: whole_pod_identity
