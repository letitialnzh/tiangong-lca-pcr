    required_unit: "kg"
    rule: "Express the reference flow as net accepted whole carob-pod mass at the declared gate. Retain the as-received mass and moisture measurement; do not silently substitute seed-only, pulp-only, dry-matter, or processed-product mass."
  - id: moisture_basis
    applies_to: "harvested, dried, stored, and accepted pods"
    required_property_ref:
      name: "Mass and moisture fraction"
      uuid: ""
    required_unit: "kg and percent or kg water/kg product"
    rule: "Record lot moisture with method and sampling point. If a dry-mass conversion is made, use the measured moisture fraction and disclose whether the input and output masses are as received or on a dry basis."
  - id: orchard_life_annualization
    applies_to: "establishment, replacement, and immature-tree inputs"
    required_property_ref:
      name: "area, time, or mass activity property"
      uuid: ""
    required_unit: "ha, orchard-year, or kg product"
    rule: "Link each establishment or replacement event to the orchard block, productive period, and accepted pod output. Annualize only with a documented productive-period assumption and retain the original event record."
  - id: nutrient_product_and_basis
