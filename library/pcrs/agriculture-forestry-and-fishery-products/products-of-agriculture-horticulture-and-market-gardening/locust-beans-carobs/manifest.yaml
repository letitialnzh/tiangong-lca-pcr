    selection_basis: "Managed cultivated carob trees form a perennial biological production route. Ripe pods are independently removed and collected, then may be air-dried, cleaned, sorted, and graded before the declared gate. Grade or destination states are treated as intended outputs only when they are deliberately transferred; perennial establishment and replacement records are linked to crop years and the declared productive period."
    excluded_route_notes:
      - "Unmanaged wild collection is outside this managed-production PCR and requires a separate resource-removal route assessment."
      - "Packaging, roasting, milling, kibbling, seed separation, gum extraction, flour, syrup, and other downstream transformations are outside the default boundary."
