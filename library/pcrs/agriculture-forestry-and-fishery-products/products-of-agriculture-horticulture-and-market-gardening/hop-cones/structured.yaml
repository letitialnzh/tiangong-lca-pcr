system_boundary:
  rules:
    - rule_id: boundary_perennial_yard
      applies_to: "Yard production"
      rule: "Include establishment, planting, trellis/support and irrigation infrastructure, crop management and field emissions; link each item to establishment, productive, replacement or termination periods."
      source_ids:
        - cornell-hop-yard-2017
        - cordella-hop-lca-2026
    - rule_id: boundary_harvest_separate
      applies_to: "Harvest"
      rule: "Model harvest independently because it removes the output from perennial production and manual and mechanical routes create different collected states and burdens."
      source_ids:
        - uf-ifas-hop-harvest-2019
    - rule_id: boundary_conditioning
      applies_to: "Separation and grading"
      rule: "Include cone separation, leaf and chaff removal, grading and immediate breathable handling."
      source_ids:
        - uf-ifas-hop-harvest-2019
        - penn-state-hop-production
    - rule_id: boundary_wet_route
      applies_to: "Wet route"
      rule: "End at accepted graded wet cones; exclude drying, kiln assets and subsequent storage."
      source_ids:
        - penn-state-hop-production
    - rule_id: boundary_dried_route
      applies_to: "Dried route"
      rule: "Include drying only for an explicitly declared dried whole-cone hand-off controlled by the foreground; record pre-state, moisture, energy, loss and post-state."
      source_ids:
        - cornell-hop-yard-2017
    - rule_id: boundary_rejects
      applies_to: "Grading and drying"
      rule: "Separate accepted, downgraded, single-pass rework, rejected and chaff states and document every destination."
      source_ids:
        - penn-state-hop-production
    - rule_id: boundary_downstream
      applies_to: "All routes"
      rule: "Exclude pelletizing, extraction, brewing, merchant storage, downstream packaging and post-gate transport."
      source_ids:
        - penn-state-hop-production
