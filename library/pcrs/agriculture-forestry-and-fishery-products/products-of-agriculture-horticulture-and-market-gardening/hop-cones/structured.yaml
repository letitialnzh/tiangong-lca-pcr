allocation_rules:
  - rule_id: allocation_no_co_product_default
    applies_to: "Production"
    rule: "Accepted cones are the only reference product. Residues, chaff, rejects and field losses receive no avoided burden unless a documented valuable output requires justified allocation."
    source_ids: []
  - rule_id: allocation_productive_life
    applies_to: "Perennial phases"
    rule: "Aggregate establishment, immature, productive, replacement and termination records over the declared scenario and divide by accepted output from the same periods; do not assign establishment twice."
    source_ids:
      - cordella-hop-lca-2026
  - rule_id: allocation_shared_infrastructure
    applies_to: "Shared assets"
    rule: "Link trellis, irrigation, harvest and dryer assets to every consuming node and service period; attribute once by serviced area-time, measured use or documented capacity-time."
    source_ids:
      - cordella-hop-lca-2026
  - rule_id: allocation_batches
    applies_to: "Harvest, grading and drying"
    rule: "Assign direct records to actual lots; allocate start-up, cleaning and changeover once by measured use, processed mass or capacity-time."
    source_ids: []
  - rule_id: allocation_rework_rejects
    applies_to: "Off-spec states"
    rule: "Retain burdens through the producing node. A single rework loop receives incremental burdens and is not a second accepted output; every boundary exit and credit needs a destination and method."
    source_ids: []
  - rule_id: allocation_route_exclusivity
    applies_to: "Wet and dried routes"
    rule: "Select one reference route. The wet route excludes drying; the dried route includes the wet-cone chain once and drying once."
    source_ids:
      - penn-state-hop-production
dataset_production:
  collection_protocols:
    - protocol_id: cp_yard_assets
      process_id: "yard_production"
      flow_role: "establishment, planting and shared assets"
      record_type: "invoices, maps, bills and replacement logs"
      raw_fields: "yard_id; area; phase; cultivar; material_uuid; count; mass; installation_year; replacement_year; service_area; consuming_nodes; service_life"
      collection_method: "Physical inventory linked to mapped blocks"
      unit: "count; kg; ha; year"
      frequency: "Each installation or replacement"
      temporal_coverage: "Full declared scenario"
      site_scope: "Asset and serviced blocks"
      aggregation_rule: "Attribute once across service area and periods"
      quality_evidence: "Dated invoices, drawings, logs and photos"
    - protocol_id: cp_nutrient_inputs
      process_id: "yard_production"
      flow_role: "all nutrient products"
      record_type: "purchase and application records"
      raw_fields: "product_uuid; name; product_mass; nutrient_analysis; dry_matter; date; block; method; treated_area"
      collection_method: "Collect each product separately before umbrella aggregation"
      unit: "kg product; kg nutrient; ha"
      frequency: "Every application"
      temporal_coverage: "Every represented year"
      site_scope: "Treated block"
      aggregation_rule: "Sum by product and year; retain analysis"
      quality_evidence: "Invoice, label and calibrated application log"
    - protocol_id: cp_yard_operations
      process_id: "yard_production"
      flow_role: "water, crop protection, canopy inputs and field energy"
      record_type: "meter, application, fuel and operation logs"
      raw_fields: "date; block; input_uuid; active_ingredient; quantity; unit; water_volume; equipment; operation; runtime"
      collection_method: "Meter or calibrated application record"
      unit: "m3; kg; L; kWh; MJ; h"
      frequency: "Every operation"
      temporal_coverage: "Every represented year"
      site_scope: "Block and equipment"
      aggregation_rule: "Sum by concrete input and year, never unlike units"
      quality_evidence: "Meter calibration, invoices and logs"
    - protocol_id: cp_field_emissions
      process_id: "yard_production"
      flow_role: "direct emissions"
      record_type: "calculation inputs"
      raw_fields: "input identity; nutrient or active amount; soil; weather; irrigation; incorporation; method; compartment"
      collection_method: "Apply declared substance-specific method"
      unit: "kg substance/ha/year"
      frequency: "Each application and annual calculation"
      temporal_coverage: "Every represented year"
      site_scope: "Treated block"
      aggregation_rule: "Calculate by substance and compartment"
      quality_evidence: "Complete calculation sheet and method/version"
    - protocol_id: cp_harvest_balance
      process_id: "yard_production_harvest_capture"
      flow_role: "hand-off, collected mixture, residues and losses"
      record_type: "lot tickets and scale logs"
      raw_fields: "lot_id; yard_id; cultivar; route; input_mass; collected_mass; residue_mass; loss; destination; timestamps"
      collection_method: "Calibrated weighing or documented reconciliation"
      unit: "kg wet mass"
      frequency: "Every lot"
      temporal_coverage: "Every harvest"
      site_scope: "Yard and lot"
      aggregation_rule: "Reconcile input with unique outputs, residues and losses"
      quality_evidence: "Calibration and chain of custody"
    - protocol_id: cp_harvest_operations
      process_id: "harvest_capture"
      flow_role: "energy, cleaning and changeover"
      record_type: "fuel, meter and machine logs"
      raw_fields: "lot_id; route; machine; carrier_uuid; quantity; runtime; event"
      collection_method: "Meter or carrier issue linked to run"
      unit: "L; kWh; MJ; h"
      frequency: "Every run and event"
      temporal_coverage: "Every harvest"
      site_scope: "Machine and lot"
      aggregation_rule: "Assign shared event once"
      quality_evidence: "Meter and run logs"
    - protocol_id: cp_grading_batch
      process_id: "grading_handoff"
      flow_role: "all grade states and energy"
      record_type: "lot, scale, grade and meter records"
      raw_fields: "lot_id; input_mass; accepted_mass; downgraded_mass; rework_mass; reject_mass; chaff_mass; destination; moisture; carrier_uuid; energy"
      collection_method: "Calibrated weighing, destination coding and meter record"
      unit: "kg; %; MJ"
      frequency: "Every lot and rework pass"
      temporal_coverage: "Every harvest"
      site_scope: "Lot and equipment"
      aggregation_rule: "Reconcile all unique states; do not double-count returns"
      quality_evidence: "Calibration, grade sheet and receipts"
    - protocol_id: cp_drying_batch
      process_id: "conditional_drying"
      flow_role: "wet input, moisture, energy, dried outputs and water"
      record_type: "batch sheet, scales, moisture tests and meters"
      raw_fields: "batch_id; lot_id; wet_mass; initial_moisture; test_method; carrier_uuid; energy; temperature; duration; dried_mass; final_moisture; reject_mass"
      collection_method: "Weigh, sample moisture and meter energy by batch"
      unit: "kg; %; MJ; °C; h"
      frequency: "Every batch"
      temporal_coverage: "Every dried-route harvest"
      site_scope: "Batch and dryer"
      aggregation_rule: "Close dry-matter and total-mass balance; assign shared energy once"
      quality_evidence: "Calibrations and validated moisture records"
  calculation_rules:
    - id: calc_productive_life
      applies_to: "Establishment and assets"
      rule: "Sum attributed phase burdens across the scenario and divide by cumulative accepted mass from the same area and periods."
      inputs:
        - phase
        - asset
        - area
        - "period and accepted-output records"
      output: "burden/kg accepted cones"
      source_ids:
        - cordella-hop-lca-2026
    - id: calc_route_yield
      applies_to: "Crop year and route"
      rule: "Accepted farm-gate mass divided by occupied area; report state and moisture."
      inputs:
        - "accepted mass"
        - area
        - state
        - moisture
      output: "kg/ha/year"
      source_ids:
        - penn-state-hop-production
    - id: calc_grading_balance
      applies_to: "Harvest and grading"
      rule: "input minus unique accepted, downgraded, rejected, chaff and loss states; rework returns are transfers."
      inputs:
        - "all lot masses and state codes"
      output: "closure mass and ratio"
      source_ids:
        - mass-balance-identity
    - id: calc_drying_water
      applies_to: "Drying"
      rule: "wet input × initial moisture − accepted dry output × final moisture − reject mass × reject moisture."
      inputs:
        - "batch masses and moisture fractions"
      output: "kg water to air"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Preserve cultivar, state, grade, moisture, harvest date and hand-off with the fixed UUID."
      evidence: "Lot specification"
    - id: dq_temporal
      applies_to: "Perennial system"
      requirement: "Cover the declared establishment and productive-life scenario or identify extrapolated years and replacement assumptions."
      evidence: "Multi-year records"
    - id: dq_completeness
      applies_to: "Inventory"
      requirement: "Include establishment, nutrients, water, crop protection, field energy, infrastructure, emissions, harvest, rejects and route-conditional drying."
      evidence: "Process/protocol matrix"
    - id: dq_measurement
      applies_to: "Mass, water and energy"
      requirement: "Use calibrated instruments where available and disclose estimation, sampling and uncertainty."
      evidence: "Calibration and calculations"
    - id: dq_route
      applies_to: "Alternatives"
      requirement: "Keep manual/mechanical harvest and wet/dried hand-offs separate unless evidence-based weights are supplied."
      evidence: "Route records"
    - id: dq_flow_resolution
      applies_to: "Inputs and emissions"
      requirement: "Resolve actual Product inputs to verified UUIDs and retain substance and compartment specificity for elementary flows."
      evidence: "Resolution record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "Reference flow"
    rule: "Require fixed Hop cones, Mass and unit-group UUIDs, 1 kg accepted output and every qualifier."
    source_ids: []
  - rule_id: validate_route_exclusivity
    applies_to: "Route"
    rule: "Require exactly one wet or dried hand-off; wet has no drying inventory, dried has one linked drying node and declared parent activity and delta."
    source_ids:
      - penn-state-hop-production
  - rule_id: validate_periods
    applies_to: "Perennial attribution"
    rule: "Require phase treatment, cumulative output, attribution period and evidence and reject double attribution."
    source_ids:
      - cordella-hop-lca-2026
  - rule_id: validate_shared_assets
    applies_to: "Shared infrastructure"
    rule: "Require asset identity, consuming nodes and periods, service boundary, attribution driver and duplicate-burden check."
    source_ids: []
  - rule_id: validate_nutrient_cardinality
    applies_to: "Every process"
    rule: "Permit at most one Product-input nutrient card; it binds only flow-set.agricultural-nutrient-supply version 0.3.0 without group while actual products are separately collected."
    source_ids: []
  - rule_id: validate_batch_linkage
    applies_to: "Harvest, grading and drying"
    rule: "Require lot/batch IDs for inputs, outputs, energy, cleaning and changeover and reject shared burdens counted twice."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "Harvest, grading and drying"
    rule: "Reconcile accepted, downgraded, rework, rejected, chaff, loss and moisture states within disclosed uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_reject_routing
    applies_to: "Off-spec material"
    rule: "Give every downgrade, rework, recovery or discard state one producing node and documented next state; exclude unresolved rejects from accepted output."
    source_ids: []
  - rule_id: validate_drying
    applies_to: "Dried route"
    rule: "Require initial/final moisture, test method, batch mass, energy and acceptance state. The 20–26% initial dry matter and 8–10% target moisture are QA context, not universal limits."
    source_ids:
      - cornell-hop-yard-2017
  - rule_id: validate_ranges
    applies_to: "All flow cards"
    rule: "Require exactly one complete Range per card and identical English, Chinese and structured values."
    source_ids: []
  - rule_id: validate_exclusions
    applies_to: "Boundary"
    rule: "Reject pelletizing, extraction, brewing, merchant storage, downstream packaging and post-gate transport."
    source_ids:
      - penn-state-hop-production
