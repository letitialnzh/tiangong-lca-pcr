  calculation_rules:
    - id: calc_nutrient_equivalent
      applies_to: "fertilizer inputs"
      rule: "Product mass multiplied by documented nutrient fraction equals kg N, P2O5, or K2O; retain each basis separately."
      inputs:
        - "product mass"
        - "nutrient concentration"
        - area
      output: "nutrient-equivalent input"
      source_ids:
        - extension-leafy-vegetable-production
    - id: calc_irrigation_withdrawal
      applies_to: "irrigation"
      rule: "Withdrawal equals metered or documented source volume; delivered irrigation and conveyance loss are reported separately."
      inputs:
        - "source meter"
        - "field meter"
        - "loss method"
      output: "source withdrawal and delivered irrigation"
      source_ids:
        - fao-water-efficiency
    - id: calc_field_cycle_normalization
      applies_to: "cultivation"
      rule: "Divide complete field-cycle quantity by marketable output from the corresponding crop and cycle."
      inputs:
        - "field-cycle quantity"
        - "marketable mass"
      output: "quantity per 1,000 kg reference product"
      source_ids: []
    - id: calc_product_balance
      applies_to: "harvest and handling"
      rule: "Gross harvested input plus measured mass change equals marketable product plus rejects and trimmings within declared uncertainty."
      inputs:
        - gross
        - marketable
        - reject
        - trim
        - "and mass-change records"
      output: "reconciled output quantities"
      source_ids:
        - usda-ams-fresh-produce
    - id: calc_managed_soil_emissions
      applies_to: "soil nitrogen emissions"
      rule: "Apply the declared applicable IPCC or accepted regional equations to synthetic, organic, and returned-residue nitrogen; preserve factors and prevent double counting."
      inputs:
        - "nitrogen activity data"
        - factors
        - "climate and management qualifiers"
      output: "direct and indirect nitrogen emissions"
      source_ids:
        - ipcc-2019-managed-soils
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve crop identity, botanical name where relevant, market state, grade, maturity, trim, washing, packaging, geography, year, and cycle."
      evidence: "lot specification and field records"
    - id: dq_cycle_linkage
      applies_to: "establishment and cultivation"
      requirement: "Link every field-cycle to one crop identity and disclose crop sequence, replacements, failed area, and termination."
      evidence: "field map, planting record, and production history"
    - id: dq_water_separation
      applies_to: "irrigation and handling"
      requirement: "Separate source withdrawal, delivered irrigation, wash water, and precipitation and retain the measurement method."
      evidence: "meters, pump records, and water log"
    - id: dq_mass_balance
      applies_to: "harvest and handling"
      requirement: "Reconcile harvest-ready, gross, marketable, rejected, and trimmed masses and explain differences."
      evidence: "calibrated scales and lot records"
    - id: dq_input_completeness
      applies_to: "all foreground inputs"
      requirement: "Preserve nutrient basis, irrigation source, fuel and electricity coverage, crop-protection identity, packaging material, and residue destination."
      evidence: "invoices, labels, meters, and logs"
    - id: dq_method_transparency
      applies_to: "calculations"
      requirement: "Record method version, factors, normalization denominator, exclusions, and replacement of provisional estimates."
      evidence: "calculation file and review record"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference product"
    rule: "Use the verified Other leafy or stem vegetables UUID, mass property, mass unit group, kg, and all required qualifiers."
    source_ids: []
  - rule_id: validation_cycle_handoffs
    applies_to: "process map"
    rule: "Link crop establishment to each field-cycle and make harvest-ready output equal the harvest input before losses."
    source_ids: []
  - rule_id: validation_mass_balance
    applies_to: "harvest and handling"
    rule: "Reconcile marketable output, rejects, trimmings, and mass change to gross harvested input within declared uncertainty."
    source_ids:
      - usda-ams-fresh-produce
  - rule_id: validation_nutrients_emissions
    applies_to: "field management"
    rule: "Keep N, P2O5, and K2O distinct, document emission factors, and prevent returned-residue nitrogen double counting."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validation_parameterized_flows
    applies_to: "parameterized rows"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validation_unmapped_flows
    applies_to: "unmapped rows"
    rule: "Planting material, internal crop and residue states, and rejected produce remain explicit coverage requirements until exact compatible identities are supplied."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground agricultural production dataset for fresh other leafy or stem vegetables at farm gate"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "crop and supply-chain studies with compatible crop identity, geography, crop cycle, route, market state, and farm-gate boundary"
  excluded_use: "seed or transplant production, specified CPC leafy or stem categories, spices and aromatic crops, processed products, distribution beyond farm gate, or comparisons omitting declared crop-cycle activities"
  required_metadata: "crop identity; botanical name where relevant; geography; field or protected route; area; cycle and year; planting material; irrigation source; nutrient basis; crop-protection program; harvest and grade; maturity; washing; cooling; packaging; residue fate; farm-gate hand-off"
  required_quality_disclosure: "primary-data coverage; meter and scale quality; crop-cycle linkage; mass balance; water separation; data gaps; provisional ranges; emission method; concrete flow identity verification; unmapped identities"
  update_trigger: "verified identity, reviewed quantitative evidence, crop-specific product specification, source-method change, or managed-soil method change"
