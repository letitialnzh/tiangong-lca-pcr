allocation_rules:
  - rule_id: allocation_shared_bed_preparation
    applies_to: "establishment and field management"
    rule: "Attribute shared bed or protected-area preparation to the declared crop cycle using documented area, duration, and crop sequence; disclose intercropping or multi-crop use."
    source_ids:
      - fao-good-agricultural-practices
  - rule_id: allocation_marketable_and_rejects
    applies_to: "harvest and handling"
    rule: "Reconcile harvest-ready or gross harvested mass to marketable product, rejects, and trimmings; treat rejects as waste unless a documented buyer, specification, quantity, and destination establish a co-product."
    source_ids:
      - usda-ams-fresh-produce
  - rule_id: allocation_secondary_output
    applies_to: "intentional secondary products"
    rule: "For an intentional secondary product, report quantity and hand-off and apply an explicitly justified mass or economic allocation; no default avoided burden applies."
    source_ids: []
