      process_id: "crop_establishment"
      flow_role: "planting material, establishment nutrients, accepted area"
      record_type: "seed or transplant, purchase, application, and field records"
      raw_fields: "crop_identity; botanical_name; lot_id; date; units_or_mass; viability; field_id; area; product_mass; nutrient_concentration; accepted_area"
      collection_method: "reconcile purchases and applications to each crop and field"
      unit: "plant; kg; ha"
      frequency: "each establishment event"
      temporal_coverage: "complete crop establishment period"
      site_scope: "every represented field or protected area"
      aggregation_rule: "sum by crop-field-cycle and preserve replacement losses"
      quality_evidence: "invoices, labels, seed certificates, field maps, and acceptance records"
    - protocol_id: cp_field_cycle_records
      process_id: "field_crop_management"
      flow_role: "nutrients, amendments, fuel, crop protection, land, residues, and emissions activity"
      record_type: "field-cycle log, invoice, meter, application, and residue record"
      raw_fields: "field_id; crop_identity; cycle_id; area; date; product_identity; product_mass; nutrient_concentration; amendment_dry_matter; fuel; electricity; irrigation; crop_protection; residue_mass; dry_matter; destination"
      collection_method: "reconcile all activities to the same crop, field, and cycle"
      unit: "ha; kg; m3; L; kWh"
      frequency: "each event and cycle close"
      temporal_coverage: "full declared crop cycle"
      site_scope: "every represented field or protected area"
      aggregation_rule: "sum by field-cycle before reference-flow normalization"
      quality_evidence: "invoices, labels, analyses, meters, maps, and disposition receipts"
    - protocol_id: cp_irrigation_records
      process_id: "field_crop_management"
      flow_role: "irrigation withdrawal and delivered water"
      record_type: "meter, pump, source, and irrigation log"
      raw_fields: "field_id; source; date; meter_start; meter_end; delivered_volume; withdrawal_volume; conveyance_loss; method"
      collection_method: "reconcile source withdrawal to field delivery and retain loss method"
      unit: "m3"
      frequency: "each irrigation event"
      temporal_coverage: "full declared cycle"
      site_scope: "every represented irrigated field"
      aggregation_rule: "sum by field-cycle and separate irrigation from wash water"
      quality_evidence: "calibrated meters, pump records, and water permits"
    - protocol_id: cp_harvest_records
      process_id: "harvest_and_farm_gate_preparation"
      flow_role: "harvest-ready and gross harvested product"
      record_type: "harvest log and scale record"
      raw_fields: "field_id; crop_identity; lot_id; harvest_date; harvest_pass; gross_mass; harvest_loss; maturity; grade; trim_state"
      collection_method: "link each harvest lot to field and date"
      unit: "kg; ha"
      frequency: "each harvest lot or pass"
      temporal_coverage: "complete harvest window"
      site_scope: "every represented field and lot"
      aggregation_rule: "sum by field-cycle without merging incompatible crop identities"
      quality_evidence: "calibrated scales, lot tickets, and grade records"
    - protocol_id: cp_handling_records
