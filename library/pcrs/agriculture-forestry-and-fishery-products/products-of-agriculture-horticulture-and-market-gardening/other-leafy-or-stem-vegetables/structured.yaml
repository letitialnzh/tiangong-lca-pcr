system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "establishment and cultivation"
      rule: "Include seed or transplant establishment, crop management, harvest, and the represented crop cycle; attribute shared bed preparation to the declared crop and cycle without double counting."
      source_ids:
        - fao-good-agricultural-practices
        - extension-leafy-vegetable-production
    - rule_id: boundary_farm_gate
      applies_to: "harvest and handling"
      rule: "End at transfer of the declared fresh marketable product at farm gate; include on-farm sorting, trimming, washing, cooling, and primary packaging when performed before transfer."
      source_ids:
        - usda-ams-fresh-produce
        - codex-fresh-produce-hygiene
    - rule_id: boundary_managed_soils
      applies_to: "field nutrients and residues"
      rule: "Include applicable direct and indirect nitrogen emissions and returned-residue nitrogen with one declared method and prevent double counting between fertilizer, residue, and soil pools."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: boundary_residue_destinations
      applies_to: "crop residues and rejects"
      rule: "Distinguish field return, composting, feed, treatment, and disposal; unspecified residues and downgraded produce are waste until a documented co-product hand-off exists."
      source_ids:
        - fao-good-agricultural-practices
        - codex-fresh-produce-hygiene
boundary_abstraction:
  declared_starting_condition: "Prepared agricultural bed, field, or protected growing area receiving seed, transplants, or an established crop, with prior land use and excluded pre-plant work disclosed"
  starting_condition_role: "Beginning of the declared crop cycle and field-year attribution"
  product_classification_scope: "Fresh other leafy or stem vegetables under CPC 3.0:01219 through farm-gate hand-off"
  recursive_input_rule: "Purchased seed, transplants, and other same-category planting material are distinct upstream product inputs and are linked once rather than recreated inside this PCR."
  upstream_dataset_requirement: "Require upstream datasets for seed or transplants, fertilizers, amendments, crop-protection products, irrigation water, energy, transport services, and packaging when used."
  disclosure: "Declare crop identity, botanical type where relevant, geography, field or protected route, crop cycle, irrigation source, nutrient basis, crop-protection program, harvest schedule, residue fate, washing, cooling, packaging, and farm-gate hand-off."
