    - id: calc_managed_soil_emissions
      applies_to: "soil nitrogen emissions"
      rule: "Apply the declared applicable IPCC or accepted regional equations to synthetic, organic, and returned-residue nitrogen; preserve factors and prevent double counting."
      inputs:
        - "nitrogen activity data"
        - factors
        - "climate and management qualifiers"
      output: "direct and indirect nitrogen emissions"
      source_ids:
        - ipcc-2019-managed-soils
  data_quality_requirements:
    - id: dq_product_identity
