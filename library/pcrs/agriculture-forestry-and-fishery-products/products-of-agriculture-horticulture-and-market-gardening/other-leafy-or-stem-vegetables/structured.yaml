      flow_role: "wash water, packaging, marketable output, rejects, and trim"
      record_type: "lot, scale, meter, packaging, and waste records"
      raw_fields: "lot_id; source_field; gross_input; wash_water; cooling_energy; packaging_material; packaging_mass; marketable_mass; grade; trim_state; reject_mass; reject_reason; destination"
      collection_method: "preserve lot-level mass and utility reconciliation through transfer"
      unit: "kg; m3; kWh"
      frequency: "each lot or shift"
      temporal_coverage: "complete harvest and packing period"
      site_scope: "every represented handling line"
