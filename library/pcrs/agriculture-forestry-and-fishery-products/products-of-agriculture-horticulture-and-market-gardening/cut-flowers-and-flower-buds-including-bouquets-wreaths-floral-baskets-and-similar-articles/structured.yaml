      applies_to: "article_assembly"
      rule: "Include every floral component, accessory, joining input and assembly loss for article routes."
      source_ids:
        - mass-balance-identity
    - rule_id: boundary_packaging
      applies_to: "presentation_handoff"
      rule: "Include packaging crossing hand-off and exclude later distribution."
      source_ids:
        - ncsu-cut-flower-postharvest
    - rule_id: boundary_route_separation
      applies_to: "alternative routes"
      rule: "Keep cultivation, preservation and presentation routes separate until weighting is reproducible."
      source_ids:
        - fao-postharvest-cut-flowers
