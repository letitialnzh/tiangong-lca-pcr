system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The boundary starts with burden-carrying propagation material and cultivation inputs. It includes managed cultivation, harvest, hydration/conditioning, grading, cooling, optional assembly, packaging and hand-off. Shared infrastructure is attributed over service life and use. Distribution after hand-off, retail display and consumer care are excluded."
