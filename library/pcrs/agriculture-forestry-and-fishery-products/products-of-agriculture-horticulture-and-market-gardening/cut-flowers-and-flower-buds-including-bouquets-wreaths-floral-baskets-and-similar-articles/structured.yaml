        - fao-postharvest-cut-flowers
    - rule_id: boundary_cultivation
      applies_to: "managed_cultivation"
      rule: "Include propagation, water, nutrients, crop protection, energy and attributable shared infrastructure."
      source_ids:
        - fao-postharvest-cut-flowers
    - rule_id: boundary_conditioning
      applies_to: "harvest_conditioning"
      rule: "Include cutting, rapid hydration, preservative treatment and conditioning actually performed."
      source_ids:
        - ncsu-cut-flower-postharvest
    - rule_id: boundary_cold_chain
      applies_to: "grading_cooling"
      rule: "Include grading, cooling and controlled holding through hand-off; disclose time and temperature."
      source_ids:
        - fao-postharvest-cut-flowers
