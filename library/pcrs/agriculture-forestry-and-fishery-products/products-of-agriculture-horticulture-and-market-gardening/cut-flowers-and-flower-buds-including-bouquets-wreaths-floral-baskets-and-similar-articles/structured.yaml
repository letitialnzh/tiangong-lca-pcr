  calculation_rules:
    - id: calc_normalization
      applies_to: "all rows"
      rule: "compatible stratum total divided by accepted net floral mass"
      inputs:
        - "attributed quantity"
        - "reference mass"
      output: "amount per kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_count_mass
      applies_to: "count records"
      rule: "measured representative lot mass divided by count"
      inputs:
        - "lot mass"
        - count
        - sampling
      output: "kg per stem/item"
      source_ids:
        - mass-balance-identity
    - id: calc_net_floral_mass
      applies_to: "articles"
      rule: "gross mass minus measured non-floral components and excluded free water"
      inputs:
        - gross
        - accessories
        - packaging
        - water
      output: "net floral mass"
      source_ids:
        - mass-balance-identity
    - id: calc_yield
      applies_to: "each node"
      rule: "input plus gain equals accepted, downgrade, rework, waste and measured change"
      inputs:
        - "state masses"
      output: "yield and residual"
      source_ids:
        - mass-balance-identity
    - id: calc_shared_service
      applies_to: "shared assets"
      rule: "measured service times causal share; shares sum to one"
      inputs:
        - "service total"
        - driver
      output: "attributed service"
      source_ids:
        - mass-balance-identity
