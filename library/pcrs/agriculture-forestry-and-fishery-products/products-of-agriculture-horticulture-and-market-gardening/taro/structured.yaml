system_boundary:
  rules:
    - rule_id: fresh_farm_gate
      applies_to: "output boundary"
      rule: "Stop at accepted whole fresh corms/cormels ready for farm-gate dispatch; exclude curing, extended storage, processing, retail packing and downstream transport."
      source_ids:
        - fao-edible-aroids
        - uf-ifas-root-crops
    - rule_id: route_separation
      applies_to: "cultivation"
      rule: "Model upland and wetland cultivation as alternative routes under one managed-production parent; do not average water or field emissions without documented representative shares."
      source_ids:
        - fao-qdp-taro
        - icar-water-2022
    - rule_id: harvest_handoff
      applies_to: "lifting"
      rule: "Separate standing crop from lifted corms so damage, unlifted material and residues are captured before conditioning."
      source_ids:
        - fao-edible-aroids
    - rule_id: conditioning_handoff
      applies_to: "trimming and washing"
      rule: "Create a conditioning node and record water, debris, wastewater, rejects and prepared output; washing is conditional."
      source_ids:
        - uf-ifas-root-crops
    - rule_id: grade_destinations
      applies_to: "grading"
      rule: "Declare accepted, downgraded-edible and rejected states and hand-offs; rejected material cannot enter reference output."
      source_ids:
        - fao-edible-aroids
    - rule_id: single_cycle_attribution
      applies_to: "time"
      rule: "Attribute records to one crop cycle; no storage carry-over is inside the declared farm-gate boundary."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Prepared land plus declared healthy corms, cormels, suckers, headsetts or acclimatized plants ready for establishment."
  starting_condition_role: "The crop cycle begins when planting material and managed inputs enter the field; purchased inputs link to upstream datasets."
  product_classification_scope: "Whole fresh *Colocasia esculenta* corms and cormels independent of classification code."
  recursive_input_rule: "Retained taro propagules transfer from an identified prior lot or nursery once; do not create a self-referential reference-product loop."
  upstream_dataset_requirement: "Link planting material, amendments, fertilizers, crop protection, fuel, energy and supplied water to compatible upstream datasets; disclose unresolved identities."
  disclosure: "Declare cultivar/type, propagule form and origin, upland/wetland route, crop cycle, harvest method, conditioning steps, grade states, co-products and rejected destinations."
