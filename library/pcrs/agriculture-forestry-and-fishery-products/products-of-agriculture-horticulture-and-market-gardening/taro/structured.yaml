allocation_rules:
  - rule_id: subdivide_routes
    applies_to: "upland and wetland production"
    rule: "Subdivide water-management routes before allocation; do not hide different flooding, irrigation or emission profiles."
    source_ids:
      - iso-14044
  - rule_id: intended_outputs
    applies_to: "marketed leaves, planting material or other intentional outputs"
    rule: "Record every intended output and hand-off. Prefer subdivision; otherwise use a documented causal physical relation or contemporaneous farm-gate economic shares with sensitivity analysis."
    source_ids:
      - iso-14044
  - rule_id: grade_outputs
    applies_to: "accepted and downgraded edible taro"
    rule: "Retain separate masses, grades, destinations and revenues; allocate shared burdens only after feasible subdivision."
    source_ids:
      - iso-14044
  - rule_id: reject_routing
    applies_to: "rejected or returned material"
    rule: "Keep prior burdens with rejects until declared boundary exit; if material is returned upstream to the managed field, link that loop explicitly, otherwise record recovery or disposal without unverified avoided-product credit."
    source_ids:
      - iso-14044
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_cycle
      process_id: "field"
      flow_role: "establishment, nutrients, water, fuel and emissions"
      record_type: "field register, invoices, meter, method worksheet"
      raw_fields: "field_id, cycle_id, route, area_ha, propagule_type, propagule_kg, input_kg, nutrient_fraction, water_m3, rainfall_mm, flooding_days, fuel_L, N_input_kg, emission_factor"
      collection_method: "reconcile dated applications, invoices and meters; retain route and nutrient basis"
      unit: "mixed"
      frequency: "each operation"
      temporal_coverage: "full crop cycle"
      site_scope: "each field/route"
      aggregation_rule: "sum by field-cycle and route; calculate nutrients and emissions once"
      quality_evidence: "invoices, meters, logs, factor citation"
    - protocol_id: cp_harvest_lot
      process_id: "harvest"
      flow_role: "standing crop, lifted product, residues and loss"
      record_type: "harvest ticket and sample plots"
      raw_fields: "field_id, cycle_id, lot_id, area_ha, lifted_kg, unlifted_kg, damaged_kg, residue_kg"
