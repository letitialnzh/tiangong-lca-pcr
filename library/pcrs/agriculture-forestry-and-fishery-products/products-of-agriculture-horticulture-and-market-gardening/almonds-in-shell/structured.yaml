allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "orchard, harvest, and conditioning"
    rule: "First avoid allocation by subdividing orchard blocks, harvest passes, hulling campaigns, grades, and destinations when records permit."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_perennial_time
    applies_to: "establishment, immature years, replacements, and removal"
    rule: "Allocate perennial-orchard burdens over the declared orchard life and accepted in-shell output using the declared area, period, and yield basis. Disclose non-bearing years and replacement events."
    source_ids:
      - iso-14067
      - fao-crop-production-methodology
  - rule_id: allocation_hull_co_product
    applies_to: "accepted in-shell almonds and marketed almond hulls"
    rule: "When hulls are an intended output with a documented hand-off, use mass allocation after subdivision. Economic allocation requires representative prices and a mass-allocation sensitivity. If hulls are waste, retain treatment burdens with the almond route and assign no product credit."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_rejects_and_losses
    applies_to: "rejects, broken nuts, dust, and field losses"
    rule: "Assign collection and treatment burdens to the producing process; do not count rejected or lost material as accepted output. Model recovery as a co-product only after its destination and hand-off are evidenced."
    source_ids:
      - usda-almonds-in-shell-grade-2013
      - iso-14044-2006
  - rule_id: allocation_no_double_counting_internal_links
    applies_to: "orchard, harvest, and hulling links"
    rule: "Internal hand-offs transfer mass balance only. They are not additional market products and must not duplicate upstream burdens."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "The PCR-specific default is subdivision followed by mass allocation for a documented almond-hull co-product. The dataset must state whether hulls are sold, fed, composted, burned, land-applied, or discarded, and disclose sensitivity to the allocation choice."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_almond_orchard_lifecycle_records
      process_id: "almond_orchard_establishment_and_management"
      flow_role: "establishment, replacement, removal, and land"
      record_type: "orchard asset and land record"
      raw_fields: "block; area; cultivar; planting year; orchard age; productive life; trees; supports; irrigation assets; prior land use; replacement; removal; fate"
      collection_method: "GIS, asset register, invoices, field records"
      unit: "ha, item, kg, year"
      frequency: "establishment, replacement, and annual update"
      temporal_coverage: "declared orchard life and crop year"
      site_scope: "each orchard block"
      aggregation_rule: "annualize attributable inputs over accepted output"
      quality_evidence: "maps, invoices, asset register, replacement records"
    - protocol_id: cp_almond_orchard_input_records
      process_id: "almond_orchard_establishment_and_management"
      flow_role: "nutrients, crop protection, and field emissions"
      record_type: "purchase and application record"
      raw_fields: "product; formulation; nutrient or active ingredient; mass; date; block; purpose; method"
      collection_method: "invoice, label, application log, agronomist record"
      unit: "kg product, kg nutrient, kg active ingredient"
      frequency: "each application"
      temporal_coverage: "complete crop year"
      site_scope: "each orchard block"
      aggregation_rule: "sum by product and nutrient or active ingredient"
      quality_evidence: "invoice, label, application log"
    - protocol_id: cp_almond_irrigation_records
      process_id: "almond_orchard_establishment_and_management"
      flow_role: "irrigation and withdrawal"
      record_type: "meter and pumping record"
      raw_fields: "source; meter; reading; volume; pumping energy; date; block; rain-fed flag; water quality"
      collection_method: "calibrated meter, pump log, invoice, water analysis"
      unit: "m3, kg, kWh, MJ"
      frequency: "event or month"
      temporal_coverage: "irrigation season and crop year"
      site_scope: "block and water source"
      aggregation_rule: "sum by source and normalize to accepted output"
      quality_evidence: "meter calibration, readings, invoice, water analysis"
    - protocol_id: cp_almond_energy_records
      process_id: "almond_orchard_establishment_and_management"
      flow_role: "orchard and harvest energy"
      record_type: "fuel, electricity, and contractor record"
      raw_fields: "operation; machine; carrier; amount; date; block; service provider"
      collection_method: "fuel log, telematics, meter, invoice"
      unit: "L, kg, kWh, MJ, service unit"
      frequency: "operation or billing interval"
      temporal_coverage: "complete crop year"
      site_scope: "orchard block and contractor"
      aggregation_rule: "allocate by operation and normalize to accepted output"
      quality_evidence: "invoice, meter, equipment log"
    - protocol_id: cp_almond_harvest_records
      process_id: "almond_harvest_and_collection"
      flow_role: "harvested crop and losses"
      record_type: "harvest ticket and receiving record"
      raw_fields: "block; cultivar; harvest pass; date; gross mass; moisture; hull condition; rejected mass; loss; destination"
      collection_method: "calibrated scale and harvest log"
      unit: "kg and moisture fraction"
      frequency: "each harvest pass"
      temporal_coverage: "full crop year"
      site_scope: "each block and receiving point"
      aggregation_rule: "reconcile harvested crop, losses, and receiving mass"
      quality_evidence: "scale calibration, tickets, moisture record"
    - protocol_id: cp_almond_conditioning_records
      process_id: "almond_hulling_drying_and_grading"
      flow_role: "accepted output, hulls, rejects, energy, water, and packaging"
      record_type: "campaign, batch, and grade record"
      raw_fields: "input mass; moisture; hulling date; drying energy; water; grade; accepted mass; hull mass; reject mass; fate; package"
      collection_method: "receiving scale, batch sheet, meters, grade record, dispatch record"
      unit: "kg, moisture fraction, kWh, MJ, m3, item"
      frequency: "batch or campaign"
      temporal_coverage: "crop year and declared gate period"
      site_scope: "huller or conditioning facility"
      aggregation_rule: "reconcile input to accepted, hull, reject, and loss outputs"
      quality_evidence: "calibrated scales, meter records, grade certificates, dispatch and fate records"
  calculation_rules:
    - id: calculate_accepted_yield
      applies_to: "orchard and reference product"
      rule: "accepted in-shell mass / represented orchard area, with accepted fraction reported separately"
      inputs:
        - cp_almond_harvest_records
        - cp_almond_conditioning_records
      output: "kg accepted almonds/ha and accepted fraction"
      source_ids:
        - mass-balance-identity
    - id: annualize_almond_orchard_life
      applies_to: "establishment and replacement inputs"
      rule: "attributable lifecycle input / declared lifetime accepted in-shell output using age-specific records or a documented yield curve"
      inputs:
        - cp_almond_orchard_lifecycle_records
        - cp_almond_harvest_records
      output: "annualized input per kg reference product"
      source_ids:
        - iso-14067
        - fao-crop-production-methodology
    - id: calculate_irrigation_and_withdrawal
      applies_to: "irrigation"
      rule: "source-specific delivered irrigation and withdrawal / accepted output; report consumption or footprint separately"
      inputs:
        - cp_almond_irrigation_records
        - cp_almond_harvest_records
      output: "m3/kg reference product and source-specific withdrawal"
      source_ids:
        - almond-board-irrigation-continuum
        - almond-board-water-quality
    - id: calculate_direct_soil_emissions
      applies_to: "nutrient and residue emissions"
      rule: "apply the selected IPCC method tier to declared nutrient and residue records and convert N2O-N to N2O by 44/28 where applicable"
      inputs:
        - cp_almond_orchard_input_records
        - "declared factors"
      output: "kg emissions/kg reference product"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: reconcile_almond_outputs
      applies_to: "harvest and conditioning"
      rule: "accepted in-shell almonds + marketed hulls + rejects + measured losses = declared conditioning inputs within the stated tolerance"
      inputs:
        - cp_almond_harvest_records
        - cp_almond_conditioning_records
      output: "mass balance and unexplained residual"
      source_ids:
        - mass-balance-identity
    - id: allocate_hull_co_product
      applies_to: "marketed hulls"
      rule: "apply subdivision and mass allocation only after the hull output and destination are evidenced"
      inputs:
        - cp_almond_conditioning_records
      output: "allocated burdens for accepted almonds and hulls"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and outputs"
      requirement: "Declare the verified reference flow UUID, cultivar, shell type, geography, orchard block or contributing sites, crop year, gate, moisture, grade, and packaging state."
      evidence: "dataset metadata, orchard and grade records"
    - id: dq_temporal_representativeness
      applies_to: "perennial production"
      requirement: "Cover a complete crop year and disclose orchard age, productive status, establishment, replacements, and reporting period. Use a documented multi-year average when claiming multi-year representativeness."
      evidence: "dated orchard, harvest, and asset records"
    - id: dq_site_aggregation
      applies_to: "multiple blocks or sites"
      requirement: "Identify every contributing block or facility, link its inputs and outputs to the common boundary, disclose weights and representativeness, and prevent double counting."
      evidence: "site register, block records, aggregation workbook"
    - id: dq_mass_balance
      applies_to: "harvest and conditioning"
      requirement: "Reconcile received crop, accepted almonds, hulls, rejects, and losses; retain tare, moisture basis, scale calibration, and residual explanation."
      evidence: "scale records, moisture tests, batch and fate records"
    - id: dq_input_completeness
      applies_to: "orchard and conditioning"
      requirement: "Quantify or justify zero or exclusion for planting material, nutrients, irrigation, crop protection, fuel, electricity, drying, hulling, grading, packaging, direct emissions, and waste treatment when in scope."
      evidence: "ledgers, labels, meters, invoices, logs"
    - id: dq_quality_attributes
      applies_to: "accepted in-shell output"
      requirement: "Retain shell type, size or grade, moisture, kernel defect basis, foreign material, and well-dried or equivalent quality evidence."
      evidence: "grade certificate, inspection, moisture and lot records"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Confirm one 1,000 kg reference flow uses 774866bc-5c13-4def-a264-05a61a532a3e, Mass, kg, and all required qualifiers."
    source_ids:
      - usda-almonds-in-shell-grade-2013
  - rule_id: validation_scope_and_handoff
    applies_to: "process map"
    rule: "Confirm orchard management, independent harvest and collection, hulling, drying where used, cleaning, grading, and the declared gate are represented without shelling or kernel processing."
    source_ids:
      - usda-almond-commercial-storage
      - usda-almonds-in-shell-grade-2013
  - rule_id: validation_perennial_periods
    applies_to: "orchard lifecycle"
    rule: "Confirm establishment, immature years, productive years, replacement events, termination or removal, and annualization are declared and not double counted."
    source_ids:
      - iso-14067
      - fao-crop-production-methodology
  - rule_id: validation_site_aggregation
    applies_to: "multiple sites or blocks"
    rule: "Confirm every contributing block has a boundary, evidence link, weight, and representativeness decision; reject an aggregate with omitted or duplicated contributors."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_outputs_and_attribution
    applies_to: "accepted almonds and hulls"
    rule: "Confirm intended outputs and hand-offs are complete, marketed hulls use the declared allocation rule, and hulls or rejects are not counted at two hand-offs."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: validation_mass_balance
    applies_to: "harvest and conditioning"
    rule: "Confirm accepted almonds, hulls, rejects, and losses reconcile to declared input mass within the stated tolerance and every non-reference output has a fate."
    source_ids:
      - usda-almonds-in-shell-grade-2013
      - mass-balance-identity
  - rule_id: validation_nitrogen_and_water
    applies_to: "nutrient, emissions, and water"
    rule: "Confirm product mass differs from nutrient mass, emission factors and units are declared, and delivered irrigation is not confused with natural withdrawal or consumption."
    source_ids:
      - ipcc-2019-managed-soils-n2o
      - almond-board-water-quality
  - rule_id: validation_quality_attributes
    applies_to: "accepted output"
    rule: "Confirm shell type, size or grade, moisture, defect basis, foreign material, and well-dried or equivalent quality evidence are present."
    source_ids:
      - usda-almonds-in-shell-grade-2013
  - rule_id: validation_completeness
    applies_to: "data package"
    rule: "Confirm each required input and output category has a value, justified zero, or documented exclusion, and unresolved identity findings are visible."
    source_ids:
      - fao-crop-production-methodology
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Farm- or huller-gate in-shell almond supply matching the declared cultivar or shell type, geography, orchard-age profile, crop year or averaging period, conditioning route, grade, moisture, and gate"
  excluded_use: "Shelled almonds; kernels; roasted, blanched, salted, milled, oiled, beverage, confectionery, or other processed almond products; nursery production; shelling; retail and consumer use"
  required_metadata: "verified reference flow and property/unit identities; contributing orchards and facilities; cultivar and shell type; geography; orchard age and life; irrigation; nutrient and crop-protection basis; harvest and hulling records; accepted, hull, reject, and loss basis; moisture; grade; gate; Flow Set selections and final UUID resolution; allocation; protocol coverage"
  required_quality_disclosure: "crop years; primary-record coverage; site aggregation and weights; mass-balance tolerance; scale and meter calibration; water source; factors; hull destination; exclusions; uncertainty and sensitivity"
  update_trigger: "material change in cultivar or shell type, orchard route, irrigation source, age model, yield, hulling or drying technology, grade basis, hull destination, gate, background datasets, emission method, or representativeness period"
