system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary runs from the declared orchard starting condition through orchard management, harvest and collection, hulling, drying where used, cleaning, grading, and the declared hand-off of accepted almonds in shell. Upstream production of planting material, fertilizers, crop-protection products, supplied water, energy carriers, machinery services, and packaging uses representative background datasets. Shelling, kernel processing, roasting, retail packaging, off-gate transport, storage, and use are outside the default boundary."
      source_ids: []
    - rule_id: boundary_orchard_to_accepted_in_shell
      applies_to: "all conforming datasets"
      rule: "Include establishment, immature years, productive orchard management, harvest, collection, hulling, drying where used, cleaning, grading, and the declared accepted in-shell hand-off."
      source_ids:
        - fao-crop-production-methodology
        - usda-almonds-in-shell-grade-2013
    - rule_id: boundary_perennial_orchard_disclosure
      applies_to: "establishment and replacement"
      rule: "Allocate establishment, immature years, replacement trees, and removal over the declared orchard-life and accepted-output basis; disclose the life, non-bearing years, and replacement events."
      source_ids:
        - iso-14067
        - fao-crop-production-methodology
    - rule_id: boundary_hulling_not_shelling
      applies_to: "hulling and downstream processing"
      rule: "Include removal of the outer hull and preparation of the retained-shell nut. Exclude shelling, kernel separation, kernel processing, and shelling co-products because they belong to a downstream shelled-almond route."
      source_ids:
        - usda-almond-commercial-storage
        - usda-almonds-in-shell-grade-2013
    - rule_id: boundary_input_completeness
      applies_to: "orchard and conditioning"
      rule: "Provide a collected value, justified zero, or documented exclusion for planting material, nutrients, irrigation, crop protection, land, fuel, electricity, drying, hulling, grading, packaging, direct emissions, and waste treatment when in scope."
      source_ids:
        - almond-board-irrigation-continuum
        - ipcc-2019-managed-soils-n2o
    - rule_id: boundary_quality_and_fate
      applies_to: "all outputs"
      rule: "Separate accepted in-shell almonds, almond hulls, downgraded or rejected almonds, foreign material, dust, and unexplained loss by measured mass and declared fate."
      source_ids:
        - usda-almonds-in-shell-grade-2013
        - mass-balance-identity
boundary_abstraction:
  declared_starting_condition: "orchard site before or at establishment, with planting material and purchased management inputs crossing the foreground boundary; prior land use and existing orchard history are disclosed"
  starting_condition_role: "start of managed perennial almond production and orchard asset accounting"
  product_classification_scope: "CPC 3.0 01371, Almonds, in shell; shelled almonds and processed almond products are outside this PCR"
  recursive_input_rule: "Same-category planting material or retained almonds crossing the boundary are recorded as upstream inputs and are not recursively expanded into another in-shell product output. Internal hand-offs between orchard, harvest, and hulling remain process links and are not additional market outputs."
  upstream_dataset_requirement: "Use representative upstream datasets for nursery trees, nutrient products, crop protection, irrigation supply, fuel, electricity, drying energy, packaging, machinery services, and waste treatment when these inputs cross the boundary."
  disclosure: "cultivar and shell type; orchard block and site; establishment year, orchard age, productive life, and replacements; land history; soil and climate; irrigation source and quality; nutrient and crop-protection records; harvest timing and mass; hulling, drying, grading, accepted output, hulls, rejects, losses, fate, and gate"
