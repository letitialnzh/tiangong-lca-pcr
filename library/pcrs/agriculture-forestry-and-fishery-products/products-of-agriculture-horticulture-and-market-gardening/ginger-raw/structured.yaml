      - mass-balance-identity
  - rule_id: validate_raw_state
    applies_to: "scope"
    rule: "Fail if accepted output is peeled, cured, dried, sliced, powdered, preserved or extracted."
    source_ids:
      - codex-cxs-218-1999
      - fao-ginger-postharvest-compendium
  - rule_id: validate_parent_delta
    applies_to: "routes"
    rule: "Require the field parent and changed inventory categories for irrigation, lifting and washing alternatives."
    source_ids:
      - aicrps-ginger-package
      - icar-ccari-ginger
  - rule_id: validate_route_exclusion
    applies_to: "alternatives"
    rule: "Require one actual route per lot and prevent mutually exclusive burden double counting."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_nutrient_card
    applies_to: "field"
    rule: "Require at most one consolidated nutrient Product input bound only to set 0.3.0 without group; actual products stay separate in collection."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_process_links
    applies_to: "graph"
    rule: "Require cycle, harvest-lot, conditioning-batch and grading-batch links and matching hand-offs."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_batch_attribution
    applies_to: "runs"
    rule: "Index inputs, outputs, cleaning and changeover to a run/period and prevent duplicate shared burdens."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_washing
    applies_to: "conditioning"
    rule: "Washed lots require water, prepared mass and effluent; unwashed lots require zero washing inputs and declared dry handling."
