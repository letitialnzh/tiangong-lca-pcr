allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "foreground system"
    rule: "Prefer subdivision and direct measurement by field, crop cycle, harvest lot and handling batch."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_cycle
    applies_to: "field inputs"
    rule: "Attribute all inputs to the represented crop cycle before normalization; allocate shared records by measured area-time or another causal driver."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_run
    applies_to: "runs and changeovers"
    rule: "Link inputs, outputs, cleaning and changeover to one run or period; allocate each shared event once and prevent duplicate downstream charging."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_routes
    applies_to: "alternatives"
    rule: "Apply route deltas only to lots using them; do not combine mutually exclusive route burdens."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_downgrade
    applies_to: "downgraded product"
    rule: "Keep marketable downgrade as a separate product; after subdivision, declare physical or economic allocation and sensitivity."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_reject
    applies_to: "rejects and rework"
    rule: "Re-washed material retains prior burdens and gains only incremental burdens; accepted output excludes unresolved rejects and final treatment follows the declared route."
    source_ids:
      - mass-balance-identity
