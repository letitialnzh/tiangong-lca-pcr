  - rule_id: validate_grades
    applies_to: "grading"
    rule: "Require accepted plus downgraded or rejected state, and a hand-off for each state."
    source_ids:
      - codex-cxs-218-1999
  - rule_id: validate_rework
    applies_to: "rework"
