allocation_rules:
  - rule_id: allocation_avoid_subdivision
    applies_to: "field, conditioning, storage, and delivery processes"
    rule: "Avoid allocation by separately recording production, conditioning, treatment, packaging, storage, rejects, and fate-specific handling whenever the route can be subdivided."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_intended_outputs
    applies_to: "intentional product outputs"
    rule: "If residue, downgraded seed, or another stream is intentionally sold or transferred as a product, identify its destination and apply a declared attribution method only after product status is evidenced."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_seed_quality
    applies_to: "accepted seed and downgraded lots"
    rule: "Do not allocate seed-quality burdens to commodity barley or a downgraded stream unless the alternate output is intentionally produced, separately identified, and included in the declared gate."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_fallback
    applies_to: "multiple intended outputs"
    rule: "If subdivision is not possible, use a declared mass, physical-property, economic, or other defensible method, disclose the rationale, and test a materially different method as sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_reject_fate
    applies_to: "rejects, residues, waste, and storage losses"
    rule: "Keep field residue, conditioning rejects, packaging waste, storage losses, recovery, and disposal distinct; do not credit displaced product without destination and substitution evidence."
    source_ids:
      - mass-balance-identity
