  calculation_rules:
    - id: normalize_to_accepted_seed
      applies_to: "all foreground rows"
      rule: "Divide each measured or calculated amount by net accepted seed at the same declared gate and moisture basis."
      inputs:
        - "input records"
        - "accepted seed records"
      output: "amount per 1 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: convert_seed_moisture_basis
      applies_to: "harvest, conditioning, storage, delivery"
      rule: "Convert only from recorded mass and moisture using an explicit dry-matter and water-mass equation."
      inputs:
        - harvest
        - receiving
        - quality
        - "delivery records"
      output: "declared-basis mass"
      source_ids:
        - mass-balance-identity
        - usda-seed-cleaning-handling
    - id: calculate_seed_conditioning_yield
      applies_to: "conditioning output"
      rule: "Accepted seed mass divided by received harvested seed-crop mass, retaining rejects, moisture change, and unexplained fraction separately."
      inputs:
        - "conditioning input"
        - "accepted mass"
        - "reject records"
      output: "yield, reject fraction, unexplained fraction"
      source_ids:
        - usda-seed-cleaning-handling
        - mass-balance-identity
    - id: calculate_land_occupation
      applies_to: "land occupation"
      rule: "Planted area multiplied by declared crop-cycle occupation and normalized to accepted seed."
      inputs:
        - "land records"
        - "accepted seed mass"
      output: "area-time per reference flow"
      source_ids:
        - ipcc-2019-cropland
    - id: calculate_water_withdrawal
      applies_to: "water withdrawal"
      rule: "Convert metered volume where needed and keep source withdrawal separate from delivered irrigation."
      inputs:
        - "irrigation records"
      output: "resource withdrawal per reference flow"
      source_ids:
        - ipcc-2019-cropland
    - id: calculate_managed_soil_emissions
      applies_to: "nitrogen emissions"
      rule: "Apply the selected method tier to nutrient inputs and declared soil, climate, and management context; disclose species conversion."
      inputs:
        - "nutrient records"
        - "method factors"
      output: "species-specific emissions"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calculate_field_energy_emissions
      applies_to: "field energy"
      rule: "Multiply recorded fuel or energy by the declared factor and normalize to accepted seed."
      inputs:
        - "field energy"
        - factor
      output: "field-energy emissions"
      source_ids:
        - ipcc-2019-cropland
    - id: calculate_conditioning_energy_emissions
      applies_to: "conditioning energy"
      rule: "Multiply recorded conditioning fuel or energy by the declared factor and normalize."
      inputs:
        - "conditioning energy"
        - factor
      output: "conditioning emissions"
      source_ids:
        - usda-seed-cleaning-handling
    - id: calculate_storage_delivery_emissions
      applies_to: "storage and delivery"
      rule: "Apply declared factors to included storage and delivery energy and normalize to the declared gate."
      inputs:
        - "storage energy"
        - "transport records"
        - factors
      output: "storage and delivery emissions"
      source_ids:
        - mass-balance-identity
    - id: reconcile_field_outputs
      applies_to: "field production"
      rule: "Reconcile harvested seed crop, residue, field waste, and documented loss to field records on a declared moisture basis."
      inputs:
        - harvest
        - residue
        - "waste records"
      output: "field output balance"
      source_ids:
        - mass-balance-identity
    - id: reconcile_conditioning_outputs
      applies_to: "conditioning"
      rule: "Reconcile received mass and moisture to accepted seed, screenings, rejects, dust, packaging waste, and documented loss."
      inputs:
        - "conditioning input"
        - "accepted seed"
        - "reject records"
      output: "conditioning balance"
      source_ids:
        - mass-balance-identity
        - usda-seed-cleaning-handling
    - id: reconcile_storage_outputs
      applies_to: "storage"
      rule: "Reconcile stored mass to delivered seed, storage loss, and closing inventory for the declared period."
      inputs:
        - storage
        - delivery
        - "loss records"
      output: "storage balance"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_seed_identity
      applies_to: "reference product and source lots"
      requirement: "Declare barley variety or type, seed class, treatment status, moisture basis, physical purity, germination or viability, and lot identity."
      evidence: "certificate, lot record, quality test"
    - id: dq_mass_records
      applies_to: "all mass rows"
      requirement: "Every mass identifies date, site or batch, unit, moisture basis where relevant, and measurement device or source record."
      evidence: "calibration, weighbridge ticket, batch sheet"
    - id: dq_temporal_coverage
      applies_to: "crop-cycle and storage data"
      requirement: "Cover the declared crop cycle and storage period and disclose single-season or multi-season aggregation."
      evidence: "dated field, input, harvest, storage, release records"
    - id: dq_input_completeness
      applies_to: "field and conditioning inputs"
      requirement: "Quantify or justify zero or exclusion for source seed, nutrients, crop protection, irrigation, land, energy, treatment, packaging, storage, and direct emissions when in scope."
      evidence: "ledgers, labels, meters, logs, invoices"
    - id: dq_quality_release
      applies_to: "accepted seed output"
      requirement: "Retain lot-release basis, quality test method, moisture, purity, germination or viability, treatment status, packaging state, and gate."
      evidence: "test, certificate, release record"
    - id: dq_reject_and_fate
      applies_to: "rejects, residues, waste, storage loss"
      requirement: "Every non-reference stream has measured or reconciled mass and declared destination; product status is not inferred from a name."
      evidence: "reject log, residue, dispatch, treatment, or disposal record"
    - id: dq_mass_balance
      applies_to: "all processes"
      requirement: "Reconcile field, conditioning, and storage outputs on a declared moisture basis and disclose unexplained fractions."
      evidence: "scale records, batch sheets, inventory reconciliation"
    - id: dq_binding_coordinate
      applies_to: "fixed and parameterized rows"
      requirement: "Preserve flow type, direction, coordinate, property, unit, use context, and geography. A fixed binding requires a directly verified platform UUID."
      evidence: "identity record and Flow Set selection record"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Confirm the verified barley sowing-seed UUID, all qualifiers, moisture basis, and declared gate; the final exchange must retain that UUID."
    source_ids:
      - fao-seed-systems
      - mass-balance-identity
  - rule_id: validation_scope
    applies_to: "boundary"
    rule: "Confirm the dataset is barley seed for sowing and does not silently include non-seed barley, malting, food, feed, ethanol, or downstream cultivation."
    source_ids:
      - fao-seed-systems
  - rule_id: validation_process_map
    applies_to: "process inventory"
    rule: "Confirm multiplication, conditioning and quality release, and included storage or delivery are separate nodes with explicit hand-offs."
    source_ids:
      - fao-seed-systems
      - usda-seed-cleaning-handling
  - rule_id: validation_flow_coordinates
    applies_to: "inventory rows"
    rule: "Confirm every parameterized row matches its Flow Set flow type, direction, coordinate, group, property, unit, use context, and geography constraints."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_nutrients_and_emissions
    applies_to: "nutrients and soil emissions"
    rule: "Confirm nutrient product mass, nutrient mass, method tier, factors, species, unit, and conversion; no module supplies a factor or product fact."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_water_and_land
    applies_to: "irrigation, withdrawal, land"
    rule: "Keep delivered irrigation product input, natural water withdrawal, and land occupation distinct and prevent double counting."
    source_ids:
      - ipcc-2019-cropland
  - rule_id: validation_quality_release
    applies_to: "accepted seed"
    rule: "Confirm barley identity, seed class, quality attributes, treatment status, lot release, packaging state, moisture basis, and gate."
    source_ids:
      - fao-seed-systems
      - usda-seed-cleaning-handling
  - rule_id: validation_reject_fate
    applies_to: "rejects and waste"
    rule: "Confirm every rejected seed, screening, residue, dust, packaging waste, and storage loss has a fate; do not assign a product-input Flow Set to waste."
    source_ids:
      - usda-seed-cleaning-handling
      - mass-balance-identity
  - rule_id: validation_mass_balance
    applies_to: "all outputs"
    rule: "Confirm field, conditioning, and storage balances reconcile on a declared moisture basis and accepted seed is not counted at two hand-offs."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_allocation
    applies_to: "intentional co-products"
    rule: "Confirm any intentional co-product is separately identified, destination is evidenced, and allocation or substitution treatment is disclosed."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_module_boundary
    applies_to: "automatically selected modules"
    rule: "Apply module obligations as structure and checks only; modules do not supply product quantities, UUIDs, emission factors, or barley-specific facts."
    source_ids:
      - iso-14044-2006
