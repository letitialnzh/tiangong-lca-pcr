        - fao-seed-systems
        - fao-seeds
    - rule_id: boundary_gate_definition
      applies_to: "reference product"
      rule: "Use the seed plant or conditioning-facility gate by default. A delivered-seed gate requires storage or delivery records, losses, and gate hand-off."
      source_ids:
        - fao-seeds
        - mass-balance-identity
    - rule_id: boundary_seed_quality
      applies_to: "accepted seed"
      rule: "Include seed identity, grading, quality testing, treatment status, and lot acceptance when they determine whether the output is accepted barley sowing seed."
      source_ids:
        - fao-seed-systems
        - usda-seed-cleaning-handling
    - rule_id: boundary_input_completeness
      applies_to: "field and conditioning"
      rule: "Provide a collected value, justified zero, or documented exclusion for source seed, nutrients, crop protection, irrigation, field energy, land, conditioning energy, treatment, packaging, storage, and direct emissions when in scope."
      source_ids:
        - ipcc-2019-cropland
        - ipcc-2019-managed-soils-n2o
    - rule_id: boundary_output_separation
      applies_to: "all outputs"
      rule: "Separate accepted seed, harvested intermediate seed crop, screenings, rejected seed, dust, residues, packaging waste, storage losses, and unexplained loss by measured or reconciled mass and fate."
