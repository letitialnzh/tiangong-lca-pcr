system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground starts with managed *Ilex paraguariensis* stands and attributable establishment or replacement. It includes management inputs, field emissions, independent harvest, field-to-dryer movement, fresh receipt and first sorting, sapeco, drying, optional coarse breaking, post-dry grading, temporary storage and dispatch. Nursery plants, fertilizers, crop-protection products, energy carriers, water supply, external transport and treatment services require linked upstream datasets when supplied from outside. The boundary ends before aging, fine milling, blending, flavoring, retail packaging and distribution."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Biological production creates harvestable foliage; cutting is an independent harvest event with a measured fresh-lot hand-off. First conditioning removes foreign matter and damaged material from the collected state before sapeco. Sapeco is a bounded heat-treatment node converting raw prepared leaves to heat-treated leaves. Drying is a distinct stabilization node converting treated leaves to a dry storable state with water loss and heat inputs. Final grading assigns accepted, downgraded, and rejected states, each with a destination. Shared vehicles, boilers, dryers or buildings used by more than one lot, site or period need one documented attribution."
      source_ids: []
    - rule_id: boundary_01
      applies_to: "managed stand and harvest"
      rule: "Include represented stand management, actual inputs, direct field emissions and independently measured harvest; attribute establishment and replacement to represented production years."
      source_ids:
        - fao-yerba-mate-forest-products
        - chifarelli-2024-yerba-mate-lca
    - rule_id: boundary_02
      applies_to: "sapeco and drying"
      rule: "Include heat-treatment and drying fuel, electricity, material transfer, water loss, emissions and rejects up to the dry gate; keep each material state and operation distinct."
      source_ids:
        - iarc-mate-processing
        - chifarelli-2024-yerba-mate-lca
    - rule_id: boundary_03
      applies_to: "downstream gate"
      rule: "Declare any coarse breaking inside the gate; exclude aging, fine milling, blending and packaging unless separately reported with a new gate and output."
      source_ids:
        - iarc-mate-processing
    - rule_id: boundary_04
      applies_to: "multi-site and shared assets"
      rule: "List all supplying stands, dryers and other contributing sites, reconcile transfers and assign shared services once by an evidenced driver and service period."
      source_ids:
        - iso-14044-2006
