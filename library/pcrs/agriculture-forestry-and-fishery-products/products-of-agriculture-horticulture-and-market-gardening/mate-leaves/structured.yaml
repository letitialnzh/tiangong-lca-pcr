allocation_rules:
  - rule_id: allocation_01
    applies_to: "intended outputs"
    rule: "Enumerate accepted dry leaves and every independently sold fine-twig or lower-grade output with a single hand-off; residues and rejects are not automatically co-products."
    source_ids:
      - chifarelli-2024-yerba-mate-lca
  - rule_id: allocation_02
    applies_to: "multiple intended products"
    rule: "Prefer measured subdivision; if a process is inseparable, declare a programme-specific physical or other allocation method and rationale rather than assuming a universal split."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_03
    applies_to: "perennial phases"
    rule: "Link establishment, immature, productive, replacement and termination events to represented years and their outputs; assign each event once with declared service years."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_04
    applies_to: "shared sites and assets"
    rule: "Attribute vehicles, sapeco heat system, dryers, grader and storage once to consuming nodes, lots, sites and periods using logged time, throughput or other evidenced physical driver."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_05
    applies_to: "rejects and rework"
    rule: "Keep burdens with the producing lot until documented sale, recovery, treatment or disposal; rework cannot create a second accepted output or duplicate energy input."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_mate_site_year
      process_id: "mate_stand_management"
      flow_role: "perennial inputs and emissions"
      record_type: "field ledger and meters"
      raw_fields: "stand, phase, year, area, planting, fertilizer, crop protection, irrigation, fuel, electricity, shared driver"
      collection_method: "dated field log, invoice and calibrated meter"
      unit: "ha; year; kg; m3; L; kWh"
      frequency: "each event or month"
      temporal_coverage: "full represented year and attributable establishment"
      site_scope: "every supplying stand"
      aggregation_rule: "sum within site-year then output-weight across sites"
      quality_evidence: "map, invoice, calibration and activity log"
    - protocol_id: cp_mate_harvest_lot
      process_id: "mate_harvest"
      flow_role: "removed, collected and residual biomass"
      record_type: "harvest lot"
      raw_fields: "stand, date, collected mass, leaf/twig fraction, field residue, cutting fuel, receipt link"
      collection_method: "field tally and net scale"
      unit: "kg; L"
      frequency: "each harvest"
      temporal_coverage: "complete harvest season"
      site_scope: "every supplying block"
      aggregation_rule: "link once to receipt lot"
      quality_evidence: "scale ticket and traceable lot record"
    - protocol_id: cp_mate_processing_lot
      process_id: "mate_first_conditioning_mate_sapeco_mate_drying_mate_grade_gate"
      flow_role: "each material state, energy, grade, reject and gate"
      record_type: "processing and dispatch lot"
      raw_fields: "incoming lot, tare, weights and moisture by stage, fuel by type, electricity, dryer time, grades, rework, reject and buyer"
      collection_method: "paired scale, moisture sample, meter and dispatch record"
      unit: "kg; percent; MJ; L; kWh; h"
      frequency: "each lot and each rework event"
      temporal_coverage: "complete processing period"
      site_scope: "every included facility"
      aggregation_rule: "reconcile stage by stage, then mass-weight across sites"
      quality_evidence: "scale and moisture calibration, fuel invoice, meter log and destination receipt"
  calculation_rules:
    - id: calculation_01
      applies_to: "dry matter"
      rule: "dry matter kg = as-received kg × (1 − wet-basis moisture fraction); compare paired stage balances and separate evaporated water"
      inputs:
        - "lot mass and moisture"
      output: "stage dry-matter balance"
      source_ids:
        - iarc-mate-processing
    - id: calculation_02
      applies_to: "accepted output"
      rule: "fresh input = accepted dry product + intended co-products + rejects + measured water loss + other measured losses + investigated residual, on consistent basis"
      inputs:
        - "stage scale"
        - "composition and moisture"
      output: "reconciled processing lot"
      source_ids:
        - chifarelli-2024-yerba-mate-lca
    - id: calculation_03
      applies_to: "multi-site normalization"
      rule: "sum attributed site and process burdens divided by sum accepted dry reference mass; keep every site's numerator and denominator"
      inputs:
        - site-year
        - "lot and dispatch records"
      output: "amount per 1 kg dry maté"
      source_ids:
        - iso-14044-2006
    - id: calculation_04
      applies_to: "period and shared service"
      rule: "event burden × documented period and service-driver share; shares across all recipients must sum to one"
      inputs:
        - event
        - period
        - "asset and recipient logs"
      output: "attributable burden per lot"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: quality_01
      applies_to: "reference identity"
      requirement: "Verify an exact compatible dry maté product-flow UUID before active or published use."
      evidence: "confirmed Tiangong flow record and product specification"
    - id: quality_02
      applies_to: "site and period"
      requirement: "List all contributing stands, dryers, phases and crop years, with geographic and temporal representativeness and excluded units."
      evidence: "site register, field map and inclusion decision"
    - id: quality_03
      applies_to: "mass and grades"
      requirement: "Retain paired mass/moisture observations for fresh, treated, dried and dispatched states; trace intended grades, rejects and rework."
      evidence: "scale, moisture and destination records"
    - id: quality_04
      applies_to: "heat and shared assets"
      requirement: "Name sapeco and dryer fuel, energy meter, shared consumers, service period and attribution driver."
      evidence: "meter, fuel and equipment logs"
validation_rules:
  - rule_id: validation_01
    applies_to: "identity and gate"
    rule: "Accepted reference is dry unblended *Ilex paraguariensis* leaf material, with moisture, leaf/twig fraction, treatment route and primary-processing gate declared; exact UUID is required for active use."
    source_ids:
      - fao-yerba-mate-forest-products
      - iarc-mate-processing
  - rule_id: validation_02
    applies_to: "phase and sites"
    rule: "Each site-year, planting or replacement event and processing site links to a represented phase, harvest lot and output period exactly once."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_03
    applies_to: "material balance"
    rule: "Reconcile fresh, prepared, heat-treated, dried, accepted, downgraded, rejected and lost mass using measured moisture; investigate unexplained residuals."
    source_ids:
      - chifarelli-2024-yerba-mate-lca
  - rule_id: validation_04
    applies_to: "co-products and rework"
    rule: "A separately sold twig or lower grade needs mass, buyer and attribution decision; rejected material needs rework or exit and cannot count twice as accepted."
