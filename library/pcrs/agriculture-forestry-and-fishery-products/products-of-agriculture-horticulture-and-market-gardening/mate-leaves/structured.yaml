  - rule_id: validation_05
    applies_to: "shared services"
    rule: "Enumerate consumers and service periods for shared vehicles, heat system, dryer, grader and storage; assigned shares sum to one."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_06
    applies_to: "boundary extension"
    rule: "Aging, fine milling, blending and retail packaging, if reported, have distinct output states and boundaries and do not reuse the primary-processing reference amount."
    source_ids:
      - iarc-mate-processing
