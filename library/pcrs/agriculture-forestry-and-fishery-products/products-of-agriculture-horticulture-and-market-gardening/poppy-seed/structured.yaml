        - usu-seed-poppy
    - rule_id: food_route_condition
      applies_to: "Food-destination lots"
      rule: "Record operations limiting capsule-dust contamination and any needed later cleaning; European food-use advice is conditional, not a universal rule for unprocessed farm-gate seed."
      source_ids:
        - eu-poppy-2014
    - rule_id: route_delta
      applies_to: "Hand and combine harvest"
      rule: "Parent activity is capsule harvest and seed separation; technology changes energy input, seed-damage and dropped-seed loss records. A lot may have successive operations, but throughput is counted once."
      source_ids:
        - eu-poppy-2014
        - usu-seed-poppy
    - rule_id: conditioning_only_if_used
      applies_to: "Ventilation, drying, preliminary cleaning"
      rule: "Every raw-seed lot passes through this hand-off node; record before/after moisture, energy, rejected seed, captured capsule dust and other foreign material only when treatment occurs; direct hand-off has zero additional conditioning exchanges."
      source_ids:
        - eu-poppy-2014
