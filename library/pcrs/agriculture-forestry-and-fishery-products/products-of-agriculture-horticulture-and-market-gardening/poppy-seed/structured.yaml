allocation_rules:
  - rule_id: single_output_default
    applies_to: "Seed-only field"
    rule: "Capsule, straw and residues without separate collection or independent use remain field residue or waste, not invented co-products."
    source_ids:
      - eu-poppy-2014
  - rule_id: straw_coproduct
    applies_to: "Seed plus saleable capsule/straw"
    rule: "If capsules or straw are separately collected and transferred, record both product masses, moisture, destinations and hand-off points. Assign dedicated operations directly; allocate shared cultivation/harvest burdens by consistent dry mass and disclose choice and sensitivity. Latex is not seed."
    source_ids:
      - eu-poppy-2014
  - rule_id: run_linkage
    applies_to: "Harvest lot or combined operation"
    rule: "Link each input, output, cleaning and changeover event to a unique run; apportion cross-run shared fuel/electricity once by documented time or throughput, never twice."
    source_ids: []
