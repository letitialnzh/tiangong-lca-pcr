    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Harvest is a distinct node because it removes a recorded biological output. Nutmeg separation creates seed, mace and pericarp states. Conditioning receives a fresh lot and hands off a declared fresh or stabilized state. Grading creates accepted, downgraded and rejected destinations."
