allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "all shared operations"
    rule: "Subdivide route-specific and separately metered operations before allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_nutmeg_outputs
    applies_to: "nutmeg production/separation"
    rule: "Treat seed and mace as intended co-products. Allocate inseparable burdens by matched-period farm-gate economic value and report mass-allocation sensitivity. Pericarp receives burden only when deliberately sold or used."
    source_ids:
      - iso-14044-2006
      - fao-nutmeg-handling
  - rule_id: allocation_establishment
    applies_to: "perennial establishment"
    rule: "Across lifecycle phases, divide cohort establishment burden by actual cumulative saleable output; for incomplete lives use a documented forecast and update for mortality, replacement or termination. Never charge one cohort twice."
    source_ids:
      - cerutti-perennial-crops-2016
  - rule_id: allocation_batches
    applies_to: "conditioning/grading"
    rule: "Assign measured batch inputs directly; apportion shared run/changeover burden once by mass handled. Re-dried lots retain prior burden and receive additional re-drying burden."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rejects
    applies_to: "downgrade/rework/waste"
    rule: "Return rework to its producing lot; keep burden with downgraded saleable product under the chosen co-product rule; give waste no avoided credit in an attributional dataset."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment
      process_id: "stand_establishment"
      flow_role: "planting, nutrients, area, survival"
      record_type: "invoices and field logs"
      raw_fields: "cohort; crop; material type/count/mass; every nutrient product/composition/mass; area; mortality; replants; dates"
      collection_method: "reconcile purchases and field records"
      unit: "units; kg; ha"
      frequency: "every event"
      temporal_coverage: "full establishment/non-bearing phase"
      site_scope: "stand/cohort"
      aggregation_rule: "sum by event; retain product detail"
      quality_evidence: "invoices, labels, maps, counts"
    - protocol_id: cp_management
      process_id: "productive_management"
      flow_role: "annual inputs and emission drivers"
      record_type: "meters, invoices, application logs"
      raw_fields: "stand age/area; every nutrient product and N; water; protection product; fuels; electricity; residues; soil class"
      collection_method: "direct records or documented runtime factors"
      unit: "kg; m3; L; kWh; ha"
      frequency: "every event, annual aggregate"
      temporal_coverage: "full represented year"
      site_scope: "stand/route"
      aggregation_rule: "aggregate by ha-year; retain detail"
      quality_evidence: "invoices, labels, meter calibration"
    - protocol_id: cp_harvest
      process_id: "harvest_separation"
      flow_role: "harvest and separated states"
      record_type: "lot tickets and scales"
      raw_fields: "lot; crop; organ; date; area; input; seed; aril; capsules; residues; destination"
      collection_method: "weigh every lot/state"
      unit: "kg"
      frequency: "every lot"
      temporal_coverage: "all harvest rounds"
      site_scope: "stand/lot"
      aggregation_rule: "aggregate after mass balance"
      quality_evidence: "scale checks, tickets, receipts"
    - protocol_id: cp_conditioning
      process_id: "primary_conditioning"
      flow_role: "washing, energy, moisture, yield"
      record_type: "batch sheet and meters"
      raw_fields: "lot; method; input mass/moisture; water; energy carrier; time/temperature; output mass/moisture; rejects; re-drying"
      collection_method: "meter and weigh/test every batch"
      unit: "kg; m3; kWh; MJ; %"
      frequency: "every batch"
      temporal_coverage: "all conditioned lots"
      site_scope: "farm/unit"
      aggregation_rule: "reconcile input, output, reject and water loss"
      quality_evidence: "scale, moisture method, meters, batch log"
    - protocol_id: cp_dispatch
      process_id: "grading_dispatch"
      flow_role: "accepted/downgraded/reject"
      record_type: "grading and sales records"
      raw_fields: "lot; identity; state; moisture; grade; input; outputs; rework destination; price; gate/date"
      collection_method: "weigh and link each state"
      unit: "kg; currency/kg"
      frequency: "every lot"
      temporal_coverage: "all represented production"
      site_scope: "farm/lot"
      aggregation_rule: "reconcile, then normalize accepted output"
      quality_evidence: "scale, grade spec, invoice"
  calculation_rules:
    - id: calc_establishment_attribution
      applies_to: "establishment"
      rule: "cohort inventory × product allocation share / cumulative actual or forecast saleable lifetime output"
      inputs:
        - "cohort inputs"
        - area
        - survival
        - "productive years"
        - outputs
      output: "inventory/kg saleable output"
      source_ids:
        - cerutti-perennial-crops-2016
    - id: calc_soil_n2o
      applies_to: "managed soil"
      rule: "apply selected IPCC tier to collected synthetic, organic and residue N; convert N2O-N to N2O once using 44/28"
      inputs:
        - "N inputs"
        - "soil/climate and factors"
      output: "kg N2O with factor provenance"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_conditioning_balance
      applies_to: "conditioning"
      rule: "wet input = conditioned output + rejects + samples + moisture loss, all on consistent basis"
      inputs:
        - "masses and moisture"
      output: "reconciled yield/water loss"
      source_ids:
        - iisir-cardamom-2022
        - fao-nutmeg-handling
    - id: calc_nutmeg_allocation
      applies_to: "seed/mace"
      rule: "share = output mass × matched farm-gate price / total intended-output revenue; repeat by mass"
      inputs:
        - "saleable masses and prices"
      output: "shares summing to one"
      source_ids:
        - iso-14044-2006
    - id: calc_reference_normalization
      applies_to: "dataset"
      rule: "attributed inventory / accepted mass × 1,000"
      inputs:
        - "attributed inventory"
        - "accepted mass"
      output: "inventory/1,000 kg"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all records"
      requirement: "Preserve crop/species, organ, stand, harvest period, lot, moisture and route; mixed lots need measured composition."
      evidence: "maps, lot ledger, specification"
    - id: dq_temporal
      applies_to: "perennial phases"
      requirement: "Cover the full represented year and retain establishment history or remaining-life model."
      evidence: "cohort history and replacement plan"
    - id: dq_mass_balance
      applies_to: "separation/conditioning/grading"
      requirement: "Investigate unexplained difference above 5% of input rather than forcing closure."
      evidence: "calibrated weights and reconciliation"
    - id: dq_moisture
      applies_to: "fresh/dried conversion"
      requirement: "Use one documented moisture method and basis; record sampling time."
      evidence: "test and calibration record"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Include every nutrient product below the one card, energy carrier, co-product, downgrade, reject and field-emission driver."
      evidence: "invoices, logs, meters, receipts"
    - id: dq_representativeness
      applies_to: "aggregation"
      requirement: "Disclose geography, system, route, ages, intercropping and drying technology; justify farm aggregation."
      evidence: "sampling frame and weights"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Fail if crop/organ, state, moisture basis, grade, period, gate or route is missing, or accepted output is not exactly 1,000 kg."
    source_ids: []
  - rule_id: validate_route_exclusivity
    applies_to: "graph"
    rule: "Fail if nutmeg/cardamom or fresh/ambient/heated routes are silently averaged."
    source_ids:
      - fao-nutmeg-handling
      - iisir-cardamom-2022
  - rule_id: validate_period_attribution
    applies_to: "establishment"
    rule: "Fail if phase, stand age, replacement or termination treatment is absent or double counted."
    source_ids:
      - cerutti-perennial-crops-2016
  - rule_id: validate_output_set
    applies_to: "nutmeg separation"
    rule: "Fail unless seed, mace and pericarp destinations are declared and intended products allocated."
    source_ids:
      - fao-nutmeg-handling
  - rule_id: validate_batch_linkage
    applies_to: "harvest through dispatch"
    rule: "Fail if inputs, cleaning, outputs, re-drying or rejects lack a lot/batch/period link or shared burden is duplicated."
    source_ids: []
  - rule_id: validate_nutrient_cardinality
    applies_to: "each process"
    rule: "Fail if a process has more than one nutrient Product-input card, any nutrient group, or lacks individual actual-product collection for UUID resolution."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "separation/conditioning/grading"
    rule: "Fail when output states are not reconciled or rejects are accepted product."
    source_ids:
      - fao-nutmeg-handling
      - iisir-cardamom-2022
  - rule_id: validate_boundary
    applies_to: "downstream"
    rule: "Fail if grinding, extraction, commercial-kernel cracking, blending, fumigation or consumer packaging is included."
    source_ids:
      - fao-nutmeg-handling
published_dataset_profile:
  dataset_role: "foreground farm-gate dataset for one declared raw spice route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "lifecycle models needing raw nutmeg seed, mace aril or cardamom capsule supply at farm gate"
  excluded_use: "manufactured spice or undisclosed average across unrelated crop routes"
  required_metadata: "crop/species; organ; geography; system; stand age/phase; establishment attribution; intercropping; period; state/moisture; grade; allocation; conditioning; gate"
  required_quality_disclosure: "coverage; measured/estimated shares; mass balance; allocation shares and price period; range exceedances; unresolved UUIDs; gaps"
  update_trigger: "changed route/state/technology/life assumption/co-product destination/price relation; >10% change in yield, energy or nutrient intensity; new representative records"
