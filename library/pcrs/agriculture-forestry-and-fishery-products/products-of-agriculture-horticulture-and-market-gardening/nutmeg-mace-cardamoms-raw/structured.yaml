        - iisir-cardamom-2022
    - rule_id: boundary_perennial_phases
      applies_to: "establishment"
      rule: "Include establishment, non-bearing and productive phases; link replacement and termination to area and period."
      source_ids:
        - cerutti-perennial-crops-2016
        - spices-board-cardamom-cost-2021
    - rule_id: boundary_nutmeg_separation
      applies_to: "nutmeg route"
      rule: "Include fruit collection and seed/aril/pericarp separation before distinct hand-offs."
      source_ids:
        - fao-nutmeg-handling
    - rule_id: boundary_conditioning
      applies_to: "conditioning"
      rule: "Include washing, drying energy, moisture loss, rejects and re-drying before farm gate; omit for fresh direct dispatch."
      source_ids:
        - fao-nutmeg-handling
        - iisir-cardamom-2022
    - rule_id: boundary_manufacture_exclusion
      applies_to: "downstream"
      rule: "Exclude grinding, extraction, commercial-kernel cracking, blending, fumigation and consumer packaging."
      source_ids:
        - fao-nutmeg-handling
