system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground begins with planting material or a documented existing stand and ends at farm-gate dispatch. Include stand establishment/non-bearing phases, productive management, land-use change where applicable, water, energy, crop-protection and nutrient supply, direct field emissions, harvest, separation, pre-gate conditioning, grading, residues, rejects and material capital goods. Nursery and other supplied products remain upstream datasets."
