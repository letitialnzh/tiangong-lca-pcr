allocation_rules:
  - rule_id: allocation_01
    applies_to: "tree management and harvest with an intended hull output"
    rule: "Prefer process subdivision when tree, harvest, dehulling, hull collection, and nut records are independently available. When hull is deliberately collected and transferred as an intended co-product, allocate shared burdens by measured dry-matter mass; if dry-matter data are unavailable, use measured as-received mass and disclose the limitation."
    source_ids:
      - iso-14044-2006
      - fao-walnut-postharvest-operations
  - rule_id: allocation_02
    applies_to: "hull retained on site or discarded"
    rule: "If hull remains on the field, is composted without an intended product hand-off, or is discarded as residue, do not assign a co-product credit. Retain its mass and fate as residue or waste and assign shared burden to the intended in-shell walnut output."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_03
    applies_to: "premium, standard, and downgraded in-shell grades"
    rule: "Use physical mass allocation between mutually exclusive accepted grade outputs when common conditioning burdens cannot be subdivided. Grade-specific operations remain with the grade receiving them; do not allocate the same lot to both a grade row and an aggregate output row."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_04
    applies_to: "perennial tree periods and phases"
    rule: "Annualize establishment, immature years, replacement, intercropping attribution, and removal over the declared tree life and accepted output basis. Link every input and output to a crop year or lifecycle phase; do not count a replacement event in both the original and replacement tree phases."
    source_ids:
      - fao-walnut-sustainable-production-2023
      - iso-14044-2006
  - rule_id: allocation_05
    applies_to: "downgraded, reworked, rejected, and recovered lots"
    rule: "Keep rejected and downgraded lots separate from accepted product. Rework retains the producing-node burden and is linked once; recovered or intentionally marketed material requires a declared destination and allocation decision; discarded material receives its declared treatment burden."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: allocation_06
    applies_to: "batch, campaign, and changeover attribution"
    rule: "Link tree, harvest, conditioning, dehulling, grading, and storage inputs and outputs to the batch or campaign that generated them. Record cleaning and changeover events once and do not allocate shared-run burdens to more than one batch without a documented driver."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: allocation_rule_7
    applies_to: "foreground_burden_allocation"
    rule: "The hard shell remains part of the in-shell reference product and is not a separate co-product in this PCR. Kernel, oil, and shell-removal outputs belong to downstream walnut-product PCRs and must not be introduced into this inventory. No output may be counted both as a marketed hull co-product and as orchard or conditioning residue."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_walnut_orchard_lifecycle_records
      process_id: "walnut_orchard_establishment_and_management"
      flow_role: "tree asset, land, planting, replacement, intercropping, residue"
      record_type: "tree block and asset register"
      raw_fields: "block area; planting year; cultivar; tree count; replacement; removal; frond residue; tree phase; accepted output"
      collection_method: "block register, field log, and annual reconciliation"
      unit: "ha, item, kg, tree-year"
      frequency: "event and annual"
      temporal_coverage: "full declared tree life or documented representative period"
      site_scope: "every contributing tree block"
      aggregation_rule: "link block records to crop year and accepted output"
      quality_evidence: "signed field register, GIS or survey area, replacement evidence"
    - protocol_id: cp_walnut_orchard_input_records
