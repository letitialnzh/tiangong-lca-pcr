    - protocol_id: cp_walnut_storage_records
      process_id: "walnut_storage_and_gate_handoff"
      flow_role: "storage input, loss, packaging, gate output"
      record_type: "stock and dispatch ledger"
      raw_fields: "opening stock; receipts; lot; product state; moisture or freshness; storage duration; packaging; energy; damage; closing stock; dispatch mass; gate"
      collection_method: "stock ledger, dispatch ticket, and storage log"
      unit: "kg, %, days, kWh, item"
      frequency: "receipt, inspection, and dispatch"
      temporal_coverage: "declared storage period"
      site_scope: "each storage facility"
      aggregation_rule: "opening + receipts = dispatch + closing + loss"
      quality_evidence: "stock reconciliation, dispatch ticket, freshness or moisture and pest record"
  calculation_rules:
    - id: calc_01
      applies_to: "perennial tree inputs"
      rule: "Allocate tree establishment, immature years, replacement, intercropping share, and removal over the declared tree-life basis and accepted output by crop year."
      inputs:
        - "tree asset register"
        - "tree life"
        - "crop-year output"
        - "intercropping driver"
      output: "annualized tree input per reference flow"
      source_ids:
        - fao-walnut-sustainable-production-2023
        - iso-14044-2006
    - id: calc_02
      applies_to: "every harvest, conditioning, and storage lot"
      rule: "opening mass + inputs = accepted outputs + hull co-product + rejects + residues + measured losses; investigate any unexplained residual."
      inputs:
        - "lot weights and fates"
      output: "reconciled mass balance"
      source_ids:
        - mass-balance-identity
    - id: calc_03
      applies_to: "whole-fruit to dehulled lots"
      rule: "dehulled mass = whole-fruit input mass − measured hull and non-product losses; do not infer hull mass from an unrelated average when a lot record exists."
      inputs:
        - "input/output mass"
        - "hull record"
        - "loss record"
      output: "state- and fate-corrected product mass"
      source_ids:
        - mass-balance-identity
        - fao-walnut-postharvest-operations
    - id: calc_04
      applies_to: "marketed hull co-product"
      rule: "If hull is intended and transferred, apply measured dry-matter mass allocation to shared harvest and dehulling burdens; if not intended, model residue fate without co-product credit."
      inputs:
        - "walnut mass"
        - "hull mass"
        - "moisture or dry matter"
        - "declared destination"
      output: "allocated burdens and co-product share"
      source_ids:
        - iso-14044-2006
    - id: calc_05
      applies_to: "grades, downgraded, reworked, and rejected lots"
      rule: "Grade outputs must be mutually exclusive. Accepted output equals input less hull, declared downgraded, rework, reject, foreign-material, water-loss, and unexplained-loss terms; rework is linked once."
      inputs:
        - "batch input"
        - "grade and reject records"
      output: "normalized output rows"
      source_ids:
        - mass-balance-identity
    - id: calc_06
      applies_to: "storage"
      rule: "opening stock + receipts − dispatches − closing stock = measured storage loss; storage loss is not accepted gate output."
      inputs:
        - "stock ledger"
        - dispatches
        - "closing stock"
        - "loss records"
      output: "storage loss per storage duration"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: quality_01
      applies_to: "flow identity"
      requirement: "Use the verified Walnuts, in shell UUID with Mass and kg. Preserve the fresh farm-gate or explicitly extended-gate qualifier and do not substitute shelled, split, kernel, or water identities."
      evidence: "platform identity record; dataset metadata"
    - id: quality_02
      applies_to: "tree and harvest quantities"
      requirement: "Use calibrated scales, meters, or transparent documented estimates. Record a justified zero when a route does not use irrigation, wet cleaning, packaging, or storage."
      evidence: "calibration record; field and lot logs"
    - id: quality_03
      applies_to: "hull and product state"
      requirement: "Measure or document whole-fruit, dehulled-with-shell, and conditioned states separately. Retain hull moisture or dry-matter basis where allocation or conversion uses it."
      evidence: "batch record; scale; moisture or freshness test"
    - id: quality_04
      applies_to: "completeness"
      requirement: "Reconcile tree inputs, harvest outputs, hull destination, conditioning outputs, rejects, residues, water loss, storage loss, and gate dispatches."
      evidence: "mass-balance workbook; stock ledger"
    - id: quality_05
      applies_to: "temporal and perennial representativeness"
      requirement: "Cover the declared crop year and report tree phase, productive age, replacement events, intercropping, abnormal weather, and averaging method."
      evidence: "crop-year register; tree lifecycle record"
    - id: quality_06
      applies_to: "co-products and fate"
      requirement: "Evidence every intended hull hand-off, downgraded destination, rework loop, reject treatment, and residue fate. Do not assign credits to an unverified destination."
      evidence: "transfer note; destination record; treatment record"
    - id: quality_07
      applies_to: "geography and technology"
      requirement: "Disclose country, region, climate, soil, irrigation regime, harvest practice, dehulling method, grading method, storage condition, hull fate, and gate."
      evidence: "site description; process notes; facility record"
    - id: quality_08
      applies_to: "uncertainty and estimates"
      requirement: "Label provisional ranges as replaceable candidate-stage estimates and replace them with measured or source-backed values before reviewed or published use."
      evidence: "review record; updated foreground dataset"
validation_rules:
  - rule_id: validation_01
    applies_to: "reference flow"
    rule: "Reference product is the verified Walnuts, in shell UUID with Mass and kg. The dataset declares whole-fruit or extended dehulled gate state and does not substitute a shelled or split walnut."
    source_ids:
      - codex-walnut-hygiene-cxc-4-1971
  - rule_id: validation_02
    applies_to: "process map"
    rule: "Every required process is present; conditional dehulling, cleaning, grading, and storage processes are present when the declared gate or route requires them."
    source_ids:
      - fao-walnut-postharvest-operations
  - rule_id: validation_03
    applies_to: "perennial production"
    rule: "Tree establishment, immature years, productive phase, replacement, intercropping attribution, and removal are linked to declared crop years and are not double-counted."
    source_ids:
      - fao-walnut-sustainable-production-2023
      - iso-14044-2006
  - rule_id: validation_04
    applies_to: "harvest and collection"
    rule: "Harvested, collected, uncollected, damaged, residue, and accepted walnut masses are mutually reconciled; maturity and hand-off state are declared."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_05
    applies_to: "dehulling and quality"
    rule: "Whole-fruit input, hull, accepted in-shell product, grade, downgraded/rework, reject, foreign material, water loss, and residuals are mutually exclusive and mass-balanced."
    source_ids:
      - mass-balance-identity
      - fao-walnut-postharvest-operations
  - rule_id: validation_06
    applies_to: "storage and gate"
    rule: "Opening stock, receipts, dispatches, closing stock, storage damage, product state, storage duration, and gate output reconcile. Storage losses are excluded from accepted output."
    source_ids:
      - mass-balance-identity
      - fao-walnut-postharvest-operations
  - rule_id: validation_07
    applies_to: "allocation and rework"
    rule: "Hull allocation, grade allocation, downgraded routes, rework loops, rejected-material treatment, and any intercropping attribution are explicit and no burden or output is counted twice."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_08
    applies_to: "evidence and disclosure"
    rule: "All important quantitative flows have a foreground collection rule and candidate range or method constraint; estimates, unresolved identities, gate state, hull fate, and evidence limitations are disclosed."
    source_ids:
      - fao-walnut-postharvest-operations
      - mass-balance-identity
  - rule_id: validation_09
    applies_to: "batch and campaign records"
    rule: "Every harvest round, conditioning batch, grade lot, and storage receipt has a declared boundary, linked inputs and outputs, cleaning or changeover status, and reporting period; shared-run burdens are not counted twice."
    source_ids:
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "secondary_dataset for a reviewed walnut-in-shell foreground dataset; may be promoted to background_dataset only after the required review and publication gates"
  downstream_use: "Construction and validation of process and lifecyclemodel projections for walnuts in shell at the declared fresh farm-gate or extended dehulled, conditioned, or storage gate"
  allowed_use: "Tree management, harvest, collection, dehulling, cleaning, grading, storage, and gate modelling when the declared product state, hull status, maturity, quality, crop year, geography, and allocation treatment are retained"
  excluded_use: "Shell removal, splitting, kernel processing, oil extraction, roasted or otherwise processed walnut products, shell products, retail products, consumer use, post-gate logistics, and unreported product categories"
  required_metadata: "reference UUID; Mass property and Units of mass unit group; CPC 3.0 01376; cultivar; geography; tree phase and age; crop year; irrigation; maturity; whole-fruit or dehulled state; hull fate; shell and grade quality; accepted, rejected, residue, loss, and storage records"
  required_quality_disclosure: "measurement versus estimate; freshness or moisture method; mass-balance completeness; tree-life and intercropping allocation; hull co-product allocation; rework and reject fate; storage duration; data period; geography; technology; and unresolved identity gaps"
  update_trigger: "new crop-year records, material change in tree phase or replacement, change in harvest or dehulling technology, new intended hull route, changed storage practice, evidence-backed range replacement, or platform identity revision"
