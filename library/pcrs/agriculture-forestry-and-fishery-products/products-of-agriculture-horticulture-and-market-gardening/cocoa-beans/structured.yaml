system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary starts with the managed cacao stand and declared crop year or perennial phase. It includes attributable establishment and replacement, soil and nutrient management, crop protection, irrigation, field energy and direct field emissions, mature-pod harvest, and the hand-off of fresh pods or wet beans. When postharvest_extension is true, it also includes pod breaking, wet-bean extraction, fermentation, drying, cleaning, grading, storage and the declared post-harvest gate. Upstream production of planting material, fertilizer, crop-protection products, energy, water, treatment services and packaging uses compatible upstream datasets when they cross the foreground boundary."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "The reference gate is the platform's fresh, unprocessed farm-gate state. Fermented, dried and graded beans are downstream route states within the extended process map, not alternative meanings of the same reference UUID. The data package must state whether the farm-gate reference stops at wet-bean hand-off or whether a post-harvest extension is reported. Roasting, grinding, alkalization, pressing, cocoa liquor, cocoa butter, cocoa powder, chocolate, prepared foods, retail and consumer use are downstream and excluded."
      source_ids: []
    - rule_id: boundary_01
      applies_to: "managed production"
      rule: "Include the managed cacao stand, crop-year management, actual inputs, field emissions, harvest and production-to-harvest hand-off. Include establishment, replacement and termination only when attributable to represented years."
      source_ids:
        - fao-cocoa-production-guide
        - icco-global-cocoa-farming-systems
        - iso-14044-2006
    - rule_id: boundary_02
      applies_to: "reference gate"
      rule: "Treat Cocoa beans with Production mix, at farm gate and Fresh, unprocessed produce as the declared reference identity. Do not use the UUID for fermented, dried or graded bean states without a separate identity decision."
      source_ids:
        - iso-14044-2006
        - mass-balance-identity
    - rule_id: boundary_03
      applies_to: "pod breaking and fermentation"
      rule: "When extended, identify harvested pods, wet beans in pulp, pod husk, pulp/sweatings, batch, by-products, unreacted or spoiled material and drying hand-off."
      source_ids:
        - icco-cocoa-harvesting-post-harvest
        - fao-cocoa-ota-code
    - rule_id: boundary_04
      applies_to: "drying, grading and storage"
      rule: "Include drying/stabilization, cleaning, grade separation and pre-gate storage only when they cross the declared extension. Record energy, moisture, storage time, contamination controls and losses."
      source_ids:
        - icco-cocoa-processing
        - icco-cocoa-quality-requirements
    - rule_id: boundary_05
      applies_to: "upstream inputs"
      rule: "Treat purchased inputs, utilities, packaging, treatment and transport services as separately identified upstream inputs. Do not recurse into another cocoa PCR or silently use cocoa waste or paste as a bean input."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_06
      applies_to: "losses and rejects"
      rule: "Keep field losses, damaged pods, unextracted beans, spoiled or unfermented beans, drying losses, mouldy beans, dust, shells, storage losses and rejected lots in the foreground until a documented recovery, co-product, treatment or disposal hand-off exists."
      source_ids:
        - fao-cocoa-ota-code
        - icco-cocoa-quality-requirements
        - mass-balance-identity
boundary_abstraction:
  declared_starting_condition: "managed cacao stand at the declared perennial phase and crop-year start, with planting material and purchased management inputs crossing the foreground boundary"
  starting_condition_role: "perennial managed biological production condition"
  product_classification_scope: "CPC 3.0 01640, Cocoa beans; exact platform reference identity is fresh, unprocessed cocoa beans at farm gate"
  recursive_input_rule: "purchased cocoa beans entering post-harvest, blending or storage are separately identified lots and are not recursively traced through this PCR; cocoa paste, cocoa waste and downstream cocoa products are outside this category"
  upstream_dataset_requirement: "reviewed upstream datasets for planting material, fertilizers, crop protection, water, energy, treatment, packaging and transport services when they cross the declared boundary"
  disclosure: "block or supplier scope, crop year, cultivar group, production system, wet reference condition, extension flag, lot moisture, fermentation/drying records, quality grade, gate, storage, intended outputs, residues, rejects, wastewater and allocation decision"
