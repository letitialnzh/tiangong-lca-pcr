measurement_rules:
  - id: measurement_01
    applies_to: "all cocoa states"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record pods, wet beans in pulp, fermented wet beans, dried beans, graded beans, husk, pulp, sweatings, shells, rejects and losses on an as-received or dry-matter basis. Never mix wet and dry bases in one balance."
  - id: measurement_02
    applies_to: "reference and post-harvest conversion"
    required_property_ref:
      name: "mass and moisture"
      uuid: ""
    required_unit: "kg; percent wet basis"
    rule: "Measure moisture for every conversion-critical lot. Use dry-matter conservation only when sampling basis and moisture method are documented."
  - id: measurement_03
    applies_to: "perennial phases"
    required_property_ref:
      name: "area-time and crop-year identity"
      uuid: ""
    required_unit: "ha·year; crop year; phase"
    rule: "Link establishment, immature, productive, replacement and termination phases to the same block and represented crop years before annualizing."
  - id: measurement_04
    applies_to: "fermentation"
    required_property_ref:
      name: "batch and time"
      uuid: ""
    required_unit: "batch id; day; kg"
    rule: "Identify method, start/end, turning, batch mass, pulp drainage and drying hand-off. Do not add fresh beans to an active batch without a new batch link."
  - id: measurement_05
    applies_to: "drying and stabilization"
    required_property_ref:
      name: "mass, moisture, temperature and energy"
      uuid: ""
    required_unit: "kg; percent; °C; kWh, MJ, L or kg fuel"
    rule: "Record wet input, dry output, dryer/weather, operating time, carrier, final moisture and smoke or contamination controls."
  - id: measurement_06
    applies_to: "cleaning, grading and storage"
    required_property_ref:
      name: "mass and lot identity"
      uuid: ""
    required_unit: "kg; lot id; day"
    rule: "Keep accepted grade, downgraded grade, rejected lot, shell, dust, foreign material, storage loss and final hand-off separate."
  - id: measurement_07
    applies_to: "nutrients, crop protection and emissions"
    required_property_ref:
      name: "product and nutrient basis"
      uuid: ""
    required_unit: "kg product; kg nutrient; kg substance"
    rule: "Keep formulated product, nutrient or active-substance mass and emission-method inputs distinct; one method owns each pathway."
  - id: measurement_08
    applies_to: "services and utilities"
    required_property_ref:
      name: "carrier-specific property"
      uuid: ""
    required_unit: "kWh, MJ, L, kg, m3"
    rule: "Preserve carrier, equipment, run or batch and original unit. Convert only with a documented factor and allocate shared services once."
