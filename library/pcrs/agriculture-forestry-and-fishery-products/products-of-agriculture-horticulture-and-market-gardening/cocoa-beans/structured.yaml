                unit: "kg substance/kg dried input"
                basis: "broad dust-release interval; replace with capture records"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids: []
  - id: cocoa_storage_gate
    label: "Storage and declared gate hand-off"
    inputs:
