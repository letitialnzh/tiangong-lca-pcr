allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Sequential wet, fermented, dried and graded bean states are not co-products and receive no allocation between states. First subdivide by pod lot, fermentation batch, drying batch and grading lot. Record every intended output hand-off before applying allocation."
    source_ids: []
  - rule_id: allocation_01
    applies_to: "sequential cocoa states"
    rule: "Do not allocate burdens between wet, fermented wet, dried and graded beans; link them by mass and moisture balances."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_02
    applies_to: "pod breaking and fermentation"
    rule: "Treat pod husk, placenta, pulp and sweatings as residues by default. An intended co-product requires a named destination, quantity, quality specification and hand-off."
    source_ids:
      - icco-cocoa-harvesting-post-harvest
      - fao-cocoa-ota-code
  - rule_id: allocation_03
    applies_to: "intended co-products"
    rule: "Prefer subdivision. If intended outputs remain, use measured mass allocation for comparable material outputs; use an economic sensitivity when functions differ materially and retain price period and denominator."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_04
    applies_to: "rejects and downgrade"
    rule: "Do not allocate rejected beans to accepted cocoa output. A downgraded saleable lot requires its own intended-output hand-off; recovered material retains producing-node burden unless a documented recovery boundary exists."
    source_ids:
      - icco-cocoa-quality-requirements
      - fao-cocoa-ota-code
  - rule_id: allocation_05
    applies_to: "batches and perennial phases"
    rule: "Attach shared equipment, cleaning, changeover, drying platforms and plantation phase burdens to the generating run, crop year or phase exactly once."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_cocoa_perennial_phase_records
      process_id: "cocoa_managed_production"
      flow_role: "planting material, land occupation, perennial phases"
      record_type: "block register and planting/removal record"
      raw_fields: "block_id; area; cultivar; phase; tree_count; establishment_date; replacement_date; termination_date; crop_year"
      collection_method: "reconcile phase events and area to each represented cocoa block"
      unit: "ha; tree; date; kg reference output"
      frequency: "annual and event-based"
      temporal_coverage: "represented perennial phases and crop years"
      site_scope: "all included cocoa blocks"
      aggregation_rule: "annualize establishment, replacement and termination by block and represented year"
      quality_evidence: "block register; land record; phase review"
    - protocol_id: cp_cocoa_nutrient_records
      process_id: "cocoa_managed_production"
      flow_role: "nutrient and soil-amendment inputs"
      record_type: "invoice, field log and nutrient statement"
      raw_fields: "product; nutrient_content; quantity; date; block_id; purpose; supplier; reporting_basis"
      collection_method: "reconcile product quantities and nutrient content to each field event"
      unit: "kg product; kg nutrient; ha"
      frequency: "each application event"
      temporal_coverage: "complete represented crop year"
      site_scope: "all included cocoa blocks"
      aggregation_rule: "aggregate by product, nutrient, block and crop year without merging reporting bases"
      quality_evidence: "invoices; product labels; nutrient statements; field logs"
    - protocol_id: cp_cocoa_crop_protection_records
      process_id: "cocoa_managed_production"
      flow_role: "crop-protection products"
      record_type: "product record and application log"
      raw_fields: "product; active_substance; rate; quantity; date; block_id; target; method; operator"
      collection_method: "reconcile product identity, active substance and dose to each application"
      unit: "kg or L product; kg active substance; ha"
      frequency: "each application"
      temporal_coverage: "complete represented crop year"
      site_scope: "all included cocoa blocks"
      aggregation_rule: "aggregate by product, active substance, block and crop year"
      quality_evidence: "product label; application log; operator record"
    - protocol_id: cp_cocoa_water_records
      process_id: "cocoa_managed_production"
      flow_role: "irrigation, process water, recirculation and wastewater"
      record_type: "meter record, water invoice or documented estimate"
      raw_fields: "source; delivered_volume; withdrawal; meter_id; block_id; date; recirculation; discharge; quality"
      collection_method: "separate irrigation and post-harvest water and reconcile withdrawals to discharge"
      unit: "m3 water; kg pollutant where measured"
      frequency: "each event or meter period"
      temporal_coverage: "complete represented crop year and post-harvest route"
      site_scope: "included farm and post-harvest equipment"
      aggregation_rule: "aggregate by use, source, block or process and route; do not merge wastewater with supply"
      quality_evidence: "calibrated meter; invoice; water log; discharge record"
    - protocol_id: cp_cocoa_energy_records
      process_id: "cocoa_managed_production_and_post_harvest_route_processes"
      flow_role: "field, pod-opening, drying, grading and storage energy or service"
      record_type: "meter, invoice, fuel ticket or service log"
      raw_fields: "carrier; quantity; equipment; operation; run_id; batch_id; original_unit; service_scope"
      collection_method: "reconcile carrier use or service quantity to the generating run or batch"
      unit: "kWh; MJ; L fuel; service unit"
      frequency: "each run, batch or meter period"
      temporal_coverage: "complete represented crop year and included extension"
      site_scope: "all included field and post-harvest equipment"
      aggregation_rule: "aggregate by process and batch; allocate shared services once by documented driver"
      quality_evidence: "meter calibration; invoice; fuel ticket; service log"
    - protocol_id: cp_cocoa_emission_records
      process_id: "cocoa_managed_production_and_post_harvest_route_processes"
      flow_role: "managed-soil, residue, fermentation and combustion emissions"
      record_type: "emission-model record or measurement record"
      raw_fields: "activity; substance; method; factor_set; factor_version; medium; quantity; uncertainty"
      collection_method: "calculate or measure each pathway with one declared applicable method"
      unit: "kg substance; kg CO2e; ha; kg activity"
      frequency: "each event and calculation period"
      temporal_coverage: "complete represented crop year and included extension"
      site_scope: "all included field and post-harvest emission sources"
      aggregation_rule: "keep pathways separate and retain factor, activity basis and uncertainty"
      quality_evidence: "method citation; factor file; measurement report; model version"
    - protocol_id: cp_cocoa_harvest_lot_records
      process_id: "cocoa_pod_harvest"
      flow_role: "mature pod harvest, field loss and hand-off"
      record_type: "harvest lot ticket and field record"
      raw_fields: "block_id; crop_year; maturity; pod_mass; harvest_date; field_loss; receiver; lot_id"
      collection_method: "reconcile harvested pods, field losses and receiver hand-off for each lot"
      unit: "kg pods; kg loss; date; lot"
      frequency: "each harvest lot"
      temporal_coverage: "complete harvest season"
      site_scope: "all included cocoa blocks and receivers"
      aggregation_rule: "sum harvested pods, field losses and hand-offs by block, crop year and lot"
      quality_evidence: "lot ticket; field log; scale record; receiver evidence"
    - protocol_id: cp_cocoa_pod_extraction_records
      process_id: "cocoa_pod_breaking_extraction"
      flow_role: "pod input, wet beans, husk, placenta and rejects"
      record_type: "pod-opening run sheet and scale record"
      raw_fields: "run_id; pod_input; wet_bean_output; husk; placenta; reject_mass; equipment; operator; date"
      collection_method: "close the pod-input mass balance and record every destination per opening run"
      unit: "kg as received; kg wet beans; date; run"
      frequency: "each pod-opening run"
      temporal_coverage: "all included pod-breaking operations"
      site_scope: "included farm or post-harvest facility"
      aggregation_rule: "reconcile pod input to wet beans, husk, placenta, rejects and unexplained difference"
      quality_evidence: "calibrated scale; run sheet; destination ticket; mass-balance review"
    - protocol_id: cp_cocoa_fermentation_batch_records
      process_id: "cocoa_fermentation"
      flow_role: "wet-bean input, fermentation operation, drainage and fermented output"
      record_type: "fermentation batch log"
      raw_fields: "batch_id; input_mass; method; container; start_date; end_date; turns; temperature; drainage; output_mass; reject_mass"
      collection_method: "link wet-bean input, batch conditions, drainage, fermented output and rejects"
      unit: "kg wet beans; kg drainage; °C; days; date"
      frequency: "each fermentation batch and turn"
      temporal_coverage: "complete included fermentation route"
      site_scope: "all included fermentation containers"
      aggregation_rule: "aggregate by batch and link each output to its input lot without double counting"
      quality_evidence: "batch log; temperature record; turning record; drainage ticket; quality check"
    - protocol_id: cp_cocoa_drying_batch_records
      process_id: "cocoa_drying_stabilization"
      flow_role: "fermented wet input, drying energy, dried output and water loss"
      record_type: "drying log and moisture sample record"
      raw_fields: "batch_id; wet_input; method; platform_or_dryer; weather_or_fuel; start_time; end_time; temperature; moisture; output_mass; reject_mass"
      collection_method: "reconcile wet input, dry output and loss using documented moisture samples"
      unit: "kg wet input; kg dry beans; percent moisture; °C; days; MJ"
      frequency: "each drying batch and moisture sample"
      temporal_coverage: "complete included drying route"
      site_scope: "all included drying platforms and dryers"
      aggregation_rule: "calculate wet-to-dry balance per batch and preserve measured moisture basis"
      quality_evidence: "drying log; moisture test; fuel or weather record; smoke-control record"
    - protocol_id: cp_cocoa_grade_lot_records
      process_id: "cocoa_cleaning_grading"
      flow_role: "dried input, accepted grades, downgraded product, shell, dust and rejects"
      record_type: "inspection, grading and scale record"
      raw_fields: "lot_id; input_mass; grade; moisture; defects; accepted_mass; downgrade_mass; shell_mass; dust_mass; reject_mass; destination"
      collection_method: "enumerate every grade and material destination and reconcile the lot mass balance"
      unit: "kg; percent moisture; grade code; date"
      frequency: "each grading lot"
      temporal_coverage: "complete included cleaning and grading route"
      site_scope: "all included grading equipment and lots"
      aggregation_rule: "sum accepted grades, intended downgrade, residues and rejects separately by lot"
      quality_evidence: "inspection sheet; calibrated scale; moisture and defect record; destination evidence"
    - protocol_id: cp_cocoa_quality_records
      process_id: "cocoa_fermentation_and_cocoa_cleaning_grading"
      flow_role: "moisture, fermentation, mould, insects, foreign matter and grade decision"
      record_type: "laboratory or documented lot inspection record"
      raw_fields: "sample_id; lot_id; moisture; fermentation_index; mould; insects; foreign_matter; defect_class; grade_decision; method; coverage"
      collection_method: "retain sampling plan, analytical method, result and decision for each lot"
      unit: "percent; score; kg sample; date"
      frequency: "each lot and quality decision"
      temporal_coverage: "complete included fermentation, drying and grading route"
      site_scope: "all lots used for declared outputs"
      aggregation_rule: "link quality decisions to lot and route state; do not convert rejected material to accepted output"
      quality_evidence: "lab report; sampling plan; method version; inspector sign-off"
    - protocol_id: cp_cocoa_storage_records
      process_id: "cocoa_storage_gate"
      flow_role: "accepted dried beans, packaging, storage service, output and loss"
      record_type: "warehouse record and storage-period balance"
      raw_fields: "lot_id; opening_mass; packaging; warehouse; start_date; end_date; conditions; receipts; outputs; losses; closing_mass"
      collection_method: "reconcile opening stock, receipts, declared output and losses for each storage period"
      unit: "kg dried beans; kg loss; storage days; packaging unit"
      frequency: "each storage period and lot"
      temporal_coverage: "complete pre-gate storage period"
      site_scope: "all included warehouses and lots"
      aggregation_rule: "close the storage balance and assign shared handling once to the documented lot driver"
      quality_evidence: "warehouse log; scale record; condition log; packaging record"
    - protocol_id: cp_cocoa_residue_destination_records
      process_id: "route_wide_cocoa_processes"
      flow_role: "shell, pulp, sweatings, dust, rejects and other residues"
      record_type: "destination ticket, recovery record or treatment/disposal record"
      raw_fields: "residue_type; quantity; destination; receiver; intended_function; treatment; disposal; date; lot_id"
      collection_method: "document whether each material is a named co-product, recovery, retained residue or waste and record hand-off"
      unit: "kg material; destination code; date"
      frequency: "each residue event"
      temporal_coverage: "complete included route and storage period"
      site_scope: "all included field, processing and storage sites"
      aggregation_rule: "classify and aggregate each destination separately; keep undocumented destinations as unresolved"
      quality_evidence: "destination ticket; receiver evidence; treatment record; waste manifest"
