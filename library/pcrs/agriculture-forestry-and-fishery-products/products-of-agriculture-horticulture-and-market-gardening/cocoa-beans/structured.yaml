validation_rules:
  - rule_id: validation_01
    applies_to: "reference flow"
    rule: "Confirm UUID 3c54da37-f1ab-4b4c-8363-5c32b638005c, Mass property 93a60a56-a3c8-11da-a746-0800200b9a66 and Units of mass group 93a60a57-a4c8-11da-a746-0800200c9a66; retain farm-gate fresh/unprocessed metadata."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_02
    applies_to: "state identity"
    rule: "Reject use of the reference UUID for fermented, dried, graded, cocoa waste or cocoa paste material without a reviewed identity decision."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: validation_03
    applies_to: "process graph"
    rule: "Confirm declared hand-offs: production to harvest, pods to wet beans, wet beans to fermentation, fermentation to drying, drying to grading and grading to declared gate when those nodes are included."
    source_ids:
      - icco-cocoa-harvesting-post-harvest
      - fao-cocoa-ota-code
  - rule_id: validation_04
    applies_to: "mass balance"
    rule: "Reconcile each lot's inputs, accepted outputs, intended co-products, residues, rejects, storage losses and moisture-related water loss within measurement uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_05
    applies_to: "fermentation"
    rule: "Require batch id, dates, method, drainage, output hand-off and inspection evidence; unresolved off-spec routing blocks the extended route."
    source_ids:
      - fao-cocoa-ota-code
      - icco-cocoa-harvesting-post-harvest
  - rule_id: validation_06
    applies_to: "drying"
    rule: "Require method, input/output, final moisture and smoke or contamination control. Use 6–8% only as screening; measured lot moisture governs."
    source_ids:
      - icco-cocoa-processing
      - icco-cocoa-quality-requirements
  - rule_id: validation_07
    applies_to: "grades and rejects"
    rule: "Every accepted grade and intended downgrade has a hand-off; mouldy, broken, contaminated or off-spec material cannot be counted as accepted beans."
    source_ids:
      - fao-cocoa-production-guide
      - icco-cocoa-quality-requirements
  - rule_id: validation_08
    applies_to: "allocation"
    rule: "Confirm every intended output, residue destination and allocation denominator. Sequential states are not allocated against each other and shared burdens are not double-counted."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: validation_09
    applies_to: "data quality"
    rule: "Check crop-year coverage, lot completeness, moisture basis, protocol linkage, sources, method version and units for every important quantitative flow."
    source_ids:
      - iso-14044-2006
      - ipcc-2019-refinement-afolu
  - rule_id: validation_10
    applies_to: "boundary disclosure"
    rule: "Confirm the platform farm-gate reference, post-harvest extension flag, final gate, storage duration and excluded downstream cocoa products are declared."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "secondary_dataset for a reviewed foreground cocoa-bean route; background_dataset use requires separate review"
  downstream_use: "construction of process and lifecycle-model datasets for cultivated cocoa beans with explicit wet farm-gate or extended dried-gate state"
  allowed_use: "comparative or attributional LCA when geography, crop year, production system, state, moisture basis, route, grade, gate and allocation are compatible"
  excluded_use: "cocoa paste, liquor, butter, powder, chocolate, prepared foods, cocoa waste treatment, consumer products or dried-bean data omitting declared state conversion"
  required_metadata: "reference UUID; property and unit-group UUIDs; cultivar; geography; block/supplier; crop year; production system; wet reference condition; extension flag; fermentation/drying; moisture; grade; residues; rejects; storage; gate; allocation; uncertainty"
  required_quality_disclosure: "measured versus calculated values, coverage, sources, unresolved route UUIDs, range use, sampling basis, missing destinations and balance exceptions"
  update_trigger: "change in platform identity, state semantics, cultivation route, fermentation/drying technology, quality requirements, allocation rule, emission method or material range/boundary evidence"
