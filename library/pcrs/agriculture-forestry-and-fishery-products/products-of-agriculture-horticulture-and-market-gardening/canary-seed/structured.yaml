allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "field production and conditioning"
    rule: "Prefer separate records for field production and conditioning and separate measurement of grain, removed residue, screenings, and rejects before allocating shared burdens."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_retained_residue
    applies_to: "residues retained or incorporated"
    rule: "Do not treat retained residues as co-products; include their management and emissions in field production and prevent double counting with removed residue."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: allocation_removed_residue
    applies_to: "useful removed straw or chaff"
    rule: "If subdivision cannot resolve shared field burdens, apply economic allocation using contemporaneous farm-gate values; disclose moisture bases and test mass allocation as a sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_conditioning_outputs
    applies_to: "useful screenings and rejects"
    rule: "Treat an output with documented positive use as a co-product and disposal material as waste; use economic allocation at conditioning hand-off only when subdivision is infeasible."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_activity_records
      process_id: "canary_seed_field_production"
      flow_role: "seed, nutrients, irrigation, fuel, crop protection, land"
      record_type: "field log, invoice, application record, meter, or contractor record"
      raw_fields: "field_id; area; cultivar; input_product; amount; nutrient_content; date; operation; contractor_scope"
      collection_method: "reconcile physical inputs and operations to every represented field and crop cycle"
      unit: "kg; kg nutrient; L; m3; ha"
      frequency: "each event"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "sum by physical identity; calculate nutrients without merging products; normalize with same-cycle area and yield"
      quality_evidence: "invoices; labels; calibrated meters; field logs"
    - protocol_id: cp_harvest_output_records
      process_id: "canary_seed_field_production"
      flow_role: "grain and removed residue"
      record_type: "weighbridge, yield monitor, moisture test, bale record"
      raw_fields: "field_id; harvest_date; grain_mass; grain_moisture; impurity; residue_mass; residue_moisture; residue_fate; destination"
      collection_method: "reconcile accepted grain and each residue destination to field area and crop cycle"
      unit: "kg; percent; ha"
      frequency: "each harvest"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "sum accepted grain and each residue fate separately"
      quality_evidence: "scale or yield-monitor calibration; moisture tests; destination evidence"
    - protocol_id: cp_field_emission_activity
      process_id: "canary_seed_field_production"
      flow_role: "emissions to air and water"
      record_type: "nutrient, soil, weather, residue, drainage, and emission-model records"
      raw_fields: "fertilizer_N; organic_N; residue_N; application_method; soil; climate; drainage; factor_set; model_version"
      collection_method: "calculate each emission with one declared geographically applicable method"
      unit: "kg N; kg emission; ha"
      frequency: "each event and crop-cycle calculation"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "calculate per field, area-weight, then normalize by same-cycle yield"
      quality_evidence: "source records; factor provenance; model file; nitrogen-balance review"
    - protocol_id: cp_residue_and_waste_fate
      process_id: "canary_seed_field_production"
      flow_role: "retained and removed residues"
      record_type: "field residue log, bale ticket, burn or incorporation record"
      raw_fields: "field_id; residue_mass; dry_matter; fate; destination; date"
      collection_method: "link residue fate to the same harvest and field records used for yield"
      unit: "kg; percent; ha"
      frequency: "each field and harvest"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "sum by fate; exclude retained residue from co-product outputs"
      quality_evidence: "field records; destination receipts; residue calculation evidence"
    - protocol_id: cp_conditioning_records
      process_id: "canary_seed_grain_conditioning"
      flow_role: "incoming grain, energy, accepted grain, screenings, rejects"
      record_type: "batch ticket, scale, moisture test, electricity or heat meter, destination record"
      raw_fields: "batch_id; incoming_mass; incoming_moisture; electricity; heat; accepted_mass; accepted_moisture; screenings; rejects"
      collection_method: "reconcile matched conditioning batches and meters to accepted output"
      unit: "kg; percent; kWh; MJ"
      frequency: "each batch or meter period"
      temporal_coverage: "all pre-gate conditioning"
      site_scope: "all included equipment and batches"
      aggregation_rule: "sum matched batches; allocate shared meters by time or processed mass; close wet-mass balance"
      quality_evidence: "calibrated scales and moisture meters; meter reconciliation"
  calculation_rules:
    - id: calc_area_to_reference_flow
      applies_to: "field flows"
      rule: "crop-cycle amount per hectare / marketable grain yield per hectare × 1,000 kg"
      inputs:
        - "flow amount"
        - area
        - "same-cycle grain mass"
      output: "amount per 1,000 kg reference grain"
      source_ids: []
    - id: calc_nutrient_content
      applies_to: "fertilizer and amendment inputs"
      rule: "product mass × declared nutrient fraction; preserve N, P2O5, and K2O reporting bases"
      inputs:
        - "product identity"
        - mass
        - assay
        - "reporting basis"
      output: "nutrient amount by source"
      source_ids: []
    - id: calc_managed_soil_n2o
      applies_to: "soil N2O"
      rule: "apply selected IPCC tier or regional method to fertilizer N, organic N, returned-residue N, volatilization, and leaching pathways"
      inputs:
        - "nitrogen activity"
        - "residue fate"
        - "soil and climate"
        - factors
      output: "kg N2O by pathway"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_ammonia_volatilization
      applies_to: "ammonia to air"
      rule: "calculate by fertilizer type, application method, timing, and applicable factor"
      inputs:
        - "nitrogen product records"
        - "application details"
        - factors
      output: "kg NH3"
      source_ids:
        - emep-eea-2023-guidebook
    - id: calc_nitrate_loss
      applies_to: "nitrate to water"
      rule: "apply selected regional drainage or leaching method to nitrogen activity and hydrological records"
      inputs:
        - "nitrogen activity"
        - soil
        - drainage
        - climate
        - factors
      output: "kg NO3-"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_conditioning_mass_balance
      applies_to: "grain conditioning"
      rule: "incoming wet grain = accepted grain + useful screenings + rejects + moisture and other measured losses within uncertainty"
      inputs:
        - masses
        - moisture
        - "loss records"
      output: "reconciled outputs per accepted grain"
      source_ids:
        - mass-balance-identity
    - id: calc_moisture_adjustment
      applies_to: "grain and residue mass"
      rule: "convert between as-received and declared dry-matter bases using measured moisture; retain original and converted values"
      inputs:
        - mass
        - moisture
        - "target basis"
      output: "adjusted mass"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Confirm canary seed rather than wheat, rye, mixed cereal, or another bird-seed component; retain cultivar, intended use, state, and hand-off."
      evidence: "crop, lot, grade, and sales records"
    - id: dq_temporal_alignment
      applies_to: "all foreground rows"
      requirement: "Use inputs, harvest, yield, emissions, residue, and conditioning records from the same crop cycle; disclose proxy years."
      evidence: "dated field and batch records"
    - id: dq_mass_and_moisture
      applies_to: "grain, residue, and conditioning"
      requirement: "Retain scale or yield-monitor calibration and moisture measurements for every basis conversion."
      evidence: "calibration and moisture-test records"
    - id: dq_quality_and_impurity
      applies_to: "grain outputs"
      requirement: "Retain inspection or laboratory evidence for impurity, dockage, treated-seed status, variety, odour, damage, and intended-use quality."
      evidence: "grading or laboratory records"
    - id: dq_completeness
      applies_to: "process map and flows"
      requirement: "Reconcile every field and conditioning batch and distinguish zero, not applicable, proxy, and missing values."
      evidence: "field roster; batch reconciliation"
    - id: dq_identity_resolution
      applies_to: "parameterized and unmapped flows"
      requirement: "Resolve every Flow Set reference and unmapped physical exchange to a verified UUID before final TIDAS process publication."
      evidence: "identity review record"
validation_rules:
  - rule_id: validation_reference_output
    applies_to: "terminal output"
    rule: "Exactly one terminal canary seed grain output equals 1,000 kg after scaling, uses the fixed reference UUID, and declares moisture and quality qualifiers."
    source_ids: []
  - rule_id: validation_process_route
    applies_to: "process map"
    rule: "Include field production once; include conditioning only before farm-gate hand-off and avoid double counting embedded energy, incoming grain, or rejects."
    source_ids: []
  - rule_id: validation_crop_cycle_reconciliation
    applies_to: "field inventory"
    rule: "Area, inputs, harvest outputs, residue fates, and emissions refer to the same fields and crop cycle."
    source_ids: []
  - rule_id: validation_nitrogen_balance
    applies_to: "nitrogen inventory"
    rule: "Reconcile nutrient content, returned and removed residue nitrogen, and emission pathways with methods and factors disclosed."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validation_quality_state
    applies_to: "grain identity and output"
    rule: "State whether grain is gross harvested, cleaned, dried, or otherwise conditioned; keep impurity and moisture bases consistent with the declared reference state."
    source_ids:
      - cgc-canary-seed-grading-2026
  - rule_id: validation_conditioning_balance
    applies_to: "conditioning"
    rule: "Reconcile incoming grain with accepted grain, useful screenings, rejects, moisture loss, and other measured losses within uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_flow_identity
    applies_to: "every flow"
    rule: "Accept only exact verified UUIDs as fixed and applicable existing Flow Sets as parameterized; otherwise retain unmapped coverage."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground canary seed grain production dataset"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "farm-gate LCA of canary seed grain and downstream systems preserving declared geography, moisture, impurity, residue, allocation, and conditioning context"
  excluded_use: "certified seed, whole-crop forage or silage, milling, prepared bird feed, or another crop without reviewed proxy decision"
  required_metadata: "geography; cultivar or variety; crop year; area; yield; moisture; impurity; intended use; seeding; nutrients; crop protection; fuel; irrigation; residue fate; conditioning; allocation; identity resolution"
  required_quality_disclosure: "foreground coverage; proxy inputs; missing records; range exceedances; emission methods; meter and mass-balance reconciliations; grade or laboratory evidence"
  update_trigger: "new reviewed canary seed evidence, material route change, revised emission method, changed Flow Set or UUID identity, or representative data outside QA ranges"
