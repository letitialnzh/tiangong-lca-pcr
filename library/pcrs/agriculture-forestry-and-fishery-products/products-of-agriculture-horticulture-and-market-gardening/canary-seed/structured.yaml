system_boundary:
  rules:
    - rule_id: boundary_crop_cycle_to_farm_gate
      applies_to: "all conforming datasets"
      rule: "Include field preparation, seeding, crop management, harvest, and on-farm cleaning or drying performed before farm-gate hand-off."
      source_ids:
        - saskatchewan-canary-seed-guide
    - rule_id: boundary_direct_field_emissions
      applies_to: "managed soil and crop emissions"
      rule: "Include direct and indirect nitrogen-related emissions and relevant combustion or field emissions using geographically applicable methods and the same activity records used for nutrient and residue accounting."
      source_ids:
        - ipcc-2019-managed-soils
        - emep-eea-2023-guidebook
    - rule_id: boundary_residue_fate
      applies_to: "straw, chaff, and crop residues"
      rule: "Distinguish residues returned to soil, burned, removed as a useful co-product, and removed as waste; prevent double counting residue nitrogen and exported material."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: boundary_conditioning_gate
      applies_to: "optional conditioning"
      rule: "Include electricity, heat, incoming grain, accepted grain, screenings, rejects, and measured moisture loss only when cleaning or drying occurs before the declared farm-gate hand-off."
      source_ids:
        - cgc-canary-seed-grading-2026
        - mass-balance-identity
    - rule_id: boundary_post_farm_gate_exclusion
      applies_to: "downstream activities"
      rule: "Exclude off-farm transport, storage, milling, feed manufacture, food preparation, and use unless a study explicitly extends beyond this PCR."
      source_ids: []
