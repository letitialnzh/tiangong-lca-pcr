system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary starts with the managed tea plantation and its establishment or replacement records for the reporting period. It includes field inputs, land occupation, plantation maintenance, plucking, collection, green-leaf handling, selected primary-processing route, drying, grading, storage to the declared gate, process rejects, residues, direct emissions, wastewater where generated, and all allocation decisions required to reconcile the lot."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "The boundary ends when dry, graded tea crosses the declared primary-processing gate before packaging presentation, retail, downstream distribution, consumer brewing, or beverage preparation. Background datasets for electricity, fuels, fertilizer products, crop-protection products, water supply, and treatment services are outside the foreground PCR boundary but are required when the foreground package uses them."
      source_ids: []
    - rule_id: boundary_01
      applies_to: "plantation_to_gate"
      rule: "Include the managed plantation, plucking, selected primary-processing route, drying, grading, and gate storage needed to produce the declared dry tea reference flow."
      source_ids:
        - iso-20715-2023-tea-classification
        - iso-14044-2006
    - rule_id: boundary_02
      applies_to: "route_selection"
      rule: "Select one named tea route per lot and include only the route states that occur; do not count withering, oxidation, rolling, or yellowing when the selected route does not use that state."
      source_ids:
        - iso-20715-2023-tea-classification
        - fao-tea-processing-manual
    - rule_id: boundary_03
      applies_to: "gate_definition"
      rule: "The declared gate is after primary processing, drying, grading, and included storage, and before packaging presentation, retail, downstream distribution, consumer brewing, or beverage preparation."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_04
      applies_to: "recursive_same_category_input"
      rule: "Same-category upstream tea input is a declared dataset input and must not be expanded recursively inside the receiving tea process."
      source_ids:
        - mass-balance-identity
    - rule_id: boundary_05
      applies_to: "direct_emissions_and_residues"
      rule: "Record direct field and processing emissions, wastewater, dust, residues, rejects, and their destinations when they cross the foreground boundary or are required for mass reconciliation."
      source_ids:
        - fao-tea-processing-manual
        - ipcc-2019-refinement-afolu
boundary_abstraction:
