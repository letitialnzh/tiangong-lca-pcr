validation_rules:
  - rule_id: validation_01
    applies_to: "identity"
    rule: "The dataset must identify *Camellia sinensis*, one named tea type, one route, the dry-tea state, and the declared primary-processing gate."
    source_ids:
      - iso-20715-2023-tea-classification
  - rule_id: validation_02
    applies_to: "reference_flow"
    rule: "The reference output must use Tea d16090ca-ddbe-4fd4-a498-fe4cab8bb525, Mass 93a60a56-a3c8-11da-a746-0800200b9a66, Units of mass 93a60a57-a4c8-11da-a746-0800200b9a66, and 1 kg unless a reviewed identity correction is issued."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_03
    applies_to: "route_completeness"
    rule: "Exactly one named route must be selected. Every included route state must have a preceding input, a following hand-off, and a recorded output or loss; inapplicable states must not be counted."
    source_ids:
      - iso-20715-2023-tea-classification
      - fao-tea-chain-processing
  - rule_id: validation_04
    applies_to: "plantation_and_harvest"
    rule: "Plantation phase, management inputs, plucking source, fresh-leaf output, and harvest loss must be linked to the same reporting period and lot or an identified upstream dataset."
    source_ids:
      - ipcc-2019-refinement-afolu
  - rule_id: validation_05
    applies_to: "batch_and_changeover"
    rule: "Batch, campaign, or continuous-run boundaries must link inputs, outputs, cleaning, changeover, yield, and shared services; no shared-run burden may be counted twice."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_06
    applies_to: "outputs_and_allocation"
    rule: "Every intended output and hand-off must be enumerated. Marketable secondary tea is separated from residue; one output cannot be counted at two hand-offs."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_07
    applies_to: "rejects_and_rework"
    rule: "Every rejected or off-spec state must have a rework, downgrade, recovery, disposal, or boundary-exit path. Accepted output excludes unresolved rejects."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_08
    applies_to: "mass_balance"
    rule: "Fresh leaf, route intermediates, dry tea, grade outputs, residues, rejects, storage losses, and declared evaporation or moisture changes must reconcile within the documented tolerance."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_09
    applies_to: "data_quality"
    rule: "Missing material records, unresolved route selection, missing gate qualifiers, unsupported range substitutions, and unexplained mass-balance differences are findings that block reviewed or published use."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_10
    applies_to: "period_attribution"
    rule: "Establishment, replacement, productive phase, termination, inputs, outputs, and storage events must be linked to periods and must not be attributed twice."
    source_ids:
      - ipcc-2019-refinement-afolu
      - iso-14044-2006
