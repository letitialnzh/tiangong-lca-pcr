allocation_rules:
  - rule_id: allocation_01
    applies_to: "plantation_phase"
    rule: "Attribute perennial establishment, replacement, land occupation, and plantation management to the reporting-period tea output using the declared period and output basis; do not allocate the same phase burden again at processing."
    source_ids:
      - iso-14044-2006
      - ipcc-2019-refinement-afolu
  - rule_id: allocation_02
    applies_to: "route_batch"
    rule: "Index inputs, outputs, cleaning, drying, changeover, and rejects by route, batch, campaign, or reporting period so shared runs cannot be counted twice."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_03
    applies_to: "marketable_tea_outputs"
    rule: "Enumerate the accepted primary grade, marketable secondary grade, and recovered tea fraction when each is an intended tea output. Decision: use subdivision and direct measurement first; when outputs are physically inseparable, use allocation by measured dry tea mass as the default fallback, and disclose any economic allocation only as a documented sensitivity. Apply one method consistently to the affected process."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_04
    applies_to: "residues_and_rejects"
    rule: "A residue is not a co-product merely because it has a possible use. Treat it as an intended output only when there is a declared hand-off, destination, and product-quality record; otherwise retain the producing process burden and route it as residue or waste."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_05
    applies_to: "route_alternatives"
    rule: "Green, black, oolong, white, yellow, and dark routes are mutually exclusive per lot. Do not combine route burdens or assign oxidation, rolling, withering, fixation, or piling to a lot without route evidence."
    source_ids:
      - iso-20715-2023-tea-classification
  - rule_id: allocation_06
    applies_to: "multi_period_attribution"
    rule: "Link establishment, replacement, pruning, termination, inputs, outputs, and storage events to a reporting period or phase and prevent double attribution across periods."
    source_ids:
      - iso-14044-2006
      - ipcc-2019-refinement-afolu
  - rule_id: allocation_07
    applies_to: "rework_and_rejects"
    rule: "Rework loops, downgrades, recovery, and boundary exits must link back to the producing node; accepted tea output excludes unresolved rejects and rejected material cannot be counted at two hand-offs."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_activity_records
      process_id: "tea_plantation_management_tea_plucking_collection_tea_green_leaf_handling_tea_grading_storage_gate"
      flow_role: "plantation area and phase; field inputs; water; energy; land occupation"
      record_type: "field register, invoice, application record, meter, GIS, and activity log"
      raw_fields: "area; phase; cultivar; input_product; amount; nutrient_content; water; fuel; electricity; date; operation; reporting_period"
      collection_method: "reconcile physical inputs and operations to each block, activity, and crop cycle"
      unit: "m2; m2·year; kg; L; MJ; kWh; date"
      frequency: "each event and annual reporting period"
      temporal_coverage: "establishment, replacement, productive crop cycle, harvest campaign, and reporting period"
      site_scope: "all included plantation blocks and associated pre-gate activities"
      aggregation_rule: "sum by physical identity, block, activity, and period; calculate nutrient mass without merging products"
      quality_evidence: "invoices; labels; calibrated meters; field logs; GIS or block register"
    - protocol_id: cp_harvest_output_records
      process_id: "tea_plantation_management_tea_plucking_collection"
      flow_role: "shoots; fresh leaf; harvested mass; harvest loss; receiving hand-off"
      record_type: "weigh ticket, plucking register, yield record, and green-leaf receiving log"
      raw_fields: "block; cultivar; plucking_date; shoot_standard; fresh_mass; harvest_loss; receiving_time; lot_id"
      collection_method: "reconcile harvested and received mass to the plucking lot and dry-tea route"
      unit: "kg; date-time; lot identifier"
      frequency: "every plucking lot and hand-off"
      temporal_coverage: "complete crop cycle and harvest campaign"
      site_scope: "all harvested lots entering a selected route"
      aggregation_rule: "preserve one-to-one plantation-to-green-leaf linkage and close harvested mass = received mass + loss"
      quality_evidence: "calibrated scale; lot log; receiving record; moisture or quality record"
    - protocol_id: cp_processing_batch_records
      process_id: "tea_green_leaf_handling_tea_route_processing"
      flow_role: "green leaf; route intermediates; dry made tea; processing residues; utility inputs"
      record_type: "batch sheet, scale, moisture test, process log, utility meter, and fuel record"
      raw_fields: "route; batch_id; input_state; intermediate_state; process_step; moisture; output; loss; fuel; electricity; water; operating_condition"
      collection_method: "reconcile each batch, route state, utility reading, moisture result, and mass balance"
      unit: "kg; %; h; °C; L; MJ; kWh"
      frequency: "every batch or campaign"
      temporal_coverage: "reception through selected primary-processing route and drying"
      site_scope: "every selected route, batch, and processing facility within the gate"
      aggregation_rule: "aggregate only after route, batch, utility, and mass reconciliation"
      quality_evidence: "calibrated scale and moisture meter; batch sheet; meter reconciliation; route log"
    - protocol_id: cp_quality_and_storage_records
      process_id: "tea_grading_storage_gate"
      flow_role: "accepted grade; secondary grade; recovered tea product; rejects; storage; gate output"
      record_type: "grading log, sieve record, scale, warehouse log, and quality record"
      raw_fields: "grade; destination; accepted_mass; secondary_mass; recovered_mass; reject_mass; storage_start; storage_end; condition; loss; gate_date"
      collection_method: "enumerate every grade and destination, then reconcile storage duration, loss, and gate hand-off"
      unit: "kg; grade; day; temperature; humidity; date"
      frequency: "every graded or stored lot"
      temporal_coverage: "post-drying grading through the declared gate"
      site_scope: "all output destinations and storage included before the declared gate"
      aggregation_rule: "enumerate intended outputs and rejects; aggregate duration and quality by lot; exclude downstream logistics"
      quality_evidence: "calibrated scale; sieve or grading record; warehouse log; gate release record"
    - protocol_id: cp_residue_destination_records
