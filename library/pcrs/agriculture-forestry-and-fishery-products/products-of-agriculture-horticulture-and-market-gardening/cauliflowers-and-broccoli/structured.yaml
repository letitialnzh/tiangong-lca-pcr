      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh product on the declared farm-gate state. Keep harvested mass, marketable output, rejects, trims, and field losses separate before normalization."
  - id: crop_identity_separation
    applies_to: "cauliflower and broccoli records"
    required_property_ref:
      name: "Product identity"
      uuid: ""
    required_unit: "declared product"
    rule: "Record cauliflower and broccoli as separate crop identities. Aggregate them only after each product has a reconciled field-year inventory and an explicit aggregation rule."
  - id: nutrient_product_basis
    applies_to: "fertilizer and amendment inputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg product and kg nutrient"
    rule: "Record formulated product mass and documented nutrient concentration separately; calculate kg N, kg P2O5, and kg K2O without substituting one nutrient basis for another."
  - id: water_delivery_basis
    applies_to: "irrigation and water withdrawal"
    required_property_ref:
