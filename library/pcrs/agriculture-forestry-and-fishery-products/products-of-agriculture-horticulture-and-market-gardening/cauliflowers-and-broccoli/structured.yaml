    required_property_ref:
      name: "Area-time"
      uuid: ""
    required_unit: "m2*a"
    rule: "Record field area and the occupied crop period before normalizing occupation to the crop cycle and reference output."
  - id: moisture_and_trim_basis
    applies_to: "harvest, cooling, washing, and packing"
    required_property_ref:
      name: "Mass and moisture"
      uuid: ""
    required_unit: "kg and percent"
    rule: "Retain as-is mass and any measured moisture or water gain/loss. Do not use washing or cooling mass change as product yield without a documented reconciliation."
