        - fao-crop-evapotranspiration-56
        - ipcc-2019-managed-soils-n2o
    - rule_id: boundary_farm_gate
      applies_to: "harvest and primary handling"
      rule: "End the default boundary at transfer of fresh marketable cauliflower or broccoli at the declared farm gate. Include on-farm trimming, sorting, washing, cooling, and packaging only when they occur before transfer."
      source_ids:
        - usda-ams-cauliflower-standard
        - usda-ams-broccoli-standard
    - rule_id: boundary_input_completeness
      applies_to: "all foreground production"
      rule: "Address planting material, nutrients, crop protection, irrigation, land occupation, field energy, harvest energy, primary handling utilities, packaging, and direct field emissions with a value, justified zero, or documented exclusion."
      source_ids:
        - fao-crop-evapotranspiration-56
        - ipcc-2019-managed-soils-n2o
    - rule_id: boundary_residue_fate
      applies_to: "field residues, rejects, and trims"
      rule: "Identify whether each residue stream is returned to soil, left in field, fed, composted, treated, transported, sold, or discarded. Do not treat an unqualified residue as a co-product."
