allocation_rules:
  - rule_id: allocation_subdivision_priority
    applies_to: "shared field and handling operations"
    rule: "First subdivide field operations, harvest lots, product identities, conditioning runs, and packaging records wherever separate measurements exist."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_cauliflower_broccoli_aggregation
    applies_to: "cauliflower and broccoli produced by one farm or shared operation"
    rule: "Keep cauliflower and broccoli separate through inventory reconciliation. Aggregate only by declared mass or another justified allocation basis after product-specific records are complete."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_rejects_and_residues
    applies_to: "rejects, trims, and field residues"
    rule: "Treat rejects and residues as waste unless a documented buyer, quantity, specification, and destination establish a co-product. If allocation remains necessary, document the physical or economic basis and sensitivity."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_planting_material_records
      process_id: "crop_establishment_and_field_management"
      flow_role: "planting material"
      record_type: "purchase, nursery, and planting record"
      raw_fields: "field_id; product; cultivar; seed_or_transplant_form; lot; viable_units; mass; date; failures; replacements"
      collection_method: "reconcile invoices, labels, planting logs, and field acceptance"
      unit: "plant; g; kg"
      frequency: "per planting event"
      temporal_coverage: "complete crop establishment"
      site_scope: "every represented field"
      aggregation_rule: "sum by product and field and preserve failed or replaced units"
      quality_evidence: "labels, invoices, planting logs, lot records"
    - protocol_id: cp_fertilizer_and_amendment_records
      process_id: "crop_establishment_and_field_management"
      flow_role: "nutrients and soil amendments"
      record_type: "invoice, label, application, and laboratory record"
      raw_fields: "field_id; date; product; product_mass; N; P2O5; K2O; dry_matter; application_method; incorporation; source"
      collection_method: "reconcile purchases, applications, nutrient analyses, and stock movements"
      unit: "kg product; kg nutrient; percent"
      frequency: "per application"
      temporal_coverage: "complete crop cycle"
      site_scope: "every represented field"
      aggregation_rule: "sum by nutrient and product after field-year reconciliation"
      quality_evidence: "invoices, labels, analyses, application logs"
    - protocol_id: cp_irrigation_and_water_records
      process_id: "crop_establishment_and_field_management"
      flow_role: "irrigation and withdrawal"
      record_type: "meter, pump, invoice, or water-right record"
      raw_fields: "field_id; source; meter; date; withdrawal; delivered_volume; pumping_energy; method; rainfall_basis"
      collection_method: "use calibrated meter or documented source and distinguish withdrawal from delivery"
      unit: "m3; kWh"
      frequency: "per event or period"
      temporal_coverage: "irrigation season and crop cycle"
      site_scope: "each field and water source"
      aggregation_rule: "sum by source and separate withdrawal, delivery, and return"
      quality_evidence: "meter calibration, readings, invoices, water records"
    - protocol_id: cp_crop_protection_records
      process_id: "crop_establishment_and_field_management"
      flow_role: "crop protection"
      record_type: "purchase and application record"
      raw_fields: "field_id; date; formulation; active_ingredient; product_mass; concentration; area; method; target; re-entry or disposal"
      collection_method: "reconcile product, active ingredient, application, and stock records"
      unit: "kg product; kg active ingredient; ha"
      frequency: "per application"
      temporal_coverage: "complete crop cycle"
      site_scope: "every represented field"
      aggregation_rule: "sum by formulation and active ingredient and retain application date"
      quality_evidence: "labels, invoices, application logs, licensed applicator records"
    - protocol_id: cp_field_energy_records
      process_id: "crop_establishment_and_field_management"
      flow_role: "field energy"
      record_type: "fuel, machine, contractor, or meter record"
      raw_fields: "field_id; date; operation; machine; fuel_or_electricity; quantity; area; harvested_mass"
      collection_method: "use machine logs, contractor invoices, fuel records, or meters"
      unit: "L; kg; kWh; MJ"
      frequency: "per operation or period"
      temporal_coverage: "complete crop cycle"
      site_scope: "field and farm"
      aggregation_rule: "allocate shared operation to fields by area or measured output"
      quality_evidence: "invoices, telematics, fuel logs, meter records"
    - protocol_id: cp_field_and_output_records
      process_id: "crop_establishment_and_field_management"
      flow_role: "land, crop output, and field residue"
      record_type: "field map, harvest, and residue record"
      raw_fields: "field_id; product_identity; cultivar; area; dates; crop_duration; harvested_mass; field_loss; residue_mass; moisture; fate"
      collection_method: "combine field map, calibrated scales, harvest tickets, and residue disposition"
      unit: "ha; date; kg; percent"
      frequency: "per harvest and annual close"
      temporal_coverage: "full crop year"
      site_scope: "every represented field"
      aggregation_rule: "reconcile each product and field before cross-farm aggregation"
      quality_evidence: "field map, scale calibration, harvest tickets, disposition records"
    - protocol_id: cp_harvest_and_handling_energy_records
      process_id: "harvest_and_farm_gate_preparation"
      flow_role: "harvest and handling energy"
      record_type: "machine, contractor, meter, or invoice record"
      raw_fields: "lot_id; date; operation; machine; carrier; quantity; harvested_mass; duration"
      collection_method: "link energy record to harvest lot or allocate by documented throughput"
      unit: "L; kg; kWh; MJ"
      frequency: "per harvest event or period"
      temporal_coverage: "harvest window"
      site_scope: "harvest operation and facility"
      aggregation_rule: "sum by lot and operation and disclose allocation"
      quality_evidence: "invoices, machine logs, meters, throughput records"
    - protocol_id: cp_residue_and_reject_fate_records
      process_id: "harvest_and_farm_gate_preparation"
      flow_role: "field residues, trims, rejects, and losses"
      record_type: "lot, field, waste, feed, compost, or transfer record"
      raw_fields: "field_or_lot; stream; mass; moisture; reason; fate; destination; date"
      collection_method: "retain scale ticket, field log, transfer, sales, treatment, or disposal evidence"
      unit: "kg; percent"
      frequency: "per event or campaign"
      temporal_coverage: "crop cycle and harvest"
      site_scope: "every field and handling line"
      aggregation_rule: "sum by stream and fate; do not merge with accepted product"
      quality_evidence: "scale tickets, disposition records, receipts, treatment records"
    - protocol_id: cp_conditioning_and_packaging_records
      process_id: "on_farm_cooling_and_packaging"
      flow_role: "water, electricity, packaging, wastewater, and conditioning output"
      record_type: "batch, meter, packaging, and waste record"
      raw_fields: "batch_id; input_mass; water; electricity; cooling_time; packaging_type; packaging_mass; output_mass; reject_mass; wastewater; destination"
      collection_method: "link batch records to lot and reconcile input, utilities, packaging, wastes, and output"
      unit: "kg; m3; kWh; h"
      frequency: "per batch or shift"
      temporal_coverage: "complete in-scope conditioning period"
      site_scope: "each line and cold room"
      aggregation_rule: "aggregate only after batch-level reconciliation"
      quality_evidence: "calibrated scales, meters, packaging issue records, waste receipts"
    - protocol_id: cp_farm_gate_output_records
      process_id: "harvest_and_farm_gate_preparation"
      flow_role: "marketable reference output"
      record_type: "dispatch, scale, and quality record"
      raw_fields: "lot_id; product_identity; source_field; date; mass; grade; maturity; trim_state; wash_state; cooling_state; packaging_state; destination"
      collection_method: "use calibrated dispatch scale and product acceptance record"
      unit: "kg; percent"
      frequency: "per lot or dispatch"
      temporal_coverage: "complete harvest and hand-off period"
      site_scope: "farm and declared gate"
      aggregation_rule: "sum accepted lots and preserve product-specific qualifiers"
      quality_evidence: "scale calibration, grade sheet, dispatch ticket"
  calculation_rules:
    - id: calc_nutrient_equivalent
      applies_to: "fertilizer and amendment inputs"
      rule: "Formulated product mass multiplied by documented nutrient fraction equals nutrient-equivalent input; retain product and nutrient values separately."
      inputs:
        - "product mass"
        - "nutrient analysis"
        - "application record"
      output: "kg N, kg P2O5, and kg K2O by field-year"
      source_ids:
        - ipcc-2019-managed-soils-n2o
        - fao-brassica-production-guidance
    - id: calc_land_occupation
      applies_to: "field land occupation"
      rule: "Field area multiplied by declared occupation duration, normalized to marketable reference output."
      inputs:
        - "field area"
        - "crop duration"
        - "crop output"
      output: "m2*a per reference output"
      source_ids:
        - fao-brassica-production-guidance
    - id: calc_direct_soil_n2o
      applies_to: "managed-soil emissions"
      rule: "Apply the selected IPCC factor and tier to accounted nitrogen inputs; convert N2O-N to N2O only when required and disclose the conversion."
      inputs:
        - "accounted N"
        - "method factor"
        - "conversion basis"
      output: "direct N2O-N or N2O per reference output"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calc_irrigation_delivery
      applies_to: "irrigation water"
      rule: "Sum source-specific metered delivery, keep withdrawal and delivery distinct, and normalize to marketable output."
      inputs:
        - withdrawal
        - delivery
        - return
        - "crop output"
      output: "m3 delivered and withdrawn per reference output"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: calc_product_specific_aggregation
      applies_to: "cauliflower and broccoli combined reporting"
      rule: "Complete separate product-specific balances first; mass-weight only reconciled product records when an aggregate result is requested."
      inputs:
        - "product-specific inventories"
        - "marketable masses"
      output: "aggregated inventory per reference output"
      source_ids:
        - iso-14044-2006
    - id: calc_farm_gate_mass_balance
      applies_to: "harvest, grading, and conditioning"
      rule: "Harvested input plus measured mass gain or loss equals marketable output plus trims, rejects, residues, wastewater solids, and explained loss on a common basis."
      inputs:
        - "input and output scale records"
        - moisture
        - "waste records"
      output: "reconciled lot balance"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "all product rows"
      requirement: "Declare cauliflower or broccoli identity, cultivar or variety where material, harvest maturity, grade, and final hand-off state."
      evidence: "planting, harvest, grade, and dispatch records"
    - id: dq_temporal_coverage
      applies_to: "crop production and harvest"
      requirement: "Cover the full represented crop cycle and harvest year; state whether the result is a single year, multi-year average, or scenario."
      evidence: "dated field, application, harvest, and dispatch records"
    - id: dq_input_completeness
      applies_to: "field and farm-gate inventory"
      requirement: "Quantify or justify zero or exclusion for planting material, nutrients, irrigation, crop protection, land, field energy, harvest energy, primary conditioning, packaging, and direct emissions."
      evidence: "invoices, labels, meters, logs, and method declaration"
    - id: dq_mass_reconciliation
      applies_to: "all harvest and conditioning outputs"
      requirement: "Reconcile harvested, marketable, trimmed, rejected, residue, wastewater-solids, and explained-loss masses before normalization."
      evidence: "calibrated scales, lot records, and fate receipts"
    - id: dq_nutrient_and_water_basis
      applies_to: "nutrients and irrigation"
      requirement: "Preserve formulated fertilizer and nutrient-equivalent bases, water withdrawal and delivery, irrigation method, and any emission-factor selection."
      evidence: "product labels, analyses, meters, and calculation record"
    - id: dq_fate_and_disclosure
      applies_to: "residues, rejects, and wastes"
      requirement: "Record destination, treatment, reuse, or disposal for every non-reference output and document any claimed co-product."
      evidence: "transfer, sales, feed, compost, treatment, or disposal record"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow and product output"
    rule: "Confirm that the output is fresh, unprocessed cauliflower or broccoli at the declared farm-gate state and that product identity is explicit."
    source_ids:
      - usda-ams-cauliflower-standard
      - usda-ams-broccoli-standard
  - rule_id: validation_process_completeness
    applies_to: "Process Map and inventory"
    rule: "Confirm crop establishment and field management, harvest and farm-gate preparation, and every applicable conditional conditioning process are represented or explicitly excluded."
    source_ids:
      - fao-brassica-production-guidance
  - rule_id: validation_product_separation
    applies_to: "cauliflower and broccoli aggregation"
    rule: "Confirm that product-specific inputs, yields, rejects, and quality states are reconciled before any combined category result is calculated."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: validation_nutrient_basis
    applies_to: "fertilizer and soil emissions"
    rule: "Confirm product mass is distinct from kg N, P2O5, and K2O, and that factor selection and N2O-N conversion are documented."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_water_accounting
    applies_to: "irrigation and conditioning water"
    rule: "Confirm rainfall, withdrawal, delivered irrigation, process water, wastewater, and return flows are distinguished and not double counted."
    source_ids:
      - fao-crop-evapotranspiration-56
  - rule_id: validation_mass_balance
    applies_to: "harvest and primary conditioning"
    rule: "Confirm marketable output, trims, rejects, residues, wastewater solids, and explained losses reconcile to the corresponding input on a declared basis."
    source_ids:
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "Foreground annual crop-production dataset for fresh cauliflower or broccoli at farm gate"
  downstream_use: "May be used as a secondary_dataset or background_dataset for LCA studies that require fresh unprocessed cauliflower or broccoli and preserve the declared qualifiers"
  allowed_use: "Farm-gate footprinting, product comparison with matching crop identity and gate, inventory aggregation after product-specific reconciliation, and downstream process modelling that begins at the declared hand-off"
  excluded_use: "Direct substitution for processed, frozen, dried, retail-packed, distributed, cooked, or consumption-stage products; use across different crop identities or gates without adjustment"
  required_metadata: "product identity; cultivar; geography; field area; crop year and duration; planting material; irrigation source and method; nutrient product and nutrient basis; crop protection; field and harvest energy; yield; grade and maturity; trimming; washing and cooling; packaging; residue and reject fates; farm-gate state"
  required_quality_disclosure: "temporal coverage; field and lot coverage; product separation; measurement and scale evidence; mass-balance result; nutrient and water basis; emission-factor method coverage; allocation method; exclusions and assumptions"
  update_trigger: "Material change in cultivation route, product identity, farm-gate state, crop-protection or nutrient practice, irrigation, harvest or conditioning technology, packaging, emission method, Flow Set version, reference identity, or evidence status"
