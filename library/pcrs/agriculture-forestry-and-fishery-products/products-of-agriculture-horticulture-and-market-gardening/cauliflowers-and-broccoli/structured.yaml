system_boundary:
  rules:
    - rule_id: boundary_annual_crop
      applies_to: "field preparation and crop production"
      rule: "Include inputs and emissions attributable to the declared annual crop cycle from planting-material hand-off through harvest; disclose prior land use and exclude unrelated historical field burdens."
