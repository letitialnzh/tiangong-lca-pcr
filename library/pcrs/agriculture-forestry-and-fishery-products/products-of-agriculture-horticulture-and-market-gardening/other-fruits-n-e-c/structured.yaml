allocation_rules:
  - rule_id: allocation_01
    applies_to: "annual and perennial phases"
    rule: "Allocate establishment, perennial plants, structures and shared phases by documented area-time, plant-year, crop-cycle, throughput or another justified physical basis, with period indexing disclosed."
    source_ids:
      - iso-14044-2006
      - fao-good-farming-practices
  - rule_id: allocation_02
    applies_to: "shared farm, packhouse and campaign resources"
    rule: "Attribute shared meters, machinery, storage, conditioning lines and changeovers once using measured activity, run-time, throughput or area; retain batch linkage."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_03
    applies_to: "marketable and downgraded fruit"
    rule: "Treat marketable fresh fruit as reference output. Treat downgraded or recovered fruit as co-product only when function, destination, quantity, state and hand-off are documented."
    source_ids:
      - iso-14044-2006
      - fao-packinghouse-operations-1986
  - rule_id: allocation_04
    applies_to: "rework, returns and rejects"
    rule: "Keep burden on off-spec material until its declared rework, downgrade, recovery, treatment or disposal hand-off; never count rework as both reject and accepted output."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: allocation_05
    applies_to: "recovery and substitution"
    rule: "Do not claim avoided production from a destination label alone; require recipient, function, comparable product, quantity, quality, fate and attribution method."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "The PCR does not force one allocation method for every route. The dataset must select and justify one method for each genuine multi-output boundary, apply it consistently, and disclose sensitivity where material. In a single-output route, culls and residues remain loss or waste unless their intended function is evidenced."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_site_cycle_records
      process_id: "fruit_site_establishment_and_crop_cycle"
      flow_role: "site, area, cycle, phase, output and residues"
      record_type: "block register and field log"
      raw_fields: "site; block; species/group; cultivar; system; area; phase; dates; yield; residue; fate"
      collection_method: "record review and cycle reconciliation"
      unit: "ha; date; year; kg"
      frequency: "monthly and cycle close"
      temporal_coverage: "complete crop cycle or perennial phase"
      site_scope: "each block"
      aggregation_rule: "aggregate by block and phase; allocate shared records once"
      quality_evidence: "signed logs, block map and yield record"
    - protocol_id: cp_establishment_records
      process_id: "fruit_site_establishment_and_crop_cycle"
      flow_role: "planting and establishment"
      record_type: "nursery invoice, planting log and asset register"
      raw_fields: "material; variety; quantity; date; block; replacement; asset; service life"
      collection_method: "invoice and register reconciliation"
      unit: "item; kg; date; year"
      frequency: "each event"
      temporal_coverage: "establishment and allocated phases"
      site_scope: "block and asset"
      aggregation_rule: "reconcile purchased, planted, replaced and surviving material"
      quality_evidence: "supplier record and planting log"
    - protocol_id: cp_nutrient_and_amendment_records
      process_id: "fruit_site_establishment_and_crop_cycle"
      flow_role: "fertilizer and amendments"
      record_type: "purchase, label, plan, application log and laboratory result"
      raw_fields: "product; quantity; moisture; N; P2O5; K2O; date; block; area"
      collection_method: "document review and nutrient calculation"
      unit: "kg product; kg nutrient"
      frequency: "each application"
      temporal_coverage: "complete cycle or phase"
      site_scope: "each block"
      aggregation_rule: "sum actual products and calculate nutrients once"
      quality_evidence: "invoice, label, plan or lab result"
    - protocol_id: cp_crop_protection_records
      process_id: "fruit_site_establishment_and_crop_cycle"
      flow_role: "crop protection"
      record_type: "purchase and application record"
      raw_fields: "product; formulation; active; quantity; date; block; area"
      collection_method: "record reconciliation"
      unit: "kg; L; date"
      frequency: "each application"
      temporal_coverage: "complete cycle or phase"
      site_scope: "each block"
      aggregation_rule: "sum by named formulation and active substance"
      quality_evidence: "label, invoice and application log"
    - protocol_id: cp_irrigation_records
      process_id: "fruit_site_establishment_and_crop_cycle"
      flow_role: "irrigation and withdrawal"
      record_type: "meter, pump, permit and irrigation log"
      raw_fields: "source; meter; block; method; delivered; withdrawn; return; date"
      collection_method: "meter review and water-balance calculation"
      unit: "m3; date"
      frequency: "event or monthly"
      temporal_coverage: "complete cycle or phase"
      site_scope: "source and block"
      aggregation_rule: "reconcile withdrawal, delivery, return and consumption"
      quality_evidence: "calibrated meter and worksheet"
    - protocol_id: cp_energy_and_fuel_records
      process_id: "fruit_site_establishment_and_crop_cycle_fruit_harvest_and_field_handoff"
      flow_role: "site and harvest energy"
      record_type: "utility bill, fuel receipt, tank log or contractor record"
      raw_fields: "carrier; equipment; operation; quantity; hours; date; block; campaign"
      collection_method: "invoice, meter and operation-log review"
      unit: "kWh; L; kg; MJ; h"
      frequency: "monthly and campaign"
      temporal_coverage: "complete cycle and harvest"
      site_scope: "site, block and equipment"
      aggregation_rule: "allocate by use, hours, area or throughput; prevent duplicate inclusion"
      quality_evidence: "invoice, meter and allocation worksheet"
    - protocol_id: cp_nutrient_and_field_emission_records
      process_id: "fruit_site_establishment_and_crop_cycle"
      flow_role: "nutrient and elementary flows"
      record_type: "nutrient plan, tests, emission worksheet and factor record"
      raw_fields: "N/P; residue; soil; climate; pathway; medium; factor; method; period"
      collection_method: "method calculation and evidence review"
      unit: "kg nutrient; kg substance"
      frequency: "application and cycle close"
      temporal_coverage: "complete cycle or phase"
      site_scope: "block and receiving compartment"
      aggregation_rule: "apply one selected method and de-duplicate pathways"
      quality_evidence: "worksheet and factor reference"
    - protocol_id: cp_harvest_lot_records
      process_id: "fruit_harvest_and_field_handoff"
      flow_role: "harvested output and loss"
      record_type: "harvest ticket, scale and lot record"
      raw_fields: "lot; block; date; species/group; cultivar; maturity; harvested; loss; destination; hand-off"
      collection_method: "scale reconciliation and lot review"
      unit: "kg; date; lot"
      frequency: "each lot"
      temporal_coverage: "all harvests"
      site_scope: "block and harvest operation"
      aggregation_rule: "reconcile output to harvested, lost and transferred amounts"
      quality_evidence: "calibrated scale and traceability record"
    - protocol_id: cp_conditioning_records
      process_id: "fruit_primary_conditioning"
      flow_role: "raw input, prepared output, water, energy, agents, rejects and wastewater"
      record_type: "batch sheet, meter, sanitation and discharge record"
      raw_fields: "batch; lot; input; output; water; recirculation; agent; energy; reject; solids; discharge; date"
      collection_method: "batch mass balance and document review"
      unit: "kg; m3; kWh; L"
      frequency: "batch or shift"
      temporal_coverage: "all included conditioning"
      site_scope: "line, site and lot"
      aggregation_rule: "reconcile intake to output, rejects, solids, water and wastewater"
      quality_evidence: "batch sheet, scale, meter and discharge record"
    - protocol_id: cp_grading_and_destination_records
      process_id: "fruit_grading_and_destination_sorting"
      flow_role: "grade, marketable output, co-product, cull and foreign matter"
      record_type: "grading sheet, scale and recipient record"
      raw_fields: "input; grade; maturity; accepted; downgraded; cull; foreign matter; recipient; destination; date"
      collection_method: "weighed grade reconciliation"
      unit: "kg; date; lot"
      frequency: "each lot or run"
      temporal_coverage: "all included grading"
      site_scope: "line, site and lot"
      aggregation_rule: "enumerate destinations and reconcile to input"
      quality_evidence: "scale, grade sheet and receipt"
    - protocol_id: cp_storage_records
      process_id: "fruit_cold_storage_and_stabilization"
      flow_role: "storage input, output, duration, energy, material and loss"
      record_type: "cold-room log, logger, inventory and dispatch record"
      raw_fields: "lot; mode; temperature; start; end; input; output; loss; reject; energy; material"
      collection_method: "logger and inventory reconciliation"
      unit: "kg; kWh; day; °C"
      frequency: "each lot and day"
      temporal_coverage: "declared storage period"
      site_scope: "cold room and gate"
      aggregation_rule: "reconcile opening stock, receipts, dispatch and loss"
      quality_evidence: "logger, inventory and dispatch ticket"
    - protocol_id: cp_packaging_records
      process_id: "fruit_packaging_and_gate_handoff"
      flow_role: "product, packaging, energy and waste"
      record_type: "package specification, issue record, asset register and dispatch ticket"
      raw_fields: "lot; format; material; tare; item; capacity; reuse; return; loss; energy; net fruit; date"
      collection_method: "package issue and net-output reconciliation"
      unit: "kg; item; kWh; date"
      frequency: "lot, campaign or dispatch"
      temporal_coverage: "all included packaging"
      site_scope: "line, site and lot"
      aggregation_rule: "allocate reusable assets over service life and reconcile used, returned and waste"
      quality_evidence: "package specification and issue record"
    - protocol_id: cp_reject_rework_residue_records
      process_id: "fruit_reject_rework_and_residue_routing"
      flow_role: "rejected, downgraded, recovered, reworked and residual material"
      record_type: "reject log, rework ticket, recipient, treatment and disposal record"
      raw_fields: "source; lot; state; wet/dry mass; moisture; destination; recipient; function; treatment; date; return link"
      collection_method: "weigh and destination review with graph reconciliation"
      unit: "kg; m3; date"
      frequency: "each event and period close"
      temporal_coverage: "all included routing"
      site_scope: "source node, site and recipient"
      aggregation_rule: "one declared route per source stream; prevent double counting"
      quality_evidence: "scale, ticket, receipt or treatment record"
  calculation_rules:
    - id: calc_01
      applies_to: "all inventory rows"
      rule: "normalized amount = amount × 1,000 kg / net marketable gate output; retain the original process-output or storage-duration basis."
      inputs:
        - "raw amount"
        - "net marketable gate output"
        - basis
      output: "normalized amount"
      source_ids:
        - mass-balance-identity
    - id: calc_02
      applies_to: "fertilizer and amendments"
      rule: "nutrient amount = product mass × declared nutrient fraction, or documented laboratory result; retain product and nutrient bases separately."
      inputs:
        - "product mass"
        - "composition or result"
      output: "product and nutrient amounts"
      source_ids:
        - fao-fruit-vegetable-production-practices-2024
    - id: calc_03
      applies_to: "irrigation, withdrawal, conditioning and wastewater"
      rule: "Reconcile source withdrawal, delivery, recirculation, evaporation or consumption, retained solids and discharge; do not count one meter twice."
      inputs:
        - meters
        - "batch records"
        - "return and discharge"
      output: "water and wastewater amounts"
      source_ids:
        - fao-good-farming-practices
        - mass-balance-identity
    - id: calc_04
      applies_to: "annual and perennial phases"
      rule: "Allocate establishment, assets and shared phases by declared area-time, plant-year, crop-cycle, throughput or other physical basis and link each item to its period or phase."
      inputs:
        - area
        - duration
        - phase
        - assets
        - output
      output: "period-attributed inventory"
      source_ids:
        - iso-14044-2006
    - id: calc_05
      applies_to: "harvest through reject routing"
      rule: "Reconcile input to marketable output, co-product, culls, residues, rework, storage loss, packaging waste, wastewater solids and documented loss, with moisture and tare explicit."
      inputs:
        - "lot weights"
        - destination
        - moisture
        - tare
      output: "mass-balance result"
      source_ids:
        - mass-balance-identity
        - fao-postharvest-handling-fruits
    - id: calc_06
      applies_to: "nutrient and fuel elementary flows"
      rule: "Apply one selected method or measured result to documented nutrient, residue, fuel, receiving medium and period data; do not duplicate pathways."
      inputs:
        - records
        - factors
        - method
        - medium
      output: "elementary-flow amounts"
      source_ids:
        - ipcc-2019-refinement-afolu
    - id: calc_07
      applies_to: "reusable packaging and shared assets"
      rule: "allocated asset = asset mass or service × represented throughput / documented service throughput, with reuse, return and loss disclosed."
      inputs:
        - asset
        - "service life"
        - throughput
        - loss
      output: "allocated input"
      source_ids:
        - fao-postharvest-handling-fruits
        - iso-14044-2006
  data_quality_requirements:
    - id: quality_01
      applies_to: "all datasets"
      requirement: "Declare species or botanical group, cultivar or variety group, production system, site, geography, annual or perennial phase, period, gate and route nodes."
      evidence: "block register and dataset metadata"
    - id: quality_02
      applies_to: "measured and converted quantities"
      requirement: "Prefer calibrated scales and meters, invoices, labels, logs, loggers, receipts and transparent worksheets; retain units, tare, moisture and factors."
      evidence: "primary records and calculation worksheet"
    - id: quality_03
      applies_to: "cycle, harvest, storage and multi-period routes"
      requirement: "Cover the complete declared cycle or phase, all harvest lots, establishment or replacement events, storage periods and included runs; identify gaps."
      evidence: "cycle checklist, lot register and period index"
    - id: quality_04
      applies_to: "products, co-products, rejects, residues and waste"
      requirement: "Reconcile each source stream to one accepted product, co-product, rework, residual, wastewater, packaging waste or documented loss hand-off."
      evidence: "mass balance, grade sheet and destination receipt"
    - id: quality_05
      applies_to: "nutrient, water and emission rows"
      requirement: "Disclose product and nutrient basis, water source and balance, selected emission method, factors, receiving medium, residue fate and unresolved pathways."
      evidence: "nutrient plan, meters, worksheet and source reference"
    - id: quality_06
      applies_to: "aggregation and publication"
      requirement: "Disclose single-site or aggregated scope, shared-resource attribution, collected versus calculated or estimated fields, primary-record share and unresolved identities."
      evidence: "aggregation worksheet and quality note"
validation_rules:
  - rule_id: validation_01
    applies_to: "reference flow and metadata"
    rule: "Reject missing species/group, product state, gate, mass basis, maturity or grade, cycle or phase, or other required qualifier; verify product, mass property and unit-group identity before final publication."
    source_ids:
      - fao-quality-safety-fresh-fruits-2004
      - mass-balance-identity
  - rule_id: validation_02
    applies_to: "boundary and process map"
    rule: "Require managed production, harvest hand-off and declared gate; require explicit inclusion or exclusion of conditioning, grading, storage, packaging and reject routing."
    source_ids:
      - fao-fruit-vegetable-production-practices-2024
      - fao-postharvest-handling-fruits
  - rule_id: validation_03
    applies_to: "Flow Set rows"
    rule: "Resolve every parameterized row at foreground generation using Flow Set id, version, group, structural coordinate, property, unit, geography, receiving medium or intended use and a verified final UUID."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_04
    applies_to: "production and post-harvest outputs"
    rule: "Reconcile crop-cycle output, harvested fruit, grades, marketable fruit, co-product, culls, storage loss, residues, rework, wastewater solids, packaging waste and loss; reject double counting."
    source_ids:
      - mass-balance-identity
      - fao-packinghouse-operations-1986
  - rule_id: validation_05
    applies_to: "multi-output and rejected states"
    rule: "Enumerate every intended output and hand-off; reject recovery credit without function, destination, quantity, quality and attribution decision; require a path for every rejected state."
    source_ids:
      - iso-14044-2006
      - fao-postharvest-handling-fruits
  - rule_id: validation_06
    applies_to: "periods, storage and campaigns"
    rule: "Link inputs, assets, outputs, replacements, termination events, storage duration, batches and changeovers to the declared period or phase; prevent double attribution."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: validation_07
    applies_to: "nutrient, water and elementary flows"
    rule: "Check actual products and nutrient basis, irrigation versus withdrawal, water balance, receiving media and one emissions method; prevent duplicate nitrogen or water pathways."
    source_ids:
      - ipcc-2019-refinement-afolu
      - fao-good-farming-practices
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after review, identity resolution and release controls"
  downstream_use: "Foreground agricultural and first-hand-off modelling for cultivated fresh whole fruit in the Other fruits, n.e.c. category, with downstream process or lifecyclemodel construction."
  allowed_use: "Studies preserving fruit identity, route, geography, cycle or phase, gate, maturity and grade, nutrient and water bases, storage and packaging scope, destinations, allocation and quality disclosure."
  excluded_use: "Processed fruit, wild-collected fruit, nursery material, retail or consumer stages, unqualified regional substitution, or use without gate, phase and output-fate information."
  required_metadata: "PCR id; CPC reference; species/group; variety group; geography; system; phase; dates; gate; maturity; grade; inputs; nutrient and water basis; crop protection; harvest; conditioning; storage; packaging; destinations; reference amount and unit; allocation; identity status."
  required_quality_disclosure: "Site and period coverage; collected, calculated and estimated fields; primary-record share; meter and scale evidence; water and mass balance; allocation; reuse; emissions method; Flow Set resolutions; unresolved identity findings."
  update_trigger: "Material change in route, production system, phase allocation, irrigation, nutrient or protection practice, conditioning, storage, packaging, reject or recovery route, gate, emissions method or required qualifier."
