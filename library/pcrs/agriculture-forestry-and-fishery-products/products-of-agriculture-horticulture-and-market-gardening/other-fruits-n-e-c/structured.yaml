  - id: fruit_harvest_and_field_handoff
    name: "Fruit harvest and field hand-off"
    inclusion: "required"
    inclusion_condition: "fruit is removed from the managed site and transferred to the next node or gate"
    role: "harvest and collected-output hand-off"
    quantitative_reference: "per 1 kg harvested fruit and per 1 kg marketable gate output"
  - id: fruit_primary_conditioning
    name: "Primary fruit conditioning"
    inclusion: "conditional"
    inclusion_condition: "cleaning, washing, brushing, drying, sanitation or other raw-to-prepared conditioning occurs before the gate"
    role: "first post-harvest preparation"
    quantitative_reference: "per 1 kg conditioned fruit"
  - id: fruit_grading_and_destination_sorting
    name: "Fruit grading and destination sorting"
    inclusion: "conditional"
    inclusion_condition: "incoming fruit is classified into two or more declared quality or destination states before the gate"
    role: "quality and destination separation"
    quantitative_reference: "per 1 kg graded fruit"
  - id: fruit_cold_storage_and_stabilization
    name: "Fruit cold storage and stabilization"
    inclusion: "conditional"
    inclusion_condition: "pre-cooling, refrigeration, controlled storage or another stabilization intervention occurs before the gate"
    role: "preservation and storage"
    quantitative_reference: "per 1 kg stored fruit and storage day"
  - id: fruit_packaging_and_gate_handoff
    name: "Fruit packaging and gate hand-off"
    inclusion: "conditional"
    inclusion_condition: "packaging or presentation is applied inside the declared boundary before the gate"
    role: "protected product hand-off"
    quantitative_reference: "per 1 kg packed gate output"
  - id: fruit_reject_rework_and_residue_routing
    name: "Fruit reject, rework and residue routing"
    inclusion: "conditional"
    inclusion_condition: "rejected, downgraded, recovered or residual material receives a declared route before leaving the boundary"
    role: "off-spec and residual routing"
    quantitative_reference: "per 1 kg marketable gate output"
