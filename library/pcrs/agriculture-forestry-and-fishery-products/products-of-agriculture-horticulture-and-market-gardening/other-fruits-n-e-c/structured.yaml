    required_unit: "kg"
    rule: "Record net mass at the stated process state and reconcile harvested, conditioned, graded, marketable, downgraded, rejected, recovered, residual and documented-loss quantities without mixing tare or inconsistent moisture bases."
  - id: measurement_02
