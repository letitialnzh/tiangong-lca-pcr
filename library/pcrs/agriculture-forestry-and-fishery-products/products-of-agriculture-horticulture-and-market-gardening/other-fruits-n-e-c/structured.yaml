    required_property_ref:
      name: "Product mass and nutrient basis"
      uuid: ""
    required_unit: "kg product; kg N; kg P2O5; kg K2O"
    rule: "Record only products actually used. Keep formulation or amendment mass separate from declared nutrient mass and retain the label, plan or laboratory basis used for conversion."
