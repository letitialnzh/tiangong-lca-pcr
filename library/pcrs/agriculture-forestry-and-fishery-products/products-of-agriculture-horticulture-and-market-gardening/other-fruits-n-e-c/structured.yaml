system_boundary:
  rules:
    - rule_id: boundary_01
      applies_to: "foreground start"
      rule: "Start at the managed cultivated fruit site and the declared crop cycle or perennial production phase; include attributable establishment inputs when the represented phase depends on them."
      source_ids:
        - fao-good-farming-practices
        - iso-14044-2006
    - rule_id: boundary_02
      applies_to: "production and harvest"
      rule: "Include site preparation and management, actual planting material, fertilizer or amendments, crop protection, irrigation, land occupation, field energy, harvest and the hand-off to the first declared post-harvest node."
      source_ids:
        - fao-fruit-vegetable-production-practices-2024
        - fao-quality-safety-fresh-fruits-2004
    - rule_id: boundary_03
      applies_to: "post-harvest route"
      rule: "Include primary cleaning or washing, drying, grading, sorting, cooling, short storage and packaging only when each activity occurs before the declared gate; keep distribution and logistics outside unless separately declared."
      source_ids:
        - fao-postharvest-handling-fruits
        - fao-packinghouse-operations-1986
    - rule_id: boundary_04
      applies_to: "recursive inputs and services"
      rule: "Treat purchased materials, utilities, packaging and treatment services as upstream inputs. Do not recurse into another fruit PCR or invent a product identity when the input remains unresolved."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_05
      applies_to: "losses, residues and rejects"
      rule: "Keep field losses, culls, downgraded fruit, rejected fruit, wash solids, packaging waste and residuals in the foreground until a documented recovery, co-product, treatment or disposal hand-off is recorded."
      source_ids:
        - fao-postharvest-handling-fruits
        - mass-balance-identity
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "The managed biological production node is separate from harvesting and conditioning: production creates the crop and the intended fruit state, harvesting removes and hands off the collected output, and conditioning or grading changes the post-harvest state. Annual crops and perennial crops must be distinguished. For perennial crops, establishment, productive phases, replacement, termination and any shared asset or structure allocation are period-indexed rather than silently assigned to a single harvest."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Managed cultivated fruit site and declared crop cycle or perennial production phase, with attributable establishment inputs included where applicable."
  starting_condition_role: "Start of foreground managed biological production before the fruit crop receives site-specific management inputs."
  product_classification_scope: "Cultivated fresh whole fruit within the semantic category Other fruits, n.e.c.; CPC 3.0 / 01359 is a mapping reference only."
  recursive_input_rule: "Stop same-category recursion at a declared purchased planting input, fertilizer or amendment, crop-protection product, utility, packaging material, or treatment service; link a suitable upstream dataset instead of expanding the same category recursively."
  upstream_dataset_requirement: "Provide suitable background datasets for purchased inputs, energy and water supply, packaging, waste or wastewater treatment, and any outsourced service crossing the declared boundary."
  disclosure: "Declare species or botanical group, cultivar or variety group, annual or perennial phase, production system, site, period, gate, route nodes used, output grades and destinations, all actual inputs, water and energy, storage and packaging, losses and residues, allocation, aggregation, and unresolved identities."
