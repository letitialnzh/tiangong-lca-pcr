system_boundary:
  rules:
    - rule_id: boundary_orchard_establishment_to_farm_gate
      applies_to: "all conforming datasets"
      rule: "Include site preparation, planting, orchard establishment, immature years, productive orchard management, harvest, and conditioning performed before the declared farm-gate hand-off."
      source_ids:
        - fao-crop-production-methodology
        - fao-avocado-production-guide
    - rule_id: boundary_perennial_orchard_disclosure
      applies_to: "establishment and replacement trees"
      rule: "Include establishment and replacement-tree inputs only after assigning them to the declared orchard life or accepted fruit output basis; disclose the allocation horizon and non-bearing years."
      source_ids:
        - fao-avocado-production-guide
        - iso-14067
    - rule_id: boundary_direct_field_emissions
      applies_to: "managed soil and crop residues"
      rule: "Include direct and indirect nutrient- and residue-related emissions using a geographically applicable method and the same activity data used for nutrient, irrigation, and residue accounting."
      source_ids:
        - ipcc-2019-refinement
        - emep-eea-2023-guidebook
    - rule_id: boundary_farm_gate_conditioning
      applies_to: "optional conditioning"
      rule: "Include washing, sorting, grading, trimming, or short-term farm handling only when performed before hand-off and not already embedded in the harvest record; identify rejected fruit and destination."
      source_ids:
        - fao-crop-production-methodology
    - rule_id: boundary_post_farm_gate_exclusion
      applies_to: "downstream activities"
      rule: "Exclude off-farm transport, storage, distribution, retail, consumer use, food processing, oil or purée manufacture, and packaging end-of-life unless the study explicitly extends beyond this PCR."
