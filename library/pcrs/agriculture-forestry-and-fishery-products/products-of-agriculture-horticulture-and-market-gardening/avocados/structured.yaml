  - id: "ipcc-2019-refinement"
    type: "method_factor"
    reference: "2019 IPCC Refinement to the 2006 IPCC Guidelines for National Greenhouse Gas Inventories"
    used_for: "managed-soil and residue emission calculation methods"
  - id: "emep-eea-2023-guidebook"
    type: "method_factor"
