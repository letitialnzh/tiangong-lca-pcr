allocation_rules:
  - rule_id: allocation_orchard_establishment_over_productive_life
    applies_to: "orchard establishment, immature years, and replacement trees"
    rule: "Allocate establishment and non-bearing orchard inputs over the declared productive orchard life using orchard area and accepted fruit output. Report orchard life, establishment years, replacement events, and allocation basis."
    source_ids:
      - fao-avocado-production-guide
      - iso-14067
  - rule_id: allocation_accepted_and_named_destinations
    applies_to: "accepted fruit, downgraded fruit, and residues"
    rule: "Assign mass to accepted avocado and a named co-product only when the destination is evidenced and physically or economically distinguishable. Do not treat unmarketable losses as a co-product without a declared use."
    source_ids:
      - iso-14044
  - rule_id: allocation_no_double_counting_internal_links
    applies_to: "process links between orchard, harvest, and conditioning"
    rule: "Use internal process links for mass balance only; do not count the same orchard output or fruit mass as an additional market product."
    source_ids:
      - iso-14044
  - rule_id: allocation_mass_default_for_shared_fruit_output
    applies_to: "multiple avocado grades or destinations"
    rule: "Use mass allocation for shared production when no stronger causal partition is documented, and disclose grade definitions, moisture or dry-matter basis, and rejected-fruit treatment."
    source_ids:
      - iso-14044
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "If a study reports avocado fruit and a documented co-product from the same orchard or conditioning operation, the data package shall state the partitioning rule, common process inventory, and destination evidence. Economic allocation is not a default substitute for missing mass or causal data."
    source_ids: []
