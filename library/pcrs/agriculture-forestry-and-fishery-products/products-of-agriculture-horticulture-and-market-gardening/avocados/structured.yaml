  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
  - id: "fao-forest-equipment"
    type: "official_guidance"
    reference: "FAO Appropriate technologies for forest harvesting, https://www.fao.org/4/x5596E/x5596e06.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:d73fb78bcfb744ee430cf2edb68a08719680bcf8745063610641c95153a09af0"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5593"
      family: "system_boundary"
      span:
        start:
          offset: 5593
          line: 61
          column: 1
        end:
          offset: 8396
          line: 84
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | orchard site before or at establishment, with planting material and purchased management inputs crossing the foreground boundary; existing land history and prior crop condition are disclosed |\n| starting_condition_role | start of managed perennial avocado production and orchard asset accounting |\n| product_classification_scope | fresh avocado fruit corresponding to CPC 3.0 code 01311 |\n| recursive_input_rule | avocado planting material and retained fruit are upstream inputs only when crossing the boundary; they must not be recursively represented as this same farm-gate fruit output |\n| upstream_dataset_requirement | compatible upstream datasets for planting material, nutrient or soil-amendment products, crop protection, energy, irrigation supply, machinery services, packaging used before hand-off, and applicable waste treatment |\n| disclosure | cultivar, orchard age, establishment year, productive life, replacement trees, orchard area, previous land use, soil and climate context, irrigation, nutrient basis, crop protection, yield, harvest losses, conditioning, co-products, and residue or waste destination |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_orchard_establishment_to_farm_gate` | all conforming datasets | Include site preparation, planting, orchard establishment, immature years, productive orchard management, harvest, and conditioning performed before the declared farm-gate hand-off. | `fao-gap-framework-2003` |\n| `boundary_perennial_orchard_disclosure` | establishment and replacement trees | Include establishment and replacement-tree inputs only after assigning them to the declared orchard life or accepted fruit output basis; disclose the allocation horizon and non-bearing years. | `fao-gap-framework-2003`; `iso-14067` |\n| `boundary_direct_field_emissions` | managed soil and crop residues | Include direct and indirect nutrient- and residue-related emissions using a geographically applicable method and the same activity data used for nutrient, irrigation, and residue accounting. | `ipcc-2019-refinement`; `emep-eea-2023-guidebook` |\n| `boundary_farm_gate_conditioning` | optional conditioning | Include washing, sorting, grading, trimming, or short-term farm handling only when performed before hand-off and not already embedded in the harvest record; identify rejected fruit and destination. | `fao-gap-framework-2003` |\n| `boundary_post_farm_gate_exclusion` | downstream activities | Exclude off-farm transport, storage, distribution, retail, consumer use, food processing, oil or purée manufacture, and packaging end-of-life unless the study explicitly extends beyond this PCR. |  |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 188
              line: 8
