validation_rules:
  - rule_id: validation_reference_output
    applies_to: "reference flow and terminal process"
    rule: "Exactly one terminal accepted avocado output shall be linked to the declared reference flow, with no fixed identity assumed until verified; the binding remains parameterized in this candidate."
    source_ids: []
  - rule_id: validation_orchard_life_disclosure
    applies_to: "orchard establishment and management"
    rule: "Reject or flag a dataset that includes perennial orchard production but omits orchard age, establishment period, productive-life horizon, replacement events, or allocation basis."
    source_ids:
      - fao-avocado-production-guide
      - iso-14067
  - rule_id: validation_irrigation_and_nutrients
    applies_to: "irrigation and nutrient inputs"
    rule: "Check that zero irrigation or zero nutrient input is supported by farm records or documented production rationale, and that product mass is not confused with nutrient mass."
    source_ids:
      - fao-crop-production-methodology
  - rule_id: validation_mass_balance
    applies_to: "harvest and conditioning"
    rule: "Check mass balance for each harvest or conditioning boundary and require explanation for evidence gap differences, reject destinations, stock changes, or moisture conversions."
    source_ids: []
  - rule_id: validation_boundary_exclusions
    applies_to: "downstream activities"
    rule: "Reject unreported inclusion of off-farm transport, storage, processing into oil or purée, retail, consumer use, or packaging end-of-life unless the study declares a boundary extension."
