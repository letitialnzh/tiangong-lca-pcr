allocation_rules:
  - rule_id: allocation_output_classification
    applies_to: "all outputs"
    rule: "Assign each quantity once to accepted product, valuable co-product, field-returned residue, rework, downgraded product, waste or loss at one hand-off."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: allocation_residue_default
    applies_to: "straw/stems/leaves/hulls"
    rule: "Field-returned material has no co-product allocation; removed material is a co-product only with beneficial destination and positive value, otherwise waste."
    source_ids:
      - vce-faba-bean-2024
      - ipcc-2019-managed-soils
  - rule_id: allocation_economic_precedence
    applies_to: "independently valuable co-products"
    rule: "Use economic allocation with contemporaneous farm-gate values; otherwise single-output treatment. Report mass-allocation sensitivity when values are unavailable, unstable, or based on fewer than three representative transactions."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "damaged/off-spec grain"
    rule: "Retain burdens through re-cleaning/re-grading, count loop energy once, and classify material only at final hand-off."
    source_ids: []
  - rule_id: allocation_route_period
    applies_to: "mixed routes/shared runs"
    rule: "Attribute field burdens by crop cycle and post-harvest burdens by metered lot or throughput share; assign shared cleaning/changeover once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_cycle
      process_id: "managed_field_production"
      flow_role: "inputs, area and emission drivers"
      record_type: "field log/invoice/meter"
      raw_fields: "crop; field; dates; area; seed; each nutrient product/analysis; treatments; water; carriers; lime/urea; prior crop"
      collection_method: "reconcile logs, invoices, meters and maps"
      unit: "native units, kg, L, m3, MJ, kWh, ha"
      frequency: "each operation"
      temporal_coverage: "crop cycle"
      site_scope: "each field/route"
      aggregation_rule: "retain product rows; sum like identities; allocate shared use by documented driver"
      quality_evidence: "invoices, calibration, map, application/meter log"
    - protocol_id: cp_harvest_lot
      process_id: "mature_crop_harvest"
      flow_role: "crop, collected state, residues and losses"
      record_type: "ticket/sample/log"
      raw_fields: "lot; maturity; route; pre-drying; masses; moisture; fractions; shatter; residue dry matter/destination; energy"
      collection_method: "scales plus representative loss sampling"
      unit: "kg, %, kg DM, MJ, kWh"
      frequency: "field/lot"
      temporal_coverage: "harvest period"
      site_scope: "field/route"
      aggregation_rule: "reconcile standing, collected, residue and loss; weight routes by accepted output"
      quality_evidence: "calibration, sample design, log"
    - protocol_id: cp_conditioning_lot
      process_id: "threshing_cleaning"
      flow_role: "clean grain, residues, rejects and energy"
      record_type: "batch/meter/scale"
      raw_fields: "lot; route; mass/moisture; residue mass/moisture/destination/value; rejects; energy/changeover"
      collection_method: "calibrated instruments and destination records"
      unit: "kg, %, kg DM, MJ, kWh"
      frequency: "lot/run"
      temporal_coverage: "campaign"
      site_scope: "line/site"
      aggregation_rule: "close wet/dry mass balance; assign shared burdens once"
      quality_evidence: "calibration, batch sheet, receipt"
    - protocol_id: cp_drying_lot
      process_id: "moisture_stabilization"
      flow_role: "stable grain, energy, water and loss"
      record_type: "dryer/meter/moisture log"
      raw_fields: "lot; technology; paired mass/moisture; duration; temperature; airflow; carriers; losses"
      collection_method: "calibrated mass/moisture and energy records"
      unit: "kg, %, MJ, kWh, h, °C"
      frequency: "lot"
      temporal_coverage: "campaign"
      site_scope: "drying route"
      aggregation_rule: "preserve dry matter; calculate water; assign energy/loss"
      quality_evidence: "calibration, dryer/meter/inspection log"
    - protocol_id: cp_grading_lot
      process_id: "farm_gate_grading"
      flow_role: "accepted, downgraded, rework and rejects"
      record_type: "grading/scale/sales record"
      raw_fields: "lot; incoming mass/moisture; criteria; each output mass/destination/value; rework; energy; date"
      collection_method: "scale/sorter reconciled to destination"
      unit: "kg, %, currency/kg, MJ, kWh"
      frequency: "lot"
      temporal_coverage: "reporting period"
      site_scope: "grading site"
      aggregation_rule: "accepted + downgraded + rejects = input − measured loss; rework only at final hand-off"
      quality_evidence: "calibration, ticket, invoice, receipt"
  calculation_rules:
    - id: calc_moisture_dry_matter
      applies_to: "moisture conversion"
      rule: "dry matter = wet mass × (1 − wet-basis moisture fraction); normalized wet mass = dry matter / (1 − target fraction)"
      inputs:
        - "paired mass/moisture"
      output: "dry matter and normalized mass"
      source_ids:
        - fao-grain-drying
    - id: calc_removed_water
      applies_to: "drying"
      rule: "incoming water minus outgoing water; do not count as dry-matter loss"
      inputs:
        - "paired mass/moisture"
      output: "kg water"
      source_ids:
        - fao-grain-drying
    - id: calc_accepted_yield
      applies_to: "field/reference"
      rule: "accepted net grain divided by cultivated area; disclose failed area and moisture"
      inputs:
        - output
        - area
        - moisture
      output: "kg/ha"
      source_ids: []
    - id: calc_residue_n
      applies_to: "returned residue"
      rule: "selected national method or IPCC Equation 11.6, separating above/below ground and removed/burned fractions"
      inputs:
        - yield
        - "residue DM/N"
        - "destination fractions"
      output: "kg residue N returned"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_mass_balance
      applies_to: "post-harvest lots"
      rule: "incoming dry matter = accepted + downgraded + valuable residue + final waste/loss dry matter; investigate residual"
      inputs:
        - "all states/moisture"
      output: "closure error/flag"
      source_ids: []
    - id: calc_route_mix
      applies_to: "route alternatives"
      rule: "sum(route result × accepted-output share); enter shared burdens once"
      inputs:
        - "route inventories/shares"
      output: "production mix"
      source_ids: []
    - id: calc_economic_allocation
      applies_to: "valuable outputs"
      rule: "output value / sum independently valuable output values on same period/moisture basis"
      inputs:
        - "masses/prices/moisture"
      output: "allocation fractions"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "grain"
      requirement: "Demonstrate *Vicia faba*, mature dry-grain purpose, market name, grade and non-seed hand-off."
      evidence: "crop/lot/specification/invoice"
    - id: dq_temporal
      applies_to: "route"
      requirement: "Link one representative crop cycle to its post-harvest lots; justify averaging and retain failed crops."
      evidence: "dated records"
    - id: dq_measurement
      applies_to: "mass/moisture/energy/water"
      requirement: "Use calibrated instruments or documented invoices/meters; retain basis, uncertainty and substitutions."
      evidence: "calibration and raw records"
    - id: dq_completeness
      applies_to: "output states"
      requirement: "Reconcile accepted, downgraded, reworked, residue, waste, shattering, handling and removed-water states."
      evidence: "node balances/receipts"
    - id: dq_route_specificity
      applies_to: "alternatives"
      requirement: "Keep winter/spring, rainfed/irrigated, manual/mechanical and natural/mechanical drying records separate before mixing."
      evidence: "route-coded records"
    - id: dq_flow_identity
      applies_to: "parameterized/unmapped rows"
      requirement: "Resolve every emitted Product exchange and substance/compartment-specific elementary exchange to verified UUIDs before TIDAS publication."
      evidence: "resolution record"
    - id: dq_range_review
      applies_to: "quantitative rows"
      requirement: "Use ranges only as QA screens; investigate exceptions and retain foreground values."
      evidence: "QA note/raw record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference output"
    rule: "Require the stated product/property/unit-group UUIDs, 1,000 kg, mature dry *Vicia faba*, moisture, grade and farm-gate hand-off."
    source_ids: []
  - rule_id: validate_scope
    applies_to: "package"
    rule: "Reject green beans, planting seed sold as seed, other pulse species, downstream processing or post-gate transport in the reference output."
    source_ids: []
  - rule_id: validate_processes
    applies_to: "graph"
    rule: "Require field production, harvest, threshing/cleaning and grading; require drying when moisture exceeds target or active drying/aeration occurs."
