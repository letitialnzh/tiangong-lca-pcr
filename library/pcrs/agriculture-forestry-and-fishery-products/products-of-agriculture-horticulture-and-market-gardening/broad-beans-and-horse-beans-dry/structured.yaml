        - vce-faba-bean-2024
        - feedipedia-faba-bean
    - rule_id: boundary_harvest_node
      applies_to: "harvest"
      rule: "Keep harvest distinct because standing crop becomes collected material and creates shattering, field-residue and hand-off records before conditioning."
      source_ids:
        - fao-predrying
    - rule_id: boundary_conditioning_states
      applies_to: "post-harvest"
      rule: "Record harvested material, clean grain, stabilized grain, residues, removed water, rejects and losses at their actual hand-offs."
      source_ids:
        - fao-grain-postharvest
    - rule_id: boundary_residue_destination
      applies_to: "residues"
      rule: "Separate returned, removed, burned and discarded residues in soil-emission calculations and prevent double counting."
      source_ids:
        - ipcc-2019-managed-soils
