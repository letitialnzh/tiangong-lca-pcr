system_boundary:
  rules:
    - rule_id: before_oil_extraction
      applies_to: "all routes"
      rule: "End at graded dry kernel hand-off; exclude crushing, pressing, extraction, refining and press-cake handling."
      source_ids:
        - fao-coconut-postharvest-compendium
    - rule_id: separate_harvest
      applies_to: "harvest"
      rule: "Record harvest separately from biological production and conditioning."
      source_ids:
        - fao-coconut-postharvest-compendium
    - rule_id: drying_gate
      applies_to: "drying"
      rule: "Start at opened nuts or fresh kernel; record route and end at measured stable copra moisture."
      source_ids:
        - fao-coconut-postharvest-compendium
        - fao-aflatoxin-copra
    - rule_id: route_separation
      applies_to: "drying"
      rule: "Keep sun, solar, smoke, hot-air, kiln and hybrid route energy and output separate before output-weighted aggregation."
      source_ids:
        - fao-coconut-postharvest-compendium
