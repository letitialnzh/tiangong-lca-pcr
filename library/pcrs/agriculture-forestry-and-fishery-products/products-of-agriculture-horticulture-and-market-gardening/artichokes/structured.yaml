      flow_role: "marketable output and final rejects"
      record_type: "dispatch scale, lot record, and reject record"
      raw_fields: "lot; date; gate; packed mass; grade; reject; destination; gate state"
      collection_method: "final scale and lot reconciliation"
      unit: "kg wet artichokes"
      frequency: "each dispatch lot"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "declared gate"
      aggregation_rule: "sum marketable output and final reject streams; normalize to 1,000 kg"
      quality_evidence: "calibrated scale or lot record and grade record"
  calculation_rules:
    - id: calc_nutrient_mass
      applies_to: "fertilizer, manure, compost, and amendment rows"
      rule: "Product mass multiplied by the documented nutrient fraction; retain original product mass and nutrient basis."
      inputs:
        - "product invoice"
        - "nutrient concentration"
        - "application record"
      output: "kg N, kg P2O5, or kg K2O by cycle or year"
      source_ids:
        - ucanr-artichoke-cultural-tips-2026
    - id: calc_crop_cycle_normalization
      applies_to: "all crop-cycle and production-year inputs"
      rule: "Crop-cycle or production-year quantity divided by marketable fresh artichoke mass and multiplied by 1,000 kg."
      inputs:
        - "input record"
        - "marketable gate output"
      output: "normalized quantity per 1,000 kg output"
      source_ids: []
    - id: calc_perennial_attribution
      applies_to: "perennial stand establishment, cutback, and regrowth"
      rule: "Apply the documented stand-age or production-year attribution rule to shared stand inputs, then reconcile each year to its marketable output."
      inputs:
        - "stand register"
        - dates
        - "input records"
        - "annual output"
      output: "production-year quantity"
      source_ids:
        - ucanr-artichoke-cultural-tips-2026
    - id: calc_area_time
      applies_to: "land occupation"
      rule: "Production area multiplied by represented crop-cycle or production-year duration; disclose protected area treatment."
      inputs:
        - "area register"
        - "crop or production dates"
      output: "area-time quantity"
      source_ids:
        - ucanr-artichoke-production-1997
    - id: calc_nitrogen_emission
      applies_to: "direct soil nitrous oxide and ammonia"
      rule: "Apply the selected IPCC-compatible factor to eligible nutrient inputs and declared soil or climate method; document factors in the dataset."
      inputs:
        - "nutrient records"
        - "method choice"
        - "soil or climate parameters"
      output: "kg N2O or kg NH3 emitted"
      source_ids:
        - ipcc-2019-refinement-nitrogen
    - id: calc_nitrate_loss
      applies_to: "nitrate to freshwater"
      rule: "Calculate from eligible nitrogen surplus and selected site or method factor; do not infer loss from purchase alone."
      inputs:
        - "nutrient records"
        - "surplus calculation"
        - factor
      output: "kg NO3- emitted"
      source_ids:
        - ipcc-2019-refinement-nitrogen
    - id: calc_gate_mass_balance
      applies_to: "harvest and gate preparation"
      rule: "Received bud mass equals marketable gate output plus field or conditioning rejects, residue, wastewater-related solids, and documented handling loss within measurement uncertainty."
      inputs:
        - "harvest tickets"
        - "conditioning records"
        - "dispatch and reject records"
      output: "reconciled mass balance"
      source_ids:
        - ucanr-artichoke-cultural-tips-2026
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all flow and product records"
      requirement: "Declare artichoke form, cultivar group, annual or perennial route, stand age where relevant, gate, bud maturity and grade, wash or cooling state, and packaging state; resolve platform identities during foreground dataset construction where required."
      evidence: "lot record, product description, and reference-flow qualifiers"
    - id: quality_measurement
      applies_to: "inputs and outputs"
      requirement: "Prefer calibrated meters, scales, supplier invoices, nutrient plans, and application logs; document estimation and allocation methods where direct measurement is unavailable."
      evidence: "meter calibration, scale record, invoice, or calculation sheet"
    - id: quality_temporal
      applies_to: "crop-cycle or production-year inventory"
      requirement: "Cover the full represented establishment, active management, cutback or dormancy where applicable, harvest campaign, and gate preparation period."
      evidence: "establishment dates, application log, irrigation records, harvest tickets, and dispatch records"
    - id: quality_completeness
      applies_to: "crop-cycle or production-year balance"
      requirement: "Reconcile planting material, nutrients, irrigation, energy, crop protection, gross buds, marketable output, residue, rejects, wastewater, and packaging streams."
      evidence: "crop-cycle or production-year input and mass reconciliation"
    - id: quality_disclosure
      applies_to: "dataset metadata"
      requirement: "Disclose annual or perennial route, stand age, irrigation source, nutrient basis, crop-protection products, harvest flushes, washing, cooling, packaging, and residue or reject destination."
      evidence: "dataset metadata and supporting records"
validation_rules:
  - rule_id: validate_reference_output
    applies_to: "reference flow and gate output"
    rule: "The declared reference output must be marketable fresh artichoke buds at the declared gate and use mass in kg; opened flowers, frozen, canned, cooked, or retail products are outside this PCR."
    source_ids:
      - ucanr-artichoke-cultural-tips-2026
  - rule_id: validate_crop_cycle_dates
    applies_to: "establishment, management, harvest, and gate preparation"
    rule: "Establishment, applications, irrigation, cutback or dormancy, harvest flushes, conditioning, and gate output must fall within the declared crop cycle or production year or be explicitly attributed to it."
    source_ids:
      - ucanr-artichoke-production-1997
      - ucanr-artichoke-cultural-tips-2026
  - rule_id: validate_nutrient_basis
    applies_to: "nutrient inputs and emissions"
    rule: "Product mass, nutrient concentration, nutrient basis, and emission calculation method must be present and internally consistent; do not count product mass and nutrient mass as the same exchange."
    source_ids:
      - ucanr-artichoke-cultural-tips-2026
      - ipcc-2019-refinement-nitrogen
  - rule_id: validate_mass_balance
    applies_to: "harvest and gate preparation"
    rule: "Gross harvest and received mass must reconcile with marketable output, rejects, residues, wastewater-related solids, and losses within the declared measurement uncertainty."
    source_ids:
      - ucanr-artichoke-cultural-tips-2026
  - rule_id: validate_flow_set_resolution
    applies_to: "parameterized rows"
    rule: "During foreground data generation, each parameterized row must resolve to a verified UUID compatible with its specified Flow Set group, property, unit, and geography; otherwise retain an explicit coverage finding."
    source_ids: []
  - rule_id: validate_qualifiers
    applies_to: "reference flow and dataset metadata"
    rule: "Required qualifiers must be present, including annual or perennial route, stand age where relevant, bud maturity and grade, harvest flushes, gate, washing, cooling, packaging, and residue or reject fate."
    source_ids:
      - ucanr-artichoke-cultural-tips-2026
published_dataset_profile:
  dataset_role: "foreground agricultural production dataset for fresh artichokes at a farm-gate or pack-house gate"
  downstream_use: "secondary_dataset for fresh-artichoke product systems; background_dataset only when the provider explicitly publishes a representative regional or market-average dataset with the required metadata"
  allowed_use: "Comparative product studies, crop-cycle or production-year inventory modelling, farm or pack-house improvement, and declared fresh-artichoke supply-chain assessments within the stated geography and product state"
  excluded_use: "Canned, frozen, dried, marinated, cooked, retail, consumption, seed-production, or unqualified vegetable substitution; do not extrapolate across annual and perennial routes without scenario disclosure"
  required_metadata: "product form; cultivar group; annual or perennial route; stand age; geography; dates or production year; harvest flushes; gate; yield; irrigation source and quantity; nutrient basis; crop-protection program; washing and cooling; packaging; residue and reject fate"
  required_quality_disclosure: "temporal coverage, site scope, measurement versus calculated values, stand attribution and allocation rules, mass-balance result, platform identity resolution status, and all provisional estimates requiring replacement by foreground records"
  update_trigger: "change in crop route, stand age, irrigation method, nutrient program, crop-protection program, harvest form, wash or cooling line, packaging format, gate definition, or evidence that changes material quantities or boundary rules"
