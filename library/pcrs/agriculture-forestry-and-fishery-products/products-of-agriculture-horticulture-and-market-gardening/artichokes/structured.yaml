allocation_rules:
  - rule_id: allocation_single_crop_cycle
    applies_to: "shared field, bed, protected unit, or perennial stand"
    rule: "Attribute crop-cycle or production-year inputs to artichokes using the recorded area, stand, dates, and marketable output; do not allocate to another crop or year without its own records."
    source_ids:
      - ucanr-artichoke-production-1997
  - rule_id: allocation_perennial_stand
    applies_to: "perennial artichoke establishment, cutback, dormancy, and regrowth"
    rule: "Disclose stand age and assign establishment or shared stand burdens across the declared production years using a documented attribution rule; do not silently assign all stand establishment to one harvest year."
    source_ids:
      - ucanr-artichoke-cultural-tips-2026
  - rule_id: allocation_residue_fate
    applies_to: "crop residue, field loss, rejects, and trim"
    rule: "Do not assign a co-product credit to residue or rejects unless a documented recipient, quantity, and intended use exists; otherwise retain the burden with artichoke production and report the fate."
    source_ids:
      - ucanr-artichoke-weed-management-2005
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "crop_establishment"
      flow_role: "planting material and establishment inputs"
      record_type: "planting-material invoice, lot record, and establishment log"
      raw_fields: "lot; material type; viable quantity; field or bed; date; product mass; nutrient amendment"
      collection_method: "retain supplier record and field establishment record"
      unit: "seed, plant, crown, division, kg product, kg nutrient"
      frequency: "each establishment campaign and application"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each field, bed, protected unit, or perennial stand"
      aggregation_rule: "sum by campaign and normalize to marketable output"
      quality_evidence: "supplier lot trace, application record, and stand reconciliation"
    - protocol_id: cp_irrigation_records
      process_id: "crop_establishment_crop_management"
      flow_role: "crop irrigation"
      record_type: "meter, pump, controller, or water-balance record"
      raw_fields: "source; meter start and end; event date; area; method; rainfall adjustment"
      collection_method: "meter reading or documented water-balance calculation"
      unit: "m3"
      frequency: "each event or meter period"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each field, bed, protected unit, or stand"
      aggregation_rule: "sum delivered irrigation by cycle, year, and source"
      quality_evidence: "calibrated meter or documented balance inputs"
    - protocol_id: cp_field_energy_records
      process_id: "crop_establishment_crop_management"
      flow_role: "mobile machinery fuel and field electricity"
      record_type: "fuel invoice, equipment activity log, and electricity meter"
      raw_fields: "fuel or electricity; equipment; operation; field; date; allocation basis"
      collection_method: "supplier record plus equipment or meter log"
      unit: "L, kg, MJ, or kWh"
      frequency: "each refuelling, operation, or meter period"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each artichoke production unit"
      aggregation_rule: "allocate shared operations by area, hours, flow, or throughput"
      quality_evidence: "invoice, equipment log, meter record, and allocation calculation"
    - protocol_id: cp_nutrient_records
      process_id: "crop_establishment_crop_management"
      flow_role: "nutrient inputs and nitrogen basis"
      record_type: "nutrient plan, supplier invoice, and application log"
      raw_fields: "product; nutrient concentration; date; area; quantity; method; soil test"
      collection_method: "reconcile product records with field application records"
      unit: "kg product and kg nutrient"
      frequency: "each application"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each artichoke production unit"
      aggregation_rule: "sum nutrient mass by cycle or year and declared nutrient basis"
      quality_evidence: "soil test, label or supplier specification, and application log"
    - protocol_id: cp_crop_protection_records
      process_id: "crop_management"
      flow_role: "crop-protection products"
      record_type: "treatment log and supplier record"
      raw_fields: "product; active ingredient; rate; area; date; target; equipment"
      collection_method: "record each application and product lot"
      unit: "kg product or kg active ingredient"
      frequency: "each application"
      temporal_coverage: "full represented crop cycle or production year"
      site_scope: "each artichoke production unit"
      aggregation_rule: "sum by product, active ingredient, and cycle or year"
      quality_evidence: "application log and product label"
    - protocol_id: cp_field_records
      process_id: "crop_establishment_crop_management"
      flow_role: "land occupation, area, and stand attribution"
      record_type: "field, bed, protected-unit, or perennial-stand register"
      raw_fields: "area; unit; land use; crop dates; stand age; bed identifier; protection structure"
      collection_method: "verify area, dates, and stand age against production register"
      unit: "ha, m2, days, and years"
      frequency: "each crop cycle or production year"
      temporal_coverage: "full represented cycle or year"
      site_scope: "each artichoke field, bed, protected unit, or stand"
      aggregation_rule: "calculate area-time and allocate shared stand burdens with the declared rule"
      quality_evidence: "field map, register, dates, and stand evidence"
    - protocol_id: cp_harvest_reconciliation
      process_id: "crop_management_harvest_and_gate_preparation"
      flow_role: "harvest, field residue, and field loss"
      record_type: "harvest ticket, scale record, and residue or loss record"
      raw_fields: "field; flush; date; gross mass; marketable mass; residue; loss; destination"
      collection_method: "weigh each harvest or use documented lot reconciliation"
      unit: "kg wet material"
      frequency: "each harvest flush or lot"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each artichoke field, bed, or stand"
      aggregation_rule: "reconcile gross harvest, marketable buds, rejects, residue, and losses"
      quality_evidence: "scale record, lot ticket, and destination record"
    - protocol_id: cp_postharvest_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "washing, wastewater, rejects, and packaging"
      record_type: "conditioning batch and utility records"
      raw_fields: "received mass; wash water; discharge; trim; packaging; batch; date; fate"
      collection_method: "batch record plus meter and packaging allocation"
      unit: "kg, m3, kWh, and packaging units"
      frequency: "each batch or meter period"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each preparation line or pack-house"
      aggregation_rule: "aggregate by batch and normalize to marketable gate output"
      quality_evidence: "meter record, batch sheet, and waste or treatment receipt"
    - protocol_id: cp_postharvest_energy_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "cooling, grading, washing, and packing electricity"
      record_type: "electricity meter and equipment throughput record"
      raw_fields: "meter period; line; kWh; throughput; cooling duration; batch"
      collection_method: "meter allocation by throughput or run time"
      unit: "kWh"
      frequency: "each meter period or batch"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each in-scope preparation line"
      aggregation_rule: "allocate shared electricity by throughput and reconcile to batch output"
      quality_evidence: "meter data and allocation calculation"
    - protocol_id: cp_packaging_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "primary packaging"
      record_type: "packaging specification, bill of materials, and count record"
      raw_fields: "material; unit mass; units; reuse status; batch; output mass"
      collection_method: "packaging count and specification reconciliation"
      unit: "kg material and units"
      frequency: "each packaging lot or batch"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each preparation line"
      aggregation_rule: "sum packaging material per gate output and disclose reuse"
      quality_evidence: "supplier specification, count sheet, and reuse declaration"
    - protocol_id: cp_gate_output_records
