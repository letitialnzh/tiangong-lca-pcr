system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "establishment and stand management"
      rule: "Include bed preparation, establishment or perennial regrowth, crop management, crop-cycle inputs, and harvest preparation that produce the declared fresh artichoke output; disclose prior land use and exclude unrelated infrastructure construction."
      source_ids:
        - ucanr-artichoke-production-1997
        - ucanr-artichoke-cultural-tips-2026
    - rule_id: boundary_gate_conditioning
      applies_to: "harvest and primary conditioning"
      rule: "End the foreground system at the declared farm-gate or pack-house gate and include cutting, grading, trimming, washing, cooling, and primary packing when they occur before that gate."
      source_ids:
        - ucanr-artichoke-cultural-tips-2026
    - rule_id: boundary_soil_nitrogen
      applies_to: "fertilizer, crop residues, and managed soil"
      rule: "Estimate applicable direct and indirect nitrogen emissions using one declared method and the recorded nutrient inputs and residue fate; avoid double counting a nitrogen pathway."
      source_ids:
        - ipcc-2019-refinement-nitrogen
    - rule_id: boundary_residue_fate
      applies_to: "field residue, rejects, and trim"
      rule: "Record field return, composting, feed use, treatment, or disposal separately; a material with no demonstrated productive use remains a residue or waste flow."
      source_ids:
        - ucanr-artichoke-weed-management-2005
        - ucanr-artichoke-cultural-tips-2026
boundary_abstraction:
  declared_starting_condition: "Prepared production bed or protected-cultivation unit receiving artichoke seed, transplant, crown, or division material, with prior land use and excluded infrastructure work disclosed"
  starting_condition_role: "Start of the declared annual crop cycle or perennial production-year accounting"
  product_classification_scope: "Fresh artichokes under CPC 3.0:01216 through the declared farm-gate or pack-house gate"
  recursive_input_rule: "Purchased artichoke seed, transplants, crowns, or divisions are upstream product inputs linked once; their own production is outside this PCR unless a separate upstream dataset is supplied."
  upstream_dataset_requirement: "Require upstream datasets for planting material, fertilizers and amendments, crop-protection products, irrigation water, energy, packaging, and purchased transport or treatment services when used."
  disclosure: "Declare geography, annual or perennial route, stand age, establishment material, crop dates or production year, irrigation source and method, nutrient basis, crop-protection program, harvest flushes, yield and reject reconciliation, washing and cooling, packaging, residue fate, and gate location."
