allocation_rules:
  - rule_id: allocation_single_crop_cycle
    applies_to: "shared field, bed, protected unit, or perennial stand"
    rule: "Attribute crop-cycle or production-year inputs to artichokes using the recorded area, stand, dates, and marketable output; do not allocate to another crop or year without its own records."
    source_ids:
      - ucanr-artichoke-production-1997
  - rule_id: allocation_perennial_stand
    applies_to: "perennial artichoke establishment, cutback, dormancy, and regrowth"
    rule: "Disclose stand age and assign establishment or shared stand burdens across the declared production years using a documented attribution rule; do not silently assign all stand establishment to one harvest year."
    source_ids:
      - ucanr-artichoke-cultural-tips-2026
  - rule_id: allocation_residue_fate
    applies_to: "crop residue, field loss, rejects, and trim"
    rule: "Do not assign a co-product credit to residue or rejects unless a documented recipient, quantity, and intended use exists; otherwise retain the burden with artichoke production and report the fate."
    source_ids:
      - ucanr-artichoke-weed-management-2005
