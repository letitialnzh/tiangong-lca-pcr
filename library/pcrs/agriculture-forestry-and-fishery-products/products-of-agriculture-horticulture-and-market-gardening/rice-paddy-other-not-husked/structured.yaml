validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow and farm-gate output"
    rule: "Require the fixed paddy UUID, mass property, kg unit, and required qualifiers when the declared state matches the verified farm-gate identity; reject husked, milled, broken, or seed-for-sowing substitutions."
    source_ids:
      - unsd-cpc-rice-01132
  - rule_id: validate_boundary_qualifiers
    applies_to: "dataset metadata and gate"
    rule: "Check declared non-seed use, not-husked state, farm gate, crop year or season, geography, moisture basis, production system, and water regime."
    source_ids:
      - unsd-cpc-rice-01132
      - fao-rice-postharvest
  - rule_id: validate_mass_balance
    applies_to: "paddy, co-products, losses, and residues"
    rule: "Reconcile measured input and output masses on a common moisture basis; explain any difference, boundary crossing, retained residue, or evidence gap loss."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_input_coverage
    applies_to: "crop and harvest processes"
    rule: "Require a collected value, justified zero, or documented exclusion for seed, nutrients, water, crop protection, land, energy, direct emissions, and gate operations."
    source_ids:
      - irri-rice-production-knowledge-bank
      - irri-rice-water-management
  - rule_id: validate_emission_method
    applies_to: "direct emissions"
    rule: "Require a selected method, method inputs, factor evidence, and an identity-compatible verified elementary-flow UUID; do not publish evidence gap emission rows as fixed exchanges."
    source_ids:
      - ipcc-2019-afolu
  - rule_id: validate_co_product_fate
    applies_to: "straw, residue, and other non-reference outputs"
    rule: "Require measured amount, moisture basis, destination, use or treatment, and allocation decision for each boundary-crossing co-product; do not treat field-retained residue as an exported product."
    source_ids:
      - fao-rice-postharvest
      - iso-14044-2006
  - rule_id: validate_flow_binding
    applies_to: "every inventory row"
    rule: "Accept only fixed for an exact verified UUID or parameterized for an applicable existing Flow Set; otherwise retain unmapped coverage and do not force a product-output match."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Validation output must distinguish accepted input, checks performed, checks skipped, findings, and completeness. An identity evidence gap or inconclusive check remains a finding for review and is not silently converted into a zero amount."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground agricultural product dataset for non-seed, not-husked rice paddy at a declared farm gate"
  downstream_use: "secondary_dataset for downstream husking, milling, food, feed, or other declared rice-product systems; background_dataset only when its farm-gate metadata and quality disclosure are preserved"
  allowed_use: "modelling non-seed rice paddy production and farm-gate handoff with declared crop cycle, geography, moisture basis, production system, water regime, and output fate"
  excluded_use: "rice seed for sowing; husked, milled, broken, or processed rice; post-farm-gate drying, storage, distribution, food or feed manufacture; datasets missing gate or moisture qualifiers"
  required_metadata: "fixed product UUID; reference property and unit group; variety or hybrid where material; seed source; crop year or season; geography; farm gate; production system; water regime; moisture basis; intended downstream use; input and output fates; allocation; method and factor references"
  required_quality_disclosure: "temporal, geographical, technological, completeness, measurement, moisture, identity, allocation, direct-emission method, and evidence gap-coverage disclosures"
  update_trigger: "change in product identity, classification scope, farm-gate definition, rice production route, emission method, Flow Set contract, required qualifiers, or material evidence for quantities and output fates"
