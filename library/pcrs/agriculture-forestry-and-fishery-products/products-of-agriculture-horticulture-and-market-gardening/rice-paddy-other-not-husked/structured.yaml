allocation_rules:
  - rule_id: allocation_subdivision_priority
    applies_to: "separable field, harvest, and handoff operations"
    rule: "Subdivide independently measured operations and assign their direct inputs and outputs to the relevant product or fate before applying allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_removed_residue
    applies_to: "removed straw and other declared co-products"
    rule: "Treat removed straw or another material as a co-product only when it crosses the boundary with a declared use and destination. Allocate shared burdens only after measured product and residue quantities and their common moisture basis are reconciled."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_shared_crop_burdens
    applies_to: "paddy and co-products from a common crop route"
    rule: "When subdivision is not possible, document the selected physical or economic allocation basis, the evidence for that basis, and a sensitivity case where the choice can affect interpretation. Do not allocate burdens to material that remains on the field unless the selected method explicitly requires such treatment."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "If straw or other residue is left on the field, record the field-management practice and any direct emissions or soil inputs required by the selected method, but do not create an exported co-product exchange. Husking, milling, drying, cleaning, and downstream conversion are not co-product handling within this default PCR boundary."
    source_ids: []
