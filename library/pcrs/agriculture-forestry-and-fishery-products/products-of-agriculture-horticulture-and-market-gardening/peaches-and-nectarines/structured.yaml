allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "separable blocks, species, cultivars, or runs"
    rule: "Avoid allocation by separately measuring peach and nectarine activities whenever records permit."
    source_ids:
      - source_iso_14044
  - rule_id: allocation_shared_crop_output
    applies_to: "jointly managed outputs"
    rule: "If subdivision is impossible, allocate by documented net marketable mass and disclose mix, basis, and sensitivity."
    source_ids:
      - source_iso_14044
  - rule_id: allocation_residue_route
    applies_to: "culls, residues, and diverted fruit"
    rule: "Treat culls and residues as waste unless a separate product hand-off is documented; do not apply an automatic avoided-burden credit."
    source_ids:
      - source_iso_14044
dataset_production:
  collection_protocols:
    - protocol_id: cp_orchard_inputs
      process_id: "orchard_management"
      flow_role: "orchard inputs, land, water, residues"
      record_type: "invoices, meters, spray logs, field records"
      raw_fields: "block_id; species; cultivar; area; irrigation; electricity; fuel; fertilizer and nutrient basis; crop protection; residues"
      collection_method: "Collect primary records and reconcile to block and cycle; Raw aggregation and attribution: Sum by block and cycle; disclose shared-record allocation"
      unit: "kg; L; m3; kWh; MJ; m2"
      frequency: "Each application or meter period"
      temporal_coverage: "Complete crop cycle and harvest year"
      site_scope: "Each block or documented aggregation"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices; meters; logs; area records"
    - protocol_id: cp_harvest_records
      process_id: "harvest_field_handling"
      flow_role: "gross harvest, fuel, losses"
      record_type: "harvest tickets, weighbridge, bin and fuel logs"
      raw_fields: "block_id; harvest date; species; cultivar; gross mass; fuel; damaged fruit; destination"
      collection_method: "Weigh and reconcile to receiving and loss records; Raw aggregation and attribution: Sum by lot and retain assumptions"
      unit: "kg; L; MJ"
      frequency: "Each lot or shift"
      temporal_coverage: "Harvest window in crop cycle"
      site_scope: "Block, crew, or contractor"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weigh tickets; fuel receipts; supervisor approval"
    - protocol_id: cp_packhouse_records
      process_id: "onsite_sort_cool_pack"
      flow_role: "conditioning, packaging, rejects, net output"
      record_type: "facility meters, run sheets, pack-out reports"
      raw_fields: "run_id; incoming mass; net mass; species; cultivar; grade; electricity; water; package mass/count; rejects"
      collection_method: "Collect facility records and reconcile mass balance; Raw aggregation and attribution: Sum by run and allocate shared services by throughput or mass"
      unit: "kg; kWh; m3; item"
      frequency: "Each run or operating day"
      temporal_coverage: "Declared inclusion period and harvest season"
      site_scope: "Included facility or line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meters; QA records; waste receipts"
  calculation_rules:
    - id: calc_net_marketable_output
      applies_to: "harvest and packing"
      rule: "Net marketable output = gross fruit − losses − rejects − declared diversions; do not subtract transferred streams twice."
      inputs:
        - "gross fruit"
        - losses
        - rejects
      output: "kg net marketable fruit"
      source_ids:
        - source_usda_ams_fresh_fruit_grades
        - source_iso_14044
    - id: calc_crop_cycle_normalization
      applies_to: "all flows"
      rule: "Crop-cycle amount / kg net marketable output for the same declared scope."
      inputs:
        - "crop-cycle amount"
        - "net output"
      output: "amount per kg reference flow"
      source_ids:
        - source_iso_14044
    - id: calc_nutrient_basis
      applies_to: "fertilizer and amendments"
      rule: "Convert actual products using label, analysis, or supplier certificate; retain product and nutrient masses."
      inputs:
        - "product mass"
        - concentration
      output: "kg product and kg N/P/K"
      source_ids:
        - source_ucanr_peach_fertilizer
  data_quality_requirements:
    - id: dq_identity_and_qualifiers
      applies_to: "reference product and cycle records"
      requirement: "Declare species, cultivar, production system, geography, harvest year, maturity/quality grade, hand-off, and conditioning."
      evidence: "metadata; product description; grade records"
    - id: dq_mass_balance
      applies_to: "harvest and packing"
      requirement: "Reconcile gross fruit, marketable product, losses, rejects, and diversions; investigate differences."
      evidence: "weigh tickets; pack-out; waste receipts"
    - id: dq_temporal_and_site_coverage
      applies_to: "orchard and facility aggregation"
      requirement: "Cover the complete crop cycle and identify every contributing block or facility; disclose gaps."
      evidence: "crop calendar; block register; run list"
validation_rules:
  - rule_id: validation_reference_qualifiers
    applies_to: "reference flow and metadata"
    rule: "Reject a dataset missing required qualifiers, hand-off, or net product-mass basis."
    source_ids:
      - source_usda_ams_fresh_fruit_grades
  - rule_id: validation_crop_cycle_completeness
    applies_to: "orchard and harvest"
    rule: "Check inputs, harvest lots, marketable output, and known losses share the same time and site scope."
    source_ids:
      - source_ucanr_peach_nectarine_cultural
      - source_iso_14044
  - rule_id: validation_water_exclusivity
    applies_to: "irrigation water"
    rule: "Do not count the same volume as supplied irrigation water and direct withdrawal."
    source_ids:
      - source_iso_14044
  - rule_id: validation_product_mass_balance
    applies_to: "harvest and conditioning"
    rule: "Require a balance from gross fruit to net marketable output, losses, and rejects."
    source_ids:
      - source_iso_14044
published_dataset_profile:
  dataset_role: "Primary foreground crop-production dataset; may be released as a secondary dataset after review"
  downstream_use: "Support process and lifecyclemodel construction for fresh peaches and nectarines at hand-off"
  allowed_use: "Compare orchard and harvest when qualifiers, boundary, geography, crop cycle, and quality are compatible"
  excluded_use: "Processed fruit, retail or consumer footprints, post-handoff transport, or a different product state"
  required_metadata: "species; cultivar; production system; geography; orchard age; area; harvest year/cycle; hand-off; grade; net mass; loss routes"
  required_quality_disclosure: "Site and period coverage; measured versus estimated inputs; yield/loss reconciliation; nutrient basis; allocations; exclusions"
