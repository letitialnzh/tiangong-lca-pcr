  - rule_id: range_review
    applies_to: "all flow cards"
    rule: "Every card requires a range; candidate reasoned estimates are screening values and must be replaced or confirmed with product-, site-, technology- and gate-specific evidence before reviewed/active status."
    source_ids: []
  - rule_id: mass_reconciliation
    applies_to: "each process node"
    rule: "Reconcile inputs, intermediates, accepted product, co-products, rejects, waste and moisture change by run, field or collection lot and disclose unexplained differences."
    source_ids: []
  - rule_id: parameterized_binding
    applies_to: "Flow Set cards"
    rule: "Expand each parameterized card to verified concrete flows from foreground records and retain Flow Set version and selection evidence; do not attach a fixed UUID to the card."
