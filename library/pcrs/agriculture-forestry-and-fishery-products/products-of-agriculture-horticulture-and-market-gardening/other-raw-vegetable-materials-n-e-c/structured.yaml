allocation_rules:
  - rule_id: physical_separation_first
    applies_to: "all routes"
    rule: "Use run, field, provenance, meter or equipment records for direct partitioning first; allocate only burdens that cannot be directly separated."
    source_ids:
      - iso-14044-2006
  - rule_id: intended_output_attribution
    applies_to: "multi-output processes"
    rule: "List every intended product and handoff. Where independent economic functions exist, select and disclose mass, physical-causal or economic attribution under the applicable study rule and test sensitivity; do not relabel residues or waste as co-products."
    source_ids:
      - iso-14044-2006
  - rule_id: run_period_attribution
    applies_to: "fermentation runs, crop cycles and seed crop years"
