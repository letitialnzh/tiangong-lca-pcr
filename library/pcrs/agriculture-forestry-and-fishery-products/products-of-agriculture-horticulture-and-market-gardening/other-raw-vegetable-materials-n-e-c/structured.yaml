    applies_to: "konjac cultivation"
    rule: "Use at most one consolidated nutrient card in this process, set-level only with flow-set.agricultural-nutrient-supply v0.3.0; do not misclassify fermentation medium or seed-source management as agricultural fertilizer cards."
