allocation_rules:
  - rule_id: allocation_avoid_where_measured
    applies_to: "all nodes"
    rule: "Subdivide and measure route, batch, grade, residue, and destination states before allocation. Accepted output excludes rejects, losses, detached stems, and downgraded material."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_perennial_life
    applies_to: "establishment and long-lived assets"
    rule: "Attribute establishment, immature-year, replacement, and termination burdens once across actual accepted output during the declared service/productive life; do not repeat them in annual management."
    source_ids:
      - fao-ecocrop-clove
      - kau-clove-practices-2016
  - rule_id: allocation_mixed_crop
    applies_to: "mixed stands and shared infrastructure"
    rule: "Prefer measured use, area-time, irrigation volume, operating time, or another causal driver. If causality is unavailable and products have economic functions, use documented economic allocation with sensitivity."
    source_ids:
      - iso-14044-2006
      - kau-clove-practices-2016
  - rule_id: allocation_batches_routes
    applies_to: "harvest and drying"
    rule: "Link inputs, outputs, cleaning/changeover, and shared-run services to batches or periods; weight route strata by accepted output and count each shared burden once."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rejects
    applies_to: "stems, residues, downgraded and rejected material"
    rule: "Retain burdens with the producing node until documented recovery or product function begins. Separately sold outputs trigger subdivision or allocation; wastes do not."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_assets
      process_id: "stand_establishment"
      flow_role: "planting, immature management, replacement, termination, shared assets"
      record_type: "invoice, stand log, asset register"
      raw_fields: "dates; planting identity/mass/count; density; site inputs; replacements; removals; materials; service life; consuming crops/nodes/periods; driver"
      collection_method: "Reconcile invoices, field logs, and asset register to cohorts"
      unit: "kg, count, ha, year"
      frequency: "each event and annual review"
      temporal_coverage: "establishment through termination/cut-off"
      site_scope: "each cohort and asset"
      aggregation_rule: "Divide causal share by accepted output over same service period"
      quality_evidence: "invoices, georeferenced register, dated logs, maintenance record"
    - protocol_id: cp_nutrient_ledger
      process_id: "stand_establishment_annual_tree_management"
      flow_role: "all mineral/organic fertilizers and nutrient amendments"
      record_type: "invoice, application log, certificate"
      raw_fields: "product; mass; N/P2O5/K2O/other nutrients; form; moisture; date; area/trees; phase"
      collection_method: "Collect components separately; aggregate only to one process card"
      unit: "kg product, kg nutrient, fraction"
      frequency: "each application"
      temporal_coverage: "every establishment and productive year"
      site_scope: "each stand/block"
      aggregation_rule: "Sum product mass; calculate nutrient mass by component; resolve actual products to UUIDs"
      quality_evidence: "invoice, label, lab result, scale, application log"
    - protocol_id: cp_water_records
      process_id: "stand_establishment"
      flow_role: "supplemental water"
      record_type: "meter/runtime log"
      raw_fields: "source; volume; reading; runtime; pump; stand; date"
      collection_method: "Meter or validated discharge × runtime"
      unit: "m3"
      frequency: "each event"
      temporal_coverage: "establishment and immature years"
      site_scope: "each source/stand"
      aggregation_rule: "Sum by phase and normalize after lifetime attribution"
      quality_evidence: "calibration, pump curve, dated log"
    - protocol_id: cp_annual_management_inputs
      process_id: "annual_tree_management"
      flow_role: "water and crop protection"
      record_type: "meter, invoice, stock/application log"
      raw_fields: "water volume; product and active ingredient; quantity; treated area; date; leftovers"
      collection_method: "Collect water and each product independently"
      unit: "m3, kg, L"
      frequency: "each event"
      temporal_coverage: "full year"
      site_scope: "each block"
      aggregation_rule: "Retain concrete exchanges; normalize to harvested clusters"
      quality_evidence: "calibration, invoices, labels, stock reconciliation"
    - protocol_id: cp_energy_records
      process_id: "annual_tree_management_harvest_grade"
      flow_role: "field and harvest energy"
      record_type: "receipt, meter, runtime, contractor log"
      raw_fields: "carrier; original quantity; conversion; equipment; runtime; node; batch/period; shared driver"
      collection_method: "Meter or reconcile purchases and stock"
      unit: "MJ, kWh, kg, L, h"
      frequency: "each operation/month"
      temporal_coverage: "full year and all harvests"
      site_scope: "each carrier/node"
      aggregation_rule: "Convert while preserving carrier identity; allocate shared use once"
      quality_evidence: "calibration, receipts, machine logs"
    - protocol_id: cp_harvest_grade_records
      process_id: "annual_tree_management_harvest_grade"
      flow_role: "clusters, buds, stems, grades, losses and rejects"
      record_type: "lot mass-balance sheet"
      raw_fields: "stand; date; maturity; batch; cluster input; bud/stem condition; accepted fresh or drying input; downgraded/reject states and destinations; moisture"
      collection_method: "Weigh and inspect every state in the same lot"
      unit: "kg, moisture fraction"
      frequency: "each lot"
      temporal_coverage: "all harvests in year"
      site_scope: "each block/station"
      aggregation_rule: "Input = accepted + downgraded + all residues ± documented difference; one accepted hand-off route"
      quality_evidence: "calibrated scales, inspection, moisture test, destination receipt"
    - protocol_id: cp_residue_records
      process_id: "annual_tree_management"
      flow_role: "field biomass"
      record_type: "weighing/sampling and destination log"
      raw_fields: "residue type; wet/dry mass; moisture; origin; destination; recovery"
      collection_method: "Weigh or representative sampling"
      unit: "kg wet/dry"
      frequency: "each event/campaign"
      temporal_coverage: "full year"
      site_scope: "each stand/destination"
      aggregation_rule: "Normalize dry matter to harvested clusters; preserve destination rows"
      quality_evidence: "scales, sampling plan, moisture and receipts"
    - protocol_id: cp_drying_records
      process_id: "conditional_drying"
      flow_role: "fresh input, energy, dried output, water loss, rejects"
      record_type: "batch sheet, meter, moisture test"
      raw_fields: "input/output/reject mass; input/final moisture and basis; method; dates; duration; carrier; temperature; weather/dryer state"
      collection_method: "Weigh and moisture-test each batch; meter energy"
      unit: "kg, fraction, MJ, kWh, h, °C"
      frequency: "each batch"
      temporal_coverage: "all dried lots"
      site_scope: "each dryer/mat/station"
      aggregation_rule: "Fresh input = dried output + rejects + water/other loss; keep sun/solar/assisted routes separate"
      quality_evidence: "scale/meter calibration, moisture method, batch and weather/dryer log"
  calculation_rules:
    - id: calc_lifetime_attribution
      applies_to: "perennial phases and assets"
      rule: "Sum cohort/asset burdens assigned by service period and causal share / accepted output over that period"
      inputs:
        - events
        - "service years"
        - driver
        - "annual output"
      output: "burden per kg accepted product"
      source_ids:
        - fao-ecocrop-clove
        - iso-14044-2006
    - id: calc_nutrients
      applies_to: "consolidated nutrient cards"
      rule: "Component nutrient mass = wet product mass × dry-matter fraction × declared nutrient fraction; preserve components and sum product mass only for the card"
      inputs:
        - mass
        - moisture
        - composition
      output: "kg product and nutrient by form"
      source_ids:
        - kau-clove-practices-2016
    - id: calc_soil_n2o
      applies_to: "managed-soil N2O"
      rule: "Apply selected IPCC tier to synthetic/organic/residue N, volatilization, and leaching; convert N2O-N × 44/28"
      inputs:
        - "nutrient ledger"
        - "residue N"
        - "selected factors"
      output: "kg N2O per kg clusters"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_mass_balance
      applies_to: "harvest/grading/drying"
      rule: "Same-batch input = product outputs + wastes + elementary loss ± documented difference; accepted output excludes unresolved material"
      inputs:
        - "masses and moisture"
      output: "reconciliation and normalized flows"
      source_ids:
        - mass-balance-identity
    - id: calc_route_weighting
      applies_to: "route strata"
      rule: "Sum(route amount × accepted route output) / total accepted output after calculating each route separately"
      inputs:
        - "route inventories and outputs"
      output: "weighted inventory"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Confirm species, unopened maturity, whole state, stem condition, grade, fresh/dried state, moisture basis, and farm gate for every lot."
      evidence: "specification, inspection/photo, moisture test, ticket"
    - id: dq_periods
      applies_to: "perennial system"
      requirement: "Cover establishment, immature/productive years, replacements, and termination or disclose censored phases and lifetime sensitivity."
      evidence: "cohort, multi-year yield/input, asset records"
    - id: dq_completeness
      applies_to: "harvest/grading/drying"
      requirement: "Account for at least 95% of same-batch input/output mass or explain and correct the gap."
      evidence: "mass-balance and calibration records"
    - id: dq_route
      applies_to: "alternatives"
      requirement: "Keep sole/mixed, rainfed/irrigated, and fresh/sun/assisted-dried records separate until output weighting."
      evidence: "stratified records and worksheet"
    - id: dq_temporal
      applies_to: "foreground"
      requirement: "Cover a complete year and all harvests; use at least three representative productive years when alternate bearing is material, or disclose limitation."
      evidence: "dated input, yield, and lot records"
    - id: dq_fertilizer
      applies_to: "nutrient supply"
      requirement: "Retain each actual product and composition although each process exposes one consolidated nutrient card; resolve every final exchange to a verified UUID."
      evidence: "ledger, label, invoice, lab certificate, resolution record"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require exact flow/property/unit-group UUIDs, 1 kg, and every qualifier; fresh and dried states cannot be silently combined."
    source_ids:
      - icar-iisr-clove
      - kau-clove-harvesting
  - rule_id: validate_period_attribution
    applies_to: "perennial life/shared assets"
    rule: "Require phase, period, replacement, termination, consuming-node, and attribution records; reject double attribution across establishment, annual management, mixed crops, and assets."
    source_ids:
      - fao-ecocrop-clove
      - iso-14044-2006
  - rule_id: validate_route_delta
    applies_to: "production/drying alternatives"
    rule: "Require parent activity, changed topology/inventory/calculation/data/validation fields, mutually exclusive lot route, and evidence for each stratum."
    source_ids:
      - kau-clove-practices-2016
      - unido-spice-postharvest-2015
  - rule_id: validate_batch_reconciliation
    applies_to: "harvest through drying"
    rule: "Require batch/period identifiers, input-output and cleaning/changeover linkage when present, mass reconciliation, and no duplicate shared-run burden."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_reject_routes
    applies_to: "grading/drying"
    rule: "Every accepted, downgraded, rejected, residue, recovery, and disposal state requires mass and hand-off; reject unresolved material in accepted output or undocumented rework."
    source_ids:
      - kau-clove-harvesting
      - unido-spice-postharvest-2015
  - rule_id: validate_nutrient_cardinality
    applies_to: "nutrient inputs"
    rule: "Each process has at most one nutrient-supply Product-input card, bound only to flow-set.agricultural-nutrient-supply@0.3.0 without group; actual products remain individually collected and resolved."
    source_ids:
      - kau-clove-practices-2016
  - rule_id: validate_drying_condition
    applies_to: "drying"
    rule: "If inactive, drying inputs and dried reference output are absent/zero. If active, require method, energy, fresh/dried mass, moisture, rejects, duration, and stabilized hand-off; count output once."
    source_ids:
      - kau-clove-harvesting
      - unido-spice-postharvest-2015
  - rule_id: validate_ranges
    applies_to: "all quantitative cards"
    rule: "Require exactly one Range per quantitative card; lower ≤ upper, basis/unit/evidence complete, external bounds source-supported, and EN/ZH/structured aligned."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground production package for accepted whole raw cloves at farm gate"
  downstream_use: "Reviewed secondary or background datasets for products using farm-gate whole cloves after methodology, identity, route, and quality review"
  allowed_use: "Farm-gate LCA of declared fresh or farm-dried whole raw cloves; output-weighted aggregation of evidenced strata"
  excluded_use: "Oil, oleoresin, detached stems, ground spice, blends, manufactured products, retail packs, or fresh-to-dried conversion without moisture and route records"
  required_metadata: "Geography; planting stock; crop system; stand age/density; establishment/life treatment; reporting years; irrigation; maturity; grade; stem condition; fresh/dried state; moisture basis; drying route; all grade, reject, residue, and recovery destinations"
  required_quality_disclosure: "Perennial-phase coverage; data age; measured/estimated shares; route weights; mass-balance closure; nutrient coverage; shared-asset allocation; IPCC tier/factors; unresolved upstream identities; uncertainty/sensitivity"
  update_trigger: "Change in identity, productive-life assumption, crop/input regime, harvest/grading, drying, moisture specification, allocation, emission method, or material data refresh"
