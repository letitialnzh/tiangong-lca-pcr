  what: "Accepted whole unopened clove buds at the declared farm-gate state"
  how_much: "1 kg net accepted product"
  how_well: "Meets declared grade and moisture specification; excludes detached stems, opened flowers, spoiled buds, foreign matter, and unresolved rejects"
  how_long_or_cycle: "One reporting year of a productive perennial stand, with establishment, immature years, productive years, replacements, and termination indexed across the declared productive life"
  reference_flow_link: "Net accepted output of harvest_grade for fresh hand-off or conditional_drying for dried hand-off"
system_boundary:
  rules:
    - rule_id: boundary_perennial_phases
      applies_to: "establishment to farm gate"
      rule: "Include propagation, site preparation, planting, immature management, productive management, replacements, harvest, separation, grading, and route-dependent drying. Attribute establishment and long-lived assets across actual output over their service life."
      source_ids:
        - fao-ecocrop-clove
        - kau-clove-practices-2016
    - rule_id: boundary_harvest_state
      applies_to: "harvest"
      rule: "Harvest mature unopened buds before flowering; keep clusters and incidental material distinct. Harvest is separate because it removes output while the perennial tree remains productive."
      source_ids:
        - icar-iisr-clove
        - kau-clove-harvesting
    - rule_id: boundary_conditioning
      applies_to: "post-harvest"
      rule: "Include bud/stem separation and grading. Fresh lots bypass drying; dried lots record method, energy, duration, input/output moisture, mass loss, rejects, and stabilized hand-off."
      source_ids:
        - kau-clove-harvesting
        - unido-spice-postharvest-2015
    - rule_id: boundary_downstream_exclusion
      applies_to: "downstream"
      rule: "Exclude extraction, distillation, grinding, blending, manufacture, retail packing, and post-gate transport."
      source_ids:
        - icar-iisr-clove
        - fao-ecocrop-clove
    - rule_id: boundary_route_stratification
      applies_to: "alternative routes"
      rule: "Keep sole/mixed crop and rainfed/irrigated strata separate. Fresh, sun-dried, and assisted-dried lots are mutually exclusive routes and may only be output-weighted from route records."
      source_ids:
        - kau-clove-practices-2016
        - unido-spice-postharvest-2015
