allocation_rules:
  - rule_id: rule_single_output_crop_allocation
    applies_to: "crop production with one declared marketable output"
    rule: "Assign the full crop-cycle inventory to the declared reference product when no intentional co-product or secondary marketed output is reported."
    source_ids:
      - iso-14044-2006
  - rule_id: rule_grade_output_allocation
    applies_to: "grading, sorting, and multiple marketed grades"
    rule: "Report every intentional marketed grade or co-product. Apply physical mass allocation as the default when outputs have comparable fresh-material function; use an explicitly justified alternative only when mass does not represent the relevant causal relationship."
    source_ids:
      - iso-14044-2006
      - fao-food-loss-waste-2019
  - rule_id: rule_residue_not_coproduct
    applies_to: "field residue, rejects, and non-marketed losses"
    rule: "Treat residues and rejects as waste or destination-specific material unless they are intentionally marketed or transferred as a declared co-product with its own hand-off."
    source_ids:
      - fao-food-loss-waste-2019
  - rule_id: rule_shared_input_allocation
    applies_to: "shared machinery, infrastructure, or utilities"
    rule: "Allocate shared records to the declared crop cycle and output set using documented area, time, mass, or activity drivers; retain the driver and contributing outputs."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_crop_area_yield
      process_id: "p_crop_production"
      flow_role: "area, crop-cycle output, and residue"
      record_type: "field and harvest records"
      raw_fields: "area; crop dates; cultivar; harvested mass; field residue; destination"
      collection_method: "farm records, weighbridge, calibrated measurement, and grower interview"
      unit: "ha, kg, date"
      frequency: "every crop cycle"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each contributing field or production unit"
      aggregation_rule: "aggregate by field and crop cycle, then reconcile to reported output"
      quality_evidence: "field map, weighbridge record, and crop-cycle log"
    - protocol_id: cp_crop_inputs
      process_id: "p_crop_production"
      flow_role: "seed, water, nutrient, energy, fuel, and calculated emissions"
      record_type: "input and utility records"
      raw_fields: "product identity; amount; nutrient basis; water meter; electricity; fuel; application date; source"
      collection_method: "invoices, application logs, meters, supplier declarations, and method calculation"
      unit: "kg, m3, kWh, MJ, kg nutrient"
      frequency: "each application or meter period"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each contributing field or production unit"
      aggregation_rule: "allocate shared records by documented crop-cycle driver"
      quality_evidence: "invoice, meter, application record, and factor-selection note"
    - protocol_id: cp_harvest_operations
      process_id: "p_harvest_capture"
      flow_role: "harvested output, harvest fuel, and losses"
      record_type: "harvest campaign records"
      raw_fields: "operation date; machinery or contractor; fuel or service; harvested mass; damage; field destination"
      collection_method: "harvest log, fuel issue, contractor record, and weighbridge"
      unit: "kg, L, MJ, date"
      frequency: "each harvest event"
      temporal_coverage: "full harvest campaign"
      site_scope: "each harvest block or campaign"
      aggregation_rule: "reconcile standing crop, harvested output, and loss destinations"
      quality_evidence: "harvest log, scale record, and contractor invoice"
    - protocol_id: cp_conditioning_records
      process_id: "p_primary_conditioning"
      flow_role: "conditioning input, water, electricity, rejects, wastewater, and output"
      record_type: "batch and utility records"
      raw_fields: "batch id; input mass; water; electricity; reject mass; wastewater; output mass; treatment route"
      collection_method: "batch sheet, meters, scale, and wastewater record"
      unit: "kg, m3, kWh"
      frequency: "each batch"
      temporal_coverage: "all included conditioning batches"
      site_scope: "each conditioning line or site"
      aggregation_rule: "reconcile input to output, rejects, and wastewater by batch"
      quality_evidence: "batch sheet, scale calibration, meter record, and treatment receipt"
    - protocol_id: cp_grading_reconciliation
      process_id: "p_grading_sorting"
      flow_role: "grade outputs, rejects, and grading input"
      record_type: "grading and sales records"
      raw_fields: "batch id; input; accepted grade; secondary grade; reject; destination; sale status"
      collection_method: "grading log, scale, sales record, and destination record"
      unit: "kg, date"
      frequency: "each grading batch"
      temporal_coverage: "all included grading batches"
      site_scope: "each grading line or site"
      aggregation_rule: "reconcile input to all product outputs and rejects"
      quality_evidence: "grade log, scale record, and destination evidence"
    - protocol_id: cp_packaging_records
      process_id: "p_packaging_presentation"
      flow_role: "product input, packaging, electricity, rejects, and reference output"
      record_type: "packaging and dispatch records"
      raw_fields: "batch id; product input; material and mass; reuse status; electricity; reject; net output; hand-off"
      collection_method: "packaging bill of materials, scale, meter, and dispatch record"
      unit: "kg, kWh, date"
      frequency: "each packaged batch"
      temporal_coverage: "all included packaging batches"
      site_scope: "each packaging line or site"
      aggregation_rule: "report net product separately from packaging mass and reconcile rejects"
      quality_evidence: "packaging specification, scale calibration, utility record, and dispatch record"
  calculation_rules:
    - id: rule_normalize_to_reference_flow
      applies_to: "all inventory rows"
      rule: "normalized_amount = recorded_or_calculated_amount / net_marketable_reference_mass"
      inputs:
        - "row amount"
        - "net marketable reference mass"
      output: "amount per 1 kg reference fresh vegetable"
      source_ids:
        - iso-14044-2006
    - id: rule_calculate_crop_yield_reconciliation
      applies_to: "crop production and harvest"
      rule: "standing_crop = harvested_output + field_loss + residue + other_declared_destinations"
      inputs:
        - "field output"
        - "harvested mass"
        - losses
        - residues
        - destinations
      output: "reconciled crop-cycle output set"
      source_ids:
        - fao-crop-production-guidance-2016
        - fao-food-loss-waste-2019
    - id: rule_calculate_nutrient_basis
      applies_to: "fertilizer or soil amendment input"
      rule: "nutrient_basis = product_mass * declared_nutrient_fraction for each declared nutrient basis"
      inputs:
        - "product mass"
        - "supplier or laboratory nutrient fraction"
      output: "kg N, P, K, or organic nutrient"
      source_ids:
        - fao-fertilizer-code-of-conduct-2019
    - id: rule_calculate_crop_emissions
      applies_to: "crop elementary outputs"
      rule: "Apply the selected IPCC-compatible factor or measured value to the declared nutrient input, soil, climate, and management records; document factor hierarchy and units."
      inputs:
        - "nutrient input"
        - "management records"
        - "selected factor"
        - "measured emissions where available"
      output: "normalized substance-specific elementary flows"
      source_ids:
        - ipcc-2019-refinement-agriculture
    - id: rule_reconcile_grade_outputs
      applies_to: "grading and sorting"
      rule: "grading_input = marketable_grade + secondary_grade + reject + unaccounted_loss; unaccounted loss must be investigated or disclosed"
      inputs:
        - "grading input"
        - "all declared outputs"
        - reject
        - loss
      output: "complete grade-output reconciliation"
      source_ids:
        - fao-food-loss-waste-2019
    - id: rule_reconcile_packaged_output
      applies_to: "packaging and presentation"
      rule: "product_input = net_reference_output + packaging-process_product_loss + other_declared_product_destinations and packaging mass is reported separately"
      inputs:
        - "product input"
        - "net output"
        - losses
        - "package material"
      output: "net reference flow and package inventory"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: req_identity_qualifiers
      applies_to: "all datasets"
      requirement: "Declare species or cultivar, edible part, production route, geography, crop cycle, fresh state, grade or marketability, and first-market hand-off; document the residual-category decision."
      evidence: "dataset metadata, crop record, and classification review"
    - id: req_measurement_traceability
      applies_to: "all quantitative rows"
      requirement: "Prefer calibrated scales and meters, invoices, application logs, and supplier records; retain conversion factors and allocation drivers."
      evidence: "measurement records, calibration evidence, and supplier documentation"
    - id: req_temporal_coverage
      applies_to: "crop production and harvest"
      requirement: "Cover one complete crop cycle and harvest campaign; explain missing events, atypical weather, or off-season operations."
      evidence: "crop calendar, field log, and reporting-period statement"
    - id: req_mass_balance_completeness
      applies_to: "crop, conditioning, grading, and packaging"
      requirement: "Reconcile inputs, product outputs, co-products, residues, rejects, wastewater, and declared losses; investigate unexplained differences."
      evidence: "batch, grade, weighbridge, and dispatch reconciliations"
    - id: req_emission_method_disclosure
      applies_to: "calculated elementary flows"
      requirement: "State the factor or measurement method, nutrient basis, units, geography, climate or soil assumptions, and uncertainty or replacement plan."
      evidence: "calculation sheet, factor reference, and method note"
    - id: req_route_and_scope_disclosure
      applies_to: "conditional processes"
      requirement: "State whether conditioning, grading, packaging, storage, and distribution are included, and identify the first-market hand-off."
      evidence: "process map, site description, and hand-off record"
    - id: req_data_update_trigger
      applies_to: "published datasets"
      requirement: "Reassess the dataset after changes in cultivar, production technology, nutrient regime, irrigation regime, conditioning line, packaging format, geography, or applicable emission method."
      evidence: "change log and periodic review record"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "rule_validate_residual_category: reject the package when a narrower named CPC vegetable category applies or when the species or cultivar and edible part are absent."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "rule_validate_fresh_whole_state: reject processed, frozen, salted, pickled, fermented, dried, powdered, canned, juiced, preserved, seed, planting-material, feed, or waste products."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "rule_validate_reference_qualifiers: require all Required qualifiers and require the reference amount to be 1 kg net fresh product at the declared hand-off."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "rule_validate_process_completeness: require p_crop_production and p_harvest_capture; require each conditional process when its inclusion condition is true and do not count an omitted conditional process as an unexplained gap."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "rule_validate_flow_binding: accept a parameterized Flow Set binding only when the selected group matches the flow’s direction, type, material role, and process state; leave identity evidence gaps unmapped rather than forcing a fixed UUID."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "rule_validate_nutrient_disclosure: when crop_nutrient_or_amendment is present, require actual product identity, applied mass, declared nutrient basis, application timing, and upstream dataset or evidence reference."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "rule_validate_mass_reconciliation: require crop, conditioning, grading, and packaging balances to close within the declared measurement tolerance; investigate unaccounted mass."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "rule_validate_allocation: require all intentional marketed grades or co-products to be listed once and require the selected allocation driver and output set to be disclosed."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "rule_validate_emission_calculation: require substance-specific units, factor or measurement method, nutrient basis, and source evidence for every calculated elementary flow."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "rule_validate_protocol_coverage: require every collected or calculated row to reference a declared collection protocol and every protocol to identify temporal and site scope."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground agricultural production dataset for a residual fresh-vegetable product category; may be published as a secondary_dataset and linked to background supply datasets"
  downstream_use: "Construction of product, process, and lifecyclemodel projections for fresh whole vegetables in CPC 01290 when the residual-category gate is satisfied"
  allowed_use: "Comparative or attributional LCA when species or cultivar, route, geography, crop cycle, hand-off, inventory basis, and data quality are disclosed"
  excluded_use: "Processed or preserved vegetables; seed or planting material; feed or waste products; substitution claims without explicit evidence; extrapolation across unqualified species, route, geography, or market state"
  required_metadata: "CPC 3.0:01290; canonical PCR id; species or cultivar; edible part; route; geography; crop cycle; hand-off; included processes; reference amount; reference flow identity; nutrient and irrigation basis; grade and loss destinations; packaging and storage scope"
  required_quality_disclosure: "Data origin and period; site or field coverage; measurement and allocation methods; mass-balance status; emission-factor or measurement methods; exclusions; uncertainty or provisional ranges"
  update_trigger: "New narrower classification coverage; changed cultivar or production route; material changes in nutrient, irrigation, energy, conditioning, grading, or packaging practice; revised emission methods; material data-quality findings"
