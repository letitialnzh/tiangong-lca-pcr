system_boundary:
  rules:
    - rule_id: boundary_establishment_to_farm_gate
      applies_to: "all conforming datasets"
      rule: "Include inoculated host establishment, managed stand care, harvest, and conditional on-farm preparation performed before the declared farm-gate hand-off."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_perennial_time_basis
      applies_to: "multi-year or multi-period stands"
      rule: "Link establishment, replacement, mortality, management, and harvest records to a declared period and prevent the same stand input or output from being attributed twice."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_managed_soil_emissions
      applies_to: "nutrient, amendment, residue, and soil-management records"
      rule: "Include direct and indirect managed-soil emissions using a geographically applicable method and the same activity data used for nutrient and residue accounting."
      source_ids:
        - ipcc-2019-afolu
    - rule_id: boundary_post_farm_gate_exclusion
      applies_to: "downstream activities"
      rule: "Exclude off-farm transport, storage, preservation, processing, packaging supplied after hand-off, distribution, retail, and use unless a study explicitly extends the system boundary."
      source_ids:
        - iso-14044-2006
