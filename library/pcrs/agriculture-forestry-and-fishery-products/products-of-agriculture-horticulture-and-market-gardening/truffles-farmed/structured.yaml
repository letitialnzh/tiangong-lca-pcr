process_map:
  - id: truffle_host_establishment
    name: "Inoculated host establishment"
    inclusion: "required"
    inclusion_condition: "always for a new or replanted stand; retain the establishment period even when its records are annualized"
    role: "establish host plants and the truffle symbiosis"
    quantitative_reference: "planted area, host stock, inoculation or propagation records, establishment years, and replacement records"
  - id: truffle_stand_management
    name: "Managed perennial or woodland-or-orchard stand management"
    inclusion: "required"
    inclusion_condition: "always during the declared production period"
    role: "maintain the host-symbiosis stand and its soil, water, vegetation, and service inputs"
    quantitative_reference: "managed area, reporting period, stand age, annual inputs, and productive fresh-truffle output"
  - id: truffle_harvest
    name: "Fresh truffle harvest"
    inclusion: "required"
    inclusion_condition: "whenever truffles are removed from the managed stand"
    role: "locate, remove, collect, and reconcile fresh truffles and harvest losses"
    quantitative_reference: "harvested mass, accepted mass, rejected mass, harvest labor or machinery, and soil disturbance records"
  - id: truffle_farm_gate_conditioning
    name: "Farm-gate fresh-truffle conditioning"
    inclusion: "conditional"
    inclusion_condition: "brushing, washing, sorting, grading, cooling, or other preparation occurs before hand-off and is not already included in harvest records"
    role: "prepare harvested truffles to the declared fresh market state"
    quantitative_reference: "incoming mass, accepted mass, rejects, water, energy, and conditioning records"
