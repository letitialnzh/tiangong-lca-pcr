measurement_rules:
  - id: reference_fresh_mass
    applies_to: "reference product and accepted fresh truffle outputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report the as-received mass at the farm-gate hand-off. Record soil adherence, visible moisture, and grading state separately; do not silently convert fresh mass to dry mass."
  - id: perennial_stand_annualization
    applies_to: "establishment and managed-stand inputs"
    required_property_ref:
      name: "Mass, volume, energy, or activity-specific property"
      uuid: ""
    required_unit: "activity-specific unit"
    rule: "Allocate stand-establishment and shared perennial inputs to the declared reporting period using documented stand age, productive period, replacement events, and output records. Do not apply a universal lifetime or yield."
  - id: nutrient_product_and_basis
    applies_to: "fertilizer or soil-amendment input"
