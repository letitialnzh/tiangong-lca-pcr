    rule: "allocation_single_primary_output: Treat accepted fresh farmed truffle as the primary output. Internal host-stand hand-offs and rejected material are not co-products."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_avoid_subdivision: Subdivide establishment, stand management, harvest, and conditioning where a separate co-product or service has a distinct measured hand-off. Avoid allocation when a process can be directly assigned."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "allocation_co_product_evidence: If host timber, fruit, prunings, nursery stock, or another product is intentionally sold or transferred as a co-product, declare its quantity, quality, destination, and hand-off evidence. Use a physical-causality allocation where a defensible relationship exists; otherwise use an explicitly justified economic allocation or another ISO 14044-consistent method."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "allocation_residue_not_product: Treat unmarketed mortality, prunings, removed soil, rejects, and losses as waste or elementary flows according to destination unless evidence shows an intentional product or service hand-off."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "allocation_period_consistency: Apply the same allocation choice across the complete declared stand period and reconcile it with replacement, mortality, and output records."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "truffle_host_establishment"
      flow_role: "establishment inputs, stand hand-off, mortality, land occupation"
      record_type: "planting and nursery record"
      raw_fields: "host species; inoculation status; nursery source; planted items or mass; planted area; establishment date; replacement; mortality; amendment product and nutrient basis"
      collection_method: "supplier invoices, planting registers, block maps, and field interviews reconciled to planted area; Raw aggregation and attribution: aggregate by host species, block, and reporting period; retain source records"
      unit: "kg, item, ha, m2*a, kg nutrient"
      frequency: "each establishment or replacement event"
      temporal_coverage: "full establishment period and replacement events"
      site_scope: "each stand block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed planting records, supplier documents, block map, and survival check"
    - protocol_id: cp_stand_management_records
      process_id: "truffle_stand_management"
      flow_role: "nutrient or amendment, irrigation, fuel, electricity, soil transformation, soil emissions inputs"
      record_type: "stand-period activity record"
      raw_fields: "stand age; area; irrigation meter; product identity; product mass; nutrient basis; fuel; electricity; soil state; residues; management dates"
      collection_method: "meters, invoices, equipment logs, agronomic records, and method-ready soil or residue inventory; Raw aggregation and attribution: aggregate by stand block and period after removing duplicates and shared-service double counting"
      unit: "kg product, kg nutrient, m3, kg, MJ, kWh, ha"
      frequency: "monthly or per application, reconciled annually"
      temporal_coverage: "declared reporting period plus linked stand establishment basis"
      site_scope: "each stand block or contributing site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter or invoice reconciliation, site log, soil plan, and period completeness review"
    - protocol_id: cp_harvest_output_records
      process_id: "truffle_harvest"
      flow_role: "harvest service, harvested product, rejects, soil disturbance"
      record_type: "harvest lot record"
      raw_fields: "harvest date; block; method; labor or service; incoming mass; accepted mass; reject mass; maturity; grade; soil disturbance; destination"
      collection_method: "weighed lot records and harvest logs reconciled to sales or transfer records; Raw aggregation and attribution: sum lots by block and period; reconcile harvested = accepted + rejected + documented loss"
      unit: "kg, h, service unit"
      frequency: "each harvest lot"
      temporal_coverage: "complete harvest season and declared reporting period"
      site_scope: "each harvest block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, lot ticket, sales or transfer record, and reject destination"
    - protocol_id: cp_conditioning_records
      process_id: "truffle_farm_gate_conditioning"
      flow_role: "incoming truffle, water, accepted output, rejects and removed soil"
      record_type: "conditioning batch record"
      raw_fields: "batch id; incoming mass; water; energy if applicable; operation; accepted mass; grade; moisture or soil state; rejects; destination"
      collection_method: "batch sheets, scale records, utility meter, and farm-gate hand-off record; Raw aggregation and attribution: aggregate batches and reconcile incoming mass to accepted output and rejects"
      unit: "kg, m3, kWh"
      frequency: "each conditioning batch"
      temporal_coverage: "only the included pre-farm-gate conditioning period"
      site_scope: "conditioning facility or site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration, batch reconciliation, market-state specification, and hand-off record"
  calculation_rules:
    - id: calc_reference_scaling
      applies_to: "all inventory rows"
      rule: "normalized amount = period amount / accepted fresh-truffle output × 1 kg reference flow"
      inputs:
        - "period amount"
        - "accepted fresh-truffle output"
        - "reference amount"
      output: "amount per 1 kg accepted fresh truffle"
      source_ids:
        - iso-14044-2006
    - id: calc_perennial_annualization
      applies_to: "establishment and shared stand inputs"
      rule: "Allocate each input to the declared reporting period using documented stand period, establishment period, replacement, and productive output; do not use an unstated universal lifetime."
      inputs:
        - "establishment and stand records"
        - period
        - output
        - "replacement and mortality"
      output: "period-attributed inventory amount"
      source_ids:
        - iso-14044-2006
    - id: calc_nutrient_basis
      applies_to: "nutrient or soil-amendment input"
      rule: "nutrient basis = supplied product mass × declared nutrient fraction; retain product mass and each declared nutrient basis as separate outputs."
      inputs:
        - "product mass"
        - label
        - invoice
        - "or supplier nutrient fraction"
      output: "kg product and kg nutrient basis"
      source_ids:
        - iso-14044-2006
    - id: calc_managed_soil_emissions
      applies_to: "managed-soil nitrogen emission"
      rule: "Apply the selected geographically appropriate method to collected nutrient, amendment, residue, and soil activity records; document factors and avoid counting the same nitrogen source twice."
      inputs:
        - "nutrient basis"
        - "residue and soil activity"
        - "selected method factors"
      output: "method-calculated elementary emissions"
      source_ids:
        - ipcc-2019-afolu
    - id: calc_mass_reconciliation
      applies_to: "harvest and conditioning"
      rule: "incoming mass = accepted output + rejects + documented process loss for each lot or batch, with moisture and soil state retained."
      inputs:
        - "lot or batch incoming mass"
        - "accepted mass"
        - rejects
        - losses
      output: "reconciled mass balance and QA finding"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity_and_boundary
      applies_to: "all datasets"
      requirement: "Declare product identity, host species, inoculation status, farm-gate state, boundary processes, and whether conditioning is included."
      evidence: "site description, product specification, and dataset metadata"
    - id: dq_perennial_time_series
      applies_to: "establishment and stand management"
      requirement: "Link multi-year inputs, replacement, mortality, stand age, productive periods, and outputs to an explicit time basis."
      evidence: "stand register, block history, and reporting-period reconciliation"
    - id: dq_input_reconciliation
      applies_to: "product inputs and services"
      requirement: "Reconcile invoices, meters, contractor records, and field logs to the declared blocks and periods; explain missing or zero records."
      evidence: "primary records and reconciliation worksheet"
    - id: dq_output_mass_balance
      applies_to: "harvest and conditioning"
      requirement: "Reconcile harvested, accepted, rejected, and documented loss mass with consistent moisture, soil-adherence, and grading bases."
      evidence: "calibrated scale records, lot tickets, batch sheets, and destination records"
    - id: dq_emission_method
      applies_to: "elementary emissions"
      requirement: "Identify the selected method, geography, factors, activity data, and uncertainty; do not present provisional estimates as measured emissions."
      evidence: "method record, factor reference, and calculation worksheet"
    - id: dq_identity_evidence
      applies_to: "evidence gap or parameterized flows"
      requirement: "Keep identity evidence gaps explicit and replace them with verified or reviewed identities before active or published use."
      evidence: "identity review record and final dataset readback"
validation_rules:
  - rule_id: validation_reference_output
    applies_to: "reference flow and terminal outputs"
    rule: "Exactly one terminal accepted fresh-truffle output must be linked to the reference flow; its species or cultivar, market state, mass basis, and farm-gate hand-off must be declared."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_process_completeness
    applies_to: "process map"
    rule: "A conforming dataset must resolve whether host establishment, stand management, harvest, and conditional conditioning are included, and must not omit an applicable process without a documented reason."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_period_reconciliation
    applies_to: "perennial production"
    rule: "Every establishment and stand input must be linked to a declared site, block, period, and output basis; replacement and mortality records must not be double counted."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_mass_balance
    applies_to: "harvest and conditioning"
    rule: "For each harvest lot or conditioning batch, incoming mass must reconcile to accepted product, rejects, and documented loss within the declared measurement tolerance."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_identity_and_parameterization
    applies_to: "all flow cards"
    rule: "identity evidence gaps must remain explicitly evidence gap or parameterized; an exact fixed identity may be added only after verified identity review and must not change the card's real direction, type, or boundary meaning."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground agricultural production dataset for fresh farmed truffles at the farm gate"
  downstream_use: "secondary_dataset for process and lifecyclemodel construction; may support background_dataset use only after identity, completeness, and quality review"
  allowed_use: "farm-gate fresh-truffle footprinting, comparative cultivation studies with declared site and period, and downstream processing studies that use the declared farm-gate market state"
  excluded_use: "wild truffle collection; nursery-stock production without a truffle-product hand-off; processed or preserved truffle products; unqualified regional averages; datasets that omit the perennial time basis or accepted-output reconciliation"
  required_metadata: "CPC 3.0 code 01272; species or cultivar; host species; inoculation status; site and geography; stand age; establishment and reporting periods; area; management route; inputs and nutrient basis; harvest and conditioning boundary; maturity, grade, soil state, moisture, accepted output, rejects, residues, and co-products"
  required_quality_disclosure: "measured versus calculated fields; evidence gap or parameterized identities; method and factors for soil emissions; time and site coverage; data gaps; allocation choice; mass-balance findings; and representativeness limitations"
  update_trigger: "new verified reference or input identities; changed host or inoculation route; new stand-management technology; changed farm-gate market state; revised soil-emission method; changed allocation decision; or evidence that the productive-period and output basis is no longer representative"
