allocation_rules:
  - rule_id: allocation_accepted_rejected
    applies_to: "harvested, accepted, and rejected fruit"
    rule: "Separate accepted product, rejected fruit, and co-products by measured mass; do not allocate rejected fruit to the reference product unless explicitly defined as an accepted co-product."
    source_ids:
      - iso-14044-allocation
      - codex-fresh-fruits-vegetables-cxc-53
  - rule_id: allocation_perennial_establishment
    applies_to: "perennial establishment and productive years"
    rule: "Allocate shared establishment inputs over disclosed productive years and accepted output using stand age and productive-year evidence."
    source_ids:
      - iso-14044-allocation
      - fao-gap-framework-2003
  - rule_id: allocation_multiple_fruit_products
    applies_to: "shared field, orchard, irrigation, and machinery records"
    rule: "Allocate by measured accepted mass unless a documented physical-causality rule is more appropriate; report the selected basis."
    source_ids:
      - iso-14044-allocation
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_01319_establishment_records
      process_id: "p01319_establishment"
      flow_role: "planting, nutrient, residue, land"
      record_type: "nursery record, field log, area map"
      raw_fields: "identity; count/mass; area; date; residue; destination"
      collection_method: "invoice review, field log, area reconciliation; Raw aggregation and attribution: reconcile area and allocated output"
      unit: "kg, item, ha, year"
      frequency: "event and establishment year"
      temporal_coverage: "full establishment"
      site_scope: "each block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed records, map, invoice, allocation note"
    - protocol_id: cp_01319_cultivation_records
      process_id: "p01319_cultivation"
      flow_role: "nutrient, irrigation, energy, protection, residues, emissions"
      record_type: "invoice, application log, meter, water balance"
      raw_fields: "product; analysis; amount; date; block; source; energy; active ingredient; destination"
      collection_method: "invoice capture, meter reading, log review, factor calculation; Raw aggregation and attribution: sum events and normalize to accepted output"
      unit: "kg, m3, kWh, L, substance mass"
      frequency: "each event; cycle/year aggregate"
      temporal_coverage: "full declared production period"
      site_scope: "each block/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "label, calibration, operator log, factor citation"
    - protocol_id: cp_01319_harvest_records
      process_id: "p01319_harvest_farm_gate"
      flow_role: "harvest, packaging, rejected, accepted fruit"
      record_type: "harvest ticket, scale record, packing log, destination record"
      raw_fields: "identity; lot; harvested; accepted; rejects; grade; maturity; packaging; energy; destination"
      collection_method: "lot weighing and farm-gate reconciliation; Raw aggregation and attribution: harvested = accepted + rejects + other destinations"
      unit: "kg, kWh, L, item"
      frequency: "lot and season"
      temporal_coverage: "complete harvest season"
      site_scope: "each lot/farm gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, lot ticket, grade and destination evidence"
  calculation_rules:
    - id: calc_01319_reference_normalization
      applies_to: "all processes"
      rule: "normalized amount = declared process amount / accepted farm-gate fruit mass"
      inputs:
        - "process amount"
        - "accepted mass"
      output: "amount per kg accepted fruit"
      source_ids:
        - iso-14044-allocation
    - id: calc_01319_nutrient_basis
      applies_to: "nutrient and amendment inputs"
      rule: "nutrient mass = product mass × declared nutrient fraction; retain product and nutrient results"
      inputs:
        - "product mass"
        - "label or laboratory analysis"
      output: "kg product and nutrient basis"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_01319_perennial_allocation
      applies_to: "establishment and perennial production"
      rule: "Allocate shared establishment amount over disclosed productive years and accepted output; retain source amount"
      inputs:
        - "establishment amount"
        - "productive years"
        - output
      output: "allocated amount per kg fruit"
      source_ids:
        - iso-14044-allocation
    - id: calc_01319_mass_reconciliation
      applies_to: "harvest and conditioning"
      rule: "harvested mass = accepted mass + rejected mass + declared other destination mass"
      inputs:
        - "lot weights"
        - destinations
      output: "reconciled quantities"
      source_ids:
        - codex-fresh-fruits-vegetables-cxc-53
    - id: calc_01319_emission_factor
      applies_to: "cultivation emissions"
      rule: "Apply declared method factor to recorded nutrient/protection basis and retain substance, compartment, factor, and uncertainty"
      inputs:
        - "input basis"
        - factor
        - compartment
      output: "elementary emissions"
      source_ids:
        - ipcc-2019-refinement-agriculture
  data_quality_requirements:
    - id: dq_01319_identity
      applies_to: "product and material inputs"
      requirement: "Declare actual fruit identity, route, grade, and material identity where known; keep identity evidence gap explicit."
      evidence: "product description, invoices, labels"
    - id: dq_01319_temporal
      applies_to: "crop-cycle and orchard-year data"
      requirement: "Cover the complete declared cycle or year and disclose missing events, unusual weather, and non-bearing periods."
      evidence: "season log, stand register, exception note"
    - id: dq_01319_mass_balance
      applies_to: "harvest, accepted, rejected, and co-products"
      requirement: "Reconcile lot masses and document differences beyond site QA tolerance."
      evidence: "scale records, lot tickets, destination records"
    - id: dq_01319_water_energy
      applies_to: "water and energy"
      requirement: "Prefer meters and invoices; document calculation basis, source, carrier, and double-counting controls for estimates."
      evidence: "meter, invoice, water balance, fuel log"
validation_rules:
  - rule_id: validation_01319_reference_qualifiers
    applies_to: "reference product"
    rule: "Reject a data package lacking actual fruit identity, route, farm-gate condition, maturity/grade, and accepted-product basis; evidence gap platform UUID is a follow-up identity item, not a reason to change product meaning."
    source_ids:
      - codex-fresh-fruits-vegetables-cxc-53
  - rule_id: validation_01319_cycle_completeness
    applies_to: "process map and protocols"
    rule: "Check that establishment, cultivation, and harvest are included or explicitly excluded, and that annual/perennial time basis is consistent."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: validation_01319_mass_balance
    applies_to: "harvest and waste rows"
    rule: "Check harvested, accepted, rejected, and other destinations before normalizing to 1 kg accepted fruit."
    source_ids:
      - codex-fresh-fruits-vegetables-cxc-53
  - rule_id: validation_01319_allocation_disclosure
    applies_to: "shared inputs and co-products"
    rule: "Check that shared records, establishment allocation, co-products, and rejected-fruit destinations state a documented allocation basis."
    source_ids:
      - iso-14044-allocation
published_dataset_profile:
  dataset_role: "Foreground agricultural production dataset for fresh whole other tropical and subtropical fruit"
  downstream_use: "secondary_dataset for farm-gate fruit modelling; background_dataset only after regional representativeness and identity review"
  allowed_use: "Crop-cycle, orchard-year, farm-gate comparison, hotspot screening, and downstream studies preserving declared fruit identity and qualifiers"
  excluded_use: "Retail/consumer footprints, processed fruit without a new processing inventory, substitution across unrelated fruit categories, and datasets omitting accepted-product or route basis"
  required_metadata: "actual fruit identity; cultivar/species where known; region; route; production period; establishment inclusion; accepted yield; grade/maturity; water source; nutrient basis; reject destination; reference-flow identity status"
  required_quality_disclosure: "temporal coverage, site scope, measured versus calculated values, allocation basis, factor source, uncertainty, identity evidence gaps, and omitted processes"
  update_trigger: "verified reference-flow identity, concrete flow identity verification"
