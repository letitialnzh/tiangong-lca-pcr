      evidence: "fao-make-money-growing-mushrooms-2010; robinson-2018-mushroom-lca"
    - id: dq_substrate_and_residue_balance
      applies_to: "feedstock, conditioned material, spent substrate, and rejects"
      requirement: "Reconcile major substrate and residue streams and disclose unexplained difference, contamination, recipient, treatment, and transport."
      evidence: "robinson-2018-mushroom-lca; iso-14044-2006"
    - id: dq_grade_and_gate_state
      applies_to: "accepted, downgraded, rejected, washed, cooled, and packaged output"
      requirement: "Retain grade, size, maturity, trim, cleanliness, wash and cooling state, package state, and gate for each lot."
      evidence: "usda-ams-mushroom-grade-standard"
    - id: dq_packaging_and_transport
      applies_to: "primary packaging and purchased transport"
      requirement: "Record package mass or count, reuse cycles and losses, route and service, and boundary position."
      evidence: "iso-14044-2006"
    - id: dq_method_and_factor_disclosure
      applies_to: "calculated emissions, allocation, conversions, and upstream datasets"
      requirement: "State method, factor, version, allocation basis, source, period, and sensitivity for every non-measured result."
      evidence: "iso-14044-2006; robinson-2018-mushroom-lca"
    - id: dq_unmapped_identity_disclosure
      applies_to: "reference flow and unmapped cards"
      requirement: "Report evidence gap product, substrate, spawn, casing, residue, reject, wastewater, and internal-state identities; resolve required identities before final publication."
      evidence: ""
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "Require declared species, route, gate, qualifiers, and compatible concrete product, mass property, and mass unit-group identity before final publication; this draft requires foreground identity binding."
    source_ids: []
  - rule_id: validation_campaign_reconciliation
    applies_to: "all campaigns"
    rule: "Check substrate, spawn, room, flush, accepted, downgraded, reject, spent-substrate, and transport records share identifiers and reconcile to reference mass."
    source_ids:
      - robinson-2018-mushroom-lca
  - rule_id: validation_moisture_basis
    applies_to: "fresh mushrooms, substrate, casing, and spent substrate"
    rule: "Reject mixed wet and dry amounts without documented measured conversion and moisture basis."
    source_ids:
      - robinson-2018-mushroom-lca
  - rule_id: validation_route_conditionals
    applies_to: "casing, fertilizer or soil amendment, washing, packaging, and transport"
    rule: "Include each conditional exchange only when its route condition is true and retain omission evidence when unused."
    source_ids:
      - fao-make-money-growing-mushrooms-2010
      - usda-ams-mushroom-grade-standard
  - rule_id: validation_parameterized_flows
    applies_to: "parameterized rows"
    rule: "Resolve every Flow Set group to a compatible concrete UUID, property, unit group, geography, and intended use during foreground generation before publication."
    source_ids: []
  - rule_id: validation_unmapped_flows
    applies_to: "unmapped rows"
    rule: "Keep evidence gap substrate, spawn, casing, internal material, spent substrate, rejects, wastewater, and product-output identities explicit; do not force a product-output Flow Set match."
    source_ids: []
  - rule_id: validation_emission_reporting
    applies_to: "ammonia and carbon-dioxide rows"
    rule: "Require receiving medium, reported substance, method, amount basis, and duplicate-pathway check for every elementary emission."
    source_ids:
      - robinson-2018-mushroom-lca
  - rule_id: validation_spent_substrate_destination
    applies_to: "spent and contaminated substrate"
    rule: "Require destination, recipient or treatment, mass, moisture basis, and transport evidence; apply credit only under the allocation or substitution rule."
    source_ids:
      - robinson-2018-mushroom-lca
      - iso-14044-2006
  - rule_id: validation_allocation_disclosure
    applies_to: "shared activities and secondary outputs"
    rule: "Require process subdivision evidence or allocation basis, shared-utility allocation, sensitivity, and recipient evidence for any co-product claim."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_grade_and_gate
    applies_to: "accepted output and primary packaging"
    rule: "Confirm species, freshness, maturity, size or grade, trim, cleanliness, wash and cooling state, packaging, and gate for each accepted lot."
    source_ids:
      - usda-ams-mushroom-grade-standard
published_dataset_profile:
  dataset_role: "Foreground cultivation and gate-preparation dataset for fresh farmed edible mushrooms"
  downstream_use: "secondary_dataset; background_dataset after review, identity resolution, and publication"
  allowed_use: "Fresh cultivated mushrooms with compatible species, route, substrate, geography, campaign, moisture basis, product state, gate, and packaging or washing conditions"
  excluded_use: "Wild gathered mushrooms; spawn or substrate production; dried, frozen, canned, pickled, powdered, extracted, cooked, or preserved products; retail, consumption, or comparisons that omit route and gate"
  required_metadata: "species or group; strain or cultivar; geography; route and facility; substrate recipe and moisture; spawn lot; conditioning; inoculation; incubation and fruiting climate; flush dates; accepted and downgraded output; rejects; spent-substrate fate; water; energy; washing; cooling; packaging; transport; gate"
  required_quality_disclosure: "primary-record coverage; batch and room traceability; wet or dry basis; moisture method; meter and allocation quality; flush and grade reconciliation; substrate and spent-substrate balance; emission and allocation methods; upstream identities; provisional ranges; Flow Set resolutions; unmapped identities"
  update_trigger: "verified identity; reviewed substrate, yield, water, or energy evidence; species or route change; revised grade or gate practice; emission or allocation method change; or a new spent-substrate treatment route"
