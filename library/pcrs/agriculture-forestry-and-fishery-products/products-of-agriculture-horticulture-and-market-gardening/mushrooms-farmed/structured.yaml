  calculation_rules:
    - id: calc_reference_mass_normalization
      applies_to: "all process amounts"
      rule: "Normalize as recorded amount / accepted fresh mushroom mass at declared gate * 1,000 kg."
      inputs:
        - "batch and campaign records"
        - "accepted gate mass"
      output: "amount per 1,000 kg accepted fresh mushrooms"
      source_ids: []
    - id: calc_substrate_dry_matter
      applies_to: "substrate, casing, spawn, and spent substrate"
      rule: "Calculate dry matter as wet mass * (1 - measured water fraction) and preserve method."
      inputs:
        - "wet mass"
        - "measured moisture"
      output: "wet and dry-matter mass"
      source_ids:
        - robinson-2018-mushroom-lca
    - id: calc_spawn_and_substrate_rates
      applies_to: "inoculation"
      rule: "Calculate spawn rate as spawn mass or count / accepted conditioned substrate mass or declared unit basis."
      inputs:
        - "spawn and substrate records"
      output: "route-specific inoculation rate"
      source_ids:
        - fao-make-money-growing-mushrooms-2010
    - id: calc_shared_room_utilities
      applies_to: "incubation and fruiting utilities"
      rule: "Allocate shared meters by measured batch run, room days, occupied area-time, or documented physical basis; retain sensitivity."
      inputs:
        - meter
        - schedule
        - "batch or area-time"
      output: "campaign utility amount"
      source_ids:
        - iso-14044-2006
    - id: calc_water_balance
      applies_to: "substrate, fruiting, washing, and wastewater"
      rule: "Reconcile source withdrawal and recycled water against retention, declared evaporation method, and discharge; disclose difference."
      inputs:
        - supply
        - recirculation
        - discharge
        - retention
      output: "process water and wastewater"
      source_ids:
        - fao-make-money-growing-mushrooms-2010
    - id: calc_flush_yield_aggregation
      applies_to: "fruiting output and reference flow"
      rule: "Sum accepted, downgraded, rejected, and lost mass across flushes from one campaign before normalization."
      inputs:
        - "flush and grade records"
      output: "campaign output by destination and grade"
      source_ids:
        - robinson-2018-mushroom-lca
        - usda-ams-mushroom-grade-standard
    - id: calc_substrate_and_residue_reconciliation
      applies_to: "substrate, colonized material, spent substrate, and residuals"
      rule: "Reconcile feedstock, water, internal transfers, spent substrate, rejects, and documented loss on the chosen basis; investigate unexplained loss."
      inputs:
        - batch
        - moisture
        - "and close records"
      output: "mass-balance difference"
      source_ids:
        - robinson-2018-mushroom-lca
    - id: calc_emission_from_declared_method
      applies_to: "ammonia and carbon-dioxide outputs"
      rule: "Apply one declared gas-balance or factor method to recorded substrate, room, carrier, or ventilation data; record receiving medium and prevent duplicate accounting."
      inputs:
        - "gas or ventilation data"
        - method
        - allocation
      output: "substance-specific elementary output"
      source_ids:
        - robinson-2018-mushroom-lca
    - id: calc_packaging_reuse_service
      applies_to: "reusable containers"
      rule: "Allocate as container mass / documented service cycles * campaign service adjusted for returns and losses."
      inputs:
        - "package mass"
        - cycles
        - returns
        - losses
      output: "campaign packaging service"
      source_ids:
        - iso-14044-2006
    - id: calc_transport_service
      applies_to: "transport to gate"
      rule: "Calculate as transported mass in tonnes * route distance in km and reconcile shipment and receipt loss."
      inputs:
        - mass
        - route
        - distance
        - "carrier record"
      output: "t*km and delivered mass"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity_and_route
      applies_to: "product, species, substrate, spawn, and gate"
      requirement: "Identify species or group, strain where relevant, route, facility type, and gate; preserve identity evidence gap gaps until binding."
      evidence: "fao-make-money-growing-mushrooms-2010; usda-ams-mushroom-grade-standard"
    - id: dq_batch_traceability
      applies_to: "all batch and room records"
      requirement: "Link substrate, spawn, rooms, flushes, packaging, rejects, spent substrate, and transport to a common campaign identifier."
      evidence: "robinson-2018-mushroom-lca"
    - id: dq_moisture_and_mass_basis
      applies_to: "substrate, casing, crop, and spent substrate"
      requirement: "State wet or dry basis, measure moisture where material, and retain method and sampling record."
      evidence: "robinson-2018-mushroom-lca"
    - id: dq_metered_water_and_energy
      applies_to: "water, electricity, fuel, and heat"
      requirement: "Prefer dedicated meters or primary records; document shared-utility allocation, meter status, and conversion factors."
      evidence: "robinson-2018-mushroom-lca"
    - id: dq_climate_and_flush_coverage
      applies_to: "incubation and fruiting"
