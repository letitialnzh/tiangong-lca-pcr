system_boundary:
  rules:
    - rule_id: boundary_farmed_campaign
      applies_to: "substrate preparation, inoculation, incubation, fruiting, cropping, and harvest"
      rule: "Include the cultivation campaign from substrate receipt or preparation through final harvest flush, including conditioning, spawn, climate control, water, sanitation, harvest, and primary gate preparation when before the declared gate."
      source_ids:
        - fao-make-money-growing-mushrooms-2010
        - robinson-2018-mushroom-lca
    - rule_id: boundary_substrate_and_casing
      applies_to: "substrate ingredients, casing, supplements, and covering"
      rule: "Include actual substrate and casing crossing the boundary with recipe, wet or dry basis, and source; by-products receive no automatic burden-free or avoided-product credit."
      source_ids:
        - fao-make-money-growing-mushrooms-2010
        - robinson-2018-mushroom-lca
    - rule_id: boundary_wild_and_processed_exclusion
      applies_to: "product identity and downstream use"
      rule: "Restrict the product to cultivated fresh mushrooms. Wild mushrooms, spawn, and processed or preserved products remain separate categories."
      source_ids:
        - usda-ams-mushroom-grade-standard
    - rule_id: boundary_spent_substrate_fate
      applies_to: "spent substrate, contaminated substrate, and rejects"
      rule: "Record spent substrate and contaminated batches with destination, transport, treatment, and recipient use. Compost, soil-amendment, feed, or other credits require recipient and allocation or substitution evidence."
      source_ids:
        - robinson-2018-mushroom-lca
        - iso-14044-2006
    - rule_id: boundary_declared_gate
      applies_to: "grading, washing, cooling, packaging, and transport"
      rule: "End the default boundary at the declared farm or pack-house gate. Include grading, trimming, washing, cooling, and primary packaging only before hand-off; use the conditional transport process only when inside the boundary."
      source_ids:
        - usda-ams-mushroom-grade-standard
        - robinson-2018-mushroom-lca
boundary_abstraction:
  declared_starting_condition: "Purchased spawn and substrate ingredients, or ready conditioned substrate and spawn, entering the declared operation; on-site preparation starts with recorded feedstocks and utilities, while prior building, land, and infrastructure work is disclosed separately"
  starting_condition_role: "Beginning of the declared substrate or log campaign and foreground production accounting"
  product_classification_scope: "Fresh farmed edible mushrooms under CPC 3.0:01271 through the declared farm or pack-house gate"
  recursive_input_rule: "Fresh farmed mushrooms in the same category are never recursive inputs. Spawn, cultures, substrate, casing, and packaging are upstream products or services linked once; internal conditioned or colonized substrate transfers are recorded once within the foreground batch."
  upstream_dataset_requirement: "Require compatible upstream datasets for spawn or culture, substrate feedstocks and casing, water supply, electricity and fuels, sanitation products, packaging, purchased transport, and waste or wastewater treatment when used."
  disclosure: "Declare geography, species and strain, facility and route, substrate recipe and moisture, conditioning method, spawn lot and rate, inoculation date, incubation and fruiting climate controls, casing or covering, flush dates, accepted and rejected mass, water and energy, washing, cooling, packaging, spent-substrate and wastewater fate, and gate."
