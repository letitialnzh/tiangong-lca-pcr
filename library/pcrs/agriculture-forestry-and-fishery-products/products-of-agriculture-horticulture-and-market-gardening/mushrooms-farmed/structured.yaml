measurement_rules:
  - id: reference_fresh_mushroom_mass
    applies_to: "accepted mushrooms and harvest reconciliation"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Express the reference as net accepted fresh mushroom mass at the declared gate; weigh marketable, downgraded, trim, contamination, and spoiled material separately."
  - id: species_moisture_basis
    applies_to: "reference output, substrate, and yield records"
    required_property_ref:
      name: "Mass and moisture content"
      uuid: ""
    required_unit: "kg fresh; mass fraction water"
    rule: "Keep fresh-basis output and measured moisture separate; do not transfer an Agaricus-specific assumption to another species or route."
  - id: batch_cycle_normalization
    applies_to: "substrate batches, rooms, bags, blocks, beds, and log campaigns"
    required_property_ref:
      name: "Mass and time"
      uuid: ""
    required_unit: "kg and campaign or production year"
    rule: "Trace every input and output to a substrate batch and campaign, then normalize to accepted output from that campaign."
  - id: substrate_mass_balance
    applies_to: "substrate preparation, inoculation, and spent substrate"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg wet and kg dry matter where available"
    rule: "Record feedstock, water, spawn, casing, conditioned substrate, spent substrate, rejects, and unexplained loss on a consistent basis."
  - id: energy_metering_basis
    applies_to: "conditioning, incubation, fruiting, cooling, and handling"
    required_property_ref:
      name: "Energy or fuel carrier"
      uuid: ""
    required_unit: "kWh, MJ, L, or kg"
    rule: "Preserve measured carrier, equipment or room, period, and conversion factor; do not infer climate-control energy from yield alone."
  - id: water_balance_basis
    applies_to: "substrate water, humidification, crop watering, washing, and discharge"
    required_property_ref:
      name: "Volume and mass"
      uuid: ""
    required_unit: "m3 and kg"
    rule: "Record source withdrawal, delivered process water, recirculated water, wash water, and discharged wastewater separately when used."
  - id: packaging_reuse_basis
    applies_to: "crates, trays, bags, films, cartons, and lidding"
    required_property_ref:
      name: "Mass, item count, and cycles"
      uuid: ""
    required_unit: "kg, item, and reuse cycle"
    rule: "Record packaging mass or count with capacity, reuse cycles, return rate, and loss or disposal route."
  - id: transport_service_basis
    applies_to: "purchased transport to the declared gate"
    required_property_ref:
      name: "Transport service"
      uuid: ""
    required_unit: "t*km"
    rule: "Record product mass, route distance, vehicle or service type, load factor where available, temperature requirement, and return treatment."
