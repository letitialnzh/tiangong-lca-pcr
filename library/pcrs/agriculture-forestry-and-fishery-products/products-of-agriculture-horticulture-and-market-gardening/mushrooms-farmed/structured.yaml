allocation_rules:
  - rule_id: allocation_process_subdivision_first
    applies_to: "shared substrate, rooms, utilities, and packing"
    rule: "Subdivide activities and collect separate batch records wherever practical; allocate only genuinely shared activities after physical separation is no longer feasible."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_mushroom_and_spent_substrate
    applies_to: "marketable mushrooms and spent substrate"
    rule: "Treat marketable mushrooms as the reference product. Treat spent substrate as waste unless intentionally transferred to a documented recipient as a product or co-product. A saleable secondary product requires a declared physical or economic basis, sensitivity, and recipient evidence."
    source_ids:
      - robinson-2018-mushroom-lca
      - iso-14044-2006
  - rule_id: allocation_multiple_flushes
    applies_to: "successive flushes from one campaign"
    rule: "Attribute shared substrate, incubation, and room burdens to all flushes from the same campaign and aggregate by accepted output."
    source_ids:
      - robinson-2018-mushroom-lca
  - rule_id: allocation_downgraded_mushrooms
    applies_to: "downgraded mushrooms and grading rejects"
    rule: "Classify downgraded mushrooms as a co-product only with a documented recipient and intended use. Material without a recipient or with disposal treatment remains waste and receives no avoided-product credit."
    source_ids:
      - iso-14044-2006
      - usda-ams-mushroom-grade-standard
