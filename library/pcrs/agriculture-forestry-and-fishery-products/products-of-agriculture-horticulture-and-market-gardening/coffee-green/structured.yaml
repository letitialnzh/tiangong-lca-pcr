system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary starts with the managed coffee production object and its declared crop year or perennial phase. It includes establishment and replacement when attributable to the represented output; soil and nutrient management; irrigation; crop protection; field energy; harvest; primary processing; drying; stabilization; hulling; cleaning; grading; sorting; and storage before the declared gate. Upstream production of fertilizers, crop-protection products, energy, water supply, treatment services and packaging uses background datasets unless the study declares them as foreground."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "The boundary ends at green coffee at the declared farm, first mill or warehouse gate. Roasting, grinding, decaffeination, soluble coffee, beverage preparation, retail, consumer use and post-gate distribution are downstream. A dry or natural route may bypass pulping and washing, but it still declares whole-cherry drying, hulling and the associated residue states. A wet or honey route records pulping, fermentation or mucilage removal, washing where used, drying and wastewater treatment or discharge."
      source_ids: []
    - rule_id: boundary_01
      applies_to: "managed production"
      rule: "Include the managed coffee stand, crop-year management, actual inputs, field emissions, harvest and the hand-off to primary processing; include establishment, replacement and termination when they are attributable to the declared perennial production period."
      source_ids:
        - fao-good-farming-practices
        - iso-14044-2006
    - rule_id: boundary_02
      applies_to: "primary processing"
      rule: "Include the route actually used: wet/washed, honey/semi-washed or dry/natural. Identify raw cherry, intermediate parchment or dry cherry, prepared green coffee, water, energy, rejects and wastewater or dry-processing residues."
      source_ids:
        - fao-arabica-coffee-manual-lao
        - fao-green-coffee-processing-africa
    - rule_id: boundary_03
      applies_to: "drying and storage"
      rule: "Include drying and stabilization before the gate. Record drying technology, weather or energy service, moisture measurements, storage duration and re-wetting, mould or quality-loss events when material."
      source_ids:
        - fao-ota-coffee-code
        - fao-green-coffee-processing-africa
    - rule_id: boundary_04
      applies_to: "recursive inputs and services"
      rule: "Treat purchased coffee, materials, utilities and treatment services as separately identified upstream inputs. Do not recurse into another green-coffee PCR or invent a fixed identity for an unresolved route-specific exchange."
      source_ids:
        - iso-14044-2006
    - rule_id: boundary_05
      applies_to: "losses, residues and rejects"
      rule: "Keep cherries lost in the field, pulp, mucilage, parchment, husk, wastewater solids, defects, broken beans, rejected lots and storage losses in the foreground until a documented co-product, recovery, treatment or disposal hand-off is recorded."
      source_ids:
        - fao-green-coffee-processing-africa
        - mass-balance-identity
boundary_abstraction:
  declared_starting_condition: "established_orchard_or_coffee_stand_and_declared_crop_year"
  starting_condition_role: "perennial_biological_production_condition"
  product_classification_scope: "CPC 3.0 01610, Coffee, green; unroasted green coffee at the declared gate"
  recursive_input_rule: "Coffee in the same product category entering a processing or blending boundary is recorded as a separately identified lot and is not recursively traced into another coffee PCR; purchased coffee used only for blending is outside the default single-origin route and requires explicit scope review"
  upstream_dataset_requirement: "Use reviewed upstream datasets for planting material, nutrients, crop protection, water supply, energy, treatment, packaging and transport services when they cross the declared foreground boundary"
  disclosure: "Declare farm or mill identity, block or supplier scope, crop year, species or cultivar group, production system, processing route, cherry-to-green mass balance, moisture basis, grade, gate, storage duration, intended outputs, residues, rejects, wastewater and allocation decisions"
