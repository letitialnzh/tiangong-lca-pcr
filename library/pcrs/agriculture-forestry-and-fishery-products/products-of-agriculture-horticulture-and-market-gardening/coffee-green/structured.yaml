    - protocol_id: cp_coffee_wastewater_records
      process_id: "coffee_primary_processing_and_drying"
      flow_role: "wastewater and treatment"
      record_type: "meter, lab result, discharge or treatment record"
      raw_fields: "volume; solids; pollutant; treatment; medium; date; batch"
