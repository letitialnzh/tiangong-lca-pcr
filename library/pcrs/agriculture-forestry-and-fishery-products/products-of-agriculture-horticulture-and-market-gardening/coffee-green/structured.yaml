    - protocol_id: cp_coffee_storage_records
      process_id: "coffee_storage_and_gate_handoff"
      flow_role: "storage, moisture, handling and loss"
      record_type: "warehouse lot, meter, inventory and dispatch record"
      raw_fields: "lot; opening; closing; moisture; days; energy; packaging; loss; gate; date"
