  calculation_rules:
    - id: calc_01
      applies_to: "perennial production"
      rule: "annualized phase burden = attributable establishment, replacement or termination burden × represented phase share / declared allocation basis"
      inputs:
        - "phase records"
        - "area-time or plant-year"
        - "crop-year output"
      output: "annualized production input"
      source_ids:
        - iso-14044-2006
        - mass-balance-identity
    - id: calc_02
      applies_to: "production and processing normalization"
      rule: "normalized amount = collected amount ÷ net accepted green coffee at the same declared moisture and gate basis"
      inputs:
        - "collected amount"
        - "accepted green coffee"
        - "moisture basis"
        - gate
      output: "per-kg reference-flow amount"
      source_ids:
        - mass-balance-identity
    - id: calc_03
      applies_to: "coffee route mass balance"
      rule: "raw coffee input = accepted green coffee + documented co-products + residues + rejects + wastewater solids + losses, after moisture-basis reconciliation"
      inputs:
        - "batch input"
        - "all output states"
        - "moisture and dry-matter records"
      output: "reconciled batch output"
      source_ids:
        - mass-balance-identity
        - fao-green-coffee-processing-africa
    - id: calc_04
      applies_to: "nutrient and soil emissions"
      rule: "apply one selected factor or method to documented nutrient, residue, soil, climate, pathway and receiving-medium records; do not duplicate the same pathway"
      inputs:
        - "nutrient and residue records"
        - "method and factor"
      output: "elementary-flow amount"
      source_ids:
        - ipcc-2019-refinement-afolu
    - id: calc_05
      applies_to: "shared batch or campaign resources"
      rule: "allocate shared energy, water, labor, storage and changeover records once by measured run, lot mass, throughput or documented service"
      inputs:
        - "shared record"
        - run
        - batch
        - lot
        - "allocation basis"
      output: "process and lot amount"
      source_ids:
        - iso-14044-2006
        - mass-balance-identity
    - id: calc_06
      applies_to: "storage"
      rule: "storage loss = opening lot mass − dispatched lot mass − documented retained or transferred material, after tare and moisture-basis reconciliation"
      inputs:
        - opening
        - dispatch
        - transfer
        - loss
        - moisture
      output: "storage loss"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: quality_01
      applies_to: "identity and gate"
      requirement: "Declare species or cultivar group, geography, production system, farm or mill scope, crop year, processing route, gate, green-bean moisture basis and grade."
      evidence: "block register, mill record and dataset metadata"
    - id: quality_02
      applies_to: "mass and moisture"
      requirement: "Prefer calibrated scales, meters, lot tickets, moisture measurements, invoices and treatment records; retain tare, units, dry-matter basis and conversion factors."
      evidence: "primary records and calculation worksheet"
    - id: quality_03
      applies_to: "crop years and batches"
      requirement: "Cover the complete declared crop year and all included harvest, wet-mill, dry-mill and storage batches; identify missing lots and periods."
      evidence: "crop-year checklist, lot register and batch index"
    - id: quality_04
      applies_to: "output and residue completeness"
      requirement: "Reconcile coffee cherry, parchment, dry cherry, green coffee, grade states, pulp, mucilage, husk, parchment, wastewater, defects, rejects, storage loss and documented destinations."
      evidence: "lot mass balance, grade sheet and destination receipt"
    - id: quality_05
      applies_to: "allocation"
      requirement: "Document each multi-output boundary, selected allocation method, physical or economic basis, co-product function and sensitivity where material."
      evidence: "allocation worksheet and recipient evidence"
    - id: quality_06
      applies_to: "publication"
      requirement: "Disclose collected, calculated and estimated values, primary-record share, unresolved flow identities, water and emission methods, route, gate and update triggers."
      evidence: "quality statement and review record"
validation_rules:
  - rule_id: validation_01
    applies_to: "reference flow and metadata"
    rule: "Reject missing species or cultivar group, geography, crop year, processing route, moisture basis, grade, gate or mass property; verify the Coffee, green flow identity before final publication."
    source_ids:
      - fao-arabica-coffee-manual-lao
      - mass-balance-identity
  - rule_id: validation_02
    applies_to: "process map and route"
    rule: "Require managed production, harvest hand-off, selected wet/honey/dry route, drying or stabilization state, hulling/grading hand-off and explicit gate."
    source_ids:
      - fao-arabica-coffee-manual-lao
      - fao-green-coffee-processing-africa
  - rule_id: validation_03
    applies_to: "batch and mass balance"
    rule: "Reconcile every included lot from raw cherry or intermediate through green coffee, intended co-products, residues, wastewater, rejects and loss; reject mixed moisture bases or double counting."
    source_ids:
      - fao-green-coffee-processing-africa
      - mass-balance-identity
  - rule_id: validation_04
    applies_to: "multi-output boundaries"
    rule: "Enumerate every intended output and hand-off; reject co-product or avoided-production credit without function, recipient, quantity, quality, destination and allocation decision."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_05
    applies_to: "processing and drying"
    rule: "Check wet, honey or dry route consistency, drying records, moisture measurement, storage condition, re-wetting or mould event and route-specific water use."
    source_ids:
      - fao-ota-coffee-code
      - fao-green-coffee-processing-africa
  - rule_id: validation_06
    applies_to: "periods, storage and campaigns"
    rule: "Link establishment, replacement, termination, crop year, harvest lot, processing batch, changeover, storage duration and dispatch to one period or phase; prevent double attribution."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: validation_07
    applies_to: "nutrient, water and elementary flows"
    rule: "Verify product versus nutrient basis, irrigation versus withdrawal, process water versus wastewater, receiving medium and one selected emissions method; prevent duplicate nitrogen or water pathways."
    source_ids:
      - ipcc-2019-refinement-afolu
      - fao-good-farming-practices
  - rule_id: validation_08
    applies_to: "rejects and residues"
    rule: "Require a declared fate for pulp, mucilage, parchment, husk, defects, broken beans, foreign matter, wastewater solids, storage loss and rejected lots; a destination label alone is insufficient."
    source_ids:
      - fao-green-coffee-processing-africa
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only after review, identity resolution and release controls"
  downstream_use: "Foreground agricultural and first-conditioning modelling for cultivated green coffee, with downstream process or lifecyclemodel construction."
  allowed_use: "Studies preserving coffee identity, species or cultivar group, geography, crop year, processing route, moisture basis, gate, grade, output fate, allocation and quality disclosure."
  excluded_use: "Roasted, ground, decaffeinated, soluble or beverage coffee; wild collection; unqualified regional substitution; use without cherry-to-green mass balance, gate or moisture information."
  required_metadata: "PCR id; CPC reference; species or cultivar group; geography; farm/mill scope; crop year; production system; processing route; intermediate states; moisture; grade; gate; storage; inputs; outputs; residues; wastewater; allocation; reference amount and unit; identity status."
  required_quality_disclosure: "Site and period coverage; collected, calculated and estimated fields; primary-record share; scale, meter and moisture evidence; lot mass balance; water and emissions methods; allocation; Flow Set resolution; unresolved identities."
  update_trigger: "Material change in coffee species or route, production system, nutrient or crop-protection practice, processing technology, drying, water, energy, grade, storage, residue or wastewater route, gate, identity or required qualifier."
