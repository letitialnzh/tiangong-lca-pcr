allocation_rules:
  - rule_id: allocation_01
    applies_to: "perennial coffee production"
    rule: "Allocate establishment, replacement, shade or support systems and shared production phases by documented area-time, plant-year, crop-year, throughput or another justified physical basis. Disclose the represented phases and prevent double attribution across crop years."
    source_ids:
      - iso-14044-2006
      - fao-good-farming-practices
  - rule_id: allocation_02
    applies_to: "shared farm, wet mill and dry mill resources"
    rule: "Attribute shared meters, machinery, water, storage, operators, cleaning and changeover burdens once using measured activity, run time, batch throughput, lot mass or documented service."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_03
    applies_to: "green coffee and intended co-products"
    rule: "Treat accepted green coffee as the reference output. Apply one documented PCR-specific allocation decision at each genuine multi-output boundary; use physical properties, economic allocation or another justified method consistently and disclose sensitivity when material."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_04
    applies_to: "pulp, mucilage, parchment, husk, residues and rejects"
    rule: "Treat a stream as a co-product or recovered material only when function, recipient, quantity, quality, destination and hand-off are documented. Otherwise retain its burden as residue or waste through treatment or disposal."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_05
    applies_to: "rework, downgrade and storage loss"
    rule: "Keep burden on off-spec, reworked, downgraded or storage-loss material until its next declared hand-off; never count a lot as both accepted green coffee and reject, co-product or loss."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "The PCR does not force one universal allocation method. The dataset must select and justify one method for each genuine multi-output boundary and apply it consistently. Avoided-production credit is not allowed from a destination label alone; it requires a documented recipient, function, comparable product, quantity, quality and attribution decision."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_coffee_perennial_phase_records
      process_id: "coffee_plantation_production"
      flow_role: "block, establishment, replacement, productive phase and termination"
      record_type: "block register and farm log"
      raw_fields: "block; area; species; cultivar; planting; replacement; shade; phase; dates; crop year"
      collection_method: "register review and phase reconciliation"
      unit: "ha; plant; date; year"
      frequency: "annual and event-based"
      temporal_coverage: "complete declared perennial phase"
      site_scope: "each block"
      aggregation_rule: "allocate phase records once to represented crop years and output"
      quality_evidence: "block map, planting record and farm register"
    - protocol_id: cp_coffee_nutrient_records
