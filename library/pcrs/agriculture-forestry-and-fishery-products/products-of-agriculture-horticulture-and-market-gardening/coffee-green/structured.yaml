measurement_rules:
  - id: measurement_01
    applies_to: "reference product and all coffee states"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record cherry, parchment, husk, pulp, wet-mill input, dry-mill input, green coffee, rejects and residues with a declared as-received or dry-matter basis. Do not mix moisture bases in one mass balance."
  - id: measurement_02
    applies_to: "reference product quality"
    required_property_ref:
      name: "Mass and moisture"
      uuid: ""
    required_unit: "kg; percent wet basis"
    rule: "Measure or declare green-bean moisture, grade, defect criterion and sample or lot basis. The screening moisture interval is a QA reference, not a universal fixed value."
  - id: measurement_03
    applies_to: "fertilizer, soil amendments and direct nitrogen flows"
    required_property_ref:
      name: "Product mass and nutrient basis"
      uuid: ""
    required_unit: "kg product; kg N"
    rule: "Record formulated product or amendment mass separately from nutrient mass. If emissions are calculated, retain the nutrient basis, application event and selected method."
  - id: measurement_04
    applies_to: "irrigation, wet processing and wastewater"
    required_property_ref:
      name: "Volume or mass"
      uuid: ""
    required_unit: "m3 or kg"
    rule: "Keep irrigation delivery, source withdrawal, process water, recirculation, discharge, retained solids and wastewater treatment separate. Preserve meter readings and conversion factors."
  - id: measurement_05
    applies_to: "fuel, electricity and drying energy"
    required_property_ref:
      name: "Carrier-specific property"
      uuid: ""
    required_unit: "L, kg, MJ or kWh"
    rule: "Preserve carrier, equipment, operation, run or batch and original unit. Convert only with a documented factor and allocate shared equipment once."
  - id: measurement_06
    applies_to: "crop year, perennial phases and processing batches"
    required_property_ref:
      name: "Area-time, duration and batch identity"
      uuid: ""
    required_unit: "ha·year, day, h or batch id"
    rule: "Link establishment, replacement, productive phase, harvest lot, processing run, changeover, storage period and termination events to one declared period or batch."
