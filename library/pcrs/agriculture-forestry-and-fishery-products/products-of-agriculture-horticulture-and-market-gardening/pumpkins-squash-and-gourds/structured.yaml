      raw_fields: "carrier; amount; equipment; harvest lot; operating hours; method; date"
      collection_method: "collect direct energy records and document any emission estimate method"
      unit: "L, kg, MJ, or kg particulate"
      frequency: "each harvest event or monthly"
      temporal_coverage: "declared harvest period"
      site_scope: "represented harvest equipment"
      aggregation_rule: "allocate shared use by operating time or lot mass"
      quality_evidence: "fuel record and equipment log"
    - protocol_id: cp_residue_and_reject_fate_records
