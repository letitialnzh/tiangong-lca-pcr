      collection_method: "weigh each conditioning batch and reconcile all outputs"
      unit: "kg"
      frequency: "each conditioning batch"
      temporal_coverage: "declared conditioning period"
      site_scope: "each represented conditioning line"
      aggregation_rule: "aggregate by lot and product type after mass reconciliation"
