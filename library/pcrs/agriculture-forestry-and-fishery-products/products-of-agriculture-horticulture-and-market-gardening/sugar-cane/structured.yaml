  market_state: "Fresh mature stalks, topped and stripped of excessive leaf/trash and gross adhering soil, at the exact platform gate Natural mix, at agricultural fields; moisture, variety, burn status, harvest method and acceptance condition declared"
functional_unit:
  what: "Accepted mature harvested sugarcane stalks at the exact platform gate Natural mix, at agricultural fields"
  how_much: "1 kg"
  how_well: "Meets declared lot acceptance for variety or hybrid, maturity, moisture, burn status, harvest method, tops/leaves, foreign matter, damage and gross adhering soil"
  how_long_or_cycle: "One identified plant-cane or ratoon harvest period within a declared complete crop series; shared establishment burdens attributed across actual accepted outputs"
  reference_flow_link: "accepted_sugarcane_stalks"
system_boundary:
  rules:
    - rule_id: boundary_field_handoff
      applies_to: "whole route"
      rule: "End at accepted harvested stalks at the agricultural-field hand-off; exclude all post-hand-off transport and factory conversion."
      source_ids:
        - fao-sugarcane-water-2012
    - rule_id: boundary_period_series
      applies_to: "plant cane and ratoons"
      rule: "Enumerate plant establishment, every represented ratoon and final termination; link stubble and shared burdens once across periods."
      source_ids:
        - fao-sugarcane-water-2012
    - rule_id: boundary_harvest_routes
      applies_to: "harvest"
      rule: "Declare manual or mechanical technology and exactly one green-cane or pre-harvest-burn state for each field-lot event; report changed energy, emissions, loss, trash and stubble effects."
      source_ids:
        - sra-harvest-manual-2014
        - fao-cane-environment-1997
    - rule_id: boundary_residue_exclusivity
      applies_to: "tops, leaves, trash and stubble"
      rule: "Assign each residue fraction once to retention, intended removal, burning, recovery, disposal or cross-period stubble; preserve dry matter and nitrogen bases."
      source_ids:
        - ipcc-managed-soils-2019
    - rule_id: boundary_conditioning
      applies_to: "field conditioning"
      rule: "Include topping, leaf/trash separation, gross-soil removal and loading needed for the field hand-off; exclude crushing and juice or sugar processing."
      source_ids:
        - sra-harvest-manual-2014
boundary_abstraction:
  declared_starting_condition: "Plant-cane field before establishment, or viable ratoon stubble carried from the identified preceding harvest period"
  starting_condition_role: "Initial field condition or cross-period intermediate; never a burden-free untracked input"
  product_classification_scope: "CPC 3.0: 01802 Sugar cane"
  recursive_input_rule: "Purchased cane used as planting material is an input with an upstream dataset; retained stubble is linked once from the preceding harvest and is not recursively represented as accepted market cane"
  upstream_dataset_requirement: "Require upstream datasets for purchased planting cane, products and energy; require origin, quantity, quality and hand-off consistency"
  disclosure: "Declare geography, field, crop-series and period ids, plant/ratoon status, establishment and termination, irrigation, nutrient and protection management, harvest technology, green/pre-burn status, residue routes, hand-off, output set and allocation"
