allocation_rules:
  - rule_id: allocation_same_category_products
    applies_to: "mixed mango, guava, or mangosteen production and shared orchard operations"
    rule: "Allocate shared crop-year inputs and emissions among mangoes, guavas, and mangosteens by measured accepted fresh-fruit mass unless a documented physical relationship is more representative. Disclose the allocation denominator and each product quantity."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_shared_grade_outputs
    applies_to: "grades or destinations sharing the same harvest system"
    rule: "Keep all fresh fruit leaving the gate as separate declared grades or destinations when relevant. If a non-fresh product destination or another product category shares the system, allocate the shared foreground inventory by measured mass and disclose the destination split."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residues_and_culls
    applies_to: "residues, culls, and rejects"
    rule: "Do not allocate burdens to residues or culls that remain in the field or are discarded within the declared system unless they leave as a separately valued co-product. If sold or transferred as a co-product, record the mass and destination and apply the declared allocation basis consistently."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Primary reporting uses mass allocation because the reference product is fresh fruit measured at the farm gate. Economic allocation may be used only as a documented sensitivity scenario; it must not replace the primary mass-allocation result without a reasoned justification."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "orchard_establishment"
      flow_role: "planting material and establishment operations"
      record_type: "nursery invoices, planting maps, replanting logs"
      raw_fields: "species; variety; plant count; planting area; material mass or count; planting date; replacement area; productive-life assumption"
      collection_method: "reconcile invoices and field maps to the declared orchard block"
      unit: "kg or item; ha; date"
      frequency: "per establishment or replanting event"
      temporal_coverage: "productive-life records supporting the crop year"
      site_scope: "orchard block"
      aggregation_rule: "annualize eligible establishment records over the declared productive life and normalize to accepted fruit"
      quality_evidence: "invoice or nursery record plus field-map reconciliation"
    - protocol_id: cp_irrigation_records
      process_id: "orchard_establishment_orchard_cultivation"
      flow_role: "irrigation application and source withdrawal"
      record_type: "meter logs, pump records, water bills, irrigation schedule, source register"
      raw_fields: "applied water; withdrawn water; source; field; date; reuse; storage; meter status"
      collection_method: "meter or water-balance calculation with source and field reconciliation"
      unit: "m3"
      frequency: "per irrigation event or monthly"
      temporal_coverage: "full crop year and establishment period when applicable"
      site_scope: "field or orchard block"
      aggregation_rule: "sum by source and activity; reconcile applied water to withdrawal, reuse, storage, and loss"
      quality_evidence: "meter calibration, source permit or bill, and reconciliation check"
    - protocol_id: cp_nutrient_records
      process_id: "orchard_establishment_orchard_cultivation"
      flow_role: "fertilizer and soil-amendment total"
      record_type: "purchase records, nutrient plan, soil test, application log"
      raw_fields: "actual product; formulation; nutrient analysis; amount; date; method; field; organic or mineral basis"
      collection_method: "reconcile purchase and application records to the declared crop year"
      unit: "kg product; kg N; kg P2O5; kg K2O"
      frequency: "per application event"
      temporal_coverage: "full crop year and establishment period when applicable"
      site_scope: "field or orchard block"
      aggregation_rule: "aggregate actual product and declared nutrient bases without double counting the same application"
      quality_evidence: "invoice, product label or certificate, and application record"
    - protocol_id: cp_crop_protection_records
      process_id: "orchard_cultivation"
      flow_role: "crop-protection product input"
      record_type: "purchase records, spray log, product label"
      raw_fields: "product; active ingredient; concentration; amount; field; date; target; method"
      collection_method: "reconcile product records to application events and orchard area"
      unit: "kg product or active ingredient"
      frequency: "per application event"
      temporal_coverage: "full crop year"
      site_scope: "field or orchard block"
      aggregation_rule: "sum by product and active-ingredient basis and preserve product identity"
      quality_evidence: "product label, application log, and operator record"
    - protocol_id: cp_energy_fuel_records
      process_id: "orchard_establishment_orchard_cultivation_harvest_and_farm_gate_aggregation"
      flow_role: "electricity and mobile machinery fuel"
      record_type: "utility bill, meter, fuel invoice, machine log, equipment record"
      raw_fields: "energy or fuel amount; unit; equipment; operation; field; date; fuel type; allocation basis"
      collection_method: "meter, invoice, or equipment-log reconciliation"
      unit: "kWh, MJ, or kg"
      frequency: "per event or monthly"
      temporal_coverage: "full crop year and establishment period when applicable"
      site_scope: "orchard and farm-gate operations"
      aggregation_rule: "allocate shared records by measured runtime, area, or fuel log and document the basis"
      quality_evidence: "invoice or meter plus equipment or operation log"
    - protocol_id: cp_field_area_and_soil_records
      process_id: "orchard_establishment_orchard_cultivation"
      flow_role: "land occupation and soil context"
      record_type: "field map, area register, lease or ownership record, soil record"
      raw_fields: "area; crop-year duration; orchard age; productive life; soil or drainage descriptor; transformation status"
      collection_method: "verify field polygon or area record against crop-year production records"
      unit: "ha; year; soil descriptor"
      frequency: "per crop year and establishment event"
      temporal_coverage: "declared crop year and productive-life basis"
      site_scope: "orchard block"
      aggregation_rule: "calculate area-time and prevent duplicate occupation across establishment and cultivation"
      quality_evidence: "field map, area record, and boundary declaration"
    - protocol_id: cp_emission_and_loss_records
      process_id: "orchard_cultivation_harvest_and_farm_gate_aggregation"
      flow_role: "direct emissions, nutrient losses, residues, and fuel emissions"
      record_type: "emission calculation, measurement, residue log, destination record"
      raw_fields: "substance; medium; amount; factor or method; nutrient basis; fuel; residue mass; moisture; destination; uncertainty"
      collection_method: "measured value or documented method calculation linked to primary records"
      unit: "kg substance; kg residue; kg fuel; MJ"
      frequency: "per event, crop year, or method interval"
      temporal_coverage: "full crop year"
      site_scope: "orchard block and harvest operation"
      aggregation_rule: "retain substance, receiving medium, method tier, and uncertainty; do not infer losses without a method"
      quality_evidence: "method reference, measurement or calculation sheet, and destination record"
    - protocol_id: cp_harvest_records
      process_id: "harvest_and_farm_gate_aggregation"
      flow_role: "accepted fruit, culls, rejects, and gate condition"
      record_type: "harvest ticket, weighbridge, grade sheet, field log"
      raw_fields: "species; variety; date; field; harvested mass; accepted mass; culls; rejects; grade; maturity; destination; gate point"
      collection_method: "weigh or reconcile harvest lots and grade records before normalization"
      unit: "kg; date; grade"
      frequency: "per harvest lot"
      temporal_coverage: "full harvest season"
      site_scope: "field, orchard block, and farm gate"
      aggregation_rule: "sum accepted output and non-accepted fractions and reconcile to harvested quantity"
      quality_evidence: "calibrated scale or weighbridge, grade record, and lot traceability"
  calculation_rules:
    - id: calculation_establishment_annualization
      applies_to: "establishment and replanting inputs"
      rule: "Eligible establishment amount for the crop year = recorded establishment amount × (declared crop-year share of productive life); disclose the productive-life denominator and replacement treatment."
      inputs:
        - "establishment records"
        - "productive-life assumption"
        - "replacement area"
      output: "annualized establishment input per crop year"
      source_ids:
        - mass-balance-identity
        - fao-good-agricultural-practices
    - id: calculation_reference_normalization
      applies_to: "all foreground rows"
      rule: "Normalized amount = crop-year amount ÷ accepted marketable fruit mass × 1,000 kg. Apply the same accepted-output denominator to inputs, emissions, culls, and residues."
      inputs:
        - "crop-year amount"
        - "accepted fruit mass"
      output: "amount per 1,000 kg accepted fruit"
      source_ids:
        - mass-balance-identity
    - id: calculation_nutrient_basis
      applies_to: "fertilizer and soil-amendment total"
      rule: "Preserve actual product mass and calculate nutrient mass only from the declared formulation or analysis: nutrient mass = product mass × declared nutrient fraction. Do not add product mass and nutrient mass as if they were the same quantity."
      inputs:
        - "product mass"
        - "declared nutrient fraction"
        - "application record"
      output: "product and nutrient-basis totals"
      source_ids:
        - fao-good-agricultural-practices
        - mass-balance-identity
    - id: calculation_irrigation_withdrawal_reconciliation
      applies_to: "irrigation water and source withdrawal"
      rule: "Reconcile applied irrigation = source withdrawal + reused or stored water − documented conveyance or application losses, with each term and measurement basis disclosed."
      inputs:
        - "applied water"
        - withdrawal
        - reuse
        - storage
        - losses
      output: "reconciled water inputs"
      source_ids:
        - fao-crop-evapotranspiration-56
        - mass-balance-identity
    - id: calculation_managed_soil_emissions
      applies_to: "ammonia, nitrous oxide, nitrate, and phosphate rows"
      rule: "Use the declared measurement or method tier, nutrient basis, receiving medium, and site conditions. Report a zero only when the method and records support zero or non-applicability."
      inputs:
        - "nutrient records"
        - "soil and drainage records"
        - "emission method"
        - measurements
      output: "named-substance emissions by medium"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calculation_harvest_mass_reconciliation
      applies_to: "accepted fruit, culls, rejects, and residues"
      rule: "Harvested mass = accepted marketable fruit + culls and rejects + documented field or handling losses, with moisture basis and destination recorded."
      inputs:
        - "harvest tickets"
        - "grade sheets"
        - "cull and loss records"
      output: "reconciled output and loss totals"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference flow and all semantic rows"
      requirement: "Declare species, variety, field or orchard, gate, product state, and Flow Set resolution or identity evidence gap status."
      evidence: "lot traceability, field map, manifest review metadata"
    - id: quality_quantity
      applies_to: "all measured or calculated amounts"
      requirement: "Prefer calibrated meters, scales, invoices, application records, and calculation sheets. Retain units, conversions, and uncertainty or estimation flags."
      evidence: "primary records and conversion worksheet"
    - id: quality_temporal_coverage
      applies_to: "crop-year and establishment data"
      requirement: "Cover the complete declared crop year and identify missing harvest, irrigation, input, or establishment periods."
      evidence: "crop calendar, harvest log, and completeness checklist"
    - id: quality_completeness
      applies_to: "inputs, outputs, residues, and culls"
      requirement: "Reconcile purchased inputs, applied inputs, accepted product, culls, rejects, residues, and losses; explain exclusions and zeros."
      evidence: "mass-balance check and destination records"
    - id: quality_emissions
      applies_to: "direct elementary flows"
      requirement: "Disclose the emission substance, receiving medium, factor or method tier, nutrient or fuel basis, and whether the result is measured, calculated, or estimated."
      evidence: "emission calculation or measurement record"
    - id: quality_boundary
      applies_to: "dataset metadata"
      requirement: "Preserve the farm-gate point, fresh unprocessed product state, upstream input links, allocation basis, and post-gate exclusions."
      evidence: "boundary declaration and dataset metadata"
validation_rules:
  - rule_id: validation_reference_definition
    applies_to: "reference flow"
    rule: "Confirm the 1,000 kg functional unit, all required qualifiers, and the evidence gap reference product qualifiers before generating a foreground dataset."
    source_ids:
      - mass-balance-identity
      - codex-fresh-tropical-fruit-standards
  - rule_id: validation_flow_set_binding
    applies_to: "parameterized product inputs"
    rule: "Resolve each parameterized row during dataset generation using the cited Flow Set id, version, group, structural coordinate, property, unit, geography, and intended-use evidence; a Flow Set is not a final UUID."
    source_ids: []
  - rule_id: validation_mass_reconciliation
    applies_to: "harvest and farm-gate aggregation"
    rule: "Check accepted fruit, culls, rejects, residues, field losses, and handling losses against harvested mass, with grade, moisture, and destination treatment explicit."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_crop_year_completeness
    applies_to: "all required processes"
    rule: "Verify that cultivation, harvest, and gate records cover the declared crop year and that conditional establishment is either documented or explicitly excluded."
    source_ids:
      - fao-good-agricultural-practices
  - rule_id: validation_boundary_and_state
    applies_to: "dataset scope"
    rule: "Reject datasets that include post-gate washing, waxing, grading, cooling, packing, processing, retail, or post-gate transport, or that omit the declared farm-gate point."
    source_ids:
      - iso-14044-2006
      - codex-fresh-tropical-fruit-standards
published_dataset_profile:
  dataset_role: "Foreground primary dataset for fresh, whole mangoes, guavas, and mangosteens at the declared farm gate; usable downstream as secondary_dataset after review"
  downstream_use: "Build process and lifecycle-model foreground inventories for fresh tropical fruit while preserving crop-year, species, route, gate, grade, and input-basis qualifiers"
  allowed_use: "Product-category studies that preserve the declared orchard or field route, crop year, farm-gate state, accepted-output denominator, input records, emission method, and mass reconciliation"
  excluded_use: "Processed fruit, planting-material production, retail or consumer stages, post-gate transport, undisclosed protected infrastructure, or crops with materially different product and gate conditions"
  required_metadata: "PCR id and version; species and variety; geography; orchard age; crop year; route; farm-gate point; yield and grade; irrigation source; actual fertilizer or soil-amendment product and nutrient basis; crop protection; fuel and electricity; cull and residue fates; allocation; emission method; reference product qualifiers"
  required_quality_disclosure: "Measurement sources, missing or estimated fields, crop-year completeness, establishment annualization, allocation basis, mass-balance result, emission method and tier, Flow Set resolutions, and identity evidence gap findings"
  update_trigger: "New orchard or protected-production route, material change in gate conditioning or product state, revised emission method, new product qualifier, or evidence that alters collection, allocation, or validation rules"
