system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "establishment and cultivation"
      rule: "Include bed preparation attributable to the crop cycle, planting, crop management, irrigation, nutrient and crop protection, and direct crop emissions; disclose prior land use and exclude unrelated infrastructure construction."
      source_ids:
        - fao-crop-evapotranspiration-56
        - fao-good-agricultural-practices
    - rule_id: boundary_repeated_harvest
      applies_to: "harvest rounds"
      rule: "Attribute every harvest round from one planting to the same crop cycle and reconcile marketable fruit, downgraded fruit, field losses, and residues before normalization."
      source_ids:
        - fao-eggplant-production-guide
        - usda-ams-eggplant-standard
    - rule_id: boundary_gate_preparation
      applies_to: "sorting, washing, cooling, and packing"
      rule: "End the default foreground boundary at the declared farm-gate or pack-house gate. Include sorting, washing, cooling, primary packaging, and pre-gate transport only when they occur before that gate."
      source_ids:
        - usda-ams-eggplant-standard
        - codex-fresh-produce-hygiene
    - rule_id: boundary_residue_fate
      applies_to: "fruit culls, crop residues, and packaging waste"
      rule: "Record field return, composting, feed use, treatment, transport, or disposal for each residue stream. Do not assign a co-product credit without a documented recipient and intended use."
      source_ids:
        - iso-14044-2006
        - mass-balance-identity
