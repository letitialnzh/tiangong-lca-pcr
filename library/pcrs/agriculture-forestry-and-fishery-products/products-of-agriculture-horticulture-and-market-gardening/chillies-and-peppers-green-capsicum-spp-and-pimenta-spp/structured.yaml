data_sources:
  - id: "fao-56-crop-evapotranspiration-1998"
    type: "official_guidance"
    reference: "FAO Irrigation and drainage paper 56, Crop evapotranspiration, https://www.fao.org/4/X0490E/X0490E00.htm"
    used_for: "crop-cycle water accounting, field occupancy context, and shared-service allocation"
  - id: "usda-nrcs-nutrient-management-590"
    type: "official_guidance"
    reference: "USDA NRCS Conservation Practice Standard 590, Nutrient Management, https://www.nrcs.usda.gov/resources/guides-and-instructions/nutrient-management-590"
    used_for: "nutrient product basis, application records, and nutrient quality requirements"
  - id: "usda-nrcs-irrigation-water-management-449"
    type: "official_guidance"
    reference: "USDA NRCS Conservation Practice Standard 449, Irrigation Water Management, https://www.nrcs.usda.gov/resources/guides-and-instructions/irrigation-water-management-449"
    used_for: "irrigation records and water-balance quality requirements"
  - id: "ipcc-2019-refinement-nitrogen"
    type: "method_factor"
    reference: "2019 Refinement to the 2006 IPCC Guidelines, Volume 4 Agriculture, Forestry and Other Land Use, https://www.ipcc-nggip.iges.or.jp/public/2019rf/vol4.html"
    used_for: "direct and indirect nitrogen emission calculation method"
  - id: "codex-fresh-fruits-vegetables-2003"
    type: "standard"
    reference: "Codex Alimentarius, Code of Hygienic Practice for Fresh Fruits and Vegetables, CXC 53-2003, https://www.fao.org/fao-who-codexalimentarius/codex-texts/codes-of-practice/en/"
    used_for: "fresh-produce gate, quality, handling, reject, and mass-balance rules"
  - id: "fao-good-hygiene-fresh-produce-2003"
