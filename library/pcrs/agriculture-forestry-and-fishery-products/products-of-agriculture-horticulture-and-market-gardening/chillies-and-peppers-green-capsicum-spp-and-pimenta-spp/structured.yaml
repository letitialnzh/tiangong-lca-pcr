allocation_rules:
  - rule_id: allocation_single_crop_cycle
    applies_to: "inputs and emissions shared by fields or protected units"
    rule: "Allocate shared inputs and emissions to the represented crop cycle using measured area, operating time, or mass output; document the selected driver and do not allocate by unrecorded assumptions."
    source_ids:
      - fao-56-crop-evapotranspiration-1998
  - rule_id: allocation_marketable_and_reject_outputs
    applies_to: "harvest, grading, and gate preparation"
    rule: "Keep marketable green fruit, unmarketable fruit, trimming, and residue as separate outputs. Apply the declared allocation or treatment rule only when a reject has a documented productive use; otherwise retain it as waste or residue."
    source_ids:
      - codex-fresh-fruits-vegetables-2003
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "crop_establishment"
      flow_role: "planting_material_input"
      record_type: "seed or transplant lot and planting record"
      raw_fields: "material type, cultivar, supplier, lot, viable quantity, planted area, planting date"
      collection_method: "collect supplier documents and field planting logs"
      unit: "seed, plant, or kg"
      frequency: "each establishment event"
      temporal_coverage: "full crop cycle"
      site_scope: "each field, bed, or protected unit"
      aggregation_rule: "sum planted quantity by crop cycle and area"
      quality_evidence: "lot document and field-log reconciliation"
    - protocol_id: cp_nutrient_records
      process_id: "crop_establishment_crop_management"
      flow_role: "nutrient inputs"
      record_type: "nutrient application record"
      raw_fields: "product, formulation, nutrient concentration, application date, area, amount, method"
      collection_method: "collect invoices, application logs, labels, nutrient plans, and soil-test records"
      unit: "kg product, kg N, kg P2O5, or kg K2O"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each field or protected unit"
      aggregation_rule: "convert product to nutrient basis and sum by crop cycle"
      quality_evidence: "label or supplier specification and application-log check"
    - protocol_id: cp_field_area_records
      process_id: "crop_establishment_crop_management"
      flow_role: "land occupation"
      record_type: "field or protected-unit record"
      raw_fields: "area, location, crop dates, protected-unit identity, occupancy period"
      collection_method: "survey or farm record review"
      unit: "ha and dates"
      frequency: "each crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "each field, bed, or protected unit"
      aggregation_rule: "calculate area-time and normalize to output"
      quality_evidence: "area map and date record"
    - protocol_id: cp_irrigation_records
      process_id: "crop_management"
      flow_role: "irrigation_water_input"
      record_type: "water delivery record"
      raw_fields: "source, meter, delivery volume, date, irrigation method, field, losses"
      collection_method: "collect meter, pump, delivery, or water-balance records"
      unit: "m3"
      frequency: "each irrigation event or monthly total"
      temporal_coverage: "full crop cycle"
      site_scope: "each field or protected unit"
      aggregation_rule: "sum delivered water and reconcile source records"
      quality_evidence: "meter reading or documented water balance"
    - protocol_id: cp_crop_protection_records
      process_id: "crop_management"
      flow_role: "crop_protection_input"
      record_type: "spray or treatment record"
      raw_fields: "product, formulation, active ingredient, amount, area, date, method, target"
      collection_method: "collect regulated application logs and product labels"
      unit: "kg or L product"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each field or protected unit"
      aggregation_rule: "sum by product and active ingredient"
      quality_evidence: "application record and label check"
    - protocol_id: cp_energy_records
      process_id: "crop_management"
      flow_role: "management_fuel_input and management_electricity_input"
      record_type: "meter, invoice, fuel issue, or equipment-hour record"
      raw_fields: "fuel or electricity, equipment, date, operating hours, field or line, allocation driver"
      collection_method: "collect meters, invoices, fuel logs, and operating records"
      unit: "kWh, L, or MJ"
      frequency: "each event or monthly total"
      temporal_coverage: "full crop cycle"
      site_scope: "each field, protected unit, or pack-house line"
      aggregation_rule: "allocate shared services by documented driver"
      quality_evidence: "meter, invoice, or operating-log reconciliation"
    - protocol_id: cp_emission_calculation_records
      process_id: "crop_management"
      flow_role: "soil and machinery elementary flows"
      record_type: "calculation worksheet"
      raw_fields: "nutrient inputs, residue fate, fuel, factor, method, conversion, result"
      collection_method: "calculate from collected records using one declared method"
      unit: "kg substance"
      frequency: "each crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "each field and equipment group"
      aggregation_rule: "apply one method and sum without duplicate pathways"
      quality_evidence: "factor source, formula, and input check"
    - protocol_id: cp_residue_records
      process_id: "crop_management"
      flow_role: "field_crop_residue"
      record_type: "residue and destination record"
      raw_fields: "residue type, mass, date, field, destination, treatment or return method"
      collection_method: "weigh or estimate with documented mass balance"
      unit: "kg fresh matter"
      frequency: "each crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "each field or protected unit"
      aggregation_rule: "separate field return, use, treatment, and disposal"
      quality_evidence: "weigh ticket or mass-balance check"
    - protocol_id: cp_gate_preparation_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "gate_wash_water_input and gate_wastewater"
      record_type: "wash batch and utility record"
      raw_fields: "batch, water volume, source, date, product mass, wastewater route, treatment"
      collection_method: "collect batch sheets, meters, and treatment records"
      unit: "m3 or kg"
      frequency: "each batch"
      temporal_coverage: "full harvest campaign"
      site_scope: "each pack-house line or gate"
      aggregation_rule: "sum by campaign and normalize to marketable output"
      quality_evidence: "batch reconciliation and treatment record"
    - protocol_id: cp_gate_energy_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "gate_electricity_input"
      record_type: "pack-house utility record"
      raw_fields: "line, meter, operating hours, throughput, date, allocation driver"
      collection_method: "collect meter or invoice records and line throughput"
      unit: "kWh"
      frequency: "each batch or monthly total"
      temporal_coverage: "full harvest campaign"
      site_scope: "each pack-house line"
      aggregation_rule: "allocate shared energy by documented throughput or hours"
      quality_evidence: "meter and throughput reconciliation"
    - protocol_id: cp_packaging_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "primary_container_packaging and handling_packaging"
      record_type: "packaging issue and return record"
      raw_fields: "packaging type, material, mass, quantity, reuse count, loss, return route"
      collection_method: "collect supplier, issue, and return records"
      unit: "kg packaging and trips"
      frequency: "each campaign"
      temporal_coverage: "full harvest campaign"
      site_scope: "each packing site"
      aggregation_rule: "allocate reusable packaging by documented service trips"
      quality_evidence: "supplier specification and return log"
    - protocol_id: cp_transport_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "pre_gate_transport_service"
      record_type: "shipment record"
      raw_fields: "origin, destination, mass, distance, vehicle, load, empty return"
      collection_method: "collect consignment and carrier records"
      unit: "tkm"
      frequency: "each shipment"
      temporal_coverage: "full harvest campaign"
      site_scope: "declared pre-gate route"
      aggregation_rule: "multiply mass by documented distance and sum"
      quality_evidence: "consignment and carrier record"
    - protocol_id: cp_gate_output_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "marketable_green_fruit_output"
      record_type: "weighbridge, pack, or dispatch record"
      raw_fields: "batch, harvest date, mass, maturity, grade, gate, packaging state"
      collection_method: "weigh and reconcile marketable output"
      unit: "kg fresh fruit"
      frequency: "each harvest or dispatch batch"
      temporal_coverage: "full harvest campaign"
      site_scope: "each field and gate"
      aggregation_rule: "sum accepted batches and normalize to 1,000 kg"
      quality_evidence: "scale record and lot reconciliation"
    - protocol_id: cp_gate_reject_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "gate_reject_waste and final_reject_loss"
      record_type: "grading and reject record"
      raw_fields: "incoming mass, marketable mass, reject type, trimming, destination, date"
      collection_method: "weigh or calculate from lot mass balance"
      unit: "kg fresh matter"
      frequency: "each batch"
      temporal_coverage: "full harvest campaign"
      site_scope: "each grading or packing line"
      aggregation_rule: "reconcile harvested, marketable, rejected, and trimming masses"
      quality_evidence: "scale record and mass-balance check"
  calculation_rules:
    - id: calc_product_nutrient_mass
      applies_to: "nutrient input rows"
      rule: "Product mass multiplied by the declared nutrient concentration; retain both product and nutrient bases."
      inputs:
        - "product mass"
        - "N/P2O5/K2O concentration"
      output: "kg nutrient"
      source_ids:
        - usda-nrcs-nutrient-management-590
    - id: calc_crop_cycle_normalization
      applies_to: "all crop-cycle rows"
      rule: "Sum records assigned to the same field or protected unit and crop cycle, then divide by marketable green fruit output and scale to 1,000 kg."
      inputs:
        - "input or emission record"
        - "crop-cycle output"
      output: "normalized PCR amount"
      source_ids:
        - fao-56-crop-evapotranspiration-1998
    - id: calc_soil_nitrogen_emissions
      applies_to: "soil nitrogen elementary flows"
      rule: "Apply one declared IPCC-compatible method to documented nitrogen inputs and residue fate; do not combine alternative methods for one pathway."
      inputs:
        - "nutrient records"
        - "residue records"
        - "method factors"
      output: "kg N2O-N, NO3-N, or NH3-N"
      source_ids:
        - ipcc-2019-refinement-nitrogen
    - id: calc_energy_allocation
      applies_to: "shared electricity and fuel"
      rule: "Allocate shared energy or fuel by meter, operating hours, throughput, or another documented driver and disclose the selected driver."
      inputs:
        - "utility or fuel total"
        - "allocation driver"
      output: "crop-cycle energy or fuel"
      source_ids:
        - fao-56-crop-evapotranspiration-1998
    - id: calc_mass_balance
      applies_to: "harvest, grading, and gate outputs"
      rule: "Harvested mass equals marketable output plus reject, trimming, residue, and measured loss within the declared tolerance."
      inputs:
        - "harvest mass"
        - "marketable mass"
        - "reject mass"
        - trim
        - loss
      output: "reconciliation result"
      source_ids:
        - codex-fresh-fruits-vegetables-2003
  data_quality_requirements:
    - id: quality_reference_identity
      applies_to: "reference flow and marketable output"
      requirement: "Declare species or cultivar group, immature green market state, gate, and required qualifiers; resolve the product UUID before a final TIDAS dataset is published."
      evidence: "reference-flow metadata, lot specification, and later identity verification"
    - id: quality_temporal_coverage
      applies_to: "all crop-cycle records"
      requirement: "Cover the complete annual crop cycle and every harvest round represented by the reference output."
      evidence: "crop calendar, field log, and harvest records"
    - id: quality_spatial_coverage
      applies_to: "field, protected-unit, and pack-house records"
      requirement: "Identify each field, bed, protected unit, and packing line and avoid mixing sites without an explicit aggregation rule."
      evidence: "farm map, unit register, and pack-house line record"
    - id: quality_mass_completeness
      applies_to: "harvest and gate preparation"
      requirement: "Reconcile harvested, marketable, rejected, trimmed, residue, and wastewater-related records where relevant."
      evidence: "weigh records, grading records, and mass-balance worksheet"
    - id: quality_nutrient_traceability
      applies_to: "fertilizer and amendment inputs"
      requirement: "Retain product identity, nutrient concentration, application date, area, and amount for each application."
      evidence: "label, supplier specification, nutrient plan, and application log"
    - id: quality_method_disclosure
      applies_to: "calculated emissions and allocated services"
      requirement: "Record the factor or method, inputs, conversion, allocation driver, and uncertainty or limitation for calculated values."
      evidence: "calculation worksheet and source reference"
validation_rules:
  - rule_id: validate_reference_qualifiers
    applies_to: "reference flow"
    rule: "Reject a foreground package that omits production geography, route, cultivar or species group, immature green state, crop cycle, declared gate, and required harvest or quality qualifiers."
    source_ids:
      - codex-fresh-fruits-vegetables-2003
  - rule_id: validate_crop_cycle_completeness
    applies_to: "process inventory"
    rule: "Check that establishment, management, harvest, and all represented harvest rounds are covered by records for the same crop cycle."
    source_ids:
      - fao-56-crop-evapotranspiration-1998
  - rule_id: validate_flow_binding_priority
    applies_to: "all flow rows"
    rule: "Use the narrowest applicable Flow Set group first; use a fixed UUID only for an uncovered flow after verification; otherwise retain unmapped coverage and do not change the product boundary to force a match."
    source_ids: []
  - rule_id: validate_nutrient_reconciliation
    applies_to: "nutrient and soil-emission rows"
    rule: "Check that product mass, nutrient concentration, nutrient amount, residue fate, and selected emission method reconcile without double counting."
    source_ids:
      - usda-nrcs-nutrient-management-590
      - ipcc-2019-refinement-nitrogen
  - rule_id: validate_output_mass_balance
    applies_to: "harvest and gate preparation"
    rule: "Require harvested mass to reconcile to marketable green fruit, reject, trimming, residue, and recorded loss within the declared tolerance."
    source_ids:
      - codex-fresh-fruits-vegetables-2003
  - rule_id: validate_gate_and_downstream_cutoff
    applies_to: "boundary and transport rows"
    rule: "Confirm that washing, cooling, packing, treatment, and transport are included only when they occur before the declared gate and that downstream retail and consumption are excluded."
    source_ids:
      - codex-fresh-fruits-vegetables-2003
published_dataset_profile:
  dataset_role: "Secondary foreground dataset for fresh green chillies and peppers at farm or pack-house gate"
  downstream_use: "May support process datasets, lifecycle models, and comparative studies that use the declared green-fruit reference flow and boundary"
  allowed_use: "Gate-to-gate or cradle-to-gate modelling when geography, route, cultivar group, crop cycle, gate, allocation, and data quality are compatible"
  excluded_use: "Red ripe, dried, processed, retail, consumption, or other product states; use with unreported protected-cultivation energy, washing, reject fate, or crop-cycle coverage"
  required_metadata: "PCR id, CPC mapping, species or cultivar group, production geography, route, crop dates, harvest rounds, declared gate, reference mass basis, irrigation, nutrient basis, crop-protection program, packaging, residue and reject fate, and UUID resolution status"
  required_quality_disclosure: "Temporal and spatial coverage, measured versus calculated values, nutrient and emission methods, allocation drivers, mass-balance result, evidence gap flow identities, and known data gaps"
  update_trigger: "Change in crop route, cultivar or maturity specification, gate conditioning, Flow Set taxonomy, reference-flow identity, nutrient or emission method, or material evidence"
