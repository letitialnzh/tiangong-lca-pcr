  - rule_id: validate_mass_balance
    applies_to: "process gates"
    rule: "Check that input, marketable output, rejects, removed residues, and documented losses reconcile after moisture conversion at each included gate."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_nutrient_basis_and_pathways
    applies_to: "nutrient inputs and elementary outputs"
    rule: "Check that fertilizer or amendment product mass is separate from N/P/K or organic nutrient basis and that every calculated emission states its pathway, factor basis, receiving medium, and reported substance."
    source_ids:
      - ipcc-2019-refinement-vol4-ch11
  - rule_id: validate_conditional_processes
    applies_to: "post-harvest conditioning and delivery"
    rule: "Check that every conditional process is supported by a declared gate and operator responsibility and that omitted conditional processes are disclosed when they are known to occur outside scope."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_allocation_disclosure
    applies_to: "shared operations and mixed allium lots"
    rule: "Check that separate records were subdivided where available, otherwise the mass-based allocation key and moisture basis are stated."
    source_ids:
      - iso-14044-2006
