allocation_rules:
  - rule_id: allocation_subdivide_lots
    applies_to: "separate species, cultivars, or product routes"
    rule: "Subdivide field, harvest, conditioning, and delivery records by species, cultivar, product state, or destination whenever separate records are available before applying allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_shared_operations
    applies_to: "shared operations for multiple allium products"
    rule: "If a field or conditioning operation serves multiple products and cannot be subdivided, allocate shared inputs by harvested or dispatched mass at the declared moisture basis and disclose the allocation key."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_status
    applies_to: "rejects and residues"
    rule: "Treat nonmarketable rejects and removed residues as waste outputs unless a documented sale or useful co-product route exists. If a useful co-product is reported, disclose its identity, destination, quantity, and allocation method."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_planting_material_records
      process_id: "field_preparation_and_establishment"
      flow_role: "Planting material"
      record_type: "seed, set, bulb, clove, or transplant lot record"
      raw_fields: "species or cultivar; material type; lot id; treatment; mass; moisture basis; supplier"
      collection_method: "supplier record plus calibrated weighing at field issue"
      unit: "kg as supplied"
      frequency: "per lot and crop cycle"
      temporal_coverage: "crop cycle"
      site_scope: "production field"
      aggregation_rule: "sum issued lots and normalize to declared product output"
      quality_evidence: "lot traceability, supplier documentation, and scale calibration"
    - protocol_id: cp_establishment_fuel_records
      process_id: "field_preparation_and_establishment"
      flow_role: "Field machinery fuel for preparation and planting"
      record_type: "machinery fuel log or equipment record"
      raw_fields: "equipment; operation; fuel type; quantity; field; date; allocation basis"
      collection_method: "fuel log, meter, or verified equipment estimate"
      unit: "L, kg, or MJ"
      frequency: "per operation"
      temporal_coverage: "crop cycle"
      site_scope: "production field"
      aggregation_rule: "allocate operations to the crop cycle and normalize to product output"
      quality_evidence: "fuel record reconciliation and equipment calibration"
    - protocol_id: cp_land_area_records
      process_id: "field_preparation_and_establishment"
