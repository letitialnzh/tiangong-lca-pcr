      collection_method: "field map, farm register, and crop-cycle record"
      unit: "m2 and year"
      frequency: "per field and crop cycle"
      temporal_coverage: "crop cycle"
      site_scope: "production field"
      aggregation_rule: "multiply area by occupation duration and allocate by product output"
      quality_evidence: "field boundary record and crop plan"
    - protocol_id: cp_irrigation_records
