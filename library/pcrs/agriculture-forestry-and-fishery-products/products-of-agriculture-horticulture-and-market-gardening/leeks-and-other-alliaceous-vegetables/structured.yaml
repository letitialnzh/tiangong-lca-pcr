    - protocol_id: cp_delivery_output_records
      process_id: "delivery_to_declared_gate"
      flow_role: "Fresh allium product delivered to the declared gate"
      record_type: "receiving or delivery record"
      raw_fields: "species or mix; shipment id; dispatched mass; received mass; moisture; losses; date; gate"
      collection_method: "calibrated weighing at dispatch and receipt"
      unit: "kg as sold"
      frequency: "per shipment"
      temporal_coverage: "dispatch period"
      site_scope: "declared delivery route and gate"
      aggregation_rule: "reconcile dispatched, received, and documented loss masses"
      quality_evidence: "dispatch and receiving records, scale calibration, and loss log"
  calculation_rules:
    - id: normalize_mass_to_reference_flow
      applies_to: "all product and waste mass rows"
      rule: "Convert each recorded mass to the declared moisture basis, then divide by the mass of the relevant process output and scale to 1 kg reference product."
      inputs:
        - harvest
        - conditioning
        - "and delivery records"
      output: "kg per reference product"
      source_ids:
        - mass-balance-identity
    - id: calculate_nutrient_basis
      applies_to: "fertilizer and soil-amendment inputs"
      rule: "nutrient mass = applied product mass × declared nutrient fraction; retain product mass and each nutrient basis as separate reported values."
      inputs:
        - cp_nutrient_product_records
      output: "kg N, P, K, or organic nutrient basis per reference product"
      source_ids:
        - mass-balance-identity
    - id: calculate_irrigation_requirement
      applies_to: "irrigation water supplied to the crop"
      rule: "Determine crop water requirement from site weather, soil, crop stage, effective rainfall, and irrigation efficiency; report metered delivery where available and document the balance when calculated."
      inputs:
        - cp_irrigation_records
      output: "m3 water per reference product"
      source_ids:
        - fao-56-crop-evapotranspiration
    - id: calculate_nutrient_emissions
      applies_to: "nutrient-related elementary outputs"
      rule: "Apply the selected IPCC or site method factor to the recorded nutrient input and pathway, retain the receiving medium and reported substance, and document direct versus indirect pathways."
      inputs:
        - cp_nutrient_product_records
        - cp_nutrient_emission_calculations
      output: "kg reported substance per reference product"
      source_ids:
        - ipcc-2019-refinement-vol4-ch11
    - id: allocate_shared_operations
      applies_to: "shared field, conditioning, or delivery operations"
      rule: "Allocate shared input quantities by measured product mass at the declared moisture basis after subdivision has been exhausted."
      inputs:
        - field
        - conditioning
        - "and delivery operation records"
      output: "allocated input per reference product"
      source_ids:
        - iso-14044-2006
    - id: amortize_reusable_packaging
      applies_to: "reusable crates and containment"
      rule: "reusable packaging amount = issued packaging mass × attributable use share; use a documented number of cycles and loss or replacement record."
      inputs:
        - cp_conditioning_packaging_records
      output: "kg packaging per conditioned product"
      source_ids:
        - iso-14044-2006
    - id: reconcile_gate_mass_balance
      applies_to: "field, conditioning, and delivery outputs"
      rule: "At each declared gate, reconcile incoming mass with marketable output, rejects, removed residues, and documented moisture or transport losses."
      inputs:
        - harvest
        - conditioning
        - "and delivery records"
      output: "gate mass-balance check"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference flow and product outputs"
      requirement: "Species or cultivar, product mix, market state, trimming, grade, moisture basis, and declared gate must be explicit."
      evidence: "lot and product specification records"
    - id: dq_input_traceability
      applies_to: "planting material, nutrients, crop protection, packaging, water, and energy"
