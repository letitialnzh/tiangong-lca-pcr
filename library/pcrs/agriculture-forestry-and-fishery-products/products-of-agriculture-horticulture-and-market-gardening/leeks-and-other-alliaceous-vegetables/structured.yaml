      collection_method: "application log and calibrated equipment record"
      unit: "kg product or active ingredient"
      frequency: "per application"
      temporal_coverage: "crop cycle"
      site_scope: "production field"
      aggregation_rule: "sum applied product and retain active-ingredient basis"
