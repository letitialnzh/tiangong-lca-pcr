      unit: "kg product and kg nutrient"
      frequency: "per application"
      temporal_coverage: "crop cycle"
      site_scope: "production field"
      aggregation_rule: "sum product and nutrient masses by nutrient basis and normalize to product output"
      quality_evidence: "application log, label or analysis, and scale record"
    - protocol_id: cp_crop_protection_records
