allocation_rules:
  - rule_id: allocation_accepted_and_downgraded
    applies_to: "accepted peas, downgraded peas, shell residue, and rejects"
    rule: "Allocate shared crop-cycle inputs first to declared accepted green pea output using measured mass reconciliation. Report downgraded or rejected produce and shell residue separately; apply a co-product allocation only when a documented productive recipient exists."
    source_ids:
      - iso-14044-2006
      - unece-ffv-27-peas-2025
  - rule_id: allocation_podded_and_shelled_forms
    applies_to: "podded and shelled green pea products"
    rule: "Keep podded and shelled forms separate when shelling changes the product boundary or output basis. If shared operations are aggregated, allocate them by measured mass or another declared physical relationship and retain form-specific evidence."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_multiple_cycles_or_types
    applies_to: "multiple plantings, cultivars, or harvest campaigns"
    rule: "Keep cycles and types separate when input regimes, route, grade, or gate differ. If aggregated, allocate shared operations by measured accepted mass or another declared physical basis."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_reusable_packaging
    applies_to: "reusable crates, pallets, and containers"
    rule: "Allocate packaging burdens over documented reuse cycles and declared capacity or mass basis. Include return and loss records when attributable to the declared gate."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_use
    applies_to: "crop residue, shell residue, wash solids, and wastewater solids"
    rule: "Keep residue treatment and productive use separate from accepted product. Assign a credit only when recipient, intended use, substitution claim, and allocation method are documented."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "crop_establishment"
      flow_role: "seed, planting water, land occupation, planting losses"
      record_type: "supplier lot, planting log, field or compartment register"
      raw_fields: "lot id; seed form; treatment; mass or viable count; type; planting date; area; crop cycle; unused and failed material"
      collection_method: "reconcile supplier records to planting-unit logs and retain lot documents"
      unit: "kg, count, m3, ha"
      frequency: "each lot and planting event"
      temporal_coverage: "complete establishment period"
      site_scope: "each field or protected unit"
      aggregation_rule: "aggregate by planting campaign and production unit"
      quality_evidence: "supplier invoice; planting log; lot traceability"
    - protocol_id: cp_irrigation_records
      process_id: "crop_establishment_or_crop_management"
      flow_role: "irrigation, fertigation water, source withdrawal, drainage"
      record_type: "meter record, water balance, irrigation log"
      raw_fields: "source; meter reading; delivered volume; rainfall; recirculation; drainage; discharge; area; date"
      collection_method: "read meters or reconstruct a documented water balance and reconcile source and delivered volumes"
      unit: "m3, mm, ha"
      frequency: "each event or daily total"
      temporal_coverage: "full crop cycle"
      site_scope: "each irrigation zone and production unit"
      aggregation_rule: "sum by crop cycle and retain source and receiving-medium split"
      quality_evidence: "meter calibration; water-balance closure; operator log"
    - protocol_id: cp_nutrient_records
      process_id: "crop_management"
      flow_role: "nutrient products and nutrient losses"
      record_type: "invoice, product label, nutrient plan, application log"
      raw_fields: "product; formulation; mass; moisture; nutrient concentration; date; area; application method; soil or drainage condition"
      collection_method: "reconcile purchase, storage, and application records; calculate nutrient equivalents"
      unit: "kg product, kg N, kg P2O5, kg K2O"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each production unit and nutrient zone"
      aggregation_rule: "aggregate by product, nutrient, and crop cycle"
      quality_evidence: "label or supplier specification; nutrient-plan review"
    - protocol_id: cp_crop_protection_records
      process_id: "crop_management"
      flow_role: "crop-protection products"
      record_type: "application log and supplier record"
      raw_fields: "product; active ingredient; concentration; mass or volume; date; treated area; purpose"
      collection_method: "reconcile application logs with supplier records and crop-protection plan"
      unit: "kg, L, ha"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each field or crop zone"
      aggregation_rule: "aggregate by product and active ingredient per crop cycle"
      quality_evidence: "operator record; product label; application authorization"
    - protocol_id: cp_energy_records
      process_id: "crop_management"
      flow_role: "mobile fuel, stationary fuel, production electricity"
      record_type: "fuel log, meter, invoice, equipment log"
      raw_fields: "carrier; quantity; meter; operation; equipment; production unit; date; allocation basis"
      collection_method: "read meters or reconcile delivery and equipment records to included operations"
      unit: "L, kg, kWh, MJ"
      frequency: "each delivery, meter period, or operation"
      temporal_coverage: "full crop cycle"
      site_scope: "each production unit and included service"
      aggregation_rule: "sum by carrier, operation, and crop cycle"
      quality_evidence: "meter record; invoice; conversion record"
    - protocol_id: cp_residue_fate_records
      process_id: "crop_management"
      flow_role: "vines, roots, unharvested pods, and crop residues"
      record_type: "residue log, contractor ticket, treatment record"
      raw_fields: "residue type; wet mass; moisture; date; fate; recipient; transport; treatment"
      collection_method: "weigh or calculate residue and retain fate evidence"
      unit: "kg, percent, km"
      frequency: "each removal or treatment event"
      temporal_coverage: "crop termination and residue period"
      site_scope: "each production unit"
      aggregation_rule: "aggregate by fate and crop cycle"
      quality_evidence: "weighbridge or contractor record; recipient declaration"
    - protocol_id: cp_harvest_grading_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "accepted, downgraded, rejected, pod shell, and dispatch output"
      record_type: "harvest ticket, scale record, grading record"
      raw_fields: "date; lot; harvest round; product form; gross mass; accepted mass; grade; shell mass; rejected mass; tare; gate state"
      collection_method: "use calibrated scale and lot-level grading and shelling reconciliation"
      unit: "kg, percent"
      frequency: "each harvest lot or operating shift"
      temporal_coverage: "full harvest campaign"
      site_scope: "each field, line, and product form"
      aggregation_rule: "sum harvest rounds and reconcile gross, accepted, rejects, shells, and tare"
      quality_evidence: "scale check; grading record; lot traceability"
    - protocol_id: cp_washing_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "washing water, wash solids, wastewater, and conditioning rejects"
      record_type: "water meter, wash log, waste ticket, drain record"
      raw_fields: "lot; water in; reuse; discharge; solids; rejected produce; date; line; treatment route"
      collection_method: "reconcile input water, reused water, discharged wastewater, solids, and product output"
      unit: "m3, kg"
      frequency: "each lot or shift"
      temporal_coverage: "all included pre-gate conditioning"
      site_scope: "each conditioning line"
      aggregation_rule: "aggregate by lot and gate period"
      quality_evidence: "meter record; waste ticket; water or mass-balance check"
    - protocol_id: cp_gate_energy_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "sorting, shelling, washing, cooling, and packing electricity"
      record_type: "sub-meter, invoice, equipment log"
      raw_fields: "line; operation; kWh; date; lot throughput; allocation basis"
      collection_method: "allocate metered energy to included pea throughput and retain line records"
      unit: "kWh, kg"
      frequency: "each shift or meter period"
      temporal_coverage: "all included pre-gate operations"
      site_scope: "each conditioning line"
      aggregation_rule: "sum by operation and pea lot"
      quality_evidence: "sub-meter or invoice; throughput record"
    - protocol_id: cp_packaging_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "crates, pallets, cartons, boxes, films, and bags"
      record_type: "packaging specification, issue log, return log"
      raw_fields: "package type; material; tare; capacity; count; reuse cycles; return; loss; lot"
      collection_method: "reconcile issue and return records to lot throughput and reuse basis"
      unit: "kg, item, cycle"
      frequency: "each issue and return event"
      temporal_coverage: "full included gate period"
      site_scope: "each pack-house and route"
      aggregation_rule: "allocate by capacity or documented mass basis"
      quality_evidence: "supplier specification; issue and return log"
    - protocol_id: cp_transport_records
      process_id: "purchased_transport_to_gate"
      flow_role: "purchased road freight"
      record_type: "transport order, bill, route record"
      raw_fields: "material; loaded mass; origin; destination; distance; vehicle or service; return assumption; date"
      collection_method: "calculate tonne-kilometres from verified route and loaded mass"
      unit: "tkm, kg, km"
      frequency: "each shipment"
      temporal_coverage: "all included pre-gate shipments"
      site_scope: "each route and declared gate"
      aggregation_rule: "aggregate by material and pea lot"
      quality_evidence: "bill of lading; route record; mass record"
    - protocol_id: cp_emission_records
      process_id: "crop_management"
      flow_role: "ammonia, nitrous oxide, nitrate, phosphate, and methane"
      record_type: "nutrient plan, drainage record, residue log, emission worksheet"
      raw_fields: "N and P inputs; factor or method; soil or substrate; drainage; residue fate; receiving medium; date"
      collection_method: "calculate using one declared method and retain source fields and method version"
      unit: "kg nutrient; kg emission"
      frequency: "each crop cycle or method period"
      temporal_coverage: "full crop cycle and residue period"
      site_scope: "each production unit"
      aggregation_rule: "aggregate by receiving medium and crop cycle"
      quality_evidence: "method worksheet; input reconciliation; receiving-medium evidence"
  calculation_rules:
    - id: calc_accepted_green_pea_output
      applies_to: "accepted product reference flow"
      rule: "Sum net accepted podded or shelled green pea mass by harvest lot after grading and any included shelling, washing, or cooling, excluding package tare."
      inputs:
        - "harvest tickets"
        - "scale records"
        - "grade records"
        - "shelling records"
        - tare
      output: "kg accepted fresh green peas"
      source_ids:
        - unece-ffv-27-peas-2025
    - id: calc_mass_reconciliation
      applies_to: "harvest and gate preparation"
      rule: "Gross harvested or received mass = accepted product + downgraded or rejected produce + pod shells where applicable + trim and foreign material + measured process loss; investigate unexplained residual."
      inputs:
        - "gross mass"
        - "accepted mass"
        - rejects
        - "shell residue"
        - trim
        - loss
        - "moisture basis"
      output: "reconciled product and residue mass balance"
      source_ids:
        - mass-balance-identity
    - id: calc_product_form_conversion
      applies_to: "podded and shelled product"
      rule: "Shelled edible output = podded input − shell residue − rejected or lost mass, after declaring the moisture and measurement basis."
      inputs:
        - "pod input"
        - "shell mass"
        - "accepted seed"
        - rejects
        - loss
      output: "accepted shelled green pea mass and shell residue"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_equivalents
      applies_to: "nutrient products"
      rule: "Nutrient mass = formulated product mass × documented nutrient concentration; retain product and nutrient bases separately."
      inputs:
        - "product mass"
        - "label or supplier concentration"
        - "application date"
      output: "kg N, kg P2O5, and kg K2O"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_water_balance
      applies_to: "irrigation, source withdrawal, washing, and drainage"
      rule: "Source withdrawal = delivered water + storage change + discharge or drainage − identified recirculated return, with units and period reconciled."
      inputs:
        - "meter readings"
        - delivery
        - rainfall
        - recirculation
        - drainage
        - "storage change"
      output: "m3 source withdrawal and delivered water"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: calc_crop_cycle_normalization
      applies_to: "all crop-cycle amounts"
      rule: "Normalized amount = recorded or calculated amount ÷ accepted green pea output × 1,000 kg. Preserve production-unit, crop-cycle, and product-form denominators."
      inputs:
        - "recorded amount"
        - "accepted output"
      output: "amount per 1,000 kg accepted green peas"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_emissions
      applies_to: "direct and indirect nutrient emissions"
      rule: "Apply one declared method to documented nutrient inputs, soil or substrate conditions, drainage or runoff, and residue fate; do not sum overlapping factors."
      inputs:
        - "nutrient inputs"
        - "method factors"
        - drainage
        - runoff
        - "residue fate"
      output: "emissions by substance and receiving medium"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_reusable_packaging
      applies_to: "reusable crates and pallets"
      rule: "Allocated packaging burden = item burden ÷ documented reuse cycles × pea-lot share by capacity or declared mass basis."
      inputs:
        - "item mass"
        - "reuse cycles"
        - "lot capacity or mass"
        - "return and loss records"
      output: "kg packaging allocated to pea lot"
      source_ids:
        - iso-14044-2006
    - id: calc_transport_service
      applies_to: "purchased road freight"
      rule: "Transport service = loaded mass in tonnes × verified route distance in kilometres; report return or backhaul assumption separately."
      inputs:
        - "shipment mass"
        - "route distance"
        - "service record"
      output: "tonne-kilometres"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: quality_identity_qualifiers
      applies_to: "reference flow and product lots"
      requirement: "Declare pea form, type, cultivar group, route, geography, gate, maturity, tenderness, grade, and packaging state; retain evidence gap platform identity for later foreground resolution."
      evidence: "lot metadata; product specification; gate record"
    - id: quality_mass_closure
      applies_to: "harvest, shelling, rejects, residues, washing, and wastewater"
      requirement: "Close the product and process mass balance for each represented crop cycle or document the unexplained difference and its effect on normalized values."
      evidence: "calibrated scale; mass-balance worksheet; waste ticket"
    - id: quality_temporal_coverage
      applies_to: "crop-cycle inputs and outputs"
      requirement: "Cover the full planting-to-gate crop cycle and every harvest round; identify missing periods, substitutions, and averaging windows."
      evidence: "planting log; harvest log; meter periods"
    - id: quality_route_disclosure
      applies_to: "open-field and protected production"
      requirement: "Identify route, occupied area, infrastructure attribution, recirculation, heating or lighting, substrate, drainage, and crop-termination treatment whenever included."
      evidence: "production-unit record; equipment log; route declaration"
    - id: quality_nutrient_traceability
      applies_to: "nutrient inputs and nutrient emissions"
      requirement: "Link each nutrient value to a product record, concentration, application log, and declared emission method; distinguish product mass from nutrient mass."
      evidence: "invoice; label; nutrient plan; calculation worksheet"
    - id: quality_water_traceability
      applies_to: "irrigation, withdrawal, washing, and drainage"
      requirement: "Identify source, meter or water-balance method, delivered volume, recirculation, drainage, discharge, and receiving medium."
      evidence: "meter record; water-balance closure; discharge record"
    - id: quality_product_form_and_grade
      applies_to: "podded and shelled output"
      requirement: "Record product form, maturity, tenderness, colour, size or grade, accepted mass, shell residue where applicable, and defect tolerance for every lot."
      evidence: "harvest ticket; grade record; product specification"
    - id: quality_reject_and_residue_fate
      applies_to: "downgraded produce, shell residue, crop residue, wash solids, and wastewater"
      requirement: "Record measured amount, moisture basis where relevant, destination, treatment, transport, and recipient evidence for every non-product stream."
      evidence: "waste ticket; contractor record; recipient declaration"
    - id: quality_energy_and_transport
      applies_to: "fuel, electricity, and purchased transport"
      requirement: "Retain carrier or service type, quantity, operation, route, date, meter or shipment evidence, and allocation basis."
      evidence: "invoice; meter record; bill of lading; route record"
validation_rules:
  - rule_id: validation_reference_mass
    applies_to: "reference flow and accepted output"
    rule: "Require 1,000 kg net accepted fresh green peas as the normalized reference amount and preserve the declared podded or shelled product form and gate state."
    source_ids:
      - unece-ffv-27-peas-2025
  - rule_id: validation_mass_reconciliation
    applies_to: "harvest, shelling, and gate-preparation inventory"
    rule: "Check that accepted output, downgraded or rejected produce, pod shells where applicable, residues, trim, wastewater solids, and process losses reconcile with gross harvested or received mass within documented measurement tolerance."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_crop_cycle_completeness
    applies_to: "crop establishment and crop management"
    rule: "Reject a dataset that omits a represented planting campaign, harvest round, or route-specific input without a justified zero or documented exclusion."
    source_ids:
      - unece-ffv-27-peas-2025
  - rule_id: validation_product_form
    applies_to: "podded and shelled products"
    rule: "Check that product form, shelling boundary, accepted output, shell residue, moisture basis, and product qualifiers are consistent throughout the process inventory and dataset metadata."
    source_ids:
      - mass-balance-identity
      - unece-ffv-27-peas-2025
  - rule_id: validation_nutrient_basis
    applies_to: "nutrient products and nutrient emissions"
    rule: "Check product mass, nutrient concentration, nutrient amount, application timing, and declared emission method before accepting nitrogen, ammonia, nitrate, or phosphate values."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validation_water_balance
    applies_to: "irrigation, source withdrawal, washing, and drainage"
    rule: "Check units, source, meter or balance period, delivered water, recirculation, discharge, and receiving medium; investigate negative or unexplained balances."
    source_ids:
      - fao-crop-evapotranspiration-56
  - rule_id: validation_gate_state
    applies_to: "reference product and boundary"
    rule: "Check that shelling, grading, washing, cooling, packaging, and transport are included only when before the declared gate and disclosed in metadata."
    source_ids:
      - unece-ffv-27-peas-2025
      - ucdavis-edible-pod-peas-postharvest
  - rule_id: validation_range_screen
    applies_to: "important inventory rows"
    rule: "Compare site values with the row range or documented evidence. Values outside a range require an explanation, revised evidence, or an explicit scenario declaration."
    source_ids:
      - unece-ffv-27-peas-2025
      - fao-crop-evapotranspiration-56
  - rule_id: validation_residue_fate
    applies_to: "rejects, shell residue, crop residue, wash solids, and wastewater"
    rule: "Require a fate and destination for each non-product stream; do not apply a credit without documented productive use, recipient, and allocation treatment."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground fresh green pea production dataset that may be published as a secondary_dataset and used as a documented agricultural production input"
  downstream_use: "Downstream process and lifecyclemodel construction for fresh whole green peas at the same declared gate and compatible route, geography, period, product form, and quality qualifiers"
  allowed_use: "Comparative or attributional LCA when crop-cycle completeness, gate state, product-form conversion, mass reconciliation, nutrient basis, water balance, and residue fate are disclosed"
  excluded_use: "Dry, frozen, canned, dried, cooked, retail, consumer, or materially different pea routes without an explicit transformation, preservation, storage, or reallocation model"
  required_metadata: "canonical PCR id; reference amount; podded or shelled form; pea type or cultivar group; geography; production route; planting and harvest dates; gate; maturity and grade; accepted, rejected, shell, residue, and wastewater masses; irrigation source and method; nutrient basis; crop-protection program; energy and transport; packaging and reuse; platform identity resolution status"
  required_quality_disclosure: "temporal coverage; site and production-unit coverage; measurement and mass-balance closure; product form and route; water and nutrient evidence; residue fate; missing data; ranges used; allocation; uncertainty fields"
  update_trigger: "new product form or route, material changes in irrigation or fertigation, heating or lighting, crop-protection regime, shelling or grading boundary, packaging system, residue fate, source method, or verified product and flow identities"
