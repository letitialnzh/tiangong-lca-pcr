system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "establishment and crop management"
      rule: "Include production-unit preparation attributable to the crop cycle, planting, crop management, supplied water, nutrients, crop protection, energy, and direct crop emissions. Disclose prior land use and exclude unrelated infrastructure construction."
      source_ids:
        - unece-ffv-27-peas-2025
    - rule_id: boundary_route_specificity
      applies_to: "open-field and protected production"
      rule: "Keep route-specific infrastructure, pumping, heating or lighting, substrate, recirculation, drainage, and crop-termination records separate when they materially change the inventory."
      source_ids:
        - ucdavis-edible-pod-peas-postharvest
    - rule_id: boundary_gate_preparation
      applies_to: "harvest, grading, shelling, washing, cooling, and packing"
      rule: "End the default foreground boundary at the declared farm-gate or pack-house gate. Include shelling, grading, washing, cooling, and primary packaging only when they occur before that gate."
      source_ids:
        - unece-ffv-27-peas-2025
        - ucdavis-edible-pod-peas-postharvest
    - rule_id: boundary_nitrogen_emissions
      applies_to: "nutrient inputs, soil, drainage, and residues"
      rule: "Estimate applicable direct and indirect nitrogen emissions with one declared method using recorded nutrient inputs, drainage or leaching evidence, and residue fate. Avoid double counting pathways."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: boundary_residue_fate
      applies_to: "pod shells, rejected peas, crop residues, wash solids, and wastewater"
      rule: "Record field return, composting, feed use, treatment, transport, or disposal for each residue stream. A credit requires documented recipient, intended use, substitution claim, and allocation treatment."
      source_ids:
        - iso-14044-2006
