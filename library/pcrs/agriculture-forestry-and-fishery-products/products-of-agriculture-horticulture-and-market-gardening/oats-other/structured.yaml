system_boundary:
  rules:
    - rule_id: boundary_crop_production
      applies_to: "field production"
      rule: "Include declared seed-for-sowing input, land occupation, soil preparation, sowing, fertilization, irrigation where applicable, crop protection, field operations, and direct field emissions through harvest."
      source_ids:
        - ipcc-2019-managed-soils-n2o
        - fao-crop-evapotranspiration-56
    - rule_id: boundary_harvest
      applies_to: "harvest and field hand-off"
      rule: "Include harvesting, threshing or combining, field-side collection, and transport to the declared farm or primary-conditioning hand-off when these activities are in the foreground data package."
      source_ids:
        - fao-grain-postharvest-systems-1998
        - fao-oats-postharvest-operations-1999
    - rule_id: boundary_primary_conditioning
      applies_to: "post-harvest route"
      rule: "Include primary drying, cleaning, grading, dust or screenings handling, and short-term storage only when the declared gate is after those operations."
      source_ids:
        - fao-oats-postharvest-operations-1999
        - fao-grain-postharvest-systems-1998
    - rule_id: boundary_downstream_exclusion
      applies_to: "downstream processing"
      rule: "Exclude milling, malting, starch or ethanol conversion, food or feed formulation, retail, and consumer use; represent these as downstream datasets."
      source_ids:
        - fao-oats-postharvest-operations-1999
        - usda-oats-standards-2020
    - rule_id: boundary_input_completeness
      applies_to: "all foreground routes"
      rule: "Address fertilizer, irrigation, crop protection, field energy, electricity, land, harvest energy, drying energy, cleaning losses, residues, and direct emissions with a value, justified zero, or documented exclusion."
      source_ids:
        - ipcc-2019-managed-soils-n2o
        - fao-oats-postharvest-operations-1999
