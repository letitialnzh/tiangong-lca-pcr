      reason_code: verification_pending
      explanation: Verify the actual harvest farm-gate grain state; conditioning is not presumed.
    - row_id: grain_to_primary_conditioning
      reason_code: verification_pending
      explanation: Verify harvested grain before primary conditioning, not its later conditioned product.
    - row_id: conditioned_oats_grain
      reason_code: verification_pending
      explanation: Verify the actual drying, cleaning, grading and tempering state after primary conditioning.
    - row_id: grain_to_declared_storage
      reason_code: verification_pending
      explanation: Verify the grain state at the preceding gate; storage does not imply prior conditioning.
    - row_id: declared_gate_oats_grain
      reason_code: verification_pending
      explanation: Verify the actual grain state and moisture basis after the declared storage or hand-off.
    - row_id: actual_route_product_for_handoff
      reason_code: verification_pending
      explanation: Verify the actual terminal product state and declared gate independently; do not inherit a preceding-stage or alternative-route UUID.
    - row_id: reference_product_at_declared_handoff
      reason_code: verification_pending
      explanation: Verify the actual reference product at the declared handoff independently; this measurement node adds no physical processing.
