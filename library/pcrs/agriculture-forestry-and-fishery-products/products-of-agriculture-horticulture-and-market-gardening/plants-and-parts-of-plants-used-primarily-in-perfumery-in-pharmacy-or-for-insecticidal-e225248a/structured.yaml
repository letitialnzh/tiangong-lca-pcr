        - who-gacp-medicinal-plants
        - who-quality-control-herbal-materials
    - rule_id: boundary_route_delta
      applies_to: "alternative routes and technologies"
      rule: "Managed cultivation is the biological-production parent and wild collection is the alternative production route adding population/ecosystem, collection-range and resource-removal requirements. Conditioning is the parent activity; fresh hand-off and primary drying form an alternative technology route that changes energy, moisture-balance and emission requirements. Collect mutually exclusive strata separately before weighted aggregation."
      source_ids:
        - who-gacp-medicinal-plants
        - fairwild-standard
