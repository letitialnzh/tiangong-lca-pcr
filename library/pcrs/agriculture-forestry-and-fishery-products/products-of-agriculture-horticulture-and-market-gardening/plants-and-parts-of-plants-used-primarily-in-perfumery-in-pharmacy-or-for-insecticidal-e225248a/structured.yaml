        - who-gacp-medicinal-plants
        - fairwild-standard
    - rule_id: boundary_conditioning
      applies_to: "primary conditioning"
      rule: "Include post-harvest cleaning, grading, cutting and primary drying or stabilization needed for producer/collection hand-off. Fresh hand-off has no drying. There is no storage and attribution is single-period; exclude extraction, distillation, formulation and downstream manufacture."
