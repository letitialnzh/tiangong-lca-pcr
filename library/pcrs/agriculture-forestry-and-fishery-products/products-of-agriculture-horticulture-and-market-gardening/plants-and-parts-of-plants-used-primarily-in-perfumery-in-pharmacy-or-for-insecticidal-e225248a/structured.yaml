  - id: "who-gacp-medicinal-plants"
    type: "official_guidance"
    reference: "World Health Organization (2003), WHO guidelines on good agricultural and collection practices (GACP) for medicinal plants, ISBN 92 4 154627 1"
    used_for: "cultivated and collected route, harvest, primary processing, hygiene, records and quality controls"
  - id: "fairwild-standard"
    type: "standard"
    reference: "FairWild Foundation, FairWild Standard Version 3.0"
    used_for: "wild collection source, collection practice, traceability and sustainable resource-removal records"
  - id: "who-quality-control-herbal-materials"
    type: "official_guidance"
    reference: "World Health Organization (2011), Quality control methods for herbal materials, ISBN 978 92 4 150073 9"
    used_for: "identity, foreign matter, moisture, sampling and quality evidence"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC (2019), 2019 Refinement to the 2006 IPCC Guidelines, Volume 4, Chapter 11"
    used_for: "managed-soil nitrogen emissions and N2O conversion"
