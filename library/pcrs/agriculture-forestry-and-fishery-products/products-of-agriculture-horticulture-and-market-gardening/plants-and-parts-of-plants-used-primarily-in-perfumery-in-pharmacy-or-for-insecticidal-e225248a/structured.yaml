system_boundary:
  rules:
    - rule_id: boundary_origin_route
      applies_to: "all material"
      rule: "Select exactly one of managed cultivation or wild collection for each material quantity. Cultivation includes current-cycle management inputs, land occupation and field emissions; wild collection includes source population, collection range, resource removal, collection inputs and residual state."
