allocation_rules:
  - rule_id: allocation_route_exclusivity
    applies_to: "cultivated and wild origin"
    rule: "Do not assign the same material quantity to both origin routes; weight strata by actual accepted mass only after each stratum is complete."
    source_ids:
      - who-gacp-medicinal-plants
      - fairwild-standard
  - rule_id: allocation_mass_balance_first
    applies_to: "accepted, downgraded and waste outputs"
    rule: "Record every output and destination separately and apply mass balance first. Allocate only when multiple economically valuable products share inseparable burdens; report method, price period and sensitivity."
    source_ids:
      - who-quality-control-herbal-materials
  - rule_id: allocation_rework_and_runs
    applies_to: "batches, continuous periods, rework and changeover"
    rule: "Link inputs, outputs, cleaning and changeover events to one run or operating interval; rework retains producing-node burdens and adds only new operations, preventing shared-run double counting."
    source_ids:
      - who-gacp-medicinal-plants
dataset_production:
  collection_protocols:
    - protocol_id: cp_cultivation_identity
      process_id: "managed_cultivation"
      flow_role: "route, taxon, area and internal hand-off"
      record_type: "field and crop records"
      raw_fields: "field id; taxon; plant part; crop dates; area; harvestable mass; moisture"
      collection_method: "field register plus calibrated area and mass records; Raw aggregation and attribution: retain field strata; sum only after route checks"
      unit: "ha; dates; kg; %"
      frequency: "each field and crop cycle"
      temporal_coverage: "complete crop cycle"
      site_scope: "all cultivated sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "field register, scale and moisture-test evidence"
    - protocol_id: cp_cultivation_inputs
      process_id: "managed_cultivation"
      flow_role: "propagation, nutrients and crop protection"
      record_type: "purchase, issue and application records"
      raw_fields: "product identity; supplier; formulation; active substance or nutrient analysis; quantity; treated area; event"
      collection_method: "reconcile invoices, stock issues and application logs; Raw aggregation and attribution: sum by concrete product and field without double counting"
      unit: "kg; L; items; ha"
      frequency: "each input and application event"
      temporal_coverage: "complete crop cycle"
      site_scope: "all cultivated fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, label, analysis and application log"
    - protocol_id: cp_field_water
      process_id: "managed_cultivation"
      flow_role: "irrigation water"
      record_type: "meter or irrigation record"
      raw_fields: "water source; delivered volume; irrigated area; event"
      collection_method: "meter reading or engineering calculation with method; Raw aggregation and attribution: sum delivered water by field; rainfed strata remain zero"
      unit: "m3; ha"
      frequency: "each irrigation event"
      temporal_coverage: "complete crop cycle"
      site_scope: "all irrigated fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration or calculation inputs"
    - protocol_id: cp_energy_records
      process_id: "all_processes"
      flow_role: "energy carriers and run-linked cleaning/changeover"
      record_type: "meter, fuel and equipment logs"
      raw_fields: "carrier; quantity; energy content; equipment; field/run; cleaning/changeover event"
      collection_method: "reconcile meters, purchase and operating logs; Raw aggregation and attribution: assign once to the consuming node and convert separately"
      unit: "MJ; kWh; kg; L"
      frequency: "each operation or operating interval"
      temporal_coverage: "complete cycle, collection period or conditioning period"
      site_scope: "all foreground sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration, invoices and operating logs"
    - protocol_id: cp_field_emissions
      process_id: "managed_cultivation"
      flow_role: "direct field emissions"
      record_type: "activity and model records"
      raw_fields: "N inputs; amendment; active substances; application event; soil/climate; receiving compartment; factor/model"
      collection_method: "collect activity data and apply declared method; Raw aggregation and attribution: calculate by field, substance and compartment then sum"
      unit: "kg substance; ha"
      frequency: "each event and crop cycle"
      temporal_coverage: "complete crop cycle"
      site_scope: "all cultivated fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "activity records, factor version and model output"
    - protocol_id: cp_wild_collection
      process_id: "wild_collection"
      flow_role: "population, collection effort, withdrawal and residuals"
      record_type: "collector and source-area records"
      raw_fields: "taxon; plant part; ecosystem; source area; permit; collector; dates; gross removal; target output; incidental material; residual condition"
      collection_method: "verified collection log and field observation; Raw aggregation and attribution: retain source-area strata and reconcile gross removal"
      unit: "kg; items; ha or declared collection unit"
      frequency: "each collection event"
      temporal_coverage: "complete collection period"
      site_scope: "all source areas and collectors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "permit, collector log, geolocation and field inspection"
    - protocol_id: cp_conditioning_mass_balance
      process_id: "primary_conditioning"
      flow_role: "incoming, accepted, downgraded, waste and loss states"
      record_type: "batch or continuous-period records"
      raw_fields: "origin lot; input mass/moisture; accepted grades; downgraded mass/destination; waste mass/destination; output moisture"
      collection_method: "calibrated weighing and same-lot moisture tests; Raw aggregation and attribution: close mass and moisture balance per run before aggregation"
      unit: "kg; %"
      frequency: "each batch or continuous period"
      temporal_coverage: "complete conditioning campaign"
      site_scope: "all conditioning sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration, lab/test record and destination receipt"
    - protocol_id: cp_conditioning_inputs
      process_id: "primary_conditioning"
      flow_role: "water and wastewater"
      record_type: "meter and discharge records"
      raw_fields: "water source; supplied volume; wastewater mass/volume; composition; destination"
      collection_method: "metering, tank balance and discharge documentation; Raw aggregation and attribution: balance supplied water, retained moisture and wastewater"
      unit: "m3; kg"
      frequency: "each batch or operating interval"
      temporal_coverage: "complete conditioning campaign"
      site_scope: "all wet-conditioning sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration and discharge receipt"
    - protocol_id: cp_drying_records
      process_id: "primary_conditioning"
      flow_role: "drying moisture and dust"
      record_type: "dryer and environmental records"
      raw_fields: "input/output mass; input/output moisture; run time; controls; dust measurement/model; particle size; air compartment"
      collection_method: "same-lot moisture balance plus measured or documented emission model; Raw aggregation and attribution: calculate water removed and dust after controls by run"
      unit: "kg water; kg particulate; particle-size fraction"
      frequency: "each drying run"
      temporal_coverage: "complete drying campaign"
      site_scope: "all drying units"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "moisture test, run log, control record and emission evidence"
    - protocol_id: cp_reject_destinations
      process_id: "primary_conditioning"
      flow_role: "downgrade, reject, rework and waste routing"
      record_type: "grade and destination records"
      raw_fields: "state; mass; reason; rework loop; recipient; beneficial use or waste destination; receipt"
      collection_method: "reconcile sorting record with recipient or disposal evidence; Raw aggregation and attribution: each rejected quantity has exactly one path and is excluded from accepted output"
      unit: "kg"
      frequency: "each batch or period"
      temporal_coverage: "complete campaign"
      site_scope: "all grading sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "grade record, recipient confirmation or waste receipt"
  calculation_rules:
    - id: calc_dry_matter
      applies_to: "all plant material"
      rule: "dry mass = wet mass × dry-matter fraction; declare wet or dry basis for every moisture percentage"
      inputs:
        - "wet mass"
        - "same-lot moisture"
      output: "kg dry matter"
      source_ids:
        - who-quality-control-herbal-materials
    - id: calc_conditioning_balance
      applies_to: "primary conditioning"
      rule: "incoming mass = accepted + downgraded + solid waste + unrecovered loss + net water removed; report unexplained difference"
      inputs:
        - "run-level mass and moisture records"
      output: "run mass balance and difference"
      source_ids:
        - who-gacp-medicinal-plants
    - id: calc_managed_soil_n2o
      applies_to: "cultivated soil"
      rule: "calculate N2O-N with the declared IPCC tier, nitrogen activity and factors, then multiply by 44/28 for N2O"
      inputs:
        - "nitrogen by source"
        - "soil/climate"
        - factors
      output: "kg N2O"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_route_weighting
      applies_to: "multi-origin aggregate"
      rule: "aggregate = accepted-mass-weighted values from complete mutually exclusive strata; never treat a missing stratum as zero"
      inputs:
        - "stratum inventories"
        - "accepted mass"
      output: "weighted inventory"
      source_ids:
        - who-gacp-medicinal-plants
        - fairwild-standard
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every lot"
      requirement: "Taxon, plant part, use, origin route, geography, fresh/dry state and moisture basis are complete and non-conflicting."
      evidence: "lot identity, label, permit or supply record"
    - id: dq_completeness
      applies_to: "all nodes"
      requirement: "Cover all sites, collectors, runs, inputs, outputs, rejects and destinations in the collection/crop period and linked conditioning period; quantify missing coverage."
      evidence: "coverage register and mass balance"
    - id: dq_wild_source
      applies_to: "wild collection"
      requirement: "Retain permit, collection range, population/habitat observation, collection intensity and residual condition to support resource-removal and sustainability interpretation."
      evidence: "permit, geospatial record, collection log and inspection"
    - id: dq_temporal_and_technology
      applies_to: "all routes"
      requirement: "Data represent the declared year/period and actual technology; aggregate alternative routes or technologies only after complete stratification."
      evidence: "dated records, equipment records and stratum coverage"
validation_rules:
  - rule_id: validate_reference_identity_gap
    applies_to: "reference flow"
    rule: "Reference UUID, property UUID and unit-group UUID remain blank until one Tiangong Product flow compatible with category, gate, state and mass property is verified; reject similar species, extracts, formulations and generic biomass substitutes."
    source_ids: []
  - rule_id: validate_origin_exclusivity
    applies_to: "each material quantity"
    rule: "Declare exactly one cultivated or wild-collected origin route; the two routes must not double count."
    source_ids:
      - who-gacp-medicinal-plants
      - fairwild-standard
  - rule_id: validate_identity_qualifiers
    applies_to: "reference product"
    rule: "Fail when taxon, plant part, intended use, fresh/dry state, moisture basis, geography or lot is missing; do not merge states without conversion and stratification."
    source_ids:
      - who-quality-control-herbal-materials
  - rule_id: validate_nutrient_cardinality
    applies_to: "managed_cultivation"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_runs_and_rework
    applies_to: "conditioning runs"
    rule: "Link every input, output, cleaning, changeover, downgrade, rework and discard path to a run/period; exclude rejects from accepted output and prevent shared-burden duplication."
    source_ids:
      - who-gacp-medicinal-plants
  - rule_id: validate_mass_moisture_balance
    applies_to: "conditioning"
    rule: "Complete mass and moisture balance for each run; fresh routes have zero drying energy and water vapour, and wet routes balance supplied water and wastewater."
    source_ids:
      - who-quality-control-herbal-materials
  - rule_id: validate_deferred_elementary_identity
    applies_to: "nitrate, phosphorus, crop-protection releases, wild biomass and dust"
    rule: "Before final process exchange, expand each umbrella into verified concrete substance/species, property and receiving/source compartment UUIDs; never auto-bind a broad search candidate."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production package with cultivated or wild origin and conditioning route evidence"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "process or lifecycle-model use when taxon, plant part, use, origin route, geography, gate and fresh/dry state match"
  excluded_use: "no representation of undeclared species/parts, extracts/oils/formulations, interchange of wild and cultivated origin, or use across moisture states without conversion"
  required_metadata: "taxon; plant part; intended use; origin route; geography; crop cycle or collection period; lot/run; fresh/dry state; moisture; grade; harvest and conditioning technology; outputs and destinations"
  required_quality_disclosure: "record coverage, measurement and model methods, identity/UUID gaps, strata, mass/moisture-balance difference, wild-source evidence, proxies and uncertainty"
  update_trigger: "material change in taxon/part/use, origin route, hand-off state, geography, harvest/conditioning technology, quality rule, emission method or Tiangong identity binding"
