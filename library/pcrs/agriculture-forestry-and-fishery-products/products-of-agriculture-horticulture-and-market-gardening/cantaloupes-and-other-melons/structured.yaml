allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "field management, harvest, and conditioning"
    rule: "Prefer separate records for production, harvest, conditioning, marketable fruit, residues, and waste before applying allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_melon_grades
    applies_to: "multiple marketable melon grades"
    rule: "Treat declared grades as one reference-product category when they share the same intended use; report grade-specific quantities and use economic or mass allocation only when separate modelling is infeasible."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_and_rejects
    applies_to: "residues, rejects, and useful secondary outputs"
    rule: "Treat material with a declared useful hand-off as a co-product only when the hand-off and destination are documented; otherwise record it as waste or residue with fate disclosed."
    source_ids:
      - fao-fruit-and-vegetable-postharvest
      - iso-14044-2006
  - rule_id: allocation_shared_operations
    applies_to: "shared field, protected-crop, or conditioning operations"
    rule: "Allocate shared operations by measured area, time, mass, or another documented physical relationship; disclose the choice and test a value-based sensitivity when the physical relationship is not representative."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_melon_establishment_records
      process_id: "melon_field_establishment"
      flow_role: "seed, transplants, planted area, establishment energy"
      record_type: "seed invoice, transplant delivery, field log, machinery record"
      raw_fields: "production_unit_id; melon_type; cultivar; area; material_type; quantity; date; operation"
      collection_method: "reconcile planting material and establishment operations to each production unit and crop cycle"
      unit: "ha; kg; plants; L; kWh"
      frequency: "each planting campaign"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented production units"
      aggregation_rule: "sum by production unit and physical identity; retain seeded and transplanted routes separately"
      quality_evidence: "invoices; field maps; supplier records; equipment logs"
    - protocol_id: cp_melon_field_operation_records
      process_id: "melon_field_establishment_and_melon_crop_management"
      flow_role: "field operations, fuel, land occupation"
      record_type: "field log, fuel receipt, contractor record, area register"
      raw_fields: "production_unit_id; area; operation; date; fuel; machinery; contractor_scope; occupation_period"
      collection_method: "reconcile operations and fuel to each production unit and crop cycle"
      unit: "ha; L; kg; kWh; m2*a"
      frequency: "each operation or meter period"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented production units"
      aggregation_rule: "sum by operation and production unit; prevent overlap between owned and contracted equipment"
      quality_evidence: "dated logs; invoices; calibrated meters; area records"
    - protocol_id: cp_melon_fertilizer_records
      process_id: "melon_crop_management"
      flow_role: "nutrient and amendment inputs"
      record_type: "nutrient plan, invoice, application log, product label, assay"
      raw_fields: "production_unit_id; product; amount; nutrient_content; basis; date; method"
      collection_method: "calculate nutrient content from product records and retain product identity and reporting basis"
      unit: "kg product; kg N; kg P2O5; kg K2O"
      frequency: "each application"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented production units"
      aggregation_rule: "sum by nutrient, product, date, and production unit without merging formulations"
      quality_evidence: "invoices; labels; soil tests; application records"
    - protocol_id: cp_melon_irrigation_records
      process_id: "melon_crop_management"
      flow_role: "irrigation water"
      record_type: "meter, pump log, irrigation schedule, water invoice"
      raw_fields: "production_unit_id; source; volume; date; delivery_method; rainfall_context"
      collection_method: "reconcile delivered irrigation to production unit and crop cycle; keep rainfall separate"
      unit: "m3; mm; ha"
      frequency: "each irrigation event or meter period"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented production units"
      aggregation_rule: "sum metered or documented volumes and disclose calculated values"
      quality_evidence: "calibrated meters; pump records; water permits; schedules"
    - protocol_id: cp_melon_crop_protection_records
      process_id: "melon_crop_management"
      flow_role: "crop-protection formulations"
      record_type: "product label, invoice, application log, spray record"
      raw_fields: "production_unit_id; product; active_ingredient; amount; concentration; date; method"
      collection_method: "record each formulation and event separately and reconcile to the crop cycle"
      unit: "kg; L; ha"
      frequency: "each application"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented production units"
      aggregation_rule: "preserve product and active-ingredient identity; do not aggregate distinct products"
      quality_evidence: "labels; invoices; application logs; operator records"
    - protocol_id: cp_melon_emission_activity
      process_id: "melon_crop_management"
      flow_role: "soil and air or water emissions"
      record_type: "nutrient balance, soil record, weather, residue, emission model"
      raw_fields: "production_unit_id; N_inputs; organic_N; residue_N; soil; climate; drainage; factor_set; model_version"
      collection_method: "calculate each emission using one declared geographically applicable method"
      unit: "kg N; kg emission; ha"
      frequency: "each event and crop-cycle calculation"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented production units"
      aggregation_rule: "calculate per unit, area-weight, then normalize by same-cycle marketable yield"
      quality_evidence: "source records; factor provenance; model files; review record"
    - protocol_id: cp_melon_harvest_records
      process_id: "melon_harvest_and_farm_gate"
      flow_role: "incoming fruit, marketable output, rejects, losses, harvest energy"
      record_type: "weighbridge, field bin record, harvest log, grade ticket, meter, destination record"
      raw_fields: "production_unit_id; harvest_date; melon_type; cultivar; incoming_mass; marketable_mass; reject_mass; grade; maturity; moisture; destination; fuel"
      collection_method: "reconcile every harvest to marketable output, rejects, losses, and declared hand-off"
      unit: "kg; percent; L; kWh"
      frequency: "each harvest"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented production units"
      aggregation_rule: "sum accepted, rejected, and lost fruit by grade and destination; close the harvest mass balance"
      quality_evidence: "calibrated scales; grade records; moisture checks; destination evidence"
    - protocol_id: cp_melon_conditioning_records
      process_id: "on_farm_melon_conditioning"
      flow_role: "water, packaging, electricity, conditioned fruit, rejects"
      record_type: "batch ticket, scale, meter, packaging issue, wash record"
      raw_fields: "batch_id; incoming_mass; accepted_mass; reject_mass; water; electricity; packaging_material; reuse_status; date"
      collection_method: "reconcile conditioning batches and shared meters to accepted output"
      unit: "kg; m3; kWh; packaging kg"
      frequency: "each batch or meter period"
      temporal_coverage: "all pre-gate conditioning"
      site_scope: "all included equipment and batches"
      aggregation_rule: "match incoming and accepted masses; allocate shared utilities by time or processed mass"
      quality_evidence: "calibrated scales and meters; batch tickets; packaging records"
  calculation_rules:
    - id: calc_area_to_reference_flow
      applies_to: "field and crop-management flows"
      rule: "Crop-cycle amount per hectare divided by same-cycle marketable melon yield per hectare, multiplied by 1,000 kg"
      inputs:
        - "flow amount"
        - "production-unit area"
        - "marketable melon mass"
      output: "amount per 1,000 kg marketable melon"
      source_ids: []
    - id: calc_nutrient_content
      applies_to: "fertilizer and amendment inputs"
      rule: "Product mass multiplied by documented nutrient fraction; preserve product and nutrient or oxide-equivalent basis"
      inputs:
        - "product identity"
        - mass
        - assay
        - "reporting basis"
      output: "kg N, kg P2O5, or kg K2O by source"
      source_ids: []
    - id: calc_managed_soil_n2o
      applies_to: "soil N2O"
      rule: "Apply the selected IPCC tier or regional method to fertilizer N, organic N, returned-residue N, volatilization, and leaching pathways"
      inputs:
        - "nitrogen activity"
        - "residue fate"
        - "soil and climate"
        - factors
      output: "kg N2O by pathway"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_ammonia_volatilization
      applies_to: "ammonia to air"
      rule: "Calculate by nutrient product, application method, timing, and applicable factor"
      inputs:
        - "nitrogen product records"
        - "application details"
        - factors
      output: "kg NH3"
      source_ids:
        - emep-eea-2023-guidebook
    - id: calc_harvest_mass_balance
      applies_to: "harvest and grading"
      rule: "Incoming crop mass equals marketable output plus declared useful outputs, rejects, and measured losses within uncertainty"
      inputs:
        - incoming
        - marketable
        - useful
        - reject
        - "and loss masses"
      output: "reconciled harvest outputs"
      source_ids:
        - mass-balance-identity
    - id: calc_conditioning_mass_balance
      applies_to: "on-farm conditioning"
      rule: "Incoming batch mass equals accepted fruit plus useful outputs, rejects, and measured losses within uncertainty"
      inputs:
        - "batch masses"
        - moisture
        - "loss records"
      output: "reconciled conditioning outputs per accepted fruit"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference and marketable outputs"
      requirement: "Confirm the melon type and cultivar are within CPC 01229 and distinguish them from watermelon, seed, transplants, and processed melon."
      evidence: "crop, lot, cultivar, and sales records"
    - id: dq_temporal_alignment
      applies_to: "all foreground rows"
      requirement: "Use planting, inputs, harvest, yield, emissions, and conditioning records from the same declared crop cycle; disclose proxy years."
      evidence: "dated field and batch records"
    - id: dq_mass_and_grade
      applies_to: "fruit outputs and rejects"
      requirement: "Retain scale calibration, grade criteria, maturity state, and moisture or as-received basis for accepted and rejected fruit."
      evidence: "calibration, grade tickets, and quality records"
    - id: dq_completeness
      applies_to: "process map and flows"
      requirement: "Reconcile every production unit and conditioning batch and distinguish zero, not applicable, proxy, and missing values."
      evidence: "production-unit roster and batch reconciliation"
    - id: dq_identity_resolution
      applies_to: "parameterized, unmapped, and reference flows"
      requirement: "Resolve every Flow Set reference and the evidence gap reference product to verified UUIDs before final TIDAS process publication."
      evidence: "identity review record"
validation_rules:
  - rule_id: validation_reference_output
    applies_to: "terminal output"
    rule: "Exactly one terminal marketable melon output equals 1,000 kg after scaling and declares melon type, cultivar, maturity, grade, and farm-gate qualifiers."
    source_ids: []
  - rule_id: validation_process_route
    applies_to: "process map"
    rule: "Include establishment, crop management, and harvest once per crop cycle; include conditioning only when it occurs before hand-off and is not double counted."
    source_ids: []
  - rule_id: validation_crop_cycle_reconciliation
    applies_to: "field inventory"
    rule: "Production-unit area, planting material, inputs, harvest outputs, residue fates, and emissions refer to the same crop cycle and production units."
    source_ids: []
  - rule_id: validation_nitrogen_balance
    applies_to: "nutrient and emission inventory"
    rule: "Reconcile nutrient content, returned and removed residue nitrogen, and emission pathways with methods and factors disclosed."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validation_harvest_balance
    applies_to: "harvest and grading"
    rule: "Reconcile incoming fruit with marketable fruit, declared useful outputs, rejects, and measured losses within uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_conditioning_balance
    applies_to: "optional conditioning"
    rule: "Reconcile incoming batches with accepted fruit, rejects, packaging, water, and measured losses; exclude conditioning when its burdens are embedded upstream."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_flow_identity
    applies_to: "every flow"
    rule: "Accept only exact verified UUIDs as fixed and applicable existing Flow Sets as parameterized; otherwise retain unmapped coverage and resolve before final process publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground fresh cantaloupe and other non-watermelon melon production dataset"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "farm-gate LCA of fresh whole cantaloupe and other non-watermelon melons when geography, cultivar or melon type, season, yield, irrigation, residue, grading, and conditioning context are preserved"
  excluded_use: "watermelon; seed or transplant production; cut or processed melon; post-farm-gate storage, distribution, retail, or consumption; another crop without a reviewed proxy decision"
  required_metadata: "geography; melon type; cultivar; production year; crop cycle; production system; area; planting route; yield; maturity; grade; irrigation; nutrient basis; crop protection; residue fate; conditioning; packaging; allocation; identity resolution"
  required_quality_disclosure: "foreground coverage; proxy inputs; missing records; range exceedances; emission methods; scale and meter calibration; grade and mass-balance reconciliations"
  update_trigger: "new reviewed melon evidence, material route change, revised emission method, changed Flow Set or UUID identity, or representative data outside QA ranges"
