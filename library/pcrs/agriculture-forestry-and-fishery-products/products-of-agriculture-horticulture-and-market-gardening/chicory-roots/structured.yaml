allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all nodes"
    rule: "Prefer subdivision and direct measurement by lot and run."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_grades
    applies_to: "accepted and downgraded roots"
    rule: "Report masses separately; if both have value and subdivision is impossible, declare the study allocation method and provide unallocated inventory. Never count downgraded roots as accepted."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residues
    applies_to: "tops, soil, losses and rejects"
    rule: "Retain burdens with the producing node unless a documented product function and destination justify allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_runs_rework
    applies_to: "shared runs and rework"
    rule: "Assign shared burdens once by measured use, time, area or mass; returned material retains prior burdens and receives only incremental rework burdens."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_inputs
      process_id: "field_production"
      flow_role: "planting, each nutrient and crop-protection product"
      record_type: "invoice/application/field records"
      raw_fields: "lot; route; product; nutrient/active content; wet/dry basis; quantity; area; date"
      collection_method: "Reconcile stock and applications; generate concrete nutrient exchanges separately under the sole nutrient card; Raw aggregation and attribution: Sum by product and normalize by area then accepted yield"
      unit: "kg, kg active, ha"
      frequency: "each operation"
      temporal_coverage: "full cycle"
      site_scope: "field lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice; label; applicator record"
    - protocol_id: cp_irrigation
      process_id: "field_production"
      flow_role: "irrigation"
      record_type: "meter/pump records"
      raw_fields: "source; readings or flow/runtime; area; reuse"
      collection_method: "Meter or calibrated flow × runtime; Raw aggregation and attribution: Sum gross delivery; subtract only documented reuse"
      unit: "m3, ha"
      frequency: "each event"
      temporal_coverage: "full cycle"
      site_scope: "field lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; irrigation log"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "energy by operation"
      record_type: "fuel/meter/machine logs"
      raw_fields: "carrier; quantity; operation; runtime; area/mass; lot/run"
      collection_method: "Meter or reconcile fuel; assign shared use once; Raw aggregation and attribution: Retain carrier exchange; normalize by causal driver"
      unit: "L, kg, kWh, MJ"
      frequency: "each operation"
      temporal_coverage: "full cycle through hand-off"
      site_scope: "lot/run"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice; meter; equipment log"
    - protocol_id: cp_mass_balance
      process_id: "field_and_lifting"
      flow_role: "roots, residues, losses, transfers"
      record_type: "scale/sampling records"
      raw_fields: "lot; gross/tare/net; moisture; tops; soil; loss; time"
      collection_method: "Calibrated weighing and representative sampling; Raw aggregation and attribution: Reconcile inputs, outputs, residues and losses"
      unit: "kg, ha"
      frequency: "each lot/handoff"
      temporal_coverage: "harvest through lifting"
      site_scope: "field lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; sampling plan"
    - protocol_id: cp_field_emissions
      process_id: "field_production"
      flow_role: "exact emissions"
      record_type: "calculation record"
      raw_fields: "nutrient form/N; application; soil/climate; substance; compartment; method"
      collection_method: "Apply named method to collected records; Raw aggregation and attribution: Sum by substance and compartment"
      unit: "kg substance, kg N"
      frequency: "each application/calculation"
      temporal_coverage: "full cycle"
      site_scope: "field lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "inputs; method; audit trail"
    - protocol_id: cp_conditioning
      process_id: "primary_conditioning"
      flow_role: "utilities, roots, residues, wastewater"
      record_type: "meter/scale/run log"
      raw_fields: "run/lot; roots; water; energy; tops; soil; wastewater; destinations"
      collection_method: "Meter utilities and weigh material states; Raw aggregation and attribution: Reconcile solids and water separately"
      unit: "kg, L, kWh"
      frequency: "each run"
      temporal_coverage: "all included runs"
      site_scope: "site/run"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; run sheet; receipt"
    - protocol_id: cp_grading
      process_id: "grading_farm_gate"
      flow_role: "accepted, downgraded, rejected, reworked"
      record_type: "grade/dispatch log"
      raw_fields: "run/lot; grade; each output mass; destination; rework; date"
      collection_method: "Calibrated weighing by output state; Raw aggregation and attribution: Reconcile prepared input and outputs; count rework once"
      unit: "kg"
      frequency: "each run/dispatch"
      temporal_coverage: "all included runs"
      site_scope: "site/run"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; grade; dispatch"
  calculation_rules:
    - id: calc_area_normalization
      applies_to: "field flows"
      rule: "amount per kg accepted roots = crop-cycle amount / accepted mass from the same area"
      inputs:
        - amount
        - area
        - "accepted mass"
      output: "normalized exchange"
      source_ids:
        - mass-balance-identity
    - id: calc_process_balance
      applies_to: "each hand-off"
      rule: "input mass = products + residues/rejects + measured loss on one mass state"
      inputs:
        - "calibrated masses"
        - samples
      output: "closure difference"
      source_ids:
        - mass-balance-identity
    - id: calc_direct_emissions
      applies_to: "field emissions"
      rule: "Apply the declared current method separately by substance and compartment"
      inputs:
        - "input and field records"
      output: "kg substance by compartment"
      source_ids:
        - ipcc-2019-refinement-volume4
    - id: calc_shared_energy
      applies_to: "shared equipment"
      rule: "consumption × causal share; shares sum to 1"
      inputs:
        - energy
        - "time/area/mass"
      output: "assigned energy"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Link cultivar/use, grade, trimming, cleanliness and moisture state to each lot mass."
      evidence: "grade, lot and dispatch records"
    - id: dq_coverage
      applies_to: "inventory"
      requirement: "Cover one complete crop cycle and every contributing lifting, conditioning and grading run."
      evidence: "dated field/run logs"
    - id: dq_measurement
      applies_to: "mass, water, energy"
      requirement: "Use calibrated instruments or document calculation, sampling and uncertainty."
      evidence: "calibration and sampling records"
    - id: dq_route
      applies_to: "alternatives"
      requirement: "Keep establishment and lifting routes separate until route-specific input, yield and loss calculation."
      evidence: "route-indexed records"
    - id: dq_completeness
      applies_to: "nutrients and outputs"
      requirement: "Collect actual nutrient products under one card and account for accepted, downgraded, rejected, residue and loss states without duplication."
      evidence: "input ledger; balance report"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference flow"
    rule: "Confirm UUID, 1 kg net mass, fresh unprocessed root state and qualifiers; reject datasets for chicons, leaves, roasted root or extracts."
    source_ids:
      - ucd-witloof-chicory
      - umn-forcing-chicories-2023
  - rule_id: validate_topology
    applies_to: "process graph"
    rule: "Require field, lifting, conditioning and grading hand-offs; washing is conditional and forcing/later processing absent."
    source_ids:
      - umn-forcing-chicories-2023
  - rule_id: validate_route_delta
    applies_to: "alternatives"
    rule: "Require parent process, lot-level route and evidence for changed planting, energy, loss or conditioning records; do not mix mutually exclusive routes within a lot."
    source_ids:
      - umn-forcing-chicories-2023
  - rule_id: validate_nutrients
    applies_to: "field inputs"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids:
      - omafra-root-chicory
  - rule_id: validate_mass_balance
    applies_to: "hand-offs"
    rule: "Reconcile each input with products, residues/rejects and loss on the same state; investigate unexplained closure."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_reject_routing
    applies_to: "grade/rework"
    rule: "Give every downgraded or rejected state a destination; returned material receives only incremental burden and cannot be accepted until it passes grade."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_run_attribution
    applies_to: "shared operations"
    rule: "Verify lot/run indexing and shares summing to one so cleaning, energy and rework are counted once."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_ranges
    applies_to: "inventory"
    rule: "Require exactly one complete Range per flow card; review values outside it without replacing supported foreground values."
    source_ids:
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "Foreground production dataset for fresh unprocessed chicory roots at farm gate"
  downstream_use: "secondary_dataset; background_dataset when representative"
  allowed_use: "LCA of fresh roots and downstream forcing, food, feed or ingredient systems that add their own post-farm processes"
  excluded_use: "Direct representation of forced chicons, leafy chicory, roasted chicory, coffee substitute, extracts, seed or processed root"
  required_metadata: "geography; lot/cycle; cultivar/use; establishment and lifting routes; yield; irrigation; nutrient ledger; conditioning; grade destinations; moisture state; year"
  required_quality_disclosure: "primary-data share; representativeness; balance closure; route separation; uncertainty; treatment of range exceedances"
  update_trigger: "material change in route, technology, irrigation/nutrients, yield, conditioning, grade, reject destination, geography or data age"
