      frequency: "each run/dispatch"
      temporal_coverage: "all included runs"
      site_scope: "site/run"
      aggregation_rule: "Reconcile prepared input and outputs; count rework once"
      quality_evidence: "calibration; grade; dispatch"
  calculation_rules:
    - id: calc_area_normalization
      applies_to: "field flows"
      rule: "amount per kg accepted roots = crop-cycle amount / accepted mass from the same area"
