allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "all nodes"
    rule: "Prefer subdivision and direct measurement by lot and run."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_grades
    applies_to: "accepted and downgraded roots"
    rule: "Report masses separately; if both have value and subdivision is impossible, declare the study allocation method and provide unallocated inventory. Never count downgraded roots as accepted."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residues
    applies_to: "tops, soil, losses and rejects"
    rule: "Retain burdens with the producing node unless a documented product function and destination justify allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_runs_rework
    applies_to: "shared runs and rework"
    rule: "Assign shared burdens once by measured use, time, area or mass; returned material retains prior burdens and receives only incremental rework burdens."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
