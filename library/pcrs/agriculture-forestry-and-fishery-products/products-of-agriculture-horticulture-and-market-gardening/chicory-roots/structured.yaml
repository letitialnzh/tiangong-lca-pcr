      unit: "kg, ha"
      frequency: "each lot/handoff"
      temporal_coverage: "harvest through lifting"
      site_scope: "field lot"
      aggregation_rule: "Reconcile inputs, outputs, residues and losses"
      quality_evidence: "calibration; sampling plan"
    - protocol_id: cp_field_emissions
      process_id: "field_production"
      flow_role: "exact emissions"
      record_type: "calculation record"
      raw_fields: "nutrient form/N; application; soil/climate; substance; compartment; method"
      collection_method: "Apply named method to collected records"
      unit: "kg substance, kg N"
      frequency: "each application/calculation"
      temporal_coverage: "full cycle"
      site_scope: "field lot"
      aggregation_rule: "Sum by substance and compartment"
      quality_evidence: "inputs; method; audit trail"
    - protocol_id: cp_conditioning
      process_id: "primary_conditioning"
      flow_role: "utilities, roots, residues, wastewater"
      record_type: "meter/scale/run log"
      raw_fields: "run/lot; roots; water; energy; tops; soil; wastewater; destinations"
      collection_method: "Meter utilities and weigh material states"
      unit: "kg, L, kWh"
      frequency: "each run"
      temporal_coverage: "all included runs"
      site_scope: "site/run"
      aggregation_rule: "Reconcile solids and water separately"
      quality_evidence: "calibration; run sheet; receipt"
