validation_rules:
  - rule_id: validate_identity
    applies_to: "reference flow"
    rule: "Confirm UUID, 1 kg net mass, fresh unprocessed root state and qualifiers; reject datasets for chicons, leaves, roasted root or extracts."
    source_ids:
      - ucd-witloof-chicory
      - umn-forcing-chicories-2023
  - rule_id: validate_topology
    applies_to: "process graph"
    rule: "Require field, lifting, conditioning and grading hand-offs; washing is conditional and forcing/later processing absent."
    source_ids:
      - umn-forcing-chicories-2023
  - rule_id: validate_route_delta
    applies_to: "alternatives"
    rule: "Require parent process, lot-level route and evidence for changed planting, energy, loss or conditioning records; do not mix mutually exclusive routes within a lot."
    source_ids:
      - umn-forcing-chicories-2023
  - rule_id: validate_nutrients
    applies_to: "field inputs"
    rule: "Require at most one nutrient Product card, bound only to flow-set.agricultural-nutrient-supply@0.3.0; generated exchanges preserve actual products."
    source_ids:
      - omafra-root-chicory
  - rule_id: validate_mass_balance
    applies_to: "hand-offs"
    rule: "Reconcile each input with products, residues/rejects and loss on the same state; investigate unexplained closure."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_reject_routing
    applies_to: "grade/rework"
    rule: "Give every downgraded or rejected state a destination; returned material receives only incremental burden and cannot be accepted until it passes grade."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_run_attribution
    applies_to: "shared operations"
    rule: "Verify lot/run indexing and shares summing to one so cleaning, energy and rework are counted once."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_ranges
    applies_to: "inventory"
    rule: "Require exactly one complete Range per flow card; review values outside it without replacing supported foreground values."
    source_ids:
      - mass-balance-identity
