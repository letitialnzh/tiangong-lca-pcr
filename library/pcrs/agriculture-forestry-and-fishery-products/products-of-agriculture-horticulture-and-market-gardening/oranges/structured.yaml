allocation_rules:
  - rule_id: allocation_accepted_output
    applies_to: "orchard cultivation and harvest"
    rule: "Normalize all inputs and emissions to accepted orange output. Report harvested but rejected fruit separately and do not silently include it in the reference product."
    source_ids:
      - codex-fresh-fruits-vegetables-cxc-53
  - rule_id: allocation_establishment_over_life
    applies_to: "orchard establishment and renewal"
    rule: "Allocate establishment and renewal burdens over the disclosed productive life and accepted yield; disclose the allocation period and replacement events."
    source_ids:
      - fao-good-agricultural-practices
  - rule_id: allocation_co_products
    applies_to: "rejected fruit and secondary routes"
    rule: "If rejected fruit or another co-product has a separately documented market route, apply a documented physical or economic allocation rule and report the chosen basis; otherwise assign the declared destination treatment without claiming a second reference product."
    source_ids:
      - fao-good-agricultural-practices
dataset_production:
  collection_protocols:
    - protocol_id: cp_01323_establishment_records
      process_id: "p01323_orchard_establishment"
      flow_role: "planting, nutrients, residues, land, orchard capacity"
      record_type: "nursery records, planting logs, block maps, renewal records"
      raw_fields: "block; cultivar; rootstock; plant count; product; product mass; nutrient analysis; area; year; residue destination"
      collection_method: "reconcile invoices, field logs, maps, and measured or documented conversions; Raw aggregation and attribution: aggregate by block and allocate over productive life and accepted output"
      unit: "kg, item, kg nutrient, ha year"
      frequency: "each establishment or renewal event"
      temporal_coverage: "full establishment and disclosed allocation period"
      site_scope: "orchard block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed logs, invoices, maps, product analyses"
    - protocol_id: cp_01323_cultivation_records
      process_id: "p01323_orchard_cultivation"
      flow_role: "nutrients, irrigation, fuel, crop protection, residues, emissions"
      record_type: "input invoices, spray logs, meter records, machine records, soil or water balance"
      raw_fields: "block; date; product; quantity; nutrient basis; irrigation volume; fuel; machine hours; treated area; residue mass; emission method"
      collection_method: "monthly or event-level reconciliation to block area and orchard-year output; Raw aggregation and attribution: sum events, preserve product and nutrient bases, normalize to accepted output"
      unit: "kg product, kg nutrient, m3, MJ, kg residue"
      frequency: "each event, aggregated monthly"
      temporal_coverage: "one production year or declared crop cycle"
      site_scope: "orchard block and site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter checks, invoices, spray records, factor documentation, mass balance"
    - protocol_id: cp_01323_harvest_records
      process_id: "p01323_harvest_farm_gate"
      flow_role: "harvest energy, packaging, rejects, emissions, accepted product"
      record_type: "harvest tickets, weighbridge records, packing records, destination records"
      raw_fields: "date; block; harvested mass; accepted mass; reject mass; destination; fuel or energy; package type; package mass; reuse cycles"
      collection_method: "reconcile harvest and destination masses to farm-gate product totals; Raw aggregation and attribution: aggregate lots and preserve separate accepted, rejected, and co-product routes"
      unit: "kg, MJ, kg packaging, item"
      frequency: "each harvest lot"
      temporal_coverage: "full harvest season and declared farm-gate period"
      site_scope: "orchard and handling point"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scales, lot tickets, package issue records, destination receipts"
  calculation_rules:
    - id: calc_accepted_output_normalization
      applies_to: "all quantitative rows"
      rule: "Divide the annual or crop-cycle inventory amount by accepted whole-orange mass at farm gate and report per 1 kg accepted output."
      inputs:
        - "accepted mass"
        - "row amount"
      output: "normalized row value"
      source_ids:
        - mass-balance-identity
    - id: calc_establishment_allocation
      applies_to: "establishment rows"
      rule: "Allocate establishment and renewal amount by declared productive-life years and accepted yield, preserving the disclosed allocation period."
      inputs:
        - "establishment amount"
        - "productive life"
        - "accepted yield"
      output: "allocated orchard-year amount"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_nutrient_basis
      applies_to: "nutrient input rows"
      rule: "Retain product mass and calculate nutrient mass from product analysis and applied product quantity; do not replace the product input with nutrient mass."
      inputs:
        - "product quantity"
        - "product analysis"
      output: "product mass and nutrient mass"
      source_ids:
        - ipcc-2019-refinement-agriculture
    - id: calc_reject_mass_balance
      applies_to: "harvest rejects and product output"
      rule: "Check harvested mass against accepted output, rejects, co-products, and recorded stock change; explain any evidence gap difference."
