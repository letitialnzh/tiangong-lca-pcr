system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The boundary starts with the declared field condition before establishment and ends at farm-gate hand-off of accepted grain. Cultivation hands a standing mature crop to an independent harvest node. Harvest creates whole-plant, branch or mature-pod lots. Drying, threshing, cleaning and grading create prepared grain. Conditional final drying stabilizes grain that has not reached the declared hand-off moisture."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "The crop-cycle model uses single-period attribution: later harvest flushes are batches within the same crop cycle."
      source_ids: []
    - rule_id: boundary_crop_cycle
      applies_to: "Cultivation"
      rule: "Include all attributable operations and inputs from the declared starting condition through maturity, including failed establishment and field loss."
      source_ids:
        - icrisat-pigeonpea-production-1992
    - rule_id: boundary_harvest_routes
      applies_to: "Harvest"
      rule: "Model whole-plant cutting and mature-pod picking separately; index each repeated flush and do not treat standing crop retained for a later flush as harvested output."
      source_ids:
        - icrisat-pigeonpea-production-1992
    - rule_id: boundary_conditioning
      applies_to: "Conditioning"
      rule: "Include field or floor drying, threshing, cleaning, grading and conditional final drying before farm gate; link every loss, reject and rework path to its producing node."
      source_ids:
        - icrisat-pigeonpea-production-1992
    - rule_id: boundary_downstream
      applies_to: "Product transformation"
      rule: "Exclude dehulling, splitting, milling, cooking, canning, retail packing and distribution beyond farm gate."
      source_ids: []
    - rule_id: boundary_soil_emissions
      applies_to: "Managed soil"
      rule: "When N inputs or returned residues occur, include direct and relevant indirect managed-soil N2O pathways under the declared applicable method."
      source_ids:
        - ipcc-managed-soils-2019
