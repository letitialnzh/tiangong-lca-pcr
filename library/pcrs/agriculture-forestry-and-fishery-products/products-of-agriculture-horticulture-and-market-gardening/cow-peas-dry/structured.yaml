system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "field through farm gate"
      rule: "Include establishment, management, every mature-pod picking, pod drying, threshing, winnowing or cleaning, grading, conditional final drying and farm-gate hand-off."
      source_ids:
        - iita-west-africa-cowpea-2018
        - iita-farmers-guide-cowpea-2009
    - rule_id: boundary_harvest_independent
      applies_to: "harvest"
      rule: "Keep harvest separate from field production because it changes the state from standing mature crop to collected pod lots and may comprise several dated pickings; keep conditioning separate because it begins after that hand-off."
      source_ids:
        - iita-farmers-guide-cowpea-2009
    - rule_id: boundary_states
      applies_to: "conditioning and grading"
      rule: "Track pods, loose grain, stabilized grain, accepted grade, downgraded grain, rework and final reject as distinct states with exclusive hand-offs."
      source_ids:
        - iita-west-africa-cowpea-2018
        - fao-cowpea-postharvest
    - rule_id: boundary_storage
      applies_to: "farm-gate endpoint"
      rule: "Use a single-period crop-cycle route with no storage after hand-off. Include only drying or short holding needed to attain the declared hand-off condition; exclude storage and pest-control burdens after hand-off."
      source_ids:
        - fao-grain-drying-storage
    - rule_id: boundary_route_delta
      applies_to: "route variants"
      rule: "For rainfed versus irrigated, manual versus mechanized, single versus multiple picking and passive versus powered drying, collect the changed input, energy, loss, pass and validation records under the named parent process; mutually exclusive alternatives cannot be combined for one lot."
      source_ids:
        - iita-farmers-guide-cowpea-2009
        - iita-west-africa-cowpea-2018
