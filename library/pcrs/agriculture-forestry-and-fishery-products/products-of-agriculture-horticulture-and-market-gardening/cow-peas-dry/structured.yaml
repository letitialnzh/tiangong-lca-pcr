allocation_rules:
  - rule_id: allocation_output_classification
    applies_to: "all output nodes"
    rule: "Classify every output as accepted product, independently intended co-product, residue retained in the system, rework, downgraded product or waste before attribution; a material may occupy only one final state."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_coproduct
    applies_to: "intended haulm, chaff or downgraded grain"
    rule: "When an independently intended output exists, make and disclose a study-specific attribution decision. Prefer a documented physical relation when causality supports it; otherwise disclose economic allocation, prices, period and sensitivity. Residues and wastes receive no automatic credit."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_batch
    applies_to: "fields, pickings, lots and runs"
    rule: "Assign direct records to their field, event or lot. Assign shared cleaning, changeover and run burdens once using measured throughput or another disclosed causal driver; never count the same campaign in each picking."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rework
    applies_to: "returned off-spec material"
    rule: "Retain burdens already carried by returned material, add only incremental rework burdens, and count its mass once at the final accepted, downgraded, recovered or discarded destination."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_records
      process_id: "field_production"
      flow_role: "planting, nutrients, protection, water, energy, land and N activity"
      record_type: "field log, invoice, meter and application record"
      raw_fields: "field; area; dates; product; amount; formulation; nutrient analysis; water; carrier; factor"
      collection_method: "reconcile every application and operation to the field"
      unit: "kg; L; m3; kWh; MJ; ha"
      frequency: "each event"
      temporal_coverage: "crop cycle"
      site_scope: "each field"
      aggregation_rule: "sum by actual product or carrier, then normalize to accepted output"
      quality_evidence: "invoice, calibrated meter, label and field log"
    - protocol_id: cp_field_outputs
      process_id: "field_production"
      flow_role: "mature crop, intended residue and loss"
      record_type: "field sample and mass record"
      raw_fields: "field; area; crop state; fresh mass; dry matter; destination; loss"
      collection_method: "representative sampling plus measured hand-off"
      unit: "kg; %; ha"
      frequency: "field and crop cycle"
      temporal_coverage: "maturity to final picking"
      site_scope: "each field"
      aggregation_rule: "moisture-align exclusive output states"
      quality_evidence: "sampling plan, scale calibration and destination record"
    - protocol_id: cp_harvest_records
      process_id: "harvest_capture"
      flow_role: "pods, residue, loss and energy"
      record_type: "picking ticket, scale, loss sample and machine log"
      raw_fields: "field; picking date; route; inlet state; pod mass; residue; loss; carrier; moisture; destination"
      collection_method: "record each picking and reconcile the linked campaign"
      unit: "kg; %; L; kWh; MJ"
      frequency: "each picking"
      temporal_coverage: "all pickings in crop cycle"
      site_scope: "each field and route"
      aggregation_rule: "sum mutually exclusive outputs over all pickings"
      quality_evidence: "dated ticket, calibrated scale and loss protocol"
    - protocol_id: cp_conditioning_records
      process_id: "primary_conditioning"
      flow_role: "pods, grain, chaff, reject and energy"
      record_type: "lot mass and operation log"
      raw_fields: "lot; pass; inlet and outlet mass; moisture; carrier; duration; reject; co-product; destination"
      collection_method: "weigh every inlet and exclusive outlet for each pass"
      unit: "kg; %; kWh; MJ; h"
      frequency: "each lot and pass"
      temporal_coverage: "pod receipt through initial cleaning"
      site_scope: "each conditioning location"
      aggregation_rule: "reconcile moisture-aligned pass balances without duplicate returns"
      quality_evidence: "calibrated scale, moisture meter and closure sheet"
    - protocol_id: cp_drying_records
      process_id: "final_drying"
      flow_role: "moist grain, stabilized grain, reject, water and energy"
      record_type: "drying lot log and moisture test"
      raw_fields: "lot; pass; inlet and outlet mass; wet-basis moisture; energy; duration; reject; stock change"
      collection_method: "test and weigh before and after every pass"
      unit: "kg; %; kWh; MJ; h"
      frequency: "each lot and pass"
      temporal_coverage: "drying intervention"
      site_scope: "each dryer or drying area"
      aggregation_rule: "calculate dry solids and water balance; link every return"
      quality_evidence: "calibrated meter, scale and pass history"
    - protocol_id: cp_grading_records
      process_id: "grading_handoff"
      flow_role: "accepted, downgraded, rework, reject and energy"
      record_type: "grading ticket, test and run log"
      raw_fields: "lot; run; pass; grade; moisture; foreign matter; insects; broken fraction; each mass; destination; energy"
      collection_method: "weigh and classify every exclusive output state"
      unit: "kg; %; kWh; MJ"
      frequency: "each lot, run and pass"
      temporal_coverage: "grading through farm-gate hand-off"
      site_scope: "each grading location"
      aggregation_rule: "trace returns to origin and count final destinations once"
      quality_evidence: "ticket, test result, scale calibration and destination evidence"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all flows"
      rule: "normalized amount = represented amount × 1,000 / accepted farm-gate grain mass"
      inputs:
        - "represented amount"
        - "accepted mass"
      output: "amount per 1,000 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calc_moisture_balance
      applies_to: "pods and grain"
      rule: "dry solids = wet mass × (1 − wet-basis moisture fraction); water removed equals inlet water minus outlet water after rejects and stock change"
      inputs:
        - "inlet and outlet mass and moisture"
        - reject
        - "stock change"
      output: "aligned dry solids and water removed"
      source_ids:
        - mass-balance-identity
        - fao-grain-drying-storage
    - id: calc_mass_closure
      applies_to: "harvest and post-harvest nodes"
      rule: "moisture-aligned input = mutually exclusive outputs + measured loss or release + stock change, within disclosed uncertainty"
      inputs:
        - "all linked inlet"
        - outlet
        - "loss and stock records"
      output: "node closure and unexplained difference"
      source_ids:
        - mass-balance-identity
    - id: calc_soil_n2o
      applies_to: "managed soils"
      rule: "apply the disclosed IPCC tier to measured synthetic, organic, residue and other nitrogen activity; convert N2O-N to N2O by 44/28"
      inputs:
        - "nitrogen activity and selected factors"
      output: "kg N2O"
      source_ids:
        - ipcc-2019-managed-soils
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product"
      requirement: "Retain species, crop year, class or colour, grade, moisture, foreign matter, insect damage, broken or split fraction and route."
      evidence: "farm-gate ticket and laboratory or calibrated field test"
    - id: dq_traceability
      applies_to: "all processes"
      requirement: "Link each field, picking, lot, run, pass, return and final destination with stable identifiers."
      evidence: "field-to-lot trace and run history"
    - id: dq_completeness
      applies_to: "crop cycle"
      requirement: "Cover all management events, every staggered picking, all conditioning passes, conditional drying, grading, rework and rejects."
      evidence: "event index and completeness reconciliation"
    - id: dq_mass_balance
      applies_to: "material nodes"
      requirement: "Reconcile moisture-aligned inputs, intended outputs, residues, downgraded material, rework, rejects, losses, releases and stock changes."
      evidence: "closure worksheet with explained variance"
    - id: dq_representativeness
      applies_to: "published dataset"
      requirement: "Report geography, season, fields, varieties or market classes, rainfed or irrigated share, picking routes, post-harvest technologies, drying share and aggregation weights."
      evidence: "metadata register and weighted lot index"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Require the stated product, Mass and unit-group UUIDs, 1,000 kg amount and every required qualifier."
    source_ids: []
  - rule_id: validate_route_parent_delta
    applies_to: "route variants"
    rule: "Require a named parent process and current evidence for every changed input, topology, calculation, data or validation requirement; reject mutually exclusive variants reported for the same field-lot."
    source_ids:
      - iita-farmers-guide-cowpea-2009
      - iita-west-africa-cowpea-2018
  - rule_id: validate_picking_completeness
    applies_to: "harvest"
    rule: "For synchronized maturity require one declared picking; for staggered maturity require every dated picking and reconciliation to the field total."
    source_ids:
      - iita-farmers-guide-cowpea-2009
  - rule_id: validate_nutrient_cardinality
    applies_to: "each process"
    rule: "Allow at most one consolidated mineral-fertilizer, organic-fertilizer and nutrient-bearing amendment Product-input card per process; it must bind only to flow-set.agricultural-nutrient-supply version 0.3.0 without a group. Separate N, P, K, manure or amendment cards are prohibited."
    source_ids: []
  - rule_id: validate_output_handoffs
    applies_to: "all output nodes"
    rule: "Require an exclusive hand-off for accepted, intended co-product, residue, downgraded, rework, reject and loss states and an explicit attribution decision for each intended co-product."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_rework
    applies_to: "conditioning, drying and grading"
    rule: "Link every off-spec state to another pass, downgrade, recovery or disposal; retain prior burdens and prevent it from also appearing as accepted output."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_batch_accounting
    applies_to: "fields, pickings, lots and runs"
    rule: "Require production-mode identifiers on inputs, outputs, cleaning and changeover events and assign every shared burden once."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_drying
    applies_to: "final drying"
