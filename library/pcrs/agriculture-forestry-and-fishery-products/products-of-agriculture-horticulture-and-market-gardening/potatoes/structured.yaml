              source_ids:
                - fao-save-and-grow-2011
            ranges: []
        - row_id: operational_energy_input
          role: "Operational energy carriers supplied"
          name: "Operational electricity and fuel carriers"
          flow_type: "product"
          binding: "parameterized"
          flow_set_ref:
            id: "flow-set.energy-supply"
            version: "0.2.0"
          property_unit: "Energy or carrier amount / kWh, MJ, L, or kg as recorded"
          description: "Use one conditional card for electricity and fuels consumed by field operations, irrigation pumping, harvest, dry cleaning, sorting, and farm-gate loading. Foreground generation emits each actual carrier separately and then resolves its electricity, mobile-fuel, or stationary-fuel group and UUID."
          amount:
            expression: "reconcile meter, invoice, tank, machinery, and contractor records to the represented fields and crop cycle"
            value_mode: "calculated_value"
