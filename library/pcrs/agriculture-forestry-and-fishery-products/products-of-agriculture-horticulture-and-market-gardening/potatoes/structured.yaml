system_boundary:
  rules:
    - rule_id: boundary_start_end
      applies_to: "foreground system"
      rule: "Start when planting material and purchased inputs enter the represented crop cycle; end when accepted fresh tubers are dry-cleaned or field-sorted and loaded at the farm gate."
      source_ids:
        - fao-root-tuber-concepts-2003
        - ilcd-handbook-2010
    - rule_id: boundary_input_completeness
      applies_to: "field management"
      rule: "Include actual planting material, nutrient and soil-amendment products, crop-protection products, irrigation supply, and operational energy when used; report zero only from supporting records."
      source_ids:
        - fao-save-and-grow-2011
    - rule_id: boundary_soil_emissions
      applies_to: "managed soil"
      rule: "Include applicable direct and indirect soil emissions caused by nitrogen inputs, crop residues, urea, and liming under one disclosed method; prevent double counting with upstream datasets."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: boundary_land_change
      applies_to: "land transformation"
      rule: "Land-use change is outside the default crop-cycle inventory unless a study rule requires it; if included, disclose method, time horizon, land history, and allocation separately."
      source_ids:
        - ilcd-handbook-2010
    - rule_id: boundary_post_gate
      applies_to: "downstream activities"
      rule: "Exclude transport, storage, washing, packaging, and processing after the farm-gate hand-off unless a distinct extension is declared."
      source_ids:
        - ilcd-handbook-2010
boundary_abstraction:
  declared_starting_condition: "planting tubers and purchased inputs cross the farm production boundary before establishment of the declared crop"
  starting_condition_role: "foreground crop-cycle start"
  product_classification_scope: "CPC 3.0 01510 fresh potatoes; classification is mapping context and does not replace the semantic product boundary"
  recursive_input_rule: "Potato tubers retained or purchased for planting are recorded as a separate planting-material input with seed-grade and origin qualifiers; do not count them as part of the current crop's reference output."
  upstream_dataset_requirement: "use geographically and technologically representative upstream datasets for each concrete planting material, nutrient product, crop-protection product, water supply, and energy carrier"
  disclosure: "declare crop cycle, geography, production system, seed-tuber origin, irrigation condition, field area, yield, residue and reject fate, and any post-harvest extension"
