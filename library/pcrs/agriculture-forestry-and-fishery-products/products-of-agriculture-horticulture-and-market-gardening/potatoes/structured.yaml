          name: "Crop-protection formulations; foreground identity required"
          flow_type: "product"
          property_unit: "Product mass or volume / kg or L product"
          description: "Record each actual formulation used with product identity, active ingredient when known, concentration, application amount, and event. No reviewed Flow Set covers this umbrella concept, and the current search did not support one exact generic UUID."
          amount:
            expression: "sum each actual formulation separately from application records"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "per declared crop cycle and per 1,000 kg accepted potatoes"
              kind: "crop_cycle"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_field_activity_records
              source_ids:
