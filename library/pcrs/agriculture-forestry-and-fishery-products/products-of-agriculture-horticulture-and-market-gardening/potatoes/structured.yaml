          name: "Potatoes; fresh, unprocessed produce; production mix, at farm gate"
          flow_type: "product"
          flow_ref:
            uuid: "65443696-51af-4ba8-8f73-06d434a36605"
          binding: "fixed"
          property_unit: "Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg"
          description: "Record off-grade or small tubers as a separate product output only when they have a documented beneficial destination or sale. Preserve grade, destination, and as-received mass; do not silently include them in the reference amount."
          amount:
