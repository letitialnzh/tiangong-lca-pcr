measurement_rules:
  - id: reference_mass
    applies_to: "reference potatoes"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize all foreground exchanges to 1,000 kg accepted potatoes on the declared as-received basis; do not mix dry-matter and wet-mass bases without a documented conversion."
  - id: area_and_yield
    applies_to: "field activity and yield"
    required_property_ref:
      name: "area and mass"
      uuid: ""
    required_unit: "ha and kg"
    rule: "Use the same harvested area and crop-cycle output to calculate yield and to normalize area-based inputs and emissions."
  - id: nutrient_product_and_content
    applies_to: "nutrient products"
    required_property_ref:
      name: "product mass and declared nutrient content"
      uuid: ""
    required_unit: "kg product and kg N, kg P2O5, kg K2O, or explicitly declared equivalent"
    rule: "Preserve every actual fertilizer or amendment product mass; calculate nutrient contents separately and never replace product identity with nutrient mass."
  - id: energy_carrier_preservation
    applies_to: "electricity and fuels"
    required_property_ref:
      name: "carrier quantity and energy"
      uuid: ""
    required_unit: "kWh, L, kg, or MJ as applicable"
