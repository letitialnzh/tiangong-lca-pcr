            basis:
              text: "per declared crop cycle and per 1,000 kg accepted potatoes"
              kind: "crop_cycle"
            evidence:
              kind: "method_formula"
              collection_protocol_id: cp_soil_emission_activity
              source_ids:
                - ipcc-2019-managed-soils
