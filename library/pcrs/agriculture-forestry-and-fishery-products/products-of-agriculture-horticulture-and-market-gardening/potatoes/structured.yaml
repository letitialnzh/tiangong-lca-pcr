allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "field and farm-gate operations"
    rule: "Prefer subdivision and direct measurement of operations and outputs before applying allocation."
    source_ids:
      - iso-14044-2006
      - ilcd-handbook-2010
  - rule_id: allocation_reference_and_secondary
    applies_to: "accepted and secondary usable potatoes"
    rule: "If both outputs share inseparable burdens, apply economic allocation using contemporaneous farm-gate values; disclose grade, moisture basis, prices, and a mass-allocation sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_and_waste
    applies_to: "retained residues and waste outputs"
    rule: "Do not allocate burdens to material retained or incorporated in the field or sent as waste; include its management and applicable emissions in the foreground."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: allocation_seed_feedback
    applies_to: "farm-retained planting tubers"
    rule: "Record the retained seed-grade tubers as an input to the next crop cycle and an output or internal transfer of the producing cycle; prevent double counting across cycles."
    source_ids:
      - ilcd-handbook-2010
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_activity_records
      process_id: "potato_cultivation_and_farm_gate_preparation"
      flow_role: "planting material, nutrient products, crop protection"
      record_type: "field log, invoice, application record, product label"
      raw_fields: "field_id; crop_cycle; product_identity; amount; unit; nutrient_or_active_content; date; application_method"
      collection_method: "reconcile physical products and application events to each represented field"
      unit: "kg; L; kg nutrient"
      frequency: "each receipt and application"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "retain each product identity, sum matched events, and normalize using same-cycle accepted yield"
      quality_evidence: "invoices; labels; calibrated equipment; field logs"
    - protocol_id: cp_water_and_energy_records
      process_id: "potato_cultivation_and_farm_gate_preparation"
      flow_role: "irrigation water and energy carriers"
      record_type: "meter, delivery, invoice, tank, machinery, or contractor record"
      raw_fields: "field_id; meter_or_equipment_id; carrier; amount; unit; date; operation; shared_use_basis"
      collection_method: "reconcile direct and contractor use to fields and crop cycle"
      unit: "m3; kWh; L; kg; MJ"
      frequency: "each event or meter period"
      temporal_coverage: "complete crop cycle"
      site_scope: "all included equipment and fields"
      aggregation_rule: "retain carriers separately; allocate shared records by documented operating time, area, or measured service"
      quality_evidence: "meter calibration; invoices; tank reconciliation; contractor statement"
    - protocol_id: cp_field_and_harvest_records
      process_id: "potato_cultivation_and_farm_gate_preparation"
      flow_role: "area, accepted potatoes, secondary output, waste, residue fate"
      record_type: "field register, scale ticket, yield monitor, grade record, destination record"
      raw_fields: "field_id; planted_area; harvested_area; harvest_date; gross_tuber_mass; accepted_mass; secondary_mass; waste_mass; residue_fate; destination; moisture_basis"
      collection_method: "reconcile harvested area and all measured outputs to the same crop cycle"
      unit: "ha; kg; percent"
      frequency: "each field and harvest lot"
      temporal_coverage: "complete crop cycle through farm-gate loading"
      site_scope: "all represented fields and lots"
      aggregation_rule: "sum by output class and destination; normalize to 1,000 kg accepted potatoes"
      quality_evidence: "calibrated scales; area records; grade specification; transfer or waste receipt"
    - protocol_id: cp_soil_emission_activity
      process_id: "potato_cultivation_and_farm_gate_preparation"
      flow_role: "managed-soil emissions"
      record_type: "nutrient, residue, soil, weather, irrigation, and model records"
      raw_fields: "fertilizer_N; organic_N; residue_N; urea; lime; soil; climate; drainage; factor_set; model_version"
      collection_method: "calculate each pathway with one declared method from collected activity data"
      unit: "kg N; kg material; kg emission; ha"
      frequency: "each event and crop-cycle calculation"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "calculate per field, area-weight where justified, then normalize by same-cycle accepted yield"
      quality_evidence: "source records; factor provenance; model file; independent unit check"
  calculation_rules:
    - id: calc_area_to_reference_flow
      applies_to: "area-based flows"
      rule: "crop-cycle amount per harvested hectare divided by accepted potato yield per harvested hectare, multiplied by 1,000 kg"
      inputs:
        - amount
        - "harvested area"
        - "accepted mass"
      output: "amount per 1,000 kg accepted potatoes"
      source_ids:
        - fao-root-tuber-concepts-2003
    - id: calc_nutrient_content
      applies_to: "nutrient products"
      rule: "actual product mass multiplied by declared nutrient fraction; preserve whether phosphorus and potassium are elemental or oxide-equivalent"
      inputs:
        - "product identity"
        - "product mass"
        - assay
        - "reporting basis"
      output: "product mass and nutrient mass by product"
      source_ids: []
    - id: calc_energy_carriers
      applies_to: "operational energy"
      rule: "retain actual carrier quantity; apply documented density or lower/heating-value conversion only when required"
      inputs:
        - "carrier identity"
        - quantity
        - unit
        - "conversion factor"
      output: "carrier amount and energy by identity"
      source_ids: []
    - id: calc_managed_soil_n2o
      applies_to: "soil nitrous oxide"
      rule: "apply the selected IPCC tier or geographically applicable method to fertilizer N, organic N, returned-residue N, volatilization, and leaching pathways"
      inputs:
        - "collected nitrogen activity"
        - "residue fate"
        - "soil and climate"
        - "selected factors"
      output: "kg N2O by pathway"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_output_balance
      applies_to: "harvest outputs"
      rule: "gross harvested tuber mass equals accepted reference potatoes plus secondary usable potatoes plus waste and measured handling loss within declared uncertainty"
      inputs:
        - "matched scale and grade records"
      output: "reconciled output classes"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference and secondary outputs"
      requirement: "Confirm potato tubers rather than sweet potatoes or another root crop; retain cultivar, intended use, grade, state, and farm-gate hand-off."
      evidence: "crop, lot, and transfer records"
    - id: dq_temporal_alignment
      applies_to: "all foreground rows"
      requirement: "Inputs, area, harvest output, residue fate, and emissions must refer to the same crop cycle; disclose proxy periods."
      evidence: "dated field, meter, and harvest records"
    - id: dq_mass_area_reconciliation
      applies_to: "field and harvest data"
      requirement: "Reconcile harvested area, gross yield, accepted output, secondary output, waste, and moisture basis before normalization."
      evidence: "area register; calibrated scale or yield monitor; grade and moisture records"
    - id: dq_conditional_cards
      applies_to: "nutrient and energy umbrella cards"
      requirement: "Expand only from actual foreground records; zero, one, or multiple exchanges are valid, but every emitted exchange must carry one exact Flow Set group and UUID."
      evidence: "application, invoice, meter, and identity-resolution records"
    - id: dq_identity_resolution
      applies_to: "unmapped cards"
      requirement: "Resolve planting material, crop-protection formulations, and removed waste to exact verified UUIDs after actual identity and destination are known; do not use broad proxy candidates."
      evidence: "identity review record"
validation_rules:
  - rule_id: validation_reference_output
    applies_to: "terminal product output"
    rule: "Exactly one terminal reference output equals 1,000 kg and uses UUID 65443696-51af-4ba8-8f73-06d434a36605 with the required qualifiers."
    source_ids: []
  - rule_id: validation_crop_cycle
    applies_to: "all inventory rows"
    rule: "Field area, inputs, output, residues, and emissions must describe the same declared crop cycle and geography."
