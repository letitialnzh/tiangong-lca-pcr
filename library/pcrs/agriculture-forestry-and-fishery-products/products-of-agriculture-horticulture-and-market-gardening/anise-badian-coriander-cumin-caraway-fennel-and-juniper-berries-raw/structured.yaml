system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground begins with seed/planting stock and prepared land, a cultivated perennial stand, or a documented managed juniper collection area. Managed production ends at the harvest-ready organ. Harvest is separate because removal and field losses have their own records. Primary conditioning converts collected material to a cleaned lot; stabilization converts a moisture-unstable usable lot to a stable state; grading creates accepted, downgraded, and rejected destinations."
      source_ids: []
    - rule_id: boundary_route_choice
      applies_to: "All lots"
      rule: "Select exactly one production delta for each lot and collect its route-specific inputs and periods. Do not substitute annual and perennial inventories."
      source_ids:
        - icar-rabi-coriander-2021
        - ncsu-common-juniper
    - rule_id: boundary_postharvest
      applies_to: "Farm-gate route"
      rule: "Include harvest/collection, threshing/separation, cleaning, grading, and any drying before the gate. Distinguish accepted, downgraded, rejected, and lost material."
      source_ids:
        - codex-spice-hygiene
        - fssai-star-anise-2023
    - rule_id: boundary_exclusions
      applies_to: "Downstream manufacture"
      rule: "Exclude grinding, blending, extraction, sterilization, and retail packing; meter on-site excluded operations in a separate dataset."
      source_ids:
        - codex-spice-hygiene
    - rule_id: boundary_periods
      applies_to: "Perennial route"
      rule: "Distinguish establishment, immature, productive maintenance, harvest year/cohort, replacement, and termination; link each burden once."
      source_ids:
        - ncsu-common-juniper
