allocation_rules:
  - rule_id: allocation_avoid_first
    applies_to: "All multi-output nodes"
    rule: "Subdivide by species lot, field/stand, crop cycle or harvest year, operation, and batch; directly assign causal burdens."
    source_ids: []
  - rule_id: allocation_co_outputs
    applies_to: "Marketed leaves, stems, straw, planting seed, wood, or downgraded spice"
    rule: "After subdivision, use physical dry mass when outputs have comparable biological function; otherwise use documented economic allocation with contemporaneous prices and a physical-mass sensitivity. Residues without economic function receive no upstream burden, but handling remains included."
    source_ids: []
  - rule_id: allocation_periods
    applies_to: "Perennial stands"
    rule: "Annualize operator-incurred establishment/termination over recorded productive life. Assign annual maintenance and harvest burdens to their year/cohort. Do not invent establishment for naturally established collection stands."
    source_ids:
      - ncsu-common-juniper
  - rule_id: allocation_batches
    applies_to: "Conditioning, drying, grading"
    rule: "Assign metered batch burdens directly; allocate shared cleaning/changeover once by processed mass or run time. Rework retains previous and incremental burdens."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "Rework and rejects"
    rule: "Link each rejected state to exactly one rework, downgrade, recovery, return, or disposal path; never count it as accepted output."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_production
      process_id: "managed_production"
      flow_role: "Establishment, inputs, area, periods, outputs, soil emissions"
      record_type: "Field/stand log, invoice, meter, map, yield ticket"
      raw_fields: "species; organ; route; field/stand; dates; area; origin/age; productive life; input identity/UUID; quantity/composition; output mass/moisture; residue fate"
      collection_method: "Reconcile invoices, logs, mapped area, meters, and weights"
      unit: "Native units plus kg, m3, MJ, ha·year"
      frequency: "Each event and annual close"
      temporal_coverage: "Complete crop cycle or establishment through reporting harvest year"
      site_scope: "Every included field/stand/area"
      aggregation_rule: "Aggregate only identical species, organ, route, geography, period, moisture basis"
      quality_evidence: "Calibrations, invoices, maps, tickets, completeness reconciliation"
    - protocol_id: cp_harvest
      process_id: "harvest_capture"
      flow_role: "Harvest input/output, energy, residue/loss"
      record_type: "Harvest batch log"
      raw_fields: "lot; method; dates; input; collected mass/moisture; energy; residue/loss; destinations"
      collection_method: "Weigh hand-offs and meter/invoice energy"
      unit: "kg, %, MJ"
      frequency: "Each batch"
      temporal_coverage: "Complete harvest window"
      site_scope: "Each source field/stand"
      aggregation_rule: "Batch mass balance"
      quality_evidence: "Scale/moisture checks, machine logs, receipts"
    - protocol_id: cp_conditioning
      process_id: "primary_conditioning"
      flow_role: "Input, cleaned output, service, reject"
      record_type: "Run log"
      raw_fields: "batch; input/output mass/moisture; equipment; energy; water; reject class/path"
      collection_method: "Weigh and meter at run boundary"
      unit: "kg, %, kWh, MJ, m3"
      frequency: "Each run/changeover"
      temporal_coverage: "All included runs"
      site_scope: "Each site/line"
      aggregation_rule: "Batch balance; shared changeover once"
      quality_evidence: "Calibration, reject checks, reconciliation"
    - protocol_id: cp_drying
      process_id: "stabilization_drying"
      flow_role: "Input/output, energy, time, rejects, water loss"
      record_type: "Drying batch log"
      raw_fields: "batch; method; masses; moisture/basis; dates; energy; rejects"
      collection_method: "Weigh/test before and after; meter energy"
      unit: "kg, %, h, MJ"
      frequency: "Each batch"
      temporal_coverage: "Entire drying interval"
      site_scope: "Each drying area/device"
      aggregation_rule: "Dry-matter balance and batch attribution"
      quality_evidence: "Moisture method, calibration, surface protection, reconciliation"
    - protocol_id: cp_grading
      process_id: "grading_sorting"
      flow_role: "Input, grades, downgrade, reject, service"
      record_type: "Grading/dispatch log"
      raw_fields: "batch; identity; criteria; input; each output; moisture; destination; energy/changeover"
      collection_method: "Weigh every state and reconcile dispatch"
      unit: "kg, %, MJ"
      frequency: "Each run/changeover"
      temporal_coverage: "All included runs"
      site_scope: "Each site/line"
      aggregation_rule: "Accepted + downgrade + reject = adjusted input; service once"
      quality_evidence: "Grade inspection, calibration, dispatch/rework receipts"
  calculation_rules:
    - id: calc_moisture_conversion
      applies_to: "Mass conversion"
      rule: "dry matter = wet mass × (1 − wet-basis moisture); target wet mass = dry matter ÷ (1 − target wet-basis moisture)"
      inputs:
        - mass
        - moisture
        - basis
      output: "Comparable mass"
      source_ids: []
    - id: calc_drying_water
      applies_to: "evaporated_water"
      rule: "wet input × input moisture − dried output × output moisture; investigate negative results"
      inputs:
        - "input/output mass and wet-basis moisture"
      output: "kg water"
      source_ids: []
    - id: calc_land
      applies_to: "Land occupation"
      rule: "hectares × occupied days ÷ 365.25; normalize by output"
      inputs:
        - area
        - dates
        - output
      output: "ha·year/1,000 kg"
      source_ids: []
    - id: calc_soil_n2o
      applies_to: "Managed-soil N2O"
      rule: "Apply IPCC managed-soil equations to recorded synthetic/organic N and residue N; convert N2O-N to N2O by 44/28"
      inputs:
        - "N inputs"
        - "residue N"
        - factors
      output: "kg N2O"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_perennial
      applies_to: "Perennial periods"
      rule: "attributable establishment + termination burden divided by recorded productive life; reflect documented area changes"
      inputs:
        - "period inventories"
        - "productive years/area"
      output: "Annualized burden"
      source_ids: []
    - id: calc_allocation
      applies_to: "Multi-output nodes"
      rule: "Direct assignment first, then declared physical dry-mass or economic allocation; shares sum to 1"
      inputs:
        - "masses/moisture or prices"
        - "shared burden"
      output: "Burden by output"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Product states"
      requirement: "Species and organ mandatory; retain route, geography, year, grade, moisture/basis, and drying status."
      evidence: "Traceable lot records"
    - id: dq_temporal
      applies_to: "Production"
      requirement: "Cover full cycle/year; perennial records include establishment, productive life, replacement, termination, age/origin, and cohort links."
      evidence: "Dated field/stand records"
    - id: dq_completeness
      applies_to: "All nodes"
      requirement: "Include every actual nutrient product, water, energy, output, rework, reject, residue, and hand-off; reconcile mass."
      evidence: "Invoice/meter and mass balance"
    - id: dq_measurement
      applies_to: "Mass, moisture, area, energy"
      requirement: "Use calibrated instruments or documented estimates; state moisture method/basis."
      evidence: "Calibration/test/map/worksheet"
    - id: dq_aggregation
      applies_to: "Combined records"
      requirement: "Combine only identical species, organ, route, geography, period, and moisture basis; disclose included coverage."
      evidence: "Sampling frame and coverage calculation"
validation_rules:
  - rule_id: validate_identity
    applies_to: "Reference flow"
    rule: "Fail if species, crop, organ, route, geography, harvest year, grade, moisture/basis, or drying status is missing, or unrelated species are averaged without separate datasets and mass shares."
    source_ids: []
  - rule_id: validate_route
    applies_to: "Graph"
    rule: "Require one production delta per lot and matching period/input records; annual and perennial routes coexist only as traceable lots."
    source_ids:
      - icar-rabi-coriander-2021
      - ncsu-common-juniper
  - rule_id: validate_nodes
    applies_to: "Graph"
    rule: "Require production, harvest, conditioning, and grading; require drying when moisture reduction occurs. Every node declares states and hand-offs."
    source_ids:
      - codex-spice-hygiene
  - rule_id: validate_mass
    applies_to: "Harvest through grading"
    rule: "Batch input equals accepted + downgraded + rejects + measured moisture loss ± inventory change within 5%; otherwise investigate/disclose."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "Inventory"
    rule: "Every quantitative card has role, bounds, unit, denominator, basis kind, evidence kind, and sources when external. Outliers require explanation; reasoned ranges are screens, not limits."
    source_ids: []
  - rule_id: validate_nutrients
    applies_to: "Production"
    rule: "Allow at most one nutrient Product-input card per process, bound only to flow-set.agricultural-nutrient-supply@0.3.0; prohibit group binding. Resolve every actual product UUID during foreground generation."
    source_ids: []
  - rule_id: validate_outputs
    applies_to: "Multi-output nodes"
    rule: "Enumerate intended outputs/hand-offs, residue/waste, allocation precedence, and shares summing to 1; prevent duplicate hand-offs."
    source_ids: []
  - rule_id: validate_periods
    applies_to: "Perennial route"
    rule: "Require period and replacement/termination decisions and reject duplicated establishment or maintenance burdens."
    source_ids:
      - ncsu-common-juniper
  - rule_id: validate_rework
    applies_to: "Post-harvest"
    rule: "Route every off-spec state exactly once; accepted output excludes unresolved rejects; rework retains prior burdens."
    source_ids: []
  - rule_id: validate_star_anise
    applies_to: "Star anise claiming cited specification"
    rule: "Verify moisture ≤10% dry basis, extraneous matter ≤1%, stalks ≤3%, broken/abnormal fruit ≤25%; do not apply to other species."
    source_ids:
      - fssai-star-anise-2023
published_dataset_profile:
  dataset_role: "Species-, organ-, route-, geography-, and period-specific foreground farm-gate production dataset"
  downstream_use: "secondary_dataset; background_dataset after representativeness and uncertainty review"
  allowed_use: "LCA of a whole raw spice lot matching identity, route, gate, moisture, geography, and period"
  excluded_use: "Mixed-spice average; leaf herb; ground/blended spice; oil/oleoresin; sterilized/retail product; annual-perennial substitution without scenario modelling"
  required_metadata: "Reference qualifiers; field/stand and period; stand origin/age/life; graph; input identities/UUIDs; allocation; mass/moisture balances; grades/destinations; coverage"
  required_quality_disclosure: "Foreground/secondary shares, measurement/estimation, range exceptions, missing UUIDs, representativeness, perennial annualization, allocation sensitivity, reject/rework treatment"
  update_trigger: "Change in species/organ, route, geography, technology, drying, productive life, yield, inputs, allocation, quality specification, reference UUID, or evidence"
