system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary runs from the declared tree-and-forest starting condition through perennial tree management, harvest and collection, and the fresh farm-gate hand-off of accepted brazil-nuts in shell. Capsule opening that leaves each seed hard shell intact is required before every in-shell reference gate. Include further cleaning, grading and storage only when they occur before the declared gate. Upstream production of planting material, fertilizers, crop-protection products, supplied irrigation water, energy carriers, machinery services, and packaging uses representative background datasets. Shell removal, splitting, kernel processing, oil extraction, roasted or otherwise processed brazil-nut products, retail, post-gate transport, and post-gate storage are outside the default boundary."
      source_ids: []
    - rule_id: boundary_tree_to_farm_gate
      applies_to: "all conforming datasets"
      rule: "Include perennial tree establishment, immature years, productive management, harvest, collection, and the declared fresh farm-gate hand-off of accepted brazil-nuts in shell."
      source_ids:
        - fao-brazil-nut-fruit-structure
        - iso-14044-2006
    - rule_id: boundary_dehusking_extension
      applies_to: "extended post-harvest route"
      rule: "Include woody-capsule opening before the in-shell reference hand-off. Include cleaning, grading and storage only when actually performed before the declared gate; disclose the resulting physical state."
      source_ids:
        - fao-brazil-nut-fruit-structure
        - codex-tree-nuts-hygiene-cxc-6-1972
    - rule_id: boundary_perennial_tree_disclosure
      applies_to: "establishment and replacement"
      rule: "Allocate establishment, immature years, replacement trees, and removal over the declared tree life and accepted-output basis; disclose life, non-bearing years, intercropping, and replacement events."
      source_ids:
        - fao-brazil-nut-fruit-structure
        - iso-14044-2006
    - rule_id: boundary_no_shell_removal
      applies_to: "in-shell product"
      rule: "Retain the hard shell in the product boundary. Exclude hatcheting or shell removal, splitting, kernel processing, oil extraction, roasted or otherwise processed brazil-nut products, and shell processing."
      source_ids:
        - codex-tree-nuts-hygiene-cxc-6-1972
        - fao-brazil-nut-fruit-structure
    - rule_id: boundary_quality_and_fate
      applies_to: "all outputs"
      rule: "Separate accepted in-shell brazil-nuts, pod, downgraded lots, rejected fruit, foreign material, dust, water loss, storage loss, and unexplained loss by measured mass and declared fate."
      source_ids:
        - fao-brazil-nut-fruit-structure
        - mass-balance-identity
boundary_abstraction:
  declared_starting_condition: "tree-and-forest site before or at establishment, with planting material and purchased management inputs crossing the foreground boundary; prior land use and existing tree history are disclosed"
  starting_condition_role: "start of managed perennial brazil-nut production and tree-asset accounting"
  product_classification_scope: "CPC 3.0 01377, Brazil nuts, in shell; shelled, split, kernel, oil, shell, and downstream processed brazil-nut products are outside this PCR"
  recursive_input_rule: "Same-category planting material or retained brazil-nuts crossing the boundary are recorded as upstream inputs and are not recursively expanded into another in-shell product output. Internal hand-offs between forest, harvest, conditioning, grading, and storage are process links and are not additional market outputs."
  upstream_dataset_requirement: "Use representative upstream datasets for nursery material, nutrient products, crop protection, irrigation supply, fuel, electricity, pod opening or grading services, packaging, machinery services, and waste treatment when these inputs cross the boundary."
  disclosure: "cultivar and tree block; geography, soil, climate, and land history; establishment year, tree age, productive life, and replacement; irrigation source and quality; nutrient and crop-protection records; harvest maturity; in-shell seed state after woody-capsule opening; moisture or freshness; shell quality; grade, reject, pod, and storage records; gate; and any intended pod co-product hand-off"
