allocation_rules:
  - rule_id: allocation_01
    applies_to: "tree management and harvest with an intended pod output"
    rule: "Prefer process subdivision when tree, harvest, pod opening, pod collection, and nut records are independently available. When pod is deliberately collected and transferred as an intended co-product, allocate shared burdens by measured dry-matter mass; if dry-matter data are unavailable, use measured as-received mass and disclose the limitation."
    source_ids:
      - iso-14044-2006
      - fao-brazil-nut-fruit-structure
  - rule_id: allocation_02
    applies_to: "pod retained on site or discarded"
    rule: "If pod remains on the field, is composted without an intended product hand-off, or is discarded as residue, do not assign a co-product credit. Retain its mass and fate as residue or waste and assign shared burden to the intended in-shell brazil-nut output."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_03
    applies_to: "premium, standard, and downgraded in-shell grades"
    rule: "Use physical mass allocation between mutually exclusive accepted grade outputs when common conditioning burdens cannot be subdivided. Grade-specific operations remain with the grade receiving them; do not allocate the same lot to both a grade row and an aggregate output row."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_04
    applies_to: "perennial tree periods and phases"
    rule: "Annualize establishment, immature years, replacement, intercropping attribution, and removal over the declared tree life and accepted output basis. Link every input and output to a crop year or lifecycle phase; do not count a replacement event in both the original and replacement tree phases."
    source_ids:
      - fao-brazil-nut-fruit-structure
      - iso-14044-2006
  - rule_id: allocation_05
    applies_to: "downgraded, reworked, rejected, and recovered lots"
    rule: "Keep rejected and downgraded lots separate from accepted product. Rework retains the producing-node burden and is linked once; recovered or intentionally marketed material requires a declared destination and allocation decision; discarded material receives its declared treatment burden."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: allocation_06
    applies_to: "batch, campaign, and changeover attribution"
    rule: "Link tree, harvest, conditioning, pod opening, grading, and storage inputs and outputs to the batch or campaign that generated them. Record cleaning and changeover events once and do not allocate shared-run burdens to more than one batch without a documented driver."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: allocation_rule_7
    applies_to: "foreground_burden_allocation"
    rule: "The hard shell remains part of the in-shell reference product and is not a separate co-product in this PCR. Kernel, oil, and shell-removal outputs belong to downstream brazil-nut-product PCRs and must not be introduced into this inventory. No output may be counted both as a marketed pod co-product and as forest or conditioning residue."
    source_ids: []
