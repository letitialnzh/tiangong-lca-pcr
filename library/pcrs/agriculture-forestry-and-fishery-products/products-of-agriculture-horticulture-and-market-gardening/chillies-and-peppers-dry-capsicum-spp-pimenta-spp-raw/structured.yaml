allocation_rules:
  - rule_id: allocation_primary
    applies_to: "crop and drying lots"
    rule: "Attribute measured operations to botanical route, site, season and batch first; normalize all burdens to net accepted whole dried output."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_offgrade
    applies_to: "downgraded fruit"
    rule: "Keep off-grade but marketable fruit distinct. Prefer subdivision by grade; if a genuine co-product cannot be subdivided, document the chosen physical or economic allocation and prices/quantities."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rework
    applies_to: "re-dried or resorted fruit"
    rule: "Link rework energy and losses to the original batch; count the accepted mass only at final exit and never double count shared-run or changeover burdens."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_residue
    applies_to: "stems, rejects, residues"
    rule: "Record fate and any recovery credit explicitly; do not assign product burden or avoided burden by default."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Annual Capsicum and perennial Pimenta output years cannot share an undeclared denominator. For Pimenta, document bearing years and any establishment or shared orchard burden attribution. A batch dryer must record run-level input, output, cleaning and changeover; continuous drying must record period mass balance and stable operating window."
    source_ids: []
