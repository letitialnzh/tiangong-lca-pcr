      rule: "incoming dry matter = incoming mass × (1 − incoming wet-basis moisture); reconcile with all dried solids and losses"
      inputs:
        - "masses and moisture tests"
      output: "dry-matter balance"
      source_ids:
        - mass-balance-identity
    - id: calc_water_removed
      applies_to: "drying lot"
      rule: "incoming water − water retained in all dry outputs − separately measured liquid exits, adjusted for added water"
      inputs:
        - "masses and moisture tests"
      output: "water removed, kg"
      source_ids:
        - mass-balance-identity
    - id: calc_normalize
      applies_to: "complete package"
      rule: "divide attributed input/emission by net accepted dried kg at the declared gate"
      inputs:
        - "attributed totals and accepted mass"
      output: "inventory per kg"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all lots"
      requirement: "Botanical identity, whole raw form and route must be traceable to each accepted output."
      evidence: "source lot and grade records"
    - id: dq_moisture
      applies_to: "drying"
