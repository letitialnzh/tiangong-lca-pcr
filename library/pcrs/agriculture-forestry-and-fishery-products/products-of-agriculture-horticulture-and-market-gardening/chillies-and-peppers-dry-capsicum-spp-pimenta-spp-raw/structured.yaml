      frequency: "each lot"
      temporal_coverage: "full harvest"
      site_scope: "each source field"
      aggregation_rule: "sum measured lots; retain losses"
      quality_evidence: "tare and scale checks"
    - protocol_id: cp_drying_lot
      process_id: "primary_drying"
      flow_role: "drying mass and energy"
      record_type: "drying run log"
      raw_fields: "lot; start/end; input/output mass and moisture; route; fuel; electricity; rejects; rework"
      collection_method: "calibrated scale, moisture test and meter"
      unit: "kg; %; kWh; MJ"
      frequency: "each run or continuous period"
      temporal_coverage: "all declared drying"
      site_scope: "each dryer"
      aggregation_rule: "dry-matter and water balance by lot"
      quality_evidence: "calibration, moisture method and run linkage"
    - protocol_id: cp_grade_records
