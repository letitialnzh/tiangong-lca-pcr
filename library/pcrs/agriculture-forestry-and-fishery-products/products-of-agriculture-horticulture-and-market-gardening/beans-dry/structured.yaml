      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Report net accepted grain mass at the declared moisture basis; exclude packaging, foreign material removed before hand-off, and separately routed rejects."
  - id: moisture_basis
    applies_to: "every grain-state mass"
    required_property_ref:
      name: "Mass and moisture content"
      uuid: ""
    required_unit: "kg and % wet basis"
    rule: "Record measured moisture with each relevant lot mass. A dry-matter conversion shall use dry matter = wet mass × (1 − moisture fraction), and conversion to a declared target moisture shall conserve dry matter."
  - id: nutrient_products
    applies_to: "mineral fertilizer, organic fertilizer, and nutrient-bearing amendment inputs"
    required_property_ref:
