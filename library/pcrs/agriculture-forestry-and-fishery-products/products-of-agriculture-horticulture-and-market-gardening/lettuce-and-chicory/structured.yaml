allocation_rules:
  - rule_id: allocation_cycle_inputs
    applies_to: "crop establishment and management"
    rule: "Allocate cycle inputs and direct emissions to marketable output from the same field or protected unit and declared cycle; disclose failed area, reseeding, and multi-harvest treatment."
    source_ids:
      - fao-vegetable-production-guidance
  - rule_id: allocation_marketable_and_rejects
    applies_to: "harvest and handling"
    rule: "Reconcile harvest-ready input to marketable output, rejects, trims, and measured mass change; treat rejects as waste unless a documented product specification, buyer, quantity, and destination establish a co-product."
    source_ids:
      - usda-leafy-greens-guidance
  - rule_id: allocation_secondary_output
    applies_to: "intentional secondary products"
    rule: "For a documented secondary product, report quantity and hand-off and apply a justified allocation or substitution method; no default avoided burden or economic allocation is assumed."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "crop_establishment"
      flow_role: "planting material, area, establishment nutrients, and losses"
      record_type: "seed or transplant purchase, planting, field map, and acceptance records"
      raw_fields: "field_or_unit_id; crop_type; cultivar; date; material_type; quantity; treated_area; accepted_area; failed_area; nutrient_product; product_mass; nutrient_concentration; loss_mass; loss_destination"
      collection_method: "reconcile planting and establishment records to each field or protected unit; Raw aggregation and attribution: sum by crop cycle and preserve failures and reseeding"
      unit: "seed; plant; kg; ha"
      frequency: "each establishment event"
      temporal_coverage: "complete establishment window"
      site_scope: "every represented field or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier invoices, labels, field maps, and acceptance records"
    - protocol_id: cp_crop_management_records
      process_id: "crop_management"
      flow_role: "nutrients, irrigation, electricity, crop protection, withdrawal, residue, and emissions activity"
      record_type: "application, meter, irrigation, crop-protection, and field log records"
      raw_fields: "field_or_unit_id; crop_type; cycle_id; area; date; product_identity; product_mass; nutrient_concentration; irrigation_volume; source_withdrawal; electricity; active_substance; treated_area; residue_mass; dry_matter; residue_destination; drainage; nitrate; method_version"
      collection_method: "reconcile all activity records to the same cycle and route; Raw aggregation and attribution: sum by field or unit cycle before output normalization"
      unit: "kg; kg nutrient; m3; kWh; ha"
      frequency: "each event and cycle close"
      temporal_coverage: "full crop cycle"
      site_scope: "every represented field or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, labels, meters, application logs, analyses, and method records"
    - protocol_id: cp_harvest_records
      process_id: "harvest_and_gate_handling"
      flow_role: "harvest-ready produce and harvest loss"
      record_type: "harvest ticket, lot log, and scale record"
      raw_fields: "field_or_unit_id; cycle_id; lot_id; harvest_date; harvest_pass; gross_mass; field_loss; crop_type; grade; size; trim_state"
      collection_method: "link each harvest lot to its field or protected unit and cycle; Raw aggregation and attribution: sum by cycle and preserve crop type and grade"
      unit: "kg; ha"
      frequency: "each harvest lot"
      temporal_coverage: "complete harvest campaign"
      site_scope: "every represented field or handling line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scales and harvest tickets"
    - protocol_id: cp_handling_records
      process_id: "harvest_and_gate_handling"
      flow_role: "water, packaging, output, wastewater, rejects, and trims"
      record_type: "lot, scale, water-meter, packaging, wastewater, and destination records"
      raw_fields: "lot_id; source_field_or_unit; crop_type; wash_water; cooling_water; packaging_material; packaging_mass; container_turns; marketable_mass; grade; trim_state; reject_mass; reject_reason; destination; wastewater_volume; gate_time"
      collection_method: "preserve lot-level mass and utility reconciliation through the declared gate; Raw aggregation and attribution: reconcile input, product, wastewater, rejects, trims, and packaging before aggregation"
      unit: "kg; m3; kWh; item"
      frequency: "each lot or shift"
      temporal_coverage: "complete harvest and packing period"
      site_scope: "every represented handling line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scales, meters, grade inspection, and destination receipts"
  calculation_rules:
    - id: calc_nutrient_equivalent
      applies_to: "fertilizer inputs"
      rule: "Product mass multiplied by documented nutrient fraction equals kg N, P2O5, or K2O on the declared basis."
      inputs:
        - "product mass"
        - "nutrient concentration"
      output: "nutrient-equivalent input"
      source_ids: []
    - id: calc_cycle_normalization
      applies_to: "crop-cycle inputs and emissions"
      rule: "Divide complete field or protected-unit cycle quantities by marketable output from the corresponding cycle, then express the result per 1,000 kg reference product."
      inputs:
        - "cycle quantity"
        - "marketable output"
      output: "normalized inventory amount"
      source_ids: []
    - id: calc_water_and_withdrawal
      applies_to: "irrigation"
      rule: "Preserve delivered irrigation and source withdrawal as separate quantities; reconcile them where measured and disclose unmeasured losses."
      inputs:
        - "delivery meter"
        - "source meter"
        - "return or loss record"
      output: "irrigation input and withdrawal"
      source_ids:
        - fao-vegetable-production-guidance
    - id: calc_harvest_mass_balance
      applies_to: "harvest and gate handling"
      rule: "Gross harvest plus measured mass change equals marketable output plus rejects, trims, wastewater-associated losses, and other declared outputs."
      inputs:
        - "gross mass"
        - "marketable mass"
        - rejects
        - trims
        - water
        - "mass change"
      output: "reconciled output quantities"
      source_ids:
        - usda-leafy-greens-guidance
    - id: calc_managed_soil_emissions
      applies_to: "nitrogen emissions"
      rule: "Apply the declared IPCC or accepted regional equations to nitrogen activity and preserve N2O-N to N2O conversion without double counting."
      inputs:
        - "nitrogen activity"
        - factors
        - "soil or growing-medium qualifiers"
      output: "direct and indirect nitrogen emissions"
      source_ids:
        - ipcc-2019-managed-soils
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Preserve lettuce or chicory identity, cultivar or market type, head or leaf state, grade, trim, wash state, packaging, geography, cycle, and gate."
      evidence: "product specification, lot records, and gate declaration"
    - id: dq_cycle_linkage
      applies_to: "establishment and management"
      requirement: "Link every activity to one field or protected unit and cycle and disclose reseeding, failed area, multiple harvests, and route changes."
      evidence: "field map, cycle register, and production history"
    - id: dq_input_completeness
      applies_to: "all foreground inputs"
      requirement: "Preserve nutrient basis, irrigation source, energy coverage, crop-protection identity, packaging material, and residue or reject destination."
      evidence: "invoices, labels, meters, application logs, and destination receipts"
    - id: dq_mass_balance
      applies_to: "harvest and handling"
      requirement: "Reconcile harvest-ready input, marketable output, rejects, trims, wastewater, and measured mass change within declared uncertainty."
      evidence: "calibrated scales, meters, and lot reconciliation"
    - id: dq_method_transparency
      applies_to: "calculations and emissions"
      requirement: "Record method version, factors, normalization denominator, exclusions, provisional ranges, and replacement of estimates with reviewed evidence."
      evidence: "calculation file and review record"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference product"
    rule: "Resolve a compatible lettuce or chicory identity, mass property, mass unit group, kg, and all required qualifiers before publishing a final process dataset."
    source_ids: []
  - rule_id: validation_cycle_handoffs
    applies_to: "process map"
    rule: "Link establishment to crop management and management to harvest handling for every represented field or protected unit and cycle."
    source_ids: []
  - rule_id: validation_mass_balance
    applies_to: "harvest and handling"
    rule: "Reconcile harvest-ready input, marketable output, rejects, trims, wastewater, and other declared losses."
    source_ids: []
  - rule_id: validation_nutrient_and_emission_basis
    applies_to: "management inputs and emissions"
    rule: "Keep N, P2O5, and K2O distinct, document emission factors and receiving pathways, and prevent returned-residue nitrogen double counting."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validation_parameterized_flows
    applies_to: "parameterized rows"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validation_unmapped_flows
    applies_to: "unmapped rows"
    rule: "Seed or transplant material, crop-protection products, internal crop states, rejects, and any evidence gap reference identity remain explicit coverage requirements until compatible identities are supplied."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground agricultural production dataset for fresh lettuce and chicory at the declared gate"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "Fresh lettuce or chicory crop and supply-chain studies with compatible crop identity, geography, route, cycle, product state, and gate"
  excluded_use: "Seed or transplant production, processed products, post-gate distribution, or comparisons that omit declared route and crop-cycle conditions"
  required_metadata: "crop identity; cultivar or market type; geography; area; route; cycle dates; field or protected unit; irrigation; nutrient basis; crop protection; harvest and grade; wash or cooling; packaging; residue and reject fate; gate"
  required_quality_disclosure: "primary-data coverage; scale and meter quality; cycle linkage; mass balance; method and factor versions; data gaps; provisional ranges; concrete flow identity verification; unmapped identities"
  update_trigger: "verified product or flow identity, reviewed yield or input evidence, crop route or product specification change, emission-method change, or revised gate practice"
data_sources:
  - id: "fao-vegetable-production-guidance"
    type: "official_guidance"
    reference: "FAO, Good Agricultural Practices for greenhouse and field vegetable production, https://www.fao.org"
    used_for: "crop-cycle boundary, field records, residue handling, and vegetable production route"
  - id: "usda-leafy-greens-guidance"
    type: "official_guidance"
    reference: "U.S. FDA, Guidance for Industry: Guide to Minimize Microbial Food Safety Hazards of Fresh-cut Fruits and Vegetables, https://www.fda.gov"
    used_for: "fresh leafy-produce handling, grading, washing, and declared gate controls"
  - id: "ipcc-2019-managed-soils"
    type: "official_guidance"
    reference: "IPCC, 2019 Refinement to the 2006 IPCC Guidelines, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/vol4.html"
    used_for: "managed-soil nitrogen emission method and N2O conversion"
