  calculation_rules:
    - id: calc_field_normalization
      applies_to: "field flows"
      rule: "field flow / accepted seed-cotton mass × seed-cotton need per 1,000 kg cottonseed"
      inputs:
        - "field flow"
        - area
        - yield
        - "gin balance"
      output: "normalized field flow"
      source_ids: []
    - id: calc_gin_balance
      applies_to: "gin lot"
      rule: "input = lint + cottonseed + recovered outputs + waste + moisture reconciliation"
      inputs:
        - "matched mass/moisture"
      output: "reconciled yield"
      source_ids:
        - cotton-ginners-handbook-2016
    - id: calc_storage_balance
      applies_to: "storage"
      rule: "incoming dry matter = accepted + rejected/lost dry matter ± justified uncertainty"
      inputs:
        - "mass and moisture"
      output: "accepted seed/loss"
      source_ids:
        - cottonseed-storage-2018
    - id: calc_economic_allocation
      applies_to: "co-products"
      rule: "share_i = quantity_i × price_i / sum(quantity × price)"
      inputs:
        - quantities
        - grades
        - prices
      output: "burden shares"
      source_ids: []
    - id: calc_shared_services
      applies_to: "shared assets"
      rule: "total service × documented causal share, counted once"
      inputs:
        - "total and driver"
      output: "node/lot amount"
      source_ids: []
