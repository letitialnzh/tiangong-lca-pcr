allocation_rules:
  - rule_id: allocation_gin_coproducts
    applies_to: "cultivation and ginning"
    rule: "Treat lint and cottonseed as intended co-products. Subdivide metered process burdens first; allocate remaining inseparable burdens by economic value using matched quantities and representative prices."
    source_ids:
      - cottonseed-storage-2018
  - rule_id: allocation_sensitivity
    applies_to: "lint/cottonseed"
    rule: "Report mass-allocation sensitivity and prices, currency, period, moisture, grades and value shares; no default substitution credit."
    source_ids: []
  - rule_id: allocation_residuals
    applies_to: "gin/storage outputs"
    rule: "Give no co-product credit to waste. Treat recovered material as product only with intended use, positive value and separate hand-off."
    source_ids: []
  - rule_id: allocation_shared_assets
    applies_to: "shared infrastructure"
    rule: "Attribute by measured use, runtime, throughput or another causal driver and count each burden once."
    source_ids: []
  - rule_id: allocation_rework_rejects
    applies_to: "rejects"
    rule: "Return rework to its node; downgraded saleable output remains product and discarded material remains waste."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_activity
      process_id: "cotton_field_production"
      flow_role: "inputs"
      record_type: "collected"
      raw_fields: "field; area; cultivar; dates; product; assay; amount; meter; carrier"
      collection_method: "invoices, logs and meters; Raw aggregation and attribution: sum by field and identity"
      unit: "ha; kg; L; m3; kWh; MJ"
      frequency: "each event"
      temporal_coverage: "full crop cycle"
      site_scope: "each field/farm"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, calibration, logs, field map"
    - protocol_id: cp_harvest_balance
      process_id: "cotton_field_production"
      flow_role: "seed cotton/residues"
      record_type: "collected/calculated"
      raw_fields: "field; mass; module; moisture; trash; reject; residue; fate"
      collection_method: "scales, tickets, samples, balance; Raw aggregation and attribution: sum accepted lot; separate fate"
      unit: "kg; %"
      frequency: "each harvest/lot"
      temporal_coverage: "full harvest"
      site_scope: "each field/harvest unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale checks, tickets, samples"
    - protocol_id: cp_field_emissions
      process_id: "cotton_field_production"
      flow_role: "soil emissions"
      record_type: "calculated"
      raw_fields: "N products; assay; timing; residues; soil; climate; irrigation; factors"
      collection_method: "approved method on matched records; Raw aggregation and attribution: calculate pathways then sum"
      unit: "kg"
      frequency: "crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "input trace, factors, worksheet"
    - protocol_id: cp_gin_lot_balance
      process_id: "cotton_ginning"
      flow_role: "input/outputs/residuals"
      record_type: "collected/calculated"
      raw_fields: "lot; origin; input/output mass/moisture/grade; reject; destination"
      collection_method: "scales, sampling, reconciliation; Raw aggregation and attribution: reconcile lot then aggregate"
      unit: "kg; %; item"
      frequency: "each lot/shift"
      temporal_coverage: "full campaign"
      site_scope: "each gin line/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, tickets, grade, balance"
    - protocol_id: cp_gin_utility
      process_id: "cotton_ginning"
      flow_role: "energy/water"
      record_type: "collected/calculated"
      raw_fields: "meter; purchase; runtime; power; water; period"
      collection_method: "meters, invoices, runtime; Raw aggregation and attribution: allocate shared total once"
      unit: "kWh; MJ; kg; L; m3"
      frequency: "shift/bill"
      temporal_coverage: "full campaign"
      site_scope: "each gin/meter"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, invoice, log"
    - protocol_id: cp_gin_emissions
      process_id: "cotton_ginning"
      flow_role: "particulate"
      record_type: "measured/calculated"
      raw_fields: "source; control; fraction; concentration; flow; runtime; factor"
      collection_method: "test or approved permit method; Raw aggregation and attribution: calculate by source/fraction without overlap"
      unit: "kg; mg/m3; m3; h"
      frequency: "test/period"
      temporal_coverage: "representative campaign"
      site_scope: "each source"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "report, permit, controls, runtime"
    - protocol_id: cp_storage_lot
      process_id: "cottonseed_handling_storage"
      flow_role: "cottonseed/energy/package/loss"
      record_type: "collected/calculated"
      raw_fields: "lot; mass; moisture; temperature; foreign matter; duration; runtime; package; reject"
      collection_method: "scales, probes, meters, logs; Raw aggregation and attribution: reconcile input, accepted, reject, moisture"
      unit: "kg; %; C; h; kWh; item"
      frequency: "receipt/daily/dispatch"
      temporal_coverage: "full storage period"
      site_scope: "each bin/pile/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, monitoring, inspection, ticket"
  calculation_rules:
    - id: calc_field_normalization
      applies_to: "field flows"
      rule: "field flow / accepted seed-cotton mass × seed-cotton need per 1,000 kg cottonseed"
      inputs:
        - "field flow"
        - area
        - yield
        - "gin balance"
      output: "normalized field flow"
      source_ids: []
    - id: calc_gin_balance
      applies_to: "gin lot"
      rule: "input = lint + cottonseed + recovered outputs + waste + moisture reconciliation"
      inputs:
        - "matched mass/moisture"
      output: "reconciled yield"
      source_ids:
        - cotton-ginners-handbook-2016
    - id: calc_storage_balance
      applies_to: "storage"
      rule: "incoming dry matter = accepted + rejected/lost dry matter ± justified uncertainty"
      inputs:
        - "mass and moisture"
      output: "accepted seed/loss"
      source_ids:
        - cottonseed-storage-2018
    - id: calc_economic_allocation
      applies_to: "co-products"
      rule: "share_i = quantity_i × price_i / sum(quantity × price)"
      inputs:
        - quantities
        - grades
        - prices
      output: "burden shares"
      source_ids: []
    - id: calc_shared_services
      applies_to: "shared assets"
      rule: "total service × documented causal share, counted once"
      inputs:
        - "total and driver"
      output: "node/lot amount"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference"
      requirement: "Prove non-planting, whole/fuzzy state, cultivar, crop year, moisture, foreign matter, grade, storage and gate."
      evidence: "specification, lot ticket, inspection"
    - id: dq_traceability
      applies_to: "chain"
      requirement: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
      evidence: "concrete flow identity evidence"
    - id: dq_mass_balance
      applies_to: "gin/storage"
      requirement: "Reconcile wet and dry balances and investigate gaps beyond justified uncertainty."
      evidence: "scales, moisture tests, balance"
    - id: dq_allocation
      applies_to: "co-products"
      requirement: "Retain quantities, grades, prices, period, currency, shares and mass sensitivity."
      evidence: "sales/market evidence, worksheet"
    - id: dq_temporal
      applies_to: "all"
      requirement: "Cover a complete crop cycle and gin/storage period; disclose proxies and abnormal events."
      evidence: "dates and exception log"
    - id: dq_completeness
      applies_to: "all cards"
      requirement: "Report applicable value or documented zero/not-applicable and retain concrete selections for sets."
      evidence: "completeness and binding evidence"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference"
    rule: "Reject planting, delinted or crushed seed and derived products; require whole fuzzy non-planting cottonseed and qualifiers."
    source_ids: []
  - rule_id: validate_process_chain
    applies_to: "map"
    rule: "Require cultivation/harvest and ginning; include storage only when before gate and impose no inactive-route amount."
    source_ids: []
  - rule_id: validate_gin_balance
    applies_to: "ginning"
    rule: "Require matched input and complete lint, cottonseed, useful output, waste and moisture reconciliation."
    source_ids:
      - cotton-ginners-handbook-2016
  - rule_id: validate_coproduct_allocation
    applies_to: "crop/gin"
    rule: "Require explicit lint/cottonseed attribution, economic inputs and mass sensitivity; reject double allocation."
    source_ids: []
  - rule_id: validate_flow_identitys
    applies_to: "inputs"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "cards"
    rule: "Require role, bounds, unit, basis and evidence; lower <= upper and inactive conditional routes impose no amount."
    source_ids: []
  - rule_id: validate_reject_routing
    applies_to: "rejects"
    rule: "Route each off-spec stream once and exclude rejected mass from accepted output."
    source_ids: []
  - rule_id: validate_shared_burdens
    applies_to: "shared services"
    rule: "Require a causal driver and prove each shared burden is counted once."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground cottonseed production dataset with explicit co-product attribution"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA of whole fuzzy non-planting cottonseed at the declared gin/farm gate"
  excluded_use: "planting or delinted seed; lint, linters, hulls, oil, cake, meal, crushing, extraction or feed manufacture"
  required_metadata: "cultivar; geography; crop year; irrigation; harvest; gin; lot; moisture; foreign matter; fuzz state; storage; gate; balance; allocation"
  required_quality_disclosure: "coverage, uncertainty, proxies, mixed origins, unresolved identities, allocation sensitivity and representativeness"
  update_trigger: "material change in region, production, harvest, gin, yield, moisture/storage, product state, price or allocation"
data_sources:
  - id: "feedipedia-cottonseed"
    type: "extension_guidance"
    reference: "Feedipedia, Cotton seeds, https://feedipedia.review.fao.org/node/742"
    used_for: "identity, route, uses and exclusions"
  - id: "cotton-ginners-handbook-2016"
    type: "handbook"
    reference: "National Cotton Council, Cotton Ginners Handbook, https://journal.cotton.org/article/20-2-154/"
    used_for: "gin boundary, separation, moisture, energy, waste and air emissions"
  - id: "cottonseed-storage-2018"
    type: "literature"
    reference: "Ashley et al., Cottonseed Air-Handling and Storage Requirements, Journal of Cotton Science 22:47-59, https://www.cotton.org/journal/2018-22/1/47.cfm"
    used_for: "co-product ratio, moisture, aeration, handling and storage"
  - id: "ncc-seedcotton-handling"
    type: "extension_guidance"
    reference: "National Cotton Council, Recommendations for Handling Seedcotton Exposed to Excessive Rainfall, https://www.cotton.org/tech/quality/rainfallandseedcotton.cfm"
    used_for: "harvest moisture, seed-cotton storage and seed condition"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC 2019 Refinement, Volume 4, Chapter 11"
    used_for: "managed-soil emissions"
  - id: "emep-eea-2023-guidebook"
    type: "method_factor"
    reference: "EMEP/EEA Air Pollutant Emission Inventory Guidebook 2023"
    used_for: "fertilizer ammonia"
  - id: "pcr-reference-definition"
    type: "standard"
    reference: "This PCR, Reference Flow section"
    used_for: "exact 1,000 kg output range"
