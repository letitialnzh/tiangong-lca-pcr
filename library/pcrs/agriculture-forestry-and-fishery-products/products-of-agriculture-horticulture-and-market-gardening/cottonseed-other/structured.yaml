allocation_rules:
  - rule_id: allocation_gin_coproducts
    applies_to: "cultivation and ginning"
    rule: "Treat lint and cottonseed as intended co-products. Subdivide metered process burdens first; allocate remaining inseparable burdens by economic value using matched quantities and representative prices."
    source_ids:
      - cottonseed-storage-2018
  - rule_id: allocation_sensitivity
    applies_to: "lint/cottonseed"
    rule: "Report mass-allocation sensitivity and prices, currency, period, moisture, grades and value shares; no default substitution credit."
    source_ids: []
  - rule_id: allocation_residuals
    applies_to: "gin/storage outputs"
    rule: "Give no co-product credit to waste. Treat recovered material as product only with intended use, positive value and separate hand-off."
    source_ids: []
  - rule_id: allocation_shared_assets
    applies_to: "shared infrastructure"
    rule: "Attribute by measured use, runtime, throughput or another causal driver and count each burden once."
    source_ids: []
  - rule_id: allocation_rework_rejects
    applies_to: "rejects"
    rule: "Return rework to its node; downgraded saleable output remains product and discarded material remains waste."
    source_ids: []
