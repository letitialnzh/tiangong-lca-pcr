      applies_to: "reference"
      requirement: "Prove non-planting, whole/fuzzy state, cultivar, crop year, moisture, foreign matter, grade, storage and gate."
      evidence: "specification, lot ticket, inspection"
    - id: dq_traceability
      applies_to: "chain"
      requirement: "Link fields to seed-cotton lots and matched gin outputs; disclose mixed origins."
      evidence: "ids, module tags, tickets"
    - id: dq_mass_balance
      applies_to: "gin/storage"
      requirement: "Reconcile wet and dry balances and investigate gaps beyond justified uncertainty."
      evidence: "scales, moisture tests, balance"
    - id: dq_allocation
      applies_to: "co-products"
      requirement: "Retain quantities, grades, prices, period, currency, shares and mass sensitivity."
      evidence: "sales/market evidence, worksheet"
    - id: dq_temporal
      applies_to: "all"
      requirement: "Cover a complete crop cycle and gin/storage period; disclose proxies and abnormal events."
      evidence: "dates and exception log"
    - id: dq_completeness
      applies_to: "all cards"
      requirement: "Report applicable value or documented zero/not-applicable and retain concrete selections for sets."
      evidence: "completeness and binding evidence"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference"
    rule: "Reject planting, delinted or crushed seed and derived products; require whole fuzzy non-planting cottonseed and qualifiers."
    source_ids: []
  - rule_id: validate_process_chain
    applies_to: "map"
    rule: "Require cultivation/harvest and ginning; include storage only when before gate and impose no inactive-route amount."
    source_ids: []
  - rule_id: validate_gin_balance
    applies_to: "ginning"
    rule: "Require matched input and complete lint, cottonseed, useful output, waste and moisture reconciliation."
    source_ids:
      - cotton-ginners-handbook-2016
  - rule_id: validate_coproduct_allocation
    applies_to: "crop/gin"
    rule: "Require explicit lint/cottonseed attribution, economic inputs and mass sensitivity; reject double allocation."
    source_ids: []
  - rule_id: validate_flow_sets
    applies_to: "inputs"
    rule: "Require compatible selection evidence; nutrients remain one set-level card per process with no group/fixed UUID."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "cards"
    rule: "Require role, bounds, unit, basis and evidence; lower <= upper and inactive conditional routes impose no amount."
    source_ids: []
  - rule_id: validate_reject_routing
    applies_to: "rejects"
    rule: "Route each off-spec stream once and exclude rejected mass from accepted output."
    source_ids: []
  - rule_id: validate_shared_burdens
    applies_to: "shared services"
    rule: "Require a causal driver and prove each shared burden is counted once."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground cottonseed production dataset with explicit co-product attribution"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA of whole fuzzy non-planting cottonseed at the declared gin/farm gate"
  excluded_use: "planting or delinted seed; lint, linters, hulls, oil, cake, meal, crushing, extraction or feed manufacture"
  required_metadata: "cultivar; geography; crop year; irrigation; harvest; gin; lot; moisture; foreign matter; fuzz state; storage; gate; balance; allocation"
  required_quality_disclosure: "coverage, uncertainty, proxies, mixed origins, unresolved identities, allocation sensitivity and representativeness"
  update_trigger: "material change in region, production, harvest, gin, yield, moisture/storage, product state, price or allocation"
