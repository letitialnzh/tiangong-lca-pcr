      frequency: "each event and period total"
      temporal_coverage: "complete declared harvest period"
      site_scope: "every included field or orchard"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, meters, operation logs, calibration, inventory reconciliation"
