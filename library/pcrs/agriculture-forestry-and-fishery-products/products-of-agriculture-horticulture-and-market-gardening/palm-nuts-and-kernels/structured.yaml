  calculation_rules:
    - id: calc_moisture_conversion
      applies_to: "nut/kernel mass"
      rule: "dry mass = as-received mass × (1 − moisture fraction); reverse conversion uses the target moisture fraction"
      inputs:
        - "as-received mass"
        - "moisture fraction"
        - "test basis"
      output: "dry mass or adjusted as-received mass"
      source_ids: []
    - id: calc_mass_balance
      applies_to: "each mill node"
      rule: "residual = input mass + auxiliary material mass − intended outputs − residues/waste − measured moisture loss"
      inputs:
        - "linked mass records by run"
      output: "reconciliation residual and percentage"
      source_ids:
        - fao-palm-oil-processing
    - id: calc_period_attribution
      applies_to: "plantation phases and shared infrastructure"
      rule: "attributed burden = period burden × declared allocation share ÷ accepted reference-product mass"
      inputs:
        - "phase/run burden"
        - "service or output driver"
        - "accepted mass"
      output: "burden per kg reference product"
      source_ids:
        - rspo-ghg-procedure-v4
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference output"
      requirement: "Retain species/hybrid, nut/kernel state, whole/broken state, before-oil-extraction status, moisture, grade, origin, period and hand-off evidence."
      evidence: "lot specification and grading record"
    - id: dq_completeness
      applies_to: "all processes"
      requirement: "Cover all included estates and mill lines; quantify missing data and explain every mass-balance residual and cut-off."
      evidence: "coverage register and reconciliation"
    - id: dq_temporal
      applies_to: "perennial and mill data"
      requirement: "Use a representative annual period and document phase scaling, storage carryover and run-period alignment."
      evidence: "dated estate and batch records"
    - id: dq_calibration
      applies_to: "measured flows"
      requirement: "Retain calibration status or supplier invoice evidence for scales, meters and laboratory moisture tests."
      evidence: "calibration and invoice records"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Reject a package whose reference is FFB, palm kernel shell, palm oil or kernel oil, or whose oil-palm nut/kernel qualifier, before-extraction state, moisture basis or hand-off is missing."
    source_ids:
      - unsd-cpc-3-01491
  - rule_id: validate_route
    applies_to: "process map"
    rule: "Require plantation, harvest, mill treatment, fibre-nut separation, drying and grading; require cracking only for the separated-kernel branch and prohibit kernel-oil extraction."
    source_ids:
      - fao-palm-oil-processing
  - rule_id: validate_mass_balance
    applies_to: "every treatment/conditioning run"
    rule: "Check inputs against intended outputs, intermediates, residues, rejects and moisture change; investigate values outside the card QA ranges."
    source_ids:
      - fao-palm-oil-processing
  - rule_id: validate_multi_output
    applies_to: "intended outputs"
    rule: "Require enumerated hand-offs and one explicit attribution decision for crude palm oil, accepted nut/kernel, fibre, shell and any other intended output."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_period_and_assets
    applies_to: "plantation phases and shared infrastructure"
    rule: "Require phase/run links and verify that each shared burden is attributed once."
    source_ids:
      - rspo-ghg-procedure-v4
  - rule_id: validate_mode_rework
    applies_to: "batch/continuous runs and grading"
    rule: "Require run indexing, cleaning/changeover attribution, rework destinations, and exclusion of rejects from accepted output."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for oil-palm nut or separated kernel before oil extraction"
  downstream_use: "secondary_dataset; background_dataset when geography, plantation phase, mill route and product state match"
  allowed_use: "LCA of oil-palm nut/kernel supply and downstream oil extraction using the declared state and gate"
  excluded_use: "FFB supply; palm kernel shell supply; palm oil or kernel-oil production; refined oil; routes that omit the declared qualifier or included upstream plantation burdens"
  required_metadata: "species/hybrid; origin; estate and mill; land history; palm age/phase; period; mill mode; nut/kernel branch; cracking route; moisture and basis; grade; whole/broken state; allocation method; hand-off"
  required_quality_disclosure: "coverage, primary-data share, missing data, substitutions, mass-balance residuals, temporal scaling, allocation sensitivity and provisional Range replacements"
  update_trigger: "material route, technology, plantation-phase, land-history, output mix, allocation, moisture/grade specification, source or UUID identity change"
