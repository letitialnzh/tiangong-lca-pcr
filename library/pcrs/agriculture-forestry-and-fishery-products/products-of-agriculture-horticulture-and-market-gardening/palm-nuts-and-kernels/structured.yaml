allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "plantation and mill"
    rule: "First subdivide independently measured estate blocks, mill nodes, runs and product routes; do not allocate burdens already separable."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_multi_output
    applies_to: "crude palm oil, nut/kernel, fibre, shell and other intended outputs"
    rule: "Enumerate every intended output and hand-off. Where subdivision cannot avoid allocation, use a documented physical causal relation; use economic allocation only when no defensible physical relation exists, with prices, period and sensitivity disclosed."
    source_ids:
      - iso-14044-2006
      - fao-palm-oil-processing
  - rule_id: allocation_period
    applies_to: "perennial crop and shared assets"
    rule: "Attribute establishment, immature-phase and shared-infrastructure burdens once over the declared productive output or service basis; record period-specific decisions and prevent double attribution."
    source_ids:
      - rspo-ghg-procedure-v4
  - rule_id: allocation_rework
    applies_to: "downgraded and rejected material"
    rule: "Rework retains the producing-node burden and receives only incremental rework burdens; accepted output excludes unrecovered rejects. Recovered residues are classified consistently as intended output, residue or waste by actual fate."
    source_ids: []
  - rule_id: allocation_shared_runs
    applies_to: "batch and continuous mill operation"
    rule: "Attribute cleaning, start-up, shutdown and shared utilities to the corresponding run or operating period once; document the driver and reconciliation."
    source_ids: []
