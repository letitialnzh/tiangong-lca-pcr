system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The boundary begins with the declared plantation starting condition and includes managed perennial production, harvest, FFB hand-off, primary mill conditioning and treatment, fibre-nut separation, optional cracking, drying, grading and hand-off. Palm-kernel oil extraction and downstream refining are excluded. Shared nurseries, roads, irrigation, steam/electricity assets and mill utilities are included through measured use and attributed once across consuming nodes and periods."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Harvest is independent because it removes mature FFB from the managed stand and creates a measured hand-off to the mill. Sterilization/digestion changes received FFB into pressed outputs; fibre-nut separation creates palm-nut and fibre states; cracking changes nut to kernel and shell; drying changes usable wet material to a stabilized state; grading creates accepted, downgraded/rework and rejected destinations."
      source_ids: []
    - rule_id: boundary_route
      applies_to: "all foreground nodes"
      rule: "Include the full route from declared plantation starting condition to dried and graded nut/kernel hand-off; exclude kernel-oil extraction."
      source_ids:
        - fao-palm-oil-processing
    - rule_id: boundary_reference_exclusions
      applies_to: "reference identity"
      rule: "FFB and palm kernel shell may appear as route flows but never satisfy the reference flow."
      source_ids:
        - unsd-cpc-3-01491
    - rule_id: boundary_periods
      applies_to: "perennial plantation"
      rule: "Separate establishment, immature and productive periods when inputs, assets or outputs differ, then attribute them across the declared productive basis."
      source_ids:
        - rspo-ghg-procedure-v4
boundary_abstraction:
  declared_starting_condition: "Estate establishment status, previous land cover/use, palm age distribution, planting material, soil/peat status, geographic boundary and opening inventory"
  starting_condition_role: "Entry condition for perennial managed biological production and cross-period attribution"
  product_classification_scope: "Oil-palm nuts or separated kernels corresponding exactly to CPC 3.0 01491; classification does not authorize FFB or shell as reference"
  recursive_input_rule: "A purchased nut or kernel input in the same product category is a separately identified upstream dataset and may not be recursively regenerated inside this foreground package"
  upstream_dataset_requirement: "Supplier-specific dataset with product state, moisture, origin, period and hand-off; generic proxy use must be disclosed"
  disclosure: "Declare plantation phase, land history, route, mill mode, nut/kernel branch, cracking decision, moisture basis, grade, location, period and all upstream proxy choices"
