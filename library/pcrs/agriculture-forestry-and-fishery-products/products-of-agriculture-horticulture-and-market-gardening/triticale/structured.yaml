allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "field production and conditioning"
    rule: "Prefer separate records for field production and conditioning and separate measurement of grain, screenings, straw, and waste before allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_field_residue
    applies_to: "residues retained, incorporated, or burned"
    rule: "Do not treat retained residues as co-products; include their management and emissions in field production and prevent double counting with removed straw."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: allocation_removed_straw
    applies_to: "marketable removed straw"
    rule: "If subdivision cannot resolve shared burdens, apply economic allocation using contemporaneous farm-gate values; disclose moisture bases and test mass allocation as sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_conditioning_outputs
    applies_to: "useful screenings or downgraded grain"
    rule: "Treat an intended output with positive value as co-product and other rejects as waste; use economic allocation at conditioning hand-off only when subdivision is infeasible."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_activity_records
      process_id: "triticale_field_production"
      flow_role: "seed, nutrients, irrigation, fuel, crop protection"
      record_type: "field log, invoice, application record, meter or contractor record"
      raw_fields: "field_id; area; cultivar; input_product; amount; nutrient_content; date; operation; contractor_scope"
      collection_method: "reconcile physical inputs and operations to each field and crop cycle"
      unit: "kg; kg nutrient; L; m3; ha"
      frequency: "each event"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "sum by physical identity; calculate nutrients without merging products; normalize with same-cycle area and yield"
      quality_evidence: "invoices; labels; calibrated meters; field logs"
    - protocol_id: cp_harvest_output_records
      process_id: "triticale_field_production"
      flow_role: "grain, removed straw, residue fate"
      record_type: "weighbridge, yield monitor, bale record, moisture test"
      raw_fields: "field_id; harvest_date; grain_mass; grain_moisture; straw_mass; straw_moisture; residue_fate; destination"
      collection_method: "reconcile harvest and removed masses to field area and crop cycle"
      unit: "kg; percent; ha"
      frequency: "each harvest"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "sum accepted grain and each residue destination separately"
      quality_evidence: "scale or yield-monitor calibration; moisture records; destination evidence"
    - protocol_id: cp_field_emission_activity
      process_id: "triticale_field_production"
