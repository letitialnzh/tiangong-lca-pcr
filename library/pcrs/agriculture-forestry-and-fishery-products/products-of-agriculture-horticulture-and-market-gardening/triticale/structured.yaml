allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "field production and conditioning"
    rule: "Prefer separate records for field production and conditioning and separate measurement of grain, screenings, straw, and waste before allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_field_residue
    applies_to: "residues retained, incorporated, or burned"
    rule: "Do not treat retained residues as co-products; include their management and emissions in field production and prevent double counting with removed straw."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: allocation_removed_straw
    applies_to: "marketable removed straw"
    rule: "If subdivision cannot resolve shared burdens, apply economic allocation using contemporaneous farm-gate values; disclose moisture bases and test mass allocation as sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_conditioning_outputs
    applies_to: "useful screenings or downgraded grain"
    rule: "Treat an intended output with positive value as co-product and other rejects as waste; use economic allocation at conditioning hand-off only when subdivision is infeasible."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_activity_records
      process_id: "triticale_field_production"
      flow_role: "seed, nutrients, irrigation, fuel, crop protection"
      record_type: "field log, invoice, application record, meter or contractor record"
      raw_fields: "field_id; area; cultivar; input_product; amount; nutrient_content; date; operation; contractor_scope"
      collection_method: "reconcile physical inputs and operations to each field and crop cycle; Raw aggregation and attribution: sum by physical identity; calculate nutrients without merging products; normalize with same-cycle area and yield"
      unit: "kg; kg nutrient; L; m3; ha"
      frequency: "each event"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices; labels; calibrated meters; field logs"
    - protocol_id: cp_harvest_output_records
      process_id: "triticale_field_production"
      flow_role: "grain, removed straw, residue fate"
      record_type: "weighbridge, yield monitor, bale record, moisture test"
      raw_fields: "field_id; harvest_date; grain_mass; grain_moisture; straw_mass; straw_moisture; residue_fate; destination"
      collection_method: "reconcile harvest and removed masses to field area and crop cycle; Raw aggregation and attribution: sum accepted grain and each residue destination separately"
      unit: "kg; percent; ha"
      frequency: "each harvest"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale or yield-monitor calibration; moisture records; destination evidence"
    - protocol_id: cp_field_emission_activity
      process_id: "triticale_field_production"
      flow_role: "emissions to air and water"
      record_type: "nutrient, soil, weather, residue, and emission-model records"
      raw_fields: "fertilizer_N; organic_N; residue_N; application_method; soil; climate; drainage; factor_set; model_version"
      collection_method: "calculate each emission with one declared geographically applicable method; Raw aggregation and attribution: calculate per field, area-weight, then normalize by same-cycle yield"
      unit: "kg N; kg emission; ha"
      frequency: "each event and crop-cycle calculation"
      temporal_coverage: "complete crop cycle"
      site_scope: "all represented fields"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "source records; factor provenance; model file; nutrient-balance review"
    - protocol_id: cp_conditioning_records
      process_id: "farm_gate_grain_conditioning"
      flow_role: "grain, energy, screenings, rejects"
      record_type: "batch ticket, scale, moisture test, meter, fuel and destination records"
      raw_fields: "batch_id; incoming_mass; incoming_moisture; electricity; heat; accepted_mass; accepted_moisture; screenings; rejects"
      collection_method: "reconcile batches and meters to accepted output; Raw aggregation and attribution: sum matched batches; allocate shared meters by time or processed mass; close wet-mass balance"
      unit: "kg; percent; kWh; MJ"
      frequency: "each batch or meter period"
      temporal_coverage: "all pre-gate conditioning"
      site_scope: "all included equipment and batches"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scales and moisture meters; meter reconciliation"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "reference_product_at_declared_handoff"
      record_type: "handoff weighing and acceptance records"
      raw_fields: "route, terminal_output_row_id, product_state, gate, lot, net_mass_kg, moisture_basis, acceptance, tare"
      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
  calculation_rules:
    - id: calc_area_to_reference_flow
      applies_to: "field flows"
      rule: "crop-cycle amount per hectare / marketable grain yield per hectare × 1,000 kg"
      inputs:
        - "flow amount"
        - area
        - "same-cycle grain mass"
      output: "amount per 1,000 kg grain"
      source_ids: []
    - id: calc_nutrient_content
      applies_to: "fertilizer and amendment inputs"
      rule: "product mass × declared nutrient fraction; preserve elemental or oxide-equivalent basis"
      inputs:
        - "product identity"
        - mass
        - assay
        - "reporting basis"
      output: "kg N, kg P2O5, kg K2O by source"
      source_ids: []
    - id: calc_managed_soil_n2o
      applies_to: "soil N2O"
      rule: "apply selected IPCC tier or regional method to fertilizer N, organic N, returned-residue N, volatilization, and leaching pathways"
      inputs:
        - "nitrogen activity"
        - "residue fate"
        - "soil and climate"
        - factors
      output: "kg N2O by pathway"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_ammonia_volatilization
      applies_to: "ammonia to air"
      rule: "calculate by fertilizer type, application method, timing, and applicable factor"
      inputs:
        - "nitrogen product records"
        - "application details"
        - factors
      output: "kg NH3"
      source_ids:
        - emep-eea-2023-guidebook
    - id: calc_conditioning_mass_balance
      applies_to: "grain conditioning"
      rule: "incoming wet grain = accepted grain + useful screenings + rejects + moisture and other measured losses within uncertainty"
      inputs:
        - masses
        - moisture
        - "loss records"
      output: "reconciled outputs per accepted grain"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Confirm triticale rather than wheat, rye, or mixed small grain; retain cultivar, intended use, state, and hand-off."
      evidence: "crop, lot, and sales records"
    - id: dq_temporal_alignment
      applies_to: "all foreground rows"
      requirement: "Use inputs, harvest, yield, emissions, and conditioning records from the same crop cycle; disclose proxy years."
      evidence: "dated field and batch records"
    - id: dq_mass_and_moisture
      applies_to: "grain and straw"
      requirement: "Retain scale or yield-monitor calibration and moisture measurements for every basis conversion."
      evidence: "calibration and moisture-test records"
    - id: dq_completeness
      applies_to: "process map and flows"
      requirement: "Reconcile every field and conditioning batch and distinguish zero, not applicable, proxy, and missing values."
      evidence: "field roster; batch reconciliation"
    - id: dq_identity_resolution
      applies_to: "parameterized and unmapped flows"
      requirement: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
      evidence: "identity review record"
validation_rules:
  - rule_id: validation_reference_output
    applies_to: "terminal output"
    rule: "Exactly one terminal triticale grain output equals 1,000 kg after scaling, uses the fixed reference UUID, and declares moisture and quality qualifiers."
    source_ids: []
  - rule_id: validation_process_route
    applies_to: "process map"
    rule: "Include field production once; include conditioning only before farm-gate hand-off and avoid double counting embedded energy or rejects."
    source_ids: []
  - rule_id: validation_crop_cycle_reconciliation
    applies_to: "field inventory"
    rule: "Area, inputs, harvest outputs, residue fates, and emissions refer to the same crop cycle and fields."
    source_ids: []
  - rule_id: validation_nitrogen_balance
    applies_to: "nitrogen inventory"
    rule: "Reconcile nutrient content, returned and removed residue nitrogen, and emission pathways with methods and factors disclosed."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validation_conditioning_balance
    applies_to: "conditioning"
    rule: "Reconcile incoming wet grain with accepted grain, screenings, rejects, moisture loss, and other measured loss within uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_flow_identity
    applies_to: "every flow"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground triticale grain production dataset"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "farm-gate LCA of triticale grain and downstream systems preserving declared geography, moisture, residue, allocation, and conditioning context"
  excluded_use: "certified seed, whole-crop forage or silage, milling, feed manufacture, or another crop without reviewed proxy decision"
  required_metadata: "geography; spring or winter type; cultivar; harvest year; area; yield; moisture; intended use; tillage; irrigation; residue fate; conditioning; allocation; identity resolution"
  required_quality_disclosure: "foreground coverage; proxy inputs; missing records; range exceedances; emission methods; meter and mass-balance reconciliations"
  update_trigger: "new reviewed triticale evidence, material route change, revised emission method, changed concrete flow identity verification"
data_sources:
  - id: "uga-small-grains-handbook"
    type: "official_guidance"
    reference: "University of Georgia Cooperative Extension, Southern Small Grains Resource Management Handbook, Bulletin 1190, https://extension.uga.edu/publications/detail.html?number=B1190"
    used_for: "establishment, harvest, drying, and 13% grain-moisture guidance"
  - id: "uw-triticale-production"
    type: "extension_guidance"
    reference: "University of Wisconsin-Madison Cooperative Extension, Triticale, https://corn.aae.wisc.edu/Crops/Triticale.aspx"
    used_for: "grain route, harvest, yield context, drying, and storage moisture"
  - id: "usda-nrcs-triticale-cover-crop"
    type: "official_guidance"
    reference: "USDA NRCS and Iowa State University Extension, Triticale Cover Crop Fact Sheet, CROP 3250, https://www.nrcs.usda.gov/sites/default/files/2024-04/Triticale%20Cover%20Crop%20Fact%20Sheet.pdf"
    used_for: "seed identity and seeding-rate context"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC, 2019 Refinement to the 2006 IPCC Guidelines, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "soil N2O, volatilization and leaching pathways, residue nitrogen, and double-counting controls"
  - id: "emep-eea-2023-guidebook"
    type: "method_factor"
    reference: "European Environment Agency, EMEP/EEA Air Pollutant Emission Inventory Guidebook 2023, EEA Report 06/2023, https://www.eea.europa.eu/en/analysis/publications/emep-eea-guidebook-2023"
    used_for: "agricultural ammonia method and QA context"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines"
    used_for: "allocation hierarchy and disclosure"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation of mass applied to matched grain-conditioning batches"
    used_for: "conditioning mass-balance calculation and validation"
  - id: "declared-handoff-measurement-definition"
    type: "method_factor"
    reference: "This PCR, Sections 3, 6 and 8: measured net mass at the same state and gate is its own normalization denominator, giving a mass ratio of 1; handoff measurement adds no physical processing."
    used_for: "Same-stage and handoff measurement identities; a definition, not an observed yield, empirical default or external publication."
  - id: "fao-fertilizer-identities"
    type: "official_guidance"
    reference: "FAO Fertilizer Specifications, https://www.fao.org/agriculture/crops/thematic-sitemap/theme/spi/plantnutrition/fertspecs/en/"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
  - id: "fao-organic-nutrients"
    type: "official_guidance"
    reference: "FAO How to Make and Use Compost, https://www.fao.org/4/i2230e/i2230e.pdf"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
