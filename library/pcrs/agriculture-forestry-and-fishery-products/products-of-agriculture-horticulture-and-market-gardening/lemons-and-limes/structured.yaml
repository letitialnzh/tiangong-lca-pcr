allocation_rules:
  - rule_id: allocation_shared_orchard_cycles
    applies_to: "establishment and multiple cycles"
    rule: "Allocate shared orchard burdens by documented area-time, tree-year or another justified physical basis and disclose the basis."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: allocation_marketable_and_reject_outputs
    applies_to: "harvest and gate handling"
    rule: "Treat marketable fruit as reference output; record downgraded fruit, culls, trim and recovered material separately, and allocate only where a genuine co-product function exists."
    source_ids:
      - fao-postharvest-handling-ae075e
      - globalgap-ifa-fruit-vegetables-v6
  - rule_id: allocation_recovered_residue_claim
    applies_to: "recovered residues"
    rule: "Do not claim avoided production unless destination, function, quantity and receiving-system evidence are documented."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
