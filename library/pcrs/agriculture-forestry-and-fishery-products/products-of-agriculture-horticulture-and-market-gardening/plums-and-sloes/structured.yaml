system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary starts with the declared orchard or managed-stand production condition and ends at accepted fresh whole plums or sloes at the orchard gate. It includes establishment and removal, soil and floor management, nutrient and crop-protection applications, irrigation, machinery and field energy, land occupation, harvest, on-orchard movement, grade separation, and explicitly included primary conditioning or presentation. Upstream production of planting materials, fertilizers, soil amendments, crop protection, energy, water supply, packaging, transport service, and waste treatment requires linked background datasets when used. Packing-house operations, long-term storage, distribution, retail, consumption, and processing are outside the default boundary."
      source_ids: []
    - rule_id: boundary_perennial_system
      applies_to: "orchard and managed sloe production"
      rule: "Include attributable establishment, replacement, productive years, and removal, or document why a representative single-period boundary is appropriate."
      source_ids:
        - source_foreground_records
    - rule_id: boundary_orchard_gate
      applies_to: "reference product"
      rule: "End the default boundary at accepted fresh whole fruit at the declared gate; conditioning, storage, packing, and distribution after that point require explicit downstream processes."
      source_ids:
        - unece-ffv-29-plums-2020
        - usda-plum-grade-standards-7cfr51
    - rule_id: boundary_input_completeness
      applies_to: "cultivation and harvest"
      rule: "Address nutrient products, crop protection, irrigation and withdrawal, land, fuel, electricity, establishment materials, losses, direct emissions, and fates with a value, justified zero, or documented exclusion."
      source_ids:
        - ipcc-2019-soils-n2o
        - fao-56-crop-evapotranspiration-1998
        - source_foreground_records
    - rule_id: boundary_grade_separation
      applies_to: "all fruit outputs"
      rule: "Separate accepted, downgraded, processing, culled, and lost fruit by measured mass and declared destination or fate."
      source_ids:
        - unece-ffv-29-plums-2020
        - usda-plum-grade-standards-7cfr51
        - source_foreground_records
