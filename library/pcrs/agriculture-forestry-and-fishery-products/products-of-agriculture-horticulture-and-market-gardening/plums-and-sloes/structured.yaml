allocation_rules:
  - rule_id: allocation_accepted_output
    applies_to: "accepted fresh fruit"
    rule: "Use net accepted fresh fruit as the reference output; do not allocate it from gross harvested mass."
    source_ids:
      - unece-ffv-29-plums-2020
      - source_foreground_records
  - rule_id: allocation_grade_outputs
    applies_to: "accepted, downgraded, processing, and cull outputs"
    rule: "Measure and separate every intended grade or destination. If shared burdens cannot be split directly, use the declared physical mass basis; use another basis only with product-specific evidence and disclosure."
    source_ids:
      - source_foreground_records
  - rule_id: allocation_residues_losses
    applies_to: "culls, residues, and wastes"
    rule: "Do not allocate burdens to a residue or waste with no intended product function. Record recovered or sold co-products separately and apply the declared attribution method consistently."
    source_ids:
      - source_foreground_records
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_lifecycle_records
      process_id: "orchard_establishment_and_removal"
      flow_role: "establishment_materials; establishment_removal_waste; establishment_land_occupation; established_orchard_condition"
      record_type: "planting, asset, and removal records"
      raw_fields: "block area; planting year; tree or stand count; material; installation; replacement; removal; productive life; juvenile years; fate"
      collection_method: "reconcile invoices, maps, work orders, and removal records to the block"
      unit: "kg; count; ha; year"
      frequency: "each event, reconciled annually"
      temporal_coverage: "declared productive life and reporting year"
      site_scope: "each orchard block or managed stand"
      aggregation_rule: "annualize attributable quantities over lifetime accepted output"
      quality_evidence: "invoices, maps, work orders, signed block records"
    - protocol_id: cp_orchard_input_records
      process_id: "orchard_cultivation_and_protection"
      flow_role: "nutrient_products; crop_protection_products; direct_n2o_air; ammonia_air; nutrient_losses_to_water_or_soil"
      record_type: "input and application log"
      raw_fields: "product; formulation; amount; nutrient or active ingredient; date; field; method; soil or weather condition when used"
      collection_method: "collect invoices, application logs, nutrient plans, and stock reconciliation"
      unit: "kg product; kg nutrient; kg active ingredient"
      frequency: "each application, reconciled monthly or annually"
      temporal_coverage: "one harvest year or declared averaging period"
      site_scope: "each orchard block or managed stand"
      aggregation_rule: "aggregate by actual product and nutrient or substance, then normalize"
      quality_evidence: "invoices, labels, logs, nutrient plan"
    - protocol_id: cp_irrigation_records
      process_id: "orchard_cultivation_and_protection"
      flow_role: "irrigation_water; irrigation_withdrawal"
      record_type: "water meter and source record"
      raw_fields: "source; meter readings; delivered volume; withdrawal volume; field; date; rain-fed declaration"
      collection_method: "read meters or retain supplier records; document justified zero for verified rain-fed production"
      unit: "m3 or kg"
      frequency: "each event, reconciled monthly"
      temporal_coverage: "one harvest year or declared averaging period"
      site_scope: "each source and block"
      aggregation_rule: "sum delivered irrigation separately from source withdrawal"
      quality_evidence: "meter calibration, invoices, permits, field logs"
    - protocol_id: cp_orchard_energy_records
      process_id: "orchard_cultivation_and_protection_harvest_and_field_collection"
      flow_role: "mobile_machinery_fuel; purchased_electricity; harvest_fuel"
      record_type: "fuel, machine, and electricity records"
      raw_fields: "fuel type; quantity; meter or invoice; operation; machine; date; block; electricity allocation"
      collection_method: "retain fuel tickets, machine logs, meters, and allocation method"
      unit: "L; kg; MJ; kWh"
      frequency: "each transaction or operation, reconciled monthly"
      temporal_coverage: "one harvest year or declared averaging period"
      site_scope: "each block, fleet, or facility"
      aggregation_rule: "assign shared energy by measured use or documented hours"
      quality_evidence: "invoices, meters, machine hours, worksheet"
    - protocol_id: cp_yield_and_harvest_records
      process_id: "orchard_cultivation_and_protection_harvest_and_field_collection"
      flow_role: "standing_fruit_for_harvest; fruit_presented_for_harvest; accepted_fresh_fruit; downgraded_processing_fruit; harvest_culls_and_losses"
      record_type: "harvest and weighbridge records"
      raw_fields: "species; cultivar; block; date; gross and tare mass; grade; destination; rejected or lost mass; moisture or maturity where relevant"
      collection_method: "weigh each lot or use documented sampling and reconciliation"
      unit: "kg fresh fruit"
      frequency: "each lot, aggregated by period"
      temporal_coverage: "one harvest year or declared averaging period"
      site_scope: "each block, lot, and destination"
      aggregation_rule: "reconcile gross harvest to accepted, downgraded, cull, and loss outputs"
      quality_evidence: "weighbridge tickets, grade sheets, sales records, mass-balance check"
    - protocol_id: cp_conditioning_and_packaging_records
      process_id: "primary_conditioning_and_gate_handoff"
      flow_role: "conditioning_fruit_input; conditioning_water; conditioning_electricity; conditioning_packaging_materials; conditioned_accepted_fruit; conditioning_rejects_and_wastewater; packaging_rejects"
      record_type: "conditioning, packing, and hand-off records"
      raw_fields: "intake and output mass; water; electricity; package material; tare; reuse cycles; rejects; destination; hand-off date"
      collection_method: "collect batch sheets, meters, packaging invoices, and dispatch records only for included operations"
      unit: "kg; m3; kWh; count"
      frequency: "each batch or dispatch, reconciled by period"
      temporal_coverage: "declared harvest and conditioning period"
      site_scope: "each line, block, or gate facility"
      aggregation_rule: "reconcile intake, accepted output, rejects, wastewater, and packaging; remove reusable tare"
      quality_evidence: "batch records, meters, package specifications, dispatch records"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all quantitative rows"
      rule: "normalized amount = period amount / net accepted reference fruit mass"
      inputs:
        - "period amount"
        - "net accepted fruit mass"
      output: "amount per 1 kg reference product"
      source_ids:
        - source_foreground_records
    - id: calc_perennial_annualization
      applies_to: "establishment_materials; establishment_removal_waste; establishment_land_occupation"
      rule: "annualized amount = attributable lifecycle amount / declared productive-life accepted output"
      inputs:
        - "lifecycle amount"
        - "productive life"
        - "lifetime accepted output"
      output: "annualized amount per kg accepted fruit"
      source_ids:
        - source_foreground_records
    - id: calc_nutrient_content
      applies_to: "nutrient_products; direct_n2o_air; ammonia_air; nutrient_losses_to_water_or_soil"
      rule: "nutrient amount = product amount × declared nutrient fraction; preserve product and nutrient bases"
      inputs:
        - "product amount"
        - "nutrient fraction"
        - "application event"
      output: "kg nutrient and emission inputs"
      source_ids:
        - ipcc-2019-soils-n2o
        - source_foreground_records
    - id: calc_mass_balance
      applies_to: "fruit outputs and conditioning rejects"
      rule: "harvested input = accepted + downgraded/processing + culls + measured or justified losses after tare and moisture reconciliation"
      inputs:
        - "harvested mass"
        - "output masses"
        - tare
        - "declared basis"
      output: "reconciled output set and residual loss"
      source_ids:
        - source_foreground_records
    - id: calc_shared_energy_allocation
      applies_to: "purchased_electricity; mobile_machinery_fuel; harvest_fuel"
      rule: "assign shared records using measured operation use or documented machine-hours; do not use output price without a justified decision"
      inputs:
        - "shared record"
        - "operation use"
        - "allocation basis"
      output: "process-level energy amount"
      source_ids:
        - source_foreground_records
  data_quality_requirements:
    - id: dq_identity_and_qualifiers
      applies_to: "reference product and every grade output"
      requirement: "Declare species/cultivar, production system, geography, harvest period, maturity, grade, destination, gate, and package state; semantic identities without UUIDs remain explicit for later foreground resolution."
      evidence: "dataset metadata; lot records; product description"
    - id: dq_mass_reconciliation
      applies_to: "harvest and conditioning"
      requirement: "Accepted, downgraded, processing, cull, reject, and loss masses reconcile to measured inputs within a documented tolerance or explain the residual."
      evidence: "weighbridge tickets; batch sheets; worksheet"
    - id: dq_input_completeness
      applies_to: "cultivation and harvest"
      requirement: "Provide records or justified zeros for nutrients, crop protection, irrigation and withdrawal, land, energy, establishment materials, and direct emissions or disclose an exclusion."
      evidence: "invoices; meters; logs; field plan; exclusion statement"
    - id: dq_temporal_and_site_coverage
      applies_to: "all collected records"
      requirement: "Cover the declared period and identify every contributing block, managed stand, conditioning line, or shared facility."
      evidence: "time-stamped records; block and facility registers"
    - id: dq_method_and_conversion
      applies_to: "calculated values and emissions"
      requirement: "Preserve unit conversions, nutrient fractions, N2O-N versus N2O basis, moisture basis, annualization assumptions, and allocation decisions."
      evidence: "calculation worksheet; source method; review sign-off"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Accept only a 1 kg net accepted fresh-fruit reference flow with required qualifiers; do not use gross harvest or a processing output as the reference flow."
    source_ids:
      - unece-ffv-29-plums-2020
      - source_foreground_records
  - rule_id: validation_process_completeness
    applies_to: "process map"
    rule: "Require cultivation, harvest, and every activated establishment or conditioning node to declare boundary, inputs, outputs, collection protocols, and hand-off."
    source_ids:
      - source_foreground_records
  - rule_id: validation_identity_coverage
    applies_to: "flow identities"
    rule: "Accept semantic identity evidence gaps only when flow type, direction, material or substance, receiving medium where applicable, and destination are declared; do not substitute a nearby product flow."
    source_ids:
      - source_foreground_records
  - rule_id: validation_mass_balance
    applies_to: "fruit outputs and losses"
    rule: "Fail when harvested fruit cannot be reconciled to accepted, downgraded, processing, cull, reject, and loss outputs or tare is included in net reference mass."
    source_ids:
      - source_foreground_records
  - rule_id: validation_emission_basis
    applies_to: "nutrient emissions"
    rule: "Check nitrogen inputs, receiving media, N2O-N or substance basis, and selected emission method before accepting calculated emissions."
    source_ids:
      - ipcc-2019-soils-n2o
      - source_foreground_records
  - rule_id: validation_boundary_disclosure
    applies_to: "dataset metadata"
    rule: "Fail when starting condition, orchard gate, productive-life treatment, included conditioning or packaging, downstream exclusions, or quality limitations are not disclosed."
    source_ids:
      - unece-ffv-29-plums-2020
      - source_foreground_records
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset only when explicitly qualified for background use"
  downstream_use: "foreground production of fresh whole plums or sloes at orchard gate; process and lifecyclemodel construction with route, geography, and grade qualifiers"
  allowed_use: "orchard-gate fresh-fruit studies whose product state, route, boundary, reference mass, period, and quality disclosure match this PCR"
  excluded_use: "processed, dried, preserved, retail-ready, or distribution stages; unmanaged wild gathering; datasets lacking mass balance or boundary disclosure"
  required_metadata: "PCR id and version; species/cultivar; geography; production system; orchard/stand age and productive life; harvest period; yield and grade basis; irrigation status; gate; package state; included processes; allocation method; flow identity status"
  required_quality_disclosure: "temporal and site coverage; input completeness; measurement and conversion methods; mass-balance result; emission methods; exclusions; representativeness limits"
  update_trigger: "change in product boundary, grade definition, production route, annualization method, flow-set taxonomy, emission method, or material evidence affecting a required rule"
