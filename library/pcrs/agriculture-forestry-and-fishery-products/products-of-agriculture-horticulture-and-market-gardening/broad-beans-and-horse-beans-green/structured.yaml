allocation_rules:
  - rule_id: allocation_intended_outputs
    applies_to: "marketable and downgraded outputs"
    rule: "Enumerate marketable output and every intentionally transferred downgraded or secondary output at each hand-off. Apply one declared attribution method consistently to shared inputs and burdens."
    source_ids:
      - iso-14044-2006
      - unece-ffv-06-beans
  - rule_id: allocation_rejects_are_waste
    applies_to: "rejected produce and residues"
    rule: "Treat rejected produce and residues as waste or residue unless a documented recipient, intended use, quality, and hand-off demonstrate a co-product function."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_reusable_packaging
    applies_to: "crates and pallets"
    rule: "Allocate reusable crates and pallets over documented service cycles and return losses; do not assign their full burden to one shipment without evidence."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "crop_establishment"
      flow_role: "planting_material_input"
      record_type: "supplier and field records"
      raw_fields: "lot; variety; seed mass or count; sowing date; field or unit"
      collection_method: "invoice and planting log reconciliation"
      unit: "kg or seed"
      frequency: "each planting event"
      temporal_coverage: "full crop cycle"
      site_scope: "field, bed, or protected unit"
      aggregation_rule: "sum by declared crop cycle"
      quality_evidence: "lot record and planting-log completeness"
    - protocol_id: cp_area_cycle_records
      process_id: "crop_establishment"
      flow_role: "crop_land_occupation"
      record_type: "field register"
      raw_fields: "area; occupation dates; infrastructure flag"
      collection_method: "field or protected-unit register"
      unit: "ha and dates"
      frequency: "each crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "field or unit"
      aggregation_rule: "area-time by cycle"
      quality_evidence: "dated area record"
    - protocol_id: cp_irrigation_records
      process_id: "crop_establishment_crop_management"
      flow_role: "irrigation and withdrawal"
      record_type: "meter or water balance"
      raw_fields: "source; meter; delivery; withdrawal; method; reuse; discharge"
      collection_method: "meter reading or documented balance"
      unit: "m3"
      frequency: "each irrigation event or monthly"
      temporal_coverage: "full crop cycle"
      site_scope: "field or unit"
      aggregation_rule: "sum by source and cycle"
      quality_evidence: "meter calibration or balance check"
    - protocol_id: cp_nutrient_records
      process_id: "crop_management"
      flow_role: "nutrient inputs"
      record_type: "invoice, label, plan, and application log"
      raw_fields: "product; mass; nutrient concentration; date; field; method"
      collection_method: "supplier record and application-log reconciliation"
      unit: "kg product and kg nutrient"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "field or unit"
      aggregation_rule: "sum by nutrient role and cycle"
      quality_evidence: "label, supplier specification, or laboratory result"
    - protocol_id: cp_crop_protection_records
      process_id: "crop_management"
      flow_role: "crop-protection product"
      record_type: "application log"
      raw_fields: "product; active substance; rate; target; date; area; method"
      collection_method: "application-log review"
      unit: "kg product or active substance"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "field or unit"
      aggregation_rule: "sum by product and crop cycle"
      quality_evidence: "product label and application record"
    - protocol_id: cp_energy_records
      process_id: "crop_establishment_crop_management_harvest_and_gate_preparation"
      flow_role: "fuel and electricity"
      record_type: "meter, invoice, or equipment log"
      raw_fields: "fuel or electricity; equipment; date; operation; quantity"
      collection_method: "meter or activity log"
      unit: "L or kWh"
      frequency: "each operation or monthly"
      temporal_coverage: "full crop cycle"
      site_scope: "field or facility"
      aggregation_rule: "allocate to operation and output"
      quality_evidence: "invoice, meter, or equipment record"
    - protocol_id: cp_emission_calculation
      process_id: "crop_management"
      flow_role: "elementary emissions"
      record_type: "calculation worksheet"
      raw_fields: "nutrient inputs; combustion fuel; method; factors; result"
      collection_method: "declared method and reproducible worksheet"
      unit: "kg substance"
      frequency: "each crop cycle"
      temporal_coverage: "full crop cycle"
      site_scope: "field or unit"
      aggregation_rule: "calculate by process and output"
      quality_evidence: "versioned method and input trace"
    - protocol_id: cp_residue_fate_records
      process_id: "crop_management_harvest_and_gate_preparation"
      flow_role: "residues and rejects"
      record_type: "mass balance and hand-off record"
      raw_fields: "stream; mass; moisture; fate; recipient; date"
      collection_method: "weighbridge, log, and hand-off record"
      unit: "kg"
      frequency: "each harvest or treatment event"
      temporal_coverage: "full crop cycle"
      site_scope: "field or facility"
      aggregation_rule: "reconcile by stream and fate"
      quality_evidence: "scale record and recipient evidence"
    - protocol_id: cp_harvest_grade_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "harvest and output grades"
      record_type: "harvest and grading log"
      raw_fields: "picking date; gross mass; grade; rejects; downgrade; output; loss"
      collection_method: "weigh tickets and grading records"
      unit: "kg"
      frequency: "each picking round"
      temporal_coverage: "full harvest campaign"
      site_scope: "field and pack-house"
      aggregation_rule: "sum by round and declared gate"
      quality_evidence: "scale calibration and grade record"
    - protocol_id: cp_washing_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "washing and wastewater"
      record_type: "water meter and discharge record"
      raw_fields: "water; reuse; soil removal; wastewater; treatment; discharge"
      collection_method: "meter, batch log, and treatment record"
      unit: "m3 and kg"
      frequency: "each batch"
      temporal_coverage: "full pre-gate handling"
      site_scope: "pack-house"
      aggregation_rule: "sum by batch and gate"
      quality_evidence: "meter or treatment record"
    - protocol_id: cp_packaging_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "packaging and packaging waste"
      record_type: "purchase and packing records"
      raw_fields: "material; mass; reuse cycles; damage; waste; take-back"
      collection_method: "packaging ledger and packing log"
      unit: "kg"
      frequency: "each shipment or monthly"
      temporal_coverage: "full pre-gate handling"
      site_scope: "pack-house"
      aggregation_rule: "allocate by product mass and service life"
      quality_evidence: "supplier specification and waste record"
    - protocol_id: cp_transport_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "pre-gate road freight"
      record_type: "shipment record"
      raw_fields: "origin; destination; distance; shipment mass; vehicle"
      collection_method: "shipment record and route distance"
      unit: "t*km"
      frequency: "each shipment"
      temporal_coverage: "full pre-gate handling"
      site_scope: "field to gate"
      aggregation_rule: "sum by route and crop cycle"
      quality_evidence: "dispatch record and distance basis"
  calculation_rules:
    - id: calc_output_normalization
      applies_to: "all processes"
      rule: "Normalize each flow to 1,000 kg marketable output: recorded flow / marketable output * 1,000."
      inputs:
        - "flow mass"
        - "marketable output"
      output: "normalized flow"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_equivalent
      applies_to: "nutrient inputs"
      rule: "Product mass * documented nutrient fraction; retain product and nutrient values as separate fields."
      inputs:
        - "product mass"
        - N
        - P2O5
        - K2O
        - "or organic nutrient fraction"
      output: "nutrient equivalent"
      source_ids:
        - fao-fertilizer-code-conduct
    - id: calc_area_time
      applies_to: "land occupation"
      rule: "Area * occupation duration; report protected structures separately when they are included."
      inputs:
        - area
        - dates
      output: "ha*a"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_irrigation_balance
      applies_to: "irrigation and withdrawal"
      rule: "Opening meter + withdrawals - closing meter - documented return or reuse = delivered water, with source and uncertainty disclosed."
      inputs:
        - "meter readings"
        - withdrawal
        - return
        - reuse
      output: "m3 delivered and m3 withdrawn"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: calc_grade_balance
      applies_to: "harvest and gate preparation"
      rule: "Gross harvest = marketable + downgraded + rejected + residue + measured handling loss, after consistent moisture basis."
      inputs:
        - "grade records"
        - "loss records"
      output: "reconciled output set"
      source_ids:
        - mass-balance-identity
    - id: calc_reusable_packaging
      applies_to: "crates and pallets"
      rule: "Packaging mass / documented service cycles, with return loss allocated to the applicable shipments."
      inputs:
        - "packaging mass"
        - "service cycles"
        - loss
      output: "packaging per shipment"
      source_ids:
        - iso-14044-2006
    - id: calc_nitrogen_emissions
      applies_to: "soil and air emissions"
      rule: "Apply one declared IPCC-compatible nitrogen method to documented nutrient inputs and residue fate; retain factors and intermediate values."
      inputs:
        - "nutrient input"
        - "residue fate"
        - factors
      output: "N emission flows"
      source_ids:
        - ipcc-2019-refinement-nitrogen
    - id: calc_freight
      applies_to: "pre-gate transport"
      rule: "Shipment mass * route distance, with empty return and allocation treatment disclosed."
      inputs:
        - mass
        - distance
        - route
      output: "t*km"
      source_ids:
        - codex-fresh-produce-hygiene
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference and inventory flows"
      requirement: "Use the narrowest supported flow identity; keep identity evidence gaps explicit and do not substitute a nearby product."
      evidence: "flow description, gate, type, and mapping review"
    - id: quality_measurement
      applies_to: "mass, volume, area, energy, and nutrient data"
      requirement: "Prefer calibrated scales, meters, supplier documents, laboratory results, and reproducible calculations."
      evidence: "calibration, invoice, label, lab, or worksheet"
    - id: quality_temporal
      applies_to: "crop-cycle records"
      requirement: "Cover the complete declared planting and harvest campaign and disclose missing periods."
      evidence: "dated field, harvest, and application logs"
    - id: quality_geographic
      applies_to: "production unit"
      requirement: "Identify country or region and field, bed, protected unit, or pack-house scope."
      evidence: "location register and site metadata"
    - id: quality_completeness
      applies_to: "all inventory processes"
      requirement: "Reconcile intended outputs, rejects, residues, wastewater, packaging waste, and losses to the reference output."
      evidence: "mass-balance worksheet"
    - id: quality_nutrient
      applies_to: "nutrient and emission calculations"
      requirement: "Retain product formulation, nutrient basis, application event, method, factor, and intermediate result."
      evidence: "label, plan, lab, and calculation record"
    - id: quality_boundary
      applies_to: "gate and upstream inputs"
      requirement: "Disclose gate, upstream dataset links, processing state, packaging state, and exclusions."
      evidence: "dataset metadata and process notes"
    - id: quality_uncertainty
      applies_to: "ranges and estimates"
      requirement: "Mark site-specific records, calculated values, external ranges, and provisional estimates separately."
      evidence: "value-mode and evidence-kind fields"
validation_rules:
  - rule_id: validate_reference_mass
    applies_to: "reference flow"
    rule: "Require 1,000 kg mass basis, kg unit, complete qualifiers, and a resolved or explicitly evidence gap reference-flow identity before downstream use."
    source_ids:
      - iso-14044-2006
  - rule_id: validate_cycle_balance
    applies_to: "all crop-cycle processes"
    rule: "Reject a package when planted area, crop-cycle dates, harvest rounds, and marketable output cannot be reconciled."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_nutrient_basis
    applies_to: "nutrient inputs"
