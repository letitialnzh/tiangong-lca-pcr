allocation_rules:
  - rule_id: allocation_01
    applies_to: "crop management and harvest with an intended pod residue output"
    rule: "Prefer process subdivision when crop, harvest, pod cleaning, pod residue collection, and nut records are independently available. When pod residue is deliberately collected and transferred as an intended co-product, allocate shared burdens by measured dry-matter mass; if dry-matter data are unavailable, use measured as-received mass and disclose the limitation."
    source_ids:
      - iso-14044-2006
      - fao-groundnut-postharvest-operations
  - rule_id: allocation_02
    applies_to: "pod residue retained on site or discarded"
    rule: "If pod residue remains on the field, is composted without an intended product hand-off, or is discarded as residue, do not assign a co-product credit. Retain its mass and fate as residue or waste and assign shared burden to the intended in-shell groundnut output."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_03
    applies_to: "premium, standard, and downgraded in-shell grades"
    rule: "Use physical mass allocation between mutually exclusive accepted grade outputs when common conditioning burdens cannot be subdivided. Grade-specific operations remain with the grade receiving them; do not allocate the same lot to both a grade row and an aggregate output row."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_04
    applies_to: "annual crop periods and phases"
    rule: "Annualize establishment, pre-harvest crop period, replacement, intercropping attribution, and removal over the declared crop cycle and accepted output basis. Link every input and output to a crop year or lifecycle phase; do not count a replacement event in both the original and replacement crop phases."
    source_ids:
      - fao-groundnut-sustainable-production-2023
      - iso-14044-2006
  - rule_id: allocation_05
    applies_to: "downgraded, reworked, rejected, and recovered lots"
    rule: "Keep rejected and downgraded lots separate from accepted product. Rework retains the producing-node burden and is linked once; recovered or intentionally marketed material requires a declared destination and allocation decision; discarded material receives its declared treatment burden."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: allocation_06
    applies_to: "batch, campaign, and changeover attribution"
    rule: "Link crop, harvest, conditioning, pod cleaning, grading, and storage inputs and outputs to the batch or campaign that generated them. Record cleaning and changeover events once and do not allocate shared-run burdens to more than one batch without a documented driver."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: allocation_rule_7
    applies_to: "foreground_burden_allocation"
    rule: "The hard shell remains part of the in-shell reference product and is not a separate co-product in this PCR. Kernel, oil, and shell-removal outputs belong to downstream groundnut-product PCRs and must not be introduced into this inventory. No output may be counted both as a marketed pod residue co-product and as field or conditioning residue."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_groundnut_field_lifecycle_records
      process_id: "groundnut_field_establishment_and_management"
      flow_role: "field asset, land, planting, replacement, intercropping, residue"
      record_type: "field and asset register"
      raw_fields: "block area; planting date; cultivar; plant count; replacement; removal; field residue; crop phase; accepted output"
      collection_method: "block register, field log, and annual reconciliation"
      unit: "ha, item, kg, crop-cycle"
      frequency: "event and annual"
      temporal_coverage: "full declared crop cycle or documented representative period"
      site_scope: "every contributing field"
      aggregation_rule: "link block records to crop year and accepted output"
      quality_evidence: "signed field register, GIS or survey area, replacement evidence"
    - protocol_id: cp_groundnut_field_input_records
      process_id: "groundnut_field_establishment_and_management"
      flow_role: "nutrient, amendment, crop protection"
      record_type: "input application record"
      raw_fields: "product name; formulation; nutrient content; active ingredient; amount; date; block; purpose; method"
      collection_method: "invoice, application log, and supplier record"
      unit: "kg product, kg nutrient, kg active ingredient"
      frequency: "every application"
      temporal_coverage: "crop year"
      site_scope: "every contributing block"
      aggregation_rule: "aggregate by product, nutrient, block, and crop year"
      quality_evidence: "invoice, product label, application log"
    - protocol_id: cp_groundnut_irrigation_records
      process_id: "groundnut_field_establishment_and_management"
      flow_role: "irrigation and water"
      record_type: "irrigation meter or water ledger"
      raw_fields: "source; volume; block; date; meter; water quality; withdrawal and return"
      collection_method: "meter, pump record, or transparent water balance"
      unit: "m3 or kg"
      frequency: "event and monthly"
      temporal_coverage: "crop year"
      site_scope: "every irrigated block"
      aggregation_rule: "reconcile delivery, withdrawal, and declared consumption"
      quality_evidence: "meter calibration, pump log, water ledger"
    - protocol_id: cp_groundnut_energy_records
      process_id: "all_field_harvest_conditioning_and_storage_processes"
      flow_role: "energy and carrier"
      record_type: "fuel, electricity, and equipment record"
      raw_fields: "carrier; amount; equipment; operation; lot or block; date; duration; conversion factor"
      collection_method: "invoice, meter, fuel log, or equipment record"
      unit: "L, kg, MJ, or kWh"
      frequency: "event and monthly"
      temporal_coverage: "crop year and declared post-harvest period"
      site_scope: "each operation and facility"
      aggregation_rule: "aggregate by carrier, operation, lot, and period"
      quality_evidence: "invoice, meter, fuel log, equipment specification"
    - protocol_id: cp_groundnut_emission_records
      process_id: "groundnut_field_establishment_and_management"
      flow_role: "direct and indirect field emissions"
      record_type: "emission calculation input record"
      raw_fields: "nutrient input; residue; soil condition; crop-protection record; species; method; factor"
      collection_method: "calculation workbook linked to raw records"
      unit: "kg substance"
      frequency: "annual and event"
      temporal_coverage: "crop year"
      site_scope: "every contributing block"
      aggregation_rule: "retain substance, receiving medium, factor, and source"
      quality_evidence: "calculation review, factor version, source citation"
    - protocol_id: cp_groundnut_harvest_lot_records
      process_id: "groundnut_harvest_and_collection"
      flow_role: "harvest, collection, field loss, residue"
      record_type: "harvest-lot register"
      raw_fields: "block; harvest round; maturity; harvested mass; uncollected mass; debris; pod residue status; destination"
      collection_method: "weighbridge, field scale, and lot log"
      unit: "kg, date, lot"
      frequency: "every collection round"
      temporal_coverage: "harvest season"
      site_scope: "every contributing block"
      aggregation_rule: "reconcile available, collected, lost, and residue mass"
      quality_evidence: "scale calibration, lot ticket, field inspection"
    - protocol_id: cp_groundnut_pod_cleaning_conditioning_records
      process_id: "groundnut_primary_conditioning_and_grading"
      flow_role: "pod cleaning, cleaning, water, energy, moisture, batch yield"
      record_type: "conditioning batch record"
      raw_fields: "input mass; pod residue status; method; duration; energy; water; output state; output mass; pod residue mass; cleaning loss; wastewater"
      collection_method: "batch log, meter, scale, moisture or freshness test, and water balance"
      unit: "kg, %, hours, L, kWh"
      frequency: "every batch"
      temporal_coverage: "declared post-harvest period"
      site_scope: "each conditioning facility or farm unit"
      aggregation_rule: "link all inputs and outputs to one batch and gate"
      quality_evidence: "calibrated scale, batch ticket, freshness or moisture test"
    - protocol_id: cp_groundnut_pod_residue_destination_records
      process_id: "groundnut_primary_conditioning_and_grading"
      flow_role: "pod residue co-product, residue, or waste"
      record_type: "destination and transfer record"
      raw_fields: "pod residue mass; dry matter or moisture; destination; recipient; price or use; fate; transfer date"
      collection_method: "scale, transfer record, and destination confirmation"
      unit: "kg and declared fraction"
      frequency: "every transfer"
      temporal_coverage: "conditioning period"
      site_scope: "each pod residue destination"
      aggregation_rule: "separate intended output from residue and waste"
      quality_evidence: "receipt, transfer note, destination evidence"
    - protocol_id: cp_groundnut_grade_reject_records
      process_id: "groundnut_primary_conditioning_and_grading"
      flow_role: "grade, downgrade, reject, foreign material"
      record_type: "inspection and grade record"
      raw_fields: "lot; maturity; pod residue status; shell condition; mold; insects; foreign material; accepted mass; rework; fate"
      collection_method: "inspection, sampling, and scale record"
      unit: "kg, %, grade code"
      frequency: "every lot"
      temporal_coverage: "declared post-harvest period"
      site_scope: "each grading point"
      aggregation_rule: "mutually exclusive grade and reject states"
      quality_evidence: "inspection sheet, sample plan, scale calibration"
    - protocol_id: cp_groundnut_storage_records
      process_id: "groundnut_storage_and_gate_handoff"
      flow_role: "storage input, loss, packaging, gate output"
      record_type: "stock and dispatch ledger"
      raw_fields: "opening stock; receipts; lot; product state; moisture or freshness; storage duration; packaging; energy; damage; closing stock; dispatch mass; gate"
      collection_method: "stock ledger, dispatch ticket, and storage log"
      unit: "kg, %, days, kWh, item"
      frequency: "receipt, inspection, and dispatch"
      temporal_coverage: "declared storage period"
      site_scope: "each storage facility"
      aggregation_rule: "opening + receipts = dispatch + closing + loss"
      quality_evidence: "stock reconciliation, dispatch ticket, freshness or moisture and pest record"
  calculation_rules:
    - id: calc_01
      applies_to: "annual crop inputs"
      rule: "Allocate field establishment, pre-harvest crop period, replacement, intercropping share, and removal over the declared crop-cycle basis and accepted output by crop year."
      inputs:
        - "field register"
        - "crop cycle"
        - "crop-year output"
        - "intercropping driver"
      output: "annualized field input per reference flow"
      source_ids:
        - fao-groundnut-sustainable-production-2023
        - iso-14044-2006
    - id: calc_02
      applies_to: "every harvest, conditioning, and storage lot"
      rule: "opening mass + inputs = accepted outputs + pod residue co-product + rejects + residues + measured losses; investigate any unexplained residual."
      inputs:
        - "lot weights and fates"
      output: "reconciled mass balance"
      source_ids:
        - mass-balance-identity
    - id: calc_03
      applies_to: "whole-pod to pod-retained lots"
      rule: "pod-retained mass = whole-pod input mass − measured pod residue and non-product losses; do not infer pod residue mass from an unrelated average when a lot record exists."
      inputs:
        - "input/output mass"
        - "pod residue record"
        - "loss record"
      output: "state- and fate-corrected product mass"
      source_ids:
        - mass-balance-identity
        - fao-groundnut-postharvest-operations
    - id: calc_04
      applies_to: "marketed pod residue co-product"
      rule: "If pod residue is intended and transferred, apply measured dry-matter mass allocation to shared harvest and pod cleaning burdens; if not intended, model residue fate without co-product credit."
      inputs:
        - "groundnut mass"
        - "pod residue mass"
        - "moisture or dry matter"
        - "declared destination"
      output: "allocated burdens and co-product share"
      source_ids:
        - iso-14044-2006
    - id: calc_05
      applies_to: "grades, downgraded, reworked, and rejected lots"
      rule: "Grade outputs must be mutually exclusive. Accepted output equals input less pod residue, declared downgraded, rework, reject, foreign-material, water-loss, and unexplained-loss terms; rework is linked once."
      inputs:
        - "batch input"
        - "grade and reject records"
      output: "normalized output rows"
      source_ids:
        - mass-balance-identity
    - id: calc_06
      applies_to: "storage"
      rule: "opening stock + receipts − dispatches − closing stock = measured storage loss; storage loss is not accepted gate output."
      inputs:
        - "stock ledger"
        - dispatches
        - "closing stock"
        - "loss records"
      output: "storage loss per storage duration"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: quality_01
      applies_to: "flow identity"
      requirement: "Use the verified Groundnuts, in shell UUID with Mass and kg. Preserve the fresh farm gate or explicitly extended-gate qualifier and do not substitute shelled, split, kernel, or water identities."
      evidence: "platform identity record; dataset metadata"
    - id: quality_02
      applies_to: "crop and harvest quantities"
      requirement: "Use calibrated scales, meters, or transparent documented estimates. Record a justified zero when a route does not use irrigation, wet cleaning, packaging, or storage."
      evidence: "calibration record; field and lot logs"
    - id: quality_03
      applies_to: "pod residue and product state"
      requirement: "Measure or document whole-pod, pod-retained-with-shell, and conditioned states separately. Retain pod residue moisture or dry-matter basis where allocation or conversion uses it."
      evidence: "batch record; scale; moisture or freshness test"
    - id: quality_04
      applies_to: "completeness"
      requirement: "Reconcile field inputs, harvest outputs, pod residue destination, conditioning outputs, rejects, residues, water loss, storage loss, and gate dispatches."
      evidence: "mass-balance workbook; stock ledger"
    - id: quality_05
      applies_to: "temporal and annual representativeness"
      requirement: "Cover the declared crop year and report crop phase, productive age, replacement events, intercropping, abnormal weather, and averaging method."
      evidence: "crop-year register; crop cycle record"
    - id: quality_06
      applies_to: "co-products and fate"
      requirement: "Evidence every intended pod residue hand-off, downgraded destination, rework loop, reject treatment, and residue fate. Do not assign credits to an unverified destination."
      evidence: "transfer note; destination record; treatment record"
    - id: quality_07
      applies_to: "geography and technology"
      requirement: "Disclose country, region, climate, soil, irrigation regime, harvest practice, pod cleaning method, grading method, storage condition, pod residue fate, and gate."
      evidence: "site description; process notes; facility record"
    - id: quality_08
      applies_to: "uncertainty and estimates"
      requirement: "Label provisional ranges as replaceable candidate-stage estimates and replace them with measured or source-backed values before reviewed or published use."
      evidence: "review record; updated foreground dataset"
validation_rules:
  - rule_id: validation_01
    applies_to: "reference flow"
    rule: "Reference product is the verified Peanut UUID with Mass and kg. The dataset declares whole-pod or extended pod-retained gate state and does not substitute a shelled or split groundnut."
    source_ids:
      - codex-groundnut-hygiene-cxc-4-1971
  - rule_id: validation_02
    applies_to: "process map"
    rule: "Every required process is present; conditional pod cleaning, cleaning, grading, and storage processes are present when the declared gate or route requires them."
    source_ids:
      - fao-groundnut-postharvest-operations
  - rule_id: validation_03
    applies_to: "annual production"
    rule: "Crop establishment, pre-harvest crop period, productive phase, replacement, intercropping attribution, and removal are linked to declared crop years and are not double-counted."
    source_ids:
      - fao-groundnut-sustainable-production-2023
      - iso-14044-2006
  - rule_id: validation_04
    applies_to: "harvest and collection"
    rule: "Harvested, collected, uncollected, damaged, residue, and accepted groundnut masses are mutually reconciled; maturity and hand-off state are declared."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_05
    applies_to: "pod cleaning and quality"
    rule: "Whole-fruit input, pod residue, accepted in-shell product, grade, downgraded/rework, reject, foreign material, water loss, and residuals are mutually exclusive and mass-balanced."
    source_ids:
      - mass-balance-identity
      - fao-groundnut-postharvest-operations
  - rule_id: validation_06
    applies_to: "storage and gate"
    rule: "Opening stock, receipts, dispatches, closing stock, storage damage, product state, storage duration, and gate output reconcile. Storage losses are excluded from accepted output."
    source_ids:
      - mass-balance-identity
      - fao-groundnut-postharvest-operations
  - rule_id: validation_07
    applies_to: "allocation and rework"
    rule: "Husk allocation, grade allocation, downgraded routes, rework loops, rejected-material treatment, and any intercropping attribution are explicit and no burden or output is counted twice."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_08
    applies_to: "evidence and disclosure"
    rule: "All important quantitative flows have a foreground collection rule and candidate range or method constraint; estimates, unresolved identities, gate state, pod residue fate, and evidence limitations are disclosed."
    source_ids:
      - fao-groundnut-postharvest-operations
      - mass-balance-identity
  - rule_id: validation_09
    applies_to: "batch and campaign records"
    rule: "Every harvest round, conditioning batch, grade lot, and storage receipt has a declared boundary, linked inputs and outputs, cleaning or changeover status, and reporting period; shared-run burdens are not counted twice."
    source_ids:
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "secondary_dataset for a reviewed groundnut-in-shell foreground dataset; may be promoted to background_dataset only after the required review and publication gates"
  downstream_use: "Construction and validation of process and lifecyclemodel projections for groundnuts in shell at the declared fresh farm gate or extended pod-retained, conditioned, or storage gate"
  allowed_use: "Field crop management, harvest, collection, pod cleaning, cleaning, grading, storage, and gate modelling when the declared product state, pod residue status, maturity, quality, crop year, geography, and allocation treatment are retained"
  excluded_use: "Shell removal, splitting, kernel processing, oil extraction, roasted or otherwise processed groundnut products, shell products, retail products, consumer use, post-gate logistics, and unreported product categories"
  required_metadata: "reference UUID; Mass property and Units of mass unit group; CPC 3.0 01422; cultivar; geography; crop phase and age; crop year; irrigation; maturity; whole-pod or pod-retained state; pod residue fate; shell and grade quality; accepted, rejected, residue, loss, and storage records"
  required_quality_disclosure: "measurement versus estimate; freshness or moisture method; mass-balance completeness; crop-cycle and intercropping allocation; pod residue co-product allocation; rework and reject fate; storage duration; data period; geography; technology; and unresolved identity gaps"
  update_trigger: "new crop-year records, material change in crop phase or replacement, change in harvest or pod cleaning technology, new intended pod residue route, changed storage practice, evidence-backed range replacement, or platform identity revision"
