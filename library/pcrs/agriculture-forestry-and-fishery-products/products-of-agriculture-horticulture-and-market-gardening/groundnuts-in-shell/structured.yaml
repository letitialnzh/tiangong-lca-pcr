system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary runs from the declared groundnut field starting condition through crop management, harvest and collection, and the fresh farm gate hand-off of accepted groundnuts in shell. An extended route additionally includes pod cleaning that leaves the hard shell intact, cleaning, grading, storage, and the declared post-harvest gate. Upstream production of planting material, fertilizers, crop-protection products, supplied irrigation water, energy carriers, machinery services, and packaging uses representative background datasets. Shell removal, splitting, kernel processing, oil extraction, roasted or otherwise processed groundnut products, retail, post-gate transport, and post-gate storage are outside the default boundary."
      source_ids: []
    - rule_id: boundary_crop_to_farm_gate
      applies_to: "all conforming datasets"
      rule: "Include annual crop establishment, pre-harvest crop period, productive management, harvest, collection, and the declared fresh farm gate hand-off of accepted groundnuts in shell."
      source_ids:
        - fao-groundnut-sustainable-production-2023
        - iso-14044-2006
    - rule_id: boundary_pod_cleaning_extension
      applies_to: "extended post-harvest route"
      rule: "Include pod cleaning, cleaning, grading, and storage only when the declared dataset gate extends beyond the fresh whole-pod farm gate. Report the extended gate and do not relabel it as the platform fresh/unprocessed state."
      source_ids:
        - fao-groundnut-postharvest-operations
        - codex-groundnut-hygiene-cxc-4-1971
    - rule_id: boundary_annual_crop_disclosure
      applies_to: "establishment and replacement"
      rule: "Allocate establishment, pre-harvest crop period, replanting, and removal over the declared crop cycle and accepted-output basis; disclose life, pre-harvest crop period, intercropping, and replacement events."
      source_ids:
        - fao-groundnut-sustainable-production-2023
        - iso-14044-2006
    - rule_id: boundary_no_shell_removal
      applies_to: "in-shell product"
      rule: "Retain the hard shell in the product boundary. Exclude hatcheting or shell removal, splitting, kernel processing, oil extraction, roasted or otherwise processed groundnut products, and shell processing."
      source_ids:
        - codex-groundnut-hygiene-cxc-4-1971
        - fao-groundnut-postharvest-operations
    - rule_id: boundary_quality_and_fate
      applies_to: "all outputs"
      rule: "Separate accepted in-shell groundnuts, pod residue, downgraded lots, rejected fruit, foreign material, dust, water loss, storage loss, and unexplained loss by measured mass and declared fate."
      source_ids:
        - fao-groundnut-postharvest-operations
        - mass-balance-identity
boundary_abstraction:
  declared_starting_condition: "groundnut field site before or at establishment, with planting material and purchased management inputs crossing the foreground boundary; prior land use and existing field history are disclosed"
  starting_condition_role: "start of managed annual groundnut production and annual crop accounting"
  product_classification_scope: "CPC 3.0 01422, Groundnuts, in shell; shelled, split, kernel, oil, shell, and downstream processed groundnut products are outside this PCR"
  recursive_input_rule: "Same-category planting material or retained groundnuts crossing the boundary are recorded as upstream inputs and are not recursively expanded into another in-shell product output. Internal hand-offs between field, harvest, conditioning, grading, and storage are process links and are not additional market outputs."
  upstream_dataset_requirement: "Use representative upstream datasets for nursery material, nutrient products, crop protection, irrigation supply, fuel, electricity, pod cleaning or grading services, packaging, machinery services, and waste treatment when these inputs cross the boundary."
  disclosure: "cultivar and field; geography, soil, climate, and land history; establishment date, crop year, crop-cycle context, and replacement; irrigation source and quality; nutrient and crop-protection records; harvest maturity; whole-pod or pod-retained state; moisture or freshness; shell quality; grade, reject, pod residue, and storage records; gate; and any intended pod residue co-product hand-off"
