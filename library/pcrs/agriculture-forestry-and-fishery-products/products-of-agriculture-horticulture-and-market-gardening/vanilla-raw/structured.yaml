    - protocol_id: cp_residue_and_emission_records
      process_id: "perennial_vine_management"
      flow_role: "residues and emissions"
      record_type: "weighing log and calculation sheet"
      raw_fields: "material; mass; destination; substance; basis; compartment; activity; factor; method"
      collection_method: "weigh exported residues and calculate identified emissions only"
      unit: "kg"
      frequency: "each removal and calculation period"
      temporal_coverage: "complete reporting period"
      site_scope: "plot and destination"
      aggregation_rule: "reconcile destinations; aggregate after resolution"
      quality_evidence: "scale, receipt, method citation and review"
    - protocol_id: cp_selective_harvest_rounds
      process_id: "selective_pod_harvest"
      flow_role: "harvest, rejects, losses, energy"
      record_type: "lot sheet"
      raw_fields: "round/date; plot; species; maturity; masses; retained status; carrier; labour mode"
      collection_method: "weigh each round and link equipment records"
      unit: "kg; MJ; date"
      frequency: "every round"
      temporal_coverage: "all contributing rounds"
      site_scope: "plot, round and lot"
      aggregation_rule: "sum linked rounds and keep rejects separate"
      quality_evidence: "calibrated scale, signed lot sheet and energy log"
    - protocol_id: cp_primary_conditioning
      process_id: "on_farm_primary_conditioning"
      flow_role: "input, handled pods, removed matter"
      record_type: "handling sheet"
      raw_fields: "lot; input/output mass; holding time; operations; rejects/destination; no-curing declaration"
      collection_method: "weigh before/after and document no curing or deliberate drying"
      unit: "kg; hour"
      frequency: "every lot"
      temporal_coverage: "all contributing lots"
      site_scope: "handling area and lot"
      aggregation_rule: "reconcile input, output, rejects and loss"
      quality_evidence: "calibrated scale, time log, checklist and photos/equivalent"
    - protocol_id: cp_green_pod_grading
      process_id: "green_pod_grading_handoff"
      flow_role: "accepted grade, off-grade, rework, hand-off"
      record_type: "grading/dispatch record"
      raw_fields: "lot; species; maturity; grade; input; accepted; off-grade; rework; destination; date; uncured state"
      collection_method: "weigh each state and link accepted lots to pre-curing dispatch"
