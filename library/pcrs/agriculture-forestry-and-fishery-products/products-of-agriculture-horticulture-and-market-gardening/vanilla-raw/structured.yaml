      frequency: "every lot"
      temporal_coverage: "all contributing lots"
      site_scope: "grading site and lot"
      aggregation_rule: "reconcile all states and remove rework duplication"
      quality_evidence: "calibrated scale, grade specification, dispatch and no-curing declaration"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributed amount / accepted reference mass"
      inputs:
        - "attributed amount"
        - "accepted mass"
      output: "amount per kg reference product"
