validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Require fixed UUID, Mass property/unit group and all qualifiers; reject cured, dried, aroma-developed, plant-gate cleaned/sorted goods and extract."
    source_ids:
      - fao-vanilla-postharvest-compendium
  - rule_id: validate_process_topology
    applies_to: "process map"
    rule: "Require all four nodes and hand-offs; harvest links to standing vines and conditioning/grading remain before curing."
    source_ids:
      - fao-vanilla-postharvest-compendium
  - rule_id: validate_maturity_grade_species
    applies_to: "every accepted lot"
    rule: "Require species, maturity criterion, grade, green uncured state and farm-gate hand-off."
    source_ids:
      - fao-vanilla-postharvest-compendium
  - rule_id: validate_period_attribution
    applies_to: "perennial and shared burdens"
    rule: "Require phase, service-period, consuming-node and attribution evidence; fail omission or duplication."
