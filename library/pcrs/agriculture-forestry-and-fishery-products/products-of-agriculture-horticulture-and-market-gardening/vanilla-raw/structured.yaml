allocation_rules:
  - rule_id: allocation_perennial_periods
    applies_to: "establishment, replacement and productive years"
    rule: "Attribute once across the declared productive period using accepted green-pod mass from that period; retain phase/year links and disclose unproductive years."
    source_ids: []
  - rule_id: allocation_repeated_harvest
    applies_to: "selective harvest rounds"
    rule: "Assign round-specific inputs, energy, rejects and output directly; allocate truly shared burdens by harvested mass across relevant rounds without period-level duplication."
    source_ids: []
  - rule_id: allocation_shared_infrastructure
    applies_to: "supports, shade, irrigation, tools and other shared assets"
    rule: "Enumerate consuming nodes and service periods, choose one documented use-time, area or productive-output basis and prevent duplication."
    source_ids: []
  - rule_id: allocation_rejects
    applies_to: "residues and rejected or off-grade pods"
    rule: "Discard receives no avoided-burden credit; a recovered product leaving the boundary is separate and requires disclosed allocation or substitution and sensitivity."
    source_ids: []
  - rule_id: allocation_single_reference_product
    applies_to: "accepted green uncured pods"
    rule: "The baseline has one intended reference product; rejects, incidental matter, retained immature pods and residues cannot become co-products merely to reduce burden."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_perennial_vine_records
      process_id: "perennial_vine_management"
      flow_role: "propagation, vine phases, support, pollination, standing crop"
      record_type: "field register"
      raw_fields: "species; source; mass; vine count/age; establishment/replacement; support/shade; pollination; dates; harvest-ready mass"
      collection_method: "Reconcile plot, propagation and observation records by route and period; Raw aggregation and attribution: stratify before attribution and aggregation"
      unit: "kg; count; date"
      frequency: "each event and season"
      temporal_coverage: "all burden-bearing years"
      site_scope: "farm and plot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "dated records, invoices, species record and sign-off"
    - protocol_id: cp_management_inputs
      process_id: "perennial_vine_management"
      flow_role: "nutrients, irrigation, energy"
      record_type: "invoice, log, meter"
      raw_fields: "product; composition; mass; water source/volume; pump hours/rate; carrier/quantity; node; date"
      collection_method: "record each event and calculate only with verified factors; Raw aggregation and attribution: sum by actual product/carrier before normalization"
      unit: "kg; m3; kWh; L; MJ"
      frequency: "each application or meter interval"
      temporal_coverage: "complete reporting period"
      site_scope: "farm, plot and equipment route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, calibration, log and factor record"
    - protocol_id: cp_residue_and_emission_records
      process_id: "perennial_vine_management"
      flow_role: "residues and emissions"
      record_type: "weighing log and calculation sheet"
      raw_fields: "material; mass; destination; substance; basis; compartment; activity; factor; method"
      collection_method: "weigh exported residues and calculate identified emissions only; Raw aggregation and attribution: reconcile destinations; aggregate after resolution"
      unit: "kg"
      frequency: "each removal and calculation period"
      temporal_coverage: "complete reporting period"
      site_scope: "plot and destination"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale, receipt, method citation and review"
    - protocol_id: cp_selective_harvest_rounds
      process_id: "selective_pod_harvest"
      flow_role: "harvest, rejects, losses, energy"
      record_type: "lot sheet"
      raw_fields: "round/date; plot; species; maturity; masses; retained status; carrier; labour mode"
      collection_method: "weigh each round and link equipment records; Raw aggregation and attribution: sum linked rounds and keep rejects separate"
      unit: "kg; MJ; date"
      frequency: "every round"
      temporal_coverage: "all contributing rounds"
      site_scope: "plot, round and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, signed lot sheet and energy log"
    - protocol_id: cp_primary_conditioning
      process_id: "on_farm_primary_conditioning"
      flow_role: "input, handled pods, removed matter"
      record_type: "handling sheet"
      raw_fields: "lot; input/output mass; holding time; operations; rejects/destination; no-curing declaration"
      collection_method: "weigh before/after and document no curing or deliberate drying; Raw aggregation and attribution: reconcile input, output, rejects and loss"
      unit: "kg; hour"
      frequency: "every lot"
      temporal_coverage: "all contributing lots"
      site_scope: "handling area and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, time log, checklist and photos/equivalent"
    - protocol_id: cp_green_pod_grading
      process_id: "green_pod_grading_handoff"
      flow_role: "accepted grade, off-grade, rework, hand-off"
      record_type: "grading/dispatch record"
      raw_fields: "lot; species; maturity; grade; input; accepted; off-grade; rework; destination; date; uncured state"
      collection_method: "weigh each state and link accepted lots to pre-curing dispatch; Raw aggregation and attribution: reconcile all states and remove rework duplication"
      unit: "kg; date"
      frequency: "every lot"
      temporal_coverage: "all contributing lots"
      site_scope: "grading site and lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, grade specification, dispatch and no-curing declaration"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributed amount / accepted reference mass"
      inputs:
        - "attributed amount"
        - "accepted mass"
      output: "amount per kg reference product"
      source_ids:
        - reference-normalization-definition
    - id: calc_period_attribution
      applies_to: "establishment, replacement, shared infrastructure"
      rule: "attributed burden = recorded burden × documented service share"
      inputs:
        - burden
        - nodes
        - period
        - "share basis"
      output: "period-attributed burden"
      source_ids: []
    - id: calc_harvest_round_sum
      applies_to: "repeated selective harvest"
      rule: "period mass = sum of linked round masses; rejects and retained pods separate"
      inputs:
        - round
        - harvested
        - reject
        - "retained status"
      output: "period harvested/rejected mass"
      source_ids: []
    - id: calc_mass_reconciliation
      applies_to: "handling and grading"
      rule: "difference = input - accepted - rejects - retained/transferred outputs"
      inputs:
        - "input and all state masses"
      output: "difference and completeness flag"
      source_ids:
        - reference-normalization-definition
  data_quality_requirements:
    - id: dq_identity_state
      applies_to: "reference product and lots"
      requirement: "Species, maturity, grade, uncured/undried state, moisture basis and farm-gate hand-off are complete."
      evidence: "species, grade, lot, no-curing and dispatch records"
    - id: dq_temporal_completeness
      applies_to: "perennial route and harvest"
      requirement: "Cover all burden-bearing phases and contributing rounds and disclose exclusions."
      evidence: "plot history, phase, round and replacement records"
    - id: dq_route_separation
      applies_to: "alternative routes"
      requirement: "Preserve route differences until weighting is reproducible."
      evidence: "route-coded records and aggregation sheet"
    - id: dq_mass_balance
      applies_to: "harvest, handling, grading"
      requirement: "Reconcile each round/lot and investigate differences beyond site tolerance."
      evidence: "signed balance and calibration record"
    - id: dq_flow_resolution
      applies_to: "concrete flow identity evidence"
      requirement: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
      evidence: "exchange-resolution and detail evidence"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Require fixed UUID, Mass property/unit group and all qualifiers; reject cured, dried, aroma-developed, plant-gate cleaned/sorted goods and extract."
    source_ids:
      - fao-vanilla-postharvest-compendium
  - rule_id: validate_process_topology
    applies_to: "process map"
    rule: "Require all four nodes and hand-offs; harvest links to standing vines and conditioning/grading remain before curing."
    source_ids:
      - fao-vanilla-postharvest-compendium
  - rule_id: validate_maturity_grade_species
    applies_to: "every accepted lot"
    rule: "Require species, maturity criterion, grade, green uncured state and farm-gate hand-off."
    source_ids:
      - fao-vanilla-postharvest-compendium
  - rule_id: validate_period_attribution
    applies_to: "perennial and shared burdens"
    rule: "Require phase, service-period, consuming-node and attribution evidence; fail omission or duplication."
    source_ids: []
  - rule_id: validate_round_completeness
    applies_to: "repeated selective harvest"
    rule: "Require complete ordered rounds and reconcile harvested, rejected, retained and lost states."
    source_ids: []
  - rule_id: validate_reject_routing
    applies_to: "rejected and off-grade states"
    rule: "Each state links to one rework, downgraded/recovered exit or discard destination and is excluded from accepted output."
    source_ids: []
  - rule_id: validate_flow_bindings
    applies_to: "all cards"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_mass_balance
    applies_to: "harvest, handling and grading"
    rule: "Reconcile inputs and outputs by round/lot and explain mass loss."
    source_ids:
      - reference-normalization-definition
published_dataset_profile:
  dataset_role: "Foreground production package for mature green uncured vanilla pods at farm gate"
  downstream_use: "secondary_dataset; background_dataset after independent review and geography, time and technology matching"
  allowed_use: "Farm-gate LCA of green raw pods and upstream input to a separately modelled curing system"
  excluded_use: "Cured/dried pods, plant-gate cleaned/sorted goods, extract, powder or unspecified aromatic vanilla product"
  required_metadata: "species; plot/geography; support/shade; pollination; vine phase/productive period; replacements; rounds; maturity/grade; moisture; uncured state; reject destinations; hand-off"
  required_quality_disclosure: "phase/round coverage; route separation; flow resolution; meter/scale quality; mass balance; shared infrastructure attribution; exclusions; provisional-range status"
  update_trigger: "Change in species, route, period attribution, maturity/grade, hand-off state, topology, reference UUID, concrete flow identity verification"
data_sources:
  - id: "fao-vanilla-postharvest-compendium"
    type: "official_guidance"
    reference: "Food and Agriculture Organization of the United Nations, *Vanilla: Post-harvest Operations*, Post-harvest Compendium"
    used_for: "Production/harvest sequence; green mature pods mostly odourless; curing as separate aroma-development operation; pre-curing boundary and exclusions"
  - id: "reference-normalization-definition"
    type: "method_factor"
    reference: "This PCR 1 kg as-received reference normalization and node mass-balance identity"
    used_for: "Exact reference output, normalization and mass reconciliation"
