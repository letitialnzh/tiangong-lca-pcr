      unit: "kg; m3; kWh; L; MJ"
      frequency: "each application or meter interval"
      temporal_coverage: "complete reporting period"
      site_scope: "farm, plot and equipment route"
      aggregation_rule: "sum by actual product/carrier before normalization"
