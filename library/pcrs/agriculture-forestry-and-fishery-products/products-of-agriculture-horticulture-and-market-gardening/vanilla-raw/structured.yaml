  - rule_id: validate_round_completeness
    applies_to: "repeated selective harvest"
    rule: "Require complete ordered rounds and reconcile harvested, rejected, retained and lost states."
    source_ids: []
  - rule_id: validate_reject_routing
    applies_to: "rejected and off-grade states"
