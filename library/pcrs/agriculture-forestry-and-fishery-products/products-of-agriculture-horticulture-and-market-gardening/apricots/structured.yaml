validation_rules:
  - rule_id: validation_apricot_reference_definition
    applies_to: "reference flow"
    rule: "Require 1,000 kg accepted fresh apricot fruit, declared hand-off condition, required qualifiers, and later-resolved reference identity before publication."
    source_ids:
      - iso-14067
  - rule_id: validation_apricot_orchard_periods
    applies_to: "establishment and management"
    rule: "Check that orchard establishment, non-bearing periods, replacement events, productive years, and annualization basis are declared and not double counted."
    source_ids:
      - fao-stone-fruit-production-guide
      - iso-14067
  - rule_id: validation_apricot_mass_balance
    applies_to: "harvest and primary handling"
    rule: "Check incoming fruit = accepted fruit + rejects + measured losses within the declared tolerance and trace every rejected destination."
    source_ids:
