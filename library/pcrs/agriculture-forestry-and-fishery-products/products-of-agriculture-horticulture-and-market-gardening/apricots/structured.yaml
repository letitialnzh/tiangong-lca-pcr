allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Allocate orchard establishment, replacement trees, shared machinery, irrigation infrastructure, and other multi-period inputs across the declared orchard life and reporting periods using orchard area, productive years, and accepted fruit output. Do not silently annualize non-bearing years; disclose the selected productive-life horizon and replacement events. Where apricot fruit is split among fresh, processing, feed, compost, or disposal destinations, retain separate masses. Use physical mass allocation when products have comparable moisture and function; otherwise use a documented economic or quality-based allocation and report the selected basis. Avoid allocation by treating rejected fruit as a co-product unless it has a declared market or service; otherwise record it as a waste or residue flow with its destination. Do not double count orchard inputs embedded in an upstream planting-material dataset."
    source_ids: []
  - rule_id: allocation_orchard_life_and_period
    applies_to: "establishment, replacement, and shared orchard assets"
    rule: "Allocate multi-period inputs to the declared orchard-year and accepted fruit output using the declared orchard life, productive years, area, and yield records."
    source_ids:
      - fao-stone-fruit-production-guide
      - iso-14067
  - rule_id: allocation_apricot_destinations
    applies_to: "fresh, processing, feed, compost, and disposal destinations"
    rule: "Keep destination masses separate; use documented physical or economic allocation only when more than one declared product or service shares a process."
    source_ids:
      - iso-14044
  - rule_id: allocation_rejects_and_residues
    applies_to: "rejected fruit and orchard residues"
    rule: "Treat material without a declared product or service as waste or residue and model its destination; do not grant a co-product credit solely because it has a possible downstream use."
    source_ids:
      - iso-14044
      - ipcc-2019-refinement
