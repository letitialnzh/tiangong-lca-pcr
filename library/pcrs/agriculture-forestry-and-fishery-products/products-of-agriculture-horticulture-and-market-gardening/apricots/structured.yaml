  - rule_id: validation_apricot_flow_bindings
    applies_to: "all flow cards"
    rule: "Use the narrowest applicable Flow Set group first; use a fixed UUID only after exact verification for an uncovered flow; otherwise preserve unmapped coverage without changing true semantics."
