system_boundary:
  rules:
    - rule_id: boundary_species_lot
      applies_to: "all routes"
      rule: "Include exactly one residual cultivated nut species and declared lot or aggregation rule; exclude named CPC nut leaves, wild nuts, groundnuts, and mixed-species pooling."
      source_ids: []
    - rule_id: boundary_productive_period
      applies_to: "orchard route"
      rule: "Include annual productive operations, harvest, direct field emissions, annualized establishment, and replacement burdens attributable to the declared harvest year."
      source_ids: []
    - rule_id: boundary_postharvest
      applies_to: "conditioned route"
      rule: "Include only actual outer-hull removal, cleaning, drying, grading, and packing before the declared gate; retain matched batch balances and moisture states."
      source_ids:
        - fao-codex-tree-nut-aflatoxin
    - rule_id: boundary_food_safety
      applies_to: "drying and storage"
      rule: "Record elapsed time to drying, drying method, moisture endpoint, storage conditions, and rejected mould-damaged material needed to evaluate contamination prevention."
      source_ids:
        - fao-codex-tree-nut-aflatoxin
    - rule_id: boundary_downstream_exclusion
      applies_to: "all routes"
      rule: "Stop before hard-shell cracking, kernel separation, roasting, salting, food manufacture, distribution, retail, and consumption."
      source_ids: []
    - rule_id: boundary_direct_emissions
      applies_to: "soil and on-site combustion"
      rule: "Calculate managed-soil and on-site combustion emissions from the same nutrient, residue, and fuel records used in the inventory."
      source_ids:
        - ipcc-2019-managed-soils
