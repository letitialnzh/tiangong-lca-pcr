allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "field, conditioning, treatment, packaging, storage, and delivery"
    rule: "Avoid allocation where records permit by separating seed multiplication, conditioning, treatment, packaging, storage, reject handling, and residue management into distinct process responsibilities."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_output_completeness
    applies_to: "accepted seed and non-reference outputs"
    rule: "Before selecting an allocation method, enumerate accepted seed, intended co-products, harvested intermediate crop, screenings, rejected seed, losses, residues, packaging waste, and each declared fate."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_method_selection
    applies_to: "shared burdens"
    rule: "If burdens remain shared, declare the selected physical or economic relationship, reporting period, data basis, and sensitivity. Do not use a module or PCR default quantity as the allocation answer."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_seed_quality
    applies_to: "seed class and quality release"
    rule: "Do not allocate solely from seed quality labels. Keep lot acceptance, quality release, accepted seed, and non-accepted destinations traceable to measured outputs and the declared decision."
    source_ids:
      - fao-sorghum-seed-production
      - iso-14044-2006
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Screenings, rejects, dust, field residues, storage losses, and packaging waste are not co-products merely because they have a possible use. Treat an output as a co-product only when the data package declares intended production, transfer or sale, quality, quantity, destination, and a defensible attribution decision."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_source_seed_lot
      process_id: "sorghum_seed_multiplication"
      flow_role: "source seed lot"
      record_type: "lot and sowing record"
      raw_fields: "lot id; variety or hybrid status; seed class; supplier or source; treatment; mass; sowing date; field"
      collection_method: "lot certificate, invoice, sowing log, and calibrated scale"
      unit: "kg and declared attributes"
      frequency: "each lot and crop cycle"
      temporal_coverage: "complete crop cycle"
      site_scope: "field or seed farm"
      aggregation_rule: "sum by lot and link to planted area"
      quality_evidence: "lot certificate and scale record"
    - protocol_id: cp_nutrient_records
      process_id: "sorghum_seed_multiplication"
      flow_role: "nutrient and soil-amendment input"
      record_type: "input ledger"
      raw_fields: "product; formulation; nutrient content; mass; field; date; supplier; application method"
      collection_method: "invoices, application logs, and field records"
      unit: "kg product and kg nutrient"
      frequency: "each application"
      temporal_coverage: "crop cycle"
      site_scope: "field or block"
      aggregation_rule: "sum by product and nutrient"
      quality_evidence: "invoice and application record"
    - protocol_id: cp_irrigation_records
      process_id: "sorghum_seed_multiplication"
      flow_role: "delivered irrigation and withdrawal"
      record_type: "meter or pumping record"
      raw_fields: "source; meter; readings; volume; pumping energy; date; field"
      collection_method: "calibrated meter, pumping log, or invoice"
      unit: "m3, kg, and energy unit"
      frequency: "each event or reporting period"
      temporal_coverage: "irrigation period"
      site_scope: "field and water source"
      aggregation_rule: "distinguish withdrawal, delivery, consumption, and loss"
      quality_evidence: "meter calibration and readings"
    - protocol_id: cp_field_energy_records
      process_id: "sorghum_seed_multiplication"
      flow_role: "field energy"
      record_type: "machinery or fuel record"
      raw_fields: "operation; carrier; quantity; equipment; field; date"
      collection_method: "fuel ledger, machinery record, or measured operation"
      unit: "L, kg, MJ, or kWh"
      frequency: "each operation"
      temporal_coverage: "crop cycle"
      site_scope: "field and machinery group"
      aggregation_rule: "sum by operation and carrier"
      quality_evidence: "invoice or machinery record"
    - protocol_id: cp_crop_protection_records
      process_id: "sorghum_seed_multiplication"
      flow_role: "crop protection"
      record_type: "application record"
      raw_fields: "product; active substance; application rate; area; date; field; conditions"
      collection_method: "application log and product label"
      unit: "kg product, kg active substance, or declared unit"
      frequency: "each application"
      temporal_coverage: "crop cycle"
      site_scope: "field or block"
      aggregation_rule: "sum by product and active substance"
      quality_evidence: "application log and label"
    - protocol_id: cp_land_and_output_records
      process_id: "sorghum_seed_multiplication"
      flow_role: "land, harvest, and field outputs"
      record_type: "field and harvest record"
      raw_fields: "area; crop-cycle dates; crop year; harvested mass; moisture; residues; fate"
      collection_method: "field register, weighbridge, and moisture record"
      unit: "ha, day, kg, and percent"
      frequency: "each field and harvest event"
      temporal_coverage: "crop cycle"
      site_scope: "field or block"
      aggregation_rule: "reconcile area, duration, harvest, and fates"
      quality_evidence: "field register and calibrated weighing"
    - protocol_id: cp_conditioning_input
      process_id: "sorghum_seed_conditioning_and_treatment"
      flow_role: "received seed crop"
      record_type: "receiving record"
      raw_fields: "lot; received mass; moisture; source field; date; transfer"
      collection_method: "receiving weighing and moisture test"
      unit: "kg and percent"
      frequency: "each lot"
      temporal_coverage: "conditioning period"
      site_scope: "facility and lot"
      aggregation_rule: "sum by lot on a common moisture basis"
      quality_evidence: "scale and moisture record"
    - protocol_id: cp_conditioning_energy_records
      process_id: "sorghum_seed_conditioning_and_treatment"
      flow_role: "electricity and drying heat"
      record_type: "utility and fuel record"
      raw_fields: "operation; carrier; meter; quantity; date; batch or period"
      collection_method: "meter, invoice, fuel record, and batch log"
      unit: "kWh, MJ, L, or kg"
      frequency: "each batch or period"
      temporal_coverage: "conditioning period"
      site_scope: "facility and line"
      aggregation_rule: "allocate only with documented driver"
      quality_evidence: "meter and invoice"
    - protocol_id: cp_seed_treatment_records
      process_id: "sorghum_seed_conditioning_and_treatment"
      flow_role: "treatment material"
      record_type: "treatment-batch record"
      raw_fields: "product; active substance; application rate; treated mass; lot; date"
      collection_method: "batch sheet and product record"
      unit: "kg product and kg treated seed"
      frequency: "each lot"
      temporal_coverage: "conditioning period"
      site_scope: "facility and lot"
      aggregation_rule: "sum by product, active substance, and treated output"
      quality_evidence: "batch sheet and label"
    - protocol_id: cp_packaging_records
      process_id: "sorghum_seed_conditioning_and_treatment"
      flow_role: "packaging"
      record_type: "packaging ledger"
      raw_fields: "material; specification; items; mass; capacity; lot; date"
      collection_method: "material issue record and weighing"
      unit: "kg, m2, or item"
      frequency: "each batch or period"
      temporal_coverage: "conditioning period"
      site_scope: "facility"
      aggregation_rule: "sum by material and package state"
      quality_evidence: "inventory record and weighing"
    - protocol_id: cp_accepted_seed_output
      process_id: "sorghum_seed_conditioning_and_treatment"
      flow_role: "accepted reference output"
      record_type: "quality and dispatch record"
      raw_fields: "lot; accepted mass; moisture; purity; germination or viability; treatment; packaging; gate"
      collection_method: "quality certificate, weighing, and dispatch record"
      unit: "kg and declared quality units"
      frequency: "each lot"
      temporal_coverage: "declared reporting period"
      site_scope: "facility and gate"
      aggregation_rule: "sum only after quality release"
      quality_evidence: "certificate and calibrated scale"
    - protocol_id: cp_reject_and_screening_records
      process_id: "sorghum_seed_conditioning_and_treatment"
      flow_role: "screenings and rejected material"
      record_type: "screening and disposition record"
      raw_fields: "lot; material; mass; moisture; fate; destination type"
      collection_method: "screening log and disposition record"
      unit: "kg and declared fate"
      frequency: "each lot"
      temporal_coverage: "conditioning period"
      site_scope: "facility"
      aggregation_rule: "sum by material and fate"
      quality_evidence: "weighing and disposition record"
    - protocol_id: cp_packaging_waste_records
      process_id: "sorghum_seed_conditioning_and_treatment"
      flow_role: "packaging waste"
      record_type: "waste log"
      raw_fields: "material; mass; source; fate; date"
      collection_method: "waste log and transfer record"
      unit: "kg"
      frequency: "each batch or period"
      temporal_coverage: "conditioning period"
      site_scope: "facility"
      aggregation_rule: "sum by material and fate"
      quality_evidence: "waste transfer record"
    - protocol_id: cp_conditioning_emissions
      process_id: "sorghum_seed_conditioning_and_treatment"
      flow_role: "dust and direct emissions"
      record_type: "emission record"
      raw_fields: "source; substance; quantity; method; date; line"
      collection_method: "measurement or documented calculation"
      unit: "kg"
      frequency: "each batch or period"
      temporal_coverage: "conditioning period"
      site_scope: "facility"
      aggregation_rule: "sum by emission pathway"
      quality_evidence: "monitoring record or method sheet"
    - protocol_id: cp_storage_and_delivery_records
      process_id: "sorghum_seed_storage_and_delivery"
      flow_role: "storage energy, transport, and losses"
      record_type: "storage and dispatch record"
      raw_fields: "opening mass; closing mass; moisture; storage duration; energy; route; distance; load; loss; gate"
      collection_method: "inventory, meters, moisture, transport, and dispatch records"
      unit: "kg, percent, day, kWh, MJ, and declared transport unit"
      frequency: "each lot or period"
      temporal_coverage: "declared storage and delivery period"
      site_scope: "facility, carrier, and gate"
      aggregation_rule: "reconcile transfers, moisture, accepted output, and losses"
      quality_evidence: "scale, meter, moisture, and dispatch records"
  calculation_rules:
    - id: calculate_reference_output
      applies_to: "accepted sorghum seed"
      rule: "use the quality-released net accepted mass at the declared moisture basis and gate as the reference output"
      inputs:
        - cp_accepted_seed_output
      output: "kg reference output"
      source_ids:
        - mass-balance-identity
    - id: convert_moisture_basis
      applies_to: "harvest, drying, conditioning, and storage"
      rule: "dry matter = wet mass × (1 − moisture fraction); target-basis mass = dry matter / (1 − target moisture fraction)"
      inputs:
        - cp_conditioning_input
        - cp_accepted_seed_output
        - cp_storage_and_delivery_records
      output: "common-basis mass"
      source_ids:
        - mass-balance-identity
        - fao-grain-postharvest-systems
    - id: calculate_water_withdrawal
      applies_to: "irrigation"
      rule: "normalize source withdrawal by reference output and report delivered water, consumption, and conveyance loss separately"
      inputs:
        - cp_irrigation_records
        - cp_accepted_seed_output
      output: "water quantity per kg reference output"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: calculate_direct_soil_n2o
      applies_to: "field nitrogen"
      rule: "apply the selected IPCC or accepted regional method and document any N2O-N to N2O conversion"
      inputs:
        - cp_nutrient_records
        - "selected method factor"
      output: "kg N2O per kg reference output"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calculate_energy_normalization
      applies_to: "field, conditioning, storage, and delivery energy"
      rule: "sum measured energy by process and carrier, then normalize to accepted reference output without merging energy with material or water quantities"
      inputs:
        - "energy protocols"
        - cp_accepted_seed_output
      output: "MJ, kWh, or carrier quantity per kg reference output"
      source_ids:
        - mass-balance-identity
    - id: calculate_output_fates
      applies_to: "field, conditioning, storage, and delivery"
      rule: "on a common moisture basis, reconcile accepted seed + intended co-products + rejects + losses + declared residues to measured input and disclose any unexplained difference"
      inputs:
        - "all output protocols"
      output: "output reconciliation and evidence gap difference"
      source_ids:
        - mass-balance-identity
        - fao-grain-cleaning-treatment
    - id: calculate_seed_count_to_mass
      applies_to: "seed-count records"
      rule: "convert count to mass using the recorded thousand-seed mass or another documented lot-specific conversion"
      inputs:
        - cp_source_seed_lot
        - cp_accepted_seed_output
      output: "kg seed"
      source_ids:
        - fao-sorghum-seed-production
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference output and every lot"
      requirement: "Declare seed class, variety or hybrid status, lot identity, geography, crop cycle, reporting period, gate, moisture basis, treatment status, and quality-release basis."
      evidence: "lot certificate, field records, quality certificate, and dispatch record"
    - id: dq_flow_resolution
      applies_to: "all parameterized rows"
      requirement: "Before final TIDAS exchange publication, resolve each parameterized Flow Set row to a verified platform UUID and retain the selected group and project context."
      evidence: "final exchange and Flow Set selection record"
    - id: dq_input_completeness
      applies_to: "field and conditioning inventory"
      requirement: "Provide a quantity, justified zero, or documented exclusion for source seed, nutrients, irrigation, crop protection, land, field energy, pumping, drying, conditioning, treatment, packaging, storage, transport, and direct emissions."
      evidence: "ledgers, logs, meters, invoices, and method statement"
    - id: dq_moisture_and_mass
      applies_to: "harvest, conditioning, storage, and delivery"
      requirement: "Use calibrated mass and moisture records and reconcile received, dried, accepted, rejected, lost, and transferred material on a common basis."
      evidence: "weighing calibration, moisture tests, and reconciliation"
    - id: dq_quality_evidence
      applies_to: "seed quality and release"
      requirement: "Preserve test method, sample basis, lot coverage, laboratory or inspector identity, results, and release decision for purity, germination or viability, moisture, and treatment status."
      evidence: "quality certificate and testing record"
    - id: dq_representativeness
      applies_to: "published dataset profile"
      requirement: "Disclose time, geography, variety, seed class, production system, technology, facility, storage, transport, and gate coverage and explain deviations from the declared route."
      evidence: "sampling plan and dataset metadata"
    - id: dq_parameterized_identity
      applies_to: "Flow Set selections"
      requirement: "Record the final fixed UUID selected from each applicable Flow Set and verify property, unit, direction, flow type, geography, and process role before publishing the process exchange."
      evidence: "final exchange and identity preflight"
validation_rules:
  - rule_id: validation_reference_binding
    applies_to: "reference product and accepted output"
    rule: "Confirm that the reference product uses the verified Sorghum, seed UUID and that the declared seed gate, moisture basis, and lot qualifiers are present."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_binding_coordinates
    applies_to: "all bound rows"
    rule: "Confirm that each bound row uses only fixed or parameterized; each fixed row has a verified UUID, and each parameterized row names an existing Flow Set, version, and compatible group or coordinate."
    source_ids: []
  - rule_id: validation_flow_coordinates
    applies_to: "all inventory rows"
    rule: "Confirm that direction and flow type match the structural coordinate: materials, nutrients, water, energy, packaging, and transport are product inputs; accepted and intermediate products are product outputs; resources are elementary inputs; emissions are elementary outputs; rejects and residues remain waste or unmapped coverage as appropriate."
    source_ids: []
  - rule_id: validation_quality_identity
    applies_to: "accepted seed output"
    rule: "Confirm seed class, lot, variety or hybrid status, moisture basis, purity, germination or viability, treatment, geography, reporting period, and gate are complete."
    source_ids:
      - fao-sorghum-seed-production
  - rule_id: validation_moisture_and_mass_balance
    applies_to: "harvest, conditioning, storage, and delivery"
    rule: "Confirm common-basis reconciliation and declared fates for accepted seed, intended co-products, rejects, screenings, dust, residues, packaging waste, and losses."
    source_ids:
      - fao-grain-postharvest-systems
      - mass-balance-identity
  - rule_id: validation_nutrient_and_emissions
    applies_to: "nutrient inputs and field emissions"
    rule: "Confirm formulated product mass is distinct from nutrient mass and that the nitrogen-emission method, unit conversion, and receiving compartment are declared."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_water
    applies_to: "irrigation and withdrawal"
    rule: "Confirm source withdrawal, delivered irrigation, consumption, and conveyance loss are distinct and not double counted."
    source_ids:
      - fao-crop-evapotranspiration-56
  - rule_id: validation_allocation
    applies_to: "shared burdens and outputs"
    rule: "Confirm process separation was considered first, output fates are complete, the allocation method is stated, and sensitivity is reported when material."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_coverage
    applies_to: "evidence gap flow identities"
    rule: "Report every row without a fixed UUID or applicable Flow Set as unmapped coverage and do not promote it to a final TIDAS exchange until resolved."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground secondary dataset with linked upstream material, energy, water, transport, treatment, and waste-service data"
  downstream_use: "construct sorghum seed supply processes and lifecycle models and compare sorghum sowing-seed routes under declared quality, geography, gate, and reporting-period conditions"
  allowed_use: "sowing sorghum seed with compatible seed class, variety or hybrid status, geography, crop cycle, moisture basis, quality status, treatment, packaging, storage, and gate"
  excluded_use: "commodity sorghum grain; sweet, forage, or silage sorghum; food or feed processing; downstream sorghum cultivation; incompatible gate, moisture, quality, or treatment state; datasets with unexplained output losses"
  required_metadata: "reference flow and UUID; seed class; lot and variety or hybrid status; geography; crop cycle and reporting period; production system; irrigation; nutrients; crop protection; land; field and conditioning energy; harvest moisture; purity; germination or viability; treatment; packaging; storage; transport; gate; output fates; allocation; and data-quality disclosure"
  required_quality_disclosure: "raw-record coverage; time and geography; seed class and lot traceability; scale and moisture calibration; parameterized Flow Set resolution; nutrient and emission methods; water source; energy carriers; treatment; storage; gate; exclusions; allocation; sensitivity; and module selection results"
  update_trigger: "material change in seed class, variety, production route, gate, moisture convention, quality standard, irrigation, nutrient or crop-protection practice, conditioning technology, treatment, storage duration, packaging, transport, output fate, Flow Set contract, or evidence status"
