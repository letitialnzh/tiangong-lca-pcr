system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary runs from the declared source seed lot or other declared seed-production starting condition to accepted sorghum sowing seed at the declared seed gate. It includes field preparation, sowing, nutrient management, irrigation where applicable, crop protection, rouging or field inspection when material, field operations, harvest, threshing or shelling where applicable, field-to-facility movement when inside the gate, drying, cleaning, grading, quality testing, treatment, packaging, storage, and delivery when the declared gate is delivered seed."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Upstream production of purchased nutrient products, energy carriers, packaging, treatment materials, and treatment services is represented by linked background data. Commodity sorghum production, sweet sorghum, food or feed processing, milling, downstream cultivation, retail, and consumer use are outside the default boundary. The harvested seed crop entering conditioning is an intermediate hand-off and must remain distinct from the accepted sowing-seed reference output."
      source_ids: []
    - rule_id: boundary_seed_production
      applies_to: "field and seed-facility route"
      rule: "Include the declared starting seed or seed-production condition, field production, harvest, threshing or shelling where applicable, drying, cleaning, grading, quality testing, treatment, packaging, storage, and delivery only to the declared gate."
      source_ids:
        - fao-sorghum-seed-production
        - fao-grain-postharvest-systems
    - rule_id: boundary_gate_definition
      applies_to: "reference product"
      rule: "Use the seed plant or farm gate by default. A delivered-seed gate requires storage or delivery records, losses, packaging state, and gate hand-off evidence."
      source_ids:
        - fao-sorghum-seed-production
        - mass-balance-identity
    - rule_id: boundary_input_completeness
      applies_to: "all foreground routes"
      rule: "Address source seed, nutrients, irrigation, crop protection, land, field energy, pumping, drying, conditioning energy, treatment materials, packaging, storage, and direct emissions with a collected value, justified zero, or documented exclusion."
      source_ids:
        - ipcc-2019-cropland
        - ipcc-2019-managed-soils-n2o
    - rule_id: boundary_quality_separation
      applies_to: "sorghum seed outputs"
      rule: "Separate accepted seed, intended co-products, harvested intermediate crop, screenings, rejected seed, broken or damaged seed, dust, storage losses, packaging waste, and other residues by measured mass and declared fate."
      source_ids:
        - fao-sorghum-seed-production
        - fao-grain-cleaning-treatment
        - mass-balance-identity
    - rule_id: boundary_moisture_reconciliation
      applies_to: "harvest, drying, conditioning, and storage"
      rule: "Reconcile inputs and outputs on one declared moisture basis and disclose water removed during drying or lost during storage."
      source_ids:
        - fao-sorghum-seed-production
        - fao-grain-postharvest-systems
        - mass-balance-identity
