allocation_rules:
  - rule_id: allocation_avoid_subdivision
    applies_to: "shared activities"
    rule: "Subdivide or use separate records whenever possible; do not allocate burdens directly assignable to a product, grade, site, or operation."
    source_ids:
      - iso-14044-allocation
      - foreground-farm-records
  - rule_id: allocation_shared_orchard
    applies_to: "multiple species, grades, or outputs"
    rule: "When direct assignment is impossible, allocate shared crop-cycle and establishment burdens by a documented physical relationship; use product mass for comparable fresh-fruit outputs by default and test alternatives."
    source_ids:
      - iso-14044-allocation
      - foreground-farm-records
  - rule_id: allocation_rejects
    applies_to: "downgraded fruit, rejects, residues, and losses"
    rule: "Retain burdens with material until rework, recovery, treatment, or disposal is established; do not count rejects as accepted reference output."
    source_ids:
      - iso-14044-allocation
      - foreground-farm-records
  - rule_id: allocation_multi_site
    applies_to: "multiple orchard blocks or sites"
    rule: "Preserve site records where possible and aggregate by actual marketable hand-off mass; do not double count shared records."
    source_ids:
      - iso-14044-allocation
      - foreground-farm-records
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_orchard_records
      process_id: "p_orchard_management"
      flow_role: "orchard inputs, land, residues, operations"
      record_type: "farm and orchard primary records"
      raw_fields: "site_id; block_id; species; cultivar; area; orchard_age; establishment_year; operation_date; input_name; product_quantity; nutrient_content; water_volume; fuel; electricity; residue_mass; destination"
      collection_method: "invoices, application logs, meters, field logs, supplier records; Raw aggregation and attribution: sum by block then divide by reconciled hand-off mass"
      unit: "native units normalized to PCR units"
      frequency: "each operation and annual reconciliation"
      temporal_coverage: "one harvest year plus disclosed perennial attribution"
      site_scope: "every contributing block/unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "source documents, meter reads, stock reconciliation, block register"
    - protocol_id: cp_harvest_records
      process_id: "p_harvest"
      flow_role: "harvest inputs and outputs"
      record_type: "harvest ticket, weighbridge, loss record"
      raw_fields: "date; block_id; harvested_mass; transferred_mass; loss_mass; grade; container_count; container_mass; fuel; electricity; destination"
      collection_method: "lot-level weighing and harvest records; Raw aggregation and attribution: reconcile crop-ready, collected, transferred, and loss masses"
      unit: "kg fruit; kg/item containers; L/MJ/kWh energy"
      frequency: "every harvest lot"
      temporal_coverage: "reporting harvest season"
      site_scope: "every contributing block and crew"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, lot tickets, supervisor reconciliation"
    - protocol_id: cp_grade_records
      process_id: "p_grading_sorting"
      flow_role: "grading inputs, outputs, rejects, water, energy"
      record_type: "grading sheet and facility records"
      raw_fields: "incoming_mass; accepted_mass; downgraded_mass; reject_mass; grade; destination; water; electricity; date; line_id"
      collection_method: "line records, weigh tickets, meters, facility allocation; Raw aggregation and attribution: sum outputs and rejects to incoming mass by species and grade"
      unit: "kg, m3, kWh, or MJ"
      frequency: "every lot or day"
      temporal_coverage: "all in-boundary grading periods"
      site_scope: "each line/facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration, grade records, reject-path evidence"
    - protocol_id: cp_conditioning_records
      process_id: "p_primary_conditioning_handoff"
      flow_role: "conditioning inputs, packaging, losses, reference output"
      record_type: "packing, cooling, and hand-off records"
      raw_fields: "incoming_mass; handoff_mass; package_type; package_mass; reuse_cycles; cooling_energy; wash_water; fruit_loss; package_reject; handoff_date; destination"
      collection_method: "packhouse records, material reconciliation, meters, hand-off tickets; Raw aggregation and attribution: reconcile incoming fruit, hand-off fruit, fruit loss, and rejects"
      unit: "kg fruit/packaging; m3; kWh/MJ"
      frequency: "every lot or day"
      temporal_coverage: "all in-boundary conditioning periods"
      site_scope: "each facility, line, hand-off"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scales, packaging inventory, meters, hand-off documents"
    - protocol_id: cp_emission_model_inputs
      process_id: "p_orchard_management"
      flow_role: "calculated soil and agricultural emissions"
      record_type: "derived calculation input record"
      raw_fields: "nutrient_mass; application_method; application_date; soil; climate; drainage; residue_management; combustion_input; receiving_medium"
      collection_method: "calculate from collected records and selected method parameters; Raw aggregation and attribution: calculate by site/block then normalize by hand-off mass"
      unit: "kg nutrient, kg fuel, declared emission unit"
      frequency: "each reporting cycle and method update"
      temporal_coverage: "reporting harvest year"
      site_scope: "each site/block with different inputs"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "method version, input reconciliation, parameter provenance"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributable row amount / net marketable reference-flow mass at hand-off"
      inputs:
        - "row amount"
        - "allocation share"
        - "hand-off mass"
      output: "amount per kg reference flow"
      source_ids:
        - foreground-farm-records
    - id: calc_nutrient_mass
      applies_to: "fertilizer and soil amendment"
      rule: "nutrient mass = product mass × documented nutrient fraction; retain product and nutrient mass separately"
      inputs:
        - "product mass"
        - "nutrient fraction"
      output: "kg N, P, K, or declared nutrient"
      source_ids:
        - foreground-farm-records
    - id: calc_establishment_attribution
      applies_to: "perennial establishment"
      rule: "establishment burden = documented input × reporting-period or output share under the declared productive-life rule"
      inputs:
        - "establishment input"
        - age
        - "productive-life assumption"
        - "output share"
      output: "reporting-period amount"
      source_ids:
        - iso-14044-allocation
        - foreground-farm-records
    - id: calc_agricultural_emissions
      applies_to: "soil and agricultural elementary outputs"
      rule: "Apply selected IPCC or site method to reconciled nutrient and combustion inputs with explicit receiving medium."
      inputs:
        - "nutrient mass"
        - parameters
        - "site conditions"
        - fuel
      output: "calculated emission amount"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calc_multi_site_aggregation
      applies_to: "multiple sites"
      rule: "route amount = sum of site flow amounts / sum of site net marketable hand-off masses"
      inputs:
        - "site flow amounts"
        - "hand-off masses"
      output: "route-level normalized amount"
      source_ids:
        - foreground-farm-records
    - id: calc_mass_reconciliation
      applies_to: "harvest, grading, conditioning"
      rule: "incoming mass = accepted + downgraded + rejects + measured/reconciled losses within declared tolerance"
      inputs:
        - "incoming mass"
        - outputs
        - losses
      output: "completeness check and mass balance"
      source_ids:
        - foreground-farm-records
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference and product outputs"
      requirement: "Identify species/cultivar, grade, maturity, destination, geography, and hand-off for every aggregated product group."
      evidence: "product specification, lot records, dataset metadata"
    - id: dq_mass_balance
      applies_to: "harvest, grading, conditioning"
      requirement: "Reconcile incoming fruit, outputs, rejects, residues, and losses; disclose gaps and do not claim completeness when evidence gap."
      evidence: "calibrated scales, tickets, reconciliation worksheet"
    - id: dq_input_records
      applies_to: "agricultural inputs, water, energy, packaging, containers"
      requirement: "Use primary records or explain estimate, original unit, period, and allocation to the reference flow."
      evidence: "invoices, meters, logs, inventory, supplier documents"
    - id: dq_temporal_site
      applies_to: "all foreground rows"
      requirement: "Report harvest year, production period, block/site, and multi-year establishment attribution."
      evidence: "block register, field log, period metadata"
    - id: dq_emission_method
      applies_to: "calculated elementary flows"
      requirement: "State method version, parameters, receiving medium, and source for every modelled release."
      evidence: "method worksheet and source record"
    - id: dq_downstream_path
      applies_to: "rejects, residues, packaging rejects, downgraded products"
      requirement: "Declare rework, recovery, treatment, disposal, or downstream destination; no unlinked reject output."
      evidence: "transfer note, waste ticket, reuse record, destination declaration"
validation_rules:
  - rule_id: validation_reference_mass
