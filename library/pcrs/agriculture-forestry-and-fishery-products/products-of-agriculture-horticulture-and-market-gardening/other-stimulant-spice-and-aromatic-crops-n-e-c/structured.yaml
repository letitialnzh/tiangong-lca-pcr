allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "Shared crop and conditioning processes"
    rule: "Subdivide a shared operation when crop-specific inputs, areas, equipment use, batches or outputs can be directly and reliably measured. Keep each crop, plant organ, grade and handoff identifiable."
    source_ids:
      - iso-14044-lca-allocation
  - rule_id: allocation_coproducts
    applies_to: "Multiple intended crop products"
    rule: "Identify every intended output and its handoff. After subdivision, use a causal physical relation where it explains the shared burden. If no defensible physical relation exists, document the selected allocation basis and period, with economic allocation or system expansion only when the study goal supports it; disclose the rationale and sensitivity. Residues and waste without an intended product function receive no co-product allocation."
    source_ids:
      - iso-14044-lca-allocation
  - rule_id: allocation_productive_periods
    applies_to: "Multi-year or perennial crops"
    rule: "Report establishment, non-bearing and productive periods separately. When lifetime attribution is required and subdivision is not possible, attribute establishment burdens across the declared productive-life outputs using recorded or explicitly forecast crop-specific output, and disclose the production-life evidence and sensitivity. Do not assign the same establishment burden again to each productive year."
    source_ids:
      - iso-14044-lca-allocation
  - rule_id: allocation_shared_assets
    applies_to: "Irrigation, harvest and conditioning infrastructure"
    rule: "Attribute shared machinery, pumps, dryers, storage surfaces and utilities first by metered use or operating time. If unavailable, use a documented physical driver such as throughput or capacity use; use another basis only with justification. Record all consuming processes and periods and prevent duplicate attribution."
    source_ids:
      - iso-14044-lca-allocation
  - rule_id: allocation_reject_rework
    applies_to: "Rework, downgrade, recovery and discard routes"
    rule: "Trace each rejected lot to rework, recovery, downgrade or discard. Include incremental rework inputs once, count accepted product only at its final handoff, and report saleable downgraded material as a distinct intended output. Do not assign a waste treatment credit without an evidenced treatment or substitution route."
    source_ids:
      - iso-14044-lca-allocation
      - codex-spice-mycotoxin-practice-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_propagation_material
      process_id: "managed_crop_production"
      flow_role: "propagation_material"
      record_type: "supplier, seed, nursery or transfer record"
      raw_fields: "species, plant part, propagation form, variety, quantity, source, date, field, crop period"
      collection_method: "Reconcile invoices, nursery tickets or internal transfer records to planted area"
      unit: "kg or declared count"
      frequency: "Each planting or replanting event"
      temporal_coverage: "Establishment and replanting events in scope"
      site_scope: "Declared field and crop"
      aggregation_rule: "Sum by species, propagation form, field and period; normalize to selected gate output"
      quality_evidence: "Source documentation, unit check and lot traceability"
    - protocol_id: cp_nutrient_application
      process_id: "managed_crop_production"
      flow_role: "fertilizer_nutrient_inputs; soil_nitrous_oxide"
      record_type: "field application log, invoice, soil test"
      raw_fields: "actual product, mass, nutrient grade, N form, organic/mineral status, application date, field, crop period, soil and climate fields used by selected method"
      collection_method: "Reconcile product purchase/application records and soil or method data"
      unit: "kg product and kg nutrient"
      frequency: "Every application; summarize by crop period"
      temporal_coverage: "All included establishment and productive periods"
      site_scope: "Declared crop fields and shared application equipment"
      aggregation_rule: "Keep product exchanges individually recoverable under one PCR card; calculate N inputs from documented composition"
      quality_evidence: "Invoices, application logs, calibration and source method record"
    - protocol_id: cp_crop_protection
      process_id: "managed_crop_production"
      flow_role: "crop_protection_products"
      record_type: "application log and supplier product record"
      raw_fields: "product, active ingredient, amount, treated area, application date, target, crop stage, field, pre-harvest interval where applicable"
      collection_method: "Reconcile application records and purchased quantities; note unused stock"
      unit: "kg product and active ingredient"
      frequency: "Every application"
      temporal_coverage: "All included crop periods"
      site_scope: "Declared crop fields and crop lot"
      aggregation_rule: "Allocate actual applied amount to treated area and crop period; do not allocate unused stock as applied"
      quality_evidence: "Product label, application log, invoice and operator record"
    - protocol_id: cp_irrigation
      process_id: "managed_crop_production"
      flow_role: "irrigation_water"
      record_type: "meter or water-supplier record"
      raw_fields: "water source, meter start/end, volume or mass, date, field, crop, irrigated area, pumping event"
      collection_method: "Read calibrated meter or reconcile supplier records; record conversions"
      unit: "m3 preferred; verified native unit permitted"
      frequency: "Each irrigation event or billing period"
      temporal_coverage: "Each crop year and productive period"
      site_scope: "Declared crop field and water source"
      aggregation_rule: "Sum withdrawals by field and crop year; normalize to actual output of that period and selected gate"
      quality_evidence: "Meter calibration, invoice, water-source record and period reconciliation"
    - protocol_id: cp_crop_energy
      process_id: "managed_crop_production"
      flow_role: "crop_production_energy"
      record_type: "meter, fuel receipt and equipment log"
      raw_fields: "carrier, amount, unit, equipment, operation, field, date, shared use, fuel quality or calorific value when converted"
      collection_method: "Reconcile fuel/electricity records and allocate shared use by measured operation"
      unit: "Carrier-native unit; kWh-equivalent only with documented conversion"
      frequency: "Each operation or billing period"
      temporal_coverage: "Each crop year and productive period"
      site_scope: "Declared crop site and equipment"
      aggregation_rule: "Aggregate by actual process and carrier; normalize using crop-period output"
      quality_evidence: "Meter or invoice, equipment log and conversion evidence"
    - protocol_id: cp_area_and_land_history
      process_id: "managed_crop_production"
      flow_role: "crop_land_occupation; crop_land_transformation"
      record_type: "field register, map, lease, land history or geospatial record"
      raw_fields: "field boundary, crop area, land-cover class, occupation dates, conversion date and prior/final cover"
      collection_method: "Reconcile current field map with dated land-history evidence"
      unit: "ha, ha·year, date"
      frequency: "Each crop period and each land change"
      temporal_coverage: "Full declared crop period and any conversion in scope"
      site_scope: "Declared crop field"
      aggregation_rule: "Calculate area-time by period; report transformation separately from occupation"
      quality_evidence: "Geospatial or land register, dated records and area reconciliation"
    - protocol_id: cp_harvest_batch
      process_id: "managed_crop_production_harvest_capture"
      flow_role: "harvest_ready_crop_material; harvest_ready_batch_input; harvested_target_product"
      record_type: "crop lot, harvest ticket and scale record"
      raw_fields: "species, plant organ, field, crop period, harvest date, gross/net/tare mass, moisture, quality state, transfer destination"
      collection_method: "Weigh or sample each lot using identified calibrated equipment; match inter-process lot id"
      unit: "kg and moisture basis"
      frequency: "Each harvest lot"
      temporal_coverage: "Each harvest date and crop period"
      site_scope: "Declared field and receiving process"
