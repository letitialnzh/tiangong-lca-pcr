schema_version: 1
generated_from: markdown
source_markdown: pcr.en-US.md
product_category_identity:
  canonical_pcr_id: "pcr.agriculture-forestry-and-fishery-products.products-of-agriculture-horticulture-and-market-gardening.other-stimulant-spice-and-aromatic-crops-n-e-c"
  classification_refs: "CPC 3.0:01699, classification locator only; unmapped"
  covered_products: "One cultivated, unmixed and unextracted spice or aromatic crop product, including a specified species and plant part such as saffron stigmas, turmeric rhizomes, dill herb or seed, thyme, bay leaves, Xylopia aethiopica seeds, or angelica stems, at the declared harvest or first primary-conditioning state"
  excluded_products: "Curry powders and pastes; other mixed seasonings; extracts and essential oils; ground or milled products; sterilized, blended, or otherwise manufactured products; wild-collected material; products covered by another specific crop category"
  representative_product: "One named crop species and plant organ, in one declared fresh or dried state, at either farm harvest handoff or first primary-conditioning handoff"
  production_route: "Managed cultivation → crop-specific productive period → harvest/capture → optional primary sorting, cleaning, washing, drying, or simple stabilization → declared handoff"
  market_state: "Bulk, unblended agricultural crop material with declared species, plant part, grade, and moisture or other relevant state; no retail presentation"
functional_unit:
  what: "One crop-specific spice or aromatic plant product at the selected handoff"
  how_much: "1 kg net product at the declared state and gate"
  how_well: "One botanical species and product part; declared cultivar or variety when known; fresh or dried state; measured moisture content for dried material; declared grade and contamination or rejection criteria"
  how_long_or_cycle: "One identified crop lot and crop cycle. For perennial crops, include the establishment and productive periods or document how establishment burdens are attributed across productive output."
  reference_flow_link: "Reference flow object below; UUID intentionally unresolved at this category-level candidate stage"
system_boundary:
  rules:
    - rule_id: crop_route_start
      applies_to: "Crop establishment and management"
      rule: "Include crop establishment, productive management and field occupation for the declared crop periods. Include prior conversion only when it occurred within the selected accounting period or is explicitly attributed under the study goal; report the land history either way."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: harvest_gate
      applies_to: "Harvest and first handoff"
      rule: "Treat harvest as a distinct responsibility between managed plant growth and crop conditioning. Record the crop material collected, its state and handoff, plus incidental loss and non-target biomass by actual destination."
      source_ids:
        - codex-spice-mycotoxin-practice-2017
        - fao-herb-spice-quality-handbook
    - rule_id: conditioning_gate
      applies_to: "First primary conditioning"
      rule: "Include only the operations performed before the selected first conditioning handoff. Washing is conditional on the actual route; do not add a wash step where the crop or contamination protocol does not require it. Drying and any stabilization are route-specific and require measured inputs and product-state checks."
      source_ids:
        - codex-spice-mycotoxin-practice-2017
        - fao-herb-spice-quality-handbook
    - rule_id: gate_exclusivity
      applies_to: "Reference product"
      rule: "A dataset shall select the harvest gate or the first primary-conditioning gate. When conditioning is included, the harvested crop is an internal intermediate and shall not be counted again as the reference product."
      source_ids: []
    - rule_id: route_alternatives
      applies_to: "Crop and conditioning technology"
      rule: "Declare the selected crop life-history and technology route. Rainfed and irrigated cultivation, manual and mechanized harvest, and ambient/solar and mechanical drying are route alternatives; report observed coexistence where it occurs and never average distinct crop species or product states into one inventory."
      source_ids:
        - codex-spice-mycotoxin-practice-2017
        - fao-herb-spice-quality-handbook
    - rule_id: process_handoffs
      applies_to: "Crop, harvest and conditioning nodes"
      rule: "Identify the input material state, output state, destination and responsible site for each process. Use measured lot transfer records to connect nodes and reconcile input, product, residue, reject and moisture changes."
      source_ids:
        - codex-spice-mycotoxin-practice-2017
boundary_abstraction:
  declared_starting_condition: "The declared crop site and its pre-establishment condition, or the beginning of the explicitly selected crop period for an existing stand; report prior land conversion and perennial establishment when they are inside the study period or attributed to the reference product."
  starting_condition_role: "Primary crop producer and first-handoff product supplier"
  product_classification_scope: "One CPC 01699 crop product only after species, plant part, physical state, and gate are identified; this PCR does not cover mixed curry powders or pastes and does not imply exact coverage of the full CPC leaf."
  recursive_input_rule: "Record purchased or transferred seed, rhizome, bulb, cutting, seedling, or other propagation material as an actual input. If propagation material is retained from the same site, disclose its source and avoid recursively linking the same crop output as both an upstream dataset and a foreground input."
  upstream_dataset_requirement: "Use verified upstream datasets for purchased propagation material, nutrient products, crop-protection products, water supply, energy carriers, and third-party transport or treatment services when included. Record the actual exchanged product and its composition; do not infer an upstream identity from a Flow Set."
  disclosure: "State the crop and plant part, site and period, production and harvest route, area and yield basis, product state and moisture, selected gate, conditioning operations, measured grades, off-grade and residue destinations, and all period or shared-asset attribution choices."
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Crop-specific spice or aromatic product at declared gate (UUID unresolved)"
  flow_property_ref:
    uuid: ""
  unit_group_ref:
    uuid: ""
  reference_unit: "kg"
  required_qualifiers:
    - "Botanical species"
    - "plant organ or product part"
    - "cultivar or variety when known"
    - "country and production site"
    - annual
    - rhizome
    - "or perennial route"
    - "crop cycle and harvest lot"
    - "fresh/dried/other declared state"
    - "moisture content for dried product"
    - grade
    - "harvest or first-conditioning gate"
    - "whether washing"
    - drying
    - stabilization
    - "and off-farm transfer occurred"
reference_flows:
  []
measurement_rules:
  - id: crop_product_mass
    applies_to: "Reference product, intermediate crop batches, saleable grades and crop residues"
    required_property_ref:
      name: "Mass; use the verified property exposed by the selected flow"
      uuid: ""
    required_unit: "kg"
    rule: "Record net mass and the material state at each handoff. Do not convert fresh to dry mass without measured moisture and a stated calculation. Keep grade-specific and species-specific amounts separate."
  - id: irrigation_volume
    applies_to: "Irrigation water"
    required_property_ref:
      name: "Volume or mass compatible with the verified water flow"
      uuid: ""
    required_unit: "m3 preferred; kg permitted with documented conversion"
    rule: "Use metered or supplier-recorded withdrawal and identify source. If converting volume to mass, state the measured or adopted density and reference condition. Report rainfall separately as site context, not as a purchased water exchange."
  - id: product_moisture
    applies_to: "Fresh or dried reference and intermediate crop products"
    required_property_ref:
      name: "Mass fraction of water or water activity, as appropriate"
      uuid: ""
    required_unit: "% wet basis and/or dimensionless aw"
    rule: "Record the measurement method, sample basis, date and lot. For a dried-state claim, report the applicable buyer or product specification; do not apply one moisture threshold across all species and organs."
  - id: land_occupation
    applies_to: "Crop production"
    required_property_ref:
      name: "Area-time"
      uuid: ""
    required_unit: "ha·year"
    rule: "Measure occupied crop area and time for each declared production period. Distinguish annual crop occupation from establishment and productive years of perennial stands."
  - id: transport_service
    applies_to: "Field-to-conditioner transfer"
    required_property_ref:
      name: "Mass-distance"
      uuid: ""
    required_unit: "t·km"
    rule: "Calculate from net transported crop mass and the loaded distance for the declared route. Report vehicle, load, route, and treatment of empty return separately; do not double-count own-account fuel as a purchased transport service."
process_map:
  - id: managed_crop_production
    name: "Managed crop establishment and production"
    inclusion: "required"
    inclusion_condition: "Record annual, rhizome, or perennial route; separate establishment and productive periods for multi-year crops."
    role: "Managed biological production"
    quantitative_reference: "Crop area and production period linked to net target-organ output"
  - id: harvest_capture
    name: "Harvest and field capture"
    inclusion: "required"
    inclusion_condition: "Identify manual or mechanized harvest and the actual target organ, collection state and handoff."
    role: "Harvest/capture"
    quantitative_reference: "Net harvested lot by botanical product and grade"
  - id: primary_conditioning
    name: "First primary conditioning and stabilization"
    inclusion: "conditional"
    inclusion_condition: "Include when sorting, cleaning, washing, drying, or simple stabilization occurs before the selected gate. If absent, the reference flow leaves at the harvest gate."
    role: "Material treatment, preservation and primary conditioning"
    quantitative_reference: "Net accepted conditioned output and material-state change by lot"
process_inventory:
  - id: managed_crop_production
    label: "Managed crop establishment and production"
    inputs:
      product:
        - row_id: propagation_material
          role: "Seed or other propagation material"
          name: "Crop-specific seed or propagation material (identity depends on the declared species and propagation form; UUID unresolved)"
          flow_type: "product"
          property_unit: "Mass / kg or item count as supported by the verified flow"
          description: "Record actual seed, rhizome, bulb, cutting, seedling or other planting material supplied to establish or renew the selected crop. Identify botanical source, form, quantity, period and whether it is purchased or retained from the same site. Omit the exchange when no external or transferred material enters the foreground system."
          amount:
            expression: "Measured or supplier-recorded planting material, normalized using the crop-period and reference-product records"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "Per 1 kg of product at the selected gate, with the source crop period retained"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_propagation_material
              source_ids:
                - unsd-cpc-01699
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "1"
                unit: "kg propagation material/kg selected product"
                basis: "Broad reasoned estimate for the declared route and selected product gate; it is a screening interval, not a universal permitted value"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids:
                  - mass-balance-identity
        - row_id: fertilizer_nutrient_inputs
          role: "Consolidated fertilizer and nutrient amendments"
          name: "Fertilizer and nutrient-supply products actually applied to this crop (foreground-expanded from product records)"
          flow_type: "product"
          binding: "parameterized"
          flow_set_ref:
            id: "flow-set.agricultural-nutrient-supply"
            version: "0.3.0"
          property_unit: "Product-specific property and native unit for each recorded fertilizer or amendment"
          description: "Use one card for all mineral fertilizers, organic fertilizers and nutrient amendments applied to this process, including a soil amendment used for crop nutrition. Preserve each actual product, applied mass, nutrient grade, timing and field in foreground records. The set does not select an exchange automatically; data generation resolves the recorded products to verified UUIDs."
          amount:
            expression: "Record actual masses by fertilizer/amendment product and nutrient composition; one consolidated card only"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "Per 1 kg of product at the selected gate, retaining field and crop-period records"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_nutrient_application
              source_ids:
                - fao-herb-spice-quality-handbook
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "10"
                unit: "kg nutrient products/kg selected product"
                basis: "Broad reasoned estimate for the declared route and selected product gate; it is a screening interval, not a universal permitted value"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids:
                  - mass-balance-identity
        - row_id: crop_protection_products
          role: "Crop-protection products"
          name: "Actual crop-protection product(s) used on the declared crop (UUID unresolved until the product is identified)"
          flow_type: "product"
          property_unit: "Product-specific property and native unit for each recorded product"
          description: "Include only products actually applied to the crop or drying area. Record each trade product and active ingredient in the foreground evidence and resolve each actual exchange during data generation. Do not use this umbrella as a fixed flow for an unspecified pesticide mixture."
          amount:
            expression: "Measured or invoiced application, with active ingredient, treated area, date and crop lot recorded"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "Per 1 kg of product at the selected gate"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_crop_protection
              source_ids:
                - codex-spice-mycotoxin-practice-2017
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "1"
                unit: "kg crop-protection product/kg selected product"
                basis: "Broad reasoned estimate for the declared route and selected product gate; it is a screening interval, not a universal permitted value"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids:
                  - mass-balance-identity
        - row_id: irrigation_water
          role: "Irrigation water"
          name: "Irrigation water supplied to this crop (resolved from actual source and selected water flow)"
          flow_type: "product"
          binding: "parameterized"
          flow_set_ref:
            id: "flow-set.water-use"
            version: "0.2.0"
            group: "irrigation-water"
          property_unit: "Volume / m3 preferred; use the verified selected flow property and unit"
          description: "Record water actually withdrawn or supplied for irrigation. Rainfall and soil moisture are contextual measurements, not product-flow exchanges. Omit this card for a rainfed period with no irrigation input."
          amount:
            expression: "Metered or supplier-recorded irrigation volume by field and period; disclose any conversion from mass to volume"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "Per 1 hectare and crop year, then normalize to the selected gate output"
              kind: "crop_cycle"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_irrigation
              source_ids:
                - fao-herb-spice-quality-handbook
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "15000"
                unit: "m3/ha·crop-year"
                basis: "One hectare of the declared crop during one production year; normalize the observed annual volume by that period's output for the reference-flow inventory"
                basis_kind: "crop_cycle"
                evidence_kind: "reasoned_estimate"
                source_ids: []
        - row_id: crop_production_energy
          role: "Crop-production energy and utilities"
          name: "Energy carriers and utilities actually used in crop production"
          flow_type: "product"
          binding: "parameterized"
          flow_set_ref:
            id: "flow-set.energy-supply"
            version: "0.2.0"
          property_unit: "Carrier-specific property and native unit for each exchange"
          description: "Record the actual energy carriers used for field operations, irrigation pumping, crop protection and production support. Keep each carrier exchange and its native unit identifiable in the collected records. The set reference stays at set level because the crop-specific energy carriers are determined by foreground records."
          amount:
            expression: "Metered electricity and fuel records; report equipment and operation so own-account fuel is not also counted as a transport service"
            value_mode: "foreground_record"
            specificity: "technology_specific"
            basis:
              text: "Per 1 hectare and crop year, then normalize to the selected gate output"
              kind: "crop_cycle"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_crop_energy
              source_ids:
                - ipcc-2019-managed-soils
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "5000"
                unit: "kWh-equivalent/t selected product"
                basis: "Broad reasoned estimate for the declared route and selected product gate; it is a screening interval, not a universal permitted value"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids:
                  - mass-balance-identity
      waste:
        - row_id: removed_crop_biomass
          role: "Removed non-target crop biomass"
          name: "Crop-specific non-target plant biomass sent to a declared waste destination (UUID unresolved)"
          flow_type: "waste"
          property_unit: "Mass / kg dry matter where measured"
          description: "Record non-target biomass removed from the field only when it leaves the crop system as a discard or residue. Biomass retained or incorporated in the field is recorded under the elementary soil-return row in the harvest process, not as a waste exchange. If it is sold or used as a co-product, classify it under the actual intended product output instead."
          amount:
            expression: "Measured removed mass and actual destination; distinguish dry matter from water loss"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "Per 1 kg of product at the selected gate"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_field_residues
              source_ids:
                - codex-spice-mycotoxin-practice-2017
            ranges:
              - role: qa_guardrail
                lower: "0"
                upper: "1"
                unit: "kg discarded biomass/kg removed biomass"
                basis: "The measured discarded portion of the removed biomass lot"
                basis_kind: "process_output"
                evidence_kind: "method_formula"
                source_ids:
                  - mass-balance-identity
      elementary:
        - row_id: crop_land_occupation
          role: "Crop land occupation"
          name: "Agricultural land occupation for the declared crop and land-cover state (UUID unresolved until land class is identified)"
          flow_type: "elementary"
          property_unit: "Area-time / ha·year"
          description: "Record the crop area and time occupied by the declared product route. For mixed-use fields, measure or document the crop-specific area and period and apply the shared-infrastructure or co-product rules where required."
          amount:
            expression: "Measured crop area multiplied by the attributed occupation period"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "Per 1 kg of product at the selected gate"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_area_and_land_history
              source_ids:
                - ipcc-2019-managed-soils
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "10"
                unit: "ha-year/t selected product"
                basis: "Broad reasoned estimate for the declared route and selected product gate; it is a screening interval, not a universal permitted value"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids:
                  - mass-balance-identity
        - row_id: crop_land_transformation
          role: "Land transformation"
          name: "Land transformation from the recorded initial to final land-cover class (UUID unresolved until land class is identified)"
          flow_type: "elementary"
          property_unit: "Area / ha"
          description: "Include only when land conversion occurs inside the declared study period or is explicitly attributed to the product. Identify initial and final land cover, area, date and evidence. Omit when no qualifying conversion occurred; do not report occupation as transformation."
          amount:
            expression: "Measured converted area; calculate zero only when the site history confirms no conversion in scope"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "Per 1 kg of product at the selected gate"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_area_and_land_history
              source_ids:
                - ipcc-2019-managed-soils
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "10"
                unit: "ha transformed/t selected product"
                basis: "Broad reasoned estimate for the declared route and selected product gate; it is a screening interval, not a universal permitted value"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids:
                  - mass-balance-identity
    outputs:
      product:
        - row_id: harvest_ready_crop_material
          role: "Harvest-ready target plant material"
          name: "One declared species and plant organ in its harvest-ready state (UUID unresolved)"
          flow_type: "product"
          property_unit: "Mass / kg at measured moisture, or a declared count unit where mass cannot be measured"
          description: "Record the standing or harvest-ready target organ supplied to the distinct harvest operation. The quantity and product identity shall be the same batch basis used by the harvest input; it is an internal handoff unless the selected system boundary ends at harvest."
          amount:
            expression: "Crop-specific harvestable target-organ amount linked to the lot and the harvest output record"
            value_mode: "calculated_value"
            specificity: "product_specific"
            basis:
              text: "Per 1 kg of product at the selected gate"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_harvest_batch
              source_ids:
                - codex-spice-mycotoxin-practice-2017
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "1"
                unit: "kg harvest-ready material/kg selected product"
                basis: "Broad reasoned estimate for the declared route and selected product gate; it is a screening interval, not a universal permitted value"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids:
                  - mass-balance-identity
      waste:
        - row_id: production_loss_residue
          role: "Crop-production loss or removed residue"
          name: "Crop-specific biomass removed or discarded before harvest (UUID unresolved)"
          flow_type: "waste"
          property_unit: "Mass / kg dry matter where measured"
          description: "Use only for biomass that leaves the production process as a measured discard. Distinguish it from target crop material at harvest, saleable crop products, and residue left on or returned to the field."
          amount:
            expression: "Measured amount and destination by crop period; omit if no such removal occurs"
            value_mode: "foreground_record"
            specificity: "product_specific"
            basis:
              text: "Per 1 kg of product at the selected gate"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_field_residues
              source_ids:
                - codex-spice-mycotoxin-practice-2017
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "1"
                unit: "kg loss or residue/kg harvest-ready material"
                basis: "Broad reasoned estimate for the declared route and selected product gate; it is a screening interval, not a universal permitted value"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids:
                  - mass-balance-identity
      elementary:
        - row_id: soil_nitrous_oxide
          role: "Direct soil nitrous oxide"
          name: "Nitrous oxide emitted from managed crop soil to air (UUID unresolved)"
          flow_type: "elementary"
          property_unit: "Mass / kg N2O"
          description: "Report direct soil N₂O only when the foreground dataset has the activity data and a selected managed-soils method. Use the factor appropriate to the declared climate, soil, nitrogen inputs and method tier. Keep direct emissions separate from indirect pathways and upstream fertilizer manufacture; disclose any omitted pathways."
          amount:
            expression: "Calculate from collected nitrogen additions and the selected IPCC managed-soils method; retain factor choice and N-to-N2O conversion"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "Per 1 kg of product at the selected gate"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_nutrient_application
              source_ids:
                - ipcc-2019-managed-soils
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "0.1"
                unit: "kg N2O/kg selected product"
                basis: "Broad reasoned estimate for the declared route and selected product gate; it is a screening interval, not a universal permitted value"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids:
                  - mass-balance-identity
  - id: harvest_capture
    label: "Harvest and field capture"
    inputs:
      product:
        - row_id: harvest_ready_batch_input
          role: "Harvest-ready crop batch"
          name: "Internal transfer of the crop-specific harvest-ready material (same unresolved identity as production output)"
          flow_type: "product"
          property_unit: "Mass / kg at measured moisture, or the same declared count unit used by production output"
          description: "Receive the harvest-ready batch from crop production. Match its species, organ, crop period and lot identifier to the production output; do not treat this as an upstream purchased product."
          amount:
            expression: "Reconciled to the harvest-ready output record for the same lot"
            value_mode: "calculated_value"
            specificity: "product_specific"
            basis:
              text: "Per 1 kg of product at the selected gate"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_harvest_batch
              source_ids:
                - codex-spice-mycotoxin-practice-2017
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "1"
                unit: "kg harvest-ready batch/kg selected product"
                basis: "Broad reasoned estimate for the declared route and selected product gate; it is a screening interval, not a universal permitted value"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids:
                  - mass-balance-identity
        - row_id: harvest_energy
          role: "Harvest machinery energy"
          name: "Energy carriers actually used by harvest and field capture"
          flow_type: "product"
          binding: "parameterized"
          flow_set_ref:
            id: "flow-set.energy-supply"
            version: "0.2.0"
          property_unit: "Carrier-specific property and native unit for each exchange"
          description: "Record electricity and fuels consumed by harvest machinery, collection equipment and field-side handling. Use the measured carrier. Include own-account vehicle fuel here when the vehicle performs crop operations; do not also claim a purchased transport service for the same movement."
          amount:
            expression: "Metered energy or fuel records by equipment and harvest operation"
            value_mode: "foreground_record"
            specificity: "technology_specific"
            basis:
              text: "Per 1 kg of product at the selected gate"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_harvest_energy
              source_ids:
                - fao-herb-spice-quality-handbook
            ranges:
              - role: default_estimate
                lower: "0"
                upper: "3000"
                unit: "kWh-equivalent/t harvested product"
                basis: "Broad reasoned estimate for the declared route and selected product gate; it is a screening interval, not a universal permitted value"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids:
                  - mass-balance-identity
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: harvested_target_product
          role: "Primary harvested crop product"
