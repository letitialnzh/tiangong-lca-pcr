data_sources:
  - id: "unsd-cpc-01699"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, code 01699, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification examples; the historical CPC 2.1 note and the current-leaf scope review are kept distinct"
  - id: "codex-spice-mycotoxin-practice-2017"
    type: "official_guidance"
    reference: "FAO/WHO Codex Alimentarius Commission, REP17/CF, Appendix VI, Code of Practice for the Prevention and Reduction of Mycotoxin Contamination in Spices (2017), https://www.fao.org/fao-who-codexalimentarius/sh-proxy/en/?lnk=1&url=https%253A%252F%252Fworkspace.fao.org%252Fsites%252Fcodex%252FMeetings%252FCX-735-12%252FWD%252FREP17_CFe.aspx"
    used_for: "Harvest timing, lot separation, crop handling, optional washing, drying, moisture/water-activity checks, grades, rejects and post-harvest route controls"
  - id: "fao-herb-spice-quality-handbook"
    type: "handbook"
    reference: "FAO, Quality assurance for small-scale rural food industries, section 2.4 Herb and spice products, https://www.fao.org/4/V5380E/V5380E09.htm"
    used_for: "Farm-to-primary-processing stages, washing, grading, cleaning, winnowing, drying and product-quality measurements"
  - id: "ipcc-2019-managed-soils"
    type: "official_guidance"
    reference: "2019 Refinement to the 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Volume 4, Chapter 11, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf"
    used_for: "Managed-soil direct and indirect N2O method selection and nitrogen application activity data"
  - id: "iso-14044-lca-allocation"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines, https://www.iso.org/standard/38498.html"
    used_for: "Subdivision, co-product attribution, shared process handling and documented allocation choices"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Physical mass-balance identity: input material equals intended outputs, residues, waste, removed water and measured loss on a consistent moisture basis"
    used_for: "Candidate QA guardrails for nonnegative mutually exclusive lot disposition; not an external source or product-specific yield factor"
