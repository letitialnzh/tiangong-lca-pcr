  calculation_rules:
    - id: crop_period_normalization
      applies_to: "Managed crop production"
      rule: "Normalize each crop-period input by that period's measured net product output at the selected gate. Keep establishment, non-bearing, harvest and productive-period records separately; apply the allocation decision in Section 7 only when combining periods."
      inputs:
        - "Crop-period inputs"
        - "field area"
        - "product identity"
        - "period and net output"
      output: "Inventory per 1 kg selected reference product plus period-specific source records"
      source_ids: []
    - id: nitrogen_soil_n2o
      applies_to: "Direct managed-soil N2O"
      rule: "Apply the selected IPCC managed-soils equation and factor to documented N additions and other required activity data. Convert N2O-N to N2O with the method's molecular-mass ratio. Record factor, tier, climate/soil conditions and excluded indirect pathways; do not silently treat an emission factor as a measured flow."
      inputs:
        - "Nutrient composition and application"
        - "relevant soil/crop activity data"
        - "selected factor"
      output: "Direct N2O to air per 1 kg selected reference product"
      source_ids:
        - ipcc-2019-managed-soils
    - id: harvested_lot_balance
      applies_to: "Harvest and crop conditioning"
      rule: "Reconcile incoming crop mass to accepted products, lower grades, co-products, waste/rejects, retained or removed residues, removed water and measured unexplained loss on a consistent moisture basis. Investigate any apparent output greater than incoming material; disclose any water or other mass added."
      inputs:
        - "Gross and net batch weights"
        - moisture
        - grades
        - "residue and destination records"
      output: "Reconciled product and residue exchanges by lot"
      source_ids:
        - mass-balance-identity
    - id: road_transport_work
      applies_to: "Field-to-conditioner freight"
      rule: "Transport work equals net transported mass in tonnes multiplied by the loaded route distance in kilometres. Apply empty return treatment only as an explicit, evidenced allocation; do not combine a service exchange with the same vehicle's direct fuel record."
      inputs:
        - "Net crop mass"
        - "loaded route distance"
        - "vehicle and empty-return records"
      output: "t·km by raw crop lot"
      source_ids:
        - iso-14044-lca-allocation
  data_quality_requirements:
    - id: crop_identity_and_gate
      applies_to: "Reference product and all process handoffs"
      requirement: "Identify one species, plant part, state, grade, site, period and exclusive harvest or first-conditioning gate. Record product UUID only after exact identity and support rows are verified."
      evidence: "Crop/site records, lot identifier, product description and reviewed identity evidence"
    - id: crop_period_completeness
      applies_to: "Annual and perennial production periods"
      requirement: "Include establishment, non-bearing and productive periods where relevant; disclose the exact time window, productive-life evidence and any allocation used."
      evidence: "Planting and harvest dates, yield history, field register and calculation record"
    - id: crop_input_completeness
      applies_to: "Production and conditioning inputs"
      requirement: "Reconcile planting material, all fertilizer/nutrient products, crop-protection inputs, irrigation, energy, conditioning water and purchased service inputs against supplier and operation records. One PCR fertilizer card covers all nutrient product exchanges for the process."
      evidence: "Invoices, application logs, meters, batch records and Flow Set resolution evidence"
    - id: harvest_and_grade_reconciliation
      applies_to: "Harvest and conditioning outputs"
      requirement: "Account for each declared intended output and handoff. Distinguish accepted output, lower grade, other co-products, rework, retained field residues, waste and unexplained loss; do not count one mass in two destinations."
      evidence: "Lot balance, grade sheets, scale calibration, disposition and sales/treatment records"
    - id: dried_product_state
      applies_to: "Dried reference product"
      requirement: "Record product moisture and measurement basis at the selected gate; document the relevant stability/product specification and the sampling method. Do not use drying ranges as mandatory product limits."
      evidence: "Moisture meter/oven results, calibration and the applicable buyer or official specification"
    - id: shared_asset_and_period_attribution
      applies_to: "Shared equipment, fields, dryers and utilities"
      requirement: "Identify each consuming process and crop period. Use measured operation or physical use for shared burdens where possible and record the chosen allocation and evidence."
      evidence: "Asset log, meter, operating time, capacity/use record and allocation worksheet"
    - id: environmental_method_disclosure
      applies_to: "Land, soil emissions and waste treatment"
      requirement: "Identify land cover, site conditions, emission methods and factors, direct versus indirect pathway, wastewater route and unresolved elementary UUIDs. State exclusions and sensitivity when primary evidence is unavailable."
      evidence: "Land history, activity data, selected IPCC method, method factor citation and treatment evidence"
    - id: range_replacement
      applies_to: "Provisional ranges"
      requirement: "Treat reasoned estimates as first-pass screens only. Replace them with crop-, region-, technology- and gate-specific evidence or foreground records before any reviewed/active use. Do not interpret them as universal permitted values."
      evidence: "Source-backed regional evidence or reviewed site records and range QA report"
validation_rules:
  - rule_id: validate_single_crop_lot
    applies_to: "Product identity"
    rule: "Reject an inventory that combines multiple species, plant organs, harvest days, fresh/dried states or cultivation systems without separately identified exchanges and attribution."
    source_ids:
      - unsd-cpc-01699
      - codex-spice-mycotoxin-practice-2017
  - rule_id: validate_gate_and_reference
    applies_to: "Reference product"
    rule: "Require exactly one selected gate and one reference product identity. If the gate is harvest, exclude conditioning; if it is primary-conditioned, treat harvested crop as an intermediate and count only conditioned target product at the reference gate."
    source_ids:
      - codex-spice-mycotoxin-practice-2017
  - rule_id: validate_output_destinations
    applies_to: "All production, harvest and conditioning outputs"
    rule: "Enumerate all intended outputs and their handoffs. Classify each downgraded lot as a saleable product, rework, recovery, discard or waste; classify field residue by whether it stays in soil, is removed or becomes an intended product."
    source_ids:
      - iso-14044-lca-allocation
      - codex-spice-mycotoxin-practice-2017
  - rule_id: validate_crop_periods
    applies_to: "Annual, rhizome and perennial routes"
    rule: "Reconcile inputs and outputs by crop period. Check establishment and productive-life attribution for multi-year crops and prevent double attribution of establishment or shared-asset burdens."
    source_ids:
      - iso-14044-lca-allocation
  - rule_id: validate_flow_set_bindings
    applies_to: "Product inputs"
    rule: "Require the fertilizer/nutrient input to use one set-only flow-set.agricultural-nutrient-supply reference per process with no group. Require energy supply at set level unless a specific energy function is required by the data; use one process-water group for washing and an irrigation-water group only for actual irrigation. Resolve actual final exchanges to verified UUIDs during data generation."
    source_ids: []
  - rule_id: validate_mass_and_moisture
    applies_to: "Batch amounts and conditioned output"
    rule: "Check scale tare, mass units, moisture basis, grade quantities, removed water and output mass balance. Any output-to-input ratio above 1 requires an evidenced material addition or moisture/state explanation."
    source_ids:
      - mass-balance-identity
      - codex-spice-mycotoxin-practice-2017
  - rule_id: validate_drying_stability
    applies_to: "Dried product"
    rule: "Verify moisture or water-activity measurements at declared sampling points and the product's stated acceptance criterion. Codex guidance reports aw below 0.65 as adequate to prevent mycotoxin production in spices; disclose the chosen criterion and applicability rather than treating one moisture value as universal."
    source_ids:
      - codex-spice-mycotoxin-practice-2017
  - rule_id: validate_conditioning_routes
    applies_to: "Washing, drying and stabilization"
    rule: "Confirm each conditional operation occurred and its inputs, output state and destination are recorded. Omit inactive routes; do not add a wash exchange when no washing took place."
    source_ids:
      - codex-spice-mycotoxin-practice-2017
      - fao-herb-spice-quality-handbook
  - rule_id: validate_n2o_method
    applies_to: "Soil nitrous oxide"
    rule: "Require activity data, selected factor and method tier for calculated direct soil N2O. Prevent double counting with upstream product datasets or indirect pathways, and leave the UUID unresolved where no compatible air elementary flow is verified."
    source_ids:
      - ipcc-2019-managed-soils
  - rule_id: validate_shared_assets
    applies_to: "Shared equipment and facilities"
    rule: "Check that each shared pump, dryer, machine, field or utility burden is allocated once to its actual consuming processes and periods."
    source_ids:
      - iso-14044-lca-allocation
  - rule_id: validate_range_status
    applies_to: "Candidate amount ranges"
    rule: "Check every range against its amount rule, unit, denominator and route condition. Treat reasoned estimates as replaceable screening values; require evidence-backed and crop-specific ranges before reviewed/active use when a broad estimate is not suitable."
    source_ids: []
published_dataset_profile:
  dataset_role: "Primary foreground crop-production and first-handoff dataset for one spice or aromatic crop product"
  downstream_use: "Secondary process data for foreground process packages and their lifecyclemodel projections; background_dataset use only when its source coverage and boundary are suitable"
  allowed_use: "Site- and period-specific production of one identified species and plant part at the declared harvest or first primary-conditioning gate"
  excluded_use: "An aggregate inventory for all CPC 01699 products; exact coverage of the full CPC leaf; curry powders/pastes, extracts, oils, milled goods, mixtures, wild collection, or post-gate storage and distribution"
  required_metadata: "Species and variety when known; plant part; site and geography; cultivation and harvest route; crop period; area and output; gate; fresh/dried state and moisture; grades and co-products; irrigation, nutrient, crop-protection, energy and conditioning records; upstream and Flow Set resolutions; attribution method"
  required_quality_disclosure: "UUID gaps, source and measurement coverage, crop periods included, range evidence tier, moisture and grade basis, shared-asset allocation, output and waste reconciliation, emission method and factor, site and year representativeness"
  update_trigger: "New route or gate; change in crop species/plant part or product state; new reference identity; new crop-period or allocation evidence; revised official spice handling or emissions methodology; replacement of candidate ranges with reviewed evidence"
