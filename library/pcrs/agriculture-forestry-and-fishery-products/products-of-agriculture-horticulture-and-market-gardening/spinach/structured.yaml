allocation_rules:
  - rule_id: allocation_single_crop_cycle
    applies_to: "shared field, bed, or protected unit"
    rule: "Attribute crop-cycle inputs to spinach using the recorded bed or unit area and the crop-cycle output; do not allocate to a second crop without its own records."
    source_ids:
      - ucanr-spinach-production-1996
  - rule_id: allocation_multi_cut_spinach
    applies_to: "repeated cuts from one sowing"
    rule: "Treat successive cuts as outputs of the same declared crop cycle and reconcile each cut before normalizing to total marketable spinach."
    source_ids:
      - psu-spinach-harvest-guidance-2025
  - rule_id: allocation_residue_fate
    applies_to: "field residues, rejects, and trim"
    rule: "Do not assign a co-product credit to residues unless a documented recipient, quantity, and intended use exists; otherwise retain the burden with spinach production and report the residue fate."
    source_ids:
      - usda-ams-bunched-spinach-standard
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "crop_establishment"
      flow_role: "seed, transplant, and establishment nutrients"
      record_type: "seed invoice, seed lot, transplant, and input application records"
      raw_fields: "lot id; material type; viable quantity; field or bed; date; product mass; nutrient concentration"
      collection_method: "retain supplier record and field application log"
      unit: "seed, plant, kg product, kg nutrient"
      frequency: "each campaign and application"
      temporal_coverage: "full represented crop cycle"
      site_scope: "each spinach bed or protected unit"
      aggregation_rule: "sum by campaign and normalize to marketable output"
      quality_evidence: "supplier label, lot trace, application record, and crop-cycle reconciliation"
    - protocol_id: cp_irrigation_records
      process_id: "crop_establishment_crop_management"
      flow_role: "establishment and crop irrigation"
      record_type: "meter, pump, irrigation controller, or water-balance record"
      raw_fields: "source; meter start and end; event date; area; irrigation method; rainfall adjustment"
      collection_method: "meter reading or documented water-balance calculation"
      unit: "m3"
      frequency: "each event or meter period"
      temporal_coverage: "full represented crop cycle"
      site_scope: "each field, bed, or protected unit"
      aggregation_rule: "sum delivered irrigation by crop cycle and source"
      quality_evidence: "calibrated meter or documented balance inputs"
    - protocol_id: cp_field_energy_records
      process_id: "crop_establishment_crop_management"
      flow_role: "mobile machinery fuel"
      record_type: "fuel invoice and equipment activity log"
      raw_fields: "fuel type; quantity; equipment; operation; field; date; allocation basis"
      collection_method: "supplier invoice plus equipment log or activity estimate"
      unit: "L, kg, or MJ"
      frequency: "each refuelling or operation"
      temporal_coverage: "full represented crop cycle"
      site_scope: "each spinach production unit"
      aggregation_rule: "allocate shared operations by area, hours, or fuel record"
      quality_evidence: "invoice, equipment log, and allocation calculation"
    - protocol_id: cp_nutrient_records
      process_id: "crop_management"
      flow_role: "crop nutrients and nitrogen basis"
      record_type: "nutrient plan, supplier invoice, and application log"
      raw_fields: "product; nutrient concentration; application date; area; quantity; method"
      collection_method: "reconcile product records with field application records"
      unit: "kg product and kg nutrient"
      frequency: "each application"
      temporal_coverage: "full represented crop cycle"
      site_scope: "each spinach production unit"
      aggregation_rule: "sum nutrient mass by crop cycle and declared basis"
      quality_evidence: "soil test, label or supplier specification, and application log"
    - protocol_id: cp_crop_protection_records
      process_id: "crop_management"
      flow_role: "crop-protection products"
      record_type: "spray or treatment log and supplier record"
      raw_fields: "product; active ingredient; rate; area; date; target; equipment"
      collection_method: "record each application and product lot"
      unit: "kg product or kg active ingredient"
      frequency: "each application"
      temporal_coverage: "full represented crop cycle"
      site_scope: "each spinach production unit"
      aggregation_rule: "sum by active ingredient and crop cycle"
      quality_evidence: "application log and product label"
    - protocol_id: cp_field_records
      process_id: "crop_establishment"
      flow_role: "land occupation and area"
      record_type: "field register or protected-unit register"
      raw_fields: "area; unit; land use; crop dates; bed identifier; protection structure"
      collection_method: "verify area and dates against production register"
      unit: "ha, m2, and days"
      frequency: "each crop cycle"
      temporal_coverage: "full represented crop cycle"
      site_scope: "each spinach field or protected unit"
      aggregation_rule: "calculate area-time and normalize to gate output"
      quality_evidence: "field map, register, and date evidence"
    - protocol_id: cp_harvest_reconciliation
      process_id: "crop_management_harvest_and_gate_preparation"
      flow_role: "harvest, field residue, and field loss"
      record_type: "harvest ticket, scale record, and field loss record"
      raw_fields: "field; cut number; date; gross mass; marketable mass; residue; loss; destination"
      collection_method: "weigh each harvest or use documented lot reconciliation"
      unit: "kg wet material"
      frequency: "each cut or harvest lot"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each spinach field or bed"
      aggregation_rule: "reconcile gross harvest, marketable output, rejects, and residue"
      quality_evidence: "scale record, lot ticket, and destination record"
    - protocol_id: cp_postharvest_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "wash water, electricity, rejects, and wastewater"
      record_type: "pack-house batch and utility records"
      raw_fields: "received mass; wash water; discharge; electricity; trim; batch; date; fate"
      collection_method: "batch record plus meter allocation"
      unit: "kg, m3, and kWh"
      frequency: "each batch or meter period"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each preparation line or pack-house"
      aggregation_rule: "aggregate by batch and normalize to marketable packed output"
      quality_evidence: "meter record, batch sheet, and waste or treatment receipt"
    - protocol_id: cp_postharvest_energy_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "washing, cooling, and packing electricity"
      record_type: "electricity meter and equipment throughput record"
      raw_fields: "meter period; line; kWh; throughput; cooling duration; batch"
      collection_method: "meter allocation by throughput or run time"
      unit: "kWh"
      frequency: "each meter period or batch"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each in-scope preparation line"
      aggregation_rule: "allocate shared electricity by throughput and reconcile to batch output"
      quality_evidence: "meter data and allocation calculation"
    - protocol_id: cp_packaging_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "primary packaging"
      record_type: "packaging specification, bill of materials, and count record"
      raw_fields: "material; unit mass; units; reuse status; batch; output mass"
      collection_method: "packaging count and specification reconciliation"
      unit: "kg material and units"
      frequency: "each packaging lot or batch"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "each preparation line"
      aggregation_rule: "sum virgin and reusable packaging separately per packed output"
      quality_evidence: "supplier specification, count sheet, and reuse declaration"
    - protocol_id: cp_gate_output_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "marketable product and final rejects"
      record_type: "dispatch scale, lot record, and reject record"
      raw_fields: "lot; date; packed mass; unpacked mass; grade; reject; destination; gate"
      collection_method: "final scale and lot reconciliation"
      unit: "kg wet spinach"
      frequency: "each dispatch lot"
      temporal_coverage: "full represented harvest campaign"
      site_scope: "declared gate"
      aggregation_rule: "sum saleable output and reject streams; normalize to 1,000 kg"
      quality_evidence: "certified scale or lot record and grade record"
  calculation_rules:
    - id: calc_nutrient_mass
      applies_to: "fertilizer rows"
      rule: "product mass × declared nutrient fraction; retain the original product mass and nutrient basis"
      inputs:
        - "product invoice"
        - "nutrient concentration"
        - "application record"
      output: "kg N, kg P2O5, or kg K2O by crop cycle"
      source_ids:
        - govnl-spinach-production-guide-2025
    - id: calc_crop_cycle_normalization
      applies_to: "all crop-cycle inputs"
      rule: "crop-cycle quantity ÷ marketable fresh spinach mass × 1,000 kg"
      inputs:
        - "crop-cycle input"
        - "marketable output"
      output: "normalized quantity per 1,000 kg output"
      source_ids: []
    - id: calc_multi_cut_output
      applies_to: "repeated harvest routes"
      rule: "sum marketable mass from all declared cuts in the campaign; reconcile gross mass and rejects before normalization"
      inputs:
        - "cut tickets"
        - "lot records"
        - "reject records"
      output: "total crop-cycle marketable mass"
      source_ids:
        - psu-spinach-harvest-guidance-2025
    - id: calc_area_time
      applies_to: "land occupation"
      rule: "production area × represented crop-cycle duration; disclose whether protected area is included"
      inputs:
        - "area register"
        - "crop dates"
      output: "area-time quantity"
      source_ids:
        - govnl-spinach-production-guide-2025
    - id: calc_nitrogen_emission
      applies_to: "direct soil nitrous oxide"
      rule: "apply the selected IPCC-compatible factor to eligible nitrogen input and declared soil or climate method; document factors in the dataset"
      inputs:
        - "nutrient records"
        - "method choice"
        - "crop-cycle area"
      output: "kg N2O emitted to air"
      source_ids:
        - ipcc-2019-refinement-nitrogen
    - id: calc_gate_mass_balance
      applies_to: "harvest and packing"
      rule: "received harvest = marketable output + rejects + residue or loss, with documented measurement uncertainty"
      inputs:
        - "harvest tickets"
        - "packing records"
        - "reject and residue records"
      output: "reconciled mass balance"
      source_ids:
        - usda-ams-bunched-spinach-standard
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all flow and product records"
      requirement: "Declare spinach form, cultivar group, crop route, gate, harvest cut, and product state; resolve platform identities during foreground dataset construction where required."
      evidence: "lot record, product description, and reference-flow qualifiers"
    - id: quality_measurement
      applies_to: "inputs and outputs"
      requirement: "Prefer calibrated meters, scales, supplier invoices, and application logs; document estimation and allocation methods where direct measurement is unavailable."
      evidence: "meter calibration, scale record, invoice, or calculation sheet"
    - id: quality_temporal
      applies_to: "crop-cycle inventory"
      requirement: "Cover the full represented crop cycle and harvest campaign, including all cuts and material applications."
      evidence: "sowing or transplant date, application log, harvest tickets, and dispatch records"
    - id: quality_completeness
      applies_to: "crop-cycle balance"
      requirement: "Reconcile seed or transplant material, nutrient inputs, irrigation, harvest, marketable output, residue, reject, and wastewater streams."
      evidence: "crop-cycle mass and input reconciliation"
    - id: quality_disclosure
      applies_to: "dataset metadata"
      requirement: "Disclose protected cultivation, irrigation source, nutrient basis, crop-protection products, washing, cooling, packaging, and residue destination."
      evidence: "dataset metadata and supporting records"
validation_rules:
  - rule_id: validate_reference_output
    applies_to: "reference flow"
    rule: "The declared reference output must be marketable fresh spinach at the declared gate and must use mass in kg; a frozen, canned, cooked, or retail product is outside this PCR."
    source_ids:
      - usda-ams-bunched-spinach-standard
  - rule_id: validate_crop_cycle_dates
    applies_to: "crop establishment and management"
    rule: "Sowing or transplanting, applications, irrigation, harvest cuts, and gate output must fall within the declared crop cycle or be explicitly attributed to it."
    source_ids:
      - govnl-spinach-production-guide-2025
  - rule_id: validate_nutrient_basis
    applies_to: "fertilizer inputs and emissions"
    rule: "Product mass, nutrient concentration, nutrient basis, and emission calculation method must be present and internally consistent; avoid counting both product mass and nutrient mass as the same exchange."
    source_ids:
      - ucanr-spinach-production-1996
      - ipcc-2019-refinement-nitrogen
  - rule_id: validate_mass_balance
    applies_to: "harvest and gate preparation"
    rule: "Gross harvest and received mass must reconcile with marketable output, rejects, residues, and losses within the declared measurement uncertainty."
    source_ids:
      - usda-ams-bunched-spinach-standard
  - rule_id: validate_flow_set_resolution
    applies_to: "parameterized rows"
    rule: "At foreground data generation, each parameterized row must resolve to a verified UUID compatible with the specified Flow Set group, property, unit, and geography; otherwise retain an explicit coverage finding."
    source_ids: []
  - rule_id: validate_qualifiers
    applies_to: "reference flow and dataset metadata"
    rule: "Required qualifiers must be present in the dataset package, including crop form, cut, gate, washing, cooling, packaging, and production route."
    source_ids:
      - usda-ams-bunched-spinach-standard
      - psu-spinach-harvest-guidance-2025
published_dataset_profile:
  dataset_role: "foreground agricultural production dataset for fresh spinach at farm-gate or pack-house gate"
  downstream_use: "secondary_dataset for fresh-spinach product systems; background_dataset only when the provider explicitly publishes a representative regional or market-average dataset with the required metadata"
  allowed_use: "Comparative product studies, crop-cycle inventory modelling, farm or pack-house improvement, and declared fresh-spinach supply-chain assessments within the stated geography and product state"
  excluded_use: "Frozen, canned, cooked, dried, retail, consumption, seed-production, or unqualified leafy-vegetable substitution; do not extrapolate across protected and open-field routes without scenario disclosure"
  required_metadata: "product form; cultivar group; crop route; geography; crop dates; cut number; gate; yield; irrigation source and quantity; nutrient basis; crop-protection program; washing and cooling; packaging; residue and reject fate"
  required_quality_disclosure: "temporal coverage, site scope, measurement versus calculated values, allocation rules, mass-balance result, platform identity resolution status, and all provisional estimates requiring replacement by foreground records"
  update_trigger: "change in crop route, irrigation method, nutrient program, harvest form, wash or cooling line, packaging format, gate definition, or evidence that changes material quantities or boundary rules"
