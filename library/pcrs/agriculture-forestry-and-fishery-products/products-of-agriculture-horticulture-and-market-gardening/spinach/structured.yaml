data_sources:
  - id: "ucanr-spinach-production-1996"
    type: "literature"
    reference: "University of California Agriculture and Natural Resources, *Spinach Production in California*, ANR Publication 7212, https://anrcatalog.ucanr.edu/pdf/7212.pdf"
    used_for: "production route, irrigation, nutrient application, crop management, and boundary context"
  - id: "govnl-spinach-production-guide-2025"
    type: "official_guidance"
    reference: "Government of Newfoundland and Labrador, *Vegetable Crops Production Guide: Spinach*, https://www.gov.nl.ca/ffa/files/agrifoods-plants-pdf-spinach.pdf"
    used_for: "seeding, crop establishment, soil-test-based nutrient practice, and crop-cycle qualifiers"
  - id: "ufifas-leafy-vegetable-guide-2024"
    type: "extension_guidance"
    reference: "University of Florida IFAS, *Leafy Vegetable Production*, https://ask.ifas.ufl.edu/publication/CV293?downloadOpen=true"
    used_for: "seed-rate and harvest-period screening"
  - id: "fao-spinach-irrigation-schedule"
    type: "official_guidance"
    reference: "FAO, *Crop Water Management: Determination of the Irrigation Schedule for Crops Other Than Rice*, https://www.fao.org/4/T7202E/t7202e06.htm"
    used_for: "spinach irrigation scheduling context"
  - id: "usda-ams-bunched-spinach-standard"
    type: "official_guidance"
    reference: "USDA Agricultural Marketing Service, *Bunched Spinach Grades and Standards*, https://www.ams.usda.gov/grades-standards/bunched-spinach-grades-and-standards"
    used_for: "product grade, freshness, trimming, defect, reject, and gate-quality qualifiers"
  - id: "psu-spinach-harvest-guidance-2025"
    type: "extension_guidance"
    reference: "Penn State Extension, *Mid-Atlantic Commercial Vegetable Production: Spinach harvest and post-harvest considerations*, https://extension.psu.edu/downloadable/download/sample/sample_id/128944/"
    used_for: "harvest form, repeated cutting, handling, cooling, and gate-preparation context"
