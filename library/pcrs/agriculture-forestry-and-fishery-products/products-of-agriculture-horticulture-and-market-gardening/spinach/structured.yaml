system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "establishment and field management"
      rule: "Include bed preparation, sowing or transplanting, crop management, and crop-cycle inputs that produce the declared spinach output; disclose prior land use and exclude unrelated infrastructure construction."
      source_ids:
        - ucanr-spinach-production-1996
        - govnl-spinach-production-guide-2025
    - rule_id: boundary_gate_preparation
      applies_to: "harvest and packing"
      rule: "End the foreground system at the declared farm-gate or pack-house gate and include cutting, grading, trimming, washing, cooling, and primary packaging when they occur before that gate."
      source_ids:
        - usda-ams-bunched-spinach-standard
        - psu-spinach-harvest-guidance-2025
    - rule_id: boundary_soil_emissions
      applies_to: "fertilizer, crop residues, and managed soil"
      rule: "Estimate applicable direct and indirect nitrogen emissions using one declared method and the recorded nutrient inputs and residue fate; avoid double counting a nitrogen pathway."
      source_ids:
        - ipcc-2019-refinement-nitrogen
    - rule_id: boundary_residue_fate
      applies_to: "field residue, rejects, and trim"
      rule: "Record field return, composting, feed use, treatment, or disposal separately; a material with no demonstrated productive use remains a residue or waste flow."
      source_ids:
        - ucanr-spinach-production-1996
        - usda-ams-bunched-spinach-standard
boundary_abstraction:
  declared_starting_condition: "Prepared production bed or protected-cultivation unit receiving spinach seed or transplant material, with prior land use and excluded infrastructure work disclosed"
  starting_condition_role: "Start of the declared spinach crop cycle and input accounting"
  product_classification_scope: "Fresh spinach under CPC 3.0:01215 through the declared farm-gate or pack-house gate"
  recursive_input_rule: "Purchased spinach seed or transplant material is an upstream product input linked once; its own production is outside this PCR unless a separate upstream dataset is supplied."
  upstream_dataset_requirement: "Require upstream datasets for seed or transplants, fertilizers, amendments, crop-protection products, irrigation water, energy, packaging, and purchased transport or treatment services when used."
  disclosure: "Declare production geography, field or protected route, crop cycle, sowing density, irrigation source and meter basis, nutrient basis, crop-protection program, harvest form, yield and reject reconciliation, washing and cooling, packaging, residue fate, and gate location."
