allocation_rules:
  - rule_id: allocation_single_date_output
    applies_to: "orchard and harvest processes with only fresh date fruit as product output"
    rule: "Assign orchard and harvest burdens to accepted fresh date fruit when no deliberate co-product leaves the boundary. Do not treat culls or residues classified as waste as co-products."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_declared_coproducts
    applies_to: "deliberate non-date product outputs"
    rule: "If a deliberate co-product leaves the boundary, first test documented physical-causality allocation. If no defensible physical relationship exists, use documented economic allocation and report mass, revenue, reference period, and allocation factor."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_perennial_establishment
    applies_to: "orchard establishment or renewal inputs"
    rule: "Allocate establishment or renewal burdens over the declared productive period using the documented orchard-life or productive-period assumption, and disclose the assumption in dataset metadata."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_orchard_activity_records
      process_id: "date_orchard_production"
      flow_role: "planting material, nutrient products, soil amendments, crop protection, land, and orchard activity"
      record_type: "supplier invoices, application logs, orchard register, field plan, and block records"
      raw_fields: "block_id; cultivar; orchard_age; bearing_area_ha; planting_material_quantity; product_name; product_mass; nutrient_basis; application_date; fuel; electricity; area; crop_cycle"
      collection_method: "collect event records from orchard operator and reconcile to supplier and block records"
      unit: "mixed activity-specific units"
      frequency: "each application or activity, reconciled each crop cycle"
      temporal_coverage: "one declared crop cycle and harvest year"
      site_scope: "each orchard block, with block aggregation retained"
      aggregation_rule: "sum by block and crop cycle; preserve actual product and nutrient basis before normalization"
      quality_evidence: "invoices, operator logs, agronomist or field-plan review, and completeness reconciliation"
    - protocol_id: cp_irrigation_and_withdrawal_records
      process_id: "date_orchard_production"
      flow_role: "irrigation water, pumping electricity, and direct water withdrawal"
      record_type: "meter logs, pump records, water bills, source permits, or documented water-balance calculations"
      raw_fields: "block_id; source_type; meter_start; meter_end; irrigation_event_date; volume_m3; pump_kwh; withdrawal_m3; rainfed_flag"
      collection_method: "read meters or reconcile invoices and source records to irrigation schedule and block area"
      unit: "m3 and kWh"
      frequency: "every irrigation event or billing period, reconciled each crop cycle"
      temporal_coverage: "one declared crop cycle and irrigation season"
      site_scope: "each water source and orchard block"
      aggregation_rule: "sum by source, block, and crop cycle; prevent double counting supplied water and direct withdrawal"
      quality_evidence: "meter calibration or reading evidence, invoice or permit checks, and source reconciliation"
    - protocol_id: cp_harvest_output_records
      process_id: "date_harvest_farm_gate"
      flow_role: "fuel, accepted fruit, rejected fruit, and lot handling"
      record_type: "harvest log, scale ticket, lot record, contractor statement, and destination record"
      raw_fields: "block_id; harvest_date; lot_id; accepted_mass_kg; rejected_mass_kg; maturity; quality_grade; moisture_or_dry_matter; destination; fuel_quantity"
      collection_method: "weigh each harvest lot and reconcile accepted, rejected, and destination masses to farm-gate transfer"
      unit: "kg fresh fruit and activity-specific fuel unit"
      frequency: "every harvest lot, reconciled each campaign"
      temporal_coverage: "one harvest campaign and crop cycle"
      site_scope: "each orchard block and receiving lot"
      aggregation_rule: "sum accepted output and rejected output by campaign; normalize linked activity totals to accepted output"
      quality_evidence: "calibrated scale or verified ticket, lot traceability, destination evidence, and mass-balance check"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all crop-cycle inventory rows"
      rule: "reference-normalized amount = crop-cycle amount x 1,000 kg / accepted fresh-fruit mass in kg"
      inputs:
        - accepted_fresh_fruit_mass_kg
        - crop_cycle_amount
      output: "amount per 1,000 kg accepted fresh fruit"
      source_ids:
        - iso-14044-2006
    - id: calc_nutrient_basis
      applies_to: "nutrient and soil-amendment inputs"
      rule: "nutrient amount = actual product mass x declared nutrient fraction; retain product name, product mass, nutrient basis, and application event"
      inputs:
        - product_mass
        - declared_nutrient_fraction
        - nutrient_basis
      output: "nutrient-basis input amount"
      source_ids: []
    - id: calc_water_energy_reconciliation
      applies_to: "irrigation, water withdrawal, and pumping electricity"
      rule: "reconcile meter, invoice, and pump-calculation values by block and crop cycle; do not add supplied water and direct withdrawal when they describe the same volume"
      inputs:
        - meter_records
        - invoices
        - source_records
        - pump_calculation
      output: "reconciled water and electricity totals"
      source_ids:
        - fao-56-crop-evapotranspiration-1998
    - id: calc_soil_emissions
      applies_to: "soil and air nutrient-related elementary outputs"
      rule: "apply the selected geographically applicable method tier to declared nitrogen, organic-amendment, residue, soil, and climate activity data; disclose tier and factors"
      inputs:
        - nutrient_inputs
        - organic_amendments
        - residue_data
        - soil_and_climate_parameters
      output: "method-calculated emission amounts"
      source_ids:
        - ipcc-2019-refinement-vol-4
  data_quality_requirements:
    - id: dq_identity_and_qualifiers
      applies_to: "reference flow, product outputs, planting material, and crop-protection inputs"
      requirement: "Declare product identity, cultivar, geography, harvest campaign, maturity, quality grade, and identity evidence gap notes. Resolve all identities before creating a final TIDAS exchange."
      evidence: "dataset metadata, product description, and identity review"
    - id: dq_mass_reconciliation
      applies_to: "harvest and farm-gate handling"
      requirement: "Accepted fruit, rejected fruit, and other declared destinations must reconcile to recorded harvest-lot balance within documented measurement uncertainty."
      evidence: "scale tickets, lot records, destination records, and reconciliation worksheet"
