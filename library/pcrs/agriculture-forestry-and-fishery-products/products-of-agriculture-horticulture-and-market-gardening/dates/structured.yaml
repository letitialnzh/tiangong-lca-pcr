      source_ids:
        - ipcc-2019-refinement-vol-4
    - rule_id: boundary_recursive_product_inputs
      applies_to: "same-category product inputs"
      rule: "Do not loop a fresh date-fruit output back into the same date PCR. Use a distinct upstream identity for planting material or other purchased inputs and disclose retained material separately."
      source_ids:
        - iso-14044-2006
boundary_abstraction:
