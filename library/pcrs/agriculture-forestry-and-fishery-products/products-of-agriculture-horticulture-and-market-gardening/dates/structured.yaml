      source_ids:
        - iso-14044-2006
    - rule_id: boundary_fresh_unprocessed_gate
      applies_to: "reference product and farm-gate output"
      rule: "Stop the foreground boundary at transfer of fresh, unprocessed date fruit. Exclude washing, drying, preservation, packaging, off-farm storage, transport, and downstream processing."
      source_ids:
        - codex-cxs-143-1985-dates
        - iso-14044-2006
    - rule_id: boundary_direct_environmental_exchanges
      applies_to: "nutrient-related soil and air exchanges"
