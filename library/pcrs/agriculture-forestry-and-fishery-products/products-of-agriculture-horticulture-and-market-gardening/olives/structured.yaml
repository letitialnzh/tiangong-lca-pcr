system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Include establishment, tree replacement, irrigation, nutrients and plant protection, pruning, on-site energy, fresh-fruit harvest and grading actually performed before the farm gate. Quantify soil emissions only with applicable methods and activity data, retaining substance and receiving medium. Link upstream production of purchased trees, fertilizers, electricity and fuels to background data. Exclude post-gate transport, pressing, curing, washing and packaging."
      source_ids: []
    - rule_id: boundary_fresh_fruit
      applies_to: "farm-gate fruit"
      rule: "Deliver only unprocessed whole fruit; model pressing and curing in separate systems."
      source_ids:
        - ioc-table-olives
    - rule_id: boundary_periods
      applies_to: "orchard cohorts"
      rule: "Retain establishment, non-bearing, bearing, replacement and retirement years; do not assign all establishment inputs to one arbitrary harvest year."
      source_ids:
        - ioc-olive-growing
    - rule_id: boundary_grading
      applies_to: "conditional sorting"
      rule: "Activate grading only when it occurs on farm; track destinations and losses by lot."
      source_ids:
        - uc-harvest-2013
boundary_abstraction:
  declared_starting_condition: "block land condition, preceding vegetation, tree age, cultivar, density, irrigation infrastructure and base year"
  starting_condition_role: "foreground starting point for orchard establishment and multi-year burden"
