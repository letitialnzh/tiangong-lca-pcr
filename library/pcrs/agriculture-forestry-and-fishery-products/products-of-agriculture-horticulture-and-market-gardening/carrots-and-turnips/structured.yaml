allocation_rules:
  - rule_id: allocation_same_crop_and_route
    applies_to: "multiple fields, cultivars, sites, or routes"
    rule: "Keep records separate through normalization. If aggregation is necessary, allocate shared inputs by documented area-time, operating time, water delivered, throughput, or mass."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_marketable_and_off_grade
    applies_to: "marketable roots and declared secondary streams"
    rule: "Use mass allocation when culls or downgraded roots have a documented product recipient and function. If discarded, returned, or treated, model the destination instead of assigning a co-product credit."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_shared_water_and_energy
    applies_to: "shared irrigation, washing, cooling, or equipment records"
    rule: "Allocate shared utilities by measured water, product mass, batch time, or operating time and state the selected basis."
    source_ids:
      - fao-crop-evapotranspiration-56
      - fao-postharvest-handling-vegetables
  - rule_id: allocation_reusable_packaging
    applies_to: "reusable crates, bins, and pallets"
    rule: "Allocate packaging production and replacement over verified service cycles and assign losses to the route where they occur. Do not spread a single-use item over undocumented cycles."
    source_ids:
      - fao-postharvest-handling-vegetables
  - rule_id: allocation_residue_destination
    applies_to: "residues and rejects with different fates"
    rule: "Preserve destination-specific rows. Field return, compost, feed, treatment, and disposal are separate pathways and are not interchangeable co-products."
    source_ids:
      - fao-crop-residue-management
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_site_cycle_records
      process_id: "crop_establishment_root_crop_management"
      flow_role: "site, crop, variety, route, and cycle"
      record_type: "field or site register"
      raw_fields: "crop; variety; site; area; route; planting and harvest dates; prior land use"
      collection_method: "operator register and site map"
      unit: "ha and date"
      frequency: "each site and cycle"
      temporal_coverage: "complete declared crop cycle"
      site_scope: "declared field or protected site"
      aggregation_rule: "retain site-cycle rows; aggregate only after review"
      quality_evidence: "signed field record, map, and date reconciliation"
    - protocol_id: cp_planting_material_records
      process_id: "crop_establishment"
      flow_role: "planting_material_input"
      record_type: "purchase and planting record"
      raw_fields: "supplier; crop; variety; seed state; quantity; lot; destination"
      collection_method: "invoice, supplier label, and planting log"
      unit: "seed units, plants, or kg"
      frequency: "each planting event"
      temporal_coverage: "planting period"
      site_scope: "site and field"
      aggregation_rule: "sum by crop, variety, and cycle"
      quality_evidence: "invoice-to-log reconciliation"
    - protocol_id: cp_establishment_energy_records
      process_id: "crop_establishment"
      flow_role: "establishment_energy"
      record_type: "fuel, meter, or service record"
      raw_fields: "carrier; quantity; equipment; date; field; operating hours"
      collection_method: "receipts, meter readings, and machinery logs"
      unit: "kg, L, kWh, or service unit"
      frequency: "each operation"
      temporal_coverage: "establishment period"
      site_scope: "site and operation"
      aggregation_rule: "allocate shared operation by documented area or time"
      quality_evidence: "receipt, meter, or service evidence"
    - protocol_id: cp_irrigation_records
      process_id: "crop_establishment_root_crop_management"
      flow_role: "establishment_irrigation_water; production_irrigation_water"
      record_type: "water-use record"
      raw_fields: "source; meter; delivery; date; field; conveyance; reuse; return flow"
      collection_method: "meter data and verified schedule"
      unit: "m3"
      frequency: "daily, batch, or billing period"
      temporal_coverage: "complete crop cycle"
      site_scope: "field or site"
      aggregation_rule: "reconcile source withdrawal, delivered water, reuse, and discharge"
      quality_evidence: "meter calibration and water balance"
    - protocol_id: cp_site_and_cycle_records
      process_id: "crop_establishment_root_crop_management"
      flow_role: "land_occupation and crop cycle"
      record_type: "site and cycle register"
      raw_fields: "crop; variety; area; route; dates; occupation period"
      collection_method: "site map and operator register"
