  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = recorded amount / marketable farm-gate mass * 1,000 kg"
      inputs:
        - "recorded amount"
        - "marketable farm-gate mass"
      output: "normalized row value"
      source_ids:
        - mass-balance-identity
    - id: calc_area_occupation
      applies_to: "land occupation"
      rule: "area-time = declared area × crop occupation period"
      inputs:
        - area
        - dates
        - route
      output: "ha*a or declared area-time"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_nutrient_content
      applies_to: "N, P, K, and organic nutrient cards"
      rule: "nutrient mass = product mass × documented nutrient fraction; retain product and nutrient bases separately"
      inputs:
        - "product mass"
        - label
        - plan
        - "or analysis"
      output: "kg N, kg P2O5, kg K2O, or organic product mass"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_irrigation_withdrawal
      applies_to: "irrigation and withdrawal"
      rule: "Calculate source withdrawal from measured delivery and the declared conveyance or return-flow method; retain measured values where available."
      inputs:
        - "source meter"
        - "delivered water"
        - "return flow"
      output: "source withdrawal and delivered water"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: calc_managed_soil_emissions
      applies_to: "N2O, NH3, nitrate, and phosphate rows"
      rule: "Apply one declared method to nutrient, amendment, residue, soil, and drainage records; document direct and indirect pathways separately."
      inputs:
        - "nutrient and residue records"
        - "method factors"
      output: "declared elementary emissions"
      source_ids:
        - ipcc-2019-refinement-managed-soils
        - ipcc-2006-guidelines-agriculture
    - id: calc_harvest_mass_balance
      applies_to: "marketable output, culls, residues, losses, and waste"
      rule: "Reconcile harvested mass with marketable roots, culls, field residues, removed solids, water, packaging waste, and measurement tolerance."
      inputs:
        - harvest
        - grade
        - residue
        - "waste records"
      output: "balanced output set"
      source_ids:
        - mass-balance-identity
    - id: calc_conditioning_water_balance
      applies_to: "washing water and wastewater"
      rule: "wastewater = water input + retained or released product water - reuse - evaporation - measured retained water, using measured values where available."
      inputs:
        - "water input"
        - reuse
        - discharge
        - "balance terms"
      output: "wastewater volume"
      source_ids:
        - fao-postharvest-handling-vegetables
        - mass-balance-identity
    - id: calc_reusable_packaging
      applies_to: "reusable packaging"
      rule: "Allocate packaging mass and replacement over verified service cycles and assign losses to the route where they occur."
      inputs:
        - "packaging mass"
        - cycles
        - "loss record"
      output: "per-cycle packaging input and waste"
      source_ids:
        - fao-postharvest-handling-vegetables
    - id: calc_pregate_transport
      applies_to: "pre-gate transport service"
      rule: "transport service = transported mass (t) × documented distance (km); state return or empty-leg treatment."
      inputs:
        - mass
        - distance
        - route
        - load
      output: "t*km"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_reference_mass_reconciliation
      applies_to: "harvest and gate preparation"
      rule: "harvested mass = marketable output + culls and rejects + residues + field and handling losses, with moisture and tare treatment disclosed."
      inputs:
        - "harvest weights"
        - grade
        - residues
        - losses
      output: "reconciled crop-cycle mass balance"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: quality_product_identity
      applies_to: "reference product and outputs"
      requirement: "Declare carrot or turnip identity, variety, market state, maturity, grade, washing state, and gate."
      evidence: "product metadata, grade record, and gate record"
    - id: quality_site_cycle_completeness
      applies_to: "all required processes"
      requirement: "Cover the complete declared site and crop cycle, including establishment, management, every harvest, and route-specific pre-gate operations."
      evidence: "site register, dates, operation logs, and harvest records"
    - id: quality_input_traceability
      applies_to: "seed, nutrient, protection, water, energy, and packaging"
      requirement: "Link each input to a supplier, invoice, meter, application record, or documented calculation."
      evidence: "invoices, labels, meters, and operation logs"
    - id: quality_mass_balance
      applies_to: "marketable, cull, residue, wastewater, and packaging outputs"
      requirement: "Reconcile crop, water, and packaging balances and investigate unexplained residuals before release."
      evidence: "scale records, water balance, and review sign-off"
    - id: quality_nutrient_basis
      applies_to: "nutrient inputs and soil emissions"
      requirement: "State product mass, nutrient basis, composition source, application timing, and emission method."
      evidence: "label or analysis, application log, and method record"
    - id: quality_water_energy_measurement
      applies_to: "irrigation, withdrawal, washing, electricity, and fuel"
      requirement: "Prefer meter or receipt data; where calculated, disclose formula, factor, uncertainty, and allocation basis."
      evidence: "meter calibration, receipts, and calculation worksheet"
    - id: quality_destination_disclosure
      applies_to: "culls, residues, wastewater, soil solids, and packaging waste"
      requirement: "Declare the first destination and treatment or return pathway for each non-marketable stream."
      evidence: "delivery, treatment, compost, feed, disposal, or field-return record"
    - id: quality_uncertainty_and_estimates
      applies_to: "all rows using estimates or ranges"
      requirement: "Label estimated or missing values, preserve range and evidence kind, and replace provisional estimates with collected records when available."
      evidence: "uncertainty note, range metadata, and data-quality review"
validation_rules:
  - rule_id: validation_reference_identity
    applies_to: "reference flow"
    rule: "The dataset must identify one fresh, whole, unprocessed carrot or turnip product at the declared gate. An identity evidence gap remains a coverage issue and cannot be silently replaced by another root vegetable."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_required_processes
    applies_to: "process map and inventory"
    rule: "All three required processes must be present, and every detailed process section must match a process-map id."
    source_ids:
      - fao-crop-production-records
  - rule_id: validation_crop_scope
    applies_to: "product category identity"
    rule: "Carrots and turnips must remain within CPC 01251; seed production, processed products, and other root crops require separate treatment or mapping."
    source_ids:
      - fao-good-agricultural-practices
  - rule_id: validation_nutrient_non_double_counting
    applies_to: "nutrient inputs"
    rule: "One compound product is recorded once on the product basis and, when required, converted to documented nutrient equivalents without summing it as separate N, P, and K products."
    source_ids:
      - fao-good-agricultural-practices
  - rule_id: validation_water_balance
    applies_to: "irrigation, withdrawal, washing, and wastewater"
    rule: "Check source withdrawal, delivered water, reuse, evaporation, and discharge for the declared route. Do not use rainfall to close a metered irrigation row."
    source_ids:
      - fao-crop-evapotranspiration-56
      - mass-balance-identity
  - rule_id: validation_mass_balance
    applies_to: "root product, culls, residues, solids, and waste"
    rule: "Harvested roots, marketable output, culls, residues, removed solids, wastewater, and packaging waste must reconcile within the declared tolerance."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_boundary_hand_off
    applies_to: "conditioning and transport"
    rule: "Washing, grading, cooling, packaging, treatment, and transport are included only when they occur before the declared gate; post-gate distribution is excluded."
    source_ids:
      - fao-postharvest-handling-vegetables
      - codex-cxc-53-2003-fresh-produce
  - rule_id: validation_emission_method
    applies_to: "elementary emissions"
    rule: "Each emission row must state substance, compartment, method, factor basis, and whether an upstream dataset already contains the burden."
    source_ids:
      - ipcc-2019-refinement-managed-soils
      - ipcc-2006-guidelines-agriculture
  - rule_id: validation_parameterized_identity_resolution
    applies_to: "parameterized rows and reference flow"
    rule: "During foreground dataset construction, resolve each parameterized row to a compatible UUID and retain property, unit, geography, and intended-use checks. Uncovered rows remain unmapped until evidence supports a fixed identity."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_quality_disclosure
    applies_to: "published dataset profile"
    rule: "Report temporal, geographic, route, measurement, estimate, allocation, residue-fate, and evidence gap-identity limitations before downstream use."
    source_ids:
      - iso-14044-2006
published_dataset_profile:
  dataset_role: "Foreground production dataset for fresh whole carrots and turnips at farm gate"
  downstream_use: "May be used as a secondary_dataset for the declared crop, variety, route, geography, production year, and market state; may support a background_dataset only after downstream compatibility checks"
  allowed_use: "Farm-gate LCA of the declared CPC 01251 product; comparative use only when crop, grade, moisture, route, and allocation are compatible"
  excluded_use: "Other root vegetables, seed or processed products; unqualified cross-crop substitution; datasets with evidence gap mass-balance, destination, or identity gaps"
  required_metadata: "Crop and variety; CPC basis; geography; production year and cycle; route; area; irrigation and withdrawal; nutrient basis; crop protection; harvest and grade; root state and moisture; residue, cull, wastewater, soil-solid, and packaging destinations; gate; UUID resolution status"
  required_quality_disclosure: "Source and measurement method; temporal and geographic representativeness; crop and route composition; estimated or missing values; nutrient, water, energy, and emission-factor basis; allocation decision; residue, wastewater, soil-solid, and packaging destinations; parameterized-flow UUID resolution; uncertainty and range treatment"
  update_trigger: "Change in CPC interpretation, product boundary, crop or route scope, gate state, boundary or allocation method, Flow Set taxonomy, material evidence, emission method, or a new dataset showing narrower PCR treatment is needed"
