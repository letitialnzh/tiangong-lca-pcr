allocation_rules:
  - rule_id: allocation_shared_cycle_burden
    applies_to: "establishment, ratoon renewal, and shared plantation services"
    rule: "Allocate shared establishment and plantation burdens across the declared productive cycles using one declared physical basis, preferably attributed marketable output mass or area-time; disclose the basis and any excluded idle period."
    source_ids:
      - fao-plantain-postharvest-training-manual-1998
      - globalgap-ifa-fruit-vegetables-v6
  - rule_id: allocation_mixed_cultivar_output
    applies_to: "fields or harvest campaigns producing plantain and cooking-banana outputs"
    rule: "Keep cultivar or variety groups and market states separate where records allow. If a shared operation cannot be separated, allocate it by recorded marketable output mass and report the mixed-output condition."
    source_ids:
      - fao-plantain-postharvest-compendium-2011
  - rule_id: allocation_residue_recovery
    applies_to: "recovered organic material, feed use, compost, or mulch"
    rule: "Do not assign a co-product credit to field return, unmanaged decay, or undocumented use. A recovered product requires a measured output, documented destination and function, and a declared allocation or substitution rule."
    source_ids:
      - ipcc-2019-refinement-afolu
dataset_production:
  collection_protocols:
    - protocol_id: cp_plantation_register
      process_id: "plantain_field_establishment"
      flow_role: "land_occupation"
      record_type: "field and plantation register"
      raw_fields: "field area; land-use history; planting or regrowth date; productive period"
      collection_method: "survey, farm register, and dated field records"
      unit: "ha, date, year"
      frequency: "per field and cycle"
      temporal_coverage: "full represented cycle"
      site_scope: "each represented field or plantation unit"
      aggregation_rule: "area multiplied by declared occupation time and linked to output"
      quality_evidence: "field map, dated register, and site review"
    - protocol_id: cp_establishment_records
      process_id: "plantain_field_establishment"
      flow_role: "planting_material_input"
      record_type: "supplier invoice and planting log"
      raw_fields: "material type; supplier; lot; quantity purchased; viable quantity planted; planting date"
      collection_method: "invoice review and field planting log"
      unit: "plant, sucker, corm, or kg"
      frequency: "each lot and planting event"
      temporal_coverage: "establishment or renewal period"
      site_scope: "each field or plantation unit"
      aggregation_rule: "sum viable planted quantity and retain rejected quantity separately"
      quality_evidence: "invoice, lot record, and planting log"
    - protocol_id: cp_nutrient_records
      process_id: "managed_plantain_crop_cycle"
      flow_role: "nutrient_amendment_total_input"
      record_type: "nutrient plan, invoice, and application log"
      raw_fields: "product description; mass; nutrient label or test; date; field; application method"
      collection_method: "document review and application records"
      unit: "kg product, kg N, kg P2O5, or kg K2O"
      frequency: "each application"
      temporal_coverage: "full represented cycle"
      site_scope: "each field or plantation unit"
      aggregation_rule: "sum product mass and calculate nutrient basis from documented concentration"
      quality_evidence: "invoice, product label or laboratory result, and application log"
    - protocol_id: cp_crop_protection_records
      process_id: "managed_plantain_crop_cycle"
      flow_role: "crop_protection_input"
      record_type: "crop-protection register"
      raw_fields: "product; active ingredient; dose; area; date; target; method"
      collection_method: "treatment log and supplier record review"
      unit: "kg product or kg active ingredient"
      frequency: "each treatment"
      temporal_coverage: "full represented cycle"
      site_scope: "each field or plantation unit"
      aggregation_rule: "sum product and active-ingredient quantities by field and cycle"
      quality_evidence: "treatment log, product label, and applicator record"
    - protocol_id: cp_irrigation_records
      process_id: "managed_plantain_crop_cycle"
      flow_role: "irrigation_water_input; irrigation_withdrawal"
      record_type: "meter, pump, permit, or water-balance record"
      raw_fields: "source; delivered volume; withdrawal volume; return flow; date; field; method"
      collection_method: "meter reading or documented water balance"
      unit: "m3"
      frequency: "each irrigation period"
      temporal_coverage: "full represented cycle"
      site_scope: "each irrigation source and field"
      aggregation_rule: "reconcile withdrawal, delivery, return, and crop allocation"
      quality_evidence: "meter calibration, permit, or water-balance worksheet"
    - protocol_id: cp_field_energy_records
      process_id: "managed_plantain_crop_cycle"
      flow_role: "field_energy_input"
      record_type: "fuel and equipment record"
      raw_fields: "fuel type; quantity; equipment; operation; date; field; shared-use basis"
      collection_method: "invoice, tank, meter, or machine-hour record"
      unit: "L or MJ"
      frequency: "each operation or month"
      temporal_coverage: "full represented cycle"
      site_scope: "each field and shared equipment pool"
      aggregation_rule: "sum direct use and allocate shared use by declared physical basis"
      quality_evidence: "invoices, tank log, and equipment register"
    - protocol_id: cp_harvest_handling_records
      process_id: "plantain_harvest_and_gate_handling"
      flow_role: "harvest_energy_input"
      record_type: "harvest and internal logistics record"
      raw_fields: "fuel or electricity; equipment; harvest lot; date; quantity; shared-use basis"
      collection_method: "harvest log, meter, or invoice review"
      unit: "L, MJ, or kWh"
      frequency: "each harvest campaign"
      temporal_coverage: "all harvests in cycle"
      site_scope: "each harvest campaign and gate"
      aggregation_rule: "sum campaign inputs and allocate shared handling to marketable output"
      quality_evidence: "lot register, invoice, and equipment record"
    - protocol_id: cp_conditioning_water_records
      process_id: "plantain_harvest_and_gate_handling"
      flow_role: "conditioning_water_input; conditioning_wastewater_output"
      record_type: "wash-batch and wastewater record"
      raw_fields: "batch; input volume; recirculation; wastewater volume; treatment or discharge route; date"
      collection_method: "meter or batch log and treatment record"
      unit: "m3"
      frequency: "each batch or day"
      temporal_coverage: "all pre-gate conditioning"
      site_scope: "each pack-house or conditioning point"
      aggregation_rule: "sum fresh water and wastewater; document recirculation"
      quality_evidence: "meter, batch sheet, and treatment or discharge record"
    - protocol_id: cp_packaging_records
      process_id: "plantain_harvest_and_gate_handling"
      flow_role: "primary_packaging_input"
      record_type: "packaging stock and dispatch record"
      raw_fields: "material; tare; item count; capacity; reuse cycles; loss; harvest lot"
      collection_method: "stock reconciliation and dispatch record"
      unit: "kg or item"
      frequency: "each campaign or month"
      temporal_coverage: "all pre-gate packing"
      site_scope: "each packing point"
      aggregation_rule: "reconcile issued, used, returned, and lost packaging"
      quality_evidence: "purchase record, stock count, and lot record"
    - protocol_id: cp_harvest_output_records
      process_id: "plantain_harvest_and_gate_handling"
      flow_role: "marketable_output"
      record_type: "harvest, grading, and gate-weight record"
      raw_fields: "lot; cultivar; maturity; grade; gross mass; marketable mass; gate date; gate state"
      collection_method: "weighbridge, scale, and lot record"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "all harvests in cycle"
      site_scope: "each gate and harvest lot"
      aggregation_rule: "sum marketable output and retain grade and state qualifiers"
      quality_evidence: "calibrated scale, lot register, and dispatch record"
    - protocol_id: cp_residue_and_reject_records
      process_id: "managed_plantain_crop_cycle_plantain_harvest_and_gate_handling_plantain_residue_and_reject_routing"
      flow_role: "field_residue_output; rejected_fruit_output; residue_reject_input; recovered_organic_material_output; residue_disposal_output"
      record_type: "residue and reject destination record"
      raw_fields: "material; wet or dry basis; quantity; origin; destination; recovery; disposal; date"
      collection_method: "field estimate, scale, destination receipt, or treatment record"
      unit: "kg wet or dry material"
      frequency: "each event or harvest lot"
      temporal_coverage: "full represented cycle"
      site_scope: "each field, gate, and destination"
      aggregation_rule: "reconcile all residue and reject destinations to recorded generated material"
      quality_evidence: "field log, scale, receipt, and destination declaration"
    - protocol_id: cp_emission_calculation_records
      process_id: "managed_plantain_crop_cycle"
      flow_role: "direct_n2o_emission; ammonia_emission; water_nitrate_emission"
      record_type: "calculation worksheet"
      raw_fields: "nutrient basis; residue basis; method; site factors; receiving medium; result"
      collection_method: "documented calculation using one declared method"
      unit: "kg N2O, kg NH3, or kg nitrate"
      frequency: "each cycle or method update"
      temporal_coverage: "full represented cycle"
      site_scope: "each field or production unit"
      aggregation_rule: "calculate each pathway once and link to the contributing records"
      quality_evidence: "input records, method version, and reviewer check"
  calculation_rules:
    - id: calc_output_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = recorded amount × 1,000 kg / marketable fresh gate output (kg)"
      inputs:
        - "recorded amount"
        - "marketable gate output"
      output: "amount per 1,000 kg reference output"
      source_ids:
        - fao-plantain-postharvest-compendium-2011
    - id: calc_nutrient_basis
      applies_to: "nutrient_amendment_total_input"
      rule: "nutrient mass = documented product mass × documented nutrient fraction; retain product mass and nutrient basis as separate fields"
      inputs:
        - "product mass"
        - label
        - "supplier specification"
        - "nutrient plan"
        - "or laboratory result"
      output: "kg product and kg nutrient basis"
      source_ids:
        - ipcc-2019-refinement-afolu
    - id: calc_cycle_allocation
      applies_to: "shared establishment, machinery, irrigation, energy, and conditioning records"
      rule: "allocated amount = shared record × declared physical allocation fraction; use marketable output mass or area-time and disclose the choice"
      inputs:
        - "shared record"
        - "allocation basis"
        - "product or cycle output"
      output: "crop-cycle amount"
      source_ids:
        - globalgap-ifa-fruit-vegetables-v6
    - id: calc_harvest_reconciliation
      applies_to: "marketable_output; rejected_fruit_output; field_residue_output"
      rule: "total recorded harvest = marketable output + rejected or trimmed fruit + field residue or other documented loss; investigate unexplained difference"
      inputs:
        - "lot weights"
        - "residue and reject records"
        - "loss record"
      output: "reconciled harvest and loss balance"
      source_ids:
        - fao-plantain-postharvest-compendium-2011
    - id: calc_water_reconciliation
      applies_to: "irrigation_water_input; irrigation_withdrawal"
      rule: "source withdrawal = delivered irrigation + documented return flow + documented distribution loss; use only measured or declared site-specific factors"
      inputs:
        - "source meter"
        - "delivery meter"
        - "return flow"
        - "loss factor"
      output: "irrigation delivery and withdrawal"
      source_ids:
        - globalgap-ifa-fruit-vegetables-v6
    - id: calc_emission_pathway
      applies_to: "soil, nutrient, residue, and water-emission rows"
      rule: "apply one declared emissions method to the documented input and receiving-medium basis; do not combine overlapping default factors"
      inputs:
        - "nutrient and residue records"
        - method
        - "site factors"
      output: "pathway-specific elementary flow amount"
      source_ids:
        - ipcc-2019-refinement-afolu
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference flow and all inventory rows"
      requirement: "State the plantain or cooking-banana cultivar or variety group, process role, gate, direction, flow type, and identity evidence gap status where no reviewed identity is available."
      evidence: "lot records, process notes, and review of identity evidence gap coverage"
    - id: quality_completeness
      applies_to: "all required and conditional processes"
      requirement: "Include every required process and activate conditional conditioning, packaging, and residue-routing rows when the activity occurs before the declared gate."
      evidence: "process map, activity checklist, and site boundary review"
    - id: quality_temporal_geographic
      applies_to: "all collected records"
      requirement: "Cover the complete declared crop cycle or production year and identify geography, field, plantation unit, harvest lot, and gate."
      evidence: "field register, dated records, and production-year declaration"
    - id: quality_measurement_traceability
      applies_to: "measured quantities"
      requirement: "Retain source records, calibration or verification evidence, unit conversions, and allocation worksheets for mass, water, energy, nutrients, and packaging."
      evidence: "invoices, meters, scales, laboratory or label evidence, and worksheets"
    - id: quality_reconciliation
      applies_to: "output, residue, reject, water, and wastewater rows"
      requirement: "Reconcile inputs and destinations and investigate material unexplained differences before publishing the foreground package."
      evidence: "reconciliation worksheets and reviewer sign-off"
    - id: quality_method_disclosure
      applies_to: "calculated emissions and recovered products"
      requirement: "Disclose the selected method, version, input basis, receiving medium, product function, and any allocation or substitution claim."
      evidence: "calculation worksheet, method citation, destination record, and review note"
validation_rules:
  - rule_id: validation_reference_qualifiers
    applies_to: "reference flow and dataset metadata"
    rule: "Reject a dataset that omits the declared product group, production geography, cycle or year, gate, maturity or grade, and product-state qualifiers required by this PCR."
    source_ids:
      - fao-plantain-postharvest-compendium-2011
      - globalgap-ifa-fruit-vegetables-v6
  - rule_id: validation_identity_coverage
    applies_to: "all flow cards"
    rule: "Accept a parameterized Flow Set only when its group semantically covers the row. For every uncovered row, require a later verified identity or retain an explicit unmapped-coverage finding; do not substitute a nearby product identity."
    source_ids:
      - ipcc-2019-refinement-afolu
  - rule_id: validation_process_completeness
    applies_to: "process map and conditional rows"
    rule: "Check all four process nodes, activate conditional rows when the activity occurs, and ensure every active flow card has a direction, flow type, amount rule, value mode, specificity, basis, evidence kind, collection protocol where applicable, and source or explicit evidence gap status."
    source_ids:
      - globalgap-ifa-fruit-vegetables-v6
  - rule_id: validation_reconciliation
    applies_to: "output, residue, reject, irrigation, and conditioning records"
    rule: "Require harvest, reject, residue, water, and wastewater reconciliations and fail on unexplained material differences or double-counted emission pathways."
    source_ids:
      - fao-plantain-postharvest-compendium-2011
      - ipcc-2019-refinement-afolu
  - rule_id: validation_boundary
    applies_to: "dataset scope and downstream use"
    rule: "Confirm that the dataset ends at the declared farm-gate or pack-house gate and contains no post-gate transport, retail, consumer, or processed-food activity unless separately declared in another dataset."
    source_ids:
      - fao-plantain-postharvest-training-manual-1998
published_dataset_profile:
  dataset_role: "secondary_dataset for a reviewed foreground plantain or cooking-banana production dataset; background_dataset only when the documented gate and data quality are suitable for that use"
  downstream_use: "Supply to product-system, process, and lifecycle-model construction for fresh unprocessed plantains or cooking bananas at the declared farm-gate or pack-house gate"
  allowed_use: "Comparative or attributional modelling when geography, cultivar or variety group, crop cycle, gate, product state, inventory coverage, and identity evidence gap findings are disclosed"
  excluded_use: "Processed-food, drying, freezing, cooking, retail, consumer, post-gate logistics, or site claims that exceed the declared boundary; substitution or residue credits without documented function and allocation"
  required_metadata: "CPC 3.0:01313; product group; geography; farm or pack-house gate; crop year or cycle; field and plantation scope; cultivar or variety group; maturity and grade; production route; yield; nutrient, water, energy, crop-protection, residue, reject, conditioning, and packaging records; identity and method status"
  required_quality_disclosure: "Temporal and geographic coverage, completeness, measurement traceability, allocation basis, calculation method, conditional-process activation, identity evidence gaps, and reconciliation results"
  update_trigger: "New production route, cultivar or variety group, gate condition, nutrient or irrigation practice, residue or conditioning pathway, material identity, method version, or material quality finding"
