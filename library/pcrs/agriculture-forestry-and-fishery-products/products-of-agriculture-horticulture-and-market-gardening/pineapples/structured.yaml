  - rule_id: validation_input_completeness
    applies_to: "production and harvest"
    rule: "Confirm propagation material, nutrients, crop protection, water, land, energy, transport, and emissions have a value, justified zero, or documented exclusion."
    source_ids:
      - fao-gap-framework-2003
      - ipcc-2019-refinement
  - rule_id: validation_water_and_energy
    applies_to: "irrigation and conditioning"
