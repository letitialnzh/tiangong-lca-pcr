  - rule_id: validation_cycle_coverage
    applies_to: "process map"
    rule: "Confirm plant, ratoon, replant, and crop-year treatment is explicit and not double counted."
    source_ids:
      - fao-pineapple-production-guide
      - iso-14044
  - rule_id: validation_input_completeness
    applies_to: "production and harvest"
    rule: "Confirm propagation material, nutrients, crop protection, water, land, energy, transport, and emissions have a value, justified zero, or documented exclusion."
    source_ids:
      - fao-crop-production-methodology
      - ipcc-2019-refinement
  - rule_id: validation_water_and_energy
    applies_to: "irrigation and conditioning"
    rule: "Confirm withdrawal, delivered water, pumping energy, field fuel, and conditioning electricity remain distinct and have a declared basis."
    source_ids:
      - fao-crop-evapotranspiration-56
      - fao-postharvest-handling
  - rule_id: validation_mass_balance
    applies_to: "harvest and conditioning"
    rule: "Confirm input, accepted fruit, culls, residues, wastewater, and losses reconcile and each non-reference output has a fate."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_allocation_and_disclosure
    applies_to: "shared burdens and outputs"
    rule: "Confirm cycle allocation, multi-output treatment, gate, quality, geography, crop year, and sensitivity are disclosed."
    source_ids:
      - iso-14044
      - iso-14067
