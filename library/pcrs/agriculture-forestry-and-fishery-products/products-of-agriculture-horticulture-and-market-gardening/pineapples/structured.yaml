      - iso-14044
      - iso-14067
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "LCA modelling for whole fresh pineapple at a compatible declared gate, crop cycle, geography, irrigation status, quality, and period"
  excluded_use: "processed products; nursery systems; datasets without cycle, gate, quality, water, or output-fate disclosure; downstream logistics or consumer studies outside the boundary"
  required_metadata: "canonical PCR id; CPC reference; field or farm scope; variety; plant or ratoon cycle; crop year; geography; irrigation and water source; nutrient and crop-protection basis; yield; accepted and rejected fruit; conditioning status; gate; allocation; factor tier status; protocol coverage"
  required_quality_disclosure: "represented cycles and years; primary-record coverage; scale and meter calibration; water treatment; mass-balance tolerance; factor sources and methods; parameterized and unmapped flows; exclusions; uncertainty and sensitivity"
  update_trigger: "change in cycle model, variety, route, water source, nutrient or crop-protection practice, yield, conditioning boundary, identity taxonomy, emission method, or representativeness period"
data_sources:
  - id: "codex-cxs-182-1993"
    type: "standard"
    reference: "Codex Alimentarius CXS 182-1993, Standard for Pineapples"
    used_for: "fresh scope, quality descriptors, and processing exclusion"
  - id: "fao-crop-evapotranspiration-56"
    type: "official_guidance"
    reference: "FAO Irrigation and drainage paper 56, Crop evapotranspiration"
    used_for: "irrigation records and water-balance distinctions"
  - id: "ipcc-2019-refinement"
    type: "method_factor"
    reference: "2019 IPCC Refinement to the 2006 IPCC Guidelines"
    used_for: "managed-soil and residue emission calculations"
  - id: "emep-eea-2023-guidebook"
    type: "method_factor"
    reference: "EMEP/EEA air pollutant emission inventory guidebook, agricultural chapters"
    used_for: "agricultural emission method selection"
  - id: "iso-14044"
    type: "standard"
    reference: "ISO 14044, Environmental management — LCA requirements and guidelines"
    used_for: "allocation hierarchy, co-product treatment, and validation"
  - id: "iso-14067"
    type: "standard"
    reference: "ISO 14067, Greenhouse gases — Carbon footprint of products"
    used_for: "product boundary disclosure and quality reporting"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation of mass applied as a PCR calculation identity"
    used_for: "harvest and conditioning reconciliation"
  - id: "declared-handoff-measurement-definition"
    type: "method_factor"
    reference: "This PCR, Sections 3, 6 and 8: measured net mass at the same state and gate is its own normalization denominator, giving a mass ratio of 1; handoff measurement adds no physical processing."
    used_for: "Same-stage and handoff measurement identities; a definition, not an observed yield, empirical default or external publication."
  - id: "fao-gap-framework-2003"
    type: "official_guidance"
    reference: "FAO Committee on Agriculture, COAG/2003/6, Development of a Framework for Good Agricultural Practices, section IV paragraphs 24–26 and Annex, https://www.fao.org/4/y8704e/y8704e.htm"
    used_for: "Generic monitoring and farm-record context only; crop-specific routes, lifetimes, quantitative ranges and LCA allocation are PCR choices requiring separate applicable evidence."
  - id: "fao-postharvest-handling-ae075e"
    type: "official_guidance"
    reference: "Kitinoja and Kader, Small-Scale Postharvest Handling Practices: A Manual for Horticultural Crops, 4th edition (2002), FAO-hosted original, https://www.fao.org/4/ae075e/ae075e00.htm"
    used_for: "General handling, cooling and loss-record context only; crop-specific parameters and this PCR gate/attribution require separate evidence."
  - id: "fao-fertilizer-identities"
    type: "official_guidance"
    reference: "FAO Fertilizer Specifications, https://www.fao.org/agriculture/crops/thematic-sitemap/theme/spi/plantnutrition/fertspecs/en/"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
  - id: "fao-organic-nutrients"
    type: "official_guidance"
    reference: "FAO How to Make and Use Compost, https://www.fao.org/4/i2230e/i2230e.pdf"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
