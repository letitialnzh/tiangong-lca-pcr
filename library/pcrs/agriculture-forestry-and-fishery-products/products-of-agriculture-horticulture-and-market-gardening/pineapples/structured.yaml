  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = recorded amount / accepted fresh pineapple output × 1 kg"
      inputs:
        - "recorded amount"
        - "accepted output"
        - "gate and cycle"
      output: "amount per 1 kg accepted output"
      source_ids:
        - mass-balance-identity
    - id: calc_cycle_allocation
      applies_to: "plant and ratoon cycles"
      rule: "Allocate shared field and establishment records by declared cycle duration and accepted output; disclose basis and sensitivity."
      inputs:
        - area
        - duration
        - output
        - "shared input"
      output: "cycle-attributed input or emission"
      source_ids:
        - iso-14044
        - fao-gap-framework-2003
    - id: calc_nutrient_basis
      applies_to: "fertilizer and amendments"
      rule: "nutrient mass = product mass × declared nutrient fraction; retain product and nutrient separately."
      inputs:
        - "product mass"
        - "label or analysis fraction"
      output: "kg nutrient and kg product"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_managed_soil_emission
      applies_to: "soil emissions"
      rule: "Apply the selected method tier to nutrient, amendment, residue, and soil inputs; convert N2O-N only when required and disclose the factor."
      inputs:
        - inputs
        - factor
        - conversion
      output: "emission by substance and compartment"
      source_ids:
        - ipcc-2019-refinement
        - emep-eea-2023-guidebook
    - id: calc_output_reconciliation
      applies_to: "harvest and conditioning"
      rule: "input mass = accepted output + culls + residues + measured loss after aligning the declared basis."
      inputs:
        - input
        - output
        - culls
        - residues
        - loss
      output: "mass-balance result and discrepancy"
      source_ids:
        - mass-balance-identity
