allocation_rules:
  - rule_id: allocation_subdivision_priority
    applies_to: "crop, harvest, and conditioning"
    rule: "First subdivide plant, ratoon, harvest, field delivery, conditioning, and storage responsibilities when records support separate nodes."
    source_ids:
      - iso-14044
      - fao-gap-framework-2003
  - rule_id: allocation_plant_and_ratoon_cycles
    applies_to: "shared field and infrastructure burdens"
    rule: "Attribute shared establishment and multi-cycle burdens using declared cycle, duration, and accepted-output bases; disclose sensitivity when incomplete."
    source_ids:
      - iso-14044
      - fao-gap-framework-2003
  - rule_id: allocation_fruit_and_nonreference_outputs
    applies_to: "accepted fruit, culls, residues, and losses"
    rule: "Record intended outputs, residues, culls, and waste with separate fates. If subdivision is unavailable, use a declared physical or economic method and disclose the alternative."
    source_ids:
      - iso-14044
      - mass-balance-identity
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
