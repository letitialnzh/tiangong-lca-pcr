system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "establishment and cultivation"
      rule: "Include bed preparation attributable to the declared crop cycle, planting, crop management, irrigation, nutrient and crop protection, and direct crop emissions; disclose prior land use and exclude unrelated infrastructure construction."
      source_ids:
        - fao-good-agricultural-practices
    - rule_id: boundary_repeated_picking
      applies_to: "harvest rounds"
      rule: "Attribute every picking round from one planting to the same crop cycle and reconcile marketable pods, downgraded pods, rejects, field losses, and residues before normalization."
      source_ids:
        - usda-snap-bean-standard
        - mass-balance-identity
    - rule_id: boundary_gate_conditioning
      applies_to: "sorting, washing, cooling, and packing"
      rule: "End the default foreground boundary at the declared farm-gate or pack-house gate. Include sorting, washing, cooling, primary packaging, and pre-gate transport only when they occur before that gate."
      source_ids:
        - usda-snap-bean-standard
        - codex-fresh-produce-hygiene
    - rule_id: boundary_residue_fate
      applies_to: "crop residues, pod culls, and packaging waste"
      rule: "Record field return, composting, feed use, treatment, transport, or disposal for each residue stream. Do not assign a co-product credit without a documented recipient, intended use, quality, and hand-off."
      source_ids:
        - iso-14044-2006
        - mass-balance-identity
boundary_abstraction:
  declared_starting_condition: "Prepared field bed or protected cultivation unit receiving green-bean seed or planting material, with prior land use and excluded infrastructure work disclosed"
  starting_condition_role: "Start of the declared green-bean crop cycle and foreground input accounting"
  product_classification_scope: "CPC 3.0 01241, Beans, green, through the declared farm-gate or pack-house hand-off"
  recursive_input_rule: "Green-bean seed or other planting material is recorded at its received hand-off state and linked to an upstream dataset; its own production is not recreated inside this PCR."
  upstream_dataset_requirement: "Use upstream datasets for planting material, nutrient products, crop-protection products, supplied water, fuels, electricity, packaging, purchased transport, and waste-treatment services when those inputs cross the boundary."
  disclosure: "Declare variety group, geography, route, planting density, crop-cycle dates, irrigation source and method, nutrient product and nutrient basis, crop-protection program, picking rounds, marketable yield, downgraded and rejected pods, residues, washing and cooling, packaging, fate of wastes, and declared gate."
