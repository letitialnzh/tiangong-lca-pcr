allocation_rules:
  - rule_id: allocation_shared_crop_inputs
    applies_to: "multiple crops or products sharing a field, bed, meter, facility, or transport"
    rule: "Allocate shared inputs using measured crop-specific records where available. If a shared record cannot be separated, use a documented physical basis such as area-time, operating time, water delivered, or mass, and disclose the basis."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_downgraded_pods
    applies_to: "downgraded pods and other secondary outputs"
    rule: "Treat downgraded pods as waste or residue unless a recipient, intended use, quality, and hand-off are documented. Apply co-product allocation only when the secondary output has a defined function and the allocation basis is stated."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_establishment_records
      process_id: "crop_establishment"
      flow_role: "planting material"
      record_type: "supplier lot and planting log"
      raw_fields: "lot, seed or planting-material form, quantity, variety, date, field or bed"
      collection_method: "transcribe invoices and planting logs; verify lot against planting record"
      unit: "kg, seed, or plant"
      frequency: "each planting event"
      temporal_coverage: "complete crop cycle"
      site_scope: "each represented field, bed, or protected unit"
      aggregation_rule: "sum planted viable quantity by crop-cycle unit"
      quality_evidence: "lot invoice, planting log, and supervisor check"
    - protocol_id: cp_area_cycle_records
      process_id: "crop_establishment"
      flow_role: "land occupation"
      record_type: "field or facility register"
      raw_fields: "area, unit, crop dates, protected status, prior use"
      collection_method: "map or register production unit and verify start and end dates"
      unit: "ha and date"
      frequency: "each crop cycle"
      temporal_coverage: "full crop occupation period"
      site_scope: "each field, bed, or protected unit"
      aggregation_rule: "multiply area by declared occupation period"
      quality_evidence: "field map, lease or facility record, date record"
    - protocol_id: cp_irrigation_records
      process_id: "crop_management"
      flow_role: "irrigation and withdrawal"
      record_type: "meter, permit, or water-balance record"
      raw_fields: "source, meter, application, date, volume, return flow"
      collection_method: "read meter or reconstruct documented water balance"
      unit: "m3"
      frequency: "each application or daily total"
      temporal_coverage: "establishment to final picking"
      site_scope: "each water source and crop unit"
      aggregation_rule: "sum by crop cycle and separate source withdrawal from delivery"
      quality_evidence: "meter calibration, permit, or water-balance check"
    - protocol_id: cp_nutrient_records
      process_id: "crop_management"
      flow_role: "nutrient inputs and soil emissions"
      record_type: "invoice, label, nutrient plan, and application log"
      raw_fields: "product, mass, nutrient fraction, date, method, area, residue fate"
      collection_method: "reconcile purchases to application records and calculate nutrient equivalents"
      unit: "kg product and kg nutrient"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each crop unit"
      aggregation_rule: "sum applications assigned to the crop cycle"
      quality_evidence: "supplier label, nutrient plan, laboratory, or log review"
    - protocol_id: cp_crop_protection_records
      process_id: "crop_management"
      flow_role: "crop-protection products"
      record_type: "spray and stock record"
      raw_fields: "product, active ingredient, dose, date, area, method"
      collection_method: "reconcile spray logs with invoices and stock movement"
      unit: "kg product or active ingredient"
      frequency: "each application"
      temporal_coverage: "full crop cycle"
      site_scope: "each crop unit"
      aggregation_rule: "sum by product and active ingredient"
      quality_evidence: "product label, application log, trained-operator check"
    - protocol_id: cp_energy_records
      process_id: "crop_management"
      flow_role: "field and post-harvest energy"
      record_type: "meter, fuel, or invoice record"
      raw_fields: "carrier, quantity, operation, equipment, date, crop or batch assignment"
      collection_method: "read meter or reconcile fuel receipts and operating records"
      unit: "kWh, MJ, L, or kg"
      frequency: "each operation or billing period"
      temporal_coverage: "full crop cycle and pre-gate handling"
      site_scope: "field, facility, and shared equipment"
      aggregation_rule: "allocate shared use by declared physical basis"
      quality_evidence: "meter, receipt, machine-hour, or allocation record"
    - protocol_id: cp_residue_fate_records
      process_id: "crop_management"
      flow_role: "crop residues"
      record_type: "residue and recipient record"
      raw_fields: "stream, wet mass, fate, recipient, date, field"
      collection_method: "weigh or estimate residue and retain fate evidence"
      unit: "kg wet residue"
      frequency: "each removal or crop-cycle close"
      temporal_coverage: "crop-cycle close and post-harvest cleanup"
      site_scope: "each crop unit"
      aggregation_rule: "sum by residue stream and fate"
      quality_evidence: "weigh ticket, recipient record, or treatment receipt"
    - protocol_id: cp_harvest_grade_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "marketable output, downgraded pods, and rejects"
      record_type: "harvest and grading record"
      raw_fields: "date, picking round, gross harvest, accepted mass, downgraded mass, rejects, grade, gate"
      collection_method: "weigh each picking round and reconcile grade outcomes"
      unit: "kg"
      frequency: "each picking round"
      temporal_coverage: "entire harvest campaign"
      site_scope: "each field, bed, or campaign"
      aggregation_rule: "sum by crop cycle and declared gate"
      quality_evidence: "scale record, grade sheet, and mass-balance check"
    - protocol_id: cp_postharvest_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "washing, cooling, and wastewater"
      record_type: "batch, meter, or equipment record"
      raw_fields: "batch, water, recirculation, cooling time, loss, solids, discharge"
      collection_method: "read batch or meter record and link to harvest lot"
      unit: "m3, kWh, kg, and h"
      frequency: "each batch"
      temporal_coverage: "all pre-gate handling"
      site_scope: "pack-house or declared handling site"
      aggregation_rule: "aggregate by accepted output batch"
      quality_evidence: "batch sheet, meter, sanitation, and treatment record"
    - protocol_id: cp_packaging_transport_records
      process_id: "harvest_and_gate_preparation"
      flow_role: "packaging, packaging waste, and pre-gate transport"
      record_type: "packaging issue and dispatch record"
      raw_fields: "material, tare, reuse, item count, mass, distance, vehicle, load"
      collection_method: "reconcile packaging and dispatch records to accepted harvest lots"
      unit: "kg, item, km, or t*km"
      frequency: "each campaign or dispatch"
      temporal_coverage: "all in-scope pre-gate movements"
      site_scope: "field, pack-house, and route"
      aggregation_rule: "sum packaging and transport by declared gate output"
      quality_evidence: "package specification, dispatch note, route record"
  calculation_rules:
    - id: calc_area_occupation
      applies_to: "crop establishment"
      rule: "area-time = declared production area × crop occupation period; keep protected structures separate when separately attributed"
      inputs:
        - area
        - "start date"
        - "end date"
        - "protected status"
      output: "ha*a or declared area-time"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_nutrient_equivalents
      applies_to: "nutrient inputs"
      rule: "nutrient mass = formulated product mass × documented nutrient fraction; retain product and nutrient bases separately and de-duplicate compound products"
      inputs:
        - "product mass"
        - "label or plan concentration"
      output: "kg N, kg P2O5, and kg K2O"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_managed_soil_emissions
      applies_to: "nitrogen-related elementary outputs"
      rule: "apply one declared nitrogen-emission method to nutrient inputs, crop residues, and environmental factors; do not duplicate pathways"
      inputs:
        - "nutrient input"
        - "residue fate"
        - "method factors"
      output: "declared nitrogen emission flows"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calc_water_balance
      applies_to: "irrigation, withdrawal, washing, and wastewater"
      rule: "reconcile source withdrawal, delivered water, recirculation, evaporation, retained solids, and discharged water; keep irrigation and washing systems separate"
      inputs:
        - "meter readings"
        - "batch records"
        - "return flow"
        - "and solids"
      output: "water-delivery and wastewater values"
      source_ids:
        - fao-crop-evapotranspiration-56
        - mass-balance-identity
    - id: calc_transport_service
      applies_to: "pre-gate road freight"
      rule: "transport service = transported mass (t) × documented distance (km); state whether return or empty-leg burden is included"
      inputs:
        - mass
        - distance
        - load
        - "and route record"
      output: "t*km"
      source_ids:
        - fao-good-agricultural-practices
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized value = crop-cycle quantity × 1,000 kg / accepted marketable output at the declared gate"
      inputs:
        - "crop-cycle quantity and accepted output mass"
      output: "quantity per 1,000 kg reference flow"
      source_ids:
        - mass-balance-identity
    - id: calc_mass_reconciliation
      applies_to: "harvest, downgraded pods, rejects, residues, losses, and packaging"
      rule: "gross harvested mass = accepted output + downgraded pods + rejects + field or handling losses + declared residue streams, with measured moisture and tare treatment disclosed"
      inputs:
        - picking
        - grade
        - residue
        - packaging
        - "and loss records"
      output: "reconciled crop-cycle mass balance"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all flows and product qualifiers"
      requirement: "Record semantic identity, physical state, direction, process role, and evidence gap or verified status for every flow; resolve the reference identity before final dataset publication."
      evidence: "flow description, qualifier record, and foreground review"
    - id: dq_measurement
      applies_to: "quantities and conversions"
      requirement: "Use calibrated scales, meters, invoices, logs, or transparent calculations; retain raw values and conversion factors with units."
      evidence: "measurement record and calculation worksheet"
    - id: dq_temporal
      applies_to: "crop cycle and harvest campaign"
      requirement: "Cover the complete declared planting-to-gate period and identify missing picking rounds, exceptional weather, or substituted records."
      evidence: "planting, application, picking, and gate dates"
    - id: dq_completeness
      applies_to: "boundary inputs and outputs"
      requirement: "Provide a value, justified zero, or documented exclusion for planting material, land, water, nutrients, protection, energy, emissions, yield, downgraded pods, rejects, residues, packaging, wastewater, and pre-gate transport when applicable."
      evidence: "completeness checklist and mass-balance review"
    - id: dq_allocation
      applies_to: "shared meters, fields, facilities, packaging, or transport"
      requirement: "State the allocation basis and test its effect when records serve multiple crops, products, or campaigns."
      evidence: "allocation record and sensitivity note"
    - id: dq_disclosure
      applies_to: "final dataset metadata"
      requirement: "Declare variety group, geography, route, planting and picking dates, crop cycle, gate, yield and grade, irrigation and nutrient bases, crop protection, residue and reject fates, packaging, washing, wastewater, pre-gate transport, and any identity evidence gap."
      evidence: "dataset metadata and reference-flow comment"
validation_rules:
  - rule_id: validation_reference_definition
    applies_to: "reference flow"
    rule: "Confirm the 1,000 kg functional unit, all required qualifiers, and the verified reference product, mass property, and unit-group identities before foreground generation."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_flow_set_binding
    applies_to: "parameterized product inputs"
    rule: "Resolve each parameterized row during foreground data generation using the cited Flow Set id, version, group, structural coordinate, property, unit, geography, and intended-use evidence; do not treat a Flow Set as a final UUID."
    source_ids: []
  - rule_id: validation_mass_reconciliation
