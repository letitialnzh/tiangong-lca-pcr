system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary runs from the declared orchard starting condition through perennial orchard management, harvest and collection, separation from the cashew apple, and the fresh farm-gate hand-off of accepted cashew nuts in shell. An extended conditioning route additionally includes sun or mechanical drying, cleaning, in-shell quality sorting, storage, and the declared post-harvest gate. Upstream production of planting material, fertilizers, crop-protection products, supplied irrigation water, energy carriers, machinery services, and packaging uses representative background datasets. Shelling, CNSL recovery, kernel processing, retail, post-gate transport, and post-gate storage are outside the default boundary."
      source_ids: []
    - rule_id: boundary_orchard_to_farm_gate
      applies_to: "all conforming datasets"
      rule: "Include perennial orchard establishment, immature years, productive management, harvest, collection, cashew-apple separation, and the declared fresh farm-gate hand-off."
      source_ids:
        - fao-cashew-india-production-1998
        - iso-14044-2006
    - rule_id: boundary_conditioning_extension
      applies_to: "extended post-harvest route"
      rule: "Include drying, cleaning, in-shell grading, and storage only when the declared dataset gate extends beyond the fresh farm gate. Report the extended gate and do not relabel it as the platform fresh/unprocessed state."
      source_ids:
        - fao-cashew-postharvest-2020
        - fao-cashew-minor-oil-crops
    - rule_id: boundary_perennial_orchard_disclosure
      applies_to: "establishment and replacement"
      rule: "Allocate establishment, immature years, replacement trees, and removal over the declared orchard-life and accepted-output basis; disclose life, non-bearing years, and replacement events."
      source_ids:
        - fao-cashew-india-production-1998
        - iso-14044-2006
    - rule_id: boundary_no_shelling
      applies_to: "in-shell product"
      rule: "Retain the hard shell in the product boundary. Exclude shelling, CNSL recovery, kernel separation, roasting, steaming, peeling, and kernel grading because they produce downstream shelled-kernel routes."
      source_ids:
        - fda-cashew-nut-methods
        - fao-cashew-minor-oil-crops
    - rule_id: boundary_quality_and_fate
      applies_to: "all outputs"
      rule: "Separate accepted in-shell nuts, cashew apples, downgraded lots, rejected nuts, foreign material, dust, water loss, and unexplained loss by measured mass and declared fate."
      source_ids:
        - fao-cashew-postharvest-2020
        - fda-cashew-nut-methods
        - mass-balance-identity
boundary_abstraction:
  declared_starting_condition: "orchard site before or at establishment, with planting material and purchased management inputs crossing the foreground boundary; prior land use and existing orchard history are disclosed"
  starting_condition_role: "start of managed perennial cashew production and orchard asset accounting"
  product_classification_scope: "CPC 3.0 01372, Cashew nuts, in shell; shelled cashews and downstream cashew products are outside this PCR"
  recursive_input_rule: "Same-category planting material or retained in-shell nuts crossing the boundary are recorded as upstream inputs and are not recursively expanded into another in-shell product output. Internal hand-offs between orchard, harvest, conditioning, and storage are process links and are not additional market outputs."
  upstream_dataset_requirement: "Use representative upstream datasets for nursery material, nutrient products, crop protection, irrigation supply, fuel, electricity, drying energy, packaging, machinery services, and waste treatment when these inputs cross the boundary."
  disclosure: "cultivar and orchard block; geography, soil, climate, and land history; establishment year, orchard age, productive life, and replacement; irrigation source and quality; nutrient and crop-protection records; harvest maturity and apple fate; fresh or dried state; drying method and moisture; shell and kernel quality; grade, reject, and storage records; gate; and any intended cashew-apple co-product hand-off"
