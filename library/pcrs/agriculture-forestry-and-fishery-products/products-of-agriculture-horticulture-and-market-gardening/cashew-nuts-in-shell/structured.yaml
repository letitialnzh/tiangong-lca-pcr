allocation_rules:
  - rule_id: allocation_01
    applies_to: "orchard and harvest with an intended cashew-apple output"
    rule: "Prefer process subdivision when orchard, harvest, apple collection, and nut collection records are independently available. When the cashew apple is deliberately collected and transferred as an intended co-product, allocate shared orchard and harvest burdens by measured dry-matter mass; if dry-matter data are unavailable, use measured as-received mass and disclose the limitation."
    source_ids:
      - iso-14044-2006
      - fao-cashew-india-production-1998
  - rule_id: allocation_02
    applies_to: "cashew apple not collected as a product"
    rule: "If the apple remains on the orchard floor or is handled as residue without an intended product hand-off, do not assign a co-product credit. Retain its mass and fate as a residue or waste flow and assign the shared burden to the intended in-shell nut output."
    source_ids:
      - iso-14044-2006
      - fao-cashew-minor-oil-crops
  - rule_id: allocation_03
    applies_to: "premium and standard in-shell grades"
    rule: "Use physical mass allocation between mutually exclusive accepted in-shell grade outputs when common conditioning burdens cannot be subdivided. Grade-specific operations remain with the grade receiving them; do not allocate the same lot to both a grade row and an aggregate output row."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_04
    applies_to: "perennial orchard periods and phases"
    rule: "Annualize establishment, immature years, replacement, and removal over the declared orchard life and accepted output basis. Link every input and output to a crop year or lifecycle phase; do not count a replacement event in both the original and replacement orchard phases."
    source_ids:
      - fao-cashew-india-production-1998
      - iso-14044-2006
  - rule_id: allocation_05
    applies_to: "downgraded, reworked, rejected, and recovered lots"
    rule: "Keep rejected and downgraded lots separate from accepted product. Rework retains the producing-node burden and is linked once; recovered or intentionally marketed material requires a declared destination and allocation decision; discarded material receives its declared treatment burden."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: allocation_06
    applies_to: "batch, campaign, and changeover attribution"
    rule: "Link orchard, harvest, conditioning, cleaning, grading, and storage inputs and outputs to the batch or campaign that generated them. Record cleaning and changeover events once and do not allocate shared-run burdens to more than one batch without a documented driver."
    source_ids:
      - mass-balance-identity
      - iso-14044-2006
  - rule_id: allocation_rule_7
    applies_to: "foreground_burden_allocation"
    rule: "Cashew shell mass is part of the in-shell reference product and is not a separate co-product in this PCR. CNSL, shell fragments, kernel, testa, and all shelling outputs belong to a downstream shelling or kernel PCR and must not be introduced into this inventory. No output may be counted both as a cashew-apple co-product and as orchard residue."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_cashew_orchard_lifecycle_records
      process_id: "cashew_orchard_establishment_and_management"
      flow_role: "orchard asset, land, planting, replacement, residue"
      record_type: "orchard block and asset register"
      raw_fields: "block area; planting year; cultivar; tree count; replacement; removal; pruning residue; orchard phase; accepted output"
      collection_method: "block register, field log, and annual reconciliation"
      unit: "ha, item, kg, orchard year"
      frequency: "event and annual"
      temporal_coverage: "full declared orchard life or documented representative period"
      site_scope: "every contributing orchard block"
      aggregation_rule: "link block records to crop year and accepted output"
      quality_evidence: "signed field register, GIS or survey area, replacement evidence"
    - protocol_id: cp_cashew_orchard_input_records
      process_id: "cashew_orchard_establishment_and_management"
      flow_role: "nutrient, amendment, crop protection"
      record_type: "input application record"
      raw_fields: "product name; formulation; nutrient content; active ingredient; amount; date; block; purpose; application method"
      collection_method: "invoice, application log, and supplier record"
      unit: "kg product, kg nutrient, kg active ingredient"
      frequency: "every application"
      temporal_coverage: "crop year"
      site_scope: "every contributing block"
      aggregation_rule: "aggregate by product, nutrient, block, and crop year"
      quality_evidence: "invoice, product label, application log"
    - protocol_id: cp_cashew_irrigation_records
      process_id: "cashew_orchard_establishment_and_management"
      flow_role: "irrigation and water"
      record_type: "irrigation meter or water ledger"
      raw_fields: "source; volume; block; date; meter; water quality; withdrawal and return"
      collection_method: "meter, pump record, or transparent water balance"
      unit: "m3 or kg"
      frequency: "event and monthly"
      temporal_coverage: "crop year"
      site_scope: "every irrigated block"
      aggregation_rule: "reconcile delivery, withdrawal, and declared consumption"
      quality_evidence: "meter calibration, pump log, water ledger"
    - protocol_id: cp_cashew_energy_records
      process_id: "all_field_harvest_conditioning_and_storage_processes"
      flow_role: "energy and carrier"
      record_type: "fuel, electricity, and equipment record"
      raw_fields: "carrier; amount; equipment; operation; lot or block; date; duration; conversion factor"
      collection_method: "invoice, meter, fuel log, or equipment record"
      unit: "L, kg, MJ, or kWh"
      frequency: "event and monthly"
      temporal_coverage: "crop year and declared post-harvest period"
      site_scope: "each operation and facility"
      aggregation_rule: "aggregate by carrier, operation, lot, and period"
      quality_evidence: "invoice, meter, fuel log, equipment specification"
    - protocol_id: cp_cashew_emission_records
      process_id: "cashew_orchard_establishment_and_management"
      flow_role: "direct and indirect field emissions"
      record_type: "emission calculation input record"
      raw_fields: "nutrient input; residue; soil condition; crop-protection record; emission species; method; factor"
      collection_method: "calculation workbook linked to raw records"
      unit: "kg substance"
      frequency: "annual and event"
      temporal_coverage: "crop year"
      site_scope: "every contributing block"
      aggregation_rule: "retain substance, receiving medium, factor, and source"
      quality_evidence: "calculation review, factor version, source citation"
    - protocol_id: cp_cashew_harvest_lot_records
      process_id: "cashew_harvest_and_collection"
      flow_role: "harvest, collection, field loss, residue"
