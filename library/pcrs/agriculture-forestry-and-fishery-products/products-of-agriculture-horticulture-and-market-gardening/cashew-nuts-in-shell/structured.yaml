  calculation_rules:
    - id: calc_01
      applies_to: "perennial orchard inputs"
      rule: "Allocate orchard establishment, immature years, replacement, and removal over the declared orchard-life basis and accepted output by crop year."
      inputs:
        - "orchard asset register"
        - "orchard life"
        - "crop-year output"
      output: "annualized orchard input per reference flow"
      source_ids:
        - fao-cashew-india-production-1998
        - iso-14044-2006
    - id: calc_02
      applies_to: "every harvest, conditioning, and storage lot"
      rule: "opening mass + inputs = accepted outputs + co-products + rejects + residues + measured losses; investigate any unexplained residual."
      inputs:
        - "lot weights and fates"
      output: "reconciled mass balance"
      source_ids:
        - mass-balance-identity
    - id: calc_03
      applies_to: "fresh to dried or conditioned lots"
      rule: "Dry matter = wet mass × (1 − moisture fraction); water removed = input wet mass − output wet mass after accounting for non-water losses."
      inputs:
        - "input/output mass and measured moisture"
      output: "moisture-corrected mass and drying water loss"
      source_ids:
        - mass-balance-identity
        - fao-cashew-minor-oil-crops
    - id: calc_04
      applies_to: "cashew apple co-product"
      rule: "If the apple is intended and transferred, apply measured dry-matter mass allocation to shared orchard and harvest burdens; if not intended, model residue fate without co-product credit."
      inputs:
        - "nut mass"
        - "apple mass"
        - "moisture or dry matter"
        - "declared destination"
      output: "allocated burdens and co-product share"
      source_ids:
        - iso-14044-2006
    - id: calc_05
      applies_to: "premium, standard, downgraded, and rejected lots"
      rule: "Grade outputs must be mutually exclusive. Conditioned accepted output equals the sum of grade outputs plus declared downgraded, rework, reject, foreign-material, water-loss, and unexplained-loss terms."
      inputs:
        - "batch input"
        - "grade and reject records"
      output: "normalized output rows"
      source_ids:
        - mass-balance-identity
    - id: calc_06
      applies_to: "storage"
      rule: "opening stock + receipts − dispatches − closing stock = measured storage loss; storage loss is not accepted gate output."
      inputs:
        - "stock ledger"
        - dispatches
        - "closing stock"
        - "loss records"
      output: "storage loss per storage duration"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: quality_01
      applies_to: "flow identity"
      requirement: "Use the verified cashew in-shell reference UUID and preserve the fresh farm-gate or extended-gate qualifier. Do not use shelled-cashew or kernel identities."
      evidence: "platform identity record; dataset metadata"
    - id: quality_02
      applies_to: "orchard and harvest quantities"
      requirement: "Use calibrated scales, meters, or transparent documented estimates. Record a justified zero when a route does not use irrigation, wet cleaning, packaging, or storage."
      evidence: "calibration record; field and lot logs"
    - id: quality_03
      applies_to: "moisture and drying"
      requirement: "Measure moisture on representative lots at receipt and dispatch. State the moisture method, sampling point, and wet or dry basis."
      evidence: "moisture test; sample plan; batch record"
    - id: quality_04
      applies_to: "completeness"
      requirement: "Reconcile orchard inputs, harvest outputs, cashew apple destination, conditioning outputs, rejects, residues, water loss, storage loss, and gate dispatches."
      evidence: "mass-balance workbook; stock ledger"
    - id: quality_05
      applies_to: "temporal and perennial representativeness"
      requirement: "Cover the declared crop year and report orchard phase, productive age, replacement events, abnormal weather, and averaging method."
      evidence: "crop-year register; orchard lifecycle record"
    - id: quality_06
      applies_to: "co-products and fate"
      requirement: "Evidence every intended cashew-apple hand-off, downgraded destination, rework loop, reject treatment, and residue fate. Do not assign credits to an unverified destination."
      evidence: "transfer note; destination record; treatment record"
    - id: quality_07
      applies_to: "geography and technology"
      requirement: "Disclose country, region, climate, soil, irrigation regime, harvest practice, drying method, grading method, storage condition, and gate."
      evidence: "site description; process notes; facility record"
    - id: quality_08
      applies_to: "uncertainty and estimates"
      requirement: "Label provisional ranges as replaceable candidate-stage estimates and replace them with measured or source-backed values before reviewed or published use."
      evidence: "review record; updated foreground dataset"
validation_rules:
  - rule_id: validation_01
    applies_to: "reference flow"
    rule: "Reference product is the verified Cashew nuts, in shell UUID with Mass and kg. The dataset declares fresh farm-gate or extended-gate state and does not substitute shelled kernels."
    source_ids:
      - fda-cashew-nut-methods
  - rule_id: validation_02
    applies_to: "process map"
    rule: "Every required process is present; conditional drying, cleaning, grading, and storage processes are present when the declared gate or route requires them."
    source_ids:
      - fao-cashew-postharvest-2020
  - rule_id: validation_03
    applies_to: "perennial production"
    rule: "Orchard establishment, immature years, productive phase, replacement, and removal are linked to declared crop years and are not double-counted."
    source_ids:
      - fao-cashew-india-production-1998
      - iso-14044-2006
  - rule_id: validation_04
    applies_to: "harvest and apple separation"
    rule: "Harvested, collected, uncollected, cashew-apple, residue, and accepted nut masses are mutually reconciled; apple destination is declared."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_05
    applies_to: "conditioning and quality"
    rule: "Fresh input, conditioned moisture, premium grade, standard grade, downgraded/rework, reject, foreign material, water loss, and wastewater are mutually exclusive and mass-balanced."
    source_ids:
      - mass-balance-identity
      - fao-cashew-minor-oil-crops
  - rule_id: validation_06
    applies_to: "storage and gate"
    rule: "Opening stock, receipts, dispatches, closing stock, storage damage, moisture, storage duration, and gate output reconcile. Storage losses are excluded from accepted output."
    source_ids:
      - mass-balance-identity
      - fao-cashew-postharvest-2020
  - rule_id: validation_07
    applies_to: "allocation and rework"
    rule: "Cashew-apple allocation, grade allocation, downgraded routes, rework loops, and rejected-material treatment are explicit and no burden or output is counted twice."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_08
    applies_to: "evidence and disclosure"
    rule: "All important quantitative flows have a foreground collection rule and candidate range or method constraint; estimates, unresolved identities, gate state, moisture, and evidence limitations are disclosed."
    source_ids:
      - fao-cashew-postharvest-2020
      - mass-balance-identity
  - rule_id: validation_09
    applies_to: "batch and campaign records"
    rule: "Every harvest round, conditioning batch, grade lot, and storage receipt has a declared boundary, linked inputs and outputs, cleaning or changeover status, and reporting period; shared-run burdens are not counted twice."
    source_ids:
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "secondary_dataset for a reviewed cashew-nut-in-shell foreground dataset; may be promoted to background_dataset only after the required review and publication gates"
  downstream_use: "Construction and validation of process and lifecyclemodel projections for cashew nuts in shell at the declared fresh farm-gate or extended post-harvest gate"
  allowed_use: "Orchard, harvest, apple-separation, drying, cleaning, in-shell grading, storage, and gate modelling when the declared product state, moisture, quality, crop year, geography, and allocation treatment are retained"
  excluded_use: "Shelled-kernel production, shelling, CNSL recovery, roasting, steaming, peeling, kernel processing, retail products, consumer use, post-gate logistics, and unreported product categories"
  required_metadata: "reference UUID; Mass property and Units of mass unit group; CPC 3.0 01372; cultivar; geography; orchard phase and age; crop year; irrigation; moisture basis; fresh or extended gate; shell and kernel quality; grade; cashew-apple fate; accepted, rejected, residue, loss, and storage records"
  required_quality_disclosure: "measurement versus estimate; moisture method; mass-balance completeness; orchard-life allocation; co-product allocation; rework and reject fate; storage duration; data period; geography; technology; and unresolved identity gaps"
  update_trigger: "new crop-year records, material change in orchard phase or replacement, change in drying or grading technology, new intended cashew-apple route, changed storage practice, evidence-backed range replacement, or platform identity revision"
