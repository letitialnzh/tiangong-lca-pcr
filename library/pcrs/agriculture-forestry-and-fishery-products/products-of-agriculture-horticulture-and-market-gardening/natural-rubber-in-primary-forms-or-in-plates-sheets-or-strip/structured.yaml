        - rubber-board-natural-rubber-forms
    - rule_id: boundary_sheet_rss
      applies_to: "sheet_rss_processing"
      rule: "Include straining, controlled coagulation, rolling/forming, drying or smoking, grading and sheet hand-off."
      source_ids:
        - rubber-board-natural-rubber-forms
    - rule_id: boundary_crepe
      applies_to: "crepe_processing"
      rule: "Include coagulum preparation, washing, repeated milling/creping, drying, grading and crepe hand-off."
      source_ids:
        - rubber-board-natural-rubber-forms
    - rule_id: boundary_tsr_block
