system_boundary:
  rules:
    - rule_id: boundary_plantation
      applies_to: "plantation_management"
      rule: "Include managed tree establishment attribution, maintenance, nutrient and water supply, energy, pest/weed management and productive latex formation."
      source_ids:
        - fao-rubber-products-classification
    - rule_id: boundary_tapping
      applies_to: "latex_tapping_collection"
      rule: "Include tapping, cup collection, field preservation when used, collection losses and delivery of measured field latex to primary processing."
      source_ids:
        - rubber-board-natural-rubber-forms
    - rule_id: boundary_single_route
      applies_to: "terminal processing"
      rule: "Include exactly one terminal route for the reference product. Other route nodes are inactive and contribute zero burden."
      source_ids:
        - rubber-board-natural-rubber-forms
    - rule_id: boundary_latex_concentrate
      applies_to: "latex_concentration"
      rule: "Include preservation, separation/concentration, stabilization, storage and accepted concentrate hand-off; do not include downstream compounding or product manufacture."
      source_ids:
        - rubber-board-natural-rubber-forms
    - rule_id: boundary_sheet_rss
      applies_to: "sheet_rss_processing"
      rule: "Include straining, controlled coagulation, rolling/forming, drying or smoking, grading and sheet hand-off."
      source_ids:
        - rubber-board-natural-rubber-forms
    - rule_id: boundary_crepe
      applies_to: "crepe_processing"
      rule: "Include coagulum preparation, washing, repeated milling/creping, drying, grading and crepe hand-off."
      source_ids:
        - rubber-board-natural-rubber-forms
    - rule_id: boundary_tsr_block
      applies_to: "tsr_block_processing"
      rule: "Include feedstock sorting, size reduction, washing, drying, baling/block forming, grading and block hand-off."
      source_ids:
        - rubber-board-natural-rubber-forms
    - rule_id: boundary_exclusions
      applies_to: "downstream system"
      rule: "Exclude synthetic polymer manufacture, natural/synthetic blending, compounding, vulcanization, conversion into finished articles and use/end-of-life."
      source_ids:
        - fao-rubber-products-classification
