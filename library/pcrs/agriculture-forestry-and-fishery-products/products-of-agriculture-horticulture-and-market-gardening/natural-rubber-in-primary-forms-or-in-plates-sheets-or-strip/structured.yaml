allocation_rules:
  - rule_id: allocation_perennial_period
    applies_to: "plantation establishment and replacement"
    rule: "Attribute establishment, immature years, replacements and terminal operations over the declared productive period and accepted dry-rubber output; disclose lifetime and yield basis and prevent double annualization."
    source_ids: []
  - rule_id: allocation_route_separation
    applies_to: "alternative terminal routes"
    rule: "Keep latex concentrate, sheet/RSS, crepe and TSR/block inventories separate. Do not allocate or average across forms merely because they share CPC 01950."
    source_ids:
      - rubber-board-natural-rubber-forms
  - rule_id: allocation_internal_rubber
    applies_to: "field latex, coagulum, off-grade and rework"
    rule: "Carry prior burdens with all internal rubber transfers. Reworked material returns to the consuming batch once; downgraded sold rubber is a separately quantified product and never accepted reference output."
    source_ids: []
  - rule_id: allocation_serum_residues
    applies_to: "serum, wastewater and separated non-rubber material"
    rule: "Treat as residue or waste unless evidence establishes an intended co-product with a distinct function and measurable quantity; document any allocation driver before use."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_plantation_period
      process_id: "plantation_management"
      flow_role: "perennial inputs and accepted latex output"
      record_type: "farm log, invoice, asset and yield record"
      raw_fields: "stand area; clone/species; phase; establishment inputs; nutrient products; supplied water; energy; replacements; dry-rubber output"
      collection_method: "reconcile farm records and calibrated meters/scales"
      unit: "native units and kg dry rubber"
      frequency: "monthly and annual"
      temporal_coverage: "complete declared productive period"
      site_scope: "each plantation and route"
      aggregation_rule: "attribute period burdens once to dry-rubber output"
      quality_evidence: "record completeness, calibration and period reconciliation"
    - protocol_id: cp_latex_batches
      process_id: "latex_tapping_collection"
      flow_role: "tapping, preservation, collection and latex transfer"
      record_type: "tapping-round and batch log"
      raw_fields: "date; plot; wet latex mass; dry-rubber test; preservative product/concentration; coagulum; loss; distance and mode"
      collection_method: "batch weighing, sampling and route log"
      unit: "kg, fraction, km, tkm"
      frequency: "every tapping round/batch"
      temporal_coverage: "all rounds supplying reported output"
      site_scope: "plot and collection route"
      aggregation_rule: "aggregate dry-rubber mass without losing batch identity"
      quality_evidence: "scale/test calibration and signed transfer record"
    - protocol_id: cp_processing_batch
      process_id: "conditional_terminal_route"
      flow_role: "feedstock, chemicals, water, energy, outputs and rejects"
      record_type: "batch sheet, meter, invoice and laboratory certificate"
      raw_fields: "route; feedstock state; wet/dry mass; DRC/moisture; chemicals/concentrations; water; energy; grade; accepted/rework/reject mass; packaging"
      collection_method: "direct measurement and batch mass balance"
      unit: "native units and kg"
      frequency: "every batch/campaign"
      temporal_coverage: "all batches producing reference output"
      site_scope: "each processing facility and technology"
      aggregation_rule: "aggregate only identical terminal form, grade and basis"
      quality_evidence: "meter calibration, laboratory method and closed batch balance"
  calculation_rules:
    - id: calc_dry_rubber
      applies_to: "latex and wet coagulum"
      rule: "dry-rubber mass = as-received mass × dry-rubber mass fraction"
      inputs:
        - "measured mass"
        - "representative DRC test"
      output: "kg dry rubber"
      source_ids:
        - reference-normalization-definition
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = attributed amount ÷ accepted reference-product mass on the same basis"
      inputs:
        - "attributed amount"
        - "accepted mass"
        - "basis conversion"
      output: "amount per kg reference flow"
      source_ids:
        - reference-normalization-definition
    - id: calc_transport
      applies_to: "collection transport"
      rule: "tkm = transported wet mass in tonnes × actual distance in km; normalize by accepted reference mass"
      inputs:
        - "wet mass"
        - distance
        - mode
        - "accepted output"
      output: "tkm/kg reference flow"
      source_ids: []
    - id: calc_period_burden
      applies_to: "plantation multi-period inputs"
      rule: "sum phase-specific burden × attribution share ÷ accepted output over corresponding productive period"
      inputs:
        - "phase records"
        - "service life"
        - output
        - "attribution driver"
      output: "burden/kg dry rubber"
      source_ids: []
    - id: calc_batch_balance
      applies_to: "each processing batch"
      rule: "input dry rubber = accepted dry rubber + off-grade/rework dry rubber + measured dry-rubber loss"
      inputs:
        - "feed and output mass/DRC"
      output: "reconciled batch balance"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference flow and every rubber transfer"
      requirement: "Declare form, route, grade, basis, chemistry, gate and UUID compatibility; never substitute synthetic or compounded rubber."
      evidence: "product certificate, batch record and identity audit"
    - id: dq_route_completeness
      applies_to: "process map"
      requirement: "Exactly one terminal route is active; inactive routes have no exchanges or burden."
      evidence: "route declaration and process graph"
    - id: dq_mass_basis
      applies_to: "liquid and wet materials"
      requirement: "Retain as-received mass, DRC/moisture, test method and sampling time; conversions are reproducible."
      evidence: "laboratory certificate and calculation record"
    - id: dq_temporal
      applies_to: "plantation and processing"
      requirement: "Cover establishment attribution, all tapping rounds and every processing batch contributing to output."
      evidence: "period and batch completeness report"
    - id: dq_mass_balance
      applies_to: "tapping and processing"
      requirement: "Reconcile rubber mass by batch; investigate differences beyond the declared site tolerance."
      evidence: "signed mass-balance record"
    - id: dq_binding
      applies_to: "all inventory cards"
      requirement: "Parameterized cards resolve to verified concrete UUIDs at foreground generation; fixed UUIDs retain detail-read evidence and matching role/property."
      evidence: "Flow Set expansion record or detail audit"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference product"
    rule: "Require Natural Rubber UUID, Mass property/unit group and every required qualifier; reject synthetic, blended, compounded, vulcanized, reclaimed or finished-rubber products."
    source_ids:
      - fao-rubber-products-classification
  - rule_id: validate_one_terminal_form
    applies_to: "process map and reference link"
    rule: "Exactly one of latex concentrate, sheet/RSS, crepe or TSR/block terminal nodes supplies the reference flow."
    source_ids:
      - rubber-board-natural-rubber-forms
  - rule_id: validate_basis_conversion
    applies_to: "wet and dry states"
    rule: "Require measured DRC/moisture and explicit conversion before combining or comparing mass bases."
    source_ids:
      - reference-normalization-definition
  - rule_id: validate_nutrient_cardinality
    applies_to: "plantation inputs"
    rule: "At most one fertilizer/nutrient Product-input card is present in the process and it binds set-level flow-set.agricultural-nutrient-supply version 0.3.0 without group."
    source_ids: []
  - rule_id: validate_fixed_bindings
    applies_to: "fixed cards"
    rule: "Natural Rubber, Formic acid and Aqueous ammonia use only their detail-confirmed UUIDs and compatible Mass property; do not infer quantity evidence from identity verification."
    source_ids: []
  - rule_id: validate_rework_reject
    applies_to: "off-grade or rejected rubber"
    rule: "Declare rework, downgrade/recovery or discard destination; count retained rework once and exclude all nonaccepted rubber from reference output."
    source_ids: []
  - rule_id: validate_period_attribution
    applies_to: "plantation burdens"
    rule: "Require phase, productive life, accepted yield and attribution evidence; fail omitted or duplicated establishment burden."
    source_ids: []
  - rule_id: validate_batch_balance
    applies_to: "each terminal route"
    rule: "Reconcile feed dry rubber to accepted, rework/off-grade and loss; keep batches and routes traceable."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production package for one declared natural-rubber primary form at primary-processing hand-off"
  downstream_use: "secondary_dataset; background_dataset after independent review and geography, time, grade and technology matching"
  allowed_use: "Upstream natural-rubber supply for LCA where terminal form, grade, mass basis and gate match"
  excluded_use: "Generic mixture of forms; synthetic/blended/compounded/vulcanized/reclaimed rubber; finished rubber articles; downstream conversion without added processes"
  required_metadata: "species/clone where known; plantation phase; tapping system; route; form; grade; DRC/moisture; chemistry; batch/campaign; geography; gate; reject/rework destination"
  required_quality_disclosure: "route and period coverage; mass-basis conversion; provisional ranges; meter/test quality; mass-balance closure; Flow Set expansion; fixed-identity evidence"
  update_trigger: "Change in product form, grade, mass basis, route topology, preservation/coagulation technology, gate, reference UUID, Flow Set version or classification scope"
