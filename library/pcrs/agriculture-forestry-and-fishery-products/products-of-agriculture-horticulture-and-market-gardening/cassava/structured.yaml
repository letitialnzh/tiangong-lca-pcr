system_boundary:
  rules:
    - rule_id: fresh_root_gate
      applies_to: "output boundary"
      rule: "Stop at whole fresh accepted roots weighed at farm gate. Include only measured in-boundary short holding and sorting. Exclude industrial drying, starch extraction, chipping, waxing and downstream transport."
      source_ids:
        - fao-fresh-root-handling
    - rule_id: cutting_origin
      applies_to: "crop establishment"
      rule: "Treat vegetative stem pieces as planting material, track purchased versus retained supply and avoid duplicating upstream stem-production burdens."
      source_ids:
        - iita-cassava-agronomy
    - rule_id: harvest_separation
      applies_to: "root lifting"
      rule: "Keep the lifting event separate from field management to reconcile lifted roots, unlifted losses, leaves and stems."
      source_ids:
        - fao-cassava-cultivation
    - rule_id: grade_states
      applies_to: "farm-gate sorting"
      rule: "Distinguish accepted reference roots, downgraded usable roots and discarded roots; record each destination and harvest-to-grade delay."
      source_ids:
        - fao-fresh-root-handling
    - rule_id: period_link
      applies_to: "multi-period cycle"
      rule: "Attribute each input and output to its crop cycle and calendar reporting period once; carry field establishment across year boundaries when needed."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Land and a declared purchased or retained healthy stem-cutting stock at planting; record previous crop, retained-stem source and field age."
  starting_condition_role: "The crop cycle begins at material establishment; upstream production of purchased cuttings and other products is linked as background."
  product_classification_scope: "Whole fresh cassava roots, independent of CPC code."
  recursive_input_rule: "Retained stems from this or a prior cassava cycle are a documented internal transfer; link the producing cycle once, with no self-referential product loop."
  upstream_dataset_requirement: "Link purchased cuttings, fertilizers, crop protection, energy and supplied water to suitable upstream datasets; disclose unresolved identity."
  disclosure: "Declare crop cycle, land/irrigation regime, stem source, harvest and grade states, time to gate, and any intentional stem co-product."
