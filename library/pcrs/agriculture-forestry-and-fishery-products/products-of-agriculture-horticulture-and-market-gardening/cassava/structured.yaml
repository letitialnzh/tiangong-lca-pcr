allocation_rules:
  - rule_id: single_root_output
    applies_to: "accepted and downgraded fresh-root grades"
    rule: "Where both grades are sold as fresh cassava, retain their masses and values separately. Subdivide grade-specific sorting burdens first; shared upstream burdens follow the declared study allocation method."
    source_ids:
      - iso-14044
  - rule_id: stem_coproduct
    applies_to: "intentionally marketed stems or leaves"
    rule: "Treat sold planting stems or leaves as separate intended outputs, not as root yield or waste. Avoid allocation through process subdivision where possible; otherwise use a documented causal physical relationship or, where none is defensible, farm-gate economic shares from contemporaneous quantity and price records. Run a sensitivity check."
    source_ids:
      - iso-14044
  - rule_id: residue_burden
    applies_to: "discarded roots and field residues"
    rule: "Keep cultivation and harvest burdens with the crop system; document field return, disposal and any later recovery separately. Do not give an unverified avoided-product credit."
    source_ids:
      - iso-14044
  - rule_id: period_attribution
    applies_to: "crop cycles crossing reporting years"
    rule: "Assign planting and management inputs to the identified harvest cycle once, track date and phase, and never allocate the same retained stem stock or asset burden to two cycles."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_register
      process_id: "field"
      flow_role: "planting and management exchanges, standing area, direct soil N2O"
      record_type: "field register, invoices, meter logs"
      raw_fields: "field_id, cycle_id, planting_date, stem_origin, planted_pieces, material_product, product_mass, water_m3, fuel_L, electricity_kWh, N_input, residue_return, area_ha"
      collection_method: "reconcile invoices, application logs and meters with field operations; record selected N2O method"
      unit: "mixed"
      frequency: "each operation"
      temporal_coverage: "full planting-to-lifting cycle"
      site_scope: "each field"
      aggregation_rule: "sum by field-cycle, divide by accepted root kg only after lot linkage"
      quality_evidence: "purchase invoices, field log, meter readings, method worksheet"
    - protocol_id: cp_harvest_register
      process_id: "harvest"
      flow_role: "lifted roots, stems, residues and root loss"
      record_type: "harvest and sample-plot logs"
      raw_fields: "field_id, cycle_id, lifting_time, lifted_root_kg, retained_stem_kg, marketed_stem_kg, residue_kg, unlifted_sample_kg, fuel_L"
      collection_method: "calibrated scale and representative loss plots"
      unit: "kg, L, ha"
      frequency: "each lifting event"
      temporal_coverage: "all harvest lots"
      site_scope: "each field/harvest"
      aggregation_rule: "reconcile harvested and unharvested fractions; avoid stem double count"
      quality_evidence: "scale tickets, plot design, machine log"
    - protocol_id: cp_gate_lot
      process_id: "gate"
      flow_role: "fresh-root grade and elapsed time"
      record_type: "receiving, grade and dispatch tickets"
      raw_fields: "lot_id, harvest_time, receipt_time, dispatch_time, received_kg, accepted_kg, downgraded_kg, rejected_kg, grade, destination, electricity_kWh"
      collection_method: "calibrated in/out scales, visible quality checks and timestamped tickets"
      unit: "kg, h, kWh"
      frequency: "each gate lot"
      temporal_coverage: "harvest-to-dispatch"
      site_scope: "each farm gate"
      aggregation_rule: "reconcile received and all departures by lot; combine only like market classes"
      quality_evidence: "scale calibration, tickets, reject reason and photos"
  calculation_rules:
    - id: reference_normalization
      applies_to: "all exchanges"
      rule: "Exchange per kg reference = allocated cycle/lot exchange ÷ accepted fresh-root kg; use a documented allocation share when intended co-products exist."
      inputs:
        - "linked cycle"
        - "lot masses and allocation share"
      output: "kg-reference-normalized exchange"
      source_ids: []
    - id: gate_mass_reconciliation
      applies_to: "gate"
      rule: "discrepancy = received fresh-root kg − accepted kg − downgraded kg − rejected kg; investigate unmeasured loss or scale mismatch."
      inputs:
        - "gate ticket masses"
      output: "mass discrepancy"
      source_ids: []
    - id: cycle_period_linkage
      applies_to: "all processes"
      rule: "Join operation and harvest records by field/cycle and classify each by calendar period; do not duplicate a record in combined reporting."
      inputs:
        - field_id
        - cycle_id
        - dates
      output: "one cycle inventory and period trace"
      source_ids: []
    - id: soil_n2o_method
      applies_to: "soil emission"
      rule: "Select documented jurisdictional or IPCC 2019 managed-soils method and recorded nitrogen inputs; disclose factor, unit and direct/indirect scope."
      inputs:
        - "fertilizer N"
        - "residue N"
        - "soil and method data"
      output: "kg N2O by route"
      source_ids:
        - ipcc-2019-soils
  data_quality_requirements:
    - id: lot_identity
      applies_to: "all root streams"
      requirement: "Use stable field, crop-cycle and lot ids across lifting, sorting and dispatch."
      evidence: "linked tickets"
    - id: root_condition
      applies_to: "reference product"
      requirement: "Report cultivar, use class, damage/rejection rules, and measured time from lifting to gate."
      evidence: "grade sheets and timestamps"
    - id: mass_completeness
      applies_to: "harvest and gate"
      requirement: "Explain nonzero gate discrepancy, unlifted losses and destinations of rejected roots; quantify missing observations."
      evidence: "weighbridge and sampling records"
    - id: temporal_completeness
      applies_to: "crop cycle"
      requirement: "Include establishment across reporting periods and any retained-stem transfer exactly once."
      evidence: "dated field register"
    - id: source_compatibility
      applies_to: "upstream flows"
      requirement: "Record region, technology and unit compatibility of linked backgrounds; list unresolved identities."
      evidence: "data package metadata"
validation_rules:
  - rule_id: reference_identity
    applies_to: "reference flow"
    rule: "Require the verified cassava Product flow, Mass property and kg at the specified farm gate; reject chips, flour, starch and waxed roots as reference substitutes."
    source_ids: []
  - rule_id: range_review
    applies_to: "all flow cards"
    rule: "Verify each range's basis, units and evidence; treat reasoned bounds as provisional QA prompts, not hard inventory defaults."
    source_ids: []
  - rule_id: balance_check
    applies_to: "root streams"
    rule: "Match lifted and gate-received lots; reconcile accepted, downgraded, rejected and recorded discrepancy without double counting."
    source_ids: []
  - rule_id: time_to_gate
    applies_to: "quality"
    rule: "Require lifting and gate times and reject/damage criteria for each lot because fresh roots deteriorate quickly."
    source_ids:
      - fao-fresh-root-handling
  - rule_id: coproduct_check
    applies_to: "stems and grades"
    rule: "Require intentional-output identity, hand-off, allocation shares and no double credit or double burden."
    source_ids:
      - iso-14044
  - rule_id: period_check
    applies_to: "multi-period crops"
    rule: "Verify every planting, management, harvest and retained-stem record is assigned to one cycle and attributed once."
    source_ids: []
