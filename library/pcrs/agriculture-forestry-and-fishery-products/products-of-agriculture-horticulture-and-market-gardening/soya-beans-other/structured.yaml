allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "All nodes"
    rule: "Subdivide and meter fields, lots, runs and storage periods before allocation."
    source_ids:
      - iso-14044
  - rule_id: allocation_outputs
    applies_to: "Beans, downgraded outputs and residues"
    rule: "Use a documented physical causal relation; if none is defensible, use economic allocation and sensitivity."
    source_ids:
      - iso-14044
  - rule_id: allocation_shared
    applies_to: "Shared machinery, dryers and stores"
    rule: "Attribute once by measured time, throughput or occupied mass-time."
    source_ids:
      - iso-14044
  - rule_id: allocation_rework
    applies_to: "Rework"
    rule: "Return mass and burdens once to the producing node; never count rework as accepted and rejected output."
    source_ids: []
