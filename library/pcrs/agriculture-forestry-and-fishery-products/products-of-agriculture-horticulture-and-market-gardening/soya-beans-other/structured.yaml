allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "All nodes"
    rule: "Subdivide and meter fields, lots, runs and storage periods before allocation."
    source_ids:
      - iso-14044
  - rule_id: allocation_outputs
    applies_to: "Beans, downgraded outputs and residues"
    rule: "Use a documented physical causal relation; if none is defensible, use economic allocation and sensitivity."
    source_ids:
      - iso-14044
  - rule_id: allocation_shared
    applies_to: "Shared machinery, dryers and stores"
    rule: "Attribute once by measured time, throughput or occupied mass-time."
    source_ids:
      - iso-14044
  - rule_id: allocation_rework
    applies_to: "Rework"
    rule: "Return mass and burdens once to the producing node; never count rework as accepted and rejected output."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_crop_cycle
      process_id: "crop_production"
      flow_role: "Inputs, crop output and loss"
      record_type: "Field log, invoice, meter, yield record"
      raw_fields: "field_id; area; dates; prior_crop; seed; nutrients; irrigation; energy; yield; loss; residue_route"
      collection_method: "Reconcile records and calibrated measurements; Raw aggregation and attribution: Sum by field, then normalize by accepted output"
      unit: "ha; kg; m3; MJ"
      frequency: "Each event/cycle"
      temporal_coverage: "Representative crop year"
      site_scope: "Every included field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Documents, calibration and balance"
    - protocol_id: cp_field_emissions
      process_id: "crop_production"
      flow_role: "Managed-soil emissions"
      record_type: "Workbook and activity record"
      raw_fields: "N_inputs; residue_N; fixation_context; factors; method_version"
      collection_method: "Apply one declared method; Raw aggregation and attribution: Calculate by substance and compartment"
      unit: "kg substance"
      frequency: "Each crop cycle"
      temporal_coverage: "Same cycles as crop data"
      site_scope: "Every included field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Reproducible formula and independent check"
    - protocol_id: cp_harvest_lot
      process_id: "harvest_thresh"
      flow_role: "Energy, beans, residues, rejects"
      record_type: "Machine log and weigh ticket"
      raw_fields: "lot_id; field_id; energy; crop_mass; bean_mass; moisture; residues; rejects; destinations"
      collection_method: "Meter and weigh each hand-off; Raw aggregation and attribution: Reconcile by field and route"
      unit: "kg; MJ; %"
      frequency: "Each lot"
      temporal_coverage: "Complete campaign"
      site_scope: "Every harvest operation"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Tickets, calibration and lot link"
    - protocol_id: cp_conditioning_lot
      process_id: "condition_grade_dry"
      flow_role: "Utilities and material balance"
      record_type: "Run sheet, meter, lab result"
      raw_fields: "lot_id; input_mass; moisture; energy; water; outputs; grade; rejects; route"
      collection_method: "Weigh, meter and sample; Raw aggregation and attribution: Conserve dry solids and aggregate by grade/technology"
      unit: "kg; MJ; m3; %"
      frequency: "Each batch/run"
      temporal_coverage: "Complete campaign"
      site_scope: "Every line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration, sampling and closure"
    - protocol_id: cp_storage_handoff
      process_id: "storage_handoff"
      flow_role: "Storage, packaging, loss, dispatch"
      record_type: "Ledger, meter and dispatch record"
      raw_fields: "lot_id; grade; masses; moisture; dates; energy; packaging; reuse; loss; gate"
      collection_method: "Link occupancy, utility, packaging and dispatch; Raw aggregation and attribution: Attribute shared storage by occupied mass-time"
      unit: "kg; MJ; day; %"
      frequency: "Each lot/dispatch"
      temporal_coverage: "Entire declared period"
      site_scope: "Every store/site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Ledger, meter, inspection and dispatch evidence"
  calculation_rules:
    - id: calc_normalize
      applies_to: "All rows"
      rule: "quantity / accepted kg × 1,000"
      inputs:
        - quantity
        - "accepted mass"
      output: "quantity per 1,000 kg"
      source_ids:
        - mass-balance-identity
    - id: calc_dry_solids
      applies_to: "Drying"
      rule: "input dry solids = output dry solids + measured dry-solids loss"
      inputs:
        - "paired mass and moisture"
      output: "water removed and closure"
      source_ids:
        - mass-balance-identity
    - id: calc_field_emissions
      applies_to: "Managed soil"
      rule: "Apply declared current method by substance and compartment"
      inputs:
        - "field activity"
        - factors
      output: "kg emitted"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_storage_share
      applies_to: "Shared storage"
      rule: "burden × lot occupied mass-time / total occupied mass-time"
      inputs:
        - burden
        - kg
        - days
      output: "attributed burden"
      source_ids:
        - iso-14044
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference product"
      requirement: "Declare non-planting use, grade, moisture, condition, crop year, route and gate."
      evidence: "Specification, inspection and lot records"
    - id: dq_completeness
      applies_to: "All nodes"
      requirement: "Cover at least 95% of measured mass and all material energy, water, nutrients, residues, loss and packaging; explain remainder."
      evidence: "Reconciliation"
    - id: dq_temporal
      applies_to: "System"
      requirement: "Link one representative crop year to its postharvest lots and disclose averaging or exceptional events."
      evidence: "Dated records"
    - id: dq_route
      applies_to: "Alternatives"
      requirement: "Separate irrigation, drying, grade and packaging routes before transparent weighting."
      evidence: "Route ledgers and weighting"
    - id: dq_traceability
      applies_to: "Hand-offs"
      requirement: "Preserve field, lot, run and storage identity."
      evidence: "Linked identifiers"
validation_rules:
  - rule_id: validate_scope
    applies_to: "Reference"
    rule: "Reject planting seed and manufactured products; require one whole-bean grade and gate."
    source_ids: []
  - rule_id: validate_reference_uuid
    applies_to: "Binding"
    rule: "Fix a route-specific UUID only when grade, use, state and gate all match; otherwise leave blank."
    source_ids: []
  - rule_id: validate_balance
    applies_to: "Harvest onward"
    rule: "Reconcile dry solids among accepted, downgraded, rejected and lost outputs within uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_flow_identitys
    applies_to: "Product inputs"
    rule: "Verify each actual exchange against its concrete flow UUID, physical state, property and unit; preserve explicit unresolved identities when confirmation is unavailable."
    source_ids: []
  - rule_id: validate_routes
    applies_to: "Alternatives"
    rule: "Do not merge mutually exclusive routes without weights and complete route records."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "All cards"
    rule: "Use ranges as QA screens, investigate exceptions and retain evidenced foreground values."
    source_ids: []
