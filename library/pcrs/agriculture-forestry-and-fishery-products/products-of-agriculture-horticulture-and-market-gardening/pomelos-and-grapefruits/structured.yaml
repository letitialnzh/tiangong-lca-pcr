allocation_rules:
  - rule_id: allocation_citrus_output
    applies_to: "orchard and harvest operations producing pomelos, grapefruits, or multiple marketable grades"
    rule: "Allocate shared orchard and harvest inputs to product grades or species by measured marketable mass when the records support mass allocation. If quality grades have materially different economic functions, disclose and justify an alternative allocation before use."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_residue_fate
    applies_to: "culls, residues, and packaging waste"
    rule: "Treat culls, residues, and waste as waste flows unless a documented recipient and intended use support a co-product claim. Record any avoided-product or substitution claim separately from the foreground inventory."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
