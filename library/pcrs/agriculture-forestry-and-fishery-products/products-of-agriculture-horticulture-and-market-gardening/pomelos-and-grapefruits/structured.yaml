allocation_rules:
  - rule_id: allocation_citrus_output
    applies_to: "orchard and harvest operations producing pomelos, grapefruits, or multiple marketable grades"
    rule: "Allocate shared orchard and harvest inputs to product grades or species by measured marketable mass when the records support mass allocation. If quality grades have materially different economic functions, disclose and justify an alternative allocation before use."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_residue_fate
    applies_to: "culls, residues, and packaging waste"
    rule: "Treat culls, residues, and waste as waste flows unless a documented recipient and intended use support a co-product claim. Record any avoided-product or substitution claim separately from the foreground inventory."
    source_ids:
      - iso-14044-2006
      - mass-balance-identity
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_orchard_establishment_records
      process_id: "orchard_establishment"
      flow_role: "planting material and occupied area"
      record_type: "nursery invoices, planting maps, and orchard register"
      raw_fields: "species, cultivar, lot, tree count, area, planting date, orchard age"
      collection_method: "reconcile supplier records, field map, and planting register; Raw aggregation and attribution: aggregate by block and attributed orchard-year output"
      unit: "plant, kg, ha, ha*a"
      frequency: "per establishment event"
      temporal_coverage: "establishment period and attribution years"
      site_scope: "each orchard block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, field map, planting register, and age disclosure"
    - protocol_id: cp_nutrient_and_protection_records
      process_id: "orchard_cultivation"
      flow_role: "fertilizer, soil amendment, crop protection, and nutrient-related emissions"
      record_type: "invoices, labels, spray logs, nutrient plan, and stock records"
      raw_fields: "product, formulation, nutrient fraction, active ingredient, date, block, mass, application method"
      collection_method: "reconcile issue records with field logs and supplier documents; Raw aggregation and attribution: aggregate by product and block, then normalize to accepted output"
      unit: "kg product, kg nutrient"
      frequency: "each application and monthly reconciliation"
      temporal_coverage: "complete represented orchard year"
      site_scope: "each orchard block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier label, application log, and supervisor review"
    - protocol_id: cp_irrigation_and_energy_records
      process_id: "orchard_cultivation"
      flow_role: "irrigation, water withdrawal, electricity, and machinery fuel"
      record_type: "meters, permits, invoices, fuel logs, or equipment records"
      raw_fields: "source, meter, volume, energy, fuel, date, block, allocation basis"
      collection_method: "direct meter reading or documented water and energy balance; Raw aggregation and attribution: reconcile source totals, delivered totals, and shared-service allocation"
      unit: "m3, kWh, MJ, kg"
      frequency: "per event or monthly"
      temporal_coverage: "complete represented orchard year"
      site_scope: "each orchard block and shared facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter check, invoice, permit, and allocation worksheet"
    - protocol_id: cp_harvest_and_packaging_records
      process_id: "harvest_and_field_handling_and_conditioning_and_farm_gate"
      flow_role: "harvest, fruit mass, culls, water, packaging, electricity, and waste"
      record_type: "weigh tickets, harvest logs, pack-house records, utility meters, and waste records"
      raw_fields: "date, block, lot, accepted mass, cull mass, material, water, energy, waste fate, gate"
      collection_method: "weigh each lot or use a documented calibrated estimation method; Raw aggregation and attribution: reconcile harvested, accepted, cull, and waste streams by lot"
      unit: "kg, m3, kWh, unit"
      frequency: "each harvest lot and campaign reconciliation"
      temporal_coverage: "complete harvest campaign"
      site_scope: "orchard block and gate facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, lot record, meter, waste receipt, and gate declaration"
  calculation_rules:
    - id: calc_orchard_year_normalization
      applies_to: "all crop-year rows"
      rule: "Divide the attributed orchard-year inventory by accepted fresh whole fruit mass at the declared gate and scale to 1,000 kg."
      inputs:
        - "block area"
        - "attributed input records"
        - "accepted output mass"
      output: "normalized PCR inventory"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_equivalents
      applies_to: "fertilizer and soil-amendment rows"
      rule: "nutrient equivalent = formulated product mass × documented nutrient fraction; retain product mass and nutrient basis as separate fields."
      inputs:
        - "product mass"
        - "N/P2O5/K2O fraction"
      output: "nutrient-equivalent inputs"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_water_withdrawal_balance
      applies_to: "irrigation and fertigation"
      rule: "withdrawal = source withdrawal records reconciled to delivered water and declared return or consumption balance; do not infer withdrawal from rainfall alone."
      inputs:
        - "source meters"
        - "delivered water"
        - "return flow"
      output: "water withdrawal and delivered irrigation inputs"
      source_ids:
        - fao-crop-evapotranspiration-56
    - id: calc_citrus_mass_balance
      applies_to: "harvest, conditioning, and gate output"
      rule: "harvested mass = accepted product + culls + recorded field, sorting, and packing losses; investigate unexplained residual mass."
      inputs:
        - "lot weights and waste records"
      output: "reconciled product and waste streams"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: quality_identity
      applies_to: "product and input rows"
      requirement: "Declare species or cultivar, orchard block, lot, product formulation, and gate state; retain evidence gap flow identities as evidence gap rather than substituting a nearby flow."
      evidence: "lot record, supplier document, and review note"
    - id: quality_measurement
      applies_to: "mass, water, energy, and fuel rows"
      requirement: "Use calibrated scales and meters where available; otherwise document the estimation method and uncertainty."
      evidence: "calibration record, meter check, or estimation worksheet"
    - id: quality_temporal
      applies_to: "all crop-year rows"
      requirement: "Cover the complete represented orchard year and harvest campaign, including all harvest rounds and relevant applications."
      evidence: "crop calendar, application log, and harvest register"
    - id: quality_completeness
      applies_to: "input, output, and waste rows"
      requirement: "Reconcile input records, accepted output, culls, residues, and packaging waste; explain missing records or material residuals."
      evidence: "mass-balance worksheet and waste receipts"
    - id: quality_disclosure
      applies_to: "dataset metadata"
      requirement: "Disclose boundary gate, orchard age, allocation basis, water source, nutrient basis, crop-protection program, and identity evidence gaps."
      evidence: "dataset metadata and practitioner review"
validation_rules:
  - rule_id: validate_mass_balance
    applies_to: "harvest, conditioning, and gate output"
    rule: "Accepted product, culls, and recorded losses must reconcile to harvested fruit within the declared measurement tolerance; unexplained residuals require review."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_input_records
    applies_to: "orchard cultivation and conditioning"
    rule: "Every foreground quantity must identify the orchard block or facility, crop-year or campaign period, unit, collection protocol, and allocation basis when shared."
    source_ids:
      - fao-gap-framework-2003
      - iso-14044-2006
  - rule_id: validate_reference_qualifiers
    applies_to: "reference flow and dataset metadata"
    rule: "The data package must declare species or cultivar group, geography, orchard age, production year, gate state, marketable grade, and identity evidence gap status before downstream use."
    source_ids:
      - codex-fresh-produce-hygiene
      - usda-ams-citrus-standards
published_dataset_profile:
  dataset_role: "Foreground agricultural production dataset for fresh whole pomelos and grapefruits"
  downstream_use: "May be used as a secondary dataset for orchard production and as a background dataset only when the declared gate, geography, year, and product state are compatible"
  allowed_use: "Comparative or attributional modelling of fresh whole pomelo and grapefruit production through the declared farm-gate or pack-house gate"
  excluded_use: "Juice, processed citrus, retail, consumer use, post-gate distribution, or any study that omits the required product, gate, crop-year, or residue qualifiers"
  required_metadata: "species and cultivar group, geography, orchard block and age, crop-year, irrigation source, nutrient and protection basis, harvest campaign, marketable output, cull and waste fate, gate state, and identity evidence gap declarations"
  required_quality_disclosure: "measurement basis, temporal coverage, allocation method, mass-balance result, water and nutrient accounting method, data gaps, and flow-identity status"
  update_trigger: "New orchard route, irrigation or crop-protection technology, material change in yield or grade mix, revised nutrient or emission method, changed gate state, or resolution of an identity evidence gap"
