system_boundary:
  rules:
    - rule_id: boundary_orchard_year
      applies_to: "establishment and orchard cultivation"
      rule: "Include orchard care and direct crop emissions attributable to the declared production year; include establishment only when its area, age, and attribution basis are explicitly declared, and exclude unrelated infrastructure construction."
      source_ids:
        - fao-gap-framework-2003
    - rule_id: boundary_harvest_gate
      applies_to: "harvest, conditioning, and packing"
      rule: "End the default foreground boundary at the declared farm-gate or pack-house gate. Include sorting, washing, cooling, primary packaging, and pre-gate transport only when they occur before that gate."
      source_ids:
        - codex-fresh-produce-hygiene
        - usda-ams-citrus-standards
    - rule_id: boundary_residue_fate
      applies_to: "culls, field residues, wastewater, and packaging waste"
      rule: "Record field return, composting, feed use, treatment, transport, or disposal for each residue stream. Do not assign a co-product credit without a documented recipient and intended use."
