measurement_rules:
  - id: reference_citrus_mass
    applies_to: "harvested fruit, marketable fruit, culls, and residues"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh marketable, downgraded, rejected, field-loss, and residual fruit streams separately and reconcile them before conversion to the 1,000 kg reference output."
  - id: orchard_year_normalization
    applies_to: "orchard and harvest records"
    required_property_ref:
      name: "Area and mass"
      uuid: ""
    required_unit: "ha and kg"
    rule: "Record inputs and harvest rounds by orchard block and crop year, then normalize the attributable inventory to marketable output from the same block and harvest campaign."
  - id: nutrient_product_basis
    applies_to: "fertilizer and soil-amendment inputs"
    required_property_ref:
      name: "Product and nutrient mass"
      uuid: ""
    required_unit: "kg product, kg N, kg P2O5, kg K2O"
    rule: "Record actual formulated product mass and documented nutrient concentration separately; derive nutrient equivalents only from a supplier specification, label, nutrient plan, or laboratory result."
  - id: water_delivery_basis
    applies_to: "irrigation, fertigation, washing, and source withdrawal"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Keep crop irrigation, fertigation carrier water, post-harvest washing water, and natural-resource withdrawal as distinct records and disclose the meter or water-balance basis."
  - id: postharvest_mass_reconciliation
    applies_to: "sorting, washing, cooling, and packing"
    required_property_ref:
      name: "Mass and moisture"
      uuid: ""
    required_unit: "kg and declared fraction"
    rule: "Retain measured soil removal, water uptake, cooling loss, culls, and packing loss separately from harvested fruit mass and disclose the reconciliation."
