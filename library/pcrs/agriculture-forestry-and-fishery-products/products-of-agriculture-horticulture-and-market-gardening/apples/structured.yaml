allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "subprocesses and grades"
    rule: "First avoid allocation by subdividing establishment, management, harvest, handling, industrial fruit, and residue management where records permit."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_perennial_time
    applies_to: "establishment and removal"
    rule: "Annualize attributable burdens over declared productive life and lifetime marketable yield; disclose non-bearing years, replacements, and yield assumptions."
    source_ids:
      - goossens-apple-orchard-lca-2017
      - baima-apple-orchard-lca-2024
  - rule_id: allocation_multiple_apple_outputs
    applies_to: "accepted and industrial apples"
    rule: "Use mass allocation when subdivision is impossible; economic allocation requires representative prices and a mass-allocation sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_fate
    applies_to: "orchard biomass"
    rule: "Assign collection and on-site management to the orchard; use substitution only with an evidenced displaced product, route, and market. Explicitly model open burning when practiced."
    source_ids:
      - ucdavis-orchard-lca-findings-2020
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_orchard_lifecycle_records
      process_id: "orchard_lifecycle_and_production"
      flow_role: "establishment and removal"
      record_type: "orchard asset record"
      raw_fields: "block; planting year; productive life; trees; replacements; supports; irrigation materials; removal; fate"
      collection_method: "invoices, field logs, asset register"
      unit: "item, kg, L, kWh, year"
      frequency: "per event"
      temporal_coverage: "complete orchard model"
