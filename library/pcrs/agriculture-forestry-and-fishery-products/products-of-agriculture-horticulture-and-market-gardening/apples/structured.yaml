    applies_to: "fertilizer and nitrogen emissions"
    rule: "Confirm product mass differs from kg N; verify separate N2O, NH3, and nitrate amounts, receiving media, method factors, and N-equivalent mass balance. Convert N2O-N by 44/28, NH3-N by 17/14, and nitrate-N by 62/14 when reporting substance mass."
