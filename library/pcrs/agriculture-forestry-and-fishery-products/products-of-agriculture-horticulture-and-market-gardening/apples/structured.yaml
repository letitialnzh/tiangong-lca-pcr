system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary includes material nursery-tree and support-system installation, soil preparation, planting, attributable irrigation infrastructure, annual fertilization, irrigation, crop protection, pruning and floor management, purchased pollination when material, machinery, harvest, field transport, orchard-gate handling, and end-of-life removal. Upstream production uses representative background datasets. Packing-house grading, retail packaging, cold storage, distribution, retail, consumption, and processing are outside the default boundary."
      source_ids: []
    - rule_id: boundary_orchard_life_cycle
      applies_to: "all datasets"
      rule: "Include establishment, juvenile years, productive years, replacements, and removal through an annualized perennial-orchard model, or justify a representative alternative."
      source_ids:
        - goossens-apple-orchard-lca-2017
        - baima-apple-orchard-lca-2024
    - rule_id: boundary_gate
      applies_to: "reference product"
      rule: "End the default boundary at accepted fresh bulk apples at the orchard gate; packing-house and cold-store operations require a downstream dataset."
      source_ids:
        - codex-cxs-299-2010
    - rule_id: boundary_input_completeness
      applies_to: "orchard management"
      rule: "Address fertilizer, irrigation, crop protection, fuel, electricity, land, establishment materials, biomass fate, and direct emissions with a value, justified zero, or documented exclusion."
      source_ids:
        - baima-apple-orchard-lca-2024
        - ucdavis-orchard-lca-findings-2020
    - rule_id: boundary_quality_separation
      applies_to: "apple outputs"
      rule: "Separate accepted fresh fruit, industrial-grade fruit, culls, and losses by measured mass and fate."
      source_ids:
        - codex-cxs-299-2010
        - mass-balance-identity
