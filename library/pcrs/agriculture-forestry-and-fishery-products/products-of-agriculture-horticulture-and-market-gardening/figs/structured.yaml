validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference flow"
    rule: "Reject a final dataset unless the reference amount is 1 kg fresh figs at farm gate, all required qualifiers are present, and the evidence gap product identity has been resolved to a verified foreground flow."
    source_ids:
      - unece-ffv-17-fresh-figs-2017
      - iso-14044-2006
  - rule_id: validation_boundary_start
    applies_to: "system boundary"
    rule: "Check that the dataset declares orchard starting condition, productive status, reporting period, and the inclusion or exclusion of establishment and renewal activities."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_input_basis
    applies_to: "nutrient, water, fuel, plant protection, and container rows"
    rule: "Check that each included input has a site record, stated unit and property, normalization basis, collection protocol, and identity status; nutrient cards must retain actual product and nutrient basis."
    source_ids:
      - fao-good-agricultural-practices-figs-2008
      - fao-crop-evapotranspiration-56-1998
  - rule_id: validation_flow_binding
    applies_to: "parameterized and evidence gap flows"
    rule: "Accept only an applicable Flow Set group at version 0.2.0 or a later verified concrete UUID during foreground-data generation; do not substitute a nearby product, direction, or flow type to force a match."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_emission_pathways
    applies_to: "managed-soil elementary outputs"
    rule: "Check that nitrogen activity data, method tier or factors, conversion basis, and pathway assumptions are present for every reported ammonia, N2O, or nitrate flow, and that omitted pathways are explicitly justified."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_yield_reconciliation
    applies_to: "harvest and farm-gate process"
    rule: "Check that gross harvest, saleable fresh figs, culls, field loss, and other destinations reconcile before normalization; reject unexplained negative or double-counted outputs."
    source_ids:
      - unece-ffv-17-fresh-figs-2017
      - iso-14044-2006
  - rule_id: validation_downstream_boundary
    applies_to: "farm-gate output"
    rule: "Check that washing, grading, packing for downstream distribution, storage, transport, drying, and processing after the declared gate are not silently included."
    source_ids:
      - unece-ffv-17-fresh-figs-2017
      - iso-14067-2018
published_dataset_profile:
  dataset_role: "secondary_dataset for farm-gate fresh-fig production; background_dataset only when the declared geography, season, market state, and boundary are suitable for the receiving study"
  downstream_use: "Foreground process inventory and lifecyclemodel projections for fresh, unprocessed figs at farm gate; partial farm-gate carbon-footprint studies when impact-method assumptions are declared"
  allowed_use: "Comparative or attributional LCA of fresh figs, orchard management scenarios, irrigation or nutrient-management scenarios, and supply-chain studies that add downstream handling explicitly"
  excluded_use: "Dried or processed fig products; nursery-stock datasets; generic fruit datasets without fresh-fig qualifiers; studies that assume post-farm-gate packaging, storage, transport, or processing is already included"
  required_metadata: "PCR id and version; species and variety; farm geography; orchard block area and age; reporting year or harvest season; irrigation regime; nutrient and plant-protection records; yield and cull reconciliation; farm-gate definition; flow identities and Flow Set bindings"
  required_quality_disclosure: "Data coverage, measurement and estimation methods, missing data, annualization of perennial orchard inputs, emission method tier, allocation, uncertainty or sensitivity, and all identity evidence gaps before foreground completion"
  update_trigger: "New PCR version; change in farm-gate definition; material change in orchard system, irrigation, nutrient, plant-protection, harvest, or allocation method; or evidence that the fresh-fig market state or boundary has changed"
