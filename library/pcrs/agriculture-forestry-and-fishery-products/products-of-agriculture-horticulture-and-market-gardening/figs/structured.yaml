system_boundary:
  rules:
    - rule_id: boundary_start_farm_orchard
      applies_to: "foreground system boundary"
      rule: "Include orchard establishment or renewal, land occupation, orchard management, harvest, and all direct inputs and emissions needed to produce fresh figs up to the declared farm-gate transfer."
      source_ids:
        - iso-14044-2006
        - fao-good-agricultural-practices-figs-2008
    - rule_id: boundary_annualize_perennial_assets
      applies_to: "perennial orchard establishment"
      rule: "Annualize planting or renewal inputs over a documented productive service life when the activity supports multiple reporting years; retain the unannualized record for auditability."
      source_ids:
        - iso-14044-2006
        - fao-good-agricultural-practices-figs-2008
    - rule_id: boundary_exclude_downstream_fresh_handling
      applies_to: "downstream handling"
      rule: "Exclude downstream washing, grading, packing, storage, transport, drying, and processing after the declared farm-gate transfer."
      source_ids:
        - unece-ffv-17-fresh-figs-2017
        - iso-14067-2018
    - rule_id: boundary_disclose_starting_condition
      applies_to: "dataset disclosure"
