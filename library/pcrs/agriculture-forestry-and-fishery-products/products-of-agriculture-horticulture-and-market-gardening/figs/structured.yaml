    - id: calc_irrigation_from_water_balance
      applies_to: "irrigation_water"
      rule: "Use delivered meter records where available. Otherwise calculate irrigation delivery from documented flow rate × operating time, or from a documented soil-water balance using local climate, soil, crop, and management data; disclose the basis selected."
