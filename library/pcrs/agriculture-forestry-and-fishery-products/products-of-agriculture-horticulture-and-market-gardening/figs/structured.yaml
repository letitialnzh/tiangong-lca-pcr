  what: "Fresh, unprocessed whole figs transferred at the producing farm gate"
  how_much: "1 kg saleable fresh figs at farm gate"
  how_well: "Fruit meets the declared fresh market specification and is intact, sound, clean, fresh in appearance, and free from abnormal external moisture, foreign smell, or taste; the dataset must disclose any local quality class or buyer specification"
