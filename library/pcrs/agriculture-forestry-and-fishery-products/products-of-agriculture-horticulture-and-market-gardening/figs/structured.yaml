allocation_rules:
  - rule_id: allocation_avoid_unnecessary
    applies_to: "orchard and harvest processes"
    rule: "Do not allocate burdens when the process can be subdivided into separately measured orchard blocks, operations, or product outputs without material loss of information."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_same_category_outputs
    applies_to: "multiple fresh-fig outputs"
    rule: "Treat fresh figs from different varieties, harvest windows, or market classes as the same reference-product category unless the dataset declares a distinct product specification; aggregate their measured burdens before normalization."
    source_ids:
      - unece-ffv-17-fresh-figs-2017
      - iso-14044-2006
  - rule_id: allocation_marketed_coproducts
    applies_to: "documented co-products"
    rule: "If a separate marketable co-product shares orchard or harvest operations, first subdivide where possible; otherwise allocate remaining shared burdens by economic value using reporting-period quantities and farm-gate prices, and disclose the allocation sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_culls_not_coproducts
    applies_to: "culls and field loss"
    rule: "Treat unmarketed culls, field loss, and residues without a documented market as waste or retained field material, not as co-products receiving an avoided burden."
    source_ids:
      - iso-14044-2006
      - unece-ffv-17-fresh-figs-2017
dataset_production:
  collection_protocols:
    - protocol_id: cp_orchard_establishment
      process_id: "orchard_establishment_and_renewal"
      flow_role: "planting_stock; orchard_land_occupation"
      record_type: "orchard register and site map"
      raw_fields: "block_id; area; tree_count; planting_year; renewal_area; planting_stock; productive_life; land tenure"
      collection_method: "farm register, map, invoices, and field verification"
      unit: "ha; item; year"
      frequency: "annual and event-based"
      temporal_coverage: "reporting year plus documented productive service life"
      site_scope: "each declared orchard block"
      aggregation_rule: "annualize each block's establishment or renewal record, then sum blocks"
      quality_evidence: "signed register, map, invoice, and agronomist or farm-manager review"
    - protocol_id: cp_irrigation_records
      process_id: "orchard_management"
      flow_role: "irrigation_water"
      record_type: "irrigation log or meter record"
      raw_fields: "block_id; date; source; delivery volume; meter reading; irrigation method; rainfall note"
      collection_method: "meter readout, pump log, or documented water-balance calculation"
      unit: "m3 or kg"
      frequency: "event-based, aggregated monthly"
      temporal_coverage: "complete harvest season and reporting year"
      site_scope: "each irrigated orchard block"
      aggregation_rule: "sum delivered water by block and reporting period; retain gross/net basis"
      quality_evidence: "meter calibration or flow-rate evidence and operator sign-off"
    - protocol_id: cp_nutrient_amendment_records
      process_id: "orchard_management"
      flow_role: "fertilizer_soil_amendment"
      record_type: "input invoice and application log"
      raw_fields: "product_name; supplier; product_mass; N; P2O5; K2O; organic_matter; date; block_id; application_method"
      collection_method: "invoice, label or certificate, and application record"
      unit: "kg product; kg nutrient"
      frequency: "event-based"
      temporal_coverage: "reporting year"
      site_scope: "each applied orchard block"
      aggregation_rule: "sum actual products and separately sum declared nutrient bases"
      quality_evidence: "invoice, product label, soil or plant analysis, and application log"
    - protocol_id: cp_crop_protection_records
      process_id: "orchard_management"
      flow_role: "crop_protection_products"
      record_type: "plant-protection log"
      raw_fields: "product_name; formulation; active_ingredient; dose; volume or mass; date; block_id; target"
      collection_method: "farm spray log, invoice, and product label"
      unit: "kg or L product"
      frequency: "event-based"
      temporal_coverage: "reporting year"
      site_scope: "each treated orchard block"
      aggregation_rule: "sum by formulation and application event; retain active-ingredient detail"
      quality_evidence: "approved-use record, invoice, label, and operator sign-off"
    - protocol_id: cp_machinery_fuel_records
      process_id: "orchard_management"
      flow_role: "mobile_machinery_fuel"
      record_type: "fuel issue record or machinery log"
      raw_fields: "equipment_id; fuel_type; volume or mass; operating_hours; operation; date; block_id"
      collection_method: "fuel ledger, tank meter, supplier invoice, or equipment record"
      unit: "L, kg, or MJ"
      frequency: "event-based and monthly"
      temporal_coverage: "reporting year"
      site_scope: "orchard operations within boundary"
      aggregation_rule: "assign fuel to orchard blocks by direct issue or documented activity share"
      quality_evidence: "invoice or meter record and equipment log"
    - protocol_id: cp_residue_records
      process_id: "orchard_management"
      flow_role: "pruning_and_plant_residues_removed"
      record_type: "residue log"
      raw_fields: "block_id; residue_type; mass; moisture_basis; removal_date; treatment_route"
      collection_method: "weigh ticket, contractor record, or documented estimate"
      unit: "kg wet or dry"
      frequency: "event-based"
      temporal_coverage: "reporting year"
      site_scope: "declared orchard blocks"
      aggregation_rule: "sum only residues removed from the boundary; disclose retained residues separately"
      quality_evidence: "weigh ticket, contractor record, or field estimate with method"
    - protocol_id: cp_soil_emission_calculation
      process_id: "orchard_management"
