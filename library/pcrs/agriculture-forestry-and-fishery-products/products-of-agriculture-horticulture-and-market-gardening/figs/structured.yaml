  calculation_rules:
    - id: calc_annualized_orchard_establishment
      applies_to: "planting_stock; orchard_land_occupation"
      rule: "Annualized amount = documented establishment or renewal amount / documented productive service life in years; apply separately by orchard block and reporting year."
      inputs:
