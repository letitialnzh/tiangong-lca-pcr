allocation_rules:
  - rule_id: allocation_single_crop_fields
    applies_to: "field operations assigned to one crop"
    rule: "Assign field operations directly to watermelon when the operation serves only the declared crop cycle; document any shared operation before applying an allocation method."
    source_ids:
      - fao-crop-production-framework
  - rule_id: allocation_multiple_outputs
    applies_to: "marketable fruit and any documented productive residue use"
    rule: "Report marketable watermelon as the reference output. If a residue or other output has a documented productive use and leaves the boundary as a product, apply a declared physical or economic allocation method consistently across the shared process and disclose the allocation basis."
    source_ids:
      - fao-crop-residue-management
  - rule_id: allocation_rejects_and_losses
    applies_to: "damaged fruit and crop residues without productive use"
    rule: "Treat rejected fruit and residues as waste or loss according to their declared destination. Do not allocate burdens to a waste stream as a co-product without evidence of productive use and a defined hand-off."
    source_ids:
      - fao-postharvest-handling
dataset_production:
