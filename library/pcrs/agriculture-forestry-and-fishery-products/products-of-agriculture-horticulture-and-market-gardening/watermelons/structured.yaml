        - fao-crop-production-framework
        - usda-watermelon-production-guidance
    - rule_id: boundary_farm_gate
      applies_to: "harvest and preparation"
      rule: "End the foreground boundary when marketable whole watermelon is transferred at the farm gate; include on-farm grading, trimming of damaged fruit, washing, cooling, and primary packaging only when they occur before transfer."
      source_ids:
        - usda-watermelon-production-guidance
        - fao-postharvest-handling
    - rule_id: boundary_managed_soils
      applies_to: "fertilizer, amendment, and residue flows"
      rule: "Include direct and indirect managed-soil emissions attributable to applied nutrients and returned residues under one declared calculation method, without double counting emissions represented by an upstream dataset."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: boundary_residue_fate
      applies_to: "rejected fruit and crop residues"
      rule: "Record field return, composting, feed, treatment, disposal, or another declared destination for each residue stream; an unreported destination remains a data-quality gap and is not an automatic co-product."
      source_ids:
        - fao-crop-residue-management
        - fao-postharvest-handling
