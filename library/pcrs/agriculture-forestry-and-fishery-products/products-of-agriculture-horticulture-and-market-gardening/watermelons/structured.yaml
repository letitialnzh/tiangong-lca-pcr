allocation_rules:
  - rule_id: allocation_single_crop_fields
    applies_to: "field operations assigned to one crop"
    rule: "Assign field operations directly to watermelon when the operation serves only the declared crop cycle; document any shared operation before applying an allocation method."
    source_ids:
      - fao-crop-production-framework
  - rule_id: allocation_multiple_outputs
    applies_to: "marketable fruit and any documented productive residue use"
    rule: "Report marketable watermelon as the reference output. If a residue or other output has a documented productive use and leaves the boundary as a product, apply a declared physical or economic allocation method consistently across the shared process and disclose the allocation basis."
    source_ids:
      - fao-crop-residue-management
  - rule_id: allocation_rejects_and_losses
    applies_to: "damaged fruit and crop residues without productive use"
    rule: "Treat rejected fruit and residues as waste or loss according to their declared destination. Do not allocate burdens to a waste stream as a co-product without evidence of productive use and a defined hand-off."
    source_ids:
      - fao-postharvest-handling
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_planting_records
      process_id: "field_preparation_and_planting"
      flow_role: "planting_material_input, planted_field_output"
      record_type: "planting and field register"
      raw_fields: "field_id; area; planting date; seed_or_transplant_type; supplier quantity; failures; replants"
      collection_method: "supplier records and field log reconciliation; Raw aggregation and attribution: aggregate by field, then normalize to marketable output"
      unit: "seed units, kg, ha"
      frequency: "each crop cycle"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each field or homogeneous block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier invoice plus signed field register or equivalent"
    - protocol_id: cp_field_operation_records
      process_id: "field_preparation_and_planting_watermelon_field_management"
      flow_role: "field_preparation_energy, field_occupation, field_operation_energy_electricity, field_operation_energy_diesel"
      record_type: "machinery, pump, and field register"
      raw_fields: "field_id; operation; date; equipment; fuel or electricity; hours; area"
      collection_method: "meter, fuel receipt, machinery log, or service record; Raw aggregation and attribution: assign shared operations by documented area or time basis"
      unit: "kg, kWh, h, ha"
      frequency: "each operation"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each field or equipment group"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration, receipt, or service record"
    - protocol_id: cp_fertilizer_records
      process_id: "watermelon_field_management"
      flow_role: "fertilizer and managed-soil emissions"
      record_type: "nutrient application register"
      raw_fields: "field_id; product; formulation; nutrient concentration; amount; date; application method; soil or climate inputs"
      collection_method: "fertilizer invoice and application log; Raw aggregation and attribution: sum by nutrient basis and field before normalization"
      unit: "kg product, kg nutrient"
      frequency: "each application"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, label, soil test, and application record"
    - protocol_id: cp_irrigation_records
      process_id: "watermelon_field_management"
      flow_role: "irrigation_water_input"
      record_type: "irrigation register"
      raw_fields: "field_id; source; date; meter start and end; estimated volume; rainfall context"
      collection_method: "meter or documented water-balance estimate; Raw aggregation and attribution: sum delivered volume by field and source"
      unit: "m3"
      frequency: "each irrigation event or weekly"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each field and source"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter record, pump log, or water allocation record"
    - protocol_id: cp_crop_protection_records
      process_id: "watermelon_field_management"
      flow_role: "crop_protection_input"
      record_type: "crop-protection application register"
      raw_fields: "field_id; product; formulation; active ingredient; dose; area; date; target"
      collection_method: "product label, invoice, and application log; Raw aggregation and attribution: sum by product and active ingredient"
      unit: "kg product, kg active ingredient, ha"
      frequency: "each application"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "label, invoice, and application record"
    - protocol_id: cp_harvest_records
      process_id: "watermelon_field_management_harvest_and_farm_gate_preparation"
      flow_role: "harvest_ready_crop_output, field_residue_output, rejected_fruit_output, watermelon_farm_gate_output"
      record_type: "harvest and grading register"
      raw_fields: "field_id; harvest date; gross harvested; marketable; rejected; residue; destination; grade; transfer weight"
      collection_method: "scale tickets and harvest or grading log; Raw aggregation and attribution: reconcile gross mass to marketable, rejected, and declared residue destinations"
      unit: "kg"
      frequency: "each harvest"
      temporal_coverage: "final harvest window and full crop cycle"
      site_scope: "each field, lot, or harvest block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale, ticket, and destination record"
    - protocol_id: cp_residue_records
      process_id: "watermelon_field_management"
      flow_role: "field_residue_output"
      record_type: "residue destination record"
      raw_fields: "field_id; residue type; wet or dry basis; amount; destination; date"
      collection_method: "field measurement and destination confirmation; Raw aggregation and attribution: aggregate by destination and dry-matter basis where used"
      unit: "kg"
      frequency: "each residue event"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each field"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weigh record, compost or feed receipt, or field-return log"
    - protocol_id: cp_harvest_handling_records
      process_id: "harvest_and_farm_gate_preparation"
      flow_role: "harvest_handling_energy_electricity, harvest_handling_energy_diesel"
      record_type: "handling and packing register"
      raw_fields: "lot_id; operation; date; energy carrier; quantity; marketable mass"
      collection_method: "meter, equipment log, or service record; Raw aggregation and attribution: assign energy to marketable mass and declare shared-service allocation"
      unit: "kg, kWh, h"
      frequency: "each lot or operation"
      temporal_coverage: "final harvest window"
      site_scope: "packing or handling site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter or service record"
    - protocol_id: cp_packaging_records
      process_id: "harvest_and_farm_gate_preparation"
      flow_role: "primary_packaging_input_wood_crate, primary_packaging_input_corrugated_box, primary_packaging_input_pe_film"
      record_type: "packaging register"
      raw_fields: "lot_id; material; reusable or single-use; unit count; unit mass; losses; reuse cycles"
      collection_method: "supplier specification and count or weight record; Raw aggregation and attribution: sum packaging mass and document reuse allocation"
      unit: "kg, item"
      frequency: "each lot"
      temporal_coverage: "final harvest window"
      site_scope: "packing site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier specification and packing record"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all inventory rows"
      rule: "normalized amount = field or lot amount × 1,000 kg / marketable farm-gate watermelon mass"
      inputs:
        - "field or lot record"
        - "marketable mass"
      output: "amount per 1,000 kg reference flow"
      source_ids: []
    - id: calc_nutrient_mass
      applies_to: "fertilizer inputs"
      rule: "nutrient mass = product mass × declared nutrient concentration"
      inputs:
        - "product mass"
        - "label or supplier concentration"
      output: "kg N, kg P2O5, or kg K2O"
      source_ids:
        - uga-watermelon-production-b996-2017
    - id: calc_land_occupation
      applies_to: "field occupation"
      rule: "occupation = field area × declared crop-cycle occupation duration"
      inputs:
        - "field area"
        - "planting and final harvest dates"
      output: "m2*a or declared area-time unit"
      source_ids: []
    - id: calc_managed_soil_emissions
      applies_to: "managed-soil nitrogen emissions"
      rule: "Apply one declared IPCC-compatible method to documented nutrient inputs and returned residues; retain factors and assumptions with the dataset."
      inputs:
        - "nutrient inputs"
        - "residue return"
        - "soil and climate parameters"
      output: "elementary nitrogen emissions per reference flow"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_mass_balance
      applies_to: "harvest and grading"
      rule: "gross harvested = marketable + rejected + documented other destinations, subject to scale precision and declared estimation uncertainty"
      inputs:
        - harvest
        - grading
        - "and destination records"
      output: "reconciled crop output and loss record"
      source_ids:
        - fao-postharvest-handling
    - id: calc_reusable_packaging
      applies_to: "reusable primary packaging"
      rule: "Allocate packaging manufacture and loss to the declared number of use cycles using supplier or operator records; do not apply reuse credit without a documented cycle count."
      inputs:
        - "packaging mass"
        - "use cycles"
        - "loss rate"
      output: "packaging mass per reference flow"
      source_ids:
        - fao-postharvest-handling
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference and output flows"
      requirement: "Declare cultivar or seed type, production geography, crop-cycle dates, harvest window, whole-fruit state, grade, and farm-gate hand-off."
      evidence: "product and field register"
    - id: dq_mass_reconciliation
      applies_to: "harvest, rejects, residues, and reference output"
      requirement: "Reconcile gross harvested mass to marketable output, rejected fruit, residues, and other declared destinations within the stated scale or estimation uncertainty."
      evidence: "scale tickets and destination records"
    - id: dq_input_completeness
      applies_to: "all product and elementary inputs"
      requirement: "Account for seed or transplants, fertilizer nutrients, irrigation, crop-protection products, field energy, land occupation, soil emissions, and included handling inputs; disclose unavailable records."
      evidence: "input registers and completeness checklist"
    - id: dq_temporal_geographic_scope
      applies_to: "all foreground records"
      requirement: "Cover the complete declared crop cycle and identify field, production geography, production year, irrigation regime, and any protected-cultivation route."
      evidence: "field register and production metadata"
    - id: dq_residue_destination
      applies_to: "crop residues and rejected fruit"
      requirement: "Retain a destination and quantity for each residue stream; identify field return, feed, composting, treatment, disposal, or other documented use."
      evidence: "residue and destination records"
    - id: dq_uncertainty_disclosure
      applies_to: "estimated or calculated values"
      requirement: "Mark estimates, conversion factors, and missing measurements, and state the effect on the normalized reference flow."
      evidence: "calculation sheet and quality review"
validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Reference amount is 1,000 kg mass of whole, marketable watermelon at farm gate and carries all required qualifiers."
    source_ids: []
  - rule_id: validate_cycle_completeness
    applies_to: "process map and records"
    rule: "Field preparation, planting, managed production, harvest, and farm-gate hand-off are present for the declared annual crop cycle, with conditional operations explicitly marked."
    source_ids:
      - fao-crop-production-framework
  - rule_id: validate_mass_balance
    applies_to: "harvest and grading"
    rule: "Gross harvested, marketable, rejected, residue, and other destination masses are reconciled and do not double count the reference output."
    source_ids:
      - fao-postharvest-handling
  - rule_id: validate_nutrient_and_water_basis
    applies_to: "fertilizer and irrigation"
    rule: "Fertilizer inputs retain nutrient basis and concentration evidence; irrigation volume identifies source and field and is not conflated with rainfall."
    source_ids:
      - fao-crop-evapotranspiration-56
  - rule_id: validate_residue_and_loss_fate
    applies_to: "rejected fruit and residues"
    rule: "Every non-marketable stream has a declared destination or an explicit data-quality finding; waste is not treated as a co-product without documented productive use."
    source_ids:
      - fao-crop-residue-management
  - rule_id: validate_boundary_disclosure
    applies_to: "dataset metadata"
    rule: "Prior land use, crop cycle, production geography, irrigation regime, soil-emission method, residue fate, and all included farm-gate operations are disclosed."
    source_ids:
      - fao-crop-production-framework
      - ipcc-2019-managed-soils
  - rule_id: validate_normalization
    applies_to: "all inventory rows"
    rule: "All amounts can be traced to field, crop-cycle, harvest, or lot records and normalize to 1,000 kg marketable farm-gate output."
    source_ids: []
published_dataset_profile:
  dataset_role: "Primary foreground agricultural production dataset for fresh whole watermelon at farm gate"
  downstream_use: "secondary_dataset; may supply a background_dataset when the documented farm-gate product and quality qualifiers match"
  allowed_use: "LCA modelling of fresh whole watermelon production through the declared farm-gate hand-off and included on-farm preparation"
  excluded_use: "Processed or cut watermelon, seed or transplant production, post-farm-gate storage and distribution, retail, consumption, or unreported crop routes"
  required_metadata: "production geography; production year; crop-cycle dates; cultivar or seed type; field area; irrigated or rainfed route; farm-gate state; grade; washing and packaging state; residue destinations"
  required_quality_disclosure: "mass reconciliation; input completeness; nutrient and irrigation basis; soil-emission method; residue and reject fate; estimated values; temporal and geographic coverage"
  update_trigger: "material change in cultivation route, irrigation or nutrient practice, crop-protection regime, farm-gate preparation, packaging, classification scope, or evidence supporting quantitative rules"
