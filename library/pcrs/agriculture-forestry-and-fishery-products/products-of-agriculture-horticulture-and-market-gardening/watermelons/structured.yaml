      frequency: "each crop cycle"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each field or homogeneous block"
      aggregation_rule: "aggregate by field, then normalize to marketable output"
      quality_evidence: "supplier invoice plus signed field register or equivalent"
    - protocol_id: cp_field_operation_records
