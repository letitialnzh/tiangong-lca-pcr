validation_rules:
  - rule_id: validate_reference_flow
    applies_to: "reference product"
    rule: "Reference amount is 1,000 kg mass of whole, marketable watermelon at farm gate and carries all required qualifiers."
    source_ids: []
  - rule_id: validate_cycle_completeness
    applies_to: "process map and records"
    rule: "Field preparation, planting, managed production, harvest, and farm-gate hand-off are present for the declared annual crop cycle, with conditional operations explicitly marked."
    source_ids:
      - fao-crop-production-framework
  - rule_id: validate_mass_balance
    applies_to: "harvest and grading"
    rule: "Gross harvested, marketable, rejected, residue, and other destination masses are reconciled and do not double count the reference output."
    source_ids:
      - fao-postharvest-handling
  - rule_id: validate_nutrient_and_water_basis
    applies_to: "fertilizer and irrigation"
    rule: "Fertilizer inputs retain nutrient basis and concentration evidence; irrigation volume identifies source and field and is not conflated with rainfall."
    source_ids:
      - fao-crop-evapotranspiration-56
  - rule_id: validate_residue_and_loss_fate
    applies_to: "rejected fruit and residues"
    rule: "Every non-marketable stream has a declared destination or an explicit data-quality finding; waste is not treated as a co-product without documented productive use."
    source_ids:
      - fao-crop-residue-management
  - rule_id: validate_boundary_disclosure
    applies_to: "dataset metadata"
    rule: "Prior land use, crop cycle, production geography, irrigation regime, soil-emission method, residue fate, and all included farm-gate operations are disclosed."
    source_ids:
      - fao-crop-production-framework
      - ipcc-2019-managed-soils
  - rule_id: validate_normalization
    applies_to: "all inventory rows"
    rule: "All amounts can be traced to field, crop-cycle, harvest, or lot records and normalize to 1,000 kg marketable farm-gate output."
    source_ids: []
published_dataset_profile:
  dataset_role: "Primary foreground agricultural production dataset for fresh whole watermelon at farm gate"
  downstream_use: "secondary_dataset; may supply a background_dataset when the documented farm-gate product and quality qualifiers match"
  allowed_use: "LCA modelling of fresh whole watermelon production through the declared farm-gate hand-off and included on-farm preparation"
  excluded_use: "Processed or cut watermelon, seed or transplant production, post-farm-gate storage and distribution, retail, consumption, or unreported crop routes"
  required_metadata: "production geography; production year; crop-cycle dates; cultivar or seed type; field area; irrigated or rainfed route; farm-gate state; grade; washing and packaging state; residue destinations"
  required_quality_disclosure: "mass reconciliation; input completeness; nutrient and irrigation basis; soil-emission method; residue and reject fate; estimated values; temporal and geographic coverage"
  update_trigger: "material change in cultivation route, irrigation or nutrient practice, crop-protection regime, farm-gate preparation, packaging, classification scope, or evidence supporting quantitative rules"
