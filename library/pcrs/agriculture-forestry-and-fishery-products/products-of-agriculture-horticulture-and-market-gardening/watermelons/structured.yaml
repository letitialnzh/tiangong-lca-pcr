system_boundary:
  rules:
    - rule_id: boundary_annual_crop_cycle
      applies_to: "field preparation through final harvest"
      rule: "Include field preparation, planting, crop management, and all harvests of the declared annual crop cycle; allocate shared field operations to the reported crop using documented field records."
