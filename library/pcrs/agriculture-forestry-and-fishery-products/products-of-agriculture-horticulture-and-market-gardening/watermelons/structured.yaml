      unit: "m3"
      frequency: "each irrigation event or weekly"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each field and source"
      aggregation_rule: "sum delivered volume by field and source"
      quality_evidence: "meter record, pump log, or water allocation record"
    - protocol_id: cp_crop_protection_records
      process_id: "watermelon_field_management"
