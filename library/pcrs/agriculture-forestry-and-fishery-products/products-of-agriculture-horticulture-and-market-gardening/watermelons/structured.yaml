      raw_fields: "field_id; operation; date; equipment; fuel or electricity; hours; area"
      collection_method: "meter, fuel receipt, machinery log, or service record"
      unit: "kg, kWh, h, ha"
      frequency: "each operation"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each field or equipment group"
      aggregation_rule: "assign shared operations by documented area or time basis"
      quality_evidence: "meter calibration, receipt, or service record"
    - protocol_id: cp_fertilizer_records
      process_id: "watermelon_field_management"
      flow_role: "fertilizer and managed-soil emissions"
      record_type: "nutrient application register"
      raw_fields: "field_id; product; formulation; nutrient concentration; amount; date; application method; soil or climate inputs"
      collection_method: "fertilizer invoice and application log"
      unit: "kg product, kg nutrient"
      frequency: "each application"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each field"
      aggregation_rule: "sum by nutrient basis and field before normalization"
      quality_evidence: "invoice, label, soil test, and application record"
    - protocol_id: cp_irrigation_records
      process_id: "watermelon_field_management"
