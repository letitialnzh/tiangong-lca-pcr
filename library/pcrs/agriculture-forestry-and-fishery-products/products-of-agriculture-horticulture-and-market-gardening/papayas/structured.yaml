allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "allocation_marketable_output: Allocate crop-cycle inputs and direct cultivation exchanges to marketable fresh papaya using marketable mass as the primary output basis. source_ids: iso-14044-2006."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_rejects: Treat field and gate rejects as waste unless a documented receiving route creates a separately specified co-product. Do not assign avoided-product credit within this PCR. source_ids: iso-14044-2006, fao-gap-framework-2003."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "allocation_reusable_containers: Model reusable harvest containers and crates by recorded service cycles; assign their production burden across documented uses and retain consumed packaging as a separate input. source_ids: iso-14044-2006, codex-cxc-53-2003."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_papaya_establishment_records
      process_id: "papaya_crop_establishment"
      flow_role: "planting material and occupied area"
      record_type: "field establishment record"
      raw_fields: "cultivar; material type; supplier; quantity; field or protected-unit id; planted area; cycle start"
      collection_method: "supplier record, planting log, and area register; Raw aggregation and attribution: reconcile planted quantity and area to the same cycle"
      unit: "seedling, kg, ha"
      frequency: "each cycle"
      temporal_coverage: "full declared crop cycle"
      site_scope: "each represented field or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "purchase record, planting log, and field map"
    - protocol_id: cp_papaya_input_records
      process_id: "papaya_crop_management"
      flow_role: "water, fuel, nutrient products, crop protection, and emissions basis"
      record_type: "input and application record"
      raw_fields: "product; formulation; nutrient or active ingredient; quantity; source; application date; irrigation meter; fuel meter; field id"
      collection_method: "invoice review, meter reading, application log, and source register; Raw aggregation and attribution: sum applications and meter periods after field and cycle reconciliation"
      unit: "kg product, kg nutrient, m3, MJ, kg fuel"
      frequency: "each application or meter period"
      temporal_coverage: "full declared cycle"
      site_scope: "each represented field or protected unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, meters, calibration checks, and application records"
    - protocol_id: cp_papaya_harvest_records
      process_id: "papaya_harvest"
      flow_role: "containers, harvest, rejects, and residue"
      record_type: "harvest lot and residue record"
      raw_fields: "lot id; date; field id; gross mass; grade; reject mass; residue mass; container use; destination"
      collection_method: "calibrated scale, lot sheet, container log, and residue estimate; Raw aggregation and attribution: aggregate only lots sharing field, cycle, cultivar, grade, and gate"
      unit: "kg and container-use"
      frequency: "each harvest lot"
      temporal_coverage: "full harvest campaign"
      site_scope: "each harvest lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale check, lot reconciliation, and destination evidence"
    - protocol_id: cp_papaya_gate_records
      process_id: "papaya_gate_preparation"
      flow_role: "receiving, washing, packaging, output, and gate rejects"
      record_type: "packing or gate batch record"
      raw_fields: "batch id; received mass; wash water; wash loss; packaging type and mass; cooling; accepted mass; reject mass; destination; gate"
      collection_method: "batch sheet, water meter, packaging issue record, and scale; Raw aggregation and attribution: reconcile batch input to accepted output and separately identified losses"
      unit: "kg, m3, package-use"
      frequency: "each gate batch"
      temporal_coverage: "full period before declared hand-off"
      site_scope: "each declared farm or first packing-site gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale and meter checks, packaging records, and destination records"
  calculation_rules:
    - id: calc_marketable_normalization
      applies_to: "all processes"
      rule: "Normalize each collected quantity to the accepted marketable papaya mass at the declared gate: quantity / marketable_gate_mass."
      inputs:
        - field
        - cycle
        - lot
        - "and gate records"
      output: "quantity per kg or 1,000 kg marketable papaya"
      source_ids:
        - iso-14044-2006
    - id: calc_nutrient_equivalent
      applies_to: "fertilizer and soil amendments"
      rule: "product_mass × declared nutrient fraction; retain product mass and nutrient-equivalent result as separate fields."
      inputs:
        - "product invoice"
        - formulation
        - "and declared N/P2O5/K2O fraction"
      output: "product mass and nutrient mass"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_soil_nitrogen_emissions
      applies_to: "managed soil emissions"
      rule: "Apply one selected IPCC-compatible factor method to documented nitrogen inputs and returned residue nitrogen, with no duplicate upstream emission."
      inputs:
        - "nutrient records"
        - "residue basis"
        - "method factor"
      output: "declared soil-emission flows"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_mass_balance
      applies_to: "harvest and gate preparation"
      rule: "gross harvested mass = marketable output + rejects + residue or process loss, with any documented stock change shown separately."
      inputs:
        - "harvest lots"
        - "gate batches"
        - "reject and residue records"
      output: "reconciled mass-balance check"
      source_ids:
        - codex-cxc-53-2003
    - id: calc_reusable_container_burden
      applies_to: "harvest containers and crates"
      rule: "Divide container production burden by documented service cycles and assign the used-cycle share to the represented papaya output."
      inputs:
        - "container mass"
        - material
        - "expected or observed service cycles"
      output: "container burden per declared output"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all product and input flows"
      requirement: "Declare cultivar, material or product identity, field or protected-unit id, gate, and identity evidence gap status where no fixed or parameterized binding exists."
      evidence: "source records, labels, invoices, and dataset metadata"
    - id: quality_measurement
      applies_to: "mass, water, fuel, nutrient, and packaging rows"
      requirement: "Use calibrated scales or meters where available; otherwise document the estimation method, conversion factor, and uncertainty."
      evidence: "calibration record, meter log, or estimation worksheet"
    - id: quality_temporal
      applies_to: "all processes"
      requirement: "Cover the complete declared production cycle and harvest campaign, and disclose missing periods or substituted records."
      evidence: "cycle calendar, lot register, and data-quality note"
    - id: quality_completeness
      applies_to: "inventory and emissions"
      requirement: "Reconcile field inputs, harvest, accepted output, rejects, residue, water, nutrient basis, and packaging to the declared gate."
      evidence: "mass balance, application log, and gate batch reconciliation"
    - id: quality_disclosure
      applies_to: "dataset package"
      requirement: "Preserve all required qualifiers, boundary decisions, allocation choice, concrete flow identity verification."
      evidence: "dataset metadata and PCR conformance checklist"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "validation_identity: The dataset must identify papaya cultivar or product category, field or protected unit, production route, cycle, declared gate, and all evidence gap input or output identities. source_ids: fao-gap-framework-2003."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "validation_mass_balance: For every harvest and gate batch, gross harvested or received mass must reconcile to marketable output, rejects, residue, wastewater or wash loss, packaging loss, and any disclosed stock change. source_ids: codex-cxc-53-2003."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "validation_normalization: Every normalized inventory value must use the same declared marketable gate mass and must not mix farm-gate and first-packing-site outputs. source_ids: iso-14044-2006."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "validation_nutrient_emissions: Nutrient-equivalent inputs and managed-soil emissions must identify their basis and use one non-duplicative calculation method. source_ids: ipcc-2019-managed-soils."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "validation_temporal: The dataset must cover the represented production cycle and harvest campaign or explicitly disclose missing records and substitutions. source_ids: fao-gap-framework-2003."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground agricultural production dataset for fresh whole papaya"
  downstream_use: "Secondary dataset for farm-to-gate LCA and background dataset input to product-system models when the declared gate and qualifiers match"
  allowed_use: "Comparative or attributional modelling of fresh whole papaya when cultivar, geography, route, cycle, gate, marketable output, and inventory completeness are compatible"
  excluded_use: "Processed papaya products; generic fruit substitution; transport, retail, consumer, or end-of-life claims beyond the declared gate; datasets with unreported rejects or residue fate"
  required_metadata: "Papaya identity and cultivar, geography, route, field or protected-unit id, cycle dates, area, irrigation source, nutrient and crop-protection basis, harvest and grade, washing, cooling, packaging, reject and residue destinations, declared gate, reference mass, concrete flow identity verification, and identity evidence gap coverage"
  required_quality_disclosure: "Measurement basis, collection period, completeness, mass-balance result, allocation rule, provisional ranges, data substitutions, uncertainty, and evidence gap UUID or flow identities"
  update_trigger: "Change in cultivation route, irrigation system, nutrient or crop-protection programme, harvest or gate handling, packaging, accepted product definition, method factors, or resolved identity mappings"
data_sources:
  - id: "fao-irrigation-drainage-paper-56"
    type: "handbook"
    reference: "FAO Irrigation and drainage paper 56, *Crop evapotranspiration*"
    used_for: "irrigation measurement and water-delivery distinction"
  - id: "ipcc-2019-managed-soils"
    type: "method_factor"
    reference: "IPCC 2019 Refinement to the 2006 IPCC Guidelines, managed soils and nitrogen emissions"
    used_for: "managed-soil nitrogen calculation and non-duplication rule"
  - id: "codex-cxc-53-2003"
    type: "official_guidance"
    reference: "Codex Alimentarius CXC 53-2003, Code of hygienic practice for fresh fruits and vegetables"
    used_for: "harvest, washing, packing, hygiene, batch reconciliation, and gate handling"
  - id: "iso-14044-2006"
    type: "standard"
    reference: "ISO 14044:2006, environmental management—life cycle assessment—requirements and guidelines"
    used_for: "normalization, allocation, reusable-container treatment, and validation principles"
  - id: "fao-gap-framework-2003"
    type: "official_guidance"
    reference: "FAO Committee on Agriculture, COAG/2003/6, Development of a Framework for Good Agricultural Practices, section IV paragraphs 24–26 and Annex, https://www.fao.org/4/y8704e/y8704e.htm"
    used_for: "Generic monitoring and farm-record context only; crop-specific routes, lifetimes, quantitative ranges and LCA allocation are PCR choices requiring separate applicable evidence."
  - id: "fao-fertilizer-identities"
    type: "official_guidance"
    reference: "FAO Fertilizer Specifications, https://www.fao.org/agriculture/crops/thematic-sitemap/theme/spi/plantnutrition/fertspecs/en/"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
  - id: "fao-organic-nutrients"
    type: "official_guidance"
    reference: "FAO How to Make and Use Compost, https://www.fao.org/4/i2230e/i2230e.pdf"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
