system_boundary:
  rules:
    - rule_id: boundary_crop_cycle
      applies_to: "establishment and crop management"
      rule: "Include inputs and direct cultivation exchanges from the declared starting condition through the represented harvest campaign, and allocate them to marketable output from the same declared cycle."
      source_ids:
        - fao-papaya-production-guidance
    - rule_id: boundary_declared_gate
      applies_to: "harvest and gate handling"
      rule: "End at the declared farm or first packing-site gate; include sorting, trimming, washing, cooling, and primary packaging only when they occur before that hand-off."
      source_ids:
        - codex-cxc-53-2003
    - rule_id: boundary_soil_emissions
      applies_to: "managed soil and residues"
      rule: "Apply one declared method to nitrogen emissions and avoid double counting fertilizer, amendment, and returned-residue nitrogen."
      source_ids:
        - ipcc-2019-managed-soils
    - rule_id: boundary_residue_fate
      applies_to: "field residue and rejects"
      rule: "Record field residue and postharvest rejects by destination; an unspecified reject or residue is not a co-product."
      source_ids:
        - fao-papaya-production-guidance
boundary_abstraction:
  declared_starting_condition: "Prepared production plot or protected growing unit receiving papaya seed or seedling material, with prior land use and pre-establishment work disclosed"
