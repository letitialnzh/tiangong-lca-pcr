allocation_rules:
  - rule_id: allocation_avoid_by_subdivision
    applies_to: "all nodes"
    rule: "Separate field, curing, grading, and batch records; attribute shared meters/equipment by operating time, throughput, or occupied capacity before allocation."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_leaf_grades
    applies_to: "useful grades"
    rule: "Preserve grades and direct burdens; if subdivision is infeasible, use contemporaneous hand-off economic allocation and disclose mass sensitivity."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_reject
    applies_to: "residues, rework, rejects"
    rule: "Do not allocate to internal rework or waste; prevent reworked leaf from becoming a second output."
    source_ids: []
  - rule_id: allocation_shared_infrastructure
    applies_to: "shared barns/assets"
    rule: "Attribute each shared asset once across batches/periods with documented use; prevent cross-node double counting."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_field_records
      process_id: "tobacco_field_production"
      flow_role: "planting, nutrients, water, energy, protection"
      record_type: "log, invoice, meter, contractor record"
      raw_fields: "field; area; variety; product; formulation; amount; assay; date; operation"
      collection_method: "reconcile inputs to field/cycle"
      unit: "item; kg; L; m3; MJ; ha"
      frequency: "each event"
      temporal_coverage: "full cycle"
      site_scope: "all fields"
      aggregation_rule: "sum by identity/field; normalize with matched yield"
      quality_evidence: "invoices; labels; calibrated meters; logs"
    - protocol_id: cp_harvest_records
      process_id: "tobacco_field_production"
      flow_role: "green leaf, residue, reject"
      record_type: "harvest ticket, scale, moisture, destination"
      raw_fields: "field; date; mass; moisture; grade; residue; fate"
      collection_method: "weigh/reconcile each picking"
      unit: "kg; percent; ha"
      frequency: "each picking"
      temporal_coverage: "full cycle"
      site_scope: "all fields"
      aggregation_rule: "separate accepted leaf and every residue fate"
      quality_evidence: "calibration; lot trace; moisture test"
    - protocol_id: cp_field_emissions
      process_id: "tobacco_field_production"
      flow_role: "emissions"
      record_type: "nutrient, soil, weather, residue, model"
      raw_fields: "N; residue N; soil; climate; application; drainage; factors; model"
      collection_method: "declared applicable calculation method"
      unit: "kg N; kg emission; ha"
      frequency: "each event/cycle"
      temporal_coverage: "full cycle"
      site_scope: "all fields"
      aggregation_rule: "calculate per field, area-weight, normalize"
      quality_evidence: "activity and factor provenance; model file"
    - protocol_id: cp_curing_records
      process_id: "tobacco_leaf_curing"
      flow_role: "leaf, energy, rejects, emissions"
      record_type: "batch, scale, moisture, meter, barn log"
      raw_fields: "batch; method; barn; input mass/moisture; carrier; energy; time; outputs"
      collection_method: "match each run to inputs/outputs/meters"
      unit: "kg; percent; kWh; MJ; h"
      frequency: "each batch/period"
      temporal_coverage: "full curing period"
      site_scope: "all barns and curing sites"
      aggregation_rule: "reconcile mass; allocate shared services by measured driver"
      quality_evidence: "calibrated scale/meter; invoice; barn log"
    - protocol_id: cp_grading_records
      process_id: "cured_leaf_grading_packing"
      flow_role: "grades, packaging, rework, rejects"
      record_type: "batch, scale, grade, issue, destination"
      raw_fields: "batch; input; moisture; accepted; downgrade; rework; reject; packaging"
      collection_method: "reconcile grades/destinations"
      unit: "kg; item; percent"
      frequency: "each batch"
      temporal_coverage: "full grading period"
      site_scope: "all grading and packing sites"
      aggregation_rule: "count rework once and close mass balance"
      quality_evidence: "calibration; grade sheet; package record"
  calculation_rules:
    - id: calc_field_to_green_leaf
      applies_to: "field flows"
      rule: "crop-cycle amount / matched green-leaf mass"
      inputs:
        - amount
        - area
        - "green leaf"
      output: "amount/kg green leaf"
      source_ids: []
    - id: calc_green_to_cured_leaf
      applies_to: "cured route"
      rule: "green-leaf-normalized amount × green-leaf input / cured output"
      inputs:
        - masses
        - moisture
        - rejects
      output: "amount/kg cured leaf"
      source_ids:
        - mass-balance-identity
    - id: calc_nutrient_content
      applies_to: "nutrient supply"
      rule: "product amount × declared nutrient fraction"
      inputs:
        - identity
        - amount
        - assay
      output: "nutrient by product"
      source_ids: []
    - id: calc_managed_soil_emissions
      applies_to: "field emissions"
      rule: "applicable IPCC/regional method using inputs, residues, volatilization, and leaching"
      inputs:
        - activity
        - soil
        - climate
        - factors
      output: "emissions by pathway"
      source_ids:
        - ipcc-2019-managed-soils
    - id: calc_curing_combustion
      applies_to: "curing"
      rule: "fuel quantity × carrier-specific factor; purchased electricity is not on-site combustion"
      inputs:
        - carrier
        - amount
        - factor
      output: "pollutant/batch"
      source_ids:
        - ipcc-2006-stationary-combustion
    - id: calc_curing_mass_balance
      applies_to: "curing"
      rule: "green wet mass = cured leaf + rejects + water/other loss within uncertainty"
      inputs:
        - masses
        - moisture
      output: "reconciled outputs"
      source_ids:
        - mass-balance-identity
    - id: calc_grading_mass_balance
      applies_to: "grading"
      rule: "input = accepted + downgraded + rejects + loss; count rework once"
      inputs:
        - "batch masses"
        - routes
      output: "reconciled grades"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "reference"
      requirement: "Distinguish green/cured and air/fire/flue/sun route; retain variety, grade, moisture, crop year, gate."
      evidence: "crop, curing, grade, sales records"
    - id: dq_temporal_alignment
      applies_to: "all rows"
      requirement: "Match field, harvest, curing, grading, energy, and outputs to the same crop/batches; disclose proxies."
      evidence: "dated records"
    - id: dq_mass_moisture
      applies_to: "transformations"
      requirement: "Use calibrated masses and paired moisture at green, cured, and packed states."
      evidence: "calibration; moisture records"
    - id: dq_route_completeness
      applies_to: "curing"
      requirement: "Record energy carrier and combustion location; zero energy requires passive-route evidence."
      evidence: "barn log; invoice; meter"
    - id: dq_identity_resolution
      applies_to: "parameterized/unresolved"
      requirement: "Resolve every emitted exchange to one verified UUID before process publication."
      evidence: "identity review record"
validation_rules:
  - rule_id: validation_terminal_route
    applies_to: "reference"
    rule: "Select exactly one terminal route: 1,000 kg green or 1,000 kg cured graded leaf; forbid fresh UUID for cured leaf."
    source_ids: []
  - rule_id: validation_curing_method
    applies_to: "cured route"
    rule: "Declare one primary curing method per batch and include its energy, barn service, emissions, rejects, and hand-off."
    source_ids:
      - who-tobacco-environment-2017
  - rule_id: validation_mass_balance
    applies_to: "harvest/curing/grading"
    rule: "Reconcile mass, moisture, grades, rework, rejects, and losses within documented uncertainty."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_nutrient_emissions
    applies_to: "field"
    rule: "Reconcile nutrient/residue N with N2O, NH3, and nitrate methods without duplicate pathways."
    source_ids:
      - ipcc-2019-managed-soils
      - emep-eea-2023-guidebook
  - rule_id: validation_rework
    applies_to: "curing/grading"
    rule: "Link rework to origin and count once; rejected material cannot be accepted reference product."
    source_ids: []
  - rule_id: validation_shared_assets
    applies_to: "barns/meters/equipment"
    rule: "Apply one attribution driver per period and prevent double counting."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_flow_identity
    applies_to: "every flow"
    rule: "Use detail-confirmed exact UUIDs as fixed, current Flow Sets as parameterized, and otherwise unresolved identities."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground unmanufactured tobacco leaf production dataset"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "LCA of green or cured unmanufactured tobacco preserving geography, crop year, state, curing technology, grade, moisture, gate, and allocation"
  excluded_use: "manufactured tobacco/nicotine products or a different curing route, grade, geography, or gate without reviewed proxy decision"
  required_metadata: "variety/market class; geography; crop year; area; yield; terminal state/gate; curing method; barn/energy; moisture; grade; packaging; residue/reject fate; allocation; identity resolution"
  required_quality_disclosure: "foreground coverage; proxy periods; missing records; range exceedances; emission methods; meter/fuel reconciliation; mass/moisture balance; unresolved identities"
  update_trigger: "reviewed route evidence, technology or emission-method change, Flow Set/UUID change, or representative data outside QA ranges"
