        - who-tobacco-environment-2017
    - rule_id: boundary_curing_route
      applies_to: "cured route"
      rule: "Include exactly the declared air, fire, flue, or sun curing route, barn/structure service, energy, drying loss, combustion emissions, handling, and conditioning."
      source_ids:
        - who-tobacco-environment-2017
    - rule_id: boundary_grading_packing
      applies_to: "cured route"
      rule: "Include pre-gate grading and packing; distinguish accepted grades, downgraded useful leaf, rework, rejects, and waste."
      source_ids:
        - who-tobacco-environment-2017
    - rule_id: boundary_manufacturing_exclusion
      applies_to: "all routes"
      rule: "Stop before product manufacture, extraction, cutting, blending, reconstitution, distribution, retail, and use."
      source_ids: []
    - rule_id: boundary_direct_emissions
      applies_to: "soil and curing combustion"
      rule: "Include managed-soil and foreground combustion emissions from the same activity records used for nutrients and fuels."
      source_ids:
        - ipcc-2019-managed-soils
        - emep-eea-2023-guidebook
        - ipcc-2006-stationary-combustion
