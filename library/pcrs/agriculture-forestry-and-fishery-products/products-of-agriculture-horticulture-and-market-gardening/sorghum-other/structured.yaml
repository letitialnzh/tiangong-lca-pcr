system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary includes source planting material, field preparation and sowing, fertilization and soil amendments, irrigation where applicable, crop protection, field machinery and energy, managed-soil emissions, harvest, threshing or collection when part of the declared route, and field-to-gate handling. Optional primary conditioning is included only when the declared gate is after that operation. Upstream production of seed, fertilizers, crop-protection products, water supply, fuels, electricity, machinery services, packaging when applicable, and treatment services uses representative background datasets. Food, feed, beverage, industrial conversion, and downstream distribution are outside the default boundary."
      source_ids: []
    - rule_id: boundary_field_to_gate
      applies_to: "foreground system"
      rule: "Include field production, harvest, collection, and gate-delivery handling required to provide the declared non-seed sorghum grain; treat purchased inputs as upstream datasets unless explicitly inside the foreground package."
      source_ids:
        - fao-sorghum-postharvest-operations
        - ipcc-2019-cropland
    - rule_id: boundary_gate_definition
      applies_to: "reference product"
      rule: "Use farm gate by default. A primary-conditioning gate is allowed only when threshing, drying, cleaning, grading, and their losses are explicitly recorded and no later food, feed, beverage, starch, ethanol, milling, or other manufacturing is included."
      source_ids:
        - fao-grain-postharvest-systems
        - mass-balance-identity
    - rule_id: boundary_primary_conditioning
      applies_to: "optional conditioning"
      rule: "Treat first conditioning as a separate conditional node with its own energy, water where applicable, rejects, moisture change, and hand-off; do not infer a conditioning route from the CPC title."
      source_ids:
        - fao-sorghum-postharvest-operations
    - rule_id: boundary_input_completeness
      applies_to: "crop production"
      rule: "Provide a value, justified zero, or documented exclusion for planting material, nutrient inputs, crop protection, irrigation, field energy, land, managed-soil emissions, and residue fate."
      source_ids:
        - ipcc-2019-cropland
        - ipcc-2019-managed-soils-n2o
    - rule_id: boundary_output_separation
      applies_to: "all outputs"
      rule: "Separate accepted grain, non-marketable grain, intentionally recovered residue, field residues, conditioning rejects, removed moisture, dust, and unexplained loss by measured mass and fate."
      source_ids:
        - mass-balance-identity
        - fao-sorghum-postharvest-operations
