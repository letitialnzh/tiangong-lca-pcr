allocation_rules:
  - rule_id: allocation_avoidance
    applies_to: "field and conditioning processes"
    rule: "First avoid allocation by subdividing operations or collecting separate records for grain, intentionally recovered residue, rejects, and fate-specific treatment."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_grain_and_recovered_residue
    applies_to: "grain and intentional residue co-products"
    rule: "When subdivision is not possible, use a declared allocation method supported by representative product properties or values, document the choice, and provide a sensitivity to a materially different defensible method."
    source_ids:
      - iso-14044-2006
  - rule_id: allocation_residue_fate
    applies_to: "field residue and rejects"
    rule: "Keep residue collection, incorporation, grazing, burning, disposal, and transfer distinct. Do not credit a displaced product unless the destination, function, market, and substitution evidence are declared."
    source_ids:
      - ipcc-2019-cropland
      - iso-14044-2006
  - rule_id: allocation_moisture_conditioning
    applies_to: "primary conditioning"
    rule: "Allocate conditioning burdens using measured mass and moisture transformation of each output; do not allocate removed moisture as accepted grain."
    source_ids:
      - fao-sorghum-postharvest-operations
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_source_seed_lot_records
      process_id: "field_sorghum_production"
      flow_role: "source planting-seed lot"
      record_type: "seed and input record"
      raw_fields: "variety or hybrid; lot; treatment; supplier; mass; planting date; field; source status"
      collection_method: "invoice, seed tag, field log"
      unit: "kg, date, field"
      frequency: "per planting event"
      temporal_coverage: "complete crop season"
      site_scope: "field or production unit"
      aggregation_rule: "sum by field and normalize to accepted grain"
      quality_evidence: "lot label, invoice, field log"
    - protocol_id: cp_nutrient_input_records
      process_id: "field_sorghum_production"
      flow_role: "fertilizer and soil amendments"
      record_type: "purchase and application record"
      raw_fields: "product; formulation; nutrient content; mass; date; field; application method"
      collection_method: "invoice, label, application log"
      unit: "kg product, kg nutrient, date"
      frequency: "per application"
      temporal_coverage: "complete crop season"
      site_scope: "field and production unit"
      aggregation_rule: "sum by input and field; retain nutrient mass"
      quality_evidence: "invoice, label, application record"
    - protocol_id: cp_irrigation_records
      process_id: "field_sorghum_production"
      flow_role: "irrigation and withdrawal"
      record_type: "meter or source record"
      raw_fields: "source; meter; readings; volume; date; field; pumping energy"
      collection_method: "calibrated meter, pump log, supplier record"
      unit: "m3, kg, kWh"
      frequency: "event or month"
      temporal_coverage: "irrigation portion of crop season"
      site_scope: "field and source"
      aggregation_rule: "sum by source and normalize to accepted grain"
      quality_evidence: "calibration, readings, source record"
    - protocol_id: cp_crop_protection_records
      process_id: "field_sorghum_production"
      flow_role: "crop protection"
      record_type: "application record"
      raw_fields: "product; active substance; dose; area; date; field; target"
      collection_method: "label and application log"
      unit: "kg product, kg active substance, ha"
      frequency: "per application"
      temporal_coverage: "complete crop season"
      site_scope: "field"
      aggregation_rule: "sum by product and active substance"
      quality_evidence: "label, applicator log"
    - protocol_id: cp_field_energy_records
      process_id: "field_sorghum_production"
      flow_role: "field energy and machinery"
      record_type: "fuel, electricity, or service record"
      raw_fields: "operation; carrier; quantity; machine or supplier; date; field"
      collection_method: "fuel log, meter, invoice, contractor record"
      unit: "L, kg, MJ, kWh, service unit"
      frequency: "operation or billing interval"
      temporal_coverage: "complete crop season"
      site_scope: "field or production unit"
      aggregation_rule: "attribute to field operations without double counting"
      quality_evidence: "meter, invoice, log"
    - protocol_id: cp_land_and_output_records
      process_id: "field_sorghum_production"
      flow_role: "land, harvest, grain, residue, and loss"
      record_type: "field and harvest record"
      raw_fields: "area; dates; harvested grain; accepted grain; moisture; quality; residues; rejects; losses; fate"
      collection_method: "calibrated scale, field map, dispatch and fate records"
      unit: "ha, kg, moisture fraction, date"
      frequency: "harvest and reconciliation"
      temporal_coverage: "complete crop season"
      site_scope: "field and gate"
      aggregation_rule: "reconcile all outputs before normalization"
      quality_evidence: "scale calibration, field map, tickets, fate records"
    - protocol_id: cp_harvest_collection_records
      process_id: "sorghum_harvest_and_collection"
      flow_role: "harvested and delivered grain"
      record_type: "harvest, receiving, and dispatch record"
      raw_fields: "lot; source field; received mass; moisture; quality; foreign material; dispatch mass; date; destination"
      collection_method: "calibrated scale, receiving ticket, dispatch record"
      unit: "kg, moisture fraction, date"
      frequency: "lot or delivery"
      temporal_coverage: "declared harvest and collection coverage"
      site_scope: "field, collection point, and gate"
      aggregation_rule: "reconcile received and delivered lots"
      quality_evidence: "scale calibration, tickets, quality record"
    - protocol_id: cp_conditioning_input_records
      process_id: "primary_sorghum_conditioning"
      flow_role: "conditioning energy and water"
      record_type: "batch and utility record"
      raw_fields: "batch; received mass; moisture; operation; carrier; quantity; water; date"
      collection_method: "batch sheet, meter, invoice"
      unit: "kg, moisture fraction, L, m3, MJ, kWh"
      frequency: "batch or utility interval"
      temporal_coverage: "declared conditioning coverage"
      site_scope: "conditioning facility"
      aggregation_rule: "sum by batch and normalize to accepted grain"
      quality_evidence: "batch sheet, meter, invoice"
    - protocol_id: cp_conditioning_output_records
      process_id: "primary_sorghum_conditioning"
      flow_role: "accepted grain and rejects"
      record_type: "batch output and quality record"
      raw_fields: "input mass; output mass; moisture; quality; foreign material; screening; removed moisture; dust; fate; gate"
      collection_method: "calibrated scale, moisture test, quality record"
      unit: "kg, moisture fraction, date"
      frequency: "batch"
      temporal_coverage: "declared conditioning coverage"
      site_scope: "conditioning facility and gate"
      aggregation_rule: "reconcile input, accepted output, rejects, moisture, and dust"
      quality_evidence: "calibration, moisture test, dispatch and fate records"
  calculation_rules:
    - id: normalize_to_accepted_grain
      applies_to: "all foreground rows"
      rule: "divide the measured or calculated row amount by net accepted grain at the same declared gate and basis"
      inputs:
        - "output and input records"
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: convert_moisture_basis
      applies_to: "grain and conditioning rows"
      rule: "convert only from measured as-received mass and declared moisture using an explicit mass-and-water equation; retain both original and converted values"
      inputs:
        - cp_land_and_output_records
        - cp_conditioning_output_records
      output: "declared moisture-basis mass"
      source_ids:
        - mass-balance-identity
        - fao-sorghum-postharvest-operations
    - id: calculate_managed_soil_emissions
      applies_to: "nitrogen emissions"
      rule: "apply the selected IPCC method tier to collected nutrient inputs and declared soil, climate, and management context; disclose factors and species conversions"
      inputs:
        - cp_nutrient_input_records
        - "declared method factors"
      output: "species-specific emissions"
      source_ids:
        - ipcc-2019-managed-soils-n2o
    - id: calculate_land_occupation
      applies_to: "land occupation"
      rule: "cultivated area multiplied by the declared crop-season occupation basis and normalized to accepted grain"
      inputs:
        - cp_land_and_output_records
      output: "area-time per reference product"
      source_ids:
        - ipcc-2019-cropland
        - mass-balance-identity
    - id: reconcile_field_outputs
      applies_to: "field production"
      rule: "accepted grain plus recovered residue, rejects, field residue, and unexplained loss must reconcile to the harvested record within a declared tolerance"
      inputs:
        - cp_land_and_output_records
      output: "output mass balance and unexplained fraction"
      source_ids:
        - mass-balance-identity
    - id: reconcile_harvest_collection
      applies_to: "harvest and collection"
      rule: "received grain must reconcile to delivered grain, rejects, foreign material, and documented collection loss on a common mass basis"
      inputs:
        - cp_harvest_collection_records
      output: "collection mass balance"
      source_ids:
        - fao-sorghum-postharvest-operations
        - mass-balance-identity
    - id: reconcile_conditioning_outputs
      applies_to: "primary conditioning"
      rule: "received grain mass and water content must reconcile to accepted grain, rejects, removed moisture, dust, and documented loss"
      inputs:
        - cp_conditioning_input_records
        - cp_conditioning_output_records
      output: "conditioning mass-and-moisture balance"
      source_ids:
        - mass-balance-identity
        - fao-sorghum-postharvest-operations
    - id: apply_co_product_allocation
      applies_to: "grain and intentionally recovered residue"
      rule: "apply the declared subdivision, mass, economic, or other defensible method only after output identities and destinations are documented; run a sensitivity"
      inputs:
        - "output records"
        - "allocation decision"
      output: "allocated burdens by output"
      source_ids:
        - iso-14044-2006
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and field"
      requirement: "Declare variety or hybrid, end-use route, geography, crop season, production system, irrigation, gate, grain state, moisture basis, quality descriptors, foreign-material rule, and packaging or bulk state."
      evidence: "dataset metadata, field records, quality and gate records"
    - id: dq_temporal_coverage
      applies_to: "crop production"
      requirement: "Cover the complete declared crop season and harvest year; if an aggregated dataset is used, disclose the contributing seasons and weighting."
      evidence: "dated field, input, harvest, and dispatch records"
    - id: dq_input_completeness
      applies_to: "crop, harvest, and conditioning inputs"
      requirement: "Quantify or justify zero or exclusion for seed, nutrient inputs, crop protection, irrigation, field energy, harvest or collection, conditioning energy and water, land, and treatment."
      evidence: "ledgers, labels, meters, logs, invoices, process records"
    - id: dq_moisture_and_quality
      applies_to: "grain output"
      requirement: "Retain sampling method, moisture result, quality or grade descriptors, foreign material, rejected mass, and the conversion basis used for normalization."
      evidence: "calibrated scale, moisture test, quality record"
    - id: dq_mass_balance
      applies_to: "all outputs"
      requirement: "Reconcile field, harvest, collection, and conditioning outputs, including accepted grain, residues, rejects, removed moisture, dust, and unexplained loss; document tolerance and calibration."
      evidence: "scale records, batch sheets, calculation workbook"
    - id: dq_method_identity
      applies_to: "UUID-bearing rows and factors"
      requirement: "Verify each Tiangong flow, property, and unit-group identity and keep external factors separate from identity evidence."
      evidence: "reviewed identity record, source factor, method note"
    - id: dq_allocation_and_fate
      applies_to: "co-products and residues"
      requirement: "Record the output destination, burden treatment, allocation method, substitution evidence, and sensitivity whenever multiple intended outputs are reported."
      evidence: "dispatch, fate, allocation, and sensitivity records"
validation_rules:
  - rule_id: validation_reference_flow
    applies_to: "reference product"
    rule: "Confirm one 1 kg net accepted non-seed sorghum grain reference flow, all required qualifiers, and a reviewed Tiangong product, property, and unit-group identity before publication."
    source_ids:
      - mass-balance-identity
      - usda-sorghum-standards
  - rule_id: validation_scope
    applies_to: "boundary"
    rule: "Confirm sorghum seed, forage or silage routes, and downstream flour, meal, malt, beverage, ethanol, starch, feed, food, and distribution activities are excluded unless a separate declared dataset boundary is used."
    source_ids:
      - fao-sorghum-postharvest-operations
      - fao-grain-postharvest-systems
  - rule_id: validation_process_map
    applies_to: "process inventory"
    rule: "Confirm field production and harvest or collection are present and that primary conditioning is included only when its condition, hand-off, inputs, outputs, and gate are explicit."
    source_ids:
      - fao-sorghum-postharvest-operations
  - rule_id: validation_mass_balance
    applies_to: "outputs"
    rule: "Confirm harvested grain, accepted grain, residues, rejects, removed moisture, dust, and losses reconcile within the declared tolerance, with every non-reference output assigned a fate."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_moisture_and_quality
    applies_to: "grain and conditioning"
    rule: "Confirm as-received mass, moisture basis, quality or grade descriptors, foreign material, and any conversion equation are retained; do not apply an undocumented default moisture factor."
    source_ids:
      - fao-sorghum-postharvest-operations
      - usda-sorghum-standards
      - mass-balance-identity
  - rule_id: validation_nitrogen
    applies_to: "fertilizer and emissions"
    rule: "Confirm product mass, nutrient mass, selected IPCC tier, factor source, species, unit, and conversion are declared and not supplied by a module."
    source_ids:
      - ipcc-2019-managed-soils-n2o
  - rule_id: validation_water_and_energy
    applies_to: "water and energy"
    rule: "Confirm source, carrier, unit, operation, meter or record, and upstream versus foreground treatment are explicit and no supplied water or energy is counted twice."
    source_ids:
      - ipcc-2019-cropland
      - mass-balance-identity
  - rule_id: validation_allocation
    applies_to: "multiple outputs"
    rule: "Confirm intentional residue co-products are distinguished from waste, the allocation decision is explicit, and an alternative defensible method is tested when allocation is material."
    source_ids:
      - iso-14044-2006
  - rule_id: validation_identity_review
    applies_to: "all bound flow rows"
    rule: "Reject finalization when a flow binding is absent or does not match direction, flow type, property, unit group, geography, or gate; retain unsupported conceptual outputs as unmapped coverage."
    source_ids:
      - mass-balance-identity
  - rule_id: validation_data_quality
    applies_to: "data package"
    rule: "Confirm every required category has a collected value, calculated value with inputs, justified zero, or documented exclusion, and disclose open review items."
    source_ids:
      - fao-sorghum-postharvest-operations
      - ipcc-2019-cropland
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Non-seed sorghum grain matching the declared variety or hybrid, end-use route, geography, production system, irrigation, crop season, moisture basis, quality descriptors, and farm or primary-conditioning gate"
  excluded_use: "sorghum seed; forage or silage sorghum; flour, meal, malt, beverage, ethanol, starch, feed, food, retail, distribution, consumption, or unqualified storage datasets"
  required_metadata: "reviewed reference-flow identity; variety or hybrid; end-use route; geography; field and season; seed input status; production system; irrigation; gate; grain state; moisture and quality descriptors; accepted output; residue and reject fate; allocation; source and protocol coverage"
  required_quality_disclosure: "crop seasons; field and supplier coverage; primary-record coverage; mass-balance tolerance; scale and moisture calibration; nutrient and emission methods; water source; energy carriers; harvest and conditioning coverage; gate; exclusions; allocation and sensitivity; identity coverage and unmapped-flow disclosure"
  update_trigger: "material change in gate, grain state, moisture convention, quality rule, production route, irrigation, nutrient or crop-protection practice, conditioning technology, output fate, allocation method, or representativeness"
