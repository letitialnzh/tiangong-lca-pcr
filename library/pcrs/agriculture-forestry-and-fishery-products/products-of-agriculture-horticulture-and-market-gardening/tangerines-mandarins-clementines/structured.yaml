allocation_rules:
  - rule_id: allocation_orchard_establishment_over_productive_life
    applies_to: "orchard establishment, immature years, and renewal trees"
    rule: "Allocate establishment, non-bearing, and renewal inputs over the declared productive orchard life using orchard area and accepted fruit output. Report orchard life, establishment years, renewal events, and allocation basis."
    source_ids:
      - fao-gap-framework-2003
      - iso-14067
  - rule_id: allocation_accepted_and_named_destinations
    applies_to: "accepted fruit, downgraded fruit, and residues"
    rule: "Assign mass to accepted fruit or a named co-product only when the destination is evidenced and physically or economically distinguishable. Do not treat unmarketable losses as a co-product without a declared use."
    source_ids:
      - iso-14044
  - rule_id: allocation_internal_process_links
    applies_to: "orchard, harvest, and optional sorting links"
    rule: "Use internal process links for mass balance only; do not count the same orchard output or fruit mass as an additional market product."
    source_ids:
      - iso-14044
  - rule_id: allocation_mass_default_for_shared_fruit_output
    applies_to: "multiple fruit grades or destinations"
    rule: "Use mass allocation for shared production when no stronger causal partition is documented, and disclose grade definitions, as-received basis, and rejected-fruit treatment."
    source_ids:
      - iso-14044
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "If a study reports fresh citrus fruit and a documented co-product from the same orchard or sorting operation, the data package shall state the partitioning rule, common process inventory, and destination evidence. Economic allocation is not a default substitute for missing mass or causal data."
    source_ids: []
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_orchard_establishment_records
      process_id: "tangerine_orchard_establishment_and_management"
      flow_role: "planting material; renewal trees; land occupation"
      record_type: "orchard register, nursery invoice, planting map, pruning or removal log"
      raw_fields: "block_id; species_or_cultivar; tree_count; planting_year; renewal_count; area; previous_land_use; removed_biomass; destination"
      collection_method: "reconcile orchard register, maps, invoices, and field records; Raw aggregation and attribution: aggregate by block, establishment or renewal year, and allocation horizon"
      unit: "trees, ha, kg, orchard-year"
      frequency: "establishment and each renewal event; annual update"
      temporal_coverage: "full establishment period and declared productive life"
      site_scope: "each orchard block"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed farm register, planting map, supplier record, or auditable field log"
    - protocol_id: cp_orchard_management_records
      process_id: "tangerine_orchard_establishment_and_management"
      flow_role: "nutrients; irrigation; energy; crop protection; environmental exchanges"
      record_type: "input ledger, water meter, energy meter, spray record, contractor invoice"
      raw_fields: "block_id; product; formulation; nutrient_analysis; amount; date; area; water_volume; energy_carrier; fuel; treatment; soil_or_residue_event"
      collection_method: "collect primary records and reconcile invoices, meters, and application logs; Raw aggregation and attribution: sum by block and year, then allocate shared inputs by documented area or activity"
      unit: "kg product, kg nutrient, m3, kWh, L, ha"
      frequency: "each application or operation; annual aggregation"
      temporal_coverage: "one production year plus applicable establishment or renewal records"
      site_scope: "each orchard block and shared facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoices, meter readings, product labels, application logs, method calculation record"
    - protocol_id: cp_harvest_output_records
      process_id: "tangerine_harvest_and_farm_gate_handling"
      flow_role: "orchard output; harvest energy; accepted fruit; culls and losses"
      record_type: "harvest tickets, weighbridge record, bin log, contractor record, grading log"
      raw_fields: "block_id; harvest_date; species_or_cultivar; harvested_mass; accepted_mass; rejected_mass; destination; carrier_use; contractor_activity; maturity_or_grade"
      collection_method: "reconcile field, bin, scale, grading, and destination records; Raw aggregation and attribution: aggregate by block, lot, and destination; retain mass balance"
      unit: "kg, L, kWh, activity unit"
      frequency: "each harvest lot; annual closure"
      temporal_coverage: "one production year"
      site_scope: "each orchard block and harvest facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighbridge or scale record, lot traceability, grading report, contractor invoice"
    - protocol_id: cp_sorting_records
      process_id: "tangerine_optional_farm_gate_sorting"
      flow_role: "incoming fruit; water; electricity; accepted output; rejects"
      record_type: "batch sheet, meter record, grading log, waste log"
      raw_fields: "batch_id; incoming_mass; accepted_mass; reject_mass; water; electricity; cleaning_agent; packaging_aid; destination"
      collection_method: "reconcile batch, scale, meter, material, and waste records; Raw aggregation and attribution: reconcile incoming fruit, accepted output, named destinations, and waste by batch"
      unit: "kg, m3, kWh, kg material"
      frequency: "each sorting or conditioning batch"
      temporal_coverage: "declared production year"
      site_scope: "farm sorting site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "batch sheet, scale record, meter reading, waste receipt, destination record"
    - protocol_id: cp_declared_reference_handoff
      process_id: "declared_reference_handoff"
      flow_role: "reference_product_at_declared_handoff"
      record_type: "handoff weighing and acceptance records"
      raw_fields: "route, terminal_output_row_id, product_state, gate, lot, net_mass_kg, moisture_basis, acceptance, tare"
      collection_method: "Use calibrated scales or traceable weighing records; reconcile the actual terminal-operation handoff lot, accepted net mass, product state and moisture; exclude packaging tare and do not sum preceding-stage quantities."
      unit: "kg"
      frequency: "each handoff lot"
      temporal_coverage: "declared reporting period"
      site_scope: "declared handoff gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration or weighing tickets, acceptance and lot traceability"
  calculation_rules:
    - id: calc_orchard_activity_to_reference_mass
      applies_to: "orchard-year and harvest flows"
      rule: "normalized amount = orchard-year activity total / accepted farm-gate fruit mass × 1,000 kg"
      inputs:
        - "activity total"
        - "accepted fruit mass"
        - "reference amount"
      output: "amount per 1,000 kg accepted fruit"
      source_ids: []
    - id: calc_orchard_life_allocation
      applies_to: "establishment and renewal inputs"
      rule: "allocate establishment or renewal total to each declared production year using the documented productive-life horizon and accepted fruit output basis; retain non-bearing years when specified"
      inputs:
        - "establishment total"
        - "renewal events"
        - "orchard life"
        - "annual accepted output"
      output: "allocated orchard input per production year and reference flow"
      source_ids:
        - fao-gap-framework-2003
        - iso-14067
    - id: calc_nutrient_basis
      applies_to: "nutrient and amendment input"
      rule: "nutrient mass = product mass × declared nutrient fraction; report product mass and nutrient mass separately"
      inputs:
        - "product quantity"
        - "label or supplier nutrient analysis"
      output: "kg product and kg N, kg P2O5, kg K2O, or declared organic nutrient basis"
      source_ids:
        - fao-gap-framework-2003
    - id: calc_harvest_mass_balance
      applies_to: "harvest output, culls, and losses"
      rule: "harvested mass = accepted fruit + named co-products + culls or losses, with documented stock change and measurement basis"
      inputs:
        - "harvest tickets"
        - "accepted mass"
        - "co-product destinations"
        - "cull and loss mass"
        - "stock change"
      output: "reconciled harvest balance"
      source_ids: []
    - id: calc_sorting_mass_balance
      applies_to: "optional sorting output and waste"
      rule: "incoming fruit = accepted sorted fruit + named destinations + waste, after documenting moisture or handling adjustments"
      inputs:
        - "batch inputs"
        - "accepted output"
        - destinations
        - waste
        - "adjustment basis"
      output: "reconciled sorting balance"
      source_ids: []
    - id: calc_direct_citrus_field_exchanges
      applies_to: "soil, residue, and crop-protection exchanges"
      rule: "apply the selected geographically applicable method to collected nutrient, residue, irrigation, and crop-protection activity data; record tier, geography, and activity basis"
      inputs:
        - "nutrient inputs"
        - "residue fate"
        - "soil or climate context"
        - "method parameters"
      output: "substance-specific elementary flows by compartment"
      source_ids:
        - ipcc-2019-refinement-vol-4
        - emep-eea-2023-guidebook
  data_quality_requirements:
    - id: dq_citrus_orchard_identity
      applies_to: "all processes"
      requirement: "Identify orchard block, species or cultivar group, country and region, crop year, orchard age, productive status, and optional sorting boundary."
      evidence: "orchard register; farm map; dataset metadata"
    - id: dq_perennial_citrus_time_basis
      applies_to: "establishment and management"
      requirement: "State establishment year, non-bearing period, productive-life horizon, renewal events, and allocation basis used for orchard assets."
      evidence: "orchard history; allocation worksheet"
    - id: dq_input_traceability
      applies_to: "planting material, nutrients, irrigation, energy, and crop protection"
      requirement: "Trace each material or energy input to an invoice, meter, product label, contractor record, or justified field record; retain product and nutrient identities separately."
      evidence: "primary farm records; supplier records"
    - id: dq_fruit_mass_balance
      applies_to: "harvest and optional sorting"
      requirement: "Reconcile harvested, accepted, rejected, co-product, stock-change, and waste masses within a documented tolerance and explain grading, moisture, or handling adjustments."
      evidence: "weighbridge, lot, grading, batch, and destination records"
    - id: dq_temporal_coverage
      applies_to: "all processes"
      requirement: "Cover the full declared production year and include establishment or renewal records needed by orchard-life allocation."
      evidence: "annual production ledger; orchard history"
    - id: dq_environmental_method
      applies_to: "elementary flows"
      requirement: "Record method name, tier, geography, activity data, and assumptions for each calculated exchange; keep evidence gap flow identity separate from amount evidence."
      evidence: "calculation worksheet; method reference"
validation_rules:
  - rule_id: validation_reference_output
    applies_to: "reference flow and terminal process"
    rule: "Exactly one terminal accepted fruit output shall be linked to the declared reference flow. The product identity may remain evidence gap until verified, but the binding and hand-off condition shall be disclosed."
    source_ids: []
  - rule_id: validation_orchard_life_disclosure
    applies_to: "orchard establishment and management"
    rule: "Flag a dataset that includes perennial citrus production but omits orchard age, establishment period, productive-life horizon, renewal events, or allocation basis."
    source_ids:
      - fao-gap-framework-2003
      - iso-14067
  - rule_id: validation_irrigation_and_nutrients
    applies_to: "irrigation and nutrient inputs"
    rule: "Check that zero irrigation or zero nutrient input is supported by farm records or documented production rationale, and that product mass is not confused with nutrient mass."
    source_ids:
      - fao-gap-framework-2003
  - rule_id: validation_fruit_mass_balance
    applies_to: "harvest and optional sorting"
    rule: "Check mass balance for each harvest or sorting boundary and require explanation for evidence gap differences, reject destinations, stock changes, or moisture conversions."
    source_ids: []
  - rule_id: validation_boundary_exclusions
    applies_to: "downstream activities"
    rule: "Flag inclusion of off-farm transport, storage, processing into juice or concentrate, retail, consumer use, or packaging end-of-life unless the study declares a boundary extension."
    source_ids:
      - iso-14044
  - rule_id: validation_bilingual_alignment
    applies_to: "English and Chinese renderings"
    rule: "Require identical machine identifiers, controlled tokens, process ids, row ids, rule ids, protocol ids, requirement ids, and source ids in both language files."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset for a reviewed farm-gate tangerine, mandarin, or clementine production dataset; background_dataset only when compatible upstream inputs and elementary flows are explicitly published"
  downstream_use: "foreground data package construction, process projection, lifecycle model aggregation, and comparison of fresh citrus supply scenarios"
  allowed_use: "fresh, unprocessed tangerine, mandarin, or clementine fruit at a declared farm gate and optional sorting state, with orchard-life allocation and quality metadata preserved"
  excluded_use: "direct substitution for juice, concentrate, preserved, dried, or frozen products; direct use without regional, orchard-age, irrigation, cultivar, or market-state review; downstream logistics or consumer studies outside the declared boundary"
  required_metadata: "canonical PCR id; CPC reference; orchard block or aggregation scope; species or cultivar group; geography; crop year; orchard age; productive-life and allocation basis; irrigation; nutrient and crop-protection product basis; yield; accepted and rejected fruit; sorting status; flow binding status"
  required_quality_disclosure: "primary-record coverage, temporal coverage, mass-balance result, identity evidence gaps, concrete flow identity verification, environmental method and tier, assumptions, and regional representativeness"
  update_trigger: "change in orchard-life or allocation method, product identity taxonomy, concrete flow identity verification"
