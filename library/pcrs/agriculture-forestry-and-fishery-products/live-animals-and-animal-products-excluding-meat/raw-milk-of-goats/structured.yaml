system_boundary:
  rules:
    - rule_id: farm_gate
      applies_to: "all routes"
      rule: "End at producing farm transfer of accepted raw milk; independent collection/cooling and later processing are excluded."
      source_ids:
        - fao-small-ruminant-2016
    - rule_id: separate_capture
      applies_to: "milking"
      rule: "Milk removal is its own measured handoff from managed herd to raw collected milk; do not book milking services again in herd inventory."
      source_ids:
        - fao-small-ruminant-2016
    - rule_id: conditional_cooling
      applies_to: "cooling"
      rule: "Farm cooling applies only to milk actually cooled before gate; warm milk bypasses this node."
      source_ids:
        - fao-small-ruminant-2016
    - rule_id: route_delta
      applies_to: "herd"
      rule: "Grazing/housed/mixed modes change feed source, manure location and energy or housing records; animal-days remain one herd ledger."
      source_ids:
        - fao-small-ruminant-2016
    - rule_id: phase_boundary
      applies_to: "herd"
      rule: "Record lactation, dry/replacement and culling events by period; carry multi-period burdens to outputs once."
      source_ids:
        - fao-small-ruminant-2016
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
