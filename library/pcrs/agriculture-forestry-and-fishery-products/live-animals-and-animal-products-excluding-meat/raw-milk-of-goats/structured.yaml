allocation_rules:
  - rule_id: output_set
    applies_to: "herd and gate"
    rule: "Enumerate accepted milk, independently handed-over kids/culls and usable exported manure; residual manure, mortality and rejected milk are not automatically co-products. Record each handover once."
    source_ids:
      - fao-small-ruminant-2016
  - rule_id: allocation_order
    applies_to: "multi-output herd"
    rule: "Prefer physical subdivision of independently metered activities. For inseparable herd burdens, document and apply a consistent biophysical allocation supported by herd energy/feed and milk/live-growth data; if not feasible, disclose and justify another reviewed allocation basis. Do not silently use zero burden for kids or exported manure."
    source_ids:
      - fao-small-ruminant-2016
  - rule_id: period_attribution
    applies_to: "herd lifecycle"
    rule: "Index lactation, dry/replacement and culling phases; assign multi-period feed, replacement and capital burdens to actual service and output periods once, with no second allocation through live-goat upstream data."
    source_ids:
      - fao-small-ruminant-2016
  - rule_id: shared_assets
    applies_to: "milking and cooling"
    rule: "Inventory shared buildings, water/energy meters, tanks and equipment by consuming node and service period; assign service share using measured use or documented capacity-time, never duplicate full asset burden."
    source_ids:
      - fao-small-ruminant-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd
      process_id: "herd"
      flow_role: "feed, water, replacement and animal outputs"
      record_type: "herd and purchase ledger"
      raw_fields: "goat class; head; animal-days; lactation phase; feed dry matter; grazing estimate; water; purchase and transfer live mass"
      collection_method: "farm logs, scale, invoices and meter; Raw aggregation requirements: Sum by goat class and phase; attribute once to milk and other outputs. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, head, days"
      frequency: "daily and event"
      temporal_coverage: "full milk reporting period and replacement phase"
      site_scope: "producing herd"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed ledger, scale and invoices; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
      process_id: "herd"
      flow_role: "exported and residual manure"
      record_type: "manure pathway ledger"
      raw_fields: "housing/pasture shares; collection; storage; export mass; moisture; recipient"
      collection_method: "weighbridge, farm log and pathway inspection; Raw aggregation requirements: Reconcile total manure by mutually exclusive destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, days"
      frequency: "daily and event"
      temporal_coverage: "full reporting period"
      site_scope: "herd pasture and housing"
      aggregation_rule: "per reference flow"
      quality_evidence: "transfer receipts and pathway record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_emissions
      process_id: "herd"
      flow_role: "air emissions"
      record_type: "method worksheet"
      raw_fields: "animal-days; feed energy; nitrogen; manure pathway; factor; climate"
      collection_method: "calculate from cp_herd and cp_manure under declared IPCC method; Raw aggregation requirements: Sum distinct enteric and manure terms once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "reporting period"
      temporal_coverage: "same herd period"
      site_scope: "emitting farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "factor citation and calculation worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_milking
      process_id: "milking"
      flow_role: "gross milk and energy"
      record_type: "batch meter log"
      raw_fields: "goat herd; milk kg; milking time; meter; rejected later"
      collection_method: "calibrated milk scale and energy meter; Raw aggregation requirements: Sum gross lot mass and assigned milking energy. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, kWh"
      frequency: "each milking"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, shift log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_conditioning
      process_id: "conditioning"
      flow_role: "accepted warm milk, rejects and water"
      record_type: "lot quality and cleaning log"
      raw_fields: "gross kg; straining loss; rejected kg; temperature; fat/protein or solids; water"
      collection_method: "scale, sample and water meter; Raw aggregation requirements: Gross = accepted warm + reject/loss; transfer warm to gate or cooling once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, concentration"
      frequency: "each lot"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "test sheet and reject disposition; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_cooling
      process_id: "cooling"
      flow_role: "chilled milk and energy"
      record_type: "farm cooling log"
      raw_fields: "incoming warm kg; outgoing chilled kg; temperature; energy; time; losses"
      collection_method: "calibrated tank and energy meter; Raw aggregation requirements: Incoming warm = chilled accepted + cooling loss; never duplicate warm sale. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, kWh, temperature"
      frequency: "each chilled lot"
      temporal_coverage: "only farm-controlled cooling periods"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "tank log and transfer receipt; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
  calculation_rules:
    - id: milk_balance
      applies_to: "milk lots"
      rule: "Gross captured milk = accepted warm milk + first-conditioning rejects; accepted warm milk = warm gate transfer + cooling input; cooling input = chilled gate transfer + cooling loss."
      inputs:
        - cp_milking
        - cp_conditioning
        - cp_cooling
      output: "accepted reference kg and losses"
      source_ids:
        - fao-small-ruminant-2016
    - id: herd_intensity
      applies_to: "herd inputs"
      rule: "Period assigned quantity / accepted milk kg after documented output and period attribution."
      inputs:
        - cp_herd
        - cp_manure
        - cp_conditioning
      output: "reference-normalized herd inventory"
      source_ids:
        - fao-small-ruminant-2016
    - id: enteric_and_manure
      applies_to: "air emissions"
      rule: "Calculate distinct goat enteric methane and manure CH4/N2O under declared IPCC pathway and factor set; ammonia only with documented volatilization method."
      inputs:
        - cp_emissions
      output: "kg of each substance to air"
      source_ids:
        - ipcc-livestock-2019
  data_quality_requirements:
    - id: species_route
      applies_to: "herd"
      requirement: "Prove goat species, actual grazing/housed shares and goat-class animal-days; do not import cow or sheep coefficients without justified adaptation."
      evidence: "herd register, grazing and housing records"
    - id: mass_balance
      applies_to: "milk"
      requirement: "Link accepted, rejected and cooling transfers by lot; retain temperature and quality sample basis."
      evidence: "signed batch balance and laboratory sheet"
    - id: phase_match
      applies_to: "allocation"
      requirement: "Align animal, feed, manure, replacement and asset records with actual lactation and reporting period."
      evidence: "dated herd and asset ledger"
    - id: identity_gap
      applies_to: "UUIDs"
      requirement: "Resolve broad reference and every unbound output/management identity before active/publication use."
      evidence: "flow detail and support-row confirmation"
validation_rules:
  - rule_id: gate_check
    applies_to: "reference"
    rule: "Confirm goat raw milk is warm or cooled by the producing farm; reject independent-centre or processed milk as this reference."
    source_ids:
      - fao-small-ruminant-2016
  - rule_id: route_check
    applies_to: "herd"
    rule: "Verify grazing, housed or mixed route against feed origin, manure location and animal-days; no route label without changed records."
    source_ids:
      - fao-small-ruminant-2016
  - rule_id: balance_check
    applies_to: "milk"
    rule: "Require lot balance and distinct warm/chilled gate destinations; zero double booking across conditioning and cooling."
    source_ids:
      - fao-small-ruminant-2016
  - rule_id: output_check
    applies_to: "co-products"
    rule: "Require documented live-goat and manure handovers, method precedence and shared-period attribution; no burden counted twice."
    source_ids:
      - fao-small-ruminant-2016
  - rule_id: identity_check
    applies_to: "flow cards"
    rule: "Check exact substance, medium, property, state and gate for fixed UUIDs; expand unresolved inputs from actual records, and leave unverified identities unresolved."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground farm-gate goat milk data package; process and lifecyclemodel projections follow it."
  downstream_use: "Reviewed secondary or background dataset only after all identity and evidence gates close."
  allowed_use: "Unprocessed goat milk supply at a declared producing farm gate and temperature state."
  excluded_use: "Other species, pasteurized or standardized dairy, independent collection/cooling and post-gate transport."
  required_metadata: "Farm and herd; period; goat class; grazing/housed route; accepted and rejected milk; warm/chilled lot gate; composition; temperature; co-product destinations; allocation."
  required_quality_disclosure: "Measured versus calculated inputs, IPCC factors, missing meters, provisional ranges, unresolved UUIDs and shared-asset attribution."
  update_trigger: "Material route, milk state, herd management, factor, output mix, gate, identity or quality evidence changes."
