allocation_rules:
  - rule_id: a_source
    applies_to: "actual upstream output set"
    rule: "Enumerate only real separate meat, fish-body, breeding, eggs, fibre or other saleable products for the declared species and phase. Prefer defensible causal physical allocation; otherwise document economic allocation with period prices and sensitivity. Never give skin automatic zero or all animal burden."
    source_ids:
      - fao-hides-skins
  - rule_id: a_recovery
    applies_to: "lawful recovery"
    rule: "Document pre-existing source burden, legal recovery and actual terminal-treatment alternative; justify burden and separately report any avoided-treatment credit without fictional meat."
    source_ids:
      - fao-hides-skins
  - rule_id: a_grade
    applies_to: "sale grades and cure"
    rule: "Attribute each accepted or downgraded marketable grade at one real handover, with rejects and retained salt/moisture distinct; cure mass does not create extra skin."
    source_ids:
      - fao-hides-skins
  - rule_id: a_period
    applies_to: "source phases and shared assets"
    rule: "Index relevant husbandry/aquaculture/capture, slaughter/recovery, cold-room and cure periods. Divide actual flaying, washing, chilling and cure service among consuming nodes and periods by measured use or supported causal driver exactly once."
    source_ids:
      - fao-hides-skins
dataset_production:
  collection_protocols:
    - protocol_id: cp_remove
      process_id: "remove"
      flow_role: "source body and removed skin"
      record_type: "source/removal ledger"
      raw_fields: "species, part, lawful source, Product/Waste status, event, body/skin mass, real co-products, period"
      collection_method: "source ticket and calibrated scale; Raw aggregation requirements: source and removal once per skin lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;period"
      frequency: "each event"
      temporal_coverage: "source and removal periods"
      site_scope: "supplier and removal site"
      aggregation_rule: "per reference flow"
      quality_evidence: "authorization, ticket, calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_condition
      process_id: "condition"
      flow_role: "raw in, water, cleaned skin"
      record_type: "preparation ledger"
      raw_fields: "source lot, water subtype, mass, cleaning action, trim"
      collection_method: "meter and scale; Raw aggregation requirements: input/output by lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "preparation period"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter, scale and work ticket; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grade
      process_id: "grade"
      flow_role: "accepted, downgrade and reject"
      record_type: "grade ledger"
      raw_fields: "species, part, grade, mass, reason, destination"
      collection_method: "grade ticket and scale; Raw aggregation requirements: disjoint grade sums. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "grade period"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "dispatch/reject tickets; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_preserve
      process_id: "preserve"
      flow_role: "optional cure inputs/outputs"
      record_type: "cure ledger"
      raw_fields: "lot, method, input/output mass, salt/brine, moisture, energy, residue, service time"
      collection_method: "scale, test and meter; Raw aggregation requirements: linked before/after and service sum. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;MJ;period"
      frequency: "each cured lot"
      temporal_coverage: "cure/service periods"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "recipe, test and meter; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "net skin, package and gate"
      record_type: "dispatch ledger"
      raw_fields: "species, part, use, source, state, grade, gross/tare, net, package reuse, gate"
      collection_method: "dispatch ticket and scale; Raw aggregation requirements: one net mass per physical lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each sale lot"
      temporal_coverage: "actual gate event"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "ticket and calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_residue
      process_id: "remove_condition_grade_preserve"
      flow_role: "reject and waste"
      record_type: "treatment ledger"
      raw_fields: "lot, material, mass, classification, destination, period"
      collection_method: "scale and transfer record; Raw aggregation requirements: once by route/material. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "relevant periods"
      site_scope: "origin site"
      aggregation_rule: "per reference flow"
      quality_evidence: "transfer record and scale; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: c_net
      applies_to: "handover lot"
      rule: "net raw skin = gross sale mass minus package tare and separable free brine/loose salt; disclose retained moisture/adhering salt"
      inputs:
        - cp_handover
        - cp_preserve
      output: "kg net sold skin"
      source_ids:
        - fao-hides-skins
    - id: c_balance
      applies_to: "removal to handover"
      rule: "skin input plus added cure medium = sale grades plus rejects/residue plus measured moisture/stock change and documented residual"
      inputs:
        - cp_remove
        - cp_condition
        - cp_grade
        - cp_preserve
        - cp_handover
      output: "kg residual"
      source_ids:
        - fao-hides-skins
    - id: c_period
      applies_to: "source and shared service"
      rule: "attribute each actual phase, flaying/cleaning/cold-room/curing service once to consuming lot and period"
      inputs:
        - cp_remove
        - cp_condition
        - cp_preserve
      output: "burden/kg"
      source_ids:
        - fao-hides-skins
    - id: c_norm
      applies_to: "final exchange"
      rule: "attributable quantity divided by positive net mass of same species, state and gate lot"
      inputs:
        - cp_handover
        - cp_remove
        - cp_condition
        - cp_preserve
      output: "unit/kg skin"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "every lot"
      requirement: "Confirm species, part, use, raw condition, CPC exclusion review, lawful source and actual gate."
      evidence: "source, grade and dispatch records"
    - id: q_mass
      applies_to: "every lot"
      requirement: "Calibrate net/tare; measure cure state, moisture/salt and mass residual without universal yield."
      evidence: "scale, test and balance worksheet"
    - id: q_route
      applies_to: "every lot"
      requirement: "Preserve real source/capture/slaughter/recovery route, actual products/periods and nonduplicated upstream removal."
      evidence: "route and allocation ledger"
    - id: q_uuid
      applies_to: "final dataset"
      requirement: "Resolve exact flow type, species, state, property/unit, gate and destination for each exchange before TIDAS construction."
      evidence: "verified flow evidence"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference lot"
    rule: "Reject species/use assigned to 02951–02955, tannage/further preparation, whole animals, and unsupported feather-on bird-skin 02959 claims."
    source_ids:
      - un-cpc-3-notes
      - un-cpc-39110
  - rule_id: v_route
    applies_to: "source/removal"
    rule: "Require lawful species-specific source and removal distinct from source production/capture and first preparation; no invented farm for wild animal or meat for recovered animal."
    source_ids:
      - fao-hides-skins
  - rule_id: v_balance
    applies_to: "each lot"
    rule: "Reconcile fresh, accepted, downgrade, reject, cure medium and net sold states to measured uncertainty; investigate unexplained residual."
    source_ids:
      - fao-hides-skins
  - rule_id: v_allocation
    applies_to: "phases and shared assets"
    rule: "Reject unsupported zero/whole-animal burden, duplicate product, repeated asset period or arbitrary universal co-product rule."
    source_ids:
      - fao-hides-skins
  - rule_id: v_identity
    applies_to: "concrete final exchange"
    rule: "A broad unresolved card is not a final UUID; verify species, part, raw state, property, actual gate and direction. Goat skin, furskin or whole fish cannot substitute."
    source_ids: []
published_dataset_profile:
  dataset_role: "Species-, route-, part-, grade-, state- and gate-qualified raw-other-animal-skin foreground dataset."
  downstream_use: "Candidate secondary_dataset or background_dataset only after concrete identities, review and publication."
  allowed_use: "Same species/use/state/gate comparison or measured lot-specific state conversion."
  excluded_use: "Cross-species substitution, goat/furskin/feather-on-bird automatic mapping, tanning/leather, universal yield/cure, unsupported zero burden."
  required_metadata: "Species, part, use, lawful source, route, grade, state, net mass, moisture/salt, gate, periods, real output set and allocation."
  required_quality_disclosure: "Co-product/period attribution, grade/cure mass balance, rejects, shared-service driver and unresolved UUIDs."
  update_trigger: "Exact platform flow confirmation, changed species/route/classification, new measured state or allocation evidence."
