    used_for: "feather-on bird-skin classification check"
  - id: "fao-hides-skins"
    type: "official_guidance"
    reference: "[FAO Hides and Skins](https://www.fao.org/4/i0523e/i0523e.pdf)"
    used_for: "first preparation, cure and route method"
