system_boundary:
  rules:
    - rule_id: b_source
      applies_to: "source routes"
      rule: "Match upstream production, capture, slaughter or lawful recovery to real species and handoff; no invented farm for wild capture, meat for fallen animals, or automatic zero-burden skin."
      source_ids:
        - un-cpc-3-notes
        - fao-hides-skins
    - rule_id: b_remove
      applies_to: "removal"
      rule: "Remove actual skin independently from source production/capture and first conditioning; separate incidental tissue and damage."
      source_ids:
        - fao-hides-skins
    - rule_id: b_prepare
      applies_to: "first conditioning and grade"
      rule: "Include actual first cleaning/fleshing and grading; exclude liming, tanning, dressing and leather manufacture."
      source_ids:
        - fao-hides-skins
        - un-cpc-3-notes
    - rule_id: b_preserve
      applies_to: "cured lots"
      rule: "Fresh sale bypasses cure; record actual chill/dry/salt/brine method, before/after masses, inputs, service and residues without generic recipe."
      source_ids:
        - fao-hides-skins
    - rule_id: b_gate
      applies_to: "handover"
      rule: "Include only necessary protection to the actual removal/recovery/curing handover; exclude post-gate freight and transformation."
      source_ids:
        - fao-hides-skins
