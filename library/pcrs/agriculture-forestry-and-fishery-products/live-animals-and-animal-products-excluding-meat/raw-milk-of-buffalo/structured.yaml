allocation_rules:
  - rule_id: a_outputs
    applies_to: "milk, live buffalo/calf transfer and usable manure"
    rule: "Separate output-specific operations first. For residual milk/live-animal herd burdens, use documented buffalo class-period energy requirements for milk production and live growth as biophysical allocation drivers; shares sum to one. Disclose price-based sensitivity separately. Treat exported usable manure with an explicit documented burden decision, never automatic avoided-product credit. No credit for retained replacements, rejects or untransferred manure, and no double counting with a live-buffalo PCR."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: a_period
    applies_to: "lactation, dry, replacement, birth and culling phases"
    rule: "Link inputs, herd assets, milk and animal events to animal class-periods. Opening and replacement burdens, retirement and transfers enter exactly once."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: a_shared
    applies_to: "housing, pump, parlour, tank and utility meter"
    rule: "Name every consuming node and service period; allocate one total using measured service hours, throughput or a defended causal driver, with fractions summing to one."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: a_residue
    applies_to: "rejected milk, residual manure"
    rule: "Reconcile physical mass and actual treatment; residues and waste receive no independent product credit."
    source_ids:
      - ipcc-livestock-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd
      process_id: "herd"
      flow_role: "feed, live transfers and enteric CH4"
      record_type: "herd/feed ledger"
      raw_fields: "class, head-days, feed and moisture, grazing estimate, births, replacements, culls, origins"
      collection_method: "farm records and scales; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "head-day, kg"
      frequency: "event and daily"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "herd roll-forward and weigh tickets; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
      process_id: "herd"
      flow_role: "manure outputs, CH4, N2O and NH3"
      record_type: "manure ledger"
      raw_fields: "excreted N, volatile solids, pathway fractions, mass, N quality, transfers"
      collection_method: "inventory, sampling and pathway model; Raw aggregation requirements: reconcile pathways without duplicate soil burden. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, kg N, kg VS"
      frequency: "event and monthly"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "storage and transfer records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_utilities
      process_id: "herd_milking_conditioning_cooling"
      flow_role: "water and energy"
      record_type: "meter/invoice"
      raw_fields: "source, carrier, quantity, asset, node, service time, period"
      collection_method: "meter and allocation log; Raw aggregation requirements: attribute shared meters exactly once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3, kWh, MJ, L, kg"
      frequency: "monthly and batch"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration and invoices; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_milk
      process_id: "milking_conditioning_cooling"
      flow_role: "milk outputs and rejects"
      record_type: "batch ledger"
      raw_fields: "lot and route id; gross/accepted/rejected/lost mass; warm-to-cooling transfer; opening/closing stocks; final state, temperature, composition and gate; state-specific burden attribution"
      collection_method: "Use calibrated tank records and samples. Reconcile each batch and its actual terminal warm or chilled handover, retaining stock changes and internal transfers. Aggregate accepted final mass only within the same declared state/gate/grade stratum. Direct warm plus chilled totals are for site mass reconciliation only, never a pooled reference denominator. Attribute herd and shared burdens to the selected output stratum under the allocation rules; assign cooling burdens only to the lots actually cooled. Normalize each stratum once by its own measured accepted final output under c_milk_state_normalization."
      unit: "kg, °C, %"
      frequency: "batch"
      temporal_coverage: "full reporting period, with state-specific strata"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "batch and state ledger; milk balance; acceptance tickets; traceable attribution and state-specific denominator worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "herd"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "herd"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: c_milk_balance
      applies_to: "milk stages"
      rule: "For matched batch/period records: gross captured + opening conditioning stock = conditioned warm + conditioning rejection/loss + closing conditioning stock; conditioned warm + opening warm stock = direct warm handover + warm into cooling + other documented warm losses + closing warm stock; warm into cooling + opening cooling stock = chilled accepted handover + cooling rejection/loss + closing cooling stock. Sum direct warm and chilled handovers only for whole-site mass reconciliation, not as a package reference denominator. Each actual terminal lot is counted once; an internal warm-to-cooling transfer is not a final handover."
      inputs:
        - "batch masses"
        - "stock and transfer ledger"
        - cp_milk
      output: "reconciled stage and state masses in kg"
      source_ids: []
    - id: c_milk_state_normalization
      applies_to: "final milk and its attributable inventory"
      rule: "Select the actual warm or chilled output stratum with one declared gate and grade. Its denominator is measured accepted final mass in that stratum only. Final contribution = attributable raw exchange for that stratum * declared reference quantity / its measured accepted final output. Retain rejected mass and losses in the production responsibility, not in accepted output. Attribute shared herd/conditioning burdens using the documented allocation rules; assign cooling burdens to cooled lots only. Apply normalization once. Never divide chilled-route burdens by a warm-plus-chilled total."
      inputs:
        - cp_milk
        - cp_reference_handover
        - "state-specific attribution and accepted mass"
      output: "exchange per kg accepted milk in the selected final state"
      source_ids: []
    - id: c_feed
      applies_to: "herd feed"
      rule: "dry matter = as-fed mass × sampled dry-matter fraction; document pasture estimation separately"
      inputs:
        - "feed and moisture"
      output: "kg dry matter"
      source_ids:
        - fao-large-ruminants-2016
    - id: c_enteric
      applies_to: "CH4"
      rule: "buffalo class-period activity × compatible tier factor; keep enteric and manure pathways apart"
      inputs:
        - head-days
        - intake
        - factor
      output: "kg CH4"
      source_ids:
        - ipcc-livestock-2019
    - id: c_manure_ch4
      applies_to: "manure CH4"
      rule: "volatile solids × management pathway share × compatible methane conversion and potential factors"
      inputs:
        - "VS and pathway ledger"
      output: "kg biogenic CH4"
      source_ids:
        - ipcc-livestock-2019
    - id: c_manure
      applies_to: "N2O and NH3"
      rule: "excreted N × pathway fraction × species-specific factor, with managed-soil interface reconciliation"
      inputs:
        - "N/pathway ledger"
      output: "kg N2O and NH3 separately"
      source_ids:
        - ipcc-livestock-2019
    - id: c_shared
      applies_to: "shared assets"
      rule: "measured total × documented service fraction for node-period; fractions sum to one"
      inputs:
        - "meter and service log"
      output: "attributed utility/burden"
      source_ids:
        - fao-large-ruminants-2016
    - id: calc_feed_supply_and_intake
      applies_to: "feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
    - id: calc_manure_n2o_coverage
      applies_to: "manure_n2o"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-livestock-2019
        - ipcc-managed-soils-2019
  data_quality_requirements:
    - id: q_identity
      applies_to: "final milk"
      requirement: "Verify buffalo species, raw state, farm gate, warm/chilled state and temperature."
      evidence: "batch and handover record"
    - id: q_period
      applies_to: "herd"
      requirement: "Cover lactation, dry and replacement classes, births and culls; reconcile opening/closing stock."
      evidence: "herd ledger"
    - id: q_balance
      applies_to: "milk and manure"
      requirement: "Reconcile milk stages and manure fractions to documented tolerance."
      evidence: "batch and pathway balance"
    - id: q_emission
      applies_to: "direct emissions"
      requirement: "Preserve substance, medium, buffalo class, manure pathway and factor tier."
      evidence: "factor/activity sheet"
validation_rules:
  - rule_id: v_cpc_milk_scope
    applies_to: "final reference product and classification"
    rule: "Check the lot-matched measured milk-fat fraction is at least 3.5% (35 g/kg milk) and that the milk is neither skimmed nor partly skimmed. Reject use of this exact CPC-linked scope for lower-fat or separated milk; missing evidence leaves classification eligibility undetermined, not assumed. Do not reinterpret this as a quality acceptance limit or change the actual composition."
    source_ids:
      - un-cpc-3-02212
  - rule_id: v_reference
    applies_to: "final milk"
    rule: "One final handover state per batch; normalize 1 kg accepted mass. Chilled-only UUID cannot stand for broad warm-or-chilled reference."
    source_ids: []
  - rule_id: v_state_denominator
    applies_to: "milk balance and final-package normalization"
    rule: "Require agreement among the selected handover state, attributable numerator and accepted-output denominator under c_milk_state_normalization. Whole-site warm-plus-chilled totals are reconciliation evidence only. Reject pooled-state normalization, duplicated warm transfers and cooling burdens attributed to never-cooled warm lots."
    source_ids: []
  - rule_id: v_route
    applies_to: "pasture/housed route"
    rule: "Require feed, manure, energy and animal-period evidence for each route delta; a route label alone is insufficient."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: v_outputs
    applies_to: "milk, live animals, manure"
    rule: "Require explicit independent handover and attribution for each co-product; neither residue nor internal transfer is credited twice."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: v_period
    applies_to: "herd phases"
    rule: "Opening and replacement burdens, birth, milk and cull events have one class-period attribution."
    source_ids: []
  - rule_id: v_shared
    applies_to: "shared infrastructure"
    rule: "Housing, pump, parlour, tank and meter fractions sum to one across herd, milking, conditioning and cooling in each service period."
    source_ids: []
  - rule_id: v_balance
    applies_to: "milk/manure"
    rule: "Gross, accepted and rejected milk and manure pathway balances reconcile; direct warm and chilled outputs do not overlap."
    source_ids: []
  - rule_id: v_uuid
    applies_to: "identity"
    rule: "Fixed UUID requires exact type, property, state, gate and medium; unresolved identity stays blank."
    source_ids: []
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-livestock-2019
      - ipcc-managed-soils-2019
published_dataset_profile:
  dataset_role: "foreground raw buffalo milk production dataset"
  downstream_use: "secondary_dataset; background_dataset only after relevant review"
  allowed_use: "unprocessed buffalo milk at producing farm gate with declared warm/chilled state"
  excluded_use: "other species, processed milk, independent cooling, post-gate transport"
  required_metadata: "herd classes and period, route, farm, accepted/rejected batches, composition, temperature, manure and live-animal handovers, allocation and shared assets"
  required_quality_disclosure: "activity coverage, reasoned-estimate screens, factor tier and uncertainty, balances and unresolved identities"
  update_trigger: "changed herd/feeding route, cooling ownership, state, co-product attribution, factor method or verified identity"
