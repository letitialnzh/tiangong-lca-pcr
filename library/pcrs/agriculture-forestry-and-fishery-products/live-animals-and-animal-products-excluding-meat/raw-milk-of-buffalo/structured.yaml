measurement_rules:
  - id: m_reference
    applies_to: "accepted final milk"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Normalize one final warm or chilled handover to 1 kg net accepted milk; do not double count an internal warm transfer."
