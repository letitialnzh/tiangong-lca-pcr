allocation_rules:
  - rule_id: a_outputs
    applies_to: "milk, live buffalo/calf transfer and usable manure"
    rule: "Separate output-specific operations first. For residual milk/live-animal herd burdens, use documented buffalo class-period energy requirements for milk production and live growth as biophysical allocation drivers; shares sum to one. Disclose price-based sensitivity separately. Treat exported usable manure with an explicit documented burden decision, never automatic avoided-product credit. No credit for retained replacements, rejects or untransferred manure, and no double counting with a live-buffalo PCR."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: a_period
    applies_to: "lactation, dry, replacement, birth and culling phases"
    rule: "Link inputs, herd assets, milk and animal events to animal class-periods. Opening and replacement burdens, retirement and transfers enter exactly once."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: a_shared
    applies_to: "housing, pump, parlour, tank and utility meter"
    rule: "Name every consuming node and service period; allocate one total using measured service hours, throughput or a defended causal driver, with fractions summing to one."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: a_residue
    applies_to: "rejected milk, residual manure"
    rule: "Reconcile physical mass and actual treatment; residues and waste receive no independent product credit."
    source_ids:
      - ipcc-livestock-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd
      process_id: "herd"
      flow_role: "feed, live transfers and enteric CH4"
      record_type: "herd/feed ledger"
      raw_fields: "class, head-days, feed and moisture, grazing estimate, births, replacements, culls, origins"
      collection_method: "farm records and scales; Raw aggregation requirements: stratify by class and period. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head-day, kg"
      frequency: "event and daily"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "herd roll-forward and weigh tickets; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
      process_id: "herd"
      flow_role: "manure outputs, CH4, N2O and NH3"
      record_type: "manure ledger"
      raw_fields: "excreted N, volatile solids, pathway fractions, mass, N quality, transfers"
      collection_method: "inventory, sampling and pathway model; Raw aggregation requirements: reconcile pathways without duplicate soil burden. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, kg N, kg VS"
      frequency: "event and monthly"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "storage and transfer records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_utilities
      process_id: "herd_milking_conditioning_cooling"
      flow_role: "water and energy"
      record_type: "meter/invoice"
      raw_fields: "source, carrier, quantity, asset, node, service time, period"
      collection_method: "meter and allocation log; Raw aggregation requirements: attribute shared meters exactly once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3, kWh, MJ, L, kg"
      frequency: "monthly and batch"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration and invoices; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_milk
      process_id: "milking_conditioning_cooling"
      flow_role: "milk outputs and rejects"
      record_type: "batch ledger"
      raw_fields: "gross/accepted/rejected/lost mass, state, temperature, composition, gate"
      collection_method: "calibrated tank and sample; Raw aggregation requirements: sum mutually exclusive final warm/chilled handovers. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, °C, %"
      frequency: "batch"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "milk balance and acceptance tickets; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
  calculation_rules:
    - id: c_milk_balance
      applies_to: "milk stages"
      rule: "gross captured = accepted warm + conditioning rejection/loss; warm into cooling = chilled accepted + cooling rejection/loss; final reference = direct warm + chilled once"
      inputs:
        - "batch masses"
      output: "net accepted kg"
      source_ids: []
    - id: c_feed
      applies_to: "herd feed"
      rule: "dry matter = as-fed mass × sampled dry-matter fraction; document pasture estimation separately"
      inputs:
        - "feed and moisture"
      output: "kg dry matter"
      source_ids:
        - fao-large-ruminants-2016
    - id: c_enteric
      applies_to: "CH4"
      rule: "buffalo class-period activity × compatible tier factor; keep enteric and manure pathways apart"
      inputs:
        - head-days
        - intake
        - factor
      output: "kg CH4"
      source_ids:
        - ipcc-livestock-2019
    - id: c_manure_ch4
      applies_to: "manure CH4"
      rule: "volatile solids × management pathway share × compatible methane conversion and potential factors"
      inputs:
        - "VS and pathway ledger"
      output: "kg biogenic CH4"
      source_ids:
        - ipcc-livestock-2019
    - id: c_manure
      applies_to: "N2O and NH3"
      rule: "excreted N × pathway fraction × species-specific factor, with managed-soil interface reconciliation"
      inputs:
        - "N/pathway ledger"
      output: "kg N2O and NH3 separately"
      source_ids:
        - ipcc-livestock-2019
    - id: c_shared
      applies_to: "shared assets"
      rule: "measured total × documented service fraction for node-period; fractions sum to one"
      inputs:
        - "meter and service log"
      output: "attributed utility/burden"
      source_ids:
        - fao-large-ruminants-2016
  data_quality_requirements:
    - id: q_identity
      applies_to: "final milk"
      requirement: "Verify buffalo species, raw state, farm gate, warm/chilled state and temperature."
      evidence: "batch and handover record"
    - id: q_period
      applies_to: "herd"
      requirement: "Cover lactation, dry and replacement classes, births and culls; reconcile opening/closing stock."
      evidence: "herd ledger"
    - id: q_balance
      applies_to: "milk and manure"
      requirement: "Reconcile milk stages and manure fractions to documented tolerance."
      evidence: "batch and pathway balance"
    - id: q_emission
      applies_to: "direct emissions"
      requirement: "Preserve substance, medium, buffalo class, manure pathway and factor tier."
      evidence: "factor/activity sheet"
validation_rules:
  - rule_id: v_reference
    applies_to: "final milk"
    rule: "One final handover state per batch; normalize 1 kg accepted mass. Chilled-only UUID cannot stand for broad warm-or-chilled reference."
    source_ids: []
  - rule_id: v_route
    applies_to: "pasture/housed route"
    rule: "Require feed, manure, energy and animal-period evidence for each route delta; a route label alone is insufficient."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: v_outputs
    applies_to: "milk, live animals, manure"
    rule: "Require explicit independent handover and attribution for each co-product; neither residue nor internal transfer is credited twice."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: v_period
    applies_to: "herd phases"
    rule: "Opening and replacement burdens, birth, milk and cull events have one class-period attribution."
    source_ids: []
  - rule_id: v_shared
    applies_to: "shared infrastructure"
    rule: "Housing, pump, parlour, tank and meter fractions sum to one across herd, milking, conditioning and cooling in each service period."
    source_ids: []
  - rule_id: v_balance
    applies_to: "milk/manure"
    rule: "Gross, accepted and rejected milk and manure pathway balances reconcile; direct warm and chilled outputs do not overlap."
    source_ids: []
  - rule_id: v_uuid
    applies_to: "identity"
    rule: "Fixed UUID requires exact type, property, state, gate and medium; unresolved identity stays blank."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground raw buffalo milk production dataset"
  downstream_use: "secondary_dataset; background_dataset only after relevant review"
  allowed_use: "unprocessed buffalo milk at producing farm gate with declared warm/chilled state"
  excluded_use: "other species, processed milk, independent cooling, post-gate transport"
  required_metadata: "herd classes and period, route, farm, accepted/rejected batches, composition, temperature, manure and live-animal handovers, allocation and shared assets"
  required_quality_disclosure: "activity coverage, reasoned-estimate screens, factor tier and uncertainty, balances and unresolved identities"
  update_trigger: "changed herd/feeding route, cooling ownership, state, co-product attribution, factor method or verified identity"
