    rule: "Separate output-specific operations first. For residual milk/live-animal herd burdens, use documented buffalo class-period energy requirements for milk production and live growth as biophysical allocation drivers; shares sum to one. Disclose price-based sensitivity separately. Treat exported usable manure with an explicit documented burden decision, never automatic avoided-product credit. No credit for retained replacements, rejects or untransferred manure, and no double counting with a live-buffalo PCR."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: a_period
    applies_to: "lactation, dry, replacement, birth and culling phases"
    rule: "Link inputs, herd assets, milk and animal events to animal class-periods. Opening and replacement burdens, retirement and transfers enter exactly once."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: a_shared
    applies_to: "housing, pump, parlour, tank and utility meter"
    rule: "Name every consuming node and service period; allocate one total using measured service hours, throughput or a defended causal driver, with fractions summing to one."
    source_ids:
      - fao-large-ruminants-2016
  - rule_id: a_residue
    applies_to: "rejected milk, residual manure"
    rule: "Reconcile physical mass and actual treatment; residues and waste receive no independent product credit."
    source_ids:
      - ipcc-livestock-2019
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd
      process_id: "herd"
      flow_role: "feed, live transfers and enteric CH4"
      record_type: "herd/feed ledger"
      raw_fields: "class, head-days, feed and moisture, grazing estimate, births, replacements, culls, origins"
      collection_method: "farm records and scales"
      unit: "head-day, kg"
      frequency: "event and daily"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "stratify by class and period"
      quality_evidence: "herd roll-forward and weigh tickets"
    - protocol_id: cp_manure
      process_id: "herd"
      flow_role: "manure outputs, CH4, N2O and NH3"
      record_type: "manure ledger"
      raw_fields: "excreted N, volatile solids, pathway fractions, mass, N quality, transfers"
      collection_method: "inventory, sampling and pathway model"
      unit: "kg, kg N, kg VS"
      frequency: "event and monthly"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "reconcile pathways without duplicate soil burden"
      quality_evidence: "storage and transfer records"
    - protocol_id: cp_utilities
      process_id: "herd_milking_conditioning_cooling"
      flow_role: "water and energy"
      record_type: "meter/invoice"
      raw_fields: "source, carrier, quantity, asset, node, service time, period"
      collection_method: "meter and allocation log"
      unit: "m3, kWh, MJ, L, kg"
      frequency: "monthly and batch"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "attribute shared meters exactly once"
      quality_evidence: "calibration and invoices"
    - protocol_id: cp_milk
      process_id: "milking_conditioning_cooling"
      flow_role: "milk outputs and rejects"
      record_type: "batch ledger"
      raw_fields: "gross/accepted/rejected/lost mass, state, temperature, composition, gate"
      collection_method: "calibrated tank and sample"
      unit: "kg, °C, %"
      frequency: "batch"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "sum mutually exclusive final warm/chilled handovers"
      quality_evidence: "milk balance and acceptance tickets"
  calculation_rules:
    - id: c_milk_balance
      applies_to: "milk stages"
      rule: "gross captured = accepted warm + conditioning rejection/loss; warm into cooling = chilled accepted + cooling rejection/loss; final reference = direct warm + chilled once"
      inputs:
        - "batch masses"
      output: "net accepted kg"
      source_ids: []
    - id: c_feed
      applies_to: "herd feed"
      rule: "dry matter = as-fed mass × sampled dry-matter fraction; document pasture estimation separately"
      inputs:
        - "feed and moisture"
      output: "kg dry matter"
      source_ids:
        - fao-large-ruminants-2016
    - id: c_enteric
      applies_to: "CH4"
      rule: "buffalo class-period activity × compatible tier factor; keep enteric and manure pathways apart"
      inputs:
        - head-days
        - intake
        - factor
      output: "kg CH4"
      source_ids:
        - ipcc-livestock-2019
    - id: c_manure_ch4
      applies_to: "manure CH4"
      rule: "volatile solids × management pathway share × compatible methane conversion and potential factors"
      inputs:
        - "VS and pathway ledger"
      output: "kg biogenic CH4"
      source_ids:
        - ipcc-livestock-2019
    - id: c_manure
      applies_to: "N2O and NH3"
      rule: "excreted N × pathway fraction × species-specific factor, with managed-soil interface reconciliation"
      inputs:
        - "N/pathway ledger"
      output: "kg N2O and NH3 separately"
      source_ids:
        - ipcc-livestock-2019
    - id: c_shared
      applies_to: "shared assets"
      rule: "measured total × documented service fraction for node-period; fractions sum to one"
      inputs:
        - "meter and service log"
      output: "attributed utility/burden"
      source_ids:
        - fao-large-ruminants-2016
  data_quality_requirements:
    - id: q_identity
      applies_to: "final milk"
      requirement: "Verify buffalo species, raw state, farm gate, warm/chilled state and temperature."
      evidence: "batch and handover record"
    - id: q_period
      applies_to: "herd"
      requirement: "Cover lactation, dry and replacement classes, births and culls; reconcile opening/closing stock."
      evidence: "herd ledger"
    - id: q_balance
      applies_to: "milk and manure"
      requirement: "Reconcile milk stages and manure fractions to documented tolerance."
      evidence: "batch and pathway balance"
    - id: q_emission
      applies_to: "direct emissions"
      requirement: "Preserve substance, medium, buffalo class, manure pathway and factor tier."
      evidence: "factor/activity sheet"
