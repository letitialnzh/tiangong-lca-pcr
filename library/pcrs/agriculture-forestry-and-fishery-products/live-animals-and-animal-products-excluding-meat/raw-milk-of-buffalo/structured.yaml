system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The boundary begins with declared opening buffalo stock and purchased replacements with preceding burden. Managed herd production covers feed, water, housing, enteric and manure pathways. Independent milking captures gross raw milk; first farm conditioning strains and accepts it. Optional cooling preserves already usable raw milk before farm handover; it is not pasteurization. Shared housing, pumps, parlour, tank and meters are attributed once among consuming nodes and periods."
      source_ids: []
    - rule_id: b_farm_gate
      applies_to: "final milk"
      rule: "Include producing-farm activities only; independent cooling, post-gate haulage, pasteurization and packaging are excluded."
      source_ids:
        - fao-large-ruminants-2016
    - rule_id: b_capture
      applies_to: "milk stages"
      rule: "Distinguish biological milk production, physical milking capture, first raw-milk conditioning and optional cooling by handoff state."
      source_ids:
        - fao-large-ruminants-2016
    - rule_id: b_route
      applies_to: "pasture/housed variants"
      rule: "Parent is managed buffalo herd. Record route deltas for feed origin, manure deposition versus storage, housing energy and corresponding checks; variants may coexist."
      source_ids:
        - fao-large-ruminants-2016
        - ipcc-livestock-2019
    - rule_id: b_manure
      applies_to: "excreta"
      rule: "Distinguish pasture deposition, collection, storage, on-farm return and independent export with N and volatile solids by pathway."
      source_ids:
        - ipcc-livestock-2019
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
