allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "All operations"
    rule: "Subdivide measured breeder, rearing and handover inputs and outputs first; do not allocate burdens already tied to a specific horse cohort or node."
    source_ids:
      - fao-equine-husbandry
  - rule_id: allocation_outputs
    applies_to: "Foals, live breeder culls, older live horses and usable manure"
    rule: "Enumerate intended product output, mass, destination and gate. Where shared burden cannot be subdivided, use measured physical causality (horse-days, service use or feed demand); if not defensible, use same-period economic values with prices and sensitivity. Dead horses and disposal manure are waste, not product credits."
    source_ids:
      - fao-equine-husbandry
      - ipcc-livestock-2019
  - rule_id: allocation_periods
    applies_to: "Multi-season breeding and rearing"
    rule: "Assign mare/stallion upkeep, breeding/gestation, foaling, weaning, rearing, replacements and live culls to benefiting cohorts over their recorded periods; a transferred foal passes its prior burden once."
    source_ids:
      - fao-equine-husbandry
  - rule_id: allocation_shared
    applies_to: "Shared stables, pasture/fencing, water and handling"
    rule: "Assign each asset or service once to consuming horses/nodes/periods by measured use, occupied horse-days or capacity-days; disclose the chosen key and sum of shares."
    source_ids:
      - fao-equine-husbandry
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd
      process_id: "breeder_rearing_handover"
      flow_role: "Horse stock and live mass"
      record_type: "herd and buyer logs"
      raw_fields: "opening/received/foaled/sold/dead counts; horse-days by class; breed, sex, age, purpose; measured weights; gate; date"
      collection_method: "count each movement and weigh lot or age-class sample; Raw aggregation requirements: stock balance, class-weighted live mass and class-specific horse-days. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "horses; horse-days; kg"
      frequency: "each movement and period"
      temporal_coverage: "complete breeding/rearing cohort"
      site_scope: "each producer gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "animal register, scales, buyer receipt; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed
      process_id: "breeder_rearing"
      flow_role: "Feed and pasture"
      record_type: "feed invoices and grazing log"
      raw_fields: "deliveries; opening/closing feed stock; own forage; pasture area/days; horse-days"
      collection_method: "weighed receipts, feed ledger, grazing records; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg; ha-days; horse-days"
      frequency: "each receipt and period"
      temporal_coverage: "full herd season/cohort"
      site_scope: "all houses and paddocks"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, scale and field log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_utilities
      process_id: "breeder_rearing"
      flow_role: "Water, electricity and fuels"
      record_type: "meter and fuel log"
      raw_fields: "source, use, meter start/end, carrier and asset consumer"
      collection_method: "meter read or invoice with causal shared-use key; Raw aggregation requirements: difference readings, unit conversion, one service allocation. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg water; kWh; MJ"
      frequency: "meter interval"
      temporal_coverage: "all operated periods"
      site_scope: "all water and energy connections"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter images, receipts, asset log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_health
      process_id: "breeder_rearing"
      flow_role: "Medicines and veterinary care"
      record_type: "treatment and purchase log"
      raw_fields: "medicine/material, dose/mass, horse cohort, service provider, date"
      collection_method: "prescription and inventory reconciliation; Raw aggregation requirements: product totals by cohort; disclose external service. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; visits"
      frequency: "each event"
      temporal_coverage: "full horse cohort"
      site_scope: "all treated horses"
      aggregation_rule: "per reference flow"
      quality_evidence: "veterinary record, invoice; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
      process_id: "breeder_rearing_handover"
      flow_role: "Manure, deaths and emissions"
      record_type: "manure, mortality and monitoring log"
      raw_fields: "manure management, grazing deposition, exported and discarded mass, volatile solids, direct gas monitoring, dead count/mass, destination"
      collection_method: "weigh/sample, record route and observed gas when claimed; Raw aggregation requirements: reconcile destinations, select pathway-specific method once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; horse-days"
      frequency: "each event/period"
      temporal_coverage: "all operated herd periods"
      site_scope: "stable, paddock, treatment"
      aggregation_rule: "per reference flow"
      quality_evidence: "manure analysis, field and disposal record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "breeder_rearing"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "breeder_rearing"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: calc_live_mass
      applies_to: "Live-horse transfer"
      rule: "live mass = reconciled count × measured mean horse mass by breed/sex/age class; use whole-lot scale when available"
      inputs:
        - count
        - "sampled weights"
        - scale
      output: "kg and kg/horse"
      source_ids:
        - fao-equine-husbandry
    - id: calc_herd
      applies_to: "Herd stock"
      rule: "opening + purchased + foaled − sold − dead − internal removals = closing horses, by cohort and period"
      inputs:
        - "herd movements"
      output: "count balance"
      source_ids:
        - fao-equine-husbandry
    - id: calc_enteric
      applies_to: "Horse enteric CH4"
      rule: "Calculate horse enteric methane from class-specific horse-days and the selected IPCC equine method, separately from manure CH4; disclose the method/factor and period."
      inputs:
        - "herd horse-days"
        - "class and feed regime"
      output: "enteric CH4 to air"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_gas
      applies_to: "Manure CH4, N2O, NH3"
      rule: "Calculate manure CH4/N2O only from actual pathway and collected IPCC inputs; NH3 requires measurement or separately reviewed pathway factor. A flow UUID is identity, never an emission factor."
      inputs:
        - "manure and monitoring record"
      output: "manure-derived speciated air emissions"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_shared
      applies_to: "Shared infrastructure"
      rule: "Allocate one measured service burden across breeder and rearing nodes/periods by metered use or documented horse-days/capacity-days; shares must sum to one"
      inputs:
        - service
        - consumers
        - "periods and key"
      output: "node/period burden"
      source_ids:
        - fao-equine-husbandry
    - id: calc_feed_supply_and_intake
      applies_to: "breeder_feed; rearing_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
    - id: calc_manure_n2o_coverage
      applies_to: "breeder_manure_n2o_air; rearing_manure_n2o_air"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-livestock-2019
        - ipcc-managed-soils-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference and transfers"
      requirement: "Preserve horse (not other equine) identity, breed, sex, age/class, count, measured live mass, purpose and actual producer gate."
      evidence: "horse register and buyer receipt"
    - id: dq_period
      applies_to: "Breeder and rearing"
      requirement: "Link breeding, foaling, weaning, replacement, cull, feed, manure and asset use to complete dated periods."
      evidence: "herd and asset logs"
    - id: dq_route
      applies_to: "Grazing and stabled routes"
      requirement: "Support mode-specific feed, pasture, housing utilities, care and manure records; record mixed periods explicitly."
      evidence: "paddock, stable and treatment logs"
    - id: dq_complete
      applies_to: "Inputs and outputs"
      requirement: "Reconcile live transfers, feed, water, energy, veterinary supplies, live culls, death and manure destinations; disclose omissions."
      evidence: "reconciliation sheets"
validation_rules:
  - rule_id: validate_reference
    applies_to: "Final live horse"
    rule: "Reject missing measured kg, reconciled count, age/class, purpose or declared breeder/rearing-farm producer gate. Slaughter/plant candidate UUIDs are not producer-gate reference identity."
    source_ids:
      - un-cpc-2025
  - rule_id: validate_species
    applies_to: "Classification"
    rule: "Horse-only scope; reject ass, mule/hinny, meat/hides or downstream work/transport service as the live-horse reference."
    source_ids:
      - un-cpc-2025
  - rule_id: validate_route
    applies_to: "Managed production"
    rule: "Verify operated breeder/rearing nodes and documented pasture/stable deltas; breeder-gate foal and rearing-farm older-horse final outputs cannot both be counted for one internal lot."
    source_ids:
      - fao-equine-husbandry
      - woah-working-equids
  - rule_id: validate_outputs
    applies_to: "Product, waste and emissions"
    rule: "Reconcile foals, breeder culls, older live horses, usable manure, dead horses and treatment manure at each gate; document allocation and avoid duplicate live or manure outputs."
    source_ids:
      - fao-equine-husbandry
      - ipcc-livestock-2019
  - rule_id: validate_period_asset
    applies_to: "Multi-period/shared burden"
    rule: "Check breeding, foaling, weaning, rearing and replacement periods and service keys across all consuming nodes, with shares summing once."
    source_ids:
      - fao-equine-husbandry
  - rule_id: validate_gas
    applies_to: "Enteric and manure emissions"
    rule: "Keep enteric CH4 and manure CH4 as separate activity and calculation paths. Require class-specific horse-days and selected equine method for enteric CH4; actual manure destination and pathway-specific IPCC inputs for manure CH4/N2O; measured/reviewed NH3 method. Do not infer a quantity from a fixed flow UUID."
    source_ids:
      - ipcc-livestock-2019
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-livestock-2019
      - ipcc-managed-soils-2019
published_dataset_profile:
  dataset_role: "Foreground producing-farm data package for living horses"
  downstream_use: "secondary_dataset or background_dataset in reviewed process/lifecyclemodel assembly"
  allowed_use: "Live horses at a matching breeder or rearing-farm producer gate with concrete verified reference identity"
  excluded_use: "Slaughter-plant input, meat/hide, donkey/mule, horse work service or unmeasured count-to-mass conversion"
  required_metadata: "Breed, sex, age/class, purpose, live count and kg, producer gate, site, breeder/rearing periods, grazing/stabling, manure destinations, co-products and shared asset keys"
  required_quality_disclosure: "Weight/count balance, evidence gaps, provisional Range screens, upstream identity and any unresolved UUID"
  update_trigger: "Changed horse classification, route, producer gate, UUID evidence, manure method or reviewed rule"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "[UN CPC 3.0 explanatory notes](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "Horse versus other equine and downstream product boundary"
  - id: "fao-equine-husbandry"
    type: "extension_guidance"
    reference: "[FAO Chapter 5: Horses, donkeys and mules](https://www.fao.org/4/t0690e/t0690e07.htm)"
    used_for: "Horse care, foaling, stable/grazing, feed, water and handover context"
  - id: "woah-working-equids"
    type: "official_guidance"
    reference: "[WOAH Chapter 7.12: Welfare of working equids](https://www.woah.org/fileadmin/Home/eng/Health_standards/tahc/current/en_chapitre_aw_working_equids.htm)"
    used_for: "Husbandry and welfare interfaces, not service as product"
  - id: "ipcc-livestock-2019"
    type: "method_factor"
    reference: "[2019 IPCC refinement, Vol. 4 Ch. 10](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf)"
    used_for: "Manure pathways and greenhouse-gas method"
  - id: "fao-feed-loss-accounting-2018"
    type: "official_guidance"
    reference: "[FAO 2018, Environmental performance of pig supply chains, section 11.2.2](https://www.fao.org/4/i8686en/I8686EN.pdf)"
    used_for: "Feed supply versus intake and waste burden, not animal parameters. Applying this accounting principle to the declared taxon is this PCR's methodological choice; no pig diet or emission factor is transferred."
  - id: "ipcc-managed-soils-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 11](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf)"
    used_for: "Direct/indirect nitrogen pathways and coordination of manure storage with managed-soil emissions; select applicable species and management evidence."
  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
