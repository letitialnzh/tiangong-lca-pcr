system_boundary:
  rules:
    - rule_id: boundary_identity
      applies_to: "Every lot"
      rule: "Species-level residual classification and lawful origin are prerequisites; CPC examples are not permits."
      source_ids:
        - un-cpc-2025
        - woah-wildlife-trade-2021
    - rule_id: boundary_managed
      applies_to: "Captive route"
      rule: "Include actual stock, husbandry inputs, care, mortality and pre-gate selection; purchased stock carries upstream burden."
      source_ids:
        - woah-wildlife-trade-2021
    - rule_id: boundary_capture
      applies_to: "Capture route"
      rule: "Include only authorized campaign, equipment, temporary holding, welfare and capture handover; without legal evidence this route is ineligible."
      source_ids:
        - woah-wildlife-trade-2021
    - rule_id: boundary_gate
      applies_to: "Both"
      rule: "End at real live handover; exclude post-gate delivery, buyer use, slaughter and corpse processing."
      source_ids:
        - un-cpc-2025
    - rule_id: boundary_shared
      applies_to: "Shared enclosure/equipment"
      rule: "Record consuming nodes and service periods; charge common burden once."
      source_ids: []
