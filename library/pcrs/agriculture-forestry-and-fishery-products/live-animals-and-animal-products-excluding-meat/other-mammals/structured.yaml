  classification_refs: "CPC 3.0 02192, Other mammals"
  covered_products: "Species-resolved living residual-class mammals of lawful captive or lawful live-capture origin"
  excluded_products: "Specifically classified live mammals; dead animals; meat/fur; undocumented wildlife trade; post-gate use"
  representative_product: "One declared species/class of living mammal, not a cross-species mix"
  production_route: "Managed breeding/rearing followed by selection, or separately documented lawful live capture; never fictional breeding on capture route"
  market_state: "Alive and unprocessed at real producer/capture handover, with count, mass and condition"
functional_unit:
  what: "Living mammal of a declared residual-category species at its real handover"
  how_much: "1 kg measured live mass, plus individual count"
  how_well: "Alive, species-resolved, lawful origin and condition established"
  how_long_or_cycle: "Actual breeding/rearing cohort and service periods, or documented capture campaign"
  reference_flow_link: "reference_product_handover"
system_boundary:
  rules:
    - rule_id: boundary_identity
      applies_to: "Every lot"
      rule: "Species-level residual classification and lawful origin are prerequisites; CPC examples are not permits."
      source_ids:
        - un-cpc-2025
        - woah-wildlife-trade-2021
    - rule_id: boundary_managed
      applies_to: "Captive route"
      rule: "Include actual stock, husbandry inputs, care, mortality and pre-gate selection; purchased stock carries upstream burden."
      source_ids:
        - woah-wildlife-trade-2021
    - rule_id: boundary_capture
      applies_to: "Capture route"
      rule: "Include only authorized campaign, equipment, temporary holding, welfare and capture handover; without legal evidence this route is ineligible."
      source_ids:
        - woah-wildlife-trade-2021
    - rule_id: boundary_gate
      applies_to: "Both"
      rule: "End at real live handover; exclude post-gate delivery, buyer use, slaughter and corpse processing."
      source_ids:
        - un-cpc-2025
    - rule_id: boundary_shared
      applies_to: "Shared enclosure/equipment"
      rule: "Record consuming nodes and service periods; charge common burden once."
      source_ids: []
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Documented captive opening/purchased stock and prior burden, or lawful pre-capture campaign context"
  starting_condition_role: "Managed biological stock or authorized wild-source context; no fictional lifetime farming on capture route"
  product_classification_scope: "CPC 3.0 02192 after exclusion of more specific live-mammal leaves"
  recursive_input_rule: "Link purchased same-category animals once to preceding-gate data; internal rearing/selection transfer is not another final product."
  upstream_dataset_requirement: "Match incoming stock, feed, water, energy and materials to species, supplier, geography, unit and gate."
  disclosure: "Species, lawful source and protected status, permit, welfare, lot/cohort/campaign, asset periods, death/release, outputs and actual gate."
