allocation_rules:
  - rule_id: allocation_outputs
    applies_to: "Managed output set"
    rule: "Enumerate only real independent products and their handovers. Subdivide separable processes; otherwise allocate inseparable burdens by documented handover economic value, disclose prices/period and mass-allocation sensitivity. No hypothetical credit."
    source_ids: []
  - rule_id: allocation_capture
    applies_to: "Capture campaign"
    rule: "Attribute actual campaign burdens to lawfully transferred intended outputs; releases are non-sale and mortality follows actual disposal."
    source_ids: []
  - rule_id: allocation_periods
    applies_to: "Cohorts and replacements"
    rule: "Attribute inputs and replacement stock to benefited periods with opening/closing reconciliation; internal animal transfer has one burden."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "Shared enclosures/equipment"
    rule: "Allocate by recorded service hours/capacity across consuming nodes and periods; do not double count."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_animals
      process_id: "managed_selection_capture"
      flow_role: "live stock, handover, mortality"
      record_type: "animal ledger"
      raw_fields: "species; ID; count; mass; origin; law/permit; status; gate; date; death; release"
      collection_method: "weighing and custody/health records"
      unit: "kg; head"
      frequency: "each event"
      temporal_coverage: "full cohort/campaign"
      site_scope: "site/campaign"
      aggregation_rule: "unique event sum"
      quality_evidence: "scale calibration; permits; vet/transfer records"
    - protocol_id: cp_inputs
      process_id: "managed_capture"
      flow_role: "feed, water, energy, material"
      record_type: "meter/invoice ledger"
      raw_fields: "identity; carrier; amount; period; node; stock change"
      collection_method: "invoices, meters and inventory"
      unit: "kg; MJ"
      frequency: "each receipt/meter period"
      temporal_coverage: "full cycle/campaign"
      site_scope: "site"
      aggregation_rule: "net use by node/period"
      quality_evidence: "invoice; calibration"
    - protocol_id: cp_assets
      process_id: "managed_selection_capture"
      flow_role: "shared asset"
      record_type: "service log"
      raw_fields: "asset; node; service hours/capacity; period; burden"
      collection_method: "enclosure/equipment log"
      unit: "h"
      frequency: "each service period"
      temporal_coverage: "full asset window"
      site_scope: "site/campaign"
      aggregation_rule: "once by observed use"
      quality_evidence: "asset and maintenance records"
    - protocol_id: cp_outputs
      process_id: "managed"
      flow_role: "other real intended output"
      record_type: "transfer record"
      raw_fields: "identity; quantity; recipient; price; legal basis; date"
      collection_method: "actual transfer document"
      unit: "kg"
      frequency: "each transfer"
      temporal_coverage: "full cohort"
      site_scope: "site"
      aggregation_rule: "by output and period"
      quality_evidence: "sales/transfer record"
  calculation_rules:
    - id: calc_reference
      applies_to: "Accepted live output"
      rule: "Sum measured accepted live kg / 1 kg; retain head count, species and unique gate."
      inputs:
        - cp_animals
      output: "reference mass/count"
      source_ids: []
    - id: calc_balance
      applies_to: "Animal events"
      rule: "Reconcile opening, birth, purchase, capture, transfer, release, death and closing by species/class/period; growth mass is measured, not conserved by assumption."
      inputs:
        - cp_animals
      output: "balanced ledger"
      source_ids: []
    - id: calc_inputs
      applies_to: "Supplies"
      rule: "Net measured supply assigned to node/period / accepted live kg; do not combine captive and capture routes."
      inputs:
        - cp_inputs
        - cp_animals
      output: "card intensities"
      source_ids: []
    - id: calc_shared
      applies_to: "Shared asset"
      rule: "Asset burden × observed node/period share; shares sum to one or unused capacity is disclosed."
      inputs:
        - cp_assets
      output: "nonduplicate burden"
      source_ids: []
    - id: calc_allocation
      applies_to: "Multi-output"
      rule: "After subdivision allocate inseparable burden by documented handover value, with mass sensitivity."
      inputs:
        - cp_outputs
        - cp_animals
      output: "output burden"
      source_ids: []
  data_quality_requirements:
    - id: dq_species_law
      applies_to: "Each lot"
      requirement: "Species, source, conservation status, permissions and custody chain for exact date/jurisdiction must be established."
      evidence: "taxonomy; permits; custody"
    - id: dq_gate
      applies_to: "Live output"
      requirement: "Alive status, count, measured mass, condition and actual gate must reconcile."
      evidence: "scale; transfer; veterinary records"
    - id: dq_completeness
      applies_to: "Both routes"
      requirement: "Reconcile inputs, outputs, deaths/releases, cohorts and campaign."
      evidence: "ledgers; invoices; discrepancy log"
    - id: dq_periods
      applies_to: "Shared and multi-period"
      requirement: "Link asset/cohort burden once to real service periods."
      evidence: "asset and cohort ledgers"
validation_rules:
  - rule_id: validate_classification
    applies_to: "All"
    rule: "Reject species-free, wrong residual classification, undocumented origin or unresolved legal/protected status."
    source_ids:
      - un-cpc-2025
      - woah-wildlife-trade-2021
  - rule_id: validate_route
    applies_to: "Each lot"
    rule: "Exactly one captive or lawful-capture source; capture cannot claim farm stock, captive route cannot claim wild capture."
    source_ids: []
  - rule_id: validate_live
    applies_to: "Final output"
    rule: "Mass, count, live condition and gate reconcile; deaths/releases and post-gate animals cannot inflate output."
    source_ids: []
  - rule_id: validate_allocation
    applies_to: "Outputs/periods"
    rule: "Each co-product has real handover; asset/period shares and internal transfers cannot double count."
    source_ids: []
