allocation_rules:
  - rule_id: a_outputs
    applies_to: "Farm and capture"
    rule: "Enumerate each independently sold live animal, antler/velvet, milk, breeding service, usable manure or other real product by identity, amount and handover. Internal transfer, hypothetical output, residue and discarded waste have no product credit; substitution is not a silent default."
    source_ids:
      - fao-deer-farming
  - rule_id: a_joint
    applies_to: "Joint production"
    rule: "Prefer measured process subdivision. Otherwise disclose a justified physical causal allocation tied to actual output and cohort; if none is defensible, report economic sensitivity with contemporaneous prices."
    source_ids:
      - fao-deer-farming
  - rule_id: a_period
    applies_to: "Herd cohorts or capture campaign"
    rule: "Link breeding, rearing, replacement, deaths, sold outputs and campaign events to actual period; assign opening/closing stock once and never invent capture-period husbandry."
    source_ids:
      - fao-deer-farming
  - rule_id: a_shared
    applies_to: "Fencing, water and handling facilities"
    rule: "Record service units, consuming nodes and periods; attribute once by measured use or declared physical proxy, never double charge herd/capture/handover."
    source_ids:
      - fao-deer-farming
dataset_production:
  collection_protocols:
    - protocol_id: cp_live
      process_id: "herd_capture_handover"
      flow_role: "Live stock and transfers"
      record_type: "individual register and weigh ticket"
      raw_fields: "species; sex; age; permit; count; mass; health; source; destination; gate; date"
      collection_method: "individual identification and calibrated scale; Raw aggregation requirements: sum accepted measured mass at one gate. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "every transfer"
      temporal_coverage: "whole cohort/campaign"
      site_scope: "every included site"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed ticket; scale calibration; permit link; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_inputs
      process_id: "herd"
      flow_role: "Feed, water and energy"
      record_type: "invoices, meters and stock ledger"
      raw_fields: "type; quantity; stock change; supplier; node; period"
      collection_method: "meter and purchase reconciliation; Raw aggregation requirements: assign actual use to cohort/node then normalize. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; kWh; m3"
      frequency: "delivery/meter cycle"
      temporal_coverage: "all operated periods"
      site_scope: "all managed sites"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice; meter; allocation ledger; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "Lawful capture inputs"
      record_type: "authorization and campaign log"
      raw_fields: "permit; species; jurisdiction; dates; method; fuel; count; survival"
      collection_method: "permit inspection and campaign records; Raw aggregation requirements: total actual campaign once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kWh; kg; head"
      frequency: "each campaign"
      temporal_coverage: "authorization to handover"
      site_scope: "authorized capture/holding site"
      aggregation_rule: "per reference flow"
      quality_evidence: "permit; log; weigh ticket; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_outputs
      process_id: "herd_capture"
      flow_role: "Sold outputs and losses"
      record_type: "sale and disposal register"
      raw_fields: "identity; quantity; destination; date; mortality; manure; cohort"
      collection_method: "invoice, scale and disposal record; Raw aggregation requirements: split product, internal stock and waste. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "declared unit"
      frequency: "each event"
      temporal_coverage: "whole cohort/campaign"
      site_scope: "each node"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice; disposal manifest; register; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: c_live
      applies_to: "Final reference"
      rule: "Sum measured accepted live kg at one gate; divide each in-boundary amount by that sum. Reconcile opening/purchased/captured, births, deaths, transfers and closing stock."
      inputs:
        - cp_live
        - cp_outputs
      output: "amount per kg accepted living output"
      source_ids:
        - fao-deer-farming
    - id: c_period
      applies_to: "Shared herd and facilities"
      rule: "Assign measured service to actual consuming node and period once; retain joint-output and stock ledger before normalization."
      inputs:
        - cp_inputs
        - cp_live
        - cp_outputs
      output: "attributable service per kg live output"
      source_ids:
        - fao-deer-farming
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Every lot"
      requirement: "Prove species, residual placement, lawful source/trade and live condition; protected-species trade without authority blocks dataset."
      evidence: "taxonomy record; permit; gate record"
    - id: dq_mass
