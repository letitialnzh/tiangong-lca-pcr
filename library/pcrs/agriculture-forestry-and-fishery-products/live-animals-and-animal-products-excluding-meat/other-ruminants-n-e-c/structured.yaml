allocation_rules:
  - rule_id: a_outputs
    applies_to: "Farm and capture"
    rule: "Enumerate each independently sold live animal, antler/velvet, milk, breeding service, usable manure or other real product by identity, amount and handover. Internal transfer, hypothetical output, residue and discarded waste have no product credit; substitution is not a silent default."
    source_ids:
      - fao-deer-farming
  - rule_id: a_joint
    applies_to: "Joint production"
    rule: "Prefer measured process subdivision. Otherwise disclose a justified physical causal allocation tied to actual output and cohort; if none is defensible, report economic sensitivity with contemporaneous prices."
    source_ids:
      - fao-deer-farming
  - rule_id: a_period
    applies_to: "Herd cohorts or capture campaign"
    rule: "Link breeding, rearing, replacement, deaths, sold outputs and campaign events to actual period; assign opening/closing stock once and never invent capture-period husbandry."
    source_ids:
      - fao-deer-farming
  - rule_id: a_shared
    applies_to: "Fencing, water and handling facilities"
    rule: "Record service units, consuming nodes and periods; attribute once by measured use or declared physical proxy, never double charge herd/capture/handover."
    source_ids:
      - fao-deer-farming
dataset_production:
  collection_protocols:
    - protocol_id: cp_live
      process_id: "herd_capture_handover"
      flow_role: "Live stock and transfers"
      record_type: "individual register and weigh ticket"
      raw_fields: "species; sex; age; permit; count; mass; health; source; destination; gate; date"
      collection_method: "individual identification and calibrated scale"
      unit: "head; kg"
      frequency: "every transfer"
      temporal_coverage: "whole cohort/campaign"
      site_scope: "every included site"
      aggregation_rule: "sum accepted measured mass at one gate"
      quality_evidence: "signed ticket; scale calibration; permit link"
    - protocol_id: cp_inputs
      process_id: "herd"
      flow_role: "Feed, water and energy"
      record_type: "invoices, meters and stock ledger"
      raw_fields: "type; quantity; stock change; supplier; node; period"
      collection_method: "meter and purchase reconciliation"
      unit: "kg; kWh; m3"
      frequency: "delivery/meter cycle"
      temporal_coverage: "all operated periods"
      site_scope: "all managed sites"
      aggregation_rule: "assign actual use to cohort/node then normalize"
      quality_evidence: "invoice; meter; allocation ledger"
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "Lawful capture inputs"
      record_type: "authorization and campaign log"
      raw_fields: "permit; species; jurisdiction; dates; method; fuel; count; survival"
      collection_method: "permit inspection and campaign records"
      unit: "kWh; kg; head"
      frequency: "each campaign"
      temporal_coverage: "authorization to handover"
      site_scope: "authorized capture/holding site"
      aggregation_rule: "total actual campaign once"
      quality_evidence: "permit; log; weigh ticket"
    - protocol_id: cp_outputs
      process_id: "herd_capture"
      flow_role: "Sold outputs and losses"
      record_type: "sale and disposal register"
      raw_fields: "identity; quantity; destination; date; mortality; manure; cohort"
      collection_method: "invoice, scale and disposal record"
      unit: "declared unit"
      frequency: "each event"
      temporal_coverage: "whole cohort/campaign"
      site_scope: "each node"
      aggregation_rule: "split product, internal stock and waste"
      quality_evidence: "invoice; disposal manifest; register"
  calculation_rules:
    - id: c_live
      applies_to: "Final reference"
      rule: "Sum measured accepted live kg at one gate; divide each in-boundary amount by that sum. Reconcile opening/purchased/captured, births, deaths, transfers and closing stock."
      inputs:
        - cp_live
        - cp_outputs
      output: "amount per kg accepted living output"
      source_ids:
        - fao-deer-farming
    - id: c_period
      applies_to: "Shared herd and facilities"
      rule: "Assign measured service to actual consuming node and period once; retain joint-output and stock ledger before normalization."
      inputs:
        - cp_inputs
        - cp_live
        - cp_outputs
      output: "attributable service per kg live output"
      source_ids:
        - fao-deer-farming
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Every lot"
      requirement: "Prove species, residual placement, lawful source/trade and live condition; protected-species trade without authority blocks dataset."
      evidence: "taxonomy record; permit; gate record"
    - id: dq_mass
      applies_to: "Reference"
      requirement: "Measure mass and head count at actual gate; reconcile deaths and stock changes without universal kg/head."
      evidence: "weigh ticket; register"
    - id: dq_period
      applies_to: "Herd, capture and assets"
      requirement: "Cover full cohort/campaign and shared service periods once."
      evidence: "period ledger; invoices; campaign logs"
    - id: dq_binding
      applies_to: "Final exchanges"
      requirement: "Resolve concrete UUID, property and unit group before downstream TIDAS process exchange creation."
      evidence: "detail-read and support-row evidence"
validation_rules:
  - rule_id: v_scope
    applies_to: "Every dataset"
    rule: "Reject unidentified species, unresolved bovine overlap, undocumented legal source or dead/post-slaughter reference. CPC examples do not license trade."
    source_ids:
      - un-cpc-2025
      - woah-wildlife-2021
  - rule_id: v_route
    applies_to: "Farm or capture"
    rule: "Require exactly one source route per lot, actual herd or campaign records and living final gate; capture cannot acquire fictional farm inputs."
    source_ids:
      - fao-deer-farming
      - woah-wildlife-2021
  - rule_id: v_balance
    applies_to: "Stock and outputs"
    rule: "Reconcile count/mass, births or captures, transfers, mortality, sales and closing stock; internal transfers are not duplicate final output."
    source_ids:
      - fao-deer-farming
  - rule_id: v_attribution
    applies_to: "Joint outputs, periods and assets"
    rule: "Require actual handover set, explicit allocation, periods and one-time shared-service assignment."
    source_ids:
      - fao-deer-farming
  - rule_id: v_identity
    applies_to: "All unresolved cards"
    rule: "Keep unconfirmed UUID blank; a final exchange requires compatible concrete identity/property/unit evidence. conditional flow scope alone is not a UUID."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground species-qualified live-ruminant farm or lawful-capture dataset"
  downstream_use: "secondary_dataset; background_dataset after gate-specific review"
