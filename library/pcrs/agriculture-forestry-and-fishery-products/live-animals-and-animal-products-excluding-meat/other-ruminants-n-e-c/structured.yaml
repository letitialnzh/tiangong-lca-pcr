system_boundary:
  rules:
    - rule_id: b_species
      applies_to: "Every lot"
      rule: "Species identity and legal source are prerequisites; CPC inclusion is not a trade permit. Resolve bovine overlap explicitly."
      source_ids:
        - un-cpc-2025
        - woah-wildlife-2021
    - rule_id: b_routes
      applies_to: "Farm or capture"
      rule: "Farm includes real breeding/rearing and purchased-stock burden; capture includes authorized campaign, short holding and losses but no invented lifetime farm. Stop at actual live handover."
      source_ids:
        - fao-deer-farming
        - woah-wildlife-2021
    - rule_id: b_shared
      applies_to: "Shared facilities"
      rule: "Assign fencing, water/handling services to actual consuming nodes and periods once; exclude slaughter and post-gate buyer journey."
      source_ids:
        - fao-deer-farming
        - woah-transport
