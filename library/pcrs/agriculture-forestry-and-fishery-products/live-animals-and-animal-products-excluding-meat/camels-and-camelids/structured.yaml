measurement_rules:
  - id: reference_live_weight
    applies_to: "reference animals"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh immediately before transfer and retain scale point, calibration, individual/lot basis and any fasting or gut-fill convention."
  - id: count_to_mass
    applies_to: "entries, births, deaths and transfers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve head, species and class; convert only with measured weights or a documented matching-class mean."
  - id: feed_dry_matter
    applies_to: "forage, browse, concentrates and supplements"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg dry matter and kg as-fed"
    rule: "Preserve as-fed mass and dry-matter fraction; identify the reviewed method for unmeasured intake."
  - id: water_basis
    applies_to: "supplied water"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Separate managed supply from rainfall or unmanaged access and disclose meter coverage or estimation."
  - id: emission_basis
    applies_to: "CH4, N2O and NH3"
    required_property_ref:
      name: "Mass of named compound in final exchanges"
      uuid: ""
    required_unit: "kg CH4; kg N2O; kg NH3"
    rule: "Retain raw N-basis records; before final normalization convert kg N2O-N to kg N2O by 44/28 and kg NH3-N to kg NH3 by 17/14. Values already expressed as compound mass are not converted again. The final fixed-UUID exchange uses the mass of its named compound, never the N-basis amount. Keep raw species and elemental bases explicit; carbon-equivalent quantities do not replace CH4 mass."
  - id: inventory_reference_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual flow property"
      uuid: ""
    required_unit: "exchange unit per reference flow"
    rule: "The inventory and collection aggregation fields below express final amounts per declared reference flow. Keep all raw collection records, original denominator qualifiers, route/period strata, unit conversions and allocation requirements. For each flow, first obtain its attributable amount in its own numerator unit using the existing rules; then divide by the measured accepted reference-output quantity of the same scope and multiply by the declared reference quantity. Do not mix species, states, gates or incompatible routes; count transfers and shared burdens once. A missing, zero or untraceable accepted-output denominator is a blocking data-quality issue. Keep provisional QA ranges on their explicitly stated bases; they are not conversion factors or production defaults. Compute normalized amount = attributable amount * declared reference quantity / measured accepted reference-output quantity. Apply normalization once only; never divide an already normalized value again."
  - id: stage_throughput_linkage
    applies_to: "stage records and final package contributions"
    required_property_ref:
      name: "Actual flow property and its stated raw basis"
      uuid: ""
    required_unit: "retain native numerator and stage denominator units"
    rule: "Keep the original lot, event, cohort, period and stage denominators with their units. Reconstruct the attributable numerator A with measured stage quantity Q_stage and documented attribution before final normalization. If a quoted amount a_B corresponds to an explicit stage basis B_stage (for example, 1000 kg), use A = a_B * Q_stage / B_stage. If r_stage is already an intensity in exchange-unit per stage-unit, instead use A = r_stage * Q_stage, with no second division by B_stage. A raw attributable total is used directly. Final contribution = A * declared reference quantity / measured accepted final output. Convert compatible units explicitly and apply each attribution/allocation share exactly once; never treat a quoted amount or intensity as a raw total. Link stage transfers, losses, rejects, stocks, shared services and allocation to the same actual route, period and final-output stratum. For a 1000 kg basis retain 1000 kg explicitly. Do not assume unit yield, equal fresh/dried mass, equal head mass, equal dose quality or interchangeable gates. Missing links, unsupported unit conversion, zero denominators and untraceable allocation block dataset production. Stage-native datasets retain their own stage reference; package contributions are a separate projection."
