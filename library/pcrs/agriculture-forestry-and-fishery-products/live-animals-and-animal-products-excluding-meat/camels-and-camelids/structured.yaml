allocation_rules:
  - rule_id: complete_outputs
    applies_to: "animals, camel milk, fibre/hair and exported manure"
    rule: "Enumerate intended outputs and hand-offs; milk is camel-only and fibre follows actual species/state. Mortalities and untransferred residues are loss/waste."
    source_ids:
      - fao-ruminant-lca-2013
      - fao-leap-nutrient-flows-2018
  - rule_id: partition_first
    applies_to: "species, routes, activities, periods and outputs"
    rule: "Directly assign measured feed, water, movement, manure, energy and output burdens before residual allocation."
    source_ids:
      - fao-ruminant-lca-2013
  - rule_id: residual_allocation
    applies_to: "inseparable joint outputs"
    rule: "Use representative farm-gate economic value unless reviewed physical causation is demonstrated; disclose prices, currency, period and sensitivity."
    source_ids:
      - fao-ruminant-lca-2013
  - rule_id: period_attribution
    applies_to: "breeding/replacement animals and long-lived assets"
    rule: "Link events to phases/periods, attribute over actual service and prohibit later duplicate attribution."
    source_ids:
      - fao-ruminant-lca-2013
  - rule_id: shared_asset_attribution
    applies_to: "shared watering, shelter, handling, vehicles and manure assets"
    rule: "Enumerate consumers and periods; prefer metering, then operating hours, animal-days or live-weight-time; count once."
    source_ids:
      - fao-ruminant-lca-2013
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd_events
      process_id: "managed_camelid_production"
      flow_role: "entries, births, class changes, transfers, deaths and reference output"
      record_type: "herd, weight and transfer records"
      raw_fields: "id; species; class; sex; purpose; event; date; head; weight; scale; origin/destination"
      collection_method: "calibrated weighing linked to herd records; Raw aggregation requirements: reconcile opening + entries + births = closing + transfers + deaths; normalize transferred mass. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "each event"
      temporal_coverage: "complete cohort/period"
      site_scope: "all represented groups"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, signed transfer, reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_movement
      process_id: "managed_camelid_production"
      flow_role: "feed, browse, grazing and managed movement"
      record_type: "invoice, ration, land and movement log"
      raw_fields: "identity; source; as-fed; dry matter; class; parcel; distance; duration; refusals"
      collection_method: "weigh supply; declare method for unmeasured intake; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg; animal-days; km"
      frequency: "event/period"
      temporal_coverage: "all phases"
      site_scope: "group, land and shelter"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice, analysis, land/movement logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_health_inputs
      process_id: "managed_camelid_production"
      flow_role: "health inputs"
      record_type: "treatment and purchase record"
      raw_fields: "product; formulation; dose; quantity; species/class; date; purpose; discard"
      collection_method: "reconcile treatments, purchases and stock; Raw aggregation requirements: sum by formulation. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "dose; kg; L"
      frequency: "treatment"
      temporal_coverage: "full period"
      site_scope: "all groups"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed log, invoice, stock balance; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_water_energy_transport
      process_id: "managed_camelid_production"
      flow_role: "water, energy and transport"
      record_type: "meter, invoice, fuel and trip logs"
      raw_fields: "source/carrier; quantity; activity; cargo; mass; distance; vehicle; date"
      collection_method: "meters, invoices, tanks and route records; Raw aggregation requirements: direct assignment, otherwise documented driver. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3; kg; L; kWh; MJ; t*km"
      frequency: "month/trip/event"
      temporal_coverage: "full period"
      site_scope: "all relevant activities"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, invoice, trip and allocation records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_outputs_losses
      process_id: "managed_camelid_production"
      flow_role: "milk, fibre, mortality and other outputs/losses"
      record_type: "output, transfer, mortality and waste records"
      raw_fields: "identity; species; mass; basis; class; date; destination; cause; fate"
      collection_method: "weigh/meter; matching-class estimate only for mortality; Raw aggregation requirements: aggregate by identity and hand-off; separate internal use, product and waste. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; L; head"
      frequency: "event"
      temporal_coverage: "full period"
      site_scope: "all groups/gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale/meter, transfer and loss logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure_emissions
      process_id: "managed_camelid_production"
      flow_role: "manure pathways and emissions"
      record_type: "population, feed, excretion, pathway and climate records"
      raw_fields: "species/class; animal-days; feed/energy; N; pathway; storage; climate; tier; factors"
      collection_method: "records plus declared reviewed equations; Raw aggregation requirements: calculate by species/class/period/pathway and reconcile material. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg manure; kg CH4; kg N2O; kg NH3"
      frequency: "month/phase"
      temporal_coverage: "all phases/pathways"
      site_scope: "deposition, collection, storage, application, export"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records, worksheet, factor provenance; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "managed_camelid_production"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "managed_camelid_production"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: normalize_output
      applies_to: "all rows"
      rule: "attributable period amount / accepted farm-gate live weight; preserve raw species/route records."
      inputs:
        - amount
        - "transferred live weight"
      output: "amount/kg reference"
      source_ids:
        - fao-ruminant-lca-2013
    - id: herd_balance
      applies_to: "herd events"
      rule: "opening + entries + births = closing + transfers + deaths; class transitions are linked, not new animals."
      inputs:
        - events
      output: "reconciled head balance"
      source_ids:
        - fao-ruminant-lca-2013
    - id: dry_matter
      applies_to: "feed/browse"
      rule: "as-fed mass × measured/supplier dry-matter fraction; declare method for unmeasured intake."
      inputs:
        - as-fed
        - fraction
        - "land records"
      output: "kg dry matter"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: enteric_methane
      applies_to: "enteric CH4"
      rule: "Apply declared tier by species/category and period; retain activity and factors."
      inputs:
        - category
        - animal-days
        - "feed/energy"
        - factors
      output: "kg CH4"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: manure_emissions
      applies_to: "manure CH4, N2O and NH3"
      rule: "Apply the declared reviewed equations by animal category, excretion and manure pathway. Retain raw N-basis records; before final normalization convert kg N2O-N to kg N2O by 44/28 and kg NH3-N to kg NH3 by 17/14. Values already expressed as compound mass are not converted again. The final fixed-UUID exchange uses the mass of its named compound, never the N-basis amount."
      inputs:
        - category
        - "excretion/N"
        - pathway
        - climate
        - factors
      output: "kg CH4, N2O, NH3"
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrient-flows-2018
    - id: transport_service
      applies_to: "included transport"
      rule: "tonnes × included one-way km."
      inputs:
        - "cargo mass"
        - distance
      output: "t*km"
      source_ids:
        - fao-ruminant-lca-2013
    - id: calc_feed_supply_and_intake
      applies_to: "feed_browse"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
    - id: calc_manure_n2o_coverage
      applies_to: "direct_n2o; indirect_n2o"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-2019-livestock-manure
        - ipcc-managed-soils-2019
  data_quality_requirements:
    - id: identity_gate
      applies_to: "reference output"
      requirement: "Declare species, class/purpose, route, geography, period, weighing and transfer."
      evidence: "herd, scale, transfer and metadata records"
    - id: route_specificity
      applies_to: "all rows"
      requirement: "Separate materially different pastoral/mobile, mixed and housed routes."
      evidence: "route, movement, feed, water, shelter and aggregation records"
    - id: temporal_completeness
      applies_to: "herd/assets"
      requirement: "Cover material phases/events or disclose missing phases and supplier datasets."
      evidence: "herd calendar and event records"
    - id: output_reconciliation
      applies_to: "outputs/losses"
      requirement: "Reconcile animals, applicable milk/fibre, manure, deaths, closing stock and internal use."
      evidence: "output, inventory, mortality and waste records"
    - id: manure_balance
      applies_to: "nutrients/emissions"
      requirement: "Reconcile deposition, storage, treatment, application, export and waste."
      evidence: "pathway balance and transfer records"
    - id: shared_traceability
      applies_to: "shared assets"
      requirement: "Retain consumers, periods, measurements, driver and single-count evidence."
      evidence: "meters, logs and attribution worksheet"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference output"
    rule: "Reject meat, milk, fibre, skin, service or slaughtered identities; require fixed live-animal UUID, species/route qualifiers and farm-gate live-weight basis."
    source_ids:
      - fao-gleam
  - rule_id: validate_route
    applies_to: "route variants"
    rule: "Require one species/route or transparent aggregation and matching feed, movement, water, shelter, manure, energy and output records."
    source_ids:
      - fao-gleam
      - ipcc-2019-livestock-manure
  - rule_id: validate_periods
    applies_to: "multi-period production"
    rule: "Reconcile stocks/events by species and period and reject duplicate animal, replacement or asset burdens."
    source_ids:
      - fao-ruminant-lca-2013
  - rule_id: validate_outputs
    applies_to: "reference/co-products"
    rule: "Require complete outputs/losses, hand-offs, partitioning and residual method; reject camel milk on South American camelid routes and duplicate hand-offs."
    source_ids:
      - fao-ruminant-lca-2013
      - fao-leap-nutrient-flows-2018
  - rule_id: validate_shared_assets
    applies_to: "shared assets"
    rule: "Require at least two consumers/periods, a service boundary, one driver and no duplicate burden."
    source_ids:
      - fao-ruminant-lca-2013
  - rule_id: validate_emissions
    applies_to: "enteric/manure rows"
    rule: "Require category, activity, pathway, tier, factor provenance, species/basis and reconciliation; factors are inputs, not observed amounts."
    source_ids:
      - ipcc-2019-livestock-manure
      - fao-leap-nutrient-flows-2018
  - rule_id: validate_flow_identity
    applies_to: "water, energy, transport"
    rule: "Concrete publication requires one verified UUID matching set/group, property, unit, geography and use; unresolved cards cannot carry fixed UUIDs."
    source_ids: []
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-2019-livestock-manure
      - ipcc-managed-soils-2019
published_dataset_profile:
  dataset_role: "Foreground farm-level package for managed live camel/camelid production and transfer."
  downstream_use: "secondary_dataset; background_dataset after identity, route, allocation, temporal and geography review."
  allowed_use: "Farm-gate inventories matching species, class, purpose, route, geography, period and live-weight basis; input to downstream animal-product models."
  excluded_use: "Meat, milk-only or fibre-only reference products, other ruminants, services, slaughter or post-transfer transport without separate datasets."
  required_metadata: "CPC; species; class/purpose; sex/genotype where material; route/mobility; feed/browse; water; manure; geography; period; shared assets; weighing; transfer gate."
  required_quality_disclosure: "Coverage, missing phases, estimation, aggregation, allocation/prices, shared drivers, emission method/factors, unresolved identities and Range overrides."
  update_trigger: "Changed boundary/gate; new species/route evidence; compatible UUID; revised livestock/manure method; or reviewed evidence replacing provisional ranges."
data_sources:
  - id: "fao-gleam"
    type: "official_guidance"
    reference: "FAO, *Global Livestock Environmental Assessment Model*. <https://www.fao.org/gleam> (retrieved 2026-09-29)."
    used_for: "system coverage, routes, inventory and outputs"
  - id: "fao-ruminant-lca-2013"
    type: "official_guidance"
    reference: "FAO, *Greenhouse gas emissions from ruminant supply chains — A global life cycle assessment*, 2013. <https://www.fao.org/docrep/018/i3461e/i3461e.pdf> (retrieved 2026-09-29)."
    used_for: "boundary, route, periods, allocation and collection"
  - id: "fao-leap-nutrient-flows-2018"
    type: "official_guidance"
    reference: "FAO LEAP, *Nutrient flows and associated environmental impacts in livestock supply chains*, 2018. <https://openknowledge.fao.org/handle/20.500.14283/ca1328en> (retrieved 2026-09-29)."
    used_for: "manure, nutrient, ammonia and pathway rules"
  - id: "ipcc-2019-livestock-manure"
    type: "method_factor"
    reference: "IPCC, *2019 Refinement, Volume 4, Chapter 10: Emissions from Livestock and Manure Management*. <https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf> (retrieved 2026-09-29)."
    used_for: "category, feed, CH4, N2O, methods and factors"
  - id: "fao-feed-loss-accounting-2018"
    type: "official_guidance"
    reference: "[FAO 2018, Environmental performance of pig supply chains, section 11.2.2](https://www.fao.org/4/i8686en/I8686EN.pdf)"
    used_for: "Feed supply versus intake and waste burden, not animal parameters. Applying this accounting principle to the declared taxon is this PCR's methodological choice; no pig diet or emission factor is transferred."
  - id: "ipcc-managed-soils-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 11](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf)"
    used_for: "Direct/indirect nitrogen pathways and coordination of manure storage with managed-soil emissions; select applicable species and management evidence."
  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
