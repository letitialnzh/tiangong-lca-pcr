      frequency: "each issue"
      temporal_coverage: "all included periods"
      site_scope: "each site"
      aggregation_rule: "delivery minus stock change and loss"
      quality_evidence: "invoices and store balance"
    - protocol_id: cp_utilities
      process_id: "parents_growth"
      flow_role: "water and energy"
      record_type: "meter/invoice"
      raw_fields: "water, electricity/fuel carrier, cohort and meter period"
      collection_method: "meter and billing record"
      unit: "kg; MJ"
      frequency: "monthly"
      temporal_coverage: "all included periods"
      site_scope: "each site"
      aggregation_rule: "sum by carrier, allocate shared service once"
      quality_evidence: "calibrated meter/bill"
    - protocol_id: cp_supplies
      process_id: "birth"
      flow_role: "foaling materials"
      record_type: "care/material ledger"
      raw_fields: "material, mass, cohort, date"
      collection_method: "weighed material issue"
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "foaling and nursing periods"
      site_scope: "each site"
      aggregation_rule: "sum consumed material"
      quality_evidence: "inventory and care record"
    - protocol_id: cp_manure
      process_id: "parents_growth"
      flow_role: "managed manure"
      record_type: "handling ledger"
      raw_fields: "mass or activity basis, period, treatment and destination"
      collection_method: "weighed path or documented estimate"
      unit: "kg"
      frequency: "each handling event"
      temporal_coverage: "all included periods"
      site_scope: "each site"
      aggregation_rule: "sum once per path"
      quality_evidence: "treatment/recipient receipt"
    - protocol_id: cp_waste
      process_id: "birth_handover"
      flow_role: "death or disposal"
      record_type: "incident log"
      raw_fields: "animal ID, mass, cause, destination, date"
      collection_method: "observation and weighing"
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "all included periods"
      site_scope: "each site"
      aggregation_rule: "sum disposed mass by destination"
      quality_evidence: "veterinary and disposal evidence"
  calculation_rules:
    - id: calc_stock
      applies_to: "hybrid type and period"
      rule: "opening + births/purchases − transfers/sales/deaths = closing in heads; separately reconcile each weighed gate mass"
      inputs:
        - IDs
        - events
        - head
        - kg
        - date
      output: "stock balance and accepted reference kg"
      source_ids:
        - fao-equine-1994
    - id: calc_maternal
      applies_to: "parent phase"
      rule: "attribute measured maternal animal-days and resources to documented offspring cohort by mare or jenny route; sire service by actual use"
      inputs:
        - parents
        - events
        - resources
        - periods
      output: "route-specific parent burden"
      source_ids:
        - fao-equine-1994
    - id: calc_manure
      applies_to: "manure path"
      rule: "sum measured mass; any model uses observed animal activity and documented climate/path-specific method rather than a universal hybrid factor"
      inputs:
        - animal-days
        - "measured mass"
        - path
      output: "manure by path"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_normalize
      applies_to: "all nodes"
      rule: "attributable recorded amount divided by measured node output kg; link each transfer once to accepted reference kg"
      inputs:
        - records
        - "output kg"
        - shares
      output: "quantity per kg accepted hybrid"
      source_ids:
        - fao-equine-1994
  data_quality_requirements:
    - id: dq_parentage
      applies_to: "hybrid route"
      requirement: "Verify dam and sire species/sex; uncertain parentage blocks exact mule/hinny route assignment."
      evidence: "breeding register"
    - id: dq_mass_gate
      applies_to: "reference"
      requirement: "Live weighed mass, head count and actual producer gate reconcile."
      evidence: "calibrated scale and transaction"
    - id: dq_period
      applies_to: "all phases"
      requirement: "Dated inputs, assets, outputs, replacements and closing stock link to reporting periods."
      evidence: "animal and resource logs"
    - id: dq_destination
      applies_to: "manure, deaths, culls"
      requirement: "Product handover and waste destination must be distinct."
      evidence: "recipient/disposal evidence"
validation_rules:
  - rule_id: validate_parentage
    applies_to: "all routes"
