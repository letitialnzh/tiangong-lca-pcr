system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Include upstream purchased animals, feed, forage, water, bedding, electricity, fuel, care materials and services where used, together with parental management, mating, gestation, foaling, nursing, hybrid growth, manure handling, selection and actual live handover. Declare grazing rather than treating it as purchased feed. Attribute shared stables, water infrastructure and equipment once across nodes and periods. Saleable parent culls or manure are independent products only with actual handover; otherwise stock change, residue or waste. Do not claim a hybrid breeding-parent output or universal infertility outcome. Mating/gestation is managed biological production; birth and surviving-foal transfer are independent because they establish a live output with a measured handoff, while final selection is an independent acceptance gate (fao-equine-1994)."
      source_ids: []
    - rule_id: boundary_identity
      applies_to: "all routes"
      rule: "Only living horse–ass hybrids enter the reference output; horse, ass and work-service identities cannot substitute."
      source_ids:
        - fao-equine-1994
    - rule_id: boundary_maternal_route
      applies_to: "breeding"
      rule: "Record mare × jack or jenny × stallion as mutually exclusive per offspring, with actual maternal inputs and periods."
      source_ids:
        - fao-equine-1994
    - rule_id: boundary_gate
      applies_to: "handover"
      rule: "End at observed live acceptance and exclude downstream work, transport service and slaughter."
      source_ids:
        - fao-equine-1994
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Opening parent and hybrid stock by species/type, age/class, ownership, count, mass and period; identify purchased stock and first foreground stage."
  starting_condition_role: "Declared foreground start, not zero-burden acquisition."
  product_classification_scope: "Living horse–ass hybrids only; parent animals keep their own upstream identities."
  recursive_input_rule: "Purchased mule/hinny young stock carries one upstream dataset to its purchase gate; do not recursively count earlier growth twice."
  upstream_dataset_requirement: "Purchased animals, feed, materials, utilities and services need compatible upstream datasets or disclosed gaps."
  disclosure: "Maternal route, actual gate, periods, animal ledger, upstream coverage, co-products and shared-asset attribution."
