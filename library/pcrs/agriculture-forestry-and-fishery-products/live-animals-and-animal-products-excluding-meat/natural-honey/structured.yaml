allocation_rules:
  - rule_id: output_set
    applies_to: "colony, harvest, extraction"
    rule: "List every independently transferred honey, wax, propolis, queen or colony product at its actual handover. Wax retained in sold comb honey is part of the sale presentation, not independently transferred wax. Incidental matter and rejects are not products without evidence."
    source_ids:
      - fao-bee-products
      - codex-honey-2022
  - rule_id: allocation_precedence
    applies_to: "genuinely joint burdens"
    rule: "Separate directly metered processes first. Allocate inseparable joint burdens to independently transferred outputs by measured economic value at the same gate and period; retain prices, masses and sensitivity. Do not also apply substitution or a second mass allocation."
    source_ids:
      - fao-bee-products
  - rule_id: period_attribution
    applies_to: "managed colony"
    rule: "Assign overwintering, colony buildup, carry-over stores, replacement and termination to dated service/harvest periods based on observed service and output; no double booking across seasons."
    source_ids:
      - fao-beekeeping-2021
  - rule_id: shared_asset
    applies_to: "hive, transport, extractor"
    rule: "Identify each consuming node and service period. Attribute shared burdens once by observed hours, trips or throughput."
    source_ids:
      - fao-beekeeping-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_colony
      process_id: "managed"
      flow_role: "managed feed, water, comb"
      record_type: "hive log"
      raw_fields: "colony id; route; feed issue/return; water; season; mature comb"
      collection_method: "dated hive logs and invoices; Raw aggregation requirements: sum by colony-season. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "full harvest season"
      site_scope: "apiary"
      aggregation_rule: "per reference flow"
      quality_evidence: "hive logs and stock reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_assets
      process_id: "managed"
      flow_role: "hive and shared assets"
      record_type: "asset register"
      raw_fields: "asset id; mass; service life; user node; hours"
      collection_method: "invoice and service log; Raw aggregation requirements: assign once by use. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, h"
      frequency: "purchase and annual"
      temporal_coverage: "complete service life"
      site_scope: "all consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset register; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_migration
      process_id: "harvest"
      flow_role: "hive freight"
      record_type: "trip log"
      raw_fields: "hive load; origin; destination; distance; mode"
      collection_method: "dispatch/odometer; Raw aggregation requirements: load times distance. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, km"
      frequency: "each trip"
      temporal_coverage: "represented season"
      site_scope: "migratory apiary"
      aggregation_rule: "per reference flow"
      quality_evidence: "trip evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_harvest
      process_id: "harvest"
      flow_role: "comb and rejects"
      record_type: "lot log"
      raw_fields: "managed or wild source; date; gross comb; sampled honey; wax; loss; destination"
      collection_method: "calibrated scale and sample; Raw aggregation requirements: reconcile harvested and lost. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full season"
      site_scope: "producer/source"
      aggregation_rule: "per reference flow"
      quality_evidence: "ticket and sample log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_extraction
      process_id: "extraction"
      flow_role: "honey, wax, utilities"
      record_type: "batch log"
      raw_fields: "comb input; honey; wax; rejects; water; energy; moisture"
      collection_method: "scales, meters and assay; Raw aggregation requirements: reconcile material and utility. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, MJ"
      frequency: "each batch"
      temporal_coverage: "full season"
      site_scope: "producer room"
      aggregation_rule: "per reference flow"
      quality_evidence: "batch sheet/calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grading
      process_id: "grading"
      flow_role: "reference and grade outputs"
      record_type: "sale lot"
      raw_fields: "presentation; sale gross; sampled honey/wax/other fractions; accepted; downgrade; reject; gate; prices"
      collection_method: "weighed sale plus representative destructive comb sample; Raw aggregation requirements: gross less wax/other = honey constituent. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, fraction"
      frequency: "each lot and sample"
      temporal_coverage: "full season"
      site_scope: "producer gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "sale ticket and sample method; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: comb_honey_conversion
      applies_to: "comb lots"
      rule: "Honey kg = sold comb gross kg minus retained comb wax kg minus measured other non-honey kg. Use lot-representative separation or validated sampling with uncertainty; do not assume gross comb equals honey."
      inputs:
        - "gross mass"
        - "honey/wax/other sample fractions"
      output: "reference honey kg"
      source_ids:
        - codex-honey-2022
    - id: honey_wax_balance
      applies_to: "each lot"
      rule: "Reconcile honey into accepted, downgraded, lost and stock-change masses; separately reconcile wax retained, recovered and discarded."
      inputs:
        - harvest
        - extraction
        - "grade records"
      output: "mass residual"
      source_ids:
        - fao-bee-products
    - id: season_asset_assignment
      applies_to: "shared services"
      rule: "Attribute each asset burden by actual node-period service share; all consumer-period shares sum to one."
      inputs:
        - "asset and production logs"
      output: "assigned burden"
      source_ids:
        - fao-beekeeping-2021
    - id: normalization
      applies_to: "all exchanges"
      rule: "Divide attributable inventory by saleable honey constituent kg, not comb sale gross kg."
      inputs:
        - "attributed inventory"
        - "honey kg"
      output: "exchange per reference kg"
      source_ids:
        - codex-honey-2022
  data_quality_requirements:
    - id: route_identity
      applies_to: "every lot"
      requirement: "Identify stationary, migratory or wild source without imputing management to wild lots."
      evidence: "source/route log"
    - id: comb_fraction
      applies_to: "comb sale"
      requirement: "Record sample size, separation method, honey/wax fractions and uncertainty; unsupported conversion blocks quantified comb dataset."
      evidence: "sample record"
    - id: lot_balance
      applies_to: "all lots"
      requirement: "Explain honey and wax residuals, grade/reject destination and stocks."
      evidence: "reconciled batch sheet"
    - id: shared_periods
      applies_to: "assets/colony"
      requirement: "Show dated service and single attribution of colony, hive, freight and extractor."
      evidence: "asset/season ledger"
validation_rules:
  - rule_id: natural_identity
    applies_to: "reference"
    rule: "Reject artificial/adulterated or sweetener-added product; require origin, moisture, presentation and gate."
    source_ids: []
  - rule_id: comb_reference_mass
    applies_to: "comb sale"
    rule: "Require sample-derived honey constituent and retained wax; gross comb mass cannot be used silently as reference."
    source_ids: []
  - rule_id: wax_no_double_count
    applies_to: "comb and wax"
    rule: "Reject the same wax mass retained in sold comb and independently exported as recovered wax."
    source_ids: []
  - rule_id: terminal_output_once
    applies_to: "raw farm honey and saleable honey"
    rule: "If the raw farm-gate output is the saleable reference lot, treat the final handover card as a reporting roll-up, not a second physical product exchange; otherwise do not activate the raw farm card."
    source_ids: []
  - rule_id: route_exclusivity
    applies_to: "all lots"
    rule: "One managed stationary, managed migratory or wild route per lot; wild lots cannot bear managed feed/hive/migration."
    source_ids: []
  - rule_id: states_and_destinations
    applies_to: "all outputs"
    rule: "Check harvested, conditioned, downgraded, rejected and saleable states plus actual gate and destination."
    source_ids: []
  - rule_id: period_once
    applies_to: "multi-season/shared"
    rule: "Reject duplicated colony or shared-asset burdens across periods and nodes."
    source_ids: []
  - rule_id: concrete_binding
    applies_to: "all exchanges"
    rule: "Expand conditional flow identities from actual records and confirm every final exchange UUID; unresolved identities remain blank."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground natural-honey production dataset at producer gate."
  downstream_use: "Secondary/background use after route- and state-matched review."
  allowed_use: "Natural honey with known producer gate, presentation, constituent mass and allocation."
  excluded_use: "Artificial honey, blends, industrial refinement, unmeasured comb conversion and post-gate retail."
  required_metadata: "Route, colony/source, season, floral/honeydew origin, moisture, extraction, presentation, gate, comb gross/honey/wax masses, grade and co-product transfer."
  required_quality_disclosure: "Sampling uncertainty, mass residuals, estimated utilities, UUID gaps and shared-burden allocation."
  update_trigger: "New route, extraction technology, origin mix, presentation, co-product handover or identity evidence."
data_sources:
  - id: "codex-honey-2022"
    type: "standard"
    reference: "Codex CXS 12-1981 Standard for Honey, amended 2022; https://www.fao.org/fao-who-codexalimentarius/codex-texts/standards/en"
    used_for: "Natural-honey identity, presentation, quality and mass basis."
  - id: "fao-bee-products"
    type: "official_guidance"
    reference: "FAO, Value-added products from beekeeping, Ch. 2; https://www.fao.org/4/w0076e/w0076e05.htm"
    used_for: "Colony, harvest, extraction, honey/wax outputs."
  - id: "fao-beekeeping-2021"
    type: "official_guidance"
    reference: "FAO, Good beekeeping practices for sustainable apiculture (2021); https://www.fao.org/family-farming/detail/en/c/1442505/"
    used_for: "Managed production, seasonal records and service attribution."
