allocation_rules:
  - rule_id: a_avoid
    applies_to: "all nodes"
    rule: "Separate independent output processes or records first. Internal split, graded transfer and package handover of the same bees are one lineage, not three final product credits."
    source_ids:
      - fao-value-bees
  - rule_id: a_outputs
    applies_to: "propagation and grading"
    rule: "Declare each actual independently handed-over live queen, colony, nucleus, worker package, honey, wax or service; treat mortality and unusable residues as waste. Do not allocate a pollination-service burden without an evidenced service output."
    source_ids:
      - fao-value-bees
  - rule_id: a_choice
    applies_to: "true joint production"
    rule: "When separation is impossible, document a PCR-specific physical causal attribution if supported; otherwise document economic allocation with contemporaneous value evidence and sensitivity. No universal honey/live-bee split is prescribed."
    source_ids:
      - fao-value-bees
  - rule_id: a_period
    applies_to: "shared colony and assets"
    rule: "Index breeder establishment, queen rearing, splits, feeding, capture, grading and handover by reporting period. Allocate shared hive, frame and equipment service to consuming nodes and periods using recorded use/occupation, with one owner for each burden."
    source_ids:
      - fao-practical-bees
dataset_production:
  collection_protocols:
    - protocol_id: cp_live_stock
