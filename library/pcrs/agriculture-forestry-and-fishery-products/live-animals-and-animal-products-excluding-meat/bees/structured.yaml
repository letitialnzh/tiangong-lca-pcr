      collection_method: "weigh and receipt; Raw aggregation requirements: sum distinct output lots. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each handover"
      temporal_coverage: "full production period"
