system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Live bee stock, queen stock, nucleus or package inputs, hive consumables, feed, water, medicines, pest-control products, packaging, cages, fuel, electricity, and purchased services when they are part of the foreground data package."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Apiary establishment and colony management: splits, queen rearing, feeding, inspections, hive maintenance, moving colonies inside the foreground system, and swarm or loss management."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Bee health and pest control: monitoring, sampling, treatments, certification checks, and recordkeeping for diseases and pests where material."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "Live-bee packing, caging, holding, ventilation, temperature control, dispatch, and delivery when included in the declared gate."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "Honey extraction, wax rendering, pollination service delivered to crops, and downstream crop production are outside the default boundary. Hive boxes and durable equipment are included only when the declared data package scope includes capital goods or when replacement materials cross the foreground boundary as consumables."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "This boundary is a data-production abstraction. Declared parent colonies, purchased queens, packages, or nucleus colonies are starting-condition records. Same-category live-bee inputs are not recursively traced as a new live-bee PCR inside the same package; their identity, unit type, mass or count conversion, source, and prior-burden treatment are disclosed."
      source_ids: []
