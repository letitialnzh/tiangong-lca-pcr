measurement_rules:
  - id: reference_live_bee_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg live bee mass"
    rule: "The reference flow must be expressed as kg live bees at the declared transfer gate."
  - id: count_to_mass_conversion
    applies_to: "colony, package, queen, brood-frame, or bee-count records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg live bee mass"
    rule: "Count-based live-bee records must include measured mass or a documented conversion by unit type, bee count, or colony strength."
  - id: colony_strength_basis
    applies_to: "colony and nucleus units"
    required_property_ref:
      name: "Number of items and Mass"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "frames, seams, adult bee count, brood area, or kg live bee mass"
    rule: "Declare the colony-strength metric used and preserve enough information to convert to the reference mass where needed."
  - id: supplemental_feed_basis
    applies_to: "sugar syrup, candy, pollen substitute, and feed supplements"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg sugar, kg dry matter, or kg as-fed"
    rule: "Feed records must state concentration, dry matter, sugar content, or as-fed basis before normalization."
  - id: treatment_active_ingredient_basis
    applies_to: "veterinary and pest-control treatments"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg active ingredient or product-specific unit"
    rule: "Treatment records must identify product, active ingredient where available, dose, treated colony count, and withholding or certification relevance."
  - id: energy_inventory
    applies_to: "electricity, fuel, refrigeration, holding, and dispatch energy"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ or kWh"
    rule: "State whether each energy value is final electricity, fuel lower heating value, refrigeration energy, or transport service energy."
