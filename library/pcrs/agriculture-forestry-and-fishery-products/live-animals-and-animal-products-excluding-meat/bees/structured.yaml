      raw_fields: "lot;container_type;container_mass;reuse_share;feed_mass;date"
      collection_method: "weigh and log materials; Raw aggregation requirements: sum material by lot, reusable share once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "full production period"
      site_scope: "all presentation lots"
      aggregation_rule: "per reference flow"
      quality_evidence: "issue log;asset record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_handover
      process_id: "present"
      flow_role: "live goods by gate"
      record_type: "handover certificate"
      raw_fields: "lot;species;configuration;gate;bee_mass;queen_count;count_mass_bridge;buyer;date"
      collection_method: "weigh bee-only mass, inspect viability, count and sign receipt; Raw aggregation requirements: one final gate per lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;item"
      frequency: "each handover"
      temporal_coverage: "full production period"
      site_scope: "all delivered lots"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale certificate;receipt; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
  calculation_rules:
    - id: c_bee_mass
      applies_to: "reference and handover"
      rule: "Living-bee biomass = lot gross weight minus container, hive/comb and feed; queen lots require their own measured mass."
      inputs:
        - cp_handover
        - cp_package
      output: "kg bee-only live mass"
      source_ids:
        - fao-value-bees
    - id: c_balance
      applies_to: "grading and capture"
      rule: "Incoming live mass = accepted + downgraded + dead + released + recorded stock change; stage transfers are not repeated final output."
      inputs:
        - cp_capture
        - cp_grade
        - cp_losses
      output: "lot mass-balance difference"
      source_ids:
        - fao-value-bees
    - id: c_shared
      applies_to: "shared assets"
      rule: "Asset burden × recorded node-period use share; shares for one asset sum to no more than 1."
      inputs:
        - cp_assets
      output: "node-period asset burden"
      source_ids:
        - fao-practical-bees
  data_quality_requirements:
    - id: q_species
      applies_to: "all lots"
      requirement: "Record species and route limits that cannot be extrapolated to other bee taxa."
      evidence: "species identification and route log"
    - id: q_mass
      applies_to: "handover lots"
      requirement: "Retain bee-only weighing, package subtraction and queen count-to-mass bridge; absent bridge means queen count only."
      evidence: "weighing and handover certificate"
    - id: q_period
      applies_to: "cross-period colonies and assets"
      requirement: "Link each source, propagation, split, capture, grade, handover and shared asset to period and node."
      evidence: "event and asset logs"
    - id: q_complete
      applies_to: "outputs and losses"
      requirement: "Close accepted, downgraded, dead, released and stock change by lot; record independent co-products and destinations."
      evidence: "lot balance and receipt"
validation_rules:
  - rule_id: v_identity
    applies_to: "every delivered lot"
    rule: "Reject missing species, viable state, sale configuration, queen/brood/worker status, actual producer gate or separation of bee-only biomass from hive/feed/package mass."
    source_ids:
      - un-cpc-3
  - rule_id: v_count
    applies_to: "queen-only sale"
    rule: "A queen-by-count lot without measured lot-specific mass is reported only as count and is not pooled with kg biomass comparison; no colony-strength equivalence is inferred."
    source_ids:
      - fao-queen-rearing
  - rule_id: v_route
    applies_to: "managed and capture"
    rule: "Require managed parent plus variant-specific route delta evidence, or lawful capture authorization and capture-to-grading mass balance. Reject assumed non-Apis husbandry by analogy alone."
    source_ids:
      - un-cpc-3
      - fao-value-bees
  - rule_id: v_balance
    applies_to: "all phases"
    rule: "Reconcile incoming, accepted, downgraded, dead, released and final live states by lot and gate; trace co-products, periods and shared assets once; no duplicate final live output."
    source_ids:
      - fao-value-bees
  - rule_id: v_binding
    applies_to: "flow identities"
    rule: "A UUID supports only an exact card. The platform farm-gate Mass bee product must not bind queen count, capture-site handover or broad reference."
    source_ids:
      - un-cpc-3
published_dataset_profile:
  dataset_role: "foreground living-bee production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Species-, configuration- and gate-matched living-bee goods with declared measurement and allocation."
  excluded_use: "Pollination service, honey methodology, hive hardware, dead-bee goods, cross-configuration functional equivalence and unsupported count-to-mass conversion."
  required_metadata: "CPC and PCR identity; species; configuration; queen/worker/brood status; count and strength; bee-only mass; route and legal capture evidence; gate; reporting period; shared assets."
  required_quality_disclosure: "Lot measurement and count bridge, acceptance/loss reconciliation, source and co-output handovers, period attribution, concrete exchange resolution and unresolved UUIDs."
  update_trigger: "Change in species, sale configuration, capture law/route, producer gate, major management method, allocation or identity evidence."
