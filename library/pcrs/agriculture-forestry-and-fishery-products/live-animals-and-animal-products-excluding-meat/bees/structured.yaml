      unit: "kg"
      frequency: "at least monthly"
      temporal_coverage: "full production period"
      site_scope: "all managed apiaries"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter or bill; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_assets
      process_id: "colony_capture"
      flow_role: "hives frames traps"
      record_type: "asset register"
      raw_fields: "asset_id;mass;service_period;consumer_node;use_share"
      collection_method: "record acquisition, repair and service; Raw aggregation requirements: allocate recorded service once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;day"
