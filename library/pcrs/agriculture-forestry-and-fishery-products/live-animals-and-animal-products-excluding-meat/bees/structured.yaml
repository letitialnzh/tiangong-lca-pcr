dataset_production:
  collection_protocols:
    - protocol_id: cp_live_bee_stock_entry_records
      process_id: "live_bee_stock_entry"
      flow_role: "parent colony or purchased live bee stock"
      record_type: "purchase, split, queen, package, nucleus, brood-frame, or receiving record"
      raw_fields: "source; species; unit type; queen status; life stage; caste mix; colony strength; bee count or mass; health status; acquisition date; upstream burden treatment"
      collection_method: "receiving record, breeder certificate, health certificate, scale record, colony inspection, or count-to-mass conversion; original activity aggregation: convert unit records to live bee mass and reconcile accepted, rejected, dead, or escaped bees"
      unit: "kg live bee mass, colony, nucleus, package, queen, frame, or head"
      frequency: "per stock entry or batch"
      temporal_coverage: "production cycle"
      site_scope: "apiary, breeder, or stock-entry lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale record, receiving record, health certificate, inspection record"
    - protocol_id: cp_live_bee_colony_management_records
      process_id: "colony_management_and_feeding"
      flow_role: "managed live bee stock"
      record_type: "colony inspection, split, queen rearing, package production, or apiary management record"
      raw_fields: "colony id; unit type; queen status; brood stage; adult bee estimate; frame or seam count; date; management action"
      collection_method: "apiary log, inspection record, production batch record, or breeder log; original activity aggregation: reconcile live-bee stock entries, splits, losses, and outputs by unit type and mass conversion"
      unit: "colony, frame, seam, head, or kg live bee mass"
      frequency: "inspection, batch, week, month, or production cycle"
      temporal_coverage: "production cycle"
      site_scope: "apiary, breeder yard, queen yard, or package production unit"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "apiary log, inspection sheet, breeder record"
    - protocol_id: cp_feed_and_water_records
      process_id: "colony_management_and_feeding"
      flow_role: "supplemental feed and water"
      record_type: "feed issue, syrup preparation, water, or feeding record"
      raw_fields: "feed type; sugar concentration; dry matter or as-fed basis; product mass; water quantity; treated colonies; date"
      collection_method: "feed log, invoice, syrup mixing sheet, meter, or tank record; original activity aggregation: convert to kg sugar or dry matter where needed and allocate by colony, batch, or live-bee output"
      unit: "kg, L, m3, kg dry matter, kg sugar"
      frequency: "per feeding event, batch, or reporting period"
      temporal_coverage: "production cycle"
      site_scope: "apiary, feed room, or production batch"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, feed log, mixing sheet, meter record"
    - protocol_id: cp_energy_and_movement_records
      process_id: "colony_management_and_feeding"
      flow_role: "apiary energy and movement fuel"
      record_type: "electricity, fuel, equipment, or movement record"
      raw_fields: "carrier; quantity; route; operation; colonies served; period; allocation method"
      collection_method: "utility bill, fuel invoice, route log, equipment log, or telematics; original activity aggregation: convert to MJ or kWh and allocate to live-bee production using documented basis"
      unit: "kWh, MJ, L, kg fuel, km, or tonne-km"
      frequency: "operation, route, month, or cycle"
      temporal_coverage: "production cycle"
      site_scope: "apiary, route, holding room, or production site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, meter record, fuel log, route record"
    - protocol_id: cp_treatment_and_health_records
      process_id: "health_treatment_and_hive_maintenance"
      flow_role: "veterinary and pest-control treatments"
      record_type: "treatment, pest monitoring, medicine, or certification record"
      raw_fields: "product; active ingredient; dose; treated colony count; date; target pest or disease; certification relevance"
      collection_method: "treatment log, veterinary record, product label, laboratory result, health certificate, or inspection record; original activity aggregation: sum active ingredient or product amount and normalize to treated units and live-bee output"
      unit: "kg, L, dose, strip, item, or product-specific unit"
      frequency: "per treatment or inspection event"
      temporal_coverage: "production cycle"
      site_scope: "apiary, colony, queen yard, or package lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "treatment log, product label, inspection result, health certificate"
    - protocol_id: cp_hive_material_and_packaging_records
      process_id: "live_bee_stock_entry_health_treatment_and_hive_maintenance_live_bee_packing_and_dispatch"
      flow_role: "hive consumables and packaging"
      record_type: "material purchase, cage, frame, comb, package, or dispatch material record"
      raw_fields: "material type; mass; item count; capacity; reuse status; batch or shipment"
      collection_method: "inventory issue record, packing log, invoice, or unit mass specification; original activity aggregation: sum material mass and item count; allocate reusable materials by declared reuse or depreciation rule only when in scope"
      unit: "kg or item"
      frequency: "per batch, shipment, replacement, or reporting period"
      temporal_coverage: "production cycle or dispatch period"
      site_scope: "apiary, shop, packing room, or shipment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, packing log, inventory record"
    - protocol_id: cp_health_inspection_and_certification_records
      process_id: "health_treatment_and_hive_maintenance"
      flow_role: "healthy live bee unit for dispatch"
      record_type: "inspection, certification, or release record"
      raw_fields: "species; unit type; queen status; colony strength; disease or pest status; treatment status; release date"
      collection_method: "apiary inspection, veterinary certificate, lab result, or dispatch approval; original activity aggregation: identify accepted live-bee units and convert to reference mass"
      unit: "kg live bee mass, colony, package, queen, or frame"
      frequency: "per inspection, lot, or shipment"
      temporal_coverage: "dispatch cycle"
      site_scope: "apiary, breeder, or dispatch lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "certificate, inspection record, laboratory result"
    - protocol_id: cp_treatment_residue_and_waste_records
      process_id: "health_treatment_and_hive_maintenance"
      flow_role: "treatment residues and condemned bee material"
      record_type: "residue, contaminated comb, condemned colony, or disposal record"
      raw_fields: "waste type; mass; treatment product; colony or batch; fate"
      collection_method: "scale record, disposal ticket, treatment log, or inspection record; original activity aggregation: sum residue and condemned material mass by fate"
      unit: "kg"
      frequency: "per event or reporting period"
      temporal_coverage: "production cycle"
      site_scope: "apiary, treatment area, or waste route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "disposal ticket, treatment log, inspection record"
    - protocol_id: cp_live_bee_packing_dispatch_records
      process_id: "live_bee_packing_and_dispatch"
      flow_role: "declared transferred live bees"
      record_type: "package, queen cage, colony, nucleus, brood frame, or shipment record"
      raw_fields: "unit type; unit count; bee count or mass; queen status; shipment id; gate; date; receiver; health status"
      collection_method: "packing log, scale record, shipping document, certificate, or count-to-mass conversion; original activity aggregation: convert package or colony records to kg live bee mass and reconcile dispatched output"
      unit: "kg live bee mass, package, colony, queen, frame, or head"
      frequency: "per shipment or batch"
      temporal_coverage: "dispatch period"
      site_scope: "packing room, apiary, holding room, or route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "packing log, scale record, dispatch note, health certificate"
    - protocol_id: cp_dispatch_energy_and_transport_records
      process_id: "live_bee_packing_and_dispatch"
      flow_role: "dispatch energy and transport"
      record_type: "holding, ventilation, cooling, carrier, fuel, or route record"
      raw_fields: "route; distance; vehicle; energy; fuel; carrier invoice; shipment mass; holding duration"
      collection_method: "carrier invoice, route log, fuel log, utility meter, or dispatch record; original activity aggregation: normalize route-specific energy to dispatched kg live bee mass"
      unit: "kWh, MJ, L fuel, km, tonne-km"
      frequency: "per shipment or dispatch period"
      temporal_coverage: "dispatch period"
      site_scope: "holding room, loading area, route, or declared gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "carrier invoice, route record, fuel or energy record"
    - protocol_id: cp_mortality_escape_and_reject_records
      process_id: "live_bee_stock_entry_colony_management_and_feeding"
      flow_role: "mortality, rejected bees, and swarm loss"
      record_type: "dead bee, failed queen, rejected stock, swarm, escape, or non-marketable colony record"
      raw_fields: "unit id; event date; unit type; estimated mass or count; cause where available; fate"
      collection_method: "apiary log, inspection record, disposal record, or count-to-mass estimate; original activity aggregation: convert event records to mass, sum by fate, and normalize to live-bee output"
      unit: "kg live bee mass, head, colony, queen, or package"
      frequency: "per event or reporting period"
      temporal_coverage: "production cycle"
      site_scope: "apiary, breeder yard, holding room, or shipment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "apiary log, inspection record, disposal record"
    - protocol_id: cp_dispatch_mortality_and_packaging_waste_records
      process_id: "live_bee_packing_and_dispatch"
      flow_role: "dispatch mortalities and returned packaging"
      record_type: "shipment loss, returned package, cage, feed can, or waste record"
      raw_fields: "shipment id; dead bee count or mass; returned material; waste mass; fate"
      collection_method: "receiving claim, return record, scale ticket, or waste contractor record; original activity aggregation: sum dispatch mortality and package waste by fate"
      unit: "kg or item"
      frequency: "per shipment or return"
      temporal_coverage: "dispatch period"
      site_scope: "route, receiver, packing room, or waste route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "claim record, return log, disposal ticket"
  calculation_rules:
    - id: normalize_live_bee_mass_output
      applies_to: "reference product"
      rule: "kg transferred live bee mass / PCR reference amount"
      inputs:
        - cp_live_bee_packing_dispatch_records
      output: "kg live bees per reference output"
      source_ids:
        - mass-balance-identity
    - id: convert_count_to_live_bee_mass
      applies_to: "colony, package, queen, brood-frame, or bee-count records"
      rule: "convert count-based units to kg live bee mass using documented mass, unit conversion, or colony-strength basis"
      inputs:
        - cp_live_bee_stock_entry_records
        - cp_live_bee_colony_management_records
        - cp_live_bee_packing_dispatch_records
      output: "kg live bee mass by unit type"
      source_ids:
        - fao-good-beekeeping-2019
    - id: normalize_supplemental_feed
      applies_to: "supplemental feed"
      rule: "convert syrup, candy, dry sugar, pollen substitute, and protein feed to declared sugar, dry matter, or as-fed basis and allocate by colony, batch, or live-bee output"
      inputs:
        - cp_feed_and_water_records
      output: "kg feed per reference output"
      source_ids:
        - fao-good-beekeeping-2019
    - id: calculate_apiary_energy_co2
      applies_to: "apiary energy fossil CO2"
      rule: "Calculate fossil fuel combustion CO2 only for directly operated foreground equipment, then normalize to accepted output; purchased electricity and outsourced transport emissions belong to their linked upstream datasets and must not be duplicated"
      inputs:
        - cp_energy_and_movement_records
      output: "kg fossil CO2 per reference output"
      source_ids: []
    - id: calculate_dispatch_energy_co2
      applies_to: "dispatch energy fossil CO2"
      rule: "Calculate fossil fuel combustion CO2 only for directly operated foreground equipment, then normalize to accepted output; purchased electricity and outsourced transport emissions belong to their linked upstream datasets and must not be duplicated"
      inputs:
        - cp_dispatch_energy_and_transport_records
      output: "kg fossil CO2 per reference output"
      source_ids: []
    - id: allocate_colony_coproducts
      applies_to: "co-products"
      rule: "subdivide or allocate burdens when honey, wax, pollination service, queen breeding service, or other co-products are credited inside the foreground boundary"
      inputs:
        - cp_live_bee_colony_management_records
        - "co-product records"
      output: "allocation factors or subdivision rule"
      source_ids:
        - fao-leap-guidelines
  data_quality_requirements:
    - id: dq_live_bee_identity
      applies_to: "live bee identity"
      requirement: "Species, unit type, life stage, caste mix, queen status, colony strength or bee-count basis, health status, geography, and declared gate must be stated for the reference flow and major live-bee lots."
      evidence: "inspection record, breeder certificate, health certificate, dispatch record"
    - id: dq_mass_conversion
      applies_to: "count and colony records"
      requirement: "Count, colony, package, queen, and frame records must include measured mass or a documented conversion to kg live bee mass."
      evidence: "scale record, unit conversion note, colony-strength record"
    - id: dq_feed_basis
      applies_to: "supplemental feed"
      requirement: "Feed records must preserve feed type, concentration, dry matter or sugar basis, treated colony count, and time period."
      evidence: "invoice, feed log, syrup mixing sheet"
    - id: dq_health_status
      applies_to: "disease and pest status"
      requirement: "Health, pest monitoring, treatment, inspection, certification, and rejection status must be documented when live bees are transferred."
      evidence: "treatment log, inspection result, laboratory result, health certificate"
    - id: dq_temporal_coverage
      applies_to: "production cycle"
      requirement: "Foreground records should cover the declared colony, package, queen, or dispatch production cycle; annualized apiary records must disclose allocation method."
      evidence: "apiary log, stock entry record, dispatch record"
    - id: dq_completeness
      applies_to: "material flows"
      requirement: "Live-bee stock, feed, water where used, treatments, short-life hive or packaging materials, energy and movement, mortality, rejects, and dispatch waste must be addressed or explicitly excluded with rationale."
      evidence: "collection protocol checklist and data quality review"
