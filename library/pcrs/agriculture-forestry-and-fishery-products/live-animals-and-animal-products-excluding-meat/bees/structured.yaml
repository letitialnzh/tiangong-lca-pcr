      collection_method: "inspect and weigh each destination; Raw aggregation requirements: reconcile destination masses. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
