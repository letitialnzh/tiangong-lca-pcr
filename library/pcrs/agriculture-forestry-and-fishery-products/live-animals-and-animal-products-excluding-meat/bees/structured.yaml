allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "No allocation is required when the only product output is transferred live bees and dead bees or packaging residues are treated as wastes with declared treatment. If honey, wax, propolis, royal jelly, venom, pollination service, queen breeding service, hive products, or another co-product is credited inside the foreground boundary, allocation must be declared before publication."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide processes when records separate live-bee production from honey extraction, wax rendering, pollination service, or other co-product routes."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "Use physical allocation only when a causal physical relationship is documented, such as mass for hive product streams or colony-use time for pollination service."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Use economic allocation when physical allocation is not defensible and market values are available."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
