product_category_identity:
  canonical_pcr_id: "pcr.agriculture-forestry-and-fishery-products.live-animals-and-animal-products-excluding-meat.bees"
  classification_refs: "CPC 3.0 02196 — Bees"
  covered_products: "Living bees of documented species in whole-colony, nucleus, worker-package or queen-only configurations at actual producer handover; lawful live-capture output when evidenced."
  excluded_products: "Honey, wax, royal jelly, pollen, dead bees, hive hardware, pollination services, downstream transport and buyer management."
  representative_product: "Measured viable living-bee biomass with a declared sale configuration; queen-only by count separately disclosed."
  production_route: "Managed colony/queen propagation, optional independent live capture, viability grading, ventilated presentation and handover."
  market_state: "Living, viable, unprocessed bees; queen status, workers, brood, strength, package and gate declared."
functional_unit:
  what: "Viable living bees delivered as a good; results are stratified by species and sale configuration."
  how_much: "1 kg measured living-bee biomass, excluding hive, comb, syrup and container. Queen-only count requires a separately measured lot-specific count-to-mass bridge or remains a count result outside this mass comparison."
  how_well: "Species, queen condition, worker/brood status, colony strength and live acceptance state disclosed; equal kg does not mean equivalent colony or pollination function."
  how_long_or_cycle: "The actual breeding, capture, grading and producer-handover periods, with reusable assets allocated over their service periods."
  reference_flow_link: "reference_product_handover"
system_boundary:
  rules:
    - rule_id: b_scope
      applies_to: "all routes"
      rule: "Include managed propagation or lawful live capture only when operated, then distinct grading and packaging nodes when the goods are assessed/presented before producer handover."
      source_ids:
        - un-cpc-3
        - fao-value-bees
    - rule_id: b_route
      applies_to: "managed parent and capture"
      rule: "Queen rearing, nucleus splitting and worker-package shaking are managed-production variants only when they change brood/queen inputs, split accounting or validation. Wild capture is an independent route, not a managed variant; do not infer one route's inventory from another."
      source_ids:
        - fao-value-bees
        - fao-queen-rearing
    - rule_id: b_gate
      applies_to: "handover"
      rule: "Stop at the actual producer gate. Include pre-gate presentation, feed and losses; exclude buyer installation and downstream distribution. Farm-gate and capture-site outputs are distinct."
      source_ids:
        - fao-practical-bees
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased or opening managed colony/queen, or evidenced lawful wild source; identify species and status."
  starting_condition_role: "Recursive same-category live-bee inputs retain their upstream burden; opening owned stock is a disclosed starting inventory."
  product_classification_scope: "CPC 3.0 02196 living bees; listed Apis are examples, other taxa require specific route evidence."
  recursive_input_rule: "When an acquired live-bee input is itself the reference category, import its upstream dataset once and do not treat internal transfers as new production."
  upstream_dataset_requirement: "Require source, species/configuration, gate and upstream burden for purchased bees and separately purchased feed, packaging and services."
  disclosure: "Report route, species, configuration, queen/brood/worker condition, authorization for capture, bee-only mass, count bridge, co-output handovers, periods and shared assets."
