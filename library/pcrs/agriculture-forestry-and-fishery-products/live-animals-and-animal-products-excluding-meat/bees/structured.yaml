      site_scope: "all managed colonies"
      aggregation_rule: "per reference flow"
      quality_evidence: "purchase and stock logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_utilities
      process_id: "colony"
