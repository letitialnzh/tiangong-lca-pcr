      raw_fields: "species;configuration;queen_count;worker_status;brood;live_mass;date;origin"
      collection_method: "weigh lot and document counts; Raw aggregation requirements: sum by lot and avoid internal double count. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;item"
      frequency: "each lot"
      temporal_coverage: "full production period"
      site_scope: "all source and grading lots"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale record;lot identity; traceable numerator, accepted reference-output denominator and normalization worksheet"
