allocation_rules:
  - rule_id: a_output_set
    applies_to: "live birds, eggs and exported manure"
    rule: "Enumerate every independently intended output and actual handover. Keep losses and waste outside the intended output set; separate hatching from table eggs and product manure from residue."
    source_ids:
      - fao-leap-poultry-2016
      - fao-leap-nutrient-flows-2018
  - rule_id: a_physical_then_economic
    applies_to: "unavoidable shared output burdens"
    rule: "First separate measured process or phase burdens. Where a remaining shared burden cannot be subdivided physically, declare a documented physical causal basis if credible; otherwise use period-specific economic shares with disclosed prices and sensitivity. Never credit a co-product and allocate the same burden again."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_phase
    applies_to: "breeder, broiler, layer and replacement periods"
    rule: "Attribute starting stock, replacement, rearing, laying, culling and termination burdens to their actual cohorts and outputs. State the period decision explicitly, including an opening-stock reconciliation and no duplicate allocation to a separate egg PCR."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_shared_assets
    applies_to: "housing, equipment, water, energy and manure systems"
    rule: "Enumerate all consuming flock classes, output nodes and service periods. Allocate each asset once using recorded occupied area-time, equipment hours, meter use or another measured service basis; disclose a fallback and test total assigned share equals 100%."
    source_ids:
      - fao-leap-poultry-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_bird_events
      process_id: "flock_production"
      flow_role: "admitted birds, deaths and live handover"
      record_type: "flock log and weighbridge record"
      raw_fields: "event date, class, purpose, head count, weight, scale, phase, supplier or destination"
      collection_method: "direct counts and calibrated scale or documented sample; Raw aggregation requirements: sum by class-period; estimate missing class mass only from sampled birds. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "each event"
      temporal_coverage: "full declared cohort and reporting period"
      site_scope: "each house, flock and farm gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed transfer records, scale calibration and flock reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_records
      process_id: "flock_production"
      flow_role: "feed and range intake"
      record_type: "inventory, ration and range log"
      raw_fields: "product, batch, as-fed mass, dry matter, issued, returned, stock change, flock, access period"
      collection_method: "invoices, bin scale and ration or range intake calculation; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg; kg dry matter"
      frequency: "delivery and feeding period"
      temporal_coverage: "all active flock phases"
      site_scope: "each ration and flock"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, recipe, moisture assay and stock reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_water_energy
      process_id: "flock_production"
      flow_role: "supplied water and energy"
      record_type: "meter and invoice"
      raw_fields: "purpose, source, meter, carrier, amount, unit, period, users"
      collection_method: "read meter or validated invoice; record allocation key; Raw aggregation requirements: assign by measured service and reconcile to bill. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3; kg; kWh; MJ; L"
      frequency: "meter interval"
      temporal_coverage: "full cohort period"
      site_scope: "every source, house and shared utility"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter reading, bill and shared-use schedule; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_materials_health
      process_id: "flock_production"
      flow_role: "bedding and animal-health products"
      record_type: "use and treatment register"
      raw_fields: "item, dose or mass, unit, batch, treated birds, date, stocks"
      collection_method: "physical stock and treatment records; Raw aggregation requirements: net use by product and phase. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; L; dose; item"
      frequency: "use event"
      temporal_coverage: "full cohort period"
      site_scope: "each flock and storage area"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock count, treatment log and invoice; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_inbound_transport
      process_id: "flock_production"
      flow_role: "controlled freight"
      record_type: "trip record"
      raw_fields: "cargo identity, mass, origin, destination, mode, distance, provider, delivery terms"
      collection_method: "route and delivery docket; Raw aggregation requirements: mass times distance, excluding supplier-included legs. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "t; km; t*km"
      frequency: "each trip"
      temporal_coverage: "full cohort period"
      site_scope: "controlled inbound legs"
      aggregation_rule: "per reference flow"
      quality_evidence: "delivery note, route evidence and invoice; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_output_handover
      process_id: "flock_production"
      flow_role: "eggs and other intended output"
      record_type: "egg grading and transfer record"
      raw_fields: "output class, shell-on mass, count, grade, rejects, date, buyer"
      collection_method: "scale, count and dispatch docket; Raw aggregation requirements: saleable mass by category-period; exclude rejects. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; item"
      frequency: "each collection and dispatch"
      temporal_coverage: "relevant laying periods"
      site_scope: "each layer flock and handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "grading log, scale and receipt; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure_records
      process_id: "flock_production"
      flow_role: "manure, litter, waste and species emissions"
      record_type: "manure path and treatment log"
      raw_fields: "flock class, housing, bedding, N, volatile solids, wet and dry mass, storage, export, treatment, factor tier"
      collection_method: "sampling, weighing, log and documented factor method; Raw aggregation requirements: close wet/dry mass and nitrogen balance, then calculate pathway species. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; kg N; kg VS; kg species"
      frequency: "each removal and method period"
      temporal_coverage: "all housing and storage periods"
      site_scope: "each manure pathway and receiving destination"
      aggregation_rule: "per reference flow"
      quality_evidence: "sample result, removal ticket, factor version and balance; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "flock_production"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "flock_production"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: c_live_mass
      applies_to: "reference output"
      rule: "Sum measured transferred live mass by cohort; where batch weight is sampled, multiply class count by documented sample mean and disclose uncertainty."
      inputs:
        - "event mass"
        - "head count"
        - "class and scale record"
      output: "kg live chicken and head per cohort"
      source_ids:
        - fao-leap-poultry-2016
    - id: c_feed_net
      applies_to: "feed"
      rule: "Net issued = opening stock + purchases - closing stock - returns; convert to dry matter with measured composition and assign by flock phase."
      inputs:
        - stock
        - invoice
        - recipe
        - moisture
        - "flock period"
      output: "kg as-fed and kg dry matter by feed identity"
      source_ids:
        - fao-leap-poultry-2016
    - id: c_mortality
      applies_to: "deaths"
      rule: "Sum weighed carcasses or count times sampled phase-specific carcass mass; never add to live output."
      inputs:
        - "death events"
        - count
        - "weight sample"
      output: "kg mortality waste by phase"
      source_ids:
        - fao-leap-poultry-2016
    - id: c_manure_species
      applies_to: "manure CH4, N2O and NH3"
      rule: "Calculate species by declared manure system and appropriate IPCC or nutrient-flow method from measured VS and N; document factors and molecular conversion."
      inputs:
        - pathway
        - VS
        - N
        - "temperature or storage conditions"
        - factors
      output: "kg CH4, kg N2O, kg NH3 separately"
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrient-flows-2018
    - id: c_alloc_reconcile
      applies_to: "multiple outputs and shared assets"
      rule: "Assign measured phase-specific burdens first; allocate remaining shared burdens by documented causal or disclosed economic basis and reconcile all output and period shares to one."
      inputs:
        - "output masses"
        - prices
        - "service hours"
        - "occupied area-time"
        - period
      output: "attributed burden by output and period"
      source_ids:
        - fao-leap-poultry-2016
    - id: calc_feed_supply_and_intake
      applies_to: "feed_input"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
    - id: calc_manure_n2o_coverage
      applies_to: "manure_n2o_air"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-2019-livestock-manure
        - ipcc-managed-soils-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "flock and outputs"
      requirement: "Preserve species, flock purpose, production route, class, phase, output category and actual handover gate."
      evidence: "flock register, transfer docket, housing and range log"
    - id: dq_temporal
      applies_to: "all flows"
      requirement: "Cover the declared cohort and reporting period, including replacement, mortality, laying and culling where relevant; reconcile opening and closing stock."
      evidence: "dated event logs and cohort reconciliation"
    - id: dq_completeness
      applies_to: "feed, water, energy, manure, outputs"
      requirement: "Explain missing records and zero-value flows; reconcile purchase, use, stock, output and residue balances."
      evidence: "invoices, meters, feed stocks and manure tickets"
    - id: dq_factors
      applies_to: "calculated emissions"
      requirement: "Identify flock class, manure system, method tier, factor source and version, and species conversion."
      evidence: "factor sheet and activity-to-emission calculation"
    - id: dq_allocation
      applies_to: "co-products and shared assets"
      requirement: "Preserve output handovers, shared users, service periods, basis and share sum."
      evidence: "allocation worksheet and dispatch records"
validation_rules:
  - rule_id: v_reference_gate
    applies_to: "reference output"
    rule: "Require live state, kg Mass, head count, purpose, class, cohort and producing-farm gate; reject meat or post-slaughter output and a Number-of-items-only reference."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: v_route_delta
    applies_to: "alternative routes"
    rule: "Require the managed parent plus evidence for any housed, free-range, broiler, breeder or layer difference in topology, feed, manure, energy, periods or output set; do not accept a route label alone."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: v_balance
    applies_to: "flock and residues"
    rule: "Reconcile admitted, born, sold, retained and dead head counts; reconcile feed and manure mass or nutrient paths within disclosed measurement uncertainty."
    source_ids:
      - fao-leap-poultry-2016
      - fao-leap-nutrient-flows-2018
  - rule_id: v_output_once
    applies_to: "eggs, manure and live birds"
    rule: "Require unique handover and role for every output; prevent eggs or manure from appearing as both product and waste or in two PCR datasets with the same burden."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: v_period_shared
    applies_to: "periods and shared assets"
    rule: "Require opening stock, phase links, asset users, service periods and shares summing to one; reject double attribution between egg and live-bird outputs."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: v_emissions
    applies_to: "CH4, N2O and NH3"
    rule: "Validate species, receiving medium, poultry category and documented manure pathway and factor; zero or omit methane when no generating pathway exists."
    source_ids:
      - ipcc-2019-livestock-manure
  - rule_id: v_unresolved_uuid
    applies_to: "concrete exchanges"
    rule: "Replace every unresolved or unresolved flow with a detail-verified compatible UUID, retaining the flow identity verification evidence and selection evidence, before emitting TIDAS exchanges."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-2019-livestock-manure
      - ipcc-managed-soils-2019
published_dataset_profile:
  dataset_role: "foreground farm-gate live-chicken production package"
  downstream_use: "secondary_dataset or background_dataset after route, output and identity review; process or lifecyclemodel projection"
  allowed_use: "declared chicken purpose, geography, route, flock periods, output set, allocation and live-weight convention matching the consuming study"
  excluded_use: "eggs as reference product; meat or slaughter output; other poultry; unreviewed generic conversion of head count to kg; cross-route substitution without matching husbandry"
  required_metadata: "site, geography, time, flock purpose and class, route, housing and range access, phase, mortality, feed basis, manure path, output handovers, mass method, source and conditional flow identities identity resolution"
  required_quality_disclosure: "data coverage, measured versus estimated amounts, factor tier, allocation, shared-asset basis, missing suppliers, provisional Range use and unresolved flow UUIDs"
  update_trigger: "change in flock purpose, route, output set, manure system, reference-flow identity, major factor or data quality beyond declared coverage"
