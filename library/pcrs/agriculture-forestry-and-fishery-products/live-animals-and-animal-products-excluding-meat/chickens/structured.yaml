allocation_rules:
  - rule_id: a_output_set
    applies_to: "live birds, eggs and exported manure"
    rule: "Enumerate every independently intended output and actual handover. Keep losses and waste outside the intended output set; separate hatching from table eggs and product manure from residue."
    source_ids:
      - fao-leap-poultry-2016
      - fao-leap-nutrient-flows-2018
  - rule_id: a_physical_then_economic
    applies_to: "unavoidable shared output burdens"
    rule: "First separate measured process or phase burdens. Where a remaining shared burden cannot be subdivided physically, declare a documented physical causal basis if credible; otherwise use period-specific economic shares with disclosed prices and sensitivity. Never credit a co-product and allocate the same burden again."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_phase
    applies_to: "breeder, broiler, layer and replacement periods"
    rule: "Attribute starting stock, replacement, rearing, laying, culling and termination burdens to their actual cohorts and outputs. State the period decision explicitly, including an opening-stock reconciliation and no duplicate allocation to a separate egg PCR."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_shared_assets
    applies_to: "housing, equipment, water, energy and manure systems"
    rule: "Enumerate all consuming flock classes, output nodes and service periods. Allocate each asset once using recorded occupied area-time, equipment hours, meter use or another measured service basis; disclose a fallback and test total assigned share equals 100%."
    source_ids:
      - fao-leap-poultry-2016
dataset_production:
  collection_protocols:
