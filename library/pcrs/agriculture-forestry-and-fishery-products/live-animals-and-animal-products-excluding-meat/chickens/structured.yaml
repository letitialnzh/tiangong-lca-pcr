system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Foreground starts with admitted chicks, pullets or other starting birds and the declared housing and land state. It includes controlled breeding or brooding when present, growing or laying, feed and water provision, animal health, ventilation and heat, controlled manure and litter handling, flock selection and live weighing through the producing-farm gate. Feed production, purchased-bird rearing, supplied energy, medicines and off-farm services require linked upstream datasets unless actually operated within the declared foreground. Directly controlled inbound movement is included only if not already in supplier delivery."
      source_ids: []
    - rule_id: b_managed_flock
      applies_to: "all routes"
      rule: "Model one managed flock parent; declare broiler, breeder, layer, housed or free-range changes in topology, feed, housing, litter, manure, energy, duration and validation from actual route records."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: b_farm_gate
      applies_to: "live chicken reference"
      rule: "Stop at live-weight measurement and transfer at the producing farm gate; exclude slaughter, dressing and downstream transport."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: b_phase_links
      applies_to: "replacement, brooding, growing, laying and spent-bird phases"
      rule: "Link admission, inputs, shared assets, mortality, eggs and live-bird output to cohort and period; attribute opening-stock burdens once."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: b_manure_route
      applies_to: "manure and litter"
      rule: "Include controlled collection, storage, treatment and land use; record exported product or waste at actual handover and exclude off-farm treatment from the farm foreground unless controlled."
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrient-flows-2018
    - rule_id: b_shared_housing
      applies_to: "poultry house, range, water, energy and manure facilities"
      rule: "Identify all flock classes and service periods consuming each shared asset, including egg and live-bird nodes; assign its burden once on measured service."
      source_ids:
        - fao-leap-poultry-2016
boundary_abstraction:
  declared_starting_condition: "admitted flock by class, age, live mass, head count, source and opening period, with declared housing and litter state"
  starting_condition_role: "biological starting stock and shared housing state whose prior burdens must be linked or explicitly attributed by period"
  product_classification_scope: "CPC 3.0 02151, live chickens; eggs, meat and other poultry are separate categories"
  recursive_input_rule: "purchased or internally transferred live chickens are starting-stock inputs with source, mass, count, phase, date and prior burden; they are not silently recreated as farm-gate output"
  upstream_dataset_requirement: "supplier or prior-phase datasets for birds, feed, bedding, health products, energy and services; any missing compatible dataset requires a disclosed gap and replacement plan"
  disclosure: "flock purpose and class, route, site, housing and range access, feed basis, manure path, mortality, egg output, shared assets, phase and period, live-weight method, output handovers and unresolved identities"
