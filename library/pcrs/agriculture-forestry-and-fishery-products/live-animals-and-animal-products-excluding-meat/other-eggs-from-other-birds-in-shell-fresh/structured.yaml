  market_state: "Fresh, shell-on, non-hatching handover with species, count, mass, grade, safety, packing and gate."
functional_unit:
  what: "Fresh non-hatching other-bird eggs in shell at actual producer farm gate."
  how_much: "1 kg measured transferable shell-on mass; retain count and lot-specific mean."
  how_well: "Intact, safe and fresh, with species, grade, use and storage condition disclosed."
