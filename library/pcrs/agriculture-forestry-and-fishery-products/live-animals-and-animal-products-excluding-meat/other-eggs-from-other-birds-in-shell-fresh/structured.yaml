system_boundary:
  rules:
    - rule_id: farm_gate
      applies_to: "all routes"
      rule: "Include laying, independent collection and actual on-farm sorting/packing to producer farm gate; exclude downstream incubation, processing and distribution."
      source_ids:
        - fao-codex-eggs
        - fao-leap-poultry
    - rule_id: route_delta
      applies_to: "species/housing route"
      rule: "Relative to managed laying parent, evidence flock-specific feed, water, bedding/manure, cleaning, energy and storage inventory and QA deltas."
      source_ids:
        - fao-codex-eggs
        - fao-leap-poultry
    - rule_id: collection
      applies_to: "newly laid eggs"
      rule: "Count, weigh and record breakage across independent collection; internal transfer is not final sale."
      source_ids:
        - fao-codex-eggs
        - fao-leap-poultry
    - rule_id: conditional
      applies_to: "sorting/packing"
      rule: "Sorting needs at least two real destinations and handovers; packing needs material, reuse and pre/post protected state."
      source_ids:
        - fao-codex-eggs
        - fao-leap-poultry
    - rule_id: period_assets
      applies_to: "flocks/shared assets"
      rule: "Attribute rearing, laying, exit and shared housing/collection/sorting assets by node/period; count source burdens once."
      source_ids:
        - fao-codex-eggs
        - fao-leap-poultry
