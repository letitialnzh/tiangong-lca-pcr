allocation_rules:
  - rule_id: cooutputs
    applies_to: "eggs, spent birds and sold manure"
    rule: "Directly assign separable activities. For evidenced independent co-outputs use measured physical causality; otherwise contemporaneous farm-gate economic shares with sensitivity. Waste receives no product share."
    source_ids:
      - fao-codex-eggs
      - fao-leap-poultry
  - rule_id: period
    applies_to: "rearing/laying/exit"
    rule: "Assign admission/rearing burden once across actual laying service and reconcile opening/closing flock stock."
    source_ids:
      - fao-codex-eggs
      - fao-leap-poultry
  - rule_id: shared
    applies_to: "housing/collection/sorting/packing assets"
    rule: "Record every consuming node and period; allocate by measured occupancy, hours or throughput, with shares summing to source total."
    source_ids:
      - fao-codex-eggs
      - fao-leap-poultry
  - rule_id: grade
    applies_to: "accepted, diverted and rejected"
    rule: "Count each state at one handover only; hatching diversion needs suitability, processing diversion lawful acceptance, otherwise loss or waste."
    source_ids:
      - fao-codex-eggs
      - fao-leap-poultry
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
