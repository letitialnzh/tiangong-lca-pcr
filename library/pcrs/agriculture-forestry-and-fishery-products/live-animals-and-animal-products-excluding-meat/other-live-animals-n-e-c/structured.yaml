allocation_rules:
  - rule_id: a_output
    applies_to: "co-products and residues"
    rule: "Identify every independently sold output and its handover; do not turn death, spent substrate or unsold eggs into co-products. Prefer documented physical causality for shared inputs; otherwise allocate by measured net economic value for the node and period with price basis and sensitivity disclosed. Meter shared rooms, tanks, lighting and equipment where possible, else use animal-days or area-time, assigning each service once to consuming nodes and nonoverlapping periods."
    source_ids:
      - mass-balance-identity
  - rule_id: a_period
    applies_to: "periods"
    rule: "Record each cohort stage and asset service period; assign establishment, deaths and replacement once, without repeating stock or burden across periods."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_rear
      process_id: "rear"
      flow_role: "all listed flows"
      record_type: "lot/meter/provenance ledger"
      raw_fields: "species, stage, time, source, calibrated mass, count, input, death, output, destination"
      collection_method: "Weigh and count each lot; reconcile permits, invoices and meters.; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg;count;kWh"
      frequency: "each lot and period"
      temporal_coverage: "complete cohort or capture and service period"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, provenance, permit, ledger and destination evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "all listed flows"
      record_type: "lot/meter/provenance ledger"
      raw_fields: "species, stage, time, source, calibrated mass, count, input, death, output, destination"
      collection_method: "Weigh and count each lot; reconcile permits, invoices and meters.; Raw aggregation requirements: sum by species, stage, node and nonoverlapping period. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;count;kWh"
      frequency: "each lot and period"
      temporal_coverage: "complete cohort or capture and service period"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, provenance, permit, ledger and destination evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_select
      process_id: "select"
      flow_role: "all listed flows"
      record_type: "lot/meter/provenance ledger"
      raw_fields: "species, stage, time, source, calibrated mass, count, input, death, output, destination"
      collection_method: "Weigh and count each lot; reconcile permits, invoices and meters.; Raw aggregation requirements: sum by species, stage, node and nonoverlapping period. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;count;kWh"
      frequency: "each lot and period"
      temporal_coverage: "complete cohort or capture and service period"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, provenance, permit, ledger and destination evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_gate
      process_id: "gate"
      flow_role: "all listed flows"
      record_type: "lot/meter/provenance ledger"
      raw_fields: "species, stage, time, source, calibrated mass, count, input, death, output, destination"
      collection_method: "Weigh and count each lot; reconcile permits, invoices and meters.; Raw aggregation requirements: sum by species, stage, node and nonoverlapping period. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;count;kWh"
      frequency: "each lot and period"
      temporal_coverage: "complete cohort or capture and service period"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, provenance, permit, ledger and destination evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "rear"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
  calculation_rules:
    - id: c_net
      applies_to: "reference lot"
      rule: "Net live mass = gross weighed mass − removable medium and container tare."
      inputs:
        - "calibrated gross"
        - tare
        - viability
      output: "kg"
      source_ids:
        - mass-balance-identity
    - id: c_stock
      applies_to: "cohort"
      rule: "Opening + additions − deaths − sales − closing = explained stage-wise balance."
      inputs:
        - stock
        - mortality
        - "sale ledgers"
      output: "kg;count"
      source_ids:
        - mass-balance-identity
    - id: c_shared
      applies_to: "shared service"
      rule: "Node burden = total metered service × documented node-use share; shares sum to 1."
      inputs:
        - meters
        - "animal-days or area-time"
        - period
      output: "kg;kWh"
      source_ids:
        - mass-balance-identity
    - id: calc_feed_supply_and_intake
      applies_to: "feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
  data_quality_requirements:
    - id: q_core
      applies_to: "each lot"
      requirement: "Require species/stage identity, legal provenance, calibrated net biomass, count, opening/closing stock, deaths, inputs, separate sales, shared-service ledger and period linkage. Missing lawful provenance or valid live-mass measurement blocks a dataset."
      evidence: "classification, permit, calibrated weighing and stock ledger"
    - id: q_range
      applies_to: "all flow cards"
      requirement: "Provisional QA screens trigger review, never override measurements or define publication-allowed ranges."
      evidence: "raw records and exception notes"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference"
    rule: "Verify species, stage, legality, living state, count, net mass and gate; do not claim fixed UUID without detail and support-row verification."
    source_ids:
      - un-cpc-2025
  - rule_id: v_balance
    applies_to: "nodes and periods"
    rule: "Reconcile inputs, sales, deaths, waste and closing stock by stage; do not count one animal or loss at two handovers."
    source_ids:
      - mass-balance-identity
  - rule_id: v_alloc
    applies_to: "outputs and shared services"
    rule: "Check each intended product and own handover, allocation basis, period and shared service shares summing to 1."
    source_ids:
      - mass-balance-identity
  - rule_id: v_route
    applies_to: "conditional routes"
    rule: "Unpermitted wild collection is not a legal source; no fictitious breeding for wild route or zero upstream burden for purchased stock."
    source_ids:
      - un-cpc-2025
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
published_dataset_profile:
  dataset_role: "Species- and route-specific live-animal foreground package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Species- and route-specific secondary/background dataset only for the declared live source gate; do not generalize across amphibians, insects and arachnids or convert to dead goods without new data."
  excluded_use: "Other species, stages, sources, dead goods, post-gate transport and use without new data."
  required_metadata: "species; classification decision; life stage; count or population estimate; viability; wet-mass method; holding medium; legal source; route; gate; period; method, period and allocation disclosure"
  required_quality_disclosure: "provenance, weighing/count, QA exceptions, mortality, shared service and unresolved identities"
  update_trigger: "Species, stage, jurisdiction, route, husbandry, gate or UUID evidence change."
