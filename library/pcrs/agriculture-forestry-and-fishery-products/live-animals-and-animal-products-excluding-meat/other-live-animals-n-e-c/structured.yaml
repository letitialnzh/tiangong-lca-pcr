allocation_rules:
  - rule_id: a_output
    applies_to: "co-products and residues"
    rule: "Identify every independently sold output and its handover; do not turn death, spent substrate or unsold eggs into co-products. Prefer documented physical causality for shared inputs; otherwise allocate by measured net economic value for the node and period with price basis and sensitivity disclosed. Meter shared rooms, tanks, lighting and equipment where possible, else use animal-days or area-time, assigning each service once to consuming nodes and nonoverlapping periods."
    source_ids:
      - mass-balance-identity
  - rule_id: a_period
    applies_to: "periods"
    rule: "Record each cohort stage and asset service period; assign establishment, deaths and replacement once, without repeating stock or burden across periods."
    source_ids:
      - mass-balance-identity
