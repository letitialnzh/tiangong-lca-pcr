    inclusion: "conditional"
    inclusion_condition: "Permitted wild route only; not rearing"
    role: "Remove live animals from documented wild source; hand viable lot to selection."
    quantitative_reference: "per kg node output"
  - id: select
    name: "Live selection and holding"
    inclusion: "required"
    inclusion_condition: "Every route, actual intervention only"
    role: "Check species, stage and viability; split accepted animals, independently sold outputs and loss."
    quantitative_reference: "per kg node output"
  - id: gate
