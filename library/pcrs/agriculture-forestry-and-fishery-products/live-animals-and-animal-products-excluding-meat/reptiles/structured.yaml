allocation_rules:
  - rule_id: a_output
    applies_to: "Captive node"
    rule: "List all intended independent live and non-live outputs and their actual gates. First partition physically separable activities; if joint burdens remain, use evidenced mass or another documented causal driver and disclose sensitivity. Unsold eggs/shed and dead animals are residue/waste."
    source_ids:
      - mass-balance-identity
  - rule_id: a_period
    applies_to: "Captive cohort or capture campaign"
    rule: "Link stock, facilities, feed, losses and live animals to actual periods. Allocate opening stock and shared assets once across realized outputs and service periods; no default reptile lifetime or double counting at internal transfers."
    source_ids:
      - mass-balance-identity
  - rule_id: a_shared
    applies_to: "Heated rooms, pools, cages and handling services"
    rule: "Record every consuming node/cohort and period; allocate by measured service time, metered energy/water or justified capacity driver, not again at final handover."
    source_ids:
      - mass-balance-identity
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_stock
      process_id: "captive"
      flow_role: "opening/purchased reptiles"
      record_type: "animal inventory and provenance"
      raw_fields: "species, source, permit, count, mass, class, date, supplier, carried burden"
      collection_method: "reconcile intake and opening ledger; Raw aggregation requirements: attribute stock once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, head"
      frequency: "receipt and period opening"
      temporal_coverage: "full cohort"
      site_scope: "breeder site"
      aggregation_rule: "per reference flow"
      quality_evidence: "permits, supplier and scale records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_resources
      process_id: "captive_capture_handover"
      flow_role: "feed, water, energy, consumables, shared cages"
      record_type: "meter, invoice, issue/service logs"
      raw_fields: "input identity, amount, unit, node, cohort, period, reuse, water discharge"
      collection_method: "meter or reconcile invoices and stock; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg, MJ, day"
      frequency: "each issue and monthly"
      temporal_coverage: "full cohort/campaign"
      site_scope: "foreground nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "logs, invoices, meters, allocation worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_live
      process_id: "captive_capture_handover"
      flow_role: "live transfers and accepted output"
      record_type: "count, weighing, acceptance"
      raw_fields: "species, source, authorization, animal ID, count, size, mass, health, date, gate"
      collection_method: "weigh and inspect living animals; Raw aggregation requirements: normalize accepted mass to 1 kg. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, head"
      frequency: "each handover"
      temporal_coverage: "all cohorts/campaigns"
      site_scope: "source site"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale, identity and health records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_outputs
      process_id: "captive_capture_handover"
      flow_role: "co-product, mortality and rejects"
      record_type: "sale, incident and disposal"
      raw_fields: "species, event, mass, count, fate, date, gate"
      collection_method: "measure or reconcile event logs; Raw aggregation requirements: distinguish product, waste, internal return. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, head"
      frequency: "each event"
      temporal_coverage: "all periods"
      site_scope: "site/campaign"
      aggregation_rule: "per reference flow"
      quality_evidence: "receipts and incident logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_emission
      process_id: "captive"
      flow_role: "direct releases"
      record_type: "monitoring or method"
      raw_fields: "named substance, receiving medium, mass, period, method"
      collection_method: "direct monitoring or source-backed calculation; Raw aggregation requirements: normalize by output. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "monitored interval"
      temporal_coverage: "full cohort"
      site_scope: "facility"
      aggregation_rule: "per reference flow"
      quality_evidence: "test report and calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "captive"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
  calculation_rules:
    - id: c_reference
      applies_to: "accepted live output"
      rule: "Sum measured mass of accepted living animals of one species; normalize allocated inventory to 1 kg. Reconcile count, source transfer and rejected/dead disposition."
      inputs:
        - cp_live
        - cp_outputs
      output: "kg accepted live species"
      source_ids:
        - mass-balance-identity
    - id: c_water
      applies_to: "captive wastewater"
      rule: "Supplied water minus measured retained, evaporated and separately discharged quantities; direct measurement takes precedence."
      inputs:
        - cp_resources
      output: "kg wastewater"
      source_ids:
        - mass-balance-identity
    - id: c_period
      applies_to: "stock and shared service"
      rule: "Assign consumption to cohort/campaign and period, divide joint service by metered use or documented time and sum shares once."
      inputs:
        - cp_stock
        - cp_resources
        - cp_outputs
      output: "allocated input/kg accepted output"
      source_ids:
        - mass-balance-identity
    - id: calc_feed_supply_and_intake
      applies_to: "captive_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
  data_quality_requirements:
    - id: q_identity
      applies_to: "every lot"
      requirement: "Verify scientific taxon, legal source and jurisdiction; reject unknown/prohibited provenance."
      evidence: "source/permit and legal check"
    - id: q_mass
      applies_to: "reference and loss"
      requirement: "Calibrated live mass, count, size class and condition by gate; no cross-species average kg/head."
      evidence: "weighing and acceptance logs"
    - id: q_period
      applies_to: "cohorts, campaigns, shared assets"
      requirement: "Complete inputs, outputs, mortality and periods with documented attribution, opening and closing stock."
      evidence: "ledgers and reconciliation worksheet"
    - id: q_flow
      applies_to: "UUID-backed exchanges"
      requirement: "Confirm exact flow, property, unit group, type and gate before binding; unresolved IDs stay unbound."
      evidence: "platform detail/support-row evidence"
validation_rules:
  - rule_id: v_legal
    applies_to: "live output"
    rule: "Fail if species, authorized origin, condition or actual source gate is absent; classification does not prove legality."
    source_ids:
      - un-cpc-2025
      - cites-guide-2022
  - rule_id: v_routes
    applies_to: "source process"
    rule: "Exactly one evidenced source route supplies each lot. Captive needs stock/cohort records; capture needs permits/campaign and cannot inherit imagined breeding inputs."
    source_ids: []
  - rule_id: v_balance
    applies_to: "mass and outputs"
    rule: "Reconcile opening/purchased or captured mass, stock changes, accepted live animals, mortality and real co-products; internal transfers and same-gate live returns only once. A later production activity requires its own responsibility and records."
    source_ids:
      - mass-balance-identity
  - rule_id: v_shared
    applies_to: "multi-period/shared assets"
    rule: "Each input, asset, output and loss has node/period attribution; shares sum to observed service without double charge at two gates."
    source_ids:
      - mass-balance-identity
  - rule_id: v_identity
    applies_to: "all cards"
    rule: "conditional flow cards need concrete selection; final exchanges need verified species/state/direction/property/unit and gate before publication."
    source_ids:
      - un-cpc-2025
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
published_dataset_profile:
  dataset_role: "Source-specific foreground package for one lawful living reptile species and route"
  downstream_use: "Candidate secondary_dataset or background_dataset after concrete identity and quality review"
  allowed_use: "Species, provenance, technology, geography and gate matching declared package"
  excluded_use: "Generic all-reptile factor; amphibians or dead products; unauthorized trade; slaughter or buyer transport"
  required_metadata: "Species, legal source/permit, route, site, cohort/campaign, count, live mass, size/condition, gate, period and actual flow selections evidence"
  required_quality_disclosure: "Coverage, stock/mortality balance, measurements, provisional Ranges, allocation and unresolved UUIDs"
  update_trigger: "New species, source law, captive mode, capture authorization, husbandry regime, gate or flow identity"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "[UN CPC 3.0 explanatory notes](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "living-reptile classification boundary"
  - id: "woah-reptiles-2024"
    type: "official_guidance"
    reference: "[WOAH Terrestrial Code chapter 7.14](https://www.woah.org/fileadmin/Home/eng/Health_standards/tahc/2024/en_chapitre_aw_reptiles.htm)"
    used_for: "WOAH 2024 Chapter 7.14 covers welfare during killing for skins/meat/products. Use only explicitly transferable handling context; it does not establish lawful live capture, breeding methods or LCA allocation."
  - id: "cites-guide-2022"
    type: "official_guidance"
    reference: "[CITES Trade Database guide](https://trade.cites.org/cites_trade_guidelines/en-CITES_Trade_Database_Guide.pdf)"
    used_for: "distinguish reported wild, captive and ranched source codes; not permit evidence alone"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Mass conservation and measured foreground input/output reconciliation"
    used_for: "normalization, stock, water and shared-service reconciliation"
  - id: "fao-feed-loss-accounting-2018"
    type: "official_guidance"
    reference: "[FAO 2018, Environmental performance of pig supply chains, section 11.2.2](https://www.fao.org/4/i8686en/I8686EN.pdf)"
    used_for: "Feed supply versus intake and waste burden, not animal parameters. Applying this accounting principle to the declared taxon is this PCR's methodological choice; no pig diet or emission factor is transferred."
  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
