allocation_rules:
  - rule_id: a_output
    applies_to: "Captive node"
    rule: "List all intended independent live and non-live outputs and their actual gates. First partition physically separable activities; if joint burdens remain, use evidenced mass or another documented causal driver and disclose sensitivity. Unsold eggs/shed and dead animals are residue/waste."
    source_ids:
      - mass-balance-identity
      - woah-reptiles-2024
  - rule_id: a_period
    applies_to: "Captive cohort or capture campaign"
    rule: "Link stock, facilities, feed, losses and live animals to actual periods. Allocate opening stock and shared assets once across realized outputs and service periods; no default reptile lifetime or double counting at internal transfers."
    source_ids:
      - mass-balance-identity
  - rule_id: a_shared
    applies_to: "Heated rooms, pools, cages and handling services"
    rule: "Record every consuming node/cohort and period; allocate by measured service time, metered energy/water or justified capacity driver, not again at final handover."
    source_ids:
      - mass-balance-identity
