system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The foreground boundary begins with admitted breeding, replacement, or young buffalo and the declared opening herd state. It includes reproduction and calving when present, calf rearing, grazing or housed feeding, controlled animal movements, health management, supplied water, cooling or wallowing under management, energy, manure collection and treatment under farm control, live-animal selection, weighing, and handover. Upstream production of purchased feed, animals, health products, energy, and services is represented through supplier datasets unless explicitly controlled within the foreground package."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "The boundary ends when the live buffalo is weighed immediately before ownership or operational-control transfer at the producing farm gate. Slaughter, dressing, downstream lairage, processing, and post-transfer transport are excluded."
      source_ids: []
    - rule_id: b_managed_buffalo_route
      applies_to: "all production variants"
      rule: "Use one managed buffalo-production parent; declare each pastoral or mixed, dairy-linked, or housed route delta in topology, inventory categories, calculation, evidence, and validation."
      source_ids:
        - fao-leap-large-ruminants-2016
        - fao-gleam
    - rule_id: b_gate
      applies_to: "reference output"
      rule: "End at live buffalo weighed immediately before the producing-farm handover; exclude slaughterhouse receipt and post-handover transport."
      source_ids:
        - fao-leap-large-ruminants-2016
    - rule_id: b_period_linkage
      applies_to: "breeding, gestation, calf, growing, finishing, culling, and replacement phases"
      rule: "Index animals, inputs, outputs, replacements, deaths, and termination events by cohort and period, and attribute opening-stock burdens exactly once."
      source_ids:
        - fao-leap-large-ruminants-2016
    - rule_id: b_manure_pathway
      applies_to: "excreta and manure"
      rule: "Include deposition, collection, storage, treatment, recovery, export, and land use under farm control; retain each pathway and handover without duplicating burdens."
      source_ids:
        - fao-leap-nutrient-flows-2018
        - ipcc-2019-livestock-manure
    - rule_id: b_shared_services
      applies_to: "housing, pasture, milking, cooling or wallowing, water, energy, and manure assets"
      rule: "Identify every consuming animal group, product node, and service period; assign each shared burden once using measured service before a documented fallback driver."
      source_ids:
        - fao-leap-large-ruminants-2016
boundary_abstraction:
  declared_starting_condition: "opening buffalo herd plus admitted breeding, replacement, or young animals at the start of the declared cohort or reporting period"
  starting_condition_role: "biological starting stock whose earlier burdens require a preceding-phase or supplier dataset, or an explicit period-attribution decision"
  product_classification_scope: "CPC 3.0 02112, live buffalo; meat, milk, hides, reproductive material, and services do not recurse into this reference category"
  recursive_input_rule: "a buffalo entering from this same category is recorded as starting stock or an intermediate biological transfer with origin, class, live mass, prior phase, and burden treatment; it is not recreated as a new reference output"
  upstream_dataset_requirement: "supplier or preceding-phase datasets for admitted animals and purchased feed, health products, energy, and services, or a disclosed justified cutoff where no compatible upstream dataset exists"
  disclosure: "route, animal classes and periods, grazing and housing pattern, feed and browse system, managed mobility, cooling or wallowing, manure pathways, shared assets, co-products and handovers, mortalities, live-weight method, geography, and unresolved identities"
