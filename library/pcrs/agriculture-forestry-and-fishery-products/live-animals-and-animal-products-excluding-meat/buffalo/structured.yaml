allocation_rules:
  - rule_id: a_output_precedence
    applies_to: "live buffalo, independently transferred milk, breeding or cull animals, draught service, and exported manure"
    rule: "Enumerate every intended output and its handover. Partition directly measured product-specific records first; use an explicit physical causal relation for indivisible burdens, and economic allocation only when physical causality is not defensible, with prices, period, and sensitivity disclosed."
    source_ids:
      - fao-leap-large-ruminants-2016
      - fao-ruminant-lca-2013
  - rule_id: a_milk_condition
    applies_to: "raw buffalo milk"
    rule: "Create the milk co-product exchange only for intentionally collected and independently transferred raw milk. Milk suckled by calves or discarded remains within herd production and is not an external co-product."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: a_residue_status
    applies_to: "manure, mortalities, and losses"
    rule: "Recognize exported manure only with intentional recovery and a documented transfer. Mortalities and unusable residues remain waste or loss and do not receive an avoided-product credit by default."
    source_ids:
      - fao-leap-nutrient-flows-2018
  - rule_id: a_multi_period
    applies_to: "breeding stock, replacements, births, growth, culls, deaths, and ending stock"
    rule: "Reconcile opening stock, additions, transfers, deaths, culls, and ending stock by class and period; attribute prior and current-period burdens once and document replacement and termination treatment."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: a_shared_assets
    applies_to: "shared pasture, housing, milking, cooling or wallowing, water, energy, and manure infrastructure"
    rule: "Name all consuming nodes and service periods. Assign direct measured service first, then a documented causal driver such as animal-days, live-mass-days, runtime, or throughput; fractions sum to one and burdens are counted once."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: a_route_portfolio
    applies_to: "coexisting pastoral or mixed, dairy-linked, and housed routes"
    rule: "Keep route-specific animals, periods, feed, mobility, water, manure, infrastructure, and emissions records separate. Aggregate only with production-weighted route shares and no duplicated animals or periods."
    source_ids:
      - fao-gleam
      - fao-ruminant-lca-2013
dataset_production:
  collection_protocols:
    - protocol_id: cp_buffalo_events
      process_id: "buffalo_production_farm_gate_handover"
      flow_role: "opening stock, births, purchases, transfers, deaths, culls, and accepted output"
      record_type: "herd register, movement record, and scale ticket"
      raw_fields: "animal or cohort id; class; sex; purpose; route; event; date; count; live mass; origin; destination; phase"
      collection_method: "herd register plus calibrated weighing or documented representative sampling; Raw aggregation requirements: reconcile stock and movements by class-period before normalization. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head and kg"
      frequency: "each event"
      temporal_coverage: "complete cohort and reporting period"
      site_scope: "named farm, herd, and cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed records, movement documents, scale calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_grazing_and_browse
      process_id: "buffalo_production"
      flow_role: "feed, forage, browse, and grazing intake"
      record_type: "invoices, ration logs, feed inventory, and pasture or browse records"
      raw_fields: "feed identity; source; as-fed mass; dry matter; composition; leftovers; area; stocking time; animal class"
      collection_method: "measured issue and inventory reconciliation plus documented intake calculation; Raw aggregation requirements: calculate net intake by feed-class-period and preserve conversion basis. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg as-fed, kg dry matter, ha-day"
      frequency: "daily issue or period summary"
      temporal_coverage: "all feeding phases"
      site_scope: "store, paddock, range, housing group, and cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice, supplier specification, moisture result, grazing evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_water_and_cooling
      process_id: "all_processes"
      flow_role: "drinking, cleaning, cooling, wallowing, and manure water"
      record_type: "meter, tank, pump, and allocation records"
      raw_fields: "source; purpose; reads; volume; runtime; users; period"
      collection_method: "calibrated meter or documented pump/runtime calculation; Raw aggregation requirements: aggregate by purpose; allocate shared supply once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3 or kg"
      frequency: "daily, monthly, or batch"
      temporal_coverage: "full reporting period"
      site_scope: "source, process, and consumer"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, bill, runtime log, allocation worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_energy_and_assets
      process_id: "all_processes"
      flow_role: "energy carriers and shared assets"
      record_type: "meter, invoice, fuel, runtime, and asset register"
      raw_fields: "carrier; quantity; equipment; service; users; hours; service period; allocation driver"
      collection_method: "submeter, invoice, tank record, runtime log, and asset register; Raw aggregation requirements: direct assignment first; allocate residual shared amount once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kWh, MJ, L, kg, hours"
      frequency: "monthly and major operation"
      temporal_coverage: "full reporting and asset service period"
      site_scope: "process and consuming group"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice, calibration, equipment log, allocation worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_health_and_husbandry
      process_id: "buffalo_production"
      flow_role: "physical health and husbandry materials"
      record_type: "medicine, treatment, purchase, and issue records"
      raw_fields: "product; substance; dose; unit; animal class; count; date; purpose"
      collection_method: "farm register and supplier record; Raw aggregation requirements: sum by product identity and class; retain service costs separately. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "native product unit and event"
      frequency: "each use"
      temporal_coverage: "complete reporting period"
      site_scope: "herd and treatment group"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice, treatment record, veterinarian evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_controlled_transport
      process_id: "buffalo_production"
      flow_role: "controlled inbound animals and feed"
      record_type: "shipment, route, and scale records"
      raw_fields: "cargo; mass; origin; destination; mode; loaded distance; control status"
      collection_method: "manifest, weigh ticket, and route log; Raw aggregation requirements: sum loaded tonnes multiplied by kilometres by cargo and mode. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "t, km, tkm"
      frequency: "each trip"
      temporal_coverage: "full reporting period"
      site_scope: "controlled inbound route"
      aggregation_rule: "per reference flow"
      quality_evidence: "manifest, route evidence, scale ticket; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_emissions_and_manure
      process_id: "buffalo_production_manure_management"
      flow_role: "enteric emissions, excretion, manure pathways, methane, nitrous oxide, and ammonia"
      record_type: "animal, feed, manure, storage, treatment, recovery, application, and factor records"
      raw_fields: "category; population; days; intake; digestibility; volatile solids; nitrogen; pathway; storage; climate; recovery; export; application; factor tier"
      collection_method: "measurements plus IPCC-consistent calculation from collected activity data; Raw aggregation requirements: calculate by category-pathway-period; reconcile carbon and nitrogen transfers before aggregation. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg manure, kg VS, kg N, kg gas species"
      frequency: "monthly or pathway event"
      temporal_coverage: "every animal phase and manure pathway"
      site_scope: "pasture, housing, storage, treatment, and field pathway"
      aggregation_rule: "per reference flow"
      quality_evidence: "laboratory or supplier data, logs, factor table, calculation workbook; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_outputs_and_attribution
      process_id: "buffalo_production_manure_management"
      flow_role: "milk, exported manure, and other intended outputs"
      record_type: "sales, transfer, composition, and price records"
      raw_fields: "identity; quantity; quality; handover; recipient; period; price; allocation driver"
      collection_method: "measured transfer and signed commercial or internal record; Raw aggregation requirements: aggregate by output and handover; retain partitioning and allocation worksheet. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg and declared composition"
      frequency: "each handover"
      temporal_coverage: "full reporting period"
      site_scope: "product node and recipient"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale or meter calibration, invoice, composition result, signed transfer; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_gate_handover
      process_id: "farm_gate_handover"
      flow_role: "gate input, accepted reference output, returned animals, rejects, deaths, and losses"
      record_type: "lot register and scale ticket"
      raw_fields: "lot; class; route; input count and mass; output count and mass; returned or retained animals; rejection; loss; time; scale"
      collection_method: "calibrated scale and lot reconciliation; Raw aggregation requirements: accepted mass is reference output; reconcile all other outcomes before normalization. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg and head"
      frequency: "each lot"
      temporal_coverage: "every transfer lot"
      site_scope: "producing-farm gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale certificate, signed transfer, reconciliation sheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: c_reference_normalization
      applies_to: "all inventory"
      rule: "reported amount × (1 kg accepted buffalo output / accepted output mass in the same attributed system)"
      inputs:
        - "attributed inventory"
        - "accepted live mass"
      output: "amount per kg reference flow"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: c_stock_reconciliation
      applies_to: "buffalo events"
      rule: "opening + births + purchases + internal additions = accepted transfers + other sales + deaths + culls + closing stock, by class and period; reconcile mass and count"
      inputs:
        - "event and weighing records"
      output: "complete class-period stock balance"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: c_feed_dry_matter
      applies_to: "feed"
      rule: "as-fed mass × measured dry-matter fraction; sum only after preserving feed identity and period"
      inputs:
        - "as-fed records"
        - "moisture results"
      output: "kg dry matter by feed and cohort-period"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: c_transport_service
      applies_to: "controlled inbound transport"
      rule: "loaded mass in tonnes × controlled loaded distance in kilometres"
      inputs:
        - "shipment mass"
        - distance
        - "cargo and mode"
      output: "tonne-kilometres by route"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: c_enteric_methane
      applies_to: "enteric methane"
      rule: "apply the selected IPCC tier by buffalo category and period using collected intake, diet, performance, and population data; preserve tier and factors"
      inputs:
        - animal-days
        - "intake or gross energy"
        - diet
        - "factor tier"
      output: "kg CH4 by category-period"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: c_manure_emissions
      applies_to: "manure methane, N2O, and NH3"
      rule: "calculate each gas by category-pathway-period from volatile solids or nitrogen, management system, climate, duration, recovery, and method factors; never merge species"
      inputs:
        - excretion
        - VS
        - N
        - pathway
        - climate
        - duration
        - recovery
        - factors
      output: "kg named gas and component trace"
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrient-flows-2018
    - id: c_shared_asset
      applies_to: "shared infrastructure and services"
      rule: "direct measured service first; otherwise shared burden × documented causal-driver share; shares over all consumers and periods sum to one"
      inputs:
        - "asset burden"
        - consumers
        - periods
        - "service or fallback driver"
      output: "one attributed burden per consumer-period"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: c_multi_output
      applies_to: "intended outputs"
      rule: "partition separable records; otherwise apply the declared physical relation; if economic allocation is necessary, use contemporaneous prices and report sensitivity"
      inputs:
        - "output quantities"
        - properties
        - handovers
        - prices
        - "separable records"
      output: "burden attributed once to each intended output"
      source_ids:
        - fao-leap-large-ruminants-2016
        - fao-ruminant-lca-2013
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all product and waste exchanges"
      requirement: "Preserve concrete product identity, state, source or destination, and gate; unresolved semantic identities must be fixed before release of a concrete process dataset."
      evidence: "identity confirmation and supplier or transfer record"
    - id: dq_live_mass
      applies_to: "reference and animal events"
      requirement: "Use calibrated weighing or documented representative sampling; retain timing, class, sample, count, and conversion to live mass."
      evidence: "calibration and weighing record"
    - id: dq_route
      applies_to: "route variants"
      requirement: "Record route by animal group and period, including grazing or housing, mobility, cooling or wallowing, milking, and manure pathway; do not infer route solely from geography."
      evidence: "herd, housing, grazing, water, and manure records"
    - id: dq_temporal
      applies_to: "biological and shared-asset burdens"
      requirement: "Cover complete relevant phases or reconcile opening and closing stock; disclose exclusions and prevent double attribution across periods."
      evidence: "cohort-period balance and attribution worksheet"
    - id: dq_completeness
      applies_to: "feed, water, energy, health, transport, manure, emissions, and outputs"
      requirement: "Reconcile source records to process totals and explain missing months, animal groups, pathways, or intended outputs."
      evidence: "completeness report and exception log"
    - id: dq_emission_method
      applies_to: "calculated gases"
      requirement: "Preserve activity data, factor source and tier, category, pathway, climate, conversions, and calculation version."
      evidence: "calculation workbook and factor table"
validation_rules:
  - rule_id: v_reference_identity
    applies_to: "reference flow"
    rule: "Require the fixed buffalo UUID, Mass property and units-of-mass group, 1 kg amount, farm-gate state, and all required qualifiers."
    source_ids: []
  - rule_id: v_handover_boundary
    applies_to: "gate operations"
    rule: "Reject slaughter, dressing, slaughterhouse receipt, or post-transfer transport inside the reference process."
    source_ids: []
  - rule_id: v_route_delta
    applies_to: "production routes"
    rule: "Require the managed parent plus route-specific topology, feed, water or cooling, mobility, manure, infrastructure, and calculation evidence; a route label alone is insufficient."
    source_ids: []
  - rule_id: v_stock_period_balance
    applies_to: "animals and periods"
    rule: "Require class-period count and mass reconciliation, preceding-phase treatment, replacement and termination decisions, and no repeated opening-stock burden."
    source_ids: []
  - rule_id: v_output_set
    applies_to: "milk, live animals, manure, and losses"
    rule: "Enumerate intended outputs and handovers, distinguish residue and waste, and require one explicit attribution method with precedence."
    source_ids: []
  - rule_id: v_shared_burden
    applies_to: "shared assets and services"
    rule: "Require at least two named consumers or periods, a service boundary, causal driver, allocation shares summing to one, and one-time burden counting."
    source_ids: []
  - rule_id: v_manure_nitrogen
    applies_to: "manure pathways and nitrogen losses"
    rule: "Reconcile excreted, retained, exported, applied, volatilized, leached, and stock-change nitrogen without merging species or exceeding available nitrogen."
    source_ids: []
  - rule_id: v_flow_binding
    applies_to: "all cards"
    rule: "Resolve every unmapped semantic card to one verified concrete flow before process-dataset release; unresolved cards expand from foreground records using the cited flow identity verification evidence."
    source_ids: []
  - rule_id: v_range_use
    applies_to: "provisional ranges"
    rule: "Treat reasoned-estimate ranges only as QA screens; do not substitute them for foreground records or publish them as universal defaults without review."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground data package for live buffalo at the producing farm gate"
  downstream_use: "secondary_dataset; background_dataset after identity, evidence, and review gates pass"
  allowed_use: "route-specific process construction, supplier and farm comparison with equivalent boundaries, inventory development, and lifecycle-model assembly"
  excluded_use: "buffalo meat, milk, hides, services, slaughter, or post-farm transport as the reference product; comparison across unlike live-weight bases or gates; use of provisional ranges as observations"
  required_metadata: "PCR id and version; CPC ref; species or buffalo type; animal class and sex where material; purpose; route; live-weight method; geography; farm-gate definition; cohort and period; phases; feed system; water and cooling or wallowing; manure pathways; co-products and attribution; shared assets; data sources; unresolved identities"
  required_quality_disclosure: "coverage and sampling; calibrated measurements; stock, mass, and nitrogen reconciliation; route shares; upstream dataset gaps; factor tier; allocation and sensitivity; provisional ranges; binding evidence; exceptions"
  update_trigger: "changed route or gate; new animal class; material feed, water, cooling, manure, energy, or co-product change; improved UUID or quantitative evidence; revised IPCC or LEAP method; failed validation; expired reporting period"
