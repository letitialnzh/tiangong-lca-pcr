  - id: "fao-ruminant-lca-2013"
    type: "literature"
    reference: "FAO, *Greenhouse gas emissions from ruminant supply chains — A global life cycle assessment*, 2013, https://www.fao.org/docrep/018/i3461e/i3461e.pdf"
    used_for: "route typology and attribution context"
  - id: "fao-leap-nutrient-flows-2018"
    type: "official_guidance"
    reference: "FAO LEAP, *Nutrient flows and associated environmental impacts in livestock supply chains*, 2018, https://openknowledge.fao.org/handle/20.500.14283/ca1328en"
    used_for: "manure, nutrient, and nitrogen-flow requirements"
  - id: "ipcc-2019-livestock-manure"
