measurement_rules:
  - id: reference_mass
    applies_to: "Reference physical raw-milk flow"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record physical saleable raw-milk mass in kg and normalize to 1 kg physical milk; volume-only records require measured density for the represented milk and temperature. Report FPCM separately using measured composition."
  - id: milk_composition
    applies_to: "Milk fat and true protein"
    required_property_ref:
      name: "Mass fraction"
      uuid: ""
    required_unit: "% by mass"
    rule: "Use representative measured fat and true-protein percentages for the same milk mass and period; do not substitute crude protein without a disclosed, justified conversion."
  - id: dry_matter_basis
    applies_to: "Feed intake and bedding"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg dry matter"
    rule: "Preserve as-fed mass and dry-matter fraction in raw records, then calculate kg dry matter; disclose any feed quantity that cannot be converted."
  - id: liveweight_basis
    applies_to: "Animals leaving the farm"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg live weight"
    rule: "Use live weight at farm exit or a documented conversion; carcass mass shall not be inserted as live weight without the conversion basis."
  - id: gas_mass_basis
    applies_to: "Direct gaseous emissions"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg substance"
    rule: "Record each emitted substance separately before impact characterization; do not store CO2-equivalent values as elementary-flow masses."
