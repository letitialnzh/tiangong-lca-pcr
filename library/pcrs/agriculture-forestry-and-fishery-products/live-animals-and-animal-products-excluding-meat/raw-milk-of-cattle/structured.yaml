allocation_rules:
  - rule_id: a_outputs
    applies_to: "milk, transferred calves/culls and manure"
    rule: "Treat as co-products only when independently transferred and measured; rejected milk, mortality, unusable manure and internal replacements are not saleable co-products."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: a_mass_balance
    applies_to: "warm and chilled milk"
    rule: "For each batch, gross collected milk equals warm final output plus milk sent to cooling plus pre-cooling rejects and losses; milk sent to cooling equals milk entering cooling, which equals chilled final output plus cooling rejects and losses. Warm and chilled final paths are exclusive per batch. Internal transfer cards carry no second product burden."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: a_coproduct
    applies_to: "milk and independently transferred live cattle"
    rule: "First separate product-specific operations such as milking and cooling. Attribute inseparable herd burdens between milk and live cattle by a documented biophysical relationship using milk-production and live-growth energy requirements by animal class and period; retain inputs and test sensitivity. Economic allocation is a disclosed sensitivity only, not the default. Do not assume substitution credit."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: a_period_asset
    applies_to: "herd and shared assets"
    rule: "Attribute replacements, housing, milking and cooling assets by herd, phase and measured service to benefiting periods and outputs; count each asset service and opening burden once."
    source_ids:
      - fao-leap-large-ruminants-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd_events
      process_id: "dairy_herd"
      flow_role: "herd and CH4"
      record_type: "animal-event log"
      raw_fields: "class, lactation state, count, dates, opening/closing live mass, growth, source, disposition"
      collection_method: "herd register and scale"
      unit: "head; kg"
      frequency: "each event"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "cohort-period totals; one opening balance"
      quality_evidence: "register, scale calibration"
    - protocol_id: cp_herd_feed
      process_id: "dairy_herd"
      flow_role: "feed"
      record_type: "feed issue and grazing log"
      raw_fields: "feed id, origin, mass, dry matter, class, period"
      collection_method: "store issue and pasture observation"
      unit: "kg"
      frequency: "daily or batch"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "sum by feed and class; convert dry matter"
      quality_evidence: "invoice, weigh ticket, moisture test"
    - protocol_id: cp_water
      process_id: "all_applicable_nodes"
      flow_role: "supplied water and wastewater"
      record_type: "meter and destination log"
      raw_fields: "source, purpose, volume, destination, meter id"
      collection_method: "meter reading and service log"
      unit: "m3"
      frequency: "each meter interval"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "assign by consumer and period"
      quality_evidence: "meter calibration, invoice"
    - protocol_id: cp_energy
      process_id: "all_applicable_nodes"
      flow_role: "energy and assets"
      record_type: "meter/fuel log"
      raw_fields: "carrier, quantity, unit, meter, asset, service hours, consumer"
      collection_method: "meter, invoice, fuel receipt"
      unit: "native carrier unit"
      frequency: "each interval"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "allocate shared use once by measured service"
      quality_evidence: "meter, invoice, asset register"
    - protocol_id: cp_manure
      process_id: "dairy_herd"
      flow_role: "manure and N emissions"
      record_type: "pathway log"
      raw_fields: "animal class, VS, N, pathway, mass, handover"
      collection_method: "storage and nutrient records"
      unit: "kg; kg N"
      frequency: "monthly and event"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "mass and nutrient balance by pathway"
      quality_evidence: "weigh ticket, assay, destination"
    - protocol_id: cp_milk_balance
      process_id: "milk_collection_primary_conditioning_farm_cooling"
      flow_role: "accepted and rejected milk"
      record_type: "milk batch log"
      raw_fields: "gross mass, accepted mass, rejection reason, loss, temperature, solids, handover"
      collection_method: "calibrated tank/scale and sampling"
      unit: "kg; °C; %"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "batch balance; final warm/chilled partition"
      quality_evidence: "tank calibration, acceptance and lab record"
  calculation_rules:
    - id: c_milk_balance
      applies_to: "milk batches"
      rule: "Gross collected = warm final + sent to cooling + pre-cooling reject/loss; sent to cooling = entering cooling = chilled final + cooling reject/loss. Select exactly one terminal state per batch and count intermediate transfers once."
      inputs:
        - "batch mass"
        - rejection
        - "each internal handover"
        - loss
        - "final state"
      output: "kg accepted milk"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: c_enteric_ch4
      applies_to: "dairy herd"
      rule: "Calculate enteric CH4 by IPCC dairy category, activity and chosen tier; retain factor version."
      inputs:
        - "animal class"
        - population
        - period
        - "feed/activity"
      output: "kg CH4"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: c_manure
      applies_to: "manure"
      rule: "Calculate N2O, NH3 and applicable CH4 separately by VS, nitrogen and pathway; prevent duplicate emission accounting."
      inputs:
        - "manure VS"
        - N
        - "pathway and period"
      output: "kg species"
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrient-flows-2018
    - id: c_shared_service
      applies_to: "shared assets"
      rule: "Assign each shared asset once among herd, milking and cooling nodes and periods by evidenced service."
      inputs:
        - "meter/asset register"
        - "service records"
      output: "allocated input quantity"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: c_biophysical_allocation
      applies_to: "milk and transferred live cattle"
      rule: "Separate product-specific operations first, then calculate the residual herd-burden shares from documented energy requirements for milk production and live growth by class and period; shares must sum to one."
      inputs:
        - "milk yield/composition"
        - "herd growth"
        - classes
        - "energy-requirement method and period"
      output: "milk and live-cattle burden shares"
      source_ids:
        - fao-leap-large-ruminants-2016
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each milk batch"
      requirement: "Verify cow/raw identity, warm/chilled state, farm gate and transfer of control; chilled UUID cannot represent warm milk."
      evidence: "batch and handover records"
    - id: dq_completeness
      applies_to: "herd and milk"
      requirement: "Reconcile opening/closing herd and gross, accepted, rejected and lost mass by batch."
      evidence: "herd register and tank balance"
    - id: dq_period
      applies_to: "cross-period inputs"
      requirement: "Verify replacement, asset and termination attribution to benefiting periods exactly once."
      evidence: "phase and asset logs"
    - id: dq_flow
      applies_to: "supplies and emissions"
      requirement: "Retain water and energy source, manure pathway, emission species and medium, and factor version."
      evidence: "meters, nutrient log and calculation sheet"
validation_rules:
  - rule_id: v_gate
    applies_to: "reference"
    rule: "Confirm final milk handover at producing farm gate and exactly one warm or farm-chilled batch state; cooling-centre records belong downstream."
    source_ids:
      - fao-milk-cooling-centres-2016
  - rule_id: v_mass
    applies_to: "batch balance"
    rule: "Reconcile gross, accepted, rejected and loss mass; retain composition, temperature and acceptance evidence."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: v_routes
    applies_to: "routes and herd"
    rule: "Evidence grazing/housed deltas in feed, manure, energy and calculation, with replacements and culls reconciled by herd and period."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: v_attribution
    applies_to: "co-products and shared assets"
    rule: "Check each independent output handover, biophysical energy-demand inputs, asset service and cross-period burden for one-time attribution; disclose manure treatment and sensitivity."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: v_emissions
    applies_to: "emissions"
    rule: "Check IPCC cattle class, manure pathway, species, medium and applicable factors; reject unspeciated aggregate emission UUIDs."
    source_ids:
      - ipcc-2019-livestock-manure
published_dataset_profile:
  dataset_role: "foreground package for raw cow milk at producing farm gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "use in downstream processes or lifecycle models when species, handover state, geography, route and quality align"
  excluded_use: "not representative of pasteurized/consumer-packaged milk, buffalo/goat milk, or independent cooling centres"
  required_metadata: "herd, periods, route, milk amount/quality, warm/chilled state, temperature, rejection, manure, co-products and attribution"
  required_quality_disclosure: "unresolved flow identities, provisional ranges, measurement quality, emission factors, upstream data and allocation sensitivity"
  update_trigger: "material change in herd composition, route, cooling control, handover state, method or factors"
