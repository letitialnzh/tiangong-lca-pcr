      flow_role: "accepted and rejected milk"
      record_type: "milk batch log"
      raw_fields: "gross mass, accepted mass, rejection reason, loss, temperature, solids, handover"
      collection_method: "calibrated tank/scale and sampling; Raw aggregation requirements: batch balance; final warm/chilled partition. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; °C; %"
      frequency: "each batch"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "tank calibration, acceptance and lab record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
  calculation_rules:
    - id: c_milk_balance
      applies_to: "milk batches"
      rule: "Gross collected = warm final + sent to cooling + pre-cooling reject/loss; sent to cooling = entering cooling = chilled final + cooling reject/loss. Select exactly one terminal state per batch and count intermediate transfers once."
      inputs:
        - "batch mass"
        - rejection
        - "each internal handover"
        - loss
        - "final state"
      output: "kg accepted milk"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: c_enteric_ch4
      applies_to: "dairy herd"
      rule: "Calculate enteric CH4 by IPCC dairy category, activity and chosen tier; retain factor version."
      inputs:
        - "animal class"
        - population
        - period
        - "feed/activity"
      output: "kg CH4"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: c_manure
      applies_to: "manure"
      rule: "Calculate N2O, NH3 and applicable CH4 separately by VS, nitrogen and pathway; prevent duplicate emission accounting."
      inputs:
        - "manure VS"
        - N
        - "pathway and period"
      output: "kg species"
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrient-flows-2018
    - id: c_shared_service
      applies_to: "shared assets"
      rule: "Assign each shared asset once among herd, milking and cooling nodes and periods by evidenced service."
      inputs:
        - "meter/asset register"
        - "service records"
      output: "allocated input quantity"
      source_ids:
        - fao-leap-large-ruminants-2016
    - id: c_biophysical_allocation
      applies_to: "milk and transferred live cattle"
      rule: "Separate product-specific operations first, then calculate the residual herd-burden shares from documented energy requirements for milk production and live growth by class and period; shares must sum to one."
      inputs:
        - "milk yield/composition"
        - "herd growth"
        - classes
        - "energy-requirement method and period"
      output: "milk and live-cattle burden shares"
      source_ids:
        - fao-leap-large-ruminants-2016
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each milk batch"
      requirement: "Verify cow/raw identity, warm/chilled state, farm gate and transfer of control; chilled UUID cannot represent warm milk."
      evidence: "batch and handover records"
    - id: dq_completeness
      applies_to: "herd and milk"
      requirement: "Reconcile opening/closing herd and gross, accepted, rejected and lost mass by batch."
      evidence: "herd register and tank balance"
    - id: dq_period
      applies_to: "cross-period inputs"
      requirement: "Verify replacement, asset and termination attribution to benefiting periods exactly once."
      evidence: "phase and asset logs"
    - id: dq_flow
      applies_to: "supplies and emissions"
      requirement: "Retain water and energy source, manure pathway, emission species and medium, and factor version."
      evidence: "meters, nutrient log and calculation sheet"
