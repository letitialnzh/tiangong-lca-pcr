    reference: "FAO LEAP Partnership (2016), *Environmental performance of animal feeds supply chains: Guidelines for assessment*, https://www.fao.org/partnerships/leap/resources/publications/en (accessed 2026-07-24)"
    used_for: "Feed origin, upstream feed datasets, directly managed feed production, and land-related inventory"
