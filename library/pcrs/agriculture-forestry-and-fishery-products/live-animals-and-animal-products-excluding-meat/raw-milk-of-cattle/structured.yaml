system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The boundary starts with the declared opening dairy herd and burden-bearing purchased replacements. It includes lactation, dry and replacement phases, feed and water, controlled manure management, milking, straining and acceptance, plus cooling only under farm control before transfer. Milking is a distinct capture responsibility: it turns herd milk production into measured gross collected milk. First conditioning changes that raw collected state into an accepted state. Optional cooling preserves already usable raw milk; it is neither pasteurization nor a separate raw-milk product category."
      source_ids: []
    - rule_id: b_farm_gate
      applies_to: "final raw milk"
      rule: "Include farm-controlled activities before farm-gate handover only; independent cooling centres and onward transport are downstream."
      source_ids:
        - fao-milk-cooling-centres-2016
    - rule_id: b_milk_state
      applies_to: "warm and chilled milk"
      rule: "Declare final state; warm direct and farm-chilled handovers are exclusive, and internal milk transfers are not final outputs."
      source_ids:
        - fao-milk-cooling-centres-2016
    - rule_id: b_herd_routes
      applies_to: "grazing and housed herds"
      rule: "Use managed dairy herd production as parent; evidence each route delta in feed, manure, energy, herd records and calculations."
      source_ids:
        - fao-leap-large-ruminants-2016
    - rule_id: b_periods
      applies_to: "lactation, dry, replacement and culling"
      rule: "Link inputs, assets, milk and culling to herd and period; assign opening burdens, replacements and termination once."
      source_ids:
        - fao-leap-large-ruminants-2016
    - rule_id: b_manure
      applies_to: "excreta"
      rule: "Separate deposition, collection, storage, application and export, with nitrogen and volatile solids tracked by pathway."
      source_ids:
        - fao-leap-nutrient-flows-2018
        - ipcc-2019-livestock-manure
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids:
        - fao-milk-cooling-centres-2016
