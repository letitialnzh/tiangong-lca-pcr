allocation_rules:
  - rule_id: a_outputs
    applies_to: "milk, transferred calves/culls and manure"
    rule: "Treat as co-products only when independently transferred and measured; rejected milk, mortality, unusable manure and internal replacements are not saleable co-products."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: a_mass_balance
    applies_to: "warm and chilled milk"
    rule: "For each batch, gross collected milk equals warm final output plus milk sent to cooling plus pre-cooling rejects and losses; milk sent to cooling equals milk entering cooling, which equals chilled final output plus cooling rejects and losses. Warm and chilled final paths are exclusive per batch. Internal transfer cards carry no second product burden."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: a_coproduct
    applies_to: "milk and independently transferred live cattle"
    rule: "First separate product-specific operations such as milking and cooling. Attribute inseparable herd burdens between milk and live cattle by a documented biophysical relationship using milk-production and live-growth energy requirements by animal class and period; retain inputs and test sensitivity. Economic allocation is a disclosed sensitivity only, not the default. Do not assume substitution credit."
    source_ids:
      - fao-leap-large-ruminants-2016
  - rule_id: a_period_asset
    applies_to: "herd and shared assets"
    rule: "Attribute replacements, housing, milking and cooling assets by herd, phase and measured service to benefiting periods and outputs; count each asset service and opening burden once."
    source_ids:
      - fao-leap-large-ruminants-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd_events
      process_id: "dairy_herd"
      flow_role: "herd and CH4"
      record_type: "animal-event log"
      raw_fields: "class, lactation state, count, dates, opening/closing live mass, growth, source, disposition"
      collection_method: "herd register and scale; Raw aggregation requirements: cohort-period totals; one opening balance. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "each event"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "register, scale calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_herd_feed
      process_id: "dairy_herd"
      flow_role: "feed"
      record_type: "feed issue and grazing log"
      raw_fields: "feed id, origin, mass, dry matter, class, period"
      collection_method: "store issue and pasture observation; Raw aggregation requirements: sum by feed and class; convert dry matter. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "daily or batch"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice, weigh ticket, moisture test; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_water
      process_id: "all_applicable_nodes"
      flow_role: "supplied water and wastewater"
      record_type: "meter and destination log"
      raw_fields: "source, purpose, volume, destination, meter id"
      collection_method: "meter reading and service log; Raw aggregation requirements: assign by consumer and period. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3"
      frequency: "each meter interval"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration, invoice; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_energy
