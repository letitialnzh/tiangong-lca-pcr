    used_for: "Reference unit-group identity and kg reference unit"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation-of-mass identity applied to milk, feed, herd, and manure reconciliation"
    used_for: "Internal-flow cancellation, milk disposition balance, and QA bounds"
  - id: "fao-milking-cleaning"
    type: "official_guidance"
    reference: "FAO Milking, milk production hygiene and udder health; cleaning-agent context, actual concentration and quantities from site records, https://www.fao.org/4/t0218e/T0218E03.htm"
    used_for: "Conditional identity context; verify actual site use, quantities and applicability separately"
