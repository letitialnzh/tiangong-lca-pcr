  classification_refs: "CPC 3.0: 02211 Raw milk of cattle (exact)"
  covered_products: "Raw whole milk from cattle, including saleable chilled farm milk before heat treatment or dairy processing"
  excluded_products: "Raw milk from non-cattle species; separated, standardized, pasteurized, sterilized, homogenized, concentrated, dried, fermented, flavoured, or otherwise processed milk; milk consumed entirely within the farm and not delivered as product"
  representative_product: "Chilled raw whole cattle milk ready to leave on-farm storage"
  production_route: "Dairy herd management, feed supply, manure management, milking, cooling, and on-farm storage to the farm gate"
  market_state: "Unprocessed liquid raw milk at the farm gate, normally chilled and declared by measured fat and true-protein content"
functional_unit:
  what: "Provision of raw cattle milk ready to leave the dairy farm"
  how_much: "1 kg of physical saleable raw cattle milk at the farm gate, with measured fat and true-protein content"
  how_well: "Raw whole cattle milk meeting the declared farm-gate specification, with measured physical mass, fat content, true-protein content, temperature, and saleable status"
  how_long_or_cycle: "One representative reporting year or another declared period covering seasonal variation and a stable herd production cycle"
  reference_flow_link: "raw_cattle_milk"
system_boundary:
  rules:
    - rule_id: boundary_farm_gate
      applies_to: "Product system to farm gate"
      rule: "Include dairy herd maintenance and replacements, feed and bedding supply, enteric fermentation, manure collection/storage/treatment, directly managed feed production, input energy and water, milking, cleaning, cooling, refrigerant losses, and on-farm raw-milk storage up to milk ready to leave the farm."
      source_ids:
        - idf-dairy-carbon-footprint-2022
        - fao-leap-large-ruminants-2016
    - rule_id: boundary_whole_herd
      applies_to: "Reporting herd"
      rule: "Represent lactating and dry cows, replacement animals, calves, culls, mortality, herd inventory change, and animal movements supporting reported milk output; do not model only lactating cows when other herd classes share burdens."
      source_ids:
        - idf-dairy-carbon-footprint-2022
        - fao-leap-large-ruminants-2016
    - rule_id: boundary_upstream_inputs
      applies_to: "Purchased inputs"
      rule: "Link purchased feed, bedding, replacement animals, fuels, electricity, fertilizers, crop-protection products, cleaning agents, refrigerants, and other material inputs to geographically and technologically appropriate upstream datasets."
      source_ids:
        - idf-dairy-carbon-footprint-2022
        - fao-leap-large-ruminants-2016
    - rule_id: boundary_feed_land
      applies_to: "Feed production and land"
      rule: "Include directly managed feed-crop and pasture inputs, yields, soil emissions, irrigation, and relevant land-use-change treatment; for externally supplied feed, retain origin and composition records and link upstream burdens without duplicating them on farm."
      source_ids:
        - idf-dairy-carbon-footprint-2022
        - fao-leap-animal-feed-2016
    - rule_id: boundary_direct_emissions
      applies_to: "Cattle, manure, and managed soils"
      rule: "Calculate enteric CH4, manure-management CH4 and N2O, and relevant managed-soil emissions with methods and factors appropriate to the declared region, animal category, productivity, diet, climate, and manure system; preserve activity data and factor sources."
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrient-flows-2018
    - rule_id: boundary_exclusions
      applies_to: "Downstream life-cycle stages"
      rule: "Exclude transport after the farm gate, dairy processing, packaging, distribution, retail, consumption, and end of life; disclose any study-specific extension separately from the PCR result."
      source_ids:
        - idf-dairy-carbon-footprint-2022
boundary_abstraction:
  declared_starting_condition: "A dairy production system with the reporting herd, managed land, and production assets in service at the opening of the reporting period; herd replacement burdens and inventory changes are represented through period records and annualized calculations."
  starting_condition_role: "Establishes a reproducible farm-accounting condition for a biologically continuous dairy system without treating the opening herd as burden-free."
  product_classification_scope: "Raw cattle milk covered by CPC 3.0 code 02211; other animal milk and processed dairy products are outside the category."
  recursive_input_rule: "Raw cattle milk produced and used internally, including milk fed to calves, is recorded as internal use and deducted from saleable farm-gate output rather than linked as an upstream raw-milk dataset. Externally purchased raw cattle milk is a separate product input with an upstream dataset and cannot be netted against output."
  upstream_dataset_requirement: "Every purchased feed, animal, energy carrier, material, and externally provided service crossing the boundary requires a representative upstream dataset or an explicit documented data gap; supplier-specific data are preferred when material."
  disclosure: "Declare farm geography, production system, reporting period, herd classes and inventory change, milk sold and internal use, milk composition, feed origins, manure systems, land management, allocation factors, excluded processes, data gaps, and any non-steady operational change."
