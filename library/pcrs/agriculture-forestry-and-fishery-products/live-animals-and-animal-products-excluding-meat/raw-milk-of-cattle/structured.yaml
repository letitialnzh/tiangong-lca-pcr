      collection_method: "meter, invoice, fuel receipt; Raw aggregation requirements: allocate shared use once by measured service. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "native carrier unit"
      frequency: "each interval"
      temporal_coverage: "full reporting period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter, invoice, asset register; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
