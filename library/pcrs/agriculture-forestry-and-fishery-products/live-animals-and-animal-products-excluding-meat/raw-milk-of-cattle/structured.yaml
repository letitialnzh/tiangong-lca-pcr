process_map:
  - id: dairy_herd
    name: "Dairy Herd and Manure Production"
    inclusion: "required"
    inclusion_condition: "all lactation and replacement phases"
    role: "managed biological production; route deltas"
    quantitative_reference: "gross milk produced by reporting herd"
  - id: milk_collection
    name: "Milking and Raw Milk Capture"
    inclusion: "required"
    inclusion_condition: "every selected dairy route"
    role: "separate harvest and capture from herd production"
    quantitative_reference: "gross raw milk collected"
  - id: primary_conditioning
    name: "First Farm Milk Conditioning"
    inclusion: "required"
    inclusion_condition: "straining, acceptance and handling until farm-gate transfer or cooling"
    role: "raw-to-accepted state; loss segregation"
    quantitative_reference: "accepted warm milk plus milk passed to cooling"
  - id: farm_cooling
    name: "Farm-owned Milk Cooling"
    inclusion: "conditional"
    inclusion_condition: "only if cooling occurs under producing-farm control before handover"
    role: "preservation of already usable raw milk"
    quantitative_reference: "accepted chilled milk and cooling loss"
