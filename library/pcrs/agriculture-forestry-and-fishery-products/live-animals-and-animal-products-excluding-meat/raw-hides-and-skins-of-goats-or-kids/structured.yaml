allocation_rules:
  - rule_id: animal_phase
    applies_to: "meat/milk/fibre/breeding history"
    rule: "Link upstream inputs, animal services, replacement and termination to actual periods and products. Apply documented physical causality where defensible; otherwise use disclosed economic relation with sensitivity. Do not assign zero or all lifetime burden to the hide by default."
    source_ids:
      - fao-small-ruminant
  - rule_id: terminal_output_set
    applies_to: "slaughter versus fallen recovery"
    rule: "List every actual independently marketed skin, meat/carcass and other terminal output and its handover; allocate joint burdens only among real intended products, with shares summing to one. Fallen recovery creates no assumed meat product. Residue and Waste are not automatically co-products."
    source_ids:
      - fao-small-ruminant
  - rule_id: grade_and_state
    applies_to: "sorting and preservation"
    rule: "Saleable accepted and downgraded grades are distinct products only where actual independent sales occur; rejected skin, spent brine and trims follow measured treatment. Do not credit loss as saleable output."
    source_ids:
      - fao-hides
  - rule_id: shared_period
    applies_to: "shared sites and containers"
    rule: "Allocate room, frame, meter and reusable-container burdens among actual consuming nodes/lots and periods by measured hours or throughput; count each service once and disclose choice."
    source_ids:
      - fao-hides
dataset_production:
  collection_protocols:
    - protocol_id: cp_removal
      process_id: "removal"
      flow_role: "actual terminal event and independent skin"
      record_type: "animal-event ticket"
      raw_fields: "animal and lot ID, species, source route, legal status, live/body mass, skin removal, skin/meat/other products, Waste, gate, period"
      collection_method: "slaughter/recovery tickets, calibrated scales, upstream dataset linkage; Raw aggregation requirements: match one body input to real outputs and recorded loss. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, event"
      frequency: "each event"
      temporal_coverage: "animal service and terminal periods"
      site_scope: "actual source and removal site"
      aggregation_rule: "per reference flow"
      quality_evidence: "tickets, scales, legal records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_conditioning
      process_id: "conditioning"
      flow_role: "first prepared-skin state"
      record_type: "processing batch"
      raw_fields: "incoming skin, water, prepared skin, trims, moisture, lot, time"
      collection_method: "batch sheet, water meter and calibrated scale; Raw aggregation requirements: reconcile mass by state and treatment. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, h"
      frequency: "each batch"
      temporal_coverage: "reference production period"
      site_scope: "actual conditioning site"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter and scale calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grading
      process_id: "grading"
      flow_role: "accepted/downgraded/rejected destinations"
      record_type: "grade ledger"
      raw_fields: "incoming lot, grade, accepted, downgraded, rejected masses and destinations"
      collection_method: "scale and sale/dispatch documents; Raw aggregation requirements: partition actual grade and reject destinations. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "reference production period"
      site_scope: "grading site"
      aggregation_rule: "per reference flow"
      quality_evidence: "grade and dispatch evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_preservation
      process_id: "preservation"
      flow_role: "actual curing or chilling"
      record_type: "preservation batch"
      raw_fields: "inlet state and mass, salt/medium, utility carrier, output state/mass, moisture, retained salt, spent liquor, time"
      collection_method: "batch sheet, meter and laboratory/scale records; Raw aggregation requirements: separate fresh bypass and each intervention. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, kWh, h"
      frequency: "each preserved batch"
      temporal_coverage: "actual preservation periods"
      site_scope: "curing site"
      aggregation_rule: "per reference flow"
      quality_evidence: "batch, calibration and sample record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_gate
      process_id: "gate"
      flow_role: "net saleable skin and package"
      record_type: "dispatch lot"
      raw_fields: "incoming state, grade, gross mass, free brine, package tare/reuse, net skin mass, gate, destination"
      collection_method: "dispatch scale, container ledger and invoice; Raw aggregation requirements: one final net-skin output per sold lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, event"
      frequency: "each dispatch"
      temporal_coverage: "reference handover period"
      site_scope: "actual handover site"
      aggregation_rule: "per reference flow"
      quality_evidence: "dispatch and tare tickets; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: net_reference
      applies_to: "handover"
      rule: "Net skin mass = gross weighed dispatch minus detachable package and free brine; divide attributable inventories by measured net kg."
      inputs:
        - gross
        - "package tare"
        - "free brine"
        - "lot ID"
      output: "inventory per 1 kg as-sold raw skin"
      source_ids:
        - un-cpc-3
    - id: state_balance
      applies_to: "each preparation node"
      rule: "Reconcile state-specific inlet mass plus actual added water/salt with outgoing skin, residues, drained liquor and measured moisture change; no universal conversion."
      inputs:
        - "lot masses"
        - moisture
        - salt
        - water
        - losses
      output: "documented state transition"
      source_ids:
        - fao-small-ruminant
    - id: attribution_check
      applies_to: "animal and shared assets"
      rule: "Sum attributable shares to one per real joint-output node and service period; never count same animal phase, room, meter or container twice."
      inputs:
        - "product sales"
        - "physical drivers"
        - periods
        - "service records"
      output: "attributable burden per final kg"
      source_ids:
        - fao-hides
  data_quality_requirements:
    - id: legal_trace
      applies_to: "each recovered skin"
      requirement: "Verify goat/kid identity, terminal route, lawful and quality-acceptable recovery, actual separate skin sale and gate."
      evidence: "animal ticket, legal and dispatch record"
    - id: state_trace
      applies_to: "all mass transitions"
      requirement: "Distinguish wet, prepared, graded, fresh and preserved skin; document moisture, retained salt and package tare."
      evidence: "calibrated scales, tests, batch ledger"
    - id: period_complete
      applies_to: "upstream and shared service"
      requirement: "Link meat/milk/fibre/breeding periods, terminal event, assets and every consuming node; record exclusions and branch bypass."
      evidence: "upstream dataset, meter and period ledger"
validation_rules:
  - rule_id: category_gate
    applies_to: "reference"
    rule: "Reject sheep, furrier furskin, tanning-stage wet blue or non-raw leather; require species, state and actual pre-tannery gate."
    source_ids:
      - un-cpc-3
  - rule_id: separation
    applies_to: "terminal"
    rule: "Check a skin is physically recovered and sold separately; no invented output from skin-on carcass. Match live Product or fallen Waste to the actual route and legal role."
    source_ids:
      - fao-small-ruminant
  - rule_id: route_balance
    applies_to: "all nodes"
    rule: "Match lot IDs and measured masses from removal to final single handover; reconcile accepted, downgraded, rejected, retained salt, free brine and explained moisture change."
    source_ids:
      - fao-small-ruminant
  - rule_id: outputs_periods
    applies_to: "allocation"
    rule: "Confirm actual meat/milk/fibre/breeding output sets, periods, shared consumers and attribution shares; prevent zero/whole-hide burden defaults and double count."
    source_ids:
      - fao-hides
  - rule_id: identity_resolution
    applies_to: "concrete dataset exchange"
    rule: "Resolve each unresolved product/waste/elementary identity to a detail-verified compatible flow before generating a final exchange; conditional flow scope is provisional, not a UUID."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground raw goat/kid skin production package, candidate methodology"
  downstream_use: "secondary_dataset; background_dataset when gate, period, route and identity match"
  allowed_use: "Separately sold, raw untanned goat/kid skins with actual legal source, state and gate"
  excluded_use: "Sheep/furskin/leather, fictitious skin-on-carcass output, undisclosed recovery or unverified fixed exchange"
  required_metadata: "species, legal origin, terminal event, grade, state, moisture, retained salt, period, gate, allocation, package"
  required_quality_disclosure: "measured versus estimated amounts, upstream compatibility, shared-asset allocation, unresolved UUIDs and QA Range limits"
  update_trigger: "changed route, classification, hide state, flow identity, quantitative evidence or gate"
data_sources:
  - id: "un-cpc-3"
    type: "official_guidance"
    reference: "[UN CPC 3.0 explanatory notes](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "raw-category and processed-goods boundary"
  - id: "fao-small-ruminant"
    type: "official_guidance"
    reference: "[FAO, Manual for slaughter of small ruminants, chapter 10](https://www.fao.org/4/X6552E/X6552E10.htm)"
    used_for: "actual skin separation, first curing and residues"
  - id: "fao-hides"
    type: "official_guidance"
    reference: "[FAO, Hides and Skins](https://www.fao.org/4/i0523e/i0523e.pdf)"
    used_for: "hide collection, quality, grading and preservation"
