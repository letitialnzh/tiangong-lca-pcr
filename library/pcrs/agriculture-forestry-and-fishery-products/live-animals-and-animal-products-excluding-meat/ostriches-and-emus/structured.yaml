allocation_rules:
  - rule_id: a_outputs
    applies_to: "Eggs, chicks, living culls"
    rule: "First separate divisible processes; for genuinely joint independent outputs use measured output mass, with documented egg mass conversion, for residual burden and report economic sensitivity when values materially differ. Internal transfers are not final co-products."
    source_ids:
      - fao-ostrich-systems
  - rule_id: a_periods
    applies_to: "Breeders and long-lived assets"
    rule: "Assign inputs, replacement, eggs and live outputs to actual breeder seasons; distribute shared assets by consuming node and measured service period without duplication."
    source_ids:
      - fao-ostrich-farming
      - aus-ratite-industry
  - rule_id: a_residue
    applies_to: "Mortality, manure and feathers"
    rule: "Dead birds, discarded manure, failed eggs and incidental feathers get no invented co-product credit; usable manure or feathers qualify only at demonstrated independent product handover."
    source_ids:
      - fao-ostrich-farming
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_birds
      process_id: "breeder_incubation_rearing_handover"
      flow_role: "living bird movements"
      record_type: "flock ledger"
      raw_fields: "species; stage; heads; live kg; origin; final gate; dates"
      collection_method: "scale and movement log; Raw aggregation requirements: reconcile opening, purchased, hatched, sold, culled, dead, closing. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "bird; kg"
      frequency: "each movement"
      temporal_coverage: "all cohorts"
      site_scope: "all nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated scale and transfer records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed
      process_id: "breeder_rearing"
      flow_role: "feed and grazing"
      record_type: "store and pasture log"
      raw_fields: "delivery; stock; loss; grazing days; species; stage ; unused returns/transfers; uneaten loss; actual intake; loss destination; moisture/DM"
      collection_method: "Feed input carrying upstream burden = opening stock + receipts - closing stock - documented unused returns or transfers out. Keep in-boundary spoilage and refusals in that input. Separately derive biological intake = that input - measured uneaten losses, with moisture/DM reconciliation; use intake, not purchased input, in animal metabolism calculations. Record each loss destination and include its treatment or manure contribution once. Preserve raw records and normalize attributed quantities to the accepted reference output once."
      unit: "kg"
      frequency: "monthly"
      temporal_coverage: "full cycle"
      site_scope: "all feed users"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice and stock sheets; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_eggs
      process_id: "breeder_incubation"
      flow_role: "egg disposition"
      record_type: "egg ledger"
      raw_fields: "laid; purchased; incubated; sold; rejected; closing; batch"
      collection_method: "nest and incubator log; Raw aggregation requirements: balance egg destinations. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "egg; kg"
      frequency: "each batch"
      temporal_coverage: "breeder season"
      site_scope: "all nests and incubators"
      aggregation_rule: "per reference flow"
      quality_evidence: "batch records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_utilities
      process_id: "breeder_incubation_rearing"
      flow_role: "water and energy"
      record_type: "meter log"
      raw_fields: "water; power; fuel; service period; node"
      collection_method: "meter and invoice; Raw aggregation requirements: allocate measured use once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; kWh"
      frequency: "monthly"
      temporal_coverage: "full service period"
      site_scope: "all shared users"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter and invoices; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_waste
      process_id: "breeder_incubation_rearing_handover"
      flow_role: "waste and emissions"
      record_type: "disposal/manure log"
      raw_fields: "dead kg; rejected egg kg; manure kg; N content; management pathway"
      collection_method: "weighing, disposal tickets and N analysis; Raw aggregation requirements: segregate product and waste; calculate pathway emission. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "batch or month"
      temporal_coverage: "whole cohort"
      site_scope: "all nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "tickets and analysis; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
    - protocol_id: cp_pathway_emissions
      process_id: "breeder_rearing"
      flow_role: "pathway-specific gases and manure N/C"
      record_type: "herd, feed, manure, field and method ledger"
      raw_fields: "species/class; animal-days; intake/DM/digestibility; volatile solids; manure N/TAN; system shares; climate; storage time; fertiliser N; grazing; volatilisation/leaching; methane recovery; factor source/unit; final accepted output ; collected manure wet mass; dry matter; destination"
      collection_method: "collect primary activity by node and period, document parameter applicability, retain each pathway worksheet and any linked treatment/pasture dataset  Retain raw totals and normalize attributed quantities once to the measured accepted final reference output."
      unit: "animal-day; kg DM; kg VS; kg N; kg CH4; kg N2O; kg NH3"
      frequency: "each operating period and management change"
      temporal_coverage: "complete represented cohort and service period"
      site_scope: "actual operated nodes only"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter/analysis records, nitrogen cascade, method and factor evidence, no-duplication ledger"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "breeder_rearing"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "breeder_rearing"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: c_mass
      applies_to: "Final live birds"
      rule: "Sum measured accepted living mass at one actual final gate; divide inventories by those kg."
      inputs:
        - cp_birds
      output: "kg"
      source_ids:
        - un-cpc-2025
    - id: c_balance
      applies_to: "Egg and bird cohorts"
      rule: "Eggs: opening+laid+purchased=incubated+sold+rejected+closing; birds: opening+hatched+purchased=sold+culled+dead+closing."
      inputs:
        - cp_birds
        - cp_eggs
      output: "balanced counts"
      source_ids:
        - fao-ostrich-systems
    - id: c_air
      applies_to: "Manure N2O"
      rule: "Calculate from collected manure N and a sourced species- and pathway-applicable method; the UUID is not an emission factor. IPCC ostrich data must not be silently generalized to emus or rheas."
      inputs:
        - cp_waste
      output: "kg N2O"
      source_ids:
        - ipcc-livestock-2019
    - id: c_nh3
      applies_to: "Manure NH3"
      rule: "Calculate separately from collected manure N only after an applicable species- and pathway-specific method is identified and disclosed; absent that method, keep the amount unresolved rather than substitute an ostrich default."
      inputs:
        - cp_waste
      output: "kg NH3"
      source_ids: []
    - id: calc_feed_input_and_intake
      applies_to: "Feed supply and biological intake"
      rule: "Feed input carrying upstream burden = opening stock + receipts - closing stock - documented unused returns or transfers out. Keep in-boundary spoilage and refusals in that input. Separately derive biological intake = that input - measured uneaten losses, with moisture/DM reconciliation; use intake, not purchased input, in animal metabolism calculations. Record each loss destination and include its treatment or manure contribution once."
      inputs:
        - cp_feed
      output: "separate kg feed input, intake and loss by cohort"
      source_ids:
        - review-fao-pig-lca-2018
    - id: calc_pathway_emissions
      applies_to: "breeder; rearing"
      rule: "Use species- and management-compatible methods and retain disaggregated pathway totals. Convert N2O-N to N2O by 44/28 and NH3-N to NH3 by 17/14 exactly once; already molecular masses are not reconverted. Check methane against the documented available-carbon/methane-potential balance and nitrogen losses against each stage's available N. Indirect formation from previously volatilised N is a downstream transformation, not a second source-stage N loss. Attribute and normalize once; do not duplicate linked treatment or fate-model emissions.  Use matched raw-period quantities before allocation for physical screens: CH4 mass × 12/16 must not exceed the carbon available to the represented pathway; source-stage NH3 mass × 14/17 plus direct N2O mass × 28/44 and other source N losses must not exceed that stage's available N, after accounting for stocks and transfers. Bound each indirect N2O-N calculation by its documented volatilised or leached N precursor, not by subtracting that downstream transformation again from the source ledger. These are conservation checks, not emission factors or an empirical per-product range."
      inputs:
        - cp_pathway_emissions
      output: "kg named compound per final reference flow"
      source_ids:
        - ipcc-livestock-2019
        - review-eea-manure-2023
        - review-ipcc-soils-2019
    - id: calc_feed_supply_and_intake
      applies_to: "breeder_feed; rearing_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - review-fao-pig-lca-2018
    - id: calc_manure_n2o_coverage
      applies_to: "review_breeder_direct_n2o; review_breeder_indirect_n2o; manure_n2o_air"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-livestock-2019
        - review-ipcc-soils-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Every lot"
      requirement: "Record species, stage, count, live mass, actual gate and time; hatchery gate cannot stand for farm gate."
      evidence: "cp_birds"
    - id: dq_route
      applies_to: "Production modes"
      requirement: "Keep separate feed, grazing, housing, utilities, mortality and manure evidence; no universal ratite yield."
      evidence: "cp_feed; cp_utilities; cp_waste"
    - id: dq_allocation
      applies_to: "Multiple outputs, periods, assets"
      requirement: "Retain independent handover, service-period and consuming-node evidence; prohibit double burden."
      evidence: "cp_birds; cp_eggs; cp_utilities"
validation_rules:
  - rule_id: v_identity
    applies_to: "Reference lot"
    rule: "Fail for dead/non-ostrich-emu-rhea birds, missing mass/count/gate, or hatchery gate using farm-gate UUID."
    source_ids:
      - un-cpc-2025
  - rule_id: v_balance
    applies_to: "Egg and bird cohorts"
    rule: "Reconcile egg/bird balances by species and stage, internal transfers and death destinations; only one final gate."
    source_ids:
      - fao-ostrich-systems
  - rule_id: v_route
    applies_to: "Alternative modes"
    rule: "Verify managed biological parent and current inventory-delta evidence for extensive, semi-intensive and intensive modes."
    source_ids:
      - fao-ostrich-systems
      - aus-ratite-industry
  - rule_id: v_alloc
    applies_to: "Outputs, periods, assets"
    rule: "Verify actual handovers, allocation method, breeder seasons and shared service periods; no double attribution of eggs, chicks, culls or assets."
    source_ids:
      - fao-ostrich-farming
  - rule_id: v_range
    applies_to: "All inventory cards"
    rule: "Provisional QA ranges are non-negative completeness screens, not factors or substitutes for observation."
    source_ids: []
  - rule_id: v_feed_loss_burden
    applies_to: "Feed balances"
    rule: "Reject a feed-input inventory that subtracts in-boundary wastage without retaining its upstream burden. Match intake, losses, stocks and unused returns, and document the loss treatment; no automatic co-product credit."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: v_pathway_emission_coverage
    applies_to: "breeder; rearing"
    rule: "Require a pathway coverage ledger for enteric CH4 where biologically applicable, manure CH4, direct/indirect N2O, NH3 and relevant field emissions. Every pathway needs a measured/calculated value, a named linked process with matching coverage, or supported inapplicability; absent data cannot become zero. Keep wild life before capture outside managed husbandry, assess actual managed holding separately, and retain species-specific evidence."
    source_ids:
      - ipcc-livestock-2019
      - review-ipcc-soils-2019
      - review-eea-manure-2023
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-livestock-2019
      - review-ipcc-soils-2019
published_dataset_profile:
  dataset_role: "Living ratite foreground package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Producer live-ratite dataset with stated species, stage, route and actual gate"
  excluded_use: "Slaughter, meat, hide/oil, universal factors, unsupported hatchery-to-farm substitution"
  required_metadata: "Species, count, live mass, stage, route, origin, gate, periods, output destinations"
  required_quality_disclosure: "Egg/bird balances, measurement coverage, mortality, manure pathway, allocation and unbound identities"
  update_trigger: "Material change in species boundary, route, gate, UUID or factor evidence"
