allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "No allocation is required when the only product output is the transferred live ass and manure or mortalities are treated as wastes with declared treatment. If manure, compost, draught service during the rearing period, milk, hide, breeding service, or another co-product is intentionally marketed inside the foreground boundary, allocation must be declared before publication."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Subdivide processes when records separate live-animal production from manure product preparation, milk production, work service, or another co-product route."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "Use physical allocation only when a causal physical relationship is documented, such as nutrient content for marketed manure products."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Use economic allocation when physical allocation is not defensible and market values are available."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Report system expansion or substitution only as an additional scenario, with substituted product, geography, and avoided-burden dataset disclosed."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_stock_entry_records
      process_id: "stock_entry_and_breeding_basis"
      flow_role: "declared breeding herd or purchased stock entry"
      record_type: "animal receiving, birth, purchase, or herd inventory record"
      raw_fields: "animal or lot id; source; age class; sex; breed or type; intended use; live weight; acquisition or birth date; health status; upstream burden treatment"
      collection_method: "scale record, veterinary certificate, herd book, purchase invoice, or birth record; original activity aggregation: sum live weight by animal class and allocate breeding-basis burdens to live-weight output when included"
      unit: "head and kg live weight"
      frequency: "per birth, purchase, transfer, or inventory period"
      temporal_coverage: "rearing cycle or herd maintenance period"
      site_scope: "declared herd, farm, or lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration, herd book, animal movement record, purchase invoice, health certificate"
    - protocol_id: cp_live_weight_records
      process_id: "rearing_and_husbandry_farm_gate_handling_and_delivery"
      flow_role: "live ass weight and output"
      record_type: "weighing, sale, dispatch, or animal movement record"
      raw_fields: "animal or lot id; age class; sex; breed or type; weighing date; live weight; gate; buyer or destination; health status"
      collection_method: "calibrated scale, weigh tape with conversion, sale ticket, or animal movement record; original activity aggregation: sum live weight at declared gate and reconcile with entries, births, purchases, deaths, and sales"
      unit: "kg live weight and head"
      frequency: "per weighing, sale, or dispatch event"
      temporal_coverage: "rearing cycle and delivery period"
      site_scope: "animal lot, farm, and transfer gate"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale calibration, sale ticket, movement certificate, dispatch note"
    - protocol_id: cp_feed_and_forage_records
      process_id: "stock_entry_and_breeding_basis_rearing_and_husbandry"
      flow_role: "feed and forage"
      record_type: "feed purchase, grazing, feed issue, or feed balance record"
      raw_fields: "feed type; source; dry matter or as-fed basis; quantity; moisture; animal class; feeding period"
      collection_method: "invoice, feed issue log, pasture allocation record, feed inventory, or nutrition record; original activity aggregation: convert to dry matter where needed; allocate by animal-days, live weight, or documented ration group"
      unit: "kg as-fed and kg dry matter"
      frequency: "daily, batch, month, or feeding period"
      temporal_coverage: "rearing cycle or herd maintenance period"
      site_scope: "farm, pasture, housing unit, or animal class"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, feed analysis, inventory reconciliation, pasture record"
    - protocol_id: cp_water_records
      process_id: "rearing_and_husbandry"
      flow_role: "drinking and husbandry water"
      record_type: "water meter, tank fill, pump, well, or use estimate record"
      raw_fields: "source; volume; period; animal class; use type; allocation method"
      collection_method: "meter reading, pump log, water invoice, tank record, or documented estimate; original activity aggregation: sum by source and convert to kg where needed; allocate by animal-days or live weight"
      unit: "L, m3, or kg"
      frequency: "daily, month, batch, or reporting period"
      temporal_coverage: "rearing cycle"
      site_scope: "water source, housing unit, pasture, or animal lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration, pump log, water invoice, documented estimate"
    - protocol_id: cp_bedding_and_housing_records
      process_id: "rearing_and_husbandry"
      flow_role: "bedding and housing materials"
      record_type: "bedding purchase, issue, or replacement record"
      raw_fields: "material type; quantity; moisture where relevant; replacement frequency; housing unit; fate"
      collection_method: "invoice, stock issue log, housing operation record, or bedding balance; original activity aggregation: sum bedding input and assign to manure or waste route where relevant"
      unit: "kg"
      frequency: "per delivery, replacement, or reporting period"
      temporal_coverage: "rearing cycle"
      site_scope: "housing unit or animal lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, inventory log, housing record"
    - protocol_id: cp_veterinary_and_health_records
      process_id: "rearing_and_husbandry"
      flow_role: "veterinary and animal health inputs"
      record_type: "treatment, vaccine, medicine, disinfectant, or identification record"
      raw_fields: "product; active ingredient if applicable; dose; item count; treated animals; date; reason"
      collection_method: "veterinary log, invoice, product label, treatment certificate, or farm health record; original activity aggregation: sum product amount by animal lot and normalize to live-weight output when material"
      unit: "kg, L, dose, item, or product-specific unit"
      frequency: "per treatment event or reporting period"
      temporal_coverage: "rearing cycle"
      site_scope: "animal lot or farm"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "veterinary record, invoice, treatment log, product label"
    - protocol_id: cp_energy_records
      process_id: "rearing_and_husbandry"
      flow_role: "farm energy"
      record_type: "electricity, fuel, equipment, or service energy record"
      raw_fields: "carrier; quantity; meter or invoice id; operation; period; allocation method"
      collection_method: "utility bill, meter reading, fuel invoice, equipment log, or telematics; original activity aggregation: convert to MJ or kWh and allocate to live-ass production using documented basis"
      unit: "kWh, MJ, L, or kg fuel"
      frequency: "month, batch, or operation"
      temporal_coverage: "rearing cycle"
      site_scope: "farm, housing unit, pump, feed system, or manure system"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "invoice, meter record, fuel log, equipment record"
    - protocol_id: cp_manure_and_excreta_records
      process_id: "manure_and_excreta_management"
      flow_role: "manure, urine, bedding, and excreta"
      record_type: "manure collection, storage, grazing, field application, transfer, or treatment record"
      raw_fields: "animal class; manure-management system; mass or volume; dry matter; volatile solids; N content where available; storage duration; climate or temperature; fate"
      collection_method: "scale, storage volume estimate, manure analysis, farm log, grazing record, or transfer ticket; original activity aggregation: reconcile manure generated, stored, treated, deposited, transferred, sold, or disposed; calculate emissions by declared method"
      unit: "kg wet mass, kg dry matter, kg VS, kg N, m3"
      frequency: "daily, batch, storage cycle, application event, or reporting period"
      temporal_coverage: "rearing cycle and manure storage period"
      site_scope: "housing, yard, pasture, storage, field, or transfer point"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "manure analysis, storage log, transfer ticket, application record, IPCC or EMEP method documentation"
    - protocol_id: cp_mortality_and_cull_records
      process_id: "stock_entry_and_breeding_basis_rearing_and_husbandry"
      flow_role: "mortality and non-marketable culls"
      record_type: "animal death, cull, disposal, or rendering record"
      raw_fields: "animal id or lot; date; age class; estimated live weight or carcass mass; cause category when available; fate"
      collection_method: "farm mortality log, veterinary record, disposal ticket, rendering receipt, or burial/compost record; original activity aggregation: sum mortality and cull mass by fate and normalize to live-weight output"
      unit: "head and kg"
      frequency: "per event or reporting period"
      temporal_coverage: "rearing cycle"
      site_scope: "farm or animal lot"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "veterinary note, disposal ticket, mortality log"
    - protocol_id: cp_land_and_housing_records
      process_id: "stock_entry_and_breeding_basis_rearing_and_husbandry"
      flow_role: "land occupation and housing area"
      record_type: "pasture, yard, housing, or GIS area record"
      raw_fields: "area; duration; animal class; stocking period; housing or grazing system"
      collection_method: "GIS record, pasture map, farm record, housing plan, or stocking log; original activity aggregation: multiply area by occupation duration and allocate by animal-days or live weight"
      unit: "ha a, m2 a, ha, or m2"
      frequency: "season, month, or rearing cycle"
      temporal_coverage: "rearing cycle"
      site_scope: "pasture, yard, housing unit, or farm"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "GIS file, farm map, stocking log"
    - protocol_id: cp_gate_handling_and_transport_records
      process_id: "farm_gate_handling_and_delivery"
      flow_role: "handling and delivery"
      record_type: "pre-sale holding, loading, quarantine, carrier, or transport record"
      raw_fields: "gate; holding duration; live weight; route; distance; vehicle; fuel; electricity; carrier invoice; tonne-km"
      collection_method: "dispatch note, carrier invoice, route log, fuel log, or meter record; original activity aggregation: normalize handling and route-specific energy to delivered kg live weight"
      unit: "kg live weight, km, tonne-km, L fuel, kWh, MJ"
      frequency: "per shipment or handling period"
      temporal_coverage: "delivery period"
      site_scope: "declared gate, holding area, and delivery route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "dispatch record, carrier invoice, route record, fuel or energy record"
  calculation_rules:
    - id: normalize_live_weight_output
      applies_to: "reference product"
      rule: "kg transferred live weight at declared gate / PCR reference amount"
      inputs:
        - cp_live_weight_records
      output: "kg live ass per reference output"
      source_ids:
        - mass-balance-identity
    - id: calculate_live_weight_gain
      applies_to: "growth and herd reconciliation"
      rule: "final live weight + deaths + transfers out - starting live weight - purchases in, by animal class"
      inputs:
        - cp_stock_entry_records
        - cp_live_weight_records
        - cp_mortality_and_cull_records
      output: "live-weight gain and herd mass balance"
      source_ids:
        - mass-balance-identity
    - id: normalize_feed_dry_matter
      applies_to: "feed inputs"
      rule: "convert as-fed feed to dry matter using measured or declared moisture, then allocate by animal-days, ration group, live-weight gain, or documented farm basis"
      inputs:
        - cp_feed_and_forage_records
        - cp_live_weight_records
      output: "kg feed dry matter per reference output"
      source_ids:
        - fao-leap-animal-feeds-2016
    - id: calculate_enteric_ch4
      applies_to: "enteric methane"
      rule: "apply declared IPCC tier or reviewed regional method using animal class, live weight, feed intake, and population-time"
      inputs:
        - cp_live_weight_records
        - cp_feed_and_forage_records
      output: "kg CH4 per reference output"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: calculate_manure_ch4_n2o
      applies_to: "manure CH4 and N2O"
      rule: "apply declared IPCC manure-management method using volatile solids, nitrogen excretion, management system, storage route, and climate where required"
      inputs:
        - cp_manure_and_excreta_records
        - cp_live_weight_records
        - cp_feed_and_forage_records
      output: "kg CH4 and kg N2O per reference output"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: calculate_manure_nh3
      applies_to: "manure ammonia"
      rule: "apply declared EMEP/EEA or regional ammonia method using manure nitrogen, housing, storage, field application, grazing deposition, and climate or management data where required"
      inputs:
        - cp_manure_and_excreta_records
      output: "kg NH3 per reference output"
      source_ids:
        - emep-eea-2023-manure-management
    - id: calculate_energy_co2
      applies_to: "farm energy fossil CO2"
      rule: "Calculate fossil fuel combustion CO2 only for directly operated foreground equipment, then normalize to accepted output; purchased electricity and outsourced transport emissions belong to their linked upstream datasets and must not be duplicated"
      inputs:
        - cp_energy_records
        - cp_gate_handling_and_transport_records
      output: "kg fossil CO2 per reference output"
      source_ids: []
    - id: allocate_breeding_basis
      applies_to: "breeding herd burdens"
      rule: "allocate breeding herd maintenance burdens to marketable live-ass output using documented herd output basis when breeding herd is inside scope"
      inputs:
        - cp_stock_entry_records
        - cp_feed_and_forage_records
        - cp_live_weight_records
      output: "breeding-basis burden per kg live-weight output"
      source_ids: []
  data_quality_requirements:
    - id: dq_animal_identity
      applies_to: "live animal identity"
      requirement: "Age class, sex, breed or type, intended use, health status, production system, geography, and declared gate must be stated for the reference flow and major animal lots."
      evidence: "herd book, animal movement record, health certificate, sale note"
    - id: dq_live_weight
      applies_to: "live-weight records"
      requirement: "Live weight must identify weighing date, animal or lot, method, unit, gate, and device or conversion method."
      evidence: "scale calibration, weigh ticket, sale ticket, documented weigh-tape conversion"
    - id: dq_feed_basis
      applies_to: "feed and forage"
      requirement: "Feed records must preserve feed type, source, quantity, dry matter or moisture basis, animal class allocation, and time period."
      evidence: "invoice, feed analysis, feed log, pasture record"
    - id: dq_manure_method
      applies_to: "manure and emissions"
      requirement: "Manure-management system, housing/grazing split, storage duration, fate, and nitrogen or volatile-solids basis must be documented before CH4, N2O, or NH3 values are treated as final."
      evidence: "manure log, storage record, analysis, IPCC or EMEP calculation sheet"
    - id: dq_temporal_coverage
      applies_to: "rearing cycle"
      requirement: "Foreground records should cover the complete declared rearing cycle or explain use of annualized herd records for multi-year breeding systems."
      evidence: "herd inventory, annual farm records, sale records"
    - id: dq_completeness
      applies_to: "material flows"
      requirement: "Feed, water, bedding where used, energy, animal health inputs when material, manure, mortalities, and farm-gate handling must be addressed or explicitly excluded with rationale."
      evidence: "collection protocol checklist and data quality review"
