  classification_refs: "CPC 3.0 02132, Asses"
  covered_products: "live asses or donkeys sold or transferred as live animals for breeding, draught or pack use, further rearing, companion use, conservation herds, or other non-slaughter live-animal purposes"
  excluded_products: "horses; mules and hinnies; equine meat; hides and skins; milk; semen; embryos; manure products; services delivered by working animals after sale"
  representative_product: "live ass at declared live weight and health status, ready for transfer at farm gate"
  production_route: "breeding or replacement-stock entry, animal rearing and husbandry, manure management, and farm-gate handling"
  market_state: "live animal, unprocessed, at declared age class, sex, breed or type, live weight, health status, and transfer gate"
functional_unit:
  what: "live ass at declared transfer gate"
  how_much: "1 kg live weight"
  how_well: "declared age class, sex, breed or type, intended use, health status, live-weight measurement basis, and production system"
  how_long_or_cycle: "one animal rearing cycle from declared starting condition to transfer gate; herd maintenance period declared when breeding herd burdens are included"
  reference_flow_link: "declared_transferred_live_ass"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Breeding herd, purchased foals or replacement animals, feed, forage, bedding, water, veterinary inputs, fuel, electricity, and purchased services when they are part of the foreground data package."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Animal housing, grazing or yard management, feeding, watering, health management, bedding management, weighing, identification, and routine husbandry."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "Manure, urine, bedding, and excreta collection, storage, treatment, deposition during grazing, field application controlled by the farm, or transfer to a manure handler."
      source_ids: []
    - rule_id: system_boundary_rule_4
      applies_to: "foreground_system_boundary"
      rule: "Farm-gate sorting, quarantine or pre-sale holding, loading, and short-distance delivery when the declared gate is delivered live animal."
      source_ids: []
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "The completed foreground package represents live-animal production to the declared gate. Downstream work service, transport service performed by the animal, slaughter, hide recovery, milk production, and product use after sale are outside the default boundary unless a study explicitly expands scope."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "This boundary is a data-production abstraction. Declared breeding stock, purchased foals, or replacement animals are starting-condition records for the foreground package. Same-category live-ass inputs are not recursively traced as a new live-ass PCR inside the same package; their identity, mass, source, and prior-burden treatment are disclosed."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "breeding_herd_or_live_ass_stock_entry"
  starting_condition_role: "animal_identity_and_reproduction_condition"
  product_classification_scope: "current CPC 3.0 product category 02132, Asses"
  recursive_input_rule: "input flow in the same product category that causes recursive tracing is recorded as declared starting condition or purchased stock entry, with prior-burden treatment disclosed"
  upstream_dataset_requirement: "disclose source, live weight, age class, sex, breed or type, health status, acquisition date, and whether upstream live-animal burdens are included, excluded, or represented by secondary data"
  disclosure: "record production system, herd or lot boundary, live-weight basis, animal movement, mortality and cull fate, manure-management system, grazing or housing split, and declared gate"
