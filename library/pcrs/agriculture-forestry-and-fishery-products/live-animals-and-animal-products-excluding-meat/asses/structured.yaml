measurement_rules:
  - id: reference_live_weight
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg live weight"
    rule: "The reference flow must be expressed as kg live ass at the declared transfer gate."
  - id: head_count_conversion
    applies_to: "count-based animal records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg live weight"
    rule: "Count-based receiving, birth, sale, mortality, or inventory records must include measured live weight or a documented conversion by age class and sex."
  - id: feed_dry_matter_basis
    applies_to: "feed and forage inputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg dry matter and kg as-fed"
    rule: "Feed records must state whether quantities are dry matter or as-fed; moisture conversion must be disclosed when normalizing feed intake."
  - id: water_volume_conversion
    applies_to: "drinking and cleaning water"
    required_property_ref:
      name: "Mass or Volume"
      uuid: ""
    required_unit: "kg, L, or m3"
    rule: "Water volume may be recorded in L or m3 and converted to kg when needed; water source and allocation to animal class must be declared."
  - id: manure_n_basis
    applies_to: "manure, excreta, nitrogen, and nitrogen emissions"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg manure, kg volatile solids, and kg N where applicable"
    rule: "Manure and excreta records must preserve enough information to calculate CH4, N2O, NH3, and nitrogen loss methods when these emissions are in scope."
  - id: energy_inventory
    applies_to: "electricity, fuel, and farm machinery energy"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ or kWh"
    rule: "State whether each energy value is final electricity, fuel lower heating value, or delivered service energy."
