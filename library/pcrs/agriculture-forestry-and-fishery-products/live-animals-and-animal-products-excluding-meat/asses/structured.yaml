      record_type: "disposition log"
      raw_fields: "animal id, cause, live/dead, mass, date, disposal/return destination"
      collection_method: "event log and mass record; Raw aggregation requirements: distinguish returned live animals from waste. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "each event"
      temporal_coverage: "full handover period"
      site_scope: "final lot"
      aggregation_rule: "per reference flow"
      quality_evidence: "disposition record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
