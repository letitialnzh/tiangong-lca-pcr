product_category_identity:
  canonical_pcr_id: "pcr.agriculture-forestry-and-fishery-products.live-animals-and-animal-products-excluding-meat.asses"
  classification_refs: "CPC 3.0 02132, Asses"
  covered_products: "Living asses at breeder-foal or rearer/seller producer handover"
  excluded_products: "Horses; mules and hinnies; carcasses, meat and milk; downstream animal work or transport services"
  representative_product: "An alive, weighed ass at its declared producer gate"
  production_route: "Managed breeding and foaling, conditional young-animal rearing, followed by independent live gathering, inspection and handover. Grazing-led and stable/feed-led management share the biological parent but change feed sourcing, bedding, housing energy, water and manure placement/measurement. Both may operate within one cohort or period; disclose their measured shares rather than assign a label."
  market_state: "Living, unprocessed ass with condition, class, sex, count and live mass declared"
functional_unit:
  what: "Living ass at actual breeder, rearer or seller producer handover"
  how_much: "1 kg measured live mass; also report head count and measured class-specific kg/head"
  how_well: "Alive and unprocessed with lineage, class, sex, intended use and condition recorded"
  how_long_or_cycle: "Declared mating/foaling season or rearing cohort; index breeder, young-animal and shared-asset service periods"
  reference_flow_link: "reference_product_handover"
system_boundary:
  rules:
    - rule_id: boundary_live_ass
      applies_to: "All routes"
      rule: "Stop at living-ass producer handover; exclude slaughter, meat/milk processing and post-handover work services. A lost or dead animal is not a live product."
      source_ids:
        - un-cpc-2025
        - fao-working-equids
    - rule_id: boundary_breeding
      applies_to: "Operated breeder"
      rule: "Include jack/jenny upkeep, mating, gestation, foaling and nursing when performed; purchased breeding animals retain prior burden."
      source_ids:
        - fao-working-equids
    - rule_id: boundary_route
      applies_to: "Grazing and stabled management"
      rule: "Disclose actual feed, grazing, bedding, energy, water and manure pathways by mode and period; a stabled label alone is not a changed inventory."
      source_ids:
        - fao-working-equids
        - ipcc-livestock-2019
    - rule_id: boundary_shared
      applies_to: "Shared infrastructure"
      rule: "Assign shelter, fencing, water and handling assets to all consuming breeder, rearing and handover nodes/periods by metered use or documented animal-days; prevent double attribution."
      source_ids:
        - fao-working-equids
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Opening breeding asses or purchased foals/young asses entering the first operated node, with origin, age, count, live mass and inherited burden"
  starting_condition_role: "An opening foreground herd or upstream Product input, never a presumed zero-burden animal"
  product_classification_scope: "CPC 3.0 02132 living asses only"
  recursive_input_rule: "Link purchased live asses once to an upstream dataset at the true preceding gate; an internal foal transfer is not a second final sale or fresh external input."
  upstream_dataset_requirement: "Match purchased animals, feed, water, energy, materials and services to actual source, unit, technology and geography."
  disclosure: "Operated nodes, pasture/stable shares, breeder and rearing periods, shared assets, animal deaths/culls, manure destinations and the precise live handover gate."
