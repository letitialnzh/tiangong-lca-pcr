allocation_rules:
  - rule_id: alloc_live_outputs
    applies_to: "Breeder and rearer"
    rule: "Keep foal, older ass and independently sold live cull as distinct output lots at their own gates. First attempt process subdivision and measured burden assignment; if inseparable joint burden remains, disclose a justified physical causal key (animal-days, feed use or live-mass gain) and sensitivity to another plausible key. Never count an internal transfer twice."
    source_ids:
      - fao-working-equids
      - iso-14044
  - rule_id: alloc_manure
    applies_to: "Manure"
    rule: "Collected exported useful manure is a co-product only with actual quality, quantity and handover evidence; disposal manure is waste and grazing deposition is an in-situ pathway. Avoid assumed credit for all excretion."
    source_ids:
      - ipcc-livestock-2019
      - iso-14044
  - rule_id: alloc_period
    applies_to: "Breeder herd"
    rule: "Allocate jack/jenny upkeep across measured service periods and foal cohorts, including replacements, deaths and culls; state treatment of cohorts spanning reporting years. Never amortize by an assumed universal lifespan."
    source_ids:
      - fao-working-equids
      - iso-14044
  - rule_id: alloc_shared
    applies_to: "Shelter, fence, water and handling assets"
    rule: "Identify each consuming breeder/rearing/handover node and service period. Use metered service or documented animal-days/occupied capacity as a causal key, with one shared burden ledger and no duplicate assignment."
    source_ids:
      - iso-14044
  - rule_id: alloc_work
    applies_to: "Retained working ass"
    rule: "If on-farm work is actually delivered, measure its service and partition only causally attributable feed/asset burdens from saleable live-animal production. Downstream third-party work after sale is excluded."
    source_ids:
      - fao-working-equids
      - iso-14044
dataset_production:
  collection_protocols:
    - protocol_id: cp_animals
      process_id: "breeding_rearing_handover"
      flow_role: "animal input, transfer, final output, cull"
      record_type: "herd and sale ledger"
      raw_fields: "animal id, lineage, sex, age/class, source, destination, status, count, weighed mass, date"
      collection_method: "scale and reconciled movement register; Raw aggregation requirements: reconcile head and mass by class, gate and period. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "each event"
      temporal_coverage: "full cohort"
      site_scope: "all operated nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated scale, sale records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed
      process_id: "breeding_rearing"
      flow_role: "feed input"
      record_type: "ration/stock ledger"
      raw_fields: "feed kind, purchased/own origin, opening, issued, closing, waste, route, animal-days"
      collection_method: "weigh or verified purchase/stock reconciliation; Raw aggregation requirements: assign issued feed by class/animal-days. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each delivery; monthly close"
      temporal_coverage: "full season/cohort"
      site_scope: "all managed animals"
      aggregation_rule: "per reference flow"
      quality_evidence: "receipts, stock counts; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_utilities
      process_id: "breeding_rearing_handover"
      flow_role: "water and energy input"
      record_type: "meter and service ledger"
      raw_fields: "carrier, meter, water function, node, shared service, period"
      collection_method: "meter and documented allocation; Raw aggregation requirements: carrier-specific totals allocated once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; kWh; MJ"
      frequency: "meter interval"
      temporal_coverage: "full operating period"
      site_scope: "all relevant nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, meter logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_materials
      process_id: "rearing"
      flow_role: "bedding/care inputs"
      record_type: "issue and treatment log"
      raw_fields: "material, mass, treatment, animal lot, date"
      collection_method: "weigh and medicine records; Raw aggregation requirements: sum by actual lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each use"
      temporal_coverage: "full cohort"
      site_scope: "housed and treated animals"
      aggregation_rule: "per reference flow"
      quality_evidence: "issue and veterinarian logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
      process_id: "breeding_rearing"
      flow_role: "waste/product manure"
      record_type: "manure pathway ledger"
      raw_fields: "collected mass, wet/dry basis, destination, grazing deposition, treatment"
      collection_method: "weigh and pathway records; Raw aggregation requirements: separate sale, disposal and in-situ fate. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each removal; monthly"
      temporal_coverage: "full period"
      site_scope: "all husbandry nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "removal ticket, land and sale log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_emissions
      process_id: "breeding_rearing"
      flow_role: "calculated enteric/manure emissions"
      record_type: "activity and factor file"
      raw_fields: "animal-days, class, diet/productivity, climate, manure system, source factor, factor unit"
      collection_method: "regime-specific calculation from measured herd/pathway data; Raw aggregation requirements: calculate per class/pathway before sum. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head-day; kg gas"
      frequency: "each reporting period"
      temporal_coverage: "full breeding/rearing period"
      site_scope: "each cohort and manure route"
      aggregation_rule: "per reference flow"
      quality_evidence: "source version and arithmetic audit; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_losses
      process_id: "handover"
