allocation_rules:
  - rule_id: alloc_live_outputs
    applies_to: "Breeder and rearer"
    rule: "Keep foal, older ass and independently sold live cull as distinct output lots at their own gates. First attempt process subdivision and measured burden assignment; if inseparable joint burden remains, disclose a justified physical causal key (animal-days, feed use or live-mass gain) and sensitivity to another plausible key. Never count an internal transfer twice."
    source_ids:
      - fao-working-equids
      - iso-14044
  - rule_id: alloc_manure
    applies_to: "Manure"
    rule: "Collected exported useful manure is a co-product only with actual quality, quantity and handover evidence; disposal manure is waste and grazing deposition is an in-situ pathway. Avoid assumed credit for all excretion."
    source_ids:
      - ipcc-livestock-2019
      - iso-14044
  - rule_id: alloc_period
    applies_to: "Breeder herd"
    rule: "Allocate jack/jenny upkeep across measured service periods and foal cohorts, including replacements, deaths and culls; state treatment of cohorts spanning reporting years. Never amortize by an assumed universal lifespan."
    source_ids:
      - fao-working-equids
      - iso-14044
  - rule_id: alloc_shared
    applies_to: "Shelter, fence, water and handling assets"
    rule: "Identify each consuming breeder/rearing/handover node and service period. Use metered service or documented animal-days/occupied capacity as a causal key, with one shared burden ledger and no duplicate assignment."
    source_ids:
      - iso-14044
  - rule_id: alloc_work
    applies_to: "Retained working ass"
    rule: "If on-farm work is actually delivered, measure its service and partition only causally attributable feed/asset burdens from saleable live-animal production. Downstream third-party work after sale is excluded."
    source_ids:
      - fao-working-equids
      - iso-14044
dataset_production:
  collection_protocols:
    - protocol_id: cp_animals
      process_id: "breeding_rearing_handover"
      flow_role: "animal input, transfer, final output, cull"
      record_type: "herd and sale ledger"
      raw_fields: "animal id, lineage, sex, age/class, source, destination, status, count, weighed mass, date"
      collection_method: "scale and reconciled movement register"
      unit: "head; kg"
      frequency: "each event"
      temporal_coverage: "full cohort"
      site_scope: "all operated nodes"
      aggregation_rule: "reconcile head and mass by class, gate and period"
      quality_evidence: "calibrated scale, sale records"
    - protocol_id: cp_feed
      process_id: "breeding_rearing"
      flow_role: "feed input"
      record_type: "ration/stock ledger"
      raw_fields: "feed kind, purchased/own origin, opening, issued, closing, waste, route, animal-days"
      collection_method: "weigh or verified purchase/stock reconciliation"
      unit: "kg"
      frequency: "each delivery; monthly close"
      temporal_coverage: "full season/cohort"
      site_scope: "all managed animals"
      aggregation_rule: "assign issued feed by class/animal-days"
      quality_evidence: "receipts, stock counts"
    - protocol_id: cp_utilities
      process_id: "breeding_rearing_handover"
      flow_role: "water and energy input"
      record_type: "meter and service ledger"
      raw_fields: "carrier, meter, water function, node, shared service, period"
      collection_method: "meter and documented allocation"
      unit: "kg; kWh; MJ"
      frequency: "meter interval"
      temporal_coverage: "full operating period"
      site_scope: "all relevant nodes"
      aggregation_rule: "carrier-specific totals allocated once"
      quality_evidence: "invoices, meter logs"
    - protocol_id: cp_materials
      process_id: "rearing"
      flow_role: "bedding/care inputs"
      record_type: "issue and treatment log"
      raw_fields: "material, mass, treatment, animal lot, date"
      collection_method: "weigh and medicine records"
      unit: "kg"
      frequency: "each use"
      temporal_coverage: "full cohort"
      site_scope: "housed and treated animals"
      aggregation_rule: "sum by actual lot"
      quality_evidence: "issue and veterinarian logs"
    - protocol_id: cp_manure
      process_id: "breeding_rearing"
      flow_role: "waste/product manure"
      record_type: "manure pathway ledger"
      raw_fields: "collected mass, wet/dry basis, destination, grazing deposition, treatment"
      collection_method: "weigh and pathway records"
      unit: "kg"
      frequency: "each removal; monthly"
      temporal_coverage: "full period"
      site_scope: "all husbandry nodes"
      aggregation_rule: "separate sale, disposal and in-situ fate"
      quality_evidence: "removal ticket, land and sale log"
    - protocol_id: cp_emissions
      process_id: "breeding_rearing"
      flow_role: "calculated enteric/manure emissions"
      record_type: "activity and factor file"
      raw_fields: "animal-days, class, diet/productivity, climate, manure system, source factor, factor unit"
      collection_method: "regime-specific calculation from measured herd/pathway data"
      unit: "head-day; kg gas"
      frequency: "each reporting period"
      temporal_coverage: "full breeding/rearing period"
      site_scope: "each cohort and manure route"
      aggregation_rule: "calculate per class/pathway before sum"
      quality_evidence: "source version and arithmetic audit"
    - protocol_id: cp_losses
      process_id: "handover"
      flow_role: "rejected/dead animal"
      record_type: "disposition log"
      raw_fields: "animal id, cause, live/dead, mass, date, disposal/return destination"
      collection_method: "event log and mass record"
      unit: "head; kg"
      frequency: "each event"
      temporal_coverage: "full handover period"
      site_scope: "final lot"
      aggregation_rule: "distinguish returned live animals from waste"
      quality_evidence: "disposition record"
  calculation_rules:
    - id: calc_mass
      applies_to: "Live outputs"
      rule: "Sum measured kg by accepted animal/class at the declared gate; use measured sample mean × head count only with sample frame and uncertainty disclosed."
      inputs:
        - cp_animals
      output: "kg live reference and head/kg reconciliation"
      source_ids:
        - fao-working-equids
    - id: calc_feed
      applies_to: "Managed production"
      rule: "Issued feed = opening + receipts − closing − documented losses; allocate own feed production once to the consuming node."
      inputs:
        - cp_feed
      output: "kg feed by class and period"
      source_ids:
        - fao-working-equids
    - id: calc_emissions
      applies_to: "Enteric/manure pathways"
      rule: "Animal-days or measured excretion × explicitly selected Mules/Asses factor by productivity, climate and manure pathway, using consistent units; report uncertainty and do not substitute a flow UUID for a factor."
      inputs:
        - cp_emissions
        - cp_manure
      output: "kg specified substance to specified medium"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_shared
      applies_to: "Shared assets"
      rule: "One asset burden × measured consumer service share / sum of all service shares in each service period."
      inputs:
        - cp_utilities
        - cp_animals
      output: "nonduplicated burden by node"
      source_ids:
        - iso-14044
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Every animal lot"
      requirement: "Verify ass, not horse or hybrid, with class, sex, count, condition and actual producer gate."
      evidence: "herd, veterinary and handover records"
    - id: dq_mass
      applies_to: "Reference and transfers"
      requirement: "Preserve scale calibration, sampling frame and head-to-mass reconciliation; no generic count conversion."
      evidence: "calibration and movement reconciliation"
    - id: dq_period
      applies_to: "Multi-period herd and assets"
      requirement: "Cover breeder, gestation, foaling, rearing, cull and final output periods and all shared service consumers."
      evidence: "dated ledgers and burden schedule"
    - id: dq_factors
      applies_to: "Emissions"
      requirement: "Name the exact IPCC or other justified factor stratum, version, gas/medium and compatible animal activity; identify missing data."
      evidence: "factor record and calculation audit"
    - id: dq_completeness
      applies_to: "All nodes"
      requirement: "Explain zero or omitted flows, losses, manure destinations and any co-products or working service; reconcile internal transfers once."
      evidence: "inventory and output balance"
validation_rules:
  - rule_id: validate_ass_identity
    applies_to: "Reference"
    rule: "Reject horse/hybrid or unqualified live-animal mass, missing class/count/gate, and assumed kg/head conversion."
    source_ids:
      - un-cpc-2025
  - rule_id: validate_route
    applies_to: "Process map"
    rule: "Require operated breeder or purchased young animal, conditional rearing, final handover and measured pasture/housed route fractions; reject route label without inventory delta or double final gate."
    source_ids:
      - fao-working-equids
  - rule_id: validate_balance
    applies_to: "Herd and output set"
    rule: "Reconcile opening + purchase + birth − death − sale − closing by class/period; classify live culls, useful manure and work service only on actual evidence."
    source_ids:
      - fao-working-equids
      - iso-14044
  - rule_id: validate_period_shared
    applies_to: "Herd and infrastructure"
    rule: "Link every phase, replacement and shared shelter/water/handling consumer to service periods; prevent duplicated burden on two cohorts or nodes."
    source_ids:
      - iso-14044
  - rule_id: validate_emissions
    applies_to: "Direct gases"
    rule: "Require gas substance, receiving medium, actual animal productivity, climate/manure route and factor source. A generic Mules/Asses factor without stratum is insufficient."
    source_ids:
      - ipcc-livestock-2019
  - rule_id: validate_bindings
    applies_to: "Concrete exchanges"
    rule: "Expand unresolved inputs from actual foreground records. Require verified exact UUID/property/unit/gate for every published exchange; an unresolved semantic card is not permission to fabricate an identity."
    source_ids:
      - iso-14044
published_dataset_profile:
  dataset_role: "Foreground production package for living asses at declared producer gate"
  downstream_use: "secondary_dataset and, where appropriate, background_dataset for process/lifecyclemodel construction"
  allowed_use: "Matching ass lineage, animal class, producer gate, management route and geography with transparent period and burden attribution"
  excluded_use: "Horse or hybrid production, meat/milk, downstream working service, slaughter-plant gate, or unspecified count-to-mass conversion"
  required_metadata: "Ass lineage, sex, age/class, animal count, measured mass, condition, intended use, actual gate, site, period, pasture/housed mix, factor strata, upstream animal origins and co-output treatment"
  required_quality_disclosure: "Measurement/sampling uncertainty, missing records, allocation choices, output/manure balance, emission factor applicability, exact flow binding coverage and unresolved identities"
  update_trigger: "Changed animal boundary, handover gate, route mix, measured factors, source guidance or verified flow identities"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "[UN CPC Ver. 3.0 explanatory notes](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "Ass product identity and exclusions"
  - id: "fao-working-equids"
    type: "handbook"
    reference: "[FAO horses, donkeys and mules husbandry](https://www.fao.org/4/t0690e/t0690e07.htm)"
    used_for: "Breeding, foaling, rearing, feed and animal care route"
  - id: "ipcc-livestock-2019"
    type: "method_factor"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 10](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf)"
    used_for: "Conditional Mules/Asses gas and manure methods, not universal quantities"
  - id: "iso-14044"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines"
    used_for: "Allocation, completeness and data-quality decision order"
