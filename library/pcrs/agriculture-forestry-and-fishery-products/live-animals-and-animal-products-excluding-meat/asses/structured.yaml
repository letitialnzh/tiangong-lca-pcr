    - unit_id: "normative_49000"
      family: "allocation"
      span:
        start:
          offset: 49000
          line: 826
          column: 1
        end:
          offset: 49995
          line: 837
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\nNo allocation is required when the only product output is the transferred live ass and manure or mortalities are treated as wastes with declared treatment. If manure, compost, draught service during the rearing period, milk, hide, breeding service, or another co-product is intentionally marketed inside the foreground boundary, allocation must be declared before publication.\n\nPreferred hierarchy:\n\n1. Subdivide processes when records separate live-animal production from manure product preparation, milk production, work service, or another co-product route.\n2. Use physical allocation only when a causal physical relationship is documented, such as nutrient content for marketed manure products.\n3. Use economic allocation when physical allocation is not defensible and market values are available.\n4. Report system expansion or substitution only as an additional scenario, with substituted product, geography, and avoided-burden dataset disclosed.\n\n"
