      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
  calculation_rules:
    - id: calc_mass
      applies_to: "Live outputs"
      rule: "Sum measured kg by accepted animal/class at the declared gate; use measured sample mean × head count only with sample frame and uncertainty disclosed."
      inputs:
        - cp_animals
      output: "kg live reference and head/kg reconciliation"
      source_ids:
        - fao-working-equids
    - id: calc_feed
      applies_to: "Managed production"
      rule: "Issued feed = opening + receipts − closing − documented losses; allocate own feed production once to the consuming node."
      inputs:
        - cp_feed
      output: "kg feed by class and period"
      source_ids:
        - fao-working-equids
    - id: calc_emissions
      applies_to: "Enteric/manure pathways"
      rule: "Animal-days or measured excretion × explicitly selected Mules/Asses factor by productivity, climate and manure pathway, using consistent units; report uncertainty and do not substitute a flow UUID for a factor."
      inputs:
        - cp_emissions
        - cp_manure
      output: "kg specified substance to specified medium"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_shared
      applies_to: "Shared assets"
      rule: "One asset burden × measured consumer service share / sum of all service shares in each service period."
      inputs:
        - cp_utilities
        - cp_animals
      output: "nonduplicated burden by node"
      source_ids:
        - iso-14044
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Every animal lot"
      requirement: "Verify ass, not horse or hybrid, with class, sex, count, condition and actual producer gate."
      evidence: "herd, veterinary and handover records"
    - id: dq_mass
      applies_to: "Reference and transfers"
      requirement: "Preserve scale calibration, sampling frame and head-to-mass reconciliation; no generic count conversion."
      evidence: "calibration and movement reconciliation"
    - id: dq_period
      applies_to: "Multi-period herd and assets"
      requirement: "Cover breeder, gestation, foaling, rearing, cull and final output periods and all shared service consumers."
      evidence: "dated ledgers and burden schedule"
    - id: dq_factors
      applies_to: "Emissions"
      requirement: "Name the exact IPCC or other justified factor stratum, version, gas/medium and compatible animal activity; identify missing data."
      evidence: "factor record and calculation audit"
    - id: dq_completeness
      applies_to: "All nodes"
      requirement: "Explain zero or omitted flows, losses, manure destinations and any co-products or working service; reconcile internal transfers once."
      evidence: "inventory and output balance"
validation_rules:
  - rule_id: validate_ass_identity
    applies_to: "Reference"
    rule: "Reject horse/hybrid or unqualified live-animal mass, missing class/count/gate, and assumed kg/head conversion."
    source_ids:
      - un-cpc-2025
  - rule_id: validate_route
    applies_to: "Process map"
    rule: "Require operated breeder or purchased young animal, conditional rearing, final handover and measured pasture/housed route fractions; reject route label without inventory delta or double final gate."
    source_ids:
      - fao-working-equids
  - rule_id: validate_balance
    applies_to: "Herd and output set"
    rule: "Reconcile opening + purchase + birth − death − sale − closing by class/period; classify live culls, useful manure and work service only on actual evidence."
    source_ids:
      - fao-working-equids
      - iso-14044
  - rule_id: validate_period_shared
    applies_to: "Herd and infrastructure"
    rule: "Link every phase, replacement and shared shelter/water/handling consumer to service periods; prevent duplicated burden on two cohorts or nodes."
    source_ids:
      - iso-14044
  - rule_id: validate_emissions
    applies_to: "Direct gases"
    rule: "Require gas substance, receiving medium, actual animal productivity, climate/manure route and factor source. A generic Mules/Asses factor without stratum is insufficient."
    source_ids:
      - ipcc-livestock-2019
  - rule_id: validate_bindings
    applies_to: "Concrete exchanges"
    rule: "Expand unresolved inputs from actual foreground records. Require verified exact UUID/property/unit/gate for every published exchange; an unresolved semantic card is not permission to fabricate an identity."
    source_ids:
      - iso-14044
published_dataset_profile:
  dataset_role: "Foreground production package for living asses at declared producer gate"
  downstream_use: "secondary_dataset and, where appropriate, background_dataset for process/lifecyclemodel construction"
  allowed_use: "Matching ass lineage, animal class, producer gate, management route and geography with transparent period and burden attribution"
  excluded_use: "Horse or hybrid production, meat/milk, downstream working service, slaughter-plant gate, or unspecified count-to-mass conversion"
  required_metadata: "Ass lineage, sex, age/class, animal count, measured mass, condition, intended use, actual gate, site, period, pasture/housed mix, factor strata, upstream animal origins and co-output treatment"
  required_quality_disclosure: "Measurement/sampling uncertainty, missing records, allocation choices, output/manure balance, emission factor applicability, exact flow binding coverage and unresolved identities"
  update_trigger: "Changed animal boundary, handover gate, route mix, measured factors, source guidance or verified flow identities"
