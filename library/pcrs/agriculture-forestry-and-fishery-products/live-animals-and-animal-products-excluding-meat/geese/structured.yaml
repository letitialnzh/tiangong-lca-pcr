measurement_rules:
  - id: live_mass
    applies_to: "Reference and transferred birds"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh each lot or representative birds of each age/class; multiply reconciled count by measured mean mass. Dead birds are excluded."
  - id: bird_count
    applies_to: "Flock movement"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "birds"
    rule: "Reconcile opening, received/hatched, sold, dead and closing birds; never equate bird count with kg without measurement."
  - id: egg_mass_count
    applies_to: "Eggs"
    required_property_ref:
      name: "Mass and count"
      uuid: ""
    required_unit: "kg; eggs"
    rule: "Record egg purpose and destination and weigh exchanged batches."
  - id: period_index
    applies_to: "Breeder and shared assets"
    required_property_ref:
      name: "Service time"
      uuid: ""
    required_unit: "days or cycles"
    rule: "Link each input, output, replacement and asset use to its service period before normalization."
  - id: inventory_reference_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual flow property"
      uuid: ""
    required_unit: "exchange unit per reference flow"
    rule: "The inventory and collection aggregation fields below express final amounts per declared reference flow. Keep all raw collection records, original denominator qualifiers, route/period strata, unit conversions and allocation requirements. For each flow, first obtain its attributable amount in its own numerator unit using the existing rules; then divide by the measured accepted reference-output quantity of the same scope and multiply by the declared reference quantity. Do not mix species, states, gates or incompatible routes; count transfers and shared burdens once. A missing, zero or untraceable accepted-output denominator is a blocking data-quality issue. Keep provisional QA ranges on their explicitly stated bases; they are not conversion factors or production defaults. These are final foreground-package contributions, not replacements for stage quantitative references or stage-native unit-process datasets. Retain stage records separately. Compute normalized amount = attributable raw amount * declared reference quantity / measured accepted final reference-output quantity. Apply normalization exactly once."
  - id: stage_throughput_linkage
    applies_to: "stage records and final package contributions"
    required_property_ref:
      name: "Actual flow property and its stated raw basis"
      uuid: ""
    required_unit: "retain native numerator and stage denominator units"
    rule: "Keep the original lot, event, cohort, period and stage denominators with their units. Reconstruct the attributable numerator A with measured stage quantity Q_stage and documented attribution before final normalization. If a quoted amount a_B corresponds to an explicit stage basis B_stage (for example, 1000 kg), use A = a_B * Q_stage / B_stage. If r_stage is already an intensity in exchange-unit per stage-unit, instead use A = r_stage * Q_stage, with no second division by B_stage. A raw attributable total is used directly. Final contribution = A * declared reference quantity / measured accepted final output. Convert compatible units explicitly and apply each attribution/allocation share exactly once; never treat a quoted amount or intensity as a raw total. Link stage transfers, losses, rejects, stocks, shared services and allocation to the same actual route, period and final-output stratum. For a 1000 kg basis retain 1000 kg explicitly. Do not assume unit yield, equal fresh/dried mass, equal head mass, equal dose quality or interchangeable gates. Missing links, unsupported unit conversion, zero denominators and untraceable allocation block dataset production. Stage-native datasets retain their own stage reference; package contributions are a separate projection."
