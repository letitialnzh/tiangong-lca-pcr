allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "All routes"
    rule: "First subdivide measured breeder, hatchery, rearing and catching operations by their own records. Do not allocate directly attributable burdens."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: allocation_outputs
    applies_to: "Eggs, live birds, independently removed feathers/down, exported manure"
    rule: "Enumerate each intended output and handover. Where subdivision is impossible, allocate by documented physical causality; if unavailable, use contemporaneous economic values and disclose prices and sensitivity. Residue and disposal waste receive no product credit without independent use and transfer."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: allocation_periods
    applies_to: "Breeder and cohort cycles"
    rule: "Link breeder establishment, laying seasons, hatch batches, rearing cycles, replacements and culls to benefiting cohorts; never assign the same burden to internal transfer and final sale twice."
    source_ids:
      - fao-goose-production
      - fao-leap-poultry-2016
  - rule_id: allocation_shared
    applies_to: "Shared buildings, incubators and utilities"
    rule: "Attribute one measured burden to consuming nodes and service periods by meter use, capacity-days or documented operating time, with keys and shares retained."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_feed
      process_id: "breeder_rearing"
      flow_role: "Feed and pasture"
      record_type: "invoices, stock and grazing records"
      raw_fields: "opening/closing feed stock; deliveries; forage origin; grazing area/days; flock count"
      collection_method: "weighbridge, feed ledger and pasture log; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg; bird-days; ha-days"
      frequency: "each receipt and cycle"
      temporal_coverage: "full breeder or rearing cohort"
      site_scope: "all houses and pasture"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, scales, pasture records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_utilities
      process_id: "breeder_hatchery_rearing"
      flow_role: "Water and energy"
      record_type: "meter and fuel logs"
      raw_fields: "meter start/end; carrier; quantity; node; period"
      collection_method: "meter read or invoice; allocate shared use by documented key; Raw aggregation requirements: difference readings, convert units, assign once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg water; kWh; MJ"
      frequency: "each meter period"
      temporal_coverage: "all operated nodes and seasons"
      site_scope: "all meters"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter images and receipts; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_birds_eggs
      process_id: "all"
      flow_role: "Eggs, live birds and transfers"
      record_type: "egg batch and flock logs"
      raw_fields: "eggs by purpose/count/mass; hatch results; opening/received/sold/dead bird counts; sampled weights; gate"
      collection_method: "weigh and count each batch; reconcile transfers; Raw aggregation requirements: count balance and class-specific mean mass. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; eggs; birds"
      frequency: "every batch/movement"
      temporal_coverage: "full reported cycle"
      site_scope: "all producer gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "batch sheets and calibrated scales; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_losses_manure
      process_id: "all"
      flow_role: "Mortality, residue and manure pathways"
      record_type: "disposal, manure and emissions-monitoring logs"
      raw_fields: "dead mass/count; egg residues; manure storage/grazing/export mass; destination; volatile solids data; measured NH3 if claimed"
      collection_method: "weigh or sample; retain destination and emission-monitoring records; Raw aggregation requirements: reconcile by origin and destination, calculate pathway emissions only with supported method. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; bird-days"
      frequency: "each event and period"
      temporal_coverage: "every operated phase"
      site_scope: "all houses, pasture and treatment"
      aggregation_rule: "per reference flow"
      quality_evidence: "receipts, manure analysis, field and monitoring logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "breeder_rearing"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "breeder_rearing"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: calc_live_mass
      applies_to: "Live transfers"
      rule: "live mass = reconciled count × measured mean mass for same age/class, unless entire lot weighed"
      inputs:
        - count
        - "sampled weights"
        - scales
      output: "kg live mass and kg/bird"
      source_ids:
        - fao-leap-poultry-2016
    - id: calc_stock
      applies_to: "Flock records"
      rule: "opening + received + hatched − sold − dead − other removals = closing birds"
      inputs:
        - "flock movement records"
      output: "bird-count reconciliation"
      source_ids:
        - fao-leap-poultry-2016
    - id: calc_eggs
      applies_to: "Breeder output"
      rule: "collected eggs = eligible hatching + sold eggs + rejected eggs + stock change, by mass and count"
      inputs:
        - "egg batch records"
      output: "reconciled egg output"
      source_ids:
        - fao-goose-production
    - id: calc_manure
      applies_to: "Manure pathway"
      rule: "Calculate CH4 and N2O using actual pathway, collected activity and selected IPCC method inputs; report NH3 only if measured or supported by a separately reviewed pathway factor. A flow UUID is never a factor."
      inputs:
        - "manure destination"
        - population
        - "volatile solids"
        - "management periods and any NH3 monitor"
      output: "pathway-specific emissions"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_shared
      applies_to: "Shared services"
      rule: "allocate total service once to each consuming node/period by metered use or recorded capacity-days"
      inputs:
        - "asset use"
        - consumers
        - periods
      output: "node burden"
      source_ids:
        - fao-leap-poultry-2016
    - id: calc_feed_supply_and_intake
      applies_to: "breeder_feed; rearing_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
    - id: calc_manure_n2o_coverage
      applies_to: "breeder_manure_n2o_air; manure_n2o_air"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-livestock-2019
        - ipcc-managed-soils-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Final and internal birds"
      requirement: "Preserve species, age/class, purpose, mass, count, condition and gate per lot."
      evidence: "flock and sale records"
    - id: dq_period
      applies_to: "Breeder, hatch and rearing"
      requirement: "Link input, output, cull, replacement and asset to actual periods; disclose incomplete seasons."
      evidence: "dated cohort/asset records"
    - id: dq_complete
      applies_to: "Feed, utilities, loss and manure"
      requirement: "Include every operated node and destination; record omissions and meter coverage."
      evidence: "reconciliations and site diagram"
    - id: dq_routes
      applies_to: "Pasture versus housed"
      requirement: "Support actual feed, land, manure and utility differences with site records rather than route labels."
      evidence: "pasture, house and manure logs"
validation_rules:
  - rule_id: validate_reference
    applies_to: "Final output"
    rule: "Reject a reference without measured kg, reconciled count, age/class and one declared hatchery or farm producer gate; do not use the count/at-plant candidate as a Mass reference."
    source_ids:
      - un-cpc-2025
  - rule_id: validate_route
    applies_to: "Process map"
    rule: "Require evidence for each operated node and pasture/housed inventory delta; prohibit hatchery and farm final output for the same internal lot."
    source_ids:
      - fao-goose-production
      - fao-leap-poultry-2016
  - rule_id: validate_outputs
    applies_to: "Co-products and losses"
    rule: "Reconcile live birds, eggs, any separately removed feathers/down, exported manure, mortality and residues by handover; record explicit allocation and prevent duplicate output."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: validate_period
    applies_to: "Periods and shared assets"
    rule: "Verify breeder/asset service time, replacements, culls, consuming nodes and attribution keys sum without duplicate burden."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: validate_manure
    applies_to: "Manure pathway"
    rule: "Verify actual destination and selected IPCC inputs before calculating emissions."
    source_ids:
      - ipcc-livestock-2019
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-livestock-2019
      - ipcc-managed-soils-2019
published_dataset_profile:
  dataset_role: "Foreground producer-gate package for living domestic geese"
  downstream_use: "secondary_dataset or background_dataset for reviewed process and lifecyclemodel assembly"
  allowed_use: "Evidenced hatchery-gate gosling or farm-gate older-bird route after concrete identity matching"
  excluded_use: "Goose meat, slaughter, eggs as reference, count-to-mass inference without weighing, or treating candidate UUID as confirmed"
  required_metadata: "Species/breed, age/class, count, kg, purpose, gate, site, periods, route nodes, feed/grazing, manure, output allocation and shared-asset keys"
  required_quality_disclosure: "Mass/count reconciliation, record and period gaps, provisional Range exceedances and unresolved UUIDs"
  update_trigger: "Changed gate, route, manure management, CPC boundary, UUID evidence or reviewed method"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "[UN CPC 3.0 explanatory notes](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "Live goose category and meat exclusion"
  - id: "fao-goose-production"
    type: "handbook"
    reference: "[FAO Goose Production](https://www.fao.org/4/y4359e/y4359e00.htm)"
    used_for: "Breeder, hatching, brooding and growth route"
  - id: "fao-leap-poultry-2016"
    type: "official_guidance"
    reference: "[FAO LEAP poultry supply-chain guidance](https://openknowledge.fao.org/handle/20.500.14283/i6421en)"
    used_for: "Boundary, inventory, allocation and data quality"
  - id: "ipcc-livestock-2019"
    type: "method_factor"
    reference: "[2019 IPCC refinement, Vol. 4 Ch. 10](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf)"
    used_for: "Manure pathway calculation method"
  - id: "fao-feed-loss-accounting-2018"
    type: "official_guidance"
    reference: "[FAO 2018, Environmental performance of pig supply chains, section 11.2.2](https://www.fao.org/4/i8686en/I8686EN.pdf)"
    used_for: "Feed supply versus intake and waste burden, not animal parameters. Applying this accounting principle to the declared taxon is this PCR's methodological choice; no pig diet or emission factor is transferred."
  - id: "ipcc-managed-soils-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 11](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf)"
    used_for: "Direct/indirect nitrogen pathways and coordination of manure storage with managed-soil emissions; select applicable species and management evidence."
  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
