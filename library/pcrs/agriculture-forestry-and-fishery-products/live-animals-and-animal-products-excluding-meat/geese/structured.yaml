    used_for: "Live goose category and meat exclusion"
  - id: "fao-goose-production"
    type: "handbook"
    reference: "[FAO Goose Production](https://www.fao.org/4/y4359e/y4359e00.htm)"
    used_for: "Breeder, hatching, brooding and growth route"
  - id: "fao-leap-poultry-2016"
    type: "official_guidance"
    reference: "[FAO LEAP poultry supply-chain guidance](https://openknowledge.fao.org/handle/20.500.14283/i6421en)"
    used_for: "Boundary, inventory, allocation and data quality"
  - id: "ipcc-livestock-2019"
