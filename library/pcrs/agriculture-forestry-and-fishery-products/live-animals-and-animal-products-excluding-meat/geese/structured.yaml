  reference_flow_link: "live_geese_handover"
system_boundary:
  rules:
    - rule_id: boundary_live
      applies_to: "All routes"
      rule: "Include operated breeder, incubation, brooding/rearing and independent live catching only through producer handover; exclude slaughter and downstream distribution."
      source_ids:
        - un-cpc-2025
        - fao-goose-production
        - fao-leap-poultry-2016
    - rule_id: boundary_gate
      applies_to: "Hatchery or farm route"
      rule: "Hatchery-gate goslings and farm-gate older geese are alternative final gates. Internal hatch-to-rearing transfer passes accumulated burden only once."
      source_ids:
        - fao-goose-production
        - fao-leap-poultry-2016
    - rule_id: boundary_manure
      applies_to: "Housing or pasture"
      rule: "Record actual storage, grazing, export and treatment destination and pathway-specific emissions; do not assume one universal manure pathway."
      source_ids:
        - ipcc-livestock-2019
    - rule_id: boundary_shared
      applies_to: "Shared infrastructure"
      rule: "Identify incubators, houses, water/energy systems and catching equipment shared by nodes or periods and attribute each measured burden once."
      source_ids:
        - fao-leap-poultry-2016
boundary_abstraction:
  declared_starting_condition: "Opening live flock, breeder egg or externally supplied gosling at the first operated node, with origin, age, mass, count and carried burden"
  starting_condition_role: "Foreground starting stock or upstream Product input, never zero burden by default"
  product_classification_scope: "CPC 3.0 02153, live domestic geese"
  recursive_input_rule: "For live geese received from another producer, use one upstream dataset for the received birds; do not recursively reproduce that same stage or count an internal transfer as new final output."
  upstream_dataset_requirement: "Feed, purchased eggs/goslings, fuels, electricity, water and services require matching upstream identities and datasets."
  disclosure: "Final gate, operated nodes, pasture or housed route, breeder and asset periods, output destinations, mortalities and manure pathway."
