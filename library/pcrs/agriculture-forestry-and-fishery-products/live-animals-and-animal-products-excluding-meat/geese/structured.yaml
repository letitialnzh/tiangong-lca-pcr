measurement_rules:
  - id: live_mass
    applies_to: "Reference and transferred birds"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh each lot or representative birds of each age/class; multiply reconciled count by measured mean mass. Dead birds are excluded."
  - id: bird_count
    applies_to: "Flock movement"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "birds"
    rule: "Reconcile opening, received/hatched, sold, dead and closing birds; never equate bird count with kg without measurement."
  - id: egg_mass_count
    applies_to: "Eggs"
    required_property_ref:
      name: "Mass and count"
      uuid: ""
    required_unit: "kg; eggs"
    rule: "Record egg purpose and destination and weigh exchanged batches."
  - id: period_index
    applies_to: "Breeder and shared assets"
    required_property_ref:
      name: "Service time"
      uuid: ""
    required_unit: "days or cycles"
    rule: "Link each input, output, replacement and asset use to its service period before normalization."
