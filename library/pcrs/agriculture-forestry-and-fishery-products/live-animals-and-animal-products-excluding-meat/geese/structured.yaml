system_boundary:
  rules:
    - rule_id: boundary_live
      applies_to: "All routes"
      rule: "Include operated breeder, incubation, brooding/rearing and independent live catching only through producer handover; exclude slaughter and downstream distribution."
      source_ids:
        - un-cpc-2025
        - fao-goose-production
        - fao-leap-poultry-2016
    - rule_id: boundary_gate
      applies_to: "Hatchery or farm route"
      rule: "Hatchery-gate goslings and farm-gate older geese are alternative final gates. Internal hatch-to-rearing transfer passes accumulated burden only once."
      source_ids:
        - fao-goose-production
        - fao-leap-poultry-2016
    - rule_id: boundary_manure
      applies_to: "Housing or pasture"
      rule: "Record actual storage, grazing, export and treatment destination and pathway-specific emissions; do not assume one universal manure pathway."
      source_ids:
        - ipcc-livestock-2019
    - rule_id: boundary_shared
      applies_to: "Shared infrastructure"
      rule: "Identify incubators, houses, water/energy systems and catching equipment shared by nodes or periods and attribute each measured burden once."
      source_ids:
        - fao-leap-poultry-2016
boundary_abstraction:
