system_boundary:
  rules:
    - rule_id: b_rearing
      applies_to: "all cohorts"
      rule: "Include managed feeding, climate control, mounting and spinning through intact spun-cocoon handoff. Host-crop production is upstream unless explicitly inside this foreground system; avoid double-counting on-site leaves."
      source_ids:
        - fao-cocoon-quality
        - fao-cocoon-characteristics
    - rule_id: b_nodes
      applies_to: "collection and grading"
      rule: "Collect after spinning as an independent removal node, then classify incoming cocoons into accepted reelable, independently downgraded and rejected/waste destinations; not every harvested cocoon is reelable."
      source_ids:
        - fao-cocoon-quality
    - rule_id: b_drying
      applies_to: "optional producer conditioning"
      rule: "Include stifling/drying only when producer performs it before declared sale gate; meter heat, electricity, moisture loss and rejects. Buyer-side conditioning, cooking and reeling are downstream."
      source_ids:
        - fao-cocoon-drying
    - rule_id: b_gate
      applies_to: "all outputs"
      rule: "Include protected packing and pre-handover handling at actual producer gate but exclude downstream distribution after ownership transfer. Fresh and dried branches require different final-output identities."
      source_ids:
        - fao-cocoon-quality
        - fao-cocoon-drying
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased silkworm seed/larvae and host leaves or identified on-site host crop and breeding source; identify opening cohorts and upstream burdens."
  starting_condition_role: "Purchased inputs cross the foreground boundary with upstream datasets; opening biological stock and reusable assets are separately disclosed."
  product_classification_scope: "Reelable cocoon goods only; rejected spinning-grade cocoons and raw silk are separate products."
  recursive_input_rule: "If purchased cocoons of this category are added, retain upstream burdens and purchased mass once; never claim them as newly reared output."
  upstream_dataset_requirement: "Require supplier-specific or justified secondary datasets for seed/larvae, host leaves, fuel, water, packaging and assets where applicable."
  disclosure: "Report cohort, route, state, moisture, grade, each output destination, gate, period, shared assets and treatment of purchased cocoon input."
