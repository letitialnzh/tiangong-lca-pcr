allocation_rules:
  - rule_id: a_output
    applies_to: "separately marketed outputs"
    rule: "First subdivide cohort, grade and conditioning records by physical lot. If reelable and separately marketed spinning-grade cocoons are joint outputs of an indivisible operation, document and justify physical causal allocation where supported; otherwise disclose economic allocation, price period and uncertainty. Unsold rejects and moisture loss are not co-products."
    source_ids:
      - fao-cocoon-quality
      - fao-cocoon-drying
  - rule_id: a_period
    applies_to: "cohorts and host-crop phases"
    rule: "Attribute leaf inputs, rearing operations and cocoon outputs to actual cohort and reporting period; carry opening/closing stock and unfinished cohorts across calendar cut-offs."
    source_ids:
      - fao-cocoon-quality
  - rule_id: a_shared
    applies_to: "shared infrastructure"
    rule: "Record host plots, rearing rooms, trays, mountages, graders and dryers with actual consuming nodes, cohorts and service periods; allocate manufacture, repair and utilities by observed use or justified disclosed proxy only once."
    source_ids:
      - fao-cocoon-quality
      - fao-cocoon-drying
