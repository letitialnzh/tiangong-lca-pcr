      collection_method: "scale, pack count and receipt; Raw aggregation requirements: net cocoon mass by state/gate. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;item"
      frequency: "each handover"
      temporal_coverage: "pre-gate"
      site_scope: "every sale lot"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration and signed receipt; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
  calculation_rules:
    - id: c_net
      applies_to: "each handover"
      rule: "Net as-received cocoon mass = gross minus package tare and segregated rejects; retain state."
      inputs:
        - gross
        - tare
        - rejects
        - state
      output: "kg accepted lot"
      source_ids:
        - fao-cocoon-characteristics
    - id: c_dry
      applies_to: "paired fresh/dried batch"
      rule: "Dry solids = state-specific wet mass × (1 - measured moisture fraction); compare states on dry solids and account for sampled and rejected solids; no assumed conversion."
      inputs:
        - "inlet/outlet mass"
        - moisture
        - rejects
      output: "measured dry-solids balance"
      source_ids:
        - fao-cocoon-characteristics
        - fao-cocoon-drying
    - id: c_grade
      applies_to: "sorting"
      rule: "Accepted + separately marketed downgraded + waste + samples reconcile to graded input, allowing documented moisture timing difference."
      inputs:
        - "input and output masses"
      output: "lot balance and defect fractions"
      source_ids:
        - fao-cocoon-quality
    - id: c_intensity
      applies_to: "every node"
      rule: "Divide attributed process quantities by its declared output mass, then normalize final dataset to one kg at one state-specific gate."
      inputs:
        - "attributed inputs"
        - "output mass"
        - state
      output: "per-kg inventory"
      source_ids:
        - fao-cocoon-characteristics
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each lot"
      requirement: "Demonstrate species/strain, grade, reelability, fresh/dried condition and actual gate; never infer reelability from CPC label."
      evidence: "sample, grade and buyer acceptance"
    - id: dq_moisture
      applies_to: "state comparison"
      requirement: "Use representative moisture and original as-received masses; report sample and balance uncertainty."
      evidence: "samples and scale calibration"
    - id: dq_complete
      applies_to: "all nodes"
      requirement: "Report selected nodes, inputs, accepted lots, downgraded sales, waste, periods and shared burdens; justify actual zero flows."
      evidence: "cohort ledger and node reconciliation"
    - id: dq_source
      applies_to: "upstream inputs"
      requirement: "Preserve source, quantity and quality of seed, host leaves, energy, packaging and selected upstream datasets."
      evidence: "invoices, host-crop ledger and metadata"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference and final outputs"
    rule: "Reject pierced/unreelable cocoons as reelable or a lot without grade/state/gate evidence; never bind fresh/unprocessed farm-gate UUID to dried, stifled or other-gate lot."
    source_ids:
      - fao-cocoon-quality
      - fao-cocoon-drying
  - rule_id: v_mass
    applies_to: "fresh and dried lots"
    rule: "Require measured net mass and moisture per state; reconcile collection, grading, drying and final handover with sample and water-loss terms, not assumed dry yield."
    source_ids:
      - fao-cocoon-characteristics
      - fao-cocoon-drying
  - rule_id: v_routes
    applies_to: "route deltas"
    rule: "Accept host, climate or mounting variant only with changed inventory, calculation, quality or validation evidence relative to managed parent; reject label-only route."
    source_ids:
      - fao-cocoon-quality
  - rule_id: v_attribution
    applies_to: "multi-output and multi-period"
    rule: "Verify separately marketed outputs, waste, unfinished cohorts, shared assets and service periods; one cocoon mass and shared burden may have only one attributed handover."
    source_ids:
      - fao-cocoon-quality
  - rule_id: v_binding
    applies_to: "flow cards"
    rule: "Resolve unresolved inputs to evidenced concrete UUIDs before TIDAS process exchange; leave other UUIDs unresolved until detail-confirmed."
    source_ids: []
published_dataset_profile:
