allocation_rules:
  - rule_id: a_output
    applies_to: "separately marketed outputs"
    rule: "First subdivide cohort, grade and conditioning records by physical lot. If reelable and separately marketed spinning-grade cocoons are joint outputs of an indivisible operation, document and justify physical causal allocation where supported; otherwise disclose economic allocation, price period and uncertainty. Unsold rejects and moisture loss are not co-products."
    source_ids:
      - fao-cocoon-quality
      - fao-cocoon-drying
  - rule_id: a_period
    applies_to: "cohorts and host-crop phases"
    rule: "Attribute leaf inputs, rearing operations and cocoon outputs to actual cohort and reporting period; carry opening/closing stock and unfinished cohorts across calendar cut-offs."
    source_ids:
      - fao-cocoon-quality
  - rule_id: a_shared
    applies_to: "shared infrastructure"
    rule: "Record host plots, rearing rooms, trays, mountages, graders and dryers with actual consuming nodes, cohorts and service periods; allocate manufacture, repair and utilities by observed use or justified disclosed proxy only once."
    source_ids:
      - fao-cocoon-quality
      - fao-cocoon-drying
dataset_production:
  collection_protocols:
    - protocol_id: cp_cohort_inputs
      process_id: "rear"
      flow_role: "seed and host feed"
      record_type: "purchase and issue logs"
      raw_fields: "cohort; species; larval stage; seed count; host species; leaf mass; stock change; supplier"
      collection_method: "count and weigh issue"
      unit: "item;kg"
      frequency: "each issue"
      temporal_coverage: "full cohort"
      site_scope: "each rearer"
      aggregation_rule: "sum net inputs by cohort"
      quality_evidence: "receipt and scale ticket"
    - protocol_id: cp_utilities
      process_id: "rear_dry"
      flow_role: "water and energy"
      record_type: "meter and fuel log"
      raw_fields: "meter; carrier; start/end reading; batch; room; period; allocation key"
      collection_method: "meter or fuel receipt"
      unit: "kg;MJ"
      frequency: "batch or monthly"
      temporal_coverage: "full active periods"
      site_scope: "every site"
      aggregation_rule: "allocate shared meter once"
      quality_evidence: "meter image and invoice"
    - protocol_id: cp_assets
      process_id: "rear_dry_present"
      flow_role: "shared service"
      record_type: "asset register"
      raw_fields: "asset; acquisition; repair; service dates; consumers; use hours or batches"
      collection_method: "asset and service log"
      unit: "kg;hour"
      frequency: "each service event"
      temporal_coverage: "service life"
      site_scope: "each site"
      aggregation_rule: "allocate once by observed use"
      quality_evidence: "purchase and repair record"
    - protocol_id: cp_cocoon_mass
      process_id: "rear_collect_grade"
      flow_role: "cocoon transfer"
      record_type: "cohort batch ticket"
      raw_fields: "cohort; transfer time; incoming mass; outgoing mass; debris; sampling"
      collection_method: "calibrated scale and lot labels"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "harvest through grading"
      site_scope: "every lot"
      aggregation_rule: "reconcile one transfer between nodes"
      quality_evidence: "calibration and tickets"
    - protocol_id: cp_residues
      process_id: "rear_collect"
      flow_role: "loss and residue"
      record_type: "disposal or sales ticket"
      raw_fields: "cohort; material; wet mass; destination; receipt"
      collection_method: "weigh by material"
      unit: "kg"
      frequency: "each removal"
      temporal_coverage: "full cohort"
      site_scope: "each site"
      aggregation_rule: "sum once by fate"
      quality_evidence: "weigh and destination receipt"
    - protocol_id: cp_grade_state
      process_id: "grade"
      flow_role: "accepted, downgraded, waste"
      record_type: "grade test and lot ticket"
      raw_fields: "lot; defect; test; grade; accepted; downgraded; reject mass; destination"
      collection_method: "representative test and weighing"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "collection to sale"
      site_scope: "all lots"
      aggregation_rule: "reconcile all output states"
      quality_evidence: "sampling and buyer acceptance"
    - protocol_id: cp_drying_batch
      process_id: "dry"
      flow_role: "fresh-to-dry state"
      record_type: "dryer batch record"
      raw_fields: "lot; inlet/outlet mass and moisture; energy; time; reject mass; outlet grade"
      collection_method: "weigh and moisture sample"
      unit: "kg;kg/kg;MJ"
      frequency: "each batch"
      temporal_coverage: "inlet to dry handoff"
      site_scope: "all dried lots"
      aggregation_rule: "balance dry solids and rejects"
      quality_evidence: "scale, sample and dryer log"
    - protocol_id: cp_handover
      process_id: "present"
      flow_role: "final state and pack"
      record_type: "sale and packaging record"
      raw_fields: "lot; fresh/dried; grade; moisture; gross/tare; package; reuse; gate; buyer; time"
      collection_method: "scale, pack count and receipt"
      unit: "kg;item"
      frequency: "each handover"
      temporal_coverage: "pre-gate"
      site_scope: "every sale lot"
      aggregation_rule: "net cocoon mass by state/gate"
      quality_evidence: "calibration and signed receipt"
  calculation_rules:
    - id: c_net
      applies_to: "each handover"
      rule: "Net as-received cocoon mass = gross minus package tare and segregated rejects; retain state."
      inputs:
        - gross
        - tare
        - rejects
        - state
      output: "kg accepted lot"
      source_ids:
        - fao-cocoon-characteristics
    - id: c_dry
      applies_to: "paired fresh/dried batch"
      rule: "Dry solids = state-specific wet mass × (1 - measured moisture fraction); compare states on dry solids and account for sampled and rejected solids; no assumed conversion."
      inputs:
        - "inlet/outlet mass"
        - moisture
        - rejects
      output: "measured dry-solids balance"
      source_ids:
        - fao-cocoon-characteristics
        - fao-cocoon-drying
    - id: c_grade
      applies_to: "sorting"
      rule: "Accepted + separately marketed downgraded + waste + samples reconcile to graded input, allowing documented moisture timing difference."
      inputs:
        - "input and output masses"
      output: "lot balance and defect fractions"
      source_ids:
        - fao-cocoon-quality
    - id: c_intensity
      applies_to: "every node"
      rule: "Divide attributed process quantities by its declared output mass, then normalize final dataset to one kg at one state-specific gate."
      inputs:
        - "attributed inputs"
        - "output mass"
        - state
      output: "per-kg inventory"
      source_ids:
        - fao-cocoon-characteristics
  data_quality_requirements:
    - id: dq_identity
      applies_to: "each lot"
      requirement: "Demonstrate species/strain, grade, reelability, fresh/dried condition and actual gate; never infer reelability from CPC label."
      evidence: "sample, grade and buyer acceptance"
    - id: dq_moisture
      applies_to: "state comparison"
      requirement: "Use representative moisture and original as-received masses; report sample and balance uncertainty."
      evidence: "samples and scale calibration"
    - id: dq_complete
      applies_to: "all nodes"
      requirement: "Report selected nodes, inputs, accepted lots, downgraded sales, waste, periods and shared burdens; justify actual zero flows."
      evidence: "cohort ledger and node reconciliation"
    - id: dq_source
      applies_to: "upstream inputs"
      requirement: "Preserve source, quantity and quality of seed, host leaves, energy, packaging and selected upstream datasets."
      evidence: "invoices, host-crop ledger and metadata"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference and final outputs"
    rule: "Reject pierced/unreelable cocoons as reelable or a lot without grade/state/gate evidence; never bind fresh/unprocessed farm-gate UUID to dried, stifled or other-gate lot."
    source_ids:
      - fao-cocoon-quality
      - fao-cocoon-drying
  - rule_id: v_mass
    applies_to: "fresh and dried lots"
    rule: "Require measured net mass and moisture per state; reconcile collection, grading, drying and final handover with sample and water-loss terms, not assumed dry yield."
    source_ids:
      - fao-cocoon-characteristics
      - fao-cocoon-drying
  - rule_id: v_routes
    applies_to: "route deltas"
    rule: "Accept host, climate or mounting variant only with changed inventory, calculation, quality or validation evidence relative to managed parent; reject label-only route."
    source_ids:
      - fao-cocoon-quality
  - rule_id: v_attribution
    applies_to: "multi-output and multi-period"
    rule: "Verify separately marketed outputs, waste, unfinished cohorts, shared assets and service periods; one cocoon mass and shared burden may have only one attributed handover."
    source_ids:
      - fao-cocoon-quality
  - rule_id: v_binding
    applies_to: "flow cards"
    rule: "Resolve unresolved inputs to evidenced concrete UUIDs before TIDAS process exchange; leave other UUIDs unresolved until detail-confirmed."
    source_ids: []
published_dataset_profile:
  dataset_role: "State-specific foreground cocoon-production data package, not a published PCR release claim."
  downstream_use: "Secondary/background dataset for downstream silk chains; flow, process and lifecyclemodel projection after exchange identity resolution."
  allowed_use: "Compare same reelable state, species/grade and gate; compare fresh/dried only on measured moisture-normalized basis."
  excluded_use: "Proxy for raw silk, spun silk, pierced cocoon feedstock or reeling service; assumed fresh-to-dry conversion."
  required_metadata: "Cohort, species/strain, host source, grade, moisture, stifling operator/timing, reject destinations, gate, period and allocation."
  required_quality_disclosure: "Mass/moisture uncertainty, grade test, sampling, upstream data quality, unresolved identities and shared-asset allocation."
  update_trigger: "New host/strain or drying route, grade acceptance or gate change, exact UUID evidence or measured factors superseding provisional screens."
data_sources:
  - id: "fao-cocoon-characteristics"
    type: "handbook"
    reference: "[FAO, Silk reeling and testing manual, chapter 2](https://www.fao.org/4/x2099e/x2099e03.htm)"
    used_for: "Cocoon composition, weight/moisture states and dry-matter comparison."
  - id: "fao-cocoon-quality"
    type: "handbook"
    reference: "[FAO, Silk reeling and testing manual, chapter 3](https://www.fao.org/4/x2099e/x2099e04.htm)"
    used_for: "Rearing/mounting quality, collection, grading and pierced/unreelable distinction."
  - id: "fao-cocoon-drying"
    type: "handbook"
    reference: "[FAO, Silk reeling and testing manual, chapter 4](https://www.fao.org/4/x2099e/x2099e05.htm)"
    used_for: "Optional producer stifling/drying, storage and state measurement."
