      record_type: "cohort batch ticket"
      raw_fields: "cohort; transfer time; incoming mass; outgoing mass; debris; sampling"
      collection_method: "calibrated scale and lot labels; Raw aggregation requirements: reconcile one transfer between nodes. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "harvest through grading"
