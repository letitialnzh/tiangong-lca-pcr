allocation_rules:
  - rule_id: a_outputs
    applies_to: "breeder, hatchery, rearing"
    rule: "Enumerate marketed eggs, poults, older birds, spent breeders and exported manure with handover; reject eggs, shells, mortality and unsold litter are loss/waste."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_allocation
    applies_to: "independent co-products"
    rule: "Prefer documented physical causality; otherwise declare one mass or economic allocation basis, matching period-specific output masses/prices and disclosing sensitivity."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_period
    applies_to: "breeder years and cohorts"
    rule: "Link inputs, assets, stock changes, deaths and outputs to breeder year, hatch batch and grow-out cohort; allocate replacements and spent breeders once."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_shared
    applies_to: "shared buildings, incubators and meters"
    rule: "Attribute by measured use or documented capacity-time across all consuming nodes/periods; sum shares to one original burden."
    source_ids:
      - fao-leap-poultry-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_breeder
      process_id: "breeder"
      flow_role: "feed, accepted/rejected eggs, stock"
      record_type: "breeder ledger"
      raw_fields: "stock; feed; egg counts/mass; rejects; spent birds; period"
      collection_method: "farm logs and scales; Raw aggregation requirements: sum by period, attribute to accepted eggs and marketed co-products. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head, kg"
      frequency: "daily/period"
      temporal_coverage: "full breeder period"
      site_scope: "integrated breeder"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed stock/egg balance; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_breeder_manure
      process_id: "breeder"
      flow_role: "CH4, N2O, NH3"
      record_type: "breeder manure pathway"
      raw_fields: "bird stock; volatile solids; excreted N; pathway shares; factor tier"
      collection_method: "manure records and pathway calculation; Raw aggregation requirements: calculate each pollutant and pathway once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, fraction"
      frequency: "breeder period"
      temporal_coverage: "full breeder and manure period"
      site_scope: "integrated breeder"
      aggregation_rule: "per reference flow"
      quality_evidence: "inputs, factor and fate log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_hatchery
      process_id: "hatchery"
      flow_role: "eggs, utilities, poults, residues"
      record_type: "hatch batch"
      raw_fields: "receipts; origin; set/hatch dates; meter readings; water; outcome counts; sample masses"
      collection_method: "logs, meters and scales; Raw aggregation requirements: sum per batch, convert counts by samples. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head, kg, kWh, m3"
      frequency: "each batch"
      temporal_coverage: "incubation to hatch-pull"
      site_scope: "producer hatchery"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed hatch balance; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_rearing
      process_id: "rearing"
      flow_role: "poults, feed, water, energy, standing stock, residues"
      record_type: "cohort ledger"
      raw_fields: "origin/count; ration/moisture; meters; mortality; stock; litter fate"
      collection_method: "receipts, meters, logs and scales; Raw aggregation requirements: sum by material/period and assign shared use once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head, kg, m3, kWh"
      frequency: "daily/cohort"
      temporal_coverage: "full growth cohort"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, meters, stock reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
      process_id: "rearing"
      flow_role: "CH4, N2O and NH3"
      record_type: "manure pathway"
      raw_fields: "volatile solids; excreted N; storage/deposition; pathway shares; factor tier"
      collection_method: "records and IPCC-compatible calculation; Raw aggregation requirements: calculate distinct pollutants and pathways. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, fraction"
      frequency: "cohort/period"
      temporal_coverage: "full manure period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "factor and input log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_catching
      process_id: "catching"
      flow_role: "standing, saleable, losses"
      record_type: "dispatch batch"
      raw_fields: "standing/saleable/loss counts; sampled mass; gate; time"
      collection_method: "dispatch count and weighing; Raw aggregation requirements: count × sampled mass, reconcile one final output. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head, kg"
      frequency: "each dispatch"
      temporal_coverage: "catching to gate"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh slips and dispatch signature; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
  calculation_rules:
    - id: c_mass
      applies_to: "live birds"
      rule: "heads × representative sampled mass by age/class"
      inputs:
        - count
        - "sample weights"
        - route
      output: "kg live output"
      source_ids:
        - mass-balance-identity
    - id: c_hatch
      applies_to: "hatchery"
      rule: "accepted eggs = saleable + non-saleable + unhatched + documented other outcomes in counts"
      inputs:
        - "hatch ledger"
      output: "reconciled hatch count"
      source_ids:
        - mass-balance-identity
    - id: c_cohort
      applies_to: "rearing"
      rule: "opening + receipts − deaths − dispatch = closing heads, with internal transfers separately identified"
      inputs:
        - "cohort ledger"
      output: "reconciled live stock"
      source_ids:
        - mass-balance-identity
    - id: c_manure
      applies_to: "emissions"
      rule: "model CH4, N2O and NH3 by non-overlapping manure volatile-solids and nitrogen pathways and factor tier"
      inputs:
        - VS
        - N
        - "pathway shares"
        - factors
      output: "kg CH4, N2O and NH3"
      source_ids:
        - ipcc-livestock-2019
  data_quality_requirements:
    - id: q_route
      applies_to: "reference and final output"
      requirement: "identify exact day-old/hatchery or older/farm route and only one final gate"
      evidence: "dispatch and receipt"
