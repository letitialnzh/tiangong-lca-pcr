allocation_rules:
  - rule_id: a_outputs
    applies_to: "breeder, hatchery, rearing"
    rule: "Enumerate marketed eggs, poults, older birds, spent breeders and exported manure with handover; reject eggs, shells, mortality and unsold litter are loss/waste."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_allocation
    applies_to: "independent co-products"
    rule: "Prefer documented physical causality; otherwise declare one mass or economic allocation basis, matching period-specific output masses/prices and disclosing sensitivity."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_period
    applies_to: "breeder years and cohorts"
    rule: "Link inputs, assets, stock changes, deaths and outputs to breeder year, hatch batch and grow-out cohort; allocate replacements and spent breeders once."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_shared
    applies_to: "shared buildings, incubators and meters"
    rule: "Attribute by measured use or documented capacity-time across all consuming nodes/periods; sum shares to one original burden."
    source_ids:
      - fao-leap-poultry-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_breeder
      process_id: "breeder"
      flow_role: "feed, accepted/rejected eggs, stock"
      record_type: "breeder ledger"
      raw_fields: "stock; feed; egg counts/mass; rejects; spent birds; period"
      collection_method: "farm logs and scales"
      unit: "head, kg"
      frequency: "daily/period"
      temporal_coverage: "full breeder period"
      site_scope: "integrated breeder"
      aggregation_rule: "sum by period, attribute to accepted eggs and marketed co-products"
      quality_evidence: "signed stock/egg balance"
    - protocol_id: cp_breeder_manure
      process_id: "breeder"
      flow_role: "CH4, N2O, NH3"
      record_type: "breeder manure pathway"
      raw_fields: "bird stock; volatile solids; excreted N; pathway shares; factor tier"
      collection_method: "manure records and pathway calculation"
      unit: "kg, fraction"
      frequency: "breeder period"
      temporal_coverage: "full breeder and manure period"
      site_scope: "integrated breeder"
      aggregation_rule: "calculate each pollutant and pathway once"
      quality_evidence: "inputs, factor and fate log"
    - protocol_id: cp_hatchery
      process_id: "hatchery"
      flow_role: "eggs, utilities, poults, residues"
      record_type: "hatch batch"
      raw_fields: "receipts; origin; set/hatch dates; meter readings; water; outcome counts; sample masses"
      collection_method: "logs, meters and scales"
      unit: "head, kg, kWh, m3"
      frequency: "each batch"
      temporal_coverage: "incubation to hatch-pull"
      site_scope: "producer hatchery"
      aggregation_rule: "sum per batch, convert counts by samples"
      quality_evidence: "signed hatch balance"
    - protocol_id: cp_rearing
      process_id: "rearing"
      flow_role: "poults, feed, water, energy, standing stock, residues"
      record_type: "cohort ledger"
      raw_fields: "origin/count; ration/moisture; meters; mortality; stock; litter fate"
      collection_method: "receipts, meters, logs and scales"
      unit: "head, kg, m3, kWh"
      frequency: "daily/cohort"
      temporal_coverage: "full growth cohort"
      site_scope: "producing farm"
      aggregation_rule: "sum by material/period and assign shared use once"
      quality_evidence: "invoices, meters, stock reconciliation"
    - protocol_id: cp_manure
      process_id: "rearing"
      flow_role: "CH4, N2O and NH3"
      record_type: "manure pathway"
      raw_fields: "volatile solids; excreted N; storage/deposition; pathway shares; factor tier"
      collection_method: "records and IPCC-compatible calculation"
      unit: "kg, fraction"
      frequency: "cohort/period"
      temporal_coverage: "full manure period"
      site_scope: "producing farm"
      aggregation_rule: "calculate distinct pollutants and pathways"
      quality_evidence: "factor and input log"
    - protocol_id: cp_catching
      process_id: "catching"
      flow_role: "standing, saleable, losses"
      record_type: "dispatch batch"
      raw_fields: "standing/saleable/loss counts; sampled mass; gate; time"
      collection_method: "dispatch count and weighing"
      unit: "head, kg"
      frequency: "each dispatch"
      temporal_coverage: "catching to gate"
      site_scope: "producing farm"
      aggregation_rule: "count × sampled mass, reconcile one final output"
      quality_evidence: "weigh slips and dispatch signature"
  calculation_rules:
    - id: c_mass
      applies_to: "live birds"
      rule: "heads × representative sampled mass by age/class"
      inputs:
        - count
        - "sample weights"
        - route
      output: "kg live output"
      source_ids:
        - mass-balance-identity
    - id: c_hatch
      applies_to: "hatchery"
      rule: "accepted eggs = saleable + non-saleable + unhatched + documented other outcomes in counts"
      inputs:
        - "hatch ledger"
      output: "reconciled hatch count"
      source_ids:
        - mass-balance-identity
    - id: c_cohort
      applies_to: "rearing"
      rule: "opening + receipts − deaths − dispatch = closing heads, with internal transfers separately identified"
      inputs:
        - "cohort ledger"
      output: "reconciled live stock"
      source_ids:
        - mass-balance-identity
    - id: c_manure
      applies_to: "emissions"
      rule: "model CH4, N2O and NH3 by non-overlapping manure volatile-solids and nitrogen pathways and factor tier"
      inputs:
        - VS
        - N
        - "pathway shares"
        - factors
      output: "kg CH4, N2O and NH3"
      source_ids:
        - ipcc-livestock-2019
  data_quality_requirements:
    - id: q_route
      applies_to: "reference and final output"
      requirement: "identify exact day-old/hatchery or older/farm route and only one final gate"
      evidence: "dispatch and receipt"
    - id: q_count_mass
      applies_to: "birds and eggs"
      requirement: "retain count, age/class, sample size and sampled mass"
      evidence: "scale and count log"
    - id: q_predecessor
      applies_to: "eggs/poults"
      requirement: "trace purchased or integrated prior burden without duplicate transfer"
      evidence: "supplier dataset or internal ledger"
    - id: q_period
      applies_to: "breeders and shared assets"
      requirement: "reconcile opening/closing stock, deaths, service period and share"
      evidence: "period ledger"
    - id: q_fate
      applies_to: "waste and co-products"
      requirement: "record independently marketed outputs and each residue fate"
      evidence: "transfer/treatment record"
validation_rules:
  - rule_id: v_route
    applies_to: "all final birds"
    rule: "Reject unidentified age/gate mixtures; route UUID must match exact output, broad reference remains unresolved."
    source_ids:
      - unsd-cpc-2025
  - rule_id: v_hatch
    applies_to: "hatchery"
    rule: "Reconcile egg input and all hatch outcomes; at most one saleable poult per accepted egg."
    source_ids:
      - mass-balance-identity
  - rule_id: v_cohort
    applies_to: "rearing/catching"
    rule: "Reconcile poult receipts, mortality, internal standing transfer, final dispatch and live mass."
    source_ids:
      - mass-balance-identity
  - rule_id: v_attribution
    applies_to: "co-products and shared periods"
    rule: "Require all intended output gates, allocation basis and breeder/cohort period; no double-burden of assets or internal birds."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: v_manure
    applies_to: "air emissions"
    rule: "Check substance, air medium, non-overlapping manure pathway, factor tier and time period."
    source_ids:
      - ipcc-livestock-2019
  - rule_id: v_flow_identity
    applies_to: "water and energy"
    rule: "unresolved Product inputs resolve to verified concrete UUID only from actual water function and energy carrier."
    source_ids: []
published_dataset_profile:
  dataset_role: "producer-gate live-turkey foreground dataset"
  downstream_use: "secondary_dataset; background_dataset for process and lifecyclemodel"
  allowed_use: "declared route, age, gate and live state with complete preceding burden"
  excluded_use: "turkey meat, slaughter, unidentified mixed routes, separately sold eggs or post-gate freight"
  required_metadata: "route, producer, gate, age/class, head count, sampled weight, cohort, breeder period, mortality, prior transfer, shared assets"
  required_quality_disclosure: "coverage, attribution, samples, prior-stage gaps, manure factors and unresolved identities"
  update_trigger: "route, supplier, hatch yield, housing, manure or output-mix change"
