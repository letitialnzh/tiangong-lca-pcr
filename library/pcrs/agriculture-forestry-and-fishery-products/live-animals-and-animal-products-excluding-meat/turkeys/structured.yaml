system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The hatchery route starts with hatching eggs bearing their upstream burden and includes incubation, hatch-pull, selection and hatchery-gate handover. An integrated breeder flock supplies eggs as an upstream node only when not also taking purchased-egg burden. The older-bird route starts with poults bearing their prior hatchery burden and includes feed, water, housing, litter/manure, health, growth and separate catching to farm gate. Catching is an independent capture node because the standing flock becomes counted, weighed saleable live birds at a handover; it is not growth or slaughter. Rejects, mortality and unmarketed litter are losses or waste. Record independently marketed manure, hatching eggs and spent breeders as intended co-products only on actual transfer. Shared incubators, buildings, utilities and equipment are attributed once over their consuming nodes and periods."
      source_ids: []
    - rule_id: b_routes
      applies_to: "all birds"
      rule: "Select hatchery day-old or farm older-bird final gate; predecessor stages transfer once."
      source_ids:
        - unsd-cpc-2025
        - fao-leap-poultry-2016
    - rule_id: b_hatchery
      applies_to: "poults"
      rule: "Include accepted hatching eggs, incubation, hatch-pull, losses and hatchery dispatch."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: b_rearing
      applies_to: "older birds"
      rule: "Include received poults, feed, water, housing, manure, mortality and live catching."
      source_ids:
        - fao-leap-poultry-2016
        - ipcc-livestock-2019
    - rule_id: b_exclusion
      applies_to: "producer gate"
      rule: "Exclude slaughter, meat processing and post-gate freight; include inbound service only when actually bought within boundary."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
