  - id: nursery_grow_finish
    name: "Nursery and grow-finish production"
    inclusion: "required"
    inclusion_condition: "Always include for live market pigs; a piglet-only dataset may terminate at its declared producing-farm gate."
    role: "Managed growth with documented route delta for alternative technology and farm-gate transfer"
    quantitative_reference: "1 kg live pig at farm gate"
  - id: manure_management
    name: "Manure collection, storage, treatment, use, and export"
    inclusion: "required"
    inclusion_condition: "Include all manure generated inside the represented animal phases; route-specific operations may be zero but shall be declared."
