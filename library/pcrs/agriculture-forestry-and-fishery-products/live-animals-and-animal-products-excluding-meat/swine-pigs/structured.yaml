system_boundary:
  rules:
    - rule_id: boundary_farm_gate
      applies_to: "all datasets"
      rule: "Include managed production through live-weight measurement and transfer at the producing farm gate; exclude post-transfer transport, slaughter, dressing, and processing."
      source_ids:
        - fao-leap-pig-2018
    - rule_id: boundary_managed_phases
      applies_to: "production cohort"
      rule: "Include breeding/gestation/farrowing, nursing, nursery and grow-finish only when actually operated within the represented boundary; retain health, housing and manure responsibility for those phases. A piglet-only route ends at the actual piglet-producing gate and does not acquire unoperated nursery/grow-finish burdens. Purchased piglets retain their upstream burden when admitted to an operated receiving phase."
      source_ids:
        - fao-leap-pig-2018
        - ipcc-2019-livestock-manure
    - rule_id: boundary_route_variant
      applies_to: "backyard, intermediate, or industrial route"
      rule: "Identify route-specific topology and inventory deltas for feed origin, housing and environmental control, energy, manure pathway, infrastructure, and data collection; do not average mutually exclusive routes without transparent weighting."
      source_ids:
        - fao-leap-pig-2018
    - rule_id: boundary_periods
      applies_to: "breeding herd, pig cohort, and shared assets"
      rule: "Index breeding cycle, nursing, nursery, grow-finish, manure service period, and infrastructure service period; assign each input, output, loss, and event once."
      source_ids:
        - fao-leap-pig-2018
    - rule_id: boundary_shared_assets
      applies_to: "housing, ventilation, feeding, water, storage, and manure assets"
      rule: "Identify all consuming nodes and service periods and allocate by measured occupancy, live-weight-days, throughput, metered use, or another documented causal driver without duplicate burdens."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Breeding/replacement animals and admitted piglets enter in their measured live state; feed, water, energy, veterinary products, and other managed inputs enter at the farm boundary"
  starting_condition_role: "Managed biological production from admitted animals and inputs through live-pig farm-gate transfer"
  product_classification_scope: "Live domestic swine before slaughter; meat, carcass, service, germplasm, and post-farm transport systems are outside scope"
  recursive_input_rule: "Purchased or transferred live swine of the same category are recorded as upstream Product inputs with their actual class, live weight, origin, and gate; they shall not be represented by the reference output of the receiving process without a distinct upstream dataset."
  upstream_dataset_requirement: "Match animal class, live-weight basis, production system, origin, geography, period, and handover gate; feed datasets shall match formulation or ingredient identity and delivery state."
  disclosure: "Declare route variant, cohort phases, reporting period, animal movements, mortality, intended outputs, manure destinations, shared infrastructure, attribution choices, and unresolved identities."
