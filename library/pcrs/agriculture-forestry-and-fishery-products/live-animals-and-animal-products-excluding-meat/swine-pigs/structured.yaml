allocation_rules:
  - rule_id: allocation_output_set
    applies_to: "all intended outputs"
    rule: "Enumerate live market pigs, independently transferred piglets, breeding animals, culled animals, and exported manure. Mortalities and unusable manure remain losses/waste unless an evidenced intended handover changes their role."
    source_ids:
      - fao-leap-pig-2018
  - rule_id: allocation_physical_first
    applies_to: "multi-output process"
    rule: "First subdivide measured phase-specific inputs and emissions. For remaining inseparable burdens, use a documented causal physical driver such as live-weight gain, live-weight-days, nutrient content, or measured service; economic allocation requires justification and sensitivity disclosure."
    source_ids:
      - fao-leap-pig-2018
  - rule_id: allocation_period
    applies_to: "breeding herd and cohort phases"
    rule: "Link breeding, nursing, nursery, grow-finish, replacement, culling, and termination events to declared periods and outputs; record carryover and prevent double attribution between cohorts."
    source_ids:
      - fao-leap-pig-2018
  - rule_id: allocation_shared_infrastructure
    applies_to: "shared buildings and equipment"
    rule: "Enumerate consuming nodes and service periods; allocate each asset once by measured occupancy, live-weight-days, throughput, run time, or metered use and retain the selected driver's evidence."
    source_ids: []
  - rule_id: allocation_manure
    applies_to: "exported manure"
    rule: "Record the selected attribution or substitution treatment, destination, mass, dry matter and nutrient content. Do not apply both allocated burdens and an avoided-product credit to the same output unless the study method explicitly requires and discloses both."
    source_ids:
      - fao-leap-nutrient-flows-2018
dataset_production:
  collection_protocols:
    - protocol_id: cp_breeding_records
      process_id: "breeding_farrowing"
      flow_role: "breeding stock, reproduction, piglet output"
      record_type: "herd register and scale record"
      raw_fields: "animal class; head; live weight; entry/exit; mating; farrowing; weaning; culling; period"
      collection_method: "reconcile herd register with calibrated scale and event logs; Raw aggregation requirements: assign events and stock changes once to declared cohorts. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg live weight; date"
      frequency: "each event; monthly reconciliation"
      temporal_coverage: "full breeding cycle represented"
      site_scope: "all supplying breeding units"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; inventory reconciliation; exception log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_records
      process_id: "breeding_farrowing_nursery_grow_finish"
      flow_role: "feed inputs"
      record_type: "invoice, formulation and stock record"
      raw_fields: "product/formulation; supplier; as-fed mass; moisture/DM; composition; opening/closing stock; losses; cohort"
      collection_method: "mass balance by formulation and phase; Raw aggregation requirements: deliveries + opening stock - closing stock - documented losses. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg as-fed; kg DM"
      frequency: "each delivery; monthly stocktake"
      temporal_coverage: "full cohort/reporting period"
      site_scope: "all feed stores and animal units"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices; formulation sheets; stock reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_water_energy_records
      process_id: "breeding_farrowing_nursery_grow_finish"
      flow_role: "water and energy inputs"
      record_type: "meter, invoice and equipment log"
      raw_fields: "meter id; carrier; reading; use category; building; dates; allocation driver"
      collection_method: "direct submeter preferred; otherwise documented causal allocation; Raw aggregation requirements: difference readings, convert units, allocate once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3; kWh; MJ; carrier unit"
      frequency: "monthly or finer"
      temporal_coverage: "full represented period"
      site_scope: "all animal buildings and shared utilities"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; invoice reconciliation; allocation worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_health_mortality_records
      process_id: "breeding_farrowing_nursery_grow_finish"
      flow_role: "health products and mortalities"
      record_type: "treatment and mortality register"
      raw_fields: "product; active ingredient; amount/dose; animal group; date; mortality head/mass; cause; destination"
      collection_method: "event record reconciled to stock and herd counts; Raw aggregation requirements: sum by product and cohort; reconcile mortality once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "recorded product unit; head; kg"
      frequency: "each event"
      temporal_coverage: "full cohort/reporting period"
      site_scope: "all represented animal units"
      aggregation_rule: "per reference flow"
      quality_evidence: "medicine register; stock record; disposal receipt; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_live_animal_transfer
      process_id: "breeding_farrowing_nursery_grow_finish"
      flow_role: "admitted and transferred live animals"
      record_type: "calibrated scale and transfer record"
      raw_fields: "animal class; sex; head; gross/tare/net live weight; timestamp; origin/destination; gate"
      collection_method: "calibrated individual or group weighing immediately before handover; Raw aggregation requirements: sum net accepted mass; retain head count separately. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg live weight; head"
      frequency: "every transfer"
      temporal_coverage: "complete cohort"
      site_scope: "every included farm gate and internal phase handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration certificate; signed transfer record; rejected-animal log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_transport_records
      process_id: "nursery_grow_finish"
      flow_role: "foreground-controlled inbound transport"
      record_type: "dispatch and route record"
      raw_fields: "payload; origin; destination; loaded distance; mode; ownership/control"
      collection_method: "payload-distance calculation for in-boundary legs only; Raw aggregation requirements: sum payload × loaded distance; exclude post-transfer legs. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "t; km; t*km"
      frequency: "every included trip"
      temporal_coverage: "full cohort/reporting period"
      site_scope: "all controlled inbound legs"
      aggregation_rule: "per reference flow"
      quality_evidence: "dispatch ticket; route record; boundary justification; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_animal_emission_records
      process_id: "nursery_grow_finish"
      flow_role: "enteric emissions"
      record_type: "animal activity and feed record"
      raw_fields: "animal category; head-days or live-weight-days; intake; digestibility; method parameters"
      collection_method: "apply declared IPCC-compatible method to collected activity; Raw aggregation requirements: calculate by category then normalize to accepted live output. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head-day; kg DM; kg CH4"
      frequency: "phase and reporting period"
      temporal_coverage: "full cohort"
      site_scope: "all represented animals"
      aggregation_rule: "per reference flow"
      quality_evidence: "method version; parameter provenance; category reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure_records
      process_id: "manure_management"
      flow_role: "manure, treatment, export and emissions"
      record_type: "manure-system log and analysis"
      raw_fields: "animal category; excretion basis; mass/volume; DM; N; VS; system share; storage time; treatment; export; destination; water/energy"
      collection_method: "mass and nutrient balance plus declared emission method; Raw aggregation requirements: reconcile opening + inflow - closing - outputs - losses; allocate once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; m3; kg DM; kg N; kg VS; kWh"
      frequency: "monthly and each transfer"
      temporal_coverage: "full reporting period and storage carryover"
      site_scope: "all manure systems serving represented animals"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling/analysis; storage measurement; transfer receipt; method worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: calc_reference_normalization
      applies_to: "all exchanges"
      rule: "normalized amount = attributable exchange / accepted farm-gate live weight"
      inputs:
        - "attributable exchange"
        - "calibrated accepted live weight"
      output: "exchange per kg live pig"
      source_ids:
        - mass-balance-identity
    - id: calc_feed_consumed
      applies_to: "feed"
      rule: "consumed = opening stock + deliveries - closing stock - documented returns/losses"
      inputs:
        - "formulation-specific stock and delivery records"
      output: "kg as-fed and kg DM by phase"
      source_ids: []
    - id: calc_transport_service
      applies_to: "included inbound transport"
      rule: "sum(payload tonnes × loaded km) for foreground-controlled inbound legs only"
      inputs:
        - payload
        - "loaded distance"
        - "boundary decision"
      output: "t*km"
      source_ids: []
    - id: calc_live_weight_days
      applies_to: "phase and shared burdens"
      rule: "sum live weight × days by animal class and phase; do not overlap phase dates"
      inputs:
        - "dated herd inventory and weights"
      output: "kg live-weight-days"
      source_ids: []
    - id: calc_manure_emissions
      applies_to: "methane and nitrous oxide"
      rule: "apply declared IPCC-compatible category and manure-system equations to collected activity; retain all parameters"
      inputs:
        - category
        - "population/time"
        - "intake/excretion"
        - VS
        - N
        - "system shares"
        - climate
        - factors
      output: "kg CH4 and kg N2O"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: calc_nitrogen_balance
      applies_to: "manure route"
      rule: "N input/excretion = N retained/exported + N in residues + quantified N losses ± storage change"
      inputs:
        - "feed/animal and manure N records"
        - "export analysis"
        - "method parameters"
      output: "kg N by route"
      source_ids:
        - fao-leap-nutrient-flows-2018
  data_quality_requirements:
    - id: dq_identity_gate
      applies_to: "reference output"
      requirement: "Retain animal class, route, live-weight basis, producing-farm gate, timestamp, origin/destination, and signed transfer; no feed-grade, count-only, at-plant, meat, or carcass substitute."
      evidence: "scale and transfer records; unresolved UUID review note"
    - id: dq_route_phase
      applies_to: "route variants and periods"
      requirement: "Identify backyard/intermediate/industrial route, all represented phases and sites, and phase dates; justify any aggregation and preserve weights."
      evidence: "route declaration; herd and facility records"
    - id: dq_completeness
      applies_to: "inventory"
      requirement: "Reconcile animals, feed, water/energy meters, mortalities, manure, intended outputs, and stock/storage changes over the same period."
      evidence: "signed reconciliation and exception log"
    - id: dq_method_parameters
      applies_to: "calculated emissions and allocation"
      requirement: "Retain method version, every factor and parameter, source, units, conversions, allocation driver, and sensitivity case."
      evidence: "calculation workbook and source references"
    - id: dq_shared_assets
      applies_to: "infrastructure"
      requirement: "List each shared asset, consuming nodes, service period, and selected causal driver; demonstrate the burden is assigned once."
      evidence: "asset register; meter/run-time/occupancy evidence"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference flow"
    rule: "Fail if the output is not live domestic swine weighed by mass at the producing farm gate, or if either rejected candidate UUID is used."
    source_ids: []
  - rule_id: validate_reference_uuid
    applies_to: "reference binding"
    rule: "Keep the reference Product-flow UUID empty until one compatible product identity is detail-confirmed. Independently confirmed Mass property and unit-group UUIDs are support references only; unresolved product identity blocks active/publication readiness."
    source_ids: []
  - rule_id: validate_route_delta
    applies_to: "route variants"
    rule: "Fail if backyard, intermediate, or industrial routes are combined without route-specific topology, inventory categories, calculation/validation deltas, current evidence, and transparent weights."
    source_ids: []
  - rule_id: validate_phase_period
    applies_to: "phases and reporting periods"
    rule: "Fail when breeding, nursing, nursery, grow-finish, manure, replacement, culling, or asset service periods are relevant but unindexed, overlap without explanation, or are attributed twice."
    source_ids: []
  - rule_id: validate_output_roles
    applies_to: "intended outputs, residues, and waste"
    rule: "Fail unless every live output and exported manure handover is recorded and mortalities/unusable manure are distinguished from intended products."
    source_ids: []
  - rule_id: validate_shared_assets
    applies_to: "shared infrastructure"
    rule: "Fail unless each shared asset names at least two consuming nodes or periods, its service boundary and driver, and a no-double-counting check."
    source_ids: []
  - rule_id: validate_flow_identity
    applies_to: "unresolved Product inputs"
    rule: "Determine the actual energy carrier, water supply and any foreground-controlled inbound transport from records; final generated exchanges require compatible verified concrete UUIDs."
    source_ids: []
  - rule_id: validate_emission_identity
    applies_to: "elementary outputs"
    rule: "Fail fixed binding unless substance, receiving compartment, flow property, unit group, and support references are detail-confirmed; broad pollutant labels remain unresolved."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all important flows"
    rule: "Require an evidence-backed range or clearly replaceable reasoned_estimate range with role, bounds, unit, basis, and evidence kind."
    source_ids: []
  - rule_id: validate_mass_n_balance
    applies_to: "animals and manure"
    rule: "Investigate unexplained animal mass, manure mass, or nitrogen imbalance; record storage change and transformations rather than forcing closure."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground swine-production data package normalized to live weight at the producing farm gate"
  downstream_use: "secondary_dataset; background_dataset after review and publication"
  allowed_use: "LCA process and lifecycle-model construction for a declared live-swine class, route, geography, cohort, period, and farm-gate boundary"
  excluded_use: "Pork/carcass modelling; slaughterhouse or post-farm transport; generic use across undeclared routes; substitution for count-based, feed-grade, or at-plant flows"
  required_metadata: "Animal class; sex where material; breed/genotype; route; geography; cohort and dates; phase/site coverage; live-weight method; output set; manure route; allocation; actual flow selections; UUID resolution status"
  required_quality_disclosure: "Coverage and reconciliation; foreground versus modelled values; reasoned-estimate replacements; method/factor versions; shared-asset treatment; unresolved identities and excluded operations"
  update_trigger: "Change in reference identity/gate, production route, feed or manure system, output set, allocation, emission method, flow identity evidence, verified UUID, or material data-quality evidence"
data_sources:
  - id: "fao-leap-pig-2018"
    type: "official_guidance"
    reference: "FAO LEAP, *Environmental performance of pig supply chains: Guidelines for assessment* (2018), https://openknowledge.fao.org/handle/20.500.14283/i8686en"
    used_for: "Pig-system boundary, route variants, process decomposition, foreground records, output and allocation rules"
  - id: "fao-leap-nutrient-flows-2018"
    type: "official_guidance"
    reference: "FAO LEAP, *Nutrient flows and associated environmental impacts in livestock supply chains* (2018), https://openknowledge.fao.org/handle/20.500.14283/ca1328en"
    used_for: "Manure nutrient-flow balance, exported manure, ammonia and nitrogen-loss accounting"
  - id: "ipcc-2019-livestock-manure"
    type: "method_factor"
    reference: "IPCC, *2019 Refinement, Volume 4, Chapter 10: Emissions from Livestock and Manure Management*, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf"
    used_for: "Animal categories, feed/activity inputs, enteric methane and manure CH4/N2O method requirements; not direct farm inventory amounts"
  - id: "mass-balance-identity"
    type: "standard"
    reference: "Conservation-of-mass identity applied to measured animal and manure transfers"
    used_for: "Reference normalization and output/residue QA constraints"
