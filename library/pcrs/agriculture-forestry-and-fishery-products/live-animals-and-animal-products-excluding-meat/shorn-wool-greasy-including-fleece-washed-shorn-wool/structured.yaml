system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Include managed sheep production, feed and pasture, manure, conditional pre-shear on-animal washing, shearing, farm airing/skirting, grade sorting, baling and producing-farm handover. Account for upstream purchased animal, feed, energy, water, fertilizer and packaging datasets once. Record rearing, replacements, culls and shared facilities across years. Stop before auction, post-farm freight, scouring, grease extraction and textile manufacture (iwto-wool-lca-2016)."
      source_ids: []
    - rule_id: farm_gate_limit
      applies_to: "all nodes"
      rule: "Stop at accepted greasy-wool bale handover; exclude post-shear scouring and later logistics."
      source_ids:
        - un-cpc-2025
        - iwto-wool-lca-2016
    - rule_id: wash_gate
      applies_to: "optional wash"
      rule: "Wash fleece while still on live sheep before shearing; document water, effluent and dry-off, retaining greasy output."
      source_ids:
        - wco-hs-2017
    - rule_id: route_delta
      applies_to: "wash/no-wash"
      rule: "Both inherit flock husbandry; one fleece uses one route. Wash adds a separate node and inventory; no double route attribution."
      source_ids:
        - iwto-wool-lca-2016
