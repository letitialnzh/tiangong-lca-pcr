allocation_rules:
  - rule_id: flock_outputs
    applies_to: "fleece, live sheep/lambs, exported manure and other independent products"
    rule: "Prefer physical subdivision where separable; for shared flock burdens disclose and consistently apply a justified allocation such as period-specific economic value, with price and sensitivity. No zero-burden cull sheep or dual product/waste manure."
    source_ids:
      - iwto-wool-lca-2016
  - rule_id: period_link
    applies_to: "breeding, replacement, growth, shearing and culling years"
    rule: "Link inputs, animal stocks, events and outputs across relevant years; amortize only with observed service/lifetime evidence. Assign animal-year burden once."
    source_ids:
      - iwto-wool-lca-2016
  - rule_id: shared_assets
    applies_to: "pasture, housing, water system, shearing shed and equipment"
    rule: "Identify flock/shearing/baling consumers and service years; allocate shared use by documented hours, area or animal-time before product allocation; avoid node duplication."
    source_ids:
      - iwto-wool-lca-2016
  - rule_id: grade_accounting
    applies_to: "accepted, downgraded and rejected fleece"
    rule: "Keep grade outputs and destinations separate; marketable downgrade is product, unsaleable skirtings waste, and fibre cannot be both."
    source_ids:
      - iwto-wool-lca-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_flock_feed
      process_id: "flock"
      flow_role: "feed, nutrients"
      record_type: "flock/field/invoice"
      raw_fields: "cohort; pasture area; diet; dry matter; nutrient composition; date; stock"
      collection_method: "farm records and documented intake model; Raw aggregation requirements: reconcile purchased, grown and consumed. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, ha"
      frequency: "monthly/event"
      temporal_coverage: "flock and rearing years"
      site_scope: "farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "receipts, feed tests; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_water_energy
      process_id: "flock"
      flow_role: "water, energy"
      record_type: "meter/invoice"
      raw_fields: "source; carrier; purpose; period; shared consumer"
      collection_method: "meter and invoice; Raw aggregation requirements: allocate by consumer. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3, kWh, L"
      frequency: "monthly"
      temporal_coverage: "flock year"
      site_scope: "farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter images, invoices; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_flock_outputs
      process_id: "flock"
      flow_role: "live animals"
      record_type: "sale/stock register"
      raw_fields: "cohort; head; live mass; date; gate"
      collection_method: "weighbridge and stock count; Raw aggregation requirements: opening + additions - removals = closing. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, head"
      frequency: "event"
      temporal_coverage: "flock year"
      site_scope: "farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "sale slips, register; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
      process_id: "flock"
      flow_role: "manure and emissions"
      record_type: "activity register"
      raw_fields: "cohort; N intake/excretion; management; storage; transfer; factors"
      collection_method: "collect activity and IPCC tier; Raw aggregation requirements: distinct CH4, N2O, NH3 pathways. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg N, kg manure"
      frequency: "monthly/event"
      temporal_coverage: "flock year"
      site_scope: "farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "activity/factor sheets; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_wash_shear
      process_id: "fleece_wash_shearing"
      flow_role: "wash and capture"
      record_type: "event"
      raw_fields: "sheep; wash date/water/effluent/dry-off; shear date; raw mass; energy"
      collection_method: "event log, scale, meter; Raw aggregation requirements: link one route to one fleece. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, m3, kWh"
      frequency: "event"
      temporal_coverage: "shear season"
      site_scope: "farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "event and calibration sheets; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grade_bale
      process_id: "conditioning_grading_baling"
      flow_role: "mass/presentation"
      record_type: "grade/bale register"
      raw_fields: "capture; skirtings; grade; moisture; tare; packing/reuse; dispatch"
      collection_method: "scale and buyer docket; Raw aggregation requirements: capture = grades + rejects + change/loss. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, item"
      frequency: "bale"
      temporal_coverage: "shear season"
      site_scope: "farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale tickets, grading records; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: wool_balance
      applies_to: "shear to gate"
      rule: "captured = accepted grades + downgraded grades + skirtings + measured moisture/other loss; disclose residual"
      inputs:
        - "event and bale records"
      output: "net reference mass and balance"
      source_ids:
        - iwto-wool-lca-2016
    - id: enteric_method
      applies_to: "enteric CH4"
      rule: "declared IPCC tier on age/diet/productivity-specific activity, with factor and unit conversion"
      inputs:
        - cohort
        - diet
        - duration
      output: "kg CH4 distinct from manure"
      source_ids:
        - ipcc-livestock-2019
    - id: manure_n_method
      applies_to: "manure N2O/NH3"
      rule: "excreted N × management shares × distinct factors and conversions; reconcile N"
      inputs:
        - excretion
        - management
        - factors
      output: "kg N2O and NH3"
      source_ids:
        - ipcc-livestock-2019
    - id: allocated_reference
      applies_to: "shared activities"
      rule: "activity × documented service-period and co-product shares ÷ net greasy wool"
      inputs:
        - "use logs"
        - years
        - "outputs and values"
      output: "activity per kg reference"
      source_ids:
        - iwto-wool-lca-2016
  data_quality_requirements:
    - id: identity
      applies_to: "wool"
      requirement: "Document sheep/lamb origin, greasy state, on-animal wash, grade and farm gate; reject unknown post-shear wash."
      evidence: "shear and sale records"
    - id: completeness
      applies_to: "flock/fleece"
      requirement: "Reconcile animals, feed, manure, capture, grades, co-products and rejects."
      evidence: "mass and stock balances"
    - id: temporal
      applies_to: "multi-year flock"
      requirement: "Link animal age, events and shared assets to service years; disclose gaps."
      evidence: "cohort and asset registers"
    - id: measurement
      applies_to: "masses/moisture/energy"
      requirement: "Retain calibration and original units; disclose estimates."
      evidence: "scale/meter records"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference/grades"
    rule: "Reject goat/camelid/pulled wool, post-shear scoured fibre, non-farm gate or unknown species; check greasy net kg."
    source_ids:
      - un-cpc-2025
      - wco-hs-2017
  - rule_id: validate_route
    applies_to: "wash/no-wash"
    rule: "Confirm wash on living sheep before shear with water/effluent/dry-off evidence; one fleece uses one route."
    source_ids:
      - wco-hs-2017
      - iwto-wool-lca-2016
  - rule_id: validate_balance
    applies_to: "fleece/co-products"
    rule: "Reconcile capture, grades, rejects, bale tare, live animals and manure; no product/waste dual classification."
    source_ids:
      - iwto-wool-lca-2016
  - rule_id: validate_period
    applies_to: "flock/shared assets"
    rule: "Verify period, replacement, service and co-product shares sum once; no inherited-burden omission."
    source_ids:
      - iwto-wool-lca-2016
  - rule_id: validate_binding
    applies_to: "concrete exchanges"
    rule: "Resolve unresolved inputs from actual records and exact UUIDs for concrete outputs before dataset publication."
    source_ids: []
