system_boundary:
  rules:
    - rule_id: gate
      applies_to: "all routes"
      rule: "End at actual herd-to-buyer handover; mobile camp is not assumed fixed farm. Exclude later transport and centre work."
      source_ids:
        - un-cpc-3
        - fao-camel-dairy
    - rule_id: route_delta
      applies_to: "herd"
      rule: "Mobile management records grazing and moved water/fuel; housed management records delivered feed, pumping, shelter and managed manure. Partition mixed-herd days."
      source_ids:
        - fao-camel-dairy
        - fao-camel-production
    - rule_id: raw_state
      applies_to: "milk"
      rule: "Separate collected warm, prepared warm and cooled milk. Straining and cooling occur only with batch evidence; no heat treatment."
      source_ids:
        - fao-camel-production
    - rule_id: shared_asset
      applies_to: "nodes"
      rule: "Allocate well, pump, vehicle, shelter, milking equipment or cooler to actual consumers and service periods once."
      source_ids:
        - fao-camel-dairy
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
