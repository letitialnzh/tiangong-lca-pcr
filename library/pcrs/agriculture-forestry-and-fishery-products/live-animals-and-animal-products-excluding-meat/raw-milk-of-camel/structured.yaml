allocation_rules:
  - rule_id: output_set
    applies_to: "herd and handover"
    rule: "Enumerate raw milk, independently sold/transferred calves and culls, and any marketed manure, dung fuel or fibre at first external handover. Own-herd suckling and retained replacements are internal; dead stock and discarded milk are waste."
    source_ids:
      - fao-camel-dairy
  - rule_id: allocation_precedence
    applies_to: "inseparable herd burden"
    rule: "Subdivide directly measured milking and calf-rearing services first. For inseparable herd burdens use a defensible documented biophysical relation, otherwise period-specific economic allocation with prices and sensitivity. Never assign all breeding/dry-period burden to milk or silently expand the system."
    source_ids:
      - fao-camel-dairy
  - rule_id: period_attribution
    applies_to: "herd periods"
    rule: "Link lactation, dry, pregnancy, calf-rearing and replacement periods to inputs, assets, births, deaths and outputs; allocate supporting-period burden once, with no universal annualization factor."
    source_ids:
      - fao-camel-production
  - rule_id: shared_service
    applies_to: "shared assets"
    rule: "List all consumers and service periods of wells, pumps, vehicles, shelters, milking devices and coolers. Apportion measured water, energy or runtime once and disclose proxies."
    source_ids:
      - fao-camel-dairy
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd
      process_id: "herd_management"
      flow_role: "herd inputs and outputs"
      record_type: "herd log"
      raw_fields: "species; class; route; phase; animal-days; feed; grazing; water; fuel; births; culls; manure; mortality"
      collection_method: "weigh, meter, dated register; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg; m3; MJ; head; day"
      frequency: "daily/event"
      temporal_coverage: "full supporting period"
      site_scope: "actual camps and farms"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, calibration, method version; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_milking
      process_id: "milk_capture"
      flow_role: "collected, calf and loss"
      record_type: "event sheet"
      raw_fields: "dam; method; collected mass; calf suckling; water; waste"
      collection_method: "scale, meter, observation; Raw aggregation requirements: reconcile, then sum. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; m3"
      frequency: "each event"
      temporal_coverage: "milk period"
      site_scope: "milking point"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated scale and observation notes; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_conditioning
      process_id: "first_conditioning"
      flow_role: "raw, prepared, rejects"
      record_type: "batch log"
      raw_fields: "input; straining; retained; rejects; destination"
      collection_method: "scale and filter log; Raw aggregation requirements: input = retained + loss. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each applicable batch"
      temporal_coverage: "milk period"
      site_scope: "herd point"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale and batch ID; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_cooling
      process_id: "farm_cooling"
      flow_role: "warm, energy, chilled, loss"
      record_type: "cooler log"
      raw_fields: "mass; time; temperature; fuel/electricity; reject"
      collection_method: "scale, thermometer, meter; Raw aggregation requirements: input = chilled + loss. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; °C; MJ"
      frequency: "each applicable batch"
      temporal_coverage: "milk period"
      site_scope: "actual cooler"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated instruments; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_handover
      process_id: "producer_handover"
      flow_role: "final product"
      record_type: "handover ticket"
      raw_fields: "mobile/fixed location; buyer; state; temperature; net mass"
      collection_method: "weighed signed ticket; Raw aggregation requirements: exactly one state per batch. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; °C"
      frequency: "each delivery"
      temporal_coverage: "milk period"
      site_scope: "actual herd gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "ticket and scale check; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "herd_management"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "herd_management"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: net_yield
      applies_to: "final milk"
      rule: "Partition accepted handovers by species, warm or chilled state, and actual producer gate. For each stratum, sum only its accepted net milk mass and divide only its attributable inventory by that positive mass. Assign actual cooling inputs and losses only to the cooled route; attribute shared herd burdens once using the declared allocation rules. Warm plus chilled mass is a reconciliation total only, never the denominator of a single-state result."
      inputs:
        - cp_handover
        - "state- and gate-specific accepted masses and attributable inventories"
      output: "separate reference-normalized results for each state and gate"
      source_ids:
        - mass-balance-identity
    - id: milk_balance
      applies_to: "milk"
      rule: "Accounted milk = collected + calf-consumed + disclosed uncollected; later input = retained + loss. No universal calf-share factor."
      inputs:
        - cp_milking
        - cp_conditioning
        - cp_cooling
      output: "reconciled kg and uncertainty"
      source_ids:
        - fao-camel-production
        - mass-balance-identity
    - id: enteric_method
      applies_to: "methane"
      rule: "Apply documented class/feed/IPCC-consistent method to measured animal-days, not UUID-derived factor."
      inputs:
        - cp_herd
      output: "kg biogenic CH4"
      source_ids:
        - ipcc-livestock-2019
    - id: manure_air_method
      applies_to: "manure CH4, N2O and NH3"
      rule: "Choose separately documented manure-system methane, direct nitrous oxide and volatilized ammonia methods using animal class, excretion, handling stage and destination. Reconcile direct and indirect nitrogen paths without duplicate emission."
      inputs:
        - cp_herd
      output: "kg CH4; kg N2O; kg NH3"
      source_ids:
        - ipcc-livestock-2019
    - id: attribution
      applies_to: "herd and assets"
      rule: "Add direct and one share of supporting/shared burdens; allocate among independent outputs by disclosed precedence."
      inputs:
        - cp_herd
        - cp_handover
      output: "burden/kg milk"
      source_ids:
        - fao-camel-dairy
    - id: calc_feed_supply_and_intake
      applies_to: "herd_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
    - id: calc_manure_n2o_coverage
      applies_to: "manure_n2o"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-livestock-2019
        - ipcc-managed-soils-2019
  data_quality_requirements:
    - id: gate_identity
      applies_to: "final product"
      requirement: "Species, mobile/fixed gate and state verified; fixed UUID only for chilled fixed farm."
      evidence: "signed ticket and flow detail"
    - id: period_coverage
      applies_to: "herd"
      requirement: "Include supporting phases, calf share, culls, death and losses; disclose gaps."
      evidence: "dated registers"
    - id: route_partition
      applies_to: "mixed herd"
      requirement: "No animal-day or shared asset service in two routes or periods."
      evidence: "dated movement/service logs"
    - id: quantity_trace
      applies_to: "all"
      requirement: "Retain calibration, density conversion, estimates and method version; ranges do not replace data."
      evidence: "QA records"
validation_rules:
  - rule_id: v_cpc_milk_scope
    applies_to: "final reference product and classification"
    rule: "Check the lot-matched measured milk-fat fraction is at least 3.5% (35 g/kg milk) and that the milk is neither skimmed nor partly skimmed. Reject use of this exact CPC-linked scope for lower-fat or separated milk; missing evidence leaves classification eligibility undetermined, not assumed. Do not reinterpret this as a quality acceptance limit or change the actual composition."
    source_ids:
      - un-cpc-3-02293
  - rule_id: v_gate
    applies_to: "reference milk"
    rule: "Reject the fixed chilled-farm UUID for warm, mobile, unspecified-gate or processed milk. Broad reference remains unbound."
    source_ids:
      - un-cpc-3
      - fao-camel-dairy
  - rule_id: v_mass
    applies_to: "milk stages"
    rule: "Reconcile collected, calf-consumed, conditioned, chilled, rejected and handed-over milk, with one final output per batch."
    source_ids:
      - fao-camel-production
      - mass-balance-identity
  - rule_id: v_route
    applies_to: "mixed herd"
    rule: "Verify route-specific feed, water, energy, manure and mutually exclusive animal-days; conditional interventions need batch records."
    source_ids:
      - fao-camel-dairy
      - fao-camel-production
  - rule_id: v_attribution
    applies_to: "co-products and assets"
    rule: "Verify independent calves/culls, supporting periods and shared consumers; reject duplicate burdens."
    source_ids:
      - fao-camel-dairy
  - rule_id: v_range
    applies_to: "amount QA"
    rule: "Provisional reasoned ranges are screening guardrails only, not measured defaults or acceptance limits."
    source_ids:
      - mass-balance-identity
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-livestock-2019
      - ipcc-managed-soils-2019
published_dataset_profile:
  dataset_role: "Producing-herd foreground raw camel milk"
  downstream_use: "secondary_dataset; background_dataset only for matching route and gate"
  allowed_use: "Raw camel milk supply for matched species, route, state and handover"
  excluded_use: "Processed milk, collection centre, downstream transport or generic fixed chilled identity on mobile gate"
  required_metadata: "species; route and dates; gate; state; milk mass/density; calf share; periods; allocation; binding evidence"
  required_quality_disclosure: "primary-data coverage, inferred calf share, loss balance, shared-service shares, emission method, UUID gaps"
  update_trigger: "Changed species, route, gate, cooling, co-products or significant activity evidence"
