    type: "official_guidance"
    reference: "[UN CPC 3.0 explanatory notes](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "classification boundary"
  - id: "fao-camel-dairy"
    type: "official_guidance"
    reference: "[FAO camel dairy](https://www.fao.org/dairy-production-products/dairy/camels/en)"
    used_for: "species, mobile route, co-products"
  - id: "fao-camel-production"
    type: "handbook"
    reference: "[FAO camel milk production](https://www.fao.org/4/t0755e/t0755e01.htm)"
    used_for: "calf sharing, variable yield, milking"
  - id: "ipcc-livestock-2019"
    type: "method_factor"
    reference: "[IPCC 2019 Refinement, Vol. 4 Ch. 10](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf)"
    used_for: "emissions method selection"
  - id: "mass-balance-identity"
    type: "standard"
    reference: "Conservation of mass: input = retained plus losses"
    used_for: "milk QA identity"
