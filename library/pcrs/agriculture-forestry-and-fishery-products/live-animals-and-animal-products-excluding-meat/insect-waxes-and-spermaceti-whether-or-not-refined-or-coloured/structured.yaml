allocation_rules:
  - rule_id: a_source
    applies_to: "actual source output set"
    rule: "Enumerate wax and each real independently marketed output at its own handoff. Honey is a co-product only for actual bee honey. Prefer supported causal physical attribution; if unavailable, disclose period-specific economic allocation and sensitivity. Never assign wax automatic zero or whole-source burden."
    source_ids:
      - fao-beeswax
      - fao-beekeeping
  - rule_id: a_sperm
    applies_to: "lawful spermaceti source"
    rule: "Require legal chain, compatible upstream burden, real other outputs and justified treatment of pre-existing material and terminal alternative. No new capture or fictional co-product."
    source_ids:
      - un-cpc-3-notes
  - rule_id: a_state
    applies_to: "process and grades"
    rule: "Attribute actual wax states and disjoint saleable grades once. Colourant addition or purification does not make another original-wax output; waste is not marketed wax."
    source_ids:
      - fao-beeswax
  - rule_id: a_period
    applies_to: "source phases and shared services"
    rule: "Index colony/source, collection, melting, filtration, storage and packaging periods; allocate shared tanks/filters/energy and package services by observed throughput/time across actual consumers once. Record replacement/termination."
    source_ids:
      - fao-beeswax
dataset_production:
  collection_protocols:
    - protocol_id: cp_collect
      process_id: "collect"
      flow_role: "source and collected material"
      record_type: "source ledger"
      raw_fields: "source/species, legal chain, route, material mass, real outputs, event, period"
      collection_method: "source ticket and calibrated scale; Raw aggregation requirements: exclusive route; once per lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;period"
      frequency: "each lot"
      temporal_coverage: "source and collection periods"
      site_scope: "supplier and collection site"
      aggregation_rule: "per reference flow"
      quality_evidence: "tickets, calibration, legal chain; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_condition
      process_id: "condition"
      flow_role: "material, energy, conditional wash water and prepared wax"
      record_type: "separation ledger"
      raw_fields: "lot, mass in/out, method, carrier, energy, water source/input, wastewater or evaporation destination, purity, moisture"
      collection_method: "scale, meter and assay; Raw aggregation requirements: before/after and water balance by source. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;MJ"
      frequency: "each lot"
      temporal_coverage: "conditioning period"
      site_scope: "facility"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale, meter, assay; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_treat
      process_id: "treat"
      flow_role: "optional refining or colouring"
      record_type: "treatment ledger"
      raw_fields: "lot, input/output mass, added material, colour, purity, rejects"
      collection_method: "batch sheet, scale and assay; Raw aggregation requirements: once; raw bypass. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each treated lot"
      temporal_coverage: "treatment period"
      site_scope: "facility"
      aggregation_rule: "per reference flow"
      quality_evidence: "sheet and assay; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grade
      process_id: "grade"
      flow_role: "accepted, downgrade and reject"
      record_type: "grade ledger"
      raw_fields: "source, state, grade, mass, destination"
      collection_method: "grade ticket and scale; Raw aggregation requirements: disjoint grades. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "grade period"
      site_scope: "facility"
      aggregation_rule: "per reference flow"
      quality_evidence: "grade and reject tickets; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "wax, package and gate"
      record_type: "dispatch ledger"
      raw_fields: "source, state, colourant, purity, moisture, gross, tare, net, package reuse, gate"
      collection_method: "dispatch ticket and scale; Raw aggregation requirements: one net sale per lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each sale lot"
      temporal_coverage: "handover period"
      site_scope: "facility"
      aggregation_rule: "per reference flow"
      quality_evidence: "ticket and calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_residue
      process_id: "collect_condition_treat_grade"
      flow_role: "waste"
      record_type: "treatment ledger"
      raw_fields: "lot, type, mass, destination, period"
      collection_method: "scale and transfer record; Raw aggregation requirements: once per material/destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "relevant period"
      site_scope: "origin site"
      aggregation_rule: "per reference flow"
      quality_evidence: "transfer record; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: c_net
      applies_to: "sold lot"
      rule: "Net sold wax = gross mass - package tare - separately removable foreign matter; disclose retained moisture and impurity."
      inputs:
        - cp_handover
      output: "kg net sold wax"
      source_ids: []
    - id: c_balance
      applies_to: "source to handover"
      rule: "Source material plus actual additions = saleable wax, residues, measured removals and stock change within observed uncertainty. No universal wax yield."
      inputs:
        - cp_collect
        - cp_condition
        - cp_treat
        - cp_grade
        - cp_handover
        - cp_residue
      output: "kg balance residual"
      source_ids:
        - fao-beeswax
    - id: c_period
      applies_to: "source and shared service"
      rule: "Attribute source phase and each shared tank, filter, energy, storage or package use once to consuming lots/periods."
      inputs:
        - cp_collect
        - cp_condition
        - cp_treat
        - cp_handover
      output: "burden/kg wax"
      source_ids:
        - fao-beeswax
    - id: c_norm
      applies_to: "final exchange"
      rule: "Divide attributable exchange by positive net mass of the same source/state/gate lot."
      inputs:
        - cp_handover
      output: "unit/kg wax"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "each lot"
      requirement: "Prove source/species, legal status of spermaceti, state, grade, colourant, purity and gate."
      evidence: "source/legal, batch, dispatch records"
    - id: q_mass
      applies_to: "each lot"
      requirement: "Calibrate net/tare and before/after mass; assay impurity/moisture."
      evidence: "scale, assay, balance"
    - id: q_allocation
      applies_to: "source and shared service"
      requirement: "Record real output set, periods, driver and nonduplicated asset service."
      evidence: "source-output and service-period ledgers"
    - id: q_uuid
      applies_to: "final exchange"
      requirement: "Confirm exact source/state/role/gate and property/unit support before concrete exchange."
      evidence: "verified identity evidence"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference lot"
    rule: "Reject vegetable/mineral/synthetic wax, degras, articles and source-free averages; require source and sold raw/refined/coloured state."
    source_ids:
      - un-cpc-3-notes
  - rule_id: v_route
    applies_to: "source"
    rule: "Require mutually exclusive insect or lawful existing spermaceti source and upstream burden; no fictitious whale capture or non-bee honey."
    source_ids:
      - fao-beeswax
      - fao-beekeeping
  - rule_id: v_balance
    applies_to: "lot"
    rule: "Reconcile collected material, additions, prepared/treated wax, grades, rejects and net mass; investigate residual."
    source_ids:
      - fao-beeswax
  - rule_id: v_allocation
    applies_to: "source and shared services"
    rule: "Reject automatic zero/full wax burden, duplicate honey/wax or shared-asset period."
    source_ids:
      - fao-beeswax
  - rule_id: v_identity
    applies_to: "concrete exchange"
    rule: "Verify flow type, direction, source, state, gate, Mass property and unit group; beeswax-only flow cannot identify the broad reference."
    source_ids: []
published_dataset_profile:
  dataset_role: "Source-, route-, grade-, state- and gate-qualified animal-wax foreground dataset."
  downstream_use: "Candidate secondary_dataset or background_dataset only after concrete identities, review and publication."
  allowed_use: "Same-source/state wax comparison or measured state conversion."
  excluded_use: "Cross-source proxy, fictitious capture, unsupported honey, downstream articles or universal yield."
  required_metadata: "Source/species, legal chain, route, state, colourant, purity, moisture, net mass, gate, periods and real outputs."
  required_quality_disclosure: "Co-product/period attribution, balance, rejects, shared-service driver and unresolved UUIDs."
  update_trigger: "Exact platform flow verification, changed legal/source route, measured method evidence or classification."
