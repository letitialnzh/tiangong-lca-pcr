process_map:
  - id: breeder_flock
    name: "Breeder flock and egg production"
    inclusion: "conditional"
    inclusion_condition: "Only when breeding/egg supply is operated; otherwise purchased eggs or ducklings carry upstream burden."
    role: "Managed biological production across laying periods."
    quantitative_reference: "Per breeder period and hatching eggs transferred."
  - id: incubation
    name: "Egg incubation and duckling production"
    inclusion: "conditional"
    inclusion_condition: "Only when incubation is operated; otherwise purchased ducklings enter rearing."
    role: "Managed hatchery production and live duckling handover."
    quantitative_reference: "Per incubation batch and duckling output."
  - id: duck_rearing
    name: "Brooding and rearing"
    inclusion: "conditional"
    inclusion_condition: "Required for farm-gate grown duck output; absent for direct hatchery-gate duckling sale."
    role: "Managed biological production parent with conditional integrated-system delta."
    quantitative_reference: "Per rearing batch and live bird mass."
  - id: live_capture
    name: "Live capture, weighing and dispatch"
    inclusion: "required"
    inclusion_condition: "At the one selected final hatchery or farm producer gate."
    role: "Independent capture and measured final handover."
    quantitative_reference: "Per 1 kg final live duck."
