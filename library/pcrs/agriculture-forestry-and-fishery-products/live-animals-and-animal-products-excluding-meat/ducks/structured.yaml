system_boundary:
  rules:
    - rule_id: one_final_gate
      applies_to: "All routes"
      rule: "Select exactly one final hatchery or farm producer handover; internal ducklings later reared are not also final sold output."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: capture_independent
      applies_to: "Final capture"
      rule: "Separate catching, weighing and loading from biological production because this node establishes sold-live versus lost status and the final gate."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: integrated_delta
      applies_to: "Fish/rice/wetland route"
      rule: "Add changed water, feed and manure pathways plus independently transferred fish/rice only with current enterprise evidence."
      source_ids:
        - fao-duck-fish-integration
    - rule_id: period_linkage
      applies_to: "Breeder and growout"
      rule: "Link laying periods, incubation/rearing batches, replacement and retirement to their recipient outputs once."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "The integrated route shares the managed duck-production parent with ordinary rearing but changes inventory categories (field/wetland water, foraging, manure destination and possible fish/rice handover), calculation boundaries and output-attribution validation. Farm records must identify each changed category. Integrated and non-integrated batches may coexist at an enterprise, but each lot selects its evidenced route; mutually exclusive water/manure assignments cannot be stacked."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Purchased or internally supplied duck hatching eggs/ducklings or breeding stock at the first operated stage, together with feed, water and energy."
  starting_condition_role: "Biological starting input with upstream provenance."
  product_classification_scope: "CPC 3.0 02154 live ducks; eggs, meat, rice and fish remain separate products."
  recursive_input_rule: "Purchased live ducks carry predecessor burden once; internal transfers link to their producer node and are not re-imported as external duck products."
  upstream_dataset_requirement: "Attach traceable upstream datasets for purchased eggs/ducklings, feed, water, energy, bedding and other supplied products."
  disclosure: "Declare route, gate, breed/purpose, age, count, weight, period, housing/water regime, manure fate, mortality, independently sold outputs and shared/integrated boundary."
