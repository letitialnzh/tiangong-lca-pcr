allocation_rules:
  - rule_id: output_census
    applies_to: "All stages"
    rule: "Enumerate hatching eggs, sold table eggs, spent live breeders, sold ducklings, sold grown ducks and exported manure/rice/fish only when actually transferred; record each handover. Deaths and unsold manure are residues or waste, not co-products."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: allocation_precedence
    applies_to: "Multi-output nodes"
    rule: "First subdivide measured activities by output; for inseparable joint output use defensible physical causality, otherwise contemporaneous economic values with period and sensitivity disclosed. Do not apply substitution credit by default."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: period_allocation
    applies_to: "Breeder, hatchery, rearing"
    rule: "Attribute feed, assets, output and replacement/retirement events to actual periods/batches; assign cross-period burdens once by measured service or documented throughput."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: shared_assets
    applies_to: "Houses, incubators, pumps and meters"
    rule: "List each consuming node and service period; split shared service by meter or documented time/throughput, reconcile assigned shares to recorded total and prevent duplicate charges."
    source_ids:
      - fao-leap-poultry-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_breeder_inputs
      process_id: "breeder_flock"
      flow_role: "Feed, water, energy"
      record_type: "Ledgers, meter, invoice"
      raw_fields: "period; flock; feed type/stocks; water; carrier; quantity"
      collection_method: "Reconcile issues and meters to laying period"
      unit: "kg; kWh; MJ"
      frequency: "per issue/meter"
      temporal_coverage: "whole breeder period"
      site_scope: "breeder unit"
      aggregation_rule: "assign one measured share per period"
      quality_evidence: "ledger; invoice; meter"
    - protocol_id: cp_breeder_outputs
      process_id: "breeder_flock"
      flow_role: "Eggs, spent birds, losses and manure"
      record_type: "Collection/disposal ledger"
      raw_fields: "period; egg count/mass; destination; spent birds; deaths; manure mass/fate"
      collection_method: "Count/weigh lots and manure transfers/disposals"
      unit: "kg; head"
      frequency: "per lot"
      temporal_coverage: "whole breeder period"
      site_scope: "breeder unit"
      aggregation_rule: "separate product from waste by handover"
      quality_evidence: "scale; sales; disposal"
    - protocol_id: cp_breeder_manure_emissions
      process_id: "breeder_flock"
      flow_role: "Species-specific breeder manure emissions"
      record_type: "Manure, N and NH3 measurement records"
      raw_fields: "breeder period; manure; volatile solids; N; housing/storage pathway; CH4/N2O factors; independent NH3 measurement"
      collection_method: "Calculate CH4/N2O by actual breeder-manure system; report NH3 only from independent measurement or separately sourced method"
      unit: "kg substance"
      frequency: "per breeder period"
      temporal_coverage: "whole manure period"
      site_scope: "breeder unit/manure node"
      aggregation_rule: "assign each manure fraction one pathway, once"
      quality_evidence: "analysis; factor worksheet; NH3 record"
    - protocol_id: cp_incubation_batch
      process_id: "incubation"
      flow_role: "Eggs, services, ducklings, losses"
      record_type: "Batch sheet and meters"
      raw_fields: "batch; egg count/mass/origin; ducklings; losses; energy; water"
      collection_method: "Link input/output/services by batch"
      unit: "kg; head; kWh; MJ"
      frequency: "per batch"
      temporal_coverage: "full incubation"
      site_scope: "hatchery"
      aggregation_rule: "assign shared services once"
      quality_evidence: "batch sheet; scale; meter"
    - protocol_id: cp_rearing_batch
      process_id: "duck_rearing"
      flow_role: "Starting/ending birds"
      record_type: "Movement/weight ledger"
      raw_fields: "batch; age; count; starting/ending mass"
      collection_method: "Count/weigh each handover"
      unit: "kg; head"
      frequency: "per movement"
      temporal_coverage: "whole rearing period"
      site_scope: "flock"
      aggregation_rule: "reconcile bird movements"
      quality_evidence: "scale; register"
    - protocol_id: cp_rearing_inputs
      process_id: "duck_rearing"
      flow_role: "Feed, water, energy"
      record_type: "Ledger and meters"
      raw_fields: "batch; stocks; feed; water; carrier; meter"
      collection_method: "Reconcile actual consumption"
      unit: "kg; kWh; MJ"
      frequency: "per delivery/meter"
      temporal_coverage: "whole rearing period"
      site_scope: "flock and shared assets"
      aggregation_rule: "allocate shared service once"
      quality_evidence: "invoices; meter"
    - protocol_id: cp_rearing_outputs
      process_id: "duck_rearing"
      flow_role: "Co-products, manure, deaths"
      record_type: "Sales/removal records"
      raw_fields: "batch; product; mass; destination; mortality"
      collection_method: "Weigh output or waste removal"
      unit: "kg; head"
      frequency: "per movement"
      temporal_coverage: "whole rearing period"
      site_scope: "flock/integrated unit"
      aggregation_rule: "classify by actual handover"
      quality_evidence: "sales; removal ticket"
    - protocol_id: cp_manure_emissions
      process_id: "duck_rearing"
      flow_role: "Species-specific rearing emissions"
      record_type: "Manure, N and NH3 measurement records"
      raw_fields: "batch; manure; volatile solids; N; housing/storage pathway; CH4/N2O factors; independent NH3 measurement"
      collection_method: "Calculate CH4/N2O by actual rearing-manure system; report NH3 only from independent measurement or separately sourced method"
      unit: "kg substance"
      frequency: "per batch"
      temporal_coverage: "manure period"
      site_scope: "flock/manure node"
      aggregation_rule: "assign each manure fraction one pathway, once"
      quality_evidence: "analysis; factor worksheet; NH3 record"
    - protocol_id: cp_live_capture
      process_id: "live_capture"
      flow_role: "Presented/sold/lost birds"
      record_type: "Gate weighing sheet"
      raw_fields: "lot; gate; age; count; presented/sold/lost mass"
      collection_method: "Weigh/count at final gate"
      unit: "kg; head"
      frequency: "per lot"
      temporal_coverage: "capture to handover"
      site_scope: "selected gate"
      aggregation_rule: "normalize sold live kg to 1 kg"
      quality_evidence: "scale; delivery note"
  calculation_rules:
    - id: feed_consumed
      applies_to: "Breeder/rearing feed"
      rule: "Opening stock + deliveries − closing stock − returns."
      inputs:
        - stocks
        - deliveries
        - returns
      output: "kg consumed"
      source_ids:
        - mass-balance-identity
    - id: count_to_mass
      applies_to: "Live birds"
      rule: "Measured live lot kg ÷ counted living heads; no universal kg/head."
      inputs:
        - mass
        - count
      output: "observed kg/head"
      source_ids:
        - mass-balance-identity
    - id: capture_balance
      applies_to: "Final handover"
      rule: "Presented live mass = sold live mass + accounted losses, within weighing uncertainty."
      inputs:
        - scale
        - removals
      output: "kg final live and loss"
      source_ids:
        - mass-balance-identity
    - id: manure_species
      applies_to: "Breeder and rearing direct emissions"
      rule: "Calculate CH4 and N2O separately using actual manure pathway and appropriate method; flow identity is not an emission factor."
      inputs:
        - manure
        - "volatile solids"
        - N
        - pathway
        - factor
      output: "kg CH4 and N2O separately"
      source_ids:
        - ipcc-livestock-2019
    - id: nh3_observation
      applies_to: "Breeder and rearing NH3"
      rule: "Use independently measured NH3 or a separately documented compatible factor; do not derive NH3 from CH4/N2O factors."
      inputs:
        - "NH3 measurement or independent factor"
      output: "kg NH3"
      source_ids: []
    - id: shared_sum
      applies_to: "Shared assets"
      rule: "Assigned node-period quantities sum to measured total within documented meter uncertainty."
      inputs:
        - meter
        - "recipient usage"
      output: "allocated service"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Final duck lot"
      requirement: "Record duck identity, breed/purpose, age/class, live count, measured mass and exact gate."
      evidence: "dispatch and scale"
    - id: dq_route
      applies_to: "All nodes"
      requirement: "State operated stages, purchased versus internal predecessors and integrated-system status."
      evidence: "enterprise map and supplier links"
    - id: dq_completeness
      applies_to: "Inputs, losses, outputs"
      requirement: "Reconcile stocks, meters, mortality, manure and all output destinations over complete periods; disclose gaps."
      evidence: "ledgers, invoices, tickets"
    - id: dq_attribution
      applies_to: "Shared and multi-output"
      requirement: "Archive causal/economic values, service period, allocation shares and sensitivity."
      evidence: "allocation worksheet"
validation_rules:
  - rule_id: validate_gate
    applies_to: "Reference"
    rule: "Choose one producer gate and measured sold-live mass; count-based ecological-farm UUID cannot substitute for broad 1 kg reference."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_balance
    applies_to: "All nodes"
    rule: "Reconcile egg/bird/feed/capture records and internal transfers; no bird or upstream burden appears twice."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_outputs
    applies_to: "Joint outputs"
    rule: "Verify independent handover for eggs, spent birds, manure, fish or rice; otherwise retain internal, residue or waste classification."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: validate_periods
    applies_to: "Multi-period"
    rule: "Link replacement/retirement and each breeder/rearing period to recipient batches exactly once."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: validate_shared
    applies_to: "Shared infrastructure"
    rule: "List all consumers and periods; allocation shares sum to recorded service without duplication."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: validate_integrated
    applies_to: "Integrated route"
    rule: "Require actual farm evidence before changed water/feed/manure pathways or fish/rice co-products enter the model."
    source_ids:
      - fao-duck-fish-integration
published_dataset_profile:
  dataset_role: "Foreground package for one living-duck hatchery- or farm-gate lot."
  downstream_use: "Reviewed package may become secondary_dataset or background_dataset and support process/lifecyclemodel projection."
  allowed_use: "Declared live-duck route with measured mass, count, age, period, inputs, losses and co-outputs."
  excluded_use: "Duck meat/slaughter, egg reference, generic poultry, undeclared gate or universal integrated-system assumption."
  required_metadata: "Gate, location, breed/purpose, age/class, count/mass, route, period, housing/water regime, upstream links and verified concrete flow identities."
  required_quality_disclosure: "Feed/water/energy coverage, mortality, manure pathway, species-specific emissions, shared allocation, co-output treatment and unresolved evidence."
  update_trigger: "Changed route/gate, product purpose, integrated boundary, manure system, allocation method or verified flow identity."
