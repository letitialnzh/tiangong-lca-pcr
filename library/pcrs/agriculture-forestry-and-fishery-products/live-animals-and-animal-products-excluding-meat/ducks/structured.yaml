measurement_rules:
  - id: duck_live_mass
    applies_to: "Final handover"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh the live lot before producer-gate handover; exclude dead birds and packaging."
