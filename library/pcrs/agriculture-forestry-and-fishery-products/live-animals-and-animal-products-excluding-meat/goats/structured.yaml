    role: "Foreground managed biological production that preserves route, phase, intended-output, and shared-infrastructure attribution through farm-gate transfer."
    quantitative_reference: "1 kg live goat at farm gate; retain animal-head, animal-day, cohort, phase, and reporting-period records."
