normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:0478c6810807cffe0163c42a50528f7cf651664b0f8cf0ab6a1ea64eca76ef79"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6767"
      family: "system_boundary"
      span:
        start:
          offset: 6767
          line: 60
          column: 1
        end:
          offset: 10482
          line: 83
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Breeding or replacement goats admitted to the represented herd, plus purchased or transferred feed, forage, water, energy, health products, and other managed inputs entering the producing farm. |\n| starting_condition_role | The admitted herd and external management inputs start the foreground managed-biological-production responsibility; reproduction, kidding, rearing, grazing or housing, health management, milking or fibre collection when present, manure handling, selection, weighing, and transfer remain inside it. |\n| product_classification_scope | Live goats corresponding to CPC 3.0 02123. Milk, fibre, manure, skins, meat, and services remain separately classified outputs or activities. |\n| recursive_input_rule | Live goats obtained from another producer are recorded as upstream Product inputs supported by a supplier dataset; their pre-transfer production shall not be recreated recursively in the receiving farm process. |\n| upstream_dataset_requirement | Require supplier datasets for external live goats, feed and forage, health products, supplied water, energy carriers, and inbound transport where material. Select concrete flow UUIDs during foreground generation only after identity, state, provider, and destination are known. |\n| disclosure | Declare goat type, animal classes and purpose, route variant, grazing or housing regime, feed boundary, breeding and replacement treatment, milk and fibre handovers, manure pathways, shared assets and service periods, cohort or reporting period, geography, weighing point, and farm-gate handover. |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `managed_goat_boundary` | all covered routes | Include managed reproduction where present, kidding and kid rearing, grazing or housed feeding, animal health, water and energy, enteric emissions, manure routing, optional milking or fibre collection, selection or finishing, and farm-gate weighing. Exclude slaughter, carcass handling, and post-farm transport. | `fao-leap-small-ruminants-2016`; `fao-gleam` |\n| `route_delta_separation` | extensive or transhumant, mixed or agropastoral, and housed or semi-intensive routes | Identify the parent managed-biological-production activity and selected route. Preserve the route deltas in feed or browse, movement, housing and shared assets, manure routing, energy, co-product handling, calculation, and validation. Do not blend mutually exclusive routes before separate calculation. | `fao-leap-small-ruminants-2016`; `fao-ruminant-lca-2013` |\n| `phase_and_period_linkage` | breeding, gestation, kidding, rearing, lactation or fibre phases, finishing, culling, and transfer | Link inputs, assets, animal events, mortalities, intended outputs, and manure to the biological phase and reporting period that caused them. Disclose partial-cycle coverage and replacement treatment. | `fao-leap-small-ruminants-2016` |\n| `shared_asset_boundary` | housing, fencing, water systems, vehicles, handling, milking, and fibre-collection facilities used by multiple groups or periods | Identify the asset or service, every consuming node or animal group, relevant service period, allocation driver, and evidence. Count the burden once across all consumers. | `fao-leap-small-ruminants-2016` |\n| `farm_gate_handover` | reference live-goat output | End the foreground responsibility when the animal is weighed and ownership or control transfers at the producing farm gate; later loading and transport are excluded unless explicitly moved inside the declared foreground boundary. | `fao-leap-small-ruminants-2016` |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 175
              line: 8
              column: 1
            end:
              offset: 200
              line: 8
              column: 26
          text: "# Live goats at farm gate"
