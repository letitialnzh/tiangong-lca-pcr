measurement_rules:
  - id: reference_live_weight
    applies_to: "reference live goat"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure live weight immediately before transfer at the producing farm gate. Retain scale point, date, individual or lot basis, and any fasting or gut-fill convention."
  - id: count_mass_conversion
    applies_to: "births, entries, mortalities, and transfers recorded by head"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Convert count to mass only with animal-class-specific measured or sampled mean live weight; retain both count and conversion evidence."
  - id: feed_dry_matter
    applies_to: "grazed browse and forage, conserved feed, concentrates, by-products, supplements, and milk replacer"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg dry matter and kg as-fed"
    rule: "Retain as-fed amount and measured or supplier dry-matter fraction. Do not aggregate wet and dry feed records without conversion evidence."
  - id: water_separation
    applies_to: "drinking and service water"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Distinguish supplied water from rainfall and unmanaged surface water and disclose metering or estimation method."
  - id: gas_species_basis
    applies_to: "methane, nitrous oxide, and ammonia"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg CH4, kg N2O or kg N2O-N, and kg NH3 or kg NH3-N"
    rule: "Preserve the named substance and elemental or molecular basis; any conversion shall be explicit and reproducible."
  - id: inventory_reference_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual flow property"
      uuid: ""
    required_unit: "exchange unit per reference flow"
    rule: "The inventory and collection aggregation fields below express final amounts per declared reference flow. Keep all raw collection records, original denominator qualifiers, route/period strata, unit conversions and allocation requirements. For each flow, first obtain its attributable amount in its own numerator unit using the existing rules; then divide by the measured accepted reference-output quantity of the same scope and multiply by the declared reference quantity. Do not mix species, states, gates or incompatible routes; count transfers and shared burdens once. A missing, zero or untraceable accepted-output denominator is a blocking data-quality issue. Keep provisional QA ranges on their explicitly stated bases; they are not conversion factors or production defaults. Compute normalized amount = attributable amount * declared reference quantity / measured accepted reference-output quantity. Apply normalization once only; never divide an already normalized value again."
process_map:
