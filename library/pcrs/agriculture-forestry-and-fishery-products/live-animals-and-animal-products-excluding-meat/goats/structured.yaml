allocation_rules:
  - rule_id: subdivide_before_allocation
    applies_to: "separable herd groups, phases, and activities"
    rule: "Use separate records for animal classes, route variants, milking, fibre collection, manure treatment, and transfer when independently measurable before applying allocation."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: complete_intended_output_set
    applies_to: "live goats, milk, fibre, breeding or cull animals, and exported manure"
    rule: "Enumerate every independently intended output and its handover. Classify retained manure as internal, exported manure with a recipient as Product flow, and mortalities or unusable material as Waste flow."
    source_ids:
      - fao-leap-small-ruminants-2016
      - fao-leap-nutrient-flows-2018
  - rule_id: output_attribution_decision
    applies_to: "multi-output process instances"
    rule: "When subdivision does not remove joint burdens, document one PCR-specific attribution method, its output quantities and prices or other drivers, period, evidence, and sensitivity. Apply it consistently to all intended outputs."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: multi_period_attribution
    applies_to: "breeding animals, replacements, shared assets, and outputs spanning periods"
    rule: "Assign burdens to the actual service, biological, or reporting periods using recorded events and service duration. Record replacement and termination decisions and prevent carry-over burdens from appearing in two periods."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: shared_infrastructure_attribution
    applies_to: "housing, fencing, water, handling, milking, fibre, transport, and manure assets shared by groups or periods"
    rule: "Enumerate all consumers and service periods, choose and evidence a physical service driver where possible, and reconcile allocated shares to the total asset or service burden exactly once."
    source_ids:
      - fao-leap-small-ruminants-2016
dataset_production:
  collection_protocols:
    - protocol_id: cp_goat_events_weights
      process_id: "managed_goat_herd"
      flow_role: "goat entries, births, class changes, deaths, and transfers"
      record_type: "herd event register and scale record"
      raw_fields: "animal id or lot; goat type; class; sex; purpose; event; date; measured weight; scale id; origin or destination"
      collection_method: "reconcile herd register with calibrated individual or lot weighing; Raw aggregation requirements: sum measured mass by event and class; convert counts only with class-specific sampled weights. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg live weight"
      frequency: "each event and transfer"
      temporal_coverage: "complete cohort or declared reporting period"
      site_scope: "every represented herd group and farm unit"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; event ledger reconciliation; mortality destination evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_and_grazing
      process_id: "managed_goat_herd"
      flow_role: "feed, forage, browse, grazing, and transhumance"
      record_type: "purchase, ration, pasture, and movement records"
      raw_fields: "feed identity; as-fed mass; dry-matter fraction; refused mass; pasture or browse area; animal-days; route and dates"
      collection_method: "invoices and scales for purchased feed; ration logs; pasture and movement records for grazing; Raw aggregation requirements: convert each source to dry matter, assign by class and phase, then normalize to reference mass. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg as-fed; kg dry matter; ha; animal-day"
      frequency: "each delivery or ration; daily or periodic grazing record"
      temporal_coverage: "all feeding phases in the period"
      site_scope: "every represented feeding area, route, and herd group"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier analysis or sampled dry matter; stock balance; route log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_health_inputs
      process_id: "managed_goat_herd"
      flow_role: "veterinary and herd-health products"
      record_type: "medicine, vaccine, disinfection, and treatment log"
      raw_fields: "product; formulation or active ingredient; amount; unit; animal class; administration date; purpose"
      collection_method: "purchase reconciliation and treatment register; Raw aggregation requirements: retain distinct products and aggregate only identical formulation and unit. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "product-specific"
      frequency: "each purchase and administration"
      temporal_coverage: "complete reporting period"
      site_scope: "every represented herd group and farm unit"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice; batch id; treatment record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_water_energy
      process_id: "managed_goat_herd"
      flow_role: "supplied water and energy"
      record_type: "meter, invoice, fuel, and use log"
      raw_fields: "source or carrier; quantity; unit; meter period; use; animal group; shared users"
      collection_method: "meter reading, invoice, tank or fuel log, and documented estimate where necessary; Raw aggregation requirements: subtract unrelated uses; attribute shared totals to identified consumers and periods once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; m3; kWh; MJ; carrier unit"
      frequency: "meter or delivery interval"
      temporal_coverage: "complete reporting period with opening and closing readings"
      site_scope: "every represented meter, supply point, herd group, and shared user"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter id and reading; invoice; conversion factor; allocation reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_inbound_transport
      process_id: "managed_goat_herd"
      flow_role: "inbound material freight"
      record_type: "delivery and route record"
      raw_fields: "material; transported mass; origin; destination; distance; mode; load share"
      collection_method: "supplier document, dispatch record, and evidenced route distance; Raw aggregation requirements: sum mass times distance by route and mode. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "t; km; t*km"
      frequency: "each included delivery"
      temporal_coverage: "complete reporting period"
      site_scope: "every included origin-to-farm route"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice or dispatch note; distance source; load-share evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_intended_outputs
      process_id: "managed_goat_herd"
      flow_role: "milk, fibre, exported manure, and other intended outputs"
      record_type: "output measurement and handover record"
      raw_fields: "output identity; state; quantity; unit; date; recipient; moisture or dry matter where relevant; price or physical allocation driver"
      collection_method: "calibrated meter or scale linked to a recipient handover; Raw aggregation requirements: aggregate identical output state and handover; retain outputs separately before attribution. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg and output-specific quality unit"
      frequency: "each collection or transfer"
      temporal_coverage: "complete reporting period and relevant phase"
      site_scope: "every represented herd group, collection point, and recipient handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; sales or transfer record; quality or composition result; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure_pathways
      process_id: "managed_goat_herd"
      flow_role: "manure generation, deposition, storage, treatment, export, and emissions"
      record_type: "manure and nitrogen pathway record"
      raw_fields: "class and animal-days; feed intake; digestibility; excretion basis; pathway share; climate; storage duration; treatment; recovery; export; nitrogen content"
      collection_method: "herd records plus documented IPCC or country method and measured transfers; Raw aggregation requirements: reconcile pathway shares to 100 percent; calculate gases by pathway and subtract documented recovery or export consistently. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg volatile solids; kg N; kg manure; kg CH4; kg N2O; kg NH3"
      frequency: "monthly or each management change"
      temporal_coverage: "all manure generated in the reporting period"
      site_scope: "every represented herd group, deposition area, storage, treatment, and export route"
      aggregation_rule: "per reference flow"
      quality_evidence: "method tier; factor source; laboratory result where available; pathway balance; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_emission_drivers
      process_id: "managed_goat_herd"
      flow_role: "enteric methane"
      record_type: "animal, diet, and emission-method record"
      raw_fields: "class; animal-days; body weight; feed intake or gross energy; diet; digestibility; emission factor; tier"
      collection_method: "herd and feed records with documented IPCC or country method; Raw aggregation requirements: calculate per class and phase, sum period emissions, then normalize. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "animal-day; kg dry matter; MJ; kg CH4"
      frequency: "monthly or phase change"
      temporal_coverage: "every represented class and phase"
      site_scope: "every represented herd group and feeding route"
      aggregation_rule: "per reference flow"
      quality_evidence: "factor source; calculation workbook; herd and feed reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: calc_reference_live_weight
      applies_to: "reference output"
      rule: "reference mass = sum of measured eligible farm-gate live weights; normalized exchange = reference mass/reference mass"
      inputs:
        - "transfer weights"
        - eligibility
        - "handover date"
      output: "1 kg live goat reference output"
      source_ids:
        - fao-leap-small-ruminants-2016
    - id: calc_feed_dry_matter
      applies_to: "feed and forage"
      rule: "dry matter = sum(as-fed mass × measured or supplier dry-matter fraction) − documented refusal dry matter"
      inputs:
        - "feed deliveries"
        - rations
        - "dry-matter fractions"
        - refusals
      output: "kg dry matter by source and phase"
      source_ids:
        - fao-leap-small-ruminants-2016
        - ipcc-2019-livestock-manure
    - id: calc_transport_service
      applies_to: "included inbound freight"
      rule: "For a measured delivery, t*km = this consignment's delivered tonnes × its included route kilometres; do not multiply by its share of the vehicle load again. Only when starting from a documented whole-vehicle transport total may the measured consignment share be applied once to that total. Reconcile included legs and normalize the attributable service once."
      inputs:
        - "consignment delivered mass"
        - "included distance"
        - "or whole-vehicle transport total with measured consignment share"
      output: "attributable t*km by route and mode"
      source_ids:
        - fao-leap-small-ruminants-2016
    - id: calc_enteric_methane
      applies_to: "enteric methane"
      rule: "apply the documented IPCC or country method by goat class and phase using population and feed or energy drivers; sum before normalization"
      inputs:
        - animal-days
        - class
        - "feed or gross energy"
        - digestibility
        - "selected factors"
      output: "kg CH4"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: calc_manure_emissions
      applies_to: "manure CH4, N2O, and NH3"
      rule: "assign excreta to reconciled pathways; apply pathway-specific volatile-solids and nitrogen methods; subtract recovery and transferred nutrients consistently; convert molecular basis explicitly"
      inputs:
        - animal-days
        - intake
        - excretion
        - "pathway shares"
        - climate
        - duration
        - treatment
        - export
        - factors
      output: "kg CH4; kg N2O; kg NH3; pathway balance"
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrient-flows-2018
    - id: calc_multi_output_shares
      applies_to: "joint live-goat, milk, fibre, and manure outputs"
      rule: "attribution share = selected driver for one intended output/sum of the same driver for all intended outputs; shares shall sum to 1"
      inputs:
        - "complete output set"
        - quantities
        - qualities
        - "prices or physical drivers"
        - period
      output: "documented output shares"
      source_ids:
        - fao-leap-small-ruminants-2016
    - id: calc_shared_asset_shares
      applies_to: "shared infrastructure"
      rule: "asset share = evidenced service driver for one consumer-period/sum of the same driver for all consumer-periods; allocated burdens shall reconcile to the asset total"
      inputs:
        - "asset burden"
        - "consuming nodes"
        - "service periods"
        - driver
      output: "allocated shared burden by node and period"
      source_ids:
        - fao-leap-small-ruminants-2016
  data_quality_requirements:
    - id: dq_identity_gate
      applies_to: "reference product and intended outputs"
      requirement: "Preserve goat type, animal class, purpose, route, product state, property, handover, and recipient where relevant; unresolved semantic identities shall not be assigned a convenient UUID."
      evidence: "transfer and output records plus confirmed flow detail at foreground generation"
    - id: dq_temporal_completeness
      applies_to: "herd, feed, outputs, manure, and assets"
      requirement: "Cover the declared cohort or reporting period and document opening herd, entries, births, exits, mortalities, closing herd, replacements, and partial-cycle treatment."
      evidence: "reconciled herd and period balance"
    - id: dq_route_separation
      applies_to: "alternative production routes"
      requirement: "Preserve route-specific feed, movement, shelter, energy, manure, output, and infrastructure records until route results are calculated."
      evidence: "route register and separate activity totals"
    - id: dq_mass_and_output_balance
      applies_to: "animal and intended-output records"
      requirement: "Reconcile live-animal mass events and enumerate all independently intended outputs before attribution; investigate unexplained gaps."
      evidence: "herd event balance and output handover ledger"
    - id: dq_manure_balance
      applies_to: "manure and nitrogen pathways"
      requirement: "Reconcile pathway shares to 100 percent and prevent nitrogen exported in manure from also being emitted or internally applied."
      evidence: "pathway worksheet and nitrogen balance"
    - id: dq_shared_asset_reconciliation
      applies_to: "shared infrastructure"
      requirement: "Identify every consuming node and period, retain the driver and service boundary, and reconcile shares to the total burden once."
      evidence: "asset register and allocation worksheet"
    - id: dq_uncertainty_disclosure
      applies_to: "modelled and calculated values"
      requirement: "Disclose method tier, factor geography and year, estimation method, missing records, substitutions, and the effect of provisional QA ranges."
      evidence: "calculation file, factor citation, and data-quality statement"
validation_rules:
  - rule_id: validate_reference_gate
    applies_to: "reference live-goat exchange"
    rule: "Require exactly 1 kg normalized live weight, the producing-farm gate, all required qualifiers, and no slaughter or post-farm activity in the reference exchange. Reject the narrow platform candidates for broad-reference use."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_route_delta
    applies_to: "selected production route"
    rule: "Require one named parent managed-biological-production activity and evidence for every route delta in topology, inventory, calculation, data, or validation; preserve mutually exclusive route records until separate results exist."
    source_ids:
      - fao-leap-small-ruminants-2016
      - fao-ruminant-lca-2013
  - rule_id: validate_period_balance
    applies_to: "cohort and reporting periods"
    rule: "Opening herd + births + entries − deaths − transfers shall reconcile to closing herd by class, subject to documented classification changes; replacements, terminations, and carry-over burdens shall occur in one period treatment only."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_output_attribution
    applies_to: "multi-output instances"
    rule: "Require a complete intended-output list, each handover, one explicit attribution decision with evidence, shares summing to 1, and sensitivity where economic or another variable driver is used."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_residue_waste_distinction
    applies_to: "manure, mortalities, discarded milk, and fibre"
    rule: "Require intended transferred products, retained internal materials, residues, losses, and Waste flows to be distinguished by destination and evidence."
    source_ids:
      - fao-leap-small-ruminants-2016
      - fao-leap-nutrient-flows-2018
  - rule_id: validate_emission_basis
    applies_to: "CH4, N2O, and NH3"
    rule: "Require named substance, molecular or elemental basis, method tier, factor source, complete animal and manure pathway drivers, and explicit basis conversion."
    source_ids:
      - ipcc-2019-livestock-manure
      - fao-leap-nutrient-flows-2018
  - rule_id: validate_shared_infrastructure
    applies_to: "shared assets and services"
    rule: "Require two or more consumers or periods, service boundary, driver, evidence, shares reconciling to the total, and no duplicate process or period burden."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_flow_binding
    applies_to: "all final exchanges"
    rule: "unresolved cards shall resolve one compatible concrete UUID from actual foreground records; every unbound card requires exact identity confirmation. UUID selection shall not change direction, type, state, route, provider, or handover to force a match."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for live-goat managed biological production and farm-gate transfer."
  downstream_use: "May support a unit-process dataset and a linked lifecycle model; after review it may be used as a secondary or background dataset only for a matching goat type, route, gate, geography, period, and co-product treatment."
  allowed_use: "Comparative or accounting studies that preserve the declared functional unit, product boundary, route, feed and manure scope, output attribution, period treatment, and data-quality disclosure."
  excluded_use: "Direct substitution for sheep or other ruminants; goat meat, milk, fibre, skins, or services as the reference product; slaughterhouse-gate or post-farm systems; or a materially different route without adaptation."
  required_metadata: "Goat species or type; animal classes and purpose; sex where material; production route; geography; cohort and reporting period; grazing, browse, housing, feed, water, energy, health, manure, milk and fibre treatment; live-weight basis; farm-gate handover; allocation and shared-asset decisions; flow UUID evidence."
  required_quality_disclosure: "Foreground coverage, weighing evidence, feed dry-matter conversion, route separation, herd and output balance, manure pathway balance, factor tier and geography, shared-asset reconciliation, missing data, substitutions, uncertainty, and unresolved identities."
  update_trigger: "New exact broad-reference UUID; changed classification boundary; revised livestock or manure method; new source-backed range; changed flow identity verification evidence; material route evidence; or recurring validation failure."
