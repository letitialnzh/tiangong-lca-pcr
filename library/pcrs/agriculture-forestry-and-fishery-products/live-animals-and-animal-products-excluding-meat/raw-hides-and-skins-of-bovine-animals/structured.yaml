    - id: q_source
      applies_to: "all lots"
      requirement: "Trace species 0211, animal purpose and phases, actual slaughter or legal fallen recovery, grade and actual handover gate."
      evidence: "ledger and permit"
    - id: q_mass
      applies_to: "all lots"
      requirement: "Calibrated gross/tare, grade, moisture and salt balance with reported residual."
      evidence: "scale, lab and batch balance"
    - id: q_shared
      applies_to: "source and plant"
      requirement: "Record animal phases, shared consumers, service periods, replacement and termination without duplicate burdens."
      evidence: "phase and asset ledger"
    - id: q_uuid
      applies_to: "all exchange cards"
      requirement: "Verify concrete flow identity, role, state, gate and property before final data package; expand conditional flow identities only with foreground evidence."
      evidence: "resolution log"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference"
    rule: "Reject non-bovine, tanned/further-prepared, unknown state, undeclared actual gate or missing net Mass basis."
    source_ids:
