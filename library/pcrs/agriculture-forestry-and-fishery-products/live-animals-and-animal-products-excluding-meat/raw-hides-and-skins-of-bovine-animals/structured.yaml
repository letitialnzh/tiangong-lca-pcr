allocation_rules:
  - rule_id: a_animal
    applies_to: "slaughter-linked route"
    rule: "Enumerate actual intended outputs and handovers: milk in dairy phases, draught service where delivered, meat/carcass and edible offal at slaughter, hide at removal. Prefer phase subdivision and measured causal attribution; otherwise disclose evidenced physical/economic allocation across intended outputs. Neither zero hide burden nor all animal burden to one hide is default."
    source_ids:
      - fao-hides
  - rule_id: a_fallen
    applies_to: "lawful fallen recovery"
    rule: "Document carcass Product/Waste legal role, upstream burden and terminal handling; no invented slaughter meat. Attribute recovery service and source burden by explicit recorded decision."
    source_ids:
      - fao-statistics
  - rule_id: a_grade
    applies_to: "grade and preservation"
    rule: "Accepted and independently sold downgraded grades have distinct handovers. Rejects and residues are waste unless marketed. Reconcile moisture/salt changes before comparing saleable masses."
    source_ids:
      - fao-hides
  - rule_id: a_period
    applies_to: "animal phases and plant"
    rule: "Record growth, dairy, draught and terminal phases, replacement/termination, and shared flaying/cleaning/curing/packing services by consumer and service period; charge each once using measured throughput, time or other evidenced driver."
    source_ids:
      - fao-hides
dataset_production:
  collection_protocols:
    - protocol_id: cp_source
      process_id: "remove"
      flow_role: "source event and outputs"
      record_type: "animal/slaughter/recovery ledger"
      raw_fields: "species, animal ID, meat/dairy/draught phases, terminal event, legal role, output masses"
      collection_method: "supplier ledger and scale; Raw aggregation requirements: link outputs/burdens once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;period"
      frequency: "each event"
      temporal_coverage: "attributed animal service and terminal event"
      site_scope: "actual source"
      aggregation_rule: "per reference flow"
      quality_evidence: "animal ledger, permit and ticket; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "raw and prepared hide"
      record_type: "batch log"
      raw_fields: "receipt, water, cleaning, trim, prepared mass"
      collection_method: "scale and meter; Raw aggregation requirements: balance by batch. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "all batches"
      site_scope: "actual plant"
      aggregation_rule: "per reference flow"
      quality_evidence: "scales and receiving slips; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grade
      process_id: "grade"
      flow_role: "grades and rejects"
      record_type: "grade log"
      raw_fields: "incoming, accepted, downgraded, rejected, buyer/disposal"
      collection_method: "scale and grade ticket; Raw aggregation requirements: balance by grade/destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "all lots"
      site_scope: "actual plant"
      aggregation_rule: "per reference flow"
      quality_evidence: "specification and sales/disposal; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_preserve
      process_id: "preserve"
      flow_role: "state conversion"
      record_type: "cure log"
      raw_fields: "initial/final mass, moisture, salt/brine, time, energy, residue"
      collection_method: "scale, recipe, meter, test; Raw aggregation requirements: batch state balance. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;kWh"
      frequency: "each performed route"
      temporal_coverage: "preserved lots"
      site_scope: "actual plant"
      aggregation_rule: "per reference flow"
      quality_evidence: "recipe, lab and meters; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_utilities
      process_id: "prepare_preserve_handover"
      flow_role: "water, energy and shared asset"
      record_type: "meter/asset log"
      raw_fields: "carrier, amount, node, period, driver"
      collection_method: "meters and invoices; Raw aggregation requirements: allocate once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;kWh;h"
      frequency: "service period"
      temporal_coverage: "all foreground periods"
      site_scope: "actual consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration and worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "net product and package"
      record_type: "dispatch log"
      raw_fields: "source lot, state, grade, gross/tare/net, free salt/brine, package reuse, gate"
      collection_method: "scale and dispatch note; Raw aggregation requirements: sum net mass by state/grade. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "all sale lots"
      site_scope: "actual declared handover gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration and dispatch; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_residue
      process_id: "remove_prepare_grade_preserve_handover"
      flow_role: "waste and residues"
      record_type: "disposal log"
      raw_fields: "composition, mass, reason, destination"
      collection_method: "scale and handler receipt; Raw aggregation requirements: sum each destination once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "all relevant periods"
      site_scope: "actual node"
      aggregation_rule: "per reference flow"
      quality_evidence: "disposal ticket; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: c_net
      applies_to: "sold lot"
      rule: "net hide = gross mass minus package tare minus separable salt/free brine; incorporated moisture/salt remains in declared state"
      inputs:
        - cp_handover
        - cp_preserve
      output: "kg net hide"
      source_ids:
        - fao-hides
    - id: c_balance
      applies_to: "physical nodes"
      rule: "measured input plus incorporated cure = accepted plus downgrade plus rejects/residue plus measured moisture loss and inventory change; report residual"
      inputs:
        - cp_source
        - cp_prepare
        - cp_grade
        - cp_preserve
      output: "kg residual"
      source_ids:
        - fao-hides
    - id: c_state
      applies_to: "state comparison"
      rule: "dry hide solids = measured net mass × measured dry fraction, with salt solids separate; no universal state conversion"
      inputs:
        - cp_preserve
      output: "kg dry hide solids"
      source_ids:
        - fao-hides
    - id: c_attribution
      applies_to: "source/asset"
      rule: "attributable input per kg = measured input × documented output share × documented period/service share ÷ net sold hide; never apply a share twice"
      inputs:
        - cp_source
        - cp_utilities
        - cp_handover
      output: "per kg hide"
      source_ids: []
  data_quality_requirements:
    - id: q_source
      applies_to: "all lots"
      requirement: "Trace species 0211, animal purpose and phases, actual slaughter or legal fallen recovery, grade and actual handover gate."
      evidence: "ledger and permit"
    - id: q_mass
      applies_to: "all lots"
      requirement: "Calibrated gross/tare, grade, moisture and salt balance with reported residual."
      evidence: "scale, lab and batch balance"
    - id: q_shared
      applies_to: "source and plant"
      requirement: "Record animal phases, shared consumers, service periods, replacement and termination without duplicate burdens."
      evidence: "phase and asset ledger"
    - id: q_uuid
      applies_to: "all exchange cards"
      requirement: "Verify concrete flow identity, role, state, gate and property before final data package; expand conditional flow identities only with foreground evidence."
      evidence: "resolution log"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference"
    rule: "Reject non-bovine, tanned/further-prepared, unknown state, undeclared actual gate or missing net Mass basis."
    source_ids:
      - un-cpc-3
  - rule_id: v_route
    applies_to: "source"
    rule: "Slaughter branch requires actual animal-system output allocation; legal fallen branch requires recovery evidence and no fictional meat output."
    source_ids:
      - fao-statistics
      - fao-hides
  - rule_id: v_balance
    applies_to: "all lots"
    rule: "Reconcile removal, preparation, grades, preservation and final mass, with trims, salt/brine and moisture loss; investigate residual by site tolerance."
    source_ids:
      - fao-hides
  - rule_id: v_attribution
    applies_to: "animal and shared assets"
    rule: "Reject duplicated animal phases or plant service periods and missing output handovers or attribution decisions."
    source_ids:
      - fao-hides
  - rule_id: v_binding
    applies_to: "all cards"
    rule: "Resolve the broad final output to one concrete Product UUID only after actual state, gate and Mass are evidenced; no narrower plant flow can be imposed on every lot. All other concrete UUIDs and set members require independent verification before exchange generation."
    source_ids: []
published_dataset_profile:
  dataset_role: "Route-, species-, grade-, state- and actual-gate-qualified foreground dataset for raw bovine hide."
  downstream_use: "Candidate secondary_dataset or background_dataset after exchange resolution, review and publication."
  allowed_use: "Like-state and like-gate comparison or measured dry-solids conversion with disclosure."
  excluded_use: "Non-bovine/tanned hides, zero-burden hide default, universal state conversion, plant UUID reuse at other gates, downstream freight."
  required_metadata: "Species, animal purpose/phases, source route/legal status, outputs and allocation, grade, state, moisture/salt, net mass, actual gate and periods."
  required_quality_disclosure: "Animal-output and shared-service attribution, mass/grade balance, cure inputs/residues and unresolved identities."
  update_trigger: "New verified flow identity, route, gate, preservation or measured allocation evidence."
data_sources:
  - id: "un-cpc-3"
    type: "official_guidance"
    reference: "[UN CPC 3.0 explanatory notes](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "Class 0211 and 02951 raw-hide identity."
  - id: "fao-hides"
    type: "official_guidance"
    reference: "[FAO, Hides and Skins](https://www.fao.org/4/i0523e/i0523e.pdf)"
    used_for: "Flaying, first treatment, grade and preservation route."
  - id: "fao-statistics"
    type: "official_guidance"
    reference: "[FAO, hide/skin production definitions](https://www.fao.org/4/x9892e/X9892e06.htm)"
    used_for: "Slaughter and fallen-animal source distinction."
  - id: "unido-leather"
    type: "official_guidance"
    reference: "[UNIDO sustainable leather framework](https://downloads.unido.org/ot/46/70/4670793/KRAL_AGR_AIT_URT_2015_100228_001.pdf)"
    used_for: "Raw-hide versus later leather-processing boundary."
