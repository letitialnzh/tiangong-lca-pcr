  - rule_id: v_binding
    applies_to: "all cards"
    rule: "Resolve the broad final output to one concrete Product UUID only after actual state, gate and Mass are evidenced; no narrower plant flow can be imposed on every lot. All other concrete UUIDs and set members require independent verification before exchange generation."
    source_ids: []
published_dataset_profile:
  dataset_role: "Route-, species-, grade-, state- and actual-gate-qualified foreground dataset for raw bovine hide."
