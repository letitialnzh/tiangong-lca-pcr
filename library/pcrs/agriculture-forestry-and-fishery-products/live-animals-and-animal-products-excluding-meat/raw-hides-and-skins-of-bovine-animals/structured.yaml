system_boundary:
  rules:
    - rule_id: b_source
      applies_to: "animal origin"
      rule: "Trace actual meat/dairy/draught/mixed animal system and slaughter, or lawful fallen-animal recovery with no invented meat output; distinguish source periods."
      source_ids:
        - fao-hides
        - fao-statistics
    - rule_id: b_remove
      applies_to: "raw removal"
      rule: "Flaying is independent of rearing/slaughter or recovery; record raw hide, attached matter, incidental loss and first-conditioning handoff. Do not count the same flaying service embedded in an upstream slaughter dataset again."
      source_ids:
        - fao-hides
    - rule_id: b_prepare
      applies_to: "cleaning and grading"
      rule: "Include first fleshing/cleaning/trimming as performed; separate accepted, independently marketable downgraded and rejected/waste states and destinations."
      source_ids:
        - fao-hides
    - rule_id: b_preserve
      applies_to: "optional preservation"
      rule: "Include only performed chilling, drying, salting or brining, with input salt/water/energy, residual brine and moisture loss; no tanning, liming or dehairing."
      source_ids:
        - fao-hides
        - unido-leather
    - rule_id: b_gate
      applies_to: "packing and handover"
      rule: "Include protective packing and shared site services to the actual declared handover; do not invent plant operations for farm-slaughter or recovery-gate sales. Exclude later freight and tanning."
      source_ids:
        - fao-hides
