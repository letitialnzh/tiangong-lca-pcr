      - fao-hides
  - rule_id: v_balance
    applies_to: "all lots"
    rule: "Reconcile removal, preparation, grades, preservation and final mass, with trims, salt/brine and moisture loss; investigate residual by site tolerance."
    source_ids:
      - fao-hides
  - rule_id: v_attribution
    applies_to: "animal and shared assets"
    rule: "Reject duplicated animal phases or plant service periods and missing output handovers or attribution decisions."
    source_ids:
