      evidence: "supplier metadata and allocation ledger"
validation_rules:
  - rule_id: v_identity
    applies_to: "reference/output"
    rule: "Reject attached pelt, ordinary wool, coarse-only hair, textile-carded/combed fibre or species/grade/gate-free mass as reference; animal combing at harvest remains eligible."
