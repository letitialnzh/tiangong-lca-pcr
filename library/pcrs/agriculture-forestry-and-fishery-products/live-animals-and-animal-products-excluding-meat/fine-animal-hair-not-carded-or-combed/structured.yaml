allocation_rules:
  - rule_id: a_outputs
    applies_to: "fibre and other animal products"
    rule: "Subdivide animal service by actual species, animal, phase and independently sold outputs: fine hair, coarse/guard hair if marketed, milk, offspring or meat only when actually produced. Never invent slaughter co-product for fibre-only route. Prefer measured causal service allocation; if inseparable, disclose justified physical or economic allocation, price period and sensitivity. Rejects are not automatically co-products."
    source_ids:
      - fao-animal-fibre-harvesting
  - rule_id: a_grades
    applies_to: "accepted and other sold grades"
    rule: "Split grade-specific operations where recorded. For jointly graded saleable outputs assign shared burden by causal use if measured, otherwise disclose allocation and uncertainty. One lot has one output handover."
    source_ids:
      - fao-animal-fibre-processing
  - rule_id: a_period
    applies_to: "repeat harvests and animal phases"
    rule: "Carry husbandry inputs, animal replacement and stock changes through actual periods; attribute one service to relevant fibre events and other actual outputs once, never using universal animal lifetime or fibre yield."
    source_ids:
      - fao-animal-fibre-harvesting
  - rule_id: a_shared
    applies_to: "shears, combs, cleaning, graders and storage"
    rule: "Register each shared asset or utility meter, its harvest/condition/grade/present consumers and service periods; apportion by measured hours, throughput or justified proxy once."
    source_ids:
      - fao-animal-fibre-harvesting
