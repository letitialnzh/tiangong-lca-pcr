    - id: c_balance
      applies_to: "harvest through grade"
      rule: "Reconcile incoming and transferred solids with accepted, downgraded, rejected and sampled solids; use measured moisture when wet masses differ."
      inputs:
        - "mass/moisture by state"
        - rejects
        - samples
      output: "lot and dry-solids balance"
      source_ids:
