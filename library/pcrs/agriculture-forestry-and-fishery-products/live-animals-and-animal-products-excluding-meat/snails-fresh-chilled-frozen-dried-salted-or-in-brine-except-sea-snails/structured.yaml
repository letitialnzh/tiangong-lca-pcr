system_boundary:
  rules:
    - rule_id: b_route
      applies_to: "managed or wild source"
      rule: "Include managed husbandry with breeding/juvenile stock, feed and enclosure care only for managed lots. Wild gathering begins at the lawful collection context; its habitat is not modelled as a farm. Harvest/gathering remains a distinct removal and handoff from production context."
      source_ids:
        - fao-improved-snail-farming
        - fao-snail-farming-gathering
    - rule_id: b_condition
      applies_to: "collected to accepted product"
      rule: "Include first handling, with purging/cleaning and grade sorting when the actual route or intended use requires them. Separate accepted goods, independently marketable downgraded goods and rejected/waste destinations by the declared quality criterion. Shell and waste are not silently saleable product."
      source_ids:
        - fao-improved-snail-farming
    - rule_id: b_preserve
      applies_to: "optional preserved lots"
      rule: "Include chill, freeze, dry, salt or brine interventions only when actually performed before handover. Record input energy, salt/brine and water, residues, moisture loss and rejection; do not require all treatments on one lot."
      source_ids:
        - fao-improved-snail-farming
    - rule_id: b_gate
      applies_to: "all lots"
      rule: "Include protective packing and on-site handling through actual farm/first-processing handover; exclude downstream distribution, retail and cooking. Record reusable package return and shared facility services separately."
      source_ids:
        - fao-improved-snail-farming
boundary_abstraction:
  declared_starting_condition: "Managed route: identified breeding/juvenile stock and feed source; wild route: documented lawful collection area and event, without managed breeding inputs."
  starting_condition_role: "Purchased stock, feed, salt, packaging and energy cross as upstream Product inputs; land and reusable assets use documented period/service attribution."
  product_classification_scope: "Non-sea snail goods in declared fresh, chilled, frozen, dried, salted or brined sale states; no universal food-use requirement."
  recursive_input_rule: "Purchased snails of this category entering grading or preservation retain upstream burden and are not recounted as newly reared or gathered output."
  upstream_dataset_requirement: "Require traceable upstream datasets for purchased juvenile stock/feed, salt, utility, packaging and equipment where included; no zero-burden purchased snail input."
  disclosure: "Declare species, route legality, state, gate, lot and period, rejected destinations, asset ownership and all preservation choices."
