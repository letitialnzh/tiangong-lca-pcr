allocation_rules:
  - rule_id: a_mass
    applies_to: "all route nodes"
    rule: "Reconcile lot inputs, accepted grade, downgraded grade, rejects, moisture change, separated shell and free brine by measured mass. A real separately sold grade or shell requires documented revenue and physical quantities; disclose any allocation basis, do not assign a universal split."
    source_ids:
      - fao-improved-snail-farming
  - rule_id: a_period
    applies_to: "managed cohorts and reusable assets"
    rule: "Link juvenile stock, feed, enclosure maintenance and breeding-stock replacement to actual cohorts and reporting periods. Record opening/closing biological stock and termination; allocate burdens to output periods without reusing the same input in another period."
    source_ids:
      - fao-improved-snail-farming
  - rule_id: a_shared
    applies_to: "enclosures, preparation, cold rooms and package reuse"
    rule: "Record the asset/service, consuming nodes and service periods; use measured occupancy, throughput, metered consumption or another evidenced causal driver and charge each service once. Wild routes omit non-consumed farm assets."
    source_ids:
      - fao-improved-snail-farming
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_rearing
      process_id: "rear"
      flow_role: "cohort stock, feed and output"
      record_type: "husbandry log"
      raw_fields: "species, cohort, stock receipts, feed issue/leftover, mortality, ready mass, dates"
      collection_method: "log plus calibrated scale; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "item;kg"
      frequency: "each event"
      temporal_coverage: "full managed cohort and period"
      site_scope: "actual enclosure"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier records, stock book, scale calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_harvest
      process_id: "gather"
      flow_role: "source and raw lot"
      record_type: "collection log"
      raw_fields: "route, lawful site/permit, cohort or event, raw mass, incidental material, dates"
      collection_method: "lot scale and collection record; Raw aggregation requirements: sum raw lots without dual attribution. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "full gathering event"
      site_scope: "actual farm or wild site"
      aggregation_rule: "per reference flow"
      quality_evidence: "collection ticket, permit, scale record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_preparation
      process_id: "prepare"
      flow_role: "purge, wash and grades"
      record_type: "batch log"
      raw_fields: "incoming mass, water, accepted, downgraded, rejects, shell, destination"
      collection_method: "meter, scale, grade log; Raw aggregation requirements: mass-balance per lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "every preparation batch"
      site_scope: "first-processing site"
      aggregation_rule: "per reference flow"
      quality_evidence: "grade specification, scale and meter records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_preservation
      process_id: "preserve"
      flow_role: "route and state conversion"
      record_type: "recipe and batch log"
      raw_fields: "initial/final mass, temperature/time, moisture, salt, brine, rejects, energy"
      collection_method: "scale, meter, recipe, lab result; Raw aggregation requirements: state-specific batch balance. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;kWh"
      frequency: "each performed intervention"
      temporal_coverage: "all preserved lots"
      site_scope: "actual plant"
      aggregation_rule: "per reference flow"
      quality_evidence: "recipe, moisture test, energy bill; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_utilities
      process_id: "rear_gather_prepare_preserve"
      flow_role: "water and energy"
      record_type: "meter or fuel record"
      raw_fields: "meter start/end, carrier, node, period, shared driver"
      collection_method: "meter and invoice reconciliation; Raw aggregation requirements: allocate once by measured driver. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;kWh;MJ"
      frequency: "per meter period"
      temporal_coverage: "full cohort or service period"
      site_scope: "consuming nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, bills, allocation worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_handover
      process_id: "pack"
      flow_role: "packing and final lot"
      record_type: "dispatch record"
      raw_fields: "incoming state, net mass, package tare/reuse, gate, customer handover"
      collection_method: "calibrated scale and dispatch ticket; Raw aggregation requirements: sum net accepted sale mass by state. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "all accepted sale lots"
      site_scope: "actual handover site"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing ticket and lot trace; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_residues
      process_id: "rear_gather_prepare_preserve_pack"
      flow_role: "wastes and loss"
      record_type: "disposal and balance log"
      raw_fields: "composition, mass, destination, reason, period"
      collection_method: "weigh and disposal receipt; Raw aggregation requirements: sum each segregated destination once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "all foreground periods"
      site_scope: "actual node"
      aggregation_rule: "per reference flow"
      quality_evidence: "receipts and mass-balance record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "rear"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
  calculation_rules:
    - id: c_net
      applies_to: "final lot"
      rule: "net snail mass = gross delivered mass minus package tare minus separately reported free brine; retain product-incorporated salt and moisture in as-sold mass"
      inputs:
        - cp_handover
        - cp_preservation
      output: "kg net product"
      source_ids:
        - fao-improved-snail-farming
    - id: c_balance
      applies_to: "prepare and preserve"
      rule: "incoming measured mass plus incorporated water/salt = accepted plus downgraded plus rejects plus measured loss and change in stock; report unexplained residual"
      inputs:
        - cp_preparation
        - cp_preservation
        - cp_residues
      output: "kg balance residual"
      source_ids:
        - fao-improved-snail-farming
    - id: c_dry
      applies_to: "state comparison"
      rule: "dry snail solids = measured snail mass times (1 minus measured moisture fraction), after identifying salt solids separately; no universal fresh/dried conversion"
      inputs:
        - cp_preservation
      output: "kg dry snail solids"
      source_ids:
        - fao-improved-snail-farming
    - id: c_unit
      applies_to: "all inputs"
      rule: "normalized input = attributable measured input divided by net accepted mass in same state and lot cohort; zero denominators fail"
      inputs:
        - cp_rearing
        - cp_harvest
        - cp_utilities
        - cp_handover
      output: "input per kg reference"
      source_ids: []
    - id: calc_feed_supply_and_intake
      applies_to: "rear_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
  data_quality_requirements:
    - id: q_identity
      applies_to: "all lots"
      requirement: "Species, non-sea identity, managed/wild origin, legality, intended use, applicable quality criterion, whole/shelled form and actual sale state must be traceable. Food-safety evidence is required when sold for human food."
      evidence: "supplier, collection and batch records"
    - id: q_mass
      applies_to: "all nodes"
      requirement: "Calibrated gross/tare weighing and a reported balance residual; distinguish shell, package and free brine."
      evidence: "calibration and batch balance"
    - id: q_time
      applies_to: "managed/shared nodes"
      requirement: "Cohort, asset/service periods and replacement events linked; no duplicated shared burden."
      evidence: "period ledger and allocation worksheet"
    - id: q_gap
      applies_to: "unresolved identities"
      requirement: "Concrete flow UUIDs and actual carrier/packaging/waste identities require foreground confirmation before dataset exchange generation."
      evidence: "identity-resolution log"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference lot"
    rule: "Fail if species is sea snail, route or intended use is unrecorded, the listed sale state is absent, or actual handover gate is missing. Apply food-safety checks only to human-food lots."
    source_ids:
      - un-cpc-3-notes
  - rule_id: v_route
    applies_to: "process map"
    rule: "Managed lots require rearing plus harvest; lawful wild lots require harvest with no artificial rearing node. Reconcile input source, prepared grades and one state-specific preservation branch if used."
    source_ids:
      - fao-improved-snail-farming
      - fao-snail-farming-gathering
  - rule_id: v_balance
    applies_to: "every batch"
    rule: "Require nonnegative measured net product, explicit rejects and moisture/brine balance; investigate residual beyond site measurement tolerance instead of imposing a universal yield."
    source_ids:
      - fao-improved-snail-farming
  - rule_id: v_attribution
    applies_to: "periods and shared assets"
    rule: "Reject duplicated cohort inputs or shared enclosure, washing, cold-room or packaging burdens; record drivers, periods and consuming nodes."
    source_ids:
      - fao-improved-snail-farming
  - rule_id: v_uuid
    applies_to: "all exchanges"
    rule: "Do not release a concrete flow exchange from unresolved semantic cards; verify product state, gate, property and unit before final dataset use."
    source_ids: []
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
published_dataset_profile:
  dataset_role: "State-, intended-use- and route-qualified foreground product dataset for non-sea snail goods."
  downstream_use: "Candidate secondary_dataset or background_dataset after concrete exchange identities, review and publication."
  allowed_use: "Compare lots with same species/presentation/state/gate, or normalize by measured dry solids with explicit assumptions."
  excluded_use: "Sea snails; goods beyond the listed sale states; generic fresh-to-dried substitution; post-gate retail, cooking or unsupported UUID binding."
  required_metadata: "Species, route legality, intended use and applicable quality criterion, cohort/event, whole/shelled, sold state, net mass, moisture/free brine, gate, site and periods."
  required_quality_disclosure: "Mass balance, grades/rejects, foreground measurement coverage, preservation recipe, shared-asset allocation and unresolved identities."
