  what: "Accepted non-sea snail goods in one declared sold state and intended use at the actual handover gate."
  how_much: "1 kg net snail product as sold, excluding packaging and separately reported free brine."
  how_well: "Species, lawful source, whole/shelled presentation, intended use, applicable grade/quality criterion, condition/rejection, moisture/brine, and food-safety status when used as food declared."
