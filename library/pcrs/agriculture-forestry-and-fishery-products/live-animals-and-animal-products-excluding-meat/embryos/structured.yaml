  classification_refs: "CPC 3.0 02420"
  covered_products: "Quality-accepted viable animal embryos produced in vivo or in vitro."
  excluded_products: "Insect immature stages; unfertilised oocytes; semen; non-viable rejects; transfer and recipient services."
  representative_product: "One viable graded embryo protected for release at the laboratory gate."
  production_route: "Managed donor period → independent embryo collection or oocyte retrieval → first laboratory preparation, including fertilisation/culture only for in-vitro route → grading → optional preservation → protective release."
  market_state: "Fresh, chilled or frozen; species, route, grade, container and gate disclosed."
functional_unit:
  what: "One quality-accepted viable animal embryo for breeding at laboratory release."
  how_much: "1 released embryo; reconcile all recovered/retrieved, prepared, graded, preserved and rejected items."
  how_well: "Declared species, donor, in-vivo/in-vitro route, developmental stage, viability grade, sanitary treatment and preservation state."
  how_long_or_cycle: "One recovery-to-release lot; attribute donor and shared laboratory/storage burdens over actual service periods."
  reference_flow_link: "viable_embryo"
system_boundary:
  rules:
    - rule_id: gate
      applies_to: "all routes"
      rule: "End at quality release in a protected container at the collection/production laboratory; exclude recipient management, transfer, pregnancy and onward distribution."
      source_ids:
        - un-cpc-3
        - woah-invivo-2024
        - woah-invitro-2024
    - rule_id: route_delta
      applies_to: "managed donor and laboratory"
      rule: "In-vivo recovery yields already fertilised embryos; in-vitro retrieval yields oocytes, then requires semen, fertilisation and culture. The routes differ in topology, media, energy, yield and testing; use one route per lot or partition a mixed facility."
      source_ids:
        - woah-invivo-2024
        - woah-invitro-2024
    - rule_id: interfaces
      applies_to: "biological production through grading"
      rule: "Record donor management separately from recovery/retrieval, raw material separately from first washing/culture, then accepted, independently downgraded, held and rejected states with handoffs."
      source_ids:
        - woah-invivo-2024
        - woah-invitro-2024
    - rule_id: state
      applies_to: "optional preservation"
      rule: "Fresh lots bypass preservation; chilled/frozen lots record actual utilities, cryogen, losses and time. Package usable product separately and exclude post-gate logistics."
      source_ids:
        - woah-invivo-2024
        - woah-invitro-2024
    - rule_id: shared
      applies_to: "facilities and periods"
      rule: "Record donor phases, collection room, laboratory, incubator, refrigerator/tank and reusable container consumers and service periods once."
      source_ids:
        - woah-invivo-2024
        - woah-invitro-2024
boundary_abstraction:
  declared_starting_condition: "Identified managed donor entering a reproductive service period, with purchased semen where actually used and upstream feed, media, energy, cryogen and packaging."
  starting_condition_role: "Managed donor production and embryo-goods preparation, not recipient pregnancy or transfer service."
  product_classification_scope: "CPC 3.0 02420, viable animal embryos only."
  recursive_input_rule: "Purchased embryos of the same category remain traced upstream goods and are never counted as newly produced on site."
  upstream_dataset_requirement: "Species- and route-compatible feed, semen, media, utilities, treatment and capital-service datasets when actually used."
  disclosure: "Donor, period, route, grade, preservation, gate, rejects, shared assets and attribution."
