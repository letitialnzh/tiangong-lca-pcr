allocation_rules:
  - rule_id: subdivide
    applies_to: "all lots"
    rule: "Subdivide by species, donor, in-vivo/in-vitro route, final state and grade before any residual allocation; include failed attempts."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: destinations
    applies_to: "graded output"
    rule: "Accepted reference-grade embryos, independently sold downgraded embryos, held states and treatment rejects require distinct actual handoffs."
    source_ids:
      - woah-invivo-2024
      - woah-invitro-2024
  - rule_id: periods
    applies_to: "donor and laboratory"
    rule: "Attribute feed, donor events, collection, culture, storage and replacement/cull to observed service periods and lot outputs once; do not double-allocate across years."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: assets
    applies_to: "shared facilities"
    rule: "Assign measured service hours/occupancy of rooms, incubators, tanks and reusable containers to all consuming nodes and periods once; disclose residual physical/economic split and sensitivity."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: allocation_method_basis
    applies_to: "Residual joint burdens and shared service"
    rule: "Apply the general LCA hierarchy: examine subdivision or an appropriately justified system expansion before residual allocation; then prefer a supported physical causal relationship, and justify an economic basis when physical attribution is not established. The donor-day, occupancy or throughput driver is a PCR modelling choice requiring case-specific evidence and sensitivity, not a requirement of sanitary guidance. Include failed attempts and losses in the service period; do not select only successful outputs or introduce hypothetical substitution credits."
    source_ids:
      - review-fao-pig-lca-2018
dataset_production:
  collection_protocols:
    - protocol_id: cp_donor
      process_id: "donor"
      flow_role: "feed, water, manure, donor service"
      record_type: "husbandry ledger"
      raw_fields: "donor_id, species, period, donor_days, feed_DM, water_kg, manure_kg, replacement, room_hours"
      collection_method: "weigh, meter, event log; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "day, kg, h"
      frequency: "daily/event"
      temporal_coverage: "full linked donor period"
      site_scope: "all donors"
      aggregation_rule: "per reference flow"
      quality_evidence: "dated signed ledger; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_recovery
      process_id: "recovery"
      flow_role: "medium and raw embryo/oocyte"
      record_type: "event register"
      raw_fields: "event_id, donor_id, route, medium_kg, raw_embryo_count, oocyte_count, losses, room_hours"
      collection_method: "issue sheet, count, weigh; Raw aggregation requirements: reconcile each event. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, item, h"
      frequency: "event"
      temporal_coverage: "all attempts"
      site_scope: "collection unit"
      aggregation_rule: "per reference flow"
      quality_evidence: "chain of custody; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_lab
      process_id: "preparation"
      flow_role: "media, semen, prepared embryos, spent media"
      record_type: "laboratory batch log"
      raw_fields: "lot_id, route, media_kg, semen_lot, dose_count, retrieved_count, fertilised_count, prepared_count, waste_kg, incubator_hours"
      collection_method: "issue and assay log; Raw aggregation requirements: route-specific balance. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, dose, item, h"
      frequency: "lot"
      temporal_coverage: "all batches"
      site_scope: "laboratory"
      aggregation_rule: "per reference flow"
      quality_evidence: "assay and lot record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grade
      process_id: "grading"
      flow_role: "accepted, downgraded, held, rejected"
      record_type: "grade register"
      raw_fields: "lot_id, stage, grade, accepted, downgraded, held, rejected, destination"
      collection_method: "qualified examination; Raw aggregation requirements: reconcile all destinations. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "item"
      frequency: "lot"
      temporal_coverage: "all assessed material"
      site_scope: "laboratory"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed grade sheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_preserve
      process_id: "preservation"
      flow_role: "energy, nitrogen, stable count, rejects"
      record_type: "cold-chain log"
      raw_fields: "lot_id, state, kWh, nitrogen_kg, storage_days, tank_hours, pre_count, accepted, rejected"
      collection_method: "meter, stock balance, logger; Raw aggregation requirements: route-specific count and occupancy. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kWh, kg, day, item"
      frequency: "lot/day"
      temporal_coverage: "full intervention and storage"
      site_scope: "cold room/tank"
      aggregation_rule: "per reference flow"
      quality_evidence: "logger and QC; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "container and released embryo"
      record_type: "release ledger"
      raw_fields: "lot_id, route, stage, grade, state, new_package_kg, reuse_cycles, released, gate_time"
      collection_method: "issue count and QA sign-off; Raw aggregation requirements: count signed releases. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, embryo"
      frequency: "lot"
      temporal_coverage: "every handover"
      site_scope: "laboratory gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "label and signed receipt; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_pathway_emissions
      process_id: "donor"
      flow_role: "pathway-specific gases and manure N/C"
      record_type: "herd, feed, manure, field and method ledger"
      raw_fields: "species/class; animal-days; intake/DM/digestibility; volatile solids; manure N/TAN; system shares; climate; storage time; fertiliser N; grazing; volatilisation/leaching; methane recovery; factor source/unit; final accepted output ; collected manure wet mass; dry matter; destination"
      collection_method: "collect primary activity by node and period, document parameter applicability, retain each pathway worksheet and any linked treatment/pasture dataset  Retain raw totals and normalize attributed quantities once to the measured accepted final reference output."
      unit: "animal-day; kg DM; kg VS; kg N; kg CH4; kg N2O; kg NH3"
      frequency: "each operating period and management change"
      temporal_coverage: "complete represented cohort and service period"
      site_scope: "actual operated nodes only"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter/analysis records, nitrogen cascade, method and factor evidence, no-duplication ledger"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "donor"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "donor"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: count_balance
      applies_to: "recovery through release"
      rule: "Reconcile route-specific raw embryo or oocyte, prepared, graded, downgraded, held, rejected, preserved and released counts; retain failed events."
      inputs:
        - cp_recovery
        - cp_lab
        - cp_grade
        - cp_preserve
        - cp_release
      output: "lot-level count balance"
      source_ids:
        - woah-invivo-2024
        - woah-invitro-2024
    - id: donor_intensity
      applies_to: "donor service"
      rule: "Divide attributable same-period donor burden by linked released embryos after real independent-output treatment."
      inputs:
        - cp_donor
        - cp_recovery
        - cp_release
      output: "donor burden per embryo"
      source_ids:
        - woah-invivo-2024
        - woah-invitro-2024
    - id: route_intensity
      applies_to: "laboratory and preservation"
      rule: "Divide actual route/state media, semen, energy, cryogen and storage burden by same-route/state accepted count, retaining zero-output lots."
      inputs:
        - cp_lab
        - cp_preserve
        - cp_release
      output: "route inventory per embryo"
      source_ids:
        - woah-invivo-2024
        - woah-invitro-2024
    - id: shared_service
      applies_to: "shared infrastructure"
      rule: "Assign each asset's observed service over all consuming nodes and periods once; reconciled shares equal total service."
      inputs:
        - cp_donor
        - cp_recovery
        - cp_lab
        - cp_preserve
        - cp_release
      output: "unique attributed service burden"
      source_ids:
        - woah-invivo-2024
        - woah-invitro-2024
    - id: calc_pathway_emissions
      applies_to: "donor"
      rule: "Use species- and management-compatible methods and retain disaggregated pathway totals. Convert N2O-N to N2O by 44/28 and NH3-N to NH3 by 17/14 exactly once; already molecular masses are not reconverted. Check methane against the documented available-carbon/methane-potential balance and nitrogen losses against each stage's available N. Indirect formation from previously volatilised N is a downstream transformation, not a second source-stage N loss. Attribute and normalize once; do not duplicate linked treatment or fate-model emissions.  Use matched raw-period quantities before allocation for physical screens: CH4 mass × 12/16 must not exceed the carbon available to the represented pathway; source-stage NH3 mass × 14/17 plus direct N2O mass × 28/44 and other source N losses must not exceed that stage's available N, after accounting for stocks and transfers. Bound each indirect N2O-N calculation by its documented volatilised or leached N precursor, not by subtracting that downstream transformation again from the source ledger. These are conservation checks, not emission factors or an empirical per-product range."
      inputs:
        - cp_pathway_emissions
      output: "kg named compound per final reference flow"
      source_ids:
        - review-ipcc-livestock-2019
        - review-eea-manure-2023
        - review-ipcc-soils-2019
    - id: calc_feed_supply_and_intake
      applies_to: "donor_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - review-fao-pig-lca-2018
    - id: calc_manure_n2o_coverage
      applies_to: "review_donor_direct_n2o; review_donor_indirect_n2o"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - review-ipcc-livestock-2019
        - review-ipcc-soils-2019
  data_quality_requirements:
    - id: identity
      applies_to: "released product"
      requirement: "Preserve species, donor, route, developmental stage, grade, state, container and gate."
      evidence: "grade sheet and signed release"
    - id: completeness
      applies_to: "all attempts"
      requirement: "Include failed retrieval/culture, samples, downgrade, rejection, utilities and packaging."
      evidence: "reconciled event and lot registers"
    - id: temporal
      applies_to: "donor and assets"
      requirement: "Link service, replacement, room/incubator/tank use and released embryos to observed periods."
      evidence: "dated husbandry and asset logs"
    - id: comparability
      applies_to: "route and state"
      requirement: "Retain separate in-vivo/in-vitro and fresh/chilled/frozen denominators; no universal success factor."
      evidence: "route-specific release criteria and ledger"
validation_rules:
  - rule_id: reference
    applies_to: "final product"
    rule: "Require viable animal embryo, species, route, stage, grade, state and signed release; an anatomical structure cannot substitute for the product flow."
    source_ids:
      - un-cpc-3
      - woah-invivo-2024
      - woah-invitro-2024
  - rule_id: route
    applies_to: "each lot"
    rule: "Resolve one in-vivo or in-vitro path and only actual fertilisation/culture, preservation and trade controls."
    source_ids:
      - woah-invivo-2024
      - woah-invitro-2024
  - rule_id: balance
    applies_to: "every interface"
    rule: "Reconcile raw, prepared, graded, downgraded, preserved, rejected and released counts plus media and packages."
    source_ids:
      - woah-invivo-2024
      - woah-invitro-2024
  - rule_id: attribution
    applies_to: "periods/assets"
    rule: "Verify donor and failed-event periods, every shared consumer, unique burden ownership and independent lower-grade handover."
    source_ids:
      - woah-invivo-2024
      - woah-invitro-2024
  - rule_id: v_pathway_emission_coverage
    applies_to: "donor"
    rule: "Require a pathway coverage ledger for enteric CH4 where biologically applicable, manure CH4, direct/indirect N2O, NH3 and relevant field emissions. Every pathway needs a measured/calculated value, a named linked process with matching coverage, or supported inapplicability; absent data cannot become zero. Keep wild life before capture outside managed husbandry, assess actual managed holding separately, and retain species-specific evidence."
    source_ids:
      - review-ipcc-livestock-2019
      - review-ipcc-soils-2019
      - review-eea-manure-2023
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - review-ipcc-livestock-2019
      - review-ipcc-soils-2019
published_dataset_profile:
  dataset_role: "Foreground breeding-embryo production package, not recipient-transfer service."
  downstream_use: "secondary_dataset; background_dataset only with verified concrete identities and representativeness."
  allowed_use: "Species-, route-, stage-, quality-, state- and gate-matched embryo assessment."
  excluded_use: "Insect immature stages, oocytes, semen, embryo transfer, pregnancy and unmatched routes."
  required_metadata: "CPC reference, donor, periods, route, stage, grade, all counts, state, gate and allocation."
  required_quality_disclosure: "Missing UUIDs, failed-lot coverage, route yield, assays, media/cryogen metering, shared-asset attribution and gaps."
  update_trigger: "Exact reference-flow identity, species/route method change or stronger quantitative evidence."
data_sources:
  - id: "un-cpc-3"
    type: "standard"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Embryo product identity and insect exclusion"
  - id: "woah-invivo-2024"
    type: "standard"
    reference: "https://www.woah.org/fileadmin/Home/eng/Health_standards/tahc/2023/chapitre_coll_embryo_equid.pdf"
    used_for: "In-vivo collection, washing, grading, storage and traceability"
  - id: "woah-invitro-2024"
    type: "standard"
    reference: "https://www.woah.org/fileadmin/Home/eng/Health_standards/tahc/2023/chapitre_coll_embryo_invitro.pdf"
    used_for: "Oocyte retrieval, in-vitro laboratory route and traceability"
  - id: "review-fao-pig-lca-2018"
    type: "official_guidance"
    reference: "[FAO 2018, Environmental performance of pig supply chains: Guidelines for assessment, section 11.2.2 and Appendix 2.13](https://www.fao.org/4/i8686en/I8686EN.pdf)"
    used_for: "Feed-loss accounting and general LCA allocation hierarchy; extension to other taxa or reproductive products is this PCR's explicit methodological choice, not a pig parameter transfer"
  - id: "review-ipcc-livestock-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 10: Emissions from Livestock and Manure Management](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf)"
    used_for: "Species and pathway applicability; CH4 and N2O method selection, not universal emission factors"
  - id: "review-eea-manure-2023"
    type: "official_guidance"
    reference: "[EMEP/EEA Air Pollutant Emission Inventory Guidebook 2023, 3.B Manure Management](https://www.eea.europa.eu/en/analysis/publications/emep-eea-guidebook-2023/part-b-sectoral-guidance-chapters/3-agriculture/3-b-manure-management-2023)"
    used_for: "NH3 nitrogen-flow method; verify actual species, management and geographical applicability before adopting parameters"
  - id: "review-ipcc-soils-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 11: N2O Emissions from Managed Soils](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf)"
    used_for: "Managed-soil direct and indirect nitrogen pathways and boundary reconciliation"
