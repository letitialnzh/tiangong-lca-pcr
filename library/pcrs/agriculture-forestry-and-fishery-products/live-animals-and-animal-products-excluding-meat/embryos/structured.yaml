process_map:
  - id: donor
    name: "Managed donor service"
    inclusion: "required"
    inclusion_condition: "observed reproductive period"
    role: "Husbandry inputs, residues and donor handoff"
    quantitative_reference: "donor-days per linked released embryo"
  - id: recovery
    name: "Embryo collection or oocyte retrieval"
    inclusion: "required"
    inclusion_condition: "one route per lot"
    role: "Independent removal of intended raw material from donor context"
    quantitative_reference: "recovered embryo or oocyte count"
  - id: preparation
    name: "First preparation or in-vitro production"
    inclusion: "required"
    inclusion_condition: "route-specific steps"
    role: "Raw-to-prepared embryo handoff, with in-vitro fertilisation/culture only when selected"
    quantitative_reference: "prepared embryo count"
  - id: grading
    name: "Grade and destination sorting"
    inclusion: "required"
    inclusion_condition: "every prepared lot"
    role: "Accepted, downgraded, held and rejected states"
    quantitative_reference: "count by grade and destination"
  - id: preservation
    name: "Optional stabilization"
    inclusion: "conditional"
    inclusion_condition: "actual chilling/freezing"
    role: "Usable pre/post state, utilities and losses"
    quantitative_reference: "post-preservation accepted count"
  - id: release
    name: "Protective packing and laboratory release"
    inclusion: "required"
    inclusion_condition: "every saleable lot"
    role: "Final quality-accepted product and container handoff"
    quantitative_reference: "1 released embryo"
