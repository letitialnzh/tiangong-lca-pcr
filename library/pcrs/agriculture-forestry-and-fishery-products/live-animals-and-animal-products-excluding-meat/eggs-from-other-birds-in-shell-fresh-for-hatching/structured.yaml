    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
  calculation_rules:
    - id: count_to_mass
      applies_to: "egg lots"
      rule: "If individual mass is unavailable, sampled shell-on kg divided by sample count gives lot mean mass; multiply by full lot count. Keep species, grade and sample size."
      inputs:
        - "sample kg"
        - "sample count"
        - "full count"
      output: "shell-on kg of actual lot"
      source_ids:
        - fao-goose-production
    - id: egg_balance
      applies_to: "collection through handover"
      rule: "Opening stock + laid/collected input = accepted output + independently downgraded + waste + closing stock, with internal transfers counted once."
      inputs:
        - "mass/count by lot and state"
      output: "mass-balance residual"
      source_ids:
        - fao-goose-production
    - id: reference_normalization
      applies_to: "all cards"
      rule: "Divide attributed foreground amount by measured accepted kg at declared gate; retain independent output handovers."
      inputs:
        - "attributed amount"
        - "accepted kg"
      output: "amount per kg reference"
      source_ids:
        - fao-goose-production
  data_quality_requirements:
    - id: species_identity
      applies_to: "all lots"
      requirement: "Trace species/strain, flock and hatching-use acceptance; do not combine species in an undisclosed reference."
      evidence: "flock and grade records"
    - id: mass_count_quality
      applies_to: "eggs"
      requirement: "Retain count, kg, weighing calibration and lot conversion, with no universal egg-mass factor."
      evidence: "scale checks and lot sheets"
    - id: time_quality
      applies_to: "flock and hold"
      requirement: "Identify production, collection, grading and holding times/conditions and disclose gaps."
      evidence: "dated farm and store logs"
    - id: output_completeness
      applies_to: "multi-output nodes"
      requirement: "Record accepted, downgrade, sold birds/manure and waste destinations, including zero cases."
      evidence: "invoices and rejection logs"
validation_rules:
  - rule_id: validate_identity
    applies_to: "final product"
    rule: "Reject hen, non-hatching, shell-less, post-incubation or hatchling flow as this reference; require species, fresh shell state, hatching use and actual gate."
    source_ids:
      - fao-goose-production
  - rule_id: validate_balance
    applies_to: "all egg nodes"
    rule: "Reconcile count and mass through laid, collected, selected, downgraded, rejected and handed-over states with stock/loss; reject unexplained duplicate outputs."
    source_ids:
      - fao-goose-production
  - rule_id: validate_route
    applies_to: "alternatives"
    rule: "Require managed parent, real inventory/measurement/validation delta and separately measured cohort; a route label alone is insufficient."
    source_ids:
      - fao-animal-genetic-resources
  - rule_id: validate_attribution
    applies_to: "outputs, periods and assets"
    rule: "Require handovers, causal allocation driver, consumers and service periods; reject duplicate shared or multi-period burden."
    source_ids:
      - fao-animal-genetic-resources
  - rule_id: validate_binding
    applies_to: "exchange projection"
    rule: "Resolve each unresolved/unresolved card to a single verified state, gate, property and destination UUID before exchange publication."
    source_ids:
      - fao-goose-production
published_dataset_profile:
  dataset_role: "Foreground production package for fresh non-hen shell-on hatching eggs at declared producer gate."
  downstream_use: "May inform secondary_dataset or background_dataset process and lifecycle-model projections only after concrete identity review."
  allowed_use: "Species-, lot-, gate- and period-qualified shell-on kg results with hatching-selection evidence."
  excluded_use: "Inferring hatchlings or hatchability from kg; substituting hen/table eggs; counting hatchery incubation or distribution as farm production."
  required_metadata: "CPC reference, species/strain, cohort, count/kg, grade, tests, gate, storage, outputs, allocation, carriers and packages."
  required_quality_disclosure: "Untested fertility, uncertain count-mass bridge, mixed routes, storage gaps, rejects and unresolved UUIDs."
  update_trigger: "New species route, gate/state, acceptance criterion, measured loss, co-product treatment, identity or evidence basis."
