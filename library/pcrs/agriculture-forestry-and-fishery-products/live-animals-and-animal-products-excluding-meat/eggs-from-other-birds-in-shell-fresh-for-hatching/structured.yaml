allocation_rules:
  - rule_id: output_partition
    applies_to: "breeder flock and grading"
    rule: "Enumerate separately handed-over hatching eggs, safely marketed non-hatching eggs, spent breeders and sold manure. Internal states and waste are not co-products. Record each actual gate, mass and period."
    source_ids:
      - fao-goose-production
  - rule_id: causal_attribution
    applies_to: "joint breeder burden"
    rule: "Attribute separable grading and presentation to the causing output. For inseparable flock burden, document a consistent measured driver and sensitivity to an alternative; no universal mass/economic ratio is imposed."
    source_ids:
      - fao-animal-genetic-resources
  - rule_id: period_attribution
    applies_to: "flock years and egg lots"
    rule: "Link replacement, laying, collection, assets and losses to actual service/production periods; no assumed universal flock life or double attribution at replacement/exit."
    source_ids:
      - fao-animal-genetic-resources
  - rule_id: shared_asset_attribution
    applies_to: "house, collection room, grader and trays"
    rule: "List breeder, collection, grading and presentation consumers and service periods; use observed service, throughput or reuse trips to charge each asset only once."
    source_ids:
      - fao-animal-genetic-resources
dataset_production:
  collection_protocols:
    - protocol_id: cp_flock
      process_id: "breeder_laying"
      flow_role: "breeder receipts and exits"
      record_type: "flock and sales register"
      raw_fields: "species, strain, count, live kg, dates, flock age, mortality, sale"
      collection_method: "reconcile register to invoices and weighing; Raw aggregation requirements: link stock and sale to service period. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "count, kg"
      frequency: "each event"
      temporal_coverage: "full productive flock"
      site_scope: "farm and cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, scale check, mortality log; traceable numerator, accepted reference-output denominator and normalization worksheet"
