allocation_rules:
  - rule_id: output_partition
    applies_to: "breeder flock and grading"
    rule: "Enumerate separately handed-over hatching eggs, safely marketed non-hatching eggs, spent breeders and sold manure. Internal states and waste are not co-products. Record each actual gate, mass and period."
    source_ids:
      - fao-goose-production
  - rule_id: causal_attribution
    applies_to: "joint breeder burden"
    rule: "Attribute separable grading and presentation to the causing output. For inseparable flock burden, document a consistent measured driver and sensitivity to an alternative; no universal mass/economic ratio is imposed."
    source_ids:
      - fao-animal-genetic-resources
  - rule_id: period_attribution
    applies_to: "flock years and egg lots"
    rule: "Link replacement, laying, collection, assets and losses to actual service/production periods; no assumed universal flock life or double attribution at replacement/exit."
    source_ids:
      - fao-animal-genetic-resources
  - rule_id: shared_asset_attribution
    applies_to: "house, collection room, grader and trays"
    rule: "List breeder, collection, grading and presentation consumers and service periods; use observed service, throughput or reuse trips to charge each asset only once."
    source_ids:
      - fao-animal-genetic-resources
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_flock
      process_id: "breeder_laying"
      flow_role: "breeder receipts and exits"
      record_type: "flock and sales register"
      raw_fields: "species, strain, count, live kg, dates, flock age, mortality, sale"
      collection_method: "reconcile register to invoices and weighing; Raw aggregation requirements: link stock and sale to service period. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "count, kg"
      frequency: "each event"
      temporal_coverage: "full productive flock"
      site_scope: "farm and cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, scale check, mortality log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_inputs
      process_id: "breeder_laying"
      flow_role: "feed, water, energy"
      record_type: "supply ledger and meter"
      raw_fields: "feed receipt/stock, water function, carrier and readings"
      collection_method: "receipts, inventory and meter reconciliation; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg, L, MJ, kWh"
      frequency: "monthly and flock period"
      temporal_coverage: "productive flock"
      site_scope: "house"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, meter and stock count; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_residues
      process_id: "breeder_laying"
      flow_role: "manure and mortality"
      record_type: "removal log"
      raw_fields: "wet/dry kg, moisture, destination, buyer, mortality"
      collection_method: "weigh transfer and record sale/treatment; Raw aggregation requirements: split product and waste once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, count"
      frequency: "each transfer"
      temporal_coverage: "full flock period"
      site_scope: "house and destination"
      aggregation_rule: "per reference flow"
      quality_evidence: "transfer docket and buyer acceptance; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_eggs
      process_id: "egg_collection"
      flow_role: "laid, collected and lost eggs"
      record_type: "nest/collection log"
      raw_fields: "flock, time, count, lot kg, breakage"
      collection_method: "calibrated scale and count reconciliation; Raw aggregation requirements: balance gross, collected and loss. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, count"
      frequency: "each collection"
      temporal_coverage: "collection period"
      site_scope: "farm nest route"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale check and collection log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grade
      process_id: "hatching_grade"
      flow_role: "selected, downgraded, rejected"
      record_type: "grading/test log"
      raw_fields: "shell condition, test, count, kg, grade, buyer or waste"
      collection_method: "inspection and calibrated weighing; Raw aggregation requirements: one destination per egg. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, count"
      frequency: "each lot"
      temporal_coverage: "collection-to-grade"
      site_scope: "grading node"
      aggregation_rule: "per reference flow"
      quality_evidence: "test, buyer and rejection record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_handover
      process_id: "egg_presentation"
      flow_role: "holding, packaging and final egg lot"
      record_type: "storage/dispatch log"
      raw_fields: "hold time/condition, material/reuse, energy, count/kg, loss, gate"
      collection_method: "meter, material and lot-scale records; Raw aggregation requirements: balance stock, loss and one output. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, count, time, temperature, MJ"
      frequency: "each lot"
      temporal_coverage: "grade-to-gate"
      site_scope: "producer store/gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, store log, receipt; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
    - protocol_id: cp_pathway_emissions
      process_id: "breeder_laying"
      flow_role: "pathway-specific gases and manure N/C"
      record_type: "herd, feed, manure, field and method ledger"
      raw_fields: "species/class; animal-days; intake/DM/digestibility; volatile solids; manure N/TAN; system shares; climate; storage time; fertiliser N; grazing; volatilisation/leaching; methane recovery; factor source/unit; final accepted output ; collected manure wet mass; dry matter; destination"
      collection_method: "collect primary activity by node and period, document parameter applicability, retain each pathway worksheet and any linked treatment/pasture dataset  Retain raw totals and normalize attributed quantities once to the measured accepted final reference output."
      unit: "animal-day; kg DM; kg VS; kg N; kg CH4; kg N2O; kg NH3"
      frequency: "each operating period and management change"
      temporal_coverage: "complete represented cohort and service period"
      site_scope: "actual operated nodes only"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter/analysis records, nitrogen cascade, method and factor evidence, no-duplication ledger"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "breeder_laying"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "breeder_laying"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: count_to_mass
      applies_to: "egg lots"
      rule: "If individual mass is unavailable, sampled shell-on kg divided by sample count gives lot mean mass; multiply by full lot count. Keep species, grade and sample size."
      inputs:
        - "sample kg"
        - "sample count"
        - "full count"
      output: "shell-on kg of actual lot"
      source_ids:
        - fao-goose-production
    - id: egg_balance
      applies_to: "collection through handover"
      rule: "Opening stock + laid/collected input = accepted output + independently downgraded + waste + closing stock, with internal transfers counted once."
      inputs:
        - "mass/count by lot and state"
      output: "mass-balance residual"
      source_ids:
        - fao-goose-production
    - id: reference_normalization
      applies_to: "all cards"
      rule: "Divide attributed foreground amount by measured accepted kg at declared gate; retain independent output handovers."
      inputs:
        - "attributed amount"
        - "accepted kg"
      output: "amount per kg reference"
      source_ids:
        - fao-goose-production
    - id: calc_pathway_emissions
      applies_to: "breeder_laying"
      rule: "Use species- and management-compatible methods and retain disaggregated pathway totals. Convert N2O-N to N2O by 44/28 and NH3-N to NH3 by 17/14 exactly once; already molecular masses are not reconverted. Check methane against the documented available-carbon/methane-potential balance and nitrogen losses against each stage's available N. Indirect formation from previously volatilised N is a downstream transformation, not a second source-stage N loss. Attribute and normalize once; do not duplicate linked treatment or fate-model emissions.  Use matched raw-period quantities before allocation for physical screens: CH4 mass × 12/16 must not exceed the carbon available to the represented pathway; source-stage NH3 mass × 14/17 plus direct N2O mass × 28/44 and other source N losses must not exceed that stage's available N, after accounting for stocks and transfers. Bound each indirect N2O-N calculation by its documented volatilised or leached N precursor, not by subtracting that downstream transformation again from the source ledger. These are conservation checks, not emission factors or an empirical per-product range."
      inputs:
        - cp_pathway_emissions
      output: "kg named compound per final reference flow"
      source_ids:
        - review-ipcc-livestock-2019
        - review-eea-manure-2023
        - review-ipcc-soils-2019
    - id: calc_feed_supply_and_intake
      applies_to: "breeder_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
    - id: calc_manure_n2o_coverage
      applies_to: "review_breeder_laying_direct_n2o; review_breeder_laying_indirect_n2o"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - review-ipcc-livestock-2019
        - review-ipcc-soils-2019
  data_quality_requirements:
    - id: species_identity
      applies_to: "all lots"
      requirement: "Trace species/strain, flock and hatching-use acceptance; do not combine species in an undisclosed reference."
      evidence: "flock and grade records"
    - id: mass_count_quality
      applies_to: "eggs"
      requirement: "Retain count, kg, weighing calibration and lot conversion, with no universal egg-mass factor."
      evidence: "scale checks and lot sheets"
    - id: time_quality
      applies_to: "flock and hold"
      requirement: "Identify production, collection, grading and holding times/conditions and disclose gaps."
      evidence: "dated farm and store logs"
    - id: output_completeness
      applies_to: "multi-output nodes"
      requirement: "Record accepted, downgrade, sold birds/manure and waste destinations, including zero cases."
      evidence: "invoices and rejection logs"
validation_rules:
  - rule_id: validate_identity
    applies_to: "final product"
    rule: "Reject hen, non-hatching, shell-less, post-incubation or hatchling flow as this reference; require species, fresh shell state, hatching use and actual gate."
    source_ids:
      - fao-goose-production
  - rule_id: validate_balance
    applies_to: "all egg nodes"
    rule: "Reconcile count and mass through laid, collected, selected, downgraded, rejected and handed-over states with stock/loss; reject unexplained duplicate outputs."
    source_ids:
      - fao-goose-production
  - rule_id: validate_route
    applies_to: "alternatives"
    rule: "Require managed parent, real inventory/measurement/validation delta and separately measured cohort; a route label alone is insufficient."
    source_ids:
      - fao-animal-genetic-resources
  - rule_id: validate_attribution
    applies_to: "outputs, periods and assets"
    rule: "Require handovers, causal allocation driver, consumers and service periods; reject duplicate shared or multi-period burden."
    source_ids:
      - fao-animal-genetic-resources
  - rule_id: validate_binding
    applies_to: "exchange projection"
    rule: "Resolve each unresolved/unresolved card to a single verified state, gate, property and destination UUID before exchange publication."
    source_ids:
      - fao-goose-production
  - rule_id: v_pathway_emission_coverage
    applies_to: "breeder_laying"
    rule: "Require a pathway coverage ledger for enteric CH4 where biologically applicable, manure CH4, direct/indirect N2O, NH3 and relevant field emissions. Every pathway needs a measured/calculated value, a named linked process with matching coverage, or supported inapplicability; absent data cannot become zero. Keep wild life before capture outside managed husbandry, assess actual managed holding separately, and retain species-specific evidence."
    source_ids:
      - review-ipcc-livestock-2019
      - review-ipcc-soils-2019
      - review-eea-manure-2023
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - review-ipcc-livestock-2019
      - review-ipcc-soils-2019
published_dataset_profile:
  dataset_role: "Foreground production package for fresh non-hen shell-on hatching eggs at declared producer gate."
  downstream_use: "May inform secondary_dataset or background_dataset process and lifecycle-model projections only after concrete identity review."
  allowed_use: "Species-, lot-, gate- and period-qualified shell-on kg results with hatching-selection evidence."
  excluded_use: "Inferring hatchlings or hatchability from kg; substituting hen/table eggs; counting hatchery incubation or distribution as farm production."
  required_metadata: "CPC reference, species/strain, cohort, count/kg, grade, tests, gate, storage, outputs, allocation, carriers and packages."
  required_quality_disclosure: "Untested fertility, uncertain count-mass bridge, mixed routes, storage gaps, rejects and unresolved UUIDs."
  update_trigger: "New species route, gate/state, acceptance criterion, measured loss, co-product treatment, identity or evidence basis."
data_sources:
  - id: "fao-goose-production"
    type: "official_guidance"
    reference: "[FAO goose production and incubation](https://www.fao.org/4/y4359e/y4359e0a.htm)"
    used_for: "Species-specific collection, holding and hatching suitability."
  - id: "fao-animal-genetic-resources"
    type: "official_guidance"
    reference: "[FAO animal genetic resources, poultry egg handling](https://www.fao.org/4/X6526E/X6526E32.htm)"
    used_for: "Avoiding cross-species chicken assumptions and declaring management periods."
  - id: "review-ipcc-livestock-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 10: Emissions from Livestock and Manure Management](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf)"
    used_for: "Species and pathway applicability; CH4 and N2O method selection, not universal emission factors"
  - id: "review-eea-manure-2023"
    type: "official_guidance"
    reference: "[EMEP/EEA Air Pollutant Emission Inventory Guidebook 2023, 3.B Manure Management](https://www.eea.europa.eu/en/analysis/publications/emep-eea-guidebook-2023/part-b-sectoral-guidance-chapters/3-agriculture/3-b-manure-management-2023)"
    used_for: "NH3 nitrogen-flow method; verify actual species, management and geographical applicability before adopting parameters"
  - id: "review-ipcc-soils-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 11: N2O Emissions from Managed Soils](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf)"
    used_for: "Managed-soil direct and indirect nitrogen pathways and boundary reconciliation"
  - id: "fao-feed-loss-accounting-2018"
    type: "official_guidance"
    reference: "[FAO 2018, Environmental performance of pig supply chains, section 11.2.2](https://www.fao.org/4/i8686en/I8686EN.pdf)"
    used_for: "Feed supply versus intake and waste burden, not animal parameters. Applying this accounting principle to the declared taxon is this PCR's methodological choice; no pig diet or emission factor is transferred."
  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
