      record_type: "supply ledger and meter"
      raw_fields: "feed receipt/stock, water function, carrier and readings"
      collection_method: "receipts, inventory and meter reconciliation; Raw aggregation requirements: net use by cohort and function. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, L, MJ, kWh"
      frequency: "monthly and flock period"
      temporal_coverage: "productive flock"
      site_scope: "house"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, meter and stock count; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_residues
