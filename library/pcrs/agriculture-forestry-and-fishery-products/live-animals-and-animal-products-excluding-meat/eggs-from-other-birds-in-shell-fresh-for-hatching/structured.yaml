      flow_role: "holding, packaging and final egg lot"
      record_type: "storage/dispatch log"
      raw_fields: "hold time/condition, material/reuse, energy, count/kg, loss, gate"
      collection_method: "meter, material and lot-scale records; Raw aggregation requirements: balance stock, loss and one output. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, count, time, temperature, MJ"
      frequency: "each lot"
      temporal_coverage: "grade-to-gate"
      site_scope: "producer store/gate"
