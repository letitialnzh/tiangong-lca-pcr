      flow_role: "manure and mortality"
      record_type: "removal log"
      raw_fields: "wet/dry kg, moisture, destination, buyer, mortality"
      collection_method: "weigh transfer and record sale/treatment; Raw aggregation requirements: split product and waste once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, count"
      frequency: "each transfer"
      temporal_coverage: "full flock period"
      site_scope: "house and destination"
      aggregation_rule: "per reference flow"
      quality_evidence: "transfer docket and buyer acceptance; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_eggs
      process_id: "egg_collection"
      flow_role: "laid, collected and lost eggs"
      record_type: "nest/collection log"
      raw_fields: "flock, time, count, lot kg, breakage"
      collection_method: "calibrated scale and count reconciliation; Raw aggregation requirements: balance gross, collected and loss. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, count"
      frequency: "each collection"
      temporal_coverage: "collection period"
      site_scope: "farm nest route"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale check and collection log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grade
