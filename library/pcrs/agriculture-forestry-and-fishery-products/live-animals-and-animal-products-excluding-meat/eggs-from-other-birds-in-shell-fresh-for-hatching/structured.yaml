system_boundary:
  rules:
    - rule_id: producer_gate
      applies_to: "all routes"
      rule: "Include breeder laying, independent collection, grading and producer-side protection up to egg handover; exclude incubation, hatchling production and post-gate distribution."
      source_ids:
        - fao-goose-production
    - rule_id: species_delta
      applies_to: "alternative breeder routes"
      rule: "Record parent managed production plus evidenced changes in inventory, collection, holding or acceptance; chicken storage or hatchability assumptions are not transferable to other birds."
      source_ids:
        - fao-goose-production
        - fao-animal-genetic-resources
    - rule_id: grade_state
      applies_to: "selected eggs"
      rule: "Hatching use requires documented lot selection; intended use is not proof of fertility or realized hatchability."
      source_ids:
        - fao-goose-production
    - rule_id: handoff_once
      applies_to: "egg states"
      rule: "Laid, collected, graded and presented states of one lot reconcile as transfers, not repeated independent products."
      source_ids:
        - fao-goose-production
    - rule_id: shared_boundary
      applies_to: "house, collection room, grader and reusable trays"
      rule: "Identify consuming nodes and service periods; count each shared burden once with a causal driver."
      source_ids:
        - fao-animal-genetic-resources
boundary_abstraction:
  declared_starting_condition: "Purchased breeder birds, feed, water, energy and package materials enter at documented farm receipt; home-produced inputs require separate traced foreground."
  starting_condition_role: "Incoming breeder stock before the measured productive flock period."
  product_classification_scope: "CPC 02321 identifies the accepted fresh shell-on non-hen hatching eggs, not unsorted internal eggs or a separately sold non-hatching grade."
  recursive_input_rule: "Purchased same-category hatching eggs used to establish breeders are upstream inputs at receipt; do not credit them against resulting eggs."
  upstream_dataset_requirement: "Trace breeders, feed, energy, water and packaging upstream; farm-only records are not cradle-to-gate."
  disclosure: "Species/route, flock and egg periods, gate, count/mass, quality tests, collection and holding conditions, losses, co-product handovers and shared-asset attribution."
