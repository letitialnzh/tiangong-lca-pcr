system_boundary:
  rules:
    - rule_id: producer_gate
      applies_to: "all routes"
      rule: "Include breeder laying, independent collection, grading and producer-side protection up to egg handover; exclude incubation, hatchling production and post-gate distribution."
      source_ids:
        - fao-goose-production
    - rule_id: species_delta
      applies_to: "alternative breeder routes"
      rule: "Record parent managed production plus evidenced changes in inventory, collection, holding or acceptance; chicken storage or hatchability assumptions are not transferable to other birds."
      source_ids:
        - fao-goose-production
        - fao-animal-genetic-resources
    - rule_id: grade_state
      applies_to: "selected eggs"
      rule: "Hatching use requires documented lot selection; intended use is not proof of fertility or realized hatchability."
      source_ids:
        - fao-goose-production
    - rule_id: handoff_once
      applies_to: "egg states"
      rule: "Laid, collected, graded and presented states of one lot reconcile as transfers, not repeated independent products."
      source_ids:
        - fao-goose-production
    - rule_id: shared_boundary
      applies_to: "house, collection room, grader and reusable trays"
      rule: "Identify consuming nodes and service periods; count each shared burden once with a causal driver."
      source_ids:
        - fao-animal-genetic-resources
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
