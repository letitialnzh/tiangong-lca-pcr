system_boundary:
  rules:
    - rule_id: species_gate
      applies_to: "all"
      rule: "Verify non-cattle (including non-yak), non-buffalo, non-sheep, non-goat, non-camel origin and raw whole state; otherwise this PCR does not apply."
      source_ids:
        - un-cpc-3-2025
    - rule_id: capture_once
      applies_to: "herd/milking"
      rule: "Herd lactation is distinct from physical removal; gross captured milk appears only at milking, offspring-consumed milk only in the herd ledger."
      source_ids:
        - fao-other-dairy-animals
    - rule_id: first_acceptance
      applies_to: "conditioning"
      rule: "Perform and record only actual first straining, testing and rejection; no invented standardization or pasteurization."
      source_ids:
        - fao-dairy-hygiene
    - rule_id: cooling_gate
      applies_to: "cooling"
      rule: "Cooling preserves raw status and is conditional on performed work; exclude later cold-chain services."
      source_ids:
        - fao-milk-preservation
    - rule_id: handover_gate
      applies_to: "presentation"
      rule: "Account for actual hygienic container and reuse before handover; exclude post-gate distribution and consumer packing."
      source_ids:
        - fao-dairy-hygiene
    - rule_id: shared_services
      applies_to: "all"
      rule: "Attribute shared milking room, tank, cleaning and meters to actual consumers and periods once."
      source_ids:
        - fao-dairy-hygiene
boundary_abstraction:
  declared_starting_condition: "Identified eligible-species managed herd, purchased replacements and feed origins entering recorded phases"
  starting_condition_role: "Upstream purchased animal/feed burdens enter once; foreground begins at documented herd management"
  product_classification_scope: "Species-qualified raw whole milk only; transferred animals, fibre or sold manure retain separate product identities"
  recursive_input_rule: "Same-category purchased milk requires a separate upstream dataset and mass ledger; it is not relabelled as this herd's milk."
  upstream_dataset_requirement: "Compatible datasets for purchased replacements, feed, utilities and packaging, without double counting on-farm feed."
  disclosure: "Species and CPC gate, herd mode, phases, actual cooling, milk balances, handover site, co-product allocation and shared services"
