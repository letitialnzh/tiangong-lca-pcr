allocation_rules:
  - rule_id: actual_outputs
    applies_to: "herd and milk"
    rule: "Declare milk and every actually marketed live animal, fibre, manure or other species-specific co-product at its handoff; separate residues and waste. Do not invent a co-product merely because it is biologically possible."
    source_ids:
      - fao-other-dairy-animals
  - rule_id: joint_herd
    applies_to: "inseparable biological activity"
    rule: "First split metered services by causal use. For irreducibly joint herd burdens, use a locally justified physical causal allocation if supported; otherwise disclose period-consistent economic allocation and sensitivity. Never assign all burden to milk or zero to culls by default."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: offspring_milk
    applies_to: "suckling"
    rule: "Offspring-consumed milk remains in the herd/young-animal ledger; it is not saleable captured milk or an extra Product output."
    source_ids:
      - fao-other-dairy-animals
  - rule_id: phase_once
    applies_to: "replacement/dry/lactation/cull"
    rule: "Link inputs, outputs and assets to phase-specific periods and attribute replacement once, with no later duplicate entry."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: asset_once
    applies_to: "room/tank/meter/cleaning"
    rule: "Assign each common service burden once to actual consuming nodes and periods by meter, use-time or disclosed throughput share."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: allocation_method_basis
    applies_to: "Residual joint burdens and shared service"
    rule: "Apply the general LCA hierarchy: examine subdivision or an appropriately justified system expansion before residual allocation; then prefer a supported physical causal relationship, and justify an economic basis when physical attribution is not established. The donor-day, occupancy or throughput driver is a PCR modelling choice requiring case-specific evidence and sensitivity, not a requirement of sanitary guidance. Include failed attempts and losses in the service period; do not select only successful outputs or introduce hypothetical substitution credits."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: allocation_rule_7
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd
      process_id: "herd"
      flow_role: "feed, water, animals, manure, methane"
      record_type: "herd and supplier ledger"
      raw_fields: "species, animal ids, phase dates, animal-days, feed dry mass, water, bought replacements, suckled milk, sold animals, manure, supported CH4 factor"
      collection_method: "reconcile herd book, invoices and meters; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "head, days, kg"
      frequency: "event and monthly"
      temporal_coverage: "full lactation/replacement linkage"
      site_scope: "producing herd"
      aggregation_rule: "per reference flow"
      quality_evidence: "source invoices, calibration and factor provenance; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_milking
      process_id: "milking"
      flow_role: "captured milk and energy"
      record_type: "milking lot"
      raw_fields: "lot id, gross mass, spillage, offspring consumption basis, milking energy"
      collection_method: "weigh lot and read allocated meter; Raw aggregation requirements: reconcile gross and transfer. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, kWh"
      frequency: "each lot"
      temporal_coverage: "all capture events"
      site_scope: "producing milking stations"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration and lot log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_conditioning
      process_id: "conditioning"
      flow_role: "raw input, accepted and rejected milk, water"
      record_type: "lot acceptance"
      raw_fields: "input, sample loss, rejected, accepted, fat/solids, raw status, water"
      collection_method: "weigh and sample; Raw aggregation requirements: reconcile by lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, mass fraction"
      frequency: "each lot"
      temporal_coverage: "all accepted/rejected lots"
      site_scope: "first conditioning station"
      aggregation_rule: "per reference flow"
      quality_evidence: "lab, scale and rejection records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_cooling
      process_id: "cooling"
      flow_role: "warm input, cool output, energy"
      record_type: "tank meter"
      raw_fields: "lot, before/after mass, time, temperature, energy"
      collection_method: "weigh and read meter; Raw aggregation requirements: input minus loss equals output. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, °C, kWh"
      frequency: "cooled lot"
      temporal_coverage: "only performed events"
      site_scope: "declared tank"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter/thermometer calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_gate
      process_id: "presentation"
      flow_role: "net milk and container"
      record_type: "handover record"
      raw_fields: "lot, species, net milk, tare, fat, temperature, gate, package mass/reuse, loss"
      collection_method: "weigh net sale and inspect container; Raw aggregation requirements: sum only net accepted mass. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, °C"
      frequency: "each sale"
      temporal_coverage: "all reference sales"
      site_scope: "farm/first-collection gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed handover and lab record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_pathway_emissions
      process_id: "herd"
      flow_role: "pathway-specific gases and manure N/C"
      record_type: "herd, feed, manure, field and method ledger"
      raw_fields: "species/class; animal-days; intake/DM/digestibility; volatile solids; manure N/TAN; system shares; climate; storage time; fertiliser N; grazing; volatilisation/leaching; methane recovery; factor source/unit; final accepted output ; collected manure wet mass; dry matter; destination"
      collection_method: "collect primary activity by node and period, document parameter applicability, retain each pathway worksheet and any linked treatment/pasture dataset  Retain raw totals and normalize attributed quantities once to the measured accepted final reference output."
      unit: "animal-day; kg DM; kg VS; kg N; kg CH4; kg N2O; kg NH3"
      frequency: "each operating period and management change"
      temporal_coverage: "complete represented cohort and service period"
      site_scope: "actual operated nodes only"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter/analysis records, nitrogen cascade, method and factor evidence, no-duplication ledger"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "herd"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "herd"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: lot_balance
      applies_to: "milk route"
      rule: "Captured = spillage + conditioning input; conditioning input = accepted + reject + sampling loss; warm-direct plus cooled transfer = gate input; gate input = net sale + documented gate loss."
      inputs:
        - "calibrated lot masses"
      output: "reconciled net kg"
      source_ids:
        - fao-dairy-hygiene
    - id: feed_dry
      applies_to: "feed"
      rule: "Convert recorded wet feed only with measured dry-matter fraction; do not import a universal ration or yield."
      inputs:
        - "feed mass and sample"
      output: "dry kg per net kg milk"
      source_ids:
        - fao-other-dairy-animals
    - id: shared_split
      applies_to: "facilities"
      rule: "One asset/meter burden times use shares summing to one across actual nodes and periods."
      inputs:
        - "meter/service ledger"
      output: "node burden without duplication"
      source_ids:
        - fao-dairy-hygiene
    - id: volume_mass
      applies_to: "litre meters"
      rule: "Milk kg = litres × measured lot- and temperature-compatible density; otherwise weigh."
      inputs:
        - L
        - density
        - temperature
      output: "kg milk"
      source_ids:
        - fao-dairy-hygiene
    - id: calc_pathway_emissions
      applies_to: "herd"
      rule: "Use species- and management-compatible methods and retain disaggregated pathway totals. Convert N2O-N to N2O by 44/28 and NH3-N to NH3 by 17/14 exactly once; already molecular masses are not reconverted. Check methane against the documented available-carbon/methane-potential balance and nitrogen losses against each stage's available N. Indirect formation from previously volatilised N is a downstream transformation, not a second source-stage N loss. Attribute and normalize once; do not duplicate linked treatment or fate-model emissions.  Use matched raw-period quantities before allocation for physical screens: CH4 mass × 12/16 must not exceed the carbon available to the represented pathway; source-stage NH3 mass × 14/17 plus direct N2O mass × 28/44 and other source N losses must not exceed that stage's available N, after accounting for stocks and transfers. Bound each indirect N2O-N calculation by its documented volatilised or leached N precursor, not by subtracting that downstream transformation again from the source ledger. These are conservation checks, not emission factors or an empirical per-product range."
      inputs:
        - cp_pathway_emissions
      output: "kg named compound per final reference flow"
      source_ids:
        - review-ipcc-livestock-2019
        - review-eea-manure-2023
        - review-ipcc-soils-2019
    - id: calc_feed_supply_and_intake
      applies_to: "feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - review-fao-pig-lca-2018
    - id: calc_manure_n2o_coverage
      applies_to: "review_herd_direct_n2o; review_herd_indirect_n2o"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - review-ipcc-livestock-2019
        - review-ipcc-soils-2019
  data_quality_requirements:
    - id: species_identity
      applies_to: "reference"
      requirement: "Exact animal species, raw whole state and fat exclusion check required."
      evidence: "taxonomy/lot and laboratory record"
    - id: milk_reconciliation
      applies_to: "every node"
      requirement: "Keep lot transfer, rejects, offspring suckling and tare distinct."
      evidence: "scales, lot and handover records"
    - id: period_completeness
      applies_to: "herd"
      requirement: "Animal-days and replacement/dry/lactation/cull events cover declared reporting period."
      evidence: "complete herd register"
    - id: shared_trace
      applies_to: "infrastructure"
      requirement: "List consumers, period, share and a single entry for each common burden."
      evidence: "meter/service records"
validation_rules:
  - rule_id: verify_species
    applies_to: "reference"
    rule: "Reject cattle including yak, buffalo, sheep, goat, camel and unidentified-species milk."
    source_ids:
      - un-cpc-3-2025
  - rule_id: verify_state
    applies_to: "reference"
    rule: "Reject under-3.5%-fat, skimmed/partly skimmed, pasteurized, fermented or manufactured milk; cooling alone is allowed."
    source_ids:
      - un-cpc-3-2025
  - rule_id: verify_mass
    applies_to: "all milk nodes"
    rule: "Reconcile one physical capture with internal transfers and one final net sale; exclude suckled milk, rejects and tare."
    source_ids:
      - fao-dairy-hygiene
  - rule_id: verify_attribution
    applies_to: "herd/facilities"
    rule: "Check every real co-product handoff, replacement period and shared-meter allocation exactly once."
    source_ids:
      - fao-other-dairy-animals
  - rule_id: verify_binding
    applies_to: "exchange generation"
    rule: "No unverified UUID can become a final TIDAS exchange; confirm type, species/state/gate, property/unit and support rows."
    source_ids: []
  - rule_id: v_pathway_emission_coverage
    applies_to: "herd"
    rule: "Require a pathway coverage ledger for enteric CH4 where biologically applicable, manure CH4, direct/indirect N2O, NH3 and relevant field emissions. Every pathway needs a measured/calculated value, a named linked process with matching coverage, or supported inapplicability; absent data cannot become zero. Keep wild life before capture outside managed husbandry, assess actual managed holding separately, and retain species-specific evidence."
    source_ids:
      - review-ipcc-livestock-2019
      - review-ipcc-soils-2019
      - review-eea-manure-2023
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - review-ipcc-livestock-2019
      - review-ipcc-soils-2019
published_dataset_profile:
  dataset_role: "Species-specific foreground raw-whole-milk data package; candidate until primary records and identities are verified"
  downstream_use: "secondary_dataset; background_dataset only after source/representativeness review"
  allowed_use: "One qualifying species' raw whole milk at declared initial handover"
  excluded_use: "Species-average, excluded species, processed or low-fat milk, undocumented collection chain"
  required_metadata: "Species/CPC check, sites and periods, fat/sample/temperature, actual gate, net/reject/suckled mass, density if used, co-products, allocations and supplier origins"
  required_quality_disclosure: "Measured versus estimated fields, sampling and calibration coverage, unresolved flow UUIDs and shared-service uncertainty"
  update_trigger: "Species classification, product state, gate, route, verified UUID or material primary data changes"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "[UN CPC 3.0 explanatory notes](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf) and [02299 detail](https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/02299)"
    used_for: "species and raw-milk identity/exclusions"
  - id: "fao-other-dairy-animals"
    type: "official_guidance"
    reference: "[FAO other dairy animals](https://www.fao.org/dairy-production-products/dairy/other-animals/en)"
    used_for: "species-dependent husbandry and lactation context, not CPC taxonomy"
  - id: "fao-milk-preservation"
    type: "official_guidance"
    reference: "[FAO milk preservation](https://www.fao.org/dairy-production-products/processing/milk-preservation/en)"
    used_for: "cooling and raw-state route distinction"
  - id: "fao-dairy-hygiene"
    type: "official_guidance"
    reference: "[FAO/Codex dairy hygiene](https://www.fao.org/4/j2308e/j2308e02.htm)"
    used_for: "collection, handling and lot traceability"
  - id: "fao-milk-composition-2013"
    type: "official_guidance"
    reference: "[FAO, Milk and dairy products in human nutrition (2013), ch. 3](https://www.fao.org/4/i3396e/i3396e.pdf)"
    used_for: "reindeer high-fat example and low-fat mare/donkey caution; actual lots still require measurement"
  - id: "review-fao-pig-lca-2018"
    type: "official_guidance"
    reference: "[FAO 2018, Environmental performance of pig supply chains: Guidelines for assessment, section 11.2.2 and Appendix 2.13](https://www.fao.org/4/i8686en/I8686EN.pdf)"
    used_for: "Feed-loss accounting and general LCA allocation hierarchy; extension to other taxa or reproductive products is this PCR's explicit methodological choice, not a pig parameter transfer"
  - id: "review-ipcc-livestock-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 10: Emissions from Livestock and Manure Management](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf)"
    used_for: "Species and pathway applicability; CH4 and N2O method selection, not universal emission factors"
  - id: "review-eea-manure-2023"
    type: "official_guidance"
    reference: "[EMEP/EEA Air Pollutant Emission Inventory Guidebook 2023, 3.B Manure Management](https://www.eea.europa.eu/en/analysis/publications/emep-eea-guidebook-2023/part-b-sectoral-guidance-chapters/3-agriculture/3-b-manure-management-2023)"
    used_for: "NH3 nitrogen-flow method; verify actual species, management and geographical applicability before adopting parameters"
  - id: "review-ipcc-soils-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 11: N2O Emissions from Managed Soils](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf)"
    used_for: "Managed-soil direct and indirect nitrogen pathways and boundary reconciliation"
  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
