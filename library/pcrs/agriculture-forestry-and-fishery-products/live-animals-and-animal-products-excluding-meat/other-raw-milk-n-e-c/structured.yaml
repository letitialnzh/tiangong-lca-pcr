allocation_rules:
  - rule_id: actual_outputs
    applies_to: "herd and milk"
    rule: "Declare milk and every actually marketed live animal, fibre, manure or other species-specific co-product at its handoff; separate residues and waste. Do not invent a co-product merely because it is biologically possible."
    source_ids:
      - fao-other-dairy-animals
  - rule_id: joint_herd
    applies_to: "inseparable biological activity"
    rule: "First split metered services by causal use. For irreducibly joint herd burdens, use a locally justified physical causal allocation if supported; otherwise disclose period-consistent economic allocation and sensitivity. Never assign all burden to milk or zero to culls by default."
    source_ids:
      - fao-other-dairy-animals
  - rule_id: offspring_milk
    applies_to: "suckling"
    rule: "Offspring-consumed milk remains in the herd/young-animal ledger; it is not saleable captured milk or an extra Product output."
    source_ids:
      - fao-other-dairy-animals
  - rule_id: phase_once
    applies_to: "replacement/dry/lactation/cull"
    rule: "Link inputs, outputs and assets to phase-specific periods and attribute replacement once, with no later duplicate entry."
    source_ids:
      - fao-other-dairy-animals
  - rule_id: asset_once
    applies_to: "room/tank/meter/cleaning"
    rule: "Assign each common service burden once to actual consuming nodes and periods by meter, use-time or disclosed throughput share."
    source_ids:
      - fao-dairy-hygiene
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd
      process_id: "herd"
      flow_role: "feed, water, animals, manure, methane"
      record_type: "herd and supplier ledger"
      raw_fields: "species, animal ids, phase dates, animal-days, feed dry mass, water, bought replacements, suckled milk, sold animals, manure, supported CH4 factor"
      collection_method: "reconcile herd book, invoices and meters; Raw aggregation requirements: sum by species/phase; attribute once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head, days, kg"
      frequency: "event and monthly"
      temporal_coverage: "full lactation/replacement linkage"
      site_scope: "producing herd"
      aggregation_rule: "per reference flow"
      quality_evidence: "source invoices, calibration and factor provenance; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_milking
      process_id: "milking"
      flow_role: "captured milk and energy"
      record_type: "milking lot"
      raw_fields: "lot id, gross mass, spillage, offspring consumption basis, milking energy"
      collection_method: "weigh lot and read allocated meter; Raw aggregation requirements: reconcile gross and transfer. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, kWh"
      frequency: "each lot"
      temporal_coverage: "all capture events"
      site_scope: "producing milking stations"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration and lot log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_conditioning
      process_id: "conditioning"
      flow_role: "raw input, accepted and rejected milk, water"
      record_type: "lot acceptance"
      raw_fields: "input, sample loss, rejected, accepted, fat/solids, raw status, water"
      collection_method: "weigh and sample; Raw aggregation requirements: reconcile by lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, mass fraction"
      frequency: "each lot"
      temporal_coverage: "all accepted/rejected lots"
      site_scope: "first conditioning station"
      aggregation_rule: "per reference flow"
      quality_evidence: "lab, scale and rejection records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_cooling
      process_id: "cooling"
      flow_role: "warm input, cool output, energy"
      record_type: "tank meter"
      raw_fields: "lot, before/after mass, time, temperature, energy"
      collection_method: "weigh and read meter; Raw aggregation requirements: input minus loss equals output. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, °C, kWh"
      frequency: "cooled lot"
      temporal_coverage: "only performed events"
      site_scope: "declared tank"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter/thermometer calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_gate
      process_id: "presentation"
      flow_role: "net milk and container"
      record_type: "handover record"
      raw_fields: "lot, species, net milk, tare, fat, temperature, gate, package mass/reuse, loss"
      collection_method: "weigh net sale and inspect container; Raw aggregation requirements: sum only net accepted mass. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, °C"
      frequency: "each sale"
      temporal_coverage: "all reference sales"
      site_scope: "farm/first-collection gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed handover and lab record; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: lot_balance
      applies_to: "milk route"
      rule: "Captured = spillage + conditioning input; conditioning input = accepted + reject + sampling loss; warm-direct plus cooled transfer = gate input; gate input = net sale + documented gate loss."
      inputs:
        - "calibrated lot masses"
      output: "reconciled net kg"
      source_ids:
        - fao-dairy-hygiene
    - id: feed_dry
      applies_to: "feed"
      rule: "Convert recorded wet feed only with measured dry-matter fraction; do not import a universal ration or yield."
      inputs:
        - "feed mass and sample"
      output: "dry kg per net kg milk"
      source_ids:
        - fao-other-dairy-animals
    - id: shared_split
      applies_to: "facilities"
      rule: "One asset/meter burden times use shares summing to one across actual nodes and periods."
      inputs:
        - "meter/service ledger"
      output: "node burden without duplication"
      source_ids:
        - fao-dairy-hygiene
    - id: volume_mass
      applies_to: "litre meters"
      rule: "Milk kg = litres × measured lot- and temperature-compatible density; otherwise weigh."
      inputs:
        - L
        - density
        - temperature
      output: "kg milk"
      source_ids:
        - fao-dairy-hygiene
  data_quality_requirements:
    - id: species_identity
      applies_to: "reference"
      requirement: "Exact animal species, raw whole state and fat exclusion check required."
      evidence: "taxonomy/lot and laboratory record"
    - id: milk_reconciliation
      applies_to: "every node"
      requirement: "Keep lot transfer, rejects, offspring suckling and tare distinct."
      evidence: "scales, lot and handover records"
    - id: period_completeness
      applies_to: "herd"
      requirement: "Animal-days and replacement/dry/lactation/cull events cover declared reporting period."
      evidence: "complete herd register"
    - id: shared_trace
      applies_to: "infrastructure"
      requirement: "List consumers, period, share and a single entry for each common burden."
      evidence: "meter/service records"
validation_rules:
  - rule_id: verify_species
    applies_to: "reference"
    rule: "Reject cattle including yak, buffalo, sheep, goat, camel and unidentified-species milk."
    source_ids:
      - un-cpc-3-2025
  - rule_id: verify_state
    applies_to: "reference"
    rule: "Reject under-3.5%-fat, skimmed/partly skimmed, pasteurized, fermented or manufactured milk; cooling alone is allowed."
    source_ids:
      - un-cpc-3-2025
  - rule_id: verify_mass
    applies_to: "all milk nodes"
    rule: "Reconcile one physical capture with internal transfers and one final net sale; exclude suckled milk, rejects and tare."
    source_ids:
      - fao-dairy-hygiene
  - rule_id: verify_attribution
    applies_to: "herd/facilities"
    rule: "Check every real co-product handoff, replacement period and shared-meter allocation exactly once."
    source_ids:
      - fao-other-dairy-animals
  - rule_id: verify_binding
    applies_to: "exchange generation"
    rule: "No unverified UUID can become a final TIDAS exchange; confirm type, species/state/gate, property/unit and support rows."
    source_ids: []
published_dataset_profile:
  dataset_role: "Species-specific foreground raw-whole-milk data package; candidate until primary records and identities are verified"
  downstream_use: "secondary_dataset; background_dataset only after source/representativeness review"
  allowed_use: "One qualifying species' raw whole milk at declared initial handover"
  excluded_use: "Species-average, excluded species, processed or low-fat milk, undocumented collection chain"
  required_metadata: "Species/CPC check, sites and periods, fat/sample/temperature, actual gate, net/reject/suckled mass, density if used, co-products, allocations and supplier origins"
  required_quality_disclosure: "Measured versus estimated fields, sampling and calibration coverage, unresolved flow UUIDs and shared-service uncertainty"
  update_trigger: "Species classification, product state, gate, route, verified UUID or material primary data changes"
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "[UN CPC 3.0 explanatory notes](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf) and [02299 detail](https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/02299)"
    used_for: "species and raw-milk identity/exclusions"
  - id: "fao-other-dairy-animals"
    type: "official_guidance"
    reference: "[FAO other dairy animals](https://www.fao.org/dairy-production-products/dairy/other-animals/en)"
    used_for: "species-dependent husbandry and lactation context, not CPC taxonomy"
  - id: "fao-milk-preservation"
    type: "official_guidance"
    reference: "[FAO milk preservation](https://www.fao.org/dairy-production-products/processing/milk-preservation/en)"
    used_for: "cooling and raw-state route distinction"
  - id: "fao-dairy-hygiene"
    type: "official_guidance"
    reference: "[FAO/Codex dairy hygiene](https://www.fao.org/4/j2308e/j2308e02.htm)"
    used_for: "collection, handling and lot traceability"
  - id: "fao-milk-composition-2013"
    type: "official_guidance"
    reference: "[FAO, Milk and dairy products in human nutrition (2013), ch. 3](https://www.fao.org/4/i3396e/i3396e.pdf)"
    used_for: "reindeer high-fat example and low-fat mare/donkey caution; actual lots still require measurement"
