allocation_rules:
  - rule_id: a_outputs
    applies_to: "Independent product sales"
    rule: "Distinguish live birds from independently sold eggs or feathers at their own gate. Prefer process separation and causal attribution; if inseparable, allocate shared burdens by measured same-period economic value with price evidence. Unsold residues and deaths are waste, not co-products."
    source_ids:
      - iso-14044-2006
  - rule_id: a_period
    applies_to: "Cohorts and campaigns"
    rule: "Attribute stock, replacement, input and output to observed cohort/campaign and service period; reconcile opening/closing stock and never charge replacement twice."
    source_ids:
      - iso-14044-2006
  - rule_id: a_shared
    applies_to: "Shared assets and services"
    rule: "Allocate common aviary, water or handling service by metered consumption or measured use time for each node and period; disclose any proxy and prevent a second charge."
    source_ids:
      - iso-14044-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_rear
      process_id: "rear"
      flow_role: "stock, feed, utilities and outputs"
      record_type: "cohort ledger, invoices, meters and scale"
      raw_fields: "species, class, source, count, mass, feed, water, energy, period, independent sales"
      collection_method: "reconcile each event and opening/closing stock; Raw aggregation requirements: sum by cohort and product gate. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; bird; kWh"
      frequency: "event and period"
      temporal_coverage: "full cohort"
      site_scope: "breeder site"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice, calibrated scale, meter, sale record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "lawful capture, energy and live transfer"
      record_type: "permit and campaign log"
      raw_fields: "permit, species, site, dates, count captured/released/dead, mass, energy"
      collection_method: "authorized event record and weighing; Raw aggregation requirements: sum only retained live birds. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; bird; kWh"
      frequency: "each campaign"
      temporal_coverage: "full campaign"
      site_scope: "capture site"
      aggregation_rule: "per reference flow"
      quality_evidence: "permission and custody chain; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "live acceptance"
      record_type: "acceptance and scale log"
      raw_fields: "species, source lot, count, mass, condition, gate, date"
      collection_method: "weigh and inspect actual living lot; Raw aggregation requirements: sum accepted live mass by species. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; bird"
      frequency: "each lot"
      temporal_coverage: "source-gate period"
      site_scope: "each source gate"
