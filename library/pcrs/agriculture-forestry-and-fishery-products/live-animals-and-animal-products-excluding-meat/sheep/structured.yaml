measurement_rules:
  - id: reference_live_weight_mass
    applies_to: "reference live sheep"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use live weight measured immediately before ownership or control transfer at the producing farm gate. Record the scale point, fasting or gut-fill convention if applied, and whether mass is individual or lot total."
  - id: headcount_to_mass
    applies_to: "animal counts, entries, births, deaths, and transfers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Count records require animal class and measured or sampled mean live weight before conversion to kg; retain count and conversion evidence."
  - id: feed_mass_basis
    applies_to: "grazed forage, conserved forage, concentrates, by-products, supplements, and milk replacer"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg dry matter and kg as-fed"
    rule: "Preserve as-fed quantity and measured or supplier dry-matter fraction; do not combine wet and dry feed records without conversion evidence."
  - id: water_measurement_basis
    applies_to: "supplied drinking and service water"
    required_property_ref:
      name: "Mass or volume"
      uuid: ""
    required_unit: "kg or m3"
    rule: "Record metered or estimated supplied water separately from rainfall and unmanaged surface water; disclose the estimation method when no meter is used."
  - id: gas_species_basis
    applies_to: "methane and nitrous oxide outputs"
    required_property_ref:
      name: "Mass of named gas or element basis"
      uuid: ""
    required_unit: "kg CH4, kg N2O, or kg N2O-N"
    rule: "Preserve species and basis. Do not mix CH4 with carbon-equivalent units or N2O with N2O-N without an explicit conversion."
  - id: inventory_reference_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual flow property"
      uuid: ""
    required_unit: "exchange unit per reference flow"
    rule: "The inventory and collection aggregation fields below express final amounts per declared reference flow. Keep all raw collection records, original denominator qualifiers, route/period strata, unit conversions and allocation requirements. For each flow, first obtain its attributable amount in its own numerator unit using the existing rules; then divide by the measured accepted reference-output quantity of the same scope and multiply by the declared reference quantity. Do not mix species, states, gates or incompatible routes; count transfers and shared burdens once. A missing, zero or untraceable accepted-output denominator is a blocking data-quality issue. Keep provisional QA ranges on their explicitly stated bases; they are not conversion factors or production defaults. Compute normalized amount = attributable amount * declared reference quantity / measured accepted reference-output quantity. Apply normalization once only; never divide an already normalized value again."
process_map:
