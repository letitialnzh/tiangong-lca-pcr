allocation_rules:
  - rule_id: output_set_completeness
    applies_to: "live sheep, wool, milk, breeding or cull stock, and exported manure"
    rule: "Enumerate every independently intended and transferred output with its hand-off. Mortalities, unusable manure, and untransferred residues remain loss or waste. Do not count one output at two hand-offs."
    source_ids:
      - fao-leap-small-ruminants-2016
      - fao-leap-nutrient-flows-2018
  - rule_id: direct_partition_before_allocation
    applies_to: "separable animal groups, activities, routes, products, and periods"
    rule: "Partition burdens using animal-group, process, meter, feed, land, manure-pathway, and period records before allocating shared burdens."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: economic_allocation_for_joint_products
    applies_to: "inseparable live sheep, milk, wool, and other intended products"
    rule: "After direct partitioning, use representative farm-gate economic value over the declared period for remaining joint burdens unless a reviewed physical relationship demonstrably represents causation. State prices, period, currency, and sensitivity."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: multi_period_attribution
    applies_to: "breeding stock, replacements, long-lived flock assets, and outputs spanning periods"
    rule: "Link entry, birth, replacement, culling, death, and output events to biological phases and reporting periods. Allocate long-lived animal and asset burdens over actual service or productive periods; do not attribute them again in a later cohort."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: shared_infrastructure_attribution
    applies_to: "housing, fencing, water, handling, shearing, vehicles, and manure systems shared by groups or periods"
    rule: "Identify every consuming group or activity and service period. Prefer metered or activity-specific use, then animal-days or live-weight-time; document the driver and count each burden once."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: allocation_rule_6
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_flock_events
      process_id: "managed_sheep_production"
      flow_role: "animal entries, births, phase transfers, sales, culls, and reference output"
      record_type: "flock register, weigh record, sale or transfer record"
      raw_fields: "animal or lot id; class; sex; purpose; breed where material; event; date; head count; live weight; scale point; origin or destination"
      collection_method: "calibrated individual or lot weighing linked to flock records; Raw aggregation requirements: reconcile opening stock + entries + births = closing stock + transfers + sales + deaths, then normalize transferred live weight. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head and kg live weight"
      frequency: "each event"
      temporal_coverage: "complete cohort or representative reporting period"
      site_scope: "all represented flock groups and farm-gate transfer point"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration, signed transfer, flock-register reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed_and_grazing
      process_id: "managed_sheep_production"
      flow_role: "feed and forage input"
      record_type: "feed invoice, ration, pasture and grazing log, stock movement"
      raw_fields: "feed identity; source; as-fed mass; dry matter; animal class; grazing area and duration; refusals"
      collection_method: "weigh supplied feed; derive pasture intake with a declared reviewed method when direct measurement is unavailable; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg as-fed and kg dry matter"
      frequency: "feed event or period"
      temporal_coverage: "all biological phases in the cohort or reporting period"
      site_scope: "flock group, pasture parcel, and housing unit"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, scale records, feed analysis, pasture and movement logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_health_products
      process_id: "managed_sheep_production"
      flow_role: "veterinary and flock-health products"
      record_type: "treatment register and purchase record"
      raw_fields: "product; formulation or active ingredient; dose; quantity; animal class; date; reason; discard"
      collection_method: "treatment log reconciled to purchases and stock; Raw aggregation requirements: sum actual administered and discarded quantities by formulation. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "dose, kg, or L"
      frequency: "each treatment"
      temporal_coverage: "complete cohort or reporting period"
      site_scope: "all represented flock groups"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed treatment register, invoice, stock reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_water_energy_transport
      process_id: "managed_sheep_production"
      flow_role: "supplied water, energy carriers, and included inbound transport"
      record_type: "meter, invoice, fuel and trip log"
      raw_fields: "water source and quantity; energy carrier and quantity; meter id; activity; cargo; mass; distance; vehicle; date"
      collection_method: "meters, invoices, tank records, odometer or route records; Raw aggregation requirements: assign directly where metered; otherwise allocate by documented operating hours, animal-days, or live-weight-time. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3, kg, L, kWh, MJ, and t*km"
      frequency: "monthly, trip, or event"
      temporal_coverage: "complete cohort or reporting period"
      site_scope: "farm, grazing support, housing, handling, manure, and included movement activities"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, invoice, meter photo, trip manifest, allocation worksheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_outputs_and_losses
      process_id: "managed_sheep_production"
      flow_role: "wool, milk, manure export, mortalities, and other output or loss"
      record_type: "shearing, milk, manure transfer, mortality, and waste records"
      raw_fields: "output identity; mass; wet/dry or composition basis; animal group; date; destination; loss cause; fate"
      collection_method: "weigh or meter each output; estimate mortality mass from recorded live weight or documented class average; Raw aggregation requirements: sum by output identity and hand-off; distinguish intended product, internal use, residue, and waste. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, L, and head"
      frequency: "each output or loss event"
      temporal_coverage: "complete cohort or reporting period"
      site_scope: "all represented flock groups and output gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale or meter records, invoice, transfer document, mortality and waste log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure_and_emissions
      process_id: "managed_sheep_production"
      flow_role: "manure routing, enteric CH4, manure CH4, and direct N2O"
      record_type: "animal population, feed, excretion, manure-pathway and climate records"
      raw_fields: "animal class; head or animal-days; live weight; feed or gross energy; nitrogen intake; manure pathway; storage duration; climate; method tier; factors"
      collection_method: "collect flock and manure records and calculate with the declared reviewed method; Raw aggregation requirements: calculate by class, phase, and manure pathway, then aggregate without duplicating deposited, stored, applied, or exported manure. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg CH4, kg N2O or kg N2O-N, and kg manure"
      frequency: "monthly or phase"
      temporal_coverage: "all biological phases and manure pathways"
      site_scope: "grazing parcels, housing, storage, treatment, application, and export points"
      aggregation_rule: "per reference flow"
      quality_evidence: "source records, method worksheet, factor provenance, independent pathway reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_pathway_emissions
      process_id: "managed_sheep_production"
      flow_role: "pathway-specific gases and manure N/C"
      record_type: "herd, feed, manure, field and method ledger"
      raw_fields: "species/class; animal-days; intake/DM/digestibility; volatile solids; manure N/TAN; system shares; climate; storage time; fertiliser N; grazing; volatilisation/leaching; methane recovery; factor source/unit; final accepted output ; collected manure wet mass; dry matter; destination"
      collection_method: "collect primary activity by node and period, document parameter applicability, retain each pathway worksheet and any linked treatment/pasture dataset  Retain raw totals and normalize attributed quantities once to the measured accepted final reference output."
      unit: "animal-day; kg DM; kg VS; kg N; kg CH4; kg N2O; kg NH3"
      frequency: "each operating period and management change"
      temporal_coverage: "complete represented cohort and service period"
      site_scope: "actual operated nodes only"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter/analysis records, nitrogen cascade, method and factor evidence, no-duplication ledger"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "managed_sheep_production"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "managed_sheep_production"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: normalize_to_reference_live_weight
      applies_to: "all inventory rows"
      rule: "normalized amount = period amount / farm-gate transferred live-weight mass. Preserve raw period and animal-class records."
      inputs:
        - "period amount"
        - "transferred live-weight mass"
      output: "amount per kg reference live weight"
      source_ids:
        - fao-leap-small-ruminants-2016
    - id: reconcile_flock_balance
      applies_to: "flock events"
      rule: "opening head + entries + births = closing head + live transfers + live sales + mortalities, with class changes linked rather than treated as new animals."
      inputs:
        - "flock-event records"
      output: "head-count reconciliation and exceptions"
      source_ids:
        - fao-leap-small-ruminants-2016
    - id: calculate_feed_dry_matter
      applies_to: "feed and forage"
      rule: "dry-matter amount = as-fed amount multiplied by measured or supplier dry-matter fraction; pasture intake uses the declared reviewed estimation method."
      inputs:
        - "as-fed mass"
        - "dry-matter fraction"
        - "pasture records"
      output: "kg feed dry matter"
      source_ids:
        - fao-leap-small-ruminants-2016
    - id: calculate_enteric_methane
      applies_to: "enteric methane"
      rule: "Apply the declared IPCC tier or reviewed method by sheep category and period; preserve activity data and factor provenance."
      inputs:
        - "animal category"
        - "population or animal-days"
        - "feed or gross energy"
        - factors
      output: "kg CH4"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: calculate_manure_emissions
      applies_to: "manure methane and direct nitrous oxide"
      rule: "Apply the declared reviewed equations by animal category, excretion and manure pathway. Retain raw N-basis records; before final normalization convert kg N2O-N to kg N2O by 44/28. Values already expressed as compound mass are not converted again. The final fixed-UUID exchange uses the mass of its named compound, never the N-basis amount."
      inputs:
        - "animal records"
        - "feed nitrogen or excretion"
        - "manure pathway"
        - climate
        - factors
      output: "kg CH4 and kg N2O"
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrient-flows-2018
    - id: calculate_transport_service
      applies_to: "included inbound road transport"
      rule: "transport service = transported mass in tonnes multiplied by one-way included distance in kilometres."
      inputs:
        - "cargo mass"
        - distance
      output: "t*km"
      source_ids:
        - fao-leap-small-ruminants-2016
    - id: calc_pathway_emissions
      applies_to: "managed_sheep_production"
      rule: "Use species- and management-compatible methods and retain disaggregated pathway totals. Convert N2O-N to N2O by 44/28 and NH3-N to NH3 by 17/14 exactly once; already molecular masses are not reconverted. Check methane against the documented available-carbon/methane-potential balance and nitrogen losses against each stage's available N. Indirect formation from previously volatilised N is a downstream transformation, not a second source-stage N loss. Attribute and normalize once; do not duplicate linked treatment or fate-model emissions.  Use matched raw-period quantities before allocation for physical screens: CH4 mass × 12/16 must not exceed the carbon available to the represented pathway; source-stage NH3 mass × 14/17 plus direct N2O mass × 28/44 and other source N losses must not exceed that stage's available N, after accounting for stocks and transfers. Bound each indirect N2O-N calculation by its documented volatilised or leached N precursor, not by subtracting that downstream transformation again from the source ledger. These are conservation checks, not emission factors or an empirical per-product range."
      inputs:
        - cp_pathway_emissions
      output: "kg named compound per final reference flow"
      source_ids:
        - ipcc-2019-livestock-manure
        - review-eea-manure-2023
        - review-ipcc-soils-2019
    - id: calc_feed_supply_and_intake
      applies_to: "feed_forage_supply"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
    - id: calc_manure_n2o_coverage
      applies_to: "manure_direct_n2o_air; review_managed_sheep_production_indirect_n2o"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-2019-livestock-manure
        - review-ipcc-soils-2019
  data_quality_requirements:
    - id: identity_and_gate
      applies_to: "reference output"
      requirement: "Declare animal class and purpose, route, geography, cohort or period, weighing point, live-weight convention, and farm-gate transfer."
      evidence: "flock register, scale record, transfer document, dataset metadata"
    - id: route_specificity
      applies_to: "all inputs and outputs"
      requirement: "Keep extensive or transhumant, mixed, and housed or intensive route records separate where their feed, movement, infrastructure, manure, or emission requirements differ."
      evidence: "route description, grazing and housing records, aggregation worksheet"
    - id: temporal_completeness
      applies_to: "flock and asset records"
      requirement: "Cover all material biological phases and events contributing to the declared output; disclose partial-cycle data and upstream datasets."
      evidence: "flock calendar, event register, replacement and culling records"
    - id: output_and_loss_completeness
      applies_to: "all output categories"
      requirement: "Reconcile live sheep, wool, milk, exported manure, mortalities, closing stock, and internal uses; explain every omitted conditional output."
      evidence: "output, transfer, inventory, mortality, and waste records"
    - id: manure_pathway_consistency
      applies_to: "nutrient and emission rows"
      requirement: "Reconcile pasture deposition, housing collection, storage, treatment, application, export, and waste so the same manure or nitrogen is not assigned twice."
      evidence: "manure pathway worksheet, land application and transfer records"
    - id: shared_burden_traceability
      applies_to: "shared infrastructure and services"
      requirement: "Retain consuming groups, service periods, measurements, allocation driver, and evidence that the burden was counted once."
      evidence: "meters, operating logs, animal-day or live-weight-time worksheet"
validation_rules:
  - rule_id: validate_reference_identity
    applies_to: "reference output"
    rule: "Reject a dataset that substitutes sheep meat, wool, milk, skin, goat, or a service identity for live sheep, or that omits the farm-gate live-weight basis. A concrete dataset must resolve one compatible platform UUID before publication."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_route_resolution
    applies_to: "alternative route variants"
    rule: "Require one declared route or a transparent aggregation of separately recorded routes. Confirm that feed, movement, housing, infrastructure, manure, energy, and emission records match the declared route delta."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_period_linkage
    applies_to: "multi-period flock production"
    rule: "Require opening and closing stock, entries, births, transfers, sales, culls, mortalities, and output events to reconcile by class and period; prevent replacement, breeding, asset, or output burdens from being attributed in two periods."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_output_attribution
    applies_to: "live sheep and conditional co-products"
    rule: "Require complete intended-output and loss sets, each hand-off, direct partitioning evidence, and one disclosed residual allocation method. Prevent wool, milk, manure, cull stock, or breeding stock from being counted at two hand-offs."
    source_ids:
      - fao-leap-small-ruminants-2016
      - fao-leap-nutrient-flows-2018
  - rule_id: validate_shared_infrastructure
    applies_to: "shared housing, fencing, water, handling, shearing, vehicles, and manure systems"
    rule: "Require at least two consuming groups, activities, or periods, a service boundary, a documented attribution driver, and evidence that the same shared burden is not duplicated."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_manure_and_emissions
    applies_to: "enteric and manure emission rows"
    rule: "Require animal category, activity data, manure pathway, method tier, factor provenance, gas species and basis, and pathway reconciliation. Reject use of IPCC factors as measured farm inventory amounts."
    source_ids:
      - ipcc-2019-livestock-manure
      - fao-leap-nutrient-flows-2018
  - rule_id: validate_flow_identity_resolution
    applies_to: "unresolved water, energy, and transport cards"
    rule: "Require foreground generation to select one verified concrete UUID consistent with the actual product or carrier, property, unit, geography, and use; unresolved cards may not carry a fixed UUID."
    source_ids: []
  - rule_id: v_pathway_emission_coverage
    applies_to: "managed_sheep_production"
    rule: "Require a pathway coverage ledger for enteric CH4 where biologically applicable, manure CH4, direct/indirect N2O, NH3 and relevant field emissions. Every pathway needs a measured/calculated value, a named linked process with matching coverage, or supported inapplicability; absent data cannot become zero. Keep wild life before capture outside managed husbandry, assess actual managed holding separately, and retain species-specific evidence."
    source_ids:
      - ipcc-2019-livestock-manure
      - review-ipcc-soils-2019
      - review-eea-manure-2023
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-2019-livestock-manure
      - review-ipcc-soils-2019
published_dataset_profile:
  dataset_role: "Foreground farm-level data package for live sheep production and transfer."
  downstream_use: "secondary_dataset; background_dataset after review of identity, allocation, temporal completeness, and geographic and route representativeness."
  allowed_use: "Farm-gate inventories for live sheep with matching animal class, purpose, production route, geography, period, and live-weight basis; inputs to downstream transport, slaughter, meat, wool, milk, or breeding models."
  excluded_use: "Sheep meat or carcass production, wool-only or milk-only reference products, goats, veterinary or husbandry services, slaughterhouse operations, or post-farm transport without separate processes."
  required_metadata: "CPC reference; animal class and purpose; sex where material; breed or genotype where material; route; grazing or housing regime; feed basis; manure pathways; geography; cohort or reporting period; shared-asset treatment; weighing point; live-weight convention; farm-gate transfer."
  required_quality_disclosure: "Unresolved reference UUID; foreground coverage; missing phases; estimation methods; route aggregation; allocation and price basis; shared-infrastructure drivers; manure and emission method tiers and factor provenance; Range overrides."
  update_trigger: "New compatible reference-flow identity; revised CPC boundary; changed farm-gate convention; material new route or co-product evidence; revised livestock or manure method; or reviewed evidence replacing provisional ranges."
data_sources:
  - id: "fao-leap-small-ruminants-2016"
    type: "official_guidance"
    reference: "FAO LEAP, *Greenhouse gas emissions and fossil energy use from small ruminant supply chains*, 2016. <https://openknowledge.fao.org/handle/20.500.14283/i6434en> (retrieved 2026-09-29)."
    used_for: "sheep supply-chain boundary, route and process decomposition, foreground records, allocation, output and period requirements"
  - id: "fao-leap-nutrient-flows-2018"
    type: "official_guidance"
    reference: "FAO LEAP, *Nutrient flows and associated environmental impacts in livestock supply chains*, 2018. <https://openknowledge.fao.org/handle/20.500.14283/ca1328en> (retrieved 2026-09-29)."
    used_for: "manure and nutrient pathways, exported manure distinction, pathway reconciliation and quality requirements"
  - id: "ipcc-2019-livestock-manure"
    type: "method_factor"
    reference: "IPCC, *2019 Refinement to the 2006 IPCC Guidelines, Volume 4, Chapter 10: Emissions from Livestock and Manure Management*. <https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf> (retrieved 2026-09-29)."
    used_for: "animal-category, feed, enteric methane, manure methane, direct nitrous oxide, method-tier, factor-provenance, and species-basis rules"
  - id: "review-eea-manure-2023"
    type: "official_guidance"
    reference: "[EMEP/EEA Air Pollutant Emission Inventory Guidebook 2023, 3.B Manure Management](https://www.eea.europa.eu/en/analysis/publications/emep-eea-guidebook-2023/part-b-sectoral-guidance-chapters/3-agriculture/3-b-manure-management-2023)"
    used_for: "NH3 nitrogen-flow method; verify actual species, management and geographical applicability before adopting parameters"
  - id: "review-ipcc-soils-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 11: N2O Emissions from Managed Soils](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf)"
    used_for: "Managed-soil direct and indirect nitrogen pathways and boundary reconciliation"
  - id: "fao-feed-loss-accounting-2018"
    type: "official_guidance"
    reference: "[FAO 2018, Environmental performance of pig supply chains, section 11.2.2](https://www.fao.org/4/i8686en/I8686EN.pdf)"
    used_for: "Feed supply versus intake and waste burden, not animal parameters. Applying this accounting principle to the declared taxon is this PCR's methodological choice; no pig diet or emission factor is transferred."
  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
