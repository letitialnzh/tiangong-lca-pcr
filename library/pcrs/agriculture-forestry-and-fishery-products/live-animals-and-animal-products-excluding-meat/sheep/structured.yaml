  - id: "fao-leap-small-ruminants-2016"
    type: "official_guidance"
    reference: "FAO LEAP, *Greenhouse gas emissions and fossil energy use from small ruminant supply chains*, 2016. <https://openknowledge.fao.org/handle/20.500.14283/i6434en> (retrieved 2026-09-29)."
    used_for: "sheep supply-chain boundary, route and process decomposition, foreground records, allocation, output and period requirements"
  - id: "fao-leap-nutrient-flows-2018"
    type: "official_guidance"
    reference: "FAO LEAP, *Nutrient flows and associated environmental impacts in livestock supply chains*, 2018. <https://openknowledge.fao.org/handle/20.500.14283/ca1328en> (retrieved 2026-09-29)."
    used_for: "manure and nutrient pathways, exported manure distinction, pathway reconciliation and quality requirements"
  - id: "ipcc-2019-livestock-manure"
    type: "method_factor"
    reference: "IPCC, *2019 Refinement to the 2006 IPCC Guidelines, Volume 4, Chapter 10: Emissions from Livestock and Manure Management*. <https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf> (retrieved 2026-09-29)."
    used_for: "animal-category, feed, enteric methane, manure methane, direct nitrous oxide, method-tier, factor-provenance, and species-basis rules"
