allocation_rules:
  - rule_id: egg_output_precedence
    applies_to: "shell eggs, spent hens, exported manure"
    rule: "Assign separable activities directly. For residual inseparable burdens shared by independently transferred outputs, prefer evidenced physical causality; if unavailable, use period-matched farm-gate economic allocation with shares and sensitivity disclosed. Waste and loss receive no product share."
    source_ids:
      - fao-leap-poultry-2016
      - fao-leap-nutrients-2018
  - rule_id: replacement_period
    applies_to: "rearing and laying cohorts"
    rule: "Spread replacement burden over actual represented laying service and output; reconcile start/end flock stocks and avoid repeating purchased-pullet and on-site rearing burdens."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: shared_asset
    applies_to: "housing, collection and optional equipment"
    rule: "Allocate buildings and services to consuming nodes, cohorts and periods by metered use, operating time or throughput; record driver and service period; count once."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: grade_loss
    applies_to: "graded and rejected eggs"
    rule: "Preserve each independent grade/destination handover. Aggregate same-category saleable eggs only after grade metadata is retained; processing-bound products and waste remain separate."
    source_ids:
      - fao-small-poultry-production
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_flock_events
      process_id: "layer_husbandry"
      flow_role: "pullets and spent hens"
      record_type: "flock and transfer log"
      raw_fields: "cohort, route, entry/exit date, count, mass, purpose, destination"
      collection_method: "registers and calibrated lot scale; Raw aggregation requirements: assign events to laying service and saleable egg mass. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "each entry/exit"
      temporal_coverage: "full represented cohort"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "dated log and scale calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed
      process_id: "layer_husbandry"
      flow_role: "diets"
      record_type: "deliveries and inventory"
      raw_fields: "feed source, as-fed mass, dry matter, phase, refusal and stock"
      collection_method: "invoices, bins and feed log; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg as fed; kg dry"
      frequency: "delivery and monthly"
      temporal_coverage: "full cohort"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice and inventory reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_water_energy
      process_id: "layer_husbandry"
      flow_role: "water and energy"
      record_type: "meters and invoices"
      raw_fields: "source, use, carrier, quantity, unit, period and shared-meter driver"
      collection_method: "meter and purchase log; Raw aggregation requirements: assign by use, retaining carriers separately. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3; kWh; MJ"
      frequency: "monthly"
      temporal_coverage: "full cohort"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter and invoice; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure_emissions
      process_id: "layer_husbandry"
      flow_role: "manure, mortality, gases"
      record_type: "manure and nitrogen log"
      raw_fields: "N input, manure mass/moisture, storage, handling, transfer, mortality, pathway and factor"
      collection_method: "farm log, samples and pathway method; Raw aggregation requirements: pathway calculation and transfer normalization. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg wet; kg dry; kg N; kg gas"
      frequency: "monthly and each transfer"
      temporal_coverage: "full cohort"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "sample, transfer receipt and method version; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_eggs_collection
      process_id: "egg_collection"
      flow_role: "eggs and losses"
      record_type: "collection and handover ledger"
      raw_fields: "date, cohort, count, laid/collected/saleable mass, broken eggs, storage"
      collection_method: "daily count, calibrated lot scale and handover ticket; Raw aggregation requirements: reconcile each active node and normalize to 1 kg saleable eggs. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "eggs; kg"
      frequency: "every collection/handover"
      temporal_coverage: "full represented period"
      site_scope: "producing farm"
