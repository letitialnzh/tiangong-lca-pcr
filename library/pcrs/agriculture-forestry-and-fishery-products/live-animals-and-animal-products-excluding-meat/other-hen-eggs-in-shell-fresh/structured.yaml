  - id: "fao-leap-poultry-2016"
    type: "official_guidance"
    reference: "FAO LEAP, Greenhouse gas emissions and fossil energy use from poultry supply chains (2016), https://openknowledge.fao.org/handle/20.500.14283/i6421en"
