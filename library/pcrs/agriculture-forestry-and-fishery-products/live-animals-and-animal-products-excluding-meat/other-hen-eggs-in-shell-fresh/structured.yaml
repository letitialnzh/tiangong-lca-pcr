    used_for: "Manure pathway gases."
  - id: "fao-leap-nutrients-2018"
    type: "official_guidance"
    reference: "FAO LEAP, Nutrient flows and associated environmental impacts in livestock supply chains (2018), https://openknowledge.fao.org/handle/20.500.14283/ca1328en"
    used_for: "Manure and nitrogen records."
  - id: "fao-leap-water-livestock-2019"
    type: "official_guidance"
    reference: "FAO LEAP, Water use in livestock production systems and supply chains (2019), https://www.fao.org/partnerships/leap/resources/publications/"
    used_for: "Supplied-water distinction."
  - id: "fao-small-poultry-production"
    type: "extension_guidance"
    reference: "FAO, Small-scale poultry production, https://www.fao.org/4/y5169e/y5169e0a.htm"
    used_for: "Farm collection and conditional grading/packing gate."
  - id: "review-ipcc-soils-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 11: N2O Emissions from Managed Soils](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf)"
    used_for: "Managed-soil direct and indirect nitrogen pathways and boundary reconciliation"
  - id: "review-eea-manure-2023"
    type: "official_guidance"
    reference: "[EMEP/EEA Air Pollutant Emission Inventory Guidebook 2023, 3.B Manure Management](https://www.eea.europa.eu/en/analysis/publications/emep-eea-guidebook-2023/part-b-sectoral-guidance-chapters/3-agriculture/3-b-manure-management-2023)"
    used_for: "NH3 nitrogen-flow method; verify actual species, management and geographical applicability before adopting parameters"
  - id: "fao-feed-loss-accounting-2018"
    type: "official_guidance"
    reference: "[FAO 2018, Environmental performance of pig supply chains, section 11.2.2](https://www.fao.org/4/i8686en/I8686EN.pdf)"
    used_for: "Feed supply versus intake and waste burden, not animal parameters. Applying this accounting principle to the declared taxon is this PCR's methodological choice; no pig diet or emission factor is transferred."
  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
