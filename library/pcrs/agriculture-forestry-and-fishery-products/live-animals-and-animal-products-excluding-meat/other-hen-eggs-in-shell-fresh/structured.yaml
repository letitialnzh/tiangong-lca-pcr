system_boundary:
  rules:
    - rule_id: layer_farm_boundary
      applies_to: "all routes"
      rule: "Include managed laying, replacement, feed, water, housing, manure, direct emissions and egg collection through farm-gate handover; exclude external grading/packing plants and distribution."
      source_ids:
        - fao-leap-poultry-2016
        - fao-small-poultry-production
    - rule_id: route_delta
      applies_to: "cage, barn, free-range and evidenced variants"
      rule: "Declare parent managed biological production and route-specific housing, outdoor access, feed, litter/manure, energy, calculation and QA differences. Keep mutually exclusive cohorts separate until normalized."
      source_ids:
        - fao-leap-poultry-2016
        - ipcc-2019-livestock-manure
    - rule_id: collection_handover
      applies_to: "eggs leaving laying area"
      rule: "Independently count, weigh and hand over shell eggs from layer production to collection; reconcile intact output and loss before grading or sale."
      source_ids:
        - fao-small-poultry-production
    - rule_id: conditional_grading_packing
      applies_to: "farm grading or packing"
      rule: "Activate grading only with at least two declared grade/destination states and record each handover; activate packing only with actual farm material, reuse and product-state records. External facilities are out of scope."
      source_ids:
        - fao-small-poultry-production
    - rule_id: period_shared_assets
      applies_to: "replacement and shared services"
      rule: "Link pullet rearing, laying, flock exit, housing, collection and optional grading/packing assets to consuming nodes and periods, counting each burden once."
      source_ids:
        - fao-leap-poultry-2016
