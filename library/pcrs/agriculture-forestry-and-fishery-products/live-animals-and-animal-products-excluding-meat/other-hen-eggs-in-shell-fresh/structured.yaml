allocation_rules:
  - rule_id: egg_output_precedence
    applies_to: "shell eggs, spent hens, exported manure"
    rule: "Assign separable activities directly. For residual inseparable burdens shared by independently transferred outputs, prefer evidenced physical causality; if unavailable, use period-matched farm-gate economic allocation with shares and sensitivity disclosed. Waste and loss receive no product share."
    source_ids:
      - fao-leap-poultry-2016
      - fao-leap-nutrients-2018
  - rule_id: replacement_period
    applies_to: "rearing and laying cohorts"
    rule: "Spread replacement burden over actual represented laying service and output; reconcile start/end flock stocks and avoid repeating purchased-pullet and on-site rearing burdens."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: shared_asset
    applies_to: "housing, collection and optional equipment"
    rule: "Allocate buildings and services to consuming nodes, cohorts and periods by metered use, operating time or throughput; record driver and service period; count once."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: grade_loss
    applies_to: "graded and rejected eggs"
    rule: "Preserve each independent grade/destination handover. Aggregate same-category saleable eggs only after grade metadata is retained; processing-bound products and waste remain separate."
    source_ids:
      - fao-small-poultry-production
dataset_production:
  collection_protocols:
    - protocol_id: cp_flock_events
      process_id: "layer_husbandry"
      flow_role: "pullets and spent hens"
      record_type: "flock and transfer log"
      raw_fields: "cohort, route, entry/exit date, count, mass, purpose, destination"
      collection_method: "registers and calibrated lot scale; Raw aggregation requirements: assign events to laying service and saleable egg mass. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "each entry/exit"
      temporal_coverage: "full represented cohort"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "dated log and scale calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed
      process_id: "layer_husbandry"
      flow_role: "diets"
      record_type: "deliveries and inventory"
      raw_fields: "feed source, as-fed mass, dry matter, phase, refusal and stock"
      collection_method: "invoices, bins and feed log; Raw aggregation requirements: net feed by phase per kg saleable eggs. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg as fed; kg dry"
      frequency: "delivery and monthly"
      temporal_coverage: "full cohort"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice and inventory reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_water_energy
      process_id: "layer_husbandry"
      flow_role: "water and energy"
      record_type: "meters and invoices"
      raw_fields: "source, use, carrier, quantity, unit, period and shared-meter driver"
      collection_method: "meter and purchase log; Raw aggregation requirements: assign by use, retaining carriers separately. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "m3; kWh; MJ"
      frequency: "monthly"
      temporal_coverage: "full cohort"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter and invoice; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure_emissions
      process_id: "layer_husbandry"
      flow_role: "manure, mortality, gases"
      record_type: "manure and nitrogen log"
      raw_fields: "N input, manure mass/moisture, storage, handling, transfer, mortality, pathway and factor"
      collection_method: "farm log, samples and pathway method; Raw aggregation requirements: pathway calculation and transfer normalization. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg wet; kg dry; kg N; kg gas"
      frequency: "monthly and each transfer"
      temporal_coverage: "full cohort"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "sample, transfer receipt and method version; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_eggs_collection
      process_id: "egg_collection"
      flow_role: "eggs and losses"
      record_type: "collection and handover ledger"
      raw_fields: "date, cohort, count, laid/collected/saleable mass, broken eggs, storage"
      collection_method: "daily count, calibrated lot scale and handover ticket; Raw aggregation requirements: reconcile each active node and normalize to 1 kg saleable eggs. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "eggs; kg"
      frequency: "every collection/handover"
      temporal_coverage: "full represented period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "count sheets, scale and rejection log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_farm_gate_handover
      process_id: "farm_gate_handover"
      flow_role: "final reference eggs"
      record_type: "farm transfer ledger"
      raw_fields: "source node, cohort, lot, grade, fresh shell-on state, count, mass, packing, storage, date and recipient"
      collection_method: "calibrated lot scale and transfer ticket; Raw aggregation requirements: sum measured saleable mass by lot and reconcile to upstream active node. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "eggs; kg"
      frequency: "each farm-gate transfer"
      temporal_coverage: "full represented reporting period"
      site_scope: "producing farm gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed transfer record, scale and lot trace; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grading_packing
      process_id: "farm_grading_farm_packing"
      flow_role: "conditional grades and packages"
      record_type: "lot and material ledger"
      raw_fields: "incoming count/mass, grade, destination, rejects, package type/mass/count/reuse"
      collection_method: "sorting log and material issue/return; Raw aggregation requirements: reconcile each grade and package stock. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "eggs; kg; packages"
      frequency: "each active lot"
      temporal_coverage: "periods when nodes operate"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "lot trace, receipts and rejects; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: egg_balance
      applies_to: "each active node"
      rule: "Incoming shell-egg mass equals accepted output plus downgraded output plus rejects plus measured stock change within declared uncertainty."
      inputs:
        - "lot mass"
        - grade
        - "rejects and inventory"
      output: "reconciled kg saleable eggs"
      source_ids:
        - fao-small-poultry-production
    - id: normalize_reference
      applies_to: "inventory"
      rule: "Divide cohort/period amounts by kg saleable shell-on eggs actually handed over at producing farm gate."
      inputs:
        - "period totals and saleable mass"
      output: "amount per 1 kg reference"
      source_ids:
        - fao-leap-poultry-2016
    - id: manure_gases
      applies_to: "manure pathways"
      rule: "Apply pathway-specific official method to collected manure N; preserve kg N2O versus N2O-N and kg NH3 versus NH3-N."
      inputs:
        - flock
        - N
        - "pathway and factor"
      output: "gas mass by substance"
      source_ids:
        - ipcc-2019-livestock-manure
        - fao-leap-nutrients-2018
    - id: period_assets
      applies_to: "replacement and shared assets"
      rule: "Allocate observed rearing and asset burdens across consuming periods/nodes with evidenced service driver; allocated total equals source total."
      inputs:
        - "flock events"
        - "service periods and node use"
      output: "assigned burdens"
      source_ids:
        - fao-leap-poultry-2016
  data_quality_requirements:
    - id: reference_identity
      applies_to: "reference eggs"
      requirement: "Prove fresh shell-on non-hatching state and producing farm-gate handover; consumption mix or hatching egg cannot substitute."
      evidence: "product, lot and transfer records"
    - id: coverage
      applies_to: "all nodes"
      requirement: "Declare full or partial cohort period and activate grading/packing only from real farm activity."
      evidence: "flock and lot dates"
    - id: egg_mass
      applies_to: "outputs and losses"
      requirement: "Reconcile count and measured mass across production, collection, active optional nodes and handover."
      evidence: "scales, ledger and reject log"
    - id: route_period
      applies_to: "housing, manure and assets"
      requirement: "Retain route-specific pathways, phase links and allocation drivers before aggregation."
      evidence: "husbandry, manure and service records"
validation_rules:
  - rule_id: reference_gate
    applies_to: "saleable reference eggs"
    rule: "Require fresh shell-on non-hatching hen eggs, 1 kg measured saleable mass and producing farm gate. Reject consumption mix as fixed farm reference."
    source_ids:
      - fao-small-poultry-production
  - rule_id: node_gate
    applies_to: "process map"
    rule: "Require managed laying and independent collection. Activate farm grading/packing only from lot evidence and exclude external plants."
    source_ids:
      - fao-small-poultry-production
  - rule_id: output_gate
    applies_to: "grades, spent hens and manure"
    rule: "Verify each intended co-product handover; reject waste as product; reconcile each active node and preserve destination."
    source_ids:
      - fao-leap-poultry-2016
      - fao-small-poultry-production
  - rule_id: period_gate
    applies_to: "replacement and shared assets"
    rule: "Check cohort/phase links, rearing treatment, asset consumers and conservation of burden across periods, without duplicate counting."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: exchange_gate
    applies_to: "concrete process exchanges"
    rule: "Require verified concrete flow UUID, property and unit before downstream TIDAS process construction; candidate PCR gaps stay explicit."
    source_ids:
      - fao-leap-poultry-2016
published_dataset_profile:
  dataset_role: "Foreground farm-gate data package for fresh non-hatching hen eggs in shell."
  downstream_use: "secondary_dataset or background_dataset after review and concrete exchange resolution."
  allowed_use: "Declared layer route with actual collection, optional on-farm grading/packing and measured saleable shell mass."
  excluded_use: "Hatching or other-bird eggs, shell-less/processed eggs, external grading/packing and post-farm distribution."
  required_metadata: "Cohort, housing route, period, grade/count/mass, storage/packing, manure path, co-products, allocation, shared assets and flow identities."
  required_quality_disclosure: "Record coverage, egg and N balances, provisional ranges, route/period allocation, unresolved identities and uncertainty."
  update_trigger: "Change in product boundary, farm route, optional node, method, allocation basis or verified flow."
