system_boundary:
  rules:
    - rule_id: one_final_state
      applies_to: "Final lot"
      rule: "Choose exactly one warm or chilled final producing-farm milk state; intermediate transfers are not additional final sold milk."
      source_ids:
        - un-cpc-3-2025
    - rule_id: milking_capture
      applies_to: "Ewe milk"
      rule: "Separate milking from herd biological production because collection establishes measured saleable milk versus spill/reject before conditioning."
      source_ids:
        - fao-small-ruminant-dairy
    - rule_id: first_conditioning
      applies_to: "Optional straining"
      rule: "Include only actually operated first filtration with warm collected input, prepared raw output, material input and rejects; no heat treatment."
      source_ids:
        - fao-small-ruminant-dairy
    - rule_id: farm_chilling
      applies_to: "Optional cooling"
      rule: "Include only actual farm cooling, recording warm input, energy, chilled raw output, losses and final temperature."
      source_ids:
        - fao-small-ruminant-dairy
    - rule_id: pasture_housed_delta
      applies_to: "Alternative herd regimes"
      rule: "Both retain managed ewe production; pasture changes grazed-feed measurement and manure placement, while housed/concentrate management changes feed sourcing, housing water and manure storage. Choose evidenced categories and calculation per flock-period, splitting documented mixed periods."
      source_ids:
        - fao-small-ruminant-dairy
    - rule_id: period_shared
      applies_to: "Herd and milk nodes"
      rule: "Link breeding, lactation, dry and replacement periods and shared parlour/tank/pump services to beneficiary output batches once."
      source_ids:
        - fao-leap-small-ruminants-2016
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
