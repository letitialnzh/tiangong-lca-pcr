  calculation_rules:
    - id: feed_consumed
      applies_to: "Ewe feed"
      rule: "Opening stock + deliveries/harvest − closing stock − returns; pasture intake separately evidenced."
      inputs:
        - stocks
        - supply
        - grazing
      output: "kg feed by type/period"
      source_ids:
        - mass-balance-identity
    - id: milk_volume_mass
      applies_to: "Volume records"
      rule: "Milk kg = measured L × lot-measured density, not a universal density."
      inputs:
        - L
        - density
        - temp
      output: "kg raw milk"
      source_ids:
        - mass-balance-identity
    - id: milk_balance
      applies_to: "Milking to handover"
      rule: "At each node input milk = accepted output + rejected/lost milk within meter uncertainty; internal transfer not sale twice."
      inputs:
        - input
        - accepted
        - rejects
      output: "kg accepted and lost"
      source_ids:
        - mass-balance-identity
    - id: herd_ch4_n2o
      applies_to: "Enteric/manure emissions"
      rule: "Use observed ewe class, feed, volatile solids/N and manure pathway with documented method tier; UUID is not a factor."
      inputs:
        - herd
        - feed
        - VS
        - N
        - pathway
        - factor
      output: "kg CH4/N2O separately"
      source_ids:
        - ipcc-livestock-2019
    - id: nh3_measurement
      applies_to: "Manure NH3"
      rule: "Use independent measured NH3 or separately sourced compatible method, not CH4/N2O factor."
      inputs:
        - "NH3 observation/method"
      output: "kg NH3"
      source_ids: []
    - id: shared_reconcile
      applies_to: "Shared parlour/chiller"
      rule: "Node-period shares sum to measured service total within uncertainty."
      inputs:
        - meter
        - "time/throughput"
      output: "allocated service"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Final milk"
      requirement: "Record ovine herd/breed, farm/gate, batch, raw/warm/chilled state, temperature and mass."
      evidence: "herd register; acceptance note; tank log"
    - id: dq_route
      applies_to: "All nodes"
      requirement: "Identify pasture/housed periods, actual conditioning/chilling, lamb suckling/retention, purchased/internal inputs."
      evidence: "enterprise map; herd/milk ledger"
    - id: dq_complete
      applies_to: "Milk, feed, water, energy, manure"
      requirement: "Reconcile whole-period inputs/outputs, missing data, losses, manure fate and co-output handovers."
      evidence: "stock, meter, sales/disposal"
    - id: dq_attribution
      applies_to: "Joint and shared"
      requirement: "Archive period, physical/economic allocation basis, shares and sensitivity; prevent duplicate burden."
      evidence: "attribution worksheet"
validation_rules:
  - rule_id: validate_raw_state
    applies_to: "Final reference"
    rule: "Verify unheated, unseparated ovine raw milk and exactly one warm/chilled farm-gate product; chilled UUID cannot fill broad reference or warm output."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_balance
    applies_to: "Milk nodes"
    rule: "Reconcile collected, filtered, chilled and accepted lots with rejects; no intermediate milk sold-final twice."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_outputs
    applies_to: "Herd allocation"
    rule: "Check milk, sold lambs/culls, actual wool/manure transfer, mortality and unsold manure status/gates before allocation."
    source_ids:
      - fao-small-ruminant-dairy
  - rule_id: validate_periods
    applies_to: "Herd/milking"
    rule: "Link breeding, lactation, dry and replacement periods/events to benefiting milk and animals once."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_shared
    applies_to: "Shared assets"
    rule: "Identify all parlour, tank, pump, chiller and meter consumers/periods; reconcile allocated shares to totals."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_route
    applies_to: "Pasture/housed"
    rule: "Require actual feed, water and manure evidence; never stack incompatible route assumptions."
    source_ids:
      - fao-small-ruminant-dairy
published_dataset_profile:
  dataset_role: "Foreground package for one producing-farm raw sheep-milk lot."
  downstream_use: "After review, may become secondary_dataset or background_dataset for process/lifecyclemodel projection."
  allowed_use: "Declared ovine raw milk state and farm gate with measured mass, herd/period, inputs, emissions, losses and co-outputs."
  excluded_use: "Processed/skimmed milk, inferred chilled state, collection-centre gate or undeclared joint-output assumptions."
  required_metadata: "Farm/gate, herd/breed, milking lot, warm/chilled state, temperature, raw conditioning, period and verified concrete flow selection."
  required_quality_disclosure: "Feed/pasture measurement, lamb milk retention, milk loss, manure pathway, emission method, allocations and unresolved identities/ranges."
  update_trigger: "Changed product state/gate, herd route, manure system, allocation basis or verified UUID."
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Raw sheep milk classification/exclusion."
  - id: "fao-small-ruminant-dairy"
    type: "official_guidance"
    reference: "https://www.fao.org/dairy-production-products/dairy/small-ruminants/en"
    used_for: "Dairy sheep routes and output context."
  - id: "fao-leap-small-ruminants-2016"
    type: "official_guidance"
    reference: "https://openknowledge.fao.org/handle/20.500.14283/i6434en"
    used_for: "Small-ruminant LCA boundary, allocation and activity data."
  - id: "ipcc-livestock-2019"
    type: "method_factor"
    reference: "https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf"
    used_for: "Enteric and manure CH4/N2O methods."
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation of measured milk, material and service quantities"
    used_for: "QA identity, not empirical sheep-milk factor."
