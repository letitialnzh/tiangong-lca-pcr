allocation_rules:
  - rule_id: output_census
    applies_to: "Ewe herd"
    rule: "Enumerate raw milk, independently sold lambs/culls, wool if shorn and sold, and exported manure at actual handovers. Mortality and unsold manure remain waste/residue. A sold-wool exchange must be added from actual records."
    source_ids:
      - fao-small-ruminant-dairy
  - rule_id: allocation_precedence
    applies_to: "Joint herd outputs"
    rule: "Subdivide measured activity where possible; otherwise use documented physical causality where defensible, then contemporaneous economic value with period and sensitivity. No default substitution credit."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: period_attribution
    applies_to: "Breeding/lactation/replacement"
    rule: "Attribute feed, service, milk, lambs, culls and events to observed periods; carry cross-period burden once and disclose lamb milk retention."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: shared_attribution
    applies_to: "Parlour, tank, pump, meter"
    rule: "List every herd/milking/conditioning/chilling consumer and service period; allocate by metered use or documented time/throughput and reconcile to total without duplication."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_herd_inputs
      process_id: "ewe_herd"
      flow_role: "Feed, forage, water"
      record_type: "Feed stock/grazing and meter"
      raw_fields: "herd; period; feed type; stocks; pasture method; water source/meter"
      collection_method: "Reconcile intake by ewe class and period; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg"
      frequency: "per feed/meter interval"
      temporal_coverage: "full lactation and dry periods"
      site_scope: "ewe herd"
      aggregation_rule: "per reference flow"
      quality_evidence: "feed ledger; grazing estimate; meter; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_herd_outputs
      process_id: "ewe_herd"
      flow_role: "Lambs, culls, manure, mortality"
      record_type: "Birth/movement/sales/death"
      raw_fields: "herd; period; lamb/cull/death count and mass; manure mass; gate; destination"
      collection_method: "Count/weigh separate output, loss and mortality; Raw aggregation requirements: product versus waste by handover. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; head"
      frequency: "per event"
      temporal_coverage: "reproductive/replacement period"
      site_scope: "ewe herd"
      aggregation_rule: "per reference flow"
      quality_evidence: "birth/death register; scale; sales/disposal; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure_records
      process_id: "ewe_herd"
      flow_role: "Manure and air species"
      record_type: "Manure/N/enteric records"
      raw_fields: "ewe class; period; feed; manure pathway; volatile solids; N; CH4/N2O factor; independent NH3 observation"
      collection_method: "CH4/N2O by actual method; NH3 only measured or separately sourced; Raw aggregation requirements: one pathway per manure fraction. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg substance"
      frequency: "per herd period"
      temporal_coverage: "full housing/grazing/manure period"
      site_scope: "ewe herd/manure node"
      aggregation_rule: "per reference flow"
      quality_evidence: "analysis; method worksheet; NH3 record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_milking_lot
      process_id: "milking"
      flow_role: "Biological/collected/rejected milk"
      record_type: "Milking sheet and tank"
      raw_fields: "herd; ewe count; time; volume; density; temperature; mass; rejects"
      collection_method: "Meter each lot and reconcile retained/spilled milk; Raw aggregation requirements: sum accepted and loss by lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; L"
      frequency: "per milking"
      temporal_coverage: "full milking period"
      site_scope: "parlour"
      aggregation_rule: "per reference flow"
      quality_evidence: "tank calibration; milking log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_milking_services
      process_id: "milking"
      flow_role: "Hygiene water, energy, wastewater"
      record_type: "Meter/invoice and washdown"
      raw_fields: "lot; water; carrier; cleaning interval; wastewater destination"
      collection_method: "Assign shared services to lots; Raw aggregation requirements: reconcile water in/out. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; kWh; MJ"
      frequency: "per meter interval"
      temporal_coverage: "full milking period"
      site_scope: "parlour"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter; cleaning log; invoice; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_conditioning_lot
      process_id: "primary_conditioning"
      flow_role: "Milk, filter, rejects"
      record_type: "Filter/lot sheet"
      raw_fields: "lot; input mass; filter mass; accepted mass; residue; destination"
      collection_method: "Weigh/reconcile input, output and rejects; Raw aggregation requirements: one physical milk transfer. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "per lot"
      temporal_coverage: "full conditioning"
      site_scope: "farm conditioning"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale; filter log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_chilling_lot
      process_id: "farm_chilling"
      flow_role: "Warm/chilled milk, energy, loss"
      record_type: "Tank/meter"
      raw_fields: "lot; warm mass/temp; chilled mass/temp; energy; reject"
      collection_method: "Measure before/after state and carrier energy; Raw aggregation requirements: reconcile milk balance. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; °C; kWh; MJ"
      frequency: "per lot"
      temporal_coverage: "full chilling"
      site_scope: "farm chilling"
      aggregation_rule: "per reference flow"
      quality_evidence: "tank; meter log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_farm_handover
      process_id: "farm_handover"
      flow_role: "Warm/chilled final milk and loss"
      record_type: "Farm-gate acceptance"
      raw_fields: "lot; gate; raw status; mass; temp; sold/returned/lost"
      collection_method: "Weigh accepted milk and record one route; Raw aggregation requirements: normalize accepted milk to 1 kg. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; °C"
      frequency: "per lot"
      temporal_coverage: "milking to gate"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "delivery note; scale; temperature log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "ewe_herd"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "ewe_herd"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: feed_consumed
      applies_to: "Ewe feed"
      rule: "Opening stock + deliveries/harvest − closing stock − returns; pasture intake separately evidenced."
      inputs:
        - stocks
        - supply
        - grazing
      output: "kg feed by type/period"
      source_ids:
        - mass-balance-identity
    - id: milk_volume_mass
      applies_to: "Volume records"
      rule: "Milk kg = measured L × lot-measured density, not a universal density."
      inputs:
        - L
        - density
        - temp
      output: "kg raw milk"
      source_ids:
        - mass-balance-identity
    - id: milk_balance
      applies_to: "Milking to handover"
      rule: "At each node input milk = accepted output + rejected/lost milk within meter uncertainty; internal transfer not sale twice."
      inputs:
        - input
        - accepted
        - rejects
      output: "kg accepted and lost"
      source_ids:
        - mass-balance-identity
    - id: herd_ch4_n2o
      applies_to: "Enteric/manure emissions"
      rule: "Use observed ewe class, feed, volatile solids/N and manure pathway with documented method tier; UUID is not a factor."
      inputs:
        - herd
        - feed
        - VS
        - N
        - pathway
        - factor
      output: "kg CH4/N2O separately"
      source_ids:
        - ipcc-livestock-2019
    - id: nh3_measurement
      applies_to: "Manure NH3"
      rule: "Use independent measured NH3 or separately sourced compatible method, not CH4/N2O factor."
      inputs:
        - "NH3 observation/method"
      output: "kg NH3"
      source_ids: []
    - id: shared_reconcile
      applies_to: "Shared parlour/chiller"
      rule: "Node-period shares sum to measured service total within uncertainty."
      inputs:
        - meter
        - "time/throughput"
      output: "allocated service"
      source_ids:
        - mass-balance-identity
    - id: calc_feed_supply_and_intake
      applies_to: "herd_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
    - id: calc_manure_n2o_coverage
      applies_to: "manure_n2o"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-livestock-2019
        - ipcc-managed-soils-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Final milk"
      requirement: "Record ovine herd/breed, farm/gate, batch, raw/warm/chilled state, temperature and mass."
      evidence: "herd register; acceptance note; tank log"
    - id: dq_route
      applies_to: "All nodes"
      requirement: "Identify pasture/housed periods, actual conditioning/chilling, lamb suckling/retention, purchased/internal inputs."
      evidence: "enterprise map; herd/milk ledger"
    - id: dq_complete
      applies_to: "Milk, feed, water, energy, manure"
      requirement: "Reconcile whole-period inputs/outputs, missing data, losses, manure fate and co-output handovers."
      evidence: "stock, meter, sales/disposal"
    - id: dq_attribution
      applies_to: "Joint and shared"
      requirement: "Archive period, physical/economic allocation basis, shares and sensitivity; prevent duplicate burden."
      evidence: "attribution worksheet"
validation_rules:
  - rule_id: v_cpc_milk_scope
    applies_to: "final reference product and classification"
    rule: "Check the lot-matched measured milk-fat fraction is at least 3.5% (35 g/kg milk) and that the milk is neither skimmed nor partly skimmed. Reject use of this exact CPC-linked scope for lower-fat or separated milk; missing evidence leaves classification eligibility undetermined, not assumed. Do not reinterpret this as a quality acceptance limit or change the actual composition."
    source_ids:
      - un-cpc-3-02291
  - rule_id: validate_raw_state
    applies_to: "Final reference"
    rule: "Verify unheated, unseparated ovine raw milk and exactly one warm/chilled farm-gate product; chilled UUID cannot fill broad reference or warm output."
    source_ids:
      - un-cpc-3-2025
  - rule_id: validate_balance
    applies_to: "Milk nodes"
    rule: "Reconcile collected, filtered, chilled and accepted lots with rejects; no intermediate milk sold-final twice."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_outputs
    applies_to: "Herd allocation"
    rule: "Check milk, sold lambs/culls, actual wool/manure transfer, mortality and unsold manure status/gates before allocation."
    source_ids:
      - fao-small-ruminant-dairy
  - rule_id: validate_periods
    applies_to: "Herd/milking"
    rule: "Link breeding, lactation, dry and replacement periods/events to benefiting milk and animals once."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_shared
    applies_to: "Shared assets"
    rule: "Identify all parlour, tank, pump, chiller and meter consumers/periods; reconcile allocated shares to totals."
    source_ids:
      - fao-leap-small-ruminants-2016
  - rule_id: validate_route
    applies_to: "Pasture/housed"
    rule: "Require actual feed, water and manure evidence; never stack incompatible route assumptions."
    source_ids:
      - fao-small-ruminant-dairy
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-livestock-2019
      - ipcc-managed-soils-2019
published_dataset_profile:
  dataset_role: "Foreground package for one producing-farm raw sheep-milk lot."
  downstream_use: "After review, may become secondary_dataset or background_dataset for process/lifecyclemodel projection."
  allowed_use: "Declared ovine raw milk state and farm gate with measured mass, herd/period, inputs, emissions, losses and co-outputs."
  excluded_use: "Processed/skimmed milk, inferred chilled state, collection-centre gate or undeclared joint-output assumptions."
  required_metadata: "Farm/gate, herd/breed, milking lot, warm/chilled state, temperature, raw conditioning, period and verified concrete flow selection."
  required_quality_disclosure: "Feed/pasture measurement, lamb milk retention, milk loss, manure pathway, emission method, allocations and unresolved identities/ranges."
  update_trigger: "Changed product state/gate, herd route, manure system, allocation basis or verified UUID."
data_sources:
  - id: "un-cpc-3-02291"
    type: "official_guidance"
    reference: "[UN Statistics Division, CPC 3.0 02291: explanatory note](https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/02291)"
    used_for: "Species-specific classification scope and low-fat/skimmed/partly skimmed exclusion; not a general quality or emission threshold"
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Raw sheep milk classification/exclusion."
  - id: "fao-small-ruminant-dairy"
    type: "official_guidance"
    reference: "https://www.fao.org/dairy-production-products/dairy/small-ruminants/en"
    used_for: "Dairy sheep routes and output context."
  - id: "fao-leap-small-ruminants-2016"
    type: "official_guidance"
    reference: "https://openknowledge.fao.org/handle/20.500.14283/i6434en"
    used_for: "Small-ruminant LCA boundary, allocation and activity data."
  - id: "ipcc-livestock-2019"
    type: "method_factor"
    reference: "https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf"
    used_for: "Enteric and manure CH4/N2O methods."
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation of measured milk, material and service quantities"
    used_for: "QA identity, not empirical sheep-milk factor."
  - id: "fao-feed-loss-accounting-2018"
    type: "official_guidance"
    reference: "[FAO 2018, Environmental performance of pig supply chains, section 11.2.2](https://www.fao.org/4/i8686en/I8686EN.pdf)"
    used_for: "Feed supply versus intake and waste burden, not animal parameters. Applying this accounting principle to the declared taxon is this PCR's methodological choice; no pig diet or emission factor is transferred."
  - id: "ipcc-managed-soils-2019"
    type: "official_guidance"
    reference: "[IPCC 2019 Refinement, Volume 4, Chapter 11](https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch11_Soils_N2O_CO2.pdf)"
    used_for: "Direct/indirect nitrogen pathways and coordination of manure storage with managed-soil emissions; select applicable species and management evidence."
  - id: "fao-agricultural-energy"
    type: "official_guidance"
    reference: "FAO Energy demand and consumption in African agriculture, Annex C case-study results, https://www.fao.org/4/v9766e/v9766e08.htm"
    used_for: "conditional concrete identities and method context; does not establish site use or quantities"
