system_boundary:
  rules:
    - rule_id: b_source
      applies_to: "animal source"
      rule: "Include traceable husbandry and actual slaughter/dressing, including real meat, detached wool and milk at distinct phases; do not duplicate slaughter exchanges already covered by an upstream dataset. Lawful fallen-animal recovery follows actual terminal-treatment route, not fictional meat. Only a quality-accepted recovered skin-bearing material exits the source interface as Product; nonaccepted recovered carcass material follows its actual waste/treatment path, not the Product card."
      source_ids:
        - fao-hides-statistics
        - fao-hides-skins
    - rule_id: b_remove
      applies_to: "removal"
      rule: "Independent flaying hands intact untanned skin to first preparation; separate incidental tissue and damage."
      source_ids:
        - fao-small-ruminant-slaughter
    - rule_id: b_condition
      applies_to: "first handling"
      rule: "Include actual cleaning, fleshing and trimming before sorting; exclude dehairing, liming and tanning."
      source_ids:
        - fao-small-ruminant-slaughter
    - rule_id: b_preserve
      applies_to: "preserved lots"
      rule: "Fresh lots bypass treatment. For preserved lots measure method, energy, salt/brine, before/after state and residues without universal recipe."
      source_ids:
        - fao-hides-skins
    - rule_id: b_gate
      applies_to: "handover"
      rule: "Protect raw skin to actual removal-site or curing handover; exclude tannery transformation and downstream transport."
      source_ids:
        - un-cpc-3-notes
        - unido-leather-framework
boundary_abstraction:
  declared_starting_condition: "Traceable cohort and actual slaughter, or lawful fallen-animal recovery event."
  starting_condition_role: "Prefer compatible upstream husbandry through live-animal arrival with actual slaughter/dressing foreground here. If an upstream dataset already includes slaughter, the source node is only a traceable interface/allocation record and repeats no slaughter exchanges. Fallen-animal recovery starts from documented lawful source and separately accounts for its actual terminal treatment. Purchased materials/services are Product inputs only where used."
  product_classification_scope: "Fresh or first-stage preserved, not further prepared sheep/lamb raw skin."
  recursive_input_rule: "Purchased same-category raw skin retains upstream burden, not recounted as newly flayed."
  upstream_dataset_requirement: "Traceable husbandry, slaughter or recovery and actual material/service data; no automatic zero-burden hide."
  disclosure: "Age, fleece, source legality, state, grade, gate, periods, allocation and shared services."
