  - id: "fao-small-ruminant-slaughter"
    type: "official_guidance"
    reference: "[FAO small-ruminant slaughter and curing](https://www.fao.org/4/X6552E/X6552E10.htm)"
    used_for: "flaying and first conditioning"
  - id: "fao-hides-statistics"
