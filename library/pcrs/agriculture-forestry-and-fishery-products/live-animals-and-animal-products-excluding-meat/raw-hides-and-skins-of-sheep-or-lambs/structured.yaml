    - id: q_mass
      applies_to: "relevant lots"
      requirement: "Calibrate net/tare and measure moisture/salt and batch residual; no assumed state conversion."
      evidence: "source, batch and review records"
    - id: q_attribution
      applies_to: "relevant lots"
      requirement: "Retain actual outputs/phases, allocation basis, periods and shared-service driver worksheet."
      evidence: "source, batch and review records"
    - id: q_uuid
      applies_to: "relevant lots"
      requirement: "Resolve state/gate-compatible concrete UUID before final TIDAS exchange construction."
      evidence: "source, batch and review records"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference lot"
    rule: "Reject non-sheep/lamb, tanned or further prepared goods or missing age, fleece, state, gate or net mass."
    source_ids:
      - un-cpc-3-notes
  - rule_id: v_route
    applies_to: "source and removal"
    rule: "Require an independent skin-removal handoff; slaughter route lists real co-products; fallen route has lawful recovery and no invented meat."
    source_ids:
      - fao-hides-statistics
      - fao-small-ruminant-slaughter
  - rule_id: v_balance
    applies_to: "each batch"
    rule: "Reconcile accepted, downgraded and rejected skin, residue, stock and moisture/salt change, investigating residual against site measurement uncertainty."
    source_ids:
      - fao-hides-skins
  - rule_id: v_attribution
    applies_to: "products, phases and shared services"
    rule: "Reject unsupported zero-burden skin, duplicated attached fleece/detached wool, repeated animal phase or shared plant burden, or absent allocation evidence."
    source_ids:
      - fao-hides-skins
  - rule_id: v_uuid
    applies_to: "concrete dataset exchanges"
    rule: "Unresolved cards cannot become final exchanges; CPC label alone cannot make tanned sheepskin or manufactured leather an exact raw Mass flow."
    source_ids: []
published_dataset_profile:
  dataset_role: "Age-, fleece-, route-, state- and gate-qualified raw sheep/lamb skin foreground dataset."
  downstream_use: "Candidate secondary_dataset or background_dataset only after concrete exchange identity, review and publication."
  allowed_use: "Like-state/gate comparison or measured lot-specific salt/moisture conversion."
  excluded_use: "Goat skin, detached wool, tanned fleece-on skin, leather, universal fresh conversion or unsupported zero burden."
  required_metadata: "Age, source event/legal status, fleece, grade, state, net/tare, salt/moisture, gate, periods and allocation."
  required_quality_disclosure: "Co-product and period attribution, mass balance, cure recipe, rejects, shared services and unresolved UUID."
  update_trigger: "Exact raw-skin flow verification, changed route/gate or new measured state/allocation evidence."
