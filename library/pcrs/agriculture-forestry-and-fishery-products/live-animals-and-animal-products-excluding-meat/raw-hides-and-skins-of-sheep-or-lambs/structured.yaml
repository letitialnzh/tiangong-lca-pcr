allocation_rules:
  - rule_id: a_slaughter
    applies_to: "slaughter route"
    rule: "Enumerate each genuinely marketable meat, skin, detached wool, milk or other output at its real phase and gate. Use documented causal physical attribution if defensible; otherwise document economic allocation with period-specific prices and sensitivity. Never assign all animal burden to the skin or automatic zero burden."
    source_ids:
      - fao-hides-skins
  - rule_id: a_fallen
    applies_to: "fallen route"
    rule: "Document pre-existing animal burden, lawful recovery and terminal-treatment counterfactual; justify burden attribution and any separately reported avoided-treatment credit without invented meat."
    source_ids:
      - fao-hides-statistics
  - rule_id: a_grade
    applies_to: "grades and cure"
    rule: "Count every saleable grade at one handover only; separately sold trim requires its own product decision. Moisture/salt mass changes do not create extra skin."
    source_ids:
      - fao-hides-skins
  - rule_id: a_period
    applies_to: "phases and shared assets"
    rule: "Index breeding, lactation, shearing, finishing, slaughter/recovery and replacement across actual periods. Charge shared slaughter floor, cleaning, cold room and curing assets once using evidenced service time, throughput or other causal driver."
    source_ids:
      - fao-hides-skins
