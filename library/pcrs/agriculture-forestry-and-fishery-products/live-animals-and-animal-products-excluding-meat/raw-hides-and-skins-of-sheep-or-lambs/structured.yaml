  calculation_rules:
    - id: c_net
      applies_to: "final lot"
      rule: "net skin = gross minus package tare and separable free salt/brine; disclose retained moisture/salt"
      inputs:
        - cp_handover
        - cp_preserve
      output: "kg net skin"
      source_ids:
        - fao-hides-skins
    - id: c_balance
      applies_to: "all operations"
      rule: "inputs plus added cure = sale grades plus rejects/residue plus water/stock change and residual"
      inputs:
        - cp_remove
        - cp_condition
        - cp_grade
        - cp_preserve
      output: "kg residual"
      source_ids:
        - fao-small-ruminant-slaughter
    - id: c_period
      applies_to: "animal and shared services"
      rule: "attribute each phase/service burden once across actual outputs and consuming nodes"
      inputs:
        - cp_source
        - cp_utilities
      output: "burden/kg"
      source_ids:
        - fao-hides-skins
    - id: c_norm
      applies_to: "reference lot"
      rule: "attributable measured quantity divided by positive net skin at same state and gate"
      inputs:
        - cp_handover
        - cp_source
      output: "quantity/kg"
      source_ids: []
