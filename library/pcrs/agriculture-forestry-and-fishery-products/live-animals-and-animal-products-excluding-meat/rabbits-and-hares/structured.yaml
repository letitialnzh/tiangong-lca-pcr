system_boundary:
  rules:
    - rule_id: boundary_live
      applies_to: "Both routes"
      rule: "End with a living animal at the real handover; exclude slaughter, meat, hides, fur and downstream use."
      source_ids:
        - un-cpc-2025
    - rule_id: boundary_farm
      applies_to: "Managed domestic rabbits"
      rule: "Include breeder/rearing stock, feed, water, housing, health and manure only where operated; purchases retain upstream burden."
      source_ids:
        - fao-rabbit-production
        - fao-rabbit-housing
    - rule_id: boundary_housing
      applies_to: "Managed housing variants"
      rule: "Rabbit breeding/rearing is the biological parent. Cages versus floor/litter change bedding, cleaning, housing energy and manure handling; record real shares, not universal yields."
      source_ids:
        - fao-rabbit-housing
    - rule_id: boundary_capture
      applies_to: "Living wild hares"
      rule: "Include only documented lawful live trapping, welfare handling and actual capture handover; no fictitious breeder, feed or farm gate. Missing legal evidence makes the route ineligible."
      source_ids:
        - vic-hare-control
    - rule_id: boundary_shared
      applies_to: "Shared assets"
      rule: "Attribute sheds, feeders, water systems, traps and vehicles once over consuming nodes and service periods; avoid duplicate transfers."
      source_ids:
        - fao-rabbit-housing
        - vic-hare-control
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
