      flow_role: "permit, animals, materials, energy and losses"
      record_type: "permit/campaign ledger"
      raw_fields: "jurisdiction, permit, trap, checks, species, captured/released/dead/handed-over counts and masses, material, energy, destination"
      collection_method: "legal-document check and observed event/meter log; Raw aggregation requirements: captured = released + dead + handover + held; attribute shared equipment by service. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg; MJ"
      frequency: "event"
      temporal_coverage: "full lawful campaign"
      site_scope: "permitted site/handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "permit, welfare log, scale, trip/fuel log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
  calculation_rules:
    - id: calc_reference
      applies_to: "Both final outputs"
      rule: "Measured accepted live kg / same accepted live kg = 1 kg reference; disclose heads per kg by class."
      inputs:
        - "accepted kg"
        - count
        - species
        - class
      output: "1 kg living animal and heads/kg"
      source_ids:
        - un-cpc-2025
    - id: calc_ledger
      applies_to: "Animal stages"
      rule: "Reconcile stock and events without counting internal transfers twice."
      inputs:
        - opening
        - "births/capture"
        - purchases
        - release
        - death
        - transfer
        - sale
        - closing
      output: "balanced count and mass"
      source_ids:
        - fao-rabbit-production
        - vic-hare-control
    - id: calc_manure_ch4
      applies_to: "Farm manure"
      rule: "Apply documented applicable livestock/manure method to observed manure and storage/treatment; no universal rabbit factor."
      inputs:
        - "measured manure"
        - "route activity and method parameters"
      output: "kg biogenic CH4 by stage"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_manure_n2o
      applies_to: "Farm manure"
      rule: "Apply pathway-specific direct N2O method to measured manure nitrogen and observed storage/treatment; do not transfer this farm method to wild hare capture."
      inputs:
        - "manure nitrogen"
        - "management share"
        - "method parameters"
      output: "kg direct N2O by stage"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_shared
      applies_to: "Shared assets"
      rule: "Allocate one observed burden across recorded consumers/periods; fractions sum to one."
      inputs:
        - service
        - "animal-days/hours/trips"
        - period
      output: "burden by node/cohort"
      source_ids:
        - fao-rabbit-housing
        - vic-hare-control
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Final live output"
      requirement: "Distinguish Oryctolagus and Lepus, class, alive state, mass, count and real gate; no meat/slaughter identity."
      evidence: "species ledger and calibrated weight"
    - id: dq_route
      applies_to: "Farm/capture"
      requirement: "Record housing shares; wild capture requires jurisdictional permission and welfare/transport evidence."
      evidence: "husbandry log or permit/campaign log"
    - id: dq_period
      applies_to: "Multi-period farm/assets"
      requirement: "Date breeding, rearing, replacement and asset service; avoid duplicated transfer/asset burdens."
      evidence: "cohort/asset ledger"
    - id: dq_inventory
      applies_to: "All flows"
      requirement: "Reconcile animal, feed, water, material, manure and mortality balances; investigate out-of-screen ranges rather than treating them as defaults."
      evidence: "meters, inventories and transfers"
validation_rules:
  - rule_id: validate_species_gate
    applies_to: "Reference/final output"
    rule: "Require species-specific live mass/count at actual farm or lawful capture gate; reject farm-gate UUID on capture and slaughter/meat records."
    source_ids:
      - un-cpc-2025
      - vic-hare-control
  - rule_id: validate_capture
    applies_to: "Wild hare route"
    rule: "Require observed permit, jurisdiction, capture count, welfare/handling and live handover; missing legal evidence excludes capture route, not replaced by farm production."
    source_ids:
      - vic-hare-control
  - rule_id: validate_route
    applies_to: "Managed rabbits"
    rule: "Check cage/floor housing, bedding, utilities and manure by cohort; variants may coexist but capture is not a managed parent variant."
    source_ids:
      - fao-rabbit-housing
  - rule_id: validate_balance
    applies_to: "Outputs/loss"
    rule: "Reconcile weanlings, live breeder culls, final live animals, deaths, released hares, manure product and disposal by distinct gate."
    source_ids:
      - fao-rabbit-production
      - vic-hare-control
  - rule_id: validate_attribution
    applies_to: "Shared/period burdens"
    rule: "Check output set, handover, allocation method, phase linkage and one-time assignment of sheds, water systems, traps and vehicles."
    source_ids:
      - fao-rabbit-production
      - fao-rabbit-housing
  - rule_id: validate_ranges
    applies_to: "Inventory cards"
    rule: "Provisional zero-to-upper ranges are QA investigation screens, never assumed amounts or emission factors; replace with measured/reviewed values."
    source_ids:
      - fao-rabbit-production
published_dataset_profile:
  dataset_role: "Foreground living-animal package for declared farm rabbit or lawful hare-capture route"
  downstream_use: "Secondary/background dataset for process or lifecyclemodel after identity and quality review"
  allowed_use: "Living rabbits/hares only at declared species, gate and eligible route"
  excluded_use: "Meat, fur, hides, slaughter, unpermitted capture, relabelled wild farm production and post-handover service"
  required_metadata: "Species, domestic/wild, class, count, mass, condition, geography, route, gate, dates, housing/permit, allocation and manure destination"
  required_quality_disclosure: "Measurement/sampling, coverage, missing exchanges, provisional screens, UUID gaps, legal evidence, allocation/sensitivity"
  update_trigger: "Changed legal status, route, housing, gate, animal state, flow identity, emission method or observed records"
