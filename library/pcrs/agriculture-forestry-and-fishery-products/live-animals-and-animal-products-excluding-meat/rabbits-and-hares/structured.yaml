allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "All nodes"
    rule: "Assign measured inputs, emissions and losses directly to breeder, rearing, farm handover or lawful capture first. Wild hares inherit no farm breeding burden."
    source_ids:
      - fao-rabbit-production
      - vic-hare-control
  - rule_id: allocation_outputs
    applies_to: "Weanlings, live culls, final animals and usable exported manure"
    rule: "Enumerate distinct intended outputs only with actual handover, mass and receiver. Internal transfers are not second final outputs; deaths, disposal and released hares are not saleable co-products. For inseparable farm burdens use animal-days or measured feed/service causality; if unsupported use same-period economic values, documented prices and sensitivity."
    source_ids:
      - fao-rabbit-production
      - fao-rabbit-housing
  - rule_id: allocation_periods
    applies_to: "Breeding, rearing and capture"
    rule: "Assign breeder maintenance, gestation, lactation, weaning, replacement and housing service to benefited cohorts over documented periods. Transfer each kit's prior burden once to rearing. Capture equipment/handling belongs only to observed campaign."
    source_ids:
      - fao-rabbit-production
      - vic-hare-control
  - rule_id: allocation_shared
    applies_to: "Sheds, feeders, water systems, traps and vehicles"
    rule: "Name every consuming node/period; allocate measured burden once by meter, occupied animal-days, service-hours or trips. Document a share sum of one and avoid charging again at internal transfer."
    source_ids:
      - fao-rabbit-housing
      - vic-hare-control
dataset_production:
  collection_protocols:
    - protocol_id: cp_animals
      process_id: "breeder_rearing_farm_handover"
      flow_role: "Living incoming, transferred, culled and final animals"
      record_type: "herd/weigh ledger"
      raw_fields: "species, class, count, mass, origin, destination, date"
      collection_method: "lot count and calibrated scale or documented class sample; Raw aggregation requirements: reconcile opening + births + purchases - deaths - sales - transfers = closing; normalize to accepted live mass. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "each event"
      temporal_coverage: "entire cohort"
      site_scope: "actual farm sites"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh slips, herd ledger, scale calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed
      process_id: "breeder_rearing"
      flow_role: "feed and forage"
      record_type: "purchase/ration ledger"
      raw_fields: "material, mass, stock change, loss, cohort"
      collection_method: "delivery ticket and ration log; Raw aggregation requirements: delivered less stock change and recorded loss by cohort. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "batch and cycle"
      temporal_coverage: "operated periods"
      site_scope: "houses/pasture"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices and feed logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_utilities
      process_id: "breeder_rearing"
      flow_role: "water and energy"
      record_type: "meter/invoice"
      raw_fields: "water source/use, carrier, readings, shared consumer"
      collection_method: "meter read and use split; Raw aggregation requirements: convert units then attribute once by observed use. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; MJ"
      frequency: "meter interval"
      temporal_coverage: "operated periods"
      site_scope: "all supply connections"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter images, invoices; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_materials
      process_id: "breeder_rearing"
      flow_role: "bedding and care"
      record_type: "material issue"
      raw_fields: "identity, dose, mass, animal group, date, housing route"
      collection_method: "material issue and veterinary log; Raw aggregation requirements: sum actual consumption by material/cohort. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each use"
      temporal_coverage: "operated periods"
      site_scope: "houses"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and care logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
      process_id: "breeder_rearing"
      flow_role: "manure product/emission"
      record_type: "pathway ledger"
      raw_fields: "collected mass, moisture, nitrogen, storage, treatment, export, period"
      collection_method: "weigh, sample, transfer and storage record; Raw aggregation requirements: distinguish beneficial product, disposal and deposit; calculate pathway emission. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; days"
      frequency: "removal/cycle"
      temporal_coverage: "operated periods"
      site_scope: "manure systems"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh slips, nitrogen analysis, receiver and method inputs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_waste
      process_id: "breeder_rearing_farm_handover"
      flow_role: "mortality/disposal"
      record_type: "loss ledger"
      raw_fields: "species, count, mass, material, destination, date"
      collection_method: "count/weigh or documented estimate; Raw aggregation requirements: sum by waste identity/destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "event"
      temporal_coverage: "whole cohort"
      site_scope: "operated nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "disposal receipts, mortality log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_capture
