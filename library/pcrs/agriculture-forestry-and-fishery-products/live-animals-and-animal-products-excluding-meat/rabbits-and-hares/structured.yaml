allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "All nodes"
    rule: "Assign measured inputs, emissions and losses directly to breeder, rearing, farm handover or lawful capture first. Wild hares inherit no farm breeding burden."
    source_ids:
      - fao-rabbit-production
      - vic-hare-control
  - rule_id: allocation_outputs
    applies_to: "Weanlings, live culls, final animals and usable exported manure"
    rule: "Enumerate distinct intended outputs only with actual handover, mass and receiver. Internal transfers are not second final outputs; deaths, disposal and released hares are not saleable co-products. For inseparable farm burdens use animal-days or measured feed/service causality; if unsupported use same-period economic values, documented prices and sensitivity."
    source_ids:
      - fao-rabbit-production
      - fao-rabbit-housing
  - rule_id: allocation_periods
    applies_to: "Breeding, rearing and capture"
    rule: "Assign breeder maintenance, gestation, lactation, weaning, replacement and housing service to benefited cohorts over documented periods. Transfer each kit's prior burden once to rearing. Capture equipment/handling belongs only to observed campaign."
    source_ids:
      - fao-rabbit-production
      - vic-hare-control
  - rule_id: allocation_shared
    applies_to: "Sheds, feeders, water systems, traps and vehicles"
    rule: "Name every consuming node/period; allocate measured burden once by meter, occupied animal-days, service-hours or trips. Document a share sum of one and avoid charging again at internal transfer."
    source_ids:
      - fao-rabbit-housing
      - vic-hare-control
dataset_production:
  collection_protocols:
    - protocol_id: cp_animals
      process_id: "breeder_rearing_farm_handover"
      flow_role: "Living incoming, transferred, culled and final animals"
      record_type: "herd/weigh ledger"
      raw_fields: "species, class, count, mass, origin, destination, date"
      collection_method: "lot count and calibrated scale or documented class sample; Raw aggregation requirements: reconcile opening + births + purchases - deaths - sales - transfers = closing; normalize to accepted live mass. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "each event"
      temporal_coverage: "entire cohort"
      site_scope: "actual farm sites"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh slips, herd ledger, scale calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_feed
      process_id: "breeder_rearing"
      flow_role: "feed and forage"
      record_type: "purchase/ration ledger"
      raw_fields: "material, mass, stock change, loss, cohort ; unused returns/transfers; uneaten loss; actual intake; loss destination; moisture/DM"
      collection_method: "Feed input carrying upstream burden = opening stock + receipts - closing stock - documented unused returns or transfers out. Keep in-boundary spoilage and refusals in that input. Separately derive biological intake = that input - measured uneaten losses, with moisture/DM reconciliation; use intake, not purchased input, in animal metabolism calculations. Record each loss destination and include its treatment or manure contribution once. Preserve raw records and normalize attributed quantities to the accepted reference output once."
      unit: "kg"
      frequency: "batch and cycle"
      temporal_coverage: "operated periods"
      site_scope: "houses/pasture"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices and feed logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_utilities
      process_id: "breeder_rearing"
      flow_role: "water and energy"
      record_type: "meter/invoice"
      raw_fields: "water source/use, carrier, readings, shared consumer"
      collection_method: "meter read and use split; Raw aggregation requirements: convert units then attribute once by observed use. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; MJ"
      frequency: "meter interval"
      temporal_coverage: "operated periods"
      site_scope: "all supply connections"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter images, invoices; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_materials
      process_id: "breeder_rearing"
      flow_role: "bedding and care"
      record_type: "material issue"
      raw_fields: "identity, dose, mass, animal group, date, housing route"
      collection_method: "material issue and veterinary log; Raw aggregation requirements: sum actual consumption by material/cohort. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each use"
      temporal_coverage: "operated periods"
      site_scope: "houses"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and care logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
      process_id: "breeder_rearing"
      flow_role: "manure product/emission"
      record_type: "pathway ledger"
      raw_fields: "collected mass, moisture, nitrogen, storage, treatment, export, period"
      collection_method: "weigh, sample, transfer and storage record; Raw aggregation requirements: distinguish beneficial product, disposal and deposit; calculate pathway emission. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; days"
      frequency: "removal/cycle"
      temporal_coverage: "operated periods"
      site_scope: "manure systems"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh slips, nitrogen analysis, receiver and method inputs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_waste
      process_id: "breeder_rearing_farm_handover"
      flow_role: "mortality/disposal"
      record_type: "loss ledger"
      raw_fields: "species, count, mass, material, destination, date"
      collection_method: "count/weigh or documented estimate; Raw aggregation requirements: sum by waste identity/destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "event"
      temporal_coverage: "whole cohort"
      site_scope: "operated nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "disposal receipts, mortality log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_capture
      process_id: "hare_capture"
      flow_role: "permit, animals, materials, energy and losses"
      record_type: "permit/campaign ledger"
      raw_fields: "jurisdiction, permit, trap, checks, species, captured/released/dead/handed-over counts and masses, material, energy, destination"
      collection_method: "legal-document check and observed event/meter log; Raw aggregation requirements: captured = released + dead + handover + held; attribute shared equipment by service. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg; MJ"
      frequency: "event"
      temporal_coverage: "full lawful campaign"
      site_scope: "permitted site/handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "permit, welfare log, scale, trip/fuel log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
    - protocol_id: cp_pathway_emissions
      process_id: "breeder_rearing"
      flow_role: "pathway-specific gases and manure N/C"
      record_type: "herd, feed, manure, field and method ledger"
      raw_fields: "species/class; animal-days; intake/DM/digestibility; volatile solids; manure N/TAN; system shares; climate; storage time; fertiliser N; grazing; volatilisation/leaching; methane recovery; factor source/unit; final accepted output ; collected manure wet mass; dry matter; destination"
      collection_method: "collect primary activity by node and period, document parameter applicability, retain each pathway worksheet and any linked treatment/pasture dataset  Retain raw totals and normalize attributed quantities once to the measured accepted final reference output."
      unit: "animal-day; kg DM; kg VS; kg N; kg CH4; kg N2O; kg NH3"
      frequency: "each operating period and management change"
      temporal_coverage: "complete represented cohort and service period"
      site_scope: "actual operated nodes only"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter/analysis records, nitrogen cascade, method and factor evidence, no-duplication ledger"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "breeder_rearing"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "breeder_rearing"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: calc_reference
      applies_to: "Both final outputs"
      rule: "Measured accepted live kg / same accepted live kg = 1 kg reference; disclose heads per kg by class."
      inputs:
        - "accepted kg"
        - count
        - species
        - class
      output: "1 kg living animal and heads/kg"
      source_ids:
        - un-cpc-2025
    - id: calc_ledger
      applies_to: "Animal stages"
      rule: "Reconcile stock and events without counting internal transfers twice."
      inputs:
        - opening
        - "births/capture"
        - purchases
        - release
        - death
        - transfer
        - sale
        - closing
      output: "balanced count and mass"
      source_ids:
        - fao-rabbit-production
        - vic-hare-control
    - id: calc_manure_ch4
      applies_to: "Farm manure"
      rule: "Apply documented applicable livestock/manure method to observed manure and storage/treatment; no universal rabbit factor."
      inputs:
        - "measured manure"
        - "route activity and method parameters"
      output: "kg biogenic CH4 by stage"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_manure_n2o
      applies_to: "Farm manure"
      rule: "Apply pathway-specific direct N2O method to measured manure nitrogen and observed storage/treatment; do not transfer this farm method to wild hare capture."
      inputs:
        - "manure nitrogen"
        - "management share"
        - "method parameters"
      output: "kg direct N2O by stage"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_shared
      applies_to: "Shared assets"
      rule: "Allocate one observed burden across recorded consumers/periods; fractions sum to one."
      inputs:
        - service
        - "animal-days/hours/trips"
        - period
      output: "burden by node/cohort"
      source_ids:
        - fao-rabbit-housing
        - vic-hare-control
    - id: calc_feed_input_and_intake
      applies_to: "Feed supply and biological intake"
      rule: "Feed input carrying upstream burden = opening stock + receipts - closing stock - documented unused returns or transfers out. Keep in-boundary spoilage and refusals in that input. Separately derive biological intake = that input - measured uneaten losses, with moisture/DM reconciliation; use intake, not purchased input, in animal metabolism calculations. Record each loss destination and include its treatment or manure contribution once."
      inputs:
        - cp_feed
      output: "separate kg feed input, intake and loss by cohort"
      source_ids:
        - review-fao-pig-lca-2018
    - id: calc_pathway_emissions
      applies_to: "breeder; rearing"
      rule: "Use species- and management-compatible methods and retain disaggregated pathway totals. Convert N2O-N to N2O by 44/28 and NH3-N to NH3 by 17/14 exactly once; already molecular masses are not reconverted. Check methane against the documented available-carbon/methane-potential balance and nitrogen losses against each stage's available N. Indirect formation from previously volatilised N is a downstream transformation, not a second source-stage N loss. Attribute and normalize once; do not duplicate linked treatment or fate-model emissions.  Use matched raw-period quantities before allocation for physical screens: CH4 mass × 12/16 must not exceed the carbon available to the represented pathway; source-stage NH3 mass × 14/17 plus direct N2O mass × 28/44 and other source N losses must not exceed that stage's available N, after accounting for stocks and transfers. Bound each indirect N2O-N calculation by its documented volatilised or leached N precursor, not by subtracting that downstream transformation again from the source ledger. These are conservation checks, not emission factors or an empirical per-product range."
      inputs:
        - cp_pathway_emissions
      output: "kg named compound per final reference flow"
      source_ids:
        - ipcc-livestock-2019
        - review-eea-manure-2023
        - review-ipcc-soils-2019
    - id: calc_feed_supply_and_intake
      applies_to: "breeder_feed; rearing_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - review-fao-pig-lca-2018
    - id: calc_manure_n2o_coverage
      applies_to: "breeder_manure_n2o; review_breeder_indirect_n2o; rearing_manure_n2o; review_rearing_indirect_n2o"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-livestock-2019
        - review-ipcc-soils-2019
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Final live output"
      requirement: "Distinguish Oryctolagus and Lepus, class, alive state, mass, count and real gate; no meat/slaughter identity."
      evidence: "species ledger and calibrated weight"
    - id: dq_route
      applies_to: "Farm/capture"
      requirement: "Record housing shares; wild capture requires jurisdictional permission and welfare/transport evidence."
      evidence: "husbandry log or permit/campaign log"
    - id: dq_period
      applies_to: "Multi-period farm/assets"
      requirement: "Date breeding, rearing, replacement and asset service; avoid duplicated transfer/asset burdens."
      evidence: "cohort/asset ledger"
    - id: dq_inventory
      applies_to: "All flows"
      requirement: "Reconcile animal, feed, water, material, manure and mortality balances; investigate out-of-screen ranges rather than treating them as defaults."
      evidence: "meters, inventories and transfers"
validation_rules:
  - rule_id: validate_species_gate
    applies_to: "Reference/final output"
    rule: "Require species-specific live mass/count at actual farm or lawful capture gate; reject farm-gate UUID on capture and slaughter/meat records."
    source_ids:
      - un-cpc-2025
      - vic-hare-control
  - rule_id: validate_capture
    applies_to: "Wild hare route"
    rule: "Require observed permit, jurisdiction, capture count, welfare/handling and live handover; missing legal evidence excludes capture route, not replaced by farm production."
    source_ids:
      - vic-hare-control
  - rule_id: validate_route
    applies_to: "Managed rabbits"
    rule: "Check cage/floor housing, bedding, utilities and manure by cohort; variants may coexist but capture is not a managed parent variant."
    source_ids:
      - fao-rabbit-housing
  - rule_id: validate_balance
    applies_to: "Outputs/loss"
    rule: "Reconcile weanlings, live breeder culls, final live animals, deaths, released hares, manure product and disposal by distinct gate."
    source_ids:
      - fao-rabbit-production
      - vic-hare-control
  - rule_id: validate_attribution
    applies_to: "Shared/period burdens"
    rule: "Check output set, handover, allocation method, phase linkage and one-time assignment of sheds, water systems, traps and vehicles."
    source_ids:
      - fao-rabbit-production
      - fao-rabbit-housing
  - rule_id: validate_ranges
    applies_to: "Inventory cards"
    rule: "Provisional zero-to-upper ranges are QA investigation screens, never assumed amounts or emission factors; replace with measured/reviewed values."
    source_ids:
      - fao-rabbit-production
  - rule_id: v_feed_loss_burden
    applies_to: "Feed balances"
    rule: "Reject a feed-input inventory that subtracts in-boundary wastage without retaining its upstream burden. Match intake, losses, stocks and unused returns, and document the loss treatment; no automatic co-product credit."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: v_pathway_emission_coverage
    applies_to: "breeder; rearing"
    rule: "Require a pathway coverage ledger for enteric CH4 where biologically applicable, manure CH4, direct/indirect N2O, NH3 and relevant field emissions. Every pathway needs a measured/calculated value, a named linked process with matching coverage, or supported inapplicability; absent data cannot become zero. Keep wild life before capture outside managed husbandry, assess actual managed holding separately, and retain species-specific evidence."
    source_ids:
      - ipcc-livestock-2019
      - review-ipcc-soils-2019
      - review-eea-manure-2023
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-livestock-2019
      - review-ipcc-soils-2019
published_dataset_profile:
  dataset_role: "Foreground living-animal package for declared farm rabbit or lawful hare-capture route"
  downstream_use: "Secondary/background dataset for process or lifecyclemodel after identity and quality review"
  allowed_use: "Living rabbits/hares only at declared species, gate and eligible route"
  excluded_use: "Meat, fur, hides, slaughter, unpermitted capture, relabelled wild farm production and post-handover service"
  required_metadata: "Species, domestic/wild, class, count, mass, condition, geography, route, gate, dates, housing/permit, allocation and manure destination"
  required_quality_disclosure: "Measurement/sampling, coverage, missing exchanges, provisional screens, UUID gaps, legal evidence, allocation/sensitivity"
  update_trigger: "Changed legal status, route, housing, gate, animal state, flow identity, emission method or observed records"
data_sources:
  - id: "un-cpc-2025"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Living rabbit and hare CPC scope"
  - id: "fao-rabbit-production"
    type: "extension_guidance"
    reference: "https://www.fao.org/4/x5082e/X5082E00.htm"
    used_for: "Domestic breeding/rearing and health"
  - id: "fao-rabbit-housing"
    type: "extension_guidance"
    reference: "https://www.fao.org/4/X5082E/X5082E0f.htm"
    used_for: "Housing, cleaning and manure route"
  - id: "vic-hare-control"
    type: "official_guidance"
    reference: "https://agriculture.vic.gov.au/biosecurity/pest-animals/invasive-animal-management/integrated-hare-control"
    used_for: "Capture possibility and jurisdiction-sensitive welfare; not universal permission"
  - id: "ipcc-livestock-2019"
    type: "method_factor"
    reference: "https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch10_Livestock.pdf"
