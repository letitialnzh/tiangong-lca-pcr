allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "All nodes"
    rule: "Assign measured inputs, emissions and losses directly to breeder, rearing, farm handover or lawful capture first. Wild hares inherit no farm breeding burden."
    source_ids:
      - fao-rabbit-production
      - vic-hare-control
  - rule_id: allocation_outputs
    applies_to: "Weanlings, live culls, final animals and usable exported manure"
    rule: "Enumerate distinct intended outputs only with actual handover, mass and receiver. Internal transfers are not second final outputs; deaths, disposal and released hares are not saleable co-products. For inseparable farm burdens use animal-days or measured feed/service causality; if unsupported use same-period economic values, documented prices and sensitivity."
    source_ids:
      - fao-rabbit-production
      - fao-rabbit-housing
  - rule_id: allocation_periods
    applies_to: "Breeding, rearing and capture"
    rule: "Assign breeder maintenance, gestation, lactation, weaning, replacement and housing service to benefited cohorts over documented periods. Transfer each kit's prior burden once to rearing. Capture equipment/handling belongs only to observed campaign."
    source_ids:
      - fao-rabbit-production
      - vic-hare-control
  - rule_id: allocation_shared
    applies_to: "Sheds, feeders, water systems, traps and vehicles"
    rule: "Name every consuming node/period; allocate measured burden once by meter, occupied animal-days, service-hours or trips. Document a share sum of one and avoid charging again at internal transfer."
    source_ids:
      - fao-rabbit-housing
      - vic-hare-control
dataset_production:
  collection_protocols:
    - protocol_id: cp_animals
      process_id: "breeder_rearing_farm_handover"
      flow_role: "Living incoming, transferred, culled and final animals"
      record_type: "herd/weigh ledger"
      raw_fields: "species, class, count, mass, origin, destination, date"
      collection_method: "lot count and calibrated scale or documented class sample"
      unit: "head; kg"
      frequency: "each event"
      temporal_coverage: "entire cohort"
      site_scope: "actual farm sites"
      aggregation_rule: "reconcile opening + births + purchases - deaths - sales - transfers = closing; normalize to accepted live mass"
      quality_evidence: "weigh slips, herd ledger, scale calibration"
    - protocol_id: cp_feed
      process_id: "breeder_rearing"
      flow_role: "feed and forage"
      record_type: "purchase/ration ledger"
      raw_fields: "material, mass, stock change, loss, cohort"
      collection_method: "delivery ticket and ration log"
      unit: "kg"
      frequency: "batch and cycle"
      temporal_coverage: "operated periods"
      site_scope: "houses/pasture"
      aggregation_rule: "delivered less stock change and recorded loss by cohort"
      quality_evidence: "invoices and feed logs"
    - protocol_id: cp_utilities
      process_id: "breeder_rearing"
      flow_role: "water and energy"
      record_type: "meter/invoice"
      raw_fields: "water source/use, carrier, readings, shared consumer"
      collection_method: "meter read and use split"
      unit: "kg; MJ"
      frequency: "meter interval"
      temporal_coverage: "operated periods"
      site_scope: "all supply connections"
      aggregation_rule: "convert units then attribute once by observed use"
      quality_evidence: "meter images, invoices"
    - protocol_id: cp_materials
      process_id: "breeder_rearing"
      flow_role: "bedding and care"
      record_type: "material issue"
      raw_fields: "identity, dose, mass, animal group, date, housing route"
      collection_method: "material issue and veterinary log"
      unit: "kg"
      frequency: "each use"
      temporal_coverage: "operated periods"
      site_scope: "houses"
      aggregation_rule: "sum actual consumption by material/cohort"
      quality_evidence: "stock and care logs"
    - protocol_id: cp_manure
      process_id: "breeder_rearing"
      flow_role: "manure product/emission"
      record_type: "pathway ledger"
      raw_fields: "collected mass, moisture, nitrogen, storage, treatment, export, period"
      collection_method: "weigh, sample, transfer and storage record"
      unit: "kg; days"
      frequency: "removal/cycle"
      temporal_coverage: "operated periods"
      site_scope: "manure systems"
      aggregation_rule: "distinguish beneficial product, disposal and deposit; calculate pathway emission"
      quality_evidence: "weigh slips, nitrogen analysis, receiver and method inputs"
    - protocol_id: cp_waste
      process_id: "breeder_rearing_farm_handover"
      flow_role: "mortality/disposal"
      record_type: "loss ledger"
      raw_fields: "species, count, mass, material, destination, date"
      collection_method: "count/weigh or documented estimate"
      unit: "head; kg"
      frequency: "event"
      temporal_coverage: "whole cohort"
      site_scope: "operated nodes"
      aggregation_rule: "sum by waste identity/destination"
      quality_evidence: "disposal receipts, mortality log"
    - protocol_id: cp_capture
      process_id: "hare_capture"
      flow_role: "permit, animals, materials, energy and losses"
      record_type: "permit/campaign ledger"
      raw_fields: "jurisdiction, permit, trap, checks, species, captured/released/dead/handed-over counts and masses, material, energy, destination"
      collection_method: "legal-document check and observed event/meter log"
      unit: "head; kg; MJ"
      frequency: "event"
      temporal_coverage: "full lawful campaign"
      site_scope: "permitted site/handover"
      aggregation_rule: "captured = released + dead + handover + held; attribute shared equipment by service"
      quality_evidence: "permit, welfare log, scale, trip/fuel log"
  calculation_rules:
    - id: calc_reference
      applies_to: "Both final outputs"
      rule: "Measured accepted live kg / same accepted live kg = 1 kg reference; disclose heads per kg by class."
      inputs:
        - "accepted kg"
        - count
        - species
        - class
      output: "1 kg living animal and heads/kg"
      source_ids:
        - un-cpc-2025
    - id: calc_ledger
      applies_to: "Animal stages"
      rule: "Reconcile stock and events without counting internal transfers twice."
      inputs:
        - opening
        - "births/capture"
        - purchases
        - release
        - death
        - transfer
        - sale
        - closing
      output: "balanced count and mass"
      source_ids:
        - fao-rabbit-production
        - vic-hare-control
    - id: calc_manure_ch4
      applies_to: "Farm manure"
      rule: "Apply documented applicable livestock/manure method to observed manure and storage/treatment; no universal rabbit factor."
      inputs:
        - "measured manure"
        - "route activity and method parameters"
      output: "kg biogenic CH4 by stage"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_manure_n2o
      applies_to: "Farm manure"
      rule: "Apply pathway-specific direct N2O method to measured manure nitrogen and observed storage/treatment; do not transfer this farm method to wild hare capture."
      inputs:
        - "manure nitrogen"
        - "management share"
        - "method parameters"
      output: "kg direct N2O by stage"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_shared
      applies_to: "Shared assets"
      rule: "Allocate one observed burden across recorded consumers/periods; fractions sum to one."
      inputs:
        - service
        - "animal-days/hours/trips"
        - period
      output: "burden by node/cohort"
      source_ids:
        - fao-rabbit-housing
        - vic-hare-control
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Final live output"
      requirement: "Distinguish Oryctolagus and Lepus, class, alive state, mass, count and real gate; no meat/slaughter identity."
      evidence: "species ledger and calibrated weight"
    - id: dq_route
      applies_to: "Farm/capture"
      requirement: "Record housing shares; wild capture requires jurisdictional permission and welfare/transport evidence."
      evidence: "husbandry log or permit/campaign log"
    - id: dq_period
      applies_to: "Multi-period farm/assets"
      requirement: "Date breeding, rearing, replacement and asset service; avoid duplicated transfer/asset burdens."
      evidence: "cohort/asset ledger"
    - id: dq_inventory
      applies_to: "All flows"
      requirement: "Reconcile animal, feed, water, material, manure and mortality balances; investigate out-of-screen ranges rather than treating them as defaults."
      evidence: "meters, inventories and transfers"
validation_rules:
  - rule_id: validate_species_gate
    applies_to: "Reference/final output"
    rule: "Require species-specific live mass/count at actual farm or lawful capture gate; reject farm-gate UUID on capture and slaughter/meat records."
    source_ids:
      - un-cpc-2025
      - vic-hare-control
  - rule_id: validate_capture
    applies_to: "Wild hare route"
    rule: "Require observed permit, jurisdiction, capture count, welfare/handling and live handover; missing legal evidence excludes capture route, not replaced by farm production."
    source_ids:
      - vic-hare-control
  - rule_id: validate_route
    applies_to: "Managed rabbits"
    rule: "Check cage/floor housing, bedding, utilities and manure by cohort; variants may coexist but capture is not a managed parent variant."
    source_ids:
      - fao-rabbit-housing
  - rule_id: validate_balance
    applies_to: "Outputs/loss"
    rule: "Reconcile weanlings, live breeder culls, final live animals, deaths, released hares, manure product and disposal by distinct gate."
    source_ids:
      - fao-rabbit-production
      - vic-hare-control
  - rule_id: validate_attribution
    applies_to: "Shared/period burdens"
    rule: "Check output set, handover, allocation method, phase linkage and one-time assignment of sheds, water systems, traps and vehicles."
    source_ids:
      - fao-rabbit-production
      - fao-rabbit-housing
  - rule_id: validate_ranges
    applies_to: "Inventory cards"
    rule: "Provisional zero-to-upper ranges are QA investigation screens, never assumed amounts or emission factors; replace with measured/reviewed values."
    source_ids:
      - fao-rabbit-production
published_dataset_profile:
  dataset_role: "Foreground living-animal package for declared farm rabbit or lawful hare-capture route"
  downstream_use: "Secondary/background dataset for process or lifecyclemodel after identity and quality review"
  allowed_use: "Living rabbits/hares only at declared species, gate and eligible route"
  excluded_use: "Meat, fur, hides, slaughter, unpermitted capture, relabelled wild farm production and post-handover service"
  required_metadata: "Species, domestic/wild, class, count, mass, condition, geography, route, gate, dates, housing/permit, allocation and manure destination"
  required_quality_disclosure: "Measurement/sampling, coverage, missing exchanges, provisional screens, UUID gaps, legal evidence, allocation/sensitivity"
  update_trigger: "Changed legal status, route, housing, gate, animal state, flow identity, emission method or observed records"
