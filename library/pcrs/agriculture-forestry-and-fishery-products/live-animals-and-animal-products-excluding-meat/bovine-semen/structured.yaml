allocation_rules:
  - rule_id: subdivide
    applies_to: "all nodes"
    rule: "Partition independently measured activity by donor species, donor, batch and route before allocation. Retain the complete observed donor and collection service period, including failed collections and rejected material, and attribute it over the actual accepted outputs."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: output_status
    applies_to: "culls and downgraded grades"
    rule: "Independent culls or saleable downgraded semen need actual destination and handoff; rejects and manure to treatment are waste."
    source_ids:
      - un-cpc-3
      - woah-bovine-2024
  - rule_id: residual
    applies_to: "inseparable burdens"
    rule: "Prefer causal donor-days, batch use or storage occupancy; disclose any residual physical/economic split and sensitivity, never hypothetical avoided-product credit."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: period_asset
    applies_to: "donor and shared assets"
    rule: "Link feed, health, donor replacement/cull, laboratory and tank service to actual periods and consuming nodes once; prevent duplicate tank or room burden."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: allocation_method_basis
    applies_to: "Residual joint burdens and shared service"
    rule: "Apply the general LCA hierarchy: examine subdivision or an appropriately justified system expansion before residual allocation; then prefer a supported physical causal relationship, and justify an economic basis when physical attribution is not established. The donor-day, occupancy or throughput driver is a PCR modelling choice requiring case-specific evidence and sensitivity, not a requirement of sanitary guidance. Include failed attempts and losses in the service period; do not select only successful outputs or introduce hypothetical substitution credits."
    source_ids:
      - review-fao-pig-lca-2018
dataset_production:
  collection_protocols:
    - protocol_id: cp_donor
      process_id: "donor_management"
      flow_role: "feed, water, cull, manure, assets"
      record_type: "donor ledger"
      raw_fields: "donor_id, species, breed, donor_days, feed_DM, water, health, cull_mass, manure, asset_service"
      collection_method: "weigh, meter, husbandry log; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "kg, day"
      frequency: "daily/event"
      temporal_coverage: "complete donor service"
      site_scope: "all supplying donors"
      aggregation_rule: "per reference flow"
      quality_evidence: "dated donor and purchase logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_collection
      process_id: "semen_collection"
      flow_role: "raw ejaculate and supplies"
      record_type: "collection log"
      raw_fields: "donor_id, event_id, volume, consumables, failed_event"
      collection_method: "volume and material issue record; Raw aggregation requirements: sum by event. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "mL, kg"
      frequency: "event"
      temporal_coverage: "all eligible events"
      site_scope: "centre collection room"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated collection record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_quality
      process_id: "quality_grading"
      flow_role: "accepted, downgraded, reject"
      record_type: "laboratory assay"
      raw_fields: "event_id, sperm_count, concentration, motility, grade, sample_volume, destination"
      collection_method: "grade assay; Raw aggregation requirements: reconcile each destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "mL, count"
      frequency: "event"
      temporal_coverage: "all collections"
      site_scope: "centre laboratory"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed test and grade record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_preparation
      process_id: "first_preparation"
      flow_role: "prepared and rejected"
      record_type: "batch log"
      raw_fields: "batch_id, incoming_volume, prepared_volume, removed_volume"
      collection_method: "calibrated balance; Raw aggregation requirements: input-output balance. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "mL"
      frequency: "batch"
      temporal_coverage: "all preparation batches"
      site_scope: "centre laboratory"
      aggregation_rule: "per reference flow"
      quality_evidence: "batch trace; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_formulation
      process_id: "formulation"
      flow_role: "semen, constituents, bulk, reject"
      record_type: "recipe log"
      raw_fields: "batch_id, semen_volume, ingredient_mass, batch_volume, reject_volume"
      collection_method: "weigh actual recipe; Raw aggregation requirements: material balance. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, mL"
      frequency: "batch"
      temporal_coverage: "all blended batches"
      site_scope: "centre laboratory"
      aggregation_rule: "per reference flow"
      quality_evidence: "lot and scale log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_dosing
      process_id: "dosing"
      flow_role: "bulk, straw, filled, reject"
      record_type: "fill-run ledger"
      raw_fields: "run_id, bulk_volume, straw_issued, straw_returned, filled_count, reject_count, dose_volume, sperm_per_dose"
      collection_method: "counter and fill balance; Raw aggregation requirements: count and volume balance. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "mL, dose"
      frequency: "run"
      temporal_coverage: "all fill runs"
      site_scope: "fill line"
      aggregation_rule: "per reference flow"
      quality_evidence: "machine calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_preservation
      process_id: "preservation"
      flow_role: "energy, nitrogen, accepted, reject"
      record_type: "cold-chain log"
      raw_fields: "batch_id, route, temperature, hold_days, kWh, nitrogen_mass, vessel_service, accepted_count, reject_count"
      collection_method: "meter, logger, vessel balance; Raw aggregation requirements: route-period denominator. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kWh, kg, dose"
      frequency: "batch/day"
      temporal_coverage: "all stored lots"
      site_scope: "cold room and tanks"
      aggregation_rule: "per reference flow"
      quality_evidence: "logger and purchase logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_dispatch
      process_id: "centre_dispatch"
      flow_role: "package, release, reject"
      record_type: "release ledger"
      raw_fields: "lot_id, donor, species, route, grade, package_mass, vessel_cycle, released_count, reject_count, gate_time"
      collection_method: "release count and issue log; Raw aggregation requirements: count released once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "dose, kg"
      frequency: "lot"
      temporal_coverage: "all dispatches"
      site_scope: "centre gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "QA release and receipt; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_pathway_emissions
      process_id: "donor_management"
      flow_role: "pathway-specific gases and manure N/C"
      record_type: "herd, feed, manure, field and method ledger"
      raw_fields: "species/class; animal-days; intake/DM/digestibility; volatile solids; manure N/TAN; system shares; climate; storage time; fertiliser N; grazing; volatilisation/leaching; methane recovery; factor source/unit; final accepted output ; collected manure wet mass; dry matter; destination"
      collection_method: "collect primary activity by node and period, document parameter applicability, retain each pathway worksheet and any linked treatment/pasture dataset  Retain raw totals and normalize attributed quantities once to the measured accepted final reference output."
      unit: "animal-day; kg DM; kg VS; kg N; kg CH4; kg N2O; kg NH3"
      frequency: "each operating period and management change"
      temporal_coverage: "complete represented cohort and service period"
      site_scope: "actual operated nodes only"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter/analysis records, nitrogen cascade, method and factor evidence, no-duplication ledger"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "donor_management"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "donor_management"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
    - protocol_id: cp_operating_utilities
      process_id: "all_actual_operated_nodes_separate_rows_by_process_id"
      flow_role: "node-specific energy and linked service coverage"
      record_type: "meter, equipment and service ledger"
      raw_fields: "process_id; lot/route/state; period; energy carrier; opening/closing readings and unit; equipment hours and measured-power evidence; shared meter boundary; attribution shares; linked service and coverage; assigned exchange; accepted final output; gaps/inapplicability evidence"
      collection_method: "Meter each node and carrier separately; where submetering is unavailable use evidenced operating time and load, reconciled with the same-period main meter and every consumer. Record named service coverage and actual direct inputs under calc_operating_utilities."
      unit: "kWh; MJ; native unit of each fuel, kept separately"
      frequency: "each lot and meter settlement period"
      temporal_coverage: "complete operating period including failed batches, standby and relevant auxiliary services"
      site_scope: "actual in-boundary facilities and linked services"
      aggregation_rule: "per reference flow"
      quality_evidence: "raw readings, load/efficiency evidence, consumer allocation and no-duplication ledger; equipment hours alone do not establish energy use"
  calculation_rules:
    - id: material_reconcile
      applies_to: "collection through dispatch"
      rule: "Raw semen plus extender components equals accepted, downgraded, rejected, sampled and lost material after calibrated unit conversions."
      inputs:
        - cp_collection
        - cp_quality
        - cp_preparation
        - cp_formulation
        - cp_dosing
        - cp_preservation
        - cp_dispatch
      output: "batch material and dose balance"
      source_ids:
        - fao-cryoconservation-2021
    - id: donor_intensity
      applies_to: "donor upkeep"
      rule: "Same-period donor burden divided by linked accepted doses after independent output attribution."
      inputs:
        - cp_donor
        - cp_dispatch
      output: "burden per dose"
      source_ids:
        - woah-hygiene-2024
    - id: route_intensity
      applies_to: "preservation"
      rule: "State-specific energy, nitrogen, losses and storage occupancy divided by state-specific accepted doses."
      inputs:
        - cp_preservation
        - cp_dispatch
      output: "burden per route dose"
      source_ids:
        - fao-cryoconservation-2021
    - id: shared_asset
      applies_to: "infrastructure"
      rule: "Allocate measured service/occupancy over the full service period to consuming nodes once."
      inputs:
        - cp_donor
        - cp_preservation
        - cp_dispatch
      output: "unique attributed asset burden"
      source_ids:
        - woah-hygiene-2024
    - id: calc_pathway_emissions
      applies_to: "donor_management"
      rule: "Use species- and management-compatible methods and retain disaggregated pathway totals. Convert N2O-N to N2O by 44/28 and NH3-N to NH3 by 17/14 exactly once; already molecular masses are not reconverted. Check methane against the documented available-carbon/methane-potential balance and nitrogen losses against each stage's available N. Indirect formation from previously volatilised N is a downstream transformation, not a second source-stage N loss. Attribute and normalize once; do not duplicate linked treatment or fate-model emissions.  Use matched raw-period quantities before allocation for physical screens: CH4 mass × 12/16 must not exceed the carbon available to the represented pathway; source-stage NH3 mass × 14/17 plus direct N2O mass × 28/44 and other source N losses must not exceed that stage's available N, after accounting for stocks and transfers. Bound each indirect N2O-N calculation by its documented volatilised or leached N precursor, not by subtracting that downstream transformation again from the source ledger. These are conservation checks, not emission factors or an empirical per-product range."
      inputs:
        - cp_pathway_emissions
      output: "kg named compound per final reference flow"
      source_ids:
        - ipcc-livestock-2019
        - review-eea-manure-2023
        - review-ipcc-soils-2019
    - id: calc_feed_supply_and_intake
      applies_to: "donor_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - review-fao-pig-lca-2018
    - id: calc_manure_n2o_coverage
      applies_to: "manure_n2o_air"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-livestock-2019
        - review-ipcc-soils-2019
    - id: calc_operating_utilities
      applies_to: "all actual operated nodes"
      rule: "Obtain raw use by node/carrier; attribute shared meters using evidenced usage with all consumer shares reconciling to the total. Retain electricity kWh, purchased heat MJ and each fuel native unit separately; 1 kWh = 3.6 MJ is only an energy-unit conversion, not electricity/heat substitution or efficiency. Count inputs covered by a service dataset once. Each other actual carrier requires its own concrete exchange or named covering service; absence from the existing cards is not an exclusion. Apply existing foreground-emission responsibility rules to on-site combustion. Normalize attributable totals exactly once under the existing normalization rules; attribute zero-output failed batches to an evidenced same-scope service period rather than divide by zero or discard them. Missing metering, attribution or coverage evidence remains a gap and prevents a completeness claim."
      inputs:
        - cp_operating_utilities
      output: "quantities and coverage by node and carrier per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "released doses"
      requirement: "Preserve donor species/breed, batch, route, quality, sperm per dose and volume."
      evidence: "donor, assay and release records"
    - id: completeness
      applies_to: "whole centre"
      requirement: "Include failed collections, grade rejects, formulation and fill losses, packaging, utilities and assets."
      evidence: "reconciled process ledgers"
    - id: temporal
      applies_to: "donor and storage"
      requirement: "Match donor-days, storage occupancy, replacement/cull and outputs to declared periods."
      evidence: "dated husbandry and vessel logs"
    - id: comparability
      applies_to: "preservation states"
      requirement: "Keep fresh/chilled/frozen denominators and quality distinct; no universal dose-yield or freezing factor."
      evidence: "route and quality logs"
validation_rules:
  - rule_id: reference
    applies_to: "final dose"
    rule: "Require centre gate, donor species, accepted count, quality and state; unresolved product UUID blocks fixed-flow publication."
    source_ids:
      - un-cpc-3
      - woah-bovine-2024
  - rule_id: route
    applies_to: "fresh/chilled/frozen"
    rule: "One state per released unit; preserve only actual route inputs, storage periods and rejects."
    source_ids:
      - fao-cryoconservation-2021
  - rule_id: balance
    applies_to: "all material interfaces"
    rule: "Reconcile semen, components, grade destinations, filled count, waste and packaging with actual records."
    source_ids:
      - fao-cryoconservation-2021
  - rule_id: attribution
    applies_to: "outputs, periods, assets"
    rule: "Verify cull/downgrade handoffs, donor period, causal split and unique shared-asset ownership."
    source_ids:
      - woah-hygiene-2024
  - rule_id: identity_review
    applies_to: "flow UUIDs"
    rule: "Contradictory platform bovine-semen candidate remains unbound pending source correction and new detail review."
    source_ids:
      - un-cpc-3
  - rule_id: v_pathway_emission_coverage
    applies_to: "donor_management"
    rule: "Require a pathway coverage ledger for enteric CH4 where biologically applicable, manure CH4, direct/indirect N2O, NH3 and relevant field emissions. Every pathway needs a measured/calculated value, a named linked process with matching coverage, or supported inapplicability; absent data cannot become zero. Keep wild life before capture outside managed husbandry, assess actual managed holding separately, and retain species-specific evidence."
    source_ids:
      - ipcc-livestock-2019
      - review-ipcc-soils-2019
      - review-eea-manure-2023
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - review-fao-pig-lca-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-livestock-2019
      - review-ipcc-soils-2019
  - rule_id: v_operating_utilities
    applies_to: "all actual operated nodes, including non-chilled/non-frozen routes"
    rule: "Reconcile cp_operating_utilities against every actual node/carrier: require measured/evidenced estimated use with a concrete exchange, a named service dataset explicitly covering it in full, or evidenced inapplicability. Check that added operating-electricity cards, existing preservation/separation energy cards and service datasets do not duplicate burdens. Fresh routes and nodes without an existing energy card are not assumed energy-free. This is a dataset-production review requirement; a PCR structural check does not prove actual completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground bovine-semen production package at centre dispatch."
  downstream_use: "secondary_dataset; background_dataset only after route, identity and data-quality review."
  allowed_use: "Species-, quality- and preservation-state-matched semen dose modelling."
  excluded_use: "Live animals, embryos, non-bovine semen, insemination service or undifferentiated fresh/frozen comparison."
  required_metadata: "Centre, gate, donor, health, batch, acceptance grade, sperm and volume per dose, preservation, package, storage period, outputs and allocation."
  required_quality_disclosure: "Unresolved UUIDs, missing records, allocation assumptions, provisional ranges and material-balance gaps."
  update_trigger: "Changed donor scope, quality standard, extender, preservation method, packaging, flow identity or allocation evidence."
data_sources:
  - id: "un-cpc-3"
    type: "standard"
