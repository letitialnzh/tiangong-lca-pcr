  classification_refs: "CPC 3.0 02411"
  covered_products: "Usable cattle and buffalo semen doses; other Bovini only with donor-specific evidence."
  excluded_products: "Live bulls, embryos, non-bovine semen, rejected material without a product handoff, insemination services."
  representative_product: "One quality-accepted dose in a sealed straw at centre dispatch."
  production_route: "Donor management → collection → quality grading → first preparation → extender formulation → filling → conditional preservation → dispatch packaging."
  market_state: "Fresh, chilled or frozen; donor, quality, volume, sperm count, container and centre gate declared."
functional_unit:
  what: "One usable bovine semen insemination dose at centre dispatch."
  how_much: "1 accepted dose; report measured volume or mass and sperm count."
  how_well: "Declared donor species/breed, health status, acceptance grade, motility, viability, sperm count, extender and preservation state."
  how_long_or_cycle: "One collection-to-dispatch batch with upkeep allocated across its observed donor period."
  reference_flow_link: "usable_dose"
system_boundary:
  rules:
    - rule_id: gate
      applies_to: "all routes"
      rule: "End at quality release from the collection centre after actual preparation and protective packing; exclude later distribution and insemination."
      source_ids:
        - woah-hygiene-2024
        - woah-bovine-2024
    - rule_id: donor
      applies_to: "donor management"
      rule: "Trace cattle and buffalo separately; other Bovini need source-specific evidence. Attribute observed feed, water, health and residues by donor-period, not a universal straw factor."
      source_ids:
        - un-cpc-3
        - fao-cryoconservation-2021
    - rule_id: interfaces
      applies_to: "centre processing"
      rule: "Identify collected raw, graded, first prepared, formulated bulk, filled, preserved and packed states; record rejected and lost states."
      source_ids:
        - woah-hygiene-2024
        - fao-cryoconservation-2021
    - rule_id: route_delta
      applies_to: "preservation"
      rule: "Fresh, chilled and frozen are mutually exclusive final states. The preservation parent activity differs in energy, cryogen, storage time, testing and losses; partition mixed lots."
      source_ids:
        - fao-cryoconservation-2021
    - rule_id: shared_service
      applies_to: "assets"
      rule: "Housing, laboratory, refrigeration and reusable vessels serve multiple nodes or periods; record service and burden once, separately from disposable packaging."
      source_ids:
        - woah-hygiene-2024
boundary_abstraction:
  declared_starting_condition: "Identified eligible bovine donor entering a recorded centre service period, plus upstream feed, water, energy, extender, packaging and cryogen supplies."
  starting_condition_role: "Donor biological management and centre preparation of reproductive goods, not live-animal sale or insemination service."
  product_classification_scope: "CPC 3.0 02411; cattle and buffalo, with other Bovini only on direct evidence."
  recursive_input_rule: "Purchased bovine semen is a traced upstream input, never counted again as on-site donor production."
  upstream_dataset_requirement: "Species- and route-matched supplies, utilities, consumables and capital services."
  disclosure: "Donor, period, gate, health/quality criteria, state route, rejects, co-outputs, shared assets and allocation."
