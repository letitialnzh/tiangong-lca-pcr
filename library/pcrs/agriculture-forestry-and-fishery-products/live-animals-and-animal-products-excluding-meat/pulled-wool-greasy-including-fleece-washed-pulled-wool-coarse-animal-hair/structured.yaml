allocation_rules:
  - rule_id: a_skin
    applies_to: "pulled route"
    rule: "Attribute inherited skin and pulling burdens between detached wool and separately sold denuded pelt using documented causal subdivision where supported; otherwise justify one physical or economic allocation for the complete output set with period/price evidence. Never assign zero by default or charge the skin twice. A nonsaleable pelt follows waste treatment."
    source_ids:
      - fao-animal-fibres-ch4
  - rule_id: a_coarse
    applies_to: "coarse route"
    rule: "Attribute actual animal phase burdens among coarse fibre and independently marketed milk, meat, fine down or other real outputs at their respective periods. Live capture does not consume the whole animal; post-mortem material uses its own traceable source allocation."
    source_ids:
      - fao-animal-fibres-ch4
  - rule_id: a_period
    applies_to: "both routes"
    rule: "Index breeding, lactation, fibre harvest, slaughter/recovery and replacement by actual cohort periods; assign each event and output once, with no universal lifetime or fibre yield."
    source_ids:
      - fao-animal-fibres-ch4
  - rule_id: a_shared
    applies_to: "both routes"
    rule: "Allocate shared capture tools, wash systems, dryers, sorting floor and press to actual consuming nodes and service periods by measured time, metered use or supported throughput; do not duplicate shared burden."
    source_ids:
      - fao-animal-fibres-ch4
  - rule_id: a_grades
    applies_to: "all grades"
    rule: "Each accepted and downgraded sale grade has one handover and attributable service; rejects and wastewater retain actual treatment burdens, not second product credits."
    source_ids:
      - fao-animal-fibres-ch4
dataset_production:
  collection_protocols:
    - protocol_id: cp_pull
      process_id: "pull"
      flow_role: "skin, aid, wool and pelt"
