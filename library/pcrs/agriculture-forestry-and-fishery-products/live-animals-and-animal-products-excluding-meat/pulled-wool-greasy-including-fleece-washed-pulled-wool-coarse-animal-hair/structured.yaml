  market_state: "Raw uncarded/uncombed as-sold fibre; distinguish greasy, fleece-washed and actual coarse-hair condition."
functional_unit:
  what: "Route-, species-, state- and gate-qualified raw pulled wool or coarse animal hair."
  how_much: "1 kg net as-sold fibre, excluding package and separable foreign material."
  how_well: "Declare raw fibre type, grade, moisture/contamination, route, source event and gate; no assumed clean-fibre equivalence."
