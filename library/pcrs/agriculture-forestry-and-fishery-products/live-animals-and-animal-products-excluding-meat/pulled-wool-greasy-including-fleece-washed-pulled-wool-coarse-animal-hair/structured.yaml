allocation_rules:
  - rule_id: a_skin
    applies_to: "pulled route"
    rule: "Attribute inherited skin and pulling burdens between detached wool and separately sold denuded pelt using documented causal subdivision where supported; otherwise justify one physical or economic allocation for the complete output set with period/price evidence. Never assign zero by default or charge the skin twice. A nonsaleable pelt follows waste treatment."
    source_ids:
      - fao-animal-fibres-ch4
  - rule_id: a_coarse
    applies_to: "coarse route"
    rule: "Attribute actual animal phase burdens among coarse fibre and independently marketed milk, meat, fine down or other real outputs at their respective periods. Live capture does not consume the whole animal; post-mortem material uses its own traceable source allocation."
    source_ids:
      - fao-animal-fibres-ch4
  - rule_id: a_period
    applies_to: "both routes"
    rule: "Index breeding, lactation, fibre harvest, slaughter/recovery and replacement by actual cohort periods; assign each event and output once, with no universal lifetime or fibre yield."
    source_ids:
      - fao-animal-fibres-ch4
  - rule_id: a_shared
    applies_to: "both routes"
    rule: "Allocate shared capture tools, wash systems, dryers, sorting floor and press to actual consuming nodes and service periods by measured time, metered use or supported throughput; do not duplicate shared burden."
    source_ids:
      - fao-animal-fibres-ch4
  - rule_id: a_grades
    applies_to: "all grades"
    rule: "Each accepted and downgraded sale grade has one handover and attributable service; rejects and wastewater retain actual treatment burdens, not second product credits."
    source_ids:
      - fao-animal-fibres-ch4
dataset_production:
  collection_protocols:
    - protocol_id: cp_pull
      process_id: "pull"
      flow_role: "skin, aid, wool and pelt"
      record_type: "batch ledger"
      raw_fields: "skin source/weight, moisture, aid identity/weight, raw wool, pelt, treatment, dispatch"
      collection_method: "scale, meter and receiving/dispatch ticket; Raw aggregation requirements: reconcile by source and batch. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;period"
      frequency: "each batch"
      temporal_coverage: "all pull events"
      site_scope: "actual fellmongery"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration and source ticket; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_coarse
      process_id: "coarse"
      flow_role: "capture event, energy and hair"
      record_type: "cohort/lot ledger"
      raw_fields: "species, source, event, method, phase, energy carrier/amount, coarse/fine hair"
      collection_method: "capture log, meter and scale; Raw aggregation requirements: reconcile by cohort and lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;carrier unit;period"
      frequency: "each event"
      temporal_coverage: "all source periods"
      site_scope: "actual farm or collector"
      aggregation_rule: "per reference flow"
      quality_evidence: "capture and meter records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_condition
      process_id: "condition"
      flow_role: "incoming, water, energy, prepared fibre"
      record_type: "batch ledger"
      raw_fields: "input/output mass, moisture, wash method, water, carrier, rejects"
      collection_method: "scale and utility meter; Raw aggregation requirements: sum once by route and state. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;carrier unit"
      frequency: "each batch"
      temporal_coverage: "complete conditioning period"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter and moisture test; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grade
      process_id: "grade"
      flow_role: "accepted, downgraded and reject"
      record_type: "grade ledger"
      raw_fields: "route, species, grade, input/output weights, buyer, treatment destination"
      collection_method: "scale and grade ticket; Raw aggregation requirements: sum by grade and destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each batch"
      temporal_coverage: "complete grading period"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "grade/dispatch record; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_pack
      process_id: "pack"
      flow_role: "net fibre and package"
      record_type: "dispatch ledger"
      raw_fields: "grade, gross, tare, net, moisture, gate, package type/mass/reuse"
      collection_method: "calibrated scale and dispatch ticket; Raw aggregation requirements: sum net by variant and gate. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;count"
      frequency: "each lot"
      temporal_coverage: "complete dispatch period"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration and sale ticket; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_residue
      process_id: "pull_coarse_condition_grade"
      flow_role: "waste and liquor"
      record_type: "residue ledger"
      raw_fields: "stream identity, origin, mass, treatment and destination"
      collection_method: "scale, effluent meter and treatment ticket; Raw aggregation requirements: sum by stream, never as product. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each stream"
      temporal_coverage: "complete process period"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter and disposal record; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: c_net
      applies_to: "sale lot"
      rule: "Net as-sold fibre = measured gross minus package tare and separable foreign matter; disclose moisture instead of clean-fibre conversion."
      inputs:
        - cp_pack
      output: "kg net fibre"
      source_ids:
        - fao-animal-fibres-ch4
    - id: c_balance
      applies_to: "each node"
      rule: "Incoming skin/fibre plus measured water/aids = product outputs plus waste, moisture change, stock change and residual; investigate residual against meter uncertainty."
      inputs:
        - cp_pull
        - cp_coarse
        - cp_condition
        - cp_grade
        - cp_residue
      output: "kg residual by route"
      source_ids:
        - fao-animal-fibres-ch4
    - id: c_attr
      applies_to: "source and shared operations"
      rule: "Attribute actual burdens once by phase/output and shared service; record method, denominator and every saleable destination."
      inputs:
        - cp_pull
        - cp_coarse
        - cp_grade
      output: "attributable burden by variant"
      source_ids:
        - fao-animal-fibres-ch4
    - id: c_norm
      applies_to: "reference lot"
      rule: "Divide attributable quantity by strictly positive net mass of declared route, grade, state and gate."
      inputs:
        - cp_pack
        - cp_pull
        - cp_coarse
      output: "amount/kg reference"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "each route and lot"
      requirement: "Prove species, skin source or capture event, raw condition, grade, gate and category boundary."
      evidence: "source and grade tickets"
    - id: q_mass
      applies_to: "each batch"
      requirement: "Calibrate scales/meters, measure moisture and reconcile skin/pelt/wool or coarse hair without default conversion."
      evidence: "calibration and mass balance"
    - id: q_attribution
      applies_to: "outputs and periods"
      requirement: "Retain animal phase, inherited skin burden, pelt/hair sale, shared equipment and allocation worksheet."
      evidence: "cohort, source, invoice and service records"
    - id: q_uuid
      applies_to: "concrete exchange"
      requirement: "Resolve exact flow type, state, direction, property and gate before final TIDAS exchange."
      evidence: "verified platform detail and support rows"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference lot"
    rule: "Reject shorn wool, fine hair, attached fleece in sold skin, carded/combed/scoured material or absent route, species, state, net mass or gate."
    source_ids:
      - un-cpc-3-notes
  - rule_id: v_route
    applies_to: "source and capture"
    rule: "Pulled lots require separate incoming skin and detached wool/pelt outputs; coarse lots require actual species/event and must not inherit fictional skin wash/depilation."
    source_ids:
      - fao-animal-fibres-ch4
  - rule_id: v_mass
    applies_to: "each batch"
    rule: "Reconcile all grades, pelt, rejects, utilities and moisture within measured uncertainty; reject undocumented raw-to-clean factors."
    source_ids:
      - fao-animal-fibres-ch4
  - rule_id: v_attribution
    applies_to: "animal and shared services"
    rule: "Reject duplicate attached/detached wool, unsupported zero-burden skin, repeated animal period, pelt or shared-asset burden."
    source_ids:
      - fao-animal-fibres-ch4
  - rule_id: v_uuid
    applies_to: "final exchanges"
    rule: "Unresolved cards remain semantic only; each final exchange requires one detail-verified concrete UUID and compatible property/unit group."
    source_ids: []
published_dataset_profile:
  dataset_role: "Route-, species-, state-, grade- and gate-qualified foreground raw fibre."
  downstream_use: "Candidate secondary_dataset or background_dataset after concrete identity, review and publication."
  allowed_use: "Measured like-for-like raw-fibre variant and actual route with disclosed co-products."
  excluded_use: "Substituting pulled wool for unrelated coarse hair, default clean-fibre conversion, attached skin or unsupported zero burden."
  required_metadata: "Species, source event, route, grade, raw/fleece-washed state, contamination, moisture, net mass, gate, periods and allocation."
  required_quality_disclosure: "Skin/pelt and coarse-hair output ledger, shared services, wash/aids, rejects, mass residual and unresolved UUIDs."
  update_trigger: "Verified exact product UUID, changed route/gate or source-backed moisture, allocation or yield evidence."
