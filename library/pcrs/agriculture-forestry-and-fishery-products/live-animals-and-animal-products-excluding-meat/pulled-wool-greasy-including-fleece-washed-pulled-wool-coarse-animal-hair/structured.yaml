system_boundary:
  rules:
    - rule_id: b_routes
      applies_to: "source and capture"
      rule: "Pulled route begins with a separately acquired wool-bearing sheep skin. Coarse route uses actual live clipping/combing/collection or eligible documented post-mortem separation, never a fictional fellmongery chemical step. Earlier breeding, meat, dairy and fibre phases remain in compatible upstream data."
      source_ids:
        - fao-animal-fibres-ch4
        - un-cpc-3-notes
    - rule_id: b_pull
      applies_to: "pulled route"
      rule: "Actual skin wash, detachment aid, pulling and denuded-pelt handover are included only when performed. Saleable pelt is a distinct intended output; wool still attached to an unsplit skin is not a second product. Tanning is outside."
      source_ids:
        - fao-animal-fibres-ch4
    - rule_id: b_condition
      applies_to: "both routes"
      rule: "First skirting, particulate removal and drying are included as performed; fleece-washing must be declared. Exclude later scouring and textile carding/combing."
      source_ids:
        - fao-animal-fibres-ch4
        - fao-animal-fibres-ch5
    - rule_id: b_gate
      applies_to: "final handover"
      rule: "Protect and weigh raw fibre at its actual farm, collection or fellmongery gate; packaging within boundary, distribution beyond gate excluded."
      source_ids:
        - un-cpc-3-notes
boundary_abstraction:
  declared_starting_condition: "Documented wool-bearing sheep skin entering fellmongery, or documented species-specific coarse-hair source entering an independent harvest event."
  starting_condition_role: "Upstream animal husbandry, slaughter or lawful recovery supplies compatible burdens. Fellmongery starts with a separately burdened skin; live-animal hair capture records actual harvest services without treating the entire animal as consumed. Post-mortem coarse source requires a traceable material interface."
  product_classification_scope: "Only detached raw pulled wool or qualifying raw coarse animal hair."
  recursive_input_rule: "Purchased same-category fibre retains its upstream burden; it is not recaptured as new output."
  upstream_dataset_requirement: "Trace animal/skin source, earlier outputs and period allocation; do not assign zero burden to skin or fibre by default."
  disclosure: "Route, species, source event, co-products, skin/pelt and fibre handoffs, grade, moisture, gate, shared assets and allocation."
