allocation_rules:
  - rule_id: a_source
    applies_to: "source and remove"
    rule: "Enumerate earlier farm products at source, then skin and actual saleable terminal products at removal; each has a distinct handover and is counted once. Subdivide independently measured services; for inseparable source burdens use documented physical causality where defensible, otherwise contemporaneous net economic values of actual products with price sensitivity. Neither zero nor whole-animal burden is automatic."
    source_ids:
      - fao-hides-skins
  - rule_id: a_period
    applies_to: "farm or wild route"
    rule: "Link breeding/growth, capture/slaughter, removal, replacement and termination to actual periods. Wild capture has no invented managed husbandry. Each input and output is attributed once."
    source_ids:
      - un-cpc-3-notes
  - rule_id: a_shared
    applies_to: "shared traps, removal tools, cleaning and cold/drying rooms"
    rule: "Identify all consuming nodes and service periods. Prefer measured use; otherwise documented service hours or throughput, assigned once without upstream/foreground duplication."
    source_ids:
      - fao-hides-skins
  - rule_id: a_state
    applies_to: "fresh/preserved; whole/piece"
    rule: "One lot has one marketed state and configuration at its gate. Do not count a pelt and its cuttings twice; allocate treatment only to treated lots."
    source_ids:
      - eu-raw-furskin-heading
dataset_production:
  collection_protocols:
    - protocol_id: cp_source
      process_id: "source"
      flow_role: "source and actual co-products"
      record_type: "event ledger"
      raw_fields: "species; farm_or_wild; legal_id; cohort_or_capture; mass; products; price; period"
      collection_method: "supplier/capture and sale records"
      unit: "kg; currency; period"
      frequency: "each event"
      temporal_coverage: "actual cohort or season"
      site_scope: "actual source"
      aggregation_rule: "link each event and product once"
      quality_evidence: "authorization; sales"
    - protocol_id: cp_remove
      process_id: "remove"
      flow_role: "skin, terminal products and loss"
      record_type: "removal ledger"
      raw_fields: "event; input; raw_skin; actual_terminal_products; residue; each_destination"
      collection_method: "scale, sale and treatment tickets"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "period"
      site_scope: "removal site"
      aggregation_rule: "reconcile all products and waste once"
      quality_evidence: "scale; sale; treatment ticket"
    - protocol_id: cp_condition
      process_id: "condition"
      flow_role: "first-prepared skin and water"
      record_type: "preparation log"
      raw_fields: "input; water; output; trim; method"
      collection_method: "scale and meter"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "period"
      site_scope: "preparation site"
      aggregation_rule: "actual intervention only"
      quality_evidence: "meter; scale"
    - protocol_id: cp_grade
      process_id: "grade"
      flow_role: "accepted/downgrade/reject"
      record_type: "grade ledger"
      raw_fields: "species; fur_quality; configuration; accepted; downgrade; reject; item_count; destinations"
      collection_method: "grading and scale"
      unit: "kg; item"
      frequency: "each lot"
      temporal_coverage: "period"
      site_scope: "grading site"
      aggregation_rule: "separate grade destinations"
      quality_evidence: "grade; sale records"
    - protocol_id: cp_preserve
      process_id: "preserve"
      flow_role: "treated skin and service"
      record_type: "treatment log"
      raw_fields: "before; after; state; moisture; salt; energy; room_time; reject"
      collection_method: "scale and meter"
      unit: "kg; kWh; h"
      frequency: "treated lot"
      temporal_coverage: "period"
      site_scope: "curing site"
      aggregation_rule: "reconcile state and use"
      quality_evidence: "meter; treatment log"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "net product and package"
      record_type: "handover ledger"
      raw_fields: "lot; state; species; configuration; gate; net_mass; package; count; reuse"
      collection_method: "ticket and scale"
      unit: "kg; item; turn"
      frequency: "each handover"
      temporal_coverage: "period"
      site_scope: "actual gate"
      aggregation_rule: "accepted net mass only"
      quality_evidence: "signed ticket"
  calculation_rules:
    - id: c_ref
      applies_to: "reference"
      rule: "Net sold mass = measured gross less package and separable free preservative; item count is not mass."
      inputs:
        - gross
        - tare
        - "free preservative"
      output: "kg as sold"
      source_ids:
        - fao-hides-skins
    - id: c_piece
      applies_to: "counted items"
      rule: "Observed lot kg/item = measured homogeneous lot net mass / counted items; never reuse across species, grade, state or configuration."
      inputs:
        - mass
        - count
        - qualifiers
      output: "observed kg/item"
      source_ids:
        - eu-raw-furskin-heading
    - id: c_balance
      applies_to: "each lot"
      rule: "Reconcile material output, residues and moisture/state differences with measured input; investigate gaps, not default yields."
      inputs:
        - input
        - output
        - state
      output: "kg ledger"
      source_ids:
        - fao-hides-skins
    - id: c_shared
      applies_to: "shared service"
      rule: "Assign metered use or documented service-hour/throughput share once for each actual consumer and period."
      inputs:
        - burden
        - use
        - period
      output: "allocated burden"
      source_ids:
        - fao-hides-skins
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every lot"
      requirement: "Verify species, legality, furrier-use quality, whole/piece composition and undressed state; sheep hide is not inferred to be furskin."
      evidence: "authority and grade/sale record"
    - id: dq_mass
      applies_to: "all material"
      requirement: "Calibrated mass and destination; no parent pelt and cutting double count."
      evidence: "scale and balance"
    - id: dq_period
      applies_to: "source and shared assets"
      requirement: "Actual cohort/season, period and consuming node, including replacement or termination."
      evidence: "event and asset ledgers"
    - id: dq_state
      applies_to: "preservation"
      requirement: "Actual before/after state; no universal fresh-to-preserved conversion."
      evidence: "treatment and mass records"
    - id: dq_uuid
      applies_to: "exchange generation"
      requirement: "Resolve a concrete compatible platform identity; blank candidate identity is not final exchange permission."
      evidence: "detail and support-row evidence"
validation_rules:
  - rule_id: v_scope
    applies_to: "sold lot"
    rule: "Reject tanned, dressed, manufactured or hair-bearing non-furrier goods; verify lawful source and actual furrier-use whole/piece identity."
    source_ids:
      - un-cpc-3-notes
      - eu-raw-furskin-heading
  - rule_id: v_balance
    applies_to: "each lot"
    rule: "Reconcile source, removed, prepared, accepted, downgrade, waste, treated and sold mass at their measured states."
    source_ids:
      - fao-hides-skins
  - rule_id: v_route
    applies_to: "farm/wild"
    rule: "No farm animal input on wild route; actual co-products and source burden once; no upstream capture/slaughter duplication."
    source_ids:
      - un-cpc-3-notes
  - rule_id: v_period
    applies_to: "shared service"
    rule: "Source event and each shared trap, removal, cleaning or cold/dry service have one period and one attributed consumer share."
    source_ids:
      - fao-hides-skins
  - rule_id: v_binding
    applies_to: "all cards"
    rule: "conditional product inputs require actual concrete selection; uncovered UUIDs need detail confirmation. Mixed raw/dressed count-based candidates cannot bind a raw Mass reference."
    source_ids: []
published_dataset_profile:
  dataset_role: "Species- and route-qualified foreground raw-furskin data package."
  downstream_use: "secondary_dataset or background_dataset after method and identity review."
  allowed_use: "Raw furrier-suitable product at measured species, configuration, state and gate."
  excluded_use: "Dressed/tanned fur, ordinary hide, non-furrier skin, unknown species or invented item-to-kg conversion."
  required_metadata: "Legal source; species; route; whole/piece; fur grade; mass/count; state; gate; period; allocation."
  required_quality_disclosure: "Completeness, mass, attribution, shared services, conversion uncertainty and unresolved UUIDs."
  update_trigger: "Material route, furrier criterion, preservation, gate, source-rule or platform-identity change."
