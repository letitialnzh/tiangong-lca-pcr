system_boundary:
  rules:
    - rule_id: b_source
      applies_to: "source"
      rule: "Separate farm from lawful wild capture. Include actual co-products only when independently marketed; do not repeat upstream animal or capture operations."
      source_ids:
        - un-cpc-3-notes
    - rule_id: b_remove
      applies_to: "skin removal"
      rule: "Distinct capture/source and removal events; identify raw fur-on output, incidental tissue and losses, and handoff before first cleaning."
      source_ids:
        - fao-hides-skins
    - rule_id: b_condition
      applies_to: "first preparation"
      rule: "Include only actual fleshing, cleaning and trimming; exclude dressing, tanning and manufacturing."
      source_ids:
        - fao-hides-skins
        - eu-raw-furskin-heading
    - rule_id: b_grade
      applies_to: "grading"
      rule: "Separate accepted whole/pieces, saleable downgrade and waste, each with its own destination. Ordinary sheep hide cannot become furskin by hair alone."
      source_ids:
        - un-cpc-3-notes
        - eu-raw-furskin-heading
    - rule_id: b_preserve
      applies_to: "treated lots"
      rule: "Fresh lots bypass; actual cold, drying or salt stabilization records before/after state, inputs and rejected material."
      source_ids:
        - fao-hides-skins
    - rule_id: b_gate
      applies_to: "handover"
      rule: "Include protective presentation up to actual collection/curing gate; exclude distribution and downstream fur dressing."
      source_ids:
        - un-cpc-3-notes
