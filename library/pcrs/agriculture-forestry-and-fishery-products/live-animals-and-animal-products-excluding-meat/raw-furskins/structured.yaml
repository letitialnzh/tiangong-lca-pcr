    reference: "https://faolex.fao.org/docs/pdf/eur212388.pdf"
    used_for: "Raw fur and whole/part distinction."
  - id: "fao-hides-skins"
    type: "official_guidance"
    reference: "https://www.fao.org/4/i0523e/i0523e.pdf"
    used_for: "First raw-skin handling and preservation."
