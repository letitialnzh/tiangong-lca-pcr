allocation_rules:
  - rule_id: a_output_set
    applies_to: "breeder, hatchery, grow-out"
    rule: "Identify accepted eggs at breeder handover, saleable keets at hatchery gate, older live birds at farm gate, and only actually sold culls or manure as independent intended outputs. Rejects, mortality, shells and unsold litter are waste or loss, not free co-products."
    source_ids:
      - fao-small-poultry
      - fao-leap-poultry-2016
  - rule_id: a_method
    applies_to: "genuinely independent co-products"
    rule: "Prefer demonstrated physical causality; otherwise declare a single period-specific mass or economic allocation with output evidence and sensitivity. A transferred egg/keet is not also a final live-bird sale when integrated."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_period
    applies_to: "breeder, hatch and growth phases"
    rule: "Link breeder replacement, egg production, hatch batches, keet cohorts, culls and shared assets to their actual periods. Opening/closing stock and mortality are reconciled, and burden is assigned once across periods."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: a_shared
    applies_to: "incubator, house, heat, meter, water equipment"
    rule: "Enumerate breeder, hatchery and grow-out users and service periods; allocate by metered use or documented capacity-time and sum shares to the single original ledger."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_breeder
      process_id: "breeder"
      flow_role: "feed, water, energy, eggs, culls, manure and rejects"
      record_type: "breeder ledger"
      raw_fields: "opening/closing flock; feed; water/energy meters; egg count/mass; reject reason; culls; manure export/fate; period"
      collection_method: "husbandry logs, meters, count and scale; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "head, eggs, kg, m3, kWh"
      frequency: "daily/period"
      temporal_coverage: "full breeder period"
      site_scope: "integrated breeder"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed flock, egg and transfer balance; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_breeder_manure
      process_id: "breeder"
      flow_role: "breeder CH4, N2O, NH3"
      record_type: "breeder manure record"
      raw_fields: "bird-period; volatile solids; excreted N; storage/range deposition shares; factor tier"
      collection_method: "manure/farm logs and pathway method; Raw aggregation requirements: calculate distinct pathway emissions once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, fraction"
      frequency: "period"
      temporal_coverage: "full breeder and manure period"
      site_scope: "integrated breeder"
      aggregation_rule: "per reference flow"
      quality_evidence: "factor and pathway evidence; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_hatchery
      process_id: "hatchery"
      flow_role: "eggs, energy, keets, losses"
      record_type: "hatch batch"
      raw_fields: "egg source/count/mass; setting; energy meters; hatch, reject and loss counts; keet sample weight"
      collection_method: "receipt, incubation and dispatch logs; Raw aggregation requirements: count balance and count × sampled mass. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "eggs, head, kg, kWh"
      frequency: "batch"
      temporal_coverage: "receipt through hatchery gate"
      site_scope: "producer hatchery"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed hatch balance and meter readings; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_growout
      process_id: "growout"
      flow_role: "keets, feed, water, energy, standing flock, manure export and residues"
      record_type: "growth cohort"
      raw_fields: "keet source/count/mass; ration/moisture; forage method; water/energy; mortality; litter/manure mass/export/fate; count"
      collection_method: "receipts, daily logs, scales, meters; Raw aggregation requirements: Use calc_feed_supply_and_intake to distinguish supplied feed carrying production burden, actual intake and losses; preserve all native stock and period records, then normalize the attributable quantity once to accepted final output."
      unit: "head, kg, m3, kWh"
      frequency: "daily/cohort"
      temporal_coverage: "full brooding/growth period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoices, scales and stock reconciliation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
      process_id: "growout"
      flow_role: "grow-out CH4, N2O, NH3"
      record_type: "manure pathway"
      raw_fields: "bird-period, volatile solids, N excretion, storage and range shares, factor tier"
      collection_method: "farm logs and pathway calculation; Raw aggregation requirements: model non-overlapping direct and applicable indirect pathways under calc_manure_n2o_coverage. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, fraction"
      frequency: "cohort/period"
      temporal_coverage: "full manure period"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "factor and destination log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_capture
      process_id: "capture"
      flow_role: "standing, saleable and loss birds"
      record_type: "farm dispatch"
      raw_fields: "standing/saleable/reject counts, sampled weight, age, dispatch time and gate"
      collection_method: "direct count and sampled scale; Raw aggregation requirements: count × sampled mass, one final dispatch. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head, kg"
      frequency: "each dispatch"
      temporal_coverage: "capture through farm gate"
      site_scope: "producing farm"
      aggregation_rule: "per reference flow"
      quality_evidence: "weigh and signed delivery slips; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reference_handover
      process_id: "reference_handover"
      flow_role: "accepted product and matched internal source transfer"
      record_type: "producer handover ledger"
      raw_fields: "lot_id, species, state, grade, route_id, gate, period, accepted_quantity, native_unit, source_row_id, source_lot_id, allocation_link"
      collection_method: "Measure accepted net product at the same actual gate; reconcile the listed state/gate-specific source rows and the linked input with this single physical output. Keep rejects, stock changes and other sales separate. No additional handling or transport is imputed."
      unit: "kg; native source quantities"
      frequency: "each actual handover"
      temporal_coverage: "matched source and handover periods"
      site_scope: "declared producer gate only"
      aggregation_rule: "per reference flow"
      quality_evidence: "traceable acceptance record, same-lot source-to-output ledger, calibrated quantity method and normalization worksheet"
    - protocol_id: cp_feed_supply_and_intake
      process_id: "breeder_growout"
      flow_role: "Feed supply, intake and loss"
      record_type: "stock, receipt, issue and loss ledger"
      raw_fields: "feed identity/source; cohort/phase; period; opening/closing stock; receipts; on-site provision; unused returns/transfers; uneaten/spoiled mass and destination; as-fed/DM; actual intake; burden owner; accepted final output"
      collection_method: "Reconcile matched stock, scales, ration/forage estimates and disposal records under calc_feed_supply_and_intake. Keep raw totals and stage denominators; assign production and treatment burden once, then normalize to accepted final output."
      unit: "kg as-fed; kg DM"
      frequency: "each issue and period close"
      temporal_coverage: "complete represented cohort/period"
      site_scope: "actual operated feeding nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock and supplier records; moisture evidence; loss and no-duplication reconciliation"
    - protocol_id: cp_manure_n2o_coverage
      process_id: "breeder_growout"
      flow_role: "Direct and indirect manure/soil N2O coverage"
      record_type: "pathway N ledger and method worksheet"
      raw_fields: "species/class; period; excreted N; stage stocks/transfers; system shares; volatilised NH3-N/NOx-N; leached/runoff N; application/grazing N; factor source, unit and applicability; direct/indirect components; receiving medium; linked process and assigned card; accepted final output"
      collection_method: "Retain raw stage N and component calculations under calc_manure_n2o_coverage, matched to actual operation and existing manure protocols. Document unsupported or inapplicable paths and coverage boundaries; normalize attributable N2O once."
      unit: "kg N; kg N2O"
      frequency: "each reporting period and management change"
      temporal_coverage: "complete represented management period"
      site_scope: "actual operated and explicitly linked nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "N balance, factor unit/applicability, component-to-card and no-duplication worksheet"
  calculation_rules:
    - id: c_live_mass
      applies_to: "final bird outputs"
      rule: "saleable heads × representative mean live mass by age/class and route"
      inputs:
        - "counts and sampled weights"
      output: "kg live guinea fowl"
      source_ids:
        - count-balance-identity
    - id: c_hatch
      applies_to: "hatch batch"
      rule: "accepted eggs = saleable keets + non-saleable keets + unhatched eggs + documented other outcomes, in counts"
      inputs:
        - "receipt and hatch log"
      output: "reconciled hatch yield and losses"
      source_ids:
        - count-balance-identity
    - id: c_cohort
      applies_to: "grow-out"
      rule: "opening keets + receipts − mortality − final transfer = closing heads, with other transfers separately identified"
      inputs:
        - "cohort ledger"
      output: "reconciled head balance"
      source_ids:
        - count-balance-identity
    - id: c_manure
      applies_to: "CH4, NH3 and direct/indirect N2O"
      rule: "Apply documented manure CH4/NH3 methods and calc_manure_n2o_coverage for N2O; retain stage-specific disaggregated calculations before assigning existing cards."
      inputs:
        - bird-period
        - "volatile solids"
        - "excreted N"
        - "pathway shares"
      output: "kg CH4, N2O and NH3 to air"
      source_ids:
        - ipcc-livestock-2019
    - id: calc_feed_supply_and_intake
      applies_to: "breeder_feed; growout_feed"
      rule: "Feed supply used by the represented operation = opening feed stock + receipts + on-site feed entering the operation - closing feed stock - documented unused returns or transfers out. Retain in-boundary spoilage, refusals and discarded leftovers in that supply. Actual intake = that supply - measured uneaten/discarded losses, after matching moisture/DM and period; use intake only for nutrition/metabolism. Opening stock retains its prior burden and is not another purchase. Trace any unused return or transfer and its burden destination; no automatic substitution credit. Attribute production once, through either the purchased-feed dataset or the represented on-site crop/collection node, never both for the same feed. Include actual waste treatment and manure contributions once, not as a second feed-production burden."
      inputs:
        - cp_feed_supply_and_intake
      output: "separate feed supply, intake and loss quantities, in matched as-fed/DM units"
      source_ids:
        - fao-feed-loss-accounting-2018
    - id: calc_manure_n2o_coverage
      applies_to: "breeder_n2o; growout_n2o"
      rule: "For each actual manure stage, calculate direct N2O, volatilisation/deposition-derived indirect N2O, and applicable leaching/runoff-derived indirect N2O separately with documented species/system activity and factor basis. Convert N2O-N to molecular N2O by 44/28 once; do not reconvert molecular masses. Retain component worksheets. Where an existing N2O card covers both direct and indirect emissions, report their non-overlapping sum; where separate direct/indirect cards exist, assign each component once to its matching card and never also report the sum. Pasture deposition and land application use the managed-soil method, not a manure-storage factor. Assign foreground versus linked treatment/pasture coverage explicitly; a manure export does not erase earlier emissions, and already covered downstream emissions are not repeated. Account for stock, transfers and previous N losses in the nitrogen cascade; indirect N2O is a downstream transformation of its precursor, not a second source-stage N loss. Normalize attributed molecular masses once to the accepted reference output. Document inapplicability; absent pathway data are not zero."
      inputs:
        - cp_manure_n2o_coverage
      output: "kg molecular N2O by pathway and assigned existing card"
      source_ids:
        - ipcc-livestock-2019
        - ipcc-managed-soils-2019
  data_quality_requirements:
    - id: q_identity
      applies_to: "reference"
      requirement: "species, age/class, live condition, producer gate, count and mass are explicit"
      evidence: "dispatch and sample record"
    - id: q_predecessor
      applies_to: "eggs and keets"
      requirement: "source and preceding burden are traceable; outsourcing or surrogate incubation is not counted as on-farm work"
      evidence: "supplier dataset and receipt"
    - id: q_stock
      applies_to: "breeder and grow-out"
      requirement: "reconcile opening stock, births/hatches, receipts, mortality, culls, transfers and closing stock by period"
      evidence: "signed stock ledger"
    - id: q_route
      applies_to: "free-range or housed"
      requirement: "actual mode, forage method, housing energy, mortality and manure deposition/storage are recorded, not assumed"
      evidence: "flock/field/house logs"
    - id: q_outputs
      applies_to: "co-products and waste"
      requirement: "document independently marketed eggs/culls/manure and each rejected material's fate"
      evidence: "sales and treatment transfer"
validation_rules:
  - rule_id: v_gate
    applies_to: "reference and final output"
    rule: "Reject unidentified hatchery/farm mixture; do not use farm-gate fixed UUID for a keet at hatchery gate."
    source_ids:
      - unsd-cpc-2025
  - rule_id: v_egg
    applies_to: "integrated breeder and hatchery"
    rule: "Reconcile egg receipt, hatch, rejects and losses; no more than one saleable keet per accepted egg."
    source_ids:
      - count-balance-identity
  - rule_id: v_stock
    applies_to: "grow-out and capture"
    rule: "Reconcile keet receipts, mortality, standing flock, capture losses and saleable dispatch with count/mass evidence."
    source_ids:
      - count-balance-identity
  - rule_id: v_deltas
    applies_to: "range/housed routes"
    rule: "Check actual feed, water, housing energy, free-range placement and mortality evidence for each claimed route; no imported route defaults."
    source_ids:
      - fao-guinea-field-study
  - rule_id: v_attribution
    applies_to: "intended outputs, periods and shared assets"
    rule: "Require real output gates, declared allocation basis, breeder/hatch/cohort periods and one shared-asset ledger; prohibit duplicate internal keet burden."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: v_emission
    applies_to: "manure CH4, N2O and NH3"
    rule: "Confirm exact substance, air medium, non-overlapping storage/range pathways, factor tier and period before using each fixed identity."
    source_ids:
      - ipcc-livestock-2019
  - rule_id: v_foreground_emission_responsibility
    applies_to: "Actual operated nodes and linked services"
    rule: "Record responsibility for on-site fuel combustion and refrigerant leakage when applicable: either quantified foreground emissions or a named linked process explicitly covering them, never merely a fuel-supply or electricity-production input. Assess special-taxon biological and residue emissions using species/route evidence, without a generic livestock factor. Identify any unresolved pathway and withhold a completeness claim; document supported absence and prevent duplicate upstream/downstream accounting."
    source_ids: []
  - rule_id: v_feed_supply_intake_separation
    applies_to: "All feed inputs"
    rule: "Reject an upstream feed inventory reduced by in-boundary refusal, spoilage or discarded leftovers without retaining their production burden. Reconcile supply, intake, stock, transfers and loss destinations under calc_feed_supply_and_intake. Do not reuse intake as supplied feed, assume zero-burden on-site feed or grant automatic avoided-product credits."
    source_ids:
      - fao-feed-loss-accounting-2018
  - rule_id: v_manure_n2o_coverage
    applies_to: "Applicable manure and managed-soil N pathways"
    rule: "Require explicit direct and indirect pathway coverage, stage N balances and molecular-mass conversion. Map each component to an existing N2O card or an explicitly covering linked process once under calc_manure_n2o_coverage. Missing indirect-pathway evidence prevents a completeness claim; no default zero or duplicate aggregate-plus-components."
    source_ids:
      - ipcc-livestock-2019
      - ipcc-managed-soils-2019
published_dataset_profile:
  dataset_role: "producer-gate live guinea-fowl foreground data package"
  downstream_use: "secondary_dataset and background_dataset for process and lifecyclemodel"
  allowed_use: "declared hatchery-keet or older-farm-bird route with recorded count, mass and preceding burden"
  excluded_use: "meat, slaughter, eggs as reference, unidentified mixed gate or outsourced hatchery as on-farm operation"
  required_metadata: "producer, species, gate, age/class, head count, sampled mass, flock/batch, predecessor, range/housing mode, mortality, manure and shared periods"
  required_quality_disclosure: "coverage, sampling, predecessor gaps, co-product allocation, manure method, unbound reference/keets and concrete flow identity resolution"
  update_trigger: "change in route, predecessor, breed/flock system, mortality, housing, manure, co-output or material data gap"
