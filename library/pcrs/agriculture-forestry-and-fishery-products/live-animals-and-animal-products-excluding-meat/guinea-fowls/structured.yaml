system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The hatchery route begins with accepted guinea-fowl hatching eggs bearing upstream breeding burden and includes incubation, hatch-pull/selection, loss handling and keet dispatch. When breeding is integrated, record its flock-year feed, water, housing, eggs, culls and manure separately; do not also attach a purchased-egg burden. The older-bird route begins with received keets and their supplier or internal hatchery burden, includes brooding/growth, feed, supplied water, housing, health, mortality, litter/manure and independent live capture at farm handover. Capture is distinct from growth because the standing flock is counted, weighed and classified into saleable live birds versus capture losses. Slaughter, meat processing and post-gate freight are outside scope. Independently transferred breeder eggs, culls and usable manure require explicit intended-output classification; unsold rejects and mortality remain waste. Attribute shared incubator, house, heating and water equipment by consuming node and service period exactly once."
      source_ids: []
    - rule_id: b_product
      applies_to: "final live output"
      rule: "Include live Numida meleagris at declared producer hatchery or farm gate, not meat or eggs."
      source_ids:
        - unsd-cpc-2025
        - fao-poultry-species
    - rule_id: b_hatch
      applies_to: "hatchery"
      rule: "Include accepted eggs, incubation, hatch outcome and live keet dispatch; outsource or surrogate incubation as an upstream burden if not operated."
      source_ids:
        - fao-small-poultry
    - rule_id: b_growth
      applies_to: "older live birds"
      rule: "Include received keets, actual range/housing management, feeding, water, health, manure/mortality and live capture."
      source_ids:
        - fao-small-poultry
        - fao-guinea-field-study
        - ipcc-livestock-2019
    - rule_id: b_exclude
      applies_to: "producer gate"
      rule: "Exclude slaughter, meat processing and transport after handover."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: reference_handover_linkage
      applies_to: "actual reference-product boundary"
      rule: "Record reference_handover as the same physical producer handover already represented by its source rows. It must not extend the gate or insert new processing, capture, storage, transport, service or capital burdens. For a unit-process projection, keep the actually operated stage references; the handover record may be a boundary interface in the resulting foreground package, not an invented standalone operation. Select one actual qualified route/output stratum; trace matching source and input as internal transfers and expose the accepted reference product once. If the source already ended at this gate, partition its existing handover responsibility without counting it again."
      source_ids: []
