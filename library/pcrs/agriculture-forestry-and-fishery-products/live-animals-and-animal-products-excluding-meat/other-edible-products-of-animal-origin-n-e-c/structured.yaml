allocation_rules:
  - rule_id: a_source
    applies_to: "actual source output set"
    rule: "Enumerate each intended product, amount and gate. Use measured causal attribution when supported; otherwise document period-specific economic allocation with sensitivity. Do not assign automatic zero or entire source burden to 02939."
    source_ids:
      - eu-residual
  - rule_id: a_grade
    applies_to: "grades and residue"
    rule: "Accepted and separately saleable downgraded goods have disjoint masses/destinations; non-food rejects and incidental residue are not extra edible products."
    source_ids:
      - un-cpc-3
  - rule_id: a_period
    applies_to: "phases and shared service"
    rule: "Index source establishment/productive/replacement/termination periods; assign observed shared-service time or throughput to consuming nodes/lots once with evidence."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_collect
      process_id: "collect"
      flow_role: "source and collected good"
      record_type: "source ledger"
      raw_fields: "good, species, legal/food status, real outputs, mass, gate, period"
      collection_method: "source ticket and calibrated scale; Raw aggregation requirements: once per output/lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;period"
      frequency: "each lot"
      temporal_coverage: "source and collection periods"
      site_scope: "source and collector"
      aggregation_rule: "per reference flow"
      quality_evidence: "source, legal and scale records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "first cleaning and prepared good"
      record_type: "batch ledger"
      raw_fields: "state, mass in/out, water, service, rejects"
      collection_method: "ticket, scale and meter; Raw aggregation requirements: measured state balance. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each performed lot"
      temporal_coverage: "preparation period"
      site_scope: "site"
      aggregation_rule: "per reference flow"
      quality_evidence: "ticket and calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_stabilize
      process_id: "stabilize"
      flow_role: "optional preservation"
      record_type: "preservation ledger"
      raw_fields: "pre/post state, mass, moisture, temperature, energy, losses"
      collection_method: "meter, scale and assay; Raw aggregation requirements: before/after balance. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg;MJ"
      frequency: "each performed lot"
      temporal_coverage: "preservation period"
      site_scope: "site"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter and assay; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grade
      process_id: "grade"
      flow_role: "grades and destinations"
      record_type: "grade ledger"
      raw_fields: "accepted, downgrade, reject, food decision, destinations"
      collection_method: "grade ticket and scale; Raw aggregation requirements: disjoint output set. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "grading period"
      site_scope: "site"
      aggregation_rule: "per reference flow"
      quality_evidence: "grade/destination records; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "net sale, package, gate"
      record_type: "dispatch ledger"
      raw_fields: "state, moisture, gross, tare, net, package reuse, gate"
      collection_method: "dispatch ticket and scale; Raw aggregation requirements: one net handover/lot. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "handover period"
      site_scope: "site"
      aggregation_rule: "per reference flow"
      quality_evidence: "ticket and calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_reject
      process_id: "collect_prepare_stabilize_grade"
      flow_role: "residue/waste"
      record_type: "disposition ledger"
      raw_fields: "lot, type, mass, legal status, destination"
      collection_method: "weighing and transfer ticket; Raw aggregation requirements: once per terminal destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "relevant period"
      site_scope: "site"
      aggregation_rule: "per reference flow"
      quality_evidence: "transfer record; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: c_net
      applies_to: "sale lot"
      rule: "Net qualified good = gross - package tare - separately removed inedible matter; use actual moisture, not a universal dry conversion."
      inputs:
        - cp_handover
      output: "kg net good"
      source_ids: []
    - id: c_balance
      applies_to: "performed nodes"
      rule: "Reconcile material input and additions with food outputs, rejects, measured water loss and stock change; investigate residual."
      inputs:
        - cp_collect
        - cp_prepare
        - cp_stabilize
        - cp_grade
        - cp_reject
      output: "kg balance residual"
      source_ids: []
    - id: c_period
      applies_to: "source and shared assets"
      rule: "Link each source phase and shared service to real lots and periods, allocating once by observed use."
      inputs:
        - cp_collect
        - cp_prepare
        - cp_stabilize
        - cp_handover
      output: "burden/kg"
      source_ids: []
    - id: c_norm
      applies_to: "concrete exchange"
      rule: "Divide attributable exchange by positive net mass of the same named good/source/state/gate lot."
      inputs:
        - cp_handover
      output: "unit/kg good"
      source_ids: []
