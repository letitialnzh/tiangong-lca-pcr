allocation_rules:
  - rule_id: a_source
    applies_to: "actual source output set"
    rule: "Enumerate each intended product, amount and gate. Use measured causal attribution when supported; otherwise document period-specific economic allocation with sensitivity. Do not assign automatic zero or entire source burden to 02939."
    source_ids:
      - eu-residual
  - rule_id: a_grade
    applies_to: "grades and residue"
    rule: "Accepted and separately saleable downgraded goods have disjoint masses/destinations; non-food rejects and incidental residue are not extra edible products."
    source_ids:
      - un-cpc-3
  - rule_id: a_period
    applies_to: "phases and shared service"
    rule: "Index source establishment/productive/replacement/termination periods; assign observed shared-service time or throughput to consuming nodes/lots once with evidence."
    source_ids: []
