    - id: q_identity
      applies_to: "each lot"
      requirement: "Verify residual CPC classification, named good/species, legal chain, food eligibility, sold state and gate."
      evidence: "source, legal, food and dispatch records"
    - id: q_mass
      applies_to: "each lot"
      requirement: "Calibrate gross/tare and before/after mass; assay relevant moisture/contamination."
      evidence: "scale, assay and balance"
    - id: q_allocation
      applies_to: "source and shared assets"
      requirement: "Complete real output set, phases, attribution driver and nonduplicated asset burden."
      evidence: "output, service and period ledgers"
    - id: q_uuid
      applies_to: "each concrete exchange"
      requirement: "Confirm flow type, role, source, state, gate, property and unit support before fixed UUID."
      evidence: "detail verification evidence"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference lot"
    rule: "Reject generic other-animal averages, insects, honey, ordinary eggs, raw milk, meat, snails, non-food goods and elsewhere-classified food; require legal and food evidence."
