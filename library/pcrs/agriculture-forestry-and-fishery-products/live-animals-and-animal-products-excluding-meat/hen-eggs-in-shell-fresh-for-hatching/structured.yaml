allocation_rules:
  - rule_id: output_priority
    applies_to: "hatching eggs, marketed table eggs, cull birds, exported manure"
    rule: "Enumerate intended outputs at their actual gates. Attribute separable activities directly. For inseparable flock-period burdens use documented physical causality if supportable, otherwise period-matched farm-gate economic allocation with prices, masses and sensitivity. Waste and mortality receive no product share."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: period_shared
    applies_to: "flock, house, nest equipment, store, trays"
    rule: "Index replacement, productive, storage and reuse periods; link input events and outputs to period. Attribute shared assets to measured users or justified service duration/capacity once, avoiding duplicate burden."
    source_ids:
      - fao-leap-poultry-2016
      - aviagen-egg-handling-2015
  - rule_id: internal_states
    applies_to: "laid through stored eggs"
    rule: "Internal transfers are mass reconciliation, not co-products; allocate only when a separate product exits the declared boundary."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_flock
      process_id: "breeder_flock"
      flow_role: "replacement, culls, age, route"
      record_type: "flock register"
      raw_fields: "cohort, species, age, head, mass, entry/exit, mortality, mating, housing/collection route"
      collection_method: "register and calibrated sample weighing; Raw aggregation requirements: cohort-period ledger. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "head; kg"
      frequency: "event/monthly"
      temporal_coverage: "full productive/replacement phases"
      site_scope: "all houses"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice, scale and mortality logs; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_inputs
      process_id: "breeder_flock"
      flow_role: "feed, water, energy"
      record_type: "invoices, stock, meters"
      raw_fields: "supplier, feed, dry matter, stock, water, carrier, meter, period, shared use"
      collection_method: "invoice, meter and stock reconciliation; Raw aggregation requirements: net measured use by cohort. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; L; kWh; MJ"
      frequency: "monthly/close"
      temporal_coverage: "full flock period"
      site_scope: "all houses"
      aggregation_rule: "per reference flow"
      quality_evidence: "invoice, meter check, stock sheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_eggs
      process_id: "breeder_flock_egg_collection_first_conditioning"
      flow_role: "laid, collected, prepared, loss"
      record_type: "batch register"
      raw_fields: "collection time, count, sampled mass, shell condition, accepted/rejected mass, destination"
      collection_method: "count and calibrated weighing; Raw aggregation requirements: state mass balance by batch. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "count; kg"
      frequency: "each batch"
      temporal_coverage: "full period"
      site_scope: "all lines"
      aggregation_rule: "per reference flow"
      quality_evidence: "batch sheet, calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_grading
      process_id: "hatching_grade"
      flow_role: "hatching, table, reject grades"
      record_type: "grade log"
      raw_fields: "grade rules, candling if done, count, kg, tests, destination"
      collection_method: "grading and weighing; Raw aggregation requirements: mutually exclusive destinations. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "count; kg"
      frequency: "each batch"
      temporal_coverage: "full period"
      site_scope: "all grading lines"
      aggregation_rule: "per reference flow"
      quality_evidence: "grade/test sheet; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_manure
      process_id: "breeder_flock"
      flow_role: "manure and air pathways"
      record_type: "management log"
      raw_fields: "bedding, moisture, nitrogen, pathway, dates, factors"
      collection_method: "observation, assay, method worksheet; Raw aggregation requirements: one ledger per material batch. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; kg N"
      frequency: "monthly/event"
      temporal_coverage: "flock/manure period"
      site_scope: "all pathways"
      aggregation_rule: "per reference flow"
      quality_evidence: "log, lab and factor citation; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_storage
      process_id: "egg_storage"
      flow_role: "stored eggs and energy"
      record_type: "lot/room log"
      raw_fields: "kg in/out, timestamps, temperature, humidity, meter, rejects"
      collection_method: "room logger, meter, weighing; Raw aggregation requirements: batch inventory and shared energy. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; h; C; kWh"
      frequency: "each lot/daily"
      temporal_coverage: "actual farm storage"
      site_scope: "all rooms"
      aggregation_rule: "per reference flow"
      quality_evidence: "logger, meter, scale; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_packaging
      process_id: "egg_presentation"
      flow_role: "trays and discard"
      record_type: "package/reuse log"
      raw_fields: "material, new/reused item, mass, owner, cycles, disposal"
      collection_method: "count/sample weighing; Raw aggregation requirements: net material by evidenced reuse. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "item; kg"
      frequency: "each dispatch"
      temporal_coverage: "full period"
      site_scope: "farm packing points"
      aggregation_rule: "per reference flow"
      quality_evidence: "purchase/return log; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_handover
      process_id: "egg_presentation"
      flow_role: "final reference"
      record_type: "dispatch register"
      raw_fields: "lot, count, kg, grade, gate, buyer, collection/storage history, tests"
      collection_method: "calibrated dispatch weighing; Raw aggregation requirements: accepted kg once. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg; count"
      frequency: "each handover"
      temporal_coverage: "full period"
      site_scope: "farm gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "dispatch and calibration; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: egg_balance
      applies_to: "egg states"
      rule: "Gross laid = collected + collection loss; collected = prepared + conditioning reject; prepared = selected + marketed table grade + grading reject; selected adjusted for stock change = final + storage/presentation rejects. Document timing differences."
      inputs:
        - cp_eggs
        - cp_grading
        - cp_storage
        - cp_handover
      output: "stage yields"
      source_ids:
        - mass-balance-identity
    - id: normalize_kg
      applies_to: "all rows"
      rule: "Divide period-attributed amounts by measured final saleable shell-on kg, never laid count."
      inputs:
        - "all protocols"
      output: "amount per kg reference"
      source_ids:
        - mass-balance-identity
    - id: manure_gases
      applies_to: "CH4, N2O, NH3"
      rule: "Use pathway-specific recorded manure/N and documented method; convert N-basis species to molecular mass."
      inputs:
        - cp_manure
      output: "kg substance/kg reference"
      source_ids:
        - ipcc-2019-livestock-manure
    - id: tray_reuse
      applies_to: "reusable trays"
      rule: "Allocate purchased/produced tray burden over evidenced reuse cycles; a returned tray is not a new purchase."
      inputs:
        - cp_packaging
      output: "kg material/kg reference"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "final egg"
      requirement: "Retain hen species, shell-on state, hatching designation, farm gate, lot, grade and measured mass; report fertility/viability only if tested."
      evidence: "dispatch, grade and test records"
    - id: dq_period
      applies_to: "flock/outputs"
      requirement: "Cover replacement and productive periods, culls, mortality, inputs, gross eggs, rejects and co-products without gaps or double count."
      evidence: "cohort ledger and mass balance"
    - id: dq_route
      applies_to: "collection, conditioning, storage"
      requirement: "Record actual route, whether candling occurred, storage time/temperature, and package reuse."
      evidence: "batch, room and package log"
    - id: dq_flow_identity
      applies_to: "all final exchanges"
      requirement: "unresolved inputs need flow identity verification evidence and verified concrete UUID at dataset construction; unresolved cards need verified identity before process publication."
      evidence: "identity and provider records"
validation_rules:
  - rule_id: validate_gate
    applies_to: "reference"
    rule: "Reject table, incubated, chick or hatchery-gate substitution; confirm fresh shell-on farm-gate mass and lot."
    source_ids:
      - cpc-3-2025
      - fao-egg-production
  - rule_id: validate_quality
    applies_to: "hatching grade"
    rule: "Require recorded selection criteria and rejects; never infer fertility or hatchability from intended use alone."
    source_ids:
      - aviagen-egg-handling-2015
  - rule_id: validate_route
    applies_to: "breeder and storage"
    rule: "Route delta requires evidence of topology/inventory/measurement change. Storage is conditional; final receives direct or stored route, never both."
    source_ids:
      - fao-leap-poultry-2016
      - aviagen-egg-handling-2015
  - rule_id: validate_balance
    applies_to: "egg stages and co-products"
    rule: "Reconcile all internal mass states; distinguish marketed table eggs/culls from waste and document allocation precedence."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_shared
    applies_to: "periods/assets"
    rule: "Attribute breeder replacements, house, nests, storage and reusable trays by evidenced consumer and period once."
    source_ids:
      - fao-leap-poultry-2016
  - rule_id: validate_bindings
    applies_to: "inventory"
    rule: "QA Ranges are provisional unless reviewed. Resolve every final TIDAS exchange to a verified concrete UUID with compatible type, property, medium and gate."
    source_ids:
      - mass-balance-identity
published_dataset_profile:
  dataset_role: "Breeder-farm foreground production dataset for fresh shell-on hatching eggs"
  downstream_use: "secondary_dataset; background_dataset after quality review for process and lifecyclemodel"
  allowed_use: "Matching farm-gate hatching egg supply by species, route, grade, period and packaging"
  excluded_use: "Table-egg supply, guaranteed fertility, incubation, chick production, hatchery gate, post-farm transport"
  required_metadata: "Farm/gate, flock/age, period, route, counts/kg, grade and quality, storage time/temperature, package reuse, rejects and co-products"
  required_quality_disclosure: "Data gaps, sample mass, modelled emissions, actual flow selections, unresolved identities, replacement of reasoned Ranges, allocation sensitivity"
  update_trigger: "Route, grade/quality protocol, storage, packaging, identity, allocation or flock-period change"
