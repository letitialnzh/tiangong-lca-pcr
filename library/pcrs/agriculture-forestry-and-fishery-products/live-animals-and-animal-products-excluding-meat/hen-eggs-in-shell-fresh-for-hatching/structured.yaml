  reference_flow_link: "farm_gate_hatching_eggs"
system_boundary:
  rules:
    - rule_id: farm_gate_cut
      applies_to: "all routes"
      rule: "Include breeder-farm laying, independent collection, first conditioning, grading, on-farm stabilization and presentation; exclude hatchery incubation, chicks and post-gate transport."
      source_ids:
        - fao-egg-production
        - aviagen-egg-handling-2015
    - rule_id: quality_not_fertility
      applies_to: "final product"
      rule: "Hatching use is not a measured fertility or hatchability claim; record tests and rejected destinations rather than assuming quality."
      source_ids:
        - aviagen-egg-handling-2015
    - rule_id: route_delta
      applies_to: "breeder route"
      rule: "Declare managed biological parent and actual route changes to topology, inventory categories, measurement or validation; a route label alone is insufficient."
      source_ids:
        - fao-leap-poultry-2016
    - rule_id: handoff_once
      applies_to: "internal eggs"
      rule: "Capture, prepared, graded and stored states reconcile one cohort; a mass transfer between nodes does not create another independently saleable final product."
      source_ids:
        - mass-balance-identity
    - rule_id: shared_asset_boundary
      applies_to: "house, nests, store and reusable trays"
      rule: "Identify consumers and service periods; record each shared burden only once at actual service handover."
      source_ids:
        - fao-leap-poultry-2016
boundary_abstraction:
  declared_starting_condition: "Purchased replacement breeders/pullets, feed, water, energy and package materials enter at recorded farm receipt; internally produced replacements or feed require separately traced foreground."
  starting_condition_role: "Breeder-farm incoming stock before the declared productive flock period."
  product_classification_scope: "CPC 3.0 02311 applies to final fresh shell-on hatching eggs, not internal states or table-egg co-products."
  recursive_input_rule: "Purchased hatching eggs used upstream of this flock carry one upstream dataset at receipt; do not recursively credit the resulting eggs or include hatchery incubation twice."
  upstream_dataset_requirement: "Trace purchased birds, feed, energy and packaging to upstream datasets; farm-only inventory must not be represented as cradle-to-gate."
  disclosure: "Gate, cohort and period, breeding/collection route, egg grade and quality evidence, conditioning, storage, package reuse, losses and co-product allocation."
