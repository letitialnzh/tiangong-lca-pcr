functional_unit:
  what: "Saleable fresh hen eggs in shell selected for hatching at breeder-farm handover"
  how_much: "1 kg shell-on egg mass; retain count and measured average mass"
  how_well: "Declare breeder flock age and mating management, collection and selection, shell condition, storage time/temperature, measured quality tests if available; do not infer fertility or hatchability"
