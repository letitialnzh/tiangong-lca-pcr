system_boundary:
  rules:
    - rule_id: b_class
      applies_to: "Every lot"
      rule: "Establish Bovinae membership and exclusion from named cattle/buffalo genera; document why an antelope-labelled species is not assigned to 02129. A nilgai example is an inference, not explicit UN placement."
      source_ids:
        - un-cpc3-2025
        - itis-nilgai
        - un-cpc21-2015
    - rule_id: b_managed
      applies_to: "Managed source"
      rule: "Record real breeding/rearing, purchased-stock burden, husbandry and herd-period changes through the live transfer to gate."
      source_ids:
        - fws-nilgai-zoo-2019
    - rule_id: b_capture
      applies_to: "Authorized capture source"
      rule: "A separate capture node requires actual legal authority, campaign, viable captured animals and destination handover; research tagging followed by release is outside the marketed reference."
      source_ids:
        - usda-nilgai-capture-2023
        - tahc-exotics-movement
    - rule_id: b_gate
      applies_to: "Both routes"
      rule: "Stop at one real live source handover; exclude slaughter, carcass products and downstream buyer transport."
      source_ids:
        - un-cpc3-2025
        - nandankanan-nilgai-exchange
        - tahc-exotics-movement
    - rule_id: b_shared
      applies_to: "Facilities and equipment"
      rule: "Assign shared enclosure, water or handling service only to actual consuming nodes and periods, once."
      source_ids:
        - fws-nilgai-zoo-2019
boundary_abstraction:
  declared_starting_condition: "Managed route: documented opening herd or purchased breeding/young stock with prior burden. Capture route: specific authorized free-ranging source and campaign, without fictional lifetime husbandry."
  starting_condition_role: "Managed biological stock or lawful capture context; purchased animals are Product inputs with upstream burden."
  product_classification_scope: "Species-qualified live residual Bovinae after exclusions and explicit resolution of nilgai/other antelope overlap with 02129."
  recursive_input_rule: "Link purchased same-category live animals once to their preceding-gate dataset; internal live transfers are not another final product."
  upstream_dataset_requirement: "Match purchased stock, feed, supplied water, energy and services to supplier, material identity, geography, unit and gate; retain source/custody and movement permissions."
  disclosure: "Taxon and CPC decision, legal source, route, cohort/campaign, measured count/mass, losses, service periods, actual handover and unresolved identities."
