    reference: "[Texas Animal Health Commission exotic-livestock movement requirements](https://www.tahc.texas.gov/regs/pdf/MovementRequirements_Exotics-Ratites.pdf)"
    used_for: "Nilgai live-movement control questions, not universal legal permission"
