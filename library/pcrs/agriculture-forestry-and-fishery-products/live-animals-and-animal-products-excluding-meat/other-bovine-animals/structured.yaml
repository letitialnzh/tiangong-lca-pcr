    reference: "[UN CPC Version 2.1 and HS 0102.90 correspondence](https://unstats.un.org/unsd/classifications/unsdclassifications/cpcv21.pdf)"
    used_for: "Residual-bovine classification interpretation"
  - id: "itis-nilgai"
    type: "dataset"
    reference: "[ITIS taxonomy for *Boselaphus tragocamelus*](https://www.itis.gov/servlet/SingleRpt/SingleRpt?search_topic=TSN&search_value=552477)"
    used_for: "Bovinae membership, not trade permission"
