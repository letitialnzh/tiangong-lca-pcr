process_map:
  - id: rear
    name: "Managed insect rearing"
    inclusion: "conditional"
    inclusion_condition: "Farmed route only; wild or purchased-dead lots bypass"
    role: "Raise declared species and life stage with recorded substrate, water and cohort; hand off living harvestable biomass."
    quantitative_reference: "per kg node output"
  - id: collect
    name: "Independent collection and killing"
    inclusion: "conditional"
    inclusion_condition: "Farmed or lawful wild source; purchased-dead input bypasses"
    role: "Remove insects from cohort or lawful wild site, record killing and hand off non-living collected material."
    quantitative_reference: "per kg node output"
  - id: condition
    name: "First hygienic conditioning"
    inclusion: "required"
    inclusion_condition: "Every lot; if no intervention, transfer ledger only"
    role: "Identify raw dead input including purchased material, remove contamination, and hand off first prepared edible material."
    quantitative_reference: "per kg node output"
  - id: grade
    name: "Food-grade sorting"
    inclusion: "required"
    inclusion_condition: "Every lot"
    role: "Separate accepted food grade, separately sold downgraded food grade if any, and non-food reject, each with a handoff."
    quantitative_reference: "per kg node output"
  - id: preserve
    name: "Optional preservation"
    inclusion: "conditional"
    inclusion_condition: "Only actual chilled, frozen, dried, smoked, salted or brined route"
    role: "Record the selected stabilization intervention, before/after moisture and product state; fresh lots bypass."
    quantitative_reference: "per kg node output"
  - id: mill
    name: "Conditional milling to flour or meal"
    inclusion: "conditional"
    inclusion_condition: "Only flour or meal actually produced"
    role: "Grind eligible dead insects into food-grade flour or meal; exclude formulated foods and extracts."
    quantitative_reference: "per kg node output"
  - id: pack
    name: "Protective packing and handover"
    inclusion: "required"
    inclusion_condition: "Every sold lot"
    role: "Pack the one declared accepted form for the actual farm, collection or first-processing gate without downstream distribution."
    quantitative_reference: "per kg node output"
