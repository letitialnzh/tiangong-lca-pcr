allocation_rules:
  - rule_id: a_outputs
    applies_to: "rear, grade and all saleable routes"
    rule: "Enumerate living intermediate, accepted food grade, any independently sold lower food grade and genuine sold frass-derived product at their own handoffs. Successive states are transfers, not extra saleable products. Subdivide measurable operations first; attribute inseparable joint burden by defensible physical causality or, if unavailable, contemporaneous net economic value with sensitivity analysis. Never classify marketed material as Waste."
    source_ids:
      - fao-edible-insects-2013
  - rule_id: a_period
    applies_to: "cohort and wild source"
    rule: "Tie feed, cohort, collection, preservation, asset replacement and marketed outputs to actual nonoverlapping periods; no universal cycle or feed conversion."
    source_ids:
      - fao-edible-insects-2013
  - rule_id: a_shared
    applies_to: "shared rooms, traps, chillers, mills and packers"
    rule: "Identify every consuming node and service period. Use metered service, else documented hours or throughput, once without duplicate supplier burden."
    source_ids:
      - fao-edible-insects-2013
  - rule_id: a_form
    applies_to: "wet, preserved and meal states"
    rule: "Attribute preservation and milling only to lots that undergo them; one physical lot has one marketed form at a time."
    source_ids:
      - un-cpc-02931
dataset_production:
  collection_protocols:
    - protocol_id: cp_rear
      process_id: "rear"
      flow_role: "cohort and management"
      record_type: "cohort log"
      raw_fields: "species; stage; feed; water; living_mass; frass; coproduct; loss; service; period"
      collection_method: "feed tickets, meters and scale"
      unit: "kg; m3; period"
      frequency: "each cohort"
      temporal_coverage: "actual cohort phases"
      site_scope: "farm"
      aggregation_rule: "link products and residues once"
      quality_evidence: "purchase, meter and batch records"
    - protocol_id: cp_collect
      process_id: "collect"
      flow_role: "killing and collection"
      record_type: "event log"
      raw_fields: "source; legal_id; stage; live_mass; dead_mass; loss; method; period"
      collection_method: "permit and scale"
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "collection season"
      site_scope: "farm or wild site"
      aggregation_rule: "reconcile captured and dead material"
      quality_evidence: "permit, scale and event record"
    - protocol_id: cp_condition
      process_id: "condition"
      flow_role: "first preparation"
      record_type: "hygiene batch"
      raw_fields: "source; raw_mass; water; prepared_mass; reject; method"
      collection_method: "batch scale and cleaning log"
      unit: "kg; m3"
      frequency: "each lot"
      temporal_coverage: "batch period"
      site_scope: "preparation site"
      aggregation_rule: "actual intervention only"
      quality_evidence: "hygiene and scale record"
    - protocol_id: cp_grade
      process_id: "grade"
      flow_role: "food grades"
      record_type: "grade ledger"
      raw_fields: "prepared_mass; accepted; downgrade; reject; food_qualification; destinations"
      collection_method: "grade and sale tickets"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "batch period"
      site_scope: "grading site"
      aggregation_rule: "reconcile destinations"
      quality_evidence: "grade, sale and reject record"
    - protocol_id: cp_preserve
      process_id: "preserve"
      flow_role: "before/after state"
      record_type: "treatment log"
      raw_fields: "input; output; moisture_before; moisture_after; state; energy; preservation_medium; residue"
      collection_method: "scale, moisture test and meter"
      unit: "kg; kg/kg; kWh"
      frequency: "treated lot"
      temporal_coverage: "treatment period"
      site_scope: "treatment site"
      aggregation_rule: "treated lots only"
      quality_evidence: "test and meter record"
    - protocol_id: cp_mill
      process_id: "mill"
      flow_role: "flour or meal"
      record_type: "milling log"
      raw_fields: "input; product; fineness; moisture; reject; rework"
      collection_method: "scale and quality record"
      unit: "kg; kg/kg"
      frequency: "milled lot"
      temporal_coverage: "milling period"
      site_scope: "mill"
      aggregation_rule: "one output and rework loop"
      quality_evidence: "scale and food release"
    - protocol_id: cp_pack
      process_id: "pack"
      flow_role: "net sold product"
      record_type: "handover log"
      raw_fields: "species; stage; form; state; gross; tare; free_brine; package; reuse; gate"
      collection_method: "scale and handover ticket"
      unit: "kg; turn"
      frequency: "each sale"
      temporal_coverage: "sale period"
      site_scope: "gate"
      aggregation_rule: "one marketed lot"
      quality_evidence: "qualification and ticket"
  calculation_rules:
    - id: c_net
      applies_to: "reference"
      rule: "Net sold mass = measured gross less package tare and separable free brine."
      inputs:
        - gross
        - tare
        - "free brine"
      output: "kg net as sold"
      source_ids:
        - fao-edible-insects-2013
    - id: c_state
      applies_to: "drying or milling"
      rule: "Actual matched input/output mass and moisture; no default wet/dry or whole/meal factor."
      inputs:
        - "before/after mass"
        - moisture
      output: "lot-specific balance"
      source_ids:
        - fao-edible-insects-2013
    - id: c_balance
      applies_to: "every node"
      rule: "Reconcile input, products, sold downgrade, reject and measured state change; investigate gaps."
      inputs:
        - input
        - outputs
        - residues
        - moisture
      output: "kg ledger"
      source_ids:
        - fao-edible-insects-2013
    - id: c_shared
      applies_to: "shared assets"
      rule: "Assign measured service or documented hours/throughput to unique node and period."
      inputs:
        - burden
        - use
        - period
      output: "allocated burden"
      source_ids:
        - fao-edible-insects-2013
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every lot"
      requirement: "Verify species, stage, human-food qualification, lawful source, form, moisture and market state."
      evidence: "permit, food release, batch and sale records"
    - id: dq_safety
      applies_to: "source and output"
      requirement: "Check source/substrate contamination, hygiene and applicable jurisdictional food requirements; no invented universal numeric limits."
      evidence: "supplier, inspection and test records"
    - id: dq_mass
      applies_to: "material"
      requirement: "Calibrated net mass, state-specific moisture and destination balance; no default conversion."
      evidence: "scale, test and balance"
    - id: dq_period
      applies_to: "cohort and assets"
      requirement: "Actual periods, replacement and consuming nodes without double attribution."
      evidence: "cohort and asset ledger"
    - id: dq_uuid
      applies_to: "final exchange"
      requirement: "Resolve compatible concrete identity and property/unit support; unresolved candidate is not exchange permission."
      evidence: "detail and support-row review"
validation_rules:
  - rule_id: v_scope
    applies_to: "marketed lot"
    rule: "Reject live, feed-only, formulated, extracted or unsafe product; verify permitted species, stage, form and food eligibility."
    source_ids:
      - un-cpc-02931
      - fao-edible-insects-2013
  - rule_id: v_route
    applies_to: "source lot"
    rule: "Farm, lawful wild and purchased-dead routes are exclusive; purchase retains supplier burden and skips invented source nodes."
    source_ids:
      - fao-edible-insects-2013
  - rule_id: v_balance
    applies_to: "every node"
    rule: "Reconcile input, accepted output, sold downgrade, waste, moisture change and sale without counting successive states twice."
    source_ids:
      - fao-edible-insects-2013
  - rule_id: v_safety
    applies_to: "edible output"
    rule: "Require source legality and applicable hygiene/contamination evidence before food-grade release."
    source_ids:
      - fao-edible-insects-2013
  - rule_id: v_period
    applies_to: "shared service"
    rule: "Each event and asset service has one period and one attributed share; replacement does not duplicate prior burden."
    source_ids:
      - fao-edible-insects-2013
  - rule_id: v_binding
    applies_to: "all cards"
    rule: "conditional product inputs require actual concrete selection; other identities need matching detail/property/unit-group evidence before exchange publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "Species-, stage-, source-, form- and state-qualified edible-insect foreground package."
  downstream_use: "secondary_dataset or background_dataset only after method and identity review."
  allowed_use: "One documented qualifying non-living food insect product at actual gate."
  excluded_use: "Live insects, animal feed, prepared snacks, mixed wet/dry average or unverified UUID exchange."
  required_metadata: "Species; stage; route; legal and food status; form; moisture; interventions; package; gate; period; co-products; attribution."
  required_quality_disclosure: "Source and safety gaps, measured yield/moisture, balance, shared service, uncertainty and unresolved UUIDs."
  update_trigger: "Species/legal status, processing boundary, route, gate, source rule or platform identity change."
