allocation_rules:
  - rule_id: period_attribution
    applies_to: "donor"
    rule: "Link feed, water, health, manure, collection and accepted lots to dated donor phases; record replacement and cull events. Never charge a donor-period twice."
    source_ids:
      - woah-semen-hygiene-2024
  - rule_id: shared_service
    applies_to: "housing, collection apparatus, lab and cooling"
    rule: "Enumerate consumers and service periods, then assign each burden once by measured occupancy, usage time or another justified causal service basis."
    source_ids:
      - woah-semen-hygiene-2024
  - rule_id: quality_outputs
    applies_to: "grading and filling"
    rule: "Downgraded material is a co-product only with independent legal handover; otherwise treat rejects as waste. Disclose any causal or physical/economic allocation decision and sensitivity."
    source_ids:
      - woah-semen-hygiene-2024
  - rule_id: mixed_state
    applies_to: "fresh, chilled and frozen"
    rule: "Assign common donor/collection burden to actual accepted lots using documented causal service or counts; preserve state-specific energy, cryogen and loss for applicable lots only."
    source_ids:
      - fao-cryoconservation-2012
dataset_production:
  collection_protocols:
    - protocol_id: cp_donor
      process_id: "donor"
      flow_role: "donor inputs and outputs"
      record_type: "donor register and meters"
      raw_fields: "donor_id, species, period, feed_mass, water_mass, health_event, eligible_days, manure_mass"
      collection_method: "dated record and calibrated meter"
      unit: "day; kg"
      frequency: "each event and monthly reconciliation"
      temporal_coverage: "full donor period"
      site_scope: "centre and donor"
      aggregation_rule: "link inputs and events to donor period"
      quality_evidence: "register and receipts"
    - protocol_id: cp_collect
      process_id: "collect"
      flow_role: "consumables, ejaculate, failed material"
      record_type: "collection event"
      raw_fields: "donor_id, event_id, issued_mass, raw_mL, concentration, rejected_mass"
      collection_method: "calibrated vessel and issue log"
      unit: "mL; kg"
      frequency: "each event"
      temporal_coverage: "all collection events"
      site_scope: "centre"
      aggregation_rule: "sum by donor and lot"
      quality_evidence: "calibration and chain of custody"
    - protocol_id: cp_grade
      process_id: "grade"
      flow_role: "quality states"
      record_type: "laboratory assessment"
      raw_fields: "lot_id, raw_mL, accepted_mL, downgraded_mL, rejected_mL, grade, destination"
      collection_method: "species-specific test and disposition log"
      unit: "mL; fraction"
      frequency: "each lot"
      temporal_coverage: "all assessed lots"
      site_scope: "lab"
      aggregation_rule: "reconcile all grades to intake"
      quality_evidence: "assay and approval"
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "medium, bulk and loss"
      record_type: "batch sheet"
      raw_fields: "lot_id, accepted_mL, medium_mL, bulk_mL, loss_mL"
      collection_method: "calibrated dispense and volume balance"
      unit: "mL"
      frequency: "each batch"
      temporal_coverage: "all prepared batches"
      site_scope: "lab"
      aggregation_rule: "balance per lot"
      quality_evidence: "recipe and calibration"
    - protocol_id: cp_fill
      process_id: "fill"
      flow_role: "containers and filled/rejected units"
      record_type: "filling sheet"
      raw_fields: "lot_id, issued_items, filled_doses, rejected_items, dose_mL, sperm_count"
      collection_method: "counter and seal check"
      unit: "item; dose; mL"
      frequency: "each batch"
      temporal_coverage: "all filled batches"
      site_scope: "filling line"
      aggregation_rule: "reconcile issued and filled units"
      quality_evidence: "batch sheet and QA"
    - protocol_id: cp_preserve
      process_id: "preserve"
      flow_role: "power, cryogen, preserved/rejected units"
      record_type: "preservation log"
      raw_fields: "batch_id, state, kWh, cryogen_kg, start, end, accepted_doses, rejected_items"
      collection_method: "meter, supply ledger and temperature log"
      unit: "kWh; kg; dose"
      frequency: "each batch"
      temporal_coverage: "full intervention and hold"
      site_scope: "centre"
      aggregation_rule: "allocate by batch and service time"
      quality_evidence: "meter and calibration"
    - protocol_id: cp_release
      process_id: "release"
      flow_role: "packaging, product, rejects"
      record_type: "release ledger"
      raw_fields: "lot_id, species, state, packaging_kg, reuse_cycles, accepted_doses, rejected_kg"
      collection_method: "count, weigh and release certificate"
      unit: "kg; dose"
      frequency: "each release"
      temporal_coverage: "all released lots"
      site_scope: "centre gate"
      aggregation_rule: "group accepted units by species and state"
      quality_evidence: "signed release"
  calculation_rules:
    - id: dose_yield
      applies_to: "collection through release"
      rule: "Reconcile raw volume and concentration with graded states, prepared bulk, fill and release counts; accepted released doses divided by linked donor period."
      inputs:
        - donor
        - lot
        - liquid
        - "quality and dose records"
      output: "accepted yield and loss ledger"
      source_ids:
        - woah-semen-hygiene-2024
    - id: service_share
      applies_to: "donor and shared assets"
      rule: "Period burden times evidenced service share divided by accepted linked dose count; disclose unproductive periods and reject zero denominators."
      inputs:
        - "dated inputs"
        - "service duration"
        - "linked doses"
      output: "burden per dose"
      source_ids:
        - woah-semen-hygiene-2024
    - id: state_burden
      applies_to: "preservation"
      rule: "State-specific metered power, cryogen and rejects divided only by accepted doses in that state."
      inputs:
        - "lot state"
        - meter
        - "supply and acceptance"
      output: "fresh, chilled or frozen inventory"
      source_ids:
        - fao-cryoconservation-2012
  data_quality_requirements:
    - id: identity
      applies_to: "reference"
      requirement: "Verify non-bovine species, breeding purpose, dose specification and centre-release gate."
      evidence: "donor, lot and release record"
    - id: completeness
      applies_to: "all nodes"
      requirement: "Cover selected stages and reconcile accepted, downgraded, rejected and loss states without duplicate internal transfer."
      evidence: "process and balance ledger"
    - id: temporal
      applies_to: "donor and preserved lots"
      requirement: "Align donor phase, collection, batch, hold and asset service dates."
      evidence: "dated registers and meters"
    - id: route
      applies_to: "state variants"
      requirement: "Disclose fresh, chilled or frozen branch and applicable species-specific sanitary controls."
      evidence: "quality and preservation log"
validation_rules:
  - rule_id: non_bovine
    applies_to: "reference"
    rule: "Reject bovine donor, mismatched CPC or any UUID not detail-confirmed as non-bovine breeding semen with matching gate/property."
    source_ids:
      - un-cpc-3-2025
  - rule_id: balance
    applies_to: "graded-to-release chain"
    rule: "Reconcile liquid and discrete units across accepted, downgraded, rejected and lost states within documented measurement tolerances."
    source_ids:
      - woah-semen-hygiene-2024
  - rule_id: branch
    applies_to: "final state"
    rule: "Require one fresh/chilled/frozen final state per lot; chilled/frozen lots need observed intervention and duration, never bovine default factors."
    source_ids:
      - fao-cryoconservation-2012
  - rule_id: no_double_count
    applies_to: "donor and assets"
    rule: "Dated donor phases and housing, laboratory, collection and refrigeration shares must charge each service once per period."
    source_ids:
      - woah-semen-hygiene-2024
  - rule_id: gate_quality
    applies_to: "release"
    rule: "Require donor species, count, volume, sperm specification and quality release; reject insemination/distribution activity."
    source_ids:
      - woah-semen-hygiene-2024
published_dataset_profile:
  dataset_role: "Observed foreground package for non-bovine breeding dose production."
  downstream_use: "secondary_dataset; background_dataset only after species/state/gate fitness review."
  allowed_use: "Species-, dose- and state-matched semen production LCA at centre gate."
  excluded_use: "Bovine semen, embryos, donor-animal sale, insemination service and universal equivalence of dose types."
  required_metadata: "species, breed, donor, period, lot, acceptance, sperm count, volume, final state, preservation, gate and allocation."
  required_quality_disclosure: "completeness, rejects, count/volume conversion, unresolved UUIDs and shared-service uncertainty."
  update_trigger: "changed species, preservation route, dose specification, centre gate, quality criteria or verified flow identity."
data_sources:
  - id: "un-cpc-3-2025"
    type: "official_guidance"
    reference: "[UN CPC 3.0 explanatory notes](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "CPC 02419 non-bovine and 02411 bovine distinction."
  - id: "woah-semen-hygiene-2024"
    type: "official_guidance"
    reference: "[WOAH Terrestrial Code Ch. 4.6, semen collection and processing centre hygiene](https://www.woah.org/fileadmin/Home/eng/Health_standards/tahc/2024/en_chapitre_general_hygiene_semen.htm)"
    used_for: "Donor, collection, processing, quality and centre route; conditional species/trade application."
  - id: "fao-cryoconservation-2012"
    type: "handbook"
    reference: "[FAO, Cryoconservation of Animal Genetic Resources](https://www.fao.org/4/i3017e/i3017e00.htm)"
    used_for: "State-specific preparation, preservation and storage route."
