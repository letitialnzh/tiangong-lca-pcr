system_boundary:
  rules:
    - rule_id: centre_gate
      applies_to: "all routes"
      rule: "Include observed donor management, collection, assessment, preparation, filling, conditional preservation and protective packing through quality release; exclude insemination and later transport."
      source_ids:
        - un-cpc-3-2025
        - woah-semen-hygiene-2024
    - rule_id: species_boundary
      applies_to: "donor"
      rule: "Keep non-bovine species separate and do not transfer bovine husbandry factors or a bovine flow UUID."
      source_ids:
        - un-cpc-3-2025
        - woah-semen-hygiene-2024
    - rule_id: state_interfaces
      applies_to: "centre"
      rule: "Record raw ejaculate, accepted/downgraded/rejected grades, prepared liquid, filled dose, preserved dose and packed released dose as distinct measured states even if tasks are co-located."
      source_ids:
        - woah-semen-hygiene-2024
        - fao-cryoconservation-2012
    - rule_id: route_delta
      applies_to: "managed biological parent"
      rule: "Fresh, chilled and frozen routes share donor management but preservation changes electricity/cryogen, hold time, loss and quality checks; exactly one final state per lot."
      source_ids:
        - fao-cryoconservation-2012
    - rule_id: shared_assets
      applies_to: "housing and centre"
      rule: "Attribute housing, collection apparatus, laboratory and refrigeration to their actual consuming nodes and service periods once."
      source_ids:
        - woah-semen-hygiene-2024
boundary_abstraction:
  declared_starting_condition: "Identified non-bovine donor in a recorded husbandry period; upstream feed, water, laboratory media, utilities and packaging enter as supplied goods."
  starting_condition_role: "Managed production of collectable semen, not sale of a live animal or insemination service."
  product_classification_scope: "CPC 3.0 02419; bovine semen CPC 02411 excluded."
  recursive_input_rule: "Purchased same-category semen is a traced upstream input, not recounted as local donor production."
  upstream_dataset_requirement: "Species- and route-compatible feed, water, electricity, preparation medium, cryogen, packaging and treatment service."
  disclosure: "donor, gate, lot dates, quality specification, final state, rejects, periods, shared-service attribution and allocation."
