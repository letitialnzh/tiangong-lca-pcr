system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "The default foreground boundary begins when breeding or replacement animals, feed and forage, and other managed inputs enter the declared cattle system. It includes managed reproduction where present; gestation, calving and calf rearing where present; grazing, mixed, dairy-linked, housed or feedlot growing and finishing; animal health; directly controlled inbound movements; drinking and service water; purchased and on-site energy; manure collection, storage, treatment or use under farm control; animal selection; live-weight measurement; and transfer at the producing farm gate."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Post-transfer transport, slaughter, dressing, hide removal, meat processing, and downstream milk processing are outside the reference-product gate. Upstream feed, veterinary product, purchased animal, electricity, fuel and transport-service production are represented by linked supplier datasets unless controlled and explicitly included in the foreground package."
      source_ids: []
    - rule_id: b_managed_parent
      applies_to: "all route variants"
      rule: "Use one managed cattle-production parent and declare the grazing/pastoral, mixed, dairy-linked, housed or feedlot delta in process topology, inventory categories, calculation, validation and current records."
      source_ids:
        - fao-leap-large-ruminants-2016
    - rule_id: b_handover
      applies_to: "reference output"
      rule: "End at live cattle weighed immediately before ownership or operational control transfer at the producing farm gate; exclude slaughterhouse receipt and post-transfer transport."
      source_ids:
        - fao-leap-large-ruminants-2016
    - rule_id: b_periods
      applies_to: "breeding, gestation, calf, growing, finishing and culling phases"
      rule: "Index inputs, outputs, events, replacement and termination by phase and reporting period, and carry starting-stock burdens exactly once."
      source_ids:
        - fao-leap-large-ruminants-2016
    - rule_id: b_manure
      applies_to: "manure"
      rule: "Include collection, storage, treatment and land use under farm control; record exported manure at its actual handover and link off-farm treatment without duplicating upstream manure burdens."
      source_ids:
        - fao-leap-nutrient-flows-2018
        - ipcc-2019-livestock-manure
    - rule_id: b_shared_assets
      applies_to: "housing, milking or feeding systems, pasture, water, energy and manure infrastructure"
      rule: "Name every cattle class, product node and service period consuming a shared asset; attribute the burden once using measured service before a fallback basis."
      source_ids:
        - fao-leap-large-ruminants-2016
boundary_abstraction:
  declared_starting_condition: "admitted breeding or replacement cattle and the declared cohort or herd phase at the start of the reporting period"
  starting_condition_role: "biological starting stock whose prior production burdens require a supplier dataset or an explicit multi-period attribution decision"
  product_classification_scope: "CPC 3.0 02111, live cattle; the scope does not recurse through meat, milk, hide, semen, embryo, or service categories"
  recursive_input_rule: "purchased or internally transferred live cattle within this category are recorded as starting-stock or intermediate biological inputs with origin, class, mass, prior phase and burden treatment; they are not silently recreated as the finished farm-gate reference output"
  upstream_dataset_requirement: "supplier or preceding-phase dataset for admitted animals and purchased feed, health products, energy and services, or an explicit disclosed cutoff and reason where a compatible dataset is unavailable"
  disclosure: "declare route variant, animal classes and phases, herd/cohort transitions, feed system, grazing and housing periods, manure systems, shared assets, intended co-products and handovers, mortalities, live-weight method, geography, reporting period, and unresolved flow identities"
