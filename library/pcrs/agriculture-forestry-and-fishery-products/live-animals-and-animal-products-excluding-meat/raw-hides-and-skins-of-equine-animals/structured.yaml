allocation_rules:
  - rule_id: animal_history
    applies_to: "animal service"
    rule: "Link actual working, breeding, meat or mixed-use periods and terminal event; use defensible physical causality, otherwise documented economic relation and sensitivity; neither assign all animal burden to one hide nor default to zero"
    source_ids:
      - fao-hides-statistics
  - rule_id: terminal_outputs
    applies_to: "slaughter or recovery"
    rule: "Enumerate only actual independent hide, carcass/meat and other product handovers; invent no meat for fallen recovery; separate residues and waste; allocation shares sum to one"
    source_ids:
      - fao-hides-statistics
  - rule_id: facility_shared
    applies_to: "removal to handover"
    rule: "Assign shared room, equipment, meter and reusable container once by consuming node, lot and period using recorded hours or throughput"
    source_ids:
      - fao-hides-2009
  - rule_id: grade_products
    applies_to: "grading"
    rule: "Accepted and independently saleable downgraded grades are intended products; rejects, spent brine, trims and package waste follow actual destinations; no duplicate handover"
    source_ids:
      - fao-hides-2009
dataset_production:
  collection_protocols:
    - protocol_id: cp_animal
      process_id: "animal"
      flow_role: "Animal history and actual output set"
      record_type: "lot/event record"
      raw_fields: "animal/lot ID, before/after mass, state, inputs, outputs, destinations, time, gate"
      collection_method: "meters, scale tickets, transaction and operator records; Raw aggregation requirements: sum and reconcile by state, grade, period and destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, h"
      frequency: "per lot/event"
      temporal_coverage: "all reference periods"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, tickets, invoices; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_removal
      process_id: "removal"
      flow_role: "Independent collection of wet raw hide"
      record_type: "lot/event record"
      raw_fields: "animal/lot ID, before/after mass, state, inputs, outputs, destinations, time, gate"
      collection_method: "meters, scale tickets, transaction and operator records; Raw aggregation requirements: sum and reconcile by state, grade, period and destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, h"
      frequency: "per lot/event"
      temporal_coverage: "all reference periods"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, tickets, invoices; traceable numerator, accepted reference-output denominator and normalization worksheet"
    - protocol_id: cp_conditioning
      process_id: "conditioning"
      flow_role: "First cleaning, fleshing and trimming"
      record_type: "lot/event record"
      raw_fields: "animal/lot ID, before/after mass, state, inputs, outputs, destinations, time, gate"
      collection_method: "meters, scale tickets, transaction and operator records; Raw aggregation requirements: sum and reconcile by state, grade, period and destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, h"
      frequency: "per lot/event"
      temporal_coverage: "all reference periods"
      site_scope: "actual site"
