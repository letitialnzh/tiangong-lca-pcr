system_boundary:
  rules:
    - rule_id: route_gate
      applies_to: "all routes"
      rule: "End at actual farm-slaughter, slaughterhouse, recovery or curing handover; include actual conditioning, grading, optional preservation and protection; exclude tanning and later transport"
      source_ids:
        - un-cpc-3
        - fao-hides-2009
    - rule_id: separate_removal
      applies_to: "terminal event"
      rule: "Removal or lawful recovery is a distinct node with wet skin, incidental residues and losses"
      source_ids:
        - fao-hides-statistics
    - rule_id: source_interface
      applies_to: "animal to removal"
      rule: "The provenance node is a linked-upstream source interface, not a duplicate husbandry process. Exactly one route-specific body handoff enters removal with the same animal ID and measured mass: live Product for slaughter, or fallen-body Waste only where that is its actual legal flow role. Product-status fallen recovery requires a separate verified Product identity before exchange generation."
      source_ids:
        - fao-hides-statistics
    - rule_id: grades_states
      applies_to: "conditioning to grading"
      rule: "Separate raw/prepared and accepted/downgraded/rejected destinations; do not mix waste with product"
      source_ids:
        - fao-hides-2009
    - rule_id: preserve_pack
      applies_to: "optional stabilization"
      rule: "Fresh bypasses preservation; chilled/dried/salted routes record actual inputs, residues, losses and package reuse"
      source_ids:
        - fao-hides-2009
        - unido-leather-2015
    - rule_id: shared_period
      applies_to: "animal and site"
      rule: "Assign animal service and shared removal/curing/packing assets to actual users and periods once"
      source_ids:
        - fao-hides-statistics
