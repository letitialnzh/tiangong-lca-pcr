    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "Final as-sold hide at declared gate"
      record_type: "lot/event record"
      raw_fields: "animal/lot ID, before/after mass, state, inputs, outputs, destinations, time, gate"
      collection_method: "meters, scale tickets, transaction and operator records; Raw aggregation requirements: sum and reconcile by state, grade, period and destination. Apply the existing route, period, conversion and allocation rules; retain raw totals and the measured accepted reference-output denominator for the same scope. Perform final normalization exactly once; do not divide an already normalized amount again."
      unit: "kg, h"
      frequency: "per lot/event"
      temporal_coverage: "all reference periods"
      site_scope: "actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration, tickets, invoices; traceable numerator, accepted reference-output denominator and normalization worksheet"
  calculation_rules:
    - id: net_reference
      applies_to: "handover"
      rule: "Net hide kg = gross weighed lot minus detachable package and free brine; divide attributable inventory by net mass"
      inputs:
        - gross
        - package
        - brine
      output: "exchanges per kg"
      source_ids:
        - un-cpc-3
    - id: state_balance
      applies_to: "all nodes"
      rule: "Before mass plus measured water/salt = after mass plus measured residues and explained moisture change; no universal conversion"
      inputs:
        - masses
        - salt
        - water
        - residues
      output: "lot balance"
      source_ids:
        - fao-hides-2009
    - id: allocation_sum
      applies_to: "shared outputs"
      rule: "Shares sum to one per node; animal and shared-asset periods not counted twice"
      inputs:
        - "actual outputs"
        - drivers
        - periods
      output: "attributable burdens"
      source_ids:
        - fao-hides-statistics
  data_quality_requirements:
    - id: identity
      applies_to: "reference lot"
      requirement: "Trace species, history, terminal event, lawful origin, state, grade and gate"
      evidence: "animal ID, dispatch"
    - id: completeness
      applies_to: "all nodes"
      requirement: "Include downgraded/rejected, spent salt, package rejects and shared services; mark unused branches zero"
      evidence: "balance, batch log"
    - id: state_quality
      applies_to: "conversion"
      requirement: "Retain measured moisture and retained salt; distinguish as-sold, fresh and dry mass"
      evidence: "tests, calibrated scale"
validation_rules:
  - rule_id: classification
    applies_to: "reference"
    rule: "Reject non-equine, tanned/dehaired/limed or gate/state-undocumented products"
    source_ids:
      - un-cpc-3
  - rule_id: mass_balance
    applies_to: "nodes"
    rule: "Reconcile removal-to-handover masses, accepted/downgraded/rejected destinations, moisture and retained salt"
    source_ids:
      - fao-hides-2009
  - rule_id: output_set
    applies_to: "terminal and grading"
    rule: "Verify real intended outputs and handovers; no fictional meat co-product for fallen recovery"
    source_ids:
      - fao-hides-statistics
  - rule_id: source_match
    applies_to: "animal and removal"
    rule: "Match each live-Product or fallen-body-Waste handoff once by animal ID, route and measured mass; reconcile the removal outputs and documented losses without double-counting the body as another co-product."
    source_ids:
      - fao-hides-statistics
  - rule_id: period_shared
    applies_to: "animal and facility"
    rule: "Check animal and shared-asset periods counted once and allocation shares sum to one"
    source_ids:
      - fao-hides-statistics
  - rule_id: uuid_gate
    applies_to: "concrete exchanges"
    rule: "Concrete exchange needs actual state and gate; farm-gate mix is not a curing-site substitute"
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground equine raw-hide dataset at actual pre-tannery gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Raw-hide and downstream leather models with matching species, grade, state and gate"
  excluded_use: "Other species, leather, unverified farm-gate mix and undisclosed state"
  required_metadata: "species, use history, terminal event, lawful source, allocation, net mass, grade, state and gate"
  required_quality_disclosure: "upstream coverage, state/mass/salt balance, shared drivers and unresolved UUIDs"
  update_trigger: "route, legal recovery, species scope, treatment state, gate, allocation or identity changes"
