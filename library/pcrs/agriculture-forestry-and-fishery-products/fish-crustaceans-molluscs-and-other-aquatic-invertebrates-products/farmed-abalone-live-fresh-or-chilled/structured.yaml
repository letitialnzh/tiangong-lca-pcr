      applies_to: "growout_husbandry; Grow-out mortalities and shell residue"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: This row records mortalities, shells, broken product, predator-damaged animals, and organic residues removed during grow-out. ; Flow property / unit: Mass / kg ; Amount rule: measured mortality count, mortality mass, shell residue, and disposal or recovery route ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per grow-out batch and per 1,000 kg marketable output after normalization ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_mortality_and_residue_records_growout_husbandry ; Sources: asc-farm-standard-2025 ; Range: Provisional mortality and residue screening estimate ; Diagnostic role: reasoned screening estimate only; not a default, empirical limit or completion threshold ; Lower: 0 ; Upper: 2 ; Unit: kg mortality or residue/kg marketable abalone ; Basis: broad first-pass mortality and residue mass relative to marketable output ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
