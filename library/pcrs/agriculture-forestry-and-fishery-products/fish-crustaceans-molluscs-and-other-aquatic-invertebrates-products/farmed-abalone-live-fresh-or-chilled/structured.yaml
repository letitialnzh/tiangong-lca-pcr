    - id: dq_range_seed_or_juvenile_abalone_input
      applies_to: "seed_supply_hatchery_and_nursery; seed_or_juvenile_abalone_input"
      requirement: "Independently collect this flow's own range/uncertainty evidence. The following declared-basis reasoned screening context is not a final-Q range or a mandatory cut-off:  ; - Range: Provisional seed input screening estimate ;   - Range role: Default estimate (default_estimate) ;   - Lower: 0.01 ;   - Upper: 2 ;   - Unit: kg seed or juvenile live mass/kg marketable abalone ;   - Basis: broad first-pass seed or juvenile mass input relative to marketable output ;   - Basis kind: Process output (process_output) ;   - Evidence kind: Reasoned estimate (reasoned_estimate) ;  ;  Retain original denominator S and units. Divide by 1000 exactly only when the original per-1000-kg basis is the same final Q/form/population; otherwise recover the numerator from raw quantity or measured S before Q conversion. Volume/fuel-energy conversion separately requires density/temperature/pressure/heating-value evidence, never relabelling. If an original ratio is a same-state measured biomass subset/available total, 0..1 applies only to that raw diagnostic ratio, not an exchange per Q."
