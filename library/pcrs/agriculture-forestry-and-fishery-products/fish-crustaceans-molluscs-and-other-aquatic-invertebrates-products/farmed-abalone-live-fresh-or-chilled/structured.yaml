      applies_to: "growout_husbandry; Grow-out water movement or make-up water"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: This row records pumped seawater, make-up water, or supplied water for land-based or recirculating grow-out systems. For open sea-ranch or cage systems, record only foreground-controlled pumping, flushing, or supplied water. ; Flow property / unit: Mass or volume / kg or m3 ; Amount rule: metered intake, pumped volume, or make-up water volume with system type declared ; Value mode: Foreground record (foreground_record) ; Specificity: Technology-specific (technology_specific) ; Normalization basis: per 1,000 kg harvest-size abalone output ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_water_intake_and_discharge_records_growout_husbandry ; Sources: asc-farm-standard-2025 ; Range: Provisional grow-out water screening estimate ; Diagnostic role: reasoned screening estimate only; not a default, empirical limit or completion threshold ; Lower: 0 ; Upper: 100000 ; Unit: m3/1,000 kg marketable abalone ; Basis: broad first-pass pumped or supplied water use across RAS, raceway, and flow-through systems ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
