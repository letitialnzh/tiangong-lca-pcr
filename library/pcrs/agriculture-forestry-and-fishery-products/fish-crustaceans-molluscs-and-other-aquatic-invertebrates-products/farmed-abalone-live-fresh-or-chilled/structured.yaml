      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: This row records bags, boxes, liners, insulated containers, gel ice packs, labels, and pallets that cross the foreground boundary with the product. ; Flow property / unit: Mass or item count / kg or item ; Amount rule: measured packaging item count and material mass; include capacity or tare mass for count records ; Value mode: Foreground record (foreground_record) ; Specificity: Product-specific (product_specific) ; Normalization basis: per 1,000 kg reference product ; Basis kind: Reference flow (reference_flow) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_packaging_records ; Range: Provisional packaging screening estimate ; Diagnostic role: reasoned screening estimate only; not a default, empirical limit or completion threshold ; Lower: 0 ; Upper: 500 ; Unit: kg packaging/1,000 kg reference product ; Basis: broad first-pass packaging material mass per reference product ; Basis kind: Reference flow (reference_flow) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
