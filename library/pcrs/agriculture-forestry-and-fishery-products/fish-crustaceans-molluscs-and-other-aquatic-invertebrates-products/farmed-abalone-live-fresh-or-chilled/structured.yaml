  calculation_rules:
    - id: normalize_to_reference_flow
      applies_to: "all foreground rows"
      rule: "Actual attributable native quantity q divided by same-lot positive actual final-gate accepted net mass Q. Preserve original batch, per-1000-kg and stage-S bases using explicit same_gate_normalization conversion; Q is not a presumed pack-out or delivery output."
      inputs:
        - q
        - Q
        - cp_gate_release
        - "own-node records"
      output: "native unit per 1 kg reference flow"
      source_ids:
        - pcr-gate-accounting-method
    - id: calculate_stocking_survival
      applies_to: "seed_supply_hatchery_and_nursery and growout_husbandry"
      rule: "survival_to_harvest = harvested_count / stocked_count, with count-to-mass conversion retained separately."
      inputs:
        - stocked_count
        - harvested_count
        - mortality_count
      output: "survival indicator and QA check"
      source_ids:
        - mass-balance-identity
    - id: calculate_feed_conversion_indicator
      applies_to: "growout_husbandry"
      rule: "feed_conversion_indicator = net_feed_mass / harvest_size_abalone_mass on the declared feed mass basis. Do not compare wet and dry feed without conversion evidence."
      inputs:
        - feed_mass
        - "moisture basis"
        - harvest_size_abalone_mass
      output: "feed mass per kg harvest-size abalone"
      source_ids:
        - asc-farm-standard-2025
    - id: reconcile_packout_mass
      applies_to: "harvest_grading_and_live_holding"
      rule: "opening_packout_stock + harvested_input_mass + evidenced_net_animal_mass_change = measured_packout_onward_mass + offgrade_saleable_mass + reject_mass + measured_local_animal_loss + closing_packout_stock."
      inputs:
        - opening_packout_stock
        - harvested_input_mass
        - evidenced_net_animal_mass_change
        - measured_packout_onward_mass
        - offgrade_saleable_mass
        - reject_mass
        - measured_local_animal_loss
        - closing_packout_stock
      output: "pack-out mass balance"
      source_ids:
        - mass-balance-identity
    - id: calculate_controlled_discharge
      applies_to: "water intake and discharge rows"
      rule: "Prefer measured discharge at the external boundary. When metering is incomplete, estimate discharge only from a complete matched-period balance with evidence for all material terms: external water inflows and precipitation entering the controlled system, less evaporation, water exported with product/waste, other external removals and change in stored water. Internal recirculation crosses no external boundary and cancels on both sides; do not subtract it again from intake. Mass/volume conversion requires actual temperature, salinity and density evidence. Missing terms or a negative closure residual are not an emission, uptake or zero. Distinguish controlled discharge from uncontrolled ambient sea-water exchange."
      inputs:
        - intake
        - discharge
        - "recirculated volume"
        - "retained water"
      output: "discharge volume by process"
      source_ids:
        - mass-balance-identity
    - id: calculate_delivery_transport_service
      applies_to: "delivery_to_declared_gate"
      rule: "For each actual route leg, multiply the mass in tonnes of the consignment actually carried by that leg distance in km, then normalize to matched final reference-product output. The load includes carrier water, ice and packaging actually transported and is not the net reference-product mass. For shared loads use a justified mass, occupied-volume or other causal attribution key. Record empty-return, cooling, oxygenation and holding coverage; zero payload on an empty return does not imply zero transport burden. Do not double-count a transport service that covers the same fuel/direct emissions already modelled explicitly."
      inputs:
        - "delivered mass"
        - "controlled distance"
      output: "tonne-kilometres"
      source_ids:
        - mass-balance-identity
    - id: same_gate_normalization
      applies_to: "all inventory rows"
      rule: "Divide measured attributable native quantity q by positive same-lot final-gate accepted net animal mass Q for each exchange per 1 kg. Per 1000 kg = 1000×q/Q; only an original per-1000-kg value for the same Q/form/population converts exactly by /1000. For an amount per stage output S, recover its numerator using independently measured S before division by Q. Preserve native quantities, stage yields, losses/stocks and measurement conversions. Only final Q/Q=1; internal outputs are never fixed to 1."
      inputs:
        - q
        - "stage S"
        - Q
        - cp_gate_release
        - "own-node records"
      output: "native unit per 1 kg reference flow"
      source_ids:
        - pcr-gate-accounting-method
  data_quality_requirements:
    - id: identity_and_scope
      applies_to: "all datasets"
      requirement: "Declare CPC code, species or hybrid, culture system, seed source, product form, geography, and declared gate."
      evidence: "dataset metadata, stocking records, product description, permit or certification evidence"
    - id: mass_basis_consistency
      applies_to: "reference product, seed, harvest, pack-out, and rejects"
      requirement: "Keep whole shell-on live, fresh, chilled, drained, wet, and dry bases separate unless measured conversion evidence exists."
      evidence: "scale records, product specifications, moisture or drainage evidence"
    - id: feed_and_water_disclosure
      applies_to: "grow-out and hatchery rows"
      requirement: "Retain feed type, feed basis, water source, water discharge route, and water quality monitoring where applicable."
      evidence: "feed logs, supplier data, water meter, discharge permit, monitoring report"
    - id: mortality_and_residue_completeness
      applies_to: "seed, grow-out, and pack-out rows"
      requirement: "Record mortalities, rejects, shell residue, biofouling residue, and fate by batch or reporting period."
      evidence: "mortality log, reject sheet, waste manifest, recovery record"
    - id: allocation_transparency
      applies_to: "multi-grade or multi-species systems"
      requirement: "State the partitioning or allocation basis before publishing a secondary or background dataset."
      evidence: "allocation worksheet, grade mass records, culture-unit records"
    - id: temporal_representativeness
      applies_to: "all foreground rows"
      requirement: "Cover a complete production batch, harvest lot, or representative reporting period; disclose partial-cycle datasets."
      evidence: "production calendar, stocking and harvest dates, reporting-period records"
    - id: dq_atomic_completion
      applies_to: "every process and inventory-completion obligation"
      requirement: "These are mandatory per-identity collection obligations, not exchanges, default inputs or emissions. Create separate cards and independent measurements for each actual substance, product, waste stream, emitted substance and receiving medium; retain native units, original batch/stage output, final-gate reference output, attribution/allocation and range/uncertainty evidence. Normalize original totals using matched final output; stage-normalized data require measured stage output to recover the numerator, never an assumption that stage and final output coincide. Do not copy a family total, mixed-unit range, default estimate or one UUID onto children. Unknown is not zero. Purchased materials are product inputs; only direct natural-resource abstraction is an elementary input. Determine the direction/type of mortality/managed waste, direct releases and useful co-products separately from actual fate."
      evidence: "per-flow coverage ledger, measurements/sampling, allocation, original/final outputs, identity and fate records"
