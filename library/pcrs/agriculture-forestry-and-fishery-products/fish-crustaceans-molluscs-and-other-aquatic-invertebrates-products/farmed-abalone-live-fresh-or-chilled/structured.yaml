    - id: dq_complete_live_holding_and_chilling_water
      applies_to: "harvest_grading_and_live_holding; Live holding and chilling water"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: This row records water, seawater, ice melt, or live holding system water used after harvest. ; Flow property / unit: Mass or volume / kg or m3 ; Amount rule: measured water or ice use for purging, depuration, live holding, chilling, and cleaning ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per 1,000 kg reference product ; Basis kind: Reference flow (reference_flow) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_water_intake_and_discharge_records_harvest_grading_and_live_holding ; Range: Provisional holding and chilling water screening estimate ; Diagnostic role: reasoned screening estimate only; not a default, empirical limit or completion threshold ; Lower: 0 ; Upper: 2000 ; Unit: m3/1,000 kg reference product ; Basis: broad first-pass live holding, purging, and chilling water per reference product ; Basis kind: Reference flow (reference_flow) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
