      applies_to: "growout_husbandry; Grow-out wastewater or discharged culture water"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: This row records discharged water, sludge, settled solids, or wastewater treatment outputs when the farm has a point-source discharge or controlled water treatment process. ; Flow property / unit: Volume or mass / m3 or kg ; Amount rule: measured discharge volume or calculated from the complete external water balance required by calculate_controlled_discharge ; Value mode: Calculated value (calculated_value) ; Specificity: Technology-specific (technology_specific) ; Normalization basis: per 1,000 kg harvest-size abalone output ; Basis kind: Process output (process_output) ; Evidence kind: Calculated from collection (calculated_from_collection) ; Collection protocol: cp_water_intake_and_discharge_records_growout_husbandry ; Sources: asc-farm-standard-2025 ; Range: Provisional grow-out discharge screening estimate ; Diagnostic role: reasoned screening estimate only; not a default, empirical limit or completion threshold ; Lower: 0 ; Upper: 100000 ; Unit: m3/1,000 kg marketable abalone ; Basis: broad first-pass controlled discharge across RAS, raceway, and flow-through systems ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
