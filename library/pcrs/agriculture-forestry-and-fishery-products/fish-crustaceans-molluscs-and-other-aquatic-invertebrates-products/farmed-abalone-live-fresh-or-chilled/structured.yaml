      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: This row is used when formulated pellets or mixed feed supplement or replace macroalgae feed. ; Flow property / unit: Mass / kg as-fed or dry basis declared ; Amount rule: measured feed issued by product and batch, with supplier formulation or feed class retained ; Value mode: Foreground record (foreground_record) ; Specificity: Product-specific (product_specific) ; Normalization basis: per 1,000 kg harvest-size abalone output ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_feed_records ; Sources: asc-farm-standard-2025, seafood-watch-abalone-worldwide-2022 ; Range: Provisional formulated feed screening estimate ; Diagnostic role: reasoned screening estimate only; not a default, empirical limit or completion threshold ; Lower: 0 ; Upper: 5000 ; Unit: kg formulated feed/1,000 kg marketable abalone ; Basis: broad first-pass formulated feed issued per marketable output ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
