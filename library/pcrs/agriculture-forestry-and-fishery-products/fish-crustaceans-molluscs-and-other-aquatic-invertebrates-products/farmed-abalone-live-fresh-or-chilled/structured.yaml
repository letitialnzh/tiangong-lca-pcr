      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: This row records kelp, Laminaria, Gracilaria, or other macroalgae feed supplied to the abalone culture units. ; Flow property / unit: Mass / kg wet or dry basis declared ; Amount rule: measured feed issued to culture units, with wet or dry basis and leftovers recorded where material ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per 1,000 kg harvest-size abalone output ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_feed_records ; Sources: seafood-watch-abalone-worldwide-2022, fao-abalone-breeding-1990 ; Range: Provisional macroalgae feed screening estimate ; Diagnostic role: reasoned screening estimate only; not a default, empirical limit or completion threshold ; Lower: 0 ; Upper: 30000 ; Unit: kg wet macroalgae/1,000 kg marketable abalone ; Basis: broad first-pass wet macroalgae feed issued per marketable output ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
