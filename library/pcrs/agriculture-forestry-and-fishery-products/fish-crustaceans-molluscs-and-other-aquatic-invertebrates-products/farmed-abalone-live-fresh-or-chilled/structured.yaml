      applies_to: "harvest_grading_and_live_holding; Off-grade, damaged, or dead product at pack-out"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: This row records non-marketable product, pack-out mortalities, broken shells, residues from whole-animal handling, and rejected animals. ; Flow property / unit: Mass / kg ; Amount rule: measured reject mass by fate and reason ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per 1,000 kg reference product ; Basis kind: Reference flow (reference_flow) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_mortality_and_residue_records_harvest_grading_and_live_holding ; Same-stage animal-only reject-fraction diagnostic: 0 <= r <= 1 applies only to the actual incoming animal mass on the same physical-state basis, without added water, packaging, sediment or foreign matter. It does not cap mixed residues or amounts per final Q. Independently collect actual per-stream range evidence."
