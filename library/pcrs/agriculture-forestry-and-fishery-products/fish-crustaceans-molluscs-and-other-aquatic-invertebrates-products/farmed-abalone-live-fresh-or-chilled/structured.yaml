      applies_to: "seed_supply_hatchery_and_nursery; Hatchery and nursery water"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: This row covers metered process water, seawater, or recirculation make-up water used in on-site hatchery and nursery operations. ; Flow property / unit: Mass or volume / kg or m3 ; Amount rule: measured water intake, make-up water, or recirculation replacement volume ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per 1,000 kg marketable abalone output or per stocking batch before normalization ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_water_intake_and_discharge_records_seed_supply_hatchery_and_nursery ; Sources: fao-abalone-breeding-1990 ; Range: Provisional hatchery and nursery water screening estimate ; Diagnostic role: reasoned screening estimate only; not a default, empirical limit or completion threshold ; Lower: 0 ; Upper: 1000 ; Unit: m3/1,000 kg marketable abalone ; Basis: broad first-pass pumped or supplied water for seed production relative to marketable output ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
