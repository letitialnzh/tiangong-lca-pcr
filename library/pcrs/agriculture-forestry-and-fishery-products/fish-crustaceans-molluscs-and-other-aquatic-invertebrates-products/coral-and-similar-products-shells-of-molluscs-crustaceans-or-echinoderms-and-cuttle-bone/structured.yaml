    type: "method_factor"
    reference: "This PCR sections 3–9: measured raw/native quantities, stage balances/yields and actual final-Q normalization."
    used_for: "Self-defined conservation and normalization identities; no empirical yield, machine mass, density, emission factor or measured range."
