    - protocol_id: cp_packaging_and_gate_release
      process_id: "packaging_storage_and_gate_release"
      flow_role: "Storage, final dripping and pre-calcination handover"
      record_type: "owned-node event and meter ledger"
      raw_fields: "incoming washed wet fragments; final net accepted Q; stage moisture/solids; drainage/leachate; shell rejects/losses; opening/closing stock; drainage/storage time; acceptance; exact pre-kiln interface; actual packaging and electricity; event_id; owning node; linked lot/period; raw quantity/unit; same final Q; stage yields; stocks; included assets/materials/consumers/service periods and attribution key"
      collection_method: "Measure each actual exchange at this node using calibrated scales/meters, inventory and receipt records. Preserve raw native quantities and moisture/density evidence; cross-reference paired transfers and the one shared ledger. Aggregate attributable exchange quantities and report per 1 kg reference flow using the same positive actual final Q; never duplicate shared totals or fix intermediate mass to 1 kg."
      unit: "kg; kWh; native measured units"
      frequency: "each lot, operation and meter interval"
      temporal_coverage: "matched whole campaign, carryover and asset service periods"
      site_scope: "packaging_storage_and_gate_release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original meters/invoices; source and quality evidence; receiver records; paired transfers; balances and uncertainty"
  calculation_rules:
    - id: final_gate_normalization
      applies_to: "each concrete exchange"
      rule: "For each actual raw exchange quantity q_i in its own unit and matched positive final accepted wet mass Q (kg), report q_i/Q per 1 kg reference flow. Preserve q_i, Q and their lot/period linkage. A physical shell/water quantity is unallocated; only supported shared LCA burden numerators receive an allocation share before division. If Q is zero/unknown, keep raw and stock records and do not invent a normalized dataset."
      inputs:
        - "raw q_i"
        - "actual final Q"
        - "lot/period"
        - "attribution records"
      output: "each exchange per kg of the actual final intermediate"
      source_ids:
        - mass-balance-identity
    - id: stage_yields
      applies_to: "actual receipt, washing and drainage stages"
      rule: "Retain each measured stage input S_in and output S_out with moisture and stocks; stage wet yield is S_out/S_in where S_in is positive. It is not automatically the final yield Q/S_in or a dry-shell yield. If a source record reports intensity x_i=q_i/S_stage, retain its measured stage denominator and explicitly reconstruct q_i=x_i*S_stage, then report q_i/Q; do not replace S_stage by 1 kg or a fictitious machine mass."
      inputs:
        - "measured stage masses"
        - "moisture/solids"
        - "raw intensity if used"
        - "final Q"
      output: "actual stage yield and final-basis exchange"
      source_ids:
        - mass-balance-identity
    - id: physical_balances
      applies_to: "shell, water and stock ledgers"
      rule: "Reconcile each stage opening stock plus actual arrivals and water/material additions with outputs, rejects, residues, drainage, evaporation where actually established and closing stock. Track shell solids, adhering water, tissue/salts separately where measured; disclose unexplained residuals and uncertainty. Do not assume a fixed mass loss, force a zero residual or use allocation shares to close physical balances."
      inputs:
        - "stage ledgers"
        - "paired transfers"
        - "raw meters"
        - stocks
      output: "unallocated physical balances and disclosed residuals"
      source_ids:
        - mass-balance-identity
    - id: emission_calculation
      applies_to: "actual direct releases"
      rule: "Use monitored emitted substance mass or a cited supported model matched to actual activity, fuel/engine, carbon origin and receiving medium. Discharged concentration requires matched aqueous flow and speciation; concentration, odour or net nutrient balance alone is not a mass exchange or credit."
      inputs:
        - "actual activity"
        - "supported factor/model"
        - "native units"
        - medium
      output: "each actual substance/medium exchange"
      source_ids: []
  data_quality_requirements:
    - id: dq_unique_reference_object
      applies_to: "every stage and final reference"
      requirement: "Require actual source segregation and mussel taxon/source verification, one fragment specification, measured stage moisture, and the precise single pre-calcination gate. Other shell families, raw mixture, powder and post-kiln states cannot inherit the reference identity or UUID. The historical mainly-mussel facility is not proof of pure target feed."
      evidence: "source, segregation, lot and gate specifications"
    - id: dq_shared_ledger
      applies_to: "all protocols"
      requirement: "Use one physical event/water/asset ledger with unique IDs, owning nodes, paired transfers, native raw amounts and common final Q. Preserve stocks and delayed handovers. Shared totals are recorded once and only attributable shares are assigned; internal reuse is neither new supply nor another deduction."
      evidence: "event/asset ownership, paired receipts and meters"
    - id: dq_ranges_uncertainty
      applies_to: "each important atomic exchange"
      requirement: "Collect independent observed operating range or justified uncertainty, units, denominator and source applicability for each exchange. No empirical bounds are supplied here. Barros’s historical 0.2–0.8 m3/t washing-water observation is per shell feed at one facility, not separate child-flow quantities or a final-Q cap; any use must verify matching feed/water boundaries, actual density and measured feed/Q ratio and retain outliers."
      evidence: "per-flow records, uncertainty and evidence applicability"
    - id: dq_completion
      applies_to: "all applicable collection duties"
      requirement: "Every applicable duty below must become independent actual physical/chemical exchanges with node, direction/type, own quantity/native unit, composition/form/moisture, source, normalization, range/uncertainty and actual fate/medium, plus verified compatible UUID before final dataset completion. No collection total/range/UUID is copied to all children. Unknown is not zero; absence needs evidenced not_applicable. No unresolved applicable duty or reference identity can pass final data-package validation."
      evidence: "per-duty coverage and original quantitative/identity records"
    - id: collect_receipt_rejects
      applies_to: "source_qualification_and_receipt"
      requirement: "Each actual receipt reject, foreign material or separated liquid; retain independent mass, composition, receiver and product/waste disposition. Use its owning-node protocol cp_source_receipt; preserve raw native quantities, actual stage yields and common positive final Q. Instantiate each actual exchange with independent direction/type, identity, amount/unit, range/uncertainty and receiver/medium; no grouped amount or UUID is binding."
      evidence: "original meters/stock/composition/fate records and compatible identity"
    - id: collect_receipt_energy
      applies_to: "source_qualification_and_receipt"
      requirement: "Any actual fuel, purchased heat or other receiving utility not represented by the electricity card; no generic energy mixture. Use its owning-node protocol cp_source_receipt; preserve raw native quantities, actual stage yields and common positive final Q. Instantiate each actual exchange with independent direction/type, identity, amount/unit, range/uncertainty and receiver/medium; no grouped amount or UUID is binding."
      evidence: "original meters/stock/composition/fate records and compatible identity"
    - id: collect_collection_energy
