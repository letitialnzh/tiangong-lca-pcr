validation_rules:
  - rule_id: validate_scope
    applies_to: "reference and all shell stages"
    rule: "Require source-verified mussel-shell fragments, freshwater washing/dripping, measured residual moisture and exact pre-calcination intermediate acceptance; reject other materials, unsegregated mixed feed, thermal drying/calcination, milling and manufactured carbonate. No commercial-sale/end-of-waste claim follows from this reference."
    source_ids:
      - barros-mussel-shell-2009
  - rule_id: validate_reference
    applies_to: "packaging_storage_and_gate_release"
    rule: "Exactly one final product reference is 1 kg at the stated intermediate interface; reference amount, mass property/unit, net weighing, residual moisture, final positive Q and every qualifier must agree. Internal inputs/outputs retain actual measured q/Q, never fixed reference mass."
    source_ids:
      - mass-balance-identity
  - rule_id: validate_measurement
    applies_to: "all exchanges"
    rule: "Trace all amounts to raw calibrated records, node-specific CP, native unit, actual density/heating-value conversions and common Q. Check real stage/final yields and wet/solids balances, disclose uncertainty and unexplained residuals; no imposed cap or invented factor."
    source_ids: []
  - rule_id: validate_water_and_fate
    applies_to: "water, treatment and wastes"
    rule: "Reconcile new water, paired recirculation, storage drainage, actual treatment and each environmental outlet without repeat intake deductions. Every waste has actual composition/moisture and receiver/treatment; each elementary release has its own substance and medium. Do not use sludge identity for shell/tissue waste or water-CO2 identity for air emission."
    source_ids: []
  - rule_id: validate_allocation_period
    applies_to: "burdens, stocks and assets"
    rule: "Verify upstream prior burdens, all intended outputs, subdivision/sharing evidence and sensitivity. Keep physical masses unallocated, internal movements paired and event/asset totals once; match period, carryover, replacements and end-of-service exchanges."
    source_ids:
      - eu-pef-method-2021
  - rule_id: validate_atomic_completion
    applies_to: "every actual card and completion duty"
    rule: "Read back every applicable collect_ requirement into independent actual exchanges and verify own quantity/unit, normalization, range/uncertainty, source and fate/medium, and semantically compatible UUID/property/flow type/state. Any unknown applicable quantity, identity, fate or missing duty makes the final dataset incomplete and validation fails; a static PCR check pass cannot replace this assessment."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for the washed/drained uncalcined mussel-shell fragment intermediate; process/lifecyclemodel are downstream projections."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual source-, species-, fragment-, moisture-, operation-, site- and pre-calcination-interface-matched datasets with verified exchanges and complete prior-burden/waste coverage."
  excluded_use: "Other materials or mixed feeds; dry/powder/calcined/manufactured products; legal product/end-of-waste certification; external-sale assertion; subsequent kiln/milling/use."
  required_metadata: "Actual source/taxon/segregation, incoming and final physical/legal states, all moisture/grade and lot/period/stocks, precise intermediate gate, process responsibility, transport coverage, water topology, energy, assets, allocation, raw records and UUIDs."
  required_quality_disclosure: "Measurement/range uncertainty, physical residuals, unknown identities/amounts, historical-source applicability, allocation sensitivity, source segregation and legal-status limitations."
  update_trigger: "Change of target material/state/interface, source segregation, washing/drainage/water or treatment route, energy, stock period, asset, allocation or relevant new evidence."
