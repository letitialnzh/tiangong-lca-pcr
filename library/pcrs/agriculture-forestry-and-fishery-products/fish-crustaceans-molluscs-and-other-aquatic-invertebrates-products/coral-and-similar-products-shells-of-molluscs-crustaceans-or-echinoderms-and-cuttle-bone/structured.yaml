    type: "literature"
    reference: "Barros, M.C., Bello, P.M., Bao, M. and Torrado, J.J. (2009). From waste to commodity: transforming shells into high purity calcium carbonate. Journal of Cleaner Production 17, 400–407. DOI:10.1016/j.jclepro.2008.08.013. Section 2.1, pp. 401–402. https://doi.org/10.1016/j.jclepro.2008.08.013"
    used_for: "Primary historical evidence for shell receipt, freshwater washing/dripping and storage before calcination. Only these interfaces support the selected route; later manufactured-carbonate properties, whole-plant totals and legal statements are not defaults for this intermediate."
  - id: "eu-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279, Annex I, Product Environmental Footprint Method. https://eur-lex.europa.eu/eli/reco/2021/2279/2021-12-30"
    used_for: "Prior qualitative methodological basis for primary data, allocation, boundary and disclosure; not evidence of product-specific quantities or complete PEF conformity."
