allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "all nodes and lots"
    rule: "Subdivide independently metered operations and lots and directly assign identifiable resources first. Keep physical material/water masses and paired transfers unallocated; allocation changes only shared LCA burden numerators."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_prior_burden
    applies_to: "source_qualification_and_receipt"
    rule: "Retain supplier waste/by-product status and upstream mussel aquaculture/processing burden rule and evidence. No automatic zero burden, avoided-disposal credit or sale revenue is assumed."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_shared
    applies_to: "shared equipment, treatment and assets"
    rule: "Document consumers, service periods and causal use keys (for example measured use or load where supported). If causal allocation cannot be supported, disclose an alternative relationship, complete output set, prices/period if economic, and sensitivity. Do not repeat a total at every node."
    source_ids:
      - eu-pef-method-2021
  - rule_id: allocation_residue
    applies_to: "losses, rejects and internal reuse"
    rule: "Separate actual useful outputs from managed wastes using evidenced destinations; losses retain their burdens in the product-system accounting. Internal shell/water transfers cancel in the system inventory, not in node balances. No negative nutrient balance or recycling credit is implied."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_source_receipt
      process_id: "source_qualification_and_receipt"
      flow_role: "Source qualification and receipt"
      record_type: "owned-node event and meter ledger"
      raw_fields: "supplier; actual mussel taxon; segregation/source evidence; prior waste status; gross/tare/net received feed; adhering/free water; moisture; accepted feed; each reject/fate; electricity; event_id; owning node; linked lot/period; raw quantity/unit; same final Q; stage yields; stocks; included assets/materials/consumers/service periods and attribution key"
      collection_method: "Measure each actual exchange at this node using calibrated scales/meters, inventory and receipt records. Preserve raw native quantities and moisture/density evidence; cross-reference paired transfers and the one shared ledger. Aggregate attributable exchange quantities and report per 1 kg reference flow using the same positive actual final Q; never duplicate shared totals or fix intermediate mass to 1 kg."
      unit: "kg; kWh; native measured units"
      frequency: "each lot, operation and meter interval"
      temporal_coverage: "matched whole campaign, carryover and asset service periods"
      site_scope: "source_qualification_and_receipt"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original meters/invoices; source and quality evidence; receiver records; paired transfers; balances and uncertainty"
    - protocol_id: cp_collection_transport
      process_id: "controlled_collection_and_delivery"
      flow_role: "Controlled pre-receipt delivery"
      record_type: "owned-node event and meter ledger"
      raw_fields: "loaded/delivered wet feed; actual accompanying water and containers; route/distance; mode; supplier service coverage; fuel identity/use; electricity; engine/factor evidence; measured fossil-fuel activity and unit; supported factor value/unit/source; carbon-origin/oxidation or engine applicability; factor/activity uncertainty; monitoring QA if available; empty return; losses; event_id; owning node; linked lot/period; raw quantity/unit; same final Q; stage yields; stocks; included assets/materials/consumers/service periods and attribution key"
      collection_method: "Measure each actual exchange at this node using calibrated scales/meters, inventory and receipt records. Preserve raw native quantities and moisture/density evidence; cross-reference paired transfers and the one shared ledger. Aggregate attributable exchange quantities and report per 1 kg reference flow using the same positive actual final Q; never duplicate shared totals or fix intermediate mass to 1 kg."
      unit: "kg; kWh; native measured units"
      frequency: "each lot, operation and meter interval"
      temporal_coverage: "matched whole campaign, carryover and asset service periods"
      site_scope: "controlled_collection_and_delivery"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original meters/invoices; source and quality evidence; receiver records; paired transfers; balances and uncertainty"
    - protocol_id: cp_preparation
      process_id: "cleaning_drying_and_sorting"
      flow_role: "Freshwater washing and initial dripping"
      record_type: "owned-node event and meter ledger"
      raw_fields: "wet feed/output and moisture; new supplied/abstracted water by source; raw meters; density/temperature/salinity; paired reuse; electricity; actual agents/other utilities; separate solids/wastewater/outlets; event_id; owning node; linked lot/period; raw quantity/unit; same final Q; stage yields; stocks; included assets/materials/consumers/service periods and attribution key"
      collection_method: "Measure each actual exchange at this node using calibrated scales/meters, inventory and receipt records. Preserve raw native quantities and moisture/density evidence; cross-reference paired transfers and the one shared ledger. Aggregate attributable exchange quantities and report per 1 kg reference flow using the same positive actual final Q; never duplicate shared totals or fix intermediate mass to 1 kg."
      unit: "kg; kWh; native measured units"
