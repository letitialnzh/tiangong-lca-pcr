  scope_review:
    reviewed_at_utc: 2026-10-16T07:57:04.600Z
    decision: User explicitly authorized an evidence-backed narrower boundary. The canonical
      unpublished id/directory is retained; current methodology covers only
      freshwater-washed, drained, uncalcined source-segregated mussel-shell fragments at
      a pre-calcination intermediate interface.
    limitations: Barros 2009 describes a mainly-mussel historical facility, not pure target
      feed, a particular Mytilus species, external sale or legal end-of-waste. Actual
      target segregation/source and interface records are mandatory. Calcination,
      thermal drying and milling are explicitly outside the authorized narrowed
      boundary.
