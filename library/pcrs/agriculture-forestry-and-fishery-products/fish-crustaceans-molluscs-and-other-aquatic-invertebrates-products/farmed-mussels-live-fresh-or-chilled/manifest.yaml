review_metadata:
  unresolved_identity:
    - Mussel spat, farmed mussel product, process water, electricity, sludge,
      packaging materials, diesel oil, and wild mussel UUIDs were checked with
      the sibling TianGong CLI; site-specific seed, rope, socking, buoy, float,
      anchor, gear loss, biofouling residue, shell waste, ice, oxygen, seawater
      intake, discharge, and depuration treatment flow identities still need
      selection before reviewed use when present.
    - Wild mussels under CPC 04431, processed mussels under CPC 21263, oysters,
      scallops, clams/cockles/ark shells, abalone, and other mollusc categories
      must remain separate PCR categories unless disclosed as co-products.
  unresolved_range_evidence:
    - Most inventory ranges are deliberately broad candidate QA screens using
      reasoned_estimate; replace with reviewed mussel farm, depuration,
      packhouse, delivery, official statistics, or literature evidence before
      active publication.
