      applies_to: "spat_supply_hatchery_and_nursery"
      requirement: "Independently collect and add cards for actual owned hatchery/nursery parental stock, eggs, larvae, settlement/spat and every production stage, each actual microalga/feed/medium/material/water/chemical/asset/waste/release. A juvenile/seed card cannot cover parents or all life stages. Retain supplier/ancestry, controlled production, opening/closing/failed batches and next-generation/transfer burdens. Filter-feeding or evidenced no intentional growout feed cannot erase owned hatchery/nursery food or parental resources."
      evidence: "Own-node stage ledger, independent quantity/unit/range, original sources and fates"
    - id: dq_actual_delivery_completion
      applies_to: "delivery_to_declared_gate; gate_release"
      requirement: "Add independent cards for each actual pre-gate leg, complete service or owned fuel/electricity/asset/cooling/top-up water-ice/gas, every substance release, loss/reject and water/package/cargo fate. Actual payload includes accompanying water, ice and packaging; empty returns retain actual fuel/vehicle service with explicit attribution despite zero cargo. Do not overlap complete services and covered components. Independently prove actual final-gate positive Q/state/recipient/time and exactly one evidenced path; unknown is never presumed bypass."
      evidence: "Route/service scope, actual payload, meters/calibrated weights, physical custody/acceptance and fates"
    - id: dq_actual_water_and_emissions
      applies_to: "all nodes"
      requirement: "Measure external natural abstraction, supplied water product, internal circulation and actual return/discharge separately; never deduct internal recirculation again from external intake. Generated wastewater/solid waste is actual output. Direct releases are individual substance/chemical-basis/actual-medium outputs, never resource inputs. Net nutrient increment/retention is only a separate balance diagnostic, never automatically a negative elementary flow or avoided burden. Actual wastewater origin/treatment state must match; do not substitute an arbitrary treatment-stage UUID."
      evidence: "Actual water/substance balances, sources/fates, treatment scope and substance factors/sampling evidence"
    - id: dq_actual_amount_modes_and_form
      applies_to: "all actual cards and product forms"
      requirement: "Set amount evidence mode from the actual method: direct measurement uses foreground_record/collected_record; calculated amounts use calculated_value/calculated_from_collection with measured inputs, formula, factors/units/sources and uncertainty. Candidate templates do not replace actual records. Every reference must remain a whole in-shell animal; a live reference must also be alive. Shucked meat or tissue-only reference products are outside this method, even if a yield is measured. Never substitute their mass for whole-animal Q or enlarge scope through collection obligations."
      evidence: "Original measurement/calculation evidence, actual same-lot state/form, measurements and physical fates"
    - id: dq_packout_mass_closure
      applies_to: "harvest_washing_depuration_and_packout"
      requirement: "Use reconcile_packout_mass for the same reporting period, traced lot/species and declared whole-animal product form. Opening and closing stocks are required measured fields, not defaults; retain their accumulated burdens across periods. Onward product, off-grade sale, rejects and other animal losses must be mutually exclusive: a death or loss already included in rejects is not deducted again. evidenced_net_animal_mass_change is signed, separately evidenced physical change of the animals, not an unexplained residual or a second receipt/loss. Keep free carrier water, ice and packaging in separate ledgers; exclude them from net animal weights, and do not subtract their drainage again as animal loss. The shorter zero-stock equation applies only when zero opening and closing stocks and no additional animal mass change are evidenced; unknown is never zero."
      evidence: "Dated net animal weighings, opening/closing stock ledger, disjoint destinations, independent physical-change evidence and burden carry-over records"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "the reference product is normalized to 1 kg farmed mussels in a declared live, fresh, or chilled product form;"
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "species or species group, culture system, spat or seed source, harvest area, product state, whole shell-on product basis, size or count grade, purification or depuration status, geography, declared gate, holding duration, and packaging state are declared;"
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "spat or seed input, culture area or gear, energy, fuel, water where controlled, mortality or residue, harvest, pack-out, packaging, and delivery where relevant are either present or explicitly marked not applicable with a reason;"
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "count, sack, mesh bag, crate, rope, sock, cluster, or volume records include actual net mass, tare, count per kg, mean size, or another transparent conversion to kg;"
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "grow-out records explicitly state whether external feed, intentional fertilization, pond enrichment, supplemental algae, predator-control chemicals, or disinfectants are used;"
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "water rows distinguish pumped, supplied, treated, depuration, live holding, and discharge water from ambient open-water exchange;"
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "pack-out mass balance reconciles harvested input, reference product, saleable off-grade product, rejects, and holding or drainage losses;"
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "same-site multi-species, shared-area, shared-gear, or multi-grade allocation is documented before the dataset is used as a background or secondary dataset;"
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "any filtration, nutrient-removal, carbon-storage, or habitat-service claim is excluded from the product inventory unless a separate reviewed method and source-backed quantity are declared."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Final data-package validation must read back dq_atomic_completion and every dq_complete_ requirement. Every applicable obligation must have concrete exchanges with independent quantities, units, sources, normalization, range/uncertainty, fate and verified UUIDs. Use not_applicable only for evidenced absence. Unknown identities, missing quantities, unclassified fates or unfulfilled obligations block final data-package completion. Static PCR checking is not a substitute for this validation."
    source_ids: []
  - rule_id: validation_rule_11
    applies_to: "foreground_dataset_conformance"
    rule: "Final datasets have exactly one actual gate_release and one declared_gate_reference. Every actual exchange and applicable dq_complete_/dq_stage_/dq_actual_/dq_range_ obligation must have independent atomic cards, own quantity/native unit, actual collection/calculation and range/uncertainty evidence, same-final-Q normalization, fate and verified UUID. Unknown identity, activity/route/gate, quantity, range evidence or fate blocks completion and validation, never zero, assumed bypass or disclosure-only omission. Static PCR checking does not establish actual dataset completeness."
    source_ids: []
  - rule_id: val_reference_form_scope
    applies_to: "market-size product transfers and final reference"
    rule: "Every market-size animal transfer and final reference product must retain its actual whole in-shell form. Raw shucked or tissue-only fresh/chilled final references are outside this methodology. No measured yield or section-8 completion claim enlarges this boundary."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production package that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "use as farmed mussel input to seafood processing, food service, retail, cold-chain, live seafood distribution, or regional food-product lifecycle models"
  allowed_use: "whole in-shell methodology only: farmed mussels live, fresh, or chilled datasets with declared species, culture system, product state, harvest area, purification status, gate, and quality disclosures"
  excluded_use: "raw shucked/tissue-only reference products outside this methodology; wild harvest, frozen/smoked/dried/salted/brined/prepared mussels, generic mollusc datasets, oysters, scallops, clams, cockles, ark shells, abalone, seed sold as seed, shell product datasets, and datasets lacking species, culture-system, or product-state disclosure"
  required_metadata: "canonical PCR id; CPC code; species or species group; culture system; spat or seed source; harvest area; product state; whole shell-on basis; size or count grade; purification or depuration status; geography; declared gate; holding or chilling duration; packaging state; data period; allocation basis"
  required_quality_disclosure: "missing UUIDs; unresolved mussel product, spat, shell residue, gear, habitat, seawater, discharge, or depuration treatment flow identities; no-feed declaration; water and purification records; gear loss records; mortality completeness; pack-out mass balance; partial-cycle or proxy data use"
  update_trigger: "revise when CPC mapping changes, Tiangong mussel, spat, shell residue, water, discharge, gear, or habitat flow identities are updated, Codex, FAO, ASC, or equivalent aquaculture and sanitation guidance changes, or reviewed foreground datasets provide better source-backed ranges"
