    required_unit: "kg"
    rule: "Independently measure net whole shell-on animal mass in its actual state, retaining native shell and tissue. Record actual washing, debyssing, depuration and drainage losses with same-lot evidence; exclude packaging/free water/ice. Shucked or tissue-only mass is not a reference option and cannot be inferred from whole-animal quantities."
