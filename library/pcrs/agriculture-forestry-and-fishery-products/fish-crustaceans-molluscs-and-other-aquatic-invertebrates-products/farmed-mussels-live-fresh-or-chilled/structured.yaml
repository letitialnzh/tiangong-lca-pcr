  calculation_rules:
    - id: normalize_to_reference_flow
      applies_to: "all foreground rows"
      rule: "Actual attributable native quantity q divided by same-lot positive actual final-gate accepted net mass Q. Preserve original batch, per-1000-kg and stage-S bases using explicit same_gate_normalization conversion; Q is not a presumed pack-out or delivery output."
      inputs:
        - q
        - Q
        - cp_gate_release
        - "own-node records"
      output: "native unit per 1 kg reference flow"
      source_ids:
        - pcr-gate-accounting-method
    - id: calculate_spat_acceptance_and_survival
      applies_to: "spat_supply_hatchery_and_nursery and growout_husbandry"
      rule: "accepted_spat_or_seed = received_or_collected_spat - rejected_spat; survival_to_harvest = harvested_count / accepted_spat_count when count records are available. Retain count-to-mass conversion separately."
      inputs:
        - "received spat"
        - "collected spat"
        - "rejected spat"
        - "stocked count"
        - "harvested count"
        - "mortality count"
      output: "accepted spat or seed, survival indicator, and QA check"
      source_ids:
        - mass-balance-identity
    - id: calculate_area_time_intensity
      applies_to: "growout_husbandry"
      rule: "area_time = active_culture_area * active_culture_duration; allocate shared area by culture-unit records, biomass-time, or product mass as declared."
      inputs:
        - "culture area"
        - "active days"
        - "allocation basis"
        - "product mass"
      output: "ha-year or m2-day per reference product"
      source_ids:
        - mass-balance-identity
    - id: apply_no_external_feed_default
      applies_to: "growout_husbandry"
      rule: "An actual growout input may be zero only when complete node/period records, purchase/stock/feeding-or-application reconciliation and management records positively evidence no intentional feeding, fertilization, pond enrichment or supplemental algae. Missing/unrecorded is not absent; independently include owned hatchery/nursery and parental-stage foods. Record each actual application product/quantity/purpose/evidence separately."
      inputs:
        - "feed records"
        - "enrichment records"
        - "farm declaration"
      output: "feed or enrichment applicability flag and material amount"
      source_ids:
        - asc-farm-standard-2025
    - id: reconcile_packout_mass
      applies_to: "harvest_washing_depuration_and_packout"
      rule: "opening_packout_stock + harvested_input_mass + evidenced_net_animal_mass_change = measured_packout_onward_mass + offgrade_saleable_mass + reject_mass + measured_local_animal_loss + closing_packout_stock."
      inputs:
        - opening_packout_stock
        - harvested_input_mass
        - evidenced_net_animal_mass_change
        - measured_packout_onward_mass
        - offgrade_saleable_mass
        - reject_mass
        - measured_local_animal_loss
        - closing_packout_stock
      output: "pack-out mass balance"
      source_ids:
        - mass-balance-identity
    - id: calculate_controlled_discharge
      applies_to: "water intake and discharge rows"
      rule: "Prefer measured discharge at the external boundary. When metering is incomplete, estimate discharge only from a complete matched-period balance with evidence for all material terms: external water inflows and precipitation entering the controlled system, less evaporation, water exported with product/waste, other external removals and change in stored water. Internal recirculation crosses no external boundary and cancels on both sides; do not subtract it again from intake. Mass/volume conversion requires actual temperature, salinity and density evidence. Missing terms or a negative closure residual are not an emission, uptake or zero. Distinguish controlled discharge from uncontrolled ambient sea-water exchange."
      inputs:
        - intake
        - discharge
        - "recirculated volume"
        - "retained water"
        - "removed water"
      output: "controlled discharge volume by process"
      source_ids:
        - mass-balance-identity
    - id: calculate_packaging_and_ice_mass
      applies_to: "packaging and ice rows"
      rule: "material_mass = item_count * tare_or_supplier_mass, adjusted for reuse allocation where applicable."
      inputs:
        - "item count"
        - "tare mass"
        - "supplier mass"
        - "reuse rate"
        - "ice mass"
      output: "kg packaging or ice per reference product"
      source_ids:
        - mass-balance-identity
    - id: calculate_delivery_transport_service
      applies_to: "delivery_to_declared_gate"
      rule: "For each actual route leg, multiply the mass in tonnes of the consignment actually carried by that leg distance in km, then normalize to matched final reference-product output. The load includes carrier water, ice and packaging actually transported and is not the net reference-product mass. For shared loads use a justified mass, occupied-volume or other causal attribution key. Record empty-return, cooling, oxygenation and holding coverage; zero payload on an empty return does not imply zero transport burden. Do not double-count a transport service that covers the same fuel/direct emissions already modelled explicitly."
      inputs:
        - "delivered mass"
        - "controlled distance"
        - route
      output: "tonne-kilometres"
      source_ids:
        - mass-balance-identity
    - id: same_gate_normalization
      applies_to: "all inventory rows"
      rule: "Divide measured attributable native quantity q by positive same-lot final-gate accepted net animal mass Q for each exchange per 1 kg. Per 1000 kg = 1000×q/Q; only an original per-1000-kg value for the same Q/form/population converts exactly by /1000. For an amount per stage output S, recover its numerator using independently measured S before division by Q. Preserve native quantities, stage yields, losses/stocks and measurement conversions. Only final Q/Q=1; internal outputs are never fixed to 1."
      inputs:
        - q
        - "stage S"
        - Q
        - cp_gate_release
        - "own-node records"
      output: "native unit per 1 kg reference flow"
      source_ids:
        - pcr-gate-accounting-method
  data_quality_requirements:
    - id: identity_and_scope
      applies_to: "all datasets"
      requirement: "Declare CPC code, species or species group, culture system, spat or seed source, harvest area, product state, purification status, geography, and declared gate."
      evidence: "dataset metadata, stocking records, harvest records, product description, permit, certification, or movement evidence"
    - id: mass_basis_consistency
      applies_to: "reference product, spat, harvest, pack-out, rejects, packaging, and ice"
      requirement: "Keep shell-on, live, fresh, chilled, drained, washed, wet, dry, count, container, and net mass bases separate unless measured conversion evidence exists."
      evidence: "scale records, product specifications, count per kg records, container tare, drainage or moisture evidence"
    - id: no_feed_and_material_disclosure
      applies_to: "grow-out rows"
      requirement: "Declare whether external feed, fertilization, pond enrichment, supplemental algae, predator-control chemicals, disinfectants, or other grow-out material inputs are used. Absence of feed must be an explicit foreground statement, not an omitted record."
      evidence: "farm declaration, application log, chemical inventory, certification audit, supplier records"
    - id: water_and_purification_disclosure
      applies_to: "hatchery, grow-out, depuration, relaying, washing, and live holding"
      requirement: "Distinguish ambient open-water exchange from controlled water intake, treatment, recirculation, depuration, live holding, and discharge."
      evidence: "water meters, pump logs, depuration logs, laboratory results, permit reports"
    - id: mortality_residue_and_gear_completeness
      applies_to: "spat, grow-out, pack-out, and delivery rows"
      requirement: "Record mortalities, rejects, shells, sediment, biofouling residue, discarded or lost gear, and fate by batch or reporting period."
      evidence: "mortality log, reject sheet, waste manifest, gear retrieval record, recovery record"
    - id: allocation_transparency
      applies_to: "multi-species, multi-grade, or shared-site systems"
      requirement: "State the partitioning or allocation basis before publishing a secondary or background dataset."
      evidence: "allocation worksheet, grade mass records, area-time records, culture-unit records"
    - id: temporal_representativeness
      applies_to: "all foreground rows"
      requirement: "Cover a complete production batch, harvest lot, purification cycle, delivery route, or representative reporting period; disclose partial-cycle datasets."
      evidence: "production calendar, stocking and harvest dates, depuration records, delivery records, reporting-period records"
    - id: dq_atomic_completion
      applies_to: "every process and inventory-completion obligation"
      requirement: "These are mandatory per-identity collection obligations, not exchanges, default inputs or emissions. Create separate cards and independent measurements for each actual substance, product, waste stream, emitted substance and receiving medium; retain native units, original batch/stage output, final-gate reference output, attribution/allocation and range/uncertainty evidence. Normalize original totals using matched final output; stage-normalized data require measured stage output to recover the numerator, never an assumption that stage and final output coincide. Do not copy a family total, mixed-unit range, default estimate or one UUID onto children. Unknown is not zero. Purchased materials are product inputs; only direct natural-resource abstraction is an elementary input. Determine the direction/type of mortality/managed waste, direct releases and useful co-products separately from actual fate."
      evidence: "per-flow coverage ledger, measurements/sampling, allocation, original/final outputs, identity and fate records"
    - id: dq_complete_hatchery_nursery_culture_inputs
      applies_to: "spat_supply_hatchery_and_nursery; On-site hatchery or nursery culture inputs"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: This row is used only when the reporting operator controls hatchery, larval, settlement, or nursery operations that use microalgae, culture media, settlement substrate, collectors, or comparable seed-production inputs. ; Flow property / unit: Mass, volume, or item count / kg, L, or item ; Amount rule: measured hatchery or nursery input quantity by batch and purpose ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per seed or spat batch and per 1,000 kg marketable reference product after normalization ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_hatchery_nursery_records ; Sources: fao-hatchery-culture-bivalves-2004, fao-mediterranean-mussel-factsheet ; Range: Provisional on-site hatchery input screening estimate ; Diagnostic role: reasoned screening estimate only; not a default, empirical limit or completion threshold ; Lower: 0 ; Upper: 500 ; Unit: kg or L hatchery input/1,000 kg marketable product ; Basis: broad first-pass on-site hatchery and nursery input relative to marketable output ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "actual records, independent identities and quantities, range/uncertainty evidence"
    - id: dq_complete_hatchery_nursery_water
      applies_to: "spat_supply_hatchery_and_nursery; Hatchery and nursery water"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: This row covers metered seawater, freshwater, process water, make-up water, or recirculation replacement water used in on-site hatchery and nursery operations. ; Flow property / unit: Mass or volume / kg or m3 ; Amount rule: measured intake, make-up water, treated water, or recirculation replacement volume ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per seed or spat batch and per 1,000 kg marketable reference product after normalization ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_water_quality_and_discharge_records_spat_supply_hatchery_and_nursery ; Sources: fao-hatchery-culture-bivalves-2004, asc-farm-standard-2025 ; Range: Provisional hatchery and nursery water screening estimate ; Diagnostic role: reasoned screening estimate only; not a default, empirical limit or completion threshold ; Lower: 0 ; Upper: 2000 ; Unit: m3/1,000 kg marketable product ; Basis: broad first-pass supplied water for on-site seed production relative to marketable output ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "actual records, independent identities and quantities, range/uncertainty evidence"
    - id: dq_complete_hatchery_mortalities_settlement_residue_and_rejected_spat
      applies_to: "spat_supply_hatchery_and_nursery; Hatchery mortalities, settlement residue, and rejected spat"
