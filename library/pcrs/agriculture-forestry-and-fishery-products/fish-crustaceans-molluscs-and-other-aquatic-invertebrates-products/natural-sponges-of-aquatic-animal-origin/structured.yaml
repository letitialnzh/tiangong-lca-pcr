  calculation_rules:
    - id: normalize_to_reference_product
      applies_to: "all inventory rows"
      rule: "normalized amount = actual same-lot exchange quantity / positive same-lot declared-gate accepted net product mass Q; retain raw trip/lot/reporting-period numerators and units. Apply evidenced shares only to genuinely shared LCA burdens in a separate attribution view, keeping the physical ledger unallocated. Link intermediate process yields through measured stage masses and Q; local output cannot replace Q or imply a 1:1 yield. The sole final reference output is Q/Q = 1 kg."
      inputs:
        - "Node raw quantities"
        - Q
        - "measured intermediate yields"
        - "attribution decisions"
      output: "Quantity per 1 kg reference flow and separate physical ledger"
      source_ids:
        - mass-balance-identity
    - id: material_state_balance
      applies_to: "all material stages and stocks"
      rule: "Record opening stocks, receipts/collection, observed biological/material changes without assuming managed production, actual water/material additions, internal handoffs, closing stocks, accepted products, rejection, mortality, tissue removal, trimming, drainage/evaporation and other losses separately; reconcile on matching species/form/moisture basis with unexplained residual retained. Do not deduct package tare or free ice again from already net product masses."
      inputs:
        - "Node mass/moisture/stock and fate records"
      output: "Measured stage yields and balance differences"
      source_ids:
        - mass-balance-identity
    - id: delivery_tonne_kilometres
      applies_to: "delivered reference product"
      rule: "For each actual route leg, multiply the mass in tonnes of the consignment actually carried by that leg distance in km, then normalize to matched final reference-product output. The load includes carrier water, ice and packaging actually transported and is not the net reference-product mass. For shared loads use a justified mass, occupied-volume or other causal attribution key. Record empty-return, cooling, oxygenation and holding coverage; zero payload on an empty return does not imply zero transport burden. Do not double-count a transport service that covers the same fuel/direct emissions already modelled explicitly."
      inputs:
        - "delivered mass"
        - distance
        - route
        - "load factor"
        - "moisture-protection condition"
      output: "tonne-km and delivered product inventory"
      source_ids:
        - mass-balance-identity
    - id: direct_emissions
      applies_to: "all actual direct releases"
      rule: "Use measurements or a sourced factor compatible with actual fuel/substance/units/receiving medium; retain original factor evidence, applicability, controls and uncertainty. No generic diesel factor is prescribed, and a water-body balance is not automatically a negative emission or credit."
      inputs:
        - "Node activity"
        - "measurement or sourced factor"
        - medium
      output: "Substance-specific direct release quantity"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: collect_harvest_fuel_diving_gear_and_collection_inputs
      applies_to: "harvest_collection_and_landing"
      requirement: "Add a separate exchange and quantity for each actual material, natural resource, distinct service, other intended product, waste and direct release at this node; record composition/species/state, native property/unit, supply boundary, destination/medium, ownership and evidenced actual absence. Generated rejects/residues/releases are outputs; only genuinely received wastes are inputs. Separate intended recovery, managed waste and direct environmental release by actual fate. Do not bind generic sludge/packaging/process-water identities or inherit aggregate quantities or mixed-unit ranges. Flow property / unit: Fuel, energy, mass, volume, item, time, or service quantity / L, kWh, MJ, kg, m3, item, h, or service unit; Amount rule: measured or allocated vessel fuel, air compression, diving service, gear use, collection inputs, and landing support by trip or lot; Sources: fao-sponge-production, martinangeli-commercial-sponges-2022 Retain each raw trip/lot/reporting-period quantity and applicable yield/moisture basis; divide every reporting quantity by measured same-lot final declared-gate accepted net mass Q. Collect independent range/uncertainty evidence for each concrete flow; a mixed collection screen is not a component range."
      evidence: "cp_harvest_collection_and_landing_records; Raw records, provider/recipient evidence, mass/water/stock balances and independent range/uncertainty support"
    - id: collect_damaged_sponges_non_target_material_and_landing_residues
      applies_to: "harvest_collection_and_landing"
      requirement: "Add a separate exchange and quantity for each actual material, natural resource, distinct service, other intended product, waste and direct release at this node; record composition/species/state, native property/unit, supply boundary, destination/medium, ownership and evidenced actual absence. Generated rejects/residues/releases are outputs; only genuinely received wastes are inputs. Separate intended recovery, managed waste and direct environmental release by actual fate. Do not bind generic sludge/packaging/process-water identities or inherit aggregate quantities or mixed-unit ranges. Flow property / unit: Mass, volume, or count / kg, m3, or item; Amount rule: measured rejected or damaged sponge, non-target material, residue mass, fate, disposal route, recovery route, and receiving environment; Sources:  Retain each raw trip/lot/reporting-period quantity and applicable yield/moisture basis; divide every reporting quantity by measured same-lot final declared-gate accepted net mass Q. Collect independent range/uncertainty evidence for each concrete flow; a mixed collection screen is not a component range."
      evidence: "cp_harvest_collection_and_landing_outputs; Raw records, provider/recipient evidence, mass/water/stock balances and independent range/uncertainty support"
    - id: collect_water_chemicals_energy_drying_and_packaging_inputs
      applies_to: "primary_preparation_drying_and_packout"
      requirement: "Add a separate exchange and quantity for each actual material, natural resource, distinct service, other intended product, waste and direct release at this node; record composition/species/state, native property/unit, supply boundary, destination/medium, ownership and evidenced actual absence. Generated rejects/residues/releases are outputs; only genuinely received wastes are inputs. Separate intended recovery, managed waste and direct environmental release by actual fate. Do not bind generic sludge/packaging/process-water identities or inherit aggregate quantities or mixed-unit ranges. Flow property / unit: Mass, volume, energy, concentration, or item count / kg, L, m3, kWh, MJ, %, or item; Amount rule: measured washing water, cleaning or preservation chemicals, drying energy, electricity, packaging, storage, and dispatch preparation quantities; Sources: fao-sponge-production Retain each raw trip/lot/reporting-period quantity and applicable yield/moisture basis; divide every reporting quantity by measured same-lot final declared-gate accepted net mass Q. Collect independent range/uncertainty evidence for each concrete flow; a mixed collection screen is not a component range."
      evidence: "cp_preparation_packaging_and_storage_records; Raw records, provider/recipient evidence, mass/water/stock balances and independent range/uncertainty support"
    - id: collect_trimming_residues_wash_water_and_packaging_waste
      applies_to: "primary_preparation_drying_and_packout"
      requirement: "Add a separate exchange and quantity for each actual material, natural resource, distinct service, other intended product, waste and direct release at this node; record composition/species/state, native property/unit, supply boundary, destination/medium, ownership and evidenced actual absence. Generated rejects/residues/releases are outputs; only genuinely received wastes are inputs. Separate intended recovery, managed waste and direct environmental release by actual fate. Do not bind generic sludge/packaging/process-water identities or inherit aggregate quantities or mixed-unit ranges. Flow property / unit: Mass or volume / kg, L, or m3; Amount rule: measured trimming residues, wash water, spent bath, wastewater, packaging waste, disposal route, recovery route, and receiving environment; Sources:  Retain each raw trip/lot/reporting-period quantity and applicable yield/moisture basis; divide every reporting quantity by measured same-lot final declared-gate accepted net mass Q. Collect independent range/uncertainty evidence for each concrete flow; a mixed collection screen is not a component range."
      evidence: "cp_primary_preparation_drying_and_packout_outputs; Raw records, provider/recipient evidence, mass/water/stock balances and independent range/uncertainty support"
    - id: collect_delivery_fuel_electricity_and_packaging_support
      applies_to: "delivery_to_declared_gate"
      requirement: "Add a separate exchange and quantity for each actual material, natural resource, distinct service, other intended product, waste and direct release at this node; record composition/species/state, native property/unit, supply boundary, destination/medium, ownership and evidenced actual absence. Generated rejects/residues/releases are outputs; only genuinely received wastes are inputs. Separate intended recovery, managed waste and direct environmental release by actual fate. Do not bind generic sludge/packaging/process-water identities or inherit aggregate quantities or mixed-unit ranges. Flow property / unit: Fuel, energy, mass, or transport service / L, MJ, kWh, kg, or tonne-km; Amount rule: include only when the declared reference flow is delivered beyond landing, drying yard, dispatch, or packhouse gate; record distance, mode, load factor, moisture-protection condition, and return logistics where relevant; Sources:  Retain each raw trip/lot/reporting-period quantity and applicable yield/moisture basis; divide every reporting quantity by measured same-lot final declared-gate accepted net mass Q. Collect independent range/uncertainty evidence for each concrete flow; a mixed collection screen is not a component range."
      evidence: "cp_delivery_records; Raw records, provider/recipient evidence, mass/water/stock balances and independent range/uncertainty support"
    - id: dq_unique_object_gate
      applies_to: "reference object and every stage"
      requirement: "Before collection each dataset must fix one physical reference object: one species or an evidenced single physical commercial species-group product, one source/production route, form, actual life/preparation state, moisture/drainage basis, grade and unique gate location/time/acceptance condition. Do not combine different species, live/dead, fresh/chilled, raw/prepared states or different gates in one reference exchange; unresolved specifications make the dataset incomplete. Each stage is the measured state of that same lot and is not automatically the final 1 kg."
      evidence: "Species/origin/state/moisture/grade specification, actual gate and lot transfer/acceptance records"
    - id: dq_ranges_uncertainty
      applies_to: "every actual individual exchange"
      requirement: "Verify each range basis against its concrete flow, real unit, same-lot final Q denominator and representative conditions; retain independent source/historical-batch evidence, observed variation and uncertainty without treating unknown as zero. A mixed-unit collection screen is not an individual-flow range; no universal initial upper bound spans different moisture, yield, gate or taxa. Do not self-validate against the tested batch maximum or clip actual outliers."
      evidence: "Independent original evidence, calibration, method and uncertainty records"
    - id: dq_period_ownership
      applies_to: "all nodes, periods, assets and inclusive services"
      requirement: "Cover complete actual trip/production/handling/holding/transport periods, return, idle/failed duty, maintenance/cleaning and asset replacement/retirement; reconcile unique ownership and carried stock burdens across shared consumers. Zero output or unknown Q cannot justify division by zero or erased burdens; exclude duplicate components according to inclusive service scope. Disclose actual applicability of natural origin/habitat/permit, n.e.c. justification, temporal/technology/geographic representativeness and exclusions."
      evidence: "Period calendars, resource/asset/service/stock ledgers and origin/scope evidence"
    - id: collect_declared_gate_handling
      applies_to: "declared_gate_release"
      requirement: "The final gate is the actual boundary responsibility interface, not presumed extra processing. Collect each actual pre-gate acceptance/weighing/handling event’s own electricity, material, service, rejection and release; carry the original record when the same event is already owned by a predecessor, without duplicate measurement. Every applicable concrete exchange needs its own native quantity/unit, same-Q normalization, destination and verified identity; missing data is not zero."
      evidence: "cp_declared_gate; cp_gate_outputs; actual event/ownership/transfer/acceptance and independent range/uncertainty records"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference object"
    rule: "Verify this PCR scope, single species/physical commercial product, actual source/route, life/preparation state, form/moisture/grade and unique declared gate. Classification labels or generic landing UUIDs cannot replace actual gate/state. Explain more-specific-PCR nonapplicability for n.e.c. products and animal origin for natural sponges."
    source_ids: []
  - rule_id: validate_gate_quantity
    applies_to: "reference output and all quantities"
    rule: "declared_gate_product is the sole final 1 kg reference output, and Q must be positive measured same-lot accepted net mass. Retain all raw batch quantities, actual intermediate yields, refusal/transit loss/moisture changes and paired transfers. Pack-out and delivery receipts are independently measured, not competing reference outputs."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all collection duties and actual exchanges"
    rule: "Resolve every applicable section-8 duty into specific physical/chemical exchanges with independent quantities, native units, range/uncertainty evidence, composition/state, same-Q normalization, destination/medium and verified compatible UUIDs. Any unresolved applicable duty makes the final dataset incomplete and validation fails; unknown is not zero and collection amounts/ranges/UUIDs are never copied."
    source_ids: []
  - rule_id: validate_fates_ownership
    applies_to: "outputs, resources, services and periods"
    rule: "Check intended products, managed wastes, environmental releases and stocks by actual fate; generated wastes/releases cannot be inputs. Inclusive services exclude overlapping owned fuel/electricity/assets/releases; transport cargo includes accompanying water/ice/containers and empty return is not zero burden. All actual nodes/periods/shared consumers and carried burdens must be complete."
    source_ids: []
  - rule_id: validate_projection
    applies_to: "bilingual content and structured projection"
    rule: "English/Chinese must align on reference object, exchange IDs, rules, units/denominators and duties; UUID-bearing Chinese displays use official baseName and unresolved identities remain explicit. Normally regenerate and verify structured Schema/fingerprints; structural pass does not prove identity, yield, numerical ranges or actual data completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset for natural sponges of aquatic animal origin"
  downstream_use: "secondary_dataset; background_dataset; foreground reference for process or lifecyclemodel construction when harvest and primary preparation records are retained"
  allowed_use: "LCA modelling of declared natural aquatic animal sponge at landing, drying, dispatch, packhouse, or delivered gate"
  excluded_use: "synthetic sponges; plastic foam sponges; shaped bath articles; chemically finished or manufactured sponge goods; composite cleaning products; cosmetic or medical finished articles; extracted compounds; damaged sponge biomass, residues, wastewater, or trimmings as separate products; ecosystem-service or regeneration claims without a separate reviewed method"
  required_metadata: "canonical PCR id; CPC 3.0 code; species or commercial grade; natural animal origin; harvest or collection area; collection method; permit or access right; wet/dry/cleaned/dried mass basis; product grade; packaging state; declared gate; geography; reporting period; data owner; unresolved UUID substitutions"
  required_quality_disclosure: "natural origin evidence, habitat and permit disclosure where relevant, mass balance closure, wet/dry/cleaned basis, temporal coverage, allocation basis, upstream dataset links, missing foreground records, proxy rows, and reasoned-estimate ranges used only for QA screening"
  update_trigger: "new Tiangong flow identities for sponge species, collection gear, diver service, compressed air, cleaning chemicals, drying energy, residues, packaging, or delivery services; reviewed quantitative evidence for fuel, yield, moisture loss, trimming, drying, packaging, or habitat ranges; updated FAO, fishery management, or legal requirements; classification mapping change"
data_sources:
  - id: "fao-sponge-production"
    type: "official_guidance"
    reference: "FAO, Sponge production chapter, https://www.fao.org/4/ac286e/AC286E02.htm"
    used_for: "Historical qualitative capture and primary-preparation interfaces, distinguishing raw collection from non-skeletal tissue removal; not evidence of current practices, quantities, gear impacts, permits or product state."
