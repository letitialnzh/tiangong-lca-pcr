  unresolved_identity:
    - Crab seed crabs, megalopae, juveniles, shells, molts, mortalities,
      wastewater, ice, live-holding media, and site-specific treatment flow
      identities remain unresolved until site scope and Tiangong rows are
      selected.
    - Selected feed, fresh bait, oxygen, generic packaging, sludge,
      water-quality-improver, and farmed-crab product UUIDs are candidate
      identity references from the sibling TianGong CLI and should be rechecked
      against site-specific foreground records before reviewed use.
    - Route-specific seawater, brackish water, controlled discharge,
      refrigerant, area-occupation, delivery service, reusable packaging, and
      delivery-loss flows must be selected from foreground records before
      publication when used.
