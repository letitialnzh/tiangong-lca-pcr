validation_rules:
  - rule_id: val_crab_requirement_01
    applies_to: "foreground_dataset_conformance"
    rule: "the reference product is normalized to 1 kg farmed crab in a declared live, fresh, or chilled product form;"
    source_ids: []
  - rule_id: val_crab_requirement_02
    applies_to: "foreground_dataset_conformance"
    rule: "species, biological starting condition, farmed production evidence, culture system, product state, product form, size grade, geography, declared gate, holding duration, and packaging state are declared;"
    source_ids: []
  - rule_id: val_crab_requirement_03
    applies_to: "foreground_dataset_conformance"
    rule: "the dataset distinguishes farmed grow-out, nursery, or fattening from wild catch and does not use this PCR for wild capture followed only by storage, live holding, chilling, grading, or dispatch;"
    source_ids: []
  - rule_id: val_crab_requirement_04
    applies_to: "foreground_dataset_conformance"
    rule: "broodstock, larval, megalopa, juvenile, seed crab, stocked crab, feed, controlled water, energy, fuel, health treatment or chemical use, mortality, molt or residue, harvest, pack-out, packaging, and delivery where relevant are either present or explicitly marked not applicable with a reason;"
    source_ids: []
  - rule_id: val_crab_requirement_05
    applies_to: "foreground_dataset_conformance"
    rule: "count, basket, box, tank, tub, or size-grade records include actual net mass, count per kg or mean mass, stage, product form, tare where relevant, and sampling method;"
    source_ids: []
  - rule_id: val_crab_requirement_06
    applies_to: "foreground_dataset_conformance"
    rule: "water rows distinguish controlled water intake, exchange, recirculation, oxygenation, salinity, discharge, and live holding water;"
    source_ids: []
  - rule_id: val_crab_requirement_07
    applies_to: "foreground_dataset_conformance"
    rule: "feed records distinguish formulated feed, trash fish, mollusc feed, live feed, wet basis, dry basis, and as-fed basis;"
    source_ids: []
  - rule_id: val_crab_requirement_08
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile local harvested receipts, opening/closing stock, independently measured pack-out onward animal mass, saleable off-grade product, rejects and actual local losses on the same product-form basis, with evidenced physical mass changes and no duplicated fate. Independently reconcile included delivery and final acceptance; their losses are not pack-out losses, and only positive final accepted net mass Q is the normalization denominator, not a presumed pack-out output."
    source_ids: []
  - rule_id: val_crab_requirement_09
    applies_to: "foreground_dataset_conformance"
    rule: "same-site multi-species, shared-pond, shared-pen, shared-cage, shared-box, shared-RAS, shared-packhouse, or multi-grade allocation is documented before the dataset is used as a background or secondary dataset."
    source_ids: []
  - rule_id: val_final_gate_completion
    applies_to: "foreground_dataset_conformance"
    rule: "Check sole declared_gate_release reference output 1 kg, positive final accepted net-kg denominator, actual included/bypassed delivery and every independently measured internal transfer, rejection and loss. Verify all dq_complete actual child exchanges, native units, normalization, independent Range evidence, UUIDs, fates and non-duplication; any gap makes the final dataset incomplete and fails validation."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production package that may be published as a secondary_dataset or background_dataset after review"
  downstream_use: "use as farmed crab input to seafood processing, food service, retail, cold-chain, live seafood distribution, or regional food-product lifecycle models"
  allowed_use: "farmed crab live, fresh, or chilled datasets with declared farmed production evidence, species, culture system, product state, gate, and quality disclosures"
  excluded_use: "wild-caught crab datasets, wild catch only held or chilled after capture, frozen/dried/salted/brined/cooked/canned/picked-meat/prepared products, seed sold as seed, shell residue datasets, and datasets lacking farmed production or culture-system disclosure"
  required_metadata: "canonical PCR id; CPC code; species; biological starting condition; farmed production evidence; culture system; product state; whole or declared basis; size grade or count per kg; sex or maturity class where material; geography; declared gate; holding or chilling duration; feed regime; water salinity and exchange basis; packaging state; data period; allocation basis"
  required_quality_disclosure: "missing UUIDs; unresolved crab seed, shell, molt, mortality, wastewater, ice, and site-specific treatment flow identities; feed wet/dry/trash-fish conversion; water salinity and discharge records; health treatment eligibility; mortality and molt completeness; pack-out mass balance; partial-cycle, pilot-scale, or proxy data use"
  update_trigger: "revise when CPC mapping changes, Tiangong crab, seed, feed, oxygen, water, discharge, sludge, shell, packaging, or treatment flow identities are updated, ASC, Codex, FAO, SEAFDEC, or equivalent aquaculture and seafood handling guidance changes, or reviewed foreground datasets provide better source-backed ranges"
