  - id: "codex-cxc-52-2003"
    type: "standard"
    reference: "<https://www.fao.org/input/download/standards/10273/CXP_052e.pdf>"
    used_for: "fish and fishery product handling, chilled aquatic products, temperature control, damage prevention, aquaculture and seafood hygiene context"
  - id: "fao-mud-crab-aquaculture-2011"
    type: "handbook"
    reference: "<https://www.fao.org/4/ba0110e/ba0110e.pdf>"
    used_for: "mud crab biology, hatchery, nursery, grow-out, disease control, harvest, processing, packing, and market-readiness process decomposition used as crab-specific aquaculture guidance"
  - id: "seafdec-mud-crab-growout-2017"
    type: "extension_guidance"
    reference: "<https://repository.seafdec.org.ph/bitstream/handle/10862/3181/3181-GenodepaJG2017.pdf>"
    used_for: "mud crab grow-out systems, ponds, pens, cages, fattening context, cannibalism and survival management, and harvest handling guidance"
