    type: "standard"
    reference: "<https://programme-centre.asc-aqua.org/app/uploads/2025/08/ASC-STD-001-ASC-Farm-Standard-V1.0.1-Aug-2025.pdf>"
    used_for: "current ASC farm-level aquaculture requirements for site scope, traceability, water, energy, health, legal, environmental, and feed-related disclosures"
  - id: "asc-feed-standard-2025"
    type: "standard"
    reference: "<https://programme-centre.asc-aqua.org/app/uploads/2025/04/ASC-STD-002-ASC-Feed-Standard-V1.1-May-2025.pdf>"
    used_for: "aquafeed supplier, ingredient, traceability, and feed disclosure context"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Conservation of mass applied as a PCR calculation identity for stock acceptance, survival, grow-out, discharge, pack-out, packaging, delivery, and reference-flow normalization."
    used_for: "QA guardrails, survival, feed conversion, yield, pack-out reconciliation, packaging conversion, delivery-service calculation, and normalization rules"
  - id: "ghg-product-allocation"
    type: "standard"
    reference: "GHG Protocol Product Life Cycle Accounting and Reporting Standard, chapter 9, https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf (verified 2026-10-16, printed pp.60–70)"
    used_for: "Allocation hierarchy explicitly adopted by this PCR: subdivision, causal physical and economic relationships; no aquaculture performance, actual share or non-GHG impact-assessment conclusion"
