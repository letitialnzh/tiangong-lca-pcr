  calculation_rules:
    - id: normalize_to_reference_flow
      applies_to: "all foreground rows"
      rule: "normalized_amount = measured_or_calculated_amount / marketable_reference_product_mass. Preserve raw records and product-form basis."
      inputs:
        - "measured amount"
        - marketable_reference_product_mass
      output: "amount per 1 kg reference product"
      source_ids:
        - mass-balance-identity
    - id: calculate_stock_acceptance_and_survival
      applies_to: "broodstock_hatchery_nursery_and_stocking and growout_and_fattening_husbandry"
      rule: "accepted_stock = received_or_produced_stock - rejected_stock; survival_to_harvest = harvested_count / stocked_count when count records are available. Retain count-to-mass conversion separately."
      inputs:
        - "received stock"
        - "produced megalopae"
        - "rejected stock"
        - "stocked count"
        - "harvested count"
        - "mortality count"
      output: "accepted stock, survival indicator, and QA check"
      source_ids:
        - mass-balance-identity
    - id: calculate_feed_conversion_indicator
      applies_to: "growout_and_fattening_husbandry"
      rule: "feed_conversion_indicator = net_feed_mass / harvest_size_product_mass on the declared feed mass basis. Do not compare wet, dry, trash-fish, mollusc-meat, and as-fed records without conversion evidence."
      inputs:
        - feed_mass
        - "feed basis"
        - harvest_size_product_mass
      output: "feed mass per kg harvest-size crab"
      source_ids:
        - asc-feed-standard-2025
    - id: calculate_controlled_discharge
      applies_to: "water intake and discharge rows"
      rule: "Prefer measured discharge at the external boundary. When metering is incomplete, estimate discharge only from a complete matched-period balance with evidence for all material terms: external water inflows and precipitation entering the controlled system, less evaporation, water exported with product/waste, other external removals and change in stored water. Internal recirculation crosses no external boundary and cancels on both sides; do not subtract it again from intake. Mass/volume conversion requires actual temperature, salinity and density evidence. Missing terms or a negative closure residual are not an emission, uptake or zero. Distinguish controlled discharge from uncontrolled ambient sea-water exchange."
      inputs:
        - intake
        - discharge
        - "recirculated volume"
        - "retained water"
        - "sludge water"
      output: "controlled discharge volume by process"
      source_ids:
        - mass-balance-identity
    - id: reconcile_packout_mass
      applies_to: "harvest_live_holding_chilling_and_packout"
      rule: "harvested_input_mass + opening_packout_stock + evidenced_net_animal_mass_change = measured_packout_onward_mass + offgrade_saleable_mass + reject_mass + measured_local_animal_loss + closing_packout_stock, on the same declared animal/product-form basis. Measure measured_packout_onward_mass independently at the actual outgoing handling transfer; it is not final-gate accepted Q. Keep destinations mutually exclusive and count each local reject, mortality or tissue loss once. Evidence any physical animal-mass change separately. The signed net-change term covers only evidenced gain or decrease not already represented in another receipt, stock, output, reject or local-loss term; never count the same change in two terms. Unexplained imbalance is not a permitted adjustment. Track free water, ice, drainage and packaging in separate material ledgers, excluding them only from gross weighings that contain them. Reconcile subsequent delivery and final acceptance separately under their actual owners, then normalize each actual quantity by positive final accepted Q through calc_final_gate_normalization; never move a downstream loss into pack-out or assume the outgoing transfer equals Q."
      inputs:
        - harvested_input_mass
        - opening_packout_stock
        - evidenced_net_animal_mass_change
        - measured_packout_onward_mass
        - offgrade_mass
        - reject_mass
        - measured_local_animal_loss
        - closing_packout_stock
        - cp_harvest_and_product_records_harvest_live_holding_chilling_and_packout
        - cp_atomic_inventory_harvest_live_holding_chilling_and_packout
        - cp_final_gate_acceptance
      output: "independently reconciled local pack-out animal-mass balance and separate final-gate denominator"
      source_ids:
        - mass-balance-identity
    - id: calculate_packaging_and_ice_mass
      applies_to: "packaging, ice, oxygen, and reusable container rows"
      rule: "material_mass = item_count * tare_or_supplier_mass, adjusted for reuse allocation where applicable."
      inputs:
        - "item count"
        - "tare mass"
        - "supplier mass"
        - "reuse rate"
        - "ice mass"
      output: "kg packaging, ice, oxygen, or container service per reference product"
      source_ids:
        - mass-balance-identity
    - id: calculate_delivery_transport_service
      applies_to: "delivery_to_declared_gate"
      rule: "For each actual route leg, multiply the mass in tonnes of the consignment actually carried by that leg distance in km, then normalize to matched final reference-product output. The load includes carrier water, ice and packaging actually transported and is not the net reference-product mass. For shared loads use a justified mass, occupied-volume or other causal attribution key. Record empty-return, cooling, oxygenation and holding coverage; zero payload on an empty return does not imply zero transport burden. Do not double-count a transport service that covers the same fuel/direct emissions already modelled explicitly."
      inputs:
        - "delivered mass"
        - "controlled distance"
        - route
      output: "tonne-kilometres"
      source_ids:
        - mass-balance-identity
    - id: calc_final_gate_normalization
      applies_to: "all inventory rows"
      rule: "Divide same-boundary, same-actual-state quantities reported per 1000 kg final accepted product by 1000. For raw batch/event totals, establish actual ownership and once-only allocation, then divide by positive final accepted net kg from cp_final_gate_acceptance. Stage, harvest or pack-out denominators require same-lot measured transfer/yield mapping with the original values and conversion audit trail retained. Internal animals and transported water/ice/packaging are never fixed 1 kg inputs."
      inputs:
        - "raw batch and stage records"
        - "measured yields/transfers"
        - "once-only allocation"
        - cp_final_gate_acceptance
      output: "native exchange quantity per 1 kg final reference, with raw values and conversion record"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: identity_and_scope
      applies_to: "all datasets"
      requirement: "Declare CPC code, species, farmed production evidence, biological starting condition, culture system, product state, geography, and declared gate."
      evidence: "dataset metadata, stocking records, hatchery records, product description, permit, certification, or movement evidence"
    - id: mass_basis_consistency
      applies_to: "reference product, stock, harvest, pack-out, rejects, feed, packaging, and ice"
      requirement: "Keep whole, soft-shell, fattened, live, fresh, chilled, drained, wet, dry, trash-fish, count, container, and net mass bases separate unless measured conversion evidence exists."
      evidence: "scale records, product specifications, count per kg records, container tare, moisture or drainage evidence"
    - id: feed_and_health_disclosure
      applies_to: "hatchery, nursery, grow-out, and fattening rows"
      requirement: "Retain feed type, feed basis, feed recipe, supplier formulation, health treatments, medicine eligibility, and biosecurity records where applicable."
      evidence: "feed logs, supplier data, farm recipe, health plan, treatment logs"
    - id: water_salinity_and_discharge_disclosure
      applies_to: "hatchery, nursery, grow-out, fattening, live holding, and pack-out"
      requirement: "Distinguish controlled intake, exchange, recirculation, oxygenation, salinity, live holding, cleaning, and discharge."
      evidence: "water meters, sensor logs, oxygen logs, pump logs, discharge permits, monitoring reports"
    - id: mortality_molt_residue_and_sludge_completeness
      applies_to: "stock, grow-out, fattening, pack-out, and delivery rows"
      requirement: "Record mortalities, molts, shells, feed residue, sludge, rejects, and fate by batch or reporting period."
      evidence: "mortality log, molting log, reject sheet, sludge record, waste manifest, recovery record"
    - id: allocation_transparency
      applies_to: "multi-species, multi-grade, or shared-system operations"
      requirement: "State the partitioning or allocation basis before publishing a secondary or background dataset."
      evidence: "allocation worksheet, grade mass records, pond records, cage records, RAS module records, route logs"
    - id: temporal_representativeness
      applies_to: "all foreground rows"
      requirement: "Cover a complete aquaculture production batch, fattening batch, harvest lot, holding period, delivery route, or representative reporting period; disclose partial-cycle or pilot-scale datasets."
      evidence: "production calendar, stocking and harvest dates, hatchery records, delivery records, reporting-period records"
    - id: dq_inventory_completion
      applies_to: "all concrete exchanges and final gate"
      requirement: "Complete every actual exchange including route-specific water, energy, feed, treatment, packaging, service, capital/replacement/cleaning and fate. Independently measure listed water/electricity/diesel/oxygen/ice cards only when actually used, and add separate cards for all other actual materials. Retain independent Range/UUID gaps as blockers to final completeness; never replace unknown with zero."
