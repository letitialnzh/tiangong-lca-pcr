    - unit_id: "normative_49866"
      family: "allocation"
      span:
        start:
          offset: 49866
          line: 637
          column: 1
        end:
          offset: 51885
          line: 647
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\nAvoid allocation where batch records can partition burdens by species, hatchery batch, nursery unit, grow-out unit, fattening unit, harvest lot, size grade, sex or maturity class, product form, live/fresh/chilled state, or destination. Separate live, fresh, chilled, soft-shell, fattened, off-grade, and delivery products by measured mass before applying allocation.\n\nWhen a single foreground batch produces several saleable grades within CPC 04312, first subdivide directly attributable activities. Allocate remaining common burdens by a documented causal physical relationship; product mass is usable only when that relation is supported. Otherwise use comparable actual gate revenue with disclosed price period and sensitivity, or retain unresolved allocation when neither relationship is evidenced. Shells, molts, mortalities, wastewater, sludge, feed residue, packaging rejects, and dead product are waste or treatment outputs unless they are sold with a separate product dataset and reference flow.\n\nIf the same site grows multiple species or products in the same pond, pen, cage, box, RAS, tank, vehicle, vessel, or packhouse route, allocate shared energy, water, feed preparation, oxygenation, filtration, labour service, and maintenance records by measured subprocess use, culture unit, biomass-time, area-time, or product mass in that order of preference. The selected allocation basis must be disclosed.\n\nThis PCR explicitly adopts the allocation hierarchy in GHG Protocol Product Standard chapter 9: subdivision first, then evidenced causal physical relationships, and evidenced economic relationships where physical relationships are inapplicable. Mass is not an automatic convenience default. Preserve unallocated physical quantities and a separately labelled once-only LCA view; reconcile all output/node shares to one. Allocation never repairs physical imbalance, and internal transfers create no sale or substitution credit. Source: `ghg-product-allocation`.\n\n"
