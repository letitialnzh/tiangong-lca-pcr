      requirement: "Preserve original batch/per-1000-kg records, life-stage yields, opening/closing stocks and failed events; attribute once and normalize by the same actual final-gate Q. Measure external abstraction, supplied water, internal circulation and actual return/discharge separately; never deduct internal circulation twice. Net nutrient increment/retention is a separate balance diagnostic, never automatically a negative elementary flow or avoided burden. Actual freight payload includes carrier water, ice and packaging; empty returns retain actual fuel/vehicle service and explicit attribution. A complete service and its covered materials, energy, assets, wastes and direct releases cannot both be counted."
      evidence: "Own-node records, same-lot water/animal/substance balances, service scope, actual load and duty"
validation_rules:
  - rule_id: val_reference_flow_uuid
    applies_to: "applicable dataset and actual exchanges"
    rule: "Before dataset completion verify one UUID matching actual species, farmed origin, stage, product state/form, property and final physical gate. A category-name match does not establish state/gate compatibility; live farm-gate flow cannot substitute chilled delivered product, nor landing-catch flow controlled aquaculture output."
    source_ids: []
  - rule_id: val_reference_unit
    applies_to: "applicable dataset and actual exchanges"
    rule: "The reference amount must be expressed as kg with Mass 93a60a56-a3c8-11da-a746-0800200b9a66 and Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66."
    source_ids: []
  - rule_id: val_farmed_not_wild
    applies_to: "applicable dataset and actual exchanges"
    rule: "A dataset based only on wild capture, wild landing, or post-capture live holding without controlled aquaculture production is non-conforming."
    source_ids: []
  - rule_id: val_adjacent_lobster_categories
    applies_to: "applicable dataset and actual exchanges"
