  calculation_rules:
    - id: calc_reference_product_mass
      applies_to: "reference product"
      rule: "Q is independently measured same-lot positive accepted net animal mass at gate_release; reconcile gross, tare, free water/ice, rejects and losses once, never deduct rejects again from an already accepted mass."
      inputs:
        - cp_gate_release
      output: "kg reference product"
      source_ids:
        - pcr-gate-accounting-method
    - id: calc_count_to_mass
      applies_to: "count-based records"
      rule: "mass = count x measured mean individual mass, or count / measured count per kg; retain sampling method and grade"
      inputs:
        - cp_biological_stocking_records
        - cp_harvest_and_product_mass_records_growout_and_burrow_husbandry
        - cp_harvest_and_product_mass_records_harvest_live_holding_chilling_and_packout
      output: "kg equivalent mass"
      source_ids:
        - mass-balance-identity
    - id: calc_stock_acceptance_and_survival
      applies_to: "biological stock and grow-out"
      rule: "accepted or surviving fraction = accepted or surviving count or biomass divided by input count or biomass for the same life stage and batch"
      inputs:
        - cp_biological_stocking_records
        - cp_mortality_molt_residue_and_sludge_records_broodstock_hatchery_nursery_and_stocking
        - cp_mortality_molt_residue_and_sludge_records_growout_and_burrow_husbandry
        - cp_mortality_molt_residue_and_sludge_records_harvest_live_holding_chilling_and_packout
        - cp_mortality_molt_residue_and_sludge_records_delivery_to_declared_gate
        - cp_harvest_and_product_mass_records_growout_and_burrow_husbandry
        - cp_harvest_and_product_mass_records_harvest_live_holding_chilling_and_packout
      output: "accepted stock, survival, loss, and residue indicators"
      source_ids:
        - nephrops-hatchery-handbook-2015
    - id: calc_waterborne_load
      applies_to: "discharge and direct releases"
      rule: "For each substance and actual receiving medium calculate gross discharged substance mass from matched measured external discharge and representative concentration, retaining unit conversion, detection limits and sampling uncertainty. Use separate cards for different substances or media. Disclose background/influent concentration and net changes separately; a negative net balance is not a negative emission or an uptake credit."
      inputs:
        - cp_water_temperature_salinity_and_discharge_records_broodstock_hatchery_nursery_and_stocking
        - cp_water_temperature_salinity_and_discharge_records_growout_and_burrow_husbandry
        - cp_water_temperature_salinity_and_discharge_records_harvest_live_holding_chilling_and_packout
        - cp_water_temperature_salinity_and_discharge_records_delivery_to_declared_gate
      output: "kg nutrient, solids, treatment residue, or other load"
      source_ids:
        - asc-farm-standard-2025
    - id: calc_energy_allocation
      applies_to: "shared energy systems"
      rule: "allocate direct meters first; otherwise allocate by equipment hours, batch duration, water volume, compartment occupancy, or product mass with the selected key disclosed"
      inputs:
        - cp_energy_and_fuel_records_broodstock_hatchery_nursery_and_stocking
        - cp_energy_and_fuel_records_growout_and_burrow_husbandry
        - cp_energy_and_fuel_records_harvest_live_holding_chilling_and_packout
        - cp_energy_and_fuel_records_delivery_to_declared_gate
        - cp_harvest_and_product_mass_records_growout_and_burrow_husbandry
        - cp_harvest_and_product_mass_records_harvest_live_holding_chilling_and_packout
      output: "kWh, MJ, or fuel per reference flow"
      source_ids:
        - asc-farm-standard-2025
    - id: calc_delivery_transport_service
      applies_to: "delivery"
      rule: "For each actual route leg, multiply the mass in tonnes of the consignment actually carried by that leg distance in km, then normalize to matched final reference-product output. The load includes carrier water, ice and packaging actually transported and is not the net reference-product mass. For shared loads use a justified mass, occupied-volume or other causal attribution key. Record empty-return, cooling, oxygenation and holding coverage; zero payload on an empty return does not imply zero transport burden. Do not double-count a transport service that covers the same fuel/direct emissions already modelled explicitly."
      inputs:
        - cp_delivery_and_route_records
      output: "tonne-km or direct delivery inventory per reference flow"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_species_and_category_identity
      applies_to: "all datasets"
      requirement: "Dataset must identify Nephrops norvegicus and show that the reference product belongs to CPC 04342, not wild Norway lobster, Homarus lobster, rock lobster, sea crawfish, or processed Norway lobster categories."
      evidence: "species records, classification mapping, product description, sales record"
    - id: dq_farmed_proof
      applies_to: "all datasets"
      requirement: "Dataset must prove controlled aquaculture production through hatchery, nursery, grow-out, sediment-substrate, compartment, recirculating, or enhancement records."
      evidence: "stocking log, hatchery record, grow-out record, permit, production plan"
    - id: dq_mass_balance
      applies_to: "biological stock, harvest, reference product"
      requirement: "Biological input, mortality, cull, residue, harvest, packed, and delivered product records must reconcile at batch or reporting-period level."
      evidence: "batch reconciliation, scale tickets, mortality logs, packing records"
    - id: dq_water_and_energy_completeness
      applies_to: "water, discharge, energy, fuel"
      requirement: "Water, temperature, salinity, discharge, electricity, fuel, oxygenation, and temperature-control records must cover all foreground processes in scope."
      evidence: "meter logs, invoices, monitoring records, allocation worksheet"
    - id: dq_substrate_and_shelter_traceability
      applies_to: "grow-out systems"
      requirement: "Sediment, artificial burrow, shelter, tank, and compartment records must retain material, density, cleaning, replacement, and fate."
      evidence: "culture-unit map, substrate log, cleaning log, disposal record"
    - id: dq_treatment_and_biosecurity_traceability
      applies_to: "health and treatment inputs"
      requirement: "Treatments, disinfectants, anesthetics, oxygen, salt, and water-quality inputs must retain purpose, active ingredient where applicable, legal status, and harvest eligibility consequence."
      evidence: "treatment log, health plan, veterinary record"
    - id: dq_live_product_handling
      applies_to: "final product and delivery"
      requirement: "Live holding, chilling, packaging, delivery duration, and mortality or rejection must be traceable to the final product lot."
      evidence: "live tank log, pack-out record, delivery receipt"
    - id: dq_unresolved_uuid_disclosure
      applies_to: "any row with site-specific flow selection"
      requirement: "Any blank or generic flow identity must be disclosed before reviewed publication and replaced with selected Tiangong UUIDs where available."
      evidence: "manifest review metadata, UUID review record"
    - id: collect_biological_stock_input
      applies_to: "broodstock_hatchery_nursery_and_stocking"
      requirement: "Establish the actual substance/species, life stage, form, state, source and destination of each exchange in this scope and add independent atomic cards. Determine direction and product/waste/elementary type from real source/fate; this scope supplies no universal UUID or mixed total. Retain each own native quantity/unit, collection or calculation evidence, range/uncertainty evidence, attribution and division by the same final Q. Never copy a collection total, common range or one member UUID onto other members. Every actual major feed, input, waste, release and internal handoff is mandatory; unknown is not zero. Preserve raw batch/per-1000-kg records and explicit q/Q and 1000×q/Q conversion. Mixed-substance/unit screening numbers are not member ranges; mass ratios across life stages or biological growth are not a universal 0..1 survival fraction. Collection responsibility: Broodstock, berried females, eggs, larvae, postlarvae, or juveniles . This row records purchased, wild-sourced, or internally produced biological stock entering the declared farmed Nephrops route. <br> - Flow property / unit: Mass or count with life stage / kg, item, egg count, larval count, or juvenile count <br> - Amount rule: measured count, mass where measurable, life stage, and accepted quantity entering hatchery, nursery, grow-out, or controlled enhancement culture <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1,000 kg marketable reference product <br> - Basis kind: Process output (process_output) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_biological_stocking_records <br> - Sources: nephrops-hatchery-handbook-2015, fao-nephrops-synopsis-1975, asc-farm-standard-2025"
      evidence: "Own-node original records, independent identity, quantity, fate and range evidence"
