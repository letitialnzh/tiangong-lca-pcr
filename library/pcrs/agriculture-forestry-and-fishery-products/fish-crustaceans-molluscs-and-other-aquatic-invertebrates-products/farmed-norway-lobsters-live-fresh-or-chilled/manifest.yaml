  unresolved_identity:
    - Reference product and adjacent wild Norway lobster UUIDs were checked with
      the sibling TianGong CLI. Nephrops-specific broodstock, eggs, larvae,
      postlarvae, juveniles, burrow substrate, shelters, culls, molts, shells,
      mortalities, oxygen, ice, wastewater, biofilter solids, treatment
      chemicals, and site-specific aquaculture residue flow identities remain
      unresolved until foreground site scope and Tiangong rows are selected.
    - Exact reference and non-UUID inventory identities remain unresolved.
      Previously considered generic feed, process-water, sludge, packaging and
      category-product identities do not verify actual species, material, state
      or physical gate and are not executable bindings.
    - Wild Norway lobsters under CPC 04341, processed Norway lobsters under CPC
      21254, Homarus lobsters, rock lobster and other sea crawfish, and generic
      crustacean products must remain separate PCR categories unless explicitly
      modelled as co-products or inputs.
  unresolved_range_evidence:
    - Inventory ranges are broad candidate QA screening estimates unless linked
      to source-backed evidence; replace with reviewed Nephrops hatchery,
      nursery, grow-out, live-holding, and delivery records before active
      publication.
