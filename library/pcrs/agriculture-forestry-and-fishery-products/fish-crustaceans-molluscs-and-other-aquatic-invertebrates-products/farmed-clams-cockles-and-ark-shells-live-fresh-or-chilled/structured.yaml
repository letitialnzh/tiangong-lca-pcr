      family: "system_boundary"
      span:
        start:
          offset: 5892
          line: 61
          column: 1
        end:
          offset: 8447
          line: 82
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Clam seed (spat) at the grow-out farm gate, ready for stocking; hatchery, nursery or natural seed collection that produced the seed is upstream of the foreground boundary |\n| starting_condition_role | boundary_start |\n| product_classification_scope | CPC 3.0 code 04452, farmed clams, cockles and ark shells, live, fresh or chilled |\n| recursive_input_rule | Seed needs an upstream dataset for its actual hatchery/nursery or wild-collection route, not this adult grow-out PCR. Same-category clam receipts may use an upstream grow-out dataset only where boundary/stage genuinely match. Reconcile internal transfers versus purchases and carry accrued burdens once without recursive expansion of the same stage. |\n| upstream_dataset_requirement | Seed supply, fertilizers, lime, electricity, diesel, gear materials, process water and ice are supplied by supplier-specific foreground datasets or by secondary background datasets |\n| disclosure | The data package declares culture system, site and water body, stocking density and cycle length, fertilization and pond preparation practice, harvesting method, depuration practice, survival rate, allocation keys and cut-off choices |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `sb_starting_condition` | foreground system boundary | The foreground boundary starts at clam seed delivered to the grow-out farm; seed production burdens enter only through the upstream dataset of the seed input flow. | `fao-cultured-aquatic-species-ruditapes-philippinarum` |\n| `sb_recursive_input` | same-category inputs | Seed requires an upstream dataset for its actual hatchery/nursery or wild-collection route, not this adult grow-out PCR masquerading as seed methodology. Same-category clam receipts may use an upstream grow-out dataset only where boundary/stage genuinely match; reconcile internal transfers versus purchases, carrying accrued burdens without recursive expansion or modelling the same stage twice. |  |\n| `sb_cut_off` | all foreground inputs, outputs and emissions | Justify any cut-off against the declared study goal using mass, energy and potential environmental relevance, documenting cumulative omissions and sensitivity. Low mass alone does not justify removing chemicals, pollutants or waste. Attribute long-lived gear using evidenced service life, use and replacement; annualization requires a matched reporting period and output. |  |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 315
              line: 10
              column: 1
            end:
              offset: 386
              line: 10
              column: 72
          text: "# Farmed in-shell clams, cockles and ark shells, live, fresh or chilled"
          depth: 1
        - kind: "heading"
