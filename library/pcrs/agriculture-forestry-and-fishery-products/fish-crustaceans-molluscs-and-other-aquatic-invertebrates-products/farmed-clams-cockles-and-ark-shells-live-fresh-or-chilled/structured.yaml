      applies_to: "harvesting; harvested_clams"
      requirement: "The following broad screen concerns only its declared raw stage intensity/ratio with a matched measured stage denominator, not the exchange amount per kg final reference. Final-reference conversion requires actual stage/final outputs; no default yield or empirical-limit claim is allowed: Range: Harvest recovery over marketable stock guardrail; Range role: QA guardrail (qa_guardrail); Lower: 0.8; Upper: 1; Unit: kg; Basis: kg harvested live clams landed per kg marketable live clams transferred from grow-out; Basis kind: Process output (process_output); Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "matched stage/final outputs, measurement, range and uncertainty evidence"
    - id: dq_stage_ratio_harvest_suspended_solids
      applies_to: "harvesting; harvest_suspended_solids"
      requirement: "The following broad screen concerns only its declared raw stage intensity/ratio with a matched measured stage denominator, not the exchange amount per kg final reference. Final-reference conversion requires actual stage/final outputs; no default yield or empirical-limit claim is allowed: Range: Harvest sediment disturbance screening estimate; Range role: QA guardrail (qa_guardrail); Lower: 0; Upper: 5; Unit: kg; Basis: kg suspended solids per kg harvested live clams landed; Basis kind: Process output (process_output); Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "matched stage/final outputs, measurement, range and uncertainty evidence"
    - id: dq_reporting_basis_and_ranges
      applies_to: "all exchanges, stage intensities and co-products"
      requirement: "Final reference output is fixed at 1 kg with denominator Q, the matched cohort/period measured accepted net mass at landing handover. Preserve other exchanges as their own original physical quantities reported using Q; do not multiply internal animal/co-product mass by an allocation share and present it as physical quantity. Attribute/allocate shared LCA burdens separately from unallocated physical ledgers and once only. Numerical screens are reasoned_estimate on their declared basis, not model defaults, empirical distributions or mandatory cut-offs; stage screens need their actual stage denominator, not direct application to amounts per kg final output. Each concrete new flow needs independent measured range/uncertainty evidence, not inherited family bounds."
      evidence: "original physical ledgers, final accepted Q, stage outputs, measurements/allocation and range evidence"
    - id: dq_route_completeness
      applies_to: "actual route at every node"
      requirement: "Reconcile direct natural abstraction versus supplied water, seabed/water-area occupation and changes, all actual fuels/electricity, chemicals/fertilizers, maintenance/cleaning, containers/packaging, facility materials/replacement, air substances, discharge/external treatment, sediment/biomass changes and fate. Materialize independently identified actual applicable exchanges with sources, quantity, native unit, basis and uncertainty. Listing diesel/CO2 does not establish absence of other fuels or pollutants. The FAO Manila-clam route does not prove all cockle/ark-shell or suspended grow-out systems; each actual species/technology requires applicability evidence. Unverified gaps block final completeness, never become zero."
      evidence: "per-node coverage ledger, actual site records and method-applicability evidence"
validation_rules:
  - rule_id: vr_reference_flow_identity
    applies_to: "reference flow definition"
    rule: "The data package reference flow carries the product flow, flow property and unit group UUIDs declared in section 3, with reference amount 1 and unit kg."
    source_ids: []
  - rule_id: vr_required_qualifiers
    applies_to: "dataset metadata and reference flow comment"
    rule: "Every required qualifier in section 3 is declared; a data package with a missing qualifier fails validation."
    source_ids: []
  - rule_id: vr_mass_closure
    applies_to: "harvest and handling mass balance"
    rule: "Retain the measurements, same-basis balance, residual and uncertainty required by cr_harvest_mass_closure, with investigation and disposition of unexplained terms. A percentage screen alone does not establish closure."
    source_ids: []
  - rule_id: vr_unit_consistency
    applies_to: "inventory rows"
    rule: "Amounts use the units declared in the flow rows and section 4; electricity is stored consistently in kWh or MJ with the conversion documented."
    source_ids: []
  - rule_id: vr_range_conformance
    applies_to: "collected foreground amounts"
    rule: "Verify original records and uncertainty for each QA flag, distinguishing a genuine extreme from an evidenced error; never truncate or replace true observations to fit a broad screen. Where no numeric interval is supplied, provide independent measurement uncertainty/representativeness evidence rather than an invented upper limit."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Final data-package validation must read back dq_atomic_completion and every dq_complete_ requirement. Every applicable obligation must have concrete exchanges with independent quantities, units, sources, normalization, range/uncertainty, fate and verified UUIDs. Use not_applicable only for evidenced absence. Unknown identities, missing quantities, unclassified fates or unfulfilled obligations block final data-package completion. Static PCR checking is not a substitute for this validation."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_product_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Life cycle modelling of farmed clams, cockles and ark shells supplied live, fresh or chilled; upstream dataset for same-category transfers between farms under this PCR"
  excluded_use: "Representing wild-caught products; representing processed, frozen or preserved clam products; use outside the declared culture system, region and cycle without remodelling"
  required_metadata: "required qualifiers of section 3; data quality disclosures of section 8; allocation keys; cut-off disclosures"
  required_quality_disclosure: "measurement basis, temporal coverage, completeness against the process map, and guardrail range flags"
  update_trigger: "new production cycle data; change of culture system, fertilization or depuration practice; correction of a referenced Tiangong UUID; methodological update of this PCR"
