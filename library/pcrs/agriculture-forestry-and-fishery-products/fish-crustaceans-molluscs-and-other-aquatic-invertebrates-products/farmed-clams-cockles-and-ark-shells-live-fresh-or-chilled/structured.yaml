measurement_rules:
  - id: reference_mass
    applies_to: "reference product flow"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "The reference is drained net in-shell mass in the actual declared live/fresh/chilled state; counts/crates need measured conversion and tare evidence matched to species, grade and lot."
  - id: live_weight_state
    applies_to: "product and biomass quantities"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record drained net in-shell mass in the actual state; distinguish live, fresh, chilled, dead, seed and shell-waste states, life stages and moisture bases. Dead stock is not live weight. Do not substitute meat-only yield for in-shell mass; state conversions require matched measurements."
  - id: electricity_energy
    applies_to: "electricity inputs"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "kWh"
    rule: "Electricity is collected in kWh from meters or utility bills; when the host dataset stores electricity on an energy basis, 1 kWh is converted to 3.6 MJ."
  - id: water_volume
    applies_to: "process water inputs"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Record external supply, direct abstraction and discharge volume separately for each actual water source; internal recirculation is not another external exchange. Convert mass/volume only with measured or evidenced density for actual temperature, salinity and water quality, not an assumed 1,000 kg/m3. Match emission concentration and volume by period, sampling point and unit."
  - id: seed_dual_record
    applies_to: "clam seed input"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Clam seed is recorded both as stocked mass in kg and as seed count with size grade, so that survival and growth can be reconciled."
