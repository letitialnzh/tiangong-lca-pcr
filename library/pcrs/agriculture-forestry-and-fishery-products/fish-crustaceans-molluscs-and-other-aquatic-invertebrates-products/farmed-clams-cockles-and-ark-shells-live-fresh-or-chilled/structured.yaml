  calculation_rules:
    - id: cr_output_normalization
      applies_to: "all foreground inventory rows"
      rule: "amount_per_kg = recorded_cycle_amount / dispatched_reference_product_kg"
      inputs:
        - "recorded cycle amounts"
        - "dispatched reference product mass"
      output: "inventory amount normalized to 1 kg reference product"
      source_ids: []
    - id: cr_electricity_unit_conversion
      applies_to: "electricity rows"
      rule: "electricity_MJ = electricity_kWh x 3.6"
      inputs:
        - "metered electricity in kWh"
      output: "electricity amount on an energy basis where the dataset requires it"
      source_ids: []
    - id: cr_nutrient_balance
      applies_to: "complete N/P balance indicator, not an elementary exchange"
      rule: "Reconcile fertilizer, incoming/outgoing water, stocked seed, harvest, mortality/waste, opening/closing biomass and sediment stocks and other identified N/P pathways on matched-period elemental-mass bases; report closure residuals and uncertainty. Net retention/removal is a boundary-specific balance indicator, not a substitute for measured discharge, evidence of receiving medium, or a negative elementary emission/avoided burden. Unknown pathways are not zero."
      inputs:
        - "fertilizer records"
        - "influent water nutrient tests"
        - "harvested biomass nutrient tests"
      output: "separately reported N/P balance, closure residual and evidence gaps"
      source_ids: []
    - id: cr_harvest_mass_closure
      applies_to: "harvest, holding and handover"
      rule: "On consistent in-shell product-mass bases reconcile opening stock and actual harvested receipts against accepted dispatch, other useful outputs, mortality/rejects, closing stock and evidenced physical mass changes. Deduct ice, carrier water and packaging tare once only from gross weights that include them. Explain closure residuals using actual measurement uncertainty; an unsupported fixed tolerance cannot make unknown losses acceptable."
      inputs:
        - "opening/closing stock"
        - harvest
        - dispatch
        - other-output
        - "reject and mass-basis records"
      output: "product-mass balance with residual and uncertainty"
      source_ids: []
    - id: cr_gross_discharge_load
      applies_to: "controlled-discharge N, P and suspended-solids cards"
      rule: "For each matched interval multiply measured discharge volume by the corresponding indicator concentration with explicit unit conversion; sum actual interval loads and report using declared origin attribution/shared allocation and final accepted product mass. Retain influent background, detection limits and errors; a negative system net balance does not produce a negative emission."
      inputs:
        - cp_gross_discharge_sampling
        - "actual unit conversions"
        - "origin and allocation records"
        - "final accepted mass"
      output: "controlled-discharge gross indicator load and uncertainty per 1 kg reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all concrete exchanges"
      requirement: "Confirm each physical/chemical identity, species/stage, actual state, supply/handover gate, receiving medium and compatible property/unit. A matching name does not prove UUID compatibility; explicitly track and resolve unknown identities before final dataset completion."
      evidence: "per-flow identity and measurement evidence"
    - id: dq_measurement
      applies_to: "collected foreground amounts"
      requirement: "Amounts derive from calibrated meters, scales, invoices or laboratory analyses; any estimation method is declared."
      evidence: "calibration records; invoices; laboratory certificates"
    - id: dq_temporal_coverage
      applies_to: "foreground dataset"
      requirement: "Records cover at least one full grow-out production cycle including its harvest and handling season."
      evidence: "stocking, harvest and dispatch logs spanning the cycle"
    - id: dq_completeness
      applies_to: "process inventory"
      requirement: "Every required process and flow row is populated or explicitly justified as not applicable to the declared route."
      evidence: "completeness checklist against the process map"
    - id: dq_disclosure
      applies_to: "dataset metadata"
      requirement: "Culture system, site, fertilization practice, depuration practice, survival rate, allocation keys and cut-off choices are disclosed."
      evidence: "dataset metadata fields"
    - id: dq_waterborne_pathways
      applies_to: "all waterborne loads and open-water pathways"
      requirement: "Separate controlled discharge, open-water diffuse pathways, natural background, intake and actually evidenced uptake/retention. Use separate monitoring or an applicable process model with coefficient evidence for each substance/medium; a net N/P system balance does not identify released species, media or pathways automatically. Unknown is not zero or a credit; origin/pathway gaps block final data-package completion. Do not double-count indicator totals and individually inventoried constituents for the same mass."
      evidence: "outlet/water-body records, matched sampling, species/pathway evidence, model applicability, coefficient sources and uncertainty"
    - id: dq_atomic_completion
      applies_to: "every process and inventory-completion obligation"
      requirement: "These are mandatory per-identity collection obligations, not exchanges, default inputs or emissions. Create separate cards and independent measurements for each actual substance, product, waste stream, emitted substance and receiving medium; retain native units, original batch/stage output, final-gate reference output, attribution/allocation and range/uncertainty evidence. Normalize original totals using matched final output; stage-normalized data require measured stage output to recover the numerator, never an assumption that stage and final output coincide. Do not copy a family total, mixed-unit range, default estimate or one UUID onto children. Unknown is not zero. Purchased materials are product inputs; only direct natural-resource abstraction is an elementary input. Determine the direction/type of mortality/managed waste, direct releases and useful co-products separately from actual fate."
      evidence: "per-flow coverage ledger, measurements/sampling, allocation, original/final outputs, identity and fate records"
    - id: dq_complete_nitrogen_fertilizer
      applies_to: "grow_out_culture; Nitrogen fertilizer applied for pond fertilization"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: Nitrogen fertilizer such as urea is recorded when pond fertilization is practised to sustain phytoplankton. The quantity is obtained from purchase invoices and field application logs. ; Flow property / unit: Mass / kg ; Amount rule: applied fertilizer mass per production cycle ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per kg marketable live clams transferred to harvest ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_fertilizer_records ; Range: Fertilizer nitrogen intensity guardrail ; Range role: QA guardrail (qa_guardrail) ; Lower: 0 ; Upper: 0.05 ; Unit: kg ; Basis: kg nitrogen fertilizer per kg marketable live clams transferred to harvest ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "actual records, independent identities and quantities, range/uncertainty evidence"
    - id: dq_complete_gear_plastics
      applies_to: "grow_out_culture; Plastic gear materials consumed"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: Nets, mesh bags, ropes and other plastic culture gear are consumed over their service life. The quantity is obtained from stock records and replacement logs annualized per cycle. ; Flow property / unit: Mass / kg ; Amount rule: annualized consumption of plastic gear per production cycle ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per kg marketable live clams transferred to harvest ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_material_consumption_records ; Range: Plastic gear consumption guardrail ; Range role: QA guardrail (qa_guardrail) ; Lower: 0 ; Upper: 0.05 ; Unit: kg ; Basis: kg plastic gear per kg marketable live clams transferred to harvest ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "actual records, independent identities and quantities, range/uncertainty evidence"
    - id: dq_complete_culture_gear_waste
      applies_to: "grow_out_culture; End-of-life plastic culture gear"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: Worn-out nets, ropes and other plastic gear leave the process as waste at replacement. The quantity is obtained from waste transfer notes or weighed disposal records. ; Flow property / unit: Mass / kg ; Amount rule: disposed plastic gear mass per production cycle ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per kg marketable live clams transferred to harvest ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_waste_records ; Range: Plastic gear waste guardrail ; Range role: QA guardrail (qa_guardrail) ; Lower: 0 ; Upper: 0.05 ; Unit: kg ; Basis: kg plastic waste per kg marketable live clams transferred to harvest ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate)"
      evidence: "actual records, independent identities and quantities, range/uncertainty evidence"
    - id: dq_complete_mortality_shell_residue
      applies_to: "grow_out_culture; Dead stock and shell residues"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: Clams that die during grow-out and their shell residues are collected or returned to the culture bottom. The quantity is estimated from periodic mortality inspections. ; Flow property / unit: Mass / kg ; Amount rule: estimated dead stock mass per production cycle ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per kg marketable live clams transferred to harvest ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_mortality_records ; Range: Mortality residue guardrail ; Range role: QA guardrail (qa_guardrail) ; Lower: 0 ; Upper: 0.5 ; Unit: kg ; Basis: kg dead stock per kg marketable live clams transferred to harvest ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate) Retain separate mortality/shell state, wet/dry basis and actual fate. Biomass remaining in sediment is not automatically a waste transfer across the system boundary or a quantified elemental emission; relevant releases need evidenced decomposition/release models or monitoring. Unknown is not zero."
      evidence: "actual records, independent identities and quantities, range/uncertainty evidence"
    - id: dq_complete_undersized_bycatch_return
      applies_to: "harvesting; Undersized clams and incidental by-catch returned to the water"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: Record actual state and fate of undersized clams and incidental organisms sorted at harvest. The quantity is estimated from sorting records at landing. ; Flow property / unit: Mass / kg ; Amount rule: estimated returned mass per production cycle ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per kg harvested live clams landed ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_harvest_yield_records_harvest ; Range: Returned undersized and by-catch guardrail ; Range role: QA guardrail (qa_guardrail) ; Lower: 0 ; Upper: 0.3 ; Unit: kg ; Basis: kg returned per kg harvested live clams landed ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate) Record actual fate separately by species/state. Live retained/returned stock is not waste and creates no automatic negative resource input or avoided-emission credit. Verify mortality/disposal, saleable co-products and environmental release separately; not every undersized or incidental organism is assumed returned."
      evidence: "actual records, independent identities and quantities, range/uncertainty evidence"
    - id: dq_complete_process_water
      applies_to: "landing_site_handling; Process water for washing and depuration"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: Clean water for washing and depuration crosses the boundary at the landing facility; seawater may substitute tap water and is recorded as water volume with the source declared. The quantity is obtained from water meters or pumping records. ; Flow property / unit: Volume / m3 ; Amount rule: metered water volume per handling season ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per kg dispatched live, fresh or chilled clams ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_water_records ; Range: Process water intensity guardrail ; Range role: QA guardrail (qa_guardrail) ; Lower: 0 ; Upper: 0.05 ; Unit: m3 ; Basis: m3 per kg dispatched live, fresh or chilled clams ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate) Distinguish externally supplied product water, this facility’s direct natural-resource abstraction and internal recirculation for each actual source. Create independently identified native-property/unit cards for actual sea water, freshwater or groundwater abstraction, using meter records and matched temperature/salinity/density when converting mass/volume. Record actual discharge/treatment fate. Fresh/sea water use requires site/species suitability, not assumed interchangeability."
      evidence: "actual records, independent identities and quantities, range/uncertainty evidence"
    - id: dq_complete_grading_rejects
      applies_to: "landing_site_handling; Dead or broken clams rejected at grading"
      requirement: "Fulfil these collection responsibilities separately for each actual constituent; family screening bounds are not child defaults or automatic cut-offs: Record actual use, state and fate of grading rejects. The quantity is obtained from grading line records. ; Flow property / unit: Mass / kg ; Amount rule: rejected mass per handling season ; Value mode: Foreground record (foreground_record) ; Specificity: Site-specific (site_specific) ; Normalization basis: per kg dispatched live, fresh or chilled clams ; Basis kind: Process output (process_output) ; Evidence kind: Collected record (collected_record) ; Collection protocol: cp_reject_records ; Range: Grading reject guardrail ; Range role: QA guardrail (qa_guardrail) ; Lower: 0 ; Upper: 0.15 ; Unit: kg ; Basis: kg rejects per kg dispatched live, fresh or chilled clams ; Basis kind: Process output (process_output) ; Evidence kind: Reasoned estimate (reasoned_estimate) Distinguish saleable downgraded product, retained/returned stock, dead organic waste and shells by actual use and fate, not the word reject. Actual waste needs receiving/treatment evidence; do not count whole-animal mass and its contained shells twice."
      evidence: "actual records, independent identities and quantities, range/uncertainty evidence"
    - id: dq_stage_ratio_clam_seed
      applies_to: "grow_out_culture; clam_seed"
      requirement: "The following broad screen concerns only its declared raw stage intensity/ratio with a matched measured stage denominator, not the exchange amount per kg final reference. Final-reference conversion requires actual stage/final outputs; no default yield or empirical-limit claim is allowed: Range: Seed stocking intensity guardrail; Range role: QA guardrail (qa_guardrail); Lower: 0.02; Upper: 0.6; Unit: kg; Basis: kg stocked seed per kg marketable live clams transferred to harvest; Basis kind: Process output (process_output); Evidence kind: Reasoned estimate (reasoned_estimate)"
