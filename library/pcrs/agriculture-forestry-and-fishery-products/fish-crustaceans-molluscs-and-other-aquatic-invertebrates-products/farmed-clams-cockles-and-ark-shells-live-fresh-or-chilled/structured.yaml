allocation_rules:
  - rule_id: al_shell_part_of_product
    applies_to: "reference product"
    rule: "Shells are part of the live in-shell reference product; no allocation between meat and shell is performed."
    source_ids: []
  - rule_id: al_polyculture_shared_inputs
    applies_to: "shared multi-species inputs"
    rule: "First avoid allocation through separable processes and direct measurement. For inseparable shared quantities use an evidenced physical/causal relationship; if none is applicable or can be established, justify an economic or other relationship. Disclose all co-products, periods, prices/physical drivers, keys and sensitivity; economic allocation is not an unconditional default."
    source_ids:
      - iso-14044-2006
  - rule_id: al_mortality_no_coproduct
    applies_to: "mortality, rejects, retained stock and live returns"
    rule: "Distinguish useful co-products, retained/returned stock, managed waste and environmental releases by actual use and fate; do not assume all rejects or undersized live animals have no value. Waste is not allocated as a useful product, but its collection, treatment and disposal remain covered. Release or sediment retention does not automatically create avoided-burden/removal credit."
    source_ids: []
