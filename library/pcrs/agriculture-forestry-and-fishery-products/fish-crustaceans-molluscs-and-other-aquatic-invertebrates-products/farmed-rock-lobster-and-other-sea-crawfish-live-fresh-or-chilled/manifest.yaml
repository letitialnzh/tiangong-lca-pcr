      Farmed rock lobster and other sea crawfish, live, fresh or chilled
      `5ec1e534-2b3b-4ef7-a934-15d67185b9c7`."
    - Searches for rock lobster seed, spiny lobster, and puerulus did not
      resolve a usable Tiangong biological seed flow; biological starting
      condition rows therefore retain descriptive site-specific identities.
    - Wild rock lobster and other sea crawfish, Homarus lobster, Norway lobster,
      and frozen, salted, dried, cooked, canned, or otherwise processed
      crustacean products are adjacent categories and must not substitute for
      this reference product.
