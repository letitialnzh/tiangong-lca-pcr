  calculation_rules:
    - id: calc_reference_product_mass
      applies_to: "reference product"
      rule: "Q is the independently measured positive accepted net animal mass of the same lot and actual product state at declared_gate_release, collected under cp_final_gate_acceptance. From a gross weighing, deduct only measured tare, free water/ice and rejects or losses actually included in that weighing, once. Never deduct rejects or mortalities again from already accepted net mass. Reconcile earlier pack-out, delivery, other intended outputs, losses and stocks separately; do not substitute an intermediate acceptable mass for final Q."
      inputs:
        - cp_harvest_and_product_mass_records_growout_and_husbandry
        - cp_harvest_and_product_mass_records_harvest_live_holding_chilling_and_packout
        - cp_packaging_live_holding_and_chilling_records_harvest_live_holding_chilling_and_packout
        - "cp_delivery_and_route_records_delivery_to_declared_gate when delivery is included"
        - cp_final_gate_acceptance
      output: "kg reference product"
      source_ids: []
    - id: calc_count_to_mass
      applies_to: "count-based records"
      rule: "mass = count x measured mean individual mass, or count / measured count per kg; retain sampling method and grade"
      inputs:
        - cp_biological_stocking_records_biological_stock_hatchery_nursery_and_stocking
        - cp_harvest_and_product_mass_records_growout_and_husbandry
        - cp_harvest_and_product_mass_records_harvest_live_holding_chilling_and_packout
      output: "kg equivalent mass"
      source_ids: []
    - id: calc_stock_acceptance_and_survival
      applies_to: "biological stock and grow-out"
      rule: "accepted or surviving fraction = accepted or surviving count or biomass divided by input count or biomass for the same life stage and batch"
      inputs:
        - cp_biological_stocking_records_biological_stock_hatchery_nursery_and_stocking
        - cp_mortality_molt_residue_and_sludge_records_biological_stock_hatchery_nursery_and_stocking
        - cp_mortality_molt_residue_and_sludge_records_growout_and_husbandry
