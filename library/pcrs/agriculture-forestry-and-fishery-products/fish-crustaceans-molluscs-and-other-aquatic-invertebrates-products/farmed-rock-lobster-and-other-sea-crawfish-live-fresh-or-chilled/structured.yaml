      requirement: "Collect every actual exchange for the collection responsibility “Delivery mortalities, rejected product, and transport residue”, retaining these real raw quantity, batch/stage, native-unit, fate, collection and range-evidence obligations: This row records the selected exchange within the declared process and system boundary. Flow property / unit: Mass, volume, or count / kg, m3, or item Amount rule: measured delivery loss, mortality count, reject mass, residue amount, and disposal or recovery route Value mode: Foreground record (foreground_record) Specificity: Route-specific (route_specific) Normalization basis: per delivered 1,000 kg reference product Basis kind: Transport service (transport_service) Evidence kind: Collected record (collected_record) Collection protocol: cp_delivery_and_route_records_delivery_to_declared_gate Every actual substance, fuel, material, waste, emission and service requires its own concrete identity card and independent measurement. Generated wastes/emissions are outputs, not inputs; escaped organisms remain separate from mortality/sludge. Convert original per-1000-kg/stage and batch bases explicitly to the sole final gate under calc_final_gate_normalization. No grouped UUID, total or Range is inherited; grouped bounds are not child allowed ranges. Any unresolved actual child’s independent Range evidence, quantity, fate or UUID makes the final dataset incomplete and fails validation; unknown is not zero."
