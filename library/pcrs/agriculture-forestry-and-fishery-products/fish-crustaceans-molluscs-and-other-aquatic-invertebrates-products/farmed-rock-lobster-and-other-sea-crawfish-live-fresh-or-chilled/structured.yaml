measurement_rules:
  - id: final_gate_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual native exchange property"
      uuid: ""
    required_unit: "native unit per 1 kg final reference"
    rule: "Attribute raw batch/event quantities by actual ownership and allocation, then divide by positive accepted net kg at declared_gate_release; divide same-boundary per-1000-kg-final-product values by 1000. Stage-output denominators require measured lot transfers and yield conversion, never direct substitution for the final denominator; biological batches are not machine M."
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "The reference flow must be expressed as kg farmed rock lobster or sea crawfish in the declared live, fresh, or chilled product form."
  - id: farmed_production_evidence
    applies_to: "all datasets"
    required_property_ref:
      name: "Record identity and production evidence"
      uuid: ""
    required_unit: "declared records"
    rule: "Dataset records must show controlled aquaculture production, not only wild capture followed by live holding, chilling, grading, or dispatch."
  - id: product_form_mass_basis
    applies_to: "whole, live, fresh, chilled, tailed, drained, or packed records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Product mass must state live whole weight, chilled whole weight, drained mass, tail mass if exceptionally declared, or another contract-declared basis. Convert only with measured yield evidence."
  - id: count_to_mass_conversion
    applies_to: "stocking, mortality, grading, harvest, sales, and count-grade records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Count records must include count per kg or mean individual mass, carapace length or size grade, sampling method, and product form before normalization."
  - id: life_stage_identity
    applies_to: "broodstock, pueruli, postlarvae, juveniles, and transferred stock"
    required_property_ref:
      name: "Mass or count"
      uuid: ""
    required_unit: "kg, item, puerulus count, postlarval count, or juvenile count"
    rule: "Life-stage records must retain taxon, life stage, supplier or hatchery, batch, count, mass where measurable, development stage, health status, and transfer date."
  - id: feed_mass_basis
    applies_to: "live feed, trash fish, mussel, formulated feed, supplements, and natural-feed claims"
    required_property_ref:
      name: "Mass, count, or service basis"
      uuid: ""
    required_unit: "kg, g, item, or cage-day"
    rule: "Feed records must state wet, dry, as-fed, live-feed, formulated-feed, or natural-feed basis. Natural-feed grow-out systems must document the absence of added feed and the grow-out service basis."
  - id: water_temperature_salinity_and_volume
    applies_to: "hatchery, nursery, grow-out, live holding, washing, chilling, and wastewater"
    required_property_ref:
      name: "Temperature, salinity, mass, or volume"
      uuid: ""
    required_unit: "deg C, ppt, kg, or m3"
    rule: "Preserve controlled water volume, temperature, salinity, water exchange, recirculation, make-up water, and discharge basis. Temperature control must be declared when energy use depends on chilling or heating."
  - id: energy_and_fuel_inventory
    applies_to: "pumps, aeration, oxygenation, chilling, heating, filtration, lighting, vessels, vehicles, and delivery"
    required_property_ref:
      name: "Energy or fuel quantity"
      uuid: ""
    required_unit: "kWh, MJ, L, or kg"
    rule: "Record original electricity, fuel, oxygen, or energy carrier units before normalizing to the reference flow."
  - id: chemical_and_health_treatment_basis
    applies_to: "disinfectants, probiotics, medicines, water-treatment chemicals, oxygen, anesthetic, and salt"
    required_property_ref:
      name: "Mass, volume, or active ingredient"
      uuid: ""
    required_unit: "kg, L, g active ingredient, or m3 gas"
    rule: "Record product quantity, active ingredient where applicable, treatment purpose, diagnosis or health plan link, legal status, and harvest eligibility consequence."
  - id: packaging_and_ice_basis
    applies_to: "crates, boxes, bags, liners, bands, labels, insulated containers, ice, gel packs, oxygenated bags, and pallets"
