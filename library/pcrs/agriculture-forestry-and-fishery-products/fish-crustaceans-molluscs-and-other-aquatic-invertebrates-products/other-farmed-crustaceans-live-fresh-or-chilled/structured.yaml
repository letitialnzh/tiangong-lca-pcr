    - protocol_id: cp_gate_release
      process_id: "gate_release"
      flow_role: "Unique final acceptance, arriving lot, rejects and loss"
      record_type: "calibrated weighing, physical custody and acceptance records"
      raw_fields: "actual declared gate/recipient/date; unique upstream route/transfer; actual species/stage/form/state; arriving mass; gross/tare/free-water-ice/rejects; positive accepted net mass Q; destinations/losses/stocks; attribution population"
      collection_method: "Independently weigh on a calibrated scale at the same actual final gate; verify actual state/native animal composition, exclude tare/free water/ice/rejects, and retain all acceptance losses/fates"
      unit: "kg"
      frequency: "each physical handoff"
      temporal_coverage: "complete same-lot/matched reporting population"
      site_scope: "gate_release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "signed custody/acceptance, calibration and independent deductions/loss records"
  calculation_rules:
    - id: normalize_to_reference_product
      applies_to: "all inventory rows"
      rule: "Normalized exchange = attributable native quantity q/Q; Q is only positive same-lot gate_release accepted net animal mass. Preserve original batch/per-1000-kg records, units and product-form basis, using explicit same_gate_normalization conversion."
      inputs:
        - q
        - Q
        - cp_gate_release
        - "own-node records"
      output: "native unit per kg reference flow"
      source_ids:
        - pcr-gate-accounting-method
    - id: stock_acceptance_balance
      applies_to: "stocking and transfer"
      rule: "accepted stocked biomass = source stock mass + transferred-in mass - transfer mortalities - rejected stock - documented transfer losses"
      inputs:
        - "source stock"
        - transfers
        - mortalities
        - rejects
        - "transfer loss"
      output: "accepted stocked biomass"
      source_ids:
        - mass-balance-identity
    - id: growth_and_survival_balance
      applies_to: "grow-out and fattening"
      rule: "harvest-size biomass = stocked biomass + biological growth - mortalities - escapes - rejects, checked against harvest records"
      inputs:
        - "stocked biomass"
        - feed
        - mortalities
        - escapes
        - "harvest records"
      output: "harvest-size biomass and survival disclosure"
      source_ids:
        - asc-farm-standard-2025
    - id: product_form_yield
      applies_to: "harvested and packed product"
      rule: "Reconcile independently measured net harvested animal input, opening/closing stocks and evidenced physical mass changes with onward product, other intended outputs, rejects and actual animal losses on the same declared product-form basis. Each amount belongs to one destination and is counted once. Ice, free water and packaging tare are excluded only from a gross weighing that actually includes them, never subtracted from net animal mass. Determine final accepted net product mass independently at the actual final gate; do not infer it by repeated deductions from an already net or accepted amount."
      inputs:
        - "harvest mass"
        - "rejected mass"
        - "product-form records"
        - "packout records"
      output: "marketable live, fresh, or chilled mass"
      source_ids:
        - codex-cxc-52-2003
    - id: delivery_tonne_kilometres
      applies_to: "delivered reference product"
      rule: "For each actual route leg, multiply the mass in tonnes of the consignment actually carried by that leg distance in km, then normalize to matched final reference-product output. The load includes carrier water, ice and packaging actually transported and is not the net reference-product mass. For shared loads use a justified mass, occupied-volume or other causal attribution key. Record empty-return, cooling, oxygenation and holding coverage; zero payload on an empty return does not imply zero transport burden. Do not double-count a transport service that covers the same fuel/direct emissions already modelled explicitly."
      inputs:
        - "delivered mass"
        - distance
        - route
        - "load factor"
        - "temperature or live-holding condition"
      output: "tonne-km and delivered product inventory"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and biological stock"
      requirement: "Species or species group, fallback justification, farmed status, biological starting condition, culture route, product form, and declared gate must be explicit."
      evidence: "reference flow metadata, stocking records, PCR selection note, harvest records, and sales or dispatch records"
    - id: dq_mass_balance
      applies_to: "stock, feed, mortality, harvest, and packout"
      requirement: "Stocking, growth, mortality, escape, molt or shell residue, harvest, reject, and marketable product records must reconcile within declared tolerance; unexplained gaps require disclosure."
      evidence: "mass-balance worksheet, scale tickets, culture-unit records, packout records, and supervisor review"
    - id: dq_feed_and_water_basis
      applies_to: "feed, bait, water, and chemicals"
      requirement: "Feed and bait basis, water salinity and exchange, treatment chemicals, and discharge route must be explicit."
      evidence: "invoices, feed declarations, farm logs, water-quality logs, treatment records, and discharge records"
    - id: dq_temporal_coverage
      applies_to: "all foreground rows"
      requirement: "Data must cover the full production, grow-out, fattening, and final handling period, or disclose partial-cycle, partial-batch, or proxy coverage."
      evidence: "reporting calendar, batch records, harvest records, and coverage statement"
    - id: dq_boundary_disclosure
      applies_to: "all datasets"
      requirement: "The dataset must disclose whether upstream stock, feed, water, packaging, delivery, capital goods, and infrastructure are foreground, linked upstream datasets, or excluded by scope."
      evidence: "dataset boundary statement, supplier records, upstream dataset links, and scope declaration"
    - id: collect_biological_stock_input
      applies_to: "hatchery_nursery_and_stocking"
      requirement: "Establish the actual substance/species, life stage, form, state, source and destination of each exchange in this scope and add independent atomic cards. Determine direction and product/waste/elementary type from real source/fate; this scope supplies no universal UUID or mixed total. Retain each own native quantity/unit, collection or calculation evidence, range/uncertainty evidence, attribution and division by the same final Q. Never copy a collection total, common range or one member UUID onto other members. Every actual major feed, input, waste, release and internal handoff is mandatory; unknown is not zero. Preserve raw batch/per-1000-kg records and explicit q/Q and 1000×q/Q conversion. Mixed-substance/unit screening numbers are not member ranges; mass ratios across life stages or biological growth are not a universal 0..1 survival fraction. Collection responsibility: Biological stock input . This row records the selected exchange within the declared process and system boundary. <br> - Flow property / unit: Mass or count with life stage / kg, item, or stage count <br> - Amount rule: measured count, mass where measurable, life stage, and accepted quantity entering hatchery, nursery, grow-out, or fattening <br> - Value mode: Foreground record (foreground_record) <br> - Specificity: Site-specific (site_specific) <br> - Normalization basis: per 1,000 kg marketable reference product <br> - Basis kind: Process output (process_output) <br> - Evidence kind: Collected record (collected_record) <br> - Collection protocol: cp_biological_stocking_records <br> - Sources: asc-farm-standard-2025"
