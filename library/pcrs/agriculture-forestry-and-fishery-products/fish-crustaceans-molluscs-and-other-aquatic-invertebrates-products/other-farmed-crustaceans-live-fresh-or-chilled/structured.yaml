allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "marketable live, fresh, or chilled other farmed crustacean output"
    rule: "Treat the declared reference product as the single reference product unless shells, molts, mortalities, residues, or processing outputs are intentionally recovered as co-products."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "all datasets"
    rule: "If a more specific canonical farmed crustacean PCR exists for the species or product state, use that PCR instead of this fallback category."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "multi-species, multi-lot, polyculture, or shared-service farms"
    rule: "Allocate shared stock, feed, water, electricity, fuel, oxygen, chemicals, packaging, and infrastructure by direct measurement, batch log, biomass-time, pond-time, cage-time, package count, or another declared physical driver before economic allocation."
    source_ids: []
