validation_rules:
  - rule_id: val_reference_flow_uuid
    applies_to: "applicable dataset and actual exchanges"
    rule: "Before dataset completion verify one UUID matching actual species, farmed origin, stage, product state/form, property and final physical gate. A category-name match does not establish state/gate compatibility; live farm-gate flow cannot substitute chilled delivered product, nor landing-catch flow controlled aquaculture output."
    source_ids: []
  - rule_id: val_fallback_scope
    applies_to: "applicable dataset and actual exchanges"
    rule: "Dataset states why no more specific farmed crustacean PCR applies."
    source_ids: []
  - rule_id: val_farmed_proof
    applies_to: "applicable dataset and actual exchanges"
    rule: "Dataset has controlled aquaculture, nursery, grow-out, or fattening evidence beyond wild capture and post-capture handling."
    source_ids: []
  - rule_id: val_product_state
    applies_to: "applicable dataset and actual exchanges"
    rule: "Product state is live, fresh, or chilled and excludes frozen, dried, salted, brined, prepared, preserved, ornamental, or processed product."
    source_ids: []
  - rule_id: val_mass_basis
    applies_to: "applicable dataset and actual exchanges"
    rule: "Product mass basis is declared as live, fresh, chilled, drained, ice-excluded, whole, soft-shell, molted, or another stated basis."
    source_ids: []
  - rule_id: val_structured_sync
    applies_to: "applicable dataset and actual exchanges"
    rule: "structured.yaml is regenerated from the bilingual Markdown after edits."
    source_ids: []
  - rule_id: val_unique_gate_atomic_completion
    applies_to: "applicable dataset and actual exchanges"
    rule: "Require exactly one actual gate_release and one final declared_gate_reference output, consistent same-lot Q/product form/state/gate, paired measured internal quantities and every applicable collection obligation. Final completion and validation require each actual exchange to have an independent atomic card, own quantity/native unit, collection/calculation and Range/uncertainty evidence, normalization, actual fate and verified UUID. Unknown identity, activity, gate, quantity, range or fate blocks completion, never zero or presumed bypass; checker pass does not prove actual dataset completeness."
    source_ids: []
  - rule_id: val_reference_form_scope
    applies_to: "market-size product transfers and final reference"
    rule: "Every market-size animal transfer and final reference product must retain its actual whole in-shell form. Tailed/decapitated, peeled/picked-meat or meat-only final references are outside this methodology. No measured yield or section-8 completion claim enlarges this boundary."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset for other farmed crustaceans, live, fresh, or chilled"
  downstream_use: "secondary_dataset; background_dataset; foreground reference for process or lifecyclemodel construction when aquaculture records are retained"
  allowed_use: "whole in-shell methodology only: LCA modelling of declared other farmed crustacean live, fresh, or chilled product at farm, harvest, dispatch, packhouse, or delivered gate"
  excluded_use: "tailed, peeled/picked-meat or meat-only reference products outside this methodology; products covered by a more specific crustacean PCR; wild crustaceans; frozen, dried, smoked, salted, brined, cooked, canned, peeled, picked-meat, prepared, preserved, ornamental, seed, shell, molt, mortality, wastewater, or residue products; ecosystem-service claims without a separate reviewed method"
  required_metadata: "canonical PCR id; CPC 3.0 code; species or species group; fallback justification; farmed status; biological starting condition; culture system; stocking date and biomass; product form; size grade; live/fresh/chilled state; feed and water basis; mortality and discharge disclosure; harvest and holding condition; packaging state; declared gate; geography; reporting period; data owner; unresolved UUID substitutions"
  required_quality_disclosure: "candidate reference-flow caveat, fallback PCR justification, farmed production evidence, mass balance closure, feed and water basis, temporal coverage, allocation basis, upstream dataset links, missing foreground records, proxy rows, and reasoned-estimate ranges used only for QA screening"
  update_trigger: "new Tiangong flow identities for exact CPC 04392 product, species-specific crustaceans, larvae, juveniles, feed, bait, water, oxygen, chemicals, molts, shells, mortalities, residues, packaging, ice, refrigerant, or delivery services; reviewed quantitative evidence for feed conversion, survival, fuel, water exchange, chemical, packaging, or chilling ranges; new specific PCR that supersedes this fallback; updated Codex, ASC, FAO, or legal requirements; classification mapping change"
data_sources:
  - id: "codex-cxc-52-2003"
    type: "standard"
    reference: "Codex Alimentarius Code of Practice for Fish and Fishery Products, CXC 52-2003, https://www.fao.org/input/download/standards/10273/CXP_052e.pdf"
    used_for: "live, fresh, chilled crustacean handling, hygiene, transport, and product-state context"
