  calculation_rules:
    - id: normalize_to_reference_product
      applies_to: "all inventory rows"
      rule: "normalized amount = collected amount / marketable reference product mass, with unit and product-form basis retained"
      inputs:
        - "collected amount"
        - "marketable product mass"
        - "product basis"
      output: "kg, kWh, L, item, m3, or tonne-km per kg reference product"
      source_ids:
        - mass-balance-identity
    - id: stock_acceptance_balance
      applies_to: "stocking and transfer"
      rule: "accepted stocked biomass = source stock mass + transferred-in mass - transfer mortalities - rejected stock - documented transfer losses"
      inputs:
        - "source stock"
        - transfers
        - mortalities
        - rejects
        - "transfer loss"
      output: "accepted stocked biomass"
      source_ids:
        - fao-capture-based-aquaculture-guidelines-2011
    - id: growth_and_survival_balance
      applies_to: "grow-out and fattening"
      rule: "harvest-size biomass = stocked biomass + biological growth - mortalities - escapes - rejects, checked against harvest records"
      inputs:
        - "stocked biomass"
        - "feed or bait records"
        - mortalities
        - escapes
        - "harvest records"
      output: "harvest-size biomass and survival disclosure"
      source_ids:
        - fao-atlantic-bluefin-tuna-culture
        - asc-farm-standard-2025
    - id: feed_or_bait_conversion_disclosure
      applies_to: "feed and bait rows"
      rule: "feed or bait ratio = feed or bait mass on declared basis / live biomass gain or marketable output; do not mix dry, wet, live, or thawed bases without conversion evidence"
      inputs:
        - "feed or bait mass"
        - "moisture or basis"
        - "biomass gain"
        - "marketable output"
      output: "declared feed or bait ratio and basis"
      source_ids:
        - asc-feed-standard-2026
        - fao-capture-based-aquaculture-2008
    - id: product_form_yield
      applies_to: "harvested and packed product"
      rule: "Reconcile independently measured net harvested animal input, opening/closing stocks and evidenced physical mass changes with onward product, other intended outputs, rejects and actual animal losses on the same declared product-form basis. Each amount belongs to one destination and is counted once. Bleeding or gutting changes animal mass only when actually performed; record removed tissue/body-fluid destinations and do not deduct them again if already excluded. Ice, free water and packaging tare are excluded only from a gross weighing that actually includes them, never subtracted from net animal mass. Determine final accepted net product mass independently at the actual final gate; do not infer it by repeated deductions from an already net or accepted amount."
      inputs:
        - "harvest mass"
        - "rejected mass"
        - "product-form records"
        - "packout records"
      output: "marketable live, fresh, or chilled mass"
      source_ids:
        - codex-cxc-52-2003
    - id: delivery_tonne_kilometres
      applies_to: "delivered reference product"
      rule: "For each actual route leg, multiply the mass in tonnes of the consignment actually carried by that leg distance in km, then normalize to matched final reference-product output. The load includes carrier water, ice and packaging actually transported and is not the net reference-product mass. For shared loads use a justified mass, occupied-volume or other causal attribution key. Record empty-return, cooling, oxygenation and holding coverage; zero payload on an empty return does not imply zero transport burden. Do not double-count a transport service that covers the same fuel/direct emissions already modelled explicitly."
      inputs:
        - "delivered mass"
        - distance
        - route
        - "load factor"
        - "temperature or live-holding condition"
      output: "tonne-km and delivered product inventory"
      source_ids:
        - mass-balance-identity
    - id: calc_final_gate_normalization
      applies_to: "all inventory rows"
      rule: "Divide same-boundary, same-actual-state quantities reported per 1000 kg final accepted product by 1000. For raw batch/event totals, establish actual ownership and once-only allocation, then divide by positive final accepted net kg from cp_final_gate_acceptance. Stage, harvest or pack-out denominators require same-lot measured transfer/yield mapping with the original values and conversion audit trail retained. Internal animals and transported water/ice/packaging are never fixed 1 kg inputs."
      inputs:
        - "raw batch and stage records"
        - "measured yields/transfers"
        - "once-only allocation"
        - cp_final_gate_acceptance
      output: "native exchange quantity per 1 kg final reference, with raw values and conversion record"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference product and biological stock"
      requirement: "Species, product category, farmed or aquaculture-fattened status, stock origin, capture-based status, culture route, product form, and declared gate must be explicit."
      evidence: "reference flow metadata, stocking records, permits, harvest records, and sales or dispatch records"
    - id: dq_capture_based_traceability
      applies_to: "capture-based aquaculture routes"
      requirement: "Wild stock capture or purchase, permit, transfer loss, stocking event, controlled fattening period, and harvest output must be traceable and reconciled."
      evidence: "capture logs, supplier invoices, movement permits, transfer logs, cage inventory, mortality records, and harvest records"
    - id: dq_mass_balance
      applies_to: "stock, feed, mortality, harvest, and packout"
      requirement: "Stocking, growth, mortality, escape, residue, harvest, reject, and marketable product records must reconcile within declared tolerance; unexplained gaps require disclosure."
      evidence: "mass-balance worksheet, scale tickets, cage records, packout records, and supervisor review"
    - id: dq_feed_bait_basis
      applies_to: "feed and bait records"
      requirement: "Feed and bait basis must distinguish formulated feed, fresh bait, frozen bait, live feed, dry matter, wet mass, thawed mass, medicated feed, and supplier species or composition where available."
      evidence: "feed invoices, bait species logs, formulation sheets, feed declarations, and feeding records"
    - id: dq_temporal_coverage
      applies_to: "all foreground rows"
      requirement: "Data must cover the full production or fattening campaign and final handling period, or disclose partial-year, partial-batch, or proxy coverage."
      evidence: "reporting calendar, batch records, harvest records, and coverage statement"
    - id: dq_boundary_disclosure
      applies_to: "all datasets"
      requirement: "The dataset must disclose whether upstream stock capture, hatchery production, feed, bait, packaging, delivery, capital goods, and infrastructure are foreground, linked upstream datasets, or excluded by scope."
      evidence: "dataset boundary statement, supplier records, upstream dataset links, and scope declaration"
    - id: dq_inventory_completion
      applies_to: "all concrete exchanges and final gate"
      requirement: "Complete every actual exchange including route-specific water, energy, feed, treatment, packaging, service, capital/replacement/cleaning and fate. Independently measure listed water/electricity/diesel/oxygen/ice cards only when actually used, and add separate cards for all other actual materials. Retain independent Range/UUID gaps as blockers to final completeness; never replace unknown with zero."
      evidence: "per-flow coverage ledger, raw records, independent ranges and verified identities"
    - id: dq_complete_biological_stock_input
      applies_to: "stock_capture_hatchery_transfer_and_stocking; inputs; product"
      requirement: "Collect every actual exchange for the collection responsibility “Hatchery, supplier, or captured juvenile stock input”, retaining these real raw quantity, batch/stage, native-unit, fate, collection and range-evidence obligations: This row records purchased, internally produced, transferred, or capture-based tuna stock entering the declared aquaculture route. Flow property / unit: Mass or count with life stage / kg, item, egg count, or stage count Amount rule: measured count, mass where measurable, life stage, accepted quantity, capture or supplier origin, and transfer loss entering hatchery, grow-out, or fattening Value mode: Foreground record (foreground_record) Specificity: Site-specific (site_specific) Normalization basis: per 1,000 kg marketable reference product Basis kind: Process output (process_output) Evidence kind: Collected record (collected_record) Collection protocol: cp_stock_origin_capture_transfer_and_stocking_records_stock_capture_hatchery_transfer_and_stocking Sources: fao-atlantic-bluefin-tuna-culture, fao-capture-based-aquaculture-2008, fao-capture-based-aquaculture-guidelines-2011, asc-farm-standard-2025 Every actual substance, fuel, material, waste, emission and service requires its own concrete identity card and independent measurement. Generated wastes/emissions are outputs, not inputs; escaped organisms remain separate from mortality/sludge. Convert original per-1000-kg/stage and batch bases explicitly to the sole final gate under calc_final_gate_normalization. No grouped UUID, total or Range is inherited; grouped bounds are not child allowed ranges. Any unresolved actual child’s independent Range evidence, quantity, fate or UUID makes the final dataset incomplete and fails validation; unknown is not zero."
      evidence: "node-owned collection protocol, raw records, per-flow coverage ledger and identity/fate evidence"
