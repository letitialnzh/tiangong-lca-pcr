measurement_rules:
  - id: final_gate_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual native exchange property"
      uuid: ""
    required_unit: "native unit per 1 kg final reference"
    rule: "Attribute raw batch/event quantities by actual ownership and allocation, then divide by positive accepted net kg at declared_gate_release; divide same-boundary per-1000-kg-final-product values by 1000. Stage-output denominators require measured lot transfers and yield conversion, never direct substitution for the final denominator; biological batches are not machine M."
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "The reference flow must be expressed as kg farmed tunas, skipjack, or stripe-bellied bonito in the declared live, fresh, or chilled product form."
  - id: farmed_production_evidence
    applies_to: "all datasets"
    required_property_ref:
      name: "Record identity and production evidence"
      uuid: ""
    required_unit: "declared records"
    rule: "Dataset records must show a foreground aquaculture production or biological grow-out/fattening period; bounded holding alone is not farming. Wild capture followed only by holding, chilling, grading, or dispatch is outside this PCR."
  - id: capture_based_stock_origin
    applies_to: "capture-based aquaculture and tuna ranching"
    required_property_ref:
      name: "Stock capture, transfer, and stocking records"
      uuid: ""
    required_unit: "declared records"
    rule: "Capture-based routes must retain source fishery or supplier, capture area, permit, date, size or mass, transfer loss, stocking cage or site, and evidence that stock entered controlled aquaculture."
  - id: product_form_mass_basis
    applies_to: "whole, gutted, bled, live, fresh, chilled, drained, or iced records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Product mass must state live whole weight, chilled whole weight, gutted mass, bled mass, drained mass, ice-excluded mass, or another contract-declared basis. Convert only with measured yield evidence."
  - id: count_to_mass_conversion
    applies_to: "stocking, mortality, grading, harvest, sales, and size-grade records"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Count-based records must include count per kg or mean individual mass, length or size grade where used, sampling method, and product form before normalization to kg reference product."
  - id: stock_lot_identity
    applies_to: "broodstock, eggs, larvae, juveniles, transferred wild fish, supplier fish, and stocked cages"
    required_property_ref:
      name: "Mass or count"
      uuid: ""
    required_unit: "kg, item, egg count, or life-stage count"
    rule: "Stock records must retain species, life stage, origin, capture or supplier evidence, batch or lot, count, mass where measurable, health status, transfer date, and mortality during transfer."
  - id: feed_and_bait_mass_basis
    applies_to: "formulated feed, fresh bait, frozen bait, live feed, medicated feed, and supplementary feed"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Feed and bait records must state dry, wet, as-fed, thawed, live, medicated, or declared basis. Convert between bases only with measured moisture, supplier data, or retained specification."
  - id: water_temperature_salinity_and_volume
    applies_to: "hatchery, nursery, grow-out, live holding, washing, chilling, and discharge"
    required_property_ref:
      name: "Temperature, salinity, mass, or volume"
      uuid: ""
    required_unit: "deg C, ppt, kg, or m3"
    rule: "Preserve controlled water volume, temperature, salinity, pH, dissolved oxygen, recirculation, make-up water, water exchange, drainage, and discharge basis. Ambient open-sea water is a boundary condition unless pumped, treated, exchanged, or discharged under foreground control."
  - id: energy_fuel_and_vessel_inventory
    applies_to: "pumps, aeration, oxygenation, feeding equipment, live holding, chilling, harvest, towing, vessels, vehicles, and delivery"
    required_property_ref:
      name: "Energy or fuel quantity"
      uuid: ""
    required_unit: "kWh, MJ, L, or kg"
    rule: "Record original electricity, fuel, oxygen, or energy carrier units before normalizing to the reference flow. Vessel fuel for capture-based stocking and farm servicing must be separated when records allow."
  - id: chemical_health_and_welfare_treatment_basis
    applies_to: "oxygen, disinfectants, medicines, anesthetics, vaccines, probiotics, cleaning agents, and welfare treatments"
    required_property_ref:
      name: "Mass, volume, active ingredient, dose, or gas amount"
      uuid: ""
    required_unit: "kg, L, g active ingredient, dose, or m3 gas"
    rule: "Record product quantity, active ingredient or dose where applicable, treatment purpose, diagnosis or health-plan link, legal status, withdrawal or harvest eligibility consequence, and treated biomass."
  - id: packaging_and_ice_basis
    applies_to: "boxes, bags, liners, insulated containers, labels, ice, gel packs, oxygenated live packs, and pallets"
