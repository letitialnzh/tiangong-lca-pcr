allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "marketable live, fresh, or chilled farmed tuna output"
    rule: "Treat the declared reference product as the single reference product unless roe, offal, mortalities, residues, or processing outputs are intentionally recovered as co-products."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "capture-based aquaculture routes"
    rule: "Do not allocate away wild stock capture, transfer losses, or mortality by excluding them from the foreground package. Assign them to the aquaculture product unless a reviewed upstream wild-stock dataset and allocation rule are declared."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "multi-species, multi-lot, or shared-service farms"
    rule: "Allocate shared electricity, vessel fuel, oxygen, site service, net cleaning, and holding infrastructure by measured meter, batch log, biomass-time, cage-time, or another declared physical driver before economic allocation."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "mixed-product packing or delivery"
    rule: "Allocate packaging, ice, live-holding, refrigeration, and delivery loads by measured product mass, package count, pallet, trip, temperature-control zone, or tonne-km as applicable."
    source_ids: []
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "This PCR explicitly adopts the allocation hierarchy in GHG Protocol Product Standard chapter 9: subdivision first, then evidenced causal physical relationships, and evidenced economic relationships where physical relationships are inapplicable. Mass is not an automatic convenience default. Preserve unallocated physical quantities and a separately labelled once-only LCA view; reconcile all output/node shares to one. Allocation never repairs physical imbalance, and internal transfers create no sale or substitution credit. Source: ghg-product-allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_stock_origin_capture_transfer_and_stocking_records_stock_capture_hatchery_transfer_and_stocking
      process_id: "stock_capture_hatchery_transfer_and_stocking"
      flow_role: "biological stock, capture-based stock, transfer, accepted stocking"
      record_type: "hatchery record, supplier invoice, capture log, permit, transfer log, stocking log, mortality log"
      raw_fields: "species, origin, capture area, permit, supplier, life stage, count, mean mass, total mass, transfer route, stocking date, cage or tank, accepted count, accepted mass, transfer mortality ; raw collection basis and original aggregation obligations: reconcile source stock plus transfers minus mortalities and rejects to accepted stocked biomass; normalize to marketable output"
      collection_method: "batch records reconciled to cage or tank inventory"
      unit: "kg, item, date, permit id"
      frequency: "each stocking event"
      temporal_coverage: "full reporting period or production campaign"
      site_scope: "hatchery, supplier, capture vessel, transfer route, cage, tank, or farm site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier documents, permits, transfer logs, cage inventory, mortality records, and manager sign-off ; retain raw batch, stage, per-1000-kg and native-unit records; apply calc_final_gate_normalization explicitly, never relabel biological collection as per-machine data."
    - protocol_id: cp_stock_origin_capture_transfer_and_stocking_records_growout_fattening_and_husbandry
      process_id: "growout_fattening_and_husbandry"
