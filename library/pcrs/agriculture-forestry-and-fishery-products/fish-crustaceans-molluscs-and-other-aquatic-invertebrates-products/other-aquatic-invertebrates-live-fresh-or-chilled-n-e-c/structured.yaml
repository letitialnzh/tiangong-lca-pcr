allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "sole declared-gate reference and all other intended outputs"
    rule: "The final reference output remains unique. Enumerate other actually intended and accepted products by species, form, state, destination and separate handoff; bycatch, mortality or residue does not automatically establish a coproduct. Subdivide/directly assign measured activities first; attribute residual shared burdens by an evidenced causal physical relationship, or a justified economic relationship with sensitivity when a physical basis is unsupported. Allocation does not alter physical mass."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "all datasets"
    rule: "If a more specific canonical PCR exists for the species, route, or product state, use that PCR instead of this fallback category."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "bycatch, non-target material, mortalities, rejected biomass, and residues"
    rule: "Do not allocate away bycatch, mortalities, rejects, drainage, or residue by excluding them from the foreground package. Record fate and allocate only when a recovered co-product is documented."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "multi-species trips, shared aquaculture systems, or shared handling services"
    rule: "Allocate shared vessel fuel, gear service, stock inputs, feed, electricity, water, ice, oxygen, packaging, and handling by direct measurement, trip log, culture-unit record, accepted mass, holding time, package count, or another declared physical driver before economic allocation."
    source_ids: []
