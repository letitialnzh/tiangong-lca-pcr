      evidence: "cp_sorting_holding_chilling_and_packout_outputs; Raw records, provider/recipient evidence, mass/water/stock balances and independent range/uncertainty support"
    - id: collect_delivery_fuel_electricity_ice_and_temperature_control_support
      applies_to: "delivery_to_declared_gate"
      requirement: "Add a separate exchange and quantity for each actual material, natural resource, distinct service, other intended product, waste and direct release at this node; record composition/species/state, native property/unit, supply boundary, destination/medium, ownership and evidenced actual absence. Generated rejects/residues/releases are outputs; only genuinely received wastes are inputs. Separate intended recovery, managed waste and direct environmental release by actual fate. Do not bind generic sludge/packaging/process-water identities or inherit aggregate quantities or mixed-unit ranges. Flow property / unit: Fuel, energy, mass, volume, or transport service / L, MJ, kWh, kg, m3, or tonne-km; Amount rule: include only when the declared reference flow is delivered beyond landing, receipt, dispatch, or packhouse gate; record distance, mode, load factor, live or chilled condition, and return logistics where relevant; Sources:  Retain each raw trip/lot/reporting-period quantity and applicable yield/moisture basis; divide every reporting quantity by measured same-lot final declared-gate accepted net mass Q. Collect independent range/uncertainty evidence for each concrete flow; a mixed collection screen is not a component range."
      evidence: "cp_delivery_records; Raw records, provider/recipient evidence, mass/water/stock balances and independent range/uncertainty support"
    - id: dq_unique_object_gate
      applies_to: "reference object and every stage"
      requirement: "Before collection each dataset must fix one physical reference object: one species or an evidenced single physical commercial species-group product, one source/production route, form, actual life/preparation state, moisture/drainage basis, grade and unique gate location/time/acceptance condition. Do not combine different species, live/dead, fresh/chilled, raw/prepared states or different gates in one reference exchange; unresolved specifications make the dataset incomplete. Each stage is the measured state of that same lot and is not automatically the final 1 kg."
      evidence: "Species/origin/state/moisture/grade specification, actual gate and lot transfer/acceptance records"
    - id: dq_ranges_uncertainty
      applies_to: "every actual individual exchange"
      requirement: "Verify each range basis against its concrete flow, real unit, same-lot final Q denominator and representative conditions; retain independent source/historical-batch evidence, observed variation and uncertainty without treating unknown as zero. A mixed-unit collection screen is not an individual-flow range; no universal initial upper bound spans different moisture, yield, gate or taxa. Do not self-validate against the tested batch maximum or clip actual outliers."
      evidence: "Independent original evidence, calibration, method and uncertainty records"
    - id: dq_period_ownership
      applies_to: "all nodes, periods, assets and inclusive services"
      requirement: "Cover complete actual trip/production/handling/holding/transport periods, return, idle/failed duty, maintenance/cleaning and asset replacement/retirement; reconcile unique ownership and carried stock burdens across shared consumers. Zero output or unknown Q cannot justify division by zero or erased burdens; exclude duplicate components according to inclusive service scope. Disclose actual applicability of natural origin/habitat/permit, n.e.c. justification, temporal/technology/geographic representativeness and exclusions."
      evidence: "Period calendars, resource/asset/service/stock ledgers and origin/scope evidence"
    - id: collect_declared_gate_handling
      applies_to: "declared_gate_release"
      requirement: "The final gate is the actual boundary responsibility interface, not presumed extra processing. Collect each actual pre-gate acceptance/weighing/handling event’s own electricity, material, service, rejection and release; carry the original record when the same event is already owned by a predecessor, without duplicate measurement. Every applicable concrete exchange needs its own native quantity/unit, same-Q normalization, destination and verified identity; missing data is not zero."
      evidence: "cp_declared_gate; cp_gate_outputs; actual event/ownership/transfer/acceptance and independent range/uncertainty records"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference object"
    rule: "Verify this PCR scope, single species/physical commercial product, actual source/route, life/preparation state, form/moisture/grade and unique declared gate. Classification labels or generic landing UUIDs cannot replace actual gate/state. Explain more-specific-PCR nonapplicability for n.e.c. products and animal origin for natural sponges."
    source_ids: []
  - rule_id: validate_gate_quantity
    applies_to: "reference output and all quantities"
    rule: "declared_gate_product is the sole final 1 kg reference output, and Q must be positive measured same-lot accepted net mass. Retain all raw batch quantities, actual intermediate yields, refusal/transit loss/moisture changes and paired transfers. Pack-out and delivery receipts are independently measured, not competing reference outputs."
    source_ids: []
  - rule_id: validate_atomic_completion
    applies_to: "all collection duties and actual exchanges"
    rule: "Resolve every applicable section-8 duty into specific physical/chemical exchanges with independent quantities, native units, range/uncertainty evidence, composition/state, same-Q normalization, destination/medium and verified compatible UUIDs. Any unresolved applicable duty makes the final dataset incomplete and validation fails; unknown is not zero and collection amounts/ranges/UUIDs are never copied."
    source_ids: []
  - rule_id: validate_fates_ownership
    applies_to: "outputs, resources, services and periods"
    rule: "Check intended products, managed wastes, environmental releases and stocks by actual fate; generated wastes/releases cannot be inputs. Inclusive services exclude overlapping owned fuel/electricity/assets/releases; transport cargo includes accompanying water/ice/containers and empty return is not zero burden. All actual nodes/periods/shared consumers and carried burdens must be complete."
    source_ids: []
  - rule_id: validate_projection
    applies_to: "bilingual content and structured projection"
    rule: "English/Chinese must align on reference object, exchange IDs, rules, units/denominators and duties; UUID-bearing Chinese displays use official baseName and unresolved identities remain explicit. Normally regenerate and verify structured Schema/fingerprints; structural pass does not prove identity, yield, numerical ranges or actual data completeness."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground production dataset for other aquatic invertebrates, live, fresh, or chilled, n.e.c."
  downstream_use: "secondary_dataset; background_dataset; foreground reference for process or lifecyclemodel construction when route and handling records are retained"
  allowed_use: "LCA modelling of declared live, fresh, or chilled n.e.c. aquatic invertebrate product at landing, receipt, dispatch, packhouse, or delivered gate"
  excluded_use: "any product with a more specific canonical PCR; ornamental aquatic animals; frozen, dried, smoked, salted, brined, cooked, canned, prepared, preserved, extracted, manufactured, or processed products; residues, wastewater, bycatch, mortalities, or rejected biomass as separate products; ecosystem-service claims without a separate reviewed method"
  required_metadata: "canonical PCR id; CPC 3.0 code; species or species group; n.e.c. justification; route; harvest, collection, or production area; method or culture system; landing or receipt site; live/fresh/chilled state; wet or drained mass basis; product form; holding duration and temperature; packaging state; declared gate; geography; reporting period; data owner; unresolved UUID substitutions"
  required_quality_disclosure: "fallback PCR justification, product state evidence, mass balance closure, wet/drained basis, temporal coverage, allocation basis, upstream dataset links, missing foreground records, proxy rows, and reasoned-estimate ranges used only for QA screening"
  update_trigger: "new Tiangong flow identities for species-specific n.e.c. invertebrates, collection gear, vessel/diver service, culture inputs, stock, feed, ice, live-holding oxygen, bycatch, mortalities, residues, packaging, refrigerant, or delivery services; reviewed quantitative evidence for fuel, yield, mortality, drainage, ice, packaging, or chilling ranges; new specific PCR that supersedes this fallback; updated Codex, FAO, or legal requirements; classification mapping change"
data_sources:
  - id: "codex-cxc-52-2003"
    type: "standard"
    reference: "Codex Alimentarius Code of Practice for Fish and Fishery Products, CXC 52-2003, https://www.fao.org/input/download/standards/10273/CXP_052e.pdf"
    used_for: "live, fresh, chilled aquatic product handling, hygiene, transport, and product-state context"
  - id: "fao-code-responsible-fisheries-1995"
    type: "official_guidance"
    reference: "FAO Code of Conduct for Responsible Fisheries, 1995, https://www.fao.org/fishery/docs/CDrom/aquaculture/a0805e/documents/Code%20of%20Conduct%20for%20Responsible%20Fisheries.pdf"
    used_for: "responsible fishery operations, bycatch, habitat, route, and traceability disclosure context"
  - id: "mass-balance-identity"
    type: "method_factor"
    reference: "Declared conservation/stock ledger and same-lot final-gate normalization method in PCR sections 4, 7 and 8, including measured receipts, stocks, water/tissue changes and all actual fates; no empirical yield or factor is supplied."
    used_for: "normalization, allocation, accepted-lot balance, yield, and delivery calculations"
