  calculation_rules:
    - id: normalize_to_reference_product
      applies_to: "all inventory rows"
      rule: "normalized amount = actual same-lot exchange quantity / positive same-lot declared-gate accepted net product mass Q; retain raw trip/lot/reporting-period numerators and units. Apply evidenced shares only to genuinely shared LCA burdens in a separate attribution view, keeping the physical ledger unallocated. Link intermediate process yields through measured stage masses and Q; local output cannot replace Q or imply a 1:1 yield. The sole final reference output is Q/Q = 1 kg."
      inputs:
        - "Node raw quantities"
        - Q
        - "measured intermediate yields"
        - "attribution decisions"
      output: "Quantity per 1 kg reference flow and separate physical ledger"
      source_ids:
        - mass-balance-identity
    - id: material_state_balance
      applies_to: "all material stages and stocks"
      rule: "Record opening stocks, receipts/collection, biological growth where actually farmed, actual water/material additions, internal handoffs, closing stocks, accepted products, rejection, mortality, tissue removal, trimming, drainage/evaporation and other losses separately; reconcile on matching species/form/moisture basis with unexplained residual retained. Do not deduct package tare or free ice again from already net product masses."
      inputs:
        - "Node mass/moisture/stock and fate records"
      output: "Measured stage yields and balance differences"
      source_ids:
        - mass-balance-identity
    - id: delivery_tonne_kilometres
      applies_to: "delivered reference product"
      rule: "For each actual route leg, multiply the mass in tonnes of the consignment actually carried by that leg distance in km, then normalize to matched final reference-product output. The load includes carrier water, ice and packaging actually transported and is not the net reference-product mass. For shared loads use a justified mass, occupied-volume or other causal attribution key. Record empty-return, cooling, oxygenation and holding coverage; zero payload on an empty return does not imply zero transport burden. Do not double-count a transport service that covers the same fuel/direct emissions already modelled explicitly."
      inputs:
        - "delivered mass"
        - distance
        - route
        - "load factor"
        - "temperature or live-holding condition"
      output: "tonne-km and delivered product inventory"
      source_ids:
        - mass-balance-identity
    - id: direct_emissions
      applies_to: "all actual direct releases"
      rule: "Use measurements or a sourced factor compatible with actual fuel/substance/units/receiving medium; retain original factor evidence, applicability, controls and uncertainty. No generic diesel factor is prescribed, and a water-body balance is not automatically a negative emission or credit."
      inputs:
        - "Node activity"
        - "measurement or sourced factor"
        - medium
      output: "Substance-specific direct release quantity"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: collect_production_harvest_collection_or_receipt_inputs
      applies_to: "production_harvest_collection_and_receipt"
      requirement: "Add a separate exchange and quantity for each actual material, natural resource, distinct service, other intended product, waste and direct release at this node; record composition/species/state, native property/unit, supply boundary, destination/medium, ownership and evidenced actual absence. Generated rejects/residues/releases are outputs; only genuinely received wastes are inputs. Separate intended recovery, managed waste and direct environmental release by actual fate. Do not bind generic sludge/packaging/process-water identities or inherit aggregate quantities or mixed-unit ranges. Flow property / unit: Fuel, energy, mass, volume, item, time, or service quantity / L, kWh, MJ, kg, m3, item, h, or service unit; Amount rule: measured or allocated harvest, collection, aquaculture, receipt, gear, water, fuel, electricity, stock, feed, and landing support inputs by route and lot; Sources: fao-code-responsible-fisheries-1995, codex-cxc-52-2003 Retain each raw trip/lot/reporting-period quantity and applicable yield/moisture basis; divide every reporting quantity by measured same-lot final declared-gate accepted net mass Q. Collect independent range/uncertainty evidence for each concrete flow; a mixed collection screen is not a component range."
      evidence: "cp_production_harvest_collection_and_receipt_records; Raw records, provider/recipient evidence, mass/water/stock balances and independent range/uncertainty support"
    - id: collect_bycatch_mortalities_rejected_biomass_and_receipt_residues
      applies_to: "production_harvest_collection_and_receipt"
      requirement: "Add a separate exchange and quantity for each actual material, natural resource, distinct service, other intended product, waste and direct release at this node; record composition/species/state, native property/unit, supply boundary, destination/medium, ownership and evidenced actual absence. Generated rejects/residues/releases are outputs; only genuinely received wastes are inputs. Separate intended recovery, managed waste and direct environmental release by actual fate. Do not bind generic sludge/packaging/process-water identities or inherit aggregate quantities or mixed-unit ranges. Flow property / unit: Mass, volume, or count / kg, m3, or item; Amount rule: measured bycatch, mortalities, rejected organisms, non-target material, drainage or wastewater, residue mass, fate, disposal route, recovery route, and receiving environment; Sources:  Retain each raw trip/lot/reporting-period quantity and applicable yield/moisture basis; divide every reporting quantity by measured same-lot final declared-gate accepted net mass Q. Collect independent range/uncertainty evidence for each concrete flow; a mixed collection screen is not a component range."
      evidence: "cp_production_harvest_collection_and_receipt_outputs; Raw records, provider/recipient evidence, mass/water/stock balances and independent range/uncertainty support"
