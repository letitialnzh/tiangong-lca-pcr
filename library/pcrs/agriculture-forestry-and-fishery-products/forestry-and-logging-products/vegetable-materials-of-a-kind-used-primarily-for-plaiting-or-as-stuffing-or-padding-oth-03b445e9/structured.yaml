product_category_identity:
  canonical_pcr_id: "pcr.agriculture-forestry-and-fishery-products.forestry-and-logging-products.vegetable-materials-of-a-kind-used-primarily-for-plaiting-or-as-stuffing-or-padding-oth-03b445e9"
  classification_refs: "CPC 3.0 03252; exact"
  covered_products: "This PCR covers vegetable materials of a kind primarily used for plaiting or as stuffing/padding, and other vegetable products within HS 2022 headings 1401 and 1404.90, excluding cotton linters. It is not restricted to fresh wild rattan. Covered families include bamboo, rattan, reeds/rushes, osier, raffia, eligible prepared cereal straw and bark plaiting materials, stuffing/padding material, broom/brush feedstock, and other vegetable products that demonstrably belong to 1404.90. Wild, managed, crop co-product and purchased-feed origins are possible and require distinct burden records."
  excluded_products: "Exclude cotton linters, textile fibres and textile goods classified elsewhere, chipwood, wood wool and prepared broom/brush knots or tufts assigned elsewhere, other wood goods outside this class, pulp/extracts and formulated chemicals classified elsewhere, and finished baskets, mats, furniture, brooms or brushes classified as articles rather than their feedstock. Primary preparation, splitting or treatment is included only while the resulting traded material remains in 1401 or 1404.90. A plant name or intended use alone cannot establish classification."
  representative_product: "A specified cane/bamboo/plaiting-material lot, stuffing/padding lot, broom/brush feedstock lot or documented 1404.90 product; no universal rattan proxy"
  production_route: "Actual owned source production/collection or compatible purchased receipt; actual primary preparation/grading; actual eligible treatment/holding; eligible composition assembly only if applicable; real final producer handover"
  market_state: "the actual primary producer handover of the declared material/state or eligible composition; Accepted vegetable material or other eligible vegetable product"
functional_unit:
  what: "Accepted vegetable material or other eligible vegetable product; the actual primary producer handover of the declared material/state or eligible composition"
  how_much: "1 kg"
  how_well: "One identified material/composition and declared grade/state, moisture, functional/intended-use and acceptance requirements; no universal performance or safety value"
  how_long_or_cycle: "One declared accepted dispatch lot or representative reporting period, with all contributing production/collection, treatment, stocks and shared-service periods linked"
  reference_flow_link: "dispatch_accepted_product"
system_boundary:
  rules:
    - rule_id: plaiting_material
      applies_to: "Cane, bamboo and other plaiting materials"
      rule: "Declare species, plant part, dimensions, skin/peel/split state, actual use and grade. Record cutting, sheath removal, scraping, splitting and drying separately when performed; removing a loose sheath is not epidermis scraping. A raw route does not inherit curing or bleaching."
      source_ids:
        - unsd-cpc3-2025
    - rule_id: stuffing_padding
      applies_to: "Stuffing and padding vegetable material"
      rule: "Identify plant origin, fibre/part state, cleaning/opening and compaction where performed. Distinguish accepted filler from seed, dust and foreign matter. Verify chapter exclusions; textile fibre is not included merely because it can fill a cushion."
      source_ids:
        - unsd-cpc3-2025
    - rule_id: broom_brush_material
      applies_to: "Broom and brush feedstock"
      rule: "Record species/part, length/diameter, cleaning/combing, drying and any actual bundling. End at feedstock dispatch, not the manufacture of a finished broom or brush."
      source_ids:
        - unsd-cpc3-2025
    - rule_id: other_vegetable_product
      applies_to: "Other products demonstrated to belong to 1404.90"
      rule: "Record product identity, specific HS eligibility, intended use, composition, source, state and actual separation/preparation. Do not arbitrarily exclude a valid residual-class product, or include every vegetable substance. A classification uncertainty must be resolved before a dataset claims this PCR is applicable."
      source_ids:
        - unsd-cpc3-2025
    - rule_id: route_ownership
      applies_to: "actual route and ownership"
      rule: "Select actual source/receipt, preparation, treatment, assembly if eligible, and dispatch states. Owned operations must be included; purchased completed-state feed enters its true receiving node with verified upstream coverage, not a duplicated standing-resource or managed-growth stage. A mixed-origin batch retains separate origin portions and attribution."
      source_ids: []
    - rule_id: handoffs_and_bypass
      applies_to: "active nodes and internal transfers"
      rule: "Record predecessor, successor, state and lot IDs at every active handoff and explicit bypass. A supplied finished good can enter dispatch directly. Internal transfers cancel only inside the declared aggregate boundary; splitting aggregate nodes later requires paired measured exchanges. No process label creates another market gate."
      source_ids: []
    - rule_id: natural_managed_interfaces
      applies_to: "source responsibility"
      rule: "Keep untended removal, purchased feed and other-product co-product origins distinct. Where the category permits managed production, distinguish owned management from wild gathering and record establishment/growth/maintenance, harvest, relevant land/water/carbon and losses once; harvest is aggregated in source, not repeated as wild biomass removal. Managed food production remains excluded from the wild-food category. Untended collection owns one removal interface and no invented cultivation recipe."
      source_ids: []
    - rule_id: incidental_ledger
      applies_to: "target material and foreign matter"
      rule: "Maintain disjoint target and incidental-matter ledgers by material, true origin, node, moisture, dates, opening/closing stocks and every return/discard destination. A physical environmental return cannot exceed available received/removed material without an explained additional source. Materials left in place are not removed inputs or returned outputs."
      source_ids: []
    - rule_id: supplies_and_emissions
      applies_to: "supporting supplies and releases"
      rule: "Conditional energy, supplies/services, management inputs and emissions are authoring requirements, not final UUID-bound aggregate exchanges. Instantiate only actual concrete materials/carriers/substances, preserve native units and verify each identity/support. Keep emitted substance and compartment distinct from a product waste transfer. Do not claim this candidate provides a universal factor or recipe."
      source_ids: []
    - rule_id: gate_scope
      applies_to: "foreground endpoint and upstream coverage"
      rule: "End at the documented producer handover of the actual accepted state. Owned movement and handling before that gate are included once; onward distribution, retail, use and end-of-life are downstream unless independently declared. A purchased input retains compatible origin/state, preparation and burden coverage, including treatment/assembly if already completed. A boundary mismatch cannot be repaired by renaming a flow."
      source_ids: []
    - rule_id: sites_periods_assets
      applies_to: "campaigns, facilities and shared assets"
      rule: "Enumerate all contributing sites, seasons, runs, stock periods and shared consumers; link successful and unsuccessful collection work, setup/cleaning/changeovers, establishment, service and replacement/termination events to actual outputs and periods. No universal rotation, lifetime or annualization factor is prescribed."
      source_ids: []
