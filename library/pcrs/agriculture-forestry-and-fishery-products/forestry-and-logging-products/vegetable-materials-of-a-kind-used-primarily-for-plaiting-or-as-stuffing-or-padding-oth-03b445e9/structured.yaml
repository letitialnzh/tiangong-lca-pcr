      collection_method: "Weigh the accepted good on a calibrated scale; reconcile the same configuration/state/composition and acceptance record, tare and all exclusions. Record actual positive net lot mass before normalization."
      unit: "kg"
      frequency: "each final accepted dispatch lot"
      temporal_coverage: "complete declared source/production and dispatch periods, with stock and asset carryover"
      site_scope: "all actual contributing source, preparation, treatment and handover sites"
