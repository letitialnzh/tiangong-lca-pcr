allocation_rules:
  - rule_id: output_precedence
    applies_to: "reference grade and other intended outputs"
    rule: "First subdivide independently measured activity. Attribute any remaining common collector burden to actual marketed fresh stem grades by contemporaneous net fresh mass only when the physical service relationship is supported; otherwise document the evidenced causal basis and sensitivity before finalization. No automatic credit for sheaths, trimmings or forest residues."
    source_ids: []
  - rule_id: rework_burdens
    applies_to: "rejected, returned and downgraded lots"
    rule: "Retain previously incurred burden on linked returned lots and add actual repeat handling once. A return is not a fresh removal or a final dispatched output. Excluded processed-state exits and lower-grade sales retain explicit burden and handoff decisions."
    source_ids: []
  - rule_id: shared_asset_periods
    applies_to: "tools, vehicles, shelter and services"
    rule: "Identify all consuming nodes/lots and service periods; use measured use/time/load or evidenced capacity share. Record asset service life, replacement and termination evidence without a universal lifetime. Prevent counting an already inclusive service and its component energy/asset burdens twice."
    source_ids: []
  - rule_id: stocks_sites
    applies_to: "campaigns, periods and sites"
    rule: "Reconcile opening/closing stocks and inter-period transfers with their retained burdens. Aggregate site-level attributable quantities and accepted net mass under the same reference boundary, not unweighted per-site averages; disclose exclusions and representativeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_harvest
      process_id: "wild_harvest"
      flow_role: "resource removal, collected stems, residues, actual inputs/releases"
      record_type: "source and lot logs"
      raw_fields: "lot; species; source unit/location; wild origin; maturity; removal/stem/sheath mass; date; actual tools/services; natural return; discard destination; substance/medium; asset/use keys"
      collection_method: "Source inspection and traceable calibrated weighing, input meters/invoices and actual destination observations; document uncertainty of source stem mass separately from accepted dispatch mass"
      unit: "kg and each concrete native unit"
      frequency: "each collection lot/event"
      temporal_coverage: "collection campaign and reporting period"
      site_scope: "every forest source and collector unit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "source/species proof, calibrated scale/tare records, transfer and destination receipts; no legality claim solely from historical source"
    - protocol_id: cp_prepare
      process_id: "primary_prepare"
      flow_role: "received/prepared stems, sheath/length removal and rejects"
      record_type: "preparation lot record"
      raw_fields: "lot; supplier/harvest link; incoming/outgoing mass; actual sheath and epidermis state; cuts; return; supplies; emissions; site/date; services"
      collection_method: "Weigh actual transfers/removals; inspect skin before/after; retain upstream identity/treatment declaration for bought feed; record actual meters and disposal"
      unit: "kg and each concrete native unit"
      frequency: "each operated lot/event"
      temporal_coverage: "actual preparation dates and stock periods"
      site_scope: "preparation units and matched suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "before/after skin observations, same-lot weighing and upstream coverage reconciliation"
    - protocol_id: cp_grade
      process_id: "grade_accept"
      flow_role: "grade acceptance, lower grades, returns and waste"
      record_type: "acceptance and destination register"
      raw_fields: "lot; species; diameter/length class; moisture; defects; grade criterion; accepted mass; other grade/destination mass; recipient; loop link; date"
      collection_method: "Inspect to declared buyer criteria and weigh each real grade/destination; record zero outputs explicitly when no alternate destination exists"
      unit: "kg and each concrete native unit"
      frequency: "each lot and grade decision"
      temporal_coverage: "grading dates and reporting periods"
      site_scope: "contributing grading/collector units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "acceptance proof and output-set balance with no universal grade threshold"
    - protocol_id: cp_hold
      process_id: "fresh_hold"
      flow_role: "actual fresh holding, input/outgoing stocks, rejects/releases"
      record_type: "holding interval and stock record"
      raw_fields: "lot; site; opening/closing/in-out mass; time; moisture method/time; protection; actual inputs/services; direct substance/medium; rejects"
      collection_method: "Record actual bounded holding interval, contemporaneous weighing/moisture and real protective inputs; do not invent water or refrigerant use"
      unit: "kg and each concrete native unit"
      frequency: "each lot/holding interval"
      temporal_coverage: "actual holding dates including inter-period stocks"
      site_scope: "every actual holding unit"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "lot-linked stock balance, fresh-state and treatment-history evidence, actual meter/use records"
    - protocol_id: cp_dispatch
      process_id: "collector_dispatch"
      flow_role: "accepted net reference mass, packaging, handover and common attribution"
      record_type: "calibrated weighing and dispatch register"
      raw_fields: "lot; botanical species; source and skin/sheath state; grade; moisture basis/time; diameter/length; count/bundle/length if recorded; net accepted fresh mass; tare; packaging/reuse; recipient/location/date; period/site; input and reject quantities; shared assets and consuming nodes"
      collection_method: "Weigh accepted fresh stems on a calibrated scale with recorded tare excluding all packaging and foreign matter; reconcile actual buyer acceptance, source lot, treatment state and true primary collector handover"
      unit: "kg and each concrete native unit"
      frequency: "each dispatch lot and attribution event"
      temporal_coverage: "collection-to-dispatch period with stock carryover"
      site_scope: "all contributing collector and source units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/tare, acceptance/dispatch receipts, state photos/inspection, same-lot unit conversion and complete output/asset register"
    - protocol_id: cp_direct_release_wild_harvest
      process_id: "wild_harvest"
      flow_role: "Per-node actual direct releases and coverage decisions"
      record_type: "Activity, measurement and method-evidence ledger"
      raw_fields: "site; process_id; lot/cohort; period; event_id; activation/evidence; carrier/formulation; activity_amount/unit; substance/species/particle_basis; receiving_medium; fossil/biogenic_origin; method/source/version/applicability; factor/value/unit; conversion; abatement_scope; measured_release; supplier_service_coverage; existing_row_id; shared_event_owner; allocation_state; reference_total"
      collection_method: "Match this node's input/application/equipment logs to release events. Determine each substance/medium amount by measurement or an applicable evidenced method and factor; retain factor provenance, unit conversions, abatement scope and uncertainty, without subtracting control twice when already included. Reconcile existing emission cards and contractor services once; create concrete output elementary exchanges for uncovered events and retain UUID verification evidence. Missing method, amount or identity prevents claiming a complete data package."
      unit: "kg per substance/medium; retain native activity units"
