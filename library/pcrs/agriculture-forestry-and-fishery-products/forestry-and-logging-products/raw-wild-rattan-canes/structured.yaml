  calculation_rules:
    - id: lot_to_reference
      applies_to: "all inventory rows"
      rule: "Sum attributable real exchange quantities by substance/carrier/service and divide by measured accepted net fresh dispatch mass in kg; retain numerator units and produce per 1 kg reference flow."
      inputs:
        - cp_harvest
        - cp_prepare
        - cp_grade
        - cp_hold
        - cp_dispatch
      output: "attributed quantities per 1 kg reference flow"
      source_ids: []
    - id: transfer_balance
      applies_to: "stem and residue transfers"
      rule: "Reconcile opening stock plus actual receipts against accepted transfers, separate other outputs, measured residue/foreign matter, losses and closing stock on comparable contemporaneous moisture bases; unexplained difference remains a disclosed data gap, not a fabricated emission."
      inputs:
        - "all lot and destination registers"
      output: "linked reconciled material balances"
      source_ids: []
    - id: site_aggregation
      applies_to: "multi-site and period package"
      rule: "Sum site/period attributable burdens and matching net accepted fresh mass after deduplicating transfer/asset records; do not average separately normalized site values without matching mass weights."
      inputs:
        - "site/period ledgers"
        - "accepted dispatch register"
      output: "common-boundary aggregate and contributor disclosure"
      source_ids: []
    - id: calculate_direct_release_ledger
      applies_to: "wild_harvest; primary_prepare; grade_accept; fresh_hold; collector_dispatch"
      rule: "For each unique event, substance and medium, obtain raw release E from measurement or the cited applicable method using activity A and a compatible factor EF; use E = A * EF only for a genuinely simple-factor method, after checking units and abatement scope. Do not add different substances/media; retain an unallocated raw-release ledger. Divide attributed burden totals once by matched positive final reference quantity R; do not renormalize final-reference intensities or allocate a shared event twice. Unexplained material residuals are not automatically emissions and missing factors are not zero."
      inputs:
        - cp_direct_release_wild_harvest
        - cp_direct_release_primary_prepare
        - cp_direct_release_grade_accept
        - cp_direct_release_fresh_hold
        - cp_direct_release_collector_dispatch
        - "existing emission cards"
        - "supplier coverage"
        - "reference quantity"
      output: "Node/substance/medium-specific raw and attributed amounts and unresolved gaps"
      source_ids: []
  data_quality_requirements:
    - id: rattan_identity
      applies_to: "every included lot"
      requirement: "Prove botanical rattan, wild untended origin, maturity, round fresh stem, intact epidermis and actual sheath/length preparation. Trade name, permit or HS label alone does not prove this physical boundary."
      evidence: "source inspection, supplier/harvest trace and treatment records"
    - id: fresh_measurement
      applies_to: "quantities and conversions"
      requirement: "Same-lot calibrated net fresh mass and contemporaneous moisture; disclose method uncertainty and conversion coverage; no borrowed dry/fresh factor or per-cane weight."
      evidence: "calibration, tare, scales and moisture records"
    - id: complete_contributors
      applies_to: "sites, periods and shared assets"
      requirement: "Enumerate actual contributors, collection/preparation/hold/dispatch phases, opening/closing stocks, replacements and termination; keep unique attribution keys and evidence for every included share."
      evidence: "linked site/period/asset ledger and representativeness decision"
    - id: output_routes
      applies_to: "grades, returns and discarded material"
      requirement: "Every grade, rework loop and boundary exit has a true destination, handoff, quantity and burden decision; unused optional routes have evidence of absence."
      evidence: "buyer acceptance, transfer and disposal/return records"
    - id: exchange_identity
      applies_to: "every final concrete exchange"
      requirement: "Verify exact flow UUID, support property/unit and applicability to material state/origin/compartment before final data production; aggregate umbrellas are not final exchanges."
      evidence: "concrete identity and compatibility evidence held with foreground package"
    - id: dq_range_units_evidence
      applies_to: "concrete exchanges in variable-unit cards"
      requirement: "Establish any quantitative screen only after identifying its concrete exchange, reference property, explicit comparison unit and denominator, applicability, reviewed evidence and derivation. Preserve a unit conversion record that converts value and both bounds consistently; test the same physical quantity identically in equivalent units. Keep unresolved screens explicit and do not use them as amounts or completeness evidence."
      evidence: "linked collection protocols; property/unit and conversion records; compatible evidence and derivation; unresolved-screen register"
validation_rules:
  - rule_id: reference_gate
    applies_to: "reference output"
    rule: "Confirm rattan_dispatch is the actual accepted product output, equals 1 kg net fresh stem reference, and has matching species/source/state/grade/moisture/actual gate qualifiers; packaging and rejects cannot enter reference mass."
    source_ids:
      - fao-rattan-glossary
      - fao-rattan-resource
  - rule_id: origin_state
    applies_to: "every included lot"
    rule: "Reject cultivated, intentionally dried/cured/fumigated/skin-scraped/split goods and unknown state/origin. A flow UUID or buyer label cannot replace source-state proof."
    source_ids:
      - fao-rattan-glossary
  - rule_id: quantity_relationship
    applies_to: "every inventory row"
    rule: "Confirm per 1 kg reference flow basis, native numerator-unit integrity, linked collection/normalization and measured internal transfer quantities; no assumed count-to-mass or dry-to-fresh conversion."
    source_ids: []
  - rule_id: route_reconciliation
    applies_to: "process map, outputs and rejects"
    rule: "Check every actual optional activation/bypass, grade/destination, return and waste path; match transfer pairs and do not count internal returns as final outputs or repeat natural removal for purchased feed."
    source_ids: []
  - rule_id: multi_axis_attribution
    applies_to: "sites, periods, modes and assets"
    rule: "Check unique site/lot/run/period keys and asset consumers, changeover/cleanup linkages, stock carryover and output attribution; no omitted contributor or duplicated common burden."
    source_ids: []
  - rule_id: identity_and_evidence
    applies_to: "final exchanges and ranges"
    rule: "Require concrete verified identities and supports for final exchanges; preserve per-card Range evidence tiers. Reasoned screens are non-default/non-enforcing and cannot replace measured values or qualify a dataset for publication."
    source_ids: []
  - rule_id: validate_direct_release_coverage
    applies_to: "wild_harvest; primary_prepare; grade_accept; fresh_hold; collector_dispatch"
    rule: "For every activated node, reconcile its activity list against cp_direct_release_wild_harvest; cp_direct_release_primary_prepare; cp_direct_release_grade_accept; cp_direct_release_fresh_hold; cp_direct_release_collector_dispatch: each relevant event must have quantified concrete elementary exchanges, evidenced upstream-service coverage, or evidenced absence of the activity. Missing/unknown is not zero and blocks data-package completeness. Check each actual substance/medium amount, method/factor units, concrete UUID and existing-card/service coverage for omissions or duplication; empty groups, purchased-electricity upstream emissions or another node's single CO2 card do not replace this node's on-site reconciliation. Shared-asset services must not create duplicate physical release events."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile required/conditional activation and upstream coverage against incoming state at each node; purchased completed-state feed must not duplicate growth, harvest or preparation. Equal classification does not replace state and gate matching."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground collection package and its process/lifecycle projections"
  downstream_use: "secondary_dataset or background_dataset only after actual boundary, quantity, identity and quality review"
  allowed_use: "Matching wild fresh round epidermis-intact rattan feedstock at documented primary collector gate and compatible declared grades"
  excluded_use: "Plantation or treated/dried/peeled/split cane; furniture/plaited goods; all vegetable materials; unsupported functional substitution or sustainability/carbon-credit claims"
  required_metadata: "Species/source, state/skin/sheath, dimensions/grade/moisture, true gate/date/recipient, net fresh mass, site/period contributors, optional-route states, stocks/returns, attribution and exact exchange identities"
  required_quality_disclosure: "Measurement uncertainty, source/temporal/site coverage, actual output set, exclusions, missing evidence, shared-asset decisions and any provisional range limitations"
  update_trigger: "Changed origin/species/state/skin treatment, grade or gate, actual route, material quantities, contributors, asset attribution, identities/supports or stronger range/method evidence"
