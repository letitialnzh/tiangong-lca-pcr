system_boundary:
  rules:
    - rule_id: wild_source_ownership
      applies_to: "source and harvest"
      rule: "Own harvesting includes stem resource removal and capture in one node, independent of later sheath/length preparation. Do not duplicate removal in a second node, invent cultivation, or record purchased cane as an elementary input."
      source_ids:
        - fao-rattan-resource
        - fao-thailand-rattan-route
    - rule_id: state_limit
      applies_to: "every lot and handoff"
      rule: "Epidermis remains intact; document sheath removal separately. Scraping the epidermis, curing, chemical preservation, fumigation, deliberate drying or splitting triggers an excluded-state exit, not relabelling into accepted fresh cane."
      source_ids:
        - fao-rattan-glossary
        - fao-rattan-resource
    - rule_id: actual_route
      applies_to: "preparation, grading, holding, dispatch"
      rule: "Trace actual transfers backward from dispatched net mass; preparation/holding may bypass with evidence. Same physical fresh product need not acquire a new identity at each internal node. Actual gate compatibility still requires source/handover evidence."
      source_ids:
        - fao-thailand-rattan-route
    - rule_id: loss_and_destinations
      applies_to: "all material movements"
      rule: "Separate accepted grades, separately sold lower grades, rework loops, incidental natural residues returned at source, managed discard and measured direct releases; record every real destination and stock difference."
      source_ids:
        - fao-rattan-resource
    - rule_id: site_period_assets
      applies_to: "common boundary"
      rule: "Enumerate contributing source sites, collector units, collection/holding/dispatch periods and shared tools, vehicles or shelter services. Attribute each measured contribution once; disclose replacements, opening/closing stocks and missing coverage."
      source_ids: []
    - rule_id: dispatch_cut
      applies_to: "final handover"
      rule: "Include actual collector-side loading/bundling and in-bound transfers; exclude downstream transport, processing beyond the expressly permitted sheath/thorn removal and cut-to-length, manufacturing, retail use and disposal. Packaging is not net stem reference mass."
      source_ids:
        - fao-thailand-rattan-route
    - rule_id: boundary_direct_release_coverage
      applies_to: "wild_harvest; primary_prepare; grade_accept; fresh_hold; collector_dispatch"
      rule: "Reconcile on-site combustion, actual applications and fugitive releases/leaks at every activated node through unique activity-substance-receiving-medium records in cp_direct_release_wild_harvest; cp_direct_release_primary_prepare; cp_direct_release_grade_accept; cp_direct_release_fresh_hold; cp_direct_release_collector_dispatch. Upstream production of purchased fuel or chemicals does not replace emissions from their use on site; verify coverage and avoid double counting the same activity inside a supplier service. Evidence must support non-activity; missing data are not zero. This obligation does not expand the existing product gate or downstream-use boundary and does not presume combustion, fertilization, chemicals or equipment occur."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Select the route from actual incoming state and ownership. Qualified purchased harvested, extracted, prepared or graded feed may enter at its real receiving node; completed upstream operations are not mandatory foreground operations and standing stock or biological resources must not be charged again. Receiving cards record actual material, grade, wet/dry basis, receipt gate, upstream dataset and process coverage; add the actual receiving exchange if none exists. Bypass does not remove upstream burdens; actual operations cannot be skipped and final reference product, quality and gate remain unchanged."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Mature rattan in a declared untended forest source; alternatively a traced collected lot whose own source removal and upstream collection are independently evidenced once"
  starting_condition_role: "Source interface for own harvest, or an explicit purchased-product recursion cut with matched upstream collection coverage"
  product_classification_scope: "Fresh round wild rattan stems only; not the entire 03252 class or cultivated/processed cane"
  recursive_input_rule: "A purchased collected/prepared same-category input is a product transfer with matched upstream data, not a second current-site natural removal; disclose upstream cut, coverage, identity and losses"
  upstream_dataset_requirement: "Matching species/origin/fresh-state/gate and quantity-basis supplier collection data plus actual input, energy, transport and asset support datasets; gaps prevent finalization"
  disclosure: "Sites and source units, reporting periods/campaigns, actual optional operations/bypasses, ownership and handovers, stocks/returns, shared assets, other outputs, allocation and exclusions"
