allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "If the foreground process produces only the declared primary gum product and internal residues are discarded, no allocation is required. If guayule rubber, guayule resin, bagasse, purified gutta fraction, resinous fraction, fuel residue, or another co-product leaves the system with economic value, allocate shared collection, extraction, and finishing burdens by dry mass as the default physical allocation. Use economic allocation only when the co-products have materially different functions and sale prices are documented for the same campaign. Internal rework is not a co-product; record it as a loop or yield loss. Residues used internally for process heat displace purchased energy only when measured and disclosed."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Concrete cards do not inherit numerical ranges from the former aggregate card. Determine quantities from original records, stock/meter reconciliation and the declared reference flow; no default quantity or numeric screen is supplied without evidence matching the identity, unit, period and boundary. Missing range evidence is a quality disclosure, not zero use or proof of completeness."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_source_material_records
      process_id: "source_harvest_or_raw_lot_receipt"
      flow_role: "source material input and raw material transfer"
      record_type: "harvest, tapping, receiving, or purchase record"
      raw_fields: "species_or_source_category; source_system; lot_id; as_received_mass; moisture_or_solids; source_location; harvest_or_receipt_date"
      collection_method: "weighbridge, batch sheet, receiving note, tapping log, or harvest record; original activity aggregation: sum lots and convert to dry matter where required"
      unit: "kg and percent moisture or solids"
      frequency: "each lot or campaign"
      temporal_coverage: "representative production year or declared campaign"
      site_scope: "source area, supplier lot, or receiving site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scale records, supplier certificates, moisture tests, and lot traceability"
    - protocol_id: cp_source_area_records
      process_id: "source_harvest_or_raw_lot_receipt"
      flow_role: "source area occupation"
      record_type: "land management or source-area record"
      raw_fields: "productive_area; source_system; harvestable_area_share; campaign_duration; yield_to_processing"
      collection_method: "land register, plantation block record, concession record, or supplier declaration; original activity aggregation: allocate source area to harvested dry matter or purchased raw lot"
      unit: "ha, m2a, kg dry matter"
      frequency: "annual or campaign"
      temporal_coverage: "representative production year"
      site_scope: "source stand, plantation block, or declared supplier source"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "source map, land record, management plan, or supplier statement"
    - protocol_id: cp_energy_records
      process_id: "all_processes"
      flow_role: "fuel, electricity, steam, and process heat"
      record_type: "meter, invoice, boiler log, fuel issue, or equipment-hour record"
      raw_fields: "energy_carrier; quantity; unit; meter_scope; allocation_basis; process_id; date"
      collection_method: "meter reading, invoice reconciliation, or equipment-hour calculation; original activity aggregation: allocate shared energy by metered sub-process first, then runtime, mass throughput, or dry product output"
      unit: "kWh, MJ, kg fuel, L fuel"
      frequency: "monthly or campaign"
      temporal_coverage: "representative production year or campaign"
      site_scope: "plant, field crew, extraction line, finishing line, or storage area"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration, invoice, fuel log, and allocation worksheet"
    - protocol_id: cp_water_records
      process_id: "primary_concentration_or_extraction"
      flow_role: "process water and wastewater"
      record_type: "water meter, batch water sheet, or wastewater record"
      raw_fields: "make_up_water; recycled_water; discharge_volume; treatment_route; process_id; date"
      collection_method: "meter reading or water balance; original activity aggregation: net make-up water plus discharge water balance per reference product"
      unit: "kg or m3"
      frequency: "batch, monthly, or campaign"
      temporal_coverage: "representative production year or campaign"
      site_scope: "extraction, boiling, washing, cooling, and effluent treatment systems"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter records, wastewater manifest, treatment logs, and water-balance reconciliation"
    - protocol_id: cp_auxiliary_material_records
      process_id: "primary_concentration_or_extraction"
      flow_role: "solvent, coagulant, and process aid"
      record_type: "purchase, issue, or batch recipe record"
      raw_fields: "material_name; concentration_or_grade; quantity_issued; recovered_quantity; loss_quantity; supplier; process_id"
      collection_method: "inventory issue, recipe sheet, or solvent recovery log; original activity aggregation: net consumed material equals issued minus recovered/reused stock"
      unit: "kg"
      frequency: "each batch or campaign"
      temporal_coverage: "representative production year or campaign"
      site_scope: "extraction or purification line"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "purchase record, SDS, batch sheet, and recovery log"
    - protocol_id: cp_product_quality_records
      process_id: "primary_concentration_or_extraction_purification_forming_and_drying_packaging_storage_and_dispatch"
      flow_role: "intermediate and final product quality"
      record_type: "production, laboratory, and finished-goods record"
      raw_fields: "product_form; gum_type; moisture_or_solids; impurity_content; net_product_mass; off_grade_mass; lot_id"
      collection_method: "batch sheet, lab test, finished-goods record; original activity aggregation: sum conforming net product and normalize all flows to 1 kg reference product"
      unit: "kg, percent moisture or solids"
      frequency: "each lot"
      temporal_coverage: "representative production year or campaign"
      site_scope: "production line and finished-goods warehouse"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "lab report, certificate of analysis, scale record, and finished-goods ledger"
    - protocol_id: cp_residue_records
      process_id: "all_processes"
      flow_role: "rejected biomass, bagasse, spent leaves, wastewater sludge, off-grade gum, and packaging waste"
      record_type: "waste, residue, or by-product record"
      raw_fields: "residue_type; quantity; moisture_or_solids; fate; sale_or_disposal_route; internal_reuse_flag"
      collection_method: "waste manifest, residue collection record, by-product sales note, or internal reuse log; original activity aggregation: sum by fate; convert to dry matter where relevant; link valuable co-products to allocation rule"
      unit: "kg and percent moisture or solids"
      frequency: "batch, monthly, or campaign"
      temporal_coverage: "representative production year or campaign"
      site_scope: "field, extraction, finishing, storage, and waste handling areas"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "waste manifest, by-product invoice, disposal ticket, and internal reuse record"
    - protocol_id: cp_packaging_records
      process_id: "packaging_storage_and_dispatch"
      flow_role: "primary packaging input"
      record_type: "packaging issue or bill of materials record"
      raw_fields: "packaging_material; unit_mass; units_used; reusable_flag; supplier; product_lot"
      collection_method: "packaging BOM, warehouse issue, or supplier record; original activity aggregation: sum non-returnable packaging per net product mass"
      unit: "kg"
      frequency: "lot or monthly"
      temporal_coverage: "representative production year or campaign"
      site_scope: "packaging area and finished-goods warehouse"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "packaging BOM, supplier specification, and stock issue record"
  calculation_rules:
    - id: normalize_to_reference_product
      applies_to: "all inventory rows"
      rule: "row amount per kg reference product = campaign row amount / conforming net saleable product mass"
      inputs:
        - "row amount"
        - "conforming product mass from cp_product_quality_records"
      output: "normalized inventory amount per 1 kg reference product"
      source_ids: []
    - id: convert_to_dry_matter
      applies_to: "source material, residues, and intermediate products"
      rule: "dry matter mass = as-received mass * (1 - moisture fraction) or as-received mass * solids fraction"
      inputs:
        - as_received_mass
        - moisture_or_solids
      output: "kg dry matter"
      source_ids: []
    - id: water_balance_check
      applies_to: "process water and wastewater"
      rule: "wastewater or evaporated water is reconciled from make-up water, recycled water, product moisture change, and measured discharge"
      inputs:
        - make_up_water
        - recycled_water
        - "product moisture"
        - discharge_volume
      output: "water balance and unreconciled loss"
      source_ids: []
    - id: co_product_allocation
      applies_to: "processes with saleable co-products"
      rule: "allocate shared burdens by dry mass unless documented campaign prices justify economic allocation"
      inputs:
        - "shared process burdens"
        - "dry mass of saleable co-products"
        - "prices when used"
      output: "allocation factors by co-product"
      source_ids:
        - iso-14044-2006
    - id: guayule_fraction_check
      applies_to: "guayule routes"
      rule: "compare declared resin/rubber fraction yields with cited guayule resin and rubber extraction literature; deviations require explanation"
      inputs:
        - "dry shrub input"
        - "resin fraction"
        - "rubber fraction"
        - bagasse
      output: "QA flag or accepted route-specific yield"
      source_ids:
        - dehghanizadeh-2021-guayule-resin
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Declare gum type, botanical or supplier source category, product form, purification state, and moisture or dry matter basis."
      evidence: "finished-goods record, certificate of analysis, supplier declaration, or product specification"
    - id: dq_source_traceability
      applies_to: "source material"
      requirement: "Trace source material to source stand, plantation block, supplier lot, or purchased raw gum lot."
      evidence: "harvest log, tapping record, supplier certificate, receiving note, or concession/management record"
    - id: dq_mass_balance
      applies_to: "source material, intermediate, final product, and residues"
      requirement: "The dry-matter mass balance from source input to final product, co-products, residues, and losses must be reconcilable for each campaign."
      evidence: "batch sheets, lab moisture tests, product ledger, and residue records"
    - id: dq_energy_water_boundary
      applies_to: "energy and water"
      requirement: "Energy and water records must distinguish field collection, recovery/extraction, finishing, and storage where material; allocation assumptions must be documented."
      evidence: "meters, invoices, boiler logs, water balance, and allocation worksheet"
    - id: dq_co_product_allocation
      applies_to: "co-products and residues"
      requirement: "Co-product allocation must use dry mass by default or documented economic allocation with same-campaign prices."
      evidence: "co-product mass records, by-product sales invoices, and allocation calculation"
    - id: dq_temporal_representativeness
      applies_to: "foreground dataset"
      requirement: "Use at least one representative annual cycle or a declared production campaign; seasonal tapping or harvest campaigns must be identified."
      evidence: "production calendar, campaign records, and data coverage statement"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "The dataset is invalid if it omits the required product qualifiers, especially gum type, product form, moisture basis, source system, and production route."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "The reference flow must be 1 kg net saleable product mass. Packaging and reusable containers are not part of the reference product mass."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "The dry-matter mass balance must reconcile source material, product, co-products, residues, and moisture losses. Unreconciled dry-matter loss above 5 percent of source dry matter requires explanation."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Purchased raw gum, latex, leaves, shrub biomass, solvents, process aids, packaging, electricity, fuels, and transport services must be linked to upstream datasets when they cross the foreground boundary."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "Chicle routes must disclose tapping interval assumptions and whether tree damage or stand management activities are included."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Gutta-percha routes must disclose whether material comes from tapping, leaves, prunings, crude blocks, or purchased raw material."
    source_ids: []
  - rule_id: validation_rule_7
    applies_to: "foreground_dataset_conformance"
    rule: "Guayule routes must disclose aqueous or solvent extraction, resin/rubber separation state, bagasse treatment, and solvent recovery where applicable."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Balata routes must disclose whether downstream gutta/resin separation is included or excluded."
    source_ids: []
published_dataset_profile:
  dataset_role: "unit_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Modelling producer-gate primary natural gum materials in foreground product systems when the declared gum type, form, source system, route, and moisture basis match."
  excluded_use: "Finished chewing gum, vulcanized rubber products, synthetic rubber, dental devices, formulated adhesives or coatings, and natural rubber CPC 01950 unless separately mapped."
