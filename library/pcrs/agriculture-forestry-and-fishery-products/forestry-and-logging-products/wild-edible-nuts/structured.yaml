  - id: form_mass_bridge
    applies_to: "natural_nut_removal, gathered_nut_material, conditioning_nut_feed, conditioned_in_shell_nuts, preservation_nut_feed, preserved_in_shell_nuts"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure incoming/outgoing forms separately; pair same-lot water, solids and stock records. Dry resource mass cannot replace wet in-shell product mass without measured conversion; no universal shell/husk yield."
  - id: energy_units
    applies_to: "collection_energy, conditioning_energy, preservation_energy, handover_energy"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve actual carrier amount and energy basis; electricity kWh may convert by exact 3.6 MJ/kWh, fuels/heat require recorded matching net/gross basis. Native service hours and transport tonne-kilometres are not energy."
