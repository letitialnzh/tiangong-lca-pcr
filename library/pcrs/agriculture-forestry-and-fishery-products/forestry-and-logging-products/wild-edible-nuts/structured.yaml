system_boundary:
  rules:
    - rule_id: wild_source_eligibility
      applies_to: "source lots"
      rule: "Require evidence that nuts were untended and gathered, not intentionally grown; intentional cultivation inputs are outside this method."
      source_ids:
        - unsd-cpc3-wild-nuts
    - rule_id: removal_owner
      applies_to: "collection, transfer"
      rule: "Collection combines removal and capture responsibility as one node, independent of later conditioning; assign each source portion to included natural removal or an upstream gathered product, never both. Uncollected habitat biomass is not a produced waste."
      source_ids:
        - fao-nwfp-food-handling
    - rule_id: actual_route_gate
      applies_to: "all processes"
      rule: "Include only actual owned pre-gate operations. Prepared or purchased inputs may bypass collection/conditioning/preservation; final acceptance is required. Declare the actual gate and record each intermediate handoff."
      source_ids:
        - fao-nwfp-food-handling
    - rule_id: state_exclusions
      applies_to: "conditioning, handover"
      rule: "Outer pod/husk removal may leave raw in-shell nuts; kernel shelling/roasting/manufacture and downstream distribution remain excluded. No inferred gate/state equivalence."
      source_ids:
        - fao-nwfp-food-handling
    - rule_id: site_period_scope
      applies_to: "source and shared assets"
      rule: "Enumerate each contributing site/campaign/period and common-boundary linkage. Attribute shared access/tools/storage to actual consumers and periods once; no forest area, lifetime or annual yield default."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual untended natural source at collection, or verified already-gathered wild material at its actual upstream handoff with prior burden and mass state declared"
  starting_condition_role: "Natural resource removal owned by included collection, or attributable technosphere feed when collection is upstream; exclusive per physical portion"
  product_classification_scope: "Raw in-shell primary wild-nut scope; no cultivated or kernel-processing recursion"
  recursive_input_rule: "Already gathered same-category inputs retain actual supplier state/source/gate and upstream burden once. Do not add a second natural removal ledger or reset their prior burdens."
  upstream_dataset_requirement: "Actual supplier/service inputs need compatible verified concrete identities and supporting upstream datasets; missing identity/source/quantity is disclosed, not replaced by a convenient cultivated nut dataset."
  disclosure: "Enumerate source sites, lots, campaigns, owned operations, bypasses, gates, stock periods, shared assets/consumers, secondary destinations and all omissions."
