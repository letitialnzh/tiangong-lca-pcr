allocation_rules:
  - rule_id: output_ownership
    applies_to: "all outputs"
    rule: "Enumerate every intended accepted grade and actual other good with mass, quality, use and recipient handoff. Discards, retained residue and saleable goods are not interchangeable; no automatic coproduct or avoided-treatment credit."
    source_ids: []
  - rule_id: allocation_precedence
    applies_to: "multiple intended goods"
    rule: "Subdivide separately measured operations first. Where inseparable shared burdens remain, use an evidenced physical causal driver; otherwise document a reviewed period-specific economic share with actual prices and sensitivity. One burden receives one method and shares sum to the allocated total; no universal nut/husk ratio."
    source_ids: []
  - rule_id: period_site_attribution
    applies_to: "campaigns, stocks and shared assets"
    rule: "Reconcile each site's matching campaign inputs/accepted output, opening/closing stocks and transfers before mass-weighted aggregation of compatible species/state/gate. Do not average unrelated sites or seasons. Enumerate tool/access/store consumers and use measured hours/payload/activity as causal driver; asset service/renewal/termination burden goes to actual recorded periods once, no assumed lifetime."
    source_ids: []
  - rule_id: reject_loop_burden
    applies_to: "conditioning, preservation, handover"
    rule: "Keep rejection/spoilage burden with its actual originating lot; measured returns to conditioning receive only additional operation burdens. Count an accepted lot once at handover, not at intermediate transfers or every re-sort pass. Downgraded goods and waste each retain their explicit burden decision."
    source_ids: []
  - rule_id: inclusive_service
    applies_to: "transport and shared services"
    rule: "Inclusive contracted service and foreground energy/emission/asset inventories are alternative representations of the same responsibility; document one choice and exclusions. Human labour is not an inferred material/energy flow."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_collection
      process_id: "collection"
      flow_role: "natural removal, actual energy/tools, gathered material and incidental discards; direct operational emissions"
      record_type: "field lot ledger"
      raw_fields: "site; habitat; untended proof; species; season; dates; pod/shell state; dry/wet masses; resource owner; tool hours; energy carriers; recipient; incidental destinations; named pollutant/substance; particle size/speciation; receiving medium/compartment; actual equipment activity; measurement or justified activity-factor evidence; inclusive service exclusions"
      collection_method: "Weigh actual collected material; retain paired moisture test and source observation; meter or invoice real equipment/service activity; do not estimate tree growth from nut dispatch; record actual direct emissions by named substance/medium, measured amounts or actual activity with justified factors; separate evaporated water and inclusive-service emissions"
      unit: "kg; MJ; h"
      frequency: "each collection lot and actual activity"
      temporal_coverage: "named campaign/reporting period"
      site_scope: "each contributing untended source"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated scale; source witness record; moisture sampling; owned activity boundary"
    - protocol_id: cp_transfer
      process_id: "transfer"
      flow_role: "feed, actual transport and spoilage"
      record_type: "movement ledger"
      raw_fields: "lot; sender/receiver; gate; wild proof; departure/arrival mass; dates; route; mode; distance; payload/return load; inclusive service boundary; losses/destination"
      collection_method: "Match dispatch and arrival weighing; obtain actual transport activity and service invoice with supplier upstream burden and source proof"
      unit: "kg; t km"
      frequency: "each segment/lot"
      temporal_coverage: "actual dates and reporting period"
      site_scope: "source-to-declared primary gate only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "matched movement IDs; weighing; route/payload evidence; no repeated prior burden"
    - protocol_id: cp_conditioning
      process_id: "conditioning"
      flow_role: "feed, supplies/energy/water, usable grades, other goods, residue and wastewater; direct operational emissions"
      record_type: "operation/grade ledger"
      raw_fields: "lot; incoming form/moisture; outer pod/husk removal; cleaning method; supplies; meters; water source/provider; usable grades/mass; reject/retained material; re-sort; wastewater receiver/pollutants; named pollutant/substance; particle size/speciation; receiving medium/compartment; actual equipment activity; measurement or justified activity-factor evidence; inclusive service exclusions"
      collection_method: "Measure each actual incoming and outgoing state, supply/meter quantities and destinations; paired same-lot mass/water records distinguish hard shell from outer pod; sample wastewater when discharged; record actual direct emissions by named substance/medium, measured amounts or actual activity with justified factors; separate evaporated water and inclusive-service emissions"
      unit: "kg; MJ"
      frequency: "each actual handling/grade lot"
      temporal_coverage: "actual operation dates"
      site_scope: "each declared handling site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weighing/meters; grade acceptance; recipient evidence; mass/water reconciliation"
    - protocol_id: cp_preservation
      process_id: "preservation"
      flow_role: "feed, actual energy/service, stabilized output, rejects and water vapour; direct operational emissions"
      record_type: "drying/storage lot ledger"
      raw_fields: "lot; pre/post water and solids; temperature if relevant; dates; opening/closing stocks; actual energy; service hours/consumers; usable output; spoilage; re-sort; receiving air compartment; named pollutant/substance; particle size/speciation; receiving medium/compartment; actual equipment activity; measurement or justified activity-factor evidence; inclusive service exclusions"
      collection_method: "Weigh and sample matched pre/post lots; meter real services; reconcile water change separately from spoilage/stock transfers; measure or calculate only evidenced evaporation; record actual direct emissions by named substance/medium, measured amounts or actual activity with justified factors; separate evaporated water and inclusive-service emissions"
      unit: "kg; MJ; h"
      frequency: "each intervention and stock reconciliation"
      temporal_coverage: "actual drying/storage dates and cross-period movements"
      site_scope: "each pre-gate store/drying site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "moisture method; paired scale records; stock ledger; intervention record; explicit air compartment"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "measured feed, package material/energy, accepted reference/other grades and rejects; direct operational emissions"
      record_type: "acceptance/dispatch ledger"
      raw_fields: "species; source proof; campaign/lot; grade; edible identity/acceptance; gate; raw in-shell state; net/gross/tare; moisture; outer pod exclusion; packaging material/reuse cycles; energy; other recipients; rejected quantities/destinations; named pollutant/substance; particle size/speciation; receiving medium/compartment; actual equipment activity; measurement or justified activity-factor evidence; inclusive service exclusions"
      collection_method: "Weigh accepted raw in-shell nuts on a calibrated scale excluding transport packaging and foreign matter; retain acceptance and source chain; weigh each packaging material and actual other output separately; record actual direct emissions by named substance/medium, measured amounts or actual activity with justified factors; separate evaporated water and inclusive-service emissions"
      unit: "kg; MJ"
      frequency: "each accepted handover lot and package cycle"
      temporal_coverage: "actual dispatch date and reporting period"
      site_scope: "actual gatherer or primary producer gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weighing/tare; aligned acceptance record; identity/source proof; package reuse and reject records"
  calculation_rules:
    - id: lot_reconciliation
      applies_to: "physical material records"
      rule: "Same-boundary incoming material plus opening stock and actual added water/material must reconcile with separately measured usable/other-good/waste outputs, evidenced water loss and closing stock. Explain residual discrepancy; never treat all mass loss as evaporation."
      inputs:
        - "matched forms and moisture"
        - stocks
        - "weighed outputs and destinations"
      output: "reconciled lot ledger and discrepancy evidence"
      source_ids: []
    - id: record_normalization
      applies_to: "collected exchange records"
      rule: "Divide each actual physical campaign/lot quantity by the matching accepted net in-shell kilograms for the physical ledger per 1 kg reference flow. Keep all measured inputs, intermediates, other goods, wastes and stocks in that ledger without economic-share scaling. Separately apply the documented allocation decision to shared burdens, then divide the burden attributed to the reference product by its matching accepted mass. Label physical-ledger and allocated-burden results distinctly; allocation must not change measured yields or erase co-output mass. A missing accepted denominator is a gap."
      inputs:
        - "owned quantities"
        - "matched accepted mass"
        - "allocation and period/site records"
      output: "separately labelled normalized physical ledger and allocated burden"
      source_ids: []
    - id: resource_bridge
      applies_to: "natural_nut_removal"
      rule: "Retain measured natural-source nut-bearing form mass and paired water/solids conversion when elementary support uses dry matter; do not set dry biomass resource equal to wet dispatch."
      inputs:
        - "matched resource state"
        - "paired moisture"
        - quantity
      output: "evidenced source mass basis"
      source_ids: []
    - id: water_loss
      applies_to: "drying_water_vapour"
      rule: "Derive only actual evaporated water from matched pre/post water, added water, stock movements and water leaving other paths; prove receiving air compartment. No whole mass-loss or universal drying factor."
      inputs:
        - "moisture and weighed lot records"
        - "water/waste paths"
        - "stock ledger"
      output: "actual evaporated water"
      source_ids: []
  data_quality_requirements:
    - id: source_form_quality
      applies_to: "every nut-bearing lot"
      requirement: "Declare wild untended proof, species, edible identity and acceptance criterion, raw in-shell state, hard shell included, outer pod/husk excluded and moisture basis; unverified/unknown source is a gap, not default wild status or food advice."
      evidence: "source observations and supplier chain; actual acceptance/test record"
    - id: campaign_site_coverage
      applies_to: "aggregated foreground"
      requirement: "Enumerate contributors, dates, reporting periods, sampling/omission decisions and comparable gate/state. Reconcile every site ledger before compatible output-mass weighting. Include unused/failed campaign activity when attributable, never successful-lot-only bias."
      evidence: "site/campaign contribution table and sampling rationale"
    - id: stock_assets
      applies_to: "assets and cross-period material"
      requirement: "Match opening/closing balances, source/destination transfers, asset service periods, replacement/termination events and actual consumers; unresolved period ownership blocks final attribution."
      evidence: "stock/asset/use ledger and reconciliation"
    - id: measurement_identity
      applies_to: "concrete exchange production"
      requirement: "Identify actual supplies, services, wastes and elementary substances/receiving compartments with verified property/unit. No generic umbrella UUID, invented pollution factor or automatic emission from a common name."
      evidence: "concrete identity detail evidence; primary measurements or reviewed factors"
    - id: provisional_ranges
      applies_to: "non-reference Range blocks"
      requirement: "Broad candidate-only QA estimates use 0 lower to permit actual non-occurrence. Mass screens of 20 kg cover uncertain pod/foreign-matter forms, repeated measured intermediates and deliberately broad substance-specific emission screening (not combustion stoichiometry); 10 kg cover loss paths and ancillary materials; packaging 5 kg flags large returnable-container attribution. Energy 100 MJ, service 20/100 h and transport 100 t km deliberately flag unusually intense small-output campaigns. These order-of-magnitude author screens are not FAO quantities, plausible yield guarantees, defaults or admissible maxima. Values outside require reviewed scope/evidence, never clipping, zero replacement or automatic rejection; replace with matched empirical intervals."
      evidence: "reasoned_estimate; no external numerical source claimed"
    - id: reference_range
      applies_to: "wild_nuts_handover"
      requirement: "The 1..1 kg range is the declared normalization identity, not collection yield, required dispatch size or physical input-output equality."
      evidence: "cp_handover accepted denominator"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Check real accepted output at declared gate, net in-shell kg, species/grade/source/moisture and matching reference link/name; upstream/intermediate mass must not be fixed to 1 kg."
    source_ids: []
  - rule_id: validate_route
    applies_to: "source and operations"
    rule: "Validate untended gathered source, actual active/bypassed nodes and their handoffs; exclude cultivated inputs and kernel processing. One source portion has one resource/upstream owner."
    source_ids:
      - unsd-cpc3-wild-nuts
  - rule_id: validate_mass_destinations
    applies_to: "all material records"
    rule: "Reconcile actual shell/pod/water/stock states and every usable grade, other good, waste or retained residue; prevent unknown mass loss from becoming water vapour and rejects from becoming accepted reference."
    source_ids: []
  - rule_id: validate_campaign_allocation
    applies_to: "campaigns/sites/periods/shared assets"
    rule: "Check contributor completeness, compatible weighted aggregation, actual campaign/changeover records and allocation precedence/shares. Replacement/termination and return/re-sort events have one owner; repeated service/energy/stock burdens fail."
    source_ids: []
  - rule_id: validate_identities
    applies_to: "concrete exchanges"
    rule: "Confirm exact flow type, state/gate, wild origin where relevant, property/unit and elementary compartment. Resolve each umbrella from actual records; verification and quantity evidence remain separate. Missing identity or unsupported conversion stays a gap."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "every card"
    rule: "Check Range basis/unit/evidence alignment and measured zero/positive occurrence; provisional screens trigger evidence review, not a default quantity. Record performed/skipped checks and remaining uncertainty."
    source_ids: []
