functional_unit:
  what: "One actual species-qualified accepted raw in-shell wild edible nut lot at primary producer handover"
  how_much: "1 kg net as-received in-shell nuts"
  how_well: "Declared species, wild untended source, grade, hard-shell inclusion, outer pod/husk exclusion, moisture and edible identity/acceptance evidence"
