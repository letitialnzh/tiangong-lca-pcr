system_boundary:
  rules:
    - rule_id: boundary_untended
      applies_to: "source eligibility"
      rule: "Prove untended gathering with species, source site and management history; exclude intentionally managed/cultivated berry production even when marketed as wild. Land tenure or collection permission alone does not prove untended origin."
      source_ids:
        - unsd-cpc3-wild-berries
        - umaine-managed-wild-blueberries
    - rule_id: boundary_owned_removal
      applies_to: "gather and purchased feed"
      rule: "One portion has one removal owner: owned source collection records natural input and gathering burden once; purchased already gathered berries retain the upstream package and bypass source removal. Harvest and resource removal share gather, not duplicate operations."
      source_ids: []
    - rule_id: boundary_route
      applies_to: "foreground activities"
      rule: "Activate only operations actually performed before the named primary gate. Collection, transfer, initial preparation, fresh holding and presentation are separate responsibilities; bypassed nodes cannot acquire invented inputs. Jam, juice, pulp, drying, freezing, cooking, retail logistics and customer processing are outside this fresh whole scope."
      source_ids:
        - fao-food-storage
    - rule_id: boundary_period_sites
      applies_to: "source season and reporting boundary"
      rule: "Declare collection-season, trip/run, preparation and holding periods with opening/closing berry and container stocks, every source site, transfer and gate timestamp. Include attributable unsuccessful trips and changeover/cleaning events; retain noncontributing-trip evidence rather than exclude failures automatically."
      source_ids: []
    - rule_id: boundary_services
      applies_to: "shared assets and primary gate"
      rule: "Identify tools, containers, vehicles and cold rooms, owner/service period and every consuming node/lot. Attribute once using observed service drivers; retain replacement/retirement and return-loop records. Do not combine full service datasets and their covered utilities. Packaging ends at real primary handover; later distribution is excluded."
      source_ids: []
    - rule_id: boundary_fresh_state
      applies_to: "conditioning and holding"
      rule: "Declare washing/debris removal, accepted species and grades, fresh-state before/after, holding time/temperature and recipients from actual records. No universal washing, chilling, storage-life or yield default. Chemical preservation or any transformed food state is outside this record."
      source_ids:
        - fao-food-storage
boundary_abstraction:
  declared_starting_condition: "Untended standing source berries for owned removal, or actual purchased already gathered fresh berry lots with retained upstream evidence."
  starting_condition_role: "Natural-source removal interface or purchased technosphere feed, assigned once per physical portion."
  product_classification_scope: "Fresh whole primary state narrower than CPC 03234; classification does not define route or product identity."
  recursive_input_rule: "Same-category purchased input is a measured product input retaining an upstream dataset and previous gate; no recursive regeneration or duplicate gathering/removal."
  upstream_dataset_requirement: "Upstream package or reviewed disclosed substitute for purchased berries, utilities, materials and services, with gate and covered operations stated; missing coverage remains a gap."
  disclosure: "Declare collection ownership, species, untended evidence, sites/seasons/trips, preparation/cooling, gate, stocks, joint output and shared service scope, exclusions and unmeasured losses."
