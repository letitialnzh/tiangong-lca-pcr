allocation_rules:
  - rule_id: allocate_outputs
    applies_to: "all intended outputs"
    rule: "First separate independently measured operations and their intended output handoffs. For inseparable joint gathering, assign documented causal collector-time/service shares where evidenced; otherwise use measured fresh berry mass shares only for comparable fresh goods at the same actual split. Incomparable states require explicit reviewed method and sensitivity, not automatic mass or revenue allocation. Disposal residues receive no assumed sale/substitution credit."
    source_ids: []
  - rule_id: allocate_shared
    applies_to: "shared trips, infrastructure and periods"
    rule: "Record all consumers and real service period; prioritize measured trip/time, container-turn or occupied cold-room capacity-time drivers for attributable shared service. Preserve unsuccessful attributable trip burden and opening/closing stocks through the correct season. Reconcile all shares to the original whole once; no equal-site averages without contribution evidence."
    source_ids: []
  - rule_id: allocate_rejects
    applies_to: "condition, hold and handover"
    rule: "Link every damaged, leaking, spoiled or off-grade state to its producing node and actual return, re-sort, intended other-grade sale or disposal recipient. Internal recirculation retains accumulated burden and additional work, never credits a second output. Fresh intended other goods have one ultimate handoff; unresolved rejects cannot enter accepted net reference mass."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_gather
      process_id: "gather"
      flow_role: "all actual node exchanges"
      record_type: "measured linked ledger"
      raw_fields: "species; source sites; management history; season; trip/run id and time; successful/unsuccessful effort; removed berry mass; separate incidental non-berry natural material composition/mass and removal origin; directly returned natural compartment/location/time/mass; external waste recipient; collected mass; rejects/return destination; actual inputs/provider/unit; named emissions/compartment/activity/factor; equipment/service scope"
      collection_method: "Trace source observations and management declaration independently of sales label; calibrated lot weighing and timed trip logs, invoices, meter/service records and actual named-substance emission measurement or activity-factor evidence."
      unit: "kg and actual exchange units"
      frequency: "each trip/lot/run and event"
      temporal_coverage: "complete declared season and holding period, including stocks and unsuccessful trips"
      site_scope: "every actual contributor site and node"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, origin/acceptance evidence, timestamps, service scope, contributor and destination reconciliations"
    - protocol_id: cp_transfer
      process_id: "transfer"
      flow_role: "all actual node exchanges"
      record_type: "measured linked ledger"
      raw_fields: "incoming/outgoing lot and fresh state; source/recipient node; distance/time/loading; gross/tare/foreign matter; caught juice/spill and destination; inputs/service boundaries; named emissions and activity/factors"
      collection_method: "Weigh dispatch/receipt on calibrated scales, link trip/load logs and route scope; meter actual inputs or retain supplier service evidence. Record real spills and separately owned exhaust, never inclusive service duplication."
      unit: "kg and actual exchange units"
      frequency: "each trip/lot/run and event"
      temporal_coverage: "complete declared season and holding period, including stocks and unsuccessful trips"
      site_scope: "every actual contributor site and node"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, origin/acceptance evidence, timestamps, service scope, contributor and destination reconciliations"
    - protocol_id: cp_condition
      process_id: "condition"
      flow_role: "all actual node exchanges"
      record_type: "measured linked ledger"
      raw_fields: "incoming fresh lot; cleaning/washing active status; maturity/grade rules; accepted grade, intended other goods/recipient; stems/leaves/foreign matter; damaged berries; caught juice/wastewater destination; re-sort/return origin; supplied inputs; named substance/compartment/activity/factor"
      collection_method: "Calibrated before/after net weighing plus actual grade acceptance records; separately weigh foreign matter, other goods, rejects and liquids. Link washing meters, cleaning/run changeovers, supplier services and actual direct-emission evidence."
      unit: "kg and actual exchange units"
      frequency: "each trip/lot/run and event"
      temporal_coverage: "complete declared season and holding period, including stocks and unsuccessful trips"
      site_scope: "every actual contributor site and node"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, origin/acceptance evidence, timestamps, service scope, contributor and destination reconciliations"
    - protocol_id: cp_hold
      process_id: "hold"
      flow_role: "all actual node exchanges"
      record_type: "measured linked ledger"
      raw_fields: "lot; before/after fresh state; time/temperature; opening/closing stocks; occupied capacity-time; energy/material/services; spoiled/damaged berries, liquid and destination; measured moisture change; refrigerant/substance/compartment and activity/factor"
      collection_method: "Use stock/lot records and calibrated receipt/exit weighings with actual holding logs and metered or evidenced shared service drivers. Identify moisture change independently; use refrigerant balances or named direct measurement/activity-factor evidence when real."
      unit: "kg and actual exchange units"
      frequency: "each trip/lot/run and event"
      temporal_coverage: "complete declared season and holding period, including stocks and unsuccessful trips"
      site_scope: "every actual contributor site and node"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, origin/acceptance evidence, timestamps, service scope, contributor and destination reconciliations"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "all actual node exchanges"
      record_type: "measured linked ledger"
      raw_fields: "species; eligibility; untended origin; accepted lot/grade/fresh moisture; primary gate/time; gross mass; measured container tare; excluded stems/leaves/foreign matter; other-goods mass/recipient; accepted net mass; packaging material/mass/reuse turns/losses/cleaning; returns and waste destination; actual utilities/service; named emissions/compartment/activity/factor"
      collection_method: "Weigh the accepted fresh whole lot on a calibrated scale, subtract documented tare and excluded parts, reconcile the same species/grade/lot with the actual acceptance record. Record packaging/reuse and separate other-goods handoffs, returns, waste and actual direct-emission evidence."
      unit: "kg and actual exchange units"
      frequency: "each trip/lot/run and event"
      temporal_coverage: "complete declared season and holding period, including stocks and unsuccessful trips"
      site_scope: "every actual contributor site and node"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, origin/acceptance evidence, timestamps, service scope, contributor and destination reconciliations"
  calculation_rules:
    - id: normalize_observed
      applies_to: "all inventory rows"
      rule: "Divide the attributable actual exchange in its own unit by the accepted net final berry mass in kg; report per 1 kg reference flow. The final reference output is 1 kg; measure every internal transfer independently."
      inputs:
        - cp_gather
        - cp_transfer
        - cp_condition
        - cp_hold
        - cp_handover
      output: "reference-normalized exchange"
      source_ids: []
    - id: reconcile_node_mass
      applies_to: "all actual material nodes"
      rule: "Reconcile measured received material and opening stock against actual outgoing berries, independently classified other goods/rejects/liquids/foreign matter, identified moisture change and closing stock. Do not force the residual to evaporation or an emission."
      inputs:
        - cp_gather
        - cp_transfer
        - cp_condition
        - cp_hold
        - cp_handover
      output: "physical ledger and explicit unresolved imbalance"
      source_ids: []
  data_quality_requirements:
    - id: quality_origin
      applies_to: "all berry lots"
      requirement: "Verify edible species/intended use and untended source independently of commercial wild name; reject managed/cultivated origin from this scope."
      evidence: "source observation, management history and linked lot acceptance"
    - id: quality_completeness
      applies_to: "nodes, sites and periods"
      requirement: "Account for active/bypassed nodes, purchased-feed burden, all contributors, unsuccessful trips, stock transitions, other goods, rework/rejects and service coverage; gaps remain explicit, not zero."
      evidence: "complete linked protocols and physical/financial service reconciliation"
    - id: quality_identity_units
      applies_to: "each concrete exchange"
      requirement: "Resolve actual identity and compatible property/unit/provider/gate/compartment; no generic service-kg or automatic water-vapour match. Disclose provisional screens, factor sources and uncertainty."
      evidence: "verified identity/support records and measurement/factor provenance"
    - id: quality_representativeness
      applies_to: "aggregated sites/seasons"
      requirement: "Use actual accepted-mass/source-service contribution weighting under comparable declared species/grade/gate and period scope; disclose exclusions and sensitivity. Do not generalize a limited sample to every wild species."
      evidence: "contributor roster, weighted source ledger and coverage statement"
    - id: dq_range_units_evidence
      applies_to: "concrete exchanges in variable-unit cards"
      requirement: "Establish any quantitative screen only after identifying its concrete exchange, reference property, explicit comparison unit and denominator, applicability, reviewed evidence and derivation. Preserve a unit conversion record that converts value and both bounds consistently; test the same physical quantity identically in equivalent units. Keep unresolved screens explicit and do not use them as amounts or completeness evidence."
      evidence: "linked collection protocols; property/unit and conversion records; compatible evidence and derivation; unresolved-screen register"
validation_rules:
  - rule_id: validate_origin
    applies_to: "source and reference"
    rule: "Require species/edible eligibility, untended-origin management evidence, site/season/lot, actual primary gate and declared maturity/grade/moisture. Marketing wild, forest location or legal access alone is insufficient; unknown origin remains a gap."
    source_ids:
      - unsd-cpc3-wild-berries
      - umaine-managed-wild-blueberries
  - rule_id: validate_mass
    applies_to: "all inventory rows"
    rule: "Use the same accepted net final lot denominator for every row; reference output is 1 kg, excluded tare/debris and other goods stay separate. Reconcile feed, berries, rejects, caught juice, identified moisture change and stocks per node; unexplained difference stays a data gap, not zero or invented water vapour."
    source_ids: []
  - rule_id: validate_route_handoffs
    applies_to: "processes and grade outputs"
    rule: "Evidence each active/bypassed process and every output destination. Preserve actual intermediate mass and map re-sort/return loops without repeated final goods. Reject processed or frozen reference states, and declare actual conditions rather than infer a universal fresh-holding regime."
    source_ids: []
  - rule_id: validate_attribution
    applies_to: "trip, site, period and infrastructure"
    rule: "Check complete contributor roster and species/season/gate compatibility, source contribution weights, unsuccessful trips, changeovers, asset periods, stocks, replacements and all output shares. Sum allocated records to the original measured total; document exclusions and representativeness limitations."
    source_ids: []
  - rule_id: validate_exchanges
    applies_to: "all concrete exchanges"
    rule: "Resolve actual material/service/substance, flow type, gate/provider/destination, property and unit before producing final exchanges. Verify fixed UUID details and support rows; semantic umbrellas are not concrete UUIDs. Preserve inclusive service boundaries and specific direct-emission evidence."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all provisional screens"
    rule: "Every Range except the 1..1 reference normalization is a broad provisional reasoned screening interval, not observations, substitute defaults, limits or a rejection threshold. Values outside trigger evidence review, never clipping. Zero requires documented inactive/absent exchange; unknown is missing."
    source_ids: []
published_dataset_profile:
  dataset_role: "Species/route/gate-qualified foreground data package for fresh whole wild berries."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Primary fresh berry supply inputs at the stated gate and actual comparable species/grade/origin, with downstream food processing modelled separately."
