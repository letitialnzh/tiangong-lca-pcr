measurement_rules:
  - id: net_reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh net accepted handover wood excluding tare and foreign matter. Only fuelwood_handover is fixed to 1 kg; all upstream feeds, prepared transfers and losses remain measured."
  - id: moisture_bridge
    applies_to: "wood mass"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Declare wet-basis fraction w or dry-basis ratio u from matched sample; dry mass = wet mass × (1 − w); w = u / (1 + u). Moisture, bark and sample condition must match; no universal drying loss."
  - id: volume_mass_bridge
    applies_to: "volume-based wood records"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep solid and stacked volume distinct. Measure lot-matched mass/volume and packing factor when needed; never use universal conifer density. Heating value is supplementary with matched moisture, not a mass-reference replacement."
  - id: carrier_units
    applies_to: "operation energy"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Retain original fuel, kWh, distance and service quantities; convert kWh to MJ with 3.6 exactly once when that exchange requires MJ. Fuel mass/volume-to-energy requires its actual documented factor."
  - id: provisional_range_evidence_policy
    applies_to: "all Ranges and actual exchanges"
    required_property_ref:
      name: "compatible property of each actual exchange"
      uuid: ""
    required_unit: "native unit of each actual exchange"
    rule: "All reasoned_estimate Ranges are provisional review prompts for this candidate method, not measured distributions, allowable losses, default quantities or emission factors. Never clip, backfill or force actual records to fit them; investigate state, units, boundary, stocks and evidence when exceeded. Before completing a data package, determine actual quantities and uncertainty from traceable measurements or applicable reviewed quantitative sources. Retain missing amounts, factors and flow identities as gaps that block completeness claims; passing a range screen is not evidence."
  - id: independent_reference_range
    applies_to: "non-reference Range upper limits"
    required_property_ref:
      name: "matched actual exchange property"
      uuid: ""
    required_unit: "matched actual exchange unit"
    rule: "reference_record_max must come from an independent, pre-frozen reviewed reference sample or historical period matched for source, route, state, unit and normalization basis. Record sample IDs, time window, sample size, derivation and uncertainty; never test a batch against its own maximum. Without an independent reference the upper limit is unresolved: retain the gap and check actual balances and measurements, without claiming a passed numerical upper-limit check."
