system_boundary:
  rules:
    - rule_id: source_partition
      applies_to: "source interfaces"
      rule: "Select one source representation for each traced mass: managed transfer, natural withdrawal or prior-attributed residue feed. Growth, harvest/removal and preparation are separate responsibilities; avoid overlap, including uncollected habitat residues."
      source_ids:
        - fao-fuelwood-harvesting
        - fao-forest-product-definitions
    - rule_id: declared_gate
      applies_to: "all operations"
      rule: "Include actual source, extraction, cutting/splitting, optional seasoning, sorting and loading before producer handover only. Exclude downstream transport, combustion and carbonisation. A charcoal-focused source informs unit operations only, not the final gate or its illustrative yields."
      source_ids:
        - fao-fuelwood-harvesting
        - fao-forest-product-definitions
    - rule_id: cohort_assets
      applies_to: "sites and phases"
      rule: "List every contributing parcel, management/harvest/seasoning period and shared road/equipment consumer. Record establishment, maintenance, replacement and closure where relevant; allocate actual asset services over recorded use, not a default lifetime."
      source_ids:
        - fao-fuelwood-harvesting
        - fao-forest-product-definitions
    - rule_id: boundary_direct_release_coverage
      applies_to: "stand_management; wood_collection; primary_extraction; wood_preparation; handover_sorting"
      rule: "Reconcile on-site combustion, actual applications and fugitive releases/leaks at every activated node through unique activity-substance-receiving-medium records in cp_direct_release_stand_management; cp_direct_release_wood_collection; cp_direct_release_primary_extraction; cp_direct_release_wood_preparation; cp_direct_release_handover_sorting. Upstream production of purchased fuel or chemicals does not replace emissions from their use on site; verify coverage and avoid double counting the same activity inside a supplier service. Evidence must support non-activity; missing data are not zero. This obligation does not expand the existing product gate or downstream-use boundary and does not presume combustion, fertilization, chemicals or equipment occur."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Identified managed cohort, declared natural source or traced primary harvest residues with explicit prior burden handoff"
  starting_condition_role: "Foreground source boundary, not assumed zero-burden cut-off"
