  calculation_rules:
    - id: reference_normalization
      applies_to: "all inventory rows"
      rule: "Preserve original totals and unit bridges; attribute each source/output/period share once; inventory per 1 kg reference flow = attributable exchange total / matched net accepted handover kg. The reference card alone reports 1 kg."
      inputs:
        - "source totals"
        - allocation
        - cp_handover
      output: "per-reference exchange"
      source_ids:
        - fao-fuelwood-harvesting
        - fao-forest-product-definitions
    - id: paired_wood_balance
      applies_to: "wood transfers and losses"
      rule: "Reconcile dry wood, water, bark, foreign matter, stock and destinations using paired records. Wet net mass changes are not automatically dry-matter loss or emissions."
      inputs:
        - cp_source_at_wood_collection
        - cp_source_at_stand_management
        - cp_preparation
        - cp_handover
      output: "reconciled mass/water ledger"
      source_ids:
        - fao-fuelwood-harvesting
        - fao-forest-product-definitions
    - id: carbon_uptake_reconciliation
      applies_to: "Actual biogenic CO2 uptake"
      rule: "Record CO2 uptake only when the declared inventory method requires it and independent evidence supports it. Net carbon-stock change is not uptake: reconcile the same dry-carbon pools and period as C_open + C_atmosphere + C_nonair_in = C_close + C_harvest_out + C_other_out. Independently record non-atmospheric inputs, harvest/transfers out and evidenced respiration/other releases; cancel internal pool transfers once. Missing terms cannot be replaced by closing minus opening stock. Convert only method-verified atmospheric carbon corresponding to CO2 using 44/12, accounting for other carbon gases separately. Do not duplicate upstream uptake or assign an automatic negative credit."
      inputs:
        - cp_carbon
        - "independent pool/transfer/release records"
        - "declared inventory method"
      output: "evidenced CO2 uptake and unresolved gaps"
      source_ids: []
    - id: site_weighting
      applies_to: "contributing sites"
      rule: "Sum attributable exchange totals and qualified handover kg over traced comparable lots; compute their quotient, not an average of site ratios. Preserve excluded/nonrepresentative site disclosures."
      inputs:
        - "site records"
        - cp_handover
      output: "representative per-reference exchanges"
      source_ids:
        - fao-fuelwood-harvesting
        - fao-forest-product-definitions
    - id: calculate_direct_release_ledger
      applies_to: "stand_management; wood_collection; primary_extraction; wood_preparation; handover_sorting"
      rule: "For each unique event, substance and medium, obtain raw release E from measurement or the cited applicable method using activity A and a compatible factor EF; use E = A * EF only for a genuinely simple-factor method, after checking units and abatement scope. Do not add different substances/media; retain an unallocated raw-release ledger. Divide attributed burden totals once by matched positive final reference quantity R; do not renormalize final-reference intensities or allocate a shared event twice. Unexplained material residuals are not automatically emissions and missing factors are not zero."
      inputs:
        - cp_direct_release_stand_management
        - cp_direct_release_wood_collection
        - cp_direct_release_primary_extraction
        - cp_direct_release_wood_preparation
        - cp_direct_release_handover_sorting
        - "existing emission cards"
        - "supplier coverage"
        - "reference quantity"
      output: "Node/substance/medium-specific raw and attributed amounts and unresolved gaps"
      source_ids: []
  data_quality_requirements:
    - id: traceability
      applies_to: "all lots"
      requirement: "Record species, form, source, site, dates, gate and upstream boundaries; mixed unidentified material is not the conifer reference"
      evidence: "cp_source_at_wood_collection; cp_source_at_stand_management; cp_handover"
    - id: measurement_coverage
      applies_to: "mass/water/energy"
      requirement: "Calibrated net mass and matched moisture; missing conversions/zero evidence/identity details are disclosed gaps, not assumed values"
      evidence: "cp_preparation; cp_operation_at_stand_management; cp_operation_at_wood_collection; cp_operation_at_primary_extraction; cp_operation_at_wood_preparation; cp_operation_at_handover_sorting"
    - id: representativeness
      applies_to: "sites and periods"
      requirement: "List all contributors, weighting, harvest/seasoning conditions, stock closure and included/excluded asset phases; retain uncertainty and sensitivity"
      evidence: "site/cohort ledger"
validation_rules:
  - rule_id: validate_reference
    applies_to: "fuelwood_handover"
    rule: "Require one final 1 kg net as-received conifer raw-fuelwood reference at actual producer gate, qualifiers and concrete identity evidence; neither drying feed nor internal transfer is fixed to 1 kg."
    source_ids:
      - fao-fuelwood-harvesting
      - fao-forest-product-definitions
  - rule_id: validate_route
    applies_to: "source and technology"
    rule: "Validate actual source/technology evidence and parent/delta records; no duplicate managed and natural/residue input, no invented omitted operation, no manufactured chips/charcoal/consumer delivery in this boundary."
    source_ids:
      - fao-fuelwood-harvesting
      - fao-forest-product-definitions
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require same-reference bilingual and projected bases, real collection links and exactly-once original-unit conversion/attribution. Require every actual concrete exchange from umbrella cards, with correct direction, type, property/unit and identity confirmation."
    source_ids:
      - fao-fuelwood-harvesting
      - fao-forest-product-definitions
  - rule_id: validate_balance
    applies_to: "lots and periods"
    rule: "Reconcile accepted/diverted/rejected/rework/retained stocks, moisture and dry matter with actual destinations; no unexplained biomass yield or universal density/LHV, and no unsupported carbon credit."
    source_ids:
      - fao-fuelwood-harvesting
      - fao-forest-product-definitions
  - rule_id: validate_attribution
    applies_to: "cohorts/sites/assets"
    rule: "Check complete output sets, common-burden decision, sum-to-one shares, site weights, source/phase/event indexing and no double-counted shared infrastructure or inclusive service. Unknown actual state or missing evidence blocks the corresponding dataset claim."
    source_ids:
      - fao-fuelwood-harvesting
      - fao-forest-product-definitions
  - rule_id: validate_direct_release_coverage
    applies_to: "stand_management; wood_collection; primary_extraction; wood_preparation; handover_sorting"
    rule: "For every activated node, reconcile its activity list against cp_direct_release_stand_management; cp_direct_release_wood_collection; cp_direct_release_primary_extraction; cp_direct_release_wood_preparation; cp_direct_release_handover_sorting: each relevant event must have quantified concrete elementary exchanges, evidenced upstream-service coverage, or evidenced absence of the activity. Missing/unknown is not zero and blocks data-package completeness. Check each actual substance/medium amount, method/factor units, concrete UUID and existing-card/service coverage for omissions or duplication; empty groups, purchased-electricity upstream emissions or another node's single CO2 card do not replace this node's on-site reconciliation. Shared-asset services must not create duplicate physical release events."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Raw conifer fuelwood producer-gate supply modelling with stated form, moisture, source and attribution"
  excluded_use: "Non-conifer substitution; manufactured fuels; delivered heat/electricity; unsupported full forest carbon or sustainability claims"
  required_metadata: "Species/form/bark/moisture; origin and site mix; source/operation/gate; reference lot; periods/stocks; upstream/asset scope; allocation and unit bridges"
  required_quality_disclosure: "Identity/measurement/source gaps, excluded phases, concrete exchange coverage, range evidence, stock closure, uncertainty and sensitivity"
  update_trigger: "Changed source/technology/gate, form/moisture, attribution, assets, supplier identity or better measurement/evidence"
data_sources:
  - id: "unsd-cpc-fuelwood-conifer"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 03131, Fuel wood of coniferous wood; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/03131"
    used_for: "Official category context; retrieved 2026-10-08 through reviewed classification source"
  - id: "fao-fuelwood-harvesting"
    type: "handbook"
    reference: "FAO, Simple technologies for charcoal making, Chapter 3: Harvesting and transporting fuelwood; https://www.fao.org/4/x5328e/x5328e04.htm"
    used_for: "Harvest/movement/preparation decomposition only; retrieved 2026-10-08; illustrative charcoal/hardwood quantities not adopted"
  - id: "fao-forest-product-definitions"
    type: "official_guidance"
    reference: "FAO, Classifications and definitions, Production and trade of wood-based forest products; https://www.fao.org/4/x2613e/x2613e2w.htm"
    used_for: "Raw fuelwood versus industrial roundwood/chips/charcoal; retrieved 2026-10-08; statistical equivalents not used as conversion factors"
