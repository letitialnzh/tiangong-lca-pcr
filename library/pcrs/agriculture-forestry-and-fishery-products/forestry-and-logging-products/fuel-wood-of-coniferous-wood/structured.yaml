allocation_rules:
  - rule_id: attribution_priority
    applies_to: "intended outputs"
    rule: "First subdivide independently measured source/operations. For inseparable common burdens document a physical causal relation using compatible dry wood/biomass or service records; if unsupported, use justified economic allocation with actual prices/period and sensitivity. No automatic zero burden for fuelwood/residues or substitution credit."
    source_ids:
      - fao-fuelwood-harvesting
      - fao-forest-product-definitions
  - rule_id: output_partition
    applies_to: "stock and rejects"
    rule: "Enumerate fuelwood, industrial wood, diverted products, waste exits and retained stock by lot and handover. Internal transfer, rework to wood_preparation and stock movement are not extra sales; retain their burdens and count eventual accepted dispatch once."
    source_ids:
      - fao-fuelwood-harvesting
      - fao-forest-product-definitions
  - rule_id: period_shared_assets
    applies_to: "cohorts and consumers"
    rule: "Assign growth/management and shared road/equipment services across recorded cohorts, sites, consuming nodes and periods with an explicit denominator and sum-to-one shares. Link maintenance/changeovers/replacement/closure once; do not annualize and allocate the same burden again at dispatch."
    source_ids:
      - fao-fuelwood-harvesting
      - fao-forest-product-definitions
