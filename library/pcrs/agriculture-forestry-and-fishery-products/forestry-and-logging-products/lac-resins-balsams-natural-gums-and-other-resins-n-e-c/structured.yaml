allocation_rules:
  - rule_id: subdivision_first
    applies_to: "all intended output grades and host coproducts"
    rule: "Prefer measured process/lot subdivision. Enumerate actual primary product grades, saleable host wood and retained/sold broodlac with quantity, quality, boundary and receiver. Grade outputs that leave independently are products; discarded material is waste, not an automatic coproduct credit."
    source_ids: []
  - rule_id: common_host_burdens
    applies_to: "shared host production and seasonal outputs"
    rule: "Attribute remaining common host/asset burdens using documented causal service, area-time or use records where defensible. If inseparable products lack a defensible physical relation, use contemporaneous site-gate economic shares with price/quantity evidence and sensitivity; never prescribe one mass split or price for all gums, resins and lac."
    source_ids: []
  - rule_id: period_attribution
    applies_to: "establishment; productive seasons; replacement and shared assets"
    rule: "Link establishment and maintenance to actual productive and nonproductive periods, host replacement and termination, and future output expectations with sensitivity. A harvest may not carry both its full establishment cost and a second annualized copy. No universal host lifetime, gum yield or lac cycle is prescribed."
    source_ids: []
  - rule_id: rework_retention
    applies_to: "primary_preparation; producer_dispatch"
    rule: "Keep internal rework/returns with their originating burdens and record repeated energy/material use; net final accepted output excludes rejects and stock retained for a later period. Record waste treatment responsibility explicitly; do not assume substitution credits."
    source_ids: []
  - rule_id: common_service_once
    applies_to: "shared roads pumps tools stores and changeovers"
    rule: "Register all consuming nodes and periods, meter/subdivide where possible and distribute the one common total using evidenced services. Attribute campaign cleaning and changeovers once to actual lots; compatible output totals reconcile to the denominator before reference normalization."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_host_management
      process_id: "host_management"
      flow_role: "management inputs land and shared assets"
      record_type: "host/plot and period ledger"
      raw_fields: "host species; plot; management status; area; land class; establishment and replacement dates; input identities/formulations; native quantity/unit; water source; productive periods; all outputs; shared use; emissions method; attribution evidence; linked dispatch net mass"
      collection_method: "Trace actual plot/cycle activity records, calibration, invoices and land-use history; retain original area/cycle/service bases and convert their attributed totals exactly once to the net accepted dispatch denominator. Record actual direct abstraction/transformation separately where applicable."
      unit: "actual native units; normalized card units"
      frequency: "each event and reporting period"
      temporal_coverage: "complete establishment and attributable productive periods"
      site_scope: "declared host plots and services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "traceability; allocation ledger; independent total reconciliation"
    - protocol_id: cp_plant_collection
      process_id: "plant_collection"
      flow_role: "plant exudate collection and direct emissions"
      record_type: "collection lot record"
      raw_fields: "botanical identity; natural/tapped method; dates; collected gross/tare/net mass; water/impurity state; stimulus formulation; native inputs/energy units; losses; destination; emissions substances/medium/method; linked dispatch mass; source_handoff_key; matched_output_receipt_rows; own_or_purchased; component_basis"
      collection_method: "Weigh and identify each collected lot and reconcile tools, materials, fuel and retained stock; preserve raw collection-unit and seasonal data, apply evidenced allocation then divide by matched accepted dispatch net mass exactly once. Retain unallocated source and collected-material physical ledgers under cp_biological_source_plant_collection; burden attribution must not reduce those physical quantities."
      unit: "actual native units; normalized card units"
      frequency: "each tapping/collection event and lot"
      temporal_coverage: "complete declared season and dispatch lots"
      site_scope: "declared source sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scales; source/lot logs; raw-to-final reconciliation"
    - protocol_id: cp_lac_collection
      process_id: "lac_collection"
      flow_role: "inoculation harvest broodlac and residues"
      record_type: "host/cycle and harvest record"
      raw_fields: "lac insect strain; host species/plot; natural or inoculated status; broodlac identity/mass; inoculation and harvest dates; twig/impurity basis; wet/net mass; surviving/retained brood; energy/materials; destination; emissions; dispatch link; source_handoff_key; matched_output_receipt_rows; own_or_purchased; component_basis"
      collection_method: "Identify actual host/cycle and weigh crude harvest plus broodlac separately; natural collection records zero inoculation only with evidence. Retain raw host/cycle bases and attribute quantities then normalize exactly once to linked net accepted dispatch mass. Retain unallocated source and collected-material physical ledgers under cp_biological_source_lac_collection; burden attribution must not reduce those physical quantities."
      unit: "actual native units; normalized card units"
      frequency: "each inoculation and harvest lot"
      temporal_coverage: "full recorded inoculation-to-harvest cycle or natural collection period"
      site_scope: "declared hosts/sites"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "brood and harvest reconciliation; scales; cycle linkage"
    - protocol_id: cp_primary_preparation
      process_id: "primary_preparation"
      flow_role: "raw/prepared material grades wastes water and volatile losses"
      record_type: "preparation lot ledger"
      raw_fields: "incoming state/mass; process and bypass flags; incoming/outgoing water and impurity tests; retained volatile constituents; opening/closing stocks; accepted grades; rework; solids; wastewater; energy/material native units; emissions substance/air; actual treatment recipient; dispatch mass"
      collection_method: "Weigh inputs, outputs and stock; meter actual supplies and separate water-specific versus other volatile tests. Preserve raw preparation batch balances and uncertainty; allocate shared operations and normalize totals once to matched net accepted dispatch mass. Unexplained loss remains a gap."
      unit: "actual native units; normalized card units"
      frequency: "each preparation run and changeover"
      temporal_coverage: "whole declared preparation and storage period"
      site_scope: "declared producer preparation site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "mass/water/volatile/impurity closure; tests; meter records; waste tickets"
    - protocol_id: cp_producer_dispatch
      process_id: "producer_dispatch"
      flow_role: "accepted reference output packaging receipts and rejects"
      record_type: "lot dispatch acceptance ledger"
      raw_fields: "named identity/form/grade; source lot; preparation/bypass; gross; tare; accepted net mass; water/volatile/impurity method and result; receipts; opening/closing stocks; other outputs; reject destination; packaging new/reuse records; native energy units; gate/date; attribution; emissions"
      collection_method: "Calibrated weighing or matched traceable gross-minus-tare acceptance records; exclude packaging and rejected mass. Preserve original lot totals and carrier units, reconcile receipts plus opening stock against all dispatches, losses and closing stock, and normalize attributed totals exactly once to accepted net reference-product mass."
      unit: "actual native units; kg accepted product; normalized card units"
      frequency: "each dispatch and accounting period"
      temporal_coverage: "complete declared dispatch period matched to source cycle"
      site_scope: "actual producer dispatch gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated scales; matched tare/gate/grade records; stock closure; packaging reuse evidence"
    - protocol_id: cp_biological_source_plant_collection
      process_id: "plant_collection"
      flow_role: "Biological source to collected material and first receipt"
      record_type: "Linked source, harvest and receipt record"
      raw_fields: "handoff_key; host/source_id; own_or_purchased; managed_or_natural; lot/cycle/date; output_row_id; receiving_process/row; gross/tare/net_mass; water/volatile/impurity_basis; attached_bark/twigs; opening/closing_collected_stock; source_formation/removal_evidence; losses; uncertainty"
      collection_method: "Use source/host surveys, collection weighing and matched receipts to record actual primary material removed. Report total biological formation only from independent observations or an applicable model, never by forcing a product-balance residual. Distinguish the collected plant exudate from attached bark/twigs, water and other impurities, retaining uncertainty; broodlac and inoculation records apply only to lac_collection. Uncollected hosts and exudates remain source context or separate stock ledgers, not extra external products."
      unit: "kg on matched wet/dry/component bases"
      frequency: "Each lot and collection cycle"
      temporal_coverage: "Matched source cycle, preparation and dispatch periods"
      site_scope: "Actual host/source and receiving node"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated weights; matched source and receipt; component tests; gap register"
    - protocol_id: cp_biological_source_lac_collection
      process_id: "lac_collection"
      flow_role: "Biological source to collected material and first receipt"
      record_type: "Linked source, harvest and receipt record"
      raw_fields: "handoff_key; host/source_id; own_or_purchased; managed_or_natural; lot/cycle/date; output_row_id; receiving_process/row; gross/tare/net_mass; water/volatile/impurity_basis; broodlac_in/out; attached_twigs/insect_matter; opening/closing_collected_stock; source_formation/removal_evidence; losses; uncertainty"
      collection_method: "Use source/host surveys, collection weighing and matched receipts to record actual primary material removed. Report total biological formation only from independent observations or an applicable model, never by forcing a product-balance residual. Distinguish pre-existing broodlac, newly formed material and attachments in harvested lots, retaining uncertainty. Uncollected hosts and exudates remain source context or separate stock ledgers, not extra external products."
      unit: "kg on matched wet/dry/component bases"
      frequency: "Each lot and collection cycle"
      temporal_coverage: "Matched source cycle, preparation and dispatch periods"
      site_scope: "Actual host/source and receiving node"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrated weights; matched source and receipt; component tests; gap register"
  calculation_rules:
    - id: normalize_recorded_totals
      applies_to: "all inventory rows"
      rule: "Preserve raw quantity, original unit and plot/cycle/batch/service basis. Establish attributable totals and convert compatible numerator units with recorded factors, then divide once by the matched accepted net dispatch mass in kg. A quantity already per 1 kg reference flow is not divided again. Preserve all actual intermediates and nonreference products; the accepted final output alone becomes 1 kg."
      inputs:
        - "linked collection protocols"
        - "allocation evidence"
        - "matched dispatch denominator"
      output: "actual exchange quantities per 1 kg reference flow"
      source_ids: []
    - id: reconcile_material_states
      applies_to: "Post-collection preparation, transfers and dispatch"
      rule: "Use measured collected material from the source-handoff ledger or purchased primary material as the first material receipt. Reconcile receipts, added water and opening stock against accepted product, other products, solid waste, transferred wastewater, measured water/volatile releases and closing stock on matched wet/dry/component bases. Biological formation has its own boundary; auxiliary inputs do not replace collected feed and source removal must not be counted twice on aggregation. Retain uncertainty and residuals, not invented pure-polymer closure, zero differences or carbon uptake; cancel internal transfers once at whole-package aggregation."
      inputs:
        - cp_biological_source_plant_collection
        - cp_biological_source_lac_collection
        - "matched preparation/dispatch measurements and component tests"
      output: "reconciled mass and component balance with gaps"
      source_ids: []
    - id: carbon_and_emission_evidence
      applies_to: "host carbon and direct air emissions"
      rule: "Record actual carbon origin and method-supported substance-specific emissions for actual activity. Use measured composition or applicable independently cited methods when calculating retained/exported carbon; do not apply a universal carbon fraction, automatically net host uptake against product carbon, or credit indefinite storage. Attach factors and provenance to the concrete dataset when used."
      inputs:
        - "actual activity"
        - "component analysis"
        - "cited applicable factors"
      output: "disclosed substance/medium emissions and carbon basis"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all concrete exchanges"
      requirement: "Resolve actual biological/material identity, flow type, state, destination and property/unit before dataset publication; a broad category or carrier role is not a fixed UUID."
      evidence: "concrete flow detail and support verification; lot records"
    - id: measurement_quality
      applies_to: "primary product and transfers"
      requirement: "Preserve calibrated net measurement, water/volatile/impurity method and uncertainty; no universal grade/moisture/yield conversion."
      evidence: "matched raw records and test methods"
    - id: coverage_quality
      applies_to: "all nodes"
      requirement: "Record zero/not-applicable with actual evidence; unknown quantities or routes remain gaps, not zeros. Provisional ranges below are replaceable QA screens, never observed values or mandatory limits."
      evidence: "reconciliation; completeness ledger; actual process activation"
    - id: period_asset_quality
      applies_to: "hosts and shared services"
      requirement: "Cover relevant host phases, cycles, stock changes, asset consumers and replacement/termination assumptions with sensitivity."
      evidence: "period/asset attribution and independent totals"
    - id: scope_quality
      applies_to: "downstream consumers"
      requirement: "Disclose primary-only partial classification coverage, actual gate/form/grade and upstream exclusions; not valid for refined shellac or chemical proxy datasets."
      evidence: "scope and gate metadata"
validation_rules:
  - rule_id: validate_final_reference
    applies_to: "primary_product_dispatch"
    rule: "Require one qualified final product output of 1 kg net as-received reference product excluding packaging; its name, link, mass property/unit and qualifiers align with section 3. Intermediate/raw receipts remain measured, not fixed."
    source_ids: []
  - rule_id: validate_source_route
    applies_to: "source and host nodes"
    rule: "Verify each lot's actual plant or lac source, management and inoculation activation plus primary-preparation bypass/operation records; do not apply all alternatives or unknown-state defaults."
    source_ids:
      - fao-plant-exudate-production
      - fao-lac-primary-states
  - rule_id: validate_balance
    applies_to: "all material handoffs"
    rule: "Reconcile wet/net/dry/component quantities, water, natural volatile loss, impurities, other grades, waste, retained brood/rework and stock; disclose residuals and measurement uncertainty. Never label all loss as water or waste as sold product."
    source_ids: []
  - rule_id: validate_attribution
    applies_to: "periods grades infrastructure and campaigns"
    rule: "Require complete intended output and service consumers plus period/phase boundaries, replacement/termination, causal subdivision or evidenced residual allocation, and no duplicate host, shared-asset, cleaning, stock or returned-material burdens."
    source_ids: []
  - rule_id: validate_normalization
    applies_to: "all amounts and collection protocols"
    rule: "Require a matched accepted dispatch denominator, documented raw bases and conversions, and exactly-once attribution/normalization. All amounts and protocol reporting use per 1 kg reference flow. Range screens are not default values or evidence that the mass balance is satisfied."
    source_ids: []
  - rule_id: validate_identity_emissions
    applies_to: "concrete exchanges and direct emissions"
    rule: "Verify actual fixed identities and support units before final dataset publication; expand variable roles into concrete materials/substances and destinations. Species-resolved air emissions and explicit fuel/service combustion scope prevent invented or duplicated exhaust."
    source_ids: []
  - rule_id: validate_scope_state
    applies_to: "reference product and downstream use"
    rule: "Reject interchange of primary gum/resin/lac with rubber, industrial rosin/turpentine, extracted shellac or finished formulation; primary-only methodology does not imply exact whole-leaf coverage. No automatic sequestration or storage credit."
    source_ids:
      - unsd-cpc-natural-resins
      - fao-lac-primary-states
  - rule_id: validate_biological_source_handoff
    applies_to: "host_management; plant_collection; lac_collection; primary_preparation; producer_dispatch"
    rule: "Each collected output lot requires an explicit source and matched downstream receipt; purchased lots must not be recounted as own-site collection. Reconcile raw collected quantities with physical handoffs, not all biological output against auxiliary inputs. Do not invent formation, resource flows or CO2 uptake from unexplained residuals. Unknown source or handoff blocks a complete data package; absent evidence for total formation or uncollected stock must not be represented as a closed source balance."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for one actual named and qualified primary exudate or crude lac product at producer dispatch"
  downstream_use: "secondary_dataset; background_dataset for the declared matching primary product supply"
  allowed_use: "Actual biological source, primary state, gate, grade and measurement-compatible product supply; traceable aggregated lots with disclosed shares"
  excluded_use: "Whole CPC leaf automatic substitution; generic pure resin; extracted/refined shellac; rubber; manufactured formulations; delivered end use; unqualified species/state mixing"
  required_metadata: "Identity/host/strain; origin; route and management; primary form/grade; water/volatile/impurity and net basis; periods and gate; stock; intended outputs; allocation; shared assets; unit conversions; upstream datasets"
  required_quality_disclosure: "Coverage gaps, unresolved identities, calibration/tests, component balance residuals, temporal representativeness, allocation assumptions, replaceable reasoned ranges and scope exclusions"
  update_trigger: "Changed biological origin, production/primary-preparation route, product form or quality, gate, management period, supplier data, component measurement or allocation evidence"
data_sources:
  - id: "unsd-cpc-natural-resins"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 subclass 03219, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/03219 ; accessed 2026-10-08"
    used_for: "Classification title/context; no detailed note and no universal primary-only inclusion claim"
  - id: "fao-plant-exudate-production"
    type: "official_guidance"
    reference: "FAO Chapter VIII Non-wood forest products, https://www.fao.org/4/t0122e/t0122e0d.htm ; accessed 2026-10-08"
    used_for: "Plant natural exudation/tapping and distinct gum/resin identities"
  - id: "fao-tapping-route"
    type: "official_guidance"
    reference: "FAO Sustainable utilization of gum and resin by improved tapping technique in some species, https://www.fao.org/4/y4496e/Y4496E29.htm ; accessed 2026-10-08"
    used_for: "Conditional tapping/stimulant practices, not a universal chemical recipe or amount"
  - id: "fao-lac-primary-states"
    type: "official_guidance"
    reference: "FAO International trade in non-wood forest products: IX Insect products, https://www.fao.org/4/x5326e/x5326e0c.htm ; accessed 2026-10-08"
    used_for: "Natural versus inoculated lac sources; crude sticklac, cleaned seedlac and extracted shellac distinction"
  - id: "fao-gum-primary-handling"
    type: "official_guidance"
    reference: "FAO Microfinance and forest-based small-scale enterprises: gum arabic, https://www.fao.org/4/a0226e/a0226e10.htm ; accessed 2026-10-08"
    used_for: "Gum host care, cleaning/grade and packaging example; no extrapolation of season, grade threshold or output factors to other products"
