measurement_rules:
  - id: reference_net_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Obtain accepted net dispatch mass by calibrated weighing or traceable matched gross-minus-tare records, excluding packaging; use cp_producer_dispatch. Report all inventory per 1 kg reference flow."
  - id: material_state_bridge
    applies_to: "collected_exudate; collected_lac; raw_primary_material; prepared_primary_material; dispatch_product_received"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve raw wet/net/gross measurements, matched water test and impurity records; derive dry-matter or other state bridges only from the same identified lot with uncertainty. No universal fresh-to-dry, sticklac-to-resin or species conversion."
  - id: volatile_water_separation
    applies_to: "evaporated_water; natural_volatile_emissions"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Distinguish specific water loss, natural volatile loss, removed impurities, accepted product and residual stock; loss-on-drying alone cannot establish water or one emitted substance."
  - id: carrier_units
    applies_to: "energy carrier rows and variable material roles"
    required_property_ref:
      name: "Actual carrier property"
      uuid: ""
    required_unit: "actual recorded unit"
    rule: "Retain each concrete carrier/material identity and original units; aggregate only equivalent quantities after explicit traceable conversions. Record supplied energy versus fuel and combustion burdens without overlap."
  - id: provisional_range_evidence_policy
    applies_to: "all Ranges and actual exchanges"
    required_property_ref:
      name: "compatible property of each actual exchange"
      uuid: ""
    required_unit: "native unit of each actual exchange"
    rule: "All reasoned_estimate Ranges are provisional review prompts for this candidate method, not measured distributions, allowable losses, default quantities or emission factors. Never clip, backfill or force actual records to fit them; investigate state, units, boundary, stocks and evidence when exceeded. Before completing a data package, determine actual quantities and uncertainty from traceable measurements or applicable reviewed quantitative sources. Retain missing amounts, factors and flow identities as gaps that block completeness claims; passing a range screen is not evidence."
process_map:
  - id: host_management
    name: "Managed host production and maintenance"
    inclusion: "conditional"
    inclusion_condition: "Actual establishment or management of hosts for plant exudate or lac production; otherwise record existing natural host context without invented cultivation."
    role: "managed biological production"
    quantitative_reference: "per 1 kg reference flow; retain raw plot/cycle/lot basis in collection records"
  - id: plant_collection
    name: "Plant exudate tapping or natural collection"
    inclusion: "conditional"
    inclusion_condition: "Plant-origin exudate lot; disclose tapping or natural exudation and exclude lac-insect route for that same material."
    role: "harvest capture"
    quantitative_reference: "per 1 kg reference flow; retain raw plot/cycle/lot basis in collection records"
  - id: lac_collection
    name: "Lac host inoculation and crude lac harvest"
    inclusion: "conditional"
    inclusion_condition: "Lac-insect secretion lot; deliberate inoculation only when evidenced; natural lac collection bypasses inoculation."
    role: "harvest capture"
    quantitative_reference: "per 1 kg reference flow; retain raw plot/cycle/lot basis in collection records"
  - id: primary_preparation
    name: "Primary cleaning grading and preparation"
    inclusion: "conditional"
    inclusion_condition: "Actual simple pre-dispatch cleaning, sorting or drying; bypass unchanged material when no operation occurs; industrial refining is excluded."
    role: "primary conditioning and grading"
    quantitative_reference: "per 1 kg reference flow; retain raw plot/cycle/lot basis in collection records"
  - id: producer_dispatch
    name: "Producer storage protection and dispatch"
    inclusion: "required"
    inclusion_condition: "Every accepted reference lot; packaging and storage only to the extent actually performed."
    role: "producer handover"
    quantitative_reference: "per 1 kg reference flow; retain raw plot/cycle/lot basis in collection records"
