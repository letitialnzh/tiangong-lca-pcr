  classification_refs: "cpc:3.0:03219; narrower primary-only scope"
  covered_products: "Identified primary woody-plant natural exudate gums, resins, balsams, gum-resins and oleoresins; crude lac with declared sticklac or mechanically cleaned unextracted state"
  excluded_products: "Rubber-like gums; natural rubber; synthetic/modified resins; extracted seed/seaweed/microbial gums; industrially extracted/refined shellac; distilled rosin/turpentine; finished formulations"
  representative_product: "One named and qualified primary gum, resin, balsam or crude lac lot at its actual producer dispatch gate, never a generic pure-resin proxy"
  production_route: "Actual managed or natural host context; plant tapping/natural exudate collection OR lac-insect collection with evidenced inoculation; actual optional simple preparation; producer dispatch"
  market_state: "Actual primary as-received product with recorded form, grade, water, volatile constituents and incidental impurities; packaging excluded from product mass"
functional_unit:
  what: "Actual named qualified primary natural gum, resin, balsam or crude lac at producer dispatch"
  how_much: "1 kg net as-received product excluding packaging"
  how_well: "Actual biological identity, host, origin, form, grade, water/volatile/impurity basis and declared primary dispatch gate"
  how_long_or_cycle: "Declared tapping/collection season or lac inoculation-to-harvest cycle and dispatch accounting period; separately link host establishment, maintenance, recovery and replacement periods"
  reference_flow_link: "primary_product_dispatch"
system_boundary:
  rules:
    - rule_id: source_selection
      applies_to: "plant_collection; lac_collection"
      rule: "Select exactly the evidenced source for each material lot; a blended dataset must retain separately traceable source contributions, not assume each kg passed through both routes. Collection removes material from its biological context and is separately recorded from host management and later preparation."
      source_ids:
        - fao-plant-exudate-production
        - fao-lac-primary-states
    - rule_id: primary_gate
      applies_to: "all processes"
      rule: "Include actual attributable operations before producer dispatch only. Simple raw-to-prepared state changes do not imply extraction or refining. Raw lac, mechanically cleaned unextracted lac and extracted shellac are not interchangeable states."
      source_ids:
        - fao-lac-primary-states
        - fao-gum-primary-handling
    - rule_id: host_period_boundary
      applies_to: "host_management"
      rule: "Declare host establishment, productive seasons, maintenance, replacement/termination and actual land occupation/transformation. Link host state to collection by plot/host/cycle, not an invented saleable host-material exchange."
      source_ids:
        - fao-gum-primary-handling
    - rule_id: inventory_interface
      applies_to: "all internal transfers"
      rule: "Match each material handoff to source/receiving records with state, mass and period; consolidate internal transfers only at package aggregation. Purchased supplied water is not simultaneously direct environmental abstraction; treatment transfer is not direct environmental discharge."
      source_ids: []
    - rule_id: operational_emissions
      applies_to: "energy and host material roles"
      rule: "For actual on-site combustion or chemical application, enumerate attributable direct emissions by concrete substance, medium and method; do not omit them, invent generic gas factors, or duplicate combustion already included in an energy service dataset."
      source_ids: []
    - rule_id: shared_asset_boundary
      applies_to: "host_management; primary_preparation; producer_dispatch"
      rule: "Record shared roads, tools, pumps, grading equipment and stores by consuming node and service period; include attributable establishment/maintenance or disclose exclusions and materiality, without duplicate shared totals."
      source_ids: []
    - rule_id: biological_source_handoff
      applies_to: "host_management; plant_collection; lac_collection; primary_preparation; producer_dispatch"
      rule: "Use cp_biological_source_plant_collection; cp_biological_source_lac_collection to link every measured collected lot to its host/source, collection output card and first receiving node. Biologically secreted material is not simply manufactured from tools, fuel or inoculation broodlac; do not force crude-product mass closure against these auxiliary inputs. Own-source formation/removal records are source-explicit physical ledgers, not fabricated purchased products, unverified generic elementary flows or automatic carbon uptake. Purchased primary material uses its supplier receipt once, without a second current-site source removal."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual existing natural host stand, attributable managed host establishment/maintenance context, or purchased identified primary material with its supplier boundary"
  starting_condition_role: "Declared upstream host-production or supplied-primary-material context, not a zero-burden assumption"
  product_classification_scope: "Reviewed primary-only partial CPC 03219 methodology; excluded refinement and other gum classes require their own methodology"
  recursive_input_rule: "Record purchased or retained same-category primary material/broodlac by actual supplier or prior cycle and handoff; stop recursion at that declared interface and attach its upstream dataset or a disclosed unresolved gap"
  upstream_dataset_requirement: "Concrete verified background datasets for supplied materials, carriers, water, treatment and purchased primary inputs; attributable host-production history where material"
  disclosure: "Source/host and rights; management history and land use; route activation; start/end dates and gate; stock and internal-transfer boundaries; actual conditioning; excluded refining; allocation, infrastructure and upstream gaps"
