  calculation_rules:
    - id: accepted_net
      applies_to: "nonconifer_fuelwood_handover"
      rule: "Derive accepted net as-received wood from actual gross mass minus measured tare and foreign matter; retain declared bark and water. Use only actually accepted qualified fuelwood as final denominator."
      inputs:
        - cp_dispatch
      output: "accepted net wood mass"
      source_ids:
        - unsd-nonconifer-fuelwood
    - id: normalize_actual_records
      applies_to: "all inventory rows"
      rule: "Report attributable actual exchange quantity per 1 kg reference flow after actual-unit conversion and output/period attribution; divide by matched accepted net dispatch mass exactly once. Retain original basis and intermediate transfers. No fixed internal yield."
      inputs:
        - cp_management
        - cp_harvest
        - cp_residue
        - cp_preparation
        - cp_dispatch
        - cp_shared
        - cp_emissions_at_harvest_removal
        - cp_emissions_at_primary_preparation
      output: "reference-basis exchanges"
      source_ids:
        - fao-fuelwood-harvesting
    - id: matched_wood_balance
      applies_to: "wood transfers and seasoning"
      rule: "For each matched lot reconcile wet wood, water, dry wood, bark, foreign matter, retained stock, rejects and product destinations. Apply measured wet-basis or dry-basis moisture definitions consistently; use site/species/form/moisture-matched volume bridges only. Separate evaporation from dry-matter deterioration and rain rewetting."
      inputs:
        - cp_harvest
        - cp_residue
        - cp_preparation
        - cp_dispatch
      output: "reconciled stock and material/water ledger"
      source_ids:
        - fao-fuelwood-harvesting
    - id: direct_releases
      applies_to: "actual direct releases"
      rule: "Use the declared measured release or explicitly documented carrier/equipment/control-specific factor and its exact activity unit; identify substance and receiving medium. No downstream fuelwood-combustion emission is attributed here. Carbon stock reporting is not a negative emission without an evidenced inventory method."
      inputs:
        - cp_emissions_at_harvest_removal
        - cp_emissions_at_primary_preparation
        - cp_management
        - cp_harvest
      output: "direct release and separate carbon-stock records"
      source_ids:
        - fao-fuelwood-harvesting
    - id: calculate_direct_release_ledger
      applies_to: "stand_management; harvest_removal; residue_collection; primary_preparation; qualification_dispatch; shared_assets"
      rule: "For each unique event, substance and medium, obtain raw release E from measurement or the cited applicable method using activity A and a compatible factor EF; use E = A * EF only for a genuinely simple-factor method, after checking units and abatement scope. Do not add different substances/media; retain an unallocated raw-release ledger. Divide attributed burden totals once by matched positive final reference quantity R; do not renormalize final-reference intensities or allocate a shared event twice. Unexplained material residuals are not automatically emissions and missing factors are not zero."
      inputs:
        - cp_direct_release_stand_management
        - cp_direct_release_harvest_removal
        - cp_direct_release_residue_collection
        - cp_direct_release_primary_preparation
        - cp_direct_release_qualification_dispatch
        - cp_direct_release_shared_assets
        - "existing emission cards"
        - "supplier coverage"
        - "reference quantity"
      output: "Node/substance/medium-specific raw and attributed amounts and unresolved gaps"
      source_ids: []
  data_quality_requirements:
    - id: species_source
      applies_to: "all wood"
      requirement: "Verify actual non-conifer botanical identity or disclosed mix, source part, untreated state and fuel/non-fuel destination; unknown species cannot be replaced by universal hardwood."
      evidence: "Source maps; supplier/source declarations; lot sampling"
    - id: matched_quantity
      applies_to: "all quantity bridges"
      requirement: "Match scale calibration, moisture sample, stock dates, volume convention and conversion evidence to the same species/form/source and lot; quantify uncertainty and missing coverage."
      evidence: "cp_harvest; cp_residue; cp_preparation; cp_dispatch"
    - id: period_completeness
      applies_to: "managed/source and shared burdens"
      requirement: "Cover actual establishment, each relevant harvest/regrowth, termination/replanting, reporting period and opening/closing stock; disclose observations rather than invented rotation/yield."
      evidence: "cp_management; cp_shared"
    - id: quantitative_evidence
      applies_to: "all Range cards"
      requirement: "Provisional reasoned screens are replaceable QA prompts, not maximum allowed use, loss/yield coefficients or publication-grade defaults. Retain evidence for real values and explain observations outside a screen without deleting a real flow."
      evidence: "Raw records; actual factors; paired balances; uncertainty"
    - id: concrete_identity
      applies_to: "all exchange identities"
      requirement: "Resolve actual carrier/service/product/waste/substance UUID with compatible property/unit/medium before final dataset exchange; a semantic umbrella is not one guessed exchange. Missing identity is disclosed, not manufactured."
      evidence: "Actual exchange detail and support verification"
validation_rules:
  - rule_id: validate_reference
    applies_to: "nonconifer_fuelwood_handover"
    rule: "Verify actual final producer gate and qualifiers, same card/reference identity and exactly 1 kg normalized net as-received qualified fuelwood. Packaging, soil and stones are not reference wood."
    source_ids:
      - unsd-nonconifer-fuelwood
  - rule_id: validate_source_choice
    applies_to: "stand_management; harvest_removal; residue_collection"
    rule: "Resolve actual source and parent/delta evidence for every portion; do not count harvest and already-generated collection twice. Coppice cannot silently continue after removing its stool/root. Declare omitted processes and no-use evidence."
    source_ids:
      - fao-woodfuel-planting
      - fao-dry-forest-silviculture
  - rule_id: validate_balance
    applies_to: "all wood and water"
    rule: "Reconcile actual incoming, intended products, waste, retained material, stock carryover, moisture and dry-matter changes; not all pre-gate mass is fixed to 1 kg. Volume/LHV conversions without matched evidence are gaps, not default constants."
    source_ids:
      - fao-fuelwood-harvesting
  - rule_id: validate_attribution
    applies_to: "all outputs and periods"
    rule: "Require a complete intended-output set and every handoff, explicit attribution priority, stand/stool cohort ledger, shared consumers/service periods and unique burden owner; report sensitivity and prevent duplicate establishment/asset/energy charges."
    source_ids:
      - fao-woodfuel-planting
      - fao-fuelwood-harvesting
  - rule_id: validate_exchange
    applies_to: "every inventory card"
    rule: "Expand actual zero/one/multiple umbrella exchanges from records, verify concrete UUID/property/unit and emitting substance/medium, preserve original physical bases and exactly-once conversion and accepted-mass normalization. Actual pollutants not covered by the two displayed air cards still require substance-specific records and evidence."
    source_ids:
      - fao-fuelwood-harvesting
  - rule_id: validate_direct_release_coverage
    applies_to: "stand_management; harvest_removal; residue_collection; primary_preparation; qualification_dispatch; shared_assets"
    rule: "For every activated node, reconcile its activity list against cp_direct_release_stand_management; cp_direct_release_harvest_removal; cp_direct_release_residue_collection; cp_direct_release_primary_preparation; cp_direct_release_qualification_dispatch; cp_direct_release_shared_assets: each relevant event must have quantified concrete elementary exchanges, evidenced upstream-service coverage, or evidenced absence of the activity. Missing/unknown is not zero and blocks data-package completeness. Check each actual substance/medium amount, method/factor units, concrete UUID and existing-card/service coverage for omissions or duplication; empty groups, purchased-electricity upstream emissions or another node's single CO2 card do not replace this node's on-site reconciliation. Shared-asset services must not create duplicate physical release events."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground data package for raw non-conifer fuelwood at declared producer gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Source/management/collection/preparation and producer dispatch inventory for actual qualified raw non-conifer fuelwood, with explicit boundary and attribution"
  excluded_use: "Conifer or industrial-log substitution; unspecified average hardwood; woodfuel combustion, charcoal/pellet/chip manufacture; heat reference; universal dried retail fuel or delivered-customer gate"
  required_metadata: "Species/mix; provenance/source part; stool/seedling/selection or residue source; raw form/bark/moisture; source and producer gate; period/stock/cycle; carrier/service suppliers; product/waste handoffs; allocation and land/carbon ownership"
  required_quality_disclosure: "Actual coverage and measured/calculated values; density/water/dry-matter/LHV evidence where used; emission-factor boundary; provisional ranges; omitted/no-use operations; unresolved identity/support and quantitative gaps; period/shared-burden sensitivity"
  update_trigger: "Source or species mix, management/harvest/conditioning technology, producer gate, reference quality, supplier, attribution, factor or measured performance changes"
