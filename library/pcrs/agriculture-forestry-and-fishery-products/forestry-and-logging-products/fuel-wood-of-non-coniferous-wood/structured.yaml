product_category_identity:
  canonical_pcr_id: "pcr.agriculture-forestry-and-fishery-products.forestry-and-logging-products.fuel-wood-of-non-coniferous-wood"
  classification_refs: "cpc:3.0:03132"
  covered_products: "Untreated raw non-conifer fuelwood in the actual log/billet/twig/faggot/stick/vine/stump/root form, with fuel destination at producer handover"
  excluded_products: "Conifer fuelwood; industrial timber outputs; treated/recovered demolition wood; manufactured woodfuels; charcoal; combustion products; retail-delivered fuel"
  representative_product: "Species-resolved non-conifer split wood with declared bark and as-received moisture, handed over at producer roadside"
  production_route: "Managed stand/coppice or selective harvest, or separately tracked pre-existing woody-residue collection; actual extraction/sizing/air seasoning followed by qualification and producer handover"
  market_state: "Raw, untreated, net as-received wood; actual natural moisture and raw form, excluding packaging; no universal kiln-dried grade"
functional_unit:
  what: "Net raw non-conifer fuelwood accepted at the declared producer roadside or collection-point gate"
  how_much: "1 kg net as-received qualified wood, including its declared bark and water, excluding packaging and foreign matter"
  how_well: "Declared non-conifer species/mixture, origin, raw form, bark, actual moisture basis, fuel destination and accepted lot quality; no invented hardwood density or heating value"
  how_long_or_cycle: "Actual reporting period with stand establishment, seedling/coppice/selection phases, harvest events and pre-gate stock carryover linked to the accepted dispatch lots"
  reference_flow_link: "nonconifer_fuelwood_handover"
system_boundary:
  rules:
    - rule_id: producer_gate
      applies_to: "all operations"
      rule: "Include only actual source management attributable to this wood, removal/collection, extraction and pre-gate preparation/qualification; customer delivery, charcoal making and combustion are outside."
      source_ids:
        - fao-fuelwood-harvesting
        - unsd-nonconifer-fuelwood
    - rule_id: removal_ownership
      applies_to: "harvest_removal; residue_collection"
      rule: "Harvest and resource removal are two responsibilities of the same actual removal event, not two energy operations. Managed standing_stock_handoff enters as managed_stock_feed with its burden ownership; the same woody portion must not simultaneously enter as wood_resource_removed. Use the environmental resource card only for actual natural removal without an already attributed technosphere standing-input representation. Keep the physical removal/stock ledger regardless of exchange representation. Stand growth precedes removal; conditioning follows a measured collected handoff. Already-removed purchased/residue material carries upstream burdens without a second standing-resource exchange."
      source_ids:
        - fao-woodfuel-planting
        - fao-fuelwood-harvesting
    - rule_id: residue_state
      applies_to: "source residues and rejects"
      rule: "Distinguish collected wood, independently sold co-products, off-site waste and on-site retained material. Retained nutrient-rich foliage/stools are not automatically waste, and recovery does not imply zero upstream burden."
      source_ids:
        - fao-woodfuel-planting
    - rule_id: shared_period_boundary
      applies_to: "stand_management; shared_assets"
      rule: "Index establishment, each seedling/coppice/selection harvest, replant/termination events, stock carryover and service periods; keep initial capital/maintenance, energy and shared-road burdens in one non-overlapping ledger."
      source_ids:
        - fao-woodfuel-planting
        - fao-dry-forest-silviculture
    - rule_id: conditional_operation
      applies_to: "source and preparation"
      rule: "Select actual source, equipment and conditioning from records; document omitted processes and zero use. No universal coppice rotation, harvest yield or seasoning time; no forced coexistence of fresh harvest and residue recovery for one portion."
      source_ids:
        - fao-dry-forest-silviculture
        - fao-fuelwood-harvesting
    - rule_id: boundary_direct_release_coverage
      applies_to: "stand_management; harvest_removal; residue_collection; primary_preparation; qualification_dispatch; shared_assets"
      rule: "Reconcile on-site combustion, actual applications and fugitive releases/leaks at every activated node through unique activity-substance-receiving-medium records in cp_direct_release_stand_management; cp_direct_release_harvest_removal; cp_direct_release_residue_collection; cp_direct_release_primary_preparation; cp_direct_release_qualification_dispatch; cp_direct_release_shared_assets. Upstream production of purchased fuel or chemicals does not replace emissions from their use on site; verify coverage and avoid double counting the same activity inside a supplier service. Evidence must support non-activity; missing data are not zero. This obligation does not expand the existing product gate or downstream-use boundary and does not presume combustion, fertilization, chemicals or equipment occur."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual non-conifer stand/tree with recorded management and stocks, or already-generated untreated woody feed with its upstream burden handoff"
  starting_condition_role: "Source and inventory initialization before actual harvest/removal or collection; not an unburdened default"
  product_classification_scope: "Raw non-conifer wood intended as fuel at producer handover; industrial wood co-products remain separately identified"
  recursive_input_rule: "Purchased same-category wood enters at its real incoming gate with one resolved upstream dataset; do not re-execute its prior stand management, resource removal or harvest for the same portion"
  upstream_dataset_requirement: "Use compatible source/management, bought energy/material/service and waste-treatment datasets; record supplier scope, gap and attribution ownership"
  disclosure: "Species and origin; regeneration/source mode; management and removal owner; source/producer gate; land and initial carbon stocks; co-products; stock periods; conditioning state; carrier/provider mix; missing data"
