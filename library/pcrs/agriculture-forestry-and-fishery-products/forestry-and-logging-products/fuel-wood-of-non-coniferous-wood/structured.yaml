allocation_rules:
  - rule_id: subdivide_first
    applies_to: "all intended outputs"
    rule: "Separate measured operations and output destinations before allocation. Enumerate fuelwood, each industrial-use timber product, and other independent non-fuel products; grade downgrading alone does not create waste. Where common burdens remain, use a declared evidenced physical causal relation; absent one, report the economic allocation data and sensitivity rather than silently picking a ratio. No automatic substitution credit."
    source_ids:
      - fao-woodfuel-planting
  - rule_id: unique_handoff
    applies_to: "all wood portions"
    rule: "Count one woody portion at one external intended-product handoff. Internal stock/preparation/dispatch transfers cancel within the combined package; source-stage timber and dispatch-stage diversion must be reconciled, not duplicated. Off-site wastes carry the actual treatment boundary."
    source_ids:
      - fao-fuelwood-harvesting
  - rule_id: temporal_source
    applies_to: "stand and stool cohorts"
    rule: "Attribute establishment and management across actual harvest events and intended outputs using a disclosed cohort/period ledger; distinguish retained-stool regrowth, replanting and stump/root termination. Link carryover stock and losses to their actual period; never apply a universal rotation or re-charge establishment for every coppice harvest."
    source_ids:
      - fao-woodfuel-planting
      - fao-dry-forest-silviculture
  - rule_id: single_shared_owner
    applies_to: "shared access and equipment"
    rule: "Keep one asset/service total, list consumers and periods, and allocate measured use once; reconcile totals before assigning each output share. Node energy excludes service-embedded energy. A purchased already-removed wood dataset and foreground standing removal cannot own the same burden."
    source_ids:
      - fao-fuelwood-harvesting
dataset_production:
  collection_protocols:
    - protocol_id: cp_management
      process_id: "stand_management"
      flow_role: "management and stock handoff"
      record_type: "foreground events and raw measurements"
      raw_fields: "stand/species; source map; stool cohort; establishment/replant/termination event; planted stock; actual material/product assay; water; energy carrier and original unit; area/time; stock and harvest-ready mass; consuming output/period"
      collection_method: "Use stand registers, invoices, meter readings and paired stock surveys; separate initial seedling from each retained-stool harvest."
      unit: "carrier-native; kg; m2a"
      frequency: "each event/lot or service period"
      temporal_coverage: "actual reporting period and attributable historical source phases"
      site_scope: "stand/source and rotation phase"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/source handoff evidence, matched ledgers, factor provenance and uncertainty"
    - protocol_id: cp_harvest
      process_id: "harvest_removal"
      flow_role: "harvest/remove wood and co-products"
      record_type: "foreground events and raw measurements"
      raw_fields: "event/source/species/plant part; management owner; removed wet/dry mass; retained biomass; fuel and equipment; extraction leg and load; all product/waste destinations; source carbon/land-use evidence"
      collection_method: "Match authorized source map and harvesting/extraction records to paired scales/moisture samples and product dispatch/waste manifests."
      unit: "kg; carrier-native; km"
      frequency: "each event/lot or service period"
      temporal_coverage: "actual reporting period and attributable historical source phases"
      site_scope: "harvest event and next handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/source handoff evidence, matched ledgers, factor provenance and uncertainty"
    - protocol_id: cp_residue
      process_id: "residue_collection"
      flow_role: "already-generated raw woody-source collection"
      record_type: "foreground events and raw measurements"
      raw_fields: "original generation event; species/part; product versus waste status; transfer and upstream burden owner; wet/dry/foreign mass; actual collection energy/load/distance; retained versus collected material"
      collection_method: "Use source supplier and generation/transfer records plus collection scales and sampling; preserve original burden handoff instead of assuming free residue."
      unit: "kg; carrier-native; km"
      frequency: "each event/lot or service period"
      temporal_coverage: "actual reporting period and attributable historical source phases"
      site_scope: "collection event and source"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration/source handoff evidence, matched ledgers, factor provenance and uncertainty"
    - protocol_id: cp_preparation
      process_id: "primary_preparation"
      flow_role: "raw-to-sized/air-seasoned wood handoff"
      record_type: "foreground events and raw measurements"
      raw_fields: "matched feed/output lots; species/form/bark; gross/net/wet/dry mass; moisture basis; rewetting; residue/waste; stock period; energy carrier/unit; measured solid/stacked volume and density pairing"
      collection_method: "Take paired incoming/outgoing scales and moisture/dry-matter samples; reconcile stock and rejects before interpreting water evaporation."
      unit: "kg; m3; carrier-native"
      frequency: "each event/lot or service period"
      temporal_coverage: "actual reporting period and attributable historical source phases"
