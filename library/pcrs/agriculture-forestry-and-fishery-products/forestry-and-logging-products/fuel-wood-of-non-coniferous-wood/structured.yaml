measurement_rules:
  - id: net_gate_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use paired calibrated gross/tare/foreign-matter records to obtain accepted net as-received wood mass at the actual producer gate using cp_dispatch; do not replace this with dry mass or thermal output."
  - id: water_dry_bridge
    applies_to: "wood at every source and transfer"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record sampling state and wet-basis or dry-basis water definition. Reconcile actual wet mass, water and dry wood with matched lots; correct rewetting, bark and deterioration separately, without a universal drying loss."
  - id: volume_mass_bridge
    applies_to: "any solid or stacked-volume record"
    required_property_ref:
      name: "Volume and Mass"
      uuid: ""
    required_unit: "m3 and kg"
    rule: "Record solid/bulk/stacked volume, void/bark convention and paired site/species/form/moisture density or weighing evidence. A stere is not solid volume and hardwood is not one density."
  - id: energy_carrier_bridge
    applies_to: "energy umbrella cards"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve original carrier and unit; convert kWh to MJ only using the exact unit relation, and fuel quantity only with matched heating-value/unit evidence. No default LHV. Purchases of energy or services must not duplicate their embedded fuel exchanges."
  - id: resource_carbon_ledger
    applies_to: "standing removal and stock changes"
    required_property_ref:
      name: "Dry mass and carbon mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record actual removed dry biomass, retained stools/root/foliage stocks, dry-carbon evidence, land-use change and period. Carbon contained in wood is not an automatic sequestration credit or a use-stage emission. Required site-specific direct emissions need identified substance, medium and method evidence."
  - id: provisional_range_evidence_policy
    applies_to: "all Ranges and actual exchanges"
    required_property_ref:
      name: "compatible property of each actual exchange"
      uuid: ""
    required_unit: "native unit of each actual exchange"
    rule: "All reasoned_estimate Ranges are provisional review prompts for this candidate method, not measured distributions, allowable losses, default quantities or emission factors. Never clip, backfill or force actual records to fit them; investigate state, units, boundary, stocks and evidence when exceeded. Before completing a data package, determine actual quantities and uncertainty from traceable measurements or applicable reviewed quantitative sources. Retain missing amounts, factors and flow identities as gaps that block completeness claims; passing a range screen is not evidence."
process_map:
  - id: stand_management
    name: "Non-conifer stand and coppice management"
    inclusion: "conditional"
    inclusion_condition: "Actual managed stand, woodlot or trees-outside-forest inputs are attributable; do not recreate management already included in an upstream source dataset."
    role: "managed biological production parent; standing-stock handoff to harvesting, not final dispatch"
    quantitative_reference: "per 1 kg reference flow"
  - id: harvest_removal
    name: "Harvest and resource removal"
    inclusion: "conditional"
    inclusion_condition: "The foreground actually removes standing/dead wood, stems, stumps or roots; source-ledger ownership excludes purchased already-removed wood and duplicate residue removal."
    role: "source-to-collected harvest and resource-removal responsibility; stump-side material handoff"
    quantitative_reference: "per 1 kg reference flow"
  - id: residue_collection
    name: "Collection of previously generated woody residues"
    inclusion: "conditional"
    inclusion_condition: "Actual non-conifer branch, pruning or harvest-residue source is collected rather than freshly felled; retain its original burden handoff."
    role: "alternative source-collection responsibility; collected raw fuelwood feed handoff"
    quantitative_reference: "per 1 kg reference flow"
  - id: primary_preparation
    name: "Roadside sizing and primary conditioning"
    inclusion: "conditional"
    inclusion_condition: "Actual bucking, splitting, cleaning or air seasoning occurs before the producer gate; omit operations not performed."
    role: "primary conditioning parent; sized raw wood handoff, not manufactured chips or kiln-dried retail product"
    quantitative_reference: "per 1 kg reference flow"
  - id: qualification_dispatch
    name: "Qualification and producer dispatch"
    inclusion: "required"
    inclusion_condition: "Every declared reference lot; actual acceptance and final mass must be recorded."
    role: "grading and sorting; reference fuelwood and independent non-fuel destinations at declared handoffs"
    quantitative_reference: "per 1 kg reference flow"
  - id: shared_assets
    name: "Shared access and equipment attribution"
    inclusion: "conditional"
    inclusion_condition: "Actual roads, landing, scales or tools serve multiple nodes, sources, outputs or periods."
    role: "one shared service ledger with consuming-node and period attribution"
    quantitative_reference: "per 1 kg reference flow"
