      evidence: "Period/service/driver ledger"
    - id: quantitative_evidence
      applies_to: "Ranges and factors"
      requirement: "Replace provisional screening ranges with reviewed site evidence when available; methods/factors need provenance and applicability"
      evidence: "Source and measured uncertainty records"
    - id: identity_completeness
      applies_to: "Final concrete exchanges"
      requirement: "Verify actual flow and support identities before downstream exchange creation"
      evidence: "Identity evidence and qualifier alignment"
validation_rules:
  - rule_id: reference_gate
    applies_to: "Reference output"
    rule: "Name/link match real product output; one kg mass basis and one roadside gate; actual intended use must fall inside saw/veneer/sleeper category."
    source_ids:
      - unsd-roundwood-scope
  - rule_id: state_chain
    applies_to: "Process map"
    rule: "Reconcile wood states and lot IDs; combined nodes cannot create duplicated extraction/preparation/removal or competing reference outputs."
    source_ids:
      - fao-wood-harvesting
  - rule_id: origin_mode
    applies_to: "Source and route deltas"
    rule: "Verify actual management/origin/history; managed carrier cannot represent unsupported natural source. Enable only evidenced planted/coppice/natural and technological deltas for each lot."
    source_ids: []
  - rule_id: quantity_and_units
    applies_to: "Inventory"
    rule: "Every amount has protocol, basis and Range; preserve component units and mass/volume bridge. Explain outliers; never infer zero from missing data."
    source_ids: []
  - rule_id: output_and_attribution
    applies_to: "Products/waste/residues"
    rule: "Complete destination set and justified output/period/shared-asset attribution; no unexplained loss, double counted burden or assumed substitution."
    source_ids: []
  - rule_id: site_and_carbon
    applies_to: "Site ledgers"
    rule: "Reconcile stock, carbon, soil/residue and land-change periods; actual emitted substances/receiving media and selected accounting method must be explicit."
    source_ids: []
  - rule_id: concrete_identities
    applies_to: "Dataset construction"
    rule: "Concrete UUID/property/unit must match actual state, gate, origin, destination and units; class umbrella is not one concrete exchange."
    source_ids: []
  - rule_id: validate_direct_release_coverage
    applies_to: "stand; harvest; extraction; preparation; grading"
    rule: "For every activated node, reconcile its activity list against cp_direct_release_stand; cp_direct_release_harvest; cp_direct_release_extraction; cp_direct_release_preparation; cp_direct_release_grading: each relevant event must have quantified concrete elementary exchanges, evidenced upstream-service coverage, or evidenced absence of the activity. Missing/unknown is not zero and blocks data-package completeness. Check each actual substance/medium amount, method/factor units, concrete UUID and existing-card/service coverage for omissions or duplication; empty groups, purchased-electricity upstream emissions or another node's single CO2 card do not replace this node's on-site reconciliation. Shared-asset services must not create duplicate physical release events."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile required/conditional activation and upstream coverage against incoming state at each node; purchased completed-state feed must not duplicate growth, harvest or preparation. Equal classification does not replace state and gate matching."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production package for documented non-coniferous sawlog/veneer-log category"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projections"
  allowed_use: "Supply of the declared reference category at the same roadside gate, mass/moisture/bark basis and actual route"
  excluded_use: "Finished timber/veneer or treated goods; delivered-mill gate; pulp/panel/fuel/other-use reference; blanket hardwood density, carbon or route defaults"
  required_metadata: "Species, origin/site, stand mode, periods/cohort, harvest/preparation system, special forms, dimensions/grade/intended use, gate, mass/moisture/bark, upstream and attribution rules"
  required_quality_disclosure: "Source/quantity uncertainty; incomplete period/site ledgers; omitted upstream stages; provisional screens; unresolved identities and actual dataset validation coverage"
  update_trigger: "New species/form or destination specification; changed route/gate, management, period allocation, source method, measured conversion or concrete identity"
data_sources:
  - id: "unsd-roundwood-scope"
    type: "official_guidance"
    reference: "UNSD CPC product detail 03121, https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/03121 ; retrieved 2026-10-08"
    used_for: "Product inclusion/exclusion and intended-use classification, not a quantity factor"
