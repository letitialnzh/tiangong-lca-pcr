allocation_rules:
  - rule_id: destination_set
    applies_to: "Grading and earlier outputs"
    rule: "Reconcile saw/veneer/sleeper output with pulp/panel, other-use, fuelwood and any saleable residues actually produced; record every destination and gate. Rejected waste and onsite residue are not interchangeable with intended products."
    source_ids:
      - unsd-roundwood-scope
  - rule_id: attribution_decision
    applies_to: "Shared production"
    rule: "First separate directly attributable operations. For inseparable burdens require one documented causal allocation decision supported by actual process drivers; if causality is unavailable, justify the chosen physical/economic method and sensitivity using same-period quantities/prices. No universal mass or revenue coefficient."
    source_ids: []
  - rule_id: cycle_allocation
    applies_to: "Growth and harvest periods"
    rule: "Index establishment, tending, coppice/regeneration, thinning and final harvest; reconcile initial, remaining and removed stocks. Link each burden/output/asset to its period and attributable cut; never charge a full rotation to every harvest or omit an unfinished cycle without disclosure."
    source_ids: []
  - rule_id: shared_service
    applies_to: "Roads, yards and equipment"
    rule: "Attribute shared service to identified nodes and periods using recorded machine hours, use/distance or another justified driver; an included contractor burden excludes overlapping own assets/fuel."
    source_ids: []
  - rule_id: no_credit_default
    applies_to: "Wood, waste and carbon"
    rule: "Report gross exchanges and actual treatment. No automatic residue substitution, carbon-storage credit or avoided burden; any explicit scenario remains separately documented from reference production."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_stand
      process_id: "stand"
      flow_role: "Inputs, stock, carbon and site ledgers"
      record_type: "Management and stock records"
