  calculation_rules:
    - id: normalize_once
      applies_to: "Each inventory"
      rule: "M_ref is positive final accepted reference kg for the matched boundary/period. Physical quantity q_phys = Q/M_ref. For local intensity q_i = Q/O_i, q_phys = q_i * O_i/M_ref; retain already final-reference amounts unchanged. Environmental burden q_burden = B_attributed/M_ref, with evidenced period/output attribution applied once in B_attributed; allocation factors must not reduce physical balances."
      inputs:
        - "Actual totals"
        - "output set"
        - "attribution driver"
        - "accepted reference mass"
      output: "Component amount per kg reference output"
      source_ids: []
    - id: mass_bridge
      applies_to: "Wood volume records"
      rule: "Net mass = measured same-lot solid volume multiplied by measured compatible as-received density; stacked conversion needs its separately measured factor"
      inputs:
        - "Same-lot volume/density"
        - "bark/moisture"
        - "conversion uncertainty"
      output: "Compatible kg"
      source_ids: []
    - id: stock_balance
      applies_to: "Biological and removal ledgers"
      rule: "Opening stock plus actual growth/transfers minus removals/losses equals closing stock on the same area, period and property basis"
      inputs:
        - "Survey and harvest records"
        - "period/source mode"
      output: "Stock/removal reconciliation; no duplicated resource input"
      source_ids: []
    - id: carbon_and_emissions
      applies_to: "Actual elementary reporting"
      rule: "Use explicitly declared site-appropriate method and collected activity/species/medium; reconcile dry-carbon stores, uptake/removals/residues and reported releases without assuming credits or neutrality"
      inputs:
        - "Actual dry matter/carbon"
        - periods
        - "emissions method and activity"
      output: "Separate substance/compartment amounts and uncertainty"
      source_ids: []
    - id: component_reconciliation
      applies_to: "Umbrella cards"
      rule: "Expand actual zero/one/multiple exchanges, retain each concrete identity/property/unit; amounts and Range checks are component-specific"
      inputs:
        - "Invoices/meters/formulations/services"
        - "actual route"
      output: "Concrete exchange ledger, not mixed-unit totals"
      source_ids: []
    - id: calculate_direct_release_ledger
      applies_to: "stand; harvest; extraction; preparation; grading"
      rule: "For each unique event, substance and medium, obtain raw release E from measurement or the cited applicable method using activity A and a compatible factor EF; use E = A * EF only for a genuinely simple-factor method, after checking units and abatement scope. Do not add different substances/media; retain an unallocated raw-release ledger. Divide attributed burden totals once by matched positive final reference quantity R; do not renormalize final-reference intensities or allocate a shared event twice. Unexplained material residuals are not automatically emissions and missing factors are not zero."
      inputs:
        - cp_direct_release_stand
        - cp_direct_release_harvest
        - cp_direct_release_extraction
        - cp_direct_release_preparation
        - cp_direct_release_grading
        - "existing emission cards"
        - "supplier coverage"
        - "reference quantity"
      output: "Node/substance/medium-specific raw and attributed amounts and unresolved gaps"
      source_ids: []
