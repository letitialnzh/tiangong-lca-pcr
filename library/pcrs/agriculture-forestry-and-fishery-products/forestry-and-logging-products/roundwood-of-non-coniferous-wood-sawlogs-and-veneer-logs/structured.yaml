      collection_method: "Compartment records, invoices, measured surveys and supplier records; Raw aggregation operation: Separate phases, output shares and components, normalize once; Execute final-reference division once only: for a raw lot total, divide the corresponding physical or attributed amount by the positive final reference-product quantity of the same boundary and period; for a local per-process-output quantity, multiply by the measured process-output/final-reference-quantity ratio and any still-required reviewed burden attribution; if already reported per final reference quantity, retain it without another division. Keep unallocated physical transfer, balance and co-product ledgers; burden allocation must not shrink the physical mass balance."
      unit: "kg; original volume/area/count; actual component units"
      frequency: "Each event and stock survey"
      temporal_coverage: "Actual full applicable production cycle"
      site_scope: "Identified compartment/site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Survey uncertainty; assay; source history; period reconciliation"
