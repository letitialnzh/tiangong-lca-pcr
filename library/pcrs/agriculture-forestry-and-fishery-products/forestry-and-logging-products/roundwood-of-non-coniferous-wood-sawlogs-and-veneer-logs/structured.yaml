system_boundary:
  rules:
    - rule_id: roadside_end
      applies_to: "Whole package"
      rule: "End at forest-roadside producer handover; exclude outward mill transport, sawing/peeling, chemical treatment, use and end of life."
      source_ids:
        - unsd-roundwood-scope
    - rule_id: source_and_removal
      applies_to: "Stand and harvest"
      rule: "Separate biological growth/source responsibility from felling/removal and preparation. Harvest owns removal from source; do not add a duplicate resource-removal node for the same operation. Managed product input and natural elementary-resource input cannot both represent the same biomass."
      source_ids:
        - fao-wood-harvesting
    - rule_id: actual_route
      applies_to: "Alternative routes"
      rule: "Parent stand is documented managed production: planted regeneration adds nursery/establishment records; coppice retains stool/regrowth and linked cuts; managed natural regeneration has its actual tending history. Unmodified natural source bypasses fictitious managed growth. Parent harvest/preparation allows actual cut-to-length, tree-length/whole-tree or veneer-root/burl removal: record changed topology, inputs, losses and validation; mutually exclusive routes for one lot cannot be summed."
      source_ids:
        - fao-wood-harvesting
    - rule_id: site_ledgers
      applies_to: "All site activities"
      rule: "Retain growth/removal/remaining-stock, soil/deadwood/residue, land occupation/transformation and carbon ledgers with actual area and periods. Record actual species/medium emissions, water use and spills when applicable; no automatic carbon neutrality, sequestration or substitution credit."
      source_ids: []
    - rule_id: period_assets
      applies_to: "Shared infrastructure"
      rule: "Identify roads, yards and equipment, their consuming nodes and service periods. Retain establishment, tending, thinning and final-harvest burden shares and end-of-cycle/replacement events without repeating them in service and own-input inventories."
      source_ids: []
    - rule_id: route_handoffs
      applies_to: "Process boundaries"
      rule: "Record stump-side timber, landing timber, prepared material and roadside destination states. Combined equipment may combine nodes, but retain these interfaces and count each activity once. Onsite residues are not exported waste; saleable residues are products."
      source_ids:
        - fao-wood-harvesting
    - rule_id: boundary_direct_release_coverage
      applies_to: "stand; harvest; extraction; preparation; grading"
      rule: "Reconcile on-site combustion, actual applications and fugitive releases/leaks at every activated node through unique activity-substance-receiving-medium records in cp_direct_release_stand; cp_direct_release_harvest; cp_direct_release_extraction; cp_direct_release_preparation; cp_direct_release_grading. Upstream production of purchased fuel or chemicals does not replace emissions from their use on site; verify coverage and avoid double counting the same activity inside a supplier service. Evidence must support non-activity; missing data are not zero. This obligation does not expand the existing product gate or downstream-use boundary and does not presume combustion, fertilization, chemicals or equipment occur."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Select the route from actual incoming state and ownership. Qualified purchased harvested, extracted, prepared or graded feed may enter at its real receiving node; completed upstream operations are not mandatory foreground operations and standing stock or biological resources must not be charged again. Receiving cards record actual material, grade, wet/dry basis, receipt gate, upstream dataset and process coverage; add the actual receiving exchange if none exists. Bypass does not remove upstream burdens; actual operations cannot be skipped and final reference product, quality and gate remain unchanged."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Documented managed-growth responsibility or acquired equivalent managed standing stock; alternatively actual natural-source removal with origin/history disclosure"
  starting_condition_role: "Explicit production/source interface, never a zero-burden assertion"
  product_classification_scope: "Only the reference saw/veneer/sleeper category; separately identify other outputs"
  recursive_input_rule: "An acquired same-category prepared-log input retains supplier gate, quantity and upstream dataset; do not recursively recreate its previously modelled stand/harvest/preparation burdens"
  upstream_dataset_requirement: "Equivalent managed standing-stock or purchased-log package must disclose included periods, source, bark/moisture, carbon treatment and gate; absence is a data gap, not zero"
  disclosure: "Actual origin, route topology, start/end gates, cycles, outsourced activities, excluded stages, shared assets, upstream omissions and carbon/soil/land-change treatment"
