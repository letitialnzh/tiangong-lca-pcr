functional_unit:
  what: "Accepted fresh whole wild edible truffle fruiting bodies"
  how_much: "1 kg net fresh mass"
  how_well: "Declare species, wild/untended proof, edible-use acceptance, grade, moisture, foreign-matter exclusion, actual gate and intended downstream use"
