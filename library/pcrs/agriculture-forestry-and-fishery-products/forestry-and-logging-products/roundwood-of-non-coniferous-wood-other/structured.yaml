allocation_rules:
  - rule_id: physical_separation
    applies_to: "Intended outputs"
    rule: "First assign separable operation burdens to measured destination lots. Other-use roundwood, saw/veneer logs, pulp/panel roundwood, fuelwood and recovered residues are distinct actual outputs; never count one lot twice."
    source_ids: []
  - rule_id: shared_output_mass
    applies_to: "Remaining shared harvest/preparation/grading burdens"
    rule: "For genuinely inseparable common burdens use measured dry-wood mass shares over all intended outputs at their actual handoffs, with equivalent bark/moisture boundary. Document denominator and excluded water/waste. This protocol choice is not a universal forestry factor; unsupported conversion blocks this allocation."
    source_ids: []
  - rule_id: economic_exception
    applies_to: "Output attribution"
    rule: "If mass does not represent the production relationship, document a reviewed alternative using current same-gate prices/grades and perform sensitivity. Do not silently switch methods or apply avoided-product credits."
    source_ids: []
  - rule_id: period_asset_ledger
    applies_to: "Establishment, regrowth, thinning, harvest and shared assets"
    rule: "Link every input, asset, replacement/termination and output to actual cohort/period. Assign documented service-use shares across benefiting consumers, periods and outputs once; do not charge the same share more than once. Do not invent rotation, lifetime, yield or residual credit."
    source_ids: []
  - rule_id: waste_not_coproduct
    applies_to: "Waste and retained residues"
    rule: "Do not allocate intended-product burden to treatment waste or uncollected forest residue as saleable output. Retain disposal burden and carbon/land information under the declared method."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_stand
      process_id: "stand"
      flow_role: "Planting, fertilizer, managed stock, energy and service"
      record_type: "Actual cohort and intervention ledger"
      raw_fields: "species; origin; stand area; dates; planting/regrowth; fertilizer formulation/nutrients; energy carrier; asset consumer; stock moisture/bark/mass"
      collection_method: "Forest inventory, intervention records, invoices and same-lot measurements; Raw aggregation operation: Attribute cohort/period ledger once then normalize by measured reference mass; Execute final-reference division once only: for a raw lot total, divide the corresponding physical or attributed amount by the positive final reference-product quantity of the same boundary and period; for a local per-process-output quantity, multiply by the measured process-output/final-reference-quantity ratio and any still-required reviewed burden attribution; if already reported per final reference quantity, retain it without another division. Keep unallocated physical transfer, balance and co-product ledgers; burden allocation must not shrink the physical mass balance."
      unit: "kg; kWh; h; count; m3 retained separately"
      frequency: "Every intervention and stock handoff"
      temporal_coverage: "All actual establishment/regrowth/management phases supporting harvested cohort"
      site_scope: "Declared stand and related suppliers/assets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Survey method; invoices; calibration; provenance; omissions"
    - protocol_id: cp_harvest
      process_id: "harvest"
      flow_role: "Source, removed wood, recovered residues, waste, energy and service"
      record_type: "Harvest/extraction lot and origin ledger"
      raw_fields: "managed/unmanaged source; source history; tree/lot ids; technology; terrain; extraction distance; bark/moisture; mass/volume; residue/waste destination; land/carbon/direct emissions"
      collection_method: "Harvest tickets, forestry surveys, weighing, actual contractor scope and documented carbon/land measurements or explicit models; Raw aggregation operation: Reconcile source and collected outputs by lot; do not overlap managed/natural inputs; Execute final-reference division once only: for a raw lot total, divide the corresponding physical or attributed amount by the positive final reference-product quantity of the same boundary and period; for a local per-process-output quantity, multiply by the measured process-output/final-reference-quantity ratio and any still-required reviewed burden attribution; if already reported per final reference quantity, retain it without another division. Keep unallocated physical transfer, balance and co-product ledgers; burden allocation must not shrink the physical mass balance."
      unit: "kg; kWh; h; m3; land/emission units separately"
      frequency: "Each lot and actual operation"
      temporal_coverage: "Actual harvest interval with source-period links"
      site_scope: "Source site through landing handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Traceable tickets; paired measurements; model assumptions; service scope"
    - protocol_id: cp_preparation
      process_id: "preparation"
      flow_role: "Wood-state changes, consumables, energy, services and destinations"
      record_type: "Preparation batch ledger"
      raw_fields: "raw/prepared lot; dimensions; bark removed; moisture before/after; consumables; service scope; residue/waste destination"
      collection_method: "Batch weighing and process logs, invoices and contractor evidence; Raw aggregation operation: Match raw/prepared states; quantify losses/destinations; integrate route once; Execute final-reference division once only: for a raw lot total, divide the corresponding physical or attributed amount by the positive final reference-product quantity of the same boundary and period; for a local per-process-output quantity, multiply by the measured process-output/final-reference-quantity ratio and any still-required reviewed burden attribution; if already reported per final reference quantity, retain it without another division. Keep unallocated physical transfer, balance and co-product ledgers; burden allocation must not shrink the physical mass balance."
      unit: "kg; kWh; h; dimensions retained separately"
      frequency: "Every batch"
      temporal_coverage: "Preparation interval for matched harvest lots"
      site_scope: "Landing or actual preparation site before grading"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; moisture method; handoff records"
    - protocol_id: cp_grading
      process_id: "grading"
      flow_role: "Use-grade outputs, energy, service and rejects"
      record_type: "Roadside grade/handover ledger"
      raw_fields: "lot; species; intended use; grade; dimensions; moisture/bark; accepted/reference/saw/pulp/fuel/waste/held amounts; buyer/gate"
      collection_method: "Weighing, grading records and handover tickets linked to actual buyers/destinations; Raw aggregation operation: Reconcile all grades/rejects/inventory; normalize only by actual other-use reference mass; Execute final-reference division once only: for a raw lot total, divide the corresponding physical or attributed amount by the positive final reference-product quantity of the same boundary and period; for a local per-process-output quantity, multiply by the measured process-output/final-reference-quantity ratio and any still-required reviewed burden attribution; if already reported per final reference quantity, retain it without another division. Keep unallocated physical transfer, balance and co-product ledgers; burden allocation must not shrink the physical mass balance."
      unit: "kg; kWh; h; count and m3 only with actual bridges"
      frequency: "Every grade decision and handover"
      temporal_coverage: "Reporting interval and closing inventory"
      site_scope: "Forest-roadside producer handover"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Grading criteria; tickets; calibration; closing stocks"
    - protocol_id: cp_direct_release_stand
      process_id: "stand"
      flow_role: "Per-node actual direct releases and coverage decisions"
      record_type: "Activity, measurement and method-evidence ledger"
      raw_fields: "site; process_id; lot/cohort; period; event_id; activation/evidence; carrier/formulation; activity_amount/unit; substance/species/particle_basis; receiving_medium; fossil/biogenic_origin; method/source/version/applicability; factor/value/unit; conversion; abatement_scope; measured_release; supplier_service_coverage; existing_row_id; shared_event_owner; allocation_state; reference_total"
