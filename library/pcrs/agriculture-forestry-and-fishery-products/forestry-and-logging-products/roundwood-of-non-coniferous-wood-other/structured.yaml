  - id: "un-cpc-other-nonconifer"
    type: "official_guidance"
    reference: "UNSD CPC 3.0 03129; https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/03129"
    used_for: "Other-use product boundary and exclusions"
  - id: "fao-wood-harvesting"
    type: "official_guidance"
    reference: "FAO SFM Toolbox, Wood harvesting; https://www.fao.org/sustainable-forest-management-toolbox/modules/wood-harvesting/2/en?tabInx=1"
    used_for: "Felling, extraction, landing preparation and documented alternative operation responsibilities; not numeric ranges"
