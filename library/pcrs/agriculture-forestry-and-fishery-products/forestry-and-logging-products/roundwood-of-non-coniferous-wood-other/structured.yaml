measurement_rules:
  - id: reference_mass
    applies_to: "Reference and fixed standing timber"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use actual measured mass at stated moisture and bark condition. Standing timber also remains a kg exchange, not a volume amount attached to a mass identity."
  - id: lot_bridge
    applies_to: "Volume or count records"
    required_property_ref:
      name: "Measured same-lot bridge"
      uuid: ""
    required_unit: "kg; m3; count"
    rule: "Retain solid versus stacked volume and geometry, bark basis and matching density/moisture. No universal hardwood density or volume/count conversion."
  - id: moisture_basis
    applies_to: "Wood balances"
    required_property_ref:
      name: "Mass and moisture"
      uuid: ""
    required_unit: "kg; moisture fraction"
    rule: "Declare moisture convention. For wet-basis fraction w, dry mass=m_wet*(1-w); for dry-basis ratio r, dry mass=m_wet/(1+r). Never interchange them."
  - id: input_units
    applies_to: "Energy, fertilizer and services"
    required_property_ref:
      name: "Actual compatible property"
      uuid: ""
    required_unit: "kg; kWh; h; count"
    rule: "Separate real carriers/materials/services. kg fuel plus kWh electricity is not one total. Record fertilizer product mass and nutrient composition separately."
  - id: provisional_range_evidence_policy
    applies_to: "all Ranges and actual exchanges"
    required_property_ref:
      name: "compatible property of each actual exchange"
      uuid: ""
    required_unit: "native unit of each actual exchange"
    rule: "All reasoned_estimate Ranges are provisional review prompts for this candidate method, not measured distributions, allowable losses, default quantities or emission factors. Never clip, backfill or force actual records to fit them; investigate state, units, boundary, stocks and evidence when exceeded. Before completing a data package, determine actual quantities and uncertainty from traceable measurements or applicable reviewed quantitative sources. Retain missing amounts, factors and flow identities as gaps that block completeness claims; passing a range screen is not evidence."
