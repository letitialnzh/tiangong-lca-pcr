system_boundary:
  rules:
    - rule_id: roadside_gate
      applies_to: "All product outputs"
      rule: "Include actual stand-related duties, removal, extraction and primary preparation up to roadside producer handover. Exclude long-distance mill delivery, chemical treatment, fabrication and use."
      source_ids:
        - un-cpc-other-nonconifer
        - fao-wood-harvesting
    - rule_id: node_responsibility
      applies_to: "Harvest and preparation"
      rule: "Harvest owns source removal and extraction; preparation owns raw-to-prepared changes. Do not add a parallel resource-removal node or duplicate combined cut-to-length operations."
      source_ids:
        - fao-wood-harvesting
    - rule_id: source_history
      applies_to: "Stand/start condition"
      rule: "Collect actual origin and interventions across establishment, regrowth, thinning and final/selective harvest periods. Unmanaged source is not a zero-burden assumption; land/carbon records remain necessary."
      source_ids: []
    - rule_id: retained_material
      applies_to: "Residues and losses"
      rule: "Record retained branches, stumps, unmerchantable biomass and damage in the site ledger; export as product or waste only where actual destination establishes that status."
      source_ids: []
    - rule_id: shared_ownership
      applies_to: "Roads, machines and contractors"
      rule: "Identify consumers and service periods; allocate actual shared burden once. Purchased service must disclose embedded energy/equipment/emissions to avoid overlaps."
      source_ids: []
    - rule_id: boundary_direct_release_coverage
      applies_to: "stand; harvest; preparation; grading"
      rule: "Reconcile on-site combustion, actual applications and fugitive releases/leaks at every activated node through unique activity-substance-receiving-medium records in cp_direct_release_stand; cp_direct_release_harvest; cp_direct_release_preparation; cp_direct_release_grading. Upstream production of purchased fuel or chemicals does not replace emissions from their use on site; verify coverage and avoid double counting the same activity inside a supplier service. Evidence must support non-activity; missing data are not zero. This obligation does not expand the existing product gate or downstream-use boundary and does not presume combustion, fertilization, chemicals or equipment occur."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "The managed-production parent is stand. Plantation establishment adds planting-stock records; coppice adds stool/previous-cut lineage and regrowth-period records; managed natural regeneration adds recorded interventions without assumed planting or fertilizer. Choose the actual regime per cohort: these alternatives cannot represent the same trees simultaneously. Unmanaged natural origin bypasses this managed parent only after origin/history and necessary land/carbon records are documented; no generic managed timber identity is substituted. Harvest and extraction parent harvest may use manual, motor-manual, mechanized, animal or cable implementation only when actual equipment, terrain, distance and service scope are collected. Tree-length, whole-tree and cut-to-length routes change preparation location, material state and responsibility. Integrated operations may share one burden ledger, never duplicate felling or conditioning. These route deltas are collection requirements, not universal performance factors."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Select the route from actual incoming state and ownership. Qualified purchased harvested, extracted, prepared or graded feed may enter at its real receiving node; completed upstream operations are not mandatory foreground operations and standing stock or biological resources must not be charged again. Receiving cards record actual material, grade, wet/dry basis, receipt gate, upstream dataset and process coverage; add the actual receiving exchange if none exists. Bypass does not remove upstream burdens; actual operations cannot be skipped and final reference product, quality and gate remain unchanged."
      source_ids: []
