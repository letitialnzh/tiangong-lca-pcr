      collection_method: "Match this node's input/application/equipment logs to release events. Determine each substance/medium amount by measurement or an applicable evidenced method and factor; retain factor provenance, unit conversions, abatement scope and uncertainty, without subtracting control twice when already included. Reconcile existing emission cards and contractor services once; create concrete output elementary exchanges for uncovered events and retain UUID verification evidence. Missing method, amount or identity prevents claiming a complete data package."
      unit: "kg per substance/medium; retain native activity units"
      frequency: "Each event and lot/reporting-period reconciliation"
      temporal_coverage: "Periods matched to node activity and final reference lots"
      site_scope: "Actual activity sites; one owner for each shared event"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/test evidence; activity records; original method/factor source; service scope; deduplication and coverage matrix"
    - protocol_id: cp_direct_release_grading
      process_id: "grading"
      flow_role: "Per-node actual direct releases and coverage decisions"
      record_type: "Activity, measurement and method-evidence ledger"
      raw_fields: "site; process_id; lot/cohort; period; event_id; activation/evidence; carrier/formulation; activity_amount/unit; substance/species/particle_basis; receiving_medium; fossil/biogenic_origin; method/source/version/applicability; factor/value/unit; conversion; abatement_scope; measured_release; supplier_service_coverage; existing_row_id; shared_event_owner; allocation_state; reference_total"
      collection_method: "Match this node's input/application/equipment logs to release events. Determine each substance/medium amount by measurement or an applicable evidenced method and factor; retain factor provenance, unit conversions, abatement scope and uncertainty, without subtracting control twice when already included. Reconcile existing emission cards and contractor services once; create concrete output elementary exchanges for uncovered events and retain UUID verification evidence. Missing method, amount or identity prevents claiming a complete data package."
      unit: "kg per substance/medium; retain native activity units"
      frequency: "Each event and lot/reporting-period reconciliation"
      temporal_coverage: "Periods matched to node activity and final reference lots"
      site_scope: "Actual activity sites; one owner for each shared event"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/test evidence; activity records; original method/factor source; service scope; deduplication and coverage matrix"
  calculation_rules:
    - id: normalize_inventory
      applies_to: "Separate physical-ledger and burden normalization"
      rule: "R is the positive final accepted net other-use roundwood mass in kg for the same boundary, lot and period, excluding co-products, internal transfers and unaccepted stocks. Report original material, co-product and transfer totals Q as q_phys = Q/R without a burden-allocation share. Report environmental burdens B as b_ref = B_attributed/R only after one evidenced direct/output/period/asset attribution. Do not divide final-reference intensities again; cancel paired internal transfers only at whole-package aggregation, not as additional final outputs."
      inputs:
        - "unallocated physical totals Q"
        - "burdens B and attribution records"
        - "matched positive reference mass R"
      output: "Amount per 1 kg reference"
      source_ids:
        - mass-normalization-identity
    - id: dry_mass
      applies_to: "Wood and output allocation"
      rule: "m_dry=m_wet*(1-w_wet), or m_wet/(1+r_dry); use declared measured convention and matching bark state."
      inputs:
        - "Lot wet mass"
        - "measured moisture"
        - "bark basis"
      output: "Equivalent dry-wood masses"
      source_ids:
        - mass-normalization-identity
    - id: mass_reconciliation
      applies_to: "Each wood-state handoff"
      rule: "Opening stock+received=outputs+retained/transferred losses+closing stock, on equivalent dry wood/bark basis; water changes separately. Document measurement uncertainty."
      inputs:
        - "Matched lot/period input"
        - output
        - "loss and stock ledgers"
      output: "Balance residual with measured uncertainty"
      source_ids:
        - mass-normalization-identity
    - id: period_shares
      applies_to: "Cohorts and shared assets"
      rule: "Direct assignments first, then documented use-period/output shares summing to one for each actual burden; no universal lifetime."
      inputs:
        - "Event ledger"
        - "asset service use"
        - "output dry masses"
      output: "Attributed amounts without duplication"
      source_ids: []
    - id: calculate_direct_release_ledger
      applies_to: "stand; harvest; preparation; grading"
      rule: "For each unique event, substance and medium, obtain raw release E from measurement or the cited applicable method using activity A and a compatible factor EF; use E = A * EF only for a genuinely simple-factor method, after checking units and abatement scope. Do not add different substances/media; retain an unallocated raw-release ledger. Divide attributed burden totals once by matched positive final reference quantity R; do not renormalize final-reference intensities or allocate a shared event twice. Unexplained material residuals are not automatically emissions and missing factors are not zero."
      inputs:
        - cp_direct_release_stand
        - cp_direct_release_harvest
        - cp_direct_release_preparation
        - cp_direct_release_grading
        - "existing emission cards"
        - "supplier coverage"
        - "reference quantity"
      output: "Node/substance/medium-specific raw and attributed amounts and unresolved gaps"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "Each final exchange"
      requirement: "Confirm actual flow type, state/gate, intended use, destination and support unit/property before a concrete UUID; umbrella classes are not finished exchange identities."
      evidence: "Detail confirmation and actual lot/provider evidence"
    - id: measurement_quality
      applies_to: "Wood and conversion"
      requirement: "Collect species and same-lot mass, moisture/bark and actual volume/count bridges. Missing data are not zero or an assumed density."
      evidence: "Calibrated measurements and bridge provenance"
    - id: coverage_quality
      applies_to: "All periods/nodes"
      requirement: "Cover the actual management, source history, extraction and handover intervals and closing stocks; enumerate missing services, land/carbon or emission records."
      evidence: "Period/cohort/consumer ledger and completeness statement"
    - id: screening_quality
      applies_to: "All Range blocks"
      requirement: "Provisional QA screens flag values for investigation, not rejection, defaults or conforming performance. Replace with reviewed local evidence when available."
      evidence: "Investigation and actual measurement evidence"
validation_rules:
  - rule_id: reference_gate_check
    applies_to: "Reference lot"
    rule: "Require one untreated other-use non-conifer roadside output, positive measured mass and all qualifiers; no treated-pole, sawlog, pulpwood or finished-product substitution."
    source_ids:
      - un-cpc-other-nonconifer
  - rule_id: state_balance_check
    applies_to: "All wood transfers"
    rule: "Match process/direction/state/lot, reconcile equivalent moisture/bark bases and stock changes, investigate measured residuals rather than force a default yield."
    source_ids:
      - mass-normalization-identity
  - rule_id: source_route_check
    applies_to: "Source and route"
    rule: "For each cohort select managed or unmanaged source without duplicate trees; managed fixed standing identity requires evidenced managed context. Verify parent/delta and integrated-operation ownership from current records."
    source_ids: []
  - rule_id: period_shared_check
    applies_to: "Output/period/asset ledgers"
    rule: "Verify all intended outputs, period events, consuming nodes and actual handoffs; shares reconcile to one without repeated service, fuel or equipment burden."
    source_ids: []
  - rule_id: identity_units_check
    applies_to: "All final exchanges"
    rule: "Require concrete verified UUIDs and compatible property/unit for actual exchanges. Never bind an energy/fertilizer/service class to one arbitrary carrier; never sum unlike units."
    source_ids: []
  - rule_id: environment_check
    applies_to: "Land/carbon/direct emissions"
    rule: "Retain actual source and compartment/substance records, exclusions and uncertainty; no automatic carbon neutrality, stock credit, rotation, density or avoided-product credit."
    source_ids: []
  - rule_id: range_check
    applies_to: "Each card"
    rule: "Every card has its separate QA range; provisional bounds do not substitute for records. Reference mass normalization is exactly one; actual class components are screened separately."
    source_ids: []
  - rule_id: validate_direct_release_coverage
    applies_to: "stand; harvest; preparation; grading"
    rule: "For every activated node, reconcile its activity list against cp_direct_release_stand; cp_direct_release_harvest; cp_direct_release_preparation; cp_direct_release_grading: each relevant event must have quantified concrete elementary exchanges, evidenced upstream-service coverage, or evidenced absence of the activity. Missing/unknown is not zero and blocks data-package completeness. Check each actual substance/medium amount, method/factor units, concrete UUID and existing-card/service coverage for omissions or duplication; empty groups, purchased-electricity upstream emissions or another node's single CO2 card do not replace this node's on-site reconciliation. Shared-asset services must not create duplicate physical release events."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile required/conditional activation and upstream coverage against incoming state at each node; purchased completed-state feed must not duplicate growth, harvest or preparation. Equal classification does not replace state and gate matching."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Untreated other-use non-conifer roundwood supply at the declared forest-roadside gate with explicit qualifiers"
  excluded_use: "Finished/treated products; generic saw/veneer/pulp/panel/fuel supply; mill-delivered or downstream use inventories; automatic carbon credits"
  required_metadata: "Actual product lot/species/use/quality; origin/management and land history; moisture/bark/measurement; start/end gates; parent/route deltas; periods/cohort; upstream and contractor scope; attribution"
  required_quality_disclosure: "Completeness, calibration, missing identities/measurements, provisional QA screens, land/carbon/emission assumptions and uncertainty"
  update_trigger: "Change in source, management, product intended use/grade, route/gate, supplier scope, measured conversion, allocation or environmental evidence"
