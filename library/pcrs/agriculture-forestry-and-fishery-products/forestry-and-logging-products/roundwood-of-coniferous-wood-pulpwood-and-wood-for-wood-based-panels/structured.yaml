allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The product definitions and volume convention below are supported by the FAO sources. The allocation hierarchy and shared-asset attribution are rules selected by this PCR, not LCA allocation requirements prescribed by those statistical or harvesting documents. Before applying a volume or service driver, demonstrate its relevance to the shared activity and retain the justification and sensitivity to a materially different justified driver; a product-class definition alone is not allocation evidence."
    source_ids: []
  - rule_id: distinct_outputs
    applies_to: "Harvest and graded lots"
    rule: "Report pulp/panel wood, sawlogs/veneer logs, other industrial wood, fuelwood, and rejected or forest-retained material separately, each with a handoff. Residues are not intended co-products unless documented recovery makes them saleable."
    source_ids:
      - fao-jfsq-2020
  - rule_id: direct_then_physical
    applies_to: "Shared management, harvest and landing inputs"
    rule: "Assign metered output-specific activities directly. Allocate genuinely shared burdens across intended products using measured solid under-bark output volumes within the same cohort, documenting shares and any justified alternative; do not apply automatic avoided-production credits."
    source_ids:
      - fao-jfsq-2020
  - rule_id: period_and_asset_once
    applies_to: "Years and shared roads, landing and machines"
    rule: "Link establishment, tending, maintenance and harvesting activities to cohorts and service years. Allocate shared infrastructure by measured use, load, hours or output once across consumers; never re-add it in a downstream node."
    source_ids:
      - fao-harvesting-code
  - rule_id: chip_internal_transfer
    applies_to: "Direct forest-chip variant"
    rule: "Graded roundwood entering the chipper is an internal transfer, not a second final market product; balance measured chips and rejects before roadside handover."
    source_ids:
      - fao-jfsq-2020
  - rule_id: physical_ledger_before_allocation
    applies_to: "Physical ledgers and attributed burdens"
    rule: "Retain unallocated physical values for original material balances, handoffs and co-products: q_B = Q_B/R. Apply this PCR's allocation method separately to shared burdens: b_ref = B_shared * a_ref/R; assign direct burdens directly and apply each period/output share once. R is the selected final reference output, excluding internal transfers. Never apply burden share a_ref to original co-product or transfer quantities; distinguish any allocated single-product process projection from the unallocated whole-package material ledger."
    source_ids: []
