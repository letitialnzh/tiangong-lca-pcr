measurement_rules:
  - id: underbark_solid_volume
    applies_to: "Reference product and wood balances"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Scale each form to solid wood volume excluding bark. Record any over-bark measure and documented species/lot bark deduction; never equate loose-chip bulk volume to solid volume (fao-jfsq-2020)."
  - id: fuel_consistency
    applies_to: "Equipment energy"
    required_property_ref:
      name: "Fuel volume/mass or electricity"
      uuid: ""
    required_unit: "L, kg or kWh"
    rule: "Retain measured unit and any density conversion; allocate only actual activity inside this roadside gate."
  - id: cohort_period_link
    applies_to: "Forest inputs and outputs"
    required_property_ref:
      name: "Dated activity and attributed volume"
      uuid: ""
    required_unit: "period record and m3"
    rule: "Link management activities to harvested cohorts. Record each original road, tending or machine-service event once at its responsible node and date; distribute its shared burdens across benefiting cohorts, products and service periods using documented shares, without recounting the original event."
  - id: provisional_range_evidence_policy
    applies_to: "all Ranges and actual exchanges"
    required_property_ref:
      name: "compatible property of each actual exchange"
      uuid: ""
    required_unit: "native unit of each actual exchange"
    rule: "All reasoned_estimate Ranges are provisional review prompts for this candidate method, not measured distributions, allowable losses, default quantities or emission factors. Never clip, backfill or force actual records to fit them; investigate state, units, boundary, stocks and evidence when exceeded. Before completing a data package, determine actual quantities and uncertainty from traceable measurements or applicable reviewed quantitative sources. Retain missing amounts, factors and flow identities as gaps that block completeness claims; passing a range screen is not evidence."
process_map:
  - id: stand_management
    name: "Source stand management and growth attribution"
    inclusion: "conditional"
    inclusion_condition: "Include attributable establishment/tending or managed-natural-forest operations; otherwise document source and upstream treatment"
    role: "Managed biological production and cohort handoff"
    quantitative_reference: "Standing volume and records by cohort"
  - id: felling_extraction
    name: "Felling, bucking and extraction"
    inclusion: "conditional"
    inclusion_condition: "Only when actually inside the foreground; qualified purchased completed-state feed bypasses completed operations while retaining upstream burdens."
    role: "Harvest/capture distinct from growth and sorting"
    quantitative_reference: "Extracted log volume and machine energy"
  - id: landing_sort_scale
    name: "Landing sorting and scaling"
    inclusion: "required"
    inclusion_condition: "Final lot measurement, acceptance and roadside producer handover remain required for every reference lot. Repeat physical sorting only when actually performed; purchased qualified lots retain upstream sorting coverage without repeating it."
    role: "Accept and measure the final lot; grade actual intended uses, rejects and under-bark product"
    quantitative_reference: "Product volumes by lot"
  - id: forest_chip
    name: "Direct forest chipping"
    inclusion: "conditional"
    inclusion_condition: "Only directly forest-chipped roundwood before dispatch"
    role: "Primary conditioning from logs to chips"
    quantitative_reference: "Matched feed, chips and rejects"
