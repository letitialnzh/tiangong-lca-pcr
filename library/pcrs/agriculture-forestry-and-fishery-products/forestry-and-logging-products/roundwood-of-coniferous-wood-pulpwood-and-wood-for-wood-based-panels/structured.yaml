    - id: calc_underbark
      applies_to: "All wood rows"
      rule: "Sum scaled solid wood volume excluding bark; deduct measured or documented species/lot bark volume from over-bark readings."
      inputs:
        - "log scale"
        - "bark deduction"
      output: "m3 solid under bark"
      source_ids:
        - fao-jfsq-2020
    - id: calc_chip_equivalent
      applies_to: "Direct forest chips"
      rule: "Convert chip mass/bulk volume with lot-specific density, moisture and bark basis; reconcile against measured roundwood feed; no universal factor."
      inputs:
        - "chip and feed tickets"
        - tests
      output: "m3 solid under-bark equivalent"
      source_ids:
        - fao-jfsq-2020
    - id: calc_assortment_balance
      applies_to: "Landing outputs"
      rule: "For one reconciliation boundary covering landing sorting, any activated forest chipping and final producer handover, V_open + V_receipts = V_selected_final + V_other_final + V_exported_waste + V_retained_loss + V_close + delta, all on matched underbark solid-volume or evidenced equivalent bases. Receipts include own-harvest deliveries and external purchased lots; cancel paired sorting-to-chipper and accepted-lot-to-handover transfers once. Select exactly one final reference output per lot from actual chipping activation, never both roundwood feed and chips. Opening/closing stock includes work in progress; known stock changes are explicit. Delta is only an unexplained measurement residual, not an inferred loss or emission; exported waste and retained loss must originate in the same input wood pool."
      inputs:
        - "receipt/sorting/chipping tickets"
        - "opening/closing and work-in-progress stock"
        - transfer
        - "waste and retained-loss records"
      output: "reconciled output m3"
      source_ids:
        - fao-jfsq-2020
    - id: calc_shared_burden
      applies_to: "Cross-output and cross-period inputs"
      rule: "Directly assign metered use; otherwise allocate each shared activity once by documented service/use or under-bark output fraction within the cohort; sum shares to 100%."
      inputs:
        - "service records"
        - cohort
        - products
      output: "assigned activity per m3 output"
      source_ids:
        - fao-harvesting-code
    - id: calculate_direct_release_ledger
      applies_to: "stand_management; felling_extraction; landing_sort_scale; forest_chip"
      rule: "For each unique event, substance and medium, obtain raw release E from measurement or the cited applicable method using activity A and a compatible factor EF; use E = A * EF only for a genuinely simple-factor method, after checking units and abatement scope. Do not add different substances/media; retain an unallocated raw-release ledger. Divide attributed burden totals once by matched positive final reference quantity R; do not renormalize final-reference intensities or allocate a shared event twice. Unexplained material residuals are not automatically emissions and missing factors are not zero."
      inputs:
        - cp_direct_release_stand_management
        - cp_direct_release_felling_extraction
        - cp_direct_release_landing_sort_scale
        - cp_direct_release_forest_chip
        - "existing emission cards"
        - "supplier coverage"
        - "reference quantity"
      output: "Node/substance/medium-specific raw and attributed amounts and unresolved gaps"
      source_ids: []
    - id: calc_final_handover
      applies_to: "handover_roundwood_input; handover_chip_input; pulpwood_handover"
      rule: "For each declared-form final lot, activate exactly one accepted incoming transfer with the same quantity and identity as handover output. Normalize each by its own positive accepted R: R/R × 1 m3 = 1 m3. Raw chipping feed, processing outputs, rejects and period stocks remain separate measured quantities and need not equal R. Match and cancel each internal transfer once at whole-system aggregation; retain both sides in separate unit-process datasets."
      inputs:
        - cp_producer_handover
        - cp_grade_scale
        - cp_chip_conversion
        - "form and transfer records"
      output: "one final reference output and traceable internal transfers"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "All wood states"
      requirement: "Preserve conifer species, origin, intended use, physical form, gate and lot linkage; split mixed or unknown assortments."
      evidence: "stand, grade, dispatch records"
    - id: dq_measurement
      applies_to: "Reference amount"
      requirement: "Document scaling/calibration, bark correction and chip moisture/density conversion."
      evidence: "scale certificates and worksheets"
    - id: dq_period
      applies_to: "Management and shared assets"
      requirement: "Record cohort, activity/harvest years and consumers; disclose attribution period and exclusions."
      evidence: "dated work, road and machine records"
    - id: dq_completeness
      applies_to: "Wood and energy balances"
      requirement: "Reconcile harvested logs, grades, chips, rejects, retained material and energy without double-counting internal transfers."
      evidence: "balance worksheet and fuel reconciliation"
    - id: dq_final_form_identity
      applies_to: "producer_handover"
      requirement: "Require one known processing state, physical form, concrete identity and accepted quantity per final lot. Unknown route or missing chip-equivalence evidence blocks completeness; the generic PCR product label is not a UUID applicable to every form. Retain every actual physical operation and its emissions at its responsible node; handover adds no duplicate loading or machinery burden."
      evidence: "form-specific processing/dispatch records; matching Tiangong identity and conversion evidence"
validation_rules:
  - rule_id: validate_class_gate
    applies_to: "Dataset identity"
    rule: "Reject missing conifer identity, pulp/panel intended use, form or forest-roadside gate, and any mill residues, fuelwood or external haulage counted as reference output. Classify the actual final product form: round/split pulpwood is CPC 03112; deliberately produced forest chips are CPC 31230. The broader PCR mapping does not authorize coding chips as roundwood."
    source_ids:
      - un-cpc-03112
      - un-cpc-31230
      - fao-jfsq-2020
  - rule_id: validate_volume
    applies_to: "Reference quantity"
    rule: "Require normalized 1 m3 solid volume under bark; reject unconverted over-bark logs or loose-chip volume."
    source_ids:
      - fao-jfsq-2020
  - rule_id: validate_route_balance
    applies_to: "Process links"
    rule: "Match cohort and lot IDs; reconcile products, rejects and retained residues; count chipped internal transfer only once at final gate."
    source_ids:
      - fao-jfsq-2020
  - rule_id: validate_attribution
    applies_to: "Shared/multi-period inputs"
    rule: "Require named periods, assets, consumers, driver and shares; reject duplicate burdens and undisclosed substitution credits."
    source_ids:
      - fao-harvesting-code
  - rule_id: validate_flow_resolution
    applies_to: "Downstream exchange creation"
    rule: "Do not emit a concrete TIDAS exchange from any unresolved semantic card until exact flow, property and unit-group identities are verified."
    source_ids: []
  - rule_id: validate_card_activation_units
    applies_to: "All refined cards"
    rule: "Verify activation and actual material/formulation/task/supply specification; missing records are not zero. Each amount and Range uses one compatible property/unit; retain density and wood mass/volume bridges. Check contractor-service components against fuel, equipment and emissions to avoid double burdens."
    source_ids:
      - fao-harvesting-code
  - rule_id: validate_direct_release_coverage
    applies_to: "stand_management; felling_extraction; landing_sort_scale; forest_chip"
    rule: "For every activated node, reconcile its activity list against cp_direct_release_stand_management; cp_direct_release_felling_extraction; cp_direct_release_landing_sort_scale; cp_direct_release_forest_chip: each relevant event must have quantified concrete elementary exchanges, evidenced upstream-service coverage, or evidenced absence of the activity. Missing/unknown is not zero and blocks data-package completeness. Check each actual substance/medium amount, method/factor units, concrete UUID and existing-card/service coverage for omissions or duplication; empty groups, purchased-electricity upstream emissions or another node's single CO2 card do not replace this node's on-site reconciliation. Shared-asset services must not create duplicate physical release events."
    source_ids: []
  - rule_id: validate_unique_handover
    applies_to: "producer_handover"
    rule: "Require one actual form and one matched accepted incoming transfer per final lot, with pulpwood_handover as the sole final reference output. Check positive R, form, identity and conversion; measured internal feed, stocks and rejects need not equal R. Unknown processing state or missing chip-equivalence evidence prevents completeness claims."
    source_ids: []
  - rule_id: validation_rule_9
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile required/conditional activation and upstream coverage against incoming state at each node; purchased completed-state feed must not duplicate growth, harvest or preparation. Equal classification does not replace state and gate matching."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground forest-roadside pulpwood/panel-wood production package for the declared roundwood or direct forest-chip state, not a reviewed platform dataset"
  downstream_use: "secondary_dataset or background_dataset after identity and review checks"
  allowed_use: "Downstream models with matching conifer species, region, regime, grade, form and roadside gate"
  excluded_use: "Sawlogs, veneer logs, non-coniferous wood, fuelwood, mill chips/residues, manufactured pulp/panels or mill-gate wood without added transport"
  required_metadata: "Species/group, region, stand/cohort, reporting/harvest years, intended use, form, bark/moisture, harvest system, landing, conversion, chip branch, assortments and shared-asset treatment"
  required_quality_disclosure: "Primary-record coverage, scaling uncertainty, unresolved identities, energy completeness, residue estimate, period and co-product attribution"
  update_trigger: "New verified platform UUID, changed species/route/gate, improved scaling or fuel data, output classes or forest attribution"
data_sources:
  - id: "un-cpc-03112"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/03112"
    used_for: "Product identity and pulp/panel purpose"
  - id: "un-cpc-31230"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/31230"
    used_for: "Classification of deliberately produced wood chips; distinguishes the chip state from CPC 03112 roundwood"
  - id: "fao-jfsq-2020"
    type: "official_guidance"
    reference: "FAO Joint Forest Sector Questionnaire Definitions, https://www.fao.org/forestry-fao/7800-0944787ecbf6036088182f841ab15fe42.pdf"
    used_for: "Roundwood forms, direct forest chips, use-class distinction and solid under-bark volume"
  - id: "fao-harvesting-code"
    type: "official_guidance"
    reference: "FAO Model Code of Forest Harvesting Practice, https://www.fao.org/4/v6530e/v6530e12.htm and https://www.fao.org/4/v6530e/v6530e08.htm"
    used_for: "Felling, extraction and roadside-landing handoff"
  - id: "fao-planted-forest-management"
    type: "official_guidance"
    reference: "https://www.fao.org/sustainable-forest-management-toolbox/modules/management-of-planted-forests/1/en?tabInx=1; https://www.fao.org/4/AC601E/ac601e03.htm"
    used_for: "Conditional planting stock, fertilization, protection and watering inputs; no universal application rates"
