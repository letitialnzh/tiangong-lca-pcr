  calculation_rules:
    - id: calc_underbark
      applies_to: "All wood rows"
      rule: "Sum scaled solid wood volume excluding bark; deduct measured or documented species/lot bark volume from over-bark readings."
      inputs:
        - "log scale"
        - "bark deduction"
      output: "m3 solid under bark"
      source_ids:
        - fao-jfsq-2020
    - id: calc_chip_equivalent
      applies_to: "Direct forest chips"
      rule: "Convert chip mass/bulk volume with lot-specific density, moisture and bark basis; reconcile against measured roundwood feed; no universal factor."
      inputs:
        - "chip and feed tickets"
        - tests
      output: "m3 solid under-bark equivalent"
      source_ids:
        - fao-jfsq-2020
    - id: calc_assortment_balance
      applies_to: "Landing outputs"
      rule: "For one reconciliation boundary covering landing sorting and any activated forest chipping, V_open + V_receipts = V_selected_final + V_other_final + V_exported_waste + V_retained_loss + V_close + delta, all on matched underbark solid-volume or evidenced equivalent bases. Receipts include own-harvest deliveries and external purchased lots; cancel paired sorting-to-chipper transfers once. Select exactly one final reference output per lot from actual chipping activation, never both roundwood feed and chips. Opening/closing stock includes work in progress; known stock changes are explicit. Delta is only an unexplained measurement residual, not an inferred loss or emission; exported waste and retained loss must originate in the same input wood pool."
      inputs:
        - "receipt/sorting/chipping tickets"
        - "opening/closing and work-in-progress stock"
        - transfer
        - "waste and retained-loss records"
      output: "reconciled output m3"
      source_ids:
        - fao-jfsq-2020
    - id: calc_shared_burden
      applies_to: "Cross-output and cross-period inputs"
      rule: "Directly assign metered use; otherwise allocate each shared activity once by documented service/use or under-bark output fraction within the cohort; sum shares to 100%."
      inputs:
        - "service records"
        - cohort
        - products
      output: "assigned activity per m3 output"
      source_ids:
        - fao-harvesting-code
    - id: calculate_direct_release_ledger
      applies_to: "stand_management; felling_extraction; landing_sort_scale; forest_chip"
      rule: "For each unique event, substance and medium, obtain raw release E from measurement or the cited applicable method using activity A and a compatible factor EF; use E = A * EF only for a genuinely simple-factor method, after checking units and abatement scope. Do not add different substances/media; retain an unallocated raw-release ledger. Divide attributed burden totals once by matched positive final reference quantity R; do not renormalize final-reference intensities or allocate a shared event twice. Unexplained material residuals are not automatically emissions and missing factors are not zero."
      inputs:
        - cp_direct_release_stand_management
        - cp_direct_release_felling_extraction
        - cp_direct_release_landing_sort_scale
        - cp_direct_release_forest_chip
        - "existing emission cards"
        - "supplier coverage"
        - "reference quantity"
      output: "Node/substance/medium-specific raw and attributed amounts and unresolved gaps"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "All wood states"
      requirement: "Preserve conifer species, origin, intended use, physical form, gate and lot linkage; split mixed or unknown assortments."
      evidence: "stand, grade, dispatch records"
    - id: dq_measurement
      applies_to: "Reference amount"
      requirement: "Document scaling/calibration, bark correction and chip moisture/density conversion."
      evidence: "scale certificates and worksheets"
    - id: dq_period
      applies_to: "Management and shared assets"
      requirement: "Record cohort, activity/harvest years and consumers; disclose attribution period and exclusions."
      evidence: "dated work, road and machine records"
    - id: dq_completeness
      applies_to: "Wood and energy balances"
      requirement: "Reconcile harvested logs, grades, chips, rejects, retained material and energy without double-counting internal transfers."
      evidence: "balance worksheet and fuel reconciliation"
validation_rules:
  - rule_id: validate_class_gate
    applies_to: "Dataset identity"
    rule: "Reject missing conifer identity, pulp/panel intended use, form or forest-roadside gate, and any mill residues, fuelwood or external haulage counted as reference output. Classify the actual final product form: round/split pulpwood is CPC 03112; deliberately produced forest chips are CPC 31230. The broader PCR mapping does not authorize coding chips as roundwood."
    source_ids:
      - un-cpc-03112
      - un-cpc-31230
      - fao-jfsq-2020
  - rule_id: validate_volume
    applies_to: "Reference quantity"
    rule: "Require normalized 1 m3 solid volume under bark; reject unconverted over-bark logs or loose-chip volume."
    source_ids:
      - fao-jfsq-2020
  - rule_id: validate_route_balance
    applies_to: "Process links"
    rule: "Match cohort and lot IDs; reconcile products, rejects and retained residues; count chipped internal transfer only once at final gate."
    source_ids:
      - fao-jfsq-2020
  - rule_id: validate_attribution
    applies_to: "Shared/multi-period inputs"
    rule: "Require named periods, assets, consumers, driver and shares; reject duplicate burdens and undisclosed substitution credits."
    source_ids:
      - fao-harvesting-code
  - rule_id: validate_flow_resolution
    applies_to: "Downstream exchange creation"
    rule: "Do not emit a concrete TIDAS exchange from any unresolved semantic card until exact flow, property and unit-group identities are verified."
    source_ids: []
  - rule_id: validate_card_activation_units
    applies_to: "All refined cards"
