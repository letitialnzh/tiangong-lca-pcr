    reference: "FAO Model Code of Forest Harvesting Practice, https://www.fao.org/4/v6530e/v6530e12.htm and https://www.fao.org/4/v6530e/v6530e08.htm"
    used_for: "Felling, extraction and roadside-landing handoff"
  - id: "fao-planted-forest-management"
