  classification_refs: "CPC 3.0 03112, broader PCR mapping: only the round/split roundwood state belongs to 03112; the included direct forest-chip state belongs to 31230. This does not create a mapping from 31230."
  covered_products: "Coniferous pulpwood and panel wood, round/split or directly forest-chipped form, on solid under-bark basis"
  excluded_products: "Sawlogs/veneer logs, fuelwood, non-coniferous or other industrial wood, mill chips/residues, pulp and finished panels"
  representative_product: "Graded conifer pulpwood logs ready for outbound transport at forest roadside"
  production_route: "Attributable stand management → felling and bucking → extraction to landing → sorting and scaling; direct forest chipping is a conditional terminal route"
  market_state: "Industrial wood at forest roadside before external transport or mill conversion"
functional_unit:
  what: "Coniferous pulpwood or wood for wood-based panels at forest roadside"
  how_much: "1 m3 solid wood volume under bark"
  how_well: "Declared species/group, pulp/panel destination, grade/diameter, physical form, bark and moisture; no assumed pulp yield"
  how_long_or_cycle: "Declared harvest cohort and reporting period, with attributable establishment and tending years linked"
  reference_flow_link: "roadside_pulpwood"
system_boundary:
  rules:
    - rule_id: roadside_gate
      applies_to: "All nodes"
      rule: "Include attributable stand management, felling/bucking, extraction, landing grading/scaling and direct forest chipping only when before roadside handover. Exclude outbound haulage and mill processing."
      source_ids:
        - fao-harvesting-code
        - fao-jfsq-2020
    - rule_id: purpose_and_form
      applies_to: "Product classification"
      rule: "Confirm conifer identity and intended pulp/panel use; route sawlogs, veneer logs, fuelwood and other assortments separately. Direct forest chips qualify for this PCR but are classified as CPC 31230, not 03112. Mill residues remain outside this PCR. Do not transfer the FAO statistical grouping into CPC classification."
      source_ids:
        - un-cpc-03112
        - un-cpc-31230
        - fao-jfsq-2020
    - rule_id: wood_removed_once
      applies_to: "Wood accounting"
      rule: "Count delivered removed wood on solid under-bark basis; distinguish bark and unremoved forest residues, and identify internal transfers only once."
      source_ids:
        - fao-jfsq-2020
    - rule_id: period_shared_assets
      applies_to: "Stand, forest road, landing and equipment"
      rule: "Identify establishment, tending and harvest periods and every shared asset consumer; allocate documented service once among cohorts and outputs."
      source_ids:
        - fao-harvesting-code
    - rule_id: boundary_direct_release_coverage
      applies_to: "stand_management; felling_extraction; landing_sort_scale; forest_chip"
      rule: "Reconcile on-site combustion, actual applications and fugitive releases/leaks at every activated node through unique activity-substance-receiving-medium records in cp_direct_release_stand_management; cp_direct_release_felling_extraction; cp_direct_release_landing_sort_scale; cp_direct_release_forest_chip. Upstream production of purchased fuel or chemicals does not replace emissions from their use on site; verify coverage and avoid double counting the same activity inside a supplier service. Evidence must support non-activity; missing data are not zero. This obligation does not expand the existing product gate or downstream-use boundary and does not presume combustion, fertilization, chemicals or equipment occur."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Select the route from actual incoming state and ownership. Qualified purchased harvested, extracted, prepared or graded feed may enter at its real receiving node; completed upstream operations are not mandatory foreground operations and standing stock or biological resources must not be charged again. Receiving cards record actual material, grade, wet/dry basis, receipt gate, upstream dataset and process coverage; add the actual receiving exchange if none exists. Bypass does not remove upstream burdens; actual operations cannot be skipped and final reference product, quality and gate remain unchanged."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "For own harvesting, an identified coniferous stand or recovered-tree source with origin, management regime, age/cohort, location and pre-harvest volume method; for purchased qualified roundwood, its origin, received product state, incoming gate, lot quantity and upstream coverage"
  starting_condition_role: "Biological forest source for own harvesting; an upstream product input for purchased qualified roundwood. A purchased lot does not create a second growth or harvest operation in this foreground."
  product_classification_scope: "Coniferous industrial wood for pulp or wood-based panels; declared intended use and final form decide inclusion"
  recursive_input_rule: "Purchased same-category pulpwood at landing is separately metered with origin and upstream dataset; do not count it as newly grown and harvested here"
  upstream_dataset_requirement: "Supply upstream datasets for purchased fuel, seedlings, services, machinery, and any imported same-category wood"
  disclosure: "Stand/cohort and periods; felling/extraction system; landing and shared road/equipment; bark/moisture/scale method; other grades, losses and direct-chipping choice"
