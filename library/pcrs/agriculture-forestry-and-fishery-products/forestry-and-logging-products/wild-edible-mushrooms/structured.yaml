allocation_rules:
  - rule_id: output_ownership
    applies_to: "collected/prepared/accepted goods"
    rule: "Enumerate every actual intended species/grade output and its handoff. Internal transfers carry burden forward and are not independent final products. Retained source material, waste, unidentified fungi and spoiled lots are not co-products by default."
    source_ids: []
  - rule_id: attribution_order
    applies_to: "multiple intended goods"
    rule: "First subdivide independently metered collection/handling lots and processes. For genuinely shared remaining operations, use evidenced physical causation such as actual trip/container use or service occupancy. Where no defensible physical driver remains, use recorded same-period net producer values with sensitivity analysis and a documented decision. Do not apply a universal mass/value share or substitution credit."
    source_ids: []
  - rule_id: loss_and_return
    applies_to: "reject and reinspection paths"
    rule: "Keep burdens on the originating lot through repeat cleaning/reinspection; record every return to its originating conditioning or acceptance node. Count recirculated material once in overall mass balance, not as new collection. Only newly qualified accepted mass enters the final denominator; treatment retains attributable burden without an automatic negative credit."
    source_ids: []
  - rule_id: shared_asset_period
    applies_to: "shared services and packaging"
    rule: "Index each vehicle, tool, cold-room or reusable-container asset, all consuming nodes/lots/periods and total users. Attribute measured use/occupancy with compatible total-use records, log idle/replacement/repair/end-of-use decisions and avoid both purchase and inclusive service burdens for the same use. No assumed lifetime or perpetual reuse."
    source_ids: []
  - rule_id: site_period_aggregation
    applies_to: "site and temporal aggregation"
    rule: "Sum attributable exchanges and accepted output mass on compatible actual species/state/gate boundaries; divide their totals rather than averaging site ratios. Retain per-site/trip/season coverage, missing contributors, weighting and representativeness decisions. Opening/closing inventories prevent a lot being counted in collection and later dispatch periods twice."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_collection
      process_id: "collection"
      flow_role: "source and collected lot; energy/material/service; incidental/reject/emission"
      record_type: "source-trip ledger"
      raw_fields: "actual species; edible qualification record; untended source/site; access/trip; collection time; fruiting-body mass; attached soil; raw output; retained or exported residue; fuel/electricity; consumables; service hours/users; named emissions/compartments; destination"
      collection_method: "Verify source records and traceable calibrated weighing; logs/meter/supplier records for actual owned operation; retain substance-specific emission measurement or actual-fuel factor evidence"
      unit: "kg; MJ; h in separate raw fields"
      frequency: "each actual trip and material handoff"
      temporal_coverage: "actual trip and collection season"
      site_scope: "enumerated source sites and owners"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "source proof; identity qualification; calibrated scales; original logs; boundary and factor evidence"
    - protocol_id: cp_conditioning
      process_id: "conditioning"
      flow_role: "fresh feed, water, grades, trim, wastewater and owned operation"
      record_type: "handling-batch ledger"
      raw_fields: "lot/species/source; incoming fresh/soil mass; trim; all grades; reinspection links; supplied or direct water/source; retained water; wastewater solids/destination; energy/material/service; named emissions/compartments; opening/closing stock"
      collection_method: "Calibrated matched-lot weighing, actual water metering, records of state/destination and service boundary; document each factor or inferred emission separately"
      unit: "kg; MJ; h in separate raw fields"
      frequency: "each batch/changeover and handoff"
      temporal_coverage: "actual handling run and cleaning events"
      site_scope: "declared preparation sites and source lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/meter checks; batch/state ledger; source exclusions; treatment records"
    - protocol_id: cp_preservation
      process_id: "preservation"
      flow_role: "fresh stock, energy/material/service, spoilage/water and named emissions"
      record_type: "fresh storage ledger"
      raw_fields: "lot/species; opening/input/output/closing mass; time/temperature; moisture; condensate/drainage; water loss; respiratory loss evidence; energy; ice/refrigerant material and stock; leakage/recovery/compartment; service occupancy/users; spoilage destination"
      collection_method: "Match calibrated stock weights and actual temperature/period/meter logs; reconcile water/material balances and independently identified emission measurements or justified substance-specific factors"
      unit: "kg; MJ; h in separate raw fields"
      frequency: "each storage run, event and exit"
      temporal_coverage: "actual pre-gate storage interval"
      site_scope: "each owned cold/storage site and service boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated records; lot quality; metering; leakage/stock reconciliation; missing-loss disclosure"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "accepted net reference, packaging, rejection and final operation"
      record_type: "dispatch acceptance ledger"
      raw_fields: "actual species/source qualification; previous state; net/gross/tare masses; trim/soil boundary; moisture/grade; gate/time/temperature; package mass/reuse/returns; rejected/other-goods destinations; energy/service/users; named emissions; stock"
      collection_method: "Weigh on calibrated scale excluding packaging; reconcile acceptance, upstream lot and dispatch records; inspect documented product qualification, not AI edibility inference"
      unit: "kg; MJ; h in separate raw fields"
      frequency: "each accepted dispatch and reject event"
      temporal_coverage: "actual dispatch time and asset-use period"
      site_scope: "declared gatherer or primary-producer gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "net/tare checks; acceptance and source traceability; reuse ledger; recorded quality qualification"
  calculation_rules:
    - id: reference_normalization
      applies_to: "all inventory rows"
      rule: "Divide each actually attributable exchange total by matched accepted net dispatch kilograms; retain its numerator unit. The linked final product is 1 kg, not a harvest yield."
      inputs:
        - "attributable exchange"
        - "accepted net dispatch mass"
        - cp_handover
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: lot_mass_reconcile
      applies_to: "material and stock ledgers"
      rule: "Reconcile opening stock plus actual inputs against closing stock, all intended outputs, exported waste, retained source residues and substantiated environmental losses. Track attached soil separately. Report nonclosure, measurement uncertainty and unknown loss; never label unexplained fresh mass loss as water evaporation."
      inputs:
        - "matched source/lot/period weights"
        - "water and soil records"
        - "all destinations"
      output: "closed lot ledger or explicit gap"
      source_ids: []
    - id: energy_conversion
      applies_to: "energy umbrellas"
      rule: "Preserve carrier quantities; use documented actual-carrier net calorific value/density where conversion is necessary, or 3.6 MJ per measured electricity kWh; verify inclusive-service exclusions."
      inputs:
        - "actual carrier quantity"
        - "compatible factor evidence"
      output: "carrier-specific energy amount"
      source_ids: []
    - id: shared_use
      applies_to: "shared assets and periods"
      rule: "Attribute documented total service burden according to compatible measured consumer usage divided by all-user usage within the same service period, retaining idle/repair/replacement decisions and actual multi-output rule."
      inputs:
        - "consuming-node/period service use"
        - "total-use ledger"
        - "burden boundary"
      output: "singly attributed service share"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "reference and input lots"
      requirement: "Preserve actual species, edible qualification record, untended-source proof and state; reject cultivated or intentionally enhanced lots. This methodology gives no identification or consumption recommendation."
      evidence: "source and qualified acceptance records"
    - id: physical_quality
      applies_to: "material/stock/water balances"
      requirement: "Record raw fresh input, mineral matter, trim, accepted grades, spoilage, water uptake/loss and stock on common boundaries. Do not transplant dry-weight trade data or historical species yields."
      evidence: "matched calibrated lot ledger and uncertainty"
    - id: operational_quality
      applies_to: "process selection and preservation"
      requirement: "Actual route, owners, temperature/time, service boundary and ingredient/refrigerant identity are mandatory where used; absent refrigeration is not presumed active and unknown activity is not zero."
      evidence: "trip/run/storage logs and supplier evidence"
    - id: coverage_quality
      applies_to: "aggregation"
      requirement: "List all contributing sites, species lots, trips, seasons and periods, exclusions and output weights; justify aggregation only for compatible reference products; incomplete site coverage is disclosed rather than scaled by a guessed habitat yield."
      evidence: "site-period coverage and representativeness record"
    - id: range_quality
      applies_to: "every card"
      requirement: "All non-reference Ranges are broad provisional reasoned QA screens, not collected facts, empirical typical values, recipes or mandatory ceilings. A 10 kg/kg screen spans order-of-magnitude variable feed/loss/material ratios; 20 kg/kg spans conditional cleaning-water throughput; 100 MJ/kg spans manual zero-energy to powered handling/cold storage; 10 h/kg spans shared service intensity. The reference 1..1 expresses only the declared normalization. Foreground amounts require the linked protocol regardless of screen. Review outliers and replace screens with actual evidence; never clip, reject or fill missing values by these estimates."
      evidence: "actual protocols and reviewer judgement; no quantitative FAO source adopted"
    - id: identity_resolution
      applies_to: "all exchanges"
      requirement: "Each actual exchange must resolve to a verified concrete flow/property/unit identity matching substance/source/state/gate/compartment. A conditional umbrella is not itself a universal exchange."
      evidence: "detailed identity and support evidence retained with production package"
validation_rules:
  - rule_id: check_scope
    applies_to: "reference and source"
    rule: "Verify actual untended gathered species, documented edible qualification, fresh/chilled state and producer gate; reject truffles, intentional production and excluded processed states."
    source_ids:
      - unsd-wild-mushrooms
  - rule_id: check_reference
    applies_to: "wild_mushroom_dispatch"
    rule: "Verify 1 kg accepted net output, linked card, actual qualifiers, calibrated net mass and same reference denominator across all rows; inputs and intermediate outputs remain measured."
    source_ids: []
  - rule_id: check_balance
    applies_to: "all actual nodes"
    rule: "Reconcile lot, mineral/foreign matter, water, trim, spoilage and stock; supplied/direct water and predecessor/natural removal are exclusive per portion. Unexplained losses or negative stocks remain gaps."
    source_ids: []
  - rule_id: check_conditional_paths
    applies_to: "process map"
    rule: "Select actual owned gathering/conditioning/preservation, connect feeds and output states, retain predecessor burdens once. Trace every reinspection loop or rejection exit to origin; rejected mass is not an accepted output."
    source_ids: []
  - rule_id: check_attribution
    applies_to: "sites periods and output set"
    rule: "Confirm every intended goods handoff and attribution hierarchy, batch/changeover linkage, all sites and periods, and shared-asset/service/reuse consumers. No omitted contributor, repeated final product or duplicate period/service burden."
    source_ids: []
  - rule_id: check_identity
    applies_to: "concrete exchanges"
    rule: "Verify flow type/direction, actual material/pollutant identity, gate/source or receiving compartment, property/unit and each support reference; no near-match, unknown refrigerant or general dust identity is accepted automatically."
    source_ids: []
  - rule_id: check_evidence
    applies_to: "quantities and ranges"
    rule: "Require raw linked protocols, compatible conversion factors and traceable actual operations. Provisional QA screens cannot provide missing values or prove valid cold-chain conditions; outliers trigger review, not clipping."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground collection/primary-handling dataset for one qualified actual fresh/chilled wild species lot"
  downstream_use: "secondary_dataset or background_dataset only for a compatible declared fresh/chilled producer-gate state"
  allowed_use: "Traceable modelling of untended gathering and actual pre-gate handling with complete flow identities and quality disclosure"
  excluded_use: "Cultivation, habitat enhancement, truffles, dried/frozen/processed output, unknown-edibility assurance, consumer nutrition or avoided-production credit"
  required_metadata: "Actual species/qualification, source and sites, trip/season, node owners, state/gate, grade/moisture/soil/trim, time/temperature, net mass, packages/reuse, output destinations and attribution decisions"
  required_quality_disclosure: "Measured coverage, missing upstream/identity/loss evidence, nonclosure and uncertainty, provisional screens, site-period weighting, factor compatibility and actual service boundaries"
  update_trigger: "Source/species/state/gate or handling change; temperature/period change; material or refrigerant identity change; new evidence, supplier/asset/reuse change or altered output destinations"
