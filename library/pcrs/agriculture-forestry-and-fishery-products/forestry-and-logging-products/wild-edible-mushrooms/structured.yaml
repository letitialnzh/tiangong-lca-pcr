product_category_identity:
  canonical_pcr_id: "pcr.agriculture-forestry-and-fishery-products.forestry-and-logging-products.wild-edible-mushrooms"
  classification_refs: "cpc:3.0:03232; proposed narrower fresh/chilled primary scope"
  covered_products: "Actual qualified fresh/chilled untended gathered edible mushroom fruiting bodies, excluding truffles"
  excluded_products: "Cultivated or intentionally managed-production mushrooms; truffles; substrate or spawn; dried/frozen/processed goods; unidentified or unqualified fungi"
  representative_product: "One actual qualified species/grade gathered fresh mushroom lot at declared producer dispatch"
  production_route: "Untended collection and actual transfer; conditional primary cleaning/trimming/grading; conditional fresh preservation; final acceptance and actual packaging"
  market_state: "Net fresh/chilled fruiting-body lot, with actual grade, moisture, handling state and gate declared"
functional_unit:
  what: "One actual fresh/chilled wild edible mushroom lot at declared gatherer or primary-producer dispatch"
  how_much: "1 kg net as-received accepted fruiting-body product, excluding packaging and separately rejected soil/trim"
  how_well: "Actual species and documented edible qualification, wild source, grade, trim/foreign-matter and moisture basis"
  how_long_or_cycle: "Actual collection trip/season, handling batch, pre-gate storage interval and dispatch time; reusable-asset attribution periods stated"
  reference_flow_link: "wild_mushroom_dispatch"
system_boundary:
  rules:
    - rule_id: wild_origin
      applies_to: "source and reference"
      rule: "Require records demonstrating untended gathering; cultivated or intentional enhancement routes are outside scope. Habitat association is not proof of wild origin."
      source_ids:
        - unsd-wild-mushrooms
    - rule_id: actual_route
      applies_to: "all nodes"
      rule: "Select actual collection, first conditioning and fresh preservation responsibilities from records; bypass absent nodes, connect the last actual upstream state to final acceptance, and assign each material portion and burden once."
      source_ids:
        - fao-fungi-collection
    - rule_id: source_removal
      applies_to: "collection"
      rule: "Collection owns resource removal and harvest together: source interface, removed fresh bodies and measured downstream collected state. Do not create a second removal node or invent managed production. Record attached mineral matter and on-site retained residuals separately."
      source_ids:
        - fao-fungi-collection
    - rule_id: producer_gate
      applies_to: "handover"
      rule: "End at actual gatherer/primary-producer dispatch. Include actual pre-gate presentation; exclude downstream distribution and manufacture. Raw/fresh and preserved/dried states are not assumed equivalent."
      source_ids:
        - fao-fungi-use
    - rule_id: state_destinations
      applies_to: "conditioning and preservation"
      rule: "Separate intended selected grade, other qualified goods, off-spec/reinspection lots, trim, wastewater and spoilage. Every material exit has an actual state and destination; unknown off-spec fate cannot be counted as accepted goods."
      source_ids: []
    - rule_id: shared_period_sites
      applies_to: "all nodes"
      rule: "Enumerate contributing sites, trips, handling runs and storage periods, shared asset consumers and service boundaries. Log cleaning/changeover, replacement, repair and end-of-use once in the correct run/period; disclose physical access impacts and do not invent habitat-area occupation from collection duration."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual untended source with owned gathering, or verified already gathered wild fresh input at the actual entry node; no fictional cultivation phase"
  starting_condition_role: "Documented collection/source responsibility or upstream gathered-product handoff"
  product_classification_scope: "Fresh/chilled primary untended mushroom lot only; CPC 03232 narrower partial coverage, not whole-leaf fresh-state proof"
  recursive_input_rule: "An already gathered same-category input carries its measured state and matching upstream burden once; never add the same natural removal or collection again"
  upstream_dataset_requirement: "Traceable wild origin, lot/state/gate, quality qualification and compatible upstream method; missing prior burden is disclosed as a gap, not assumed zero"
  disclosure: "Source sites, actual owned nodes, collection and storage periods, entry and dispatch gates, packaging/reuse boundary, rejected-material fates and exclusions"
