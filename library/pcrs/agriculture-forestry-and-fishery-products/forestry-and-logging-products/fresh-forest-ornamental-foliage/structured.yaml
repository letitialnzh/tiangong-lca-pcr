product_category_identity:
  canonical_pcr_id: "pcr.agriculture-forestry-and-fishery-products.forestry-and-logging-products.fresh-forest-ornamental-foliage"
  classification_refs: "CPC 3.0 03249; narrower"
  covered_products: "Fresh untended-forest ornamental leafy sprays, leaves, fronds and boughs; species/part and accepted grades declared"
  excluded_products: "Cultivated, rooted, flowering, moss/lichen/grass-only, composed, dried, dyed or chemically preserved goods; whole Christmas trees"
  representative_product: "Fresh salal (Gaultheria shallon) leafy sprays; no fixed species mix"
  production_route: "Actual forest gathering/removal; actual primary preparation if performed; grade/destination acceptance; actual protection/holding and primary collector dispatch"
  market_state: "Fresh flowerless ornamental parts, loose or simply protected/tied, at documented primary collector handover; net accepted plant mass"
functional_unit:
  what: "Net accepted fresh flowerless ornamental forest foliage at actual primary collector dispatch"
  how_much: "1 kg"
  how_well: "Declared species/part, accepted grade, freshness and moisture; no universal grade or shelf-life value"
  how_long_or_cycle: "One declared dispatch lot traced through gathering, actual handling and holding; report every contributing site and season, opening/closing stocks and actual holding intervals"
  reference_flow_link: "foliage_handover"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Maintain a separate incidental-matter mass ledger: original source, gathering input foliage_incidental_removal, each batch-linked internal receipt/transfer, opening/closing stocks and actual return/sale/discard destination. Ornamental-part removal and incidental-matter quantities must not overlap. Environmental return outputs must trace to actual removal and node receipt; return cannot exceed the available actual material, and discrepancies require investigation. Incidental matter never contributes to foliage_handover net reference mass."
      source_ids: []
    - rule_id: forest_origin
      applies_to: "source"
      rule: "Evidence untended forest origin and real plant part independently of access paperwork; do not convert access documents into cultivation or sustainability proof. The forest route is distinct from cultivated ornamental production."
      source_ids:
        - usda-ntfp-2018
    - rule_id: actual_route
      applies_to: "foreground"
      rule: "Include actual collection/removal, transfers before handover, preparation if performed, acceptance and actual protective presentation/holding to primary collector dispatch. Do not invent preparation or coolant/water consumption for an absent intervention; retain its actual bypass and acceptance."
      source_ids: []
    - rule_id: natural_interface
      applies_to: "resource_and_loss"
      rule: "Separate the natural removed-material input from collected-product output. Material never removed is not an exchange; material removed then returned requires a recorded environmental destination. Distinguish intentional sales, internal transfers, discard and direct release."
      source_ids: []
    - rule_id: site_period_assets
      applies_to: "scope_and_attribution"
      rule: "List every source/handling site, lot, reporting season, stock interval, shared asset and consuming node. Apply measured site/period links and a documented service attribution; no universal asset lifetime or annualization value. Prevent gaps and duplicate site/stock/asset totals."
      source_ids: []
    - rule_id: end_gate
      applies_to: "dispatch"
      rule: "The actual primary collector handover ends the foreground boundary. A brush-shed or trader receipt is evidence only if it is the declared actual handover; exclude onward wholesale distribution, arrangement, retail and end-of-life. Do not truncate upstream gathering merely to fit a product-flow candidate."
      source_ids: []
    - rule_id: system_boundary_rule_7
      applies_to: "foreground_system_boundary"
      rule: "Select the route from actual incoming state and ownership. Qualified purchased harvested, extracted, prepared or graded feed may enter at its real receiving node; completed upstream operations are not mandatory foreground operations and standing stock or biological resources must not be charged again. Receiving cards record actual material, grade, wet/dry basis, receipt gate, upstream dataset and process coverage; add the actual receiving exchange if none exists. Bypass does not remove upstream burdens; actual operations cannot be skipped and final reference product, quality and gate remain unchanged."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Identified untended forest plant source immediately before actual gathering, with location/species/parts evidenced; no managed-growing stage assumed"
  starting_condition_role: "Natural source interface; gathered foliage becomes a technosphere product after removal"
  product_classification_scope: "Fresh wild leafy subset of CPC 03249, not the complete ornamental-material class"
  recursive_input_rule: "If already gathered same-category foliage is actually purchased, replace only its represented upstream gathering with a compatible linked dataset; preserve supplier origin/gate and do not add that gathering again"
  upstream_dataset_requirement: "Compatible origin/state/part, boundary and net-mass basis; actual supplies/services require their own background records without duplicate owned activity"
  disclosure: "Actual source sites, species/parts, gathered quantities, nodes and bypasses, internal transfers, seasons/stocks, handover, exclusions, returns and uncertainty"
