    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual exchange property"
      uuid: ""
    required_unit: "actual recorded unit"
    rule: "Every inventory amount is per 1 kg reference flow. Collect lot totals and attributed activity quantities, divide by the same accepted net dispatch mass; do not divide by bunch count or an internal node output. Retain unnormalized totals and loss/stock reconciliation."
  - id: actual_exchange_units
