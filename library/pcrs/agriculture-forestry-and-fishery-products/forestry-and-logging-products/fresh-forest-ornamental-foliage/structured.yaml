validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_product"
    rule: "Confirm final product is fresh, flowerless, forest-sourced ornamental leafy material; all required qualifiers, actual primary handover, calibrated net-mass protocol and real foliage_handover link are present. Reference amount is exactly 1 kg; intermediate quantities remain measured."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "routes_sites_periods"
    rule: "Check actual node activation/bypasses, every contributing site, season, opening/closing stock, loss and destination. Validate lot mode, cleaning/changeover events, reinspection loops and all accepted/other output handovers; no reject contributes accepted denominator."
    source_ids: []
  - rule_id: validate_attribution
    applies_to: "shared_burdens"
    rule: "Check causal or compatible fresh-mass attribution, actual service-use evidence, all consumers/periods and complete allocation shares; no duplicate owned transport/purchased service, shared asset, period or internal transfer burden."
    source_ids: []
  - rule_id: validate_exchanges
    applies_to: "inventory_rows"
    rule: "Every actual exchange must have concrete verified identity, actual direction/type/property/unit, observed or method-supported quantity and collection link. A provisional screen is not a value or acceptance threshold; no elementary substance or credit is inferred. Checker success does not verify a UUID."
    source_ids: []
  - rule_id: validate_parity
    applies_to: "bilingual_projection"
    rule: "Check corresponding process/direction/type/row_id cards, amount rules, Range metadata, reference identity, rule ids and collection basis in both languages and generated projection."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile required/conditional activation and upstream coverage against incoming state at each node; purchased completed-state feed must not duplicate growth, harvest or preparation. Equal classification does not replace state and gate matching."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared fresh wild ornamental leafy product through the verified primary collector gate; linked background use only for compatible source/state/basis"
  excluded_use: "Cultivated or transformed/composed goods, other CPC03249 members, post-handover distribution/use/end-of-life, undisclosed species/source or unverified final exchanges"
  required_metadata: "species and accepted plant part; untended forest origin and gathering location; ornamental intended use; absence of flowers/buds and roots; accepted grade/buyer specification; fresh state and moisture description; actual trimming and preservation operations including their absence; net-mass and tare method; lot/site/season and actual holding times; actual primary collector handover location and recipient; presentation and returnable-packaging status; reference net mass; source sites/periods; actual nodes; stock and transfer graph; attribution decision; verified concrete identities"
  required_quality_disclosure: "Actual coverage, measured versus missing/absent quantities, scale/transfer evidence, origin/part proof, allocation basis, uncertainty and provisional-range status; candidate identity gaps cannot be hidden by a check pass"
  update_trigger: "New species/part/origin or actual gate, material treatment, route/node changes, loss/moisture measurement, new sites/periods/shared assets, improved UUID or quantitative evidence"
