  calculation_rules:
    - id: lot_basis
      applies_to: "all inventory rows"
      rule: "For each concrete exchange, divide the attributable lot total by accepted net fresh dispatch mass in kg; preserve original units and activity/attribution evidence. The final reference product remains exactly 1 kg, while internal transfers keep their measured ratios."
      inputs:
        - cp_dispatch_mass
        - cp_foliage_gather
        - cp_foliage_prepare
        - cp_foliage_accept
        - cp_foliage_dispatch
      output: "actual exchange quantity per 1 kg reference flow"
      source_ids: []
    - id: lot_reconciliation
      applies_to: "source, node transfers and stocks"
      rule: "Reconcile opening stock plus actual receipts/removal against accepted transfers/dispatch, deliberate other sales, discard, natural return, evidenced physical moisture loss and closing stock. Keep attached foreign matter on its own measured basis. Investigate differences; never insert a residual as an invented emission."
      inputs:
        - cp_foliage_gather
        - cp_foliage_prepare
        - cp_foliage_accept
        - cp_foliage_dispatch
      output: "lot/node/period reconciliation record"
      source_ids: []
