      requirement: "Verify actual species, plant part, forest origin, ornamental use and state at final gate; paperwork alone or a provider name is insufficient. Compatible internal transfers may retain the same identity."
      evidence: "lot species/part, source-site and acceptance evidence"
    - id: coverage_quality
      applies_to: "site_and_period"
      requirement: "Retain every contributor, lot, return, hold and stock interval, no omitted sites, duplicate transfers or unweighted intensity average; state exclusions and representativeness."
      evidence: "contributor register, period/lot links and aggregation reconciliation"
    - id: missingness_quality
      applies_to: "conditional_exchanges"
      requirement: "Differentiate measured zero, activity absent and missing information. Identify each actual umbrella exchange and verify its UUID/support before final TIDAS use; replace provisional screens only with reviewed evidence, not forced values."
