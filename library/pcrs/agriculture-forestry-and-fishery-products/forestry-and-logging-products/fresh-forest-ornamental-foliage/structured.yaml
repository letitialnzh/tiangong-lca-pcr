allocation_rules:
  - rule_id: output_attribution
    applies_to: "intended_outputs"
    rule: "Enumerate each intended accepted grade and each separately sold plant-part output, with its real handover and quantity. First separate independently measured activities; for inseparable common gathering/handling of compatible fresh grades, use measured net accepted fresh mass shares only with disclosed moisture/part equivalence. Incompatible products require a documented causal decision; absent evidence blocks finalization, not an automatic mass or price default."
    source_ids: []
  - rule_id: reject_burdens
    applies_to: "rejects_and_returns"
    rule: "Discarded, downgraded and internally returned quantities do not enlarge the reference denominator. Retain the burdens of rejects and repeated work, assign deliberate sales explicitly, reconcile loops and eliminate the internal transfer once in aggregation; no automatic avoided-treatment or carbon credit."
    source_ids: []
  - rule_id: period_site_sharing
    applies_to: "sites_periods_and_shared_assets"
    rule: "Trace batches and opening/closing stocks across source sites, seasons and actual storage phases. Attribute shared vehicle, tool, holding-space or contracted-service use by evidenced actual service use within declared periods; retain full consumer totals and allocation shares. Aggregate attributable totals divided by total compatible accepted dispatch mass, not an unweighted mean of site intensities. Do not count the same shared run, purchased service or asset twice."
    source_ids: []
