      name: "applicable property of each actual exchange"
      uuid: ""
    required_unit: "actual unit of each exchange"
    rule: "Keep each fuel/electricity/service and each substance quantity separately; convert only with evidenced units, factors and basis. Do not sum unlike service units or pollutant species into a fictitious exchange. Mass support references are not evidence of any product or pollutant UUID."
