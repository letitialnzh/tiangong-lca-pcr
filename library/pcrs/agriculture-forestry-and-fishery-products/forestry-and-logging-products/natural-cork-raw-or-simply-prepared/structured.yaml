allocation_rules:
  - rule_id: output_owner
    applies_to: "every source/removal/qualification output"
    rule: "Enumerate all intended outputs and real handoffs, including actual stand goods, coppice wood and other qualified cork grades. Distinguish retained biomass, loss, rejected material and waste; one good cannot be sold at two model handoffs."
    source_ids: []
  - rule_id: subdivision_first
    applies_to: "shared product burdens"
    rule: "Subdivide separately metered production and operations first. For residual common stand/extraction or multi-grade burden, document the causal physical allocation basis and actual output data; if no defensible physical relationship exists, use documented economic shares of the same period and market gates with sensitivity disclosure. No default mass allocation across whole-tree and bark stocks or automatic substitution credit."
    source_ids: []
  - rule_id: period_share
    applies_to: "stand phases and stock periods"
    rule: "Assign establishment, maintenance, harvest and actual replacement/termination to evidenced cohorts and periods; allocate yard/boiler/storage service by actual use. Carry previous stock burdens forward, not as newly harvested product. Unknown phase attribution blocks final concrete dataset completion."
    source_ids: []
  - rule_id: run_share
    applies_to: "batch or continuous campaigns"
    rule: "Attribute common startup, cleanout and changeover to recorded runs and participating lots; ensure shares reconcile to one common run total. Count boiling baths/circulation, rest and packaging once."
    source_ids: []
  - rule_id: asset_share
    applies_to: "shared infrastructure"
    rule: "Enumerate actual consuming nodes and periods for every shared asset or service. Use documented service use with denominator, non-cork consumers and residual share; do not duplicate an inclusive upstream service with own asset or utilities."
    source_ids: []
  - rule_id: reject_path
    applies_to: "all producing nodes"
    rule: "Link off-spec material to actual rework, downgrade, recovery or waste recipient at its producing node. A returned lot keeps incurred burdens and rework inputs, but no second final output; exclude unresolved rejects from accepted net cork and retain real waste burdens."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_stand
      process_id: "stand_management"
      flow_role: "stand inputs, attributable bark, land and other goods"
      record_type: "stand/cohort/service records"
      raw_fields: "species; stand/source id; establishment and maintenance phase; area and dates; harvest history; attributable bark quantity; materials; energy carrier; service asset/consumer; independent output; emissions substance/medium"
      collection_method: "Collect source-owner records, weigh bark at handoff and match phase/event inventories; explicitly classify materials, services, products and retained stock"
      unit: "actual kg, MJ, h and m2a separately"
      frequency: "each phase/event and reporting period"
      temporal_coverage: "actual establishment through covered harvest and relevant replacement/termination"
      site_scope: "each contributing stand"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "traceable owners, calibrated quantities, area/time maps and reconciled phase shares"
    - protocol_id: cp_stripping
      process_id: "bark_stripping"
      flow_role: "source feed, raw bark, services, wood, waste and emissions"
      record_type: "extraction campaign records"
      raw_fields: "route recurrent/coppice; source portion; incoming bark/wood quantity; felling owner; virgin/secondary/reproduction; bark/back inclusion; raw wet mass; moisture basis; independent wood handoff; retained material; fuel/service; waste recipient; pollutant/compartment"
      collection_method: "Weigh the extraction handoffs; record actual tree/wood interfaces, source ownership, incidental and retained materials; independently document direct substances"
      unit: "actual kg, MJ and h separately"
      frequency: "each extraction source lot/campaign"
      temporal_coverage: "actual harvest and covered reporting period"
      site_scope: "each source/removal site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "source permissions/owners, calibration, stock/output reconciliation and recipient records"
    - protocol_id: cp_rest
      process_id: "rest_and_transfer"
      flow_role: "cork transfer, energy, services, rejects and water and direct emissions"
      record_type: "yard/transfer/stock records"
      raw_fields: "lot; incoming/closing mass; preparation state; moisture method; opening/closing stock; dates; actual rain uptake/drainage; service and route; energy; water vapour basis; rejects/recipient; named emission substance/particle size or composition; compartment; actual fuel/equipment activity; measurement or activity-factor evidence"
      collection_method: "Weigh matched cork lots before/after rest, document stock and actual water changes; measure service use and water-specific balances without equating all mass loss with evaporation; measure or calculate each direct substance from actual activity evidence, excluding inclusive service and water-vapour duplication"
      unit: "actual kg, MJ and h separately; transport native units retained"
      frequency: "each lot/transfer and stock period"
      temporal_coverage: "actual rest and dispatch periods"
      site_scope: "each yard and transfer owner"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "paired-lot records, moisture tests, actual route and complete opening/closing stock"
    - protocol_id: cp_boiling
      process_id: "simple_boiling"
      flow_role: "cork, supply/abstraction water, heat, services and exits"
      record_type: "run/bath/stabilization records"
      raw_fields: "lot; incoming/output wet mass; moisture; batch/continuous mode; run/date; temperature/time actually used; fresh-water source; circulation; water retained/vapour/liquid; dissolved/suspended matter; energy; shared service; cleaning/changeover; recipients; pollutants"
      collection_method: "Meter actual incoming/fresh and outgoing water, weigh cork and sample moisture/extractives; trace circulating bath independently, meter energy and record actual run cleaning/changes"
      unit: "actual kg, MJ and h separately"
      frequency: "every actual run/bath and stabilization lot"
      temporal_coverage: "actual treatment/stabilization periods"
      site_scope: "each boiler and stabilization owner"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration, matched wet/dry/water balances, run totals and actual treatment recipients"
    - protocol_id: cp_handover
      process_id: "qualification_handover"
      flow_role: "final cork, other grades, packaging, energy, services and rejects and direct emissions"
      record_type: "acceptance/package/dispatch records"
      raw_fields: "source lot; actual state; species; harvest type; form/back inclusion; gross/tare/net mass; moisture method/basis; grade; all grade recipients; gate/date; packaging material/reuse; services; rejection/return path; named emission substance/particle size or composition; compartment; actual fuel/equipment activity; measurement or activity-factor evidence"
      collection_method: "Weigh accepted cork on a calibrated scale excluding packaging; identify actual state and grade; reconcile all other outputs and stocks and document actual presentation/reuse; measure or calculate each direct substance from actual activity evidence, excluding inclusive service and water-vapour duplication"
      unit: "actual kg, MJ and h separately"
      frequency: "every accepted lot and associated grading/packaging run"
      temporal_coverage: "actual qualification and dispatch reporting period"
      site_scope: "every contributing handover site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibrated weighing, matched acceptance/dispatch notes, grade thresholds, recipient and return evidence"
  calculation_rules:
    - id: record_normalization
      applies_to: "all inventory rows"
      rule: "Sum each separately identified attributable exchange over matched lot coverage and divide by the same accepted reference-lot net kg; final accepted product is the declared 1 kg reference flow. Preserve actual numerator units and documented upstream/shared-output shares."
      inputs:
        - "process records"
        - "accepted net mass"
        - cp_handover
      output: "amount per 1 kg reference flow"
      source_ids: []
    - id: state_reconciliation
      applies_to: "cork and water ledgers"
      rule: "Reconcile measured incoming material plus actual additions and opening stocks against accepted/other product, waste, actual elementary exits and closing stocks; track dry cork, water and extractives separately and explain residuals without automatic evaporation or yield factors."
      inputs:
        - "paired lots"
        - "moisture basis"
        - "rain/water records"
        - "stock and recipient records"
      output: "transparent state and water reconciliation"
      source_ids: []
    - id: aggregation
      applies_to: "multi-site and multi-period data"
      rule: "Enumerate every site and source portion, sum attributable amounts and accepted net mass under matching product/state/gate coverage, and derive mass-weighted intensity from those sums; disclose excluded contributors and heterogeneity. Do not average site intensities unweighted or duplicate transferred lots."
      inputs:
        - "site/period ids"
        - "accepted mass"
        - "attributed records"
      output: "representative covered-lot inventory"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all exchanges and reference"
      requirement: "Declare actual product/substance, source, state, gate, media and verified concrete UUID/support for the final dataset; umbrella or unresolved identity is not an authorized final exchange"
      evidence: "exact identity and support evidence; acceptance and recipient records"
    - id: coverage_quality
      applies_to: "phases, sites and runs"
      requirement: "Enumerate every contributing stand/site and owned phase/run; link all amounts and events to that boundary and document site weighting/heterogeneity and actual bypasses"
      evidence: "phase/site register, source shares, allocation reconciliation"
    - id: mass_quality
      applies_to: "feeds, stocks and outputs"
      requirement: "Keep matched-lot net wet mass, dry matter and water accounting; record rain uptake, dissolved matter, storage changes and actual destinations. No numerical factor from illustrative industry/FAO examples is a default"
      evidence: "paired scales, moisture methods, bath and stock balances"
    - id: range_quality
      applies_to: "all cards"
      requirement: "Provisional numerical screens are author reasoning only; replace with reviewed local empirical ranges when available. Outliers trigger explanation, not clipping or automatic rejection. Do not confuse absence, missing records and measured zero"
      evidence: "collected observations, uncertainty statement and outlier review"
    - id: burden_quality
      applies_to: "upstream and shared operations"
      requirement: "Missing source, stock, period, asset or reject burden is a data gap. Disclose unresolved shares and sensitivity rather than assigning zero, universal lifetimes or presumed carbon credits"
      evidence: "source coverage, consuming-node and period shares; uncertainty evidence"
validation_rules:
  - rule_id: scope_gate
    applies_to: "final reference"
    rule: "Require one actual allowed raw/simple state and producer gate with complete qualifiers; reject downstream debacked/shaped/granulated/finished reference products. No substitute state chosen merely for its available UUID."
    source_ids:
      - unsd-cpc3-notes
  - rule_id: reference_check
    applies_to: "cork_handover and amounts"
    rule: "Confirm final net 1 kg and all inventory per 1 kg reference flow with cp_handover matched denominator; other feeds/transfers remain measured, not fixed to reference."
    source_ids: []
  - rule_id: route_check
    applies_to: "source and process map"
    rule: "Verify parent/source-delta evidence, exclusive same-portion source representations and actual operation activation, including any coppice felling/wood owner. Missing source state is not an inactive default."
    source_ids: []
  - rule_id: balance_check
    applies_to: "mass, stock and water"
    rule: "Reconcile wet/dry cork, retained stock, additions, liquid/vapour/extractive exits, losses and other goods across owned interfaces; investigate residuals and provisional-range outliers without replacing real records."
    source_ids: []
  - rule_id: owner_check
    applies_to: "runs, sites, periods and shared burden"
    rule: "Require complete site/phase/run registers and shares, including cleaning/changeover and replacement/termination where actual. Reconcile common burden to one total with no duplicated source stock, asset, service or upstream emissions."
    source_ids: []
  - rule_id: destination_check
    applies_to: "grading, packaging and rejects"
    rule: "Enumerate all actual grade/output recipients, waste treatment and rework/return paths. Exclude unresolved rejects from acceptance and disclose packaging reuse/end-of-use without counting it in net cork mass."
    source_ids: []
  - rule_id: identity_check
    applies_to: "concrete dataset exchanges"
    rule: "Verify exact UUID and property/unit support for every actual concrete exchange; specify each direct pollutant and actual compartment. A semantic umbrella, broad VOC/dust or unresolved product UUID is not a verified exchange."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset for the same actual cork state and gate"
  allowed_use: "Source production or consumption of the declared raw/simply prepared cork lot with disclosed burden and actual preparation"
  excluded_use: "Automatic proxy for debacked/shaped/granulated/agglomerated cork, stoppers or finished articles; whole-tree carbon credit; undifferentiated raw/prepared mixtures"
  required_metadata: "species; harvest type; source and state; back inclusion; moisture basis; grade; owned/bypassed nodes; parent/delta source route; gate; dates; contributors; source coverage; stock and burden attribution"
  required_quality_disclosure: "completeness, calibration, allocation/aggregation evidence, native unit conversions, empirical versus provisional Range, rejected-material destinations, identity/support gaps and uncertainty"
  update_trigger: "Product state, source ownership/route, preparation, gate, grade, site/period mix, allocation, evidence or concrete exchange identity changes"
data_sources:
  - id: "unsd-cpc3-notes"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 explanatory notes, sections 03220 and 31921/31922; https://unstats.un.org/UNSDWebsite/statcom/session_56/documents/BG-3o-Explanatory_Notes_of_the_Central_Product_Classification_Version3-E.pdf; retrieved 2026-10-08"
    used_for: "Raw/simple category and exclusion of downstream cork forms; not quantity factors"
  - id: "fao-cork-primary-handling"
    type: "official_guidance"
    reference: "FAO, Non-wood forest products from broadleaved trees in temperate and boreal zones, Chapter 6; https://www.fao.org/4/y4351e/y4351e0a.htm; retrieved 2026-10-08"
    used_for: "Recurrent bark harvest versus actual coppice wood/bark source context and primary handling; historical ages, intervals, yields and statistics not adopted"
  - id: "apcor-cork-transformation"
    type: "extension_guidance"
    reference: "APCOR, Transformation Process; https://apcor.pt/en/transformation-process; retrieved 2026-10-08"
    used_for: "Rest, boiling, stabilization and downstream manufacture distinction; examples of times, moisture and expansion not adopted"
