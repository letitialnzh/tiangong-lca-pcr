product_category_identity:
  canonical_pcr_id: "pcr.agriculture-forestry-and-fishery-products.forestry-and-logging-products.natural-cork-raw-or-simply-prepared"
  classification_refs: "cpc:3.0:03220"
  covered_products: "Qualified natural cork in raw or simply cleaned/rested/boiled state, with unremoved back and no manufactured geometry"
  excluded_products: "Debacked or roughly squared/shaped cork; granules/powder; reference waste cork; agglomerates; stoppers; finished cork articles"
  representative_product: "One actually qualified bark-plank or irregular cork lot at declared producer handover"
  production_route: "Attributable stand management and actual bark extraction, followed only by actual transfer/rest, simple boiling/stabilization, grading and conditional packaging; already-harvested purchases start at their disclosed incoming interface"
  market_state: "Raw or simply prepared primary cork; actual state, grade and producer gate required"
functional_unit:
  what: "One actual qualified lot of natural cork at declared primary producer handover"
  how_much: "1 kg net as received, excluding transport packaging"
  how_well: "Declared species, harvest type, allowed physical preparation state, unremoved back/bark inclusion, moisture and acceptance grade"
  how_long_or_cycle: "Actual harvest cohort, stand phases, extraction campaign, yard/boiling runs, storage periods and dispatch period; no universal stripping interval"
  reference_flow_link: "cork_handover"
system_boundary:
  rules:
    - rule_id: source_ownership
      applies_to: "source and removal"
      rule: "Select exactly one source representation for the same bark portion: managed production feed, already-produced coppice wood/bark feed, or actual elementary natural bark resource. Own actual felling once when present; retain the remaining living-tree stock without treating it as harvested cork."
      source_ids:
        - fao-cork-primary-handling
    - rule_id: operation_activation
      applies_to: "process map"
      rule: "Activate only actual owned pre-gate operations; purchases may bypass owned stand/removal/rest/boiling. qualification_handover always owns final weighing and acceptance. Preserve measured handoffs when operations are bypassed."
      source_ids: []
    - rule_id: primary_gate
      applies_to: "primary preparation"
      rule: "Include actual simple rest/boiling/stabilization and acceptance; do not include later debacking, shape manufacturing, grinding, stopper making or distribution. Raw output does not require boiling."
      source_ids:
        - unsd-cpc3-notes
        - apcor-cork-transformation
    - rule_id: source_delta
      applies_to: "stand_management and bark_stripping"
      rule: "Recurrent-peeling and coppice interfaces are exclusive for each source portion, with actual tree/wood/bark inventories and wood-output ownership proving the delta; no unsupported parent or default felling."
      source_ids:
        - fao-cork-primary-handling
    - rule_id: period_sites
      applies_to: "complete route"
      rule: "Link establishment, maintenance, recurring harvest, replacement/termination where actual, yard stock and dispatch periods to contributing sites; reconcile opening/closing bark and cork stock. Separate burden shares by cohort and period, never by a universal harvest cycle."
      source_ids: []
    - rule_id: shared_owner
      applies_to: "assets and services"
      rule: "Enumerate every shared road, yard, boiler or equipment consumer and period; attribute from recorded service use once. Inclusive outsourced operations cannot duplicate their embodied utilities or direct emissions."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Identified managed stand/cohort, actual natural bark source or upstream already-produced cork/wood lot at its measured incoming handoff"
  starting_condition_role: "source production or already-produced technosphere input, chosen from actual source ownership"
  product_classification_scope: "Natural cork raw or simply prepared; downstream debacked/shaped/granulated cork and manufactured articles excluded"
  recursive_input_rule: "An already-produced same-category cork input retains its actual incoming state, verified upstream coverage and measured quantity; do not recursively regenerate its prior bark harvest or duplicate natural resource removal"
  upstream_dataset_requirement: "Require source production and extraction coverage for purchased bark/wood/cork; a missing burden is a disclosed data gap, not a zero-impact feed"
  disclosure: "Actual operation activation, source portions and owners, contributing stands/sites, phase/campaign/run/stock periods, service boundaries, final state and actual gate"
