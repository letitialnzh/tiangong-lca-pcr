          description: "Separate each intentionally supplied grade, co-product or actual rework return, with state, recipient and destination. Internal rework retains original burdens and is not an independent co-product; a sold downgrade and a waste must not share the same classification. Enumerate the complete independent output set for allocation. Range evidence requirement: no category-wide numerical bound is prescribed for this conditional role. Establish a quantitative screen only after the concrete identity, state, native unit, denominator and compatible route/site/period evidence are known; document bounds and uncertainty without clipping measured values. Until then range screening is explicitly unavailable, not a default zero or a completeness claim."
          amount:
            expression: "Actual attributable quantity from cp_dispatch divided by the same accepted net dispatch mass from cp_reference; retain each concrete exchange and its actual unit separately."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_dispatch
              source_ids: []
            ranges: []
      waste:
        - row_id: dispatch_waste
          role: "Actual waste transferred to a managed recipient"
          name: "Actual waste transferred to a managed recipient"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Identify each actual solid reject, spent agent, used package or wastewater and its recipient/treatment. Separate water and solute composition when required; record physical waste once and treatment burden once. Do not record waste to treatment as a direct environmental emission, or assume unmeasured conditional waste is zero. Range evidence requirement: no category-wide numerical bound is prescribed for this conditional role. Establish a quantitative screen only after the concrete identity, state, native unit, denominator and compatible route/site/period evidence are known; document bounds and uncertainty without clipping measured values. Until then range screening is explicitly unavailable, not a default zero or a completeness claim."
          amount:
