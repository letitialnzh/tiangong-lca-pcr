      collection_method: "Measure physical receipts, outputs, stocks and relevant moisture/composition; meter actual supplies and retain invoices/operation and factor records. Identify material/grade/state at each handoff and preserve independent evidence of absence. Keep each concrete exchange in its native unit; do not backfill missing values."
      unit: "kg; actual concrete exchange units"
      frequency: "each lot, activity, stock movement and attributable service period"
