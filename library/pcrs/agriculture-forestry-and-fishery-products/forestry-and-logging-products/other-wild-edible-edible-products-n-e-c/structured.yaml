            ranges: []
      elementary:
        - row_id: dispatch_returns_releases
          role: "Actual environmental returns and identified direct releases"
          name: "Actual environmental returns and identified direct releases"
          flow_type: "elementary"
          property_unit: "Mass / kg"
          description: "Separate returned target/incidental matter, discharged water and each named emitted substance with receiving compartment. Use measured quantities or a documented compatible activity-factor calculation, including treatment emissions, evaporation, combustion, field losses or refrigerant leakage only when actual and evidenced. Reconcile returns with available receipts/removal. A balancing residual is not an emission, and a return is not an automatic credit. Range evidence requirement: no category-wide numerical bound is prescribed for this conditional role. Establish a quantitative screen only after the concrete identity, state, native unit, denominator and compatible route/site/period evidence are known; document bounds and uncertainty without clipping measured values. Until then range screening is explicitly unavailable, not a default zero or a completeness claim."
