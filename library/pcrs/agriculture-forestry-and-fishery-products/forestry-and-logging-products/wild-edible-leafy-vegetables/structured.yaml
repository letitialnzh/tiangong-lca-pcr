    rule: "Enumerate target leafy grades and all actual distinct intended sold or usable goods with their true handoffs. Use measured subdivision and direct burden tracing first. If shared burdens remain, document a causally justified physical split; if none is defensible, use disclosed period- and gate-matched economic values with sensitivity and reasons. Do not mix methods without precedence or apply automatic substitution credits."
    source_ids: []
  - rule_id: allocation_shared_trips_assets
    applies_to: "trips and shared assets"
    rule: "Attribute collectors' successful and unsuccessful campaign trips, transfer vehicles, tools, containers and cooling/storage to identified consumers and periods using observed service use or a documented causal driver. Resolve idle capacity and failed-trip burdens explicitly. Service invoices that include energy/materials/asset use exclude their duplicate standalone entries."
    source_ids: []
  - rule_id: allocation_period_sites_stock
    applies_to: "seasons, sites and stocks"
    rule: "Link gathering dates, conditioning/holding intervals, stock movements and asset service/replacement/termination to reporting periods; use measured site quantities and actual burden contributions, not an unweighted mean. Carry attributable stock burdens across periods, attribute remaining failed-trip/service burden to the evidenced campaign output set and disclose no-output periods separately. Never assign the same record twice or silently omit contributors."
    source_ids: []
  - rule_id: allocation_rework_rejects
    applies_to: "returned lots and waste"
    rule: "Rework retains original burdens and adds only measured incremental operations. Actual sold downgrade is an intended output at its real exit; waste carries relevant handling/treatment under disclosed boundary; direct source returns have no automatic credit. Rejects and unaccepted stock never enlarge accepted reference mass."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "handover"
      flow_role: "net accepted reference mass and eligibility"
      record_type: "acceptance and weighing record"
      raw_fields: "lot ID; species; edible parts; food-use eligibility and later safe-use conditions; wild-origin evidence; source site/season; gate; gross; tare; attached soil; excluded parts; accepted net kg; moisture/surface water; recipient"
      collection_method: "Weigh accepted net fresh leafy product on a calibrated scale; reconcile same lot, part/grade acceptance and documented tare/foreign matter; retain species and source identification evidence."
      unit: "kg"
      frequency: "each accepted lot and dispatch"
      temporal_coverage: "declared season with actual dispatch dates and stock carryover"
      site_scope: "each actual contributing source and acceptance site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; tare checks; acceptance and species/source records; chain of custody"
    - protocol_id: cp_gather
      process_id: "gather"
      flow_role: "removal, receipt, work and every exit"
      record_type: "trip/source/receipt and quantity ledger"
      raw_fields: "site; season; trip/lot ID; successful and unsuccessful trips; collector hours; wild-origin evidence; species/parts; own and purchased portions; natural removal fresh kg; supplier gate/upstream dataset; attached foreign matter; incidental soil composition/wet kg and own-gathered versus purchased origin; true soil source and returned/waste destination; collected kg; returned biomass; intended other goods/receiver; waste recipient; energy/material/provider/native units; assets/consumers/service period; named emission/substance/compartment/activity/factor/basis"
      collection_method: "Weigh own collected and received portions, separate attached soil wet mass by true origin/composition, and actual exits; record complete trip work and absence evidence, provider and meter/invoice records, shared-asset use and independently measured or transparent substance-specific activity-factor emissions. Do not estimate removed biomass from a crop yield."
      unit: "kg; MJ; h; actual verified native units"
      frequency: "each trip, receipt, exit and service event"
      temporal_coverage: "complete declared gathering campaign including no-output trips and asset service periods"
      site_scope: "all source sites and receiving nodes"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "trip completeness; scale/meter checks; supplier records; allocation ledger; factor provenance and compartment evidence"
    - protocol_id: cp_condition
      process_id: "condition"
      flow_role: "trim/clean/grade inputs and exits"
      record_type: "lot preparation and grade ledger"
      raw_fields: "incoming and returned lot IDs; species/parts; input/prepared/other-grade fresh kg; gross/net/foreign matter; supplied water mass or volume/density; energy/material/provider/native units; grade thresholds; actual recipient; solid rejects; wastewater route/quality; returned soil composition/site/mass; task hours/assets; named emissions/substance/compartment/activity/factor/basis; cleaning/changeover"
      collection_method: "Weigh actual preparation and grade states and residues, meter actual supplies and preserve return links; document washing performed or bypass, water conversion and treatment receiver. Measure separately returned source soil; record only identified actual emissions."
      unit: "kg; MJ; h; actual verified native units"
      frequency: "each preparation batch, grade exit, return and cleaning event"
      temporal_coverage: "declared preparation periods and retained lot dates"
      site_scope: "each preparation site linked to source lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale/meter calibration; grade/recipient records; water density evidence; reject/effluent tickets; return and factor records"
    - protocol_id: cp_hold
      process_id: "hold"
      flow_role: "fresh protection, stock and service inputs/exits"
      record_type: "storage and intervention ledger"
      raw_fields: "lot/site/source/grade IDs; opening/closing stocks and dates; received/dispatched fresh kg; time/temperature/intervention; acceptance state; other goods/recipient; spoilage/waste destination; energy/material/provider/native units; task/asset use and consumer shares; actual leakage/substance/compartment/activity/factor/basis"
      collection_method: "Reconcile physical fresh stocks with dated receipt/dispatch and intervention records; record actual cooling/shade/service use and spoilage with recipients, and only identified measured or substance-specific estimated leakage/emissions. Preserve actual usable states, not an assumed shelf life."
      unit: "kg; MJ; h; actual verified native units"
      frequency: "each stock movement, intervention and loss plus reconciled reporting interval"
      temporal_coverage: "all occupied and attributable idle service periods and stock carryover"
      site_scope: "each actual fresh-holding site and shared facility"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "stock counts; calibrated weighing/meters; dated time/temperature logs; recipient tickets; service and factor evidence"
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "packaging, acceptance, ancillary exits and direct emissions"
      record_type: "final dispatch/return and service ledger"
      raw_fields: "upstream/returned lot ID; input fresh kg; packaging type/material/tare/reuse ID/trips/loss/end-of-use; accepted lot link cp_reference; other intended output identity/state/recipient/value; reject/waste or internal return; actual energy/provider/native units; service and asset consumers/period; named emissions/substance/compartment/activity/factor/basis"
      collection_method: "Reconcile actual final dispatch and packaging records with net acceptance, measured rejects and each true recipient; document reusable container cycles and returns. Retain real task/service/asset evidence and only identified actual direct emissions; exclude downstream distribution."
      unit: "kg; MJ; h; actual verified native units"
      frequency: "each acceptance, dispatch, return and packaging service event"
      temporal_coverage: "complete declared primary handover period and reusable asset service life evidence"
      site_scope: "each primary acceptance site and all contributing upstream lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "acceptance link; tare/reuse ledgers; invoices/meters; actual recipients; loop and factor evidence"
  calculation_rules:
    - id: lot_normalization
      applies_to: "all inventory rows"
      rule: "Divide each attributable measured exchange in its compatible actual unit by the corresponding accepted net fresh kg; reference output equals 1 kg. Preserve separate species/grade/provider units and the documented output-set attribution decision."
      inputs:
        - cp_reference
        - cp_gather
        - cp_condition
        - cp_hold
        - cp_handover
        - "documented attribution and stock links"
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: stock_and_mass_reconciliation
      applies_to: "all physical leafy lots and residues"
      rule: "Reconcile opening plus incoming with closing plus intended exits, rejects, actual returns and independently evidenced water/substance losses on the declared fresh-state basis; disclose residual difference and investigate rather than invent an emission or yield."
      inputs:
        - "actual dated fresh masses"
        - "foreign matter"
        - "surface-water state"
        - "actual loss measurements"
        - "lot links"
      output: "lot/period mass reconciliation and quantified gap"
      source_ids: []
    - id: shared_use_attribution
      applies_to: "shared work and assets"
      rule: "Trace direct work first, then partition shared measured service according to disclosed causal use and complete consumer-period shares. Record failed trips, idle occupancy, stock carryover and replacement/end-of-use once; no universal lifetime factor."
      inputs:
        - "source trip and provider/service records"
        - "asset IDs"
        - consumers
        - "period links"
        - "attribution rationale"
      output: "documented complete burden shares"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity_origin
      applies_to: "every leafy lot"
      requirement: "Demonstrate species/edible parts, n.e.c. eligibility, untended source and safe-use/acceptance conditions. Exclude or separately report uncertain or intentionally managed lots, never pool them into a wild reference."
      evidence: "species/part evidence; source management and chain-of-custody records; explicit classification review"
    - id: quality_measurement
      applies_to: "reference and flows"
      requirement: "Retain calibrated net weighing, tare/foreign matter checks and moisture state; separate carrier/service units and their verified support. Range screens cannot replace measurements."
      evidence: "scale/meter evidence; actual conversion/factor provenance; cp_reference and node ledgers"
    - id: quality_sites_periods
      applies_to: "aggregated campaigns"
      requirement: "Enumerate sites, lots, trips including unsuccessful ones, actual temporal phases and stocks; aggregate measured numerator and accepted output contributions, with exclusions and representativeness rationale disclosed."
      evidence: "contributing-site register; complete trip/period ledger; source-linked numerator/denominator audit"
    - id: quality_routes_coverage
      applies_to: "bypasses, rework and losses"
      requirement: "Declare real process activation and every output destination, failure, internal loop and stock position. Measure each physical handoff for reconciliation, but do not count the same portion as independent final output at both an intermediate and final handoff; unknown loss, use or destination remains an explicit data gap."
      evidence: "dispatch/return records; waste/recipient evidence; quantity reconciliation and gap register"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference product"
    rule: "Check real leafy_handover output, 1 kg normalization, calibrated accepted net basis and complete species/part/origin/grade/gate/safe-use qualifiers. Do not count packaging, soil, unaccepted parts or stock as accepted reference mass."
    source_ids: []
  - rule_id: validate_route
    applies_to: "process map"
    rule: "Check actual gathering/receipt, conditioning, fresh holding and acceptance states and explicit bypasses; final acceptance is mandatory. All rejected states require their producing node, loop or recipient; never count pending rework as accepted."
    source_ids: []
  - rule_id: validate_balance_emissions
    applies_to: "inventory"
    rule: "Reconcile actual physical balances and distinguish intended goods, waste to treatment, physical environmental returns and identified direct substances/compartments. Unsupported evaporation, soil pollutant or crop growth credits fail review."
    source_ids: []
  - rule_id: validate_attribution
    applies_to: "sites, outputs, periods and assets"
    rule: "Verify complete campaign sites/trips including unsuccessful ones, output handoffs, reporting periods, stock carryover and shared consumers; ensure complete causal shares and precedence, no omitted or double-counted records, inclusive services or sold transfers."
    source_ids: []
  - rule_id: validate_units_identity
    applies_to: "concrete exchanges"
    rule: "Every concrete exchange requires verified identity and compatible property/unit/provider/state/destination. Preserve native energy/service units, evidenced conversions and disclosure of unresolved support; semantic umbrellas are not fixed dataset exchanges."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "every card"
    rule: "Every card carries a Range. Except reference normalization, the present broad reasoned screens are provisional and non-enforcing; they do not substitute zero for unknown, cap measured values or provide publication-ready empirical yields."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground collection/preparation data package for an evidenced fresh raw wild leafy scope"
  downstream_use: "secondary_dataset; background_dataset, only with disclosed quality and resolved concrete exchanges"
  allowed_use: "Actual same-scope fresh primary leafy products with compatible species/parts, wild origin, state, period and handover"
  excluded_use: "Generic miscellaneous wild foods; intentionally cultivated leaves; processed goods; ready-to-eat safety claims; downstream retail distribution/cooking; unsupported scope extrapolation or carbon credits"
  required_metadata: "PCR identity; reference and all qualifiers; source/species/part/site/season chain; actual route and bypasses; all intended outputs/recipients; upstream datasets; accepted net method; stock and asset periods; allocation decisions; source evidence and concrete identities"
  required_quality_disclosure: "Completeness and exclusions by contributing site/trip/period; unknown masses/emissions/acceptance; provisional Range status; measured/provider coverage; proxy and identity/support gaps; sensitivity and actual sampling/representativeness"
  update_trigger: "Changed species/parts, source management, market state, handling/gate, service/provider or allocation; new measurement/conversion evidence or verified concrete flow identities"
data_sources:
  - id: "unsd-cpc-03239"
    type: "official_guidance"
    reference: "UNSD, CPC 3.0 subclass 03239: https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/03239 ; accessed 2026-10-09"
    used_for: "Untended gathering versus intentional management/cultivation and n.e.c. boundary, not a universal species acceptance or numeric inventory"
  - id: "fao-wild-plant-foods"
    type: "official_guidance"
    reference: "FAO, Use and potential of wild plants in farm households: https://www.fao.org/4/w8801e/w8801e04.htm ; accessed 2026-10-09"
    used_for: "Distinct gathered leafy vegetables and plant-use/part diversity; raw versus later-prepared food distinction; no historic quantity/safety default"
  - id: "fao-fresh-storage"
    type: "official_guidance"
    reference: "FAO, Food security, nutrition and health, fresh storage and distinct processing methods: https://www.fao.org/4/W6864E/w6864e06.htm ; accessed 2026-10-09"
    used_for: "Fresh handling/storage versus processed state; no universal shelf-life, setpoint, nutrient percentage or process yield"
