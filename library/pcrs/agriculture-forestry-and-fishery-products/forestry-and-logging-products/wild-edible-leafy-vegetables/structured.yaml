system_boundary:
  rules:
    - rule_id: boundary_wild_eligibility
      applies_to: "source and product scope"
      rule: "Require untended origin, species/part eligibility and n.e.c. review against more explicit classes. Exclude managed cultivation and nonleafy or processed states; raw acceptance is not ready-to-eat certification."
      source_ids:
        - unsd-cpc-03239
        - fao-wild-plant-foods
    - rule_id: boundary_removal_once
      applies_to: "gather"
      rule: "Own natural-source removal and gathering together for each physically removed portion, independent from later cleaning and grading. Do not add a duplicate harvest/removal node or natural-source input for already gathered purchased portions. No automatic growth or carbon credit arises from wild origin."
      source_ids:
        - unsd-cpc-03239
    - rule_id: boundary_handling_gates
      applies_to: "all nodes"
      rule: "Gathering yields raw material; conditioning declares prepared grades and rejects; holding protects a usable fresh state; handover protects/presents and accepts net fresh product. Record actual input/output states and recipients at each interface; bypass only with records. Downstream retail distribution, cooking and consumption are excluded."
      source_ids:
        - fao-wild-plant-foods
        - fao-fresh-storage
    - rule_id: boundary_assets_periods_sites
      applies_to: "all nodes"
      rule: "Enumerate all contributing sites, trips including unsuccessful trips, reporting seasons, opening/closing stock, asset installation/service/replacement/termination periods and shared consumers. Include attributable actual work, access, transfer, cleaning and assets once within the common boundary, with provider and period evidence."
      source_ids: []
    - rule_id: boundary_routes_exits
      applies_to: "rejects, returns and ancillary outputs"
      rule: "Link each off-spec state to its producing node and actual resort/return, sold downgrade, treatment or direct environmental return. Preserve previous burdens on loops and add only incremental work. Nonaccepted material cannot count as reference output; unknown balances are gaps."
      source_ids: []
    - rule_id: boundary_optional_inputs
      applies_to: "actual water and emissions"
      rule: "Supplied cleaning water is a product; actual direct abstraction needs a correctly typed separate concrete exchange. Wastewater to treatment is waste; direct discharge requires identified substances and compartments. Do not infer refrigerant, evaporation or pollutants from an unexplained difference."
      source_ids: []
