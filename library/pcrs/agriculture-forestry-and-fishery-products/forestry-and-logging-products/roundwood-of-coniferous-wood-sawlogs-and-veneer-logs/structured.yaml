allocation_rules:
  - rule_id: allocation_output_set
    applies_to: "Grading and shared harvest"
    rule: "Tally sawlog and veneer-log grades, pulp/panel logs, other industrial logs and fuelwood where marketed; give each destination one handover and measured underbark volume. Keep rejected waste and retained slash separate from intended products."
    source_ids:
      - fao-forest-products-2020
  - rule_id: allocation_shared_activity
    applies_to: "Shared stand, felling, extraction and landing burdens"
    rule: "Assign directly metered activity to the receiving grade where feasible; otherwise allocate common harvest activity among marketed wood outputs by measured solid underbark volume at the common gate. No avoided-product credit or burden allocation to retained slash."
    source_ids: []
  - rule_id: allocation_period_assets
    applies_to: "Stand phases, roads, landing and machines"
    rule: "Index establishment, tending, thinning and harvest activity by stand and year. Attribute shared assets to benefiting lots using actual area, machine hours, road service or measured output before the grade split. Carry only the share benefiting future harvests forward; never count one burden twice."
    source_ids: []
  - rule_id: physical_ledger_before_allocation
    applies_to: "Physical ledgers and attributed burdens"
    rule: "Retain unallocated physical values for original material balances, handoffs and co-products: q_B = Q_B/R. Apply this PCR's allocation method separately to shared burdens: b_ref = B_shared * a_ref/R; assign direct burdens directly and apply each period/output share once. R is the selected final reference output, excluding internal transfers. Never apply burden share a_ref to original co-product or transfer quantities; distinguish any allocated single-product process projection from the unallocated whole-package material ledger."
    source_ids: []
