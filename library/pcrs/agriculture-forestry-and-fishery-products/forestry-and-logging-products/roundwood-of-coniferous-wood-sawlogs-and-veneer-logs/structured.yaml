measurement_rules:
  - id: underbark_volume
    applies_to: "Reference and all roundwood grade outputs"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3 underbark"
    rule: "Use calibrated log-scale dimensions and a locally evidenced bark correction where needed. Do not equate stacked volume or tonnes to solid underbark volume (fao-forest-products-2020)."
  - id: wood_balance
    applies_to: "Standing stock, felled stems, landing logs, grades and residues"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3 underbark"
    rule: "Balance only matching wood components from the same lot under consistent bark, dimensional, moisture and volume conventions. Merchantable-stem input reconciles only with grades and stem losses originating in that input; branches, bark and other biomass outside it require separate component ledgers, not additional outputs in the stemwood balance."
  - id: fuel_basis
