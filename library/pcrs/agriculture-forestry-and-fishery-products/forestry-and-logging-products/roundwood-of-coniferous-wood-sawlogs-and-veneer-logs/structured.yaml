system_boundary:
  rules:
    - rule_id: boundary_roadside
      applies_to: "All lots"
      rule: "Include attributable stand management, felling, extraction, preparation and grading through loading-ready roadside handover; exclude road haul beyond landing and wood conversion."
      source_ids:
        - fao-wood-harvesting
    - rule_id: boundary_route_position
      applies_to: "Tree-length and shortwood routes"
      rule: "Locate delimbing/bucking at its actual stump or landing position and count input and residue duties once."
      source_ids:
        - fao-wood-harvesting
    - rule_id: boundary_residue
      applies_to: "Slash, bark and rejects"
      rule: "Marketed wood is a product, exported disposal material is waste, and slash retained in forest is a disclosed on-site loss rather than fictitious exported waste."
      source_ids:
        - fao-forest-products-2020
    - rule_id: boundary_shared
      applies_to: "Roads, landings and equipment"
      rule: "Attribute shared services across consuming operations and periods once, using recorded hours, area, road use or volume as appropriate."
      source_ids: []
    - rule_id: boundary_direct_release_coverage
      applies_to: "stand_management; felling_removal; forest_extraction; log_preparation; grade_handover"
      rule: "Reconcile on-site combustion, actual applications and fugitive releases/leaks at every activated node through unique activity-substance-receiving-medium records in cp_direct_release_stand_management; cp_direct_release_felling_removal; cp_direct_release_forest_extraction; cp_direct_release_log_preparation; cp_direct_release_grade_handover. Upstream production of purchased fuel or chemicals does not replace emissions from their use on site; verify coverage and avoid double counting the same activity inside a supplier service. Evidence must support non-activity; missing data are not zero. This obligation does not expand the existing product gate or downstream-use boundary and does not presume combustion, fertilization, chemicals or equipment occur."
      source_ids: []
    - rule_id: system_boundary_rule_6
      applies_to: "foreground_system_boundary"
      rule: "Select the route from actual incoming state and ownership. Qualified purchased harvested, extracted, prepared or graded feed may enter at its real receiving node; completed upstream operations are not mandatory foreground operations and standing stock or biological resources must not be charged again. Receiving cards record actual material, grade, wet/dry basis, receipt gate, upstream dataset and process coverage; add the actual receiving exchange if none exists. Bypass does not remove upstream burdens; actual operations cannot be skipped and final reference product, quality and gate remain unchanged."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "managed_conifer_stand_before_attributable_harvest"
  starting_condition_role: "Declares the stand, region, management phase, legal harvest area and standing stock before attributable tending and removal."
  product_classification_scope: "Coniferous sawlog/veneer-log grades only; other harvested destinations are separately identified co-products or retained residues."
  recursive_input_rule: "Purchased coniferous logs are upstream products with separate datasets; never reopen this PCR recursively for that purchased input."
  upstream_dataset_requirement: "Link purchased seedlings, fuels, electricity, lubricants, access materials and contracted services where they cross the boundary; model site combustion and land management once."
