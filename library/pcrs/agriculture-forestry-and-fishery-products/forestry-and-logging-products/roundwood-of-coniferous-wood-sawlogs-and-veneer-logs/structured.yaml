  calculation_rules:
    - id: calc_underbark
      applies_to: "Every wood stream"
      rule: "Apply documented calibrated log-scale formula and locally measured bark correction before aggregation; never use a universal bark percentage."
      inputs:
        - length
        - diameters
        - bark
        - "scale method"
      output: "m3 solid underbark by lot and grade"
      source_ids:
        - fao-forest-products-2020
    - id: calc_wood_balance
      applies_to: "Harvest through grading"
      rule: "For the matched merchantable-stem pool, V_open + V_felled + V_purchased = V_marketed + V_removed_stem_waste + V_retained_stem_loss + V_close + delta, on a matched lot-specific solid underbark basis. V_purchased is actual harvested/prepared wood received from outside the reconciled foreground system, excluding own wood already in V_felled and internal transfers; a purchased-only route may have V_felled=0. Delta is only a signed unexplained measurement residual to disclose and investigate: known stock changes are explicit, not delta or emissions. Retained loss must originate in that input pool; branches, bark, special root/burl wood and other excluded components use separate compatible physical ledgers. Cancel paired internal transfers once at whole-package aggregation."
      inputs:
        - "component-indexed felling and external receipt records"
        - "opening/closing stocks"
        - "grade and loss origins"
        - "matched scale records"
      output: "volume balance by lot"
      source_ids:
        - fao-forest-products-2020
    - id: calc_reference
      applies_to: "Final-reference normalization of physical ledgers and environmental burdens"
      rule: "R is positive accepted saw/veneer-log solid underbark volume (m3) for the same lot, boundary and period; downgraded co-products and internal transfers are excluded from that denominator. Report unallocated material, transfer and co-product totals Q as q_phys = Q/R. For environmental burdens B only, complete evidenced direct, period, output and asset attribution once, then report b_ref = B_attributed/R. Do not apply burden shares to physical ledgers or divide already final-reference amounts again."
      inputs:
        - "unallocated physical ledger Q"
        - "environmental burdens B"
        - "evidenced attribution"
        - "matched reference quantity R"
      output: "amount per 1 m3 reference output"
      source_ids:
        - reference-normalization-identity
    - id: calc_shared
      applies_to: "Management and shared assets"
      rule: "Attribute actual dated service to benefiting stands/lots once using measured service drivers, then split common lot burden among marketed roundwood grades by underbark volume."
      inputs:
        - "dated operations"
        - "service driver"
        - lots
        - grades
      output: "activity attributable to reference grade"
      source_ids: []
    - id: calculate_direct_release_ledger
      applies_to: "stand_management; felling_removal; forest_extraction; log_preparation; grade_handover"
      rule: "For each unique event, substance and medium, obtain raw release E from measurement or the cited applicable method using activity A and a compatible factor EF; use E = A * EF only for a genuinely simple-factor method, after checking units and abatement scope. Do not add different substances/media; retain an unallocated raw-release ledger. Divide attributed burden totals once by matched positive final reference quantity R; do not renormalize final-reference intensities or allocate a shared event twice. Unexplained material residuals are not automatically emissions and missing factors are not zero."
      inputs:
        - cp_direct_release_stand_management
        - cp_direct_release_felling_removal
        - cp_direct_release_forest_extraction
        - cp_direct_release_log_preparation
        - cp_direct_release_grade_handover
        - "existing emission cards"
        - "supplier coverage"
        - "reference quantity"
      output: "Node/substance/medium-specific raw and attributed amounts and unresolved gaps"
      source_ids: []
  data_quality_requirements:
    - id: dq_log_trace
      applies_to: "Every log and grade"
      requirement: "Link stand, harvest lot, species, grade, intended use and destination to dispatch."
      evidence: "permit, log scale and docket"
    - id: dq_scale
      applies_to: "Wood volume"
      requirement: "State scale method, calibration, bark conversion, moisture and dimensional convention; flag inconsistent units."
      evidence: "scale and conversion worksheet"
    - id: dq_route
      applies_to: "Harvest route"
      requirement: "State extraction method and bucking position; count every machine duty and output once."
      evidence: "machine and operation log"
    - id: dq_period
      applies_to: "Stand and infrastructure"
      requirement: "Record establishment/tending/harvest phases and serviced years, disclosing missing historical records."
      evidence: "management and road-use logs"
    - id: dq_balance
      applies_to: "Inputs, grades and residues"
      requirement: "Reconcile all marketed and retained destinations and disclose residual volume differences or missing fuel data."
      evidence: "grade tally and fuel reconciliation"
validation_rules:
  - rule_id: validate_product
    applies_to: "Reference output"
    rule: "Require conifer species, saw/veneer intended use, raw log state and roadside gate; reject lumber, veneer sheets and pulp/other/fuel logs as the reference."
    source_ids:
      - unsd-cpc-03111
      - fao-forest-products-2020
  - rule_id: validate_unit
    applies_to: "Reference and wood grades"
    rule: "Require 1 m3 solid underbark reference and documented local conversion for overbark, mass or stacked-volume records."
    source_ids:
      - fao-forest-products-2020
  - rule_id: validate_route
    applies_to: "Process map"
    rule: "Require evidenced harvest and extraction system, one bucking position per stem segment and no duplicate extraction/preparation burdens."
    source_ids:
      - fao-wood-harvesting
  - rule_id: validate_destinations
    applies_to: "Landing grade tally"
    rule: "Require one grade, destination, handover and underbark volume for every saw/veneer, pulp/panel, other industrial, fuelwood or rejected stream present."
    source_ids:
      - fao-forest-products-2020
  - rule_id: validate_rework
    applies_to: "Downgraded and rejected wood"
    rule: "No automatic rework loop is assumed. If an actual lot is regraded or recut, track that operation once and prevent its earlier rejected state from also appearing as accepted output."
    source_ids: []
  - rule_id: validate_attribution
    applies_to: "Shared and multi-period activity"
    rule: "Verify phase-to-lot and asset-to-consumer drivers, direct assignment before common volume split, no burden on retained slash and no double attribution."
    source_ids: []
  - rule_id: validate_uuid
    applies_to: "Final TIDAS exchanges"
    rule: "Resolve each concrete exchange to exactly one verified flow UUID with matching flow type, direction, property, unit and use before process projection; unresolved cards are not fixed bindings."
    source_ids: []
  - rule_id: validate_card_activation_units
    applies_to: "All refined cards"
    rule: "Verify activation and actual material/formulation/task/supply specification; missing records are not zero. Each amount and Range uses one compatible property/unit; retain density and wood mass/volume bridges. Check contractor-service components against fuel, equipment and emissions to avoid double burdens."
    source_ids:
      - fao-wood-harvesting
  - rule_id: validate_direct_release_coverage
    applies_to: "stand_management; felling_removal; forest_extraction; log_preparation; grade_handover"
    rule: "For every activated node, reconcile its activity list against cp_direct_release_stand_management; cp_direct_release_felling_removal; cp_direct_release_forest_extraction; cp_direct_release_log_preparation; cp_direct_release_grade_handover: each relevant event must have quantified concrete elementary exchanges, evidenced upstream-service coverage, or evidenced absence of the activity. Missing/unknown is not zero and blocks data-package completeness. Check each actual substance/medium amount, method/factor units, concrete UUID and existing-card/service coverage for omissions or duplication; empty groups, purchased-electricity upstream emissions or another node's single CO2 card do not replace this node's on-site reconciliation. Shared-asset services must not create duplicate physical release events."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile required/conditional activation and upstream coverage against incoming state at each node; purchased completed-state feed must not duplicate growth, harvest or preparation. Equal classification does not replace state and gate matching."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for coniferous sawlog and veneer-log harvest to loading-ready roadside landing"
  downstream_use: "secondary_dataset or background_dataset for sawing or veneer inputs after gate and grade matching"
  allowed_use: "Raw coniferous sawlog/veneer-log supply with declared region, grade and underbark basis"
  excluded_use: "Pulp/panel wood, poles, fuelwood, non-coniferous logs, sawmilling, veneer peeling and post-landing haulage without additional datasets"
  required_metadata: "Species/stand; management phases; region/year; harvest system; bucking position; grade/destination; gate; bark conversion; output allocation; residue fate"
  required_quality_disclosure: "Measured/estimated volume and fuel; bark evidence; balance residual; shared-asset drivers; missing periods; unresolved UUIDs and provisional ranges"
  update_trigger: "Changed product use, forest route, scaling, management regime, allocation basis, region or verified platform flow identity"
