    required_unit: "kg"
    rule: "Retain measured as-received mass with moisture/bark metadata; distinguish oven-dry mass, water and bark for allocation. No universal hardwood density. Convert measured solid volume only with representative same-lot mass/density and uncertainty; stacked volume needs a measured solid-volume factor."
