  calculation_rules:
    - id: calc_normalize
      applies_to: "Separate physical-ledger and burden normalization"
      rule: "R is the positive final accepted net pulp/panel roundwood mass in kg for the same boundary, lot and period, excluding co-products, internal transfers and unaccepted stocks. Report original material, co-product and transfer totals Q as q_phys = Q/R without a burden-allocation share. Report environmental burdens B as b_ref = B_attributed/R only after one evidenced direct/output/period/asset attribution. Do not divide final-reference intensities again; cancel paired internal transfers only at whole-package aggregation, not as additional final outputs."
      inputs:
        - "unallocated physical totals Q"
        - "burdens B and attribution records"
        - "matched positive reference mass R"
      output: "native-unit amount per kg"
      source_ids:
        - fao-wood-harvesting
    - id: calc_moisture
      applies_to: "Wet/dry/bark basis"
      rule: "For declared wet-basis water fraction w, dry solids = wet mass × (1-w); separate bark consistently. Dry-basis moisture needs the corresponding conversion, never the wet-basis formula. Measured density bridges volume and mass only for the same lot/state."
      inputs:
        - "measured mass"
        - "moisture convention"
        - bark
        - density
      output: "compatible wood mass"
      source_ids:
        - fao-wood-harvesting
    - id: calc_land
      applies_to: "Land inputs"
      rule: "occupation = area × actual duration × supported attribution; transformation = actual from/to event area × supported attribution, each native unit retained"
      inputs:
        - area
        - dates
        - event
        - "output shares"
      output: "m2 a; m2"
      source_ids:
        - fao-wood-harvesting
    - id: calc_emissions
      applies_to: "Actual direct releases"
      rule: "Each substance/medium quantity = retained activity × declared applicable factor, with chemistry/unit conversions and uncertainty. If factor validity or medium is unknown retain a gap, not a generic emission identity."
      inputs:
        - activity
        - "factor/source"
        - "species/medium"
      output: "kg per substance/medium"
      source_ids:
        - fao-wood-harvesting
    - id: calculate_direct_release_ledger
      applies_to: "managed-stand; harvest-removal; extraction-preparation; roadside-grading"
      rule: "For each unique event, substance and medium, obtain raw release E from measurement or the cited applicable method using activity A and a compatible factor EF; use E = A * EF only for a genuinely simple-factor method, after checking units and abatement scope. Do not add different substances/media; retain an unallocated raw-release ledger. Divide attributed burden totals once by matched positive final reference quantity R; do not renormalize final-reference intensities or allocate a shared event twice. Unexplained material residuals are not automatically emissions and missing factors are not zero."
      inputs:
        - cp_direct_release_managed_stand
        - cp_direct_release_harvest_removal
        - cp_direct_release_extraction_preparation
        - cp_direct_release_roadside_grading
        - "existing emission cards"
        - "supplier coverage"
        - "reference quantity"
      output: "Node/substance/medium-specific raw and attributed amounts and unresolved gaps"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Reference and all real exchanges"
      requirement: "Actual species, origin, intended use, state/gate and compatible verified property/unit/identity; classify conditional absence and remaining gaps"
      evidence: "Lot/customer records and detail-confirmed support identities"
    - id: dq_measurement
      applies_to: "Mass, water and volume"
      requirement: "Trace calibration, representative sample coverage, wet/dry/bark convention, same-lot conversion and uncertainty; no universal hardwood factor"
      evidence: "Tickets/tests and conversion ledger"
    - id: dq_periods
      applies_to: "Cohorts and assets"
      requirement: "Actual complete establishment-to-harvest/regeneration/service periods with opening/closing stocks and replacement/termination; no arbitrary annualization"
      evidence: "Event and asset ledger"
    - id: dq_completeness
      applies_to: "Outputs, services and emissions"
      requirement: "All actual outputs and waste recipients, class expansions and substance/media factors; missing evidence is disclosed, no invented zero or credits"
      evidence: "Reconciled lot, service scope and factor records"
validation_rules:
  - rule_id: v_reference
    applies_to: "Reference output"
    rule: "Require exactly one reference card pulp_panel_roundwood_handover matching the reference table by state, intended use, roadside gate, kg basis and all required qualifiers. Concrete dataset exchanges require verified product/property/unit support; alternative outputs are not substitutes for this reference."
    source_ids:
      - fao-wood-harvesting
  - rule_id: v_links
    applies_to: "Process handoffs"
    rule: "Check stand-to-harvest, harvest_felled_wood-to-landing_felled_wood and landing_prepared_roundwood-to-grading_prepared_roundwood lot/state/quantity links. Internal transfers are not additional final products or additional upstream burdens. Use managed stock or evidenced natural-resource/upstream sourcing exclusively for the same source lot."
    source_ids:
      - fao-wood-harvesting
  - rule_id: v_balance
    applies_to: "Wood and bark reconciliation"
    rule: "Reconcile incoming wood, stock changes, retained residues, all intended products, dispatched waste and documented moisture changes using compatible wet/dry/bark bases. Retained forest residues are recorded in the source ledger, not invented offsite exchanges. Investigate any provisional Range breach; it is not permission to replace measurements."
    source_ids:
      - fao-wood-harvesting
  - rule_id: v_energy_nutrients
    applies_to: "Input classes"
    rule: "Separate each fuel kg and electricity kWh; never sum them. Use declared conversion factors and actual density for litre-to-kg. Preserve fertilizer product mass, N fraction and direct emission pathway separately. Match concrete material/service identities and remove overlaps with bundled services."
    source_ids:
      - fao-wood-harvesting
  - rule_id: v_route_period
    applies_to: "Route, periods and shared assets"
    rule: "Verify actual origin and each parent/route delta, mutually exclusive establishment and equipment implementations, complete event periods and shared-asset denominators. Missing replacement/termination, opening/closing stocks or consuming nodes prevents a complete final foreground package."
    source_ids:
      - fao-wood-harvesting
  - rule_id: v_emissions
    applies_to: "Direct emissions"
    rule: "For every reported elementary release retain specific substance/species/particle basis, receiving medium, activity and applicable factor/source. Distinguish biogenic versus fossil carbon and observed spill from combustion. Missing factor evidence is an explicit gap, not zero or an invented generic UUID."
    source_ids:
      - fao-wood-harvesting
  - rule_id: validate_direct_release_coverage
    applies_to: "managed-stand; harvest-removal; extraction-preparation; roadside-grading"
    rule: "For every activated node, reconcile its activity list against cp_direct_release_managed_stand; cp_direct_release_harvest_removal; cp_direct_release_extraction_preparation; cp_direct_release_roadside_grading: each relevant event must have quantified concrete elementary exchanges, evidenced upstream-service coverage, or evidenced absence of the activity. Missing/unknown is not zero and blocks data-package completeness. Check each actual substance/medium amount, method/factor units, concrete UUID and existing-card/service coverage for omissions or duplication; empty groups, purchased-electricity upstream emissions or another node's single CO2 card do not replace this node's on-site reconciliation. Shared-asset services must not create duplicate physical release events."
    source_ids: []
  - rule_id: validation_rule_8
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile required/conditional activation and upstream coverage against incoming state at each node; purchased completed-state feed must not duplicate growth, harvest or preparation. Equal classification does not replace state and gate matching."
    source_ids: []
