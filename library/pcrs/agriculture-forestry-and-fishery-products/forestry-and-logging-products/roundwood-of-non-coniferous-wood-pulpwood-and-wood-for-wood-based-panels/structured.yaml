  - rule_id: a_outputs
    applies_to: "Shared harvest/sorting burdens"
    rule: "Enumerate pulp/panel roundwood, saw/veneer logs, other-use roundwood, fuelwood and recovered bark/wood products with actual handoffs and quantities. For physically common wood handling use measured consistent-basis dry-wood mass fractions only when the causal rationale and moisture conversion are documented. If that relation is inappropriate, require an explicitly justified economic or other allocation with lot-matched prices/quantities and sensitivity; do not silently switch methods or allocate wet wood and water as if comparable."
    source_ids:
      - fao-wood-harvesting
  - rule_id: a_period
    applies_to: "Stand and event attribution"
    rule: "Retain all actual establishment, growth, thinning, final-harvest and regeneration periods. Apply the selected output-allocation rule to all cohort harvests in the supported service horizon; reconcile opening/closing biomass and establishment/replacement/termination events. Do not put all establishment burdens on the latest harvest or count past thinning again."
    source_ids:
      - fao-wood-harvesting
  - rule_id: a_assets
    applies_to: "Shared infrastructure"
    rule: "Identify each road, machine or contracted service once with all consuming nodes/cohorts and actual service period. Allocate using a supported physical driver such as measured equipment hours or road use/payload; document denominator, unused capacity, replacements and sensitivity. Apply its burden once across consumers, not in every service and energy row."
    source_ids:
      - fao-wood-harvesting
  - rule_id: a_residues
    applies_to: "Residues and waste"
    rule: "Record retained slash/stumps in the biomass balance without automatically treating them as products, exported waste or avoided fuel. An actual sold material needs product identity and handoff; an actual discard needs waste identity and recipient. Prevent simultaneous product/waste classification of the same quantity."
    source_ids:
      - fao-wood-harvesting
