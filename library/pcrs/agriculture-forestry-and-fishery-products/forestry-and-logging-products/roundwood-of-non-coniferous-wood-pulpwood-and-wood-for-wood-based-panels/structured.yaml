system_boundary:
  rules:
    - rule_id: b_start
      applies_to: "Starting condition"
      rule: "Declare site, species, stand origin, cohort and start date. When growth is inside the boundary, include managed-stand history; when acquiring stock, require an equivalent upstream dataset and record exclusions. Unmodified natural stock is not assumed managed."
      source_ids:
        - fao-wood-harvesting
    - rule_id: b_operations
      applies_to: "Harvest through sorting"
      rule: "Include felling/removal, extraction, first preparation and intended-use grading. Harvest owns source-to-felled handover and resource removal once; extraction-preparation owns stump-side-to-roadside preparation, not another removal. Combine machines only with a complete non-duplicated ledger."
      source_ids:
        - fao-wood-harvesting
    - rule_id: b_gate
      applies_to: "End gate and exclusions"
      rule: "End at forest-roadside producer handover of reference ROUNDWOOD. Exclude transport to mill, pulping, panels, sawing, chip conversion, preservation/treatment and use/end-of-life. Forest chips or recovered industrial residues need a separate evidenced non-reference dataset, never another reference gate."
      source_ids:
        - unsd-cpc-non-conifer-pulp-panel
        - fao-wood-harvesting
    - rule_id: b_routes
      applies_to: "Actual alternatives"
      rule: "managed-stand is the parent of plantation versus coppice/regeneration variants: actual planting versus retained stools changes input categories and event/cycle ledgers. For each lot choose its evidenced origin; do not add mutually exclusive establishment events. Harvest and preparation are parents of cut-to-length versus tree-length/whole-tree implementations: delimbing/bucking responsibility moves between nodes, and extraction payload/fuel records change. Record actual machines, topology and handovers; alternative labels alone do not activate extra burdens."
      source_ids:
        - fao-wood-harvesting
    - rule_id: b_period_assets
      applies_to: "Periods and shared assets"
      rule: "Link establishment, growth, thinning, final harvest, regeneration, road construction/maintenance and equipment use to actual cohorts and service periods. Declare opening/closing stocks, replacements and termination events; reconcile all products, nodes and periods before allocating any shared burdens."
      source_ids:
        - fao-wood-harvesting
    - rule_id: b_conditional_inputs
      applies_to: "Conditional classes"
      rule: "Energy, fertilizer and service cards are class-level collection requirements. Zero, one or several concrete exchanges follow real records, each with a verified identity and native unit; do not duplicate fuel, machinery or emissions already embodied in a contractor package."
      source_ids:
        - fao-wood-harvesting
    - rule_id: boundary_direct_release_coverage
      applies_to: "managed-stand; harvest-removal; extraction-preparation; roadside-grading"
      rule: "Reconcile on-site combustion, actual applications and fugitive releases/leaks at every activated node through unique activity-substance-receiving-medium records in cp_direct_release_managed_stand; cp_direct_release_harvest_removal; cp_direct_release_extraction_preparation; cp_direct_release_roadside_grading. Upstream production of purchased fuel or chemicals does not replace emissions from their use on site; verify coverage and avoid double counting the same activity inside a supplier service. Evidence must support non-activity; missing data are not zero. This obligation does not expand the existing product gate or downstream-use boundary and does not presume combustion, fertilization, chemicals or equipment occur."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "Select the route from actual incoming state and ownership. Qualified purchased harvested, extracted, prepared or graded feed may enter at its real receiving node; completed upstream operations are not mandatory foreground operations and standing stock or biological resources must not be charged again. Receiving cards record actual material, grade, wet/dry basis, receipt gate, upstream dataset and process coverage; add the actual receiving exchange if none exists. Bypass does not remove upstream burdens; actual operations cannot be skipped and final reference product, quality and gate remain unchanged."
      source_ids: []
