      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Only actual energy subexchanges use this rule; native service properties/units remain separate. Preserve original fuel quantity, fuel identity and heating-value convention; distinguish electricity from fuels. Convert electricity using the exact unit equality 1 kWh = 3.6 MJ, not a heat-generation efficiency."
