  calculation_rules:
    - id: normalize_lot_mass
      applies_to: "Separate physical-ledger and burden normalization"
      rule: "R is the positive final accepted net fresh cut-tree dispatch mass in kg for the same boundary, lot and period, excluding co-products, internal transfers and unaccepted stocks. Report original material, co-product and transfer totals Q as q_phys = Q/R without a burden-allocation share. Report environmental burdens B as b_ref = B_attributed/R only after one evidenced direct/output/period/asset attribution. Do not divide final-reference intensities again; cancel paired internal transfers only at whole-package aggregation, not as additional final outputs."
      inputs:
        - "unallocated physical totals Q"
        - "burdens B and attribution records"
        - "matched positive reference mass R"
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: derive_count_records
      applies_to: "count-based source records"
      rule: "Collect paired actual count and accepted net fresh mass for the same species/height-grade lot; reconstruct actual activity totals from source records, then use normalize_lot_mass. A bare count-only invoice is incomplete, not an assumed kilogram conversion."
      inputs:
        - "paired actual count/mass"
        - "lot/species/height-grade"
        - "original activity records"
      output: "traced lot activity totals and count-to-mass relationship"
      source_ids: []
    - id: reconcile_stocks
      applies_to: "each biological and package handover"
      rule: "Reconcile actual input, output, return, remaining stock and loss separately for each state/period; fresh moisture and dry/biogenic terms are not interchangeable. Investigate residuals rather than inventing a balancing release."
      inputs:
        - "indexed masses/counts"
        - "actual moisture/state"
        - returns
        - loss
        - stock
      output: "disclosed reconciliation and unexplained residual"
      source_ids: []
    - id: energy_unit_equality
      applies_to: "energy cards"
      rule: "Convert measured electricity kWh to MJ by multiplying by 3.6; retain original records and actual fuel heating-value convention separately. This is unit conversion, not electricity-to-heat equivalence."
      inputs:
        - "actual electricity kWh"
        - "actual fuel records"
      output: "delivered-energy quantities with identities retained"
      source_ids: []
    - id: attribution_ledger
      applies_to: "all shared burdens"
      rule: "Reconcile the total source burden to allocations across actual output/site/cohort/year/asset/lot consumers and a disclosed residual. Record rework added burden separately from carried burden."
      inputs:
        - "original burden"
        - "actual usage/output evidence"
        - "declared allocation"
      output: "assigned and residual burdens without duplicates"
      source_ids: []
    - id: calculate_direct_release_ledger
      applies_to: "grow; harvest; condition; grade; hold; dispatch"
      rule: "For each unique event, substance and medium, obtain raw release E from measurement or the cited applicable method using activity A and a compatible factor EF; use E = A * EF only for a genuinely simple-factor method, after checking units and abatement scope. Do not add different substances/media; retain an unallocated raw-release ledger. Divide attributed burden totals once by matched positive final reference quantity R; do not renormalize final-reference intensities or allocate a shared event twice. Unexplained material residuals are not automatically emissions and missing factors are not zero."
      inputs:
        - cp_direct_release_grow
        - cp_direct_release_harvest
        - cp_direct_release_condition
        - cp_direct_release_grade
        - cp_direct_release_hold
        - cp_direct_release_dispatch
        - "existing emission cards"
        - "supplier coverage"
        - "reference quantity"
      output: "Node/substance/medium-specific raw and attributed amounts and unresolved gaps"
      source_ids: []
    - id: aggregate_internal_transfers
      applies_to: "cut_trees; prepared_trees; accepted_grades; held_trees; condition_tree_feed; grade_tree_feed; hold_tree_feed; dispatch_tree_feed; offspec_return"
      rule: "Record paired event-level fresh mass T in kg, activity, lot and state. For positive final dispatch mass R retain T/R × 1 kg in the internal ledger; never force T=R. The four normal fresh-tree handoffs retain verified cut-tree identity ab8a7694-6ea2-4cce-b535-9358f74c1189; downgraded/rework material needs separate compatible identity confirmation, not role-based inheritance. Cancel each pair once within the aggregate boundary, never period stocks, losses, externally sold downgraded goods or actual external purchases. Rework adds only its actual new activity burden without duplicating carried burdens."
      inputs:
        - cp_harvest
        - cp_condition
        - cp_grade
        - cp_hold
        - cp_dispatch
        - transfer_id
        - "paired records"
      output: "unallocated measured transfer ledger and aggregate inventory without duplicate internal exchanges"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference and all actual exchanges"
      requirement: "Prove managed origin and actual fresh species/height-grade state; verify each final concrete UUID and support before dataset use. An umbrella is not a verified exchange."
      evidence: "Source/cohort records; physical descriptions; confirmation evidence"
    - id: dq_cohort
      applies_to: "production history"
      requirement: "Complete actual cultivation years, failed/replacement stocks and deferred harvests; estimated records require named method and uncertainty, not an invented standard lifetime."
      evidence: "Cohort/year/stock ledger with coverage gaps"
    - id: dq_mass
      applies_to: "dispatch and transfers"
      requirement: "Exclude package/support tare and rejects; paired actual count/mass when count-based records exist; preserve freshness/moisture changes and material losses."
      evidence: "Calibrated scale and buyer acceptance records"
    - id: dq_sites
      applies_to: "contributing units"
      requirement: "Enumerate every source block/site and handling yard; disclose represented output and omitted/uncovered shares. Keep incompatible species/grade/state populations separate."
      evidence: "Site-specific source quantities, weights and representativeness review"
    - id: dq_graph
      applies_to: "optional nodes and returns"
      requirement: "Retain actual event path, bypass state, return links and stock cut-off; unknown handling state or destination blocks finalization."
      evidence: "Event-linked transfer/return receipts"
    - id: dq_ranges
      applies_to: "all screens"
      requirement: "Replace provisional screens when empirical evidence exists; never use them as fallback amounts, limits, cut-offs or loss factors."
      evidence: "Foreground values and documented outlier investigation"
    - id: dq_environment
      applies_to: "actual natural exchanges"
      requirement: "Specify substance and medium, original basis and model evidence; no invented nutrient-loss, biogenic credit, water or evaporation quantities."
      evidence: "Measurement/model protocol and complete carbon/water terms"
    - id: dq_range_units_evidence
      applies_to: "concrete exchanges in variable-unit cards"
      requirement: "Establish any quantitative screen only after identifying its concrete exchange, reference property, explicit comparison unit and denominator, applicability, reviewed evidence and derivation. Preserve a unit conversion record that converts value and both bounds consistently; test the same physical quantity identically in equivalent units. Keep unresolved screens explicit and do not use them as amounts or completeness evidence."
      evidence: "linked collection protocols; property/unit and conversion records; compatible evidence and derivation; unresolved-screen register"
    - id: dq_aggregate_transfers
      applies_to: "internal ledger of harvest_to_dispatch"
      requirement: "Retain quantities, lot, fresh state and time for harvest→condition or grade, condition→grade, grade→hold or dispatch, hold→dispatch and actual rework. Normal fresh trees retain Mass 93a60a56-a3c8-11da-a746-0800200b9a66, unit group 93a60a57-a4c8-11da-a746-0800200c9a66 and kg. The former 0–20 kg per 1 kg final reference is only a provisional non-enforcing reasoned_estimate investigation prompt, not an amount, yield or acceptance limit. A disaggregated unit-process model must restore full flow cards and verify compatible paired exchanges."
      evidence: "measured transfer/rework/stock records; compatible identity and validation of new disaggregated graph"
validation_rules:
  - rule_id: valid_reference
    applies_to: "tree_dispatch"
    rule: "Reference link identifies the sole actual accepted dispatch product output and 1 kg net fresh mass; all qualifiers and actual support identities are declared and package/reject mass excluded."
    source_ids: []
  - rule_id: valid_cohort
    applies_to: "grow; harvest"
    rule: "Check complete cohort/year/failed/replacement and remaining-stock accounting; upstream nursery/material/energy/asset gaps remain disclosed and prevent unsupported zero estimates."
    source_ids: []
  - rule_id: valid_path
    applies_to: "all processes"
    rule: "Check actual optional-node bypasses, transfer input/output links, returns and handovers; same fresh product may reuse a compatible verified identity, but living stock/seedlings cannot inherit the cut-tree UUID."
    source_ids: []
  - rule_id: valid_outputs
    applies_to: "all outputs"
    rule: "Enumerate accepted grades, downgraded goods, bough goods, off-spec return, field residues and waste with real destination and attribution. Exclude unresolved rejects from reference mass."
    source_ids: []
  - rule_id: valid_attribution
    applies_to: "every shared ledger"
    rule: "Reconcile sites, periods, output sets, assets and handling campaigns; check cleaning/changeover events and no repeated full-burden allocation or unsupported substitution credits."
    source_ids: []
  - rule_id: valid_units
    applies_to: "all rows"
    rule: "Check actual paired count/mass conversion, one net dispatch denominator, fresh moisture/state and native substance/energy/service units; do not equate per-tree records directly to per-kg values."
    source_ids: []
  - rule_id: valid_bindings
    applies_to: "all actual exchanges"
    rule: "Final dataset exchanges require independently verified specific UUIDs/property/unit; unresolved candidate identities and heterogeneous umbrellas cannot be silently accepted or supplied from a screen."
    source_ids: []
  - rule_id: valid_bilingual
    applies_to: "all cards"
    rule: "Preserve EN/ZH process/direction/type/row ids, actual meaning, amounts/bases, bindings and Range metadata; regenerate the projection after canonical edits and inspect performed/skipped check coverage."
    source_ids: []
  - rule_id: validate_direct_release_coverage
    applies_to: "grow; harvest; condition; grade; hold; dispatch"
    rule: "For every activated node, reconcile its activity list against cp_direct_release_grow; cp_direct_release_harvest; cp_direct_release_condition; cp_direct_release_grade; cp_direct_release_hold; cp_direct_release_dispatch: each relevant event must have quantified concrete elementary exchanges, evidenced upstream-service coverage, or evidenced absence of the activity. Missing/unknown is not zero and blocks data-package completeness. Check each actual substance/medium amount, method/factor units, concrete UUID and existing-card/service coverage for omissions or duplication; empty groups, purchased-electricity upstream emissions or another node's single CO2 card do not replace this node's on-site reconciliation. Shared-asset services must not create duplicate physical release events."
    source_ids: []
  - rule_id: validation_rule_10
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile required/conditional activation and upstream coverage against incoming state at each node; purchased completed-state feed must not duplicate growth, harvest or preparation. Equal classification does not replace state and gate matching."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground production dataset for managed-grown fresh cut whole trees"
  downstream_use: "secondary_dataset; background_dataset only within the declared compatible producer-gate scope after concrete exchange resolution and review"
  allowed_use: "Traceable species/height-grade/cohort/site mix and actual fresh grower-dispatch state; measured net-mass normalization with count descriptors retained"
  excluded_use: "Wild trees, replanting/potted trees, artificial/decorated goods, bough-only products, retail/use/end-of-life, generic per-tree claims without measured equivalence, zero-upstream or automatic carbon-credit claims"
  required_metadata: "All reference qualifiers; actual process path; cohort/year and site coverage; original quantities/units; current identity confirmations; allocation/asset/run ledger; tree/package/reject/stock boundaries"
  required_quality_disclosure: "Data gaps and proxies, measurement/model uncertainty, represented species/grade/site/year shares, unexplained balances, method-specific carbon/water terms and replaced or unresolved provisional screens"
  update_trigger: "New species/grade mix, cultivation/harvest/holding technology, dispatch gate, source cohort/site coverage, supplier identity, actual allocation relationship or substantive new evidence"
data_sources:
  - id: "unsd-cpc3-christmas"
