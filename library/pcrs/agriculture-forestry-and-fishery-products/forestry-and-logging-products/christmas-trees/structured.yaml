  classification_refs: "CPC 3.0 03241; proposed narrower scope"
  covered_products: "Managed-grown fresh whole cut Christmas trees, declared species and buyer height-grade, with actual primary protective presentation"
  excluded_products: "Wild-cut trees; rooted/potted/replanting trees; artificial/decorated goods; isolated boughs as reference goods; deliberately dried/preserved goods; downstream retail/use/disposal"
  representative_product: "Accepted net fresh cut whole tree mass at grower dispatch"
  production_route: "Nursery supply; establishment and full-cohort cultivation; cut/yard; actual preparation; grade; actual protective holding; presentation/load/dispatch"
  market_state: "Fresh whole cut trees; package netting/ties/supports declared separately"
functional_unit:
  what: "Managed-grown fresh cut whole Christmas trees accepted at the actual grower dispatch gate"
  how_much: "1 kg accepted net fresh tree mass, excluding packaging, supports and foreign matter"
  how_well: "Actual species/provenance, height measurement convention and buyer grade acceptance are declared; no universal grade or shelf-life claim"
  how_long_or_cycle: "Actual multi-year cohort establishment-to-harvest phases plus cut-to-dispatch interval; replacements, failed trees and stocks carried between years are disclosed"
  reference_flow_link: "tree_dispatch"
system_boundary:
  rules:
    - rule_id: bound_cohort
      applies_to: "grow; harvest"
      rule: "Include establishment, all cultivation years, replacements and failed-tree burdens attributable to harvested lots; identify remaining living stocks and termination rather than placing all lifetime burdens in one harvest year."
      source_ids:
        - osu-christmas-culture
    - rule_id: bound_actual_path
      applies_to: "all processes"
      rule: "Use the actual graph: grow to harvest; harvest directly to grade or through condition; grade directly to dispatch or through hold. Rework returns link to the originating off-spec lot and actual receiving node. Do not invent bypassed activity or treat transfers as additional final sales."
      source_ids:
        - osu-christmas-harvest
    - rule_id: bound_gates
      applies_to: "dispatch"
      rule: "End at actual producer acceptance/loading handover; include producer-side movement and loading once, exclude carrier distribution/retail/use/end-of-life. Declare any geographically distinct grower handling site and include its connecting transport once."
      source_ids:
        - osu-christmas-harvest
    - rule_id: bound_direct
      applies_to: "grow; all processes"
      rule: "Managed biomass is not a wild whole-tree elementary removal. Record actual environmental abstractions and direct substance releases with receiving media; model biogenic carbon only with an explicit reviewed balance/method, separate stored carbon from sequestration credits and disclose incomplete terms."
      source_ids: []
    - rule_id: bound_assets_sites
      applies_to: "all processes"
      rule: "Index every contributing field/block/nursery interface/yard, shared tractor, shed or irrigation service and each consuming node/year. Include attributable upstream asset/services once using observed causal usage and actual service periods; disclose residual unmatched coverage."
      source_ids: []
    - rule_id: bound_optional
      applies_to: "condition; hold; dispatch"
      rule: "Actual preparation, fresh holding and package presentation do not automatically create a new tree identity. A distinct physical transformation or incompatible state needs separate identity evidence; attached package mass never enters tree reference mass."
      source_ids: []
    - rule_id: bound_identity_reuse
      applies_to: "all own-grown fresh tree transfers"
      rule: "Reusing one compatible flow UUID identifies the physical fresh product only. Preserve actual upstream/downstream process links and measured internal quantities; do not reload a complete farmgate background dataset at every own-grown internal node, count an intermediate transfer as completed dispatch, or count the same lot as a second sale. External purchases retain their actual supplier coverage separately."
      source_ids: []
    - rule_id: boundary_direct_release_coverage
      applies_to: "grow; harvest; condition; grade; hold; dispatch"
      rule: "Reconcile on-site combustion, actual applications and fugitive releases/leaks at every activated node through unique activity-substance-receiving-medium records in cp_direct_release_grow; cp_direct_release_harvest; cp_direct_release_condition; cp_direct_release_grade; cp_direct_release_hold; cp_direct_release_dispatch. Upstream production of purchased fuel or chemicals does not replace emissions from their use on site; verify coverage and avoid double counting the same activity inside a supplier service. Evidence must support non-activity; missing data are not zero. This obligation does not expand the existing product gate or downstream-use boundary and does not presume combustion, fertilization, chemicals or equipment occur."
      source_ids: []
    - rule_id: system_boundary_rule_9
      applies_to: "foreground_system_boundary"
      rule: "Select the route from actual incoming state and ownership. Qualified purchased harvested, extracted, prepared or graded feed may enter at its real receiving node; completed upstream operations are not mandatory foreground operations and standing stock or biological resources must not be charged again. Receiving cards record actual material, grade, wet/dry basis, receipt gate, upstream dataset and process coverage; add the actual receiving exchange if none exists. Bypass does not remove upstream burdens; actual operations cannot be skipped and final reference product, quality and gate remain unchanged."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Actual managed planted cohort with traceable nursery planting-stock supply, establishment, replacement and annual cultivation history"
  starting_condition_role: "Foreground crop production start; nursery supply remains required upstream technosphere coverage"
  product_classification_scope: "Narrower managed-grown fresh cut whole-tree portion of CPC 03241, not all origins or presentations"
  recursive_input_rule: "Purchased trees of the same category retain supplier upstream datasets and genuine receipt/handling; do not reopen their production in this foreground or count them as own-grown reference without origin disclosure"
  upstream_dataset_requirement: "Nursery stock, supplied materials, energy and attributable assets/services require compatible upstream datasets with declared geography, time, state and unit; missing coverage is a gap, never zero"
  disclosure: "Actual cohort periods/sites, biological and package stocks, upstream coverage, bypassed optional nodes, actual handovers, shared assets, rejects, co-products, direct releases and exclusions"
