measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted fresh dispatch tree lots on a calibrated scale under cp_dispatch; subtract separately measured package/support tare and rejected material. Use only positive accepted net tree mass."
  - id: fresh_state
    applies_to: "planting_stock; standing_crop; grow_bough_goods; harvest_standing_feed; cut_trees; condition_tree_feed; prepared_trees; grade_tree_feed; accepted_grades; downgraded_goods; offspec_return; hold_tree_feed; held_trees; dispatch_tree_feed; tree_dispatch"
