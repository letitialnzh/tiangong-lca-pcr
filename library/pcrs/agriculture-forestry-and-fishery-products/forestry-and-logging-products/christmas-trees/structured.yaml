    reference: "https://unstats.un.org/UNSDWebsite/statcom/session_56/documents/BG-3o-Explanatory_Notes_of_the_Central_Product_Classification_Version3-E.pdf ; 03241"
    used_for: "Classification scope; exclusion of trees for replanting, not inventory defaults"
  - id: "osu-christmas-culture"
    type: "extension_guidance"
    reference: "https://extension.oregonstate.edu/catalog/pnw-684-developing-quality-christmas-trees-pacific-northwest ; PNW684"
