allocation_rules:
  - rule_id: alloc_output_set
    applies_to: "intended outputs"
    rule: "Enumerate every accepted tree grade, separately intended pruning bough good and independently sold downgraded good with its actual handover. Subdivide directly measured activities first; internal living/tree/package transfers are not additional sale outputs."
    source_ids: []
  - rule_id: alloc_shared_outputs
    applies_to: "shared cohort burden"
    rule: "Where subdivision cannot resolve shared tree/bough/grade production, collect the actual causal usage or biological-output relationship, declare and justify a PCR-specific allocation method and retain a sensitivity alternative. Economic allocation requires contemporaneous comparable actual prices and justified failure of physical attribution; no equal shares or universal factors. Missing material evidence blocks finalization."
    source_ids: []
  - rule_id: alloc_years
    applies_to: "grow; all periods"
    rule: "Carry establishment and annual inputs/asset usage by actual cohort and year; allocate harvested lots, still-living stock, failed stock and replacements once using the recorded production relationship. Repeated harvests cannot each absorb the same establishment burden, and failed crop burdens cannot vanish."
    source_ids: []
  - rule_id: alloc_assets_runs
    applies_to: "all processes"
    rule: "Attribute each shared asset/service and cleaning/changeover event once across its real consuming nodes, sites, years and lots using measured service use. Maintain a ledger of assigned and residual burden; no independent full-charge in every node."
    source_ids: []
  - rule_id: alloc_returns
    applies_to: "offspec_return; all rejects"
    rule: "Returns keep prior attributed burdens and acquire actual additional work once. Regrade/retrim losses retain their actual treatment or return route. Rejected material never enters accepted mass or produces an unsupported avoided-product credit."
    source_ids: []
  - rule_id: alloc_sites
    applies_to: "contributing sites"
    rule: "Aggregate by summing compatible attributable quantities and dividing by summed accepted net mass, retaining species/grade/cohort mix and site coverage; do not average site intensities without weights or mix uncovered sites into zero burden."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_grow
      process_id: "grow"
      flow_role: "All actual grow card exchanges, transfers and attributed assets"
      record_type: "Calibrated records and indexed activity ledger"
      raw_fields: "site; block; cohort; year; lot; species/provenance; event; actual substance/service; flow state; direction; actual amount/unit; acceptance/destination; linked upstream lot; shared asset period/use; cleanup/changeover; return status; actual tree count; height-grade; net fresh mass; moisture/state; land area; occupation start/end; prior/new land use; transformation evidence; gross/package tare where applicable"
      collection_method: "Calibrated weighing and paired lot/count measurements; actual meter/fuel/material invoices reconciled with consumption; stock/event records and destination receipts; explicit method/substance/medium records for direct releases; no assumed mass per tree"
      unit: "kg; native area and area-time; original energy/service units retained before justified conversion"
      frequency: "Every actual event and lot; cultivation indexed annually within complete cohort"
      temporal_coverage: "Establishment through each cultivation year, harvest and residual stock closure"
      site_scope: "Every contributing actual field or grower handling site; retain site boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; paired count/net-mass record; buyer acceptance and height-grade convention; traceable site/cohort ledger; consumption/stock reconciliation; actual return/treatment receipts"
    - protocol_id: cp_harvest
      process_id: "harvest_to_dispatch"
      flow_role: "All actual harvest card exchanges, transfers and attributed assets"
      record_type: "Calibrated records and indexed activity ledger"
      raw_fields: "site; block; cohort; year; lot; species/provenance; event; actual substance/service; flow state; direction; actual amount/unit; acceptance/destination; linked upstream lot; shared asset period/use; cleanup/changeover; return status; actual tree count; height-grade; net fresh mass; moisture/state; gross/package tare where applicable"
      collection_method: "Calibrated weighing and paired lot/count measurements; actual meter/fuel/material invoices reconciled with consumption; stock/event records and destination receipts; explicit method/substance/medium records for direct releases; no assumed mass per tree"
      unit: "kg; original energy/service units retained before justified conversion"
      frequency: "Every actual event and lot; cultivation indexed annually within complete cohort"
      temporal_coverage: "Actual campaign and every cut-to-dispatch event including period-crossing stocks"
      site_scope: "Every contributing actual field or grower handling site; retain site boundaries"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; paired count/net-mass record; buyer acceptance and height-grade convention; traceable site/cohort ledger; consumption/stock reconciliation; actual return/treatment receipts"
