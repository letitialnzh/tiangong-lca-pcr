      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve actual fresh mass and measured moisture/state for each biological transfer; do not use a generic dry-matter or count conversion."
  - id: delivered_energy
    applies_to: "grow_energy; harvest_energy; condition_energy; grade_energy; hold_energy; dispatch_energy"
