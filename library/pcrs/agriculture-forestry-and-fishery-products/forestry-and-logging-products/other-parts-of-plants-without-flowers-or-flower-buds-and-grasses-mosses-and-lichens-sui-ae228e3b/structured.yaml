allocation_rules:
  - rule_id: allocation_precedence
    applies_to: "complete intended output set"
    rule: "First subdivide independently measured operations and directly trace burdens. For remaining shared burdens, use a documented causal physical driver; if no defensible physical relation exists, disclose why and apply gate- and period-matched economic allocation with sensitivity. Enumerate all intended outputs and state precedence; no automatic substitution credits or universal mass allocation across unlike products."
    source_ids: []
  - rule_id: allocation_origin_and_stock
    applies_to: "source, crop co-products and inventory carryover"
    rule: "Purchased feed retains supplier burdens once. Crop by-products and recovered material require explicit origin, handoff and inherited-burden/cut-off decisions; secondary or low-priced material is not automatically burden-free. Carry actual stock burdens across periods; closing stock is not dispatched reference output and later release must not repeat original burdens."
    source_ids: []
  - rule_id: allocation_shared_services
    applies_to: "shared assets, failed trips and periods"
    rule: "Identify all consuming nodes/outputs and service periods; shares of a fully assigned record sum to one. Attribute failed-trip, idle/service and changeover burdens to the evidenced campaign/output set, with no-output periods separately disclosed. An inclusive transport, drying or assembly service excludes duplicate embedded energy/material/asset burdens."
    source_ids: []
  - rule_id: allocation_rework_waste
    applies_to: "rework, downgrade and waste"
    rule: "Internal rework retains original burdens and adds measured incremental work only. Sold downgrades are independent intended exits when actually sold; pending rework is not accepted output. Record waste handling/treatment under the declared boundary without relabelling a discarded stream as saleable to avoid burdens; environmental return has no automatic credit."
    source_ids: []
  - rule_id: allocation_aggregation
    applies_to: "multiple sites, grades and materials"
    rule: "For the same declared product/state and boundary, divide summed attributable inventory totals by summed accepted mass; do not take an unweighted average of site intensities. Unlike species/materials, treated states or compositions require separate datasets or an explicitly identified representative mix with measured proportions; one kilogram is not proof of functional equivalence."
    source_ids: []
