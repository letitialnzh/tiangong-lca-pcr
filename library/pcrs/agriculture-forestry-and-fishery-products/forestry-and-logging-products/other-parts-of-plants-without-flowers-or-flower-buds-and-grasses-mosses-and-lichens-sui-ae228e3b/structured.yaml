  calculation_rules:
    - id: normalize_lot
      applies_to: "all inventory rows"
      rule: "For each compatible exchange i, amount_i = attributable_quantity_i / accepted_net_kg. Use the same accepted product/state and lot/period; the reference amount is 1 kg. Retain numerator totals and their attribution records."
      inputs:
        - attributable_quantity_i
        - accepted_net_kg
        - cp_reference
      output: "native exchange unit per kg reference product"
      source_ids: []
    - id: substrate_moisture
      applies_to: "measured botanical substrate only"
      rule: "dry_substrate_kg = wet_substrate_kg * (1 - water_fraction_wb); water_fraction_wb = water_kg / (water_kg + dry_substrate_kg). For dry-basis water_ratio_db = water_kg / dry_substrate_kg, water_fraction_wb = water_ratio_db / (1 + water_ratio_db). Require positive dry substrate and 0 <= water_fraction_wb < 1; declare method and sampling. Do not apply these equations to retained treatment agents or non-botanical components."
      inputs:
        - wet_substrate_kg
        - water_kg
        - "measured composition"
        - "moisture method"
      output: "declared dry substrate and moisture basis"
      source_ids: []
    - id: node_stock_balance
      applies_to: "each physical material ledger, node and period"
      rule: "balance_gap = opening_stock + incoming_mass + evidenced_added_mass - closing_stock - intended_exits - waste_exits - environmental_returns - independently_evidenced_releases. Keep composition/water and actual reaction or carbon boundaries explicit so terms do not overlap; account for additional sources where actual. Record uncertainty and investigate the gap without converting it automatically into an emission."
      inputs:
        - "dated quantities"
        - "material composition"
        - stocks
        - "independently evidenced release records"
      output: "mass balance and unexplained difference"
      source_ids: []
    - id: retained_components
      applies_to: "treated materials and compositions"
      rule: "accepted_net_kg = accepted_botanical_substrate_kg + retained_treatment_matter_kg + permanent_other_components_kg, using disjoint mass definitions; botanical substrate includes its declared inherent water. Transport packaging and incidental matter are excluded; retained treatment solution water must belong to exactly one mass component."
      inputs:
        - "measured product composition"
        - "botanical/moisture ledger"
        - "retained agents"
        - "permanent components"
      output: "reconciled whole-product reference mass"
      source_ids: []
    - id: shared_attribution
      applies_to: "shared service records and independent outputs"
      rule: "assigned_quantity_k = total_quantity * share_k; sum of shares = 1 for a fully assigned record. Select the driver using allocation precedence and preserve all consumers, periods and exclusions. Rework receives only its incremental share in addition to retained original burdens."
      inputs:
        - total_quantity
        - "complete consumers"
        - "driver evidence"
        - share_k
      output: "complete nonduplicated quantity attribution"
      source_ids: []
    - id: direct_release
      applies_to: "each identified emitted substance and compartment"
      rule: "Use a measurement or emission_kg = activity_in_declared_unit * compatible_factor_kg_per_unit with documented scope, period, substance basis and uncertainty. Avoid overlap with treatment/service datasets. Formulated product mass, elemental nutrient mass and compound emission mass are not interchangeable without explicit evidenced stoichiometry."
      inputs:
        - "measured release or compatible activity/factor"
        - "actual substance/compartment"
      output: "substance-specific direct release"
      source_ids: []
  data_quality_requirements:
    - id: quality_eligibility
      applies_to: "each product, part and route"
      requirement: "Demonstrate category eligibility and actual state/origin/use; species list and a generic name are not sufficient. Food applicability is not food-safety certification, and source permits do not prove sustainability or management status."
      evidence: "original classification, source/part/composition and acceptance records"
    - id: quality_measurement
      applies_to: "quantities, moisture and components"
      requirement: "Retain calibrated net weighing, sampling, native units, composition and stock records; explain conversions and uncertainty. No unverified numeric category default substitutes for foreground evidence."
      evidence: "raw readings, scales/meters, composition tests and reconciliations"
    - id: quality_coverage
      applies_to: "sites, seasons, activities and suppliers"
      requirement: "Enumerate contributors, unsuccessful work, actual treatments/bypasses, shared services and upstream coverage; retain inclusion/exclusion and representativeness decisions. Unknown quantities or UUIDs block complete dataset claims even if the methodology projection passes."
      evidence: "complete source/campaign/run/site/period and supplier coverage registers"
validation_rules:
  - rule_id: validate_class_scope
    applies_to: "category and route branches"
    rule: "Check actual category eligibility against specific exclusions and the product/part/state/use evidence. Activate every applicable branch and record explicit absence/bypass. A broad category title does not certify every species, composition or treatment; uncertain classification blocks the corresponding dataset applicability claim."
    source_ids: []
  - rule_id: validate_reference
    applies_to: "final output and denominator"
    rule: "Check dispatch_accepted_product is the real output, normalized to 1 kg, with measured positive accepted lot mass, complete gate/composition/state qualifiers and consistent EN/ZH definitions. Packaging, incidental matter, rejected goods and closing stock must not enter the denominator. Retained product components cannot be removed as package tare."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "each node, lot and period"
    rule: "Reconcile measured inputs/opening stock against outputs/closing stock and independently evidenced water/substance changes. Check paired internal transfers and disjoint incidental/target ledgers. Investigate residuals and uncertainty; never manufacture evaporation, pollutant emissions, yield or carbon uptake to force closure."
    source_ids: []
  - rule_id: validate_quantities_units
    applies_to: "all concrete exchanges and calculations"
    rule: "Use each exchange native unit and the common accepted-mass denominator. Moisture conversion applies only to the measured botanical substrate, not an entire treated/composite product. Preserve formulation versus active-ingredient basis, bath stocks, count/volume conversions and direction of losses. Every missing quantity/factor remains a gap, not zero."
    source_ids: []
  - rule_id: validate_output_attribution
    applies_to: "output sets, sites, periods and services"
    rule: "Verify complete intended output handoffs, causal/economic precedence, campaign failed work, site totals, stock carryover and complete shared-consumer shares. Do not double-count source production, treatment, component or packaging supply already represented in upstream/inclusive records."
    source_ids: []
  - rule_id: validate_uuid_and_ranges
    applies_to: "identities and evidence"
    rule: "Before final exchange use, verify concrete UUID, flow type, source/state/gate/provider, property and unit-group support for each actual exchange. No broad-category UUID is inferred from one representative. Every card has an explicit range-evidence requirement; where no compatible numerical evidence exists, disclose unavailable screening and do not claim a default, validation completeness or publication readiness. Do not introduce Flow Sets."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset; secondary_dataset; background_dataset"
  downstream_use: "Supply the explicitly identified material/state/composition at its actual producer gate; match the receiving application independently"
  allowed_use: "Only the measured product and disclosed representative scope, with complete upstream and foreground coverage"
  excluded_use: "Automatic substitution across species, states or uses; universal category average without mixture evidence; safety/sustainability claims; treating an unresolved category identity as a verified concrete exchange"
  required_metadata: "actual product family; species/material and marketed part; composition and accepted grade; wild/managed/co-product/purchased origin and upstream coverage (managed production is excluded for wild food); actual incoming and delivered state; moisture basis; retained treatment matter and product components; selected branch and actual node/bypass graph; lot/site/season/period and stocks; net weighing/tare method; intended use and buyer specification; actual producer gate/recipient; native exchange units and evidence gaps"
  required_quality_disclosure: "actual collection coverage, method/quantity/identity gaps, uncertainty, provisional or unavailable range screening, allocation and aggregation, boundary truncation and source independence"
  update_trigger: "changed product family, parts, source regime, state, treatment/composition, gate, upstream coverage, unit basis, factor evidence or actual route"
data_sources:
  - id: "unsd-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 explanatory notes (10 February 2025), printed pp. 39-40, subclasses 03231-03252; https://unstats.un.org/UNSDWebsite/statcom/session_56/documents/BG-3o-Explanatory_Notes_of_the_Central_Product_Classification_Version3-E.pdf"
    used_for: "Category inclusions/exclusions and scope; not a quantitative recipe or safety approval"
  - id: "census-hs6-2022"
    type: "official_guidance"
    reference: "US Census Bureau, Schedule B 2022, Chapter 6, heading 0604; https://www.census.gov/foreign-trade/schedules/b/2022/scheduleballchapters.html"
    used_for: "Ornamental-material fresh and prepared state terminology; CPC notes retain precedence for CPC eligibility"
  - id: "uf-ornamental-preservation"
    type: "extension_guidance"
    reference: "University of Florida IFAS Extension, CIR495/EP004, Drying and Preserving Plant Materials for Decorative Uses; https://ask.ifas.ufl.edu/publication/EP004"
    used_for: "Examples of drying, glycerin preservation and coloring; no copied times, recipes, losses or safety defaults"
  - id: "fao-ornamental-sources"
    type: "official_guidance"
    reference: "FAO World Forestry Congress 2003, Non-Timber Forest Products in the United States: Harvest and Issues, Floral and horticultural use; https://www.fao.org/4/xii/0337-a1.htm"
    used_for: "Wild/managed foliage, moss/lichen and fresh/dried contexts; historical observations are not current inventory defaults"
