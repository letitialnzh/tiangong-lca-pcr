    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_reference with a calibrated scale and the same acceptance record. Accepted net mass of the declared ornamental good in its actual delivered state. Include retained treatment ingredients and permanent components of an eligible composition; exclude detachable transport packaging, incidental soil/stone, free drainage water and rejects. Report botanical substrate, its moisture, retained treatment matter and structural parts separately."
  - id: common_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual exchange property"
      uuid: ""
    required_unit: "actual unit"
    rule: "Every amount is per 1 kg reference flow. Keep attributable lot/period totals and divide by the same positive accepted net dispatch mass; never divide by an intermediate output, item count or a different moisture/state basis."
  - id: moisture_and_components
    applies_to: "wet/dry and treated/composite material"
    required_property_ref:
      name: "measured substrate mass and water fraction"
      uuid: ""
    required_unit: "kg; kg/kg"
    rule: "State wet- or dry-basis moisture and method. Apply dry-matter conversion only to the botanical substrate; retained chemicals, foreign matter and structural components have separate ledgers. Do not apply a fresh-rattan, fresh-leaf or assumed density factor to every category member."
  - id: native_units_and_formulations
    applies_to: "supplies, services and direct releases"
    required_property_ref:
      name: "actual compatible property"
      uuid: ""
    required_unit: "actual unit"
    rule: "Preserve each carrier/service/substance unit. Convert volume, count, nutrient/active-ingredient or solution concentration only using compatible measured/evidenced factors; do not sum unlike native units. Formulation/active contents and gross bath capacity are not interchangeable consumed amounts."
