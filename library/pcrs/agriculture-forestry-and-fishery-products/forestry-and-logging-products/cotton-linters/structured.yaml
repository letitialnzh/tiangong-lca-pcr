  - id: moisture_basis
    applies_to: "Cottonseed, raw linters, cleaned linters, residues, and final linters"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg as received and kg dry matter where available"
    rule: "Record moisture basis for incoming seed, intermediate linters, and final linters. Convert to the declared reference basis when product moisture differs across lots."
  - id: cut_type_reporting
    applies_to: "Reference product and linter process outputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg by cut type"
    rule: "Distinguish first-cut, second-cut, third-cut, and mill-run linters because fibre length, impurity, and downstream use can differ materially."
  - id: co_product_mass_balance
    applies_to: "Cottonseed input, linters, delinted seed, residues, and dust"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reconcile cottonseed input with linters, delinted seed, rejects, dust, and moisture changes before allocation."
  - id: energy_unit_consistency
    applies_to: "Electricity, fuel, compressed air, and mechanical services"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh or MJ"
    rule: "Convert meters, fuel records, and equipment-hour calculations to kWh or MJ and state whether values are final electricity, fuel lower heating value, or delivered service energy."
  - id: inventory_reference_normalization
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual flow property"
      uuid: ""
    required_unit: "exchange unit per reference flow"
    rule: "Inventory and collection aggregation fields express final-package contributions per reference flow. Retain raw lots, periods, stage quantities and units; first derive the quantity under existing conversion, attribution and allocation rules, then multiply by the declared reference amount and divide by measured accepted final gate output of the same scope. Require a traceable positive denominator and normalize exactly once. Keep provisional QA ranges on their explicit bases; they are not conversion factors or production defaults. Physical transfers and mass balances use quantities before burden allocation; burden shares must not alter physical yields."
  - id: stage_throughput_linkage
    applies_to: "stage records and final package contributions"
    required_property_ref:
      name: "Actual flow property and raw basis"
      uuid: ""
    required_unit: "retain native numerator and stage denominator units"
    rule: "Link measured throughput, outputs, rejects, losses and opening/closing stocks by lot, stage and period. For amount a quoted per explicit stage basis B, reconstruct the total as a * Q_stage / B; for intensity r already per stage-unit, use r * Q_stage; use raw totals directly without dividing by the stage denominator again. Then normalize once to final gate output. Keep measured intermediate yields rather than fixing transfers to 1 kg; do not assign a second product burden to an internal transfer. Stage-native datasets retain their own references separately from final-package contributions."
process_map:
