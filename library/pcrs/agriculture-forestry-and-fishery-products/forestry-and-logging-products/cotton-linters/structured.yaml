measurement_rules:
  - id: reference_mass
    applies_to: "Reference product and saleable linter outputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
