    role: "Establishes seed lot identity, moisture, incoming mass, storage, and pre-cleaning losses."
    quantitative_reference: "kg cottonseed received and cleaned per 1 kg reference linters"
  - id: mechanical_delinting
    name: "Mechanical delinting"
    inclusion: "required"
    inclusion_condition: "Include every delinting pass used to make the declared first-cut, second-cut, third-cut, or mill-run product."
    role: "Removes linter fibre from cottonseed and creates delinted seed and raw linter streams."
    quantitative_reference: "kg raw linters and kg delinted seed per 1 kg reference linters"
  - id: linter_cleaning_conditioning_and_baling
    name: "Linter cleaning, conditioning, and baling"
    inclusion: "required"
    inclusion_condition: "Include cleaning, aspiration, dust removal, moisture conditioning when used, baling, bagging, and packaging before sale."
    role: "Converts raw linters into saleable linter bales or lots."
    quantitative_reference: "kg saleable linters per 1 kg reference linters"
  - id: co_product_residue_and_dispatch
    name: "Co-product, residue, and dispatch handling"
    inclusion: "required"
    inclusion_condition: "Include co-product transfer, residue management, storage, loading, and producer-gate dispatch before the product leaves the foreground system."
    role: "Records delinted seed co-product fate, residues, loading energy, and final dispatch state."
    quantitative_reference: "kg dispatched saleable linters per 1 kg reference linters"
