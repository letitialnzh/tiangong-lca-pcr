allocation_rules:
  - rule_id: cottonseed_coproduct_allocation
    applies_to: "foreground_burden_allocation"
    rule: "If the foreground facility jointly produces cotton linters and delinted cottonseed, allocate shared receipt, cleaning, delinting, storage, and dispatch burdens between linters and delinted seed using a documented physical relationship when it reflects process causality. Otherwise use economic allocation with same-period prices and a sensitivity check."
    source_ids: []
  - rule_id: incoming_cottonseed_burden
    applies_to: "foreground_burden_allocation"
    rule: "Purchased cottonseed enters with an upstream dataset. If the study boundary includes cotton ginning or seed ownership before delinting, allocate upstream cottonseed and ginning burdens consistently with the linked cotton or cottonseed PCR."
    source_ids: []
  - rule_id: off_grade_linter_treatment
    applies_to: "foreground_burden_allocation"
    rule: "Off-grade linters sold for lower-value uses are co-products when they leave as saleable material; otherwise treat them as waste or internal rework according to measured fate."
    source_ids: []
  - rule_id: residue_fate
    applies_to: "foreground_burden_allocation"
    rule: "Dust, hull fragments, seed cleaning rejects, and packaging waste must be tracked by fate, including disposal, composting, fuel use, feed use, or internal recycling."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_cottonseed_receipt_records
      process_id: "cottonseed_receipt_and_precleaning"
      flow_role: "incoming seed and cleaned seed transfer"
      record_type: "receiving, scale, storage, and pre-cleaning record"
      raw_fields: "supplier; lot_id; cotton_species_or_variety; seed_mass; moisture; trash; storage_bin; receipt_date; cleaned_seed_mass"
      collection_method: "weighbridge, scale ticket, receiving note, storage ledger, or seed cleaner log; Raw aggregation requirements: sum incoming lots and calculate cleaned seed transfer after rejects and moisture adjustment. Retain raw totals, stage denominators and accepted final gate output records; normalize once under inventory_reference_normalization and stage_throughput_linkage."
      unit: "kg seed, percent moisture, percent trash"
      frequency: "each lot or campaign"
      temporal_coverage: "representative production year or declared campaign"
      site_scope: "receiving site, storage bin, or seed lot"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration, receiving ticket, storage ledger, and moisture test"
    - protocol_id: cp_delinting_pass_records
      process_id: "mechanical_delinting"
      flow_role: "seed charged, pass type, raw linter output, and pass yield"
      record_type: "delinter run sheet, production log, or control-system record"
      raw_fields: "pass_number; cut_type; seed_mass_charged; raw_linter_mass; delinted_seed_mass; runtime; equipment_id; moisture"
      collection_method: "batch sheet, linter run sheet, plant historian, or operator log; Raw aggregation requirements: reconcile seed charged with raw linters, delinted seed, dust, and moisture change. Retain raw totals, stage denominators and accepted final gate output records; normalize once under inventory_reference_normalization and stage_throughput_linkage."
      unit: "kg, hour, percent moisture"
      frequency: "each pass or batch"
      temporal_coverage: "declared campaign or production year"
      site_scope: "delinter line, pass, and seed lot"
      aggregation_rule: "per reference flow"
      quality_evidence: "production logs, scale records, moisture tests, and mass-balance worksheet"
    - protocol_id: cp_linter_quality_and_baling_records
      process_id: "linter_cleaning_conditioning_and_baling"
      flow_role: "raw linters, cleaned linters, grade, bale, and packaging"
      record_type: "quality, cleaning, conditioning, bale press, or finished-goods record"
      raw_fields: "cut_type; grade; raw_linter_mass; cleaned_linter_mass; moisture; impurity; bale_id; bale_mass; packaging_mass"
      collection_method: "bale scale, lab test, visual grading record, product specification, or finished-goods ledger ; Raw aggregation requirements: Sum conforming net bale masses and link to the dispatch ledger; do not equate finishing output with final dispatched output. Retain raw totals, stage denominators and accepted final gate output records; normalize once under inventory_reference_normalization and stage_throughput_linkage."
      unit: "kg, percent moisture, percent impurity"
      frequency: "each bale, lot, or campaign"
      temporal_coverage: "declared campaign or production year"
      site_scope: "finishing line, bale press, or warehouse"
      aggregation_rule: "per reference flow"
      quality_evidence: "bale tickets, lab records, grading notes, finished-goods ledger, and certificate of analysis where available"
    - protocol_id: cp_energy_records
      process_id: "all_processes"
      flow_role: "electricity, fuel, compressed air, and mechanical service"
      record_type: "meter, invoice, fuel issue, compressed-air allocation, or equipment-hour record"
      raw_fields: "carrier; quantity; unit; equipment_id; process_id; runtime; date; allocation_basis"
      collection_method: "meter reading, invoice reconciliation, equipment-hour calculation, or submeter ; Raw aggregation requirements: allocate directly metered energy first, then by runtime, throughput, or saleable linter mass. Retain raw totals, stage denominators and accepted final gate output records; normalize once under inventory_reference_normalization and stage_throughput_linkage."
      unit: "kWh, MJ, L fuel, kg fuel, equipment-hour"
      frequency: "monthly, per batch, or per campaign"
      temporal_coverage: "representative production year or campaign"
      site_scope: "line, equipment, facility, or process area"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration, invoice, fuel log, and allocation worksheet"
    - protocol_id: cp_maintenance_material_records
      process_id: "mechanical_delinting"
      flow_role: "saws, brushes, screens, lubricants, and maintenance consumables"
      record_type: "inventory issue, maintenance work order, or equipment log"
      raw_fields: "material_type; quantity; unit; equipment_id; replacement_date; process_id; allocation_basis"
      collection_method: "work order, stock issue, maintenance record, or supplier note ; Raw aggregation requirements: allocate consumables by delinter runtime, seed throughput, or linter mass. Retain raw totals, stage denominators and accepted final gate output records; normalize once under inventory_reference_normalization and stage_throughput_linkage."
      unit: "kg, item count, L lubricant"
      frequency: "per replacement or monthly"
      temporal_coverage: "representative production year or campaign"
      site_scope: "delinter line or equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "maintenance log, stock issue record, and supplier specification"
    - protocol_id: cp_packaging_records
      process_id: "linter_cleaning_conditioning_and_baling"
      flow_role: "bale ties, straps, wraps, bags, labels, and non-returnable packaging"
      record_type: "bill of materials, purchase, warehouse issue, or bale record"
      raw_fields: "material_type; unit_mass; units_used; bales_covered; reusable_flag; supplier; waste_amount"
      collection_method: "BOM, packaging issue, bale press record, or supplier specification ; Raw aggregation requirements: sum non-returnable packaging per net saleable linter mass. Retain raw totals, stage denominators and accepted final gate output records; normalize once under inventory_reference_normalization and stage_throughput_linkage."
      unit: "kg material, item count"
      frequency: "each lot or monthly"
      temporal_coverage: "production year or campaign"
      site_scope: "bale press, warehouse, or dispatch area"
      aggregation_rule: "per reference flow"
      quality_evidence: "purchase records, BOM, supplier specifications, and stock issue records"
    - protocol_id: cp_coproduct_records
      process_id: "mechanical_delinting_co_product_residue_and_dispatch"
      flow_role: "delinted seed and saleable off-grade linter co-products"
      record_type: "co-product transfer, sales, or internal use record"
      raw_fields: "co_product_type; mass; moisture; destination; sale_price_if_used; internal_transfer; date"
      collection_method: "scale ticket, transfer note, sales invoice, internal transfer ledger, or downstream production record; Raw aggregation requirements: sum co-product quantities and calculate allocation factors when needed. Retain raw totals, stage denominators and accepted final gate output records; normalize once under inventory_reference_normalization and stage_throughput_linkage."
      unit: "kg, percent moisture, currency per kg where used"
      frequency: "each lot or monthly"
      temporal_coverage: "production year or campaign"
      site_scope: "seed transfer point, warehouse, or customer lot"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale records, invoices, transfer notes, and allocation worksheet"
    - protocol_id: cp_residue_records
      process_id: "all_processes"
      flow_role: "seed cleaning rejects, dust, fines, off-grade waste, and waste packaging"
      record_type: "waste, residue, disposal, composting, fuel-use, or rework record"
      raw_fields: "residue_type; quantity; moisture; fate; disposal_route; internal_reuse_flag; date; process_id"
      collection_method: "waste ticket, dust collector log, residue measurement, disposal manifest, or rework ledger ; Raw aggregation requirements: sum residues by fate and link saleable residues to co-product rule. Retain raw totals, stage denominators and accepted final gate output records; normalize once under inventory_reference_normalization and stage_throughput_linkage."
      unit: "kg, percent moisture"
      frequency: "each lot, monthly, or campaign"
      temporal_coverage: "production year or campaign"
      site_scope: "receiving, delinting, finishing, warehouse, or waste handling area"
      aggregation_rule: "per reference flow"
      quality_evidence: "disposal tickets, waste manifest, dust collector logs, and rework records"
    - protocol_id: cp_air_emission_records
      process_id: "mechanical_delinting_linter_cleaning_conditioning_and_baling"
      flow_role: "fugitive and controlled fibre dust emissions"
      record_type: "filter balance, permit estimate, stack test, or dust collector record"
      raw_fields: "captured_dust_mass; filter_efficiency; emission_factor_if_used; airflow; operating_hours; control_device"
      collection_method: "stack test, filter weighing, permit calculation, or dust collector log; Raw aggregation requirements: calculate emitted dust as uncontrolled or generated dust minus captured dust and retained residues. Retain raw totals, stage denominators and accepted final gate output records; normalize once under inventory_reference_normalization and stage_throughput_linkage."
      unit: "kg particulate, m3 air, hour"
      frequency: "test event, monthly, or campaign"
      temporal_coverage: "representative production year or permit period"
      site_scope: "dust collector, delinter line, finishing line, or facility"
      aggregation_rule: "per reference flow"
      quality_evidence: "stack test, filter log, permit file, and calculation worksheet"
    - protocol_id: cp_dispatch_records
      process_id: "co_product_residue_and_dispatch"
      flow_role: "final linter dispatch and loading"
      record_type: "dispatch ticket, inventory release, loading record, or bill of lading"
      raw_fields: "lot_id; bale_id; net_mass; packaging_state; dispatch_date; customer_or_destination; loading_energy_link"
      collection_method: "finished-goods ledger, bill of lading, loading ticket, or dispatch record; Raw aggregation requirements: reconcile finished goods with shipped saleable linter mass and dispatch losses. Retain raw totals, stage denominators and accepted final gate output records; normalize once under inventory_reference_normalization and stage_throughput_linkage."
      unit: "kg, bale count"
      frequency: "each dispatch lot"
      temporal_coverage: "production year or campaign"
      site_scope: "warehouse, loading dock, or producer gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "bill of lading, finished-goods ledger, loading ticket, and inventory reconciliation"
  calculation_rules:
    - id: normalize_to_reference_linter_mass
      applies_to: "all inventory rows"
      rule: "Reconstruct raw quantities under stage_throughput_linkage and attribute once under existing rules; final contribution = attributable raw amount * declared reference amount / measured accepted final gate net output of the same period. Do not scale physical transfers by burden allocation or divide an already normalized amount again."
      inputs:
        - "raw quantities and bases"
        - "final gate net output from cp_dispatch_records"
        - route
        - "period and allocation records"
      output: "exchange amount per 1 kg reference product"
      source_ids: []
    - id: cottonseed_linter_mass_balance
      applies_to: "cottonseed, raw linters, cleaned linters, delinted seed, residues, and dust"
      rule: "incoming cottonseed mass = saleable linters + delinted seed + residues + dust + moisture change within stated tolerance"
      inputs:
        - "cottonseed receipt"
        - "raw linter output"
        - "final linter output"
        - "delinted seed"
        - residues
        - moisture
      output: "reconciled mass balance and QA flag"
      source_ids:
        - usda-ers-natural-fibers-2006
        - usda-mrr56-cotton-linters
    - id: cut_type_yield_tracking
      applies_to: "first-cut, second-cut, third-cut, and mill-run linters"
      rule: "record each pass separately; if passes are blended, calculate weighted average grade, moisture, impurity, and yield"
      inputs:
        - "pass records"
        - "blend recipe"
        - "grade and moisture records"
      output: "cut-type-specific linter yield and final product description"
      source_ids:
        - cotton-inc-fiber-sourcing-2017
        - ncpa-trading-rules-2013
    - id: co_product_allocation_factor
      applies_to: "shared facility burdens"
      rule: "allocation factor = selected physical or economic allocation measure for linters / total selected allocation measure for linters plus co-products"
      inputs:
        - "linter mass or value"
        - "delinted seed mass or value"
        - "off-grade co-products"
        - "shared burdens"
      output: "allocation factors for shared processes"
      source_ids:
        - iso-14044-2006
    - id: moisture_conversion
      applies_to: "seed, linters, residues, and co-products"
      rule: "dry mass = as-received mass * (1 - moisture fraction); reported reference mass remains on declared saleable basis"
      inputs:
        - "as-received mass"
        - "moisture fraction"
        - "declared reference basis"
      output: "kg dry matter and kg saleable basis"
      source_ids: []
  data_quality_requirements:
    - id: dq_product_identity
      applies_to: "reference product"
      requirement: "Declare cut type, grade or quality class, moisture basis, impurity basis, bale or loose state, and production region."
      evidence: "finished-goods record, grade record, bale ticket, supplier certificate, or product specification"
    - id: dq_seed_traceability
      applies_to: "cottonseed input"
      requirement: "Trace cottonseed to supplier, seed lot, ginning origin where available, and receipt period."
      evidence: "receiving ticket, supplier declaration, storage ledger, and lot traceability"
    - id: dq_mass_balance
      applies_to: "seed, linters, delinted seed, residues, and dust"
      requirement: "Cottonseed mass balance must reconcile input seed, linters, delinted seed, residues, dust, and moisture changes for each campaign."
      evidence: "scale records, run sheets, moisture tests, dust collector records, and mass-balance worksheet"
    - id: dq_energy_allocation
      applies_to: "energy and shared services"
      requirement: "Energy records must distinguish receipt, delinting, finishing, and dispatch where material; shared energy allocation must be documented."
      evidence: "submeters, invoices, equipment-hour logs, and allocation worksheet"
    - id: dq_coproduct_treatment
      applies_to: "delinted seed and saleable off-grade linters"
      requirement: "Co-product quantities, destinations, and allocation basis must be disclosed."
      evidence: "transfer records, sales invoices, internal use records, and allocation calculation"
    - id: dq_downstream_exclusion
      applies_to: "downstream manufacturing"
      requirement: "Purification, pulping, chemical conversion, paper, absorbent cotton, and nonwoven production must be explicitly excluded or separately modelled."
      evidence: "boundary statement, product description, and downstream module links where applicable"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "The final producer-gate reference product output must equal 1 kg net saleable cotton linters."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Cut type, grade or quality class, moisture basis, impurity basis, bale or loose state, production region, and allocation method must be declared."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "Cottonseed input, linters, delinted seed, rejects, dust, and moisture changes must be reconcilable for the declared batch or campaign."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "Shared burdens must include a documented allocation method for delinted seed and any saleable off-grade linters or residues."
    source_ids: []
  - rule_id: validation_rule_5
    applies_to: "foreground_dataset_conformance"
    rule: "First-cut, second-cut, third-cut, and mill-run linters must not be mixed in the reference product unless the blend and weighted attributes are disclosed."
    source_ids: []
  - rule_id: validation_rule_6
    applies_to: "foreground_dataset_conformance"
    rule: "Purification, pulping, chemical conversion, paper, absorbent cotton, and nonwoven production must be explicitly excluded or separately modelled."
    source_ids: []
