system_boundary:
  rules:
    - rule_id: boundary_stand_to_roadside
      applies_to: "All nodes"
      rule: "Include attributable stand operations, felling, on-site extraction, bucking, sorting, scaling, and landing handling. Separate biological production, harvest, and grading because their states and handovers differ. Exclude off-site haulage and subsequent treatment/manufacture."
      source_ids:
        - fao-wood-harvesting
        - fao-jfsq-definitions
    - rule_id: boundary_output_classes
      applies_to: "Roadside outputs"
      rule: "Enumerate target logs, other saleable assortments, recovered material, and unrecovered slash separately. Slash left in forest is neither an exported product nor a waste exchange."
      source_ids:
        - unsd-cpc-03119
        - fao-jfsq-definitions
    - rule_id: boundary_period_asset
      applies_to: "Stand and shared roads/landing"
      rule: "Link stand establishment/maintenance, thinning, final harvest, road/landing service, disturbance, and replacement by period. Charge shared service once across its consuming nodes/periods."
      source_ids:
        - fao-wood-harvesting
    - rule_id: boundary_direct_release_coverage
      applies_to: "managed_stand; harvest_extraction; roadside_assortment"
      rule: "Reconcile on-site combustion, actual applications and fugitive releases/leaks at every activated node through unique activity-substance-receiving-medium records in cp_direct_release_managed_stand; cp_direct_release_harvest_extraction; cp_direct_release_roadside_assortment. Upstream production of purchased fuel or chemicals does not replace emissions from their use on site; verify coverage and avoid double counting the same activity inside a supplier service. Evidence must support non-activity; missing data are not zero. This obligation does not expand the existing product gate or downstream-use boundary and does not presume combustion, fertilization, chemicals or equipment occur."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Identified coniferous stand/block with species, planted/natural source, tenure, management history, and harvest authorization; standing wood is not assumed burden-free."
  starting_condition_role: "Managed biological source entering the foreground stand-to-roadside chain."
  product_classification_scope: "Target other-use logs only; separately record saw/veneer, pulp/panel, fuelwood, and any other assortments."
  recursive_input_rule: "An input of another roundwood category keeps its upstream dataset once; do not recursively add the same stand or harvest burden."
  upstream_dataset_requirement: "Use matched datasets for actual purchased inputs and services; disclose proxies."
  disclosure: "Stand/lot, region, phase, silviculture, harvest equipment, extraction distance, gate, all outputs, bark/moisture, scaling, mass conversion, and asset attribution."
