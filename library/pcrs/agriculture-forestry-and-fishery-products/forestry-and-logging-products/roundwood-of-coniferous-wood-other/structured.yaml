      flow_role: "Per-node actual direct releases and coverage decisions"
      record_type: "Activity, measurement and method-evidence ledger"
      raw_fields: "site; process_id; lot/cohort; period; event_id; activation/evidence; carrier/formulation; activity_amount/unit; substance/species/particle_basis; receiving_medium; fossil/biogenic_origin; method/source/version/applicability; factor/value/unit; conversion; abatement_scope; measured_release; supplier_service_coverage; existing_row_id; shared_event_owner; allocation_state; reference_total"
      collection_method: "Match this node's input/application/equipment logs to release events. Determine each substance/medium amount by measurement or an applicable evidenced method and factor; retain factor provenance, unit conversions, abatement scope and uncertainty, without subtracting control twice when already included. Reconcile existing emission cards and contractor services once; create concrete output elementary exchanges for uncovered events and retain UUID verification evidence. Missing method, amount or identity prevents claiming a complete data package."
      unit: "kg per substance/medium; retain native activity units"
      frequency: "Each event and lot/reporting-period reconciliation"
      temporal_coverage: "Periods matched to node activity and final reference lots"
      site_scope: "Actual activity sites; one owner for each shared event"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/test evidence; activity records; original method/factor source; service scope; deduplication and coverage matrix"
    - protocol_id: cp_direct_release_roadside_assortment
      process_id: "roadside_assortment"
      flow_role: "Per-node actual direct releases and coverage decisions"
      record_type: "Activity, measurement and method-evidence ledger"
      raw_fields: "site; process_id; lot/cohort; period; event_id; activation/evidence; carrier/formulation; activity_amount/unit; substance/species/particle_basis; receiving_medium; fossil/biogenic_origin; method/source/version/applicability; factor/value/unit; conversion; abatement_scope; measured_release; supplier_service_coverage; existing_row_id; shared_event_owner; allocation_state; reference_total"
      collection_method: "Match this node's input/application/equipment logs to release events. Determine each substance/medium amount by measurement or an applicable evidenced method and factor; retain factor provenance, unit conversions, abatement scope and uncertainty, without subtracting control twice when already included. Reconcile existing emission cards and contractor services once; create concrete output elementary exchanges for uncovered events and retain UUID verification evidence. Missing method, amount or identity prevents claiming a complete data package."
      unit: "kg per substance/medium; retain native activity units"
      frequency: "Each event and lot/reporting-period reconciliation"
      temporal_coverage: "Periods matched to node activity and final reference lots"
      site_scope: "Actual activity sites; one owner for each shared event"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/test evidence; activity records; original method/factor source; service scope; deduplication and coverage matrix"
  calculation_rules:
    - id: calc_mass_volume
      applies_to: "Each assortment lot"
      rule: "kg_per_m3 = measured_as_received_kg / measured_underbark_m3 for the matching species, moisture, and lot; no universal density."
      inputs:
        - "weighed kg"
        - "scaled m³"
        - "bark and moisture records"
      output: "conversion factor and uncertainty"
      source_ids:
        - fao-jfsq-definitions
    - id: calc_output_balance
      applies_to: "Landing output set"
      rule: "mixed_kg = target_kg + non_target_kg + removed_waste_kg + measured_stock_or_loss_change_kg; reconcile m³ separately on under-bark basis."
      inputs:
        - harvest
        - sort
        - "stock tickets"
      output: "balance and exception log"
      source_ids:
        - fao-jfsq-definitions
    - id: calc_normalize
      applies_to: "Final-reference normalization of physical ledgers and environmental burdens"
      rule: "R is positive final accepted as-received other-use log mass (kg) for the same lot, boundary and period; co-products and internal transfers are excluded from that denominator. Report unallocated material, transfer and co-product totals Q as q_phys = Q/R. For environmental burdens B only, complete evidenced direct, period, output and asset attribution once, then report b_ref = B_attributed/R. Do not apply burden shares to physical ledgers or divide already final-reference amounts again."
      inputs:
        - "unallocated physical ledger Q"
        - "environmental burdens B"
        - "evidenced attribution"
        - "matched reference quantity R"
      output: "amount per 1 kg target logs"
      source_ids:
        - fao-wood-harvesting
    - id: calculate_direct_release_ledger
      applies_to: "managed_stand; harvest_extraction; roadside_assortment"
      rule: "For each unique event, substance and medium, obtain raw release E from measurement or the cited applicable method using activity A and a compatible factor EF; use E = A * EF only for a genuinely simple-factor method, after checking units and abatement scope. Do not add different substances/media; retain an unallocated raw-release ledger. Divide attributed burden totals once by matched positive final reference quantity R; do not renormalize final-reference intensities or allocate a shared event twice. Unexplained material residuals are not automatically emissions and missing factors are not zero."
      inputs:
        - cp_direct_release_managed_stand
        - cp_direct_release_harvest_extraction
        - cp_direct_release_roadside_assortment
        - "existing emission cards"
        - "supplier coverage"
        - "reference quantity"
      output: "Node/substance/medium-specific raw and attributed amounts and unresolved gaps"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "Output lots"
      requirement: "Species, intended use, grade, state, and destination must match the source class and selected reference flow."
      evidence: "sort ticket and buyer specification"
    - id: dq_mass_volume
      applies_to: "All log outputs"
      requirement: "Retain calibrated weights, log scaling, bark deduction, moisture sampling, lot-specific kg/m³ bridge, and uncertainty. Volume-only data do not directly instantiate a Mass UUID."
      evidence: "weighbridge, scale, sample sheet"
    - id: dq_completeness
      applies_to: "Full chain"
      requirement: "Reconcile stand, harvest, landing, sorted outputs, fuel, stock, slash, and shared infrastructure with no duplicate burden."
      evidence: "signed balance and attribution ledger"
    - id: dq_temporal
      applies_to: "Multi-period stand"
      requirement: "Declare phase, thinning/final harvest, reporting periods, and asset service, disturbance, or replacement."
      evidence: "stand and event ledger"
validation_rules:
  - rule_id: validate_reference
    applies_to: "Reference product"
    rule: "Require exactly 1 kg normalized as-received other-use coniferous logs at forest roadside, with the verified Mass flow/property/unit group and separate measured under-bark m³. Reject volume-property assertions for the Mass UUID."
    source_ids:
      - unsd-cpc-03119
      - fao-jfsq-definitions
  - rule_id: validate_category
    applies_to: "Roadside output set"
    rule: "Check species and intended use; reject saw/veneer, pulp/panel, fuelwood, non-coniferous, or treated/fabricated goods as reference product. Account for every other output once."
    source_ids:
      - unsd-cpc-03119
      - fao-jfsq-definitions
  - rule_id: validate_balance
    applies_to: "Harvest and sorting"
    rule: "Reconcile mass and under-bark volume; separately disclose retained biomass, removed waste, unsold stock, and co-products."
    source_ids:
      - fao-jfsq-definitions
  - rule_id: validate_period_asset
    applies_to: "Shared activities"
    rule: "Trace each stand phase and shared road/landing service period into one ledger; reject missing disturbance/replacement treatment or duplicate charges."
    source_ids:
      - fao-wood-harvesting
  - rule_id: validate_identity_coverage
    applies_to: "Conditional exchanges"
    rule: "Final exchanges need actual material/state, direction, type, property/unit, and verified UUID. Semantic umbrella cards cannot be published as fabricated fixed identities."
    source_ids:
      - fao-wood-harvesting
  - rule_id: validate_card_activation_units
    applies_to: "All refined cards"
    rule: "Verify activation and actual material/formulation/task/supply specification; missing records are not zero. Each amount and Range uses one compatible property/unit; retain density and wood mass/volume bridges. Check contractor-service components against fuel, equipment and emissions to avoid double burdens."
    source_ids:
      - fao-wood-harvesting
  - rule_id: validate_direct_release_coverage
    applies_to: "managed_stand; harvest_extraction; roadside_assortment"
    rule: "For every activated node, reconcile its activity list against cp_direct_release_managed_stand; cp_direct_release_harvest_extraction; cp_direct_release_roadside_assortment: each relevant event must have quantified concrete elementary exchanges, evidenced upstream-service coverage, or evidenced absence of the activity. Missing/unknown is not zero and blocks data-package completeness. Check each actual substance/medium amount, method/factor units, concrete UUID and existing-card/service coverage for omissions or duplication; empty groups, purchased-electricity upstream emissions or another node's single CO2 card do not replace this node's on-site reconciliation. Shared-asset services must not create duplicate physical release events."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground stand-to-roadside dataset reusable as secondary/background data only for declared species, use, geography, and harvest route"
  downstream_use: "Process and lifecyclemodel production of compatible other-use coniferous logs and downstream systems"
  allowed_use: "Mass-normalized roadside inventory with measured under-bark volume and complete co-product attribution"
  excluded_use: "Automatic substitution for sawlogs, veneer logs, pulpwood, fuelwood, non-coniferous wood, mill-gate products, or treated goods"
  required_metadata: "PCR id/version; stand/lot; species; region; management/harvest system; intended use; grade; bark/moisture; gate; period; kg and under-bark m³; conversion; co-products; allocation"
  required_quality_disclosure: "Primary record coverage; mass/volume uncertainty; provisional ranges; unresolved conditional identities; period and shared-asset attribution; upstream proxies"
  update_trigger: "Changed use, species, harvest technology, geography, road service, measurement bridge, or reviewed range/identity evidence"
