allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The allocation rules below are methodological choices of this PCR, not LCA allocation requirements prescribed by FAO statistical definitions. The FAO source supports product distinctions and the under-bark volume convention only. Justify the selected physical allocation driver against the actual joint production system and retain the required sensitivity comparison."
    source_ids: []
  - rule_id: allocation_direct_first
    applies_to: "All nodes"
    rule: "Assign directly recorded activities to the actual stand, lot, and assortment first. Enumerate all saleable output classes and roadside handovers; distinguish co-product, retained slash, and removed waste."
    source_ids:
      - fao-wood-harvesting
      - fao-jfsq-definitions
  - rule_id: allocation_shared_volume
    applies_to: "Joint stand and harvest burdens"
    rule: "Allocate residual joint burdens among all saleable log assortments by measured under-bark solid m³ at the same gate and period. Record denominator, bark deduction, zero-output lots, and sensitivity to another defensible physical basis. Do not allocate unrecovered slash as a saleable output."
    source_ids:
      - fao-jfsq-definitions
  - rule_id: allocation_period
    applies_to: "Establishment, maintenance, thinning, final harvest"
    rule: "Link every input, output, disturbance, and replacement event to stand phase and reporting period. Assign stand burdens over the declared production horizon by attributable harvested under-bark volume, counting thinning outputs once. No universal rotation duration is imposed."
    source_ids:
      - fao-wood-harvesting
  - rule_id: allocation_shared_asset
    applies_to: "Shared roads, landing, machinery"
    rule: "Identify every consuming node and service period. Charge construction, maintenance, and operation once by logged use where possible; otherwise use documented harvested-volume share over the service period."
    source_ids:
      - fao-wood-harvesting
  - rule_id: physical_ledger_before_allocation
    applies_to: "Physical ledgers and attributed burdens"
    rule: "Retain unallocated physical values for original material balances, handoffs and co-products: q_B = Q_B/R. Apply this PCR's allocation method separately to shared burdens: b_ref = B_shared * a_ref/R; assign direct burdens directly and apply each period/output share once. R is the selected final reference output, excluding internal transfers. Never apply burden share a_ref to original co-product or transfer quantities; distinguish any allocated single-product process projection from the unallocated whole-package material ledger."
    source_ids: []
