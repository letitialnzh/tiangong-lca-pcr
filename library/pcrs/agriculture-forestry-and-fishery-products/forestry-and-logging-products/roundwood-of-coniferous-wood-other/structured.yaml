    required_unit: "m³ under bark"
    rule: "Scale logs by declared method; document species/lot bark deduction when only over-bark dimensions exist."
  - id: mass_volume_bridge
    applies_to: "Reference and co-product lots"
    required_property_ref:
      name: "Mass and solid volume"
