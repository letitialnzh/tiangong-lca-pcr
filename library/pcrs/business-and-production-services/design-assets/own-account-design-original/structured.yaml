allocation_rules:
  - rule_id: allocation_project
    applies_to: "iterations and multiple originals"
    rule: "Assign directly traceable tasks and supplies to their original first. Retain rejected alternatives supporting the completed design. Split independently delivered originals by measured causal work/resource records; reconcile shares to the whole pool. Count division is allowed only for demonstrated equivalent beneficiaries, not assumed equal designs or sale prices. An abandoned project without an output must be separately disclosed rather than silently removed."
    source_ids:
      - un-cpc3-design-originals
      - design-council-double-diamond
  - rule_id: allocation_shared
    applies_to: "electricity and infrastructure"
    rule: "Meter each job where possible. For shared supplies use a documented reservation/operation/idle ledger and measured load attribution; reconcile to facility meters. Do not turn CPU hours, stored GB or transferred GB into electricity without a measured device/provider relationship. Device inventory shares require observed reserved time/resources and evidenced device service life, with sensitivity and residual disclosure."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: allocation_inherited
    applies_to: "reused design and research"
    rule: "Identify prior originals and purchased evidence; keep a source-to-beneficiary burden ledger. Separate additional version work from inherited work. A copy is not another original and no unsubstantiated lifetime copy count is a denominator. Retained prototype stock, sold physical prototypes and waste transfers require separate quantities and downstream boundaries; no automatic avoided-product credit."
    source_ids:
      - un-cpc3-design-originals
dataset_production:
  collection_protocols:
    - protocol_id: cp_original
      process_id: "mastering"
      flow_role: "reference output"
      record_type: "acceptance_record"
      raw_fields: "original ID; project; version; content list; acceptance; rights; dates; own-account status"
      collection_method: "Inspect versioned master, design brief, verification results and signed completeness record; count the complete package once."
      unit: "item"
      frequency: "At completion and each new version"
      temporal_coverage: "Full actual creation cycle"
      site_scope: "All project sites and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Content integrity; acceptance and rights evidence"
    - protocol_id: cp_energy
      process_id: "brief_development_mockup_proof_mastering"
      flow_role: "electricity"
      record_type: "meter_record"
      raw_fields: "meter ID; kWh; timestamps; site; voltage; stage/job; idle; share; uncertainty"
      collection_method: "Read calibrated plug/submeters and facility bills; reconcile job records and shared attributable load, including actual supporting cooling and transfer through cutoff. Separate provider-owned power."
      unit: "kWh"
      frequency: "Each job and metering interval"
      temporal_coverage: "Complete creation cycle"
      site_scope: "Actual owned supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration; meter reconciliation; allocation ledger"
    - protocol_id: cp_material
      process_id: "development_mockup_proof"
      flow_role: "material and separate waste rows"
      record_type: "weighing_record"
      raw_fields: "row; batch; grade; composition; mass; opening/closing stock; receipts; waste destination"
      collection_method: "Weigh each material and separate waste stream on calibrated scales; reconcile consumption and stock with sketches, proofs, retained models, failed trials and receiver tickets."
      unit: "kg"
      frequency: "Each batch and waste dispatch"
      temporal_coverage: "Full creation including failures"
      site_scope: "Declared actual route"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Scale calibration; supplier grade; stock balance; receiver evidence"
    - protocol_id: cp_service
      process_id: "verification"
      flow_role: "purchased dimensional report"
      record_type: "delivery_record"
      raw_fields: "report ID; mockup; method; tolerance; test date; acceptance; provider inventory; included resources"
      collection_method: "Inspect accepted dimensional report and provider inventory; allocate its actual scoped work to the declared original and exclude already included utilities."
      unit: "item"
      frequency: "Each delivery"
      temporal_coverage: "Actual verification period"
      site_scope: "Declared provider and object"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Acceptance; object identity; provider completeness"
    - protocol_id: cp_device
      process_id: "support"
      flow_role: "configured system unit"
      record_type: "asset_record"
      raw_fields: "asset/configuration ID; measured net mass; reserved time; capacity share; device life evidence; upstream scope"
      collection_method: "Weigh the configured unpackaged unit or obtain traceable measured mass for that configuration; reconcile device reservation and service-life records with project logs and upstream hardware inventory."
      unit: "kg"
      frequency: "Each asset and project interval"
      temporal_coverage: "Actual project and equipment service periods"
      site_scope: "Used configured equipment only"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Mass traceability; reservation records; life sensitivity; separate peripherals"
  calculation_rules:
    - id: calculate_energy
      applies_to: "all electricity rows"
      rule: "Multiply attributable measured kWh by 3.6 to obtain MJ at the identical interface and original basis."
      inputs:
        - cp_energy
        - kWh
      output: "MJ"
      source_ids:
        - gsf-sci-1-1-0
    - id: calculate_original_inventory
      applies_to: "all inventory rows"
      rule: "Sum the nonduplicated exchange amounts already attributed to the one declared original. Retain original numerator units; the accepted reference output is exactly 1 item. Establish shared-resource shares before aggregation and reconcile all stage pools."
      inputs:
        - cp_original
        - "stage records"
        - "attribution ledger"
      output: "per declared reference flow"
      source_ids:
        - un-cpc3-design-originals
        - design-council-double-diamond
        - gsf-sci-1-1-0
  data_quality_requirements:
    - id: quality_original
      applies_to: "reference output"
      requirement: "Bind the actual design objective, original/version, completeness, validation limitations and reuse rights. Related designs are not comparable solely by item count."
      evidence: "cp_original; un-cpc3-design-originals"
    - id: quality_route
      applies_to: "all processes"
      requirement: "Map every actual route to atomic supplies, stocks, waste and supported direct releases; distinguish absent, measured zero and unknown. Do not omit physical design work merely because the final asset is digital."
      evidence: "cp_material; project route register; design-council-double-diamond"
    - id: quality_time
      applies_to: "project resources"
      requirement: "Use complete actual dates, failed iterations and site/provider changes. Quantify missing periods and representativeness; no default energy, yield, recipe or life."
      evidence: "cp_energy; cp_original"
    - id: quality_identity
      applies_to: "upstream and selected flows"
      requirement: "Match state, substance, composition, supply route, geography, reference property and unit group; record uncertainty, device allocation sensitivity and unresolved identities."
      evidence: "cp_device; supplier evidence; public identities"
validation_rules:
  - rule_id: validate_original
    applies_to: "reference_product_original"
    rule: "Verify own-account design-concept asset, one complete version and all qualifiers; reject commissioned service, research result, software product or each license/copy counted as the original."
    source_ids:
      - un-cpc3-design-originals
  - rule_id: validate_units
    applies_to: "all inventory rows"
    rule: "Require linked protocols, identical per declared reference flow basis in both languages and traceable numerator units. Never infer design mass or traffic-to-energy conversion."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: validate_completeness
    applies_to: "actual design routes"
    rule: "Incomplete route registers, unknown provider layers, unresolved physical supplies or unsupported direct releases block dataset completeness. A conditionally absent row needs occurrence evidence; mandatory internal design verification cannot be replaced by omitting the optional purchased report."
    source_ids:
      - design-council-double-diamond
  - rule_id: validate_attribution
    applies_to: "shared and inherited resources"
    rule: "Reconcile project stage pools, supplier/owned interfaces, asset allocation and beneficiary ledgers. Reject duplicated original burden, device inventory or electricity and unproven price allocation."
    source_ids:
      - un-cpc3-design-originals
      - gsf-sci-1-1-0
  - rule_id: validate_identity
    applies_to: "selected flows"
    rule: "Recheck actual public identity, reference property and unit group; for elementary exchanges match origin and environmental subcompartment. Blank identities remain explicit candidate gaps and prevent a complete usable dataset claim until resolved."
    source_ids:
      - un-cpc3-design-originals
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared original creation inventory with transparent upstream links and reuse ledger; comparison only for equivalent objectives, specification, rights and boundaries"
  excluded_use: "Standalone downloads, software operation, broadcast, research or service inventories; complete cradle-to-gate without all upstream layers; legal, safety or environmental superiority approval"
  required_metadata: "Original/project ID; version; design type and objective; own-account scope; actual route; rights; acceptance; geography; dates; units; allocation; cutoff; upstream identities"
  required_quality_disclosure: "Unknown suppliers/identities; missing periods; omitted routes; instrument uncertainty; shared allocation and inherited burden sensitivity; representativeness limits"
  update_trigger: "New original version or changed route, specification, provider, device allocation, supply region or boundary; preserve prior version ledger"
