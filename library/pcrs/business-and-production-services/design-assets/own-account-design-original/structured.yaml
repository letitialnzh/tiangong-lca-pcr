system_boundary:
  rules:
    - rule_id: creation
      applies_to: "all processes"
      rule: "Include attributable brief formation, concept development, physical/digital iteration, verification, documentation, version archiving and initial handoff through the defined cutoff. The Double Diamond informs decomposition; it is not a compulsory fixed sequence or energy recipe."
      source_ids:
        - un-cpc3-design-originals
        - design-council-double-diamond
    - rule_id: actual_routes
      applies_to: "development and verification"
      rule: "Build a route-to-exchange register from actual project records. The PLA and UV proof rows are conditional examples, not the category boundary. Machining, other polymers, drawing media, travel, heating/cooling, water and cleaning must be expanded as individual exchanges when present. Salaries and sale rights are not physical exchanges."
      source_ids:
        - design-council-double-diamond
    - rule_id: later_use
      applies_to: "asset and copies"
      rule: "Separate later manufacturing of designed goods, replication/download, operational use, long-term hosting, network delivery and license administration. Declare initial archive/transfer scope; retain creation burden once in the original ledger, never its entire inventory for every copy."
      source_ids:
        - un-cpc3-design-originals
    - rule_id: providers
      applies_to: "owned and external resources"
      rule: "Owned utilities and hardware are collected separately. A complete purchased rendering, storage or validation service substitutes for its embedded utility/device rows; record actual scoped delivery and provider inventory. Missing provider layers block completeness."
      source_ids:
        - gsf-sci-1-1-0
    - rule_id: elementary
      applies_to: "direct releases"
      rule: "No direct elementary release is assumed for electronic concept creation. Screen actual printing, mockup, solvent, refrigerant and fuel operations; add each evidenced substance with origin, environmental compartment and state. Utility and hardware upstream emissions stay in upstream datasets. Technical water and waste are not elementary-resource flows."
      source_ids:
        - design-council-double-diamond
