review_metadata:
  scientific_review: pending
  semantic_boundary: Assemblies comprising a station's complete daily radio programme line-up handed to another distributor; not individual original masters, listener downloads or transmission services.
  reuse_assessment: Existing material ICT equipment PCRs are hardware methodologies; adjacent original and download categories have different delivered objects. No equivalent material daily radio line-up methodology found in the inspected library and integration candidate inventory.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: reference_product_daily_lineup
      reason: Bounded exact-name, short-name and classification-context queries returned no confirmed public programme line-up identity with this delivery boundary and Count support. Reference product remains explicit, not a radio receiver or radioactive elementary flow.
    - row_id: source_programme_master
      reason: A reusable approved audio programme master is not radio hardware or a software baseline; no compatible public identity confirmed.
    - row_id: hosted_playout_day
      reason: Examined IT infrastructure service has a publisher build/package route and Mass primary property; no supported conversion to this contracted daily playout package.
    - row_id: contribution_link_day
      reason: Examined public network services reference CTUe or firmware testing routes; no verified conversion to a daily contribution-link delivery package.
  unresolved_evidence:
    - Foreground operators must supply actual daily schedule, acceptance, metering and shared-resource allocation evidence; no default energy, traffic, storage, reuse-count or equipment lifetime coefficient is supplied.
    - Full life-cycle equipment and upstream original production datasets require separate compatible evidence; foreground boundary alone is not cradle-to-gate completeness.
