        - unsd-cpc3-2025
        - ebu-radio-workflow-2023
    - rule_id: sb_actual_resources
      applies_to: "facilities and supporting activities"
      rule: "Include measured or explainably attributable workstation, server, playout, storage and cooling electricity and production-support lighting. Equipment/facility manufacture, commuting and long-term archives are excluded by default and disclosed. Actual attributable on-site combustion, refrigerant leakage, consumables or equipment replacement require separately collected atomic extensions; no emissions are presumed without evidence."
