allocation_rules:
  - rule_id: alloc_metering
    applies_to: "shared equipment"
    rule: "Prefer separate meters and tasks; attribute shared-meter energy using measured task power and run time, not sale price or audience. cp_energy records active, idle, retained storage, cooling and other users; allocation must reconcile the measured total. Allocate idle energy using recorded reserved-use time and report sensitivity."
    source_ids: []
  - rule_id: alloc_original_reuse
    applies_to: "source_programme_master"
    rule: "Keep original-creation inventory separately. cp_assets defines the evidenced, non-overlapping reuse set and daily attribution weights summing to one; equivalent complete uses may share equally across evidenced uses without assumed count or lifetime. Excerpt attribution requires evidence connecting duration to creation effort; unproven attribution remains review. Rights transactions do not eliminate content burdens, nor justify adding full creation cost on every play."
    source_ids: []
  - rule_id: alloc_variants
    applies_to: "line-up variants and retries"
    rule: "Separate incremental tasks for language, advertising and regional variants with independently delivered outputs. Allocate shared assembly by documented actual task relationships; master, schedule and acceptance receipt are not three co-products. Attribute failed retries to the delivered line-up."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_delivery
      process_id: "delivery_handoff"
      flow_role: "reference product"
      record_type: "acceptance record"
      raw_fields: "station; schedule version; date; time zone; start/end; actual airtime; asset completeness; recipient; acceptance"
      collection_method: "Reconcile each daily schedule with asset list, checksums and handoff logs; count only complete accepted versions"
      unit: "item"
      frequency: "each complete handoff"
      temporal_coverage: "complete assembly and handoff period"
      site_scope: "compiler and handoff interface"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "recipient acceptance and completeness records"
    - protocol_id: cp_energy
      process_id: "programme_ingest_lineup_assembly_live_contribution_delivery_handoff"
      flow_role: "electricity"
      record_type: "meter and job record"
      raw_fields: "meter start/end kWh; equipment; task; active/idle time; geography; voltage; cooling; retention; shared weights"
      collection_method: "Use verified meters and measured equipment power with task logs; remove overlaps and include rework and attributable supporting energy"
      unit: "kWh"
      frequency: "each operation or time interval"
      temporal_coverage: "assembly preparation, handoff and required retention period"
      site_scope: "declared sites and internally operated equipment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, complete meter balance and shared-task ledger"
    - protocol_id: cp_assets
      process_id: "programme_ingest"
      flow_role: "source programme"
      record_type: "asset and upstream inventory record"
      raw_fields: "each master ID/version; original-creation inventory; reuse set; daily attribution share; duration; rights"
      collection_method: "Reconcile actual programme asset list with separate original inventory; retain evidence for complete and excerpt use"
      unit: "item"
      frequency: "each master and line-up"
      temporal_coverage: "creation and reuse period relevant to the line-up"
      site_scope: "actual source creator and compiler"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "original inventory and non-duplicate attribution audit"
    - protocol_id: cp_services
      process_id: "delivery_handoff"
      flow_role: "external service"
      record_type: "contract delivery and supplier primary data"
      raw_fields: "specific package ID; service type; schedule; duration; capacity; traffic; supplier energy; hardware boundary; shared attribution; receipt"
      collection_method: "Separately verify actual hosting and link packages against receipts and supplier inventories; traffic checks capacity without default energy conversion"
      unit: "item"
      frequency: "each contractual package"
      temporal_coverage: "complete contracted service period"
      site_scope: "declared actual suppliers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "service boundary, supplier primary records and non-duplicate electricity ledger"
  calculation_rules:
    - id: energy_conversion
      applies_to: "ingest_electricity, schedule_electricity, live_electricity, handoff_electricity"
      rule: "Per declared reference flow, multiply measured attributable kWh by 3.6 to obtain MJ; four operation amounts must not overlap and their sum reconciles attributable meter totals."
      inputs:
        - cp_energy
      output: "MJ per declared reference flow"
      source_ids: []
    - id: asset_attribution
      applies_to: "source_programme_master"
      rule: "Per declared reference flow, record each concrete master’s evidenced attribution share and link its separate creation inventory; weights over the complete reuse set must sum to one, retaining excerpt-relationship evidence."
      inputs:
        - cp_assets
      output: "master shares per declared reference flow"
      source_ids: []
    - id: service_attribution
      applies_to: "hosted_playout_day, contribution_link_day"
      rule: "Per declared reference flow, use actual package counts and evidenced shared fractions; link matching supplier inventories without a default GB-to-energy factor."
      inputs:
        - cp_services
      output: "contract package shares per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "reference_product_daily_lineup"
      requirement: "Complete identifiable daily delivery with actual duration, recorded/live mix, version and reuse rights; an episode cannot stand for the day."
      evidence: "cp_delivery; unsd-cpc3-2025"
    - id: dq_technical
      applies_to: "audio and handoff"
      requirement: "Record recipient acceptance of format, integrity and loudness policy. Verify declared EBU strategy against its declared edition only when adopted, not as a universal mandate."
      evidence: "cp_delivery; ebu-radio-workflow-2023"
    - id: dq_representative
      applies_to: "all inventory rows"
      requirement: "One day represents that case; a channel-representative value requires declared-period coverage of weekdays, weekends, repeats and live differences with daily distributions. No default energy is supplied."
      evidence: "cp_delivery; cp_energy"
    - id: dq_missing
      applies_to: "all inventory rows"
      requirement: "Missing meters, absent supplier inventories, unproven reuse shares and unresolved identities remain explicit gaps, not zero."
      evidence: "cp_assets; cp_services; cp_energy"
validation_rules:
  - rule_id: vr_reference
    applies_to: "reference product"
    rule: "Confirm one complete daily output, count unit, actual times, acceptance and every qualifier; other delivery objects are inapplicable."
    source_ids:
      - unsd-cpc3-2025
  - rule_id: vr_energy
    applies_to: "electricity rows"
    rule: "Check meter totals and attribution, 3.6 conversion, voltage and geography; do not recount electricity already included in supplier services."
    source_ids: []
  - rule_id: vr_originals
    applies_to: "source assets and services"
    rule: "Check original inventories and reuse weights, interface boundaries, actual contract-package units and primary activity records; counting cannot replace supplier physical inventory. Unproven shares require review."
    source_ids: []
  - rule_id: vr_completeness
    applies_to: "whole dataset"
    rule: "Check every required and actual conditional activity. Expose gaps and default exclusions; absent upstream or equipment manufacture prevents a complete lifecycle claim. Add elementary flows only for evidenced direct occurrences with verified identity and compartment, not inferred site emissions from grid generation."
    source_ids:
      - ebu-radio-workflow-2023
published_dataset_profile:
  dataset_role: "foreground production dataset for a complete daily channel line-up"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "channel-delivery modelling with matching boundary and technical configuration; linking to separate distribution/playback modules"
  excluded_use: "proxy for one original work, download, listener-hour, transmission coverage, software or hardware manufacture; complete lifecycle claims without linked evidence"
  required_metadata: "all reference qualifiers, process coverage, geography, voltage, measured supply, source and service datasets, reuse sets, attribution methods, conditional activities and handoff acceptance"
  required_quality_disclosure: "meter uncertainty, sampling representativeness, missing supplier evidence, unresolved identities, equipment boundary, original-reuse and idle-allocation sensitivity"
  update_trigger: "changes in schedule/version, recorded/live mix, supplier, system/electricity conditions, retention, original reuse set or handoff specification"
