system_boundary:
  rules:
    - rule_id: sb_delivery
      applies_to: "daily assembly"
      rule: "Include receipt, asset checking, scheduling, continuity, required storage, actual live mixing, acceptance and handoff to the distributor, including failed handoff retries and actual rework energy."
