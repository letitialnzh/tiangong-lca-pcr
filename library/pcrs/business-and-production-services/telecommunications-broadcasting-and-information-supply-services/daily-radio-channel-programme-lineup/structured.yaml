        - unsd-cpc3-2025
        - ebu-radio-workflow-2023
    - rule_id: sb_separate_distribution
      applies_to: "downstream"
      rule: "Model FM/DAB transmission, listener-network distribution, playback and terminal manufacture beyond the handoff separately; split combined operations using recorded interfaces."
