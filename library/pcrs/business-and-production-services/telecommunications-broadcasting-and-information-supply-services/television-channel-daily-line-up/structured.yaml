allocation_rules:
  - rule_id: allocation_resource
    applies_to: "foreground_burden_allocation"
    rule: "Prefer separate metering. Attribute shared workstations, servers, storage, monitoring and facility electricity using measured job consumption or log-verified resource occupancy; retain total energy, all occupants, allocation denominator, idle/redundancy treatment and reconciliation. GB is not kWh; do not allocate by assumed price or audience."
    source_ids: []
  - rule_id: allocation_content
    applies_to: "foreground_burden_allocation"
    rule: "Rights are not physical production quantities. Under cp_content disclose separate original-production datasets, versions and shares attributable under the actual use/reuse plan; an unsupported reuse denominator remains an upstream gap and sensitivity, not a full original-production charge to every repeat delivery."
    source_ids:
      - cpc-tv-lineup-2025
  - rule_id: allocation_versions
    applies_to: "foreground_burden_allocation"
    rule: "Include main-version, rework and actual redundant-handoff resources. Multiple channels/languages/configurations use explainable actual resource attribution. Do not count incomplete line-ups as complete output."
    source_ids: []
  - rule_id: allocation_equipment
    applies_to: "foreground_burden_allocation"
    rule: "Under cp_equipment retain one same-asset manufacture boundary and persistent ledger across every project, period and beneficiary. The share uses actual attributable service activity divided by an evidenced whole installed-service or compatible cumulative-service denominator, with matching activity units; a justified forecast requires sensitivity and later reconciliation. Cumulative assigned manufacture shares must not exceed one. Within an observation period distribute only the manufacture fraction already justified for that period, never the complete asset production burden anew. Unknown denominator, prior shares or ledger coverage requires review and prohibits a final attributed manufacture quantity or complete equipment-coverage claim. These are foreground-accounting controls, not a prescribed numeric life or classification factor."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_content
      process_id: "assembly"
      flow_role: "programme_original"
      record_type: "asset ledger"
      raw_fields: "asset id; version; source; original-production dataset; actual reuse plan; attributed share; rights scope"
      collection_method: "Reconcile ingest manifests, contracts and actual reuse logs; price is not quantity"
      unit: "item"
      frequency: "per asset"
      temporal_coverage: "same channel day and actual reuse horizon"
      site_scope: "source and receiving facility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "complete asset/version manifest and denominator evidence"
    - protocol_id: cp_services
      process_id: "quality_handoff"
      flow_role: "qc_service; handoff_service"
      record_type: "supplier record"
      raw_fields: "supplier; delivery definition; session; endpoint; configuration; energy coverage; acceptance"
      collection_method: "Reconcile contracts, supplier datasets and delivery logs with included boundary"
      unit: "item"
      frequency: "per delivery"
      temporal_coverage: "declared channel day"
      site_scope: "external QC and contribution link"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "reports and double-count boundary reconciliation"
    - protocol_id: cp_energy
      process_id: "utility_support"
      flow_role: "electricity_lv; electricity_mv; electricity_other"
      record_type: "meter record"
      raw_fields: "meter; region; supply voltage; route; start/end readings; jobs and all occupants; idle; storage; cooling; redundancy; unit"
      collection_method: "Synchronize calibrated meters and job logs; reconcile shared attribution, site losses and supplier-included electricity"
      unit: "MJ"
      frequency: "per job and meter interval"
      temporal_coverage: "complete declared day, preparation and rework"
      site_scope: "actual workstations, servers and facility meters"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration, bills and energy allocation totals"
    - protocol_id: cp_equipment
      process_id: "utility_support"
      flow_role: "server_share"
      record_type: "equipment record"
      raw_fields: "persistent asset id; server configuration/count; upstream manufacture boundary; actual attributable service activity and units; evidenced whole installed-service or compatible cumulative-service denominator; all projects/periods/beneficiaries; prior shares; current dimensionless share; justified period manufacture fraction; cumulative assigned/remaining share; forecast sensitivity and later reconciliation"
      collection_method: "Reconcile the same-asset register and full usage/allocation ledger against the supported total service denominator; cap cumulative manufacture shares at one and period allocations at their previously justified fraction. Unknown denominator or ledger coverage requires review, not an assumed lifetime or reset"
      unit: "item; dimensionless share; actual service activity units"
      frequency: "per asset and study period, with cumulative ledger updates"
      temporal_coverage: "declared channel-day observation plus evidenced whole-service/cumulative-service horizon"
      site_scope: "capital equipment declared included; all beneficiary periods retained"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "asset identity/configuration, supported denominator, cumulative conservation and period-fraction evidence"
    - protocol_id: cp_acceptance
      process_id: "quality_handoff"
      flow_role: "reference_product_lineup"
      record_type: "acceptance record"
      raw_fields: "channel; date; timezone; window; revision; assets; duration; format; sound tracks; captions; rights; gaps; rework; receiver"
      collection_method: "Reconcile final schedule, files/live feed, acceptance logs and current delivery specification; record completeness"
      unit: "item"
      frequency: "per channel day"
      temporal_coverage: "complete declared day and associated preparation"
      site_scope: "assembly facility to other-distributor handoff"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "receipt, picture/sound QC and complete-window reconciliation"
  calculation_rules:
    - id: energy_conversion
      applies_to: "electricity_lv; electricity_mv; electricity_other"
      rule: "Express attributable metered energy per declared reference flow; convert kWh to MJ using 3.6, preserve raw records and infer no other conversion from property names."
      inputs:
        - cp_energy
      output: "MJ per declared reference flow"
      source_ids: []
    - id: count_complete
      applies_to: "reference_product_lineup"
      rule: "One accepted complete channel day counts as 1 item; duplicate files of the same delivery do not increase reference output."
      inputs:
        - cp_acceptance
      output: "1 item"
      source_ids:
        - cpc-tv-lineup-2025
  data_quality_requirements:
    - id: quality_configuration
      applies_to: "all inventory rows"
      requirement: "Cover all actual routes and required quality configuration; easy excerpts cannot represent the complete channel day. Current contract determines acceptance."
      evidence: "cp_acceptance; bbc-file-quality-2020"
    - id: quality_energy
      applies_to: "electricity_lv; electricity_mv; electricity_other"
      requirement: "Use actual contemporaneous geography and supply voltage; disclose shared attribution, unmeasured scope and supplier-included loads."
      evidence: "cp_energy"
    - id: quality_upstream
      applies_to: "programme_original; server_share"
      requirement: "Disclose original/equipment production coverage and reuse/service-horizon evidence; uncovered is not zero."
      evidence: "cp_content; cp_equipment"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Reference name matches output row; output is 1 item complete channel day; absent asset manifest, timezone/window, revision, rights or acceptance makes the definition incomplete."
    source_ids:
      - cpc-tv-lineup-2025
  - rule_id: validate_inventory
    applies_to: "foreground_dataset_conformance"
    rule: "Each row is one exchange; choose actual supply rows without duplication; upstream emissions cannot be direct elementary flows; missing identity or measurement cannot be treated as data."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile asset production, outsourced services, equipment and transfer dataset boundaries and attribution totals; foreground handoff results do not establish full lifecycle coverage or methodology approval."
    source_ids: []
  - rule_id: validate_equipment
    applies_to: "foreground_dataset_conformance"
    rule: "For server_share verify the same configuration, supported whole-service denominator and persistent ledger across all beneficiaries/periods; cumulative manufacture shares must not exceed one and within-period allocations must not exceed the justified period fraction. Reject manufacture reset at each day/project/period. Unknown denominator or prior-share coverage requires review and prevents final equipment attribution and complete equipment-coverage claims."
    source_ids: []
