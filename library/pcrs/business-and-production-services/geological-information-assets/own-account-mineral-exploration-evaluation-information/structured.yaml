allocation_rules:
  - rule_id: allocation_project
    applies_to: "all processes"
    rule: "Directly attribute identifiable site, hole, assay, computing and documentation records to the original. Subdivide unrelated mining production and other originals first. For shared work use measured causal utilisation with a documented beneficiary ledger; disclose residuals and test sensitivity when causation is uncertain. No allocation by mineral value, revenue, licence price or presumed discovery success."
    source_ids:
      - un-sna2008-exploration
  - rule_id: allocation_original
    applies_to: "reference_product"
    rule: "An original is created once. Reuse in a new evaluation carries an explicitly documented share of the prior asset inventory; copies and licences do not recreate it. Failed or negative investigations contributing to the defined information belong to that package; abandoned separate projects retain their own burdens, not a zero-success disposal to future mining."
    source_ids:
      - un-cpc3-exploration
      - un-sna2008-exploration
  - rule_id: allocation_equipment
    applies_to: "infrastructure"
    rule: "Use actual configuration and traceable whole-life utilisation for owned equipment manufacture/end-of-life. Meter shared facility/compute electricity or use a validated site workload allocation, including idle and overhead shares. Do not assume all equipment is new or infer electricity from job duration alone. Treat waste as waste unless a real market product and consistent allocation are demonstrated."
    source_ids:
      - un-sna2008-exploration
dataset_production:
  collection_protocols:
    - protocol_id: cp_original
      process_id: "completion"
      flow_role: "reference_product"
      record_type: "acceptance record"
      raw_fields: "project ID; version; ownership; coordinates/CRS; commodities; methods; evidence inventory; acceptance; start/end dates; restrictions"
      collection_method: "Reconcile signed completion against the content manifest, geospatial extent, evidence provenance and limitations; one accepted original version"
      unit: "item"
      frequency: "at completion"
      temporal_coverage: "full actual creation cycle including failures"
      site_scope: "all contributing sites and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable originals; calibration; reconciled coverage and allocation; uncertainty"
    - protocol_id: cp_energy
      process_id: "all_processes"
      flow_role: "electricity"
      record_type: "meter record"
      raw_fields: "meter ID; stage; timestamps; kWh; workload; shared allocation; overhead; region; voltage; provider scope"
      collection_method: "Use calibrated submeter intervals or validated facility/workload ledger; include stage overhead and initial storage/delivery to the declared cutoff; exclude complete-provider embedded electricity"
      unit: "kWh"
      frequency: "each stage and metered interval"
      temporal_coverage: "full actual creation cycle including failures"
      site_scope: "all contributing sites and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable originals; calibration; reconciled coverage and allocation; uncertainty"
    - protocol_id: cp_material
      process_id: "drilling"
      flow_role: "diesel; tap_water; drilling_fluid"
      record_type: "physical inventory"
      raw_fields: "exchange; grade; composition; stocks; deliveries; returns; consumption; temperature; density; equipment; holes"
      collection_method: "Reconcile calibrated weighing/volume meters and delivery-stock-return balance; keep kg and m3 separate with site-specific conversions and internal circulation excluded"
      unit: "kg; m3"
      frequency: "each delivery and drilling shift"
      temporal_coverage: "full actual creation cycle including failures"
      site_scope: "all contributing sites and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable originals; calibration; reconciled coverage and allocation; uncertainty"
    - protocol_id: cp_services
      process_id: "survey_drilling_analysis_infrastructure"
      flow_role: "purchased report"
      record_type: "supplier record"
      raw_fields: "provider; report ID; method; area/holes/samples; depth; detection limit; QA/QC; inventory boundary; embodied utilities; transport; closure"
      collection_method: "Link accepted specific delivery to primary provider inventory; distinguish fee, report count and measured work extent; verify own-account original ownership"
      unit: "item"
      frequency: "each accepted delivery"
      temporal_coverage: "full actual creation cycle including failures"
      site_scope: "all contributing sites and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable originals; calibration; reconciled coverage and allocation; uncertainty"
    - protocol_id: cp_waste
      process_id: "drilling"
      flow_role: "cuttings; spent_fluid"
      record_type: "waste transfer record"
      raw_fields: "origin; rock phase; fluid formulation; wet mass; solids; moisture; volume; contaminants; destination; manifest; retained samples"
      collection_method: "Weigh cuttings and meter separated fluid, reconcile recovery/retention/backfill; keep each waste and its treatment separate"
      unit: "kg; m3"
      frequency: "each removal"
      temporal_coverage: "full actual creation cycle including failures"
      site_scope: "all contributing sites and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable originals; calibration; reconciled coverage and allocation; uncertainty"
    - protocol_id: cp_emission
      process_id: "drilling"
      flow_role: "fossil_co2; nitrogen_dioxide"
      record_type: "measured emission record"
      raw_fields: "source; species; fossil fraction; duration; concentration; exhaust flow; calibration; fuel carbon; oxidation; retained carbon; compartment; time"
      collection_method: "Integrate species-specific measured mass over actual operation or use documented site carbon balance for fossil CO2. Retain method uncertainty and factor origin if used. NOx equivalent is not molecular NO2; inventory other measured species separately"
      unit: "kg"
      frequency: "each operating campaign"
      temporal_coverage: "full actual creation cycle including failures"
      site_scope: "all contributing sites and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable originals; calibration; reconciled coverage and allocation; uncertainty"
    - protocol_id: cp_water
      process_id: "drilling"
      flow_role: "river_abstraction"
      record_type: "water meter record"
      raw_fields: "river/basin; intake; date; volume; return volume; receiver; water quality; recirculation"
      collection_method: "Calibrated intake meter and separate return records; establish basin and time, do not replace resource withdrawal with wastewater"
      unit: "m3"
      frequency: "each shift"
      temporal_coverage: "full actual creation cycle including failures"
      site_scope: "all contributing sites and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable originals; calibration; reconciled coverage and allocation; uncertainty"
    - protocol_id: cp_equipment
      process_id: "infrastructure"
      flow_role: "workstation; drill_rig"
      record_type: "equipment utilisation record"
      raw_fields: "equipment ID; configuration; embodied dataset; project use; total measured lifetime use; repairs; retirement; provider exclusions"
      collection_method: "Link asset register to logged project and whole-life utilisation; documented share of actual equipment, not invented weight or lifetime; disclose incomplete lifetime records and sensitivity"
      unit: "item"
      frequency: "project and asset record update"
      temporal_coverage: "full actual creation cycle including failures"
      site_scope: "all contributing sites and providers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable originals; calibration; reconciled coverage and allocation; uncertainty"
  calculation_rules:
    - id: project_aggregation
      applies_to: "all inventory rows"
      rule: "Sum nonduplicated measured exchange amounts attributable to this one original and express per declared reference flow. Shared measured shares precede consolidation; reference output is 1 item. Preserve each numerator unit."
      inputs:
        - cp_original
        - cp_energy
        - cp_material
        - cp_services
        - cp_waste
        - cp_emission
        - cp_water
        - cp_equipment
      output: "per declared reference flow"
      source_ids:
        - un-cpc3-exploration
    - id: energy_conversion
      applies_to: "all electricity rows"
      rule: "Multiply recorded attributable kWh by 3.6 to express MJ at the same interface. No additional conversion of original count."
      inputs:
        - cp_energy
      output: "MJ"
      source_ids: []
  data_quality_requirements:
    - id: quality_scope
      applies_to: "reference_product"
      requirement: "Original identity and version, own-account nature, geospatial/depth/commodity scope and acceptance must be verifiable. Report unavailable data and uncertainty."
      evidence: "cp_original; un-cpc3-exploration"
    - id: quality_geology
      applies_to: "survey; drilling; analysis; evaluation"
      requirement: "For solid-mineral routes retain sample representativity/recovery, drill method, assay precision/bias, coordinates, compositing and interpretation confidence; JORC Table 1 is scoped reporting guidance, not LCA approval. Oil/gas needs its actual reservoir/seismic/well evaluation evidence and applicable regime; do not label it JORC certified."
      evidence: "cp_services; jorc2012-reporting"
    - id: quality_inventory
      applies_to: "all inventory rows"
      requirement: "No default fuel use, composition, assay recipe, lifetime, emission factor, water return or net output. Require actual records, missing layer disclosure and cut-off sensitivity. Historic evidence defines concepts only unless demonstrated representative of the current project."
      evidence: "all collection protocols"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference_product"
    rule: "Require exact one-item output link/name, declared version and qualifiers, provenance and ownership. Candidate unresolved identities are disclosed; they are not verified product providers or methodology approval."
    source_ids:
      - un-cpc3-exploration
  - rule_id: validate_scope
    applies_to: "all processes"
    rule: "Reconcile every actual survey, borehole, test, failed branch, assay, transport, computation, delivery and closure with process coverage and make/buy ledger. Unknown provider/route inventories make lifecycle completeness inconclusive."
    source_ids:
      - un-sna2008-exploration
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require consistent per declared reference flow, complete protocols, numerator units, energy/density conversions, shared shares and stock balances in both languages. Do not normalize information by kg or money."
    source_ids: []
  - rule_id: validate_release
    applies_to: "all elementary and waste rows"
    rule: "Require demonstrated occurrence and species/physical identity for every elementary or waste exchange. For direct elementary emissions, require medium/submedium and immediate/long-term distinction; require fossil/biogenic origin for carbon emissions. For river-water withdrawal, retain river/basin, intake date and volume, and separate return location, volume and quality. For technosphere waste transfers, retain composition/state, amount, destination and transfer records. Waste fluid is not environmental water. Never silently set unavailable emissions to zero or use total NOx as molecular NO2. Use cp_emission, cp_water and cp_waste for the respective emission, water-withdrawal and waste-transfer evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Original information creation inventory for declared scope; use as an allocated input to a later evaluation or mining study with explicit reuse ledger"
  excluded_use: "Reserve valuation/certification; universal per-tonne mining factor; service-hour benchmark; per-copy/download burden without reuse accounting; complete lifecycle claim with unresolved layers"
  required_metadata: "All reference qualifiers; geography/year; actual routes; meter/supplier boundaries; stock and allocation ledgers; units; original evidence; provider compatibility"
  required_quality_disclosure: "Accepted input; checks performed/skipped; completeness; findings; geology uncertainty; failed work; missing UUID/providers; historical evidence limitations; cutoff sensitivity"
  update_trigger: "New version, area/depth/commodity or evaluation stage; changed evidence, route, provider, method, rights or allocation"
data_sources:
  - id: "un-cpc3-exploration"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, pp.426–427, 83411–83413. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Own-account information boundary and adjacent services; not LCA factors"
  - id: "un-sna2008-exploration"
    type: "official_guidance"
    reference: "System of National Accounts 2008, §§10.106–10.108, pp.206–207. https://unstats.un.org/unsd/nationalaccount/docs/SNA2008.pdf"
    used_for: "Historical conceptual scope: surveys, drilling, enabling transport and re-evaluation. Monetary capital valuation is not physical allocation or a current regulatory instruction. No quantity/lifetime default adopted."
  - id: "jorc2012-reporting"
    type: "standard"
    reference: "JORC, Australasian Code for Reporting of Exploration Results, Mineral Resources and Ore Reserves, 2012 edition, Table 1 §§1–3, pp.26–29. https://www.jorc.org/docs/JORC_code_2012.pdf"
    used_for: "Solid-mineral sampling, assay and reporting quality only within its applicable reporting regime; no oil/gas requirement or LCA recipe/factor. Dataset declares actual reporting standard."
