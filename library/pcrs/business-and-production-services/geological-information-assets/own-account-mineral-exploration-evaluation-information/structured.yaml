  classification_refs: "CPC 3.0 83413"
  covered_products: "Own-account original mineral exploration/evaluation information and separately defined re-evaluation versions"
  excluded_products: "Service-only delivery; mineral stocks; extraction output; rights; standalone R&D/software/data originals; copies"
  representative_product: "Own-account mineral exploration and evaluation information package"
  production_route: "Project definition → actual surveys/sampling/test work → analysis → interpretation/evaluation → original completion; conditional physical methods declared"
  market_state: "Complete original retained for own use or made available for sale/licensing, with actual reuse rights and access conditions"
functional_unit:
  what: "Create original information about mineral occurrence and its evaluation for a declared prospect/project"
  how_much: "One complete original information package of one declared version and scope"
  how_well: "Identify geographical extent, commodities, methods, evidence completeness, spatial/depth coverage, evaluation stage, uncertainty, integrity and actual reuse restrictions; no implied reserve or compliance certification"
  how_long_or_cycle: "One actual creation/re-evaluation cycle through documented completion; report dates, no assumed economic life"
  reference_flow_link: "reference_product"
system_boundary:
  rules:
    - rule_id: boundary_project
      applies_to: "all processes"
      rule: "Include attributable planning, investigation, analysis, interpretation and documentation through original completion, including failed holes and inconclusive tests. Physical transport, camps, heating/cooling and initial delivery actually used require individually measured exchanges, not salaries or financial licence fees."
      source_ids:
        - un-cpc3-exploration
        - un-sna2008-exploration
    - rule_id: boundary_route
      applies_to: "survey, drilling, analysis"
      rule: "Record the actual route register before using conditional cards. Include geological mapping, geochemical/geophysical work, aerial or marine surveys, drilling and appraisal tests only when performed. Extend cards for every actual fuel, reagent, sample container, well material, waste and supported release; absent required route evidence blocks completeness."
      source_ids:
        - un-sna2008-exploration
        - jorc2012-reporting
    - rule_id: boundary_make_buy
      applies_to: "all processes"
      rule: "Subdivide direct operation from purchased complete service. Supplier reports are technical inputs, not a second exploration original. Do not add embedded provider fuel/electricity/equipment; lacking supplier inventories remain unknown. Own laboratories require actual assay-specific physical inventories."
      source_ids:
        - jorc2012-reporting
    - rule_id: boundary_reuse
      applies_to: "completion"
      rule: "Separate original creation from later copying, download, licence administration, hosting/network operation and mine development/use. Initial measured packaging/storage/transfer may be included with an explicit cutoff; no presumed lifetime, data centre or GB-to-energy factor."
      source_ids:
        - un-cpc3-exploration
    - rule_id: boundary_disturbance
      applies_to: "infrastructure"
      rule: "Include actual exploration disturbance, restoration and residual obligations attributable to this project; specify area, duration, prior/after land state, hole sealing and water handling. Do not classify exploration pads automatically as commercial mineral extraction land. No mine-closure burden or generic land/emission factor is assumed."
      source_ids:
        - un-sna2008-exploration
boundary_abstraction:
  declared_starting_condition: "Identified project inception or re-evaluation start, existing evidence and actual ownership/supplied state"
  starting_condition_role: "Foreground original-asset creation, not resource extraction"
  product_classification_scope: "Own-account exploration and evaluation information; geographical/method scope declared"
  recursive_input_rule: "Reused prior exploration original is a distinct input with provenance and carried allocated upstream burden. Do not recursively reconstruct or duplicate its original creation in the new version."
  upstream_dataset_requirement: "Require compatible utility/material/equipment/service datasets with supplier, region, year, configuration and boundary. Missing layers remain disclosed cutoffs."
  disclosure: "Full project route, unsuccessful work, make/buy ledger, historical inputs, transport, facilities, closure, initial storage/transfer and exclusions. Foreground-only is not complete cradle-to-gate."
