  evidence_limitations:
    - Official CPC notes define the information product, not an LCA quantity, legal approval or universal route.
    - DCAT defines broader metadata concepts; only CPC-compatible productive data under identified ownership and control are covered.
    - GSBPM is an official-statistics process framework, used for applicable acquisition and processing principles; surveys, imputation and statistical analysis are not mandatory for all data.
    - NOAA GHCN-Daily is a real versioned observation-data example, not a generic quality threshold or energy benchmark.
    - SCI principles inform only computing energy and device attribution. Actual workloads, upstream data burdens, device lives and provider scopes require foreground records.
    - Physical observation routes require all actual materials, fuels, travel, water, wastes and substantiated direct exchanges; absence is never inferred from an electronic output.
  unresolved_range_evidence:
    - No universal recipe, energy per byte, yield, device lifetime, cooling ratio or storage duration is supported. Collect actual records for the complete declared production cycle.
