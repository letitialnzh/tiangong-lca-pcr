allocation_rules:
  - rule_id: allocation_direct
    applies_to: "activities and original versions"
    rule: "Separate identifiable project/version jobs and meters before allocation. Retain failures, branches and rework causally assigned to this original. For shared platform work, use measured attributable activity and declared reuse scope, reconcile the full resource total and report residual/unassigned work. No default division by revenue, lines of code, downloads or users."
    source_ids:
      - gsf-sci-1-1
  - rule_id: allocation_equipment
    applies_to: "manufacture share"
    rule: "Use device-specific net mass with traceable upstream manufacture and measured project reservation intervals and resource shares. The share is time reserved divided by evidenced installed service life, multiplied by resources reserved divided by total available resources. No assumed four-year life, constant utilization or generic device. Disclose uncertainty and avoid adding equipment manufacture already contained in a provider service dataset."
    source_ids:
      - gsf-sci-1-1
  - rule_id: allocation_original
    applies_to: "joint and reused intellectual outputs"
    rule: "One original may encompass documented source archives and multiple platform builds without multiplying its count. Distinct accepted originals from one project need a foreground-supported allocation key and sensitivity disclosure; otherwise retain a joint-output dataset and an unresolved allocation. Existing originals/components enter once with their declared upstream share; sale or reuse rights do not constitute a physical mass or an avoided-burden credit."
    source_ids:
      - un-cpc-software-originals
dataset_production:
  collection_protocols:
    - protocol_id: cp_original
      process_id: "mastering"
      flow_role: "software_original_output"
      record_type: "acceptance_record"
      raw_fields: "asset id; version; hash; release date; functions; platforms; source/artifact manifest; component provenance; acceptance decision; reuse rights; original count"
      collection_method: "Check original acceptance against frozen repositories and artifact manifests; count one completed original, not its files or copies. Record first creation versus incremental revision scope."
      unit: "item"
      frequency: "at acceptance"
      temporal_coverage: "entire declared creation interval"
      site_scope: "all contributing teams/sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed acceptance; hashes; provenance; rights record"
    - protocol_id: cp_energy
      process_id: "requirements_implementation_verification_mastering"
      flow_role: "activity electricity"
      record_type: "meter_record"
      raw_fields: "original id; process id; job id; meter id; interval; site; voltage; kWh; reserved resources; allocation key; overhead coverage"
      collection_method: "Use calibrated submeter records or reconciled provider primary telemetry. Link design workstation, integration, build/test and acceptance/archive jobs. Measure network/storage infrastructure energy independently of traffic volumes; include provisioned idle and cooling electricity exactly once."
      unit: "kWh"
      frequency: "each meter interval/job"
      temporal_coverage: "full creation interval including failed runs"
      site_scope: "each workstation/provider/data centre site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration; meter totals; job logs; provider boundary; attribution reconciliation"
    - protocol_id: cp_components
      process_id: "implementation_verification"
      flow_role: "prior_original_input; external_test_report"
      record_type: "supplier_record"
      raw_fields: "delivery id; component/report version; original id; count; acceptance; upstream dataset; reuse population; coverage"
      collection_method: "Read actual acquisition/reuse and test-campaign deliveries with acceptance and supplier inventory boundaries; retain provider raw units and audited attribution."
      unit: "item"
      frequency: "each delivery"
      temporal_coverage: "declared creation interval"
      site_scope: "actual suppliers and project"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "contract; version; accepted report; upstream inventory and no-duplication check"
    - protocol_id: cp_hardware
      process_id: "infrastructure"
      flow_role: "portable_computer_share; integrated_computer_share; server_computer_share"
      record_type: "device_record"
      raw_fields: "device id; configuration; net device mass; weighing record; upstream manufacture; reserved interval; installed service life; resources reserved; total resources"
      collection_method: "Use calibrated device weighing or traceable supplier net-mass records for the same configuration. Retain observed installation/retirement evidence or explicitly justified projected installed life and reservation logs. Compute resource shares with consistent device capacity definitions."
      unit: "kg"
      frequency: "device/configuration and reservation change"
      temporal_coverage: "creation interval; device service-life evidence"
      site_scope: "owned devices or independently decomposed provider devices"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale/supplier record; configuration; life basis; capacity and reservation reconciliation"
    - protocol_id: cp_water
      process_id: "infrastructure"
      flow_role: "cooling_tap_water; cooling_blowdown"
      record_type: "utility_record"
      raw_fields: "site; system; original id; input water mass; output blowdown mass; density/state if volumetric; evaporation; stocks; salts/additives; receiving provider"
      collection_method: "Read actual cooling supply and discharge meters and supplier/density evidence. Attribute development workloads with the same reconciled cooling activity boundary; record chemistry and actual water balance, not assumed discharge or water intensity."
      unit: "kg"
      frequency: "each utility interval"
      temporal_coverage: "full applicable creation interval"
      site_scope: "actual cooling facilities"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meters; density/state evidence; supply quality; treatment destination; balance residual"
  calculation_rules:
    - id: electricity_conversion
      applies_to: "all electricity rows"
      rule: "MJ = measured attributable kWh × 3.6; retain kWh and grid/voltage records. Shared-resource attribution must be independently measured/reconciled before this unit conversion."
      inputs:
        - cp_energy
      output: "MJ per declared reference flow"
      source_ids:
        - gsf-sci-1-1
    - id: hardware_attribution
      applies_to: "portable_computer_share; integrated_computer_share; server_computer_share"
      rule: "Attributed hardware kg = measured net device kg × (project reserved time / evidenced installed service life) × (project reserved resource / total device resource). Use consistent time units, strictly positive evidenced service life and capacity, and reserved-time/resource shares between zero and one; reconcile shares across projects without totals exceeding available resources. Record unavailable life or resource evidence as unresolved, not a default."
      inputs:
        - cp_hardware
      output: "kg per declared reference flow"
      source_ids:
        - gsf-sci-1-1
    - id: original_basis
      applies_to: "all inventory rows"
      rule: "Record the exchanges attributable to the one accepted original directly per declared reference flow. If a cohort contains distinct originals, partition the primary records with the documented allocation first; do not average unlike originals and claim equivalence. All stage counts, deliveries and intervals must refer to the same original."
      inputs:
        - cp_original
        - cp_energy
        - cp_components
        - cp_hardware
        - cp_water
      output: "declared original reference flow"
      source_ids:
        - un-cpc-software-originals
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference original"
      requirement: "Fix the asset/version, function, platform builds, completeness, acceptance tests, component origin, reuse rights and incremental versus first-original scope. There is no universal code-length, security or software lifetime threshold."
      evidence: "cp_original and actual test/rights evidence"
    - id: quality_coverage
      applies_to: "all stages"
      requirement: "Cover real development sites and outsourced jobs over the full declared project interval. Retain failed runs and rework. Disclose missing data, meter granularity, shared idle allocation, provider coverage and infrastructure exclusions; data gaps are not zero."
      evidence: "job/campaign ledger; meters; provider inventory"
    - id: quality_representative
      applies_to: "reuse of datasets"
      requirement: "Describe the actual software class, development model, scale, testing effort, tooling, compute hardware, geography and dates. A dataset for one version is not an industry average or evidence for all software functions. Update when functionality or resource architecture materially changes."
      evidence: "project/version profile and uncertainty disclosure"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference output"
    rule: "Require exactly one completed-original reference item with version/hash, declared functions/platforms, acceptance evidence, component provenance and reproduction/reuse conditions. Reference name and software_original_output must match. Reject substitution by one licence, revenue unit, download, user-year, GB, kg or a contracted-development service."
    source_ids:
      - un-cpc-software-originals
      - nist-ssdf-1-1
  - rule_id: validate_measurement
    applies_to: "every inventory row"
    rule: "Reconcile every exchange to the same original, period and declared reference flow; audit energy conversion and meter coverage, equipment shares and water balance. Check grid country and supply voltage against each electricity UUID; replace incompatible identities while preserving actual measured exchanges. Verify supplier boundaries to prevent duplicated electricity, hardware, originals and service inputs."
    source_ids:
      - gsf-sci-1-1
  - rule_id: validate_completeness
    applies_to: "dataset release"
    rule: "Unresolved applicable flow identities, missing supplier inventories, unsupported shared-resource relationships and absent material stages prevent a complete dataset claim. Retain uncertainty and exclusions. Testing evidence defines the stated acceptance quality; it does not establish universal security, regulatory compliance or methodology approval."
    source_ids:
      - nist-ssdf-1-1
published_dataset_profile:
  dataset_role: "Declared original-creation foreground dataset for one accepted software asset/version"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Reuse as an original-development input with explicit compatible function/version scope and downstream allocation; comparisons only with equivalent original function and boundary"
  excluded_use: "Whole-life software service; per-download impact without copy allocation; universal industry average; contracted custom development; approval/security/compliance assertion"
  required_metadata: "Reference qualifiers; actual primary sites/time interval; stage coverage; hardware and supplier datasets; allocation and reuse populations; conditional rows; omitted exchanges"
  required_quality_disclosure: "Measured/modelled split; meter and provider coverage; missing data and identities; installed-life/resource-share uncertainty; exclusions and balance residuals"
  update_trigger: "New accepted original/version with materially changed scope; changed development or hardware/cloud architecture; altered reuse scope; corrected supplier/measurement evidence"
data_sources:
  - id: "un-cpc-software-originals"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, subclass 83143, Explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/83143"
    used_for: "Original-asset identity and contract-development exclusion; classification is not an inventory factor"
  - id: "un-cpc-system-downloads"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, subclass 84341, Explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/84341"
    used_for: "Distinguish downloadable system-software copies"
  - id: "un-cpc-application-downloads"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0, subclass 84342, Explanatory note. https://unstats.un.org/unsd/classifications/Econ/Structure/Detail/EN/2100/84342"
    used_for: "Distinguish downloadable application-software copies"
  - id: "gsf-sci-1-1"
    type: "standard"
    reference: "Green Software Foundation, Software Carbon Intensity Specification 1.1.0, Energy; Embodied emissions; Software boundary. https://sci.greensoftware.foundation/"
    used_for: "Infrastructure discovery, measured electricity and device time/resource attribution adapted to the declared creation cycle; not an SCI score or default workload/lifetime"
  - id: "nist-ssdf-1-1"
    type: "official_guidance"
    reference: "NIST SP 800-218, Secure Software Development Framework Version 1.1 (February 2022). https://doi.org/10.6028/NIST.SP.800-218 ; Table 1, PS.2/PS.3 (printed p.10, PDF p.19), PW.6/PW.8."
    used_for: "Release integrity/provenance and actual build/test/archival stage evidence; recommendation edition only, no NIST certification or numeric energy claim"
