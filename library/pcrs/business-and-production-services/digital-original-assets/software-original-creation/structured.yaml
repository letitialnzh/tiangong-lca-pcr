product_category_identity:
  canonical_pcr_id: "pcr.business-and-production-services.digital-original-assets.software-original-creation"
  classification_refs: "CPC 3.0 83143 — Software originals"
  covered_products: "Completed system/application software original assets, including games and developer tools, with identified functionality and original acceptance"
  excluded_products: "Contract software for others; data-only assets; R&D originals; copies/downloads; SaaS; licence-only services"
  representative_product: "One frozen, accepted software original version with documented source and build provenance"
  production_route: "Requirements/architecture → implementation/integration → build/verification → original acceptance/preservation; actual shared infrastructure"
  market_state: "Original asset ready for declared reproduction/reuse; no assumed number of future copies or users"
functional_unit:
  what: "Provide one completed software original with the declared computing functions and reuse scope"
  how_much: "One accepted original asset, counted once regardless of archive file count or platform-build count"
  how_well: "Actual version-specific functional/platform acceptance, integrity and completeness defined by primary acceptance records"
  how_long_or_cycle: "One declared creation cycle from project start/baseline to original acceptance and handover; no assumed operational lifetime"
  reference_flow_link: "software_original_output"
system_boundary:
  rules:
    - rule_id: boundary_original
      applies_to: "original production"
      rule: "Include project-attributable requirements, architecture, implementation, integration, builds, tests, rework, release acceptance, source/artifact preservation and the one original handover. Include unsuccessful attempts belonging to the accepted original. Do not assume any specific language, algorithm, training step or deployment architecture."
      source_ids:
        - un-cpc-software-originals
        - gsf-sci-1-1
        - nist-ssdf-1-1
    - rule_id: boundary_separate_copies
      applies_to: "downstream activities"
      rule: "Exclude later copying, public downloads, distribution campaigns, customer installation, user operation, subscription hosting and post-acceptance maintenance and continuing archival storage after handover. A downstream copy model may use the original dataset with an explicit reuse-population allocation, but must not charge the entire original to every download. Initial original handover is distinguished from ongoing download/network delivery."
      source_ids:
        - un-cpc-software-originals
        - un-cpc-system-downloads
        - un-cpc-application-downloads
    - rule_id: boundary_primary
      applies_to: "all sites and suppliers"
      rule: "Collect supporting compute, storage and network activity used during creation at their real sites. Expand primary provider records into nonduplicated atomic exchanges or retain a specific service dataset with a verified delivery unit and declared boundary. Neither cloud invoices nor GB transferred establish electricity. This is a declared foreground original-creation dataset, not a complete cradle-to-gate claim; upstream utilities, equipment manufacture and acquired originals require compatible linked datasets."
      source_ids:
        - gsf-sci-1-1
    - rule_id: boundary_actual_exchanges
      applies_to: "conditional utility and apparatus extensions"
      rule: "The listed hardware and cooling rows apply only when the stated equipment/utility exists. Add one specific row for each actual separate display, network appliance, consumable, fuel, coolant, wastewater or direct elementary exchange omitted from these cards; identify its property, protocol and provider/compartment. Direct emissions are required only with measured occurrence or an evidenced physical source. Purchased-electricity impacts belong upstream, not invented onsite CO2. Mark unmeasured material omissions as incomplete, not zero."
      source_ids:
        - gsf-sci-1-1
boundary_abstraction:
  declared_starting_condition: "Documented project decision and actual source/component baseline; initial original creation or specifically delimited later revision"
  starting_condition_role: "Separates prior completed originals and general research from the measured current-original creation interval"
  product_classification_scope: "Software original asset; excludes contracted software for others and download/copy outputs"
  recursive_input_rule: "Record each acquired same-category original once with its upstream dataset and documented reuse share; do not recursively redevelop its source chain in this foreground"
  upstream_dataset_requirement: "Compatible site/voltage electricity, configuration-specific equipment manufacture, acquired original/component and actual supplier delivery datasets; disclose missing boundaries"
  disclosure: "Original identity; baseline and creation dates; all teams/sites/provider scopes; allocation keys; included equipment/cooling; excluded downstream copies and operation; unresolved data"
