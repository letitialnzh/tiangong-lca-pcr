review_metadata:
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review: pending
  translation_review: pending_independent_review
  semantic_boundary:
    decision: New semantic methodology required for creation of the complete
      original asset, not a packaged/downloaded copy. Retained
      software-originals directory is an empty scaffold and is unchanged.
      Existing packaged methods support process discovery but include
      replication/copy bases, so do not directly cover this original-asset
      reference.
    classification_scope: 83143 excludes software produced under contract for
      others; downloads 84341/84342, SaaS, licensing, databases and R&D
      originals are separate outputs.
  unresolved_flow_identities:
    - row_id: prior_original_input
      selected_flow: Previously completed software original used as a reusable component
      reason: No directly verified exact original-component identity with this item
        basis and upstream reuse conditions.
    - row_id: external_test_report
      selected_flow: External executable-software test report delivery
      reason: Search returned hosting/infrastructure proxies with Mass or CTUe
        references rather than a bounded accepted executable-software
        test-report delivery.
    - row_id: software_original_output
      selected_flow: Completed software original
      reason: Public direct-read software candidates represent packaged copies or
        developer-tooling intermediates with Mass or CTUe quantitative
        references; no evidenced conversion to this completed-original item.
        Retain blank UUID; do not assert database-wide absence.
    - row_id: server_computer_share
      selected_flow: Rack-mounted development server computer
      reason: Bounded computer candidates are generic systems/subassemblies; no
        directly verified identity confirms the complete configured rack-mounted
        development server boundary.
    - row_id: requirements_electricity_site
      selected_flow: Alternating current
      reason: Actual creation sites, user voltage and supply mixes must be collected;
        CN <1 kV and 1–35 kV identities do not cover other supplies. Preserve
        actual site-specific electricity without inventing a default global
        UUID.
    - row_id: implementation_electricity_site
      selected_flow: Alternating current
      reason: Actual creation sites, user voltage and supply mixes must be collected;
        CN <1 kV and 1–35 kV identities do not cover other supplies. Preserve
        actual site-specific electricity without inventing a default global
        UUID.
    - row_id: verification_electricity_site
      selected_flow: Alternating current
      reason: Actual creation sites, user voltage and supply mixes must be collected;
        CN <1 kV and 1–35 kV identities do not cover other supplies. Preserve
        actual site-specific electricity without inventing a default global
        UUID.
    - row_id: mastering_electricity_site
      selected_flow: Alternating current
      reason: Actual creation sites, user voltage and supply mixes must be collected;
        CN <1 kV and 1–35 kV identities do not cover other supplies. Preserve
        actual site-specific electricity without inventing a default global
        UUID.
    - row_id: cooling_blowdown
      reason: No verified scope-compatible untreated cooling-tower blowdown waste
        identity after refined bounded public searches. d2d44ce1 has a specific
        electrolytic-manganese-slag-material washing route despite its broad
        generic comment; secondary/tertiary-treated wastewater, purchased
        cooling water and optical-assembly polluted groundwater are not
        substitutes. Actual composition, untreated state, reference property and
        treatment destination require confirmation.
  unresolved_evidence:
    - Site-specific development records, supplier inventories, original
      acceptance and reuse rights, measured hardware configuration/mass, service
      life and resource attribution remain required before a concrete dataset
      can be produced.
    - No independent compatible numeric ranges are adopted. No default software
      mass, code-quality score, energy, yield, carbon factor, download
      population or hardware lifetime.
    - Scientific review and independent translation review remain pending; this
      candidate is not published or approved methodology.
  range_evidence_needs:
    - row_ids:
        - requirements_electricity_site
        - requirements_electricity_lv
        - requirements_electricity_mv
      reason: No independently verified compatible per-original development
        electricity range. Collect actual original-specific meter/provider data;
        workload, software class, geography and shared resource boundary vary.
        No invented default.
    - row_ids:
