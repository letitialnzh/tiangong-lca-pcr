allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all inventory rows"
    rule: "Separate stages, version cohorts and owned/provider segments before allocation. Use actual workload telemetry and disjoint meter scopes; reconcile the sum of attributed shares and residuals to observed totals. Revenue, licensing value and user numbers are not physical shares."
    source_ids:
      - gsf-sci110
  - rule_id: allocation_storage_network
    applies_to: "hosting_electricity; network_electricity"
    rule: "Storage capacity-time and transmitted bytes may inform measured causal attribution only with actual reserved load, technology and meter/provider reconciliation. Report idle capacity, replicas, retransmissions and receiver scope. No universal energy-per-GB factor or arbitrary cooling multiplier is prescribed."
    source_ids:
      - gsf-sci110
  - rule_id: allocation_device
    applies_to: "server_hardware; router_hardware; receiving_computer"
    rule: "For each specified device use its actual documented installed-life, reserved-time and resource-capacity share. Reconcile all beneficiaries and do not double count supplier-covered hardware. Distinct devices and noncomputing materials require their own records; no default life or mass is given."
    source_ids:
      - gsf-sci110
  - rule_id: allocation_original
    applies_to: "recording_master; transcode_job"
    rule: "Keep original recording creation and reusable encoding work separate from incremental downloads. Use a conserved finite beneficiary ledger for the same master/version across download, stream and physical-release uses. Prefer measured subdivision; closed-cohort allocation must disclose its observation period, excluded beneficiaries and sensitivity. Never divide the full master burden by an invented future sale count or count it once per download."
    source_ids:
      - un-cpc3-music
  - rule_id: allocation_attempts
    applies_to: "accepted_download"
    rule: "Include unsuccessful encoding/transfer effort attributable to the studied delivery cohort in the inputs; normalize to complete accepted local deliveries only. Separate repeated successful downloads as separate delivered copies within the same version cohort, while duplicate log entries never inflate output."
    source_ids:
      - un-cpc3-music
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "delivery"
      flow_role: "complete output"
      record_type: "acceptance_record"
      raw_fields: "release ID; ordered files/tracks; hashes; codec and audio parameters; bytes; duration; endpoint; session IDs; attempts; complete accepted count; rights/use conditions"
      collection_method: "Reconcile server delivery events with local file manifest/integrity and decode acceptance or documented sampled receiver evidence; deduplicate event IDs and distinguish partial transfers"
      unit: "item"
      frequency: "Each delivered package"
      temporal_coverage: "Declared complete cohort interval"
      site_scope: "Origin, network and actual receiving endpoints"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Version manifest; test results; logs; sampling and failures"
    - protocol_id: cp_energy
      process_id: "preparation_hosting_delivery"
      flow_role: "stage electricity"
      record_type: "meter_record"
      raw_fields: "meter; start/end; stage/job; kWh; region/voltage; shared reservation; cooling/idle scope; session/storage/traffic logs; allocation shares; provider overlap"
      collection_method: "Use calibrated meters or verified telemetry integrated over actual disjoint stage intervals; reconcile facility totals and cohort workloads including retries; test receiving-device sessions separately"
      unit: "kWh"
      frequency: "Each run and measured interval"
      temporal_coverage: "Preparation plus actual storage and transfer interval"
      site_scope: "All measured owned segments and receiver sample"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration; raw telemetry; period reconciliation; sampling uncertainty"
    - protocol_id: cp_master
      process_id: "preparation"
      flow_role: "upstream master share"
      record_type: "source_record"
      raw_fields: "master ID/version; approval; files; provenance/use conditions; creation inventory; benefiting release/use cohorts; allocation shares; cutoff"
      collection_method: "Inspect approved master and original production inventory; document actual beneficiary subdivision and conserved upstream shares; record unresolved original layer separately"
      unit: "item"
      frequency: "Each source/version ledger update"
      temporal_coverage: "Actual creation and beneficiary reporting horizon"
      site_scope: "Recording producer and publisher"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Source manifest; upstream records; allocation/sensitivity ledger"
    - protocol_id: cp_provider
      process_id: "preparation_hosting_delivery"
      flow_role: "specific provider delivery"
      record_type: "supplier_record"
      raw_fields: "supplier; scoped job/reservation/session ID; version; interval; capacity/bytes; defined item unit; accepted completion; energy/hardware inventory; beneficiary share"
      collection_method: "Obtain supplier activity and matched inventory with explicit endpoints and included layers; reconcile billed jobs/reservations/sessions to acceptance and partition owned overlap"
      unit: "item"
      frequency: "Each provider delivery and period"
      temporal_coverage: "Matched preparation/storage/transfer cohort"
      site_scope: "Actual providers and segments"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Contract scope; inventory; raw activity; overlap reconciliation"
    - protocol_id: cp_device
      process_id: "preparation_delivery"
      flow_role: "specific hardware share"
      record_type: "asset_record"
      raw_fields: "device ID/model/configuration; device count; production/end-of-life inventory; installed-life evidence; reserved time and resources; total capacity; stage beneficiaries"
      collection_method: "Reconcile actual asset register and supplier device inventory with workload reservation logs; substantiate life and partition device shares across all beneficiaries"
      unit: "item"
      frequency: "Each configuration and reservation period"
      temporal_coverage: "Actual installed life and studied reservation interval"
      site_scope: "Owned preparation/hosting, network and receiving devices"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Asset records; device inventories; life evidence; workload shares"
  calculation_rules:
    - id: calculate_energy
      applies_to: "prepare_electricity; hosting_electricity; network_electricity; receiving_electricity"
      rule: "Convert attributable collected kWh per declared reference flow to MJ by multiplication by 3.6. Preserve the measured physical attribution and disjoint provider scopes."
      inputs:
        - cp_energy
      output: "MJ per declared reference flow"
      source_ids:
        - nist-si-conversion
    - id: calculate_cohort
      applies_to: "all inventory rows"
      rule: "Reconcile each measured attributable cohort exchange with the complete accepted-package count in the same release configuration and interval, then divide that attributed amount by the count. Keep failed work in the numerator. Retain pre-normalization totals and the positive denominator."
      inputs:
        - cp_acceptance
        - cp_energy
        - cp_provider
        - cp_master
        - cp_device
      output: "Exchange per declared reference flow"
      source_ids:
        - un-cpc3-music
        - gsf-sci110
    - id: calculate_device
      applies_to: "server_hardware; router_hardware; receiving_computer"
      rule: "Derive the attributable device fraction from the recorded reserved-time share of evidenced installed life and reserved-resource share of total capacity; apply it to the actual specified device inventory and reconcile across beneficiaries before cohort normalization. No default life or capacity is assigned."
      inputs:
        - cp_device
        - cp_acceptance
      output: "Attributable device item share per declared reference flow"
      source_ids:
        - gsf-sci110
  data_quality_requirements:
    - id: quality_identity
      applies_to: "accepted_download"
      requirement: "Bind recording version, actual bytes, duration, encoding, track sequence, completeness and lawful/use-condition provenance; approval here is producer acceptance, not scientific or legal certification."
      evidence: "cp_acceptance; cp_master"
    - id: quality_representative
      applies_to: "all inventory rows"
      requirement: "Declare geography, reporting period, format, network and receiving-device distributions; weighted samples need actual cohort weights. Do not extrapolate one CN meter to a global network."
      evidence: "cp_energy; cp_provider; cp_acceptance"
    - id: quality_complete
      applies_to: "all inventory rows"
      requirement: "Report unmeasured receivers/providers, unavailable original/device layers, capacity attribution uncertainty and all retry/idle/backup gaps. A missing upstream or transfer layer is incomplete coverage, not a zero exchange."
      evidence: "cp_energy; cp_device; cp_provider; cp_master"
    - id: quality_uncertainty
      applies_to: "allocation_original; allocation_device"
      requirement: "Retain sensitivity to recorded storage horizon, original beneficiaries, device life, receiver sampling and shared-resource attribution; no default production coefficient is provided."
      evidence: "cp_master; cp_device; cp_energy"
validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_download"
    rule: "Check 1 item complete accepted package against cp_acceptance, exact product name and all required qualifiers. Reject clicks, rights, revenue, streams, partial files or duplicate events as output."
    source_ids:
      - un-cpc3-music
      - bandcamp-formats
  - rule_id: validate_units
    applies_to: "all inventory rows"
    rule: "Check count/property/unit compatibility, exact kWh-to-MJ conversion, source-to-unit-group linkage and per-declared-reference-flow denominator. Do not replace a public primary property to force a UUID match; reject unsupported bytes/energy or copyright/mass conversions."
    source_ids:
      - nist-si-conversion
  - rule_id: validate_overlap
    applies_to: "delivery_system"
    rule: "Reconcile disjoint meters/provider layers, device fractions, original beneficiary shares, storage intervals and retries. Verified CN electricity UUIDs require real region/voltage match; all other regions remain in scope and need separately matched identities."
    source_ids:
      - gsf-sci110
  - rule_id: validate_coverage
    applies_to: "dataset"
    rule: "Check every actual production and delivery stage, added atomic exchanges and unresolved layer disclosure. Require independent applicability and scientific review before approval; structural checks do not certify impact, legal use, audio fidelity or complete lifecycle coverage."
    source_ids:
      - un-cpc3-music
      - gsf-sci110
published_dataset_profile:
  dataset_role: "Foreground musical-download delivery inventory, with separately identified upstream original/hardware/provider layers"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "After evidence completion, one matched musical-download input to a declared music-use model with the same package quality and scope"
  excluded_use: "Universal impact per song, byte, user or license; full music lifecycle from delivery-only data; streaming/broadcast proxies; unequal album/track comparisons"
  required_metadata: "All reference qualifiers; original and version lineage; cohort totals; meter/provider endpoints; hardware fractions; geography/voltage; storage/retry scope; unit conversion; allocations and added exchanges"
  required_quality_disclosure: "Unresolved identities and scientific review; original/hardware/provider/receiver gaps; sampling, allocation and temporal uncertainty; scope limitations"
  update_trigger: "Changed recording/file version, encoding, package size, quality, supplier, network/device route, geography, storage horizon, acceptance or allocation evidence"
