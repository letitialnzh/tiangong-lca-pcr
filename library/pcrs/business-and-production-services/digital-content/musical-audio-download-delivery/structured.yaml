product_category_identity:
  canonical_pcr_id: "pcr.business-and-production-services.digital-content.musical-audio-download-delivery"
  classification_refs: "CPC 3.0: 84321"
  covered_products: "Complete locally stored musical audio file packages; declared track or album configuration"
  excluded_products: "Streams; broadcasts; non-musical audio; video; physical media; originals and rights-only sales"
  representative_product: "One accepted download of an identified music track; album configurations use the same complete-package method"
  production_route: "Approved master → file preparation and acceptance → origin/cache hosting → transfer → local file acceptance"
  market_state: "Delivered musical audio file package, version and use conditions declared"
functional_unit:
  what: "Deliver a complete usable local copy of the declared musical audio recording package"
  how_much: "1 item; one successful complete package delivery"
  how_well: "Exact release/track list, declared encoding and audio parameters; byte integrity and decode/playability accepted under documented checks"
  how_long_or_cycle: "One completed download through local file acceptance; actual preparation and hosting intervals allocated to the observed delivery cohort; no listening lifetime implied"
  reference_flow_link: "accepted_download"
system_boundary:
  rules:
    - rule_id: boundary_delivery
      applies_to: "delivery_system"
      rule: "Include actual file ingestion, format preparation or verification, release QA, origin/cache storage and replicas, transfer attempts and local receipt through integrity acceptance. Splitting sites/providers does not exclude an essential segment; missing data require explicit incomplete coverage."
      source_ids:
        - un-cpc3-music
        - bandcamp-formats
    - rule_id: boundary_layers
      applies_to: "recording_master; server_hardware; router_hardware; receiving_computer"
      rule: "Core foreground starts after source recording approval. Report recording/performance/composition production separately and link only an evidenced attributable upstream inventory. Hardware production and end-of-life belong in identified asset/provider layers. Do not call foreground electricity alone complete product LCA."
      source_ids:
        - gsf-sci110
    - rule_id: boundary_actual
      applies_to: "all inventory rows"
      rule: "Instantiate each actual fuel, chemical, cooling water supply, wastewater, solid waste, material, additional device and substantiated elementary emission as a separate atomic row with measured amount and property. There is no mandatory on-site CO2, NOx or water emission for an electrically operated download. Upstream electricity emissions are not direct emissions. Absent exchanges need route evidence; unresolved identities are not cut-offs."
      source_ids:
        - gsf-sci110
    - rule_id: boundary_use
      applies_to: "post_acceptance"
      rule: "Exclude subsequent offline listening, storage retention after the declared download acceptance, user travel, unrelated platform browsing/streaming, advertising and rights-only transactions from core delivery. A full music-use comparison must separately add matched playback, retention, equipment and original-production scenarios."
      source_ids:
        - un-cpc3-music
boundary_abstraction:
  declared_starting_condition: "Approved musical recording master with known version, provenance and use conditions"
  starting_condition_role: "Foreground delivery interface; original creation remains a separately identified upstream layer"
  product_classification_scope: "Downloadable locally stored musical recordings; classification is descriptive, not an allocation boundary"
  recursive_input_rule: "Record acquired already prepared musical files once at the supplier interface; do not repeat their upstream encoding or original creation"
  upstream_dataset_requirement: "Obtain compatible recording-production, hardware and provider inventories for linked layers; disclose unavailable layers"
  disclosure: "Name endpoints, responsibility, original and hardware linkage, storage period, provider overlap, receiver coverage and downstream exclusions"
