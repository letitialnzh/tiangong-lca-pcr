  evidence_limitations:
    - Official classification defines local downloadable musical files, not an LCA factor or universal quality level.
    - Bandcamp is a current first-party format example, not a required platform, encoding, file size or benchmark.
    - SCI 1.1.0 informs computing scope and attribution; this PCR does not claim SCI conformance or a complete lifecycle score.
    - CN electricity identity applies only to actual grid-average user supply below 1 kV. Other supplies require matching identities without changing the product scope.
    - No original-production burden, device lifetime, storage duration, energy-per-byte, cooling ratio or network factor is invented. Foreground and provider evidence remain required.
    - No necessary direct elementary emission is established for the electric digital route. Actual cooling, fuel, water, waste and equipment exchanges must be instantiated separately if present.
  unresolved_range_evidence:
    - No universal energy intensity, download size, recording duration, retry rate, device life or original reuse denominator is supported.
