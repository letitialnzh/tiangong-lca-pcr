product_category_identity:
  canonical_pcr_id: "pcr.business-and-production-services.brand-assets.registered-trademark-franchise-original"
  classification_refs: "CPC 3.0 83960"
  covered_products: "Own-account registered original trademarks and franchise assets; actual registered signs and franchise types"
  excluded_products: "Licensing, rights administration, channel advice, R&D services; separate design/software/data/art originals and copies"
  representative_product: "Registered trademark and franchise original asset package"
  production_route: "Actual asset definition/clearance → sign/brand and applicable franchise-system formation → registration/dossier → version completion/initial handoff; actual iterations and outsourcing recorded"
  market_state: "Complete versioned original with legally registered ownership for stated benefit-from-others-use intent; no environmental or compliance approval inferred"
functional_unit:
  what: "Form one identifiable original trademark or franchise asset"
  how_much: "One completed asset package of specified version and registration scope"
  how_well: "Declare owner, sign, territories/classes, registration evidence, originality provenance, complete content, franchise type and know-how/manual conditions, use/reuse rights and limitations"
  how_long_or_cycle: "One actual formation cycle through registration and initial handoff cutoff; no default commercial life or license duration"
  reference_flow_link: "reference_product_original"
system_boundary:
  rules:
    - rule_id: formation
      applies_to: "all processes"
      rule: "Include actual specification/clearance, sign and brand establishment, applicable franchise-system know-how formation, registration, version assembly and initial handoff. Project, registration and acceptance originals define the cutoff; electronic filing alone is not a default boundary."
      source_ids:
        - un-cpc3-trademarks
        - wipo-franchise-2019
    - rule_id: routes
      applies_to: "all actual routes"
      rule: "Build a complete activity-to-exchange ledger. Paper, manual/campaign delivery and portable computing rows are conditional concrete rows, not a narrowed category. Actual printing, other sign media, tests, travel, heating/cooling, water, servers, premises and outsourced technosphere deliveries require separate applicable atomic rows; unexpanded operations prohibit completeness."
      source_ids:
        - un-cpc3-trademarks
        - wipo-franchise-2019
    - rule_id: later_activities
      applies_to: "asset and later use"
      rule: "Separate subsequent licensing/rights administration, routine promotion, franchisee training/support, copying/downloads, long-term hosting, outlet operation, marked-goods manufacture and consumption. Initial handoff declares actual storage/network activity; network GB is not converted to default kWh. Preserve original formation burden once."
      source_ids:
        - un-cpc3-trademarks
        - wipo-franchise-2019
    - rule_id: provider_scope
      applies_to: "owned and provider resources"
      rule: "An actual scoped purchased delivery is one technosphere service product; obtain activity and upstream evidence. Do not duplicate embedded utility/device/production in owned rows. Fees or report counts without supplier inventory cannot establish complete upstream environmental results."
      source_ids:
        - gsf-sci-1-1-0
    - rule_id: direct_releases
      applies_to: "elementary flows"
      rule: "Do not presume direct releases in electronic asset formation. Screen actual combustion, printing, material processing, refrigerant leakage and wastewater operations; instantiate substance, fossil/biogenic origin, compartment/subcompartment, state and quantity only with measurement or reliable factor evidence. Separate technosphere water/waste from resource water; utility/device upstream emissions remain upstream."
      source_ids:
        - gsf-sci-1-1-0
boundary_abstraction:
  declared_starting_condition: "Actual original-asset formation project inception; declare inherited brand/design/R&D, tools/equipment and stocks"
  starting_condition_role: "Foreground asset formation with explicit upstream supplies"
