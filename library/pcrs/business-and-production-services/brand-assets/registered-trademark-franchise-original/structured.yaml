allocation_rules:
  - rule_id: shared_activity
    applies_to: "shared formation activities"
    rule: "First subdivide by project/stage job records, assigning failed attempts and rework. For inseparable shared resources use explainable physical workload/time/occupancy evidence, reconciling full-period totals and all beneficiaries; no invented price or royalty allocation. This is a foreground collection requirement, not a numeric share prescribed by CPC/WIPO."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: asset_lineage
    applies_to: "inherited originals and co-products"
    rule: "Record versions, burden provenance and all beneficiary assets for inherited design/R&D/brand originals; shares must be auditable and cannot exceed source burden. Multiple registration territories are not automatically multiple products; only independently accepted deliverables are co-products. Any necessary economic allocation requires a separate justified sensitivity study, with no default price weights."
    source_ids:
      - un-cpc3-trademarks
  - rule_id: copies
    applies_to: "licenses and copies"
    rule: "Do not charge the complete original burden again to every license, download or franchisee. Downstream attribution separately declares actual use/reuse basis, period, scope and uncertainty; projected future users are not this production output. No default avoided-burden credit for paper scrap."
    source_ids:
      - un-cpc3-trademarks
dataset_production:
  collection_protocols:
    - protocol_id: cp_asset
      process_id: "completion"
      flow_role: "reference_product_original"
      record_type: "acceptance ledger"
      raw_fields: "asset/project ID; version; contents; owner/sign/territories/classes; registration originals; own-account; handoff/cutoff; franchise content; failed attempts"
      collection_method: "Accept each package against registration originals and complete contents, checking same project/version; files, registrations or licenses are not output count"
      unit: "item"
      frequency: "each acceptance"
      temporal_coverage: "complete actual formation cycle"
      site_scope: "owner and actual participating sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "originals, content hashes, acceptance and change ledger"
    - protocol_id: cp_energy
      process_id: "definition_development_registration_completion"
      flow_role: "electricity rows"
      record_type: "meter and job records"
      raw_fields: "site/region; voltage; stage/job ID; times; measured kWh; cooling/storage/transfer scope; master meter; attribution basis"
      collection_method: "Use calibrated meters, workstation measurements or provider measured electricity; reconcile all attributed shares against jobs. Reservation alone does not replace measured electricity"
      unit: "kWh"
      frequency: "each metering period and job"
      temporal_coverage: "same complete formation period and initial handoff"
      site_scope: "actual sites and stated provider interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibration, master-meter reconciliation, allocation residuals and uncertainty"
    - protocol_id: cp_services
      process_id: "definition_development_registration"
      flow_role: "specific purchased deliveries"
      record_type: "delivery and provider activity"
      raw_fields: "report/campaign/manual/design/filing ID; version; scope; acceptance; attributed fraction; embedded energy/hardware; supplier upstream; duplicates"
      collection_method: "Verify each scoped actual delivery and supplier primary activity; count/attribute each service type separately, with no environmental quantity inferred from fees"
      unit: "item"
      frequency: "each delivery"
      temporal_coverage: "complete formation cycle including failed examination"
      site_scope: "actual provider/authority boundary"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "contract delivery specification, originals, supplier inventory and upstream gaps"
    - protocol_id: cp_paper
      process_id: "registration"
      flow_role: "dossier_paper; unprinted_paper_scrap"
      record_type: "material and handoff weighing"
      raw_fields: "paper type/state; opening/closing stocks; withdrawals; consumed kg; unprinted offcuts kg; receiver/treatment; other contaminated paper"
      collection_method: "Verify actual paper and insert/converting state; separately measure consumption and clean offcuts using calibrated scales or traceable net-mass records; instantiate other ink/waste separately"
      unit: "kg"
      frequency: "each batch and stock period"
      temporal_coverage: "same formation period"
      site_scope: "actual dossier preparation and waste handoff"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighing, stocks/bills and receiver/treatment evidence"
    - protocol_id: cp_hardware
      process_id: "support"
      flow_role: "portable_computer_share"
      record_type: "equipment mass and usage ledger"
      raw_fields: "device ID/configuration; calibrated net mass kg; use; actual occupied/reserved job time; available resources; evidenced installed service life or justified projected service life; cumulative manufacture-share ledger; all beneficiary jobs"
      collection_method: "Weigh the same complete configuration or read traceable net-mass records, excluding packaging, verifying at most 10 kg; derive equipment share from time/resources and evidenced allocation interval, reconciling all jobs"
      unit: "kg"
      frequency: "device changes and each job period"
      temporal_coverage: "formation and equipment allocation periods separately declared"
      site_scope: "owned equipment; provider embedded hardware excluded from duplicate entry"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighing, configuration, hardware production dataset, interval evidence and share reconciliation"
  calculation_rules:
    - id: meter_conversion
      applies_to: "definition_electricity; development_electricity; registration_electricity; completion_electricity"
      rule: "Multiply measured attributable kWh per declared reference flow by 3.6 MJ/kWh. Retain master-meter/load records; do not duplicate cooling or premises electricity."
      inputs:
        - cp_energy
      output: "MJ per declared reference flow"
      source_ids:
        - gsf-sci-1-1-0
    - id: equipment_share
      applies_to: "portable_computer_share"
      rule: "Multiply measured same-configuration net mass by evidenced time share and resource share to obtain attributable kg per declared reference flow. Device ledger supports interval and resource share without duplicates; do not copy SCI example lifetime or treat carbon factors as mass."
      inputs:
        - cp_hardware
      output: "equipment kg per declared reference flow"
      source_ids:
        - gsf-sci-1-1-0
    - id: equipment_life_conservation
      applies_to: "portable_computer_share"
      rule: "The allocation interval for manufacture must cover evidenced installed service life, or a justified projected life with sensitivity and later reconciliation. Reconcile cumulative manufacture shares across all projects and periods to the same device inventory; total shares must not exceed one. Do not reset full manufacture burden at each project/year. Unknown life or resource evidence requires review."
      inputs:
        - cp_hardware
      output: "auditable cumulative equipment allocation"
      source_ids:
        - gsf-sci-1-1-0
    - id: delivered_scope
      applies_to: "clearance_report; design_original_input; campaign_delivery; manual_delivery; registration_examination"
      rule: "For each scoped delivery separately record actual count and evidenced attribution fraction, aggregating per declared reference flow; unlike service counts never become one exchange."
      inputs:
        - cp_services
      output: "each service item per declared reference flow"
      source_ids:
        - un-cpc3-trademarks
    - id: paper_records
      applies_to: "dossier_paper; unprinted_paper_scrap"
      rule: "Reconcile consumption with net withdrawals/stocks and offcuts with handoff weights separately, each per declared reference flow; reconcile document carriers, losses and returns without an invented loss rate."
      inputs:
        - cp_paper
      output: "each paper exchange kg per declared reference flow"
      source_ids:
        - un-cpc3-trademarks
  data_quality_requirements:
    - id: asset_identity
      applies_to: "reference_product_original"
      requirement: "Match registration evidence and complete contents to same version; an application draft without registered ownership is not the target finished asset. No health, commercial-success or compliance approval inferred."
      evidence: "cp_asset"
    - id: complete_routes
      applies_to: "all processes"
      requirement: "Reconcile every actual activity route with atomic exchanges; explicitly flag missing supplier, facility, transport, physical-production or elementary-flow evidence, not zero."
      evidence: "cp_energy; cp_services; cp_paper; cp_hardware"
    - id: representation
      applies_to: "dataset"
      requirement: "Declare actual year, region, project type, stage coverage, excluded layers and uncertainty; one asset does not represent the entire brand/franchise sector."
      evidence: "project and provider originals"
    - id: rights_reuse
      applies_to: "inherited assets and deliveries"
      requirement: "Disclose use/reuse conditions and copyright/confidentiality limits; license share cannot prove environmental equivalence. Sensitive primary ledgers may remain with owner but must be reviewable."
      evidence: "cp_asset; cp_services"
validation_rules:
  - rule_id: reference_integrity
    applies_to: "reference_product_original"
    rule: "Verify one complete registered asset version/contents/ownership and all qualifiers; reference-product name must equal finished-output row. Unresolved identity and scientific review cannot be represented as approval."
    source_ids:
      - un-cpc3-trademarks
  - rule_id: inventory_completeness
    applies_to: "all inventory rows"
    rule: "Verify each single exchange, direction, type, property, unit, condition and protocol, retaining bilingual row_id. CN low-voltage electricity requires actual matching interface; check device mass and paper state; public Number of items cannot be rewritten as Mass."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: no_double_count
    applies_to: "activities and original ledger"
    rule: "Reconcile shared electricity, equipment share, embedded provider scope, failures and inherited originals; separate later licensing, copying or goods production from original-asset production."
    source_ids:
      - un-cpc3-trademarks
      - gsf-sci-1-1-0
  - rule_id: bounded_claim
    applies_to: "completeness claims"
    rule: "Retain gaps and review when actual routes are unexpanded, supplier upstream is missing, identities/conditions mismatch or measurement relationships are unproved; prohibit complete cradle-to-gate claims. Actual direct releases require substance/origin/compartment evidence, neither assumed zero nor invented mandatory emissions."
    source_ids:
      - un-cpc3-trademarks
      - wipo-franchise-2019
published_dataset_profile:
  dataset_role: "Declared original trademark/franchise formation foreground dataset with explicit upstream layers"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Specific asset-formation input where contents/version/registration scope and use conditions match; downstream separately justifies use attribution"
  excluded_use: "Unmatched brand comparisons; repeated original burden per license/download; application-only treated as finished; franchise goods/outlet operation footprints; complete cradle-to-gate with missing layers"
  required_metadata: "All reference qualifiers; actual formation period/cutoff; route/activity/exchange ledger; original provenance/reuse; collection protocols and supplier interfaces; registration/acceptance originals"
  required_quality_disclosure: "Coverage/gaps, unresolved identities, measurement/allocation uncertainty, supplier layers, representativeness, rights limits, release screening and facility/delivery exclusions"
  update_trigger: "Changed asset version, registered territory/classes/owner, franchise content, actual formation route, supplier, grid, equipment or reuse evidence"
