  evidence_limitations:
    - No observed project inventory, category-wide energy factor, asset mass,
      lifetime or environmental-equivalence claim is supplied. Quantities and
      route completeness require actual project/authority/provider records.
    - CPC gives original-asset identity and exclusions only. WIPO2019 gives
      conceptual franchise-type/documentation context only, not current law,
      registration approval or mandatory generic physical production.
    - SCI applies only to computing attribution; no example numerical device
      life or carbon factor adopted. Expanded inventories required for actual
      servers, facilities, media, travel, physical prototypes and releases.
    - No direct elementary release is presumed in electronic asset formation.
      Screen actual release-producing operations and instantiate
      substance/origin/compartment-specific rows before completeness.
  unresolved_range_evidence:
    - No empirical category-wide ranges adopted; collect actual formation-cycle
      quantities and uncertainty.
