allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all shared research inputs"
    rule: "First separate project operations and outputs with actual meters, bookings and material issue records. Do not use revenue, patent counts or hoped-for users as default physical shares. Record causal driver and unassigned residual; unknown shared burdens are not zero."
    source_ids:
      - un-cpc3-originals
      - oecd-frascati-2015
      - gsf-sci-1-1-0
  - rule_id: allocation_compute
    applies_to: "shared computing facilities"
    rule: "Use actual measured energy and explainable job/resource/time attribution, including reserved idle capacity and cooling boundary. Energy attribution requires validation against facility meters; storage/traffic metrics are allocation evidence, not universal kWh coefficients."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: allocation_device
    applies_to: "server_hardware"
    rule: "Attribute the specific device inventory using reserved time relative to evidenced installed life and reserved resource share. Collect actual device, life and capacity records; no assumed server lifespan. Apply only outside a provider inventory containing the same asset."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: allocation_original
    applies_to: "knowledge reuse, failed branches and pilot products"
    rule: "Keep all attributable failed/repeated trials in the bounded original project. Trace reused knowledge and jointly produced originals with a conserved beneficiary ledger; no dilution by unlimited future licenses. Subdivide commercial pilot products and research use using actual physical operation records; unresolved joint attribution needs review."
    source_ids:
      - oecd-frascati-2015
      - un-cpc3-originals
dataset_production:
  collection_protocols:
    - protocol_id: cp_original
      process_id: "consolidation"
      flow_role: "reference output"
      record_type: "acceptance_record"
      raw_fields: "project; original ID; version; content manifest; complete package count; dates; inception buyer/contract facts; intended sale; rights and limitations"
      collection_method: "Inspect original research records and completion checklist, deduplicate content identity and verify own-account inception and package integrity"
      unit: "item"
      frequency: "At completion"
      temporal_coverage: "Entire creation cycle"
      site_scope: "All producing sites and partners"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Signed content manifest and original records, without claiming scientific approval"
    - protocol_id: cp_energy
      process_id: "conception_investigation_evaluation_consolidation"
      flow_role: "electricity"
      record_type: "meter_record"
      raw_fields: "stage; meter; timestamps; region; voltage; kWh; attributable workload; idle/cooling boundary; provider inclusions"
      collection_method: "Calibrated submeters or verified telemetry reconciled to actual facility meter; disclose causal workload allocation and meter coverage"
      unit: "kWh"
      frequency: "Each run and project period"
      temporal_coverage: "Entire creation cycle, including failed trials"
      site_scope: "Owned facilities; purchased provider separately"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration, facility reconciliation, workload ledger and missing-time disclosure"
    - protocol_id: cp_material
      process_id: "investigation"
      flow_role: "individual material input"
      record_type: "issue_record"
      raw_fields: "specific chemical/material; CAS/composition; state/purity; mass; stock changes; method/run; supplier; loss"
      collection_method: "Weigh or use traceable mass issue/return records; measure density for volume-to-mass conversion at recorded conditions; link every actual route reagent and specimen"
      unit: "kg"
      frequency: "Each experiment and stock reconciliation"
      temporal_coverage: "All trials and storage within gate"
      site_scope: "Actual laboratories, field and pilot sites"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Balances, supply certificates, method/BOM and stock reconciliation"
    - protocol_id: cp_service
      process_id: "investigation"
      flow_role: "external tensile-test report"
      record_type: "provider_record"
      raw_fields: "provider; test method; specimens; run count; complete report; utility/material/hardware scope; project assignment"
      collection_method: "Inspect actual order and report; obtain a matching provider inventory with declared report unit and scope"
      unit: "item"
      frequency: "Each delivery"
      temporal_coverage: "Project creation cycle"
      site_scope: "Actual provider"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Provider report and inventory; embedded-flow exclusion ledger"
    - protocol_id: cp_waste
      process_id: "investigation"
      flow_role: "individual waste output"
      record_type: "transfer_record"
      raw_fields: "waste identity; polymer mass; contaminant identities; retained stocks; shipment; receiving route"
      collection_method: "Measure segregated waste and reconcile manifests; record constituent/residual substances and actual off-site treatment, not assumed clean recovery"
      unit: "kg"
      frequency: "Each transfer"
      temporal_coverage: "All project wastes and final stock"
      site_scope: "Actual site and receiving treatment"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Weighing and waste manifests; contamination assessment"
    - protocol_id: cp_emission
      process_id: "investigation"
      flow_role: "dinitrogen to air"
      record_type: "measurement_record"
      raw_fields: "nitrogen inlet; stock; recovery; transfer; vent; chemical identity; period; air subcompartment"
      collection_method: "Measure actual vent release or reconcile nitrogen mass balance with measured stocks, retained and transferred amounts; disclose uncertainty and verify immediate air compartment"
      unit: "kg"
      frequency: "Each run and stock period"
      temporal_coverage: "Represented observation period"
      site_scope: "Actual experimental site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Vent or stock records; compartment and chemical check"
    - protocol_id: cp_asset
      process_id: "infrastructure"
      flow_role: "specific server input"
      record_type: "asset_record"
      raw_fields: "server model/configuration; upstream inventory; reserved time; installed life; reserved/total capacity; provider duplication check"
      collection_method: "Inspect asset registers and reservation logs; justify actual installed-life estimate and device dataset match; retain sensitivity for life and capacity assumptions"
      unit: "item"
      frequency: "Each asset and project period"
      temporal_coverage: "Creation cycle and documented asset life"
      site_scope: "Actual owned server"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Asset evidence, capacity logs, inventory completeness and uncertainty"
  calculation_rules:
    - id: calculate_energy
      applies_to: "all electricity rows"
      rule: "Multiply attributable recorded kWh by 3.6 to obtain MJ; retain the same interface and declared original basis."
      inputs:
        - cp_energy
        - kWh
      output: "MJ"
      source_ids:
        - gsf-sci-1-1-0
    - id: calculate_project_amount
      applies_to: "all inventory rows"
      rule: "Sum only nonduplicated exchange amounts attributable to the one declared original; project subdivision and shared shares must be documented first. The reference output is exactly one complete item."
      inputs:
        - cp_original
        - "stage records"
        - "beneficiary ledger"
      output: "per declared reference flow"
      source_ids:
        - un-cpc3-originals
        - oecd-frascati-2015
        - gsf-sci-1-1-0
    - id: calculate_nitrogen_release
      applies_to: "nitrogen_air"
      rule: "Reconcile actual nitrogen input and opening stock against closing stock, recovered/transferred nitrogen and measured release. Investigate unexplained balance residual instead of declaring it all emitted."
      inputs:
        - cp_material
        - cp_emission
      output: "kg per declared reference flow"
      source_ids:
        - oecd-frascati-2015
  data_quality_requirements:
    - id: quality_identity
      applies_to: "reference output"
      requirement: "Bind actual content/version, own-account inception, completeness and reuse restrictions; count alone does not establish comparable knowledge quality."
      evidence: "cp_original; un-cpc3-originals"
    - id: quality_routes
      applies_to: "investigation"
      requirement: "Every actual research method maps to complete route-specific atomic inputs, outputs, waste and substantiated releases; distinguish absent from unknown."
      evidence: "method logs; cp_material; cp_waste; cp_emission"
    - id: quality_time
      applies_to: "all processes"
      requirement: "Use the entire declared creation period including failed trials and site/provider changes; quantify missing periods and disclose representativeness."
      evidence: "dated project and meter records"
    - id: quality_upstream
      applies_to: "all inputs"
      requirement: "Verify supplier inventories, physical properties, units, regional/temporal matches and hardware scopes; unresolved identity is a candidate gap, not an available approved dataset."
      evidence: "direct identity checks; supplier evidence"
    - id: quality_uncertainty
      applies_to: "allocation and quantities"
      requirement: "Report meter uncertainty, project attribution residuals, device life sensitivity, reused-original provenance and scope exclusions; no generic yield or energy benchmark."
      evidence: "measured and allocation evidence"
validation_rules:
  - rule_id: validate_original
    applies_to: "reference_product_original"
    rule: "Reject duplicate copies/claims/downloads counted as new originals or a commissioned service relabelled as own-account. Verify required qualifiers and one complete version."
    source_ids:
      - un-cpc3-originals
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require consistent per declared reference flow in both languages, linked raw records, numerator units and documented energy conversion. No invented knowledge mass or traffic-to-kWh relationship."
    source_ids:
      - gsf-sci-1-1-0
  - rule_id: validate_routes
    applies_to: "investigation"
    rule: "Fail dataset completeness when an actual route has unexplained materials, wastes, water fate, direct emissions or trial boundaries. Do not treat conditional absence as a zero without evidence."
    source_ids:
      - oecd-frascati-2015
  - rule_id: validate_double_count
    applies_to: "shared assets and providers"
    rule: "Reconcile provider/owned scope, stage pools and original beneficiary shares; reject the same electricity, device, purchased report or original creation burden counted twice."
    source_ids:
      - gsf-sci-1-1-0
      - un-cpc3-originals
  - rule_id: validate_identity
    applies_to: "UUID-bearing and unresolved rows"
    rule: "Verify public flow substance, supply route, reference property, unit group and elementary subcompartment. Blank identities and missing supplier layers must remain explicit; they prevent complete usable dataset claims until resolved."
    source_ids:
      - un-cpc3-originals
      - oecd-frascati-2015
      - gsf-sci-1-1-0
published_dataset_profile:
  dataset_role: "Original-creation foreground inventory for one complete identified scientific knowledge package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "After evidence completion, traceable upstream original input to research, design or product models with explicit reuse attribution"
  excluded_use: "Generic impact per patent, money, user or download; approved scientific or legal status; complete lifecycle claim from foreground alone; comparisons of nonequivalent knowledge assets"
  required_metadata: "Required reference qualifiers; process/route register; actual sites and periods; all exchange units and collection records; upstream/provider versions and scope; reuse and asset allocation ledger"
  required_quality_disclosure: "Unknown identities, missing routes/layers, measurement uncertainty, attribution residuals, device life sensitivity and limited knowledge comparability"
  update_trigger: "New original version or knowledge scope; research route change; new provider/device; revised completion cutoff, reuse ledger or measured records"
