product_category_identity:
  canonical_pcr_id: "pcr.business-and-production-services.research-and-development-services.own-account-research-development-original"
  classification_refs: "CPC 3.0 81400"
  covered_products: "Own-account versioned scientific knowledge originals for inventions, products or processes; intended sale with no contracted or known buyer at inception"
  excluded_products: "Commissioned R&D services; CPC 83920 design originals; software/data/download/broadcast products; exploration, artistic and brand assets"
  representative_product: "Own-account research and development original package"
  production_route: "Question and hypothesis → actual investigation and iterations → evidence evaluation → complete versioned original package; specific experiments and supporting infrastructure declared"
  market_state: "Completed original available for intended sale or licensing of its identified knowledge; actual rights and restrictions declared, no assumed license duration"
functional_unit:
  what: "Create one identifiable scientific original knowledge package, not perform an unspecified research hour"
  how_much: "One complete original package of one declared version"
  how_well: "Document research objective, originality evidence, investigated uncertainty, methods, datasets/specimens, verification results, limitations, integrity and reuse conditions; no claim of patent, safety or methodology approval"
  how_long_or_cycle: "One actual creation cycle from project inception through documented completion; dates measured, no generic lifetime or later-use duration"
  reference_flow_link: "reference_product_original"
system_boundary:
  rules:
    - rule_id: boundary_creation
      applies_to: "all processes"
      rule: "Include hypothesis/planning, investigation including failed trials, evidence evaluation, original documentation and attributable facilities through completion. Travel, heating, cooling, instruments, prototypes and consumables actually used must be screened and instantiated as specific exchanges; salaries are not physical flows."
      source_ids:
        - un-cpc3-originals
        - oecd-frascati-2015
        - gsf-sci-1-1-0
    - rule_id: boundary_routes
      applies_to: "investigation"
      rule: "Require an actual method-to-inventory register for every laboratory, pilot, field, survey and computing route. Expand each material, energy carrier, treatment and supported elementary release individually. Listed conditional rows are concrete route entries, not an exhaustive universal experimental recipe; absent route evidence blocks completeness."
      source_ids:
        - oecd-frascati-2015
    - rule_id: boundary_research_end
      applies_to: "prototypes and pilot plants"
      rule: "Keep research trials resolving uncertainty inside the creation cycle. Separate later routine manufacture and commercial operation; subdivide mixed-use pilot operation and physical products rather than assigning all plant burdens to knowledge."
      source_ids:
        - oecd-frascati-2015
    - rule_id: boundary_distribution
      applies_to: "original reuse and delivery"
      rule: "Keep reproduction/downloads, later hosting/network delivery, license administration and use of the invention separate from original creation. Declare any initial transfer cutoff explicitly. Reuse must carry the original burden ledger without charging its full creation inventory to every copy."
      source_ids:
        - un-cpc3-originals
    - rule_id: boundary_provider
      applies_to: "owned and purchased computing"
      rule: "Separate owned measured utilities and device inventory from complete purchased computing services; record actual provider workload, storage and traffic and its documented inventory. A provider service replaces embedded electricity/hardware; missing provider layers stay unknown."
      source_ids:
        - gsf-sci-1-1-0
boundary_abstraction:
  declared_starting_condition: "Actual project inception with existing knowledge, specimens and facilities identified; earlier reused original burdens are not assumed zero"
  starting_condition_role: "Foreground collection boundary with linked upstream supplies"
  product_classification_scope: "CPC 3.0 81400"
  recursive_input_rule: "Track reused or purchased research originals once with a matching upstream inventory and an explicit beneficiary ledger; in-house expanded work replaces the corresponding purchased exchange"
  upstream_dataset_requirement: "Actual supplied state, region/year, device configuration, reagent purity, provider work scope and treatment technology; quantify missing layers before a complete lifecycle claim"
  disclosure: "Project start/end, actual methods, failed branches, reused knowledge, make/buy boundaries, materiality and unknown inventories; foreground-only is not complete cradle-to-gate"
