    used_for: "Economic product boundary, own-account inception and scientific/design distinction; no quantitative LCA factors"
  - id: "oecd-frascati-2015"
    type: "official_guidance"
    reference: "OECD Frascati Manual 2015, DOI 10.1787/9789264239012-en; §§2.5–2.8, 2.32–2.36, 2.49–2.54 and Table 2.3; printed pp.44–45, 51–52, 60–62 (PDF pp.46–47, 53–54, 62–64)"
    used_for: "Research activity, uncertainty, prototypes and pilot/commercial split; statistical definitions are not LCA allocation factors or measured consumptions"
  - id: "gsf-sci-1-1-0"
    type: "standard"
    reference: "Green Software Foundation, Software Carbon Intensity specification 1.1.0, sections Energy, Embodied emissions, Software boundary, Quantification method: https://sci.greensoftware.foundation/"
    used_for: "Computing energy and asset attribution only; transfer of measured workload principles, not the SCI carbon score as full original LCA"
