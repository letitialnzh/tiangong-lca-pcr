product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.special-purpose-civil-installation-delivery"
  classification_refs: "CPC 3.0 53290 — Other civil engineering works"
  covered_products: "Accepted forts/blockhouses/bunkers/military ranges and test centres, satellite launching sites, waste dumps/incinerators, nuclear-material treatment/processing installations with measured functional configuration; n.e.c. facilities require separate route evidence"
  excluded_products: "Construction services; bulk materials and factory-gate equipment; ordinary buildings; other dedicated construction categories; post-handover operation, maintenance, closure and decommissioning"
  representative_product: "One complete special-purpose civil installation with declared route, site, as-built configuration and acceptance scope; no single default technology represents every branch"
  production_route: "Actual site/civil works → required containment/protective/thermal/launch/nuclear installation → real inspection and commissioning → delimited physical handover"
  market_state: "Fixed installation delivered at the declared acceptance endpoint, not lifetime operating service"
functional_unit:
  what: "Constructed special-purpose installation performing the declared site function within its actual route and system interface"
  how_much: "One complete delivered entity; measured site area, lengths/heights, cell volumes and actual capacity are route-specific qualifiers"
  how_well: "Matches the same as-built specification, operating conditions, component completeness and actual acceptance evidence; regulatory authorization is not inferred"
  how_long_or_cycle: "One actual construction-to-declared-handover cycle; no service life or future operating cycles assigned"
  reference_flow_link: "accepted_installation"
system_boundary:
  rules:
    - rule_id: boundary_entity
      applies_to: "reference product"
      rule: "The output is the constructed physical installation, including integral permanent equipment/services and real acceptance needed for its declared function. Standalone ordinary buildings, roads, dams/flood schemes, power plants, manufacturing/mining plants, sewage/water-treatment plants and outdoor recreation works remain their own categories. Bound shared interfaces and account for every integral asset once."
      source_ids:
        - un-cpc-civil-2025
    - rule_id: boundary_stage
      applies_to: "dataset"
      rule: "The base foreground covers actual supplier-gate-to-site logistics, surveyed site preparation, civil construction, route-specific installation, temporary works, inspection and commissioning through the declared handover. Supplier material/equipment manufacture is linked separately with compatible datasets and explicit gaps. This is not evidence of complete cradle-to-gate or full lifetime coverage."
      source_ids:
        - un-cpc-civil-2025
    - rule_id: boundary_route
      applies_to: "all inventory rows"
      rule: "Select the real route before collecting the inventory. The cards are distinct conditional exchanges, not a universal recipe. Reconcile the full as-built functional-system register: landfill cells/liners/leachate; military earth protection/structures/targets/support; launch pad/trench/ground fluid and control systems; incinerator reception/thermal/cleaning/ash/recovery; nuclear processing/containment/shielding/safety. Add one exact atomic row for every actual missing component, batch ingredient, test consumable, packaging, waste and release. A residual n.e.c. work needs its own evidenced route/system closure and exclusion check; this PCR alone does not establish its technical design."
      source_ids:
        - un-cpc-civil-2025
        - epa-industrial-waste-guide
        - dod-firing-ranges-2025
        - nasa-launch-construction-2018
        - jrc-waste-incineration-2019
        - iaea-ssr4-2017
    - rule_id: boundary_embedded
      applies_to: "all inventory rows"
      rule: "Record either supplied complete assemblies or their actual on-site fabrication inputs for the same scope; do not count both. Exclude contained steel/lining/filter/controls from separate rows unless genuinely outside the assembly. Record existing foundations and reused equipment with retained-state, repair and prior-burden evidence. Maintain internal versus external material/water interfaces."
      source_ids:
        - jrc-waste-incineration-2019
        - iaea-ssr4-2017
    - rule_id: boundary_tests
      applies_to: "acceptance"
      rule: "Declare mechanical/cold/wet/hot/active test stages actually needed and completed. Include actual test fuel, water, electricity, purge substances, trial feed, products, residues and measured releases before the endpoint, adding exact individual rows. Do not assume a launch/firing/active-nuclear/waste-incineration trial occurs or is zero-burden. Necessary unfinished tests prevent complete handover claims; split later regular operation by records. Test results do not establish regulatory approval."
      source_ids:
        - dod-firing-ranges-2025
        - nasa-launch-water-test-2018
        - iaea-ssr4-2017
    - rule_id: boundary_environment
      applies_to: "site_support"
      rule: "Separate direct resource extraction, purchased water, waste-liquid transfers and liquid receptor releases. Land transformation/occupation requires measured prior/post land use and actual area/time; noise requires source/receptor, levels, duration/frequency and method, not a fabricated additive mass exchange. Actual pollutants, soil contamination, blasting and marine releases need separate identity/activity evidence. Missing characterization or measurements remain gaps, not zero impacts."
      source_ids:
        - epa-construction-dust-1995
        - epa-concrete-washout-2012
    - rule_id: boundary_later
      applies_to: "dataset"
      rule: "Operating waste receipt/incineration, launches, military use and nuclear material processing after handover are separate stages. Maintenance, relining, component replacement, closure, demolition, radioactive decommissioning and destinations are separately modelled only from evidenced schedules and quantities; no default life, waste conversion or recycling credit. Construction commissioning is not hidden in later operation."
      source_ids:
        - un-cpc-civil-2025
        - iaea-ssr4-2017
boundary_abstraction:
  declared_starting_condition: "Surveyed actual site, retained/clearance/remediation state and supplier-gate/site interfaces"
  starting_condition_role: "Recorded construction start, not a zero-burden assumption for land, existing works or equipment"
  product_classification_scope: "Special-purpose fixed installations identified by CPC3.0 53290 context and actual exclusion boundaries"
  recursive_input_rule: "Retained/purchased same-category installation modules are real assets with supplier and prior-burden records, not recursively created complete entities"
  upstream_dataset_requirement: "Separately link upstream materials/equipment and logistics matching real material/interface/route; disclose gaps"
  disclosure: "Route/function/completeness, site geometry, dates/acceptance, embedded components, shared-asset shares, water/releases/land/noise, later stages and unmeasured gaps"
