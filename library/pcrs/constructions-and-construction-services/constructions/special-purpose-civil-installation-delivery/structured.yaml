allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "The attribution requirements below are authored foreground-accounting rules grounded in actual project subdivision and cp_assets records; classification evidence does not establish allocation coefficients. Unknown beneficiaries/activity/lifetime data remain under review with no default shares."
    source_ids: []
  - rule_id: allocation_subdivide
    applies_to: "construction work packages"
    rule: "Use measured physical subdivision before allocation: delivered entity/cell, retained asset, regular-operation output and other project beneficiaries must have separate identifiable records. Shared logistics, test utilities and civil structures use traceable actual meters, work activity and geometric interfaces. Cost alone does not establish physical attribution; unknown shares remain review."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "steel_formwork; crane_share"
    rule: "Maintain a cross-project/period/reuse asset register. Manufacture share is dimensionless and supported by actual lifetime activity or a justified beneficiary basis; cumulative assigned shares ≤1. Do not reset full burden each project or invent life/uses. Physical net mass/configuration and share are distinct fields. Current fuel, transport, repairs and new consumable replacement are separately attributable; incomplete lifetime evidence blocks a final allocated burden. This is an authored foreground-accounting requirement based on cp_assets, not a CPC classification rule. Where service is expressed on a comparable actual activity basis, the project share is attributable project activity divided by evidenced total same-asset service; retain prior shares and update the common denominator consistently."
    source_ids: []
  - rule_id: allocation_residues
    applies_to: "waste and trial outputs"
    rule: "Do not grant automatic avoided-production or energy-recovery credits. Segregated exported scrap/soil/concrete, returned products and internal reuse have distinct status, quantity and receivers. If saleable commissioning output coexists, subdivide actual activities or document a reasoned physical allocation with complete balances and uncertainty; never substitute operating waste throughput for the construction reference."
    source_ids:
      - jrc-waste-incineration-2019
      - epa-concrete-washout-2012
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "accepted_installation"
      record_type: "acceptance register"
      raw_fields: "entity identifier; route; site/interfaces; as-built/measured geometry; structure/material; actual capacity/unit/conditions; retained assets; system completeness; test dates/results/gaps"
      collection_method: "Reconcile survey, as-built drawings, system/component register and signed handover to the same entity; no assumed geometry/capacity"
      unit: "item"
      frequency: "each acceptance milestone and final handover"
      temporal_coverage: "actual construction through declared handover"
      site_scope: "same site and all delimited systems"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated survey; as-built deviations; signed test/acceptance and gaps; per declared reference flow; output 1 item"
    - protocol_id: cp_civil
      process_id: "civil"
      flow_role: "civil atomic inputs"
      record_type: "material and geometry ledger"
      raw_fields: "work package; each material specification; delivery/installed/return/waste quantities; mix tickets; strength/exposure specification; bank/fresh state; density/moisture evidence"
      collection_method: "Reconcile calibrated weighing/volume ledger and as-built geometry with receipts; separately record earthworks, reinforcement, formwork, placing, compaction, curing and actual precast/site-batching route"
      unit: "kg; m3"
      frequency: "each batch/work package"
      temporal_coverage: "full actual construction period"
      site_scope: "all civil works and integral interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "scale/meter calibration, material tickets and balance differences; per declared reference flow; distinguish states and reconcile balances"
    - protocol_id: cp_activity
      process_id: "site_support"
      flow_role: "diesel; electricity_lv"
      record_type: "meter and activity ledger"
      raw_fields: "equipment/vehicle ID; process; work period; region/voltage; meter readings; fuel stock/receipts/returns; batch density/LHV/carbon origin; trip/load and supplier interface"
      collection_method: "Submeter construction/tests; match calibrated fuel weighing/meters to shift/trip logs; cover subcontractors; separate fuel, generator output and supplied user electricity"
      unit: "kg; kWh; MJ"
      frequency: "each shift/trip and test"
      temporal_coverage: "all construction, logistics and declared commissioning"
      site_scope: "actual equipment, logistics and every route utility"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration, supplier conditions, stock balance and attribution evidence; per declared reference flow; attributable by work package without duplication"
    - protocol_id: cp_water
      process_id: "site_support"
      flow_role: "site_water; groundwater; fresh_discharge"
      record_type: "separate water ledger"
      raw_fields: "water source/medium; metering interface; start/end volumes; receiver; salinity/temperature/composition; test and recirculation volume; extraction location/aquifer; destination"
      collection_method: "Meter supply, direct resource extraction, recirculation, contained effluent and receptor discharge separately; reconcile water ledger with stocks/evaporation measured or under review"
      unit: "m3"
      frequency: "each shift and test/discharge"
      temporal_coverage: "actual construction to handover"
      site_scope: "supply gates, wells and actual receiver outfalls"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration, source/destination records and composition tests; per declared reference flow; each interface counted once"
    - protocol_id: cp_assets
      process_id: "site_support"
      flow_role: "steel_formwork; crane_share"
      record_type: "cumulative asset register"
      raw_fields: "asset ID; same-configuration net mass/weighing; physical scope; previous projects/shares; actual current/lifetime activities/beneficiaries; repair/replacement; unproven life"
      collection_method: "Reconcile complete configuration by traceable weighing/supplier net mass; derive dimensionless manufacture share from cross-project register and check cumulative ≤1; unknown remains review"
      unit: "kg; dimensionless share"
      frequency: "each entry/exit/reuse and attribution"
      temporal_coverage: "current construction and all allocated lifetime records"
      site_scope: "actual equipment/formwork assets and all beneficiaries"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "net-mass originals, configuration and cumulative-share conservation; per declared reference flow; manufacture share distinct from current energy"
    - protocol_id: cp_liner
      process_id: "containment"
      flow_role: "liner_clay; hdpe_liner; hdpe_pipe; geotextile"
      record_type: "liner and drainage CQA ledger"
      raw_fields: "cell ID; geometry/thickness/lifts; material grade/wet mass/area; overlaps/joints; seams/coupons; density/permeability tests; drainage pipes/filter components; loss destination"
      collection_method: "Record construction and hold-point acceptance against actual project design; reconcile supply/installation/returns/coupons/waste; historical guide does not replace current design/tests"
      unit: "kg; m2; m3"
      frequency: "each batch/panel/lift/hold-point acceptance"
      temporal_coverage: "entire actual containment installation"
      site_scope: "actual cell and drainage interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "material, seam/compaction/permeability test and as-built evidence; per declared reference flow; same-material/state cell reconciliation"
    - protocol_id: cp_install
      process_id: "acceptance"
      flow_role: "route-specific installed assemblies"
      record_type: "system and installation ledger"
      raw_fields: "route/work-package/component IDs; complete configuration/BOM scope; net count/weighing/volume; material/grade/state; interfaces; welding/installation; actual cold/wet/hot/active tests; consumables/feed/products/waste/releases"
      collection_method: "Reconcile supplied, installed and accepted systems individually; calibrated weighing/meters retain same-configuration net mass; avoid assembly/embedded overlap; atomize real test feeds and all additional components"
      unit: "item; kg; m3"
      frequency: "each component and test"
      temporal_coverage: "route installation through declared acceptance"
      site_scope: "actual military/launch/incineration/nuclear systems"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier configuration, QA, weld/leak/function tests and signoff; per declared reference flow; full system/test closure"
    - protocol_id: cp_waste
      process_id: "civil"
      flow_role: "soil_disposal; concrete_debris; washwater"
      record_type: "segregated waste ledger"
      raw_fields: "atomic material; source process; contamination/waste status; solid/liquid phase; measured amount; moisture/density and volume state; internal reuse/return; receiver/transport/treatment"
      collection_method: "Separately weigh/meter each material and reconcile transfer notes; never combine solids/liquids; distinguish internal flows, product returns and environmental releases"
      unit: "kg; m3"
      frequency: "each load/transfer"
      temporal_coverage: "all construction and acceptance"
      site_scope: "each actual generating operation and external receiver"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighing/metering, contamination analysis and receiver evidence; per declared reference flow; reconcile stocks and destinations"
    - protocol_id: cp_release
      process_id: "site_support"
      flow_role: "co2_fossil; no; no2; dust"
      record_type: "species and source release evidence"
      raw_fields: "real activity/period; species/CAS; fossil/biogenic origin; medium/submedium; controls; sampling or original factor/applicability; external release; land use/area/time; noise receptor/level/duration"
      collection_method: "Measure exact external species release or calculate from independently supported site activity/parameters; retain controls/uncertainty; observe land/noise separately without forced mass exchanges; absent data remain gaps"
      unit: "kg; environmental context units"
      frequency: "actual emitting activities and representative sampling"
      temporal_coverage: "all construction and declared tests"
      site_scope: "actual site sources and external receivers"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "analysis/factor originals, compartment/activity coverage and controls; per declared reference flow; aggregate exact species and non-overlapping scopes separately"
  calculation_rules:
    - id: attribute_entity
      applies_to: "all inventory rows"
      rule: "Aggregate each measured attributable atomic exchange within the same accepted entity; output is 1 item with no further division by assumed mass/area/life. Physically subdivide shared interfaces first; unknown stays unknown."
      inputs:
        - "raw ledgers"
        - cp_acceptance
        - "actual interface/attribution records"
      output: "each atomic quantity per declared reference flow"
      source_ids: []
    - id: convert_energy
      applies_to: "electricity_lv"
      rule: "MJ = measured kWh × 3.6; preserve original readings and actual voltage/region."
      inputs:
        - cp_activity
        - kWh
      output: "MJ"
      source_ids:
        - nist-si-energy
    - id: convert_density
      applies_to: "fresh_concrete; soil_disposal; diesel; site_water; shield_concrete"
      rule: "Only when a mass/volume conversion is needed and same-state density is evidenced: kg = measured m3 × same-state kg/m3. Retain raw quantity, density method, temperature/moisture/salinity and uncertainty; never guess unknown density."
      inputs:
        - "measured volume"
        - "same-state density evidence"
        - "relevant collection protocol"
      output: "traceable converted kg and original m3"
      source_ids: []
    - id: allocate_manufacture
      applies_to: "steel_formwork; crane_share"
      rule: "Attributable manufacture-equivalent kg = measured same-configuration asset net kg × evidenced dimensionless manufacture share; sum across every project/period/reuse for each asset ≤1. Unknown lifetime-activity/beneficiary evidence prevents final shares; current operation is separate."
      inputs:
        - cp_assets
        - "net mass and cumulative-share records"
      output: "manufacture-equivalent kg per declared reference flow and unresolved shares"
      source_ids: []
    - id: material_balance
      applies_to: "all inventory rows"
      rule: "For the same material/state reconcile receipts + opening stock = installed/consumed + returned + exported waste + closing stock + evidenced loss; do not duplicate internal transfers. Do not add different volume states or solid/liquid phases; explain discrepancies."
      inputs:
        - "same-state ledgers"
        - "original measurements/destinations"
      output: "material balance and discrepancy disclosure"
      source_ids:
        - epa-concrete-washout-2012
  data_quality_requirements:
    - id: quality_function
      applies_to: "reference product"
      requirement: "Actual function, geometry/capacity, configuration and acceptance match the same entity; do not compare bare counts across facility types"
      evidence: "cp_acceptance as-built/acceptance originals"
    - id: quality_coverage
      applies_to: "all inventory rows"
      requirement: "Cover every actual work package/subcontract, permanent system, test and atomic exchange; label occurred, evidenced absent, unknown and gaps"
      evidence: "full system/BOM and amount/destination ledgers"
    - id: quality_source
      applies_to: "dataset"
      requirement: "Historical sources are bounded component/method examples; no design numbers/life transferred; current project standards/authorization independently checked"
      evidence: "original sources, scope/date and actual project technical evidence"
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match actual material/form/route/geography, reference property/unit and environmental compartment; unresolved identities retain exact rows; official Chinese names agree"
      evidence: "verified originals and project qualifiers"
    - id: quality_time
      applies_to: "dataset"
      requirement: "Use complete actual construction/test period; disclose supply-year/technology representativeness, rework and metering gaps"
      evidence: "schedule, shift logs, calibration and correction evidence"
    - id: quality_share
      applies_to: "steel_formwork; crane_share"
      requirement: "Retain same-configuration net mass and lifetime activity/beneficiary evidence; conserve cumulative shares; no defaults for unknowns"
      evidence: "cp_assets cross-project audited register"
validation_rules:
  - rule_id: validate_scope
    applies_to: "dataset"
    rule: "Verify the route, site and complete physical system against the as-built/acceptance register and classification exclusions. Missing required systems/tests must be reported as incomplete; an empty or unrelated route is not a complete facility."
    source_ids:
      - un-cpc-civil-2025
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Require 1 item output and per-declared-reference-flow inventory/protocol coverage for the exact same accepted installation. Check actual geometry/capacity, volume state, stock/returns/waste and unit conversions. No implicit count-to-mass/area/lifetime conversion or unsupported density."
    source_ids:
      - un-cpc-civil-2025
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "For each selected identity recheck substance/form, route, grade, region/interface, reference property and unit group; elementary compartment/subcompartment and temporal nature must match. Unresolved UUIDs stay specific and registered. Official localized names must agree. Fuel occurrence does not prove emissions, NOx-equivalent does not prove molecular NO/NO2, and untreated effluent transfer is not water emission."
    source_ids:
      - epa-concrete-washout-2012
  - rule_id: validate_closure
    applies_to: "dataset"
    rule: "Check mandatory and actual conditional work packages, installed-system/BOM coverage, commissioning records, environmental gaps and cumulative asset shares. Unmeasured rows and omitted significant interfaces are unresolved coverage, never zero. Report checked/skipped scopes and uncertainty; do not assert full cradle-to-gate, lifetime or regulatory/methodology approval."
    source_ids:
      - iaea-ssr4-2017
      - epa-construction-dust-1995
published_dataset_profile:
  dataset_role: "Foreground process data package for special-purpose installation construction and declared accepted delivery"
  downstream_use: "Construction assessment for matching route/function/configuration and explicitly linked expanded facility lifecycle studies"
  allowed_use: "Inventory within verified entity and actual construction/test scope; upstream links and asset attribution under disclosed conditions"
  excluded_use: "Bare-count cross-route comparison; default per-installation burden; operating waste-treatment/launch/nuclear-processing factors; automatic lifetime/environmental compliance/methodology approval"
  required_metadata: "PCR/entity ID; route/site; measured geometry/actual capacity; permanent-system/BOM boundaries; retained assets; material states/supply interfaces; construction/acceptance dates; actual test endpoint; allocation and stage interfaces"
  required_quality_disclosure: "Data sources/measurement/representativeness; unknown identities/amounts; omitted components/tests/upstream/environment and later stages; asset shares and uncertainty; review states follow their metadata"
  update_trigger: "Changed function/system/geometry/material/route; rework/test endpoint; identity/source revision; new reliable measurement; asset share/beneficiary change"
data_sources:
  - id: "un-cpc-civil-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF p282; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Physical construction categories and distinction from construction services; official residual scope, not design requirements."
  - id: "epa-industrial-waste-guide"
    type: "official_guidance"
    reference: "US EPA, Guide for Industrial Waste Management, 2003, Chapter7B pp7B-1–7B-36 and introductory scope ppvii–x; https://www.epa.gov/sites/default/files/2016-03/documents/industrial-waste-guide.pdf"
    used_for: "Historical non-hazardous industrial-waste containment component/design/installation examples. Excludes municipal/hazardous/mixed radioactive/mining waste; no copied numerical design criteria or universal liner route."
  - id: "dod-firing-ranges-2025"
    type: "official_guidance"
    reference: "DoD, UFC4-179-02 Small Arms Ranges, 5 March2020, Change1 13 March2025, §§3-8.1,3-10.2–3-11,4-16,4-21.6, pp16,21–22,40,54–55; https://www.wbdg.org/FFC/DOD/UFC/ufc_4_179_02_2020_c1.pdf"
    used_for: "Range drainage, protective assemblies and ventilation acceptance examples; not complete bunker/fort design or universal worldwide criteria."
  - id: "nasa-launch-construction-2018"
    type: "official_guidance"
    reference: "NASA, Launch Pad39B Flame Trench Nears Completion, 29 May2018, main construction description; https://www.nasa.gov/humans-in-space/launch-pad-39b-flame-trench-nears-completion/"
    used_for: "Historical steel flame-deflector/trench assembly example; project quantities and mission data are not defaults."
  - id: "nasa-launch-water-test-2018"
    type: "official_guidance"
    reference: "NASA, Successful Water Flow Test at Launch Pad39B, October2018, main test description; https://www.nasa.gov/image-article/successful-water-flow-test-launch-pad-39b/"
    used_for: "Actual deluge-system acceptance-test example; collect project test water/energy, do not transfer operational water quantities."
  - id: "jrc-waste-incineration-2019"
    type: "official_guidance"
    reference: "European Commission JRC, Waste Incineration BREF, 2019, EUR29971 EN, doi:10.2760/761437, §2.2.1.3.2 p25/PDF59 and rotary-kiln discussion pp47–50/PDF81–84; https://publications.jrc.ec.europa.eu/repository/bitstream/JRC118637/jrc118637_wi_bref_2019_published.pdf"
    used_for: "Installed reception, refractory-lined thermal and flue-gas system examples; not a construction bill of quantities, mandatory single technology, or operating-emission factor."
  - id: "iaea-ssr4-2017"
    type: "official_guidance"
    reference: "IAEA, Safety of Nuclear Fuel Cycle Facilities, SSR-4, 2017, §1.8 p3, Requirement53 pp82–83 and Requirement54 pp83–89; https://www-pub.iaea.org/MTCD/Publications/PDF/PUB1791_web.pdf"
    used_for: "Fuel-cycle construction QA/as-built and cold/active commissioning; excludes reactors/natural ore processing/waste disposal. Actual authorization and site criteria remain project evidence."
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA, Concrete Washout, EPA833-F-11-006, February2012, pp1–2; https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Historical construction washout containment, liquid/solid separation and recovery examples; no default pH or discharge factor transferred."
  - id: "epa-construction-dust-1995"
    type: "official_guidance"
    reference: "US EPA, AP-42 §13.2.3 Heavy Construction Operations, January1995 with posted corrections, pp13.2.3-1–2; https://www.epa.gov/sites/default/files/2020-10/documents/13.2.3_heavy_construction_operations.pdf"
    used_for: "Historical source-operation/weather/control and TSP-factor limitation; no default area/month factor or invented size fraction."
  - id: "nist-si-energy"
    type: "official_guidance"
    reference: "NIST SP811 (2008), Guide to the SI, Appendix B.9, Energy table, kilowatt hour→megajoule; https://www.nist.gov/pml/special-publication-811/nist-guide-si-appendix-b-conversion-factors/nist-guide-si-appendix-b9"
    used_for: "Exact unit conversion 1 kWh=3.6 MJ; retained conversion is unaffected by the 2019 base-unit revision; not a fuel heating value or emission factor."
  - id: "epa-msw-landfills"
    type: "official_guidance"
    reference: "US EPA, Municipal Solid Waste Landfills, official overview, composite-liner and leachate-collection description; https://www.epa.gov/landfills/municipal-solid-waste-landfills"
    used_for: "Municipal landfill component example, distinct from the industrial-waste guide; actual jurisdiction/design governs. No numerical liner/operating criteria transferred."
