measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Output is 1 item of the same accepted complete installation; use cp_acceptance. All rows/protocols aggregate per declared reference flow; item and 件 are public Item(s) single-count aliases."
  - id: volume_state
    applies_to: "fresh_concrete; soil_disposal; site_water; washwater; groundwater; fresh_discharge; shield_concrete"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Use cp_civil, cp_waste, cp_water and cp_install to retain actual volume state; bank/loose soil, fresh concrete and supply/extraction/discharge water are distinct. Volume-to-mass uses measured/evidenced density at the same state, temperature/moisture/salinity; no default 1000 kg/m3."
  - id: sheet_area
    applies_to: "hdpe_liner; geotextile"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "cp_liner records actual supplied/installed area, thickness, overlap and coupons; area numerator is attributable per declared reference flow. No kg inferred without evidenced areal mass/density."
  - id: electricity_energy
    applies_to: "electricity_lv"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve public Net calorific value and energy unit group; cp_activity records actual CN/<1 kV user conditions. Convert original kWh by 1 kWh=3.6 MJ, never confuse it with diesel mass."
  - id: asset_share
    applies_to: "steel_formwork; crane_share"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "cp_assets uses measured net mass or traceable supplier weighing of the complete same-configuration asset, not facility mass. A separate dimensionless manufacture share requires lifetime-activity evidence and cumulative conservation ≤1."
