review_metadata:
  scientific_review: pending
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  semantic_boundary_review:
    decision: Distinct actual special-purpose physical installations with
      route-specific construction/installation/acceptance needs; classification
      residual alone is insufficient.
    official_scope: "UNSD CPC3.0 30June2025 printed/PDF p282: military works;
      satellite launching sites; waste dumps/incinerators; nuclear-material
      treatment/processing; n.e.c. civil works."
    reuse_checks:
      - Local other-civil-engineering-works remains an untouched empty scaffold.
      - Integration industrial/agricultural building, roads, waterworks/dams and
        other construction methods have different output boundaries; actual
        ledgers/asset conservation/interface principles reused only.
      - Batch specialized-manufacturing-facility-delivery explicitly excludes
        waste-incineration and nuclear-material processing facilities;
        sewage/water treatment and outdoor recreation remain separate.
      - No material landfill/waste-dump delivery record was identified in the
        inspected material manifest sets; no candidate/publication status is
        inferred as approval.
    n_e_c_condition: Independently establish exclusion from dedicated engineering
      categories and actual evidenced route/system closure before applying to an
      unlisted installation.
  unresolved_flow_identities:
    - row_id: fresh_concrete
      flow_name: Fresh ready-mixed Portland-cement concrete before placement
      reason: Placed/site-mixed concrete and generic factory concrete with
        prefabricated-component classification do not verify fresh ready-mix
        supply state.
    - row_id: concrete_debris
      flow_name: Hardened Portland-cement concrete offcuts sent for treatment
      reason: No directly verified pure hardened-concrete waste identity; mixed waste
        and recycled product candidates rejected.
    - row_id: soil_disposal
      flow_name: Non-contaminated excavated mineral soil sent for disposal
      reason: Excavated-soil candidate is a product and refers to contaminated-soil
        removal; not clean disposal waste.
    - row_id: site_water
      flow_name: Supplied liquid freshwater for construction and acceptance tests
      reason: Verified water candidates have factory-gate, region or remediation-route
        limitations; site-delivery supply chain not established.
    - row_id: steel_formwork
      flow_name: Reusable fabricated steel formwork panel manufacture share
      reason: Mixed structural steel is not a fabricated reusable formwork panel.
    - row_id: crane_share
      flow_name: Mobile construction crane manufacture share
      reason: Public Crane system is a truck-mount subassembly, not the complete
        mobile crane; the broad derricks/cranes/lifting-frame family does not
        establish the actual complete configuration. No claim of database
        absence.
    - row_id: washwater
      flow_name: Collected alkaline concrete washout water sent for treatment
      reason: Wastewater generic/direct-release and manganese-washing routes do not
        verify alkaline concrete washout transferred to treatment.
    - row_id: hdpe_liner
      flow_name: HDPE landfill geomembrane sheet
      reason: Public HDPE sheet is a source-specific 2 mm Korean soil-remediation
        biopile input; route/interface mismatch, not rejection merely because
        Area differs from Mass.
    - row_id: hdpe_pipe
      flow_name: Perforated HDPE leachate drainage pipe
      reason: Bounded HDPE/pipe searches did not directly verify a perforated leachate
        drainage pipe with matching configuration.
    - row_id: geotextile
      flow_name: Polypropylene nonwoven drainage filter geotextile
      reason: Public directly verified polypropylene textile is an Area/m2 nonwoven
        layer specific to a South Korean biopile remediation case; it does not
        establish the actual landfill drainage/filter interface. Area is valid
        and not rejected merely for differing from Mass.
    - row_id: ballistic_plate
      flow_name: Ballistic steel protective plate
      reason: Generic steel sheet does not verify ballistic grade; official Chinese
        baseName also conflicts with English/material description.
    - row_id: protective_door
      flow_name: Installed steel protective bunker door assembly
      reason: No configuration-matched protective-door product identity directly
        verified.
    - row_id: range_fan
      flow_name: Installed firing-range extraction fan assembly
      reason: Search candidates do not establish the installed range extraction
        configuration.
    - row_id: flame_deflector
      flow_name: Fabricated steel launch flame-deflector assembly
      reason: Generic steel product is not a fabricated complete launch
        flame-deflector assembly.
    - row_id: deluge_pump
      flow_name: Installed launch-pad water-deluge pump assembly
      reason: No directly verified launch-deluge pump assembly configuration adopted.
    - row_id: launch_pipe
      flow_name: Austenitic stainless-steel launch-site fluid pipe
      reason: No direct read establishes the actual launch-site alloy,
        cryogenic/pressure and assembly boundary.
    - row_id: incinerator
      flow_name: Installed rotary-kiln waste-incinerator assembly
      reason: Generic incineration service/electricity identities are not installed
        rotary-kiln equipment.
    - row_id: baghouse
      flow_name: Installed waste-incinerator baghouse assembly
      reason: No configuration-matched installed incinerator baghouse identity adopted.
    - row_id: shield_concrete
      flow_name: Fresh heavyweight cement concrete for nuclear shielding
      reason: Ordinary concrete identities do not verify actual heavyweight shielding
        mix and state.
    - row_id: glovebox
      flow_name: Installed stainless-steel nuclear-material glovebox
      reason: No directly verified installed nuclear-material glovebox with actual
        containment configuration.
    - row_id: hepa
      flow_name: Installed HEPA nuclear-facility exhaust filter module
      reason: No actual class/housing/configuration-matched nuclear exhaust module
        directly verified.
    - row_id: accepted_installation
      flow_name: Accepted complete special-purpose civil installation
      reason: Focused bounded searches for bunker/launch/site construction/nuclear and
        incinerator construction did not verify a complete delivered
        installation flow matching this reference; supplier materials, equipment
        and treatment services are not this output.
  unresolved_evidence:
    - Current project-specific military fort/bunker/testing-centre technical
      design is required; small-arms range source does not cover all military
      works.
    - Historical NASA, EPA and JRC component examples do not supply universal
      quantities, emissions, life or authorization.
    - Actual route/system, hot/active test feeds/products/releases and
      land/noise/contamination coverage must be completed per project; no
      invented default exchanges.
    - Reusable-asset lifetime/beneficiary evidence and unknown cumulative shares
      require scientific review before a final allocated dataset.
