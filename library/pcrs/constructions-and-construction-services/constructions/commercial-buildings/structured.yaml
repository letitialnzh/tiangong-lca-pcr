system_boundary:
  rules:
    - rule_id: boundary_gate
      applies_to: "all nodes"
      rule: "Include product supply, freight and construction/commissioning through signed handover; label use and end-of-life scenarios separately."
      source_ids:
        - src_ec_levels
    - rule_id: boundary_use
      applies_to: "building"
      rule: "Include fixed systems in the building contract; exclude movable tenant equipment, vehicles, fuel tanks/pumps and industrial production plant."
      source_ids:
        - src_unsd_53122
    - rule_id: boundary_secondary
      applies_to: "recovered inputs"
      rule: "Declare origin and recovery handoff, then apply one upstream burden or cut-off convention without prior-burden duplication."
      source_ids:
        - src_iso_21930
    - rule_id: boundary_shared
      applies_to: "site plant and temporary services"
      rule: "Name all consuming nodes/buildings and the project period; attribute measured burden once by physical use."
      source_ids:
        - src_ec_levels
