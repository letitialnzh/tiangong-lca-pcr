allocation_rules:
  - rule_id: allocate_shared
    applies_to: "cranes, generators, temporary services and site works"
    rule: "Enumerate consuming nodes/buildings and project period; use measured hours/meters or disclosed physical proxy; shares reconcile to one total."
    source_ids:
      - src_ec_levels
  - rule_id: allocate_secondary
    applies_to: "recovered components"
    rule: "Record prior use and recovery handoff, choose one upstream burden or cut-off method, and add current transport/processing once."
    source_ids:
      - src_iso_21930
  - rule_id: allocate_rework
    applies_to: "rejected assemblies"
    rule: "Retain original burden at producing node, add incremental rework once and pass only re-inspected accepted states; final exits are not building co-products."
    source_ids: []
  - rule_id: allocate_multiple
    applies_to: "separately accepted buildings"
    rule: "Measure each building separately and distribute shared work by actual use, not an office/warehouse average."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "all_three_nodes"
      flow_role: "supplies and fixed systems"
      record_type: "drawings; bill; tickets"
      raw_fields: "use; product; grade; supplier; delivered; installed; secondary_origin; recovery_handoff"
      collection_method: "reconcile deliveries and as-built bills"
      unit: "kg; m3; item"
      frequency: "each delivery"
      temporal_coverage: "project"
      site_scope: "building and supplier"
      aggregation_rule: "sum by product/node; separate returns and rejects"
      quality_evidence: "tickets; plans; declarations"
    - protocol_id: cp_site
      process_id: "site_foundations_services_handover"
      flow_role: "construction/test energy"
      record_type: "meter; fuel/equipment log"
      raw_fields: "carrier; quantity; unit; node; period; equipment_hours"
      collection_method: "meter/ticket and log reconciliation"
      unit: "kWh; L; kg; h"
      frequency: "meter period/shift"
      temporal_coverage: "through handover"
      site_scope: "site"
      aggregation_rule: "sum by carrier/node; shared use once"
      quality_evidence: "readings; invoices; shift log"
    - protocol_id: cp_freight
      process_id: "shell_assembly"
      flow_role: "inbound transport"
      record_type: "waybill"
      raw_fields: "product; mode; load_t; leg_km; return"
      collection_method: "reconcile supplier and route"
      unit: "t; km"
      frequency: "each leg"
      temporal_coverage: "project"
      site_scope: "supplier to site"
      aggregation_rule: "tonnes times km by leg"
      quality_evidence: "waybill; route"
    - protocol_id: cp_rejects
      process_id: "all_three_nodes"
      flow_role: "rejects and exits"
      record_type: "inspection; weighbridge"
      raw_fields: "node; material; mass; rework; return; recovery; disposal; destination"
      collection_method: "reconcile material balance"
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "project"
      site_scope: "site/handler"
      aggregation_rule: "final exit once"
      quality_evidence: "inspection; receipt"
    - protocol_id: cp_acceptance
      process_id: "all_three_nodes"
      flow_role: "accepted states"
      record_type: "as-built drawing; sign-off"
      raw_fields: "use; area_m2; area_convention; foundation; shell; systems; test; date"
      collection_method: "signed inspection and area check"
      unit: "m2; date"
      frequency: "each milestone"
      temporal_coverage: "through handover"
      site_scope: "building"
      aggregation_rule: "accepted area once"
      quality_evidence: "drawings; signed handover"
  calculation_rules:
    - id: calc_area
      applies_to: "inventory"
      rule: "Divide whole-building quantities by accepted gross floor area, retaining totals."
      inputs:
        - quantity
        - area_m2
      output: "amount per m2"
      source_ids:
        - src_ec_levels
    - id: calc_balance
      applies_to: "materials"
      rule: "Delivered = installed + rejected exit + supplier return + stock change, with internal reuse counted once."
      inputs:
        - delivery
        - install
        - exit
        - return
        - stock
      output: "reconciled mass"
      source_ids: []
    - id: calc_freight
      applies_to: "transport"
      rule: "Sum carried tonnes times route km by leg/mode; disclose return treatment."
      inputs:
        - load_t
        - leg_km
        - mode
      output: "tonne-km"
      source_ids: []
    - id: calc_shared
      applies_to: "shared assets"
      rule: "Attribute measured total across all consumers in project period by physical use; sum shares to total."
      inputs:
        - "asset total"
        - users
        - period
      output: "node/building shares"
      source_ids:
        - src_ec_levels
  data_quality_requirements:
    - id: quality_identity
      applies_to: "output"
      requirement: "Confirm predominant commercial use, included fixed systems, area method and accepted gate."
      evidence: "contract; plans; handover"
    - id: quality_route
      applies_to: "process inventory"
      requirement: "Use actual structure, envelope and system scope rather than cross-use generic intensity."
      evidence: "as-built bill; supplier tickets"
    - id: quality_rejects
      applies_to: "materials"
      requirement: "Reconcile accepted, reworked, returned and disposed states without duplicate outputs."
      evidence: "logs; weighbridge receipts"
    - id: quality_uuid
      applies_to: "final exchanges"
      requirement: "Confirm flow type, gate, property and unit for each concrete UUID and Flow Set expansion."
      evidence: "platform detail/support rows"
validation_rules:
  - rule_id: validate_scope
    applies_to: "final building"
    rule: "Check commercial predominant use and separate industrial works, land and movable equipment."
    source_ids:
      - src_unsd_53122
  - rule_id: validate_handover
    applies_to: "reference"
    rule: "Require signed acceptance and measured area; exclude post-handover energy and maintenance."
    source_ids:
      - src_ec_levels
  - rule_id: validate_route
    applies_to: "all nodes"
    rule: "Check use-specific frame, envelope and services against as-built quantities, not shared warehouse/office defaults."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "rejects"
    rule: "Every rejected state has a linked reinspection, return, recovery or disposal path."
    source_ids: []
  - rule_id: validate_secondary
    applies_to: "recovered inputs"
    rule: "Check origin, recovery handoff and single burden treatment."
    source_ids:
