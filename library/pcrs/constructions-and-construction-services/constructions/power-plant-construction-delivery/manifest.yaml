review_metadata:
  scientific_review:
    status: pending
    note: Candidate construction methodology; no scientific approval or publication.
      Branch-specific design/quantity evidence and outstanding identities must
      be reviewed before complete dataset/publication.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: crushed_rock
      name: Crushed rock for engineered fill
      reason: Bounded searches require site fill lithology, grading and supplied
        state; no exact public identity adopted.
    - row_id: fresh_concrete
      name: Fresh ready-mixed hydraulic-cement concrete
      reason: Concrete db3cc6e8 direct-read has prefabricated-component classification
        and broad binder/state description; insufficient to identify fresh
        ready-mixed hydraulic-cement concrete.
    - row_id: hydraulic_grout
      name: Non-shrink hydraulic-cement grout
      reason: Plain cement search candidates do not establish formulated non-shrink
        grout identity.
    - row_id: plywood_form
      name: Reusable plywood formwork panel
      reason: Public plywood candidates do not establish reusable formwork
        configuration and manufacture boundary.
    - row_id: excavator
      name: Hydraulic crawler excavator
      reason: No exact complete crawler excavator identity selected from the bounded
        equipment candidates.
    - row_id: mobile_crane
      name: Mobile crawler crane
      reason: Crane-subassembly and overhead-crane candidates are not a complete
        mobile crawler crane.
    - row_id: steam_boiler
      name: Power-generation steam boiler
      reason: Steam/heat service and broad boiler-class candidates do not identify a
        specified power-generation boiler assembly.
    - row_id: steam_turbine
      name: Steam turbine assembly
      reason: Refined search found a steam/other-vapour turbine commodity class,
        directly read and retained outside canonical. It does not establish the
        specified standalone steam assembly configuration/interface; Mass versus
        Count alone is not the rejection reason.
    - row_id: gas_turbine
      name: Industrial gas turbine assembly
      reason: Bounded mixed turbine candidates did not verify the intended industrial
        gas turbine assembly.
    - row_id: hrsg
      name: Heat-recovery boiler assembly (HRSG)
      reason: Heat or steam flows cannot substitute for the HRSG equipment.
    - row_id: engine
      name: Stationary reciprocating generating engine
      reason: No selected public identity for the specified stationary generating
        engine.
    - row_id: synchronous_generator
      name: Synchronous electrical generator
      reason: Hydro-specific generator search result cannot identify every
        thermal/nuclear generator.
    - row_id: condenser
      name: Steam surface condenser
      reason: No precise condenser equipment identity adopted.
    - row_id: cooling_tower
      name: Wet recirculating cooling tower
      reason: No specific wet recirculating cooling tower equipment identity adopted.
    - row_id: reactor_vessel
      name: Reactor pressure vessel
      reason: Broad and refined searches returned unrelated chemicals or material
        classes; no configured reactor pressure-vessel identity was verified.
    - row_id: nuclear_steam_generator
      name: Nuclear steam generator
      reason: Steam product and fossil boiler identity are not the nuclear steam
        generator.
    - row_id: containment_liner
      name: Fabricated steel containment liner
      reason: Generic rolled steel cannot identify fabricated containment liner with
        its included boundary.
    - row_id: safety_pump
      name: Nuclear safety injection pump
      reason: No route/qualification-specific safety injection pump identity verified.
    - row_id: penstock
      name: Fabricated steel penstock
      reason: Solder and generic steel-pipe search results do not establish fabricated
        pressure conduit identity.
    - row_id: switchgear
      name: Metal-enclosed AC switchgear
      reason: Direct-read candidate is 500 kV switchgear; other candidates are 220 kV
        or preassembly components. None verifies the specified complete
        metal-enclosed AC configuration/interface.
    - row_id: pv_inverter
      name: Photovoltaic DC-to-AC inverter
      reason: Refined candidate directly read is an operation-stage replacement
        inverter with unreported capacity/design, not the specified initial
        construction inverter supply.
    - row_id: supplied_water
      name: Delivered fresh construction water
      reason: Unrestricted site freshwater supply lacks verified geography and network
        delivery identity; Hong Kong plant-gate candidate rejected.
    - row_id: mineral_spoil
      name: Uncontaminated excavated mineral soil for disposal
      reason: Available excavated-soil product flow cannot identify waste disposal
        soil with its tested state.
    - row_id: concrete_rubble
      name: Hardened concrete rubble
      reason: Recycled-aggregate product identity does not identify waste concrete
        rubble.
    - row_id: steel_offcuts
      name: Carbon-steel reinforcement offcuts
      reason: Candidate scrap routes and alloy/state constraints require review for
        this reinforcement-offcut waste.
    - row_id: washout_liquid
      name: Cementitious concrete washout liquid
      reason: Generic slurry/route-specific wastewater identities do not establish
        construction concrete-washout liquid.
    - row_id: reference_product_power_plant
      name: Complete power plant at construction handover
      reason: Public nuclear-plant candidate c5696a82 is CN pressure-water-reactor
        specific and cannot represent cross-route complete power-plant
        construction handover; reference Count support is valid but generic
        product identity remains unresolved.
  method_limits:
    - Core is actual construction/cold-test handover; hot/fuelled tests and
      operational/commercial readiness are not silently implied.
    - Examples require full actual route-specific BOM supplementation, including
      nuclear safety/auxiliary systems and offshore or other unrepresented
      designs.
    - Shared equipment/component manufacture shares conserve burdens across all
      projects/periods; unsupported lifetime/beneficiary denominator remains
      review.
    - Official historical documents provide qualitative route evidence only; no
      default mass, ratio, energy, emission, capacity or lifetime.
