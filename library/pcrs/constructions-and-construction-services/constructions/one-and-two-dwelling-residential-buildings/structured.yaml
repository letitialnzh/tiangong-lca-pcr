      raw_fields: "starting state, excavation volume, density, reuse and export, service scope"
      collection_method: "survey, weighbridge and contractor log"
      unit: "m3, kg, service unit"
      frequency: "each event"
      temporal_coverage: "foundation phase"
      site_scope: "named site"
