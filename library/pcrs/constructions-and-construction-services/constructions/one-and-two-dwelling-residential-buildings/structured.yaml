allocation_rules:
  - rule_id: building_allocation
    applies_to: "project with several buildings"
    rule: "Assign measured quantities to the benefiting building first. Allocate indivisible shared work by documented floor area, machine hours or material mass; record denominator and shares summing to one. Two dwellings inside one building are not co-products."
    source_ids:
      - rics-wlca-2024
  - rule_id: shared_works
    applies_to: "scaffold, formwork, crane and site utilities"
    rule: "Identify consuming nodes and project period, allocate actual use once, and disclose reuse cycles or salvage only with evidence."
    source_ids:
      - rics-wlca-2024
  - rule_id: secondary_material
    applies_to: "recovered aggregate, timber or other products"
    rule: "Preserve origin and recovery hand-off; use one upstream recovery convention and avoid charging previous life or speculative substitution twice."
    source_ids:
      - rics-wlca-2024
  - rule_id: rework_reject
    applies_to: "defective components and finish"
    rule: "Return corrected products and rework energy to their producing node; exclude rejected items from accepted output and count exported waste once."
    source_ids:
      - mass-balance-identity
