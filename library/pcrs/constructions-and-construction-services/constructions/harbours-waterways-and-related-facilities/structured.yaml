allocation_rules:
  - rule_id: sediment_fate
    applies_to: "dredged lots"
    rule: "Classify each lot by measured quality and actual approved destination. Credit beneficial-use material only with independently qualified recipient and handoff; otherwise retain waste-treatment burdens."
    source_ids:
      - usace-montauk-harbor
      - imo-dredged-material-assessment
  - rule_id: shared_work
    applies_to: "common plant and temporary works"
    rule: "Attribute shared activity by work package, hours, measured quantities or a declared causal driver; count each burden once."
    source_ids:
      - pianc-navigation-infrastructure-2014
  - rule_id: no_double_asset
    applies_to: "branch outputs"
    rule: "Interim navigation formation and tested structures are internal handoffs, not co-products automatically counted with the final asset."
    source_ids:
      - pianc-navigation-infrastructure-2014
dataset_production:
  collection_protocols:
    - protocol_id: cp_sediment
      process_id: "navigation_formation"
      flow_role: "dredge volume, lots and transport"
      record_type: "survey, sampling, load and receipt logs"
      raw_fields: "source cell; pre/post survey; datum; in-situ m3; dry/wet mass; quality; destination; route km"
      collection_method: "survey and reconcile each lot to placement receipt"
      unit: "m3, kg, km"
      frequency: "each survey and load"
      temporal_coverage: "new-work window"
      site_scope: "project reach and placement sites"
      aggregation_rule: "sum by source and destination; calculate t·km by mode"
      quality_evidence: "survey datum, analyses and receipts"
    - protocol_id: cp_energy
      process_id: "navigation_formation_marine_structure"
      flow_role: "direct plant energy"
      record_type: "meter, bunkering and plant logs"
      raw_fields: "carrier; meter; volume or mass; work package; dates"
      collection_method: "reconcile to branch and avoid subcontract overlap"
      unit: "kWh, MJ or kg"
      frequency: "each shift or delivery"
      temporal_coverage: "construction period"
      site_scope: "included works"
      aggregation_rule: "sum by branch and carrier"
      quality_evidence: "readings and invoices"
    - protocol_id: cp_materials
      process_id: "marine_structure"
      flow_role: "installed and rejected materials"
      record_type: "bill, delivery and waste records"
      raw_fields: "class; specification; density; delivered; installed; returned; rejected"
      collection_method: "weigh or measure and reconcile"
      unit: "kg or m3"
      frequency: "each lot"
      temporal_coverage: "installation period"
      site_scope: "included structures"
      aggregation_rule: "sum by class; convert with recorded density"
      quality_evidence: "signed bills and receipts"
    - protocol_id: cp_installation_service
      process_id: "marine_structure"
      flow_role: "contracted specialist installation"
      record_type: "certified work order"
      raw_fields: "task; provider; service quantity and unit; equipment inclusion; date"
      collection_method: "reconcile certified work to installed structure"
      unit: "declared service unit"
      frequency: "each work package"
      temporal_coverage: "installation period"
      site_scope: "included structures"
      aggregation_rule: "sum by non-overlapping task and unit"
      quality_evidence: "signed certificate and subcontract scope"
    - protocol_id: cp_acceptance
      process_id: "inspection_handover"
      flow_role: "branch and final acceptance"
      record_type: "as-built, test and handover records"
      raw_fields: "segment; branch; dimensions; tests; defects; date"
      collection_method: "engineer sign-off"
      unit: "item, m or m3"
      frequency: "each gate"
      temporal_coverage: "contract completion"
      site_scope: "named segment"
      aggregation_rule: "count accepted segment once"
      quality_evidence: "signed acceptance and surveys"
  calculation_rules:
    - id: calc_in_situ_volume
      applies_to: "navigation formation"
      rule: "Integrate pre/post-bed survey difference over contract reach with common datum."
      inputs:
        - "surveyed grids and datum"
      output: "m3 in situ"
      source_ids:
        - usace-montauk-harbor
    - id: calc_sediment_tkm
      applies_to: "placement transport"
      rule: "Sum each load's declared-basis tonnes × loaded distance; never silently mix wet and dry bases."
      inputs:
        - "load mass"
        - mode
        - distance
      output: "t·km by mode"
      source_ids:
        - usace-montauk-harbor
    - id: calc_material_balance
      applies_to: "structural materials"
      rule: "Delivered = installed + returned + rejected + stock change within uncertainty."
      inputs:
        - delivery
        - as-built
        - "return and waste records"
      output: "kg by material"
      source_ids:
        - pianc-navigation-infrastructure-2014
  data_quality_requirements:
    - id: quality_design_gate
      applies_to: "reference asset"
      requirement: "Distinguish new work from maintenance and declare design, segment, branch and acceptance."
      evidence: "contract and handover files"
    - id: quality_sediment
      applies_to: "dredged material"
      requirement: "Reconcile surveyed volume, quality, mass and every destination."
      evidence: "surveys, samples and receipts"
    - id: quality_identity
      applies_to: "all exchange flows"
      requirement: "Confirm concrete UUID against role, type, property, unit and context; leave unsupported UUIDs blank."
      evidence: "flow detail and support-row evidence"
    - id: quality_reconciliation
      applies_to: "materials and energy"
      requirement: "Reconcile plant, supplier and disposal records with cut-offs and uncertainty."
      evidence: "meters, invoices and material balances"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference asset"
    rule: "Reject a dataset mixing unlike facility types without component quantities or including post-handover operation as construction."
    source_ids:
      - unsd-cpc-53232
      - pianc-navigation-infrastructure-2014
  - rule_id: validate_branch
    applies_to: "process graph"
    rule: "Require at least one of navigation_formation or marine_structure; each selected branch must provide one matching input handoff to inspection_handover."
    source_ids:
      - pianc-navigation-infrastructure-2014
  - rule_id: validate_sediment
    applies_to: "navigation formation"
    rule: "If dredging is included, require common-datum surveys, sediment quality and complete placement ledger; do not assume every lot is a product."
    source_ids:
      - usace-montauk-harbor
      - imo-dredged-material-assessment
  - rule_id: validate_structure
    applies_to: "marine structures"
    rule: "If structures are included, reconcile installed/rejected materials to the as-built asset; tested structure remains interim."
    source_ids:
      - pianc-navigation-infrastructure-2014
  - rule_id: validate_identity
    applies_to: "every flow"
    rule: "A final concrete process exchange requires verified UUID; provisional Flow Set coverage is not itself an exchange UUID."
    source_ids:
      - pianc-navigation-infrastructure-2014
published_dataset_profile:
  dataset_role: "Project-specific foreground construction package for reviewed secondary or background construction data."
  downstream_use: "Process and lifecycle-model projections for the stated marine asset, branch and engineering gate."
  allowed_use: "Compare projects only after aligning facility function, design geometry, sediment route, site and coverage."
  excluded_use: "Generic port operations, shipping, routine maintenance dredging, or another facility type without re-modelling."
  required_metadata: "Site and water body; segment; design and as-built dimensions; branches; baseline; sediment quality and destination; material and energy; handover."
