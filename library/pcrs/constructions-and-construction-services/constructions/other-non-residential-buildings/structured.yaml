      site_scope: "contract site"
      aggregation_rule: "balance removal and sum non-overlapping footprint"
      quality_evidence: "signed survey and tickets"
    - protocol_id: cp_structure
      process_id: "form_structure"
      flow_role: "materials, structure, defects"
      record_type: "supplier and inspection records"
      raw_fields: "delivered, returned, installed and rejected mass, accepted geometry"
      collection_method: "as-built bill and inspection log"
      unit: "kg; m2"
      frequency: "each delivery and inspection"
      temporal_coverage: "foundations through frame acceptance"
      site_scope: "contract structure"
      aggregation_rule: "mass balance by material"
      quality_evidence: "invoices, as-builts, defect closeout"
    - protocol_id: cp_enclosure
      process_id: "enclose_finish"
      flow_role: "roof or envelope, accepted area, residues"
      record_type: "bill, inspection, waste ticket"
      raw_fields: "material mass, returns, accepted GFA, residue mass and route"
      collection_method: "quantity survey and ticket reconciliation"
      unit: "kg; m2"
      frequency: "each lot and inspection"
      temporal_coverage: "roof/envelope to finish acceptance"
      site_scope: "contract roof, envelope and interiors"
