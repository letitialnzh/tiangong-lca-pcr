allocation_rules:
  - rule_id: no_duplicate_systems
    applies_to: "structure, enclosure and MEP"
    rule: "Attribute each supplier package and common site service once; do not add subcontract-embedded burdens again."
    source_ids:
      - eu-levels
  - rule_id: mixed_use_attribution
    applies_to: "mixed use"
    rule: "Split accepted GFA into non-overlapping uses; allocate shared structure and systems using evidenced area, mass, capacity or service drivers."
    source_ids:
      - eu-levels
  - rule_id: reject_rework
    applies_to: "defects"
    rule: "Keep repair inputs and burdens with the producing node; trace return, recovery or disposal; accepted GFA excludes unresolved defects."
    source_ids:
      - doe-building-commissioning
  - rule_id: single_project_period
    applies_to: "construction cycle"
    rule: "Attribute construction burdens to the one accepted project; do not amortize them over assumed future operating years within this construction-only dataset."
    source_ids:
      - eu-levels
  - rule_id: allocation_rule_5
    applies_to: "foreground_burden_allocation"
    rule: "Excavated spoil, finishing residue and defective components are waste or returned materials, not automatic saleable co-products. A separately evidenced recovered saleable output needs its own declared route and allocation review; no unverified avoided-burden credit is applied."
    source_ids: []
dataset_production:
