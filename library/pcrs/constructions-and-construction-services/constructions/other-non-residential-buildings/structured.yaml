system_boundary:
  rules:
    - rule_id: gate_new_build
      applies_to: "whole building"
      rule: "Include ground works, structure, enclosure, fixed systems, pre-handover testing and corrections; exclude routine occupation and movable equipment."
      source_ids:
        - unsd-cpc3-notes
        - doe-building-commissioning
    - rule_id: use_qualified
      applies_to: "building use"
      rule: "Require actual use and fixed-system schedule; never infer an inventory from the residual classification label."
      source_ids:
        - unsd-cpc3-notes
    - rule_id: removal_handoff
      applies_to: "prepare_site"
      rule: "Identify source soil or surface, surveyed removal, on-site reuse, export and accepted ground; removal is separate from forming."
      source_ids:
        - eu-levels
    - rule_id: forming_handoff
      applies_to: "form_structure"
      rule: "Identify pre-form materials, geometry-changing work, accepted structure, forming losses and repair."
      source_ids:
        - eu-levels
    - rule_id: finish_handoff
      applies_to: "enclose_finish"
      rule: "Identify parent frame, actual roof or envelope and applied finishes, residues and accepted roofed or enclosed state."
      source_ids:
        - eu-levels
    - rule_id: integration_handoff
      applies_to: "integrate_handover"
      rule: "Join structure, enclosure and use-specific fixed services; record separately purchased mechanical, electrical and test services when present without duplicating subcontract inputs; only accepted GFA enters the reference output."
      source_ids:
        - doe-building-commissioning
    - rule_id: route_delta
      applies_to: "use-specific systems"
      rule: "Document topology, inventory, tests and basis for each use; mixed uses may coexist with non-overlapping attribution."
      source_ids:
        - unsd-cpc3-notes
        - doe-building-commissioning
