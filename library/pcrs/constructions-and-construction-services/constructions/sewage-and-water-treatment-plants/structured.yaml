allocation_rules:
  - rule_id: single_facility
    applies_to: "accepted output"
    rule: "Attribute construction to the accepted asset; no operating treatment output belongs to this reference product."
    source_ids:
      - unsd-cpc3-notes
  - rule_id: shared_works
    applies_to: "shared access, plant and tests"
    rule: "Assign by metered use or documented engineering driver and count common work once."
    source_ids:
      - mass-balance-identity
  - rule_id: spoil_route
    applies_to: "cut and fill"
    rule: "Internal reuse retains site burdens; export has explicit destination; no unsupported recovery credit."
    source_ids:
      - mass-balance-identity
  - rule_id: reject_retention
    applies_to: "defects"
    rule: "Keep repair burdens at originating node; only retested and accepted structures/units enter final asset."
    source_ids:
      - mass-balance-identity
      - epa-startup
dataset_production:
  collection_protocols:
    - protocol_id: cp_site
      process_id: "prepare_site"
      flow_role: "earthwork, footprint, spoil"
      record_type: "survey and ticket"
      raw_fields: "footprint; cut; density; reuse; export; destination; contract scope"
      collection_method: "survey, weighbridge, invoice"
      unit: "m2; m3; kg"
      frequency: "segment/load"
      temporal_coverage: "project"
      site_scope: "contract site"
      aggregation_rule: "balance cut, reuse and export"
      quality_evidence: "survey, ticket"
    - protocol_id: cp_energy
      process_id: "prepare_site_form_civil"
      flow_role: "construction energy"
      record_type: "meter and equipment log"
      raw_fields: "carrier; meter; fuel; task; subcontract overlap"
      collection_method: "meter, invoice, shift log"
      unit: "kWh; MJ; kg"
      frequency: "shift/month"
      temporal_coverage: "project"
      site_scope: "site plant"
      aggregation_rule: "sum by carrier and allocate once"
      quality_evidence: "meters and invoices"
    - protocol_id: cp_civil
      process_id: "form_civil"
      flow_role: "materials, shell, rejects"
      record_type: "bill and inspection"
      raw_fields: "specification; delivery; installation; volume; reject; repair; return; accepted shell"
      collection_method: "tickets, as-built and QA"
      unit: "kg; m3; item"
      frequency: "batch/structure"
      temporal_coverage: "project"
      site_scope: "civil footprint"
      aggregation_rule: "reconcile delivered and accepted states"
      quality_evidence: "tickets, QA"
    - protocol_id: cp_components
      process_id: "integrate_accept"
      flow_role: "units and connections"
      record_type: "bill and inspection"
      raw_fields: "unit list; delivered; installed; returned; connection length; design capacity"
      collection_method: "bill, as-built and QA"
      unit: "kg; item; m; m3/day"
      frequency: "unit/segment"
      temporal_coverage: "project"
      site_scope: "facility"
      aggregation_rule: "reconcile unit and connection scope"
      quality_evidence: "invoices, drawings"
    - protocol_id: cp_tests
      process_id: "integrate_accept"
      flow_role: "water, energy, rejects"
      record_type: "meter and test"
      raw_fields: "test water; energy; dry/wet result; failure; repair; residue; destination"
      collection_method: "meter, test sheet, waste ticket"
      unit: "m3; kWh; kg"
      frequency: "test"
      temporal_coverage: "through acceptance"
      site_scope: "facility"
      aggregation_rule: "sum construction tests only"
      quality_evidence: "signed tests"
    - protocol_id: cp_acceptance
      process_id: "integrate_accept"
      flow_role: "accepted facility"
      record_type: "certificate"
      raw_fields: "function; capacity; unit list; connection limit; defects; closure; date"
      collection_method: "signed handover"
      unit: "facility; m3/day"
      frequency: "handover"
      temporal_coverage: "project"
      site_scope: "contract asset"
      aggregation_rule: "count signed asset once"
      quality_evidence: "certificate"
  calculation_rules:
    - id: cut_balance
      applies_to: "prepare_site"
      rule: "Removed mass = reused + exported + stock change using measured state-specific density."
      inputs:
        - survey
        - density
        - tickets
      output: "cut and spoil"
      source_ids:
        - mass-balance-identity
    - id: component_balance
      applies_to: "civil and integration"
      rule: "Delivered = accepted installed + returned + rejected exit + stock change; repair is not another new input."
      inputs:
        - bills
        - QA
        - returns
      output: "accepted material and reject"
      source_ids:
        - mass-balance-identity
    - id: acceptance_count
      applies_to: "integrate_accept"
      rule: "Count signed accepted facility after defect closure; capacity remains a qualifier."
      inputs:
        - "tests and handover"
      output: "reference product"
      source_ids:
