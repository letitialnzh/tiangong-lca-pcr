schema_version: 1
generated_from: markdown
source_markdown: pcr.en-US.md
product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.power-plants"
  classification_refs: "CPC 3.0 53262; mapping acceptance is separate."
  covered_products: "Accepted generating plant with integrated civil, generation and balance-of-plant systems inside one contract boundary."
  excluded_products: "Electricity output and routine operation; independently contracted transmission; equipment-only sales; separate fuel-supply facilities."
  representative_product: "One accepted technology-qualified generating plant with declared rated capacity and unit list."
  production_route: "Site removal and preparation; foundation and civil forming; equipment and electrical integration; commissioning tests and defect closeout to signed handover."
  market_state: "Installed and accepted capital asset, not electricity supplied to the grid."
functional_unit:
  what: "Constructed and accepted electricity-generating plant."
  how_much: "One accepted plant; report rated capacity separately in MW."
  how_well: "Civil, mechanical, electrical and control systems meet contractual pre-handover acceptance tests."
  how_long_or_cycle: "One construction project through signed acceptance; design life is metadata, not operation in this boundary."
  reference_flow_link: "accepted_plant output from integrate_accept."
system_boundary:
  rules:
    - rule_id: handover_gate
      applies_to: "whole plant"
      rule: "Include construction, installation, pre-handover commissioning and required defect closeout to signed acceptance; exclude routine post-handover generation."
      source_ids:
        - doe-commissioning
    - rule_id: asset_limit
      applies_to: "plant interfaces"
      rule: "Include directly attributable balance-of-plant and grid connection within the contract; separately accepted transmission infrastructure is outside."
      source_ids:
        - unsd-cpc3-notes
    - rule_id: removal_handoff
      applies_to: "prepare_site"
      rule: "Identify source soil or rock, accepted prepared footprint, on-site reuse and off-site spoil separately; removal is independent of civil forming."
      source_ids:
        - unsd-cpc3-notes
    - rule_id: forming_handoff
      applies_to: "form_civil"
      rule: "Convert specified materials and accepted excavation to inspected foundations; link repair and rejected sections to this node."
      source_ids:
        - doe-commissioning
    - rule_id: integration_handoff
      applies_to: "integrate_accept"
      rule: "Record purchased generating equipment, balance-of-plant and installation services; hand off only the tested accepted plant."
      source_ids:
        - doe-commissioning
    - rule_id: test_export_limit
      applies_to: "integrate_accept"
      rule: "If pre-handover test electricity leaves the plant, record its metered export as a separate conditional output; post-handover generation is outside."
      source_ids:
        - doe-commissioning
    - rule_id: technology_delta
      applies_to: "integrate_accept"
      rule: "Resolve actual technology-specific units and tests from as-built records; do not copy a generic intensity."
      source_ids:
        - doe-commissioning
boundary_abstraction:
  declared_starting_condition: "Surveyed site, ground condition and existing grid or utility interface before contract works."
  starting_condition_role: "Physical baseline, not a burden-free finished plant."
  product_classification_scope: "One accepted generating plant, including only attributable on-site and contract works."
  recursive_input_rule: "Purchased same-category completed plant modules enter at supplier handover with an upstream dataset, not as free raw components."
  upstream_dataset_requirement: "Technology-matched materials, equipment, energy, transport and waste-treatment datasets."
  disclosure: "Technology, capacity basis, contract limit, unit list, shared works, ground removal, installed masses, tests, rejects, rework and identity gaps."
