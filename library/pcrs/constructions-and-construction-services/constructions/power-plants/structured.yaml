allocation_rules:
  - rule_id: shared_works
    applies_to: "multiple units or hybrid routes"
    rule: "Assign common civil, utilities and commissioning burdens by measured unit-specific quantities; if inseparable, document a consistent engineering-driver allocation."
    source_ids:
      - doe-commissioning
  - rule_id: test_electricity
    applies_to: "commissioning"
    rule: "Exported pre-handover test electricity is an incidental co-output. Retain construction and testing burdens with the accepted plant, assign no avoided-grid credit, and disclose exported kWh; test self-use is internal and post-handover generation is excluded."
    source_ids:
      - doe-commissioning
  - rule_id: reject_rework
    applies_to: "forming and integration"
    rule: "Keep repair burdens at producing node; accepted output excludes rejects. Declare recovered, returned or discarded destinations and avoid duplicate procurement."
    source_ids:
      - doe-commissioning
dataset_production:
  collection_protocols:
    - protocol_id: cp_site
      process_id: "prepare_site"
      flow_role: "removal, service, energy, footprint, spoil"
      record_type: "survey and site log"
      raw_fields: "cut volume; material; density; reuse; export; invoice; metered energy; accepted area"
      collection_method: "surveys, tickets, meters and invoices"
      unit: "m3; kg; kWh; MJ; m2"
      frequency: "each lot and monthly meter"
      temporal_coverage: "full preparation"
      site_scope: "project site"
      aggregation_rule: "reconcile cut, reuse, stock and export; sum non-overlapping area"
      quality_evidence: "signed survey, tickets, invoice, meter"
    - protocol_id: cp_civil
      process_id: "form_civil"
      flow_role: "civil materials, works, rejects"
      record_type: "material and inspection register"
      raw_fields: "grade; delivered, installed, returned and rejected mass; structure; inspection"
      collection_method: "procurement and as-built takeoff"
      unit: "kg; m3"
      frequency: "each delivery and lot"
      temporal_coverage: "full civil works"
      site_scope: "project site"
      aggregation_rule: "balance by grade and structure"
      quality_evidence: "receipts, drawings, inspections"
    - protocol_id: cp_equipment
      process_id: "integrate_accept"
      flow_role: "equipment and rejects"
      record_type: "equipment register"
      raw_fields: "unit; technology; model; mass; delivery, installation, spares, returns, rejects, destination"
      collection_method: "procurement and installation records"
      unit: "kg; count"
      frequency: "each component lot"
      temporal_coverage: "full installation"
      site_scope: "project site"
      aggregation_rule: "balance by component"
      quality_evidence: "supplier records, installation logs, rejection tickets"
    - protocol_id: cp_tests
      process_id: "integrate_accept"
      flow_role: "test energy, exported test electricity and accepted plant"
      record_type: "test and handover pack"
      raw_fields: "carrier; test energy; test-generated kWh; test self-use kWh; exported test kWh; rated MW; pass/fail; defect list; acceptance date"
      collection_method: "calibrated meters and signed turnover"
      unit: "kWh; MJ; MW; plant"
      frequency: "each test and final acceptance"
      temporal_coverage: "through handover"
      site_scope: "accepted plant"
      aggregation_rule: "reconcile generation, self-use and export by test; count plant on signed acceptance"
      quality_evidence: "readings, certificates, signed handover"
  calculation_rules:
    - id: cut_balance
      applies_to: "prepare_site"
      rule: "Removed mass = reused + exported + stock change + documented loss; investigate imbalance."
      inputs:
        - survey
        - density
        - tickets
      output: "kg by material and destination"
      source_ids: []
    - id: civil_balance
      applies_to: "form_civil"
      rule: "Delivered = accepted installed + rejects + returns + stock change by material."
      inputs:
        - "receipts and inspection"
      output: "kg accepted and rejected"
      source_ids: []
    - id: equipment_balance
      applies_to: "integrate_accept"
      rule: "Delivered = accepted installed + spares + returns + rejects + stock change by component."
      inputs:
        - "equipment register"
      output: "kg by component state"
      source_ids: []
    - id: plant_acceptance
      applies_to: "reference product"
      rule: "Accepted count = 1 only when mandatory tests and defect closeout pass and handover is signed."
      inputs:
        - tests
        - punchlist
        - handover
      output: "plant count"
      source_ids:
        - doe-commissioning
    - id: test_electricity_balance
      applies_to: "integrate_accept"
      rule: "Pre-handover test-generated kWh = internal test self-use + exported kWh + documented loss or stock change; export is a separate incidental output."
      inputs:
        - "dated test meters"
      output: "exported kWh"
      source_ids:
        - material-balance-identity
  data_quality_requirements:
    - id: dq_route
      applies_to: "whole plant"
      requirement: "Record technology, net/gross capacity basis, unit list and contract limit; do not substitute a generic recipe."
      evidence: "design basis and as-built unit list"
    - id: dq_completeness
      applies_to: "all nodes"
      requirement: "Reconcile quantities, shared works, route-specific equipment and rejected material."
      evidence: "survey, ledgers and reconciliation"
    - id: dq_gate
      applies_to: "acceptance"
      requirement: "Distinguish tests from operation and retain signed turnover evidence."
      evidence: "commissioning pack and acceptance signature"
    - id: dq_identity
      applies_to: "all exchanges"
      requirement: "Resolve each final exchange to compatible flow, property and unit UUIDs; disclose candidate-stage gaps."
      evidence: "platform detail and collection unit"
validation_rules:
  - rule_id: v_reference
    applies_to: "accepted plant"
    rule: "Reject plant count other than one or missing acceptance, technology or capacity qualification."
    source_ids:
      - doe-commissioning
  - rule_id: v_handoffs
