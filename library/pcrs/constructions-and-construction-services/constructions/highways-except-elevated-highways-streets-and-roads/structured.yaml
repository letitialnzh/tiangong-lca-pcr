allocation_rules:
  - rule_id: single_asset
    applies_to: "road output"
    rule: "Do not allocate layers into additional road products; length and area intensities report the same segment."
    source_ids:
      - fhwa-lca-pave
  - rule_id: shared_asset
    applies_to: "shared plant and utilities"
    rule: "Cover all consumers and service periods; use metered production or hours and sum allocated burden to the recorded whole once."
    source_ids:
      - fhwa-lca-pave
  - rule_id: secondary_burden
    applies_to: "recovered inputs"
    rule: "Record origin, recovery gate and cut-off or burden-inheritance convention; avoid previous-life double count."
    source_ids:
      - fhwa-lca-pave
  - rule_id: reject_rework
    applies_to: "off-spec work"
    rule: "Retain failed-attempt material and energy, trace rework and destination, and exclude rejects from accepted output."
    source_ids:
      - fhwa-lca-pave
dataset_production:
  collection_protocols:
    - protocol_id: cp_geometry_acceptance
      process_id: "formation_layer_assembly_finish_handover"
      flow_role: "geometry and accepted stages"
      record_type: "survey and tests"
      raw_fields: "chainage, width, area, thickness, density, function class, tests, handover"
      collection_method: "reconcile as-built survey and certificates"
      unit: "m, m2, mm, segment"
      frequency: "each stage"
      temporal_coverage: "full construction"
      site_scope: "alignment"
      aggregation_rule: "sum distinct accepted sections once"
      quality_evidence: "signed survey and tests"
    - protocol_id: cp_materials
      process_id: "formation_layer_assembly_finish_handover"
      flow_role: "fill, layers and finish"
      record_type: "delivery and as-built ledger"
      raw_fields: "type, supplier gate, mass, return, layer, recycled origin, installed quantity"
      collection_method: "ticket and layer reconciliation"
      unit: "kg"
      frequency: "delivery"
      temporal_coverage: "full construction"
      site_scope: "segment/supplier"
      aggregation_rule: "delivery less return/stock by material"
      quality_evidence: "invoices, tickets, cores"
    - protocol_id: cp_plant_services
      process_id: "formation_layer_assembly"
      flow_role: "machinery and energy"
      record_type: "meter, fuel and equipment log"
      raw_fields: "carrier, fuel, hours, task, consumer, period"
      collection_method: "site and contractor logs"
      unit: "MJ, kWh, h"
      frequency: "shift/period"
      temporal_coverage: "full construction"
      site_scope: "site/shared plant"
      aggregation_rule: "attribute logged use once"
      quality_evidence: "meters and contracts"
    - protocol_id: cp_freight
      process_id: "layer_assembly"
      flow_role: "inbound material transport"
      record_type: "shipment"
      raw_fields: "origin, destination, tonnes, km, delivery gate"
      collection_method: "consignment and route check"
      unit: "t, km, t*km"
      frequency: "shipment"
      temporal_coverage: "full construction"
      site_scope: "inbound route"
      aggregation_rule: "sum nonembedded tonne-km"
      quality_evidence: "delivery evidence"
    - protocol_id: cp_waste
      process_id: "formation_layer_assembly_finish_handover"
      flow_role: "spoil and rejects"
      record_type: "transfer/reuse log"
      raw_fields: "material, hazard, mass, node, destination, reuse"
      collection_method: "weighbridge/receiver"
      unit: "kg"
      frequency: "movement"
      temporal_coverage: "full construction"
      site_scope: "segment"
      aggregation_rule: "external exits net internal reuse"
      quality_evidence: "receipts/tests"
  calculation_rules:
    - id: section_area
      applies_to: "geometry"
      rule: "Sum accepted section length times measured width by carriageway, shoulder and path."
      inputs:
        - chainage
        - width
      output: "m2"
      source_ids:
        - fhwa-lca-pave
    - id: material_balance
      applies_to: "materials"
      rule: "Deliveries less returns and stock change equals installed plus rejected; investigate residual."
      inputs:
        - ledger
        - as-built
        - waste
      output: "reconciled kg"
      source_ids:
        - fhwa-lca-pave
    - id: freight_work
      applies_to: "transport"
      rule: "Sum shipment tonnes times route km, excluding supplier datasets already delivered at site."
      inputs:
        - tonnes
        - km
        - gate
      output: "t*km"
      source_ids:
        - fhwa-lca-pave
    - id: area_intensity
      applies_to: "reporting"
      rule: "Divide segment result by measured area or length, retaining the one-segment total."
      inputs:
        - "segment total"
        - area
        - length
      output: "per-m2/per-m intensity"
      source_ids:
        - fhwa-lca-pave
  data_quality_requirements:
    - id: dq_geometry
      applies_to: "reference"
      requirement: "Confirm chainage, widths, areas, layer thickness, function class and acceptance."
      evidence: "as-built survey/tests"
    - id: dq_materials
      applies_to: "layers"
      requirement: "Reconcile supplied, installed, returned, stock and waste by layer and route."
      evidence: "tickets, cores, ledger"
    - id: dq_shared
      applies_to: "plant"
      requirement: "Identify all consuming nodes/projects and periods, without duplicated energy/service burden."
      evidence: "dated equipment and meter logs"
    - id: dq_secondary
      applies_to: "recycled material"
      requirement: "Document previous use, recovery gate, composition and burden convention."
      evidence: "supplier and recovery records"
validation_rules:
  - rule_id: validate_product
    applies_to: "reference"
