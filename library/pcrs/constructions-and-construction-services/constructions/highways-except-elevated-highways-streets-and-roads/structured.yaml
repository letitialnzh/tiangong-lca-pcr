system_boundary:
  rules:
    - rule_id: construction_gate
      applies_to: "all processes"
      rule: "Include materials through compatible upstream datasets, inbound transport, site work, layer construction, finishing, rejects and acceptance through handover; use, maintenance and end of life are separate scenarios."
      source_ids:
        - fhwa-lca-pave
    - rule_id: assembly_handoff
      applies_to: "layer_assembly"
      rule: "Compacted formation is the parent; supplied base, surface, drainage and safety components form an assembled but unopened road."
      source_ids:
        - fhwa-lca-pave
    - rule_id: finish_handoff
      applies_to: "finish_handover"
      rule: "The assembled road is the parent; marking, final treatment, testing and defect closure yield the accepted passable road."
      source_ids:
        - fhwa-lca-pave
    - rule_id: alternative_surface
      applies_to: "rigid versus flexible surfacing"
      rule: "For one area, concrete and asphalt surface routes are mutually exclusive; record changed materials, equipment, cure/compaction, residues and test requirements relative to layer_assembly."
      source_ids:
        - fhwa-lca-pave
    - rule_id: secondary_origin
      applies_to: "reclaimed asphalt and recycled aggregate"
      rule: "Declare prior use, recovery handoff and cut-off or inheritance point; do not import previous-life burden twice."
      source_ids:
        - fhwa-lca-pave
    - rule_id: shared_plant
      applies_to: "plant, machinery and utilities"
      rule: "Identify consuming nodes/projects and service periods, and attribute logged use once by production or hours."
      source_ids:
        - fhwa-lca-pave
