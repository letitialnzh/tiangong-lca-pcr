review_metadata:
  scientific_review: pending
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: subbase
      flow_name: Crushed stone for foundation subbase
      reason: Direct-read 9d1c3962 graded ballast/sub-ballast aggregate is railway
        grading/use, not established foundation subbase. Generic 16/32 gravel
        does not establish actual project grading.
    - row_id: soil_disposal
      flow_name: Non-contaminated excavated mineral soil sent for disposal
      reason: Excavated mineral soil candidates are Product flows or
        TPH-remediation-specific; they do not establish this non-contaminated
        disposal waste.
    - row_id: ready_mix
      flow_name: Ready-mixed concrete delivered before placing
      reason: Direct-read cast-in-place concrete is a placed state; not supplied
        ready-mix. No generic concrete recipe adopted.
    - row_id: steel_beam
      flow_name: Fabricated structural steel beam
      reason: Direct-read e6370181 is hot-rolled non-alloy profile and b83f3a4a is a
        welding service, neither a fabricated structural beam including declared
        assembly scope.
    - row_id: precast_column
      flow_name: Precast reinforced-concrete structural column
      reason: Direct-read 4f19f124 is generic pre-cast concrete; it does not establish
        one configured reinforced structural column and included
        reinforcement/embedment scope. Actual unit-to-volume or mass conversion
        remains unverified.
    - row_id: timber_beam
      flow_name: Structural glued-laminated timber beam
      reason: Structural timber search and generic lumber/plywood candidates do not
        establish a complete structural glued-laminated beam with species,
        moisture, gluing and treatment scope.
    - row_id: mortar
      flow_name: Cement-sand masonry mortar
      reason: Candidate mortar specifies 60–85% sand; project formulation is not
        established.
    - row_id: steel_bolt
      flow_name: Structural steel bolt
      reason: Public metal-fastener candidates do not establish one configured
        structural steel bolt with grade, dimensions, coating and assembly
        scope.
    - row_id: window_frame
      flow_name: Finished aluminium building window frame
      reason: PV frames and general metal frames do not identify the building-window
        frame.
    - row_id: ventilation_duct
      flow_name: Fabricated galvanized-steel ventilation duct
      reason: Duct/ventilation candidates are general air/industrial equipment or
        material categories, not an identified fabricated galvanized-steel
        building duct with actual included component scope.
    - row_id: air_handler
      flow_name: Complete building air-handling unit
      reason: Direct-read a38dcbe4 covers air-conditioning machines generically;
        industrial dust collectors and air-conditioning subassemblies do not
        establish the complete building AHU, filter/coil/control scope and
        counted configuration.
    - row_id: passenger_lift
      flow_name: Complete passenger lift for building installation
      reason: Lift searches return forklift/underground goods conveyor and general
        lifting equipment candidates; no configured passenger-building lift
        scope established.
    - row_id: led_luminaire
      flow_name: Complete LED building luminaire
      reason: Direct-read 3253c9d6 is the LED-only luminaire/fitting category with a
        Mass reference. Its broad category can be a future candidate, but no
        actual configured complete-luminaire count-to-measured-net-mass
        relationship has been bound here. A property difference alone does not
        establish inapplicability.
    - row_id: sprinkler_head
      flow_name: Automatic fire sprinkler head
      reason: Direct reads of fire extinguisher valve/subassemblies and broader
        spraying-appliance category do not identify an automatic sprinkler head
        and activation specification.
    - row_id: medical_gas_pipe
      flow_name: Cleaned copper medical-gas distribution pipe
      reason: Direct-read 0d80f4b8 generic Copper tubing does not establish cleaned
        medical-gas distribution pipe state, cleanliness and the Length basis;
        actual geometry/conversion and medical acceptance remain required.
    - row_id: kitchen_hood
      flow_name: Stainless-steel commercial kitchen exhaust hood
      reason: Direct-read d241cf7b is Fans and ventilating or recycling hoods of the
        domestic type, not the actual stainless-steel commercial kitchen hood.
    - row_id: telecom_cabinet
      flow_name: Fixed steel telecommunications distribution cabinet
      reason: Direct-read e1f661bb includes steel control-cabinet electronics;
        vending-machine cabinet candidates are a different use and included
        assembly. Fixed telecommunications distribution cabinet not established.
    - row_id: excavator_share
      flow_name: Hydraulic excavator
      reason: Whole excavator product identity alone does not establish configuration
        and fractional manufacturing-burden exchange; actual linked
        provider/activity evidence required.
    - row_id: crane_share
      flow_name: Tower crane
      reason: Public general crane identity does not establish actual tower crane
        configuration and supported fractional activity basis.
    - row_id: concrete_scrap
      flow_name: Hardened concrete construction offcut sent for disposal
      reason: Direct-read a481a93d Construction Waste Disposal is general
        multi-material disposal scope; f23875ac Construction waste is Product
        flow. Neither establishes a segregated hardened-concrete-only Waste
        flow.
    - row_id: washwater
      flow_name: Contained cementitious concrete-washout water
      reason: Generic Wastewater candidates are manganese-material wash wastewater,
        degreasing wastewater or discharge-specific; none establishes contained
        concrete-washout treatment route.
    - row_id: dewatering
      flow_name: Excavation dewatering water sent for off-site treatment
      reason: Construction dewatering search returns digested sludge and feed-grade
        drainage aid; groundwater-resource and contaminated-groundwater product
        records do not establish the actual off-site-treatment waste route.
    - row_id: film_waste
      flow_name: Discarded polyethylene packaging film
      reason: Direct-read 8c3dd40c Plastic Film and e64eb06c Polyethylene film are
        Product flows, not the documented polyethylene-packaging Waste export.
        No type relabelling.
    - row_id: reference_building
      flow_name: Completed institutional, hospitality or other non-residential building
      reason: Building,unspec public flow uses Volume and generic average
        construction. No project-supported building-volume-to-entity
        relationship or delivery-state applicability has been established.
        Preserve count-based entity reference; exact completed output row is
        registered here.
  boundary_review: pending independent occupancy and special-system completeness
    review; agricultural storage buildings/silos belong to industrial category
    and are excluded here
