measurement_rules:
  - id: reference_entity
    applies_to: "reference_building"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "One accepted building is 1 item; use cp_handover to bind the whole configuration and measured geometry. No invented building mass."
  - id: geometry_scope
    applies_to: "glazing; roof_membrane"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Measure actual supplied surface; distinguish gross, net, overlaps and losses in cp_materials. Area numerators are exchanges per the same entity, not a new functional unit."
  - id: energy_basis
    applies_to: "lv_electricity; mv_electricity; diesel"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain public energy property and group. Electricity conversion is 3.6 MJ/kWh; diesel conversion requires actual mass or volume, density and LHV evidence in cp_site, never a generic engine consumption rate."
  - id: volume_state
    applies_to: "plywood; tap_water; groundwater; river_water; ready_mix"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Use physical volume at documented state. If tickets are in mass, use measured/source-supported density for the same material/moisture/temperature and preserve raw values; no building-volume-to-count or standard-water-density default."
