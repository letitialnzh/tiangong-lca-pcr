allocation_rules:
  - rule_id: shared_site
    applies_to: "dataset"
    rule: "Subdivide work packages and directly meter/trace attributable material, energy and waste first. If unavoidable, document the physical causal driver for each shared activity (machine hours, supplied quantities or actual service demand). Area alone is not an automatic driver for unlike hospital, theatre or hotel systems. Unproven relationships stay under review; economic allocation needs justification and sensitivity."
    source_ids:
      - ghg-allocation-2011
  - rule_id: asset_conservation
    applies_to: "temporary"
    rule: "Keep an asset-specific cumulative ledger across projects, periods and reuse. Use project activity divided by an evidence-backed compatible total service/activity basis to allocate manufacturing burden; the cumulative attributed shares cannot exceed one. Retain unused share and supported lifetime/activity estimates; unknown total basis remains review. Do not copy RICS illustrative reuse counts/lifetimes or reset a full manufacturing burden at each site."
    source_ids:
      - rics-wlca-2024
  - rule_id: waste_recovery
    applies_to: "waste"
    rule: "A waste export is not a coproduct credit. Document separation, receiver, treatment and whether a traded recovered product actually exists. Keep recycling assumptions and beyond-boundary substitution separate; no automatic avoided-primary credit or double accounting of supplied recycled material."
    source_ids:
      - ghg-allocation-2011
dataset_production:
  collection_protocols:
    - protocol_id: cp_handover
      process_id: "handover"
      flow_role: "reference entity"
      record_type: "foreground_record"
      raw_fields: "building id; occupancy; dated acceptance; configuration; actual geometry; area convention; capacity; performance evidence; exclusions"
      collection_method: "Survey as-built dimensions and reconcile signed acceptance, drawings, fixed-system schedules and fit-out scope; no compliance inferred from this PCR"
      unit: "item"
      frequency: "each event/read and work-package closure"
      temporal_coverage: "actual project start through accepted handover"
      site_scope: "declared building and attributable shared site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable primary records; calibrated measurements; reconciliation and uncertainty"
    - protocol_id: cp_materials
      process_id: "structure_enclosure_services_site"
      flow_role: "atomic supplied/installed exchange"
      record_type: "foreground_record"
      raw_fields: "row id; delivery ticket; supplier gate; composition; quantity/unit; density; geometry; installed quantity; leftovers; returns; batch and uncertainty"
      collection_method: "Reconcile supplier weigh/volume/length/area records with measured as-built bill and stock movements by work package; document included assembly components and actual route"
      unit: "row unit"
      frequency: "each event/read and work-package closure"
      temporal_coverage: "actual project start through accepted handover"
      site_scope: "declared building and attributable shared site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable primary records; calibrated measurements; reconciliation and uncertainty"
    - protocol_id: cp_site
      process_id: "utilities"
      flow_role: "site fuel/electricity/water"
      record_type: "foreground_record"
      raw_fields: "meter id; date readings; voltage/country; machine id/hours; fuel mass/volume/density/LHV/carbon source; water source/use; allocation driver"
      collection_method: "Calibrated meters, fuel tickets and machine/site logs including test/retest loads; reconcile shared supplies, own generation and grid bills; record source-supported conversions"
      unit: "MJ; m3"
      frequency: "each event/read and work-package closure"
      temporal_coverage: "actual project start through accepted handover"
      site_scope: "declared building and attributable shared site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable primary records; calibrated measurements; reconciliation and uncertainty"
    - protocol_id: cp_waste
      process_id: "site_waste"
      flow_role: "atomic waste export"
      record_type: "foreground_record"
      raw_fields: "row id; composition; contamination; actual mass/volume/state; solids/pH where applicable; container; date; receiver; treatment receipt"
      collection_method: "Separated weighed tickets or calibrated container/pump records, actual material tests and traceable receiving records; distinguish reuse, disposal and direct release"
      unit: "row unit"
      frequency: "each event/read and work-package closure"
      temporal_coverage: "actual project start through accepted handover"
      site_scope: "declared building and attributable shared site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable primary records; calibrated measurements; reconciliation and uncertainty"
    - protocol_id: cp_emissions
      process_id: "utilities"
      flow_role: "individual direct elementary emission"
      record_type: "foreground_record"
      raw_fields: "substance/CAS; fossil/biogenic; measured emitted mass; device/load; factor source/version; controls; location; medium/submedium; time; uncertainty"
      collection_method: "Use measured releases or source-supported device/activity-specific factors with raw activity and species evidence; distinguish NO2 from NOx-equivalent, PM10 from TSP; assess noise/vibration/land separately"
      unit: "kg"
      frequency: "each event/read and work-package closure"
      temporal_coverage: "actual project start through accepted handover"
      site_scope: "declared building and attributable shared site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable primary records; calibrated measurements; reconciliation and uncertainty"
    - protocol_id: cp_assets
      process_id: "temporary"
      flow_role: "temporary product/plant share"
      record_type: "foreground_record"
      raw_fields: "asset id; composition/configuration; net material volume; deployment; use/reuse; current activity; total supported activity; prior allocated shares; remaining share"
      collection_method: "Survey temporary material geometry and read machine/formwork ledgers; retain provider manufacturing scope and evidence-backed activity/life basis and reconcile across all projects"
      unit: "row unit"
      frequency: "each event/read and work-package closure"
      temporal_coverage: "actual project start through accepted handover"
      site_scope: "declared building and attributable shared site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable primary records; calibrated measurements; reconciliation and uncertainty"
    - protocol_id: cp_transport
      process_id: "site_waste"
      flow_role: "mode-specific transport exchange"
      record_type: "foreground_record"
      raw_fields: "cargo identity; actual mass; origin/destination; actual route distance; mode/vehicle; payload; empty trip; provider scope"
      collection_method: "Read logistics/weigh records and actual route/mode logs; add atomic service identities and provider-unit conversion only with compatible evidence"
      unit: "provider unit"
      frequency: "each event/read and work-package closure"
      temporal_coverage: "actual project start through accepted handover"
      site_scope: "declared building and attributable shared site"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable primary records; calibrated measurements; reconciliation and uncertainty"
  calculation_rules:
    - id: reference_aggregation
      applies_to: "all inventory rows"
      rule: "Sum only attributable actual exchanges over the declared construction/acceptance event; retain each exchange numerator unit per declared reference flow. Reference output remains 1 item. Reconcile opening/closing stocks, returns, installed quantities and actual losses; internal stage transfers are not new external purchases."
      inputs:
        - cp_materials
        - cp_site
        - cp_waste
        - cp_handover
      output: "row quantity per declared reference flow"
      source_ids:
        - jrc-levels-boq-2021
    - id: conversion_evidence
      applies_to: "lv_electricity; mv_electricity; diesel; plywood; ready_mix"
      rule: "Convert electricity kWh to MJ by the exact 3.6 factor. Other volume/mass or fuel-energy conversions use the same-state measured/supplier-supported density and LHV, preserving raw units and uncertainty; no generic physical constants taken from unrelated identities."
      inputs:
        - cp_site
        - cp_materials
        - cp_assets
      output: "row-unit actual exchange per declared reference flow"
      source_ids:
        - rics-wlca-2024
    - id: direct_release
      applies_to: "fossil_co2; nitrogen_dioxide; pm10"
      rule: "Retain measured release mass; if calculated, document actual matched activity times a separately evidenced substance/device/medium-specific factor and control basis. Leave missing species/factors inconclusive, not zero; no mandatory factor is prescribed by this PCR."
      inputs:
        - cp_emissions
        - cp_site
      output: "kg of actual substance per declared reference flow"
      source_ids:
        - epa-construction-dust-2010
        - rics-wlca-2024
    - id: supported_asset_share
      applies_to: "excavator_share; crane_share; plywood"
      rule: "Assign only a supported project share following asset_conservation; preserve numerator activity, compatible total basis and all previous shares. Unknown basis is a review gap and must remain disclosed."
      inputs:
        - cp_assets
      output: "attributed burden per declared reference flow"
      source_ids:
        - rics-wlca-2024
  data_quality_requirements:
    - id: identity_state
      applies_to: "all inventory rows"
      requirement: "Exact material/species, supply/waste state, assembly scope and real public property/unit; no forced identity by name"
      evidence: "supplier and raw identity/measurement records"
    - id: building_function
      applies_to: "reference_building"
      requirement: "Measured geometry, actual occupancy/capacity and performance/acceptance state; distinguish shell-only, specialized systems and operating equipment"
      evidence: "cp_handover"
    - id: coverage_complete
      applies_to: "dataset"
      requirement: "Reconcile all work packages, site utilities, fixed systems, packaging and waste; document absent/unmeasured exchanges, upstream links and missing transport/treatment"
      evidence: "cp_materials; cp_site; cp_transport; cp_waste"
    - id: temporal_location
      applies_to: "dataset"
      requirement: "Actual construction period and supply/site geography; log seasonal/weather-dependent work, emission conditions and uncertainty without invented defaults"
      evidence: "cp_site; cp_emissions"
    - id: commissioning_state
      applies_to: "handover"
      requirement: "Keep actual system schedules, test conditions, failures/retests and dated acceptance; GSA example does not establish local approval"
      evidence: "cp_handover; gsa-commissioning-2020"
validation_rules:
  - rule_id: entity_gate
    applies_to: "reference_building"
    rule: "Reject missing entity configuration, measured geometry, named area convention, documented function/capacity, handover status/dates or scope exclusions; compare only equivalent delivered functions and stage scopes."
    source_ids:
      - un-cpc-3-53129
  - rule_id: inventory_gate
    applies_to: "all inventory rows"
    rule: "Check atomic identities, public Chinese names, direction/type, actual reference properties/units, route conditions and duplicate assembly components; unconfirmed UUID remains explicit, never implies absent burden."
    source_ids:
      - jrc-levels-boq-2021
  - rule_id: records_gate
    applies_to: "dataset"
    rule: "Every actual exchange needs traceable collection and same-reference aggregation, actual geometry/conversion evidence and stage completeness. Unknown emission speciation, asset allocation basis or upstream/treatment link remains inconclusive for affected claims; no assumed zero."
    source_ids:
      - rics-wlca-2024
      - ghg-allocation-2011
  - rule_id: handover_gate
    applies_to: "handover"
    rule: "Check actual commissioning/retest records against project requirements and delivered systems. Absence of a required installed system cannot be hidden by another occupancy route; construction-to-handover check does not validate future service life or operational performance."
    source_ids:
      - gsa-commissioning-2020
published_dataset_profile:
  dataset_role: "Construction-to-handover foreground dataset for one declared delivered building entity"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "A disclosed construction-stage component in an independently completed building model; function-equivalent, configuration/stage-matched comparisons with compatible upstream providers"
  excluded_use: "Automatic complete cradle-to-gate/whole-life assessment, per-kg or per-area universal intensity, operational building service, material-manufacturing replacement, legal compliance or science approval"
  required_metadata: "Identity/use/site; accepted configuration and dates; measured geometry/capacity with definitions; work-package/component scopes; fixed systems and exclusions; actual process/transport/waste routes; reference; upstream links; allocation and asset ledger"
  required_quality_disclosure: "Raw record coverage, uncertainty, conversion basis, missing UUID/provider/quantity/species; excluded lifecycle stages, specialist systems or owner fit-out; evidence geographical/temporal limits"
  update_trigger: "Changed occupancy, structural/fit-out/system scope, area definition/geometry, delivery event, supplier route, transport/waste treatment, allocation basis or new actual activity evidence"
data_sources:
  - id: "un-cpc-3-53129"
    type: "official_guidance"
    reference: "UNSD CPC Version 3.0 Explanatory Notes, 30 June 2025, pp. 277–278, 53121–53129. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Occupancy/entity boundary only; no construction recipe"
  - id: "jrc-levels-boq-2021"
    type: "official_guidance"
    reference: "JRC Level(s) indicator 2.1, version 1.1, January 2021, p. 24 Table 2. https://susproc.jrc.ec.europa.eu/product-bureau/sites/default/files/2021-01/UM3_Indicator_2.1_v1.1_34pp.pdf"
    used_for: "Qualitative shell/core/services/external elements checklist; no default quantities or lifespans"
  - id: "rics-wlca-2024"
    type: "standard"
    reference: "RICS Whole life carbon assessment for the built environment, second edition, version 3 August 2024, §5.1.4 pp. 80, 82 (PDF pp. 88, 90). https://www.rics.org/content/dam/ricsglobal/documents/standards/Whole_life_carbon_assessment_PS_Sept23.pdf."
    used_for: "Construction, temporary works and waste-stage distinctions; project-specific evidence; no reuse-count, lifespan, carbon-intensity or waste defaults"
  - id: "ghg-allocation-2011"
    type: "standard"
    reference: "WRI/WBCSD Product Life Cycle Accounting and Reporting Standard (2011), Chapter 9 p. 63, Tables 9.1–9.2 (PDF p. 65). https://ghgprotocol.org/sites/default/files/standards/Product-Life-Cycle-Accounting-Reporting-Standard_041613.pdf"
    used_for: "Subdivision and justified allocation relationships; no numeric allocation shares"
  - id: "epa-construction-dust-2010"
    type: "official_guidance"
    reference: "US EPA AP-42 §13.2.3 Heavy Construction Operations, January 1995, corrected February 2010, p. 13.2.3-1. https://www.epa.gov/sites/default/files/2020-10/documents/13.2.3_heavy_construction_operations.pdf"
    used_for: "Historical qualitative dust/activity/weather distinctions only; no TSP factor, PM10 conversion or current permit claim"
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA EPA-833-F-11-006 Concrete Washout, February 2012, p. 1. https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Historical concrete-washout operations and contained liquid versus release distinctions; no default concentration or current legal claim"
  - id: "gsa-commissioning-2020"
    type: "official_guidance"
    reference: "GSA Commissioning Guide, September 2020, p. 28, functional performance testing. Publisher-original copy hosted by WBDG: https://nibs-s3-wbdg3-production.s3.us-east-1.amazonaws.com/FFC/GSA/gsa_commissioning_guide_2020.pdf"
    used_for: "US federal test-documentation example only; actual local acceptance requirements prevail; no universal code or approval"
