product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.institutional-hospitality-and-other-building-delivery"
  classification_refs: "CPC 3.0 53129 — Other non-residential buildings"
  covered_products: "Complete accepted institutional, hospitality and residual non-residential building entities of the stated occupancy classes"
  excluded_products: "Residential, industrial/storage, commercial-office/retail and specialized civil facilities; services and material kits; undeclared operating equipment"
  representative_product: "One actual accepted building of a documented occupancy/configuration, not a hypothetical class-average building"
  production_route: "Actual preparation, foundations/structure, envelope/fit-out, fixed services, testing and handover, with route-specific work packages"
  market_state: "Installed at declared site and accepted in the declared complete handover condition"
functional_unit:
  what: "Deliver the declared structure, enclosure, fit-out and fixed systems for the documented non-residential function"
  how_much: "One complete accepted building; record measured gross/internal/useful floor areas with named measurement convention, levels, height, footprint and actual function-specific capacity with units"
  how_well: "Actual as-built configuration and project performance/acceptance records, including delivered fit-out and excluded equipment; no assumed load, compliance or approval"
  how_long_or_cycle: "One construction-to-handover event with actual dates; no operating duration or service-life default"
  reference_flow_link: "reference_building"
system_boundary:
  rules:
    - rule_id: construction_boundary
      applies_to: "dataset"
      rule: "Collect actual site excavation/backfill, foundation work, erection, envelope/partitions/finishes, fixed-service installation, lifting, welding/bolting, curing, testing/retests and acceptance, plus temporary facilities and waste transfer. Off-site material/equipment manufacture is upstream, not automatically site foreground. This alone is neither complete cradle-to-gate nor whole-life LCA."
      source_ids:
        - rics-wlca-2024
    - rule_id: actual_route
      applies_to: "all inventory rows"
      rule: "Flow cards are atomic applicability seeds, not a fixed bill. Include every actual used component, coating, joint, chemical, fuel, packaging and waste in separate rows using the same reference, collection and evidence rules. Record route absences with evidence; unresolved identities must not exclude a real route or omit burdens."
      source_ids:
        - jrc-levels-boq-2021
        - un-cpc-3-53129
    - rule_id: water_emissions
      applies_to: "utilities; waste"
      rule: "Distinguish product supply, natural withdrawal, reuse loops, dewatering and contained treatment-bound liquids. Direct released constituents, air species and receiving compartments require actual evidence; noise/vibration and land effects must be assessed with activity, location and duration records, and unavailable exchange identities/characterization disclosed rather than invented universal emissions."
      source_ids:
        - epa-concrete-washout-2012
        - epa-construction-dust-2010
    - rule_id: transport_split
      applies_to: "dataset"
      rule: "Keep manufacture, actual inbound transport, site movement, waste export and treatment as identified modules; retain route distance, payload and empty trips from cp_transport. Add mode-specific atomic freight services using matched providers. Fuel embodied in a transport service must not be duplicated as site fuel; no default distance."
      source_ids:
        - rics-wlca-2024
boundary_abstraction:
  declared_starting_condition: "Recorded actual site before project works and construction products/components at expressly identified supply gates"
  starting_condition_role: "foreground_starting_point"
  product_classification_scope: "Delivered non-residential entity of the inclusions/exclusions above; site services are not the product"
  recursive_input_rule: "A retained/reused building or shell is taken once at its received state, with inherited burden and additional works disclosed; do not recursively rebuild an already supplied same-category entity"
  upstream_dataset_requirement: "Link compatible material/component manufacture separately and actual transport from named origin/gate; check installed-component and upstream scope to avoid duplicates. Missing links prevent complete cradle-to-handover claims"
  disclosure: "Actual preparation, construction, commissioning and waste routes; upstream links; pre-existing demolition; excluded later occupation, maintenance/replacement, final demolition/treatment and beyond-boundary benefits"
