schema_version: 1
generated_from: markdown
source_markdown: pcr.en-US.md
product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.other-constructions-for-manufacturing"
  classification_refs: "CPC 3.0 53269; mapping acceptance is separate."
  covered_products: "Completed product-specialized manufacturing facilities with integrated route-specific structures and equipment."
  excluded_products: "Generic industrial buildings; equipment-only sales; manufactured output; operation; independently delivered infrastructure."
  representative_product: "One accepted specialized manufacturing facility with declared process family, capacity and installed units."
  production_route: "Site removal/preparation; foundation and process-structure forming; equipment/utility/control integration; tests, correction and handover."
  market_state: "Installed and accepted capital asset, not manufacturing service or commodity output."
functional_unit:
  what: "Constructed and accepted product-specialized manufacturing facility."
  how_much: "One accepted facility; designed throughput is a qualifier, not the reference amount."
  how_well: "Installed units and interfaces meet contractual pre-handover tests and defect closeout."
  how_long_or_cycle: "One construction project through signed acceptance; operating life is metadata."
  reference_flow_link: "accepted_facility output of integrate_accept."
system_boundary:
  rules:
    - rule_id: asset_gate
      applies_to: "whole facility"
      rule: "Include attributable construction, integration, pre-handover testing and defect closure through signed acceptance; exclude routine later production."
      source_ids:
        - doe-commissioning
    - rule_id: specialized_limit
      applies_to: "classification"
      rule: "Require product-/process-specific installed works, not merely a generic industrial shell; exclude equipment-only sales."
      source_ids:
        - unsd-cpc3
    - rule_id: removal_handoff
      applies_to: "prepare_site"
      rule: "Identify removal source, removed state, accepted footprint, on-site reuse and off-site spoil; removal is independent of forming."
      source_ids: []
    - rule_id: forming_handoff
      applies_to: "form_structures"
      rule: "Convert specified materials and accepted footprint into inspected foundations/process structures; separate repair and rejects."
      source_ids: []
    - rule_id: integration_handoff
      applies_to: "integrate_accept"
      rule: "Integrate route-specific equipment, utilities and controls; deliver only tested accepted facility."
      source_ids:
        - doe-commissioning
    - rule_id: route_delta
      applies_to: "process family"
      rule: "Resolve actual units, containment, utilities, controls and tests from design; no generic intensity is transferable without qualification."
      source_ids:
        - unsd-cpc3
    - rule_id: hazard_gate
      applies_to: "applicable hazardous-chemical routes"
      rule: "Where PSM applies, retain pre-startup review before introduction of highly hazardous chemicals; this is not universal or post-handover production."
      source_ids:
        - osha-psm
boundary_abstraction:
  declared_starting_condition: "Surveyed site, ground condition and documented pre-project service interfaces."
  starting_condition_role: "Physical baseline, not a burden-free finished facility."
  product_classification_scope: "One accepted specialized manufacturing facility within the declared construction contract."
  recursive_input_rule: "Purchased complete same-category facility modules enter at supplier handover with upstream datasets, not as free raw components."
  upstream_dataset_requirement: "Specification-matched material, equipment, energy, transport and waste-treatment datasets."
  disclosure: "Process family; unit list; capacity; limits; removal; installed quantities; tests; shared works; rework/rejects; UUID gaps."
