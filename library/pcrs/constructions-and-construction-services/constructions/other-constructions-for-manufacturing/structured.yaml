allocation_rules:
  - rule_id: shared_work
    applies_to: "multiple units or product families"
    rule: "Assign site, civil, utility and test burdens by measured takeoff or documented engineering driver; count shared works once."
    source_ids: []
  - rule_id: test_output
    applies_to: "pre-handover testing"
    rule: "If tests produce saleable material, meter and disclose quantity/disposition separately; never credit routine production or silently shift construction burdens."
    source_ids:
      - doe-commissioning
  - rule_id: reject_route
    applies_to: "forming and integration"
    rule: "Keep rework inputs at producing node; accepted facility excludes rejects. Record recovered, returned or discarded exits by destination."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_site
      process_id: "prepare_site"
      flow_role: "removal, energy, footprint, spoil"
      record_type: "survey and site log"
      raw_fields: "cut; density; material; reuse; stock; export; accepted area; fuel; electricity"
      collection_method: "surveys, tickets, meters"
      unit: "m3; kg; m2; kWh; MJ"
      frequency: "each lot and monthly meter"
      temporal_coverage: "whole preparation"
      site_scope: "project site"
      aggregation_rule: "reconcile cut, reuse, stock, export and accepted area"
      quality_evidence: "signed survey, tickets and readings"
    - protocol_id: cp_structures
      process_id: "form_structures"
      flow_role: "materials, accepted works, rejects"
      record_type: "material and inspection register"
      raw_fields: "grade; delivery; placement; accepted mass; rework; return; rejection; destination"
      collection_method: "receipts, as-built takeoff, inspection"
      unit: "kg; m3"
      frequency: "each delivery/lot"
      temporal_coverage: "whole civil period"
      site_scope: "project site"
      aggregation_rule: "balance by grade and structure"
      quality_evidence: "receipts, drawings, inspections"
    - protocol_id: cp_equipment
      process_id: "integrate_accept"
      flow_role: "equipment, utilities, joining service, rejects"
      record_type: "procurement and installation register"
      raw_fields: "unit/system; specification; delivered; installed; spare; returned; rejected; destination; work-package invoiced and accepted hours"
      collection_method: "supplier and site records"
      unit: "kg; count; h"
      frequency: "each component/system/work package"
      temporal_coverage: "whole installation"
      site_scope: "contract units"
      aggregation_rule: "balance by actual unit without overlap; reconcile accepted service hours"
      quality_evidence: "supplier records, invoices, sign-off, rejection tickets"
    - protocol_id: cp_tests
      process_id: "integrate_accept"
      flow_role: "test energy, acceptance"
      record_type: "commissioning and turnover pack"
      raw_fields: "process family; designed capacity; unit list; carrier; test; defect closure; safety review if applicable; date"
      collection_method: "meters, certificates, signed turnover"
      unit: "kWh; MJ; kg; facility"
      frequency: "each test/final acceptance"
      temporal_coverage: "through handover"
      site_scope: "accepted facility"
      aggregation_rule: "sum test carriers; count facility after closure"
      quality_evidence: "readings, certificates, conditional safety review, signature"
  calculation_rules:
    - id: site_balance
      applies_to: "prepare_site"
      rule: "Removed mass = reused + exported + stock change + documented loss by material."
      inputs:
        - survey
        - density
        - tickets
      output: "kg by destination"
      source_ids:
        - balance-identity
    - id: structure_balance
      applies_to: "form_structures"
      rule: "Delivered = accepted installed + rejected + returned + stock change by grade; rework is not new delivery."
      inputs:
        - receipts
        - inspection
      output: "kg by state"
      source_ids:
        - balance-identity
    - id: equipment_balance
      applies_to: "integrate_accept"
      rule: "Delivered = accepted installed + spare + rejected + returned + stock change by component."
      inputs:
        - "procurement and installation"
      output: "kg by state"
      source_ids:
        - balance-identity
    - id: acceptance_count
      applies_to: "reference product"
      rule: "Count = 1 only when tests, defect closeout and applicable safety review are documented and handover signed."
      inputs:
        - "test and turnover pack"
      output: "facility count"
      source_ids:
        - doe-commissioning
        - osha-psm
  data_quality_requirements:
    - id: dq_route
      applies_to: "facility"
      requirement: "Declare product/process family, installed units, designed capacity and contract limit; no generic recipe."
      evidence: "design and as-built register"
    - id: dq_balance
      applies_to: "all nodes"
      requirement: "Reconcile materials, energy, handoffs, shared works and reject destinations."
      evidence: "ledgers and reconciliation"
    - id: dq_gate
      applies_to: "acceptance"
      requirement: "Separate pre-handover tests from production; document applicable safety review."
      evidence: "dated tests, signed turnover and conditional review"
    - id: dq_identity
      applies_to: "final exchanges"
      requirement: "Resolve compatible flow, property and unit UUIDs before creating exchanges; expose candidate-stage gaps."
      evidence: "platform detail and measured units"
validation_rules:
  - rule_id: v_reference
    applies_to: "facility"
    rule: "Reject count other than one, missing signed acceptance, process-family identity, capacity basis or unit list."
    source_ids:
      - doe-commissioning
  - rule_id: v_handoffs
    applies_to: "process chain"
    rule: "Match prepared area and accepted structure mass across internal handoffs."
    source_ids:
      - balance-identity
  - rule_id: v_rejects
    applies_to: "forming/integration"
    rule: "No rejected lot may count as accepted; link repair to producing node and exit to named destination."
    source_ids: []
  - rule_id: v_route
    applies_to: "design variants"
    rule: "Verify units and shared-work attribution against as-built records; apply hazard gate only when triggered."
    source_ids:
      - osha-psm
  - rule_id: v_boundary
    applies_to: "whole facility"
    rule: "Exclude operating output/emissions after handover; disclose pre-handover test material separately."
    source_ids:
