system_boundary:
  rules:
    - rule_id: construction_gate
      applies_to: "entire asset"
      rule: "Include documented preparation, layer placement, finishing, testing and rework through signed acceptance; exclude use, maintenance and end-of-life."
      source_ids:
        - unsd-53213
        - faa-ac-150-5370-10
    - rule_id: asset_interfaces
      applies_to: "drainage, lighting and structures"
      rule: "Include only contract-integral measured items; link separately measured systems and buildings instead of silently including them."
      source_ids:
        - unsd-53213
        - faa-ac-150-5370-10
    - rule_id: internal_handoff
      applies_to: "successive nodes"
      rule: "Formation passes to paving after subgrade testing; laid pavement passes to finishing after layer testing; neither handoff creates a second final product."
      source_ids:
        - faa-ac-150-5370-10
    - rule_id: secondary_shared
      applies_to: "recovered inputs and shared plant"
      rule: "Declare recovery gate and burden convention; attribute shared plant to identified nodes and service period exactly once."
      source_ids:
        - faa-ac-150-5370-10
boundary_abstraction:
