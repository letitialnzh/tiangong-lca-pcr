allocation_rules:
  - rule_id: single_asset
    applies_to: "construction output"
    rule: "Attribute measured works to the accepted segment; link independently measured airport assets instead of allocating their full burden here."
    source_ids:
      - unsd-53213
  - rule_id: rework_reject
    applies_to: "off-spec material"
    rule: "Retain rework burden in the producing node, trace recovery/disposal exits and exclude failed area from accepted area."
    source_ids:
      - faa-ac-150-5370-10
  - rule_id: secondary_input
    applies_to: "reclaimed asphalt and aggregate"
    rule: "State origin, recovery gate and prior-burden or cut-off convention; count recovery and current processing once."
    source_ids:
      - faa-ac-150-5370-10
  - rule_id: shared_plant
    applies_to: "common batching plant, haul road or site utilities"
    rule: "Identify formation, paving and finishing consumers and service period; apportion actual burden by measured use or documented work once."
    source_ids:
      - faa-ac-150-5370-10
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "formation_paving_finish_handover"
      flow_role: "Material inputs"
      record_type: "Bill, delivery and as-built"
      raw_fields: "Item, layer, mass, count, density, delivered, installed, returned, origin"
      collection_method: "Reconcile supplier tickets and survey"
      unit: "kg, m3, item"
      frequency: "Each batch"
      temporal_coverage: "Contract start to acceptance"
      site_scope: "Measured segment"
      aggregation_rule: "Net installed plus tracked loss"
      quality_evidence: "Signed tickets and as-built records"
    - protocol_id: cp_services
      process_id: "formation"
      flow_role: "Purchased works"
      record_type: "Contract measurement"
      raw_fields: "Work item, contractor, unit, quantity and equipment scope"
      collection_method: "Approved measured work"
      unit: "contract unit"
      frequency: "Each work order"
      temporal_coverage: "Formation works"
      site_scope: "Segment"
      aggregation_rule: "Sum non-overlapping items"
      quality_evidence: "Certified payment record"
    - protocol_id: cp_energy
      process_id: "formation_paving_finish_handover"
      flow_role: "Direct energy"
      record_type: "Meter and plant log"
      raw_fields: "Carrier, quantity, node, shared hours"
      collection_method: "Reconcile meters and invoices"
      unit: "kWh, MJ, kg"
      frequency: "Daily or billing period"
      temporal_coverage: "Contract start to acceptance"
      site_scope: "Site and shared plant"
      aggregation_rule: "Allocate once by node usage"
      quality_evidence: "Meter and fuel slips"
    - protocol_id: cp_freight
      process_id: "paving"
      flow_role: "Freight"
      record_type: "Consignment"
      raw_fields: "Mass, mode, origin, destination, loaded distance, supplier scope"
      collection_method: "Delivery ticket reconciliation"
      unit: "t, km, t·km"
      frequency: "Each delivery"
      temporal_coverage: "Material delivery"
      site_scope: "Supply chain"
      aggregation_rule: "Sum mass × distance once"
      quality_evidence: "Transport documents"
    - protocol_id: cp_waste
      process_id: "formation_paving_finish_handover"
      flow_role: "Spoil and reject"
      record_type: "Weighbridge and transfer"
      raw_fields: "Type, mass, node, rework or receiver"
      collection_method: "Reconcile removal and destination"
      unit: "kg"
      frequency: "Each movement"
      temporal_coverage: "Contract start to acceptance"
      site_scope: "Site and receiver"
      aggregation_rule: "Count export once"
      quality_evidence: "Transfer receipt"
    - protocol_id: cp_acceptance
      process_id: "formation_paving_finish_handover"
      flow_role: "Handoff and final output"
      record_type: "Survey and test"
      raw_fields: "Segment, area, thickness, bearing, strength, markings, defect, signed date"
      collection_method: "Survey and test register"
      unit: "m2 and test units"
      frequency: "Every hold point"
      temporal_coverage: "Contract start to handover"
      site_scope: "Continuous segment"
      aggregation_rule: "Sum non-overlapping accepted area"
      quality_evidence: "Signed test and handover"
  calculation_rules:
    - id: normalize_area
      applies_to: "every row"
      rule: "Divide measured amount by signed accepted area, retaining rejects and rework in numerator."
      inputs:
        - "Quantity and accepted survey area"
      output: "Quantity/m2"
      source_ids:
        - faa-ac-150-5370-10
    - id: mass_conversion
      applies_to: "volume or count"
      rule: "Convert using recorded density or item mass, not a universal layer thickness."
      inputs:
        - "Volume/count and density/item mass"
      output: "kg"
      source_ids:
        - faa-ac-150-5370-10
    - id: freight_calculation
      applies_to: "deliveries"
      rule: "Sum non-overlapping loads × loaded distances."
      inputs:
        - "Consignment tonnes and km"
      output: "t·km/m2"
      source_ids:
        - faa-ac-150-5370-10
    - id: internal_balance
      applies_to: "process edges"
      rule: "Equalize formation output with paving input and laid-pavement output with finishing input."
      inputs:
        - "Surveyed hold-point area"
      output: "Paired internal m2"
      source_ids:
        - faa-ac-150-5370-10
  data_quality_requirements:
    - id: identity
      applies_to: "asset and layers"
