allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "allocate_shared: Subdivide by building and node first. Attribute shared cranes, utilities, access and site works by measured hours, meter or physical area across all consuming nodes in the represented project period; shares reconcile to one total."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocate_secondary: For recycled inputs, retain supplier origin and recovery handoff, then apply one declared upstream inherited-burden or cut-off treatment. Add current transport/processing once and prohibit double credit. src_iso_21930."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "allocate_rework: Retain original burdens on the producing node; add incremental rework inputs once. Only accepted reinspection enters the shell or building output. Rejected exits are not coproducts without verified use and handoff."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "allocate_multiple_buildings: Measure each separately handed-over building and allocate shared work by actual use or disclosed physical driver; do not pool unlike uses without sensitivity check."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "ground_foundation_frame_envelope_building_completion"
      flow_role: "delivered and installed products"
      record_type: "as-built schedule; delivery ticket"
      raw_fields: "material; grade; supplier; mass_or_volume; density; installed_quantity; recycled_origin; handoff"
      collection_method: "reconcile bill of quantities and installation log"
      unit: "kg; m3; item"
      frequency: "each delivery"
      temporal_coverage: "complete project"
      site_scope: "each building/supplier"
      aggregation_rule: "sum by material and node, retain rejects"
      quality_evidence: "tickets; plans; supplier declaration"
    - protocol_id: cp_site_operations
      process_id: "all_three_nodes"
      flow_role: "fuel, power, water, plant"
      record_type: "meter; fuel ticket; equipment log"
      raw_fields: "carrier; quantity; equipment_hours; water_m3; node; period"
      collection_method: "reconcile meter and ticket to node"
      unit: "kWh; L; kg; m3; h"
      frequency: "each meter period/shift"
      temporal_coverage: "works through handover"
      site_scope: "site"
      aggregation_rule: "sum by carrier/node; allocate shared once"
      quality_evidence: "meter checks; invoices; shift log"
    - protocol_id: cp_transport
      process_id: "frame_envelope"
      flow_role: "inbound freight"
      record_type: "waybill"
      raw_fields: "product; mode; load_t; leg_km; return"
      collection_method: "reconcile supplier origin and delivery"
      unit: "t; km; tonne-km"
      frequency: "each leg"
      temporal_coverage: "complete project"
      site_scope: "supplier to site"
      aggregation_rule: "sum tonnes × km by leg/mode"
      quality_evidence: "waybill; route evidence"
    - protocol_id: cp_waste
      process_id: "all_three_nodes"
      flow_role: "rejects and exits"
      record_type: "weighbridge; rejection log"
      raw_fields: "node; material; mass; rework; reuse; recovery; disposal; destination"
      collection_method: "reconcile material balance and receipt"
      unit: "kg"
      frequency: "each rejection/shipment"
      temporal_coverage: "complete project"
      site_scope: "site"
      aggregation_rule: "count each exit once"
      quality_evidence: "weighbridge; handler receipt"
    - protocol_id: cp_acceptance
      process_id: "all_three_nodes"
      flow_role: "accepted states"
      record_type: "inspection; handover; drawing"
      raw_fields: "foundation_acceptance; shell_acceptance; systems_tests; date; floor_area_m2"
      collection_method: "signed acceptance and area measurement"
      unit: "m2; date"
      frequency: "each milestone"
      temporal_coverage: "through handover"
      site_scope: "one building"
      aggregation_rule: "accepted area once"
      quality_evidence: "signed handover; as-built drawing"
  calculation_rules:
    - id: calc_area
      applies_to: "all nodes"
      rule: "Divide whole-building quantity by accepted gross floor area; retain total."
      inputs:
        - area
        - quantity
      output: "amount per m2"
      source_ids:
        - src_ec_levels
    - id: calc_material_balance
      applies_to: "each material"
      rule: "Delivered = installed + rejected exit + returned stock + inventory change, accounting for documented internal reuse once."
      inputs:
        - delivery
        - install
        - reject
        - return
        - stock
      output: "balanced account"
      source_ids:
        - src_ec_levels
    - id: calc_freight
      applies_to: "inbound freight"
      rule: "Sum carried tonnes × actual one-way km by leg and mode; disclose return treatment."
      inputs:
        - load_t
        - leg_km
        - mode
      output: "tonne-km"
      source_ids:
        - src_ec_gwp
    - id: calc_shared
      applies_to: "shared assets"
      rule: "Attribute recorded total across consumers by measured use in project period; sum shares to one."
      inputs:
        - "asset total"
        - "node use"
        - period
      output: "node burden"
      source_ids:
        - src_ec_levels
  data_quality_requirements:
    - id: quality_identity
      applies_to: "building"
      requirement: "Verify use, classification exclusions, floor-area method and accepted gate."
      evidence: "use description; plans; handover"
    - id: quality_quantity
      applies_to: "inventory"
      requirement: "Preserve primary records, units, conversions, missing periods and supplier coverage."
      evidence: "tickets; meters; BoQ; calculations"
    - id: quality_rework
      applies_to: "all nodes"
      requirement: "Reconcile accepted, rejected and reworked material without duplicated output."
      evidence: "inspection; waste/rework log"
    - id: quality_shared
      applies_to: "shared assets"
      requirement: "List all consuming buildings/nodes, period and allocation driver; shares sum to total."
      evidence: "equipment log; worksheet"
    - id: quality_uuid
      applies_to: "final exchanges"
