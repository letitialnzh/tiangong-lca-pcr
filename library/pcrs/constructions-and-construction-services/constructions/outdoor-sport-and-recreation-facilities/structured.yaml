system_boundary:
  rules:
    - rule_id: construction_gate
      applies_to: "whole facility"
      rule: "Include contracted preparation, construction, pre-handover establishment/testing and defect closeout; exclude post-handover maintenance."
      source_ids:
        - unsd-cpc3-notes
        - epa-gi-install
    - rule_id: removal_gate
      applies_to: "prepare_site"
      rule: "Source is existing soil, vegetation or built material; separate on-site reuse and export. Accepted prepared ground hands to forming."
      source_ids:
        - site-mass-balance
    - rule_id: forming_gate
      applies_to: "form_base"
      rule: "Prepared ground plus fill/structural material becomes inspected base or hardscape support; failed sections loop to repair."
      source_ids:
        - site-mass-balance
    - rule_id: integration_gate
      applies_to: "integrate_assets"
      rule: "Receive accepted base and separately identified route components; install and inspect before finishing or acceptance."
      source_ids:
        - unsd-cpc3-notes
    - rule_id: finish_gate
      applies_to: "finish_surface"
      rule: "Where specified, finish an established parent asset with surface, protection or planting; separate rejected area/residue."
      source_ids:
        - epa-gi-install
    - rule_id: family_delta
      applies_to: "integrate_assets; finish_surface"
      rule: "Declare family-specific material, finish and test delta; mixed routes partition shared works once."
      source_ids:
        - unsd-cpc3-notes
        - epa-parks-guide
boundary_abstraction:
