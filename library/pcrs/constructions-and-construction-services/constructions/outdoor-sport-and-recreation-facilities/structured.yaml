    applies_to: "integrate_assets"
    rule: "Require actual schedule, finish and tests for each family; reject universal turf, planting or marina bills."
    source_ids:
      - unsd-cpc3-notes
      - epa-parks-guide
  - rule_id: handoff_check
    applies_to: "all nodes"
    rule: "Match internal handoffs, non-overlapping area and material balances; count common work once."
    source_ids:
      - site-mass-balance
  - rule_id: finish_check
    applies_to: "finish_surface"
    rule: "If activated, document parent, inputs, inspected finish and reject path; otherwise send installed asset directly to acceptance."
    source_ids:
      - epa-gi-install
  - rule_id: reject_check
    applies_to: "all nodes"
    rule: "Rework stays with producing node; waste exits have destination and cannot become accepted output."
    source_ids:
      - site-mass-balance
  - rule_id: range_role
    applies_to: "all cards"
    rule: "QA ratios are consistency tests, never universal construction intensities."
