allocation_rules:
  - rule_id: single_asset
    applies_to: "accepted output"
    rule: "Attribute construction to one signed asset; attendance and later maintenance are not co-products."
    source_ids:
      - unsd-cpc3-notes
  - rule_id: mixed_family
    applies_to: "mixed site"
    rule: "Partition measurable subareas by as-built quantities; allocate genuinely shared works once by engineering driver or metered use."
    source_ids:
      - site-mass-balance
  - rule_id: reuse_and_spoil
    applies_to: "site material"
    rule: "Internal cut reuse retains removal burden; export records destination without unsupported avoided-product credit."
    source_ids:
      - site-mass-balance
  - rule_id: rework_retention
    applies_to: "rejected work"
    rule: "Return failed base, component or finish to producing node; retain repair burden there, never on extra accepted output."
    source_ids:
      - site-mass-balance
