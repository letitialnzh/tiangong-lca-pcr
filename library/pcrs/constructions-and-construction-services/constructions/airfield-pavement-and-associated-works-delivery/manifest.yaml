review_metadata:
  scientific_review: pending
  semantic_boundary: Physical delivered runways, taxiways, aprons and related
    non-building works, including actual flexible, rigid and aggregate/turf
    routes. Not construction services or airport buildings.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: mineral_fill
      flow_name: Imported mineral soil fill
      reason: Direct-read e328346a-1ddc-4fe7-a392-58847784aa9d is an Area-based
        foundation backfill service for ex-situ soil remediation;
        8cde66d1-7452-4f60-9679-a39c33ee5ef1 is caisson PRB gate soil. Neither
        establishes the supplied mineral-fill mass identity.
    - row_id: crushed_base
      flow_name: Crushed stone pavement base aggregate
      reason: Public gravel/round aggregate and quarry-route candidates do not
        establish actual specified crushed base grading; no grading or source
        imposed.
    - row_id: hydrated_lime
      flow_name: Hydrated lime for subgrade stabilization
      reason: Bounded hydrated-lime search returns quicklime and unspecified basic
        inorganic compounds. Actual hydration and formulation are required; no
        quicklime substitution accepted.
    - row_id: pp_geotextile
      flow_name: Polypropylene geotextile separation sheet
      reason: Public area polypropylene textile a1636f59-5d71-4cdc-947b-4de0f3bc0d47
        is Korean biopile remediation input, not this airport separation-fabric
        route.
    - row_id: asphalt_emulsion
      flow_name: Bitumen emulsion for pavement tack coat
      reason: Emulsion searches return neat Asphalt
        4e256aeb-9d90-4e11-9e58-4299c38c424b or whole Asphalt mixture, not the
        water-containing tack-coat emulsion and its residual binder state.
    - row_id: fresh_concrete
      flow_name: Fresh cement concrete delivered before paving
      reason: Direct-read cast-in-place concrete is placed state and generic Concrete
        does not establish fresh cement-concrete volume. No actual batch
        density/property conversion established.
    - row_id: steel_dowel
      flow_name: Steel pavement joint dowel bar
      reason: Searches return steel frame, baling band and generic steel products, not
        finished pavement dowel bars with actual coating and geometry.
    - row_id: wax_curing
      flow_name: Paraffin-wax emulsion concrete curing compound
      reason: Specific paraffin-emulsion curing queries return concrete, floor-slab
        and paving-brick products; not this formulated curing compound. No raw
        wax-as-formulation substitution.
    - row_id: plywood_form
      flow_name: Plywood concrete formwork panel
      reason: Public plywood candidates 8b239d58-5fc2-40a5-8003-33f4082bc995 and
        e7e76e7b-5fee-40bf-a67a-ff4dd662bf39 use Mass or Volume, not this panel
        deployment area. Actual thickness, density and cumulative reuse are
        required; no property relabeling.
    - row_id: topsoil
      flow_name: Screened topsoil for turf pavement
      reason: Direct-read 63d129ff-c7fc-4215-a598-db3a727b75c6 is in-ground elementary
        topsoil resource, not screened supplied topsoil product;
        contaminated-soil candidates have unrelated remediation state.
    - row_id: grass_sod
      flow_name: Cultivated grass sod with rooting soil
      reason: Bounded grass-sod search returns peat and artificial grass
        6dafa8b7-0030-419e-8744-711c49ad7352, not live cultivated rooting-soil
        sod. No biological/physical equivalence asserted.
    - row_id: concrete_pipe
      flow_name: Precast cement-concrete storm-drain pipe
      reason: Specific storm-drain-pipe search returned plastic, ceramic and oil/gas
        steel pipe products, not the actual cement-concrete drainage pipe.
        Actual diameter, grade and supplier mass needed.
    - row_id: white_paint
      flow_name: White waterborne acrylic pavement marking paint
      reason: Direct-read 53da405d-2568-4918-b22d-b5440049e8c6 is solvent-based
        coating, not white waterborne acrylic pavement paint; UV ink and dye
        candidates do not establish marking paint.
    - row_id: yellow_paint
      flow_name: Yellow waterborne acrylic pavement marking paint
      reason: Direct-read solvent-based coating 53da405d-2568-4918-b22d-b5440049e8c6
        and dye/ink candidates do not establish the yellow waterborne acrylic
        pavement formulation.
    - row_id: glass_beads
      flow_name: Glass retroreflective beads for pavement markings
      reason: Direct-read 56932669-9eec-47ff-a6b7-a542c0d99f78 describes
        abrasive/blasting glass beads; not verified retroreflective marking
        beads with actual optical specification.
    - row_id: airfield_light
      flow_name: Complete inset airfield LED luminaire
      reason: Specific airport-inset-light query returned unrelated inks/dyes. No
        complete installed airfield LED luminaire identity established; a
        module, driver or whole system cannot substitute.
    - row_id: copper_cable
      flow_name: Insulated copper airfield lighting cable
      reason: Direct-read power-cable candidates require voltage/conductor/insulation
        state matching and some have energy reference property; no project cable
        mass conversion established.
    - row_id: excavator_asset
      flow_name: Complete hydraulic excavator
      reason: Candidate 645fa364-a4cf-442a-bbf0-5a0a466cc4dc is demolition-equipment
        amortisation, 5fa6e267-9c8b-4950-b418-5bf7e6ab3cac has
        dismantling/recycling route, and c340fecf-0b21-4407-a79a-f0f4a86ac11a is
        a coated assembly; no new complete hydraulic excavator count identity
        adopted.
    - row_id: roller_asset
      flow_name: Complete self-propelled road roller
      reason: Public cfdba1d0-b123-4fb3-8c75-2fc7c6f9b9c1 is broad self-propelled
        tamping machines/road rollers with Mass reference. No
        configuration-specific mass-to-item support for the actual asset
        allocation.
    - row_id: paver_asset
      flow_name: Complete asphalt paving machine
      reason: Specific asphalt-paver search returned asphalt, mixtures and paving
        bricks, not a complete paving-machine manufacture identity.
    - row_id: pump_asset
      flow_name: Complete cement-concrete pump
      reason: Generic Pump bbd91be4-dc00-44c2-8bc1-f67ee79174a7 does not establish a
        complete cement-concrete pump asset; no complete-unit property relation
        adopted.
    - row_id: supplied_water
      flow_name: Treated mains water delivered to construction site
      reason: Direct-read volume Tap water 3a8411b6-e476-4f98-9d77-0d492661a07f is
        Hong Kong supply; no generic project geography match. Other public
        candidates have Mass with no batch-specific density support.
    - row_id: soil_export
      flow_name: Non-contaminated excavated mineral soil for off-site disposal
      reason: Soil-remediation waste candidates require contaminated/hazardous
        conditions; in-ground soil resources and supplied backfill products do
        not identify uncontaminated excavated soil exported for disposal.
    - row_id: asphalt_waste
      flow_name: Removed asphalt pavement milling waste
      reason: Bounded waste-asphalt query returns mixed construction waste, coal-tar
        residue and excavated asphalt product states. No verified segregated
        pavement milling Waste flow matched.
    - row_id: concrete_waste
      flow_name: Hardened cement-concrete construction waste
      reason: Public f23875ac-3a7f-48d2-9f97-c8b233783b2d is a mixed Construction
        waste Product flow; a481a93d-945d-4395-8b93-e28d5d7d7d52 is generic
        disposal Waste flow. Neither identifies segregated hardened
        cement-concrete debris.
    - row_id: washout_liquid
      flow_name: Cement-concrete equipment washout slurry
      reason: Direct-read d2d44ce1-c0f4-461d-9413-f4b33e0d200f is washing
        electrolytic-manganese-slag material wastewater. Generic
        water/resource/industrial treatment candidates do not identify
        concrete-equipment washout slurry.
    - row_id: reference_airfield
      flow_name: Delivered airfield pavement assembly with associated non-building works
      reason: Public Airfield runways flow 244147b4-2fe1-49dc-bd0d-58e37f922162 uses
        Mass; no supported delivered-assembly mass-to-area relation. Retain
        exact area-based output unresolved.
  method_review_limits:
    - Scientific and translation review remain pending; aligned translation is
      not independent review.
    - Area normalization requires actual accepted geometry and attribution;
      comparison requires equivalent use/load/structure and all disclosed gates.
    - No default ratios, energy, losses, lifetime, emissions or asset-service
      denominator. Actual missing exchanges require individually specified rows
      before dataset completeness.
