allocation_rules:
  - rule_id: facility_scope
    applies_to: "multiple facilities in one contract"
    rule: "Assign direct works first; allocate inseparable shared plant, roads or utilities by documented physical use, with fractions summing to one."
    source_ids:
      - reference-definition
  - rule_id: spoil_destination
    applies_to: "removed ground"
    rule: "Keep reuse in the site balance; record exported material by receiver and treatment. No substitution credit without separate evidence."
    source_ids:
      - mass-balance-identity
  - rule_id: rework_reject
    applies_to: "failed support and installation"
    rule: "Retain rework in its producing node; route final exits once to recovery or disposal; exclude rejected work from accepted output."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "support_forming_facility_integration"
      flow_role: "permanent components"
      record_type: "deliveries and as-built bill"
      raw_fields: "specification, received, installed, returns, stock, rejects, recycled origin"
      collection_method: "invoices and signed schedule"
      unit: "kg, item, m3"
      frequency: "each delivery"
      temporal_coverage: "preparation through handover"
      site_scope: "named facility"
      aggregation_rule: "reconcile each material"
      quality_evidence: "bills and certificates"
    - protocol_id: cp_energy
      process_id: "ground_removal_support_forming_facility_integration"
      flow_role: "site energy"
      record_type: "meter and machine log"
      raw_fields: "carrier, amount, node, date, generator output, shared users"
      collection_method: "meter, invoice and log"
      unit: "kWh, MJ, kg, L"
      frequency: "weekly"
      temporal_coverage: "construction and tests"
      site_scope: "named facility"
      aggregation_rule: "sum by node and remove double counts"
      quality_evidence: "meter and invoices"
    - protocol_id: cp_water
      process_id: "support_forming"
      flow_role: "process water"
      record_type: "meter and invoice"
      raw_fields: "source, volume, density, use, return"
      collection_method: "meter and site log"
      unit: "m3, kg"
      frequency: "weekly"
      temporal_coverage: "preparation to support gate"
      site_scope: "named facility"
      aggregation_rule: "convert and reconcile source"
      quality_evidence: "readings and invoices"
    - protocol_id: cp_excavation
      process_id: "ground_removal_support_forming"
      flow_role: "ground and geometry"
      record_type: "survey and work log"
      raw_fields: "in-situ volume, supported length, area, soil/rock state, density"
      collection_method: "as-built survey"
      unit: "m3, m, m2, kg"
      frequency: "each work package"
      temporal_coverage: "preparation to support gate"
      site_scope: "named opening/foundation"
      aggregation_rule: "sum unique surveyed work"
      quality_evidence: "drawings and survey"
    - protocol_id: cp_residuals
      process_id: "ground_removal_support_forming_facility_integration"
      flow_role: "spoil and rejects"
      record_type: "waste and rework log"
      raw_fields: "material, origin, mass, reuse, rework, export, receiver, stock"
      collection_method: "weighbridge and transfer tickets"
      unit: "kg"
      frequency: "each movement"
      temporal_coverage: "full construction"
      site_scope: "named facility"
      aggregation_rule: "balance origin and destination"
      quality_evidence: "tickets and receipts"
    - protocol_id: cp_freight
      process_id: "facility_integration"
      flow_role: "inbound components"
      record_type: "dispatch record"
      raw_fields: "tonnes, distance, mode, supplier gate"
      collection_method: "waybill and route log"
      unit: "t, km, t*km"
