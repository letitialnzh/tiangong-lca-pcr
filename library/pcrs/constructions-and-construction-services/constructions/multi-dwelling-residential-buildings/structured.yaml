allocation_rules:
  - rule_id: whole_building
    applies_to: "whole-building reference"
    rule: "Assign shared cores, corridors, lifts and central services once to the accepted building. For a separately declared dwelling-level view, allocate by measured area or a justified service driver while preserving the building total."
    source_ids:
      - ec-levels
  - rule_id: shared_site_assets
    applies_to: "crane, scaffold, formwork and utilities"
    rule: "Record each consuming node/building and service period; allocate observed use directly or with a documented causal driver and charge each share once."
    source_ids:
      - ec-levels
  - rule_id: secondary_materials
    applies_to: "recovered components"
    rule: "Identify previous use and recovery handoff; declare supplier-gate burden treatment, exclude already assigned prior-system burdens and do not double-count recovery."
    source_ids:
      - ec-levels
  - rule_id: reject_rework
    applies_to: "off-spec materials and work"
    rule: "Retain failed-attempt input and energy in the producing node, trace correction and boundary exit, and exclude rejects from accepted output."
    source_ids:
      - ec-levels
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "site_foundation_assembly_services_finish_handover"
      flow_role: "materials and components"
      record_type: "as-built schedule and deliveries"
      raw_fields: "specification, quantity, unit, supplier gate, recycled fraction, installed node, rejects"
      collection_method: "reconcile invoices, deliveries and as-built schedule"
      unit: "kg, m2, item"
      frequency: "each delivery/change"
      temporal_coverage: "full construction"
      site_scope: "whole building"
      aggregation_rule: "installed plus rejects less returns by product"
      quality_evidence: "signed quantities and invoices"
    - protocol_id: cp_site_operations
      process_id: "assembly_services"
      flow_role: "site energy"
      record_type: "meters and fuel logs"
      raw_fields: "carrier, meter, fuel, machine hours, task, date"
      collection_method: "site log reconciliation"
      unit: "kWh, MJ, h"
      frequency: "shift or billing period"
      temporal_coverage: "full construction"
      site_scope: "site and shared assets"
      aggregation_rule: "attribute logged use to building once"
      quality_evidence: "meters and fuel tickets"
    - protocol_id: cp_waste
      process_id: "site_foundation_assembly_services_finish_handover"
      flow_role: "spoil and rejects"
      record_type: "transfer and reuse log"
      raw_fields: "node, material, hazard, quantity, destination, reuse"
      collection_method: "weighbridge and site bins"
      unit: "kg, m3"
      frequency: "each movement"
      temporal_coverage: "full construction"
      site_scope: "whole site"
      aggregation_rule: "external exits by destination net internal reuse"
      quality_evidence: "signed waste receipts"
    - protocol_id: cp_acceptance
      process_id: "site_foundation_assembly_services_finish_handover"
      flow_role: "accepted stages/building"
      record_type: "inspection and handover"
      raw_fields: "stage acceptance, service tests, defects, dwelling count, gross floor area, handover date"
      collection_method: "drawings and signed certificates"
      unit: "building, m2, date"
      frequency: "each gate"
      temporal_coverage: "through handover"
      site_scope: "whole building"
      aggregation_rule: "count accepted building once"
      quality_evidence: "signed commissioning and handover file"
  calculation_rules:
    - id: material_balance
      applies_to: "material cards"
      rule: "Delivered less returns equals installed plus waste plus stock change; explain residuals."
      inputs:
        - deliveries
        - returns
        - installed
        - waste
        - stock
      output: "reconciled material quantity"
      source_ids:
        - ec-levels
    - id: energy_total
      applies_to: "site energy"
      rule: "Sum logged carrier energy attributed to this building, preserving carrier identity."
      inputs:
        - meter
        - fuel
        - "allocation driver"
      output: "kWh or MJ by carrier"
      source_ids:
        - ec-building-gwp
    - id: area_intensity
      applies_to: "reporting"
      rule: "Divide whole-building result by measured gross floor area; retain the per-building total."
      inputs:
        - "accepted building"
        - area
      output: "per-m2 intensity"
      source_ids:
        - ec-levels
  data_quality_requirements:
    - id: dq_identity
      applies_to: "building"
      requirement: "Verify at least three dwellings or eligible community accommodation, common spaces and fixed-service scope."
      evidence: "signed as-built drawings and acceptance"
    - id: dq_reconciliation
      applies_to: "materials/waste"
      requirement: "Reconcile as-built, supplied, returned, installed and discarded quantities by product."
      evidence: "schedule, invoices, waste tickets"
    - id: dq_shared
      applies_to: "shared assets"
      requirement: "Cover all consuming buildings/nodes and service periods without duplicate assignment."
      evidence: "dated asset and utility logs"
    - id: dq_handover
      applies_to: "reference output"
      requirement: "Count only after included systems pass tests and defects close."
      evidence: "signed commissioning and handover file"
validation_rules:
  - rule_id: validate_identity
    applies_to: "reference product"
    rule: "Confirm three or more dwellings or community residence, one completed building, site handover and measured area; reject an at-plant Mass flow substitute."
    source_ids:
      - unsd-cpc-53112
      - ec-levels
  - rule_id: validate_inventory
    applies_to: "cards"
    rule: "Match every as-built component to one node, inspect parent and finished handoffs, and trace each reject or waste destination."
    source_ids:
      - ec-levels
  - rule_id: validate_routes
    applies_to: "prefab alternative"
    rule: "Verify assembly parent and changed component, installation and waste records; do not duplicate site-built and prefabricated routes for one element."
    source_ids:
      - ec-levels
  - rule_id: validate_attribution
    applies_to: "shared and secondary inputs"
    rule: "Check all shared consumers and periods, secondary material origins and recovery gates, and absence of duplicate burden."
    source_ids:
      - ec-levels
published_dataset_profile:
  dataset_role: "Foreground construction package for one completed multi-dwelling residential building"
  downstream_use: "secondary_dataset; background_dataset only with compatible site, scope and handover gate"
  allowed_use: "Construction-stage modelling and separately identified lifecycle extensions"
  excluded_use: "Direct operational whole-life results, dwelling-level results without allocation, or at-plant product mass"
  required_metadata: "site, handover date, dwelling count or residence type, area convention, shared/core scope, fixed services, basement/parking, structural route, supplier gates"
  required_quality_disclosure: "missing bills, unmetered site energy, reconciliation gaps, shared attribution, unresolved UUIDs"
  update_trigger: "changed as-built scope, route, service acceptance, supplier gate or verified product identity"
module_references:
  selection_mode: "automatic"
  selected:
    - id: module.activity.assembly-integration-node
      kind: "activity"
      path: "library/modules/activities/assembly-integration-node.yaml"
      decision: "applicable"
    - id: module.activity.surface-finishing-node
      kind: "activity"
      path: "library/modules/activities/surface-finishing-node.yaml"
