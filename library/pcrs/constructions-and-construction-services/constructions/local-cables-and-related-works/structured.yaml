          property_unit: "Mass / kg"
          description: "Identify damaged/off-spec cable cuts, joints and equipment at integration. Record repair/re-test, supplier return, recovery or disposal; defects are not accepted output."
          amount:
            expression: "Reconcile defects, rework, return and final exit once."
