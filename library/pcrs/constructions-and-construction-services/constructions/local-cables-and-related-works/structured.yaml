allocation_rules:
  - rule_id: asset_schedule
    applies_to: "multi-asset package"
    rule: "Assign quantities to segments and station/tower assets by measured use; show package totals and component denominators; never compare unlike packages as equal route-km."
    source_ids:
      - record-match-identity
  - rule_id: shared_plant
    applies_to: "equipment and subcontract"
    rule: "Apportion shared equipment by metered hours or work quantity once and document joint trenches/supports shared with other networks."
    source_ids:
      - material-balance-identity
  - rule_id: defect_route
    applies_to: "rejected components"
    rule: "Retain defect burdens, link repair to asset_integration, identify return/recovery/disposal exits and exclude unresolved defects from accepted output."
    source_ids:
      - material-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_route
      process_id: "local_route_preparation"
      flow_role: "alignment and handoff"
      record_type: "survey and permit"
      raw_fields: "segment/site ID, route, length, excavation, clearance, readiness, acceptance"
      collection_method: "as-built survey and signed release"
      unit: "route-km, m3, site"
      frequency: "each segment/site"
      temporal_coverage: "preparation to handoff"
      site_scope: "whole delivery"
      aggregation_rule: "sum non-overlapping accepted segments/sites"
      quality_evidence: "survey and release"
    - protocol_id: cp_spoil
      process_id: "local_route_preparation"
      flow_role: "removed material"
      record_type: "dispatch and reuse log"
      raw_fields: "source, material, volume, mass, density, reuse, receiver"
      collection_method: "weighing and survey reconciliation"
      unit: "m3, kg"
      frequency: "each batch"
      temporal_coverage: "preparation"
      site_scope: "route/site and receiver"
      aggregation_rule: "exported mass net of reuse"
      quality_evidence: "dispatch and receipt"
    - protocol_id: cp_plant
      process_id: "both_nodes"
      flow_role: "energy"
      record_type: "meter and fuel log"
      raw_fields: "carrier, quantity, equipment, hours, route/site, subcontract scope"
      collection_method: "meter and invoice cross-check"
      unit: "kWh, MJ, kg"
      frequency: "shift or month"
      temporal_coverage: "construction to tests"
      site_scope: "all sites"
      aggregation_rule: "allocate measured use once"
      quality_evidence: "meter and receipt"
    - protocol_id: cp_components
      process_id: "asset_integration"
      flow_role: "components and defects"
      record_type: "lot, installation and QA ledger"
      raw_fields: "component, specification, delivered, installed, spare, reject, repair, return, destination"
      collection_method: "supplier/as-built reconciliation"
      unit: "m, kg, item"
      frequency: "each lot"
      temporal_coverage: "arrival to acceptance"
      site_scope: "each asset"
      aggregation_rule: "balance by component and function"
      quality_evidence: "invoice, schedule, defect report"
    - protocol_id: cp_subcontract
      process_id: "asset_integration"
      flow_role: "joining and tests"
      record_type: "contract and invoice"
      raw_fields: "scope, function, asset, quantity, owned-work exclusion"
      collection_method: "contract-to-test reconciliation"
      unit: "declared service unit"
      frequency: "each contract"
      temporal_coverage: "integration to test"
      site_scope: "contracted scope"
      aggregation_rule: "sum accepted nonduplicated scope"
      quality_evidence: "invoice and test dossier"
    - protocol_id: cp_acceptance
      process_id: "asset_integration"
      flow_role: "reference package"
      record_type: "commissioning dossier"
      raw_fields: "function, asset schedule, route length, station/tower count, specification, failed/passed tests, handover"
      collection_method: "signed test and acceptance"
      unit: "package, route-km, item"
      frequency: "each handover"
      temporal_coverage: "completion"
      site_scope: "whole delivery"
      aggregation_rule: "count signed package once"
      quality_evidence: "test and handover certificate"
  calculation_rules:
    - id: accepted_package
      applies_to: "output"
      rule: "Count one package only after all declared assets pass; sum accepted route lengths and related-asset counts separately."
      inputs:
        - schedule
        - survey
        - tests
      output: "package plus route-km and item schedule"
      source_ids:
        - record-match-identity
    - id: component_balance
      applies_to: "components"
      rule: "Received = installed + spare/return + final reject + stock change by specification; rework enters once."
      inputs:
        - "invoice and QA ledger"
      output: "m, kg or item"
      source_ids:
        - material-balance-identity
    - id: spoil_balance
      applies_to: "preparation"
      rule: "Exported mass = weighed dispatch or surveyed volume × measured density minus reused mass."
      inputs:
        - survey
        - density
        - dispatch
        - reuse
      output: "kg/package"
      source_ids:
        - material-balance-identity
    - id: energy_normalization
      applies_to: "plant"
      rule: "Convert carriers with declared factors, allocate to accepted package once and avoid generator fuel/electricity double count."
      inputs:
        - meters
        - fuel
        - hours
      output: "carrier inventory/package"
      source_ids:
        - material-balance-identity
  data_quality_requirements:
    - id: asset_identity
      applies_to: "delivery"
      requirement: "Record function, place, route, schedule, interface and accepted quantity."
      evidence: "design and signed as-built dossier"
    - id: function_tests
      applies_to: "cable and station"
      requirement: "Preserve electrical insulation/continuity/safety, optical loss/continuity or station/tower tests as applicable."
      evidence: "signed test dossier"
    - id: balances
      applies_to: "material"
      requirement: "Explain unmatched length/mass, excavation, reuse, rejects and repair."
      evidence: "reconciled ledger and receipts"
    - id: uuid_disclosure
      applies_to: "unbound flow"
      requirement: "Preserve supplier and as-built specification until exact platform identity and support rows are confirmed."
      evidence: "specification and manifest gap"
validation_rules:
  - rule_id: package_gate
    applies_to: "reference output"
    rule: "Require local-network function, asset schedule, applicable tests and signed handover; station-only work may have zero cable route-km."
    source_ids:
      - unsd-cpc3-53252
      - itu-g6503
  - rule_id: route_delta_check
    applies_to: "segment"
    rule: "Require trench/duct/backfill underground or poles/supports/stringing overhead; choose one route per physical segment."
    source_ids:
      - rus-underground-distribution
  - rule_id: handoff_check
    applies_to: "graph"
    rule: "Match prepared and received segment/site IDs and require a receiver for exported spoil."
    source_ids:
      - record-match-identity
      - material-balance-identity
  - rule_id: defect_check
    applies_to: "integration"
    rule: "Reject duplicate energy, unresolved defects as accepted, cable-m mistaken for route-km or station count folded into length."
    source_ids:
      - material-balance-identity
      - record-match-identity
  - rule_id: identity_gate
    applies_to: "exchange"
    rule: "Require exact detail-confirmed UUIDs before concrete exchange; manufactured cable or utility service is not installed works."
    source_ids:
      - record-match-identity
published_dataset_profile:
  dataset_role: "Site-specific construction foreground package; candidate method until review."
  downstream_use: "Secondary/background dataset only with matched function, route, asset schedule and handover."
  allowed_use: "Construction burdens for the specified accepted package, with line and station quantities separate."
  excluded_use: "Cable manufacture alone, utility service, long-distance network or comparison of unlike packages as route-km."
  required_metadata: "Geography, year, function, route-km, cable lengths, voltage/fibres, station/tower schedule, reused assets and handover."
  required_quality_disclosure: "Survey, route alternatives, component and spoil balance, shared plant, rejects, provisional ranges and unbound identities."
  update_trigger: "Boundary, route, design, asset mix, quantities, acceptance criteria or verified platform identity changes."
module_references:
  selection_mode: "automatic"
  selected:
    - id: module.activity.assembly-integration-node
      kind: "activity"
      path: "library/modules/activities/assembly-integration-node.yaml"
      decision: "applicable"
    - id: module.activity.resource-removal-node
      kind: "activity"
      path: "library/modules/activities/resource-removal-node.yaml"
      decision: "applicable"
    - id: module.technology.alternative-technology-route
      kind: "technology"
      path: "library/modules/technologies/alternative-technology-route.yaml"
      decision: "applicable"
    - id: module.system-condition.rework-reject-routing
      kind: "system_condition"
      path: "library/modules/system-conditions/rework-reject-routing.yaml"
      decision: "applicable"
  unresolved:
    []
data_sources:
  - id: "unsd-cpc3-53252"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, subclass 53252, https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Category boundary and related assets."
  - id: "rus-underground-distribution"
    type: "official_guidance"
    reference: "USDA Rural Utilities Service Bulletin 1728F-806, Specifications and Drawings for Underground Electric Distribution, https://www.rd.usda.gov/files/UEP_Bulletin_1728F-806.pdf"
    used_for: "Underground installation roles."
  - id: "itu-g6503"
    type: "standard"
    reference: "ITU-T G.650.3 (2017), Test methods for installed single-mode optical fibre cable links, https://www.itu.int/epublications/publication/itu-t-g-650-3-2017-08-test-methods-for-installed-single-mode-optical-fibre-cable-links"
    used_for: "Communication-link test gate."
  - id: "record-match-identity"
