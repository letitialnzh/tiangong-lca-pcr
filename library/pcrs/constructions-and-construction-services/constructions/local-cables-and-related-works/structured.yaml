          name: "Removed local-route material requiring external management"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Record source, reuse, export and receiver. Approved backfill retained on site is not exported waste."
          amount:
            expression: "Weigh dispatch or convert surveyed volume using tested density, net of reuse."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per accepted package"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_spoil
              source_ids: []
            ranges:
