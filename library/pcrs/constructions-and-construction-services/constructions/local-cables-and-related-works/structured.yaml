measurement_rules:
  - id: package_count
    applies_to: "reference"
    required_property_ref:
      name: "Count, UUID unresolved"
      uuid: ""
    required_unit: "accepted package"
    rule: "Count each independently signed delivery once; unlike packages are not comparable without asset disaggregation."
  - id: route_length
    applies_to: "cable"
    required_property_ref:
      name: "Length"
      uuid: ""
    required_unit: "route-km"
    rule: "Sum surveyed non-overlapping accepted local segments; circuits and fibres do not multiply route length."
  - id: component_quantity
    applies_to: "components"
    required_property_ref:
      name: "Length, mass or count"
      uuid: ""
    required_unit: "m, kg or item"
