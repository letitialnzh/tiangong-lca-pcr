                evidence_kind: "reasoned_estimate"
                source_ids: []
        - row_id: support_equipment
          role: "Supports, ducts and equipment"
          name: "Local support and related-asset components by specification"
          flow_type: "product"
          property_unit: "Mass or count / kg or item"
          description: "Record ducts, poles, towers, foundations, transformers, switchgear, cabinets, antennas and protection only when installed in the declared package; supplier ledger splits component roles."
          amount:
