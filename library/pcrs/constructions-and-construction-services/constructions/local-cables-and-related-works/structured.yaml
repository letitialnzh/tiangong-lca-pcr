          description: "Count only assets passing function-specific tests and signed handover; attach an asset schedule rather than assuming universal route-km."
          amount:
            expression: "Count one signed package with separately accepted line and station/tower quantities."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per accepted package"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
