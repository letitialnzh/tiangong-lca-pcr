            specificity: "site_specific"
            basis:
              text: "per accepted package"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_plant
              source_ids: []
            ranges:
              - role: qa_guardrail
                lower: "0"
                upper: "10000000"
                unit: "MJ-equivalent/accepted package"
                basis: "broad check; carrier meters control"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids: []
        - row_id: specialist_work
