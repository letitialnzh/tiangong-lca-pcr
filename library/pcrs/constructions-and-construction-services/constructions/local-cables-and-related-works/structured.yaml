          flow_type: "product"
          property_unit: "Service quantity / declared unit"
          description: "Conditional purchased termination, splicing, lifting or testing. Define the contractor's scope and avoid duplicated owned plant/labour."
          amount:
            expression: "Allocate invoiced accepted work to segment or station."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per accepted package"
