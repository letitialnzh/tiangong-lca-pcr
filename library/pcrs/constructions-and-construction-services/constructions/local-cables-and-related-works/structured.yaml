          name: "Prepared local route or related-asset site"
          flow_type: "product"
          property_unit: "Length or count / route-km or site"
          description: "Internal handoff records the segment or site identity later received by integration; it is not an accepted cable asset."
          amount:
            expression: "Sign off prepared alignment/site by as-built survey."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per accepted package"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_route
              source_ids: []
            ranges:
              - role: qa_guardrail
                lower: "0"
                upper: "1"
