process_map:
  - id: local_route_preparation
    name: "Local route and site preparation"
    inclusion: "conditional"
    inclusion_condition: "New corridor, excavation or foundation preparation occurs."
    role: "Remove ground/obstructions, pass accepted prepared segment/site and route residuals."
    quantitative_reference: "Route-km, site count and excavated volume."
  - id: asset_integration
    name: "Cable and related-asset integration and acceptance"
    inclusion: "required"
    inclusion_condition: "All declared packages."
    role: "Join cables, supports/ducts, joints and in-scope station/tower components; test, accept or route defects."
    quantitative_reference: "One accepted package with route-km and asset schedule."
