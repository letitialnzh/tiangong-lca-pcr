                evidence_kind: "method_formula"
                source_ids:
                  - material-balance-identity
      elementary:
        []
  - id: asset_integration
    label: "Cable and related-asset integration and acceptance"
    inputs:
      product:
        - row_id: prepared_handoff
          role: "Prepared-route or site handoff"
          name: "Prepared local route/site from local_route_preparation"
          flow_type: "product"
          property_unit: "Length or count / route-km or site"
