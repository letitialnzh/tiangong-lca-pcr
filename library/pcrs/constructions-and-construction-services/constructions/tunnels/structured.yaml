allocation_rules:
  - rule_id: shared_equipment
    applies_to: "boring machine, pumps, power and access used by both nodes or projects"
    rule: "List consuming nodes and periods. Attribute by logged hours, meters, excavated volume or documented physical use; fractions sum to one."
    source_ids:
      - mass-balance-identity
  - rule_id: parallel_bores
    applies_to: "multiple bores"
    rule: "Assign bore-specific work directly; divide inseparable common work by physical use or bore-km, never multiply centreline-km output."
    source_ids:
      - reference-definition
  - rule_id: secondary_inputs
    applies_to: "recovered aggregate, steel or segment material"
    rule: "Document origin, recovery gate and prior-burden convention. Count recovery processing once; no unsupported substitution credit."
    source_ids:
      - mass-balance-identity
  - rule_id: reject_and_spoil
    applies_to: "spoil and failed work"
    rule: "Spoil is not an accepted co-product by default. Route reuse or disposal by receiver; retain rework burdens at producing node."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_excavation
      process_id: "excavation_support"
      flow_role: "excavation service"
      record_type: "contract and survey"
      raw_fields: "method, chainage, bore, volume, service coverage and owner fuel"
      collection_method: "signed contract log and survey"
      unit: "m3, service unit"
      frequency: "each package"
      temporal_coverage: "excavation to support gate"
      site_scope: "named tunnel"
      aggregation_rule: "sum non-overlapping packages"
      quality_evidence: "survey and invoices"
    - protocol_id: cp_materials
      process_id: "excavation_support_lining_handover"
      flow_role: "support, lining, systems"
      record_type: "delivery and as-built"
      raw_fields: "specification, mass, installed, returned, stock, secondary origin, recovery gate"
      collection_method: "delivery and as-built schedule"
      unit: "kg, item, m3"
      frequency: "each delivery"
      temporal_coverage: "full construction"
      site_scope: "named tunnel"
      aggregation_rule: "reconcile each product"
      quality_evidence: "invoices and certificates"
    - protocol_id: cp_energy
      process_id: "excavation_support_lining_handover"
      flow_role: "equipment energy"
      record_type: "meter and fuel log"
      raw_fields: "carrier, quantity, machine, node, period, shared consumers"
      collection_method: "meters and machine logs"
      unit: "kWh, MJ, kg"
      frequency: "weekly"
      temporal_coverage: "excavation to tests"
      site_scope: "named tunnel"
      aggregation_rule: "attribute each carrier once"
      quality_evidence: "meters and invoices"
    - protocol_id: cp_spoil
      process_id: "excavation_support"
      flow_role: "removed ground"
      record_type: "survey and movement"
      raw_fields: "volume, density, reuse, stock, export, receiver, classification"
      collection_method: "survey and weighbridge"
      unit: "m3, kg"
      frequency: "each movement"
      temporal_coverage: "excavation to clearance"
      site_scope: "named tunnel"
      aggregation_rule: "balance destinations"
      quality_evidence: "survey and tickets"
    - protocol_id: cp_waste
      process_id: "lining_handover"
      flow_role: "rejects"
      record_type: "waste and rework log"
      raw_fields: "product, mass, defect, node, return, rework, receiver"
      collection_method: "weighbridge and work order"
      unit: "kg"
      frequency: "each event"
      temporal_coverage: "lining to handover"
      site_scope: "named tunnel"
      aggregation_rule: "balance each product"
      quality_evidence: "tickets and receipts"
    - protocol_id: cp_acceptance
      process_id: "excavation_support_lining_handover"
      flow_role: "gate states"
      record_type: "survey and test"
      raw_fields: "endpoints, bore, chainage, section, support, water control, systems, defects, sign-off"
      collection_method: "as-built survey and signed test"
      unit: "centreline-km, bore-km"
      frequency: "each gate"
      temporal_coverage: "support to handover"
      site_scope: "accepted chainage"
      aggregation_rule: "match upstream and final length"
      quality_evidence: "drawings and certificates"
  calculation_rules:
    - id: spoil_balance
      applies_to: "excavation"
      rule: "Excavated mass after density conversion = on-site reuse + export + stock change within documented tolerance."
      inputs:
        - survey
        - density
        - movements
      output: "kg/centreline-km and residual"
      source_ids:
        - mass-balance-identity
    - id: material_balance
      applies_to: "each product"
      rule: "Delivered + opening stock = installed + returned + rejects + closing stock within documented tolerance."
      inputs:
        - delivery
        - as-built
        - return
        - waste
        - stock
      output: "kg/product and kg/centreline-km"
      source_ids:
        - mass-balance-identity
    - id: bore_ratio
      applies_to: "multiple bores"
      rule: "Bore-km / centreline-km is disclosed, not used to multiply reference output."
      inputs:
        - "accepted length survey"
      output: "bore-km/centreline-km"
      source_ids:
        - reference-definition
    - id: shared_fraction
      applies_to: "common assets"
      rule: "Attributed amount = measured amount × documented use fraction; fractions across consumers sum to one."
      inputs:
        - "machine logs and meters"
      output: "amount/centreline-km"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_scope
      applies_to: "reference and interfaces"
      requirement: "Check endpoints, length, geometry, method, geology, systems and linked road or rail assets."
      evidence: "design, as-built and certificate"
    - id: dq_materials
      applies_to: "major inputs"
      requirement: "Reconcile support, lining, waterproofing and systems by specification and secondary origin."
      evidence: "delivery, as-built and waste records"
    - id: dq_time
      applies_to: "all phases"
      requirement: "Use project dates, supplier vintage and disclosed gaps."
      evidence: "schedule, invoices and tests"
    - id: dq_identity
      applies_to: "final exchanges"
      requirement: "Confirm UUID against platform detail, flow type, delivery gate, property and unit before release."
      evidence: "flow and support-reference review"
    - id: dq_shared
      applies_to: "common plant"
      requirement: "Demonstrate consumers, service period, physical driver and single allocation."
      evidence: "meters and allocation worksheet"
validation_rules:
  - rule_id: v_handover
    applies_to: "reference product"
    rule: "Require signed acceptance, endpoints, centreline-km, bore-km, geometry, ground and system scope; reject pending chainage."
    source_ids:
      - unsd-tunnels
      - fhwa-tunnel-manual
  - rule_id: v_interfaces
    applies_to: "road and rail interfaces"
    rule: "Check separate alignment, track, station and utility datasets for omissions and double counts."
    source_ids:
      - unsd-tunnels
      - fhwa-tunnel-manual
  - rule_id: v_balance
    applies_to: "excavation and materials"
    rule: "Test spoil and product balances with density, reuse, stock, returns and rejects."
    source_ids:
      - mass-balance-identity
  - rule_id: v_rework
    applies_to: "deficient work"
    rule: "Link rejects to rework or one recovery/disposal exit before acceptance."
    source_ids:
      - mass-balance-identity
  - rule_id: v_secondary
    applies_to: "recovered input"
    rule: "Require origin, recovery gate and one burden convention."
    source_ids:
      - mass-balance-identity
  - rule_id: v_shared
    applies_to: "common plant"
    rule: "Verify consumers, periods, physical driver and fractions summing to one."
    source_ids:
      - mass-balance-identity
  - rule_id: v_identity
    applies_to: "final UUIDs"
    rule: "An at-plant or mass-based flow cannot identify site-accepted length-based tunnel output; leave UUID blank until detail-confirmed."
    source_ids:
      - reference-definition
published_dataset_profile:
  dataset_role: "Construction-stage foreground package for an accepted transport tunnel."
  downstream_use: "secondary_dataset or background_dataset in infrastructure process and lifecyclemodel projections after concrete identity review."
  allowed_use: "Construction assessment per accepted centreline-km with matching bore geometry, method, ground and systems."
  excluded_use: "Traffic operation, maintenance, whole-life claims, mining tunnel or stand-alone rail-line attribution."
  required_metadata: "Endpoints, centreline-km, bore-km, section, method, geology, groundwater, lining, systems, interfaces, dates and acceptance."
  required_quality_disclosure: "Material, energy and spoil completeness; provisional ranges; UUID gaps; secondary origin and shared plant attribution."
  update_trigger: "As-built scope change, corrected quantities, supplier substitution or verified reference identity."
module_references:
  selection_mode: "automatic"
  selected:
