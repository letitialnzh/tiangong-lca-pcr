  identity_conditions: Every adopted identity is limited by the bilingual row
    condition and its actual public reference property/unit group. A blank UUID
    means not confirmed for this PCR, never proof of database non-existence.
  evidence_limits:
    - UN CPC provides category identity, not LCA approval. WA 2019 and IFC 2007
      provide qualitative mine routes/environmental concerns, not current
      universal legal requirements or quantitative defaults.
    - Platreef February 2025 is a South African mine development case with
      forecasts; actual route observations are contextual only. No forecast
      completion, shaft size, capacity, mix, lifetime or project-specific
      intensity is generalized.
    - EPA 2012 supplies historical washout mechanism and stream separation only;
      its pH, recycling target and compliance statements are not numeric rules
      here.
    - Construction-to-handover foreground is not complete cradle-to-gate or
      whole life. Significant real unlisted route exchanges, geological gas,
      aqueous pollutants, land change, noise/vibration and occupational exposure
      need independent actual-project coverage review.
  unresolved_evidence_needs:
    - Actual independently accepted facility scope, geometry/configuration,
      complete construction route and handover test evidence.
    - Actual measured recipes, quantities, supplier states, fuel density/fossil
      fraction, water chemistry and species/size/receptor-specific releases.
    - Persistent reusable plant/formwork/support histories and evidenced total
      service denominators; unknown relations require review.
