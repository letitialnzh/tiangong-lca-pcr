review_metadata:
  scientific_review: pending
  public_identity_metadata_review:
    - row_id: portland_cement
      issue: The public CPC classification describes concrete articles, while the
        explicit name, route and comment define grey powdered Portland cement at
        factory gate. Adoption is conditional on actual supplier powder identity
        and uses its preserved Mass property; metadata discrepancy remains
        review, not silent correction.
  semantic_boundary_review:
    decision: new_semantic_candidate
    existing_material_pcr_checked: true
    rationale: Existing mining-constructions is an empty scaffold. Material
      transport-tunnel and industrial-building delivery methods exclude mining
      facilities; mining machines are factory-gate manufactured products, while
      copper/nickel/aggregate methods output mined material. None supplies the
      accepted non-building mining-facility entity with mine access,
      winding/headframe/loading interfaces and construction-specific
      route/ground-control data. New identity follows that semantic/method need,
      not the classification code.
    adjacent_boundary: Exclude buildings, transport tunnels, independently delivered
      power plants, manufacturing/chemical plants, normal mining/ore processing,
      independent roads/pipelines and separately supplied machinery. Retain
      actual integral mining structures at declared non-overlapping interfaces;
      mineral-product models can consume attributed construction burden once.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: imported_fill
      name: Uncontaminated natural soil fill
      reason: No selected public flow establishes this actual natural-soil fill state
        and delivery interface.
    - row_id: anfo
      name: Ammonium nitrate and fuel oil blasting explosive
      reason: Direct-read porous-granular candidate specifies expanded ammonium
        nitrate with nitromethane or aluminium; it is not verified ordinary
