measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Use cp_acceptance to confirm one complete accepted facility with the same documented configuration and extent. Every row is per declared reference flow; measured geometry and capacity are qualifiers, not alternative denominators. No whole-facility or per-metre mass is invented."
  - id: material_state
    applies_to: "imported_fill; emulsion_explosive; anfo; non_electric_detonator; inert_excavation_rock; sulfide_excavation_rock; excavated_soil; portland_cement; natural_sand; crushed_stone; pce_admixture; rock_bolt; steel_mesh; reinforcing_bar; structural_steel; formwork_plywood; steel_loading_hopper; diesel; treated_process_water; mineral_lubricant; excavator_asset; drill_asset; crane_asset; fossil_co2; nitrogen_monoxide; nitrogen_dioxide; pm25; pm_2_5_10; pm_unspecified; washout_solids; concrete_waste; steel_offcut; used_lubricating_oil"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain actual lot state, composition, moisture and inclusion boundary. Count/volume/area/length to mass requires actual same-lot unit mass, density, areal mass or geometry and associated material density. No generic 1 kg machine or default density/recipe is used."
  - id: fresh_volume
    applies_to: "purchased_concrete; purchased_shotcrete; purchased_grout; site_concrete; site_shotcrete; site_grout"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Use actual measured fresh received/batched/placed volumes, preserving batch formulation, entrained air, returns, rebound and hydration state. Mass conversion requires corresponding fresh density; do not substitute hardened volume, dry powder mass or a whole-works mass."
  - id: treated_water_mass
    applies_to: "treated_process_water"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve the public treated-water Mass/kg identity and obtain actual same-water measured density at the documented temperature and composition when raw records are volumetric. Keep the raw volume balance; no default density."
  - id: water_state
    applies_to: "untreated_supplied_water; groundwater_abstraction; freshwater_release; seawater_release; dewatering_transfer; washout_liquid"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Meter each liquid stream at its actual source/destination and retain raw volume balance. treated_process_water has a public Mass property: preserve it using independently measured same-water density, not a rewritten Volume identity. Resource withdrawal, supplied water, internal reuse, waste transfer and direct release remain distinct."
  - id: energy_property
    applies_to: "electricity_lv_cn; electricity_mv_cn; electricity_other"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the Net calorific value reference property and energy unit group. Convert kWh to MJ with 3.6 MJ/kWh; this does not assign a fuel heating value. Raw fuel litre-to-kg or kg-to-MJ conversions need actual fuel density/heating value and state."
  - id: component_length
    applies_to: "hdpe_drain_pipe; low_voltage_cable"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "Retain actually received/installed length and actual cross-section, cores, wall thickness, joints and offcuts. Public cable Length is not rewritten as Mass; any supplemental mass needs the actual matching measured/certified unit mass."
  - id: freight_work
    applies_to: "road_freight"
    required_property_ref:
      name: "Goods transport (mass*distance)"
      uuid: "838aaa20-0117-11db-92e3-0800200c9a66"
    required_unit: "t*km"
    rule: "Use actual payload in tonnes multiplied by actual leg distance in km, retaining empty-return and allocation conditions under cp_transport; 1000 kg = 1 t, with no default haul distance."
process_map:
  - id: site_enabling
    name: "Site definition and enabling works"
    inclusion: "required"
    inclusion_condition: "Define the actual site/retained assets and perform the real survey, access, clearing, stripping and temporary arrangements; do not assume that every earthwork is needed."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: mine_excavation
    name: "Mine opening excavation, drilling, blasting and muck removal"
    inclusion: "conditional"
    inclusion_condition: "When new shafts, mine tunnels/drifts, declines or engineered open-pit access/initial workings form part of the delivery; record mechanical, raise-bore, drill-and-blast or combined route actually used."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: site_batching
    name: "Actual on-site cementitious batching"
    inclusion: "conditional"
    inclusion_condition: "Only when concrete, shotcrete or cement grout is actually mixed inside the boundary; each actual formulation is separately reconciled."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: ground_support
    name: "Geotechnical support, shaft lining and drainage installation"
    inclusion: "conditional"
    inclusion_condition: "Where actual ground-control design requires support, reinforcement, shaft lining, grouting or drainage; no universal support pattern is prescribed."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: civil_structures
    name: "Headframes, foundations and loading/discharging civil structures"
    inclusion: "conditional"
    inclusion_condition: "When headframes/winding towers, shaft collars, foundations or non-building loading/discharging structures belong to the accepted mine facility."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: permanent_installation
    name: "Permanent winding and materials-handling installation"
    inclusion: "conditional"
    inclusion_condition: "Include the actual permanent winding, loading, unloading, conveyor and power interfaces in the delivery schedule; do not assume all facilities have all devices."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: site_utilities
    name: "Stage-tagged utilities, temporary plant and environmental exchanges"
    inclusion: "required"
    inclusion_condition: "Inspect actual energy, supply water, abstraction/dewatering, temporary ventilation/pumping/hoisting and construction plant for every included stage; rows occur only when evidenced."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: construction_waste
    name: "Construction waste characterization and transfer"
    inclusion: "required"
    inclusion_condition: "Inspect each actual construction and commissioning waste stream, including waste status, composition, hazardous character and destination."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: handover
    name: "Testing, reinstatement and accepted physical handover"
    inclusion: "required"
    inclusion_condition: "Verify the complete delivered facility, surveyed extent, functionality, defects, test consumption and handover documentation."
    role: "delivery"
    quantitative_reference: "per declared reference flow"
