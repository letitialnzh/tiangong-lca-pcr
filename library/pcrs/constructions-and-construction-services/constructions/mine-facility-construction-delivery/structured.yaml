allocation_rules:
  - rule_id: direct_subdivision
    applies_to: "dataset"
    rule: "First trace each receipt, meter, machine log and work package to its actual facility and stage. Subdivide joint construction/ore production and adjacent power/manufacturing/building functions before allocation. For inseparable activities, justify an evidenced physical causal driver and complete beneficiary denominator using cp_allocation; cost, facility count or forecast throughput alone is not causal evidence."
    source_ids: []
  - rule_id: asset_share_conservation
    applies_to: "excavator_asset; drill_asset; crane_asset; formwork_plywood; steel_mesh"
    rule: "Retain one persistent identified asset and manufacture boundary. An actual same-configuration mass/count multiplied by its evidenced dimensionless current service share attributes the included manufacture burden. All projects, periods and repeated uses share one supported total-activity denominator; cumulative shares must not exceed one. Forecast versus realized service is explicit and reconciled. Unknown lifetime/activity remains review; never reset the full burden per project. Permanent new delivered support/equipment instead carries its included full supply burden once."
    source_ids: []
  - rule_id: recovery_and_ore_interfaces
    applies_to: "mine_excavation; construction_waste"
    rule: "Internal rock/fill/water reuse is an internal balance, not an automatic co-product credit. Exported ore, useful rock and scrap retain real status, quantities and recipients; no default avoided-production credit. Later mineral models consume the actual allocated construction dataset burden once rather than adding its ingredients/plant again. Shared downstream attribution requires actual supported production/service evidence, with unknown denominators disclosed for review."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "Direct attribution and cumulative-conservation controls are supported by the actual cp_assets/cp_allocation records; this PCR specifies no asset lifespan, mine output or allocation factor. Unproven relations remain explicit review needs for the actual dataset."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "handover"
      flow_role: "Reference entity and acceptance"
      record_type: "foreground_record"
      raw_fields: "project/site; mine function; delivery limits/interfaces; route; as-built shaft/drift/pit/tower/station dimensions; support/plant configuration; criteria; test results; retained/new assets; start/end/test/handover dates; complete accepted count"
      collection_method: "Use signed actual acceptance and as-built survey records, with stage-specific geotechnical/structural/mechanical and actual ventilation/drainage/handling tests. Reconcile the same complete facility and configuration; document defects and remaining interfaces, not presumed approvals."
      unit: "item; m; m2; m3; actual capacity units"
      frequency: "at each acceptance and relevant test"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed acceptance, calibrated survey/test records and complete asset schedule"
    - protocol_id: cp_earth
      process_id: "site_enabling_mine_excavation"
      flow_role: "Earthworks and separated excavation outputs"
      record_type: "foreground_record"
      raw_fields: "survey before/after; geology; opening dimensions; mechanical/blast route; imported fill; moisture; weighbridge records; rock/soil assay and acid-generation tests; internal reuse; disposition; construction versus production tag"
      collection_method: "Survey actual delivered openings and movements; use calibrated mass records or actual same-material surveyed volume and measured bulk density at its moisture/state. Reconcile excavation, internal reuse, exported streams and separately recovered ore."
      unit: "kg; m; m3"
      frequency: "each work shift/haul and survey milestone"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "survey control, calibrated scales, geological tests and destination receipts"
    - protocol_id: cp_blast
      process_id: "mine_excavation"
      flow_role: "Actual blasting inputs"
      record_type: "foreground_record"
      raw_fields: "hole pattern and dimensions; product/lot/formulation; charged and returned mass; detonator type/count/unit mass; misfires; date/location; ventilation/control; emissions evidence"
      collection_method: "Reconcile real approved project blasting logs, charge weighings and stock/returns for each physically distinct formulation and initiation device. Match actual route and chemical species; a safety log is not an external-release measurement."
      unit: "kg; item; m"
      frequency: "each blast and stock reconciliation"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "lot certificates, actual charge logs and checked inventory balance"
    - protocol_id: cp_batch
      process_id: "site_batching"
      flow_role: "Actual on-site mixture and internal transfers"
      record_type: "foreground_record"
      raw_fields: "actual recipe/lot; cement; sand; stone; every real additive; water; moisture; fresh density; batch/placed/returned volumes; transport internal links; rebound/washout; electricity"
      collection_method: "Measure each actual ingredient and fresh batch volume; retain recipe and water carried in wet constituents. Link separate concrete/shotcrete/grout transfers to their actual installation stage without adding an external purchased mixture burden."
      unit: "kg; m3; MJ"
      frequency: "each actual batch and work shift"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated batch scales/meters, actual recipe and placed/returned balance"
    - protocol_id: cp_support
      process_id: "ground_support"
      flow_role: "Support, lining, grout and drainage"
      record_type: "foreground_record"
      raw_fields: "ground-control drawing; actual bolt/mesh/drain/lining specification; installed number/length/mass; fresh delivered mix/grout volume; actual strength/curing; rebound; reclaimed temporary support"
      collection_method: "Use actual installation and supplier records with surveyed same-state geometry and measured/certified unit masses/densities; inspect route necessity and permanent/temporary inclusion, retaining geotechnical and acceptance evidence."
      unit: "kg; m; m3; item"
      frequency: "each installed lot/section and inspection"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "installation drawings, lot certificates and accepted inspection records"
    - protocol_id: cp_civil
      process_id: "civil_structures"
      flow_role: "Actual civil structure material quantities"
      record_type: "foreground_record"
      raw_fields: "foundation/collar/headframe/station geometry; purchased concrete fresh volume/recipe; rebar/structural steel grade and mass; joints; supplier inclusion; curing; returns; offcuts"
      collection_method: "Reconcile actual delivery tickets, drawings, fresh volumes, steel weighing/certified unit mass and installation schedules. Record all site handling, pumping, joining and curing consumption in stage-tagged utility logs."
      unit: "kg; m3; m; item"
      frequency: "each received/installed lot and acceptance milestone"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "supplier certificates, calibrated measurement and as-built quantities"
    - protocol_id: cp_install
      process_id: "permanent_installation"
      flow_role: "Permanent winding and loading equipment/interfaces"
      record_type: "foreground_record"
      raw_fields: "supplier equipment boundary; model/configuration; quantity or mass/length; included component schedule; delivery; installed layout; commissioning tests; cable country/voltage/conductor/insulation; losses/offcuts"
      collection_method: "Use actual procurement, manufacturer drawings and accepted installed records; weigh/certify same-configuration components when mass is used, preserve actual Count/Length properties, and separately account installation/testing activity and waste."
      unit: "item; kg; m"
      frequency: "each equipment/cable delivery, installation and test"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "complete supplier inclusion list and signed commissioning evidence"
    - protocol_id: cp_utilities
      process_id: "site_utilities"
      flow_role: "Energy, plant operation and fluid use"
      record_type: "foreground_record"
      raw_fields: "stage/date; meter start/end; grid country/voltage; fuel grade/blend/density/heating value if conversion; supply/stock/returns; machine hours/load/control; lubricant additions; complete subcontract inclusions"
      collection_method: "Use calibrated submeters, actual fuel receipts/tank balances and equipment duty logs. Separate construction/test operation from later mine operation. Trace any common utility total with direct subdivision or documented allocation; no assumed per-machine consumption."
      unit: "MJ; kWh; kg; L; h"
      frequency: "each shift, metering interval and tank reconciliation"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meter calibration, tank reconciliation, supplier and duty records"
    - protocol_id: cp_water
      process_id: "site_utilities"
      flow_role: "Supply, abstraction, dewatering and destination balance"
      record_type: "foreground_record"
      raw_fields: "source/aquifer/country; treatment; supplier interface; incoming pumped/metered volume; actual density if Mass reporting; temperature/composition; rainfall; recirculation; consumption; recipient; liquid transfers; concentration tests"
      collection_method: "Meter actual liquid volumes by source and destination. Keep pumped groundwater and purchased treated water distinct, with actual same-water density for the Mass identity; reconcile reuse, discharged liquid, treatment transfer and measured residual balance with uncertainties."
      unit: "m3; kg; actual concentration units"
      frequency: "each meter interval and discharge/sample event"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated meters, density/chemistry tests and receptor/treatment records"
    - protocol_id: cp_assets
      process_id: "site_utilities_civil_structures_ground_support"
      flow_role: "Reusable equipment, formwork and support attribution"
      record_type: "foreground_record"
      raw_fields: "persistent asset id; manufacture boundary; same-configuration actual net mass/count; service activity unit; current actual service; evidenced total supported service denominator; all beneficiaries/projects/periods; prior shares; forecasts/revisions; consumptive replacements and disposition"
      collection_method: "Measure/certify actual asset quantities and trace one cross-project asset/activity ledger. Derive current share only with a supported compatible activity denominator; reconcile all past/current/planned shares without reset. Unknown total service and revised forecasts require review and sensitivity, never an invented life."
      unit: "kg; item; actual service activity units; dimensionless share"
      frequency: "each asset use/project and denominator revision"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "traceable manufacture/quantity evidence, full asset ledger and share reconciliation"
    - protocol_id: cp_transport
      process_id: "site_utilities"
      flow_role: "Actual external freight legs"
      record_type: "foreground_record"
      raw_fields: "cargo identity/state; actual payload mass; origin/destination; real distance; vehicle/load; return; inclusion/overlap; allocation"
      collection_method: "Use dispatch/weighbridge and actual route records, distinguishing external supplier/site/waste legs from internal muck movement; check inclusion in upstream or subcontract inventories."
      unit: "t; km; t*km"
      frequency: "each shipment/leg"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighbridge/dispatch and route evidence"
    - protocol_id: cp_air
      process_id: "site_utilities"
      flow_role: "Species, size and external release"
      record_type: "foreground_record"
      raw_fields: "actual stage/activity; engine/fuel/blast/dust source; exhaust/control/ventilation; CAS/species; fossil origin; fraction; medium/submedium; sample/calibration; concentration and matching flow/time or independently supported factor/activity; uncertainty"
      collection_method: "Use actual outward release monitoring, compatible concentration/flow/time measurement or independently sourced activity/engine/control-specific factor with conditions and units. Retain raw data and conversions; no workplace concentration, NOx equivalent or total-dust number is silently assigned to molecular NO/NO2 or a PM fraction."
      unit: "kg; actual concentration/flow/time units"
      frequency: "representative actual activity/control periods and each release campaign"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "sampling calibration, original factor applicability and complete raw activity/release basis"
    - protocol_id: cp_waste
      process_id: "construction_waste"
      flow_role: "Segregated solid and liquid waste"
      record_type: "foreground_record"
      raw_fields: "originating stage; stream identity; actual mass/volume; moisture/chemistry; contamination/acid potential; status; collection; treatment/recovery/disposal destination; transport; internal reuse"
      collection_method: "Weigh/meter each physically separated actual waste with representative characterization and signed destination records; preserve liquid/solid split, waste-to-product status and treatment interface."
      unit: "kg; m3"
      frequency: "each collection/load and characteristic change"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "calibrated scales/meters, characterization and chain-of-custody receipts"
    - protocol_id: cp_allocation
      process_id: "mine_excavation_handover"
      flow_role: "Joint works/ore and beneficiary subdivision"
      record_type: "foreground_record"
      raw_fields: "actual joint activities; separable work/meter records; facility/ore recipients; ore assay/mass; driver/activity units; complete denominator; attribution shares; overlap and sensitivity"
      collection_method: "Trace real causal work packages and subdivide first. Where inseparable, document driver selection and complete measured/supported beneficiary basis; disclose uncertainty and unresolved actual/forecast relationships for independent review."
      unit: "actual activity units; kg; dimensionless share"
      frequency: "each joint campaign and boundary change"
      temporal_coverage: "actual complete construction and test campaign"
      site_scope: "defined mine facility and actual supply/destination interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "real activity records and full allocation reconciliation"
  calculation_rules:
    - id: delivery_reconciliation
      applies_to: "all inventory rows"
      rule: "Keep each actual attributable exchange total in its declared unit per declared reference flow. Reconcile receipts, stock changes, returns, internal batch transfers, installed material, real losses and outgoing streams. Separate independent accepted facilities by actual direct subdivision before reporting one delivery; no default mix, per-facility mass, density, loss or life."
      inputs:
        - cp_acceptance
        - cp_earth
        - cp_blast
        - cp_batch
        - cp_support
        - cp_civil
        - cp_install
        - cp_utilities
        - cp_water
        - cp_waste
      output: "same-unit exchange total per declared reference flow"
      source_ids:
        - wa-ground-control-2019
        - epa-concrete-washout-2012
    - id: preserve_numerator_units
      applies_to: "electricity_lv_cn; electricity_mv_cn; electricity_other; diesel; treated_process_water; low_voltage_cable; road_freight"
      rule: "Maintain the complete facility denominator. Electricity kWh becomes MJ using 3.6 MJ/kWh; L becomes m3 using 0.001 m3/L; road payload t times actual km gives t*km, with 1000 kg/t. For mass/volume/count/length relations retain actual measured/certified same-state density, unit mass or geometry with units and uncertainty. Public reference properties remain unchanged."
      inputs:
        - cp_utilities
        - cp_water
        - cp_transport
        - cp_install
      output: "same-unit exchange total per declared reference flow"
      source_ids: []
    - id: asset_attribution
      applies_to: "excavator_asset; drill_asset; crane_asset; formwork_plywood; steel_mesh"
      rule: "For included reusable asset manufacture, multiply actual same-configuration asset mass/count by the evidenced dimensionless current service share. Current and total service have matching units and real supported boundaries; retain all prior and other uses so cumulative shares do not exceed one. Permanent delivered material is its actual full included quantity once. This attributes an input asset, not a conversion of the facility reference to kg."
      inputs:
        - cp_assets
      output: "attributed asset input per declared reference flow"
      source_ids: []
    - id: environmental_quantification
      applies_to: "fossil_co2; nitrogen_monoxide; nitrogen_dioxide; pm25; pm_2_5_10; pm_unspecified; groundwater_abstraction; freshwater_release; seawater_release"
      rule: "Use supported external substance/fraction release or resource withdrawal totals, preserving actual medium and units. Air mass requires real concentration times corresponding flow/time or actual activity times an independently supported species/control factor. Water pollutants require actual concentration times corresponding actual discharge volume with units. Fuel carbon balance needs measured fossil fraction/oxidation; it supplies no NOx split or PM factor. Retain nonoverlapping fractions and water destinations; missing evidence is unknown, not zero."
      inputs:
        - cp_air
        - cp_water
        - cp_utilities
      output: "supported release or withdrawal per declared reference flow"
      source_ids:
        - ifc-mining-2007
    - id: joint_works_attribution
      applies_to: "mine_excavation; reference_mine_facility"
      rule: "Use actual separate stage totals wherever causal construction and production are observable. For any inseparable jointly beneficial work, apply the reviewed actual causal driver with all recipients and denominator documented in cp_allocation; retain exported development ore as a real output and do not credit hypothetical avoided mining. Later mineral inventories must reference the resulting construction burden once."
      inputs:
        - cp_allocation
        - cp_earth
        - cp_acceptance
      output: "reviewed attributed construction exchange total per declared reference flow"
      source_ids:
        - platreef-shaft-case-2025
  data_quality_requirements:
    - id: entity_complete
      applies_to: "reference_mine_facility"
      requirement: "Retain the entire accepted functional scope and all real route stages, geometry, configuration and tests; distinguish actual completed work from proposed mine expansions."
      evidence: "cp_acceptance; as-built survey and asset/interface schedule"
    - id: identity_and_units
      applies_to: "all inventory rows"
      requirement: "Verify each actual material/substance/component state and public reference property/unit; retain geography/voltage/medium/CAS/fossil/size conditions. Blank UUIDs require row-level resolution before deployment as confirmed identities."
      evidence: "supplier/assay/site evidence and public identity references"
    - id: time_and_site
      applies_to: "dataset"
      requirement: "Cover the real construction and test campaign at the actual site, including returns, rework, dewatering and temporary operation; explain subcontract gaps and unmeasured intervals."
      evidence: "all cp records with dates, calibration and coverage"
    - id: assets_and_joint_work
      applies_to: "excavator_asset; drill_asset; crane_asset; formwork_plywood; mine_excavation"
      requirement: "Document supported total asset service and all attribution recipients; review unknown denominator and actual/forecast ore interfaces, retaining cumulative share conservation and sensitivity."
      evidence: "cp_assets; cp_allocation; complete persistent ledgers"
    - id: environmental_coverage
      applies_to: "site_utilities; construction_waste"
      requirement: "Track actual external air/liquid pathways separately from workplace exposure and waste transfer. Add significant real geological gas, dissolved species, land and noise/vibration coverage with correct metrics; declare measurement/identity gaps rather than asserting total coverage."
      evidence: "cp_air; cp_water; cp_waste; location/time and method evidence"
validation_rules:
  - rule_id: v_reference
    applies_to: "reference_mine_facility"
    rule: "Require one complete physically accepted facility and all relevant qualifiers; reference name and output-row name match exactly, output is 1 item and every collection/inventory denominator is per declared reference flow. A count basis alone does not demonstrate applicability or interchangeable performance."
    source_ids: []
  - rule_id: v_route
    applies_to: "all inventory rows"
    rule: "Check the actual shaft/drift/pit/headframe/station route and all significant materials, mixtures, permanent devices, plant and tests. Mark a conditional exchange absent only with evidence. Actual unlisted chemistry/components get separate atomic rows; mixture alternatives and internal transfers are not duplicate purchases."
    source_ids: []
  - rule_id: v_units_identity
    applies_to: "all inventory rows"
    rule: "Check actual supply gates, country/voltage, substance/CAS/origin, medium/submedium, particle size and reference property/unit relations. No false conversion from Volume/Length/Count to Mass, unresolved reference product UUID remains a declared candidate gap, and public official Chinese names remain aligned."
    source_ids: []
  - rule_id: v_balances
    applies_to: "mine_excavation; site_batching; site_utilities; construction_waste"
    rule: "Reconcile actual excavation/reuse/export, each fresh mixture, fuel/stock, liquid inputs/outputs and waste disposition. Distinguish natural withdrawal, consumption, treatment transfer and direct recipient release; PM fractions and molecular NO/NO2 cannot be replaced by totals/equivalents or workplace concentrations."
    source_ids: []
  - rule_id: v_allocation
    applies_to: "dataset"
    rule: "Verify one persistent cross-project asset ledger and supported share denominator; cumulative manufacture attribution at most one. Review facility/ore-production joint activities and prevent mineral models counting the same development burden again. Unproved mathematical/causal relationships remain review."
    source_ids: []
  - rule_id: v_coverage
    applies_to: "dataset"
    rule: "Report performed/skipped checks, source-bound measurement/identity gaps, uncertainty and stage coverage. Neither accepted construction nor a passed structural check grants methodology/scientific approval. Do not label foreground as complete cradle-to-gate, whole life or total environmental coverage without independent complete evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground construction and physical delivery dataset for the defined mining facility"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Use as one explicitly bounded mining infrastructure input or comparison of equivalent configured facility deliveries with compatible geology, function, geometry, interfaces and coverage; later mineral production uses only justified attributed construction shares."
  excluded_use: "Generic ore-production/emission factor, construction-service factor, building/TBM/winder manufacturing rule, cost-based facility proxy, universal shaft recipe, unqualified cross-mine comparison or automatic whole-life/safety approval."
  required_metadata: "site/project and facility identity; mine type and actual geology/hydrogeology; actual construction route; complete spatial and functional extent; shaft/drift/pit/tower/station geometry where applicable; support/lining and permanent equipment configuration; material/fuel/water states; measured handling/access/ventilation/water-control function and test criteria; as-built survey and acceptance state/dates; retained/removed assets; construction/upstream/transport/later-phase interfaces; shared asset/ore-development attribution; omitted/unresolved environmental and identity coverage"
  required_quality_disclosure: "Actual foreground and upstream/transport coverage, identity gaps, source edition/case limits, recipes/measurements, unmeasured species and environmental metrics, actual/forecast activity and asset shares, allocation sensitivity and later phases excluded."
  update_trigger: "Facility/route/geology/configuration or acceptance change; new supplier/material/property identity; revised plant service/ore attribution; significant water/gas/land/noise evidence; review of technical source edition or unresolved coverage."
data_sources:
  - id: "unsd-cpc-3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division. CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF p.281, subclass 53261 and adjacent 53262/53269. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Non-building mining category and adjacent entity separation only; no engineering amount or LCA approval."
  - id: "wa-ground-control-2019"
    type: "official_guidance"
    reference: "Department of Mines, Industry Regulation and Safety, Western Australia. Ground control management in Western Australian mining operations – guideline, 2019; printed pp.11 and 26 (PDF pp.17 and 32), with hydrogeology/route context. https://www.worksafe.wa.gov.au/system/files/documents/2025-02/MSH_GL_GroundControl.pdf"
    used_for: "Qualitative opening/ground-control/support route context. WA jurisdiction and 2019 edition; no support spacing/threshold, recipe, life or current compliance rule imported."
  - id: "platreef-shaft-case-2025"
    type: "literature"
    reference: "Ivanhoe Mines. Platreef Phase 2 and Phase 3 expansion studies news release, 18 February 2025; printed/PDF p.10, shaft/headframe/winder and muck route; pp.8–9 identify development/production interface. https://www.ivanhoemines.com/wp-content/uploads/20250218-Platreef-2025-FS-PEA-ABF-1.pdf"
    used_for: "Developer primary technical case; distinguish completed observations and then-proposed works/forecasts. South African route/interface illustration only; no case dimensions/capacity, mix, dates or intensity used as defaults."
  - id: "ifc-mining-2007"
    type: "official_guidance"
    reference: "IFC/World Bank Group. Environmental, Health, and Safety Guidelines for Mining, 10 December 2007; printed/PDF pp.2–4 and 12–13 for development phases, water/effluent, dust/gases, noise/vibration and construction activity interfaces. https://www.ifc.org/content/dam/ifc/doc/2000/2007-mining-ehs-guidelines-en.pdf"
    used_for: "Qualitative actual-pathway and source/control prompts across mining phases; apply only real construction activities. No universal emission factor, water chemistry, hydraulic design interval, numeric limit or compliance approval adopted."
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA. Stormwater Best Management Practice: Concrete Washout, EPA-833-F-11-006, February 2012, PDF p.1. https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Historical qualitative actual batching/washout mechanism and liquid/solid separation; no default pH, concrete recipe, recovery rate or regulatory approval."
