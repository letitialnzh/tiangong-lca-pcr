product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.mine-facility-construction-delivery"
  classification_refs: "CPC 3.0 53261; Mining constructions"
  covered_products: "Accepted non-building mine shafts/headframes, mining tunnels/drifts/declines and loading/discharging facilities, or a documented integral combination; actual engineered initial open-pit facilities with established mining scope and handover."
  excluded_products: "Exclude buildings, public transport tunnels, independent power plants and manufacturing/chemical plants, independently delivered roads/pipelines, machinery/material manufacture sold separately, routine ore extraction/processing and mining services. Include genuinely integral mine-access and loading interfaces, with an asset/interface schedule preventing overlap. For rehabilitation, disclose retained assets, condition, removal and new work; do not charge their original manufacture again without an explicit attributed prior-asset boundary."
  representative_product: "One actual independently accepted mine-access or materials-handling facility at its stated site, geology, geometry, configuration and completion status; no numeric exemplar is presumed."
  production_route: "Actual site enabling; selected underground/open-pit opening and muck route; actual batching/support/lining; relevant collar/headframe/station civil structures; permanent equipment installation; construction utilities/wastes; testing and handover."
  market_state: "Complete accepted mining civil facility at the documented site and interfaces, with permanent equipment inclusions and remaining dependencies stated."
functional_unit:
  what: "Provide the defined physical mine-access/winding/loading facility ready for its documented function at handover."
  how_much: "One complete accepted delivery unit; surveyed shaft depth/diameter, drift length and cross-section, decline gradient, initial pit extent, tower height/geometry, station extent and actual handling interface/capacity are required where relevant, never defaults."
  how_well: "Actual geotechnical, structural, hydraulic, ventilation and mechanical/electrical acceptance criteria and test conditions under cp_acceptance; retain ground/water conditions and installed support. Do not infer mining licence, production performance or universal safety approval."
  how_long_or_cycle: "One actual construction/commissioning-to-handover cycle with start/end/test dates. Later service life and operating period require separately evidenced scenarios and are not prescribed."
  reference_flow_link: "reference_mine_facility"
system_boundary:
  rules:
    - rule_id: construction_delivery
      applies_to: "dataset"
      rule: "Collect actual enabling, opening/excavation, support/lining, civil structures, permanent installation and all testing/rework to the documented handover. Mechanical/raise-bore/blast routes and open-pit geometry are conditional on real works. The Platreef case is route context, not a required shaft size or timetable."
      source_ids:
        - unsd-cpc-3-2025
        - wa-ground-control-2019
        - platreef-shaft-case-2025
    - rule_id: stage_interfaces
      applies_to: "all inventory rows"
      rule: "Separate purchased mixtures from their site-batched alternatives and keep internal batching-to-installation links. Do not count powder/aggregate manufacture twice through both ingredients and a purchased complete mix. Preserve external transport and site operation overlap checks for complete subcontract services."
      source_ids:
        - epa-concrete-washout-2012
    - rule_id: mining_transition
      applies_to: "mine_excavation; handover"
      rule: "Separate facility construction/development from routine mineral extraction, processing and later mine ventilation/dewatering. Where construction exposes recoverable ore, preserve actual assay, mass, destination and contemporaneous construction/production activities; add each real ore output separately and review allocation. Do not treat saleable development rock automatically as waste or all production as construction."
      source_ids:
        - platreef-shaft-case-2025
        - ifc-mining-2007
    - rule_id: later_life
      applies_to: "dataset"
      rule: "Operation/maintenance, support renewal, later mine expansion, closure, demolition, long-term drainage and final disposition are outside the core handover result. If requested, model them as distinct evidenced stages with real service periods, quantities and destinations; never assume a universal life or declare whole life from this core."
      source_ids:
        - ifc-mining-2007
    - rule_id: environmental_routes
      applies_to: "site_utilities; construction_waste"
      rule: "Identify actual abstraction, pumped inflow, rainfall, process water, reuse, evaporation, liquid transfer and recipient-specific release. Add significant real gas, dissolved substance and size-specific particulate exchanges separately using matching public identities where verified. Land transformation, noise, vibration and occupational dust metrics require actual location/time and appropriate methods; absence of a row is not zero impact."
      source_ids:
        - ifc-mining-2007
        - epa-concrete-washout-2012
boundary_abstraction:
  declared_starting_condition: "Actual surveyed site, geology, groundwater and prior/retained mine assets; defined supplier material/equipment gates and temporary access/dewatering/ventilation interfaces before construction."
  starting_condition_role: "foreground construction starting interface; upstream manufacture and prior assets are separate"
  product_classification_scope: "Non-building mining facilities, CPC 3.0 53261 context; integral structures require a non-overlapping applicability decision, not automatic inheritance of all mine assets."
  recursive_input_rule: "Incoming same-category facility or retained mining component is recorded at its actual interface with attributed prior burden and compatible dataset; do not recursively reproduce its construction or convert a whole mining operation into a new construction input."
  upstream_dataset_requirement: "Link actual material/component/plant production, external freight and waste treatment only where supplier, geography/time, product state, configuration, property and boundary match. Report unlinked burdens and check overlap explicitly."
  disclosure: "Disclose construction phases and route, all starting/ending gates, prior assets, subcontract interfaces, upstream coverage, temporary plant attribution, ore-development separation and later phases excluded or separately modelled."
