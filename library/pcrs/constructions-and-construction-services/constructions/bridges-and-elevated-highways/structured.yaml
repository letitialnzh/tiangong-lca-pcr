      unit: "declared unit"
      frequency: "each claim"
      temporal_coverage: "foundation phase"
      site_scope: "named asset"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "signed measurement sheets"
    - protocol_id: cp_freight
      process_id: "deck_handover"
      flow_role: "component freight"
      record_type: "bills of lading and route records"
      raw_fields: "item, tonnes, mode, loaded distance, supplier freight inclusion"
      collection_method: "reconcile delivered loads and route; sum tonnes times loaded kilometres by mode"
      unit: "t, km, t*km"
      frequency: "each shipment"
      temporal_coverage: "project construction"
      site_scope: "named asset"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "delivery and carrier records"
    - protocol_id: cp_energy
      process_id: "supports_deck_handover"
      flow_role: "carrier energy"
      record_type: "meters, invoices, equipment logs"
      raw_fields: "carrier, amount, node, equipment, hours, shared attribution"
      collection_method: "reconcile meter and invoice; sum by carrier and count common plant once"
      unit: "kWh, MJ, kg"
      frequency: "monthly and work package"
      temporal_coverage: "project construction"
      site_scope: "named asset"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "meters and machine logs"
    - protocol_id: cp_waste
      process_id: "supports_deck_handover"
      flow_role: "spoil and rejects"
      record_type: "weighbridge and transfer notes"
      raw_fields: "mass, material, route, destination, rework link"
      collection_method: "weigh and trace; sum by material and destination net of loops"
      unit: "kg"
      frequency: "each movement"
      temporal_coverage: "project construction"
      site_scope: "named asset"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "weighbridge records"
    - protocol_id: cp_acceptance
      process_id: "supports_deck_handover"
      flow_role: "internal and final gates"
      record_type: "surveys and sign-off"
      raw_fields: "endpoints, length, area, spans, load class, defects, tests, date"
      collection_method: "signed inspection; match internal support and final count"
      unit: "asset, m, m2"
      frequency: "each gate"
      temporal_coverage: "construction and handover"
      site_scope: "named asset"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "as-built plans and certificates"
  calculation_rules:
    - id: material_balance
      applies_to: "material and waste"
      rule: "Purchased = installed + returned + rejected + stock change on consistent moisture and units."
      inputs:
        - delivery
        - installation
        - return
        - stock
      output: "reconciled kg/asset"
      source_ids: []
    - id: volume_to_mass
      applies_to: "concrete and finishing"
      rule: "Mass = measured volume × project-specific density."
      inputs:
        - volume
        - density
      output: "kg/asset"
      source_ids: []
    - id: shared_hours
      applies_to: "common plant"
      rule: "Node burden = total acquired burden × node logged hours / all eligible hours; measured work may replace hours if justified."
      inputs:
        - "common burden and logs"
      output: "allocated burden"
      source_ids: []
    - id: geometry_check
      applies_to: "reference product"
      rule: "Measure deck plan area and structural length from as-built dimensions, excluding ordinary approaches."
      inputs:
        - "as-built geometry"
      output: "m2 and m/asset"
      source_ids: []
  data_quality_requirements:
    - id: geometry_gate
      applies_to: "reference asset"
      requirement: "Retain dated acceptance with length, deck area, spans and load class."
      evidence: "signed certificate and survey"
    - id: route_evidence
      applies_to: "major elements"
      requirement: "Identify cast-in-place or prefabricated route and supplier gate, without overlap."
      evidence: "design, purchasing and pour records"
    - id: boundary_complete
      applies_to: "all nodes"
      requirement: "Reconcile material, service, energy, waste, temporary works and approach exclusions."
      evidence: "package ledger"
    - id: uuid_gap
      applies_to: "final exchanges"
      requirement: "Confirm matching platform flow, property and unit identities before concrete dataset release."
      evidence: "detail-confirmed identity records"
validation_rules:
  - rule_id: complete_asset
    applies_to: "reference output"
    rule: "Require one signed complete structure with geometry, duty and date; no span or component independently satisfies the reference."
    source_ids:
      - unsd-cpc-53221
  - rule_id: gate_link
    applies_to: "both nodes"
    rule: "Match supports_in to accepted_supports; carry support burdens once, without another purchased support system."
    source_ids: []
  - rule_id: route_exclusive
    applies_to: "major elements"
    rule: "Verify one construction route, supplier component boundary and on-site connections for each element; prohibit overlapping routes."
    source_ids:
      - fhwa-pbes
  - rule_id: reject_path
    applies_to: "failed work"
    rule: "Trace every reject to repair, recovery, return or disposal; exclude from accepted geometry until retested."
    source_ids: []
  - rule_id: secondary_shared
    applies_to: "recycled inputs and temporary works"
    rule: "Verify origin/burden convention and reconcile shared-work shares to one acquired burden for the defined period."
    source_ids: []
