allocation_rules:
  - rule_id: one_asset
    applies_to: "accepted output"
    rule: "The bridge is the sole intended product; reusable excavation or scrap follows its actual destination, not another accepted-bridge count."
    source_ids: []
  - rule_id: rework_burden
    applies_to: "rejected work"
    rule: "Keep repair burdens in the producing node and trace recovery or disposal; rejected components do not enter reference_product_bridge."
    source_ids: []
  - rule_id: secondary_inputs
    applies_to: "recycled steel or aggregate"
    rule: "Record origin, recovery gate and applicable supplier/prior-system burden convention; never count both prior product burden and cut-off recovery dataset."
    source_ids: []
  - rule_id: shared_plant
    applies_to: "common cranes, falsework and access works"
    rule: "Attribute one acquired burden across supports and deck_handover by logged service hours or measured work for the project period; reconcile shares to 100%."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "supports_deck_handover"
      flow_role: "purchased and installed materials"
      record_type: "procurement and as-built records"
      raw_fields: "item, supplier, route, mass or volume, density, installed, returned, rejected, secondary origin"
      collection_method: "reconcile delivery and as-built quantities; retain installed plus loss minus returns without component/raw overlap"
      unit: "kg, m3, item"
      frequency: "each lot"
      temporal_coverage: "project construction"
      site_scope: "named asset"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "tickets, drawings and mix records"
    - protocol_id: cp_services
      process_id: "supports"
      flow_role: "hired earthwork"
