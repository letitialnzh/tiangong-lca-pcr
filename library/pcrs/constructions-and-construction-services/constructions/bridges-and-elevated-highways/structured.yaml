system_boundary:
  rules:
    - rule_id: handover_gate
      applies_to: "whole structure"
      rule: "Include site works and acceptance testing through signed handover. Traffic operation, maintenance and end-of-life are separate."
      source_ids:
        - unsd-cpc-53221
    - rule_id: component_gate
      applies_to: "purchased components"
      rule: "Supplier manufacture of girders and panels is upstream; site lifting, connections and curing belong here. Never also count a purchased component's raw materials as site inputs."
      source_ids:
        - fhwa-pbes
    - rule_id: route_delta
      applies_to: "structural elements"
      rule: "Parent assembly joins supports, superstructure and deck. A prefabricated route needs component supplier, transport, lifting and connection records; cast-in-place work needs raw concrete, reinforcement, formwork and curing records. Select one evidenced route per element."
      source_ids:
        - fhwa-pbes
    - rule_id: finish_gate
      applies_to: "initial deck finishing"
      rule: "The load-bearing deck is the parent state. Include initial waterproofing, surfacing, parapets and drainage only if in the original handover; later stand-alone resurfacing is excluded."
      source_ids: []
    - rule_id: shared_and_secondary
      applies_to: "common works and recovered inputs"
      rule: "Attribute common cranes, falsework and access works once across nodes for the project period. Recycled metal or aggregate requires origin, recovery handoff and prior-burden convention."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Surveyed site and ground, with existing structures and demolition or remediation identified before foundation work."
