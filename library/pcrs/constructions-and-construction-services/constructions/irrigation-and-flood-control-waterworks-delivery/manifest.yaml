review_metadata:
  scientific_review: pending
  semantic_boundary_review:
    decision: new_semantic_candidate
    existing_material_pcr_checked: true
    rationale: No whole irrigation/flood-control delivery material PCR covers the target. Existing supply-conduit candidate excludes irrigation/flood control. Pump/cement manufacture only supplies upstream guidance. Retained target/service scaffolds are empty. Category needs irrigation and flood hydraulic configuration, earth/filter/drainage/lining/control/storage route completeness and accepted physical delivery; classification itself is not identity authority.
    adjacent_boundary: Standalone supply/navigation works, dams and coastal/waterside embankments remain separate; integral components and multipurpose interfaces require non-overlapping scope review.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: imported_earth_fill
      name: Uncontaminated natural soil fill
      reason: Returned foundation construction service is an area-based service, not natural soil fill; bounded search did not confirm this material identity.
    - row_id: filter_sand
      name: Washed natural silica filter sand
      reason: Initial filter-sand search returned unrelated products and raw quartz-sand resource. Refined construction-sand candidates require specification and supply-interface confirmation.
    - row_id: gabion_mesh
      name: Galvanized steel gabion mesh
      reason: No direct-confirmed flow establishes the required galvanized gabion-mesh component and coating specification.
    - row_id: grass_sod
      name: Live grass sod for channel stabilization
      reason: No direct-confirmed live-sod identity matching species, attached soil and delivery basis.
    - row_id: geotextile_pp
      name: Polypropylene nonwoven drainage geotextile
      reason: Direct-read nonwoven/polypropylene textile candidates do not establish this drainage geotextile specification and route.
    - row_id: drain_pipe_hdpe
      name: Perforated HDPE subsoil drainage pipe
      reason: Generic plastic pipes do not establish perforated HDPE drain configuration.
    - row_id: purchased_concrete
      name: Fresh ready-mixed hydraulic concrete
      reason: Fresh ready-mix supply identity not confirmed; site-poured concrete and cement are not equivalent product states.
    - row_id: precast_lining_slab
      name: Precast concrete canal lining slab
      reason: Generic pre-cast concrete and floor-slab candidates do not establish the required canal slab supply boundary and configuration.
    - row_id: brick_lining
      name: Fired clay canal lining brick
      reason: Returned brick candidates include intermediate production states and waste routes; no direct-confirmed finished canal brick specification.
    - row_id: asphalt_lining
      name: Hydraulic asphalt concrete lining mixture
      reason: Bounded asphalt candidates do not establish hydraulic lining formulation and delivery state.
    - row_id: membrane_hdpe
      name: HDPE hydraulic geomembrane
      reason: Direct HDPE sheet is case-specific to soil-remediation biopile lining, not this hydraulic membrane.
    - row_id: formwork_plywood
      name: Construction formwork plywood
      reason: Formwork plywood identity, resin/coating and supply boundary remain unconfirmed.
    - row_id: waterstop_epdm
      name: EPDM elastomeric joint waterstop
      reason: No directly confirmed EPDM waterstop component matching profile and formulation.
    - row_id: precast_jacking_pipe
      name: Reinforced concrete hydraulic jacking pipe
      reason: No direct-confirmed reinforced hydraulic jacking-pipe identity.
    - row_id: tunnel_lining_segment
      name: Precast reinforced concrete hydraulic tunnel lining segment
      reason: Hydraulic tunnel lining segment specification not established by generic precast records.
    - row_id: steel_support
      name: Low-alloy structural steel tunnel support
      reason: No direct-confirmed support member matching alloy, geometry and temporary/permanent boundary.
    - row_id: bentonite_powder
      name: Dry sodium bentonite powder
      reason: Bentonite candidates do not establish the specified sodium mineral/additive state; no compulsory formulation is inferred.
    - row_id: sluice_gate
      name: Fabricated steel hydraulic sluice gate
      reason: Direct trench-gate record belongs to a groundwater PRB system; fabricated hydraulic gate identity unresolved.
    - row_id: flap_valve
      name: Cast-iron hydraulic drainage flap valve
      reason: No direct-confirmed cast-iron drainage flap-valve identity and supply configuration.
    - row_id: gate_actuator
      name: Electric hydraulic gate actuator
      reason: Generic motor candidates do not establish complete waterworks actuator identity.
    - row_id: level_sensor
      name: Installed electronic water-level sensor
      reason: Bounded sensor candidates do not confirm the actual water-level instrument technology/configuration.
    - row_id: power_cable
      name: Copper-conductor XLPE-insulated low-voltage power cable
      reason: No direct-confirmed cable identity matching geography, voltage, conductor and insulation configuration.
    - row_id: electricity_other
      name: User-side alternating-current electricity at the declared supply voltage
      reason: Identity depends on actual country, voltage and grid/self-generation route outside the confirmed CN conditions.
    - row_id: supplied_water_other
      name: Supplied liquid construction process water
      reason: General site-water supply interface and geography are not established by HK plant-gate tap-water or unrelated process-water records.
    - row_id: mineral_lubricant
      name: Mineral lubricating oil
      reason: Lubricant grade and composition matching the actual equipment remain unconfirmed.
    - row_id: excavator_manufacture_share
      name: Complete hydraulic excavator at manufacture gate
      reason: Direct Digger record has dismantling/recycling use and a specified 10 L/h rate, not a confirmed construction-equipment manufacturing interface.
    - row_id: road_freight
      name: Road freight transport by truck
      reason: No selected direct-confirmed truck service establishes actual vehicle/supply boundary; tonne-kilometre support is preserved without forcing a vehicle product UUID.
    - row_id: excavated_soil_waste
      name: Uncontaminated excavated soil sent off site
      reason: No selected flow confirms unpolluted excavated-soil waste with actual disposal/reuse interface.
    - row_id: concrete_waste
      name: Hardened construction concrete waste
      reason: Confirmed concrete-waste destination/composition not established by generic mixed construction waste.
    - row_id: steel_offcut_waste
      name: Low-alloy reinforcing steel offcut
      reason: Offcut identity, actual alloy and waste/product recovery interface remain unconfirmed.
    - row_id: concrete_washout_liquid
      name: Alkaline concrete washout liquid
      reason: Generic wastewater and material-washing wastewaters do not establish concrete-washout liquid identity.
    - row_id: washout_solids
      name: Settled concrete washout solids
      reason: Concrete-washout sediment state/composition and destination identity unresolved.
    - row_id: dewatering_transfer
      name: Construction dewatering water sent for treatment
      reason: Actual water characterization and off-site treatment interface are required; available generic waste water cannot be forced.
    - row_id: spent_bentonite_slurry
      name: Spent sodium-bentonite excavation slurry
      reason: Route-specific sodium-bentonite slurry composition and treatment identity unresolved.
    - row_id: spent_mineral_oil
      name: Spent mineral lubricating oil
      reason: Used mineral oil specification, contamination and treatment identity require confirmation.
    - row_id: carton_waste
      name: Corrugated cardboard packaging waste
      reason: Waste cardboard state and recovery interface require confirmation; a fresh packaging material is not the waste output.
    - row_id: film_waste
      name: Polyethylene packaging film waste
      reason: Waste polyethylene film condition and destination interface unresolved.
    - row_id: reference_waterworks
      name: Delivered irrigation and flood control waterworks
      reason: "Reference product flow identity unresolved: generic Waterway is length-based, broad navigable/supply/irrigation/drainage path at-plant identity, not a verified complete configured and accepted works. The gap is semantic/configuration, not a rejection solely because Length differs from Count."
  identity_conditions: Adopted public identities remain conditional on the exact route/state/substance/geography/voltage/medium and reference property stated bilingually in each flow card. Blank identities are not a claim of database non-existence.
  evidence_limits:
    - Qualitative FAO/USBR/Hong Kong route evidence does not supply universal numeric design/mix/quantity/life or current compliance.
    - All project engineering quantities, material concentrations/densities, site intensity, emission factors and shared manufacturing denominators must be actually collected and evidenced.
    - Additional significant real-route operations/exchanges are required before a foreground dataset can claim completeness.
    - Core construction-to-handover excludes operational water/energy, maintenance/renewal, final demolition and any unlinked upstream coverage.
    - Noise metric/identity and actual land-change or environmental-species coverage require independent dataset review.
  unresolved_evidence_needs:
    - Project-specific acceptance geometry and complete functional extent; actual material and water states, real recipes and quantities.
    - Engine/duty/control-specific and species/size-specific direct-emission evidence; site water disposition and land/noise information.
    - Complete shared machinery/formwork/support asset histories and an evidenced total activity/service denominator; unknown relations require review.
