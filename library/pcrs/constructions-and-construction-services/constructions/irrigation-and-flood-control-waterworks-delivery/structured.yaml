product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.constructions.irrigation-and-flood-control-waterworks-delivery"
  classification_refs: "CPC 3.0 53234; Irrigation and flood control waterworks"
  covered_products: "Accepted physical irrigation and flood-control works with declared complete functional/spatial configuration and interfaces, including their actual integral channels, drainage, storage, control, pumping and civil components."
  excluded_products: "Supply-only conduits; navigation facilities; independently delivered dams/embankments/pipelines; materials, machine manufacture and construction services; crop output and operational water service."
  representative_product: "One configured irrigation or flood-control works accepted at its actual site, extent, function, geometry and commissioned state. No representative numeric recipe is assumed."
  production_route: "Actual enabling/earthworks, integral bank/filter/drainage and selected lining/structure/underground route, control/pumping installation, utilities and waste handling, reinstatement/testing and handover."
  market_state: "Complete accepted civil works at the defined site and interfaces; delivered components and prior retained assets explicitly listed."
functional_unit:
  what: "Provide the declared physical hydraulic works ready for its stated irrigation, flood-control or combined function at handover."
  how_much: "One complete accepted works at the declared project extent; actual canal/drain length and cross-sections, protected/irrigated area, storage volume and pump/conveyance capacity are measured qualifiers, not prescribed defaults."
  how_well: "Actual project-specific hydraulic, geotechnical, structural, water-control and commissioning requirements evidenced in cp_acceptance; retain water levels/head, leakage and operating configuration where relevant, rather than claiming universal flood protection."
  how_long_or_cycle: "One actual construction/commissioning-to-handover cycle, with real start/end and test dates. No future service life is set; any operational assessment period is separately evidenced."
  reference_flow_link: "reference_waterworks"
system_boundary:
  rules:
    - rule_id: construction_delivery
      applies_to: "dataset"
      rule: "The core foreground covers actual site preparation through construction, fitting, testing, removal of temporary works, reinstatement and accepted physical handover. Record delivered incoming products at their real interfaces. Cement/steel/aggregate/pump manufacture is upstream; only actual site batching, placement or assembly is foreground. Link compatible upstream manufacturing and delivery datasets to extend coverage, but label this foreground result as construction-to-handover, not a complete cradle-to-gate or whole-life result."
      source_ids:
        - usbr-crow-construction
    - rule_id: purpose_and_interfaces
      applies_to: "reference_waterworks"
      rule: "Preserve the actual irrigation or flood-control purpose and independently operable extent. Identify canal/drain chainage and cross-sections, protected/irrigated area definition, inlet/outlet and water levels, documented flow/storage/pumping capacity, control and maintenance access delivered. These are project measurements/requirements, not fixed PCR numbers. Exclude standalone water-supply conduits, navigation/port facilities, dams/water-retaining structures and coastal/waterside embankments; for multipurpose or integral components, declare a non-overlapping package/interface and review classification separately rather than removing real construction."
      source_ids:
        - unsd-cpc-3-2025
        - hk-dsd-stormwater-2018
    - rule_id: route_completeness
      applies_to: "all inventory rows"
      rule: "Required process blocks require an actual activity/completeness assessment, not all listed materials. Conditional routes remain conditional: earth or lined irrigation; rigid, flexible or vegetated flood channels; storage/polder/pumping; open-cut or underground hydraulic connections. Add each actual missing product, chemical, energy carrier, support element, packaging piece, waste and measured environmental species as a separate atomic row with properties, unit, protocol and route evidence. Significant piling, ground treatment, tunnelling, shotcrete, hydraulic transport or other real operations require their own process detail before a dataset can be complete; a sparse example route cannot represent another technology."
      source_ids:
        - fao-irrigation-system
        - usbr-crow-construction
        - hk-dsd-stormwater-2018
    - rule_id: temporary_and_prior_assets
      applies_to: "dataset"
      rule: "Account actual cofferdams, temporary diversion/roads, dewatering/treatment, support works and their removal/recovery once. Distinguish native retained assets, imported assemblies and new work. A rehabilitation delivery must retain prior structure/interface and record actual enabling demolition and replacement; do not charge the retained old asset as a newly manufactured input or erase its history. Shared machinery/formwork manufacture, when included, follows the cumulative share ledger."
      source_ids:
        - usbr-crow-construction
    - rule_id: later_lifecycle
      applies_to: "dataset"
      rule: "Only post-handover operational irrigation deliveries, flood events, pumping energy, leakage/seepage, operating-reservoir/soil processes, desilting, maintenance, renewal and final demolition are outside the core construction delivery. Actual pre-acceptance initial filling, commissioning, land disturbance and resulting supported inundation/land-carbon/release pathways stay inside their real construction/test site and period. Record baseline, flooded area, dates and measurements; unsupported pathways remain explicit gaps, not moved into excluded operation. Keep later actual or explicit future scenarios separate with evidenced period, activity, replacements, treatment and fate. No default service life, flood recurrence, saved crop output or avoided flood damage."
      source_ids:
        - fao-irrigation-system
        - hk-dsd-stormwater-2018
        - ipcc-flooded-land-2019
    - rule_id: environmental_boundary
      applies_to: "site_utilities; construction_wastes"
      rule: "Distinguish supplied technosphere water, direct river/groundwater resource abstraction, contained liquid waste sent for treatment and actual elemental release to a named receiving medium. Separate recirculation from crossing flows and record storage, rainfall/river diversion and return volumes so abstraction is not equated with consumption. Record noise as site/receptor/time/frequency and sound-level evidence outside mass exchanges until a suitable metric and identity are established; do not convert dB to kg or assume a universal noise emission. Actual land clearing/occupation changes and contaminant releases require separate supported environmental exchanges or explicit gaps, not an assumed zero."
      source_ids:
        - epa-concrete-washout-2012
        - epa-construction-dust-1995
        - usbr-crow-construction
boundary_abstraction:
  declared_starting_condition: "Actual site/topography, soil/groundwater and retained asset condition; incoming materials/components at explicitly stated gates; temporary diversion and access arrangements declared before construction."
  starting_condition_role: "foreground construction starting interface, with prior assets and upstream manufacture separate"
  product_classification_scope: "Irrigation/flood-control physical works context, CPC 3.0 53234; component and multipurpose classifications reviewed at explicit interfaces, not automatically inherited."
  recursive_input_rule: "An incoming same-category works/component with prior construction burden is recorded at its real interface, with existing/new scope and a compatible upstream dataset. Do not recursively reproduce its construction or create a duplicate final output."
  upstream_dataset_requirement: "Actual material/component manufacture, supply water/electricity, transport and actual waste treatment need compatible geography/time/technology, properties and inclusion boundaries. Identity alone does not supply these burdens. Missing upstream data remains a named gap."
  disclosure: "Report actual site, complete delivery/retained configuration, route, temporary works, water/land interfaces, upstream links/gaps, shared manufacture scope, direct emission evidence and excluded later lifecycle."
