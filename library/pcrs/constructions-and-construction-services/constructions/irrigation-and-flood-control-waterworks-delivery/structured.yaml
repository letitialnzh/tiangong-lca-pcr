measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Use cp_acceptance to confirm one complete accepted physical works of the same declared configuration and extent. Each input/output is per declared reference flow; measured length/area/capacity is supplemental and may not silently replace the denominator. No whole-works mass is invented."
  - id: geometry_mass
    applies_to: "imported_earth_fill; filter_sand; riprap_rock; reinforcing_steel; power_cable"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep actual geometry and material state. Where quantities are collected by volume, area, length or count but this row reports mass, use actual matching measured/certified density, areal mass, unit mass or cross-section/length; retain moisture, temperature and configuration. No default density, per-project/per-kilometre mass, shrinkage or mixture."
  - id: geometry_volume
    applies_to: "purchased_concrete; precast_lining_slab; precast_jacking_pipe; tunnel_lining_segment"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Keep the actual measured received/installed volume and matching component/material state; retain dimensions and voids. Count/length/area-to-volume needs actual geometry, and mass-to-volume needs actual matching density. Preserve a public Volume identity as Volume; no default dimensions, density, mix or per-project volume."
  - id: geometry_area
    applies_to: "membrane_hdpe; grass_sod"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Keep actual purchased and installed area with overlaps/offcuts and delivered thickness/specification. Preserve Area for an area-based identity. Any mass conversion requires the same actual lot’s measured/certified areal mass or thickness and density; no universal factor and no silent mass property replacement."
  - id: energy_identity
    applies_to: "electricity_lv_cn; electricity_mv_cn; electricity_other"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the public Net calorific value reference property and energy unit group. Use 3.6 MJ/kWh for meter units. This does not imply a fuel heating value; fuel mass/volume-to-energy requires the actual fuel value and state."
  - id: water_state
    applies_to: "tap_water_hk; supplied_water_other; groundwater_abstraction; river_abstraction; water_release_fresh"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Measure each actual liquid stream with its source, destination, quality and temperature/state. L to m3 uses 0.001 m3/L; kg conversion needs real density. Keep supply, natural abstraction, liquid waste and direct release separate. No tap-water screening density or boiler/normal-volume assumption."
  - id: transport_basis
    applies_to: "road_freight"
    required_property_ref:
      name: "Goods transport (mass*distance)"
      uuid: "838aaa20-0117-11db-92e3-0800200c9a66"
    required_unit: "t*km"
    rule: "Use actual measured payload and route distance with 1000 kg/t, retaining load, empty-return and supplier-gate evidence under cp_transport. Different modes and included logistics require separate handling, not a default distance."
process_map:
  - id: site_earthworks
    name: "Site preparation, earthworks and temporary water control"
    inclusion: "required"
    inclusion_condition: "Inspect actual clearing, excavation, grading, borrow and internal reuse; cofferdam/diversion/dewatering only where performed."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: banks_drainage
    name: "Integral banks, filters, protection and subsoil drainage"
    inclusion: "conditional"
    inclusion_condition: "Where the selected waterworks includes integral banks/flood protection, filters, revetment or drains; not a separate standalone dam/embankment output."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: lining_structures
    name: "Lining and hydraulic civil structures"
    inclusion: "conditional"
    inclusion_condition: "Where real lined canals, headworks, storage, walls, culverts or pumping civil structures are delivered; route/materials from actual design."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: underground_conveyance
    name: "Integral underground hydraulic conveyance"
    inclusion: "conditional"
    inclusion_condition: "Only actual hydraulic tunnels, jacking drives or shafts inside the works; preserve excavation, ground-support, face conditioning, lining and water-control route."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: controls_installation
    name: "Fixed water-control and pumping installation"
    inclusion: "conditional"
    inclusion_condition: "When the delivery configuration includes gates, flap valves, pumps, actuators, instruments or fixed electrical systems."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: site_utilities
    name: "Construction plant, utilities, transport and direct environmental exchanges"
    inclusion: "required"
    inclusion_condition: "All construction and acceptance stages; each exchange is conditional on actual occurrence and source/interface."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: construction_wastes
    name: "Construction waste segregation, recovery and transfer"
    inclusion: "required"
    inclusion_condition: "Inspect all construction, testing and in-scope replacement stages; record each real stream and destination, including non-applicability evidence."
    role: "foreground_production"
    quantitative_reference: "per declared reference flow"
  - id: handover
    name: "Verification, reinstatement and physical acceptance"
    inclusion: "required"
    inclusion_condition: "Always confirm completeness, functional interfaces, actual geometry, defects and acceptance; testing consumption remains stage-coded under utilities/wastes."
    role: "delivery"
    quantitative_reference: "per declared reference flow"
