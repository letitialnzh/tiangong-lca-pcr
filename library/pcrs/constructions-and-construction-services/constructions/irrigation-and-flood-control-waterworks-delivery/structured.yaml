allocation_rules:
  - rule_id: direct_subdivision
    applies_to: "dataset"
    rule: "First assign receipts, meters, equipment logs and subcontract works directly to this defined delivery and stage. Subdivide joint water-supply, navigation, power or other functions before allocation. If inseparable works serve several beneficiaries/functions, justify an evidenced physical causal driver and denominator, show all recipients and sensitivity; a common area, cost or flow-capacity ratio is not automatically causal."
    source_ids: []
  - rule_id: manufacture_share_conservation
    applies_to: "excavator_manufacture_share; formwork_plywood; steel_support"
    rule: "For each reusable asset retain one persistent same-asset manufacture boundary and documented total service basis. Multiply its real mass/count by the current dimensionless attributed share only when units and configuration match. Across projects, periods, temporary reuse and later reuse, cumulative shares must be no greater than one. Keep forecast versus realized service explicit and reconcile; unknown lifetime/activity denominator remains review, never a per-project reset or an invented lifespan."
    source_ids: []
  - rule_id: recovery_and_internal_reuse
    applies_to: "construction_wastes"
    rule: "Internal cut/fill reuse, recirculated water and recovered formwork are reconciled internal transfers, not co-products or automatic environmental credits. Preserve actual exported soil, scrap and waste quantities and the point of waste/product status change. Do not subtract hypothetical recycling, avoided virgin production or avoided flood loss from the construction result; any separately assessed recovery scenario must state allocation and substitution evidence."
    source_ids: []
  - rule_id: allocation_rule_4
    applies_to: "foreground_burden_allocation"
    rule: "These conservation and direct-attribution rules are modelling controls backed by actual cp_shared_assets/cp records, not prescribed lifetime or allocation factors. Any unresolved beneficiary or lifetime relationship must be reviewed and disclosed in the eventual dataset."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "handover"
      flow_role: "accepted entity and function"
      record_type: "foreground_records"
      raw_fields: "Project/site/asset ids; coordinates and delivery limits; irrigation/flood purpose; inlet/outlet levels; chainage, surveyed sections and gradients; protected/irrigated area definitions; actual storage, conveyance and pump capacities; structures/equipment schedule; test condition/date/results; defects and signed handover"
      collection_method: "Inspect as-built survey and drawings, approved actual configuration and signed civil/hydraulic/mechanical checks. Confirm one complete usable delivery, including integral drainage, control and accepted interfaces; meter test energy/water under their own protocols. No default dimensions, loads, period or mass."
      unit: "item; m; m2; m3; m3/s; m"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
    - protocol_id: cp_earthworks
      process_id: "site_earthworks"
      flow_role: "site and earth movement"
      record_type: "foreground_records"
      raw_fields: "Original site/land condition; topsoil/rock/soil classification and contamination; surveyed excavation/fill and borrow geometry; mass, moisture and actual density basis; internal reuse; compaction tests; temporary diversion/cofferdam/dewatering/removal records"
      collection_method: "Survey pre/post surfaces and sections, reconcile weighbridge and earthwork logs, and inspect geotechnical/acceptance tests. Measure or certify route-specific density where volume-to-mass is needed; distinguish excavated, loose and compacted volumes. Split different material states and routes; keep retained native earth internal."
      unit: "kg; m3"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
    - protocol_id: cp_materials
      process_id: "banks_drainage"
      flow_role: "bank, protection and drainage materials"
      record_type: "foreground_records"
      raw_fields: "Material specification, origin and supply gate; receipts/returns/stock; rock grading, filter grain distribution, moisture; actual layer/drain/grass area and dimensions; installed mass; geotextile polymer and roll areal mass; field tests and destination"
      collection_method: "Reconcile delivery weights/certificates to as-built layer/pipe geometry and acceptance. Weigh or use traceable supplier certificates for the same lot; confirm volume/area-to-mass factors and moisture, not a generic density. Preserve actual natural/vegetated, rigid/flexible and filter interfaces."
      unit: "kg; m2; m3; m"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
    - protocol_id: cp_concrete
      process_id: "lining_structures"
      flow_role: "lining and civil structure exchanges"
      record_type: "foreground_records"
      raw_fields: "Real mix and admixture identities/concentrations; batch and delivery tickets; component inclusions; actual cast/precast/brick/asphalt/membrane route; installed survey volume/area, mass and losses; reinforcement grade and bar schedule; formwork, joints/seals and curing; tests and returns"
      collection_method: "Collect stage/lot-specific receipts and installed measurements. For purchased mixes retain upstream manufacture once; for site batching split every real ingredient and direct utility. Use actual geometry and measured/certified density or product mass per area/length, retaining water content and test evidence; no default recipe, yield or lining thickness."
      unit: "kg; m3; m2; m"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
    - protocol_id: cp_underground
      process_id: "underground_conveyance"
      flow_role: "hydraulic underground route"
      record_type: "foreground_records"
      raw_fields: "Alignment, shafts, tunnel/jacking sections and ground conditions; excavation method, support and face-control state; actual lining/pipe/steel receipts and placement; actual grout and conditioning recipes, dry powder/water; plant, slurry recovery and accepted geometry"
      collection_method: "Use excavation/ground-support shift logs, pipe/segment schedules, surveys, actual recipe/meter records and acceptance. Split temporary/permanent material, internal recovery and emitted/transferred outputs. Add route-specific support and treatment units when needed; never transfer a transport-tunnel methodology without hydraulic applicability evidence."
      unit: "kg; m3; m2; m"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
    - protocol_id: cp_controls
      process_id: "controls_installation"
      flow_role: "installed control/pumping components"
      record_type: "foreground_records"
      raw_fields: "Actual gate/valve/pump/actuator/sensor/cable models and supplier interface; included motor/base/cabinet/seals; installed quantities, mass/geometry and ratings; water quality, head/flow/level test conditions and commissioning record"
      collection_method: "Check delivered component schedules, certificates, same-configuration weighing or traceable recorded net mass and installed count/length. Commission real duty, seal/backflow/control operation against project criteria; upstream equipment production and site installation do not overlap."
      unit: "kg; item; m"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
    - protocol_id: cp_utilities
      process_id: "site_utilities"
      flow_role: "actual plant fuel/electricity/oil"
      record_type: "foreground_records"
      raw_fields: "Stage and machine id; meter start/end; fuel type, actual supply and fossil share; density/temperature or direct weighed consumption; oil grade; electricity country/voltage/meter point; operation, idle and generator logs; supplier and service inclusions"
      collection_method: "Meter dedicated construction and testing consumption; reconcile purchases, tank/stock change and returns. Retain each machine/work-stage separately, including compaction, placement/vibration, pumping and actual tunnel operations. kWh to MJ is an energy-unit conversion; fuel volume-to-mass/energy needs real density/heating-value data, not electricity analogy."
      unit: "kg; L; m3; kWh; MJ"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
    - protocol_id: cp_water
      process_id: "site_utilities"
      flow_role: "supply, abstraction and water release"
      record_type: "foreground_records"
      raw_fields: "Water source, quality, supplier/country/gate; river/aquifer; intake and return meters; site treatment; tank change/recirculation; rainfall and bypass diversion; volume, temperature/density if conversion; actual receiver and discharge/transfer evidence"
      collection_method: "Measure supply, direct abstraction, dewatering, recirculation, disposal and actual returns by source and destination; reconcile the site water balance and commissioning stage separately. Sample pollutants where actually present and preserve treatment and concentration/volume data. Separate process-water/waste interfaces from resource/emission flows."
      unit: "m3; L; kg"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
    - protocol_id: cp_environment
      process_id: "site_utilities"
      flow_role: "direct environmental species and site impacts"
      record_type: "foreground_records"
      raw_fields: "Substance/CAS, fossil or biogenic origin, medium/submedium, stage and source; measured emission or real engine/control/fuel activity and justified emission factor with citation/uncertainty; dust particle fraction, operations, silt, moisture, weather and control; site land change and noise receptor/time/spectrum"
      collection_method: "Use calibrated or otherwise quality-controlled monitoring, substantiated engine duty/control-specific emission data or a transparently evidenced calculation. If only a total NOx or TSP value exists, retain its limit and seek actual species/size evidence, rather than assigning it to NO, NO2 or PM10. Missing supported data is an explicit gap, not zero. Noise has separate acoustic metrics, not mass."
      unit: "kg for mass species; m2 for measured land geometry; acoustic metrics separately"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
    - protocol_id: cp_waste
      process_id: "construction_wastes"
      flow_role: "specific waste and recovery outputs"
      record_type: "foreground_records"
      raw_fields: "Origin/stage; chemical/material identity and wet/dry state; contamination; measured mass/volume, water/solid separation; internal reuse; actual carrier/recipient and treatment; retained structure removal; packaging inclusions"
      collection_method: "Weigh or meter each segregated output with actual manifests/tickets and destination. Close washout and slurry liquid/solid balances, distinguishing waste transfer from final environmental release; characterize excavated soil and separate rock. Include actual enabling demolition only for its defined replacement scope and avoid automatic recycling credits."
      unit: "kg; m3"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
    - protocol_id: cp_transport
      process_id: "site_utilities"
      flow_role: "actual transport service"
      record_type: "foreground_records"
      raw_fields: "Consignment/material identity; supplier gate; actual weighed cargo; vehicle/load and route; leg distance; empty return allocation; site/recipient; product/service inclusions"
      collection_method: "Compute each actual truck leg from traceable cargo and route records with kg to t conversion, retaining loading and return evidence. Different vessel, rail or hydraulic transport modes require their own service rows and properties; no nominal universal haul distance."
      unit: "kg; t; km; t*km"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
    - protocol_id: cp_shared_assets
      process_id: "site_utilities"
      flow_role: "joint manufacture and reused components"
      record_type: "foreground_records"
      raw_fields: "Persistent asset id and same delivered configuration; actual net mass/count and manufacturing dataset scope; full deployment/reuse ledger; current attributable activity; evidenced total service basis/justified forecast; all receiving projects/periods and shares; cumulative used/remaining share and revisions"
      collection_method: "Use traceable same-configuration weighing/certificates for the asset, then evidence the dimensionless attribution through complete cross-project activity history and service denominator. Check sum of shares no greater than one and later reconcile forecasts; unknown physical denominator or manufacture scope stays review. Meter operation independently from manufacture."
      unit: "kg; item; dimensionless share"
      frequency: "Each lot, work shift/meter interval, waste/transport event and actual commissioning/handover"
      temporal_coverage: "Complete actual enabling-to-handover period; record dates and unmetered gaps, with prior/removal stages separately tagged"
      site_scope: "Declared whole works and all attributable subcontract/supply interfaces"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Calibration/traceable certificates, original tickets/logs, surveys, signed checks, uncertainty and reconciliation"
  calculation_rules:
    - id: delivery_reconciliation
      applies_to: "all inventory rows"
      rule: "Keep each attributable exchange total in its declared row unit per declared reference flow. Reconcile receipts, returns, remaining stock, installed quantity, actual losses and outgoing streams for each material; retain internal cut/fill and water recirculation separately. No default mixture, waste ratio, density, dimensions or lifespan. If a campaign has several independent accepted works, use documented direct subdivision or justified allocation before reporting one delivery."
      inputs:
        - cp_earthworks
        - cp_materials
        - cp_concrete
        - cp_underground
        - cp_controls
        - cp_utilities
        - cp_water
        - cp_waste
        - cp_acceptance
      output: "exchange total per declared reference flow"
      source_ids:
        - usbr-crow-construction
    - id: preserve_numerator_units
      applies_to: "site_diesel; electricity_lv_cn; electricity_mv_cn; electricity_other; road_freight; membrane_hdpe"
      rule: "Maintain the one-works denominator. Convert raw electricity kWh to MJ using 3.6 MJ/kWh; preserve the public Net calorific value property. For road legs multiply actual payload in t by actual km, documenting returns. Other mass/volume/area/count conversions use the actual measured/certified density, geometry or unit mass in cp records; do not replace public reference properties. Keep raw and converted values with uncertainty."
      inputs:
        - cp_utilities
        - cp_transport
        - cp_concrete
      output: "same-unit exchange total per declared reference flow"
      source_ids: []
    - id: asset_attribution
      applies_to: "excavator_manufacture_share; formwork_plywood; steel_support"
      rule: "This rule applies to included machinery manufacture, reused formwork and reusable temporary steel support only. Manufacturing contribution equals actual same-configuration asset mass or count multiplied by the documented dimensionless current share. Permanent delivered steel support instead retains its actual full received/installed material quantity. Keep the complete numerator and evidenced total service/activity denominator, all recipients and periods; cumulative share cannot exceed one. Forecast service is explicit and reconciled, not a fixed life. This attributes an input asset to one delivered works; it does not convert the waterworks reference to kg."
      inputs:
        - cp_shared_assets
      output: "attributed asset input per declared reference flow"
      source_ids: []
    - id: environmental_quantification
      applies_to: "diesel_co2; diesel_co; diesel_no; diesel_no2; diesel_so2; exhaust_pm25; earthworks_dust_pm10; water_release_fresh; initial_filling_biogenic_co2; initial_filling_biogenic_ch4"
      rule: "Retain actual measured species/release totals or explicit actual-activity times substantiated route/engine/control-specific factors in cp_environment/cp_water with source, unit and uncertainty. Fuel carbon balance requires real fossil carbon and oxidation evidence; it supplies no NOx split or PM factor. Pollutant mass from liquid requires measured concentration and corresponding actual discharged volume with compatible units. Do not take historical TSP/area defaults as PM10, infer zero from missing data, or add nested PM sizes twice."
      inputs:
        - cp_environment
        - cp_water
        - cp_utilities
      output: "supported direct release per declared reference flow"
      source_ids:
        - epa-construction-dust-1995
        - epa-concrete-washout-2012
        - ipcc-flooded-land-2019
  data_quality_requirements:
    - id: geometry_function
      applies_to: "reference_waterworks"
      requirement: "Project extent, actual function, measured chainage/sections/areas/volume/capacity and acceptance record must describe the same completed configuration. A material quantity or fee is not the civil entity."
      evidence: "cp_acceptance; signed as-built survey and tests"
    - id: route_completeness
      applies_to: "dataset"
      requirement: "Check every actual enabling, earth/bank/lining, underground, pumping/control, temporary-removal and test stage, including subcontractors. Every significant missing activity or exchange is named and quantified/disclosed before downstream completeness is claimed."
      evidence: "cp_earthworks; cp_underground; cp_controls; actual method statements"
    - id: measured_properties
      applies_to: "all inventory rows"
      requirement: "Keep calibrated measurements or traceable equivalent records, actual property/units, component state, moisture/concentration, conversions and uncertainties. No invented default engineering quantity, recipe, operating intensity or service life."
      evidence: "calibration, receipts, batch certificates and survey"
    - id: representativeness
      applies_to: "dataset"
      requirement: "Record actual geography, construction dates/season, technology, soil/water conditions, supply mixes and subcontract scopes. USBR/FAO/Hong Kong descriptions are qualitative route evidence with stated historical/local limits, not current universal approval or quantitative defaults."
      evidence: "dated project records; source limitations"
    - id: identity_completeness
      applies_to: "dataset"
      requirement: "Report unresolved flow identities, factor needs, environmental/land/noise limitations, omitted upstream and later phases and effect on interpretation. Audit official Chinese names and shared row/rule ids. Technical passing does not close scientific review."
      evidence: "identity audit, cp_environment and boundary ledger"
validation_rules:
  - rule_id: entity_and_acceptance
    applies_to: "reference_waterworks"
    rule: "Require one physically accepted works with matching project id, site, delivered configuration, as-built geometry, inlet/outlet limits and documented irrigation/flood-control purpose. Declare real irrigated/protected area, flow/head/storage/pump capacity and test conditions where relevant. These qualifiers do not prove future flood performance, crop yield, regulatory approval or a service lifetime."
    source_ids:
      - unsd-cpc-3-2025
      - hk-dsd-stormwater-2018
  - rule_id: basis_and_physical_units
    applies_to: "all inventory rows"
    rule: "Reference output is 1 item and every exchange/protocol aggregate is per declared reference flow for that same whole delivery. Surveyed lengths, areas, volumes and installed capacities are qualifiers or documented supplemental metrics, not silent denominator changes. Confirm public property, unit group and actual numerator conversions; do not make Mass, Volume, Area, Count or energy interchangeable, and do not invent an overall works mass."
    source_ids: []
  - rule_id: materials_and_waste_balance
    applies_to: "lining_structures; underground_conveyance; construction_wastes"
    rule: "Reconcile delivery/returns/stock/installation/removal for each concrete, soil, rock, reinforcement and other specific exchange; record real mix/concentration, density and wet/dry basis where conversions occur. Keep temporary recovery and excavated native material distinct. Validate containment and destinations of washout/dewatering/slurry, and do not duplicate liquid water with wet-residue moisture."
    source_ids:
      - epa-concrete-washout-2012
      - usbr-crow-construction
  - rule_id: identity_and_emission_conditions
    applies_to: "site_utilities"
    rule: "Check each adopted identity against exact substance, fossil/biogenic origin, route/state, country, voltage, supply gate and medium/submedium, with referenceToReferenceFlowProperty and support units. NO is not NO2/N2O; an NOx equivalent is not a species. PM nested fractions are not summed. Only measured or explicitly supported factor-derived releases are admissible. Missing identity, measurement, factors or omitted significant operations remains disclosed review/incomplete data, not proof of database absence or zero burden."
    source_ids:
      - epa-construction-dust-1995
  - rule_id: hydraulic_civil_completeness
    applies_to: "dataset"
    rule: "Review the actual channel/bank/retention/culvert/tunnel/pump/control route against drawings and signed checks: alignment/levels/sections, ground conditions, filters/drains, joints/leakage, compaction, lining/structure quality, water-control operation, clearance and reinstatement as applicable. Use current project-specific acceptance evidence; historical guides do not impose universal geometry, strength, mix, water quality, life or legal approval. Missing integral drainage, control, support or treatment cannot be hidden by choosing a smaller easy route."
    source_ids:
      - fao-irrigation-system
      - usbr-canal-concrete-2017
      - hk-dsd-stormwater-2018
  - rule_id: allocation_and_disclosure
    applies_to: "dataset"
    rule: "Check full receiving-population and reusable-asset ledgers, no more than one cumulative manufacture share, no duplicated material/service/combustion, and separate later lifecycle scenarios. Scientific review and unresolved identities are explicit prerequisites for reviewed use; a candidate projection/measurement check is a technical consistency result, not methodology approval or publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site-specific foreground construction-to-handover dataset for one complete configured irrigation/flood-control works"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Link as the declared construction module in an LCA of the same physical works and compatible purpose/geometry/configuration, with upstream and later phases separately modelled and all gaps disclosed. Comparisons require matching function, extent, quality and boundaries, not item-count equality alone."
  excluded_use: "Complete cradle-to-gate/whole-life claim without verified added coverage; annual irrigation service or crop output; generalized flood avoidance benefit; standalone supply/nav/dam/pipeline/plant manufacture; universal per-kilometre, per-area or per-capacity coefficient; reviewed/publication claim from a candidate."
  required_metadata: "All reference qualifiers; site coordinates/country; complete as-built/retained asset and route schedule; construction/test/handover dates; measured geometry/function/capacity; supply gates and linked datasets; properties/units/conversions; protocols; waste/treatment and water/environment interfaces; attribution/asset ledger; actual acceptance evidence."
  required_quality_disclosure: "Measured versus factor-derived/estimated values, uncertainty, unmetered periods, actual route/material state, unresolved identities, missing upstream/significant work, direct-emission/land/noise gaps, temporal/geographic limits and excluded operation/maintenance/renewal/demolition; scientific-review and translation states."
  update_trigger: "Changed purpose, extent/interface, actual structure/lining/ground/underground route, delivered pumping/control configuration, measured quantities, fuel/grid/water supplies, attribution or waste destination; corrected identity/evidence/geometry; inclusion of additional lifecycle stages."
data_sources:
  - id: "unsd-cpc-3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC Version 3.0 Explanatory Notes, 30 June 2025, printed/PDF pp.279–280; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Semantic purpose and adjacent-category interfaces only; it does not define a construction recipe, life or methodology approval."
  - id: "fao-irrigation-system"
    type: "handbook"
    reference: "FAO, Irrigation Water Management: Training Manual No.1, Introduction to Irrigation, Chapter 5, §§5.1–5.4; retained historical chapter, https://www.fao.org/4/r4082e/r4082e06.htm"
    used_for: "Irrigation intake, canals, control, pumping and drainage functions; unlined/lined route options. Descriptive history only; no example dimensions, cost, efficiency, slope or life is transferred."
  - id: "usbr-crow-construction"
    type: "official_guidance"
    reference: "US Bureau of Reclamation, Crow Irrigation Project, Construction Activity Descriptions, original page last updated 24 June 2020; Bench Flumes, Headworks/Diversion Dams, Inverted Siphon, Wasteway, Automated Structures; https://www.usbr.gov/gp/nepa/cip/activity_descriptions.html"
    used_for: "Actual case process decomposition: excavation/backfill, temporary water control, concrete/reinforcement, membranes, riprap and control fitting. Case-specific rehabilitation descriptions do not mandate dams, machinery, material quantities or default plant manufacture."
  - id: "usbr-canal-concrete-2017"
    type: "handbook"
    reference: "US Bureau of Reclamation, Canal Operation and Maintenance: Concrete Lining and Structures, November 2017, §2.2 printed p.3/PDF p.9; §6.2 printed pp.27–28/PDF pp.33–34; https://www.usbr.gov/assetmanagement/docs/Canal_Concrete.pdf"
    used_for: "Retained qualitative placing/consolidation/curing and configuration-dependent quality context; repair/maintenance guidance, not a universal new-construction mix, curing duration, strength or lifetime."
  - id: "hk-dsd-stormwater-2018"
    type: "handbook"
    reference: "Hong Kong Drainage Services Department, Stormwater Drainage Manual, Fifth Edition, January 2018; §§13.1–13.7 printed/PDF pp.73–79, §14.1–14.2 pp.82–83, §16.4.2 p.109; https://www.dsd.gov.hk/EN/Files/Technical_Manual/technical_manuals/SDM_2018_5th.pdf"
    used_for: "Flood channel rigid/flexible/vegetated routes, integral protection, filters/drains, polder storage/pumping and actual underground-route considerations. Retained Hong Kong edition: no numeric design criteria or current regulatory compliance/approval is imported; project authorities/specifications govern actual acceptance."
  - id: "epa-construction-dust-1995"
    type: "official_guidance"
    reference: "US EPA, AP-42 §13.2.3 Heavy Construction Operations, January 1995, printed 13.2.3-1–2/PDF pp.1–2; https://www.epa.gov/sites/default/files/2020-10/documents/13.2.3_heavy_construction_operations.pdf"
    used_for: "Historical source limitations and operation-specific dust accounting; no area/month TSP value or unsupported PM10 factor is adopted."
  - id: "epa-concrete-washout-2012"
    type: "official_guidance"
    reference: "US EPA, Stormwater Best Management Practice: Concrete Washout, EPA-833-F-11-006, February 2012, PDF pp.1–2; https://www.epa.gov/sites/default/files/2015-11/documents/concretewashout_0.pdf"
    used_for: "Separate contained washout liquid and solids, actual recycling/treatment and water-release boundaries; no mandatory emission, pH threshold or compliance claim."
  - id: "ipcc-flooded-land-2019"
    type: "official_guidance"
    reference: "IPCC, 2019 Refinement to the 2006 Guidelines, Volume 4 Chapter 7 Wetlands, §7.3 and Table 7.7, printed pp.7.6–7.7/PDF pp.6–7; https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/4_Volume4/19R_V4_Ch07_Wetlands.pdf"
    used_for: "Initial-filling/constructed-waterbody greenhouse-gas pathway review, actual baseline/time/site and avoidance of duplicate carbon accounting. Flooded-land definitions and seasonal-floodplain exclusions matter; no national annual default emission factor or automatic release is transferred to construction/testing."
