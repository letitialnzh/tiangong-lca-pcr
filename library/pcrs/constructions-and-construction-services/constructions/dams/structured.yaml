allocation_rules:
  - rule_id: one_dam_output
    applies_to: "asset"
    rule: "Count a composite or single-route dam once; multifunctional water supply, flood control and power require a separate justified use-stage study."
    source_ids:
      - usbr-design-standards
  - rule_id: shared_diversion
    applies_to: "diversion, pumps and equipment"
    rule: "Assign actual use to each node by metered hours, work quantities or disclosed engineering proxy, retaining service period and users; count once."
    source_ids:
      - usbr-design-standards
  - rule_id: rework_residual
    applies_to: "rejected material"
    rule: "Return rework to its producer; apply recovery credit only under a disclosed study convention and exclude rejects from accepted output."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_site_works
      process_id: "site_foundation"
      flow_role: "diversion, excavation, foundation"
      record_type: "survey and subcontract log"
      raw_fields: "area, in-situ volume, work scope, acceptance"
      collection_method: "survey and engineer sign-off"
      unit: "m2, m3, service unit"
      frequency: "each package"
      temporal_coverage: "start to foundation acceptance"
      site_scope: "site"
      aggregation_rule: "sum accepted packages, separate rework"
      quality_evidence: "survey and acceptance records"
    - protocol_id: cp_spoil
      process_id: "site_foundation"
      flow_role: "spoil"
      record_type: "dispatch and destination tickets"
      raw_fields: "type, origin, mass, density, reuse, destination"
      collection_method: "ticket and density reconciliation"
      unit: "kg, m3"
      frequency: "each dispatch"
      temporal_coverage: "excavation period"
      site_scope: "site and destination"
      aggregation_rule: "sum exported mass once"
      quality_evidence: "tickets and receipt"
    - protocol_id: cp_materials
      process_id: "both_nodes"
      flow_role: "foundation, diversion, placed materials and rejects"
      record_type: "delivery, mix, borrow, placement and QA ledger"
      raw_fields: "item, segment, delivered, placed, density, rejected, disposition"
      collection_method: "batch/lift records and as-built survey"
      unit: "kg, m3, item"
      frequency: "each batch or lift"
      temporal_coverage: "placement to completion"
      site_scope: "all segments"
      aggregation_rule: "reconcile installed, returned and rejected"
      quality_evidence: "batch, compaction and concrete tests"
    - protocol_id: cp_water
      process_id: "dam_build"
      flow_role: "construction water"
      record_type: "meter log"
      raw_fields: "source, reading, use, transfer"
      collection_method: "meter readings"
      unit: "m3"
      frequency: "monthly and major use"
      temporal_coverage: "construction"
      site_scope: "site intake"
      aggregation_rule: "sum withdrawals by use"
      quality_evidence: "calibrated meter and permit"
    - protocol_id: cp_energy
      process_id: "both_nodes"
      flow_role: "fuel and electricity"
      record_type: "meter, invoice and runtime log"
      raw_fields: "carrier, quantity, plant, node, hours"
      collection_method: "meter and fuel reconciliation"
      unit: "kWh, MJ, kg"
      frequency: "monthly"
      temporal_coverage: "active work"
      site_scope: "site and shared plant"
      aggregation_rule: "assign by actual use, convert once"
      quality_evidence: "meter and receipts"
    - protocol_id: cp_acceptance
      process_id: "dam_build"
      flow_role: "reference output"
      record_type: "acceptance dossier"
      raw_fields: "type, geometry, test, defects, date"
      collection_method: "signed engineer inspection"
      unit: "dam, m, m3"
      frequency: "final and retest"
      temporal_coverage: "completion gate"
      site_scope: "whole dam"
      aggregation_rule: "count one after acceptance"
      quality_evidence: "signed certificate"
  calculation_rules:
    - id: spoil_mass
      applies_to: "excavation"
      rule: "Exported mass = weighed dispatch or in-situ volume × tested density, minus documented internal reuse."
      inputs:
        - survey
        - tickets
        - density
        - reuse
      output: "kg exported/dam"
      source_ids:
        - mass-balance-identity
    - id: placed_material
      applies_to: "segments"
      rule: "Installed mass = accepted volume × measured density; reconcile with deliveries and rejects."
      inputs:
        - "as-built volume"
        - density
        - delivery
      output: "kg installed/segment"
      source_ids:
        - mass-balance-identity
    - id: carrier_energy
      applies_to: "plant"
      rule: "Convert each carrier with declared factor; do not add generated electricity to generator fuel."
      inputs:
        - "metered carriers"
        - conversion
        - allocation
      output: "MJ-equivalent/dam"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: route_evidence
      applies_to: "structure"
      requirement: "Identify each concrete, embankment or composite segment and applicable test regime."
      evidence: "as-built, mix and compaction records"
    - id: mass_reconciliation
      applies_to: "excavation and placement"
      requirement: "Explain unmatched deliveries, spoil, rework and rejects."
      evidence: "signed reconciliation"
    - id: acceptance_evidence
      applies_to: "reference output"
      requirement: "Retain geometry and structural, seepage and hydraulic tests plus handover."
      evidence: "acceptance dossier"
    - id: identity_disclosure
      applies_to: "unbound flows"
      requirement: "Retain semantic specifications until platform detail confirmation."
      evidence: "supplier specification"
validation_rules:
  - rule_id: reference_acceptance
    applies_to: "output"
    rule: "Reject a one-dam output without signed handover, geometry, route and integral-works scope."
    source_ids:
      - usbr-design-standards
  - rule_id: foundation_link
    applies_to: "graph"
    rule: "Accepted foundation must connect to actual dam segments; exported spoil needs a destination."
    source_ids:
      - usbr-design-standards
  - rule_id: route_checks
    applies_to: "materials"
    rule: "Check mix and placement for concrete and borrow, lift and compaction for embankment; composite dams need both."
    source_ids:
      - usbr-design-standards
  - rule_id: shared_and_rework
    applies_to: "site burdens"
    rule: "Flag duplicate temporary works, missing reject paths or rejects counted as accepted."
    source_ids:
      - mass-balance-identity
  - rule_id: identity_gate
    applies_to: "final exchange"
    rule: "Require detail-confirmed exact flow, property and unit-group UUID before emitting an exchange."
    source_ids:
      - usbr-design-standards
published_dataset_profile:
  dataset_role: "Site-specific completed civil asset foreground package; candidate method until review."
  downstream_use: "Secondary or background construction data if geometry, route and gate match."
  allowed_use: "Construction-stage accounting for declared accepted dam and integral hydraulic works."
  excluded_use: "Generation, reservoir operation, irrigation service or unqualified comparison."
  required_metadata: "Site, year, type, geometry, segments, spillway/outlet scope, borrow/spoil, energy and acceptance."
  required_quality_disclosure: "Quantity and density methods, shared-works attribution, unresolved UUIDs, range tier and cut-offs."
  update_trigger: "Design, route, as-built quantities, acceptance, scope or confirmed identity changes."
module_references:
  selection_mode: "automatic"
  selected:
    - id: module.activity.assembly-integration-node
      kind: "activity"
      path: "library/modules/activities/assembly-integration-node.yaml"
      decision: "applicable"
    - id: module.activity.resource-removal-node
      kind: "activity"
      path: "library/modules/activities/resource-removal-node.yaml"
      decision: "applicable"
    - id: module.technology.alternative-technology-route
      kind: "technology"
      path: "library/modules/technologies/alternative-technology-route.yaml"
