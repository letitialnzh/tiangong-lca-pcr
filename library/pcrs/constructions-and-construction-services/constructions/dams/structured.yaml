process_map:
  - id: site_foundation
    name: "Diversion and foundation preparation"
    inclusion: "required"
    inclusion_condition: "Surveyed riverbed to accepted foundation."
    role: "Independently remove unsuitable ground, route spoil, treat foundation and return failures for rework."
    quantitative_reference: "Surveyed excavation and accepted foundation area."
  - id: dam_build
    name: "Dam body and appurtenant integration"
    inclusion: "required"
    inclusion_condition: "Accepted foundation to signed dam handover."
    role: "Integrate placed concrete or compacted fill, filters and hydraulic works; route rejected placements."
    quantitative_reference: "One accepted dam and measured route segments."
