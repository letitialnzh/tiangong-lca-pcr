          property_unit: "Area / m2"
          description: "Internal handoff to dam_build, not a second saleable dam."
          amount:
            expression: "Survey accepted area and transfer matching location to placement."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per accepted dam"
              kind: "reference_flow"
            evidence:
