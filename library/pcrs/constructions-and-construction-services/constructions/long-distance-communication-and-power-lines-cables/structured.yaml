allocation_rules:
  - rule_id: single_route_length
    applies_to: "accepted line"
    rule: "Count each physical segment once even with multiple circuits; report communication and power functions separately unless shared-asset attribution has evidence."
    source_ids:
      - segment-length-identity
  - rule_id: shared_plant
    applies_to: "equipment, vessel, temporary access"
    rule: "Assign actual use by hours or work quantities to segment once."
    source_ids:
      - doe-transmission-eis
      - itu-g971
  - rule_id: reject_loop
    applies_to: "off-spec components"
    rule: "Return repair to line_integration; classify supplier return, recovery or disposal as boundary exits, retain burdens, and exclude rejects from accepted length."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_corridor
      process_id: "corridor_preparation"
      flow_role: "clearing and handoff"
      record_type: "survey and work log"
      raw_fields: "segment, route, length, area, volume, subcontract, acceptance"
      collection_method: "as-built survey and sign-off"
      unit: "km, m2, m3, service unit"
      frequency: "each segment"
      temporal_coverage: "pre-work to corridor acceptance"
      site_scope: "entire alignment"
      aggregation_rule: "sum accepted segments only"
      quality_evidence: "survey and certificate"
    - protocol_id: cp_residuals
      process_id: "corridor_preparation"
      flow_role: "removal and destination"
      record_type: "dispatch ticket"
      raw_fields: "material, origin, mass, volume, density, reuse, destination"
      collection_method: "weighed and surveyed reconciliation"
      unit: "kg, m3"
      frequency: "each dispatch"
      temporal_coverage: "clearing period"
      site_scope: "corridor and destination"
      aggregation_rule: "sum exported mass once"
      quality_evidence: "ticket and receipt"
    - protocol_id: cp_components
      process_id: "line_integration"
      flow_role: "cable, supports, rejects"
      record_type: "delivery and QA ledger"
      raw_fields: "specification, segment, delivered, installed, slack, rejected, repaired, returned, destination"
      collection_method: "supplier and as-built reconciliation"
      unit: "m, kg, item"
      frequency: "each lot"
      temporal_coverage: "installation to acceptance"
      site_scope: "all segments"
      aggregation_rule: "reconcile installed, returned and rejected"
      quality_evidence: "invoice, installation and defect record"
    - protocol_id: cp_energy
      process_id: "both_nodes"
      flow_role: "energy"
      record_type: "meter and fuel log"
      raw_fields: "carrier, quantity, plant, vessel, segment, hours, contracted scope"
      collection_method: "meter and invoice reconciliation"
      unit: "kWh, MJ, kg"
      frequency: "monthly"
      temporal_coverage: "active work"
      site_scope: "corridor, site and vessel"
      aggregation_rule: "allocate once by use"
      quality_evidence: "meter and receipt"
    - protocol_id: cp_installation
      process_id: "line_integration"
      flow_role: "contracted joining and testing"
      record_type: "contract and test dossier"
      raw_fields: "segment, service scope, quantity, test, invoice, owned-work exclusion"
      collection_method: "contract-to-as-built reconciliation"
      unit: "declared service unit"
      frequency: "each package"
      temporal_coverage: "installation to test"
      site_scope: "relevant segment"
      aggregation_rule: "sum accepted nonduplicated scope"
      quality_evidence: "invoice and test certificate"
    - protocol_id: cp_acceptance
      process_id: "line_integration"
      flow_role: "reference output"
      record_type: "commissioning dossier"
      raw_fields: "alignment, function, route, length, specification, test, defects, date"
      collection_method: "survey and signed test"
      unit: "route-km"
      frequency: "each segment and final"
      temporal_coverage: "completion gate"
      site_scope: "terminal-to-terminal"
      aggregation_rule: "sum passed non-overlapping segments"
      quality_evidence: "signed tests and handover"
  calculation_rules:
    - id: accepted_length
      applies_to: "output"
      rule: "Sum signed non-overlapping route lengths; exclude failed sections pending retest."
      inputs:
        - "survey and commissioning"
      output: "accepted route-km"
      source_ids:
        - segment-length-identity
    - id: component_balance
      applies_to: "components"
      rule: "Delivered = installed + returned + final rejected + stock change by specification."
      inputs:
        - delivery
        - installation
        - return
        - rejects
      output: "kg or m by component"
      source_ids:
        - mass-balance-identity
    - id: residual_mass
      applies_to: "corridor"
      rule: "Exported mass = weighed dispatch or surveyed removed volume × tested density minus reused mass."
      inputs:
        - survey
        - tickets
        - density
        - reuse
      output: "kg exported/route-km"
      source_ids:
        - mass-balance-identity
    - id: carrier_conversion
      applies_to: "energy"
      rule: "Convert each carrier with disclosed factor; avoid counting generator fuel and its electricity twice."
      inputs:
        - meter
        - "fuel and allocation"
      output: "MJ-equivalent/route-km"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: route_identity
      applies_to: "line"
      requirement: "Declare function, route, terminals, specification and segment ID."
      evidence: "design and as-built dossier"
    - id: route_testing
      applies_to: "installation"
      requirement: "Preserve overhead electrical/stringing, buried protection/continuity or submarine laying/optical tests as applicable."
      evidence: "test and acceptance dossier"
    - id: quantity_reconciliation
      applies_to: "components and residuals"
      requirement: "Explain unmatched length, mass, returns, spoil and rework."
      evidence: "signed reconciliation"
    - id: identity_disclosure
      applies_to: "unbound flows"
      requirement: "Preserve semantic specification until platform detail and support-row confirmation."
      evidence: "supplier and as-built specification"
validation_rules:
  - rule_id: function_and_route
    applies_to: "output"
    rule: "Reject output without function, route, terminals, segment length and signed commissioning."
    source_ids:
      - doe-transmission-eis
      - itu-g971
  - rule_id: segment_route_delta
    applies_to: "segments"
    rule: "Require foundations/supports/stringing for overhead, trench/duct/backfill for buried or survey/clearance/laying/protection/tests for submarine; do not assign two alternatives to one segment."
    source_ids:
      - doe-transmission-eis
      - itu-g971
  - rule_id: corridor_to_line
    applies_to: "graph"
    rule: "Match prepared and installed alignment; every removed residual needs destination."
    source_ids:
      - segment-length-identity
      - mass-balance-identity
  - rule_id: rework_and_double_count
    applies_to: "installation"
    rule: "Flag rejects counted as accepted, unresolved repair exits, duplicate subcontract/owned energy or cable length mistaken for route length."
    source_ids:
      - mass-balance-identity
      - segment-length-identity
  - rule_id: uuid_gate
    applies_to: "exchanges"
    rule: "Require detail-confirmed exact Product/Waste flow and support UUIDs before concrete TIDAS exchange; manufactured cable is not installed-line reference."
    source_ids:
      - segment-length-identity
published_dataset_profile:
  dataset_role: "Site-specific construction-stage line foreground package; candidate method until review."
  downstream_use: "Secondary or background dataset only where function, route, specification and handover match."
  allowed_use: "Construction burden for declared accepted route-km and disclosed segments."
  excluded_use: "Cable manufacture alone, local distribution, throughput, line operation or unqualified route comparison."
  required_metadata: "Terminals, geography, year, function, route lengths, circuits/fibres, voltage/capacity, components, tests and handover."
  required_quality_disclosure: "Survey and reconciliation methods, route deltas, cut-offs, shared plant, rejects, range tiers and unresolved identities."
  update_trigger: "Route, design, specification, quantity, test scope or verified platform identity changes."
