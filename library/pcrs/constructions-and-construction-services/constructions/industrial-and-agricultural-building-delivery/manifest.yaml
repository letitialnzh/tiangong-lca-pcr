review_metadata:
  scientific_review: pending
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: subbase
      flow_name: Crushed stone for foundation subbase
      reason: Available 16/32 crushed-stone identity does not establish the project
        grading.
    - row_id: soil_export
      flow_name: Non-contaminated excavated mineral soil sent for disposal
      reason: Excavated-soil product candidate is not waste; contaminated-soil
        remediation identities do not match.
    - row_id: ready_mix
      flow_name: Ready-mixed concrete delivered before placing
      reason: Placed-concrete candidate is after installation and cannot identify
        supplied ready-mix.
    - row_id: precast
      flow_name: Precast concrete structural column
      reason: Generic pre-cast concrete identity does not establish one reinforced
        structural column and embedded-component scope.
    - row_id: steel_beam
      flow_name: Fabricated structural steel beam
      reason: Pile-foundation steel pipe column and rolled steel do not establish
        fabricated beam identity.
    - row_id: steel_column
      flow_name: Fabricated structural steel column
      reason: Pile steel pipe column is a different structural function/state; exact
        fabricated column remains unresolved.
    - row_id: mortar
      flow_name: Cement-sand masonry mortar
      reason: Candidate mortar prescribes 60–85% sand; this supplied formulation is
        not established.
    - row_id: steel_bolt
      flow_name: Structural steel bolt
      reason: Unspecified steel-fasteners set is not one verified structural bolt.
    - row_id: argon
      flow_name: Argon welding shielding gas
      reason: Generic shielding gas and undefined gas mixture cannot identify pure
        argon with this mass basis.
    - row_id: industrial_door
      flow_name: Finished steel industrial roller door
      reason: Combined metal doors/windows/frames identity does not establish one
        complete steel industrial roller door.
    - row_id: silo_wall
      flow_name: Galvanized steel grain-silo wall panel
      reason: Corrugated roofing sheet does not establish the grain-silo panel
        geometry, strength and connection scope.
    - row_id: silo_roof
      flow_name: Galvanized steel grain-silo roof panel
      reason: No exact public silo-roof panel established in bounded queries; do not
        force general sheet identity.
    - row_id: silo_washer
      flow_name: Polyethylene grain-bin bolt sealing washer
      reason: Polyethylene resin/film and generic fasteners do not establish
        manufactured sealing washer identity.
    - row_id: floor_epoxy
      flow_name: Two-component epoxy industrial floor coating
      reason: Generic industrial maintenance coating and water-based binder do not
        establish epoxy floor formulation.
    - row_id: cable
      flow_name: Insulated copper low-voltage building cable
      reason: Public cable candidate has net-calorific-value reference; no supported
        product mass conversion established.
    - row_id: led
      flow_name: Complete LED building luminaire
      reason: LED module/driver candidates do not establish complete luminaire.
    - row_id: sprinkler
      flow_name: Fire sprinkler head
      reason: Semantic searches returned unrelated chemical candidates; exact
        installed sprinkler head remains unverified.
    - row_id: mains_water
      flow_name: Treated mains water supplied to construction site
      reason: Volume-based public candidate is HK-specific; other candidates use mass
        or different process routes.
    - row_id: concrete_waste
      flow_name: Hardened concrete construction offcut
      reason: Mixed construction waste does not establish segregated hardened-concrete
        waste.
    - row_id: steel_waste
      flow_name: Steel construction offcut sent for recycling
      reason: Post-industrial at-plant scrap and pretreated recycled-steel product are
        different gates; exact construction offcut unresolved.
    - row_id: film_waste
      flow_name: Polyethylene packaging film waste
      reason: Film product and mixed-plastic waste do not establish received
        polyethylene packaging waste.
    - row_id: washwater
      flow_name: Contained concrete-chute washwater for off-site treatment
      reason: Public wastewater with manganese-slag washing route is not
        concrete-chute washwater.
    - row_id: reference_building
      flow_name: Completed industrial or agricultural building
      reason: Industrial-facility candidates include equipment/operation or
        specialized excluded facilities; no verified whole delivered
        industrial/agricultural building count identity established.
    - row_id: formwork
      flow_name: Plywood formwork panel
      reason: Public plywood Mass/Volume identities require supported actual
        thickness/density conversion for this panel-area row; none assumed.
    - row_id: silo_stiffener
      flow_name: Galvanized steel grain-silo wall stiffener
      reason: General steel member and galvanized sheet identities do not establish
        silo-specific formed stiffener.
    - row_id: silo_anchor
      flow_name: Steel grain-silo foundation anchor bolt
      reason: Generic fasteners and equipment anchor-grout route do not identify this
        manufactured silo anchor bolt.
  limitations:
    - Candidate requires independent scientific and unit review; no methodology
      publication or legal approval.
    - Complete category retained; conditional examples are not a universal
      recipe. Every actual atomic exchange and work package must be recorded.
    - No default lifetime, per-building mass, capacity density, material ratio,
      emission factor, design load or compliance approval.
