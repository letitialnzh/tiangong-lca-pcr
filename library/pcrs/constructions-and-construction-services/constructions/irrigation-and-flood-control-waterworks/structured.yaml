allocation_rules:
  - rule_id: single_asset
    applies_to: "accepted output"
    rule: "Attribute route-specific work to accepted asset and segments; no assumed co-product credit for excavated material."
    source_ids:
      - mass-balance-identity
  - rule_id: cut_fill_balance
    applies_to: "soil and borrow"
    rule: "Reused cut stays internal with its burdens; exported spoil, recovered material and purchased fill have distinct destinations."
    source_ids:
      - mass-balance-identity
  - rule_id: shared_plant
    applies_to: "diversion and equipment"
    rule: "Assign shared plant and access by measured use or documented engineering driver, once across assets."
    source_ids:
      - usace-levee-manual
  - rule_id: reject_retention
    applies_to: "failed work"
    rule: "Keep rejected-work and rework burdens with producing node; no failed segment counted as accepted or unverified recovery credit."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_earthworks
      process_id: "site_earthworks"
      flow_role: "survey, service, diversion materials, cut and spoil"
      record_type: "survey and ticket"
      raw_fields: "chainage; cut; density; reuse; disposal; contract scope; temporary-material delivery, installation and removal"
      collection_method: "survey, weighbridge, contract and delivery tickets"
      unit: "m; m3; kg"
      frequency: "each segment/load"
      temporal_coverage: "project"
      site_scope: "declared chainage"
      aggregation_rule: "reconcile cut, reuse, exports, temporary materials and stock"
      quality_evidence: "survey, density test, tickets"
    - protocol_id: cp_energy
      process_id: "site_earthworks_form_waterwork"
      flow_role: "plant energy"
      record_type: "meter and fuel log"
      raw_fields: "carrier; quantity; equipment; hours; project share"
      collection_method: "meter, invoice, log"
      unit: "kWh; MJ; kg"
      frequency: "shift/month"
      temporal_coverage: "project"
      site_scope: "site and shared plant"
      aggregation_rule: "sum carrier and assign once"
      quality_evidence: "meter, invoice, allocation"
    - protocol_id: cp_materials
      process_id: "form_waterwork"
      flow_role: "fill, liner, protection, rejects"
      record_type: "bill and inspection"
      raw_fields: "specification; delivered; installed; density; repaired; rejected"
      collection_method: "ticket, survey, test"
      unit: "kg; m3; m2"
      frequency: "batch/lift/segment"
      temporal_coverage: "project"
      site_scope: "route segment"
      aggregation_rule: "reconcile deliveries, accepted installation and exits"
      quality_evidence: "tickets, compaction, liner tests"
    - protocol_id: cp_forming_acceptance
      process_id: "form_waterwork_waterwork_handover"
      flow_role: "segment handoff"
      record_type: "acceptance register"
      raw_fields: "chainage; route; geometry; volume; liner area; rework"
      collection_method: "survey, sign-off"
      unit: "m; m3; m2"
      frequency: "segment"
      temporal_coverage: "project"
      site_scope: "declared chainage"
      aggregation_rule: "sum accepted non-overlapping chainage"
      quality_evidence: "as-built survey, QA"
    - protocol_id: cp_components
      process_id: "waterwork_handover"
      flow_role: "controls and rejects"
      record_type: "bill and inspection"
      raw_fields: "component; delivered; installed; failed; repaired; returned"
      collection_method: "delivery, inspection"
      unit: "kg; item"
      frequency: "component"
      temporal_coverage: "project"
      site_scope: "accepted asset"
      aggregation_rule: "reconcile installed and exits"
      quality_evidence: "tickets, inspection"
    - protocol_id: cp_final_acceptance
      process_id: "waterwork_handover"
      flow_role: "accepted output"
      record_type: "handover certificate"
      raw_fields: "asset ID; function; chainage; tests; exclusions; date"
      collection_method: "signed certificate"
      unit: "waterwork; m"
      frequency: "handover"
      temporal_coverage: "project"
      site_scope: "asset"
      aggregation_rule: "count accepted assets only"
      quality_evidence: "certificate, tests"
  calculation_rules:
    - id: cut_reconciliation
      applies_to: "site_earthworks"
      rule: "Removed mass = internal reuse + exports + stock change, with state-specific density."
      inputs:
        - survey
        - density
        - tickets
      output: "reconciled cut and spoil"
      source_ids:
        - mass-balance-identity
    - id: installed_reconciliation
      applies_to: "form_waterwork"
      rule: "Delivered = accepted installed + returned + reject + stock change; rework is not a second new input."
      inputs:
        - tickets
        - survey
        - inspection
      output: "materials and rejects"
      source_ids:
        - mass-balance-identity
    - id: accepted_chainage
      applies_to: "waterwork_handover"
      rule: "Count non-overlapping signed chainage once; retain route geometry separately."
      inputs:
        - "segment and handover registers"
      output: "accepted asset and length"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: route_trace
      applies_to: "all nodes"
      requirement: "Identify function, chainage, routes, specifications and gate."
      evidence: "as-built drawings, QA register"
    - id: material_balance
      applies_to: "cut, fill, liner, controls"
      requirement: "Show state conversion, reuse, rejects, stock change and destination."
      evidence: "survey, density tests, tickets"
