allocation_rules:
  - rule_id: shared_assets
    applies_to: "shared haul road, depot, plant and temporary power"
    rule: "Name consuming nodes and service periods. Attribute measured use by machine hours, work volume or another documented physical driver; fractions sum to one."
    source_ids:
      - uic-mainline-lcat
  - rule_id: multiple_tracks
    applies_to: "parallel tracks or projects"
    rule: "Assign specific work first; allocate inseparable corridor work by documented physical use or covered length, never multiplying one route-km by track count."
    source_ids:
      - reference-definition
  - rule_id: secondary_inputs
    applies_to: "reclaimed rail, ballast and aggregate"
    rule: "Document origin and recovery hand-off. Count recovery processing once under the chosen upstream convention; no prior-use burden or substitution credit without evidence."
    source_ids:
      - uic-mainline-lcat
  - rule_id: rework_reject
    applies_to: "failed formation and track work"
    rule: "Keep rework at its producing node; route unrepaired material to recovery or disposal once; exclude pending or rejected chainage from output."
    source_ids:
      - mass-balance-identity
dataset_production:
  collection_protocols:
    - protocol_id: cp_earthwork
      process_id: "formation"
      flow_role: "earthwork service"
      record_type: "survey and contract"
      raw_fields: "chainage, excavation, fill, service scope and unit"
      collection_method: "survey and signed contractor log"
      unit: "m3, service unit"
      frequency: "each package"
      temporal_coverage: "preparation to formation gate"
      site_scope: "named corridor"
      aggregation_rule: "sum without duplicate owned-machine fuel"
      quality_evidence: "survey and invoices"
    - protocol_id: cp_materials
      process_id: "formation_track_handover"
      flow_role: "permanent products"
      record_type: "deliveries and as-built bill"
      raw_fields: "product, specification, mass or items, installed, returns, stock, secondary origin"
      collection_method: "signed delivery and as-built schedule"
      unit: "kg, item, m3"
      frequency: "each delivery"
      temporal_coverage: "full construction"
      site_scope: "accepted segment"
      aggregation_rule: "reconcile each product line"
      quality_evidence: "invoices and certificates"
    - protocol_id: cp_energy
      process_id: "formation_track_handover"
      flow_role: "equipment and test power"
      record_type: "meter and fuel log"
      raw_fields: "carrier, amount, node, date, shared consumers"
      collection_method: "meter, invoice and machine log"
      unit: "kWh, MJ, kg, L"
      frequency: "weekly"
      temporal_coverage: "construction and test"
      site_scope: "named corridor"
      aggregation_rule: "sum carriers and attribute common readings once"
      quality_evidence: "meter and invoice"
    - protocol_id: cp_freight
      process_id: "track_handover"
      flow_role: "inbound products"
      record_type: "shipment record"
      raw_fields: "product mass, mode, origin, distance, return convention"
      collection_method: "dispatch docket and route log"
      unit: "t, km, t·km"
      frequency: "each trip"
      temporal_coverage: "supply to site"
      site_scope: "supplier to corridor"
      aggregation_rule: "sum tonnes × loaded km by mode"
      quality_evidence: "signed transport record"
    - protocol_id: cp_waste
      process_id: "formation_track_handover"
      flow_role: "spoil and rejects"
      record_type: "waste/rework log"
      raw_fields: "material, mass, node, reuse, rework, export, receiver"
      collection_method: "weighbridge and manifest"
      unit: "kg"
      frequency: "each movement"
      temporal_coverage: "full construction"
      site_scope: "named corridor"
      aggregation_rule: "balance by origin and destination"
      quality_evidence: "tickets and receipts"
    - protocol_id: cp_acceptance
      process_id: "formation_track_handover"
      flow_role: "accepted states"
      record_type: "survey and commissioning"
      raw_fields: "endpoints, route-km, track-km, gauge, form, systems, defects, tests, acceptance"
      collection_method: "as-built survey and signed test"
      unit: "route-km, track-km"
      frequency: "each gate"
      temporal_coverage: "formation to handover"
      site_scope: "accepted segment"
      aggregation_rule: "match chainage and omit failed lengths"
      quality_evidence: "drawings and certificates"
  calculation_rules:
    - id: material_balance
      applies_to: "each product"
      rule: "Gross delivered = installed + exported waste + returns + closing stock minus opening stock within documented tolerance."
      inputs:
        - delivery
        - installation
        - "waste and stock"
      output: "kg/product and kg/route-km"
      source_ids:
        - mass-balance-identity
    - id: spoil_balance
      applies_to: "excavation"
      rule: "Excavated = on-site reuse + export + stock change after density and bulking conversion."
      inputs:
        - survey
        - "density and weighbridge"
      output: "kg/route-km and residual"
      source_ids:
        - mass-balance-identity
    - id: transport_work
      applies_to: "inbound freight"
      rule: "Sum actual loaded tonnes × kilometres by mode."
      inputs:
        - "mass and route records"
      output: "t·km/route-km"
      source_ids:
        - reference-definition
    - id: track_ratio
      applies_to: "parallel tracks"
      rule: "Track-km / route-km is disclosed, not used to multiply reference output."
      inputs:
        - "as-built route and track survey"
      output: "track-km/route-km"
      source_ids:
        - reference-definition
    - id: shared_fraction
      applies_to: "common resources"
      rule: "Attributed amount = measured common amount × physical-use fraction; all fractions sum to one."
      inputs:
        - "meter and use records"
      output: "amount/route-km"
      source_ids:
        - mass-balance-identity
  data_quality_requirements:
    - id: dq_scope
      applies_to: "reference and interfaces"
      requirement: "Check accepted endpoints, route and track length, gauge, form, system scope and separate civil assets."
      evidence: "as-built plan and certificate"
    - id: dq_materials
      applies_to: "major components"
      requirement: "Reconcile rails, sleepers, fasteners, ballast/slab and equipment by specification and secondary origin."
      evidence: "delivery, as-built and waste records"
    - id: dq_time
      applies_to: "all phases"
      requirement: "Use project dates, supplier vintage and disclosed temporal gaps."
      evidence: "schedule, invoices and tests"
    - id: dq_identity
      applies_to: "final exchanges"
      requirement: "Confirm concrete UUID against platform detail, flow type, gate, property and unit before release."
      evidence: "flow and support-reference review"
    - id: dq_shared
      applies_to: "common plant"
      requirement: "Demonstrate consumers, service period and single allocation."
      evidence: "meter and allocation worksheet"
validation_rules:
  - rule_id: v_handover
    applies_to: "reference product"
    rule: "Require signed acceptance, endpoints, route-km, track-km, gauge, form and included systems; reject pending lengths."
    source_ids:
      - unsd-53212
      - fra-track-2026
  - rule_id: v_interfaces
    applies_to: "civil assets"
    rule: "Check station, bridge, tunnel and rolling-stock ownership; separately measured assets cannot vanish or be counted twice."
    source_ids:
      - unsd-53212
      - uic-mainline-lcat
  - rule_id: v_balance
    applies_to: "formation and materials"
    rule: "Test excavation and delivered-product balances including returns, stock, rework and exported rejects."
    source_ids:
      - mass-balance-identity
  - rule_id: v_rework
    applies_to: "deficient work"
    rule: "Link every rejected state to rework or one recovery/disposal exit before acceptance."
    source_ids:
      - mass-balance-identity
  - rule_id: v_secondary
    applies_to: "recovered inputs"
    rule: "Require origin, recovery gate and one burden convention, without unsupported substitution credit."
    source_ids:
      - uic-mainline-lcat
