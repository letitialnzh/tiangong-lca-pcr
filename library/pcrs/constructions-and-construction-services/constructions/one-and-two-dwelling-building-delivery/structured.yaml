    - id: project_reconciliation
      applies_to: "all inventory rows"
      rule: "Retain directly attributable totals per declared reference flow in the row unit. Reconcile receipts, returns, remaining stock, installed amounts and exported wastes for each identified product; disclose internal recirculation and test consumption. No default yield, waste fraction or area-to-mass factor."
      inputs:
        - cp_site
        - cp_structure
        - cp_envelope
        - cp_fitout
        - cp_utilities
        - cp_waste
        - cp_acceptance
      output: "documented exchange total per declared reference flow"
      source_ids:
        - jrc-levels-boq-2021
    - id: unit_preservation
      applies_to: "lv_electricity; mv_electricity; site_diesel; road_freight"
      rule: "Preserve reference quantity of one building; apply energy_identity and transport_basis to numerator units only. Keep raw values and conversion evidence with the dataset. Area per building may be reported as supplemental information, not silently substituted for this reference."
      inputs:
        - cp_utilities
        - cp_transport
      output: "MJ or t*km per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: physical_completeness
      applies_to: "dataset"
      requirement: "Whole-building identity, actual area and delivery systems must agree with drawings and handover. Missing fixed services or external works must be named and their effect disclosed; representative route rows alone are insufficient."
      evidence: "cp_acceptance; jrc-levels-boq-2021"
    - id: measurement_quality
      applies_to: "all inventory rows"
      requirement: "Retain calibrated readings, traceable supply and waste records, uncertainty, date and exact gate. Estimates must identify method, applicability and sensitivity; missing or unmeasured is never numeric zero."
      evidence: "all collection protocols"
