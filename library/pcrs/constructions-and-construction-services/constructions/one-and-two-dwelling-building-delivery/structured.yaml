measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Use cp_acceptance to identify one whole accepted building. Do not divide a two-dwelling building into two product items. All inventory amounts are per declared reference flow."
  - id: area_identity
    applies_to: "glazing; waterproofing; plasterboard; ceramic_floor; plywood_formwork"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Use actual documented area with thickness and assembly specification; do not rename public Area as Mass. Record building floor area with its survey definition separately."
  - id: energy_identity
    applies_to: "lv_electricity; mv_electricity; site_diesel"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the public property and energy unit group. Electricity MJ equals metered kWh multiplied by 3.6, as specified by the unit group. Fuel energy uses measured fuel quantity, actual density when needed and batch net calorific value; never prescribe a default fuel factor."
  - id: volume_state
    applies_to: "ready_mix; supplied_water; groundwater; riverwater; soil_export; concrete_washwater"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Collect volume at declared physical state; mass conversions require specific measured density and conditions. Soil bulking, water resource and wastewater are distinct."
  - id: transport_basis
    applies_to: "road_freight"
    required_property_ref:
      name: "Goods transport (mass*distance)"
      uuid: "838aaa20-0117-11db-92e3-0800200c9a66"
    required_unit: "t*km"
    rule: "Use actual consignment tonnes and travelled kilometres for each leg. Empty returns and load allocation need explicit records; no assumed delivery distance."
