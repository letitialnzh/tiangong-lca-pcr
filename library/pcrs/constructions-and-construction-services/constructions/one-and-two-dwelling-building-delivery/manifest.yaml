review_metadata:
  scientific_review: pending
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_identities:
    - row_id: granular_fill
      flow_name: Crushed stone for foundation subbase
      reason: Direct-read 4f197bee-7b3b-11dd-ad8b-0800200c9a66 is crushed stone 16/32. This subbase row does not prescribe that grading; supplier-specific grading and identity remain to be matched.
    - row_id: soil_export
      flow_name: Non-contaminated excavated mineral soil for off-site disposal
      reason: Direct-read de1e4201-dc49-4f84-b8df-5ceaa6e6e7dd is a Product flow, not this disposal Waste flow; contaminated-soil candidates carry unrelated TPH remediation conditions.
    - row_id: ready_mix
      flow_name: Ready-mixed concrete delivered before placing
      reason: Nearest direct-read candidate describes cast-in-place concrete after placing; not supplied ready-mix.
    - row_id: steel_member
      flow_name: Fabricated structural steel beam
      reason: Search candidates e6370181-053a-4a6c-9e69-d2204d297be9 hot rolling and b83f3a4a-c24b-4129-bbdb-00fbfe5768f8 multi-process weld do not identify the fabricated structural beam.
    - row_id: masonry_mortar
      flow_name: Cement-sand masonry mortar
      reason: Direct-read 6c154622-1ef0-4f56-a89f-b2af3054f5ef is constrained to 60–85% sand; actual supplied cement-sand formulation is not established. Do not adopt that percentage as a default.
    - row_id: plywood_formwork
      flow_name: Plywood formwork panel
      reason: Direct-read 8b239d58-5fc2-40a5-8003-33f4082bc995 is Mass-based plywood, e7e76e7b-5fee-40bf-a67a-ff4dd662bf39 is Volume-based. This panel-area row needs actual thickness/density/composition evidence to bind a supported product-property conversion; no conversion assumed.
    - row_id: window_frame
      flow_name: Finished aluminium window frame
      reason: Candidate 041fa2b1-7c58-489b-bec5-5b2bd58de19e is for photovoltaic frames; other fabricated-frame candidates are machinery-specific. No finished building-window frame identity established.
    - row_id: roof_tile
      flow_name: Fired clay roofing tile
      reason: Candidate 38191c2b-88f9-4b8d-9a1a-6b7b0b506169 is generic ceramic tile, not verified roofing tile; 9535932d-25a9-4707-bd3c-4cc690b02138 is asbestos cement, not fired clay.
    - row_id: acrylic_paint
      flow_name: Waterborne acrylic architectural paint
      reason: Direct-read 47411f13-cc57-455b-ba23-dafbaeef17db describes water-based paint with multiple possible binders and artist-colour classification; it does not establish this acrylic architectural formulation. UV coating is also unsuitable.
    - row_id: copper_cable
      flow_name: Insulated copper low-voltage building cable
      reason: Candidate bc015e4f-a244-428b-9632-3c350da8d1f5 has Net calorific value reference; no supported mass conversion for this installed cable.
    - row_id: toilet
      flow_name: Ceramic toilet bowl
      reason: Direct-read 383d585b-ffef-470e-8209-b347f77c2e42 is generic sanitary ceramics, not one complete bowl/count identity.
    - row_id: heat_pump
      flow_name: Residential air-source heat-pump unit
      reason: Direct-read 0c1bef08-e0fc-465a-aff0-c3a43837edbc explicitly excludes household equipment; other candidates are heaters, compressors and assemblies, not the specified residential heat-pump unit.
    - row_id: led_fixture
      flow_name: LED luminaire
      reason: Bounded search returns LED module f0e13a6e-6380-4372-98a0-899623339d91 and direct-read driver 95d83cf8-2c54-43ea-aecf-fbd0eaa3e6ad, neither a whole installed luminaire.
    - row_id: supplied_water
      flow_name: Treated mains water supplied to site
      reason: Volume candidate 3a8411b6-e476-4f98-9d77-0d492661a07f is HK supply. Other direct-read candidates use mass; no generic site-specific volume identity adopted.
    - row_id: concrete_waste
      flow_name: Hardened concrete construction offcut
      reason: Direct-read f23875ac-3a7f-48d2-9f97-c8b233783b2d is mixed construction waste, not segregated hardened-concrete offcut.
    - row_id: timber_waste
      flow_name: Untreated sawn timber offcut
      reason: Direct-read 2ef9d37a-2fbf-42f6-8ccf-5d6677d5cfd8 is primary-production wood waste; candidates with sawmill/chip or treatment-route states do not establish this onsite untreated sawn-member offcut.
    - row_id: gypsum_waste
      flow_name: Gypsum plasterboard offcut
      reason: Bounded 30-candidate queries returned plasterboard products and mixed construction waste; no exact segregated plasterboard waste identity established, without claiming absence from the database.
    - row_id: carton_waste
      flow_name: Corrugated cardboard packaging waste
      reason: Direct-read 72270223-04b1-4986-a546-94e5a0821317 and a318022d-c960-4eb5-a81c-04a9c4dda7e4 are packaging-production trim/reject states with embedded expert 2% assumptions, not received corrugated packaging removed at this building site.
    - row_id: film_waste
      flow_name: Polyethylene packaging film waste
      reason: Direct-read e64eb06c-6dc9-45f1-b003-3dc6c44b27e2 is Polyethylene film Product flow, not this discarded film Waste flow.
    - row_id: concrete_washwater
      flow_name: Contained concrete-chute washwater for off-site treatment
      reason: Direct-read d2d44ce1-c0f4-461d-9413-f4b33e0d200f has a specific manganese-slag washing route. Other water/wastewater candidates do not establish captured concrete-chute washwater exported for treatment.
    - row_id: reference_building
      flow_name: Completed one- or two-dwelling residential building
      reason: Public 74c5abb6-3662-4951-a7b8-d65cfc9a0982 has Mass reference property. No measured complete-building mass-to-count relationship is established; preserve 1 item functional reference and blank flow UUID.
  limitations:
    - Candidate methodology requires independent scientific and unit review; not publication or methodology approval.
    - Inventory examples are route-conditional; producers must add every actually occurring atomic exchange and disclose omissions.
    - No universal lifetime, carbon factor, design load, recipe, loss, mass per building or legal conformity is prescribed.
