    - id: water_balance
      applies_to: "test_water, test_discharge"
      rule: "External intake + initial fill = discharge + retained water + measured losses; internal reuse is not a second intake."
      inputs:
        - intake
        - reuse
        - "discharge and retained volume"
      output: "m3 by test section"
      source_ids:
        - epa-water-main-preparation
    - id: route_sum
