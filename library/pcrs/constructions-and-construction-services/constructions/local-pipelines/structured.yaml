      applies_to: "whole contract"
      requirement: "Cover every accepted chainage and test/repair loop through signed handover; disclose unavailable supplier data."
      evidence: "as-built, acceptance, invoices and gap register"
    - id: dq_routes
      applies_to: "open-cut and trenchless sections"
      requirement: "Preserve location and method for each chainage; do not double count pits, bore or overlapping excavations."
      evidence: "route drawings and daily logs"
    - id: dq_medium
      applies_to: "testing and conditioning"
