dataset_production:
  collection_protocols:
    - protocol_id: cp_corridor
      process_id: "corridor_removal"
      flow_role: "energy, purchased service, prepared chainage, spoil"
      record_type: "survey, log, invoice, haul ticket"
      raw_fields: "chainage, method, cut section, in-situ volume, fuel, electricity, contracted quantity, spoil mass, reuse, destination"
      collection_method: "as-built survey and source tickets"
      unit: "m, m3, kg, kWh, MJ, service unit"
      frequency: "by section and activity"
      temporal_coverage: "full construction contract"
      site_scope: "all open-cut, bore and pit sections"
      aggregation_rule: "reconcile route length and material removal; aggregate once per contract"
      quality_evidence: "survey, equipment logs, invoices, weighbridge and destination receipts"
    - protocol_id: cp_components
      process_id: "pipe_assembly"
      flow_role: "components, joining service, energy, accepted joints, rejects"
      record_type: "material register and inspection log"
      raw_fields: "pipe/fitting type, delivered/returned/installed/rejected kg, joining-service invoices, joint count, inspection result, rework, carrier quantity"
      collection_method: "supplier invoices, stock register and joint tests"
      unit: "kg, m, count, kWh or MJ, service unit"
      frequency: "by lot and joint"
      temporal_coverage: "full construction contract"
      site_scope: "all pipe assemblies in contract"
      aggregation_rule: "reconcile stock and accepted joined length"
      quality_evidence: "material certificates, joint inspection and rejection tickets"
    - protocol_id: cp_install_test
      process_id: "line_install"
      flow_role: "internal handoffs, energy, service, bedding, drilling fluid, water, disinfectant, accepted asset, discharge"
      record_type: "as-built, meter, test and acceptance records"
      raw_fields: "prepared/received/installed length, route method, carrier quantity, service quantity, imported bedding kg, drilling-fluid kg, chemical substance and kg, intake/reuse/discharge m3, test type/result, disinfection or sewer inspection, defect and repair, acceptance signature"
      collection_method: "as-built measurement, meters, invoices and signed tests"
      unit: "m, count, kg, m3, kWh, MJ, service unit"
      frequency: "per route section and test"
      temporal_coverage: "full construction contract through handover"
      site_scope: "all accepted sections and failed-test loops"
      aggregation_rule: "count accepted output once; reconcile material, water and chainage"
      quality_evidence: "test reports, water meter, discharge receipts, quality results and signed handover"
  calculation_rules:
    - id: spoil_mass
      applies_to: "exported_spoil"
      rule: "Exported mass = weighed haul mass, or surveyed in-situ volume × documented bulk density − internal reuse; explain uncertainty."
