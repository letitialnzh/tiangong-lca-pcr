measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "The reference is exactly 1 item, one accepted physical specialized manufacturing facility. item is the public Item(s) single-count unit, displayed as 件 in Chinese. cp_acceptance records the matching facility. All inventory rows and protocols aggregate per declared reference flow."
  - id: geometry_configuration
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "cp_acceptance retains as-built footprint, heights, foundation/rack dimensions, vessel working volumes and real capacity with product/time basis. Geometry/capacity are qualifiers, not assumed count-to-area/mass conversions. Compare only identical functional scope and acceptance; no default service life."
  - id: volume_state
    applies_to: "ready_mix; soil_disposal; water_supply; freshwater_abstraction; freshwater_discharge; washwater"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Preserve actual volume state: fresh concrete before placement, bank versus loose soil, supplied water versus receptor discharge. Conversion to mass requires measured same-state density with temperature/moisture and raw/converted records in cp_civil, cp_ground and cp_water; no default density."
  - id: diesel_mass
    applies_to: "diesel"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve public Mass/kg. For litres use actual batch-specific density; supplier heating value and fossil/biogenic share are separate evidence, not mass or emission defaults. cp_utilities reconciles stock, receipts, returns and consumed fuel."
  - id: electricity_energy
    applies_to: "electricity_lv; electricity_mv"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve public Net calorific value/energy group; 1 kWh=3.6 MJ is a unit conversion, not a fuel LHV assumption. cp_utilities records true region, user voltage, provider/mix and metering; avoid LV/MV/generator overlap."
  - id: component_mass
    applies_to: "liquid_pump; cooling_pump; induction_furnace; distribution_transformer; steel_form_panel; crane_manufacture_share"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated complete-component weighing or traceable supplier net weighing/BOM of the same configuration, excluding transport packaging and duplicate nested content. This component kg input per facility is not an invented facility mass. cp_install, cp_thermal and cp_assets preserve inclusion scope."
  - id: cable_length
    applies_to: "low_voltage_cable"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "Preserve public Length/m. cp_install measures delivered, installed, returned and wasted lengths by cable specification. Only a matching measured/traceable net kg/m permits mass conversion; do not double-count embedded conductors/insulation."
  - id: gas_primary_volume
    applies_to: "oxygen; purge_nitrogen"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Preserve each public gas Volume/m3 primary property. cp_gas_volume and cp_purge collect actual same-reference-state consumed volumes and retain raw net kg if weighed. Gas pressure-temperature and purity must match provider/reference conditions; net kg divided by evidenced same-state kg/m3 density gives m3. Unknown density/state stays review, with no assumed normal volume or rewritten Mass property."
