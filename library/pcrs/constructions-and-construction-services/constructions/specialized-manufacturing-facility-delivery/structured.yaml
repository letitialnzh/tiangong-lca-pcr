    used_for: "Historical physical furnace/moulding configuration; no transferred operation charges, capacities or emissions"
  - id: "jrc-iron-steel-2013"
    type: "official_guidance"
    reference: "European Commission JRC Iron and Steel Production BREF, 2013 EUR25521 EN, DOI10.2791/97469; §5.1.2.2 p.211/§6.1.3 p.292, PDF239/320; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/IS_Adopted_03_2012.pdf"
    used_for: "Historical silica coke-oven masonry and blast-furnace lining/cooling/gas configuration only; no default construction design or operation factors"
  - id: "ontario-chemical-storage-2007"
    type: "official_guidance"
    reference: "Ontario Ministry of Environment, Guidelines for environmental protection measures at chemical and waste storage facilities, May2007, §2 tanks/piping, §3 secondary containment; https://www.ontario.ca/page/guidelines-environmental-protection-measures-chemical-and-waste-storage-facilities"
    used_for: "Historical qualitative material/foundation/containment compatibility only; no numeric requirement or current legal approval adopted"
  - id: "ifc-pharma-biotech-2007"
    type: "official_guidance"
    reference: "IFC EHS Guidelines for Pharmaceuticals and Biotechnology Manufacturing, 30 April2007, pp.2–3; https://www.ifc.org/content/dam/ifc/doc/2000/2007-pharma-biotech-ehs-guidelines-en.pdf"
    used_for: "Historical physical reactor, separation/distillation and utility/environmental configuration context only. Actual alloy, stirred/pressure state, installation and initial commissioning need real supplier/project records; no operational solvent, nitrogen, energy or emission quantities transferred"
