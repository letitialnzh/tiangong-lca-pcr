    used_for: "Historical preparation/placement and quality records only; no present approval or default mixture/consumption"
  - id: "ifc-construction-2007"
    type: "official_guidance"
    reference: "World Bank Group/IFC General EHS Guidelines §4 Construction and Decommissioning, 30 April2007, printed89–91, PDF1–3; https://www.ifc.org/content/dam/ifc/doc/2000/2007-general-ehs-guidelines-construction-and-decommissioning-en.pdf"
    used_for: "Qualitative actual-site activity/environmental screening; no default emissions, factors or current compliance claim"
  - id: "ifc-foundries-2007"
