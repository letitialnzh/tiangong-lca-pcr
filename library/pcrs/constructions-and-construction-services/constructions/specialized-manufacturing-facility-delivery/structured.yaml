system_boundary:
  rules:
    - rule_id: boundary_stage
      applies_to: "dataset"
      rule: "The base starts with documented site conditions and incoming products at declared supplier/receipt gates, covering attributable logistics, ground/civil works, specialist installation, connections, construction support and actual acceptance through handover. Supplier production is separately linked background. This construction-and-delivery foreground does not prove full cradle-to-gate or full lifetime coverage."
      source_ids:
        - un-cpc-manufacturing-2025
    - rule_id: boundary_route
      applies_to: "chemical; thermal; utilities"
      rule: "Require a project functional-system register. Chemicals/pharmaceuticals reconcile real vessels, transfer/separation, containment, clean/utility systems; foundries reconcile melting, moulding, handling/extraction; blast furnaces reconcile shell/lining, charging, blast/cooling and gas systems; coke ovens reconcile masonry, heating, doors/charging and collection. Technologies are actual-route conditions, not universal requirements. Other specialized routes must demonstrate the same entity/function closure. Add individual physically specific rows and records for every missing installed system, ingredient, consumable, residue or release actually required; unresolved scope prevents a complete dataset claim."
      source_ids:
        - ifc-foundries-2007
        - jrc-iron-steel-2013
        - ontario-chemical-storage-2007
        - ifc-pharma-biotech-2007
    - rule_id: boundary_embedded
      applies_to: "all inventory rows"
      rule: "Choose supplier-component versus on-site fabrication boundaries from real work packages. Do not count complete vessels/furnaces/cables and embedded metals/lining/controls twice. Receipt, installation, transport and tests are separate. Ready-mix and site batching cannot overlap for the same volume. Include actual temporary works/subcontracts or disclose unavailable providers/cut-offs."
      source_ids:
        - usace-concrete-1994
    - rule_id: boundary_acceptance
      applies_to: "acceptance"
      rule: "Declare the mechanical/cold/hot acceptance endpoint and actual tests. Record test water, purge, dry-out, energy, reagents, trial charges/products, waste and releases as individual exchanges. Hot acceptance is not assumed absent or free; saleable test product and regular production are subdivided with real activity and material balances. Cold checks do not confer process capacity or regulatory approval."
      source_ids: []
    - rule_id: boundary_later
      applies_to: "dataset"
      rule: "Post-handover manufacturing operation, maintenance, later refractory relining/replacement and eventual demolition/remediation are separate from base delivery. Expanded studies need independently evidenced life/schedules, physical quantities, demolition processes and destinations; no default life or recycling credits. Reused starting foundations/equipment require prior burden and repair disclosure."
      source_ids:
        - ifc-construction-2007
    - rule_id: boundary_environment
      applies_to: "site_plant; civil"
      rule: "Direct releases require actual source/activity evidence after controls. Distinguish supplied water, freshwater resource, collected liquid waste and receptor discharge. Assess real land transformation/occupation, contaminated soil, dust, drainage and noise. Missing actual pollutants/land-use rows remain disclosed until identified and quantified. Unmeasured is not zero; waste transfer is not elementary release."
      source_ids:
        - ifc-construction-2007
boundary_abstraction:
  declared_starting_condition: "Surveyed greenfield/brownfield site with retained assets, clearance/remediation and supplier receipt gates declared"
  starting_condition_role: "Recorded construction start, not an implicit zero-burden land/equipment assumption"
  product_classification_scope: "Physical specialized manufacturing facilities and official exclusions under CPC3.0 53269 context"
  recursive_input_rule: "A retained/purchased same-category facility/module is an identified upstream asset with provider and burden history; do not recursively recreate or hide it in the new output"
  upstream_dataset_requirement: "Separately link compatible production/supply datasets for materials/equipment or declare unavailable interfaces/cut-offs; no default full upstream coverage"
  disclosure: "Site/route/system baseline; supplier/site-fabrication inclusion; actual logistics/tests; asset shares; environmental gaps; omitted upstream/operation/maintenance/demolition"
