allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all inventory rows"
    rule: "Prefer measured work-package subdivision by physical system. Shared utilities/haul use actual metering/load/activity and reconcile assigned totals to original totals. Cost, nominal capacity or floor area is not a default driver for different specialized systems. Unknown attribution stays review."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "steel_form_panel; crane_manufacture_share"
    rule: "Use a durable same-asset ledger across all projects, periods and reuses. Project manufacture share is dimensionless and supported by attributable actual service versus evidenced total service. Cumulative shares must be ≤1. Unknown total life/activity or previous assignments needs review, never a full manufacture reset per project. Fuel, actual maintenance and losses are separate and cannot duplicate hired-service content."
    source_ids: []
  - rule_id: allocation_trial
    applies_to: "acceptance"
    rule: "Separate acceptance test products from facility output. Subdivide by actual test activity/time and material balances where possible; residual coproduct allocation requires reviewed physical justification and collected quantities. Scrap export is waste unless documented product status/receiver function justifies otherwise. No automatic substitution credit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_transport
      process_id: "logistics"
      flow_role: "Transport legs"
      record_type: "shipment/route records"
      raw_fields: "Shipment; component; measured tonnes; km by leg; carrier/load; empty return; provider gate"
      collection_method: "Reconcile tickets, actual routes and carrier data; separate modes and included transport burdens"
      unit: "t*km"
      frequency: "each shipment"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_ground
      process_id: "ground"
      flow_role: "Ground and subbase"
      record_type: "survey and quantity records"
      raw_fields: "Starting condition/assets; site polygons; before/after levels; bank/loose volumes; aggregate grading/mass; soil contamination/receiver"
      collection_method: "Use actual survey, weighbridge and excavation logs; reconcile site reuse/export without default bulking or grading"
      unit: "m3; kg"
      frequency: "each activity/survey"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_civil
      process_id: "civil"
      flow_role: "Concrete, rebar and grout"
      record_type: "supply/batch/placement/inspection"
      raw_fields: "Mix/strength/exposure; wet concrete m3; dry ingredients kg; moisture; installed dimensions; rebar/grout kg; returns; curing/test water; acceptance"
      collection_method: "Reconcile original tickets, calibrated batch/readings and surveyed geometry. Retain project-specific foundation/form/anchor and quality records; historical USACE records do not prescribe present compliance or recipe"
      unit: "m3; kg"
      frequency: "each delivery/batch/placement"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_structure
      process_id: "structure"
      flow_role: "Site steel work"
      record_type: "material and fabrication/lift logs"
      raw_fields: "Grade; dimensions; received/installed kg; weld specification; electrode/gas kg; lifts/hours; scrap; coating/solvent identity and consumption"
      collection_method: "Reconcile certified material, actual fabrication sheets and weld/lift logs; separately add every actual coating, solvent and release exchange"
      unit: "kg"
      frequency: "each part and activity"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_install
      process_id: "chemical_utilities"
      flow_role: "Permanent equipment/piping"
      record_type: "supplier inclusion and installation"
      raw_fields: "Tag; type/alloy; pressure/temperature/duty; capacity/geometry; complete net kg; supplier weighing/BOM; inclusions; cable core/section/m; provider gate; joint/test record"
      collection_method: "Use real supplier weighing or calibrated complete-component weighing/BOM and signed installation records. Reconcile each tag against process, instrument and utility connections without counting embedded content twice"
      unit: "kg; m"
      frequency: "each delivered/installed tag"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_thermal
      process_id: "thermal"
      flow_role: "Furnace/lining construction"
      record_type: "zone-specific installation records"
      raw_fields: "Route; dimensions; lining zone; formulation/grade; supplied/installed/wasted kg; shell plate; embedded manufacture; masonry/ramming/dry-out instructions and measured energy/temperature history"
      collection_method: "Reconcile actual supplier drawings and zone installation records. Required cure/sinter/dry-out conditions come from the actual product supplier, not historical BREF operating temperatures. Trial charges and releases need separate records"
      unit: "kg"
      frequency: "each zone/installation/dry-out"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_utilities
      process_id: "site_plant"
      flow_role: "Site fuel/electricity"
      record_type: "meter and fuel ledger"
      raw_fields: "Asset/work-package/time; kg or litres/density; fuel grade/fossil share; kWh; region/user voltage/provider/mix; generator output; stock/returns; loss boundaries"
      collection_method: "Read calibrated/contractor meters; reconcile receipts/stock/returns and tag actual earthwork, concrete, lifting, cutting, drying and acceptance. Separate generator fuel from grid supply; prevent duplicate electricity"
      unit: "kg; MJ"
      frequency: "each meter interval/fuel issue"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_water
      process_id: "site_plant_civil_acceptance"
      flow_role: "Site water and drainage"
      record_type: "meters, quality and destinations"
      raw_fields: "Supplier/source/basin/country; treatment; m3 by use; recycling; retention/evaporation; dewatering; recipient medium; waste/direct route; salinity/solutes/solids if relevant"
      collection_method: "Meter actual external supply/discharge by state and recipient. Keep internal recirculation separate. Balance test/curing/waste pathways with evidence; direct discharge never implies clean or zero pollution. Other receivers require exact identities"
      unit: "m3"
      frequency: "each interval/test/discharge"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_waste
      process_id: "ground_civil_structure_thermal_acceptance"
      flow_role: "Separated residues"
      record_type: "consignment, weighing, analyses"
      raw_fields: "Single composition/state; contamination; kg/m3 and volume basis; receiver/recovery/treatment; returns/stock; sampling"
      collection_method: "Use separated real waste tickets; reconcile receipts, installed material, stock, returns and each residue without default losses. Add each actual packaging, refractory and machinery-maintenance waste individually"
      unit: "kg; m3"
      frequency: "each transfer"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_emissions
      process_id: "site_plant"
      flow_role: "External releases and acoustics"
      record_type: "measurement or reviewed source/activity model"
      raw_fields: "Tag/activity; species/CAS; fossil origin; immediate/long-term; medium/submedium; kg; exhaust volume/state; control; particle fraction; uncertainty; acoustic pressure-time/frequency/weighting/receiver"
      collection_method: "Measure actual external release or retain reviewed matching source model/factor with real activity. Preserve missing scope and uncertainty. Distinguish molecular NO/NO2 and non-overlapping particles; concentration is not inventory mass. Acoustic property/method stays review"
      unit: "kg; Pa2*s"
      frequency: "each source interval/test"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_assets
      process_id: "civil_site_plant"
      flow_role: "Reusable manufacture attribution"
      record_type: "durable all-project lifetime ledger"
      raw_fields: "Unique asset/configuration; measured net kg; project service/activity; evidenced total service/life; dimensionless share; all prior/future assignment records; maintenance/loss; uncertainty"
      collection_method: "Reconcile same-asset net mass and cumulative manufacture shares across projects/periods/reuse. Unknown total service or prior assignments is review; no per-project full manufacture. Operating activity and hired-service content remain separate"
      unit: "kg; dimensionless"
      frequency: "each assignment/reuse"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_acceptance
      process_id: "acceptance"
      flow_role: "Facility delivery and tests"
      record_type: "as-built register and signed acceptance"
      raw_fields: "One facility id/site; target products/route; system tags/inclusions; actual dimensions; real capacity/product/time basis; starting assets; dates; agreed cold/hot endpoint; test inputs/outputs/waste/releases; omitted scope"
      collection_method: "Reconcile as-built drawings, quantity survey and actual mechanical/electrical/process acceptance signatures. Record each test, rework and missed coverage. Certificates prove only their stated scope, not default operation life or approval"
      unit: "item"
      frequency: "each test/final handover"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_purge
      process_id: "acceptance"
      flow_role: "Actual nitrogen commissioning purge"
      record_type: "supplier mass ledger and purge records"
      raw_fields: "Test/tag/time; N2 purity; supply/reference pressure-temperature; provider reference-state compatibility; calibrated incoming/closing/returned/consumed gas m3; net nitrogen kg and full/empty cylinder tare if weighed; matching gas density kg/m3 with evidence; vent/residual fate"
      collection_method: "Reconcile actual calibrated supply, stock and returns to consumed nitrogen volume for the stated real acceptance test. Keep net kg/tare records when weighed; volume = net consumed kg / same-purity gas density in kg/m3 at the documented matching pressure-temperature. Direct volume readings must use the same documented gas reference state; no default density or standard-state assumption. Unknown state/density remains review. Facility output count stays in cp_acceptance; actual vendor/project instructions determine whether purge occurs"
      unit: "m3"
      frequency: "each nitrogen delivery/return/purge test"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
    - protocol_id: cp_gas_volume
      process_id: "structure"
      flow_role: "Actual oxygen supply for site cutting"
      record_type: "calibrated gas-volume/supply and cutting ledger"
      raw_fields: "O2 purity/CAS; supplier factory interface; actual pressure-temperature and compatible reference state; calibrated incoming/closing/return/consumed m3; weighed net kg/tare and evidenced same-state density kg/m3 if used; actual cutting work package"
      collection_method: "Reconcile actual consumed gas volume from supply, stock and returns at the documented matching pressure-temperature. Retain weighed kg if present; m3 = net kg / evidenced same-purity-state density kg/m3. Keep raw and converted records; unknown state/density or provider reference compatibility remains review. No nominal cylinder size, standard-density default, welding-gas mixture or liquid-oxygen substitution"
      unit: "m3"
      frequency: "each delivery/return and actual cutting operation"
      temporal_coverage: "Full actual construction and acceptance period"
      site_scope: "Declared site/project and traceable contractors"
      aggregation_rule: "per declared reference flow"
      quality_evidence: "Original records, calibration, reconciliation and uncertainty; missing evidence remains gap"
  calculation_rules:
    - id: project_reconciliation
      applies_to: "all inventory rows"
      rule: "Retain actual attributable totals in each row unit per declared reference flow. Reconcile receipts, stock, installed quantities, returns, residues and tests by physical identity. Missing values remain unknown; internal transfers are not new external inputs. No default recipe, loss, mass per facility or life."
      inputs:
        - "all collection protocols"
      output: "Actual totals per declared reference flow"
      source_ids: []
    - id: unit_preservation
      applies_to: "diesel; electricity_lv; electricity_mv; low_voltage_cable; road_freight"
      rule: "Convert only numerator units using same-state evidence and collected parameters; keep raw/final values. Output remains 1 item. Cable remains Length/m, electricity Net calorific value/MJ, transport actual tonne-kilometre legs, with no assumed capacity/area denominator."
      inputs:
        - cp_transport
        - cp_utilities
        - cp_install
      output: "Compatible row quantities per declared reference flow"
      source_ids: []
    - id: asset_attribution
      applies_to: "steel_form_panel; crane_manufacture_share"
      rule: "Multiply traceable same-asset net kg mass by evidenced dimensionless project manufacturing share. Retain total-service evidence and cumulative shares ≤1 across every project/period/reuse. Unknown denominator remains review; this is an input kg quantity, not facility reference mass."
      inputs:
        - cp_assets
      output: "Attributable asset kg per declared reference flow"
      source_ids: []
    - id: release_quantification
      applies_to: "fossil_co2; nitrogen_monoxide; nitrogen_dioxide; fine_particles; coarse_particles; unspecified_particles; freshwater_discharge; noise_air"
      rule: "Use actual release and receptor. Any factor/model requires reviewed matching activity, substance, state, control and uncertainty. Concentration conversion needs same-state sampled volume and explicit dimensional evidence. Reconcile overlapping particle fractions and water routes. Fuel/material existence alone is not an emission quantity."
      inputs:
        - cp_emissions
        - cp_water
        - cp_utilities
      output: "Evidenced individual releases"
      source_ids:
        - ifc-construction-2007
    - id: gas_volume_conversion
      applies_to: "oxygen; purge_nitrogen"
      rule: "V = net consumed gas kg / rho, where rho is evidenced kg/m3 for the same gas purity and actual documented reference pressure-temperature. Retain raw measured net kg, stock/returns/tare, rho evidence and final V m3, or direct calibrated V at that same state. No invented density or mandatory conversion: unavailable state/rho/provider compatibility remains review. Denominator stays the one accepted facility, not its mass."
      inputs:
        - cp_gas_volume
        - cp_purge
      output: "Actual gas m3 per declared reference flow"
      source_ids: []
  data_quality_requirements:
    - id: complete_entity
      applies_to: "dataset"
      requirement: "Require actual function, route, geometry, capacity basis, installed scope and handover state for one identifiable physical facility. A foundation, furnace shipment or ordinary building alone is not complete delivery."
      evidence: "cp_acceptance; un-cpc-manufacturing-2025"
    - id: route_closure
      applies_to: "chemical; thermal; utilities"
      requirement: "Cross-check all systems, specialist subcontracts and tests against drawings/logs. Starter rows do not prove a complete BOM; add actual missing specific equipment, materials, waste and releases. Record omissions; no full-coverage claim before reconciliation."
      evidence: "cp_install; cp_thermal; cp_acceptance"
    - id: measurement
      applies_to: "all inventory rows"
      requirement: "Cover full construction/acceptance with raw records, calibration, contractor attribution and uncertainty. Preserve numerator physical states and common denominator. Missing measurement/review is not zero; unsupported conversions remain review."
      evidence: "all collection protocols"
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Public main property/unit, composition/state, technical/geographic limits and supplier gates remain exact. Identity is not quantity, occurrence, provider completeness or scientific approval. Blank identities retain precise rows."
      evidence: "public original; supplier records; cp_install"
    - id: environment
      applies_to: "site_plant"
      requirement: "Document source, fossil/biogenic share, CAS/species, immediate/long-term, medium/submedium and particle fractions. Land/sound coverage explicit; workplace concentration, captured dust and technosphere liquid waste are not external releases."
      evidence: "cp_emissions; cp_water; cp_ground"
    - id: asset_conservation
      applies_to: "steel_form_panel; crane_manufacture_share"
      requirement: "Retain supported life/total activity and cumulative manufacture-share ledger across all projects/uses. Unknown denominator or previous assignment is a gap for review, not a per-project reset."
      evidence: "cp_assets"
validation_rules:
  - rule_id: validate_scope
    applies_to: "dataset"
    rule: "Verify specialized manufacturing function with official exclusions; reject service, ordinary building, mining/power, independent water/sewage treatment, waste-incineration or nuclear-material-processing output substitution."
    source_ids:
      - un-cpc-manufacturing-2025
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "Reference object, reference_facility output and all row/protocol denominators must agree with 1 item and actual acceptance scope. Require real geometry/capacity without fabricated mass, area or life conversion. Component kg, cable m and energy are numerators."
    source_ids: []
  - rule_id: validate_inventory
    applies_to: "dataset"
    rule: "Reconcile actual work packages, component inclusion, tests and contractors. Avoid ready-mix/site-batch and furnace/embedded-content overlap. Missing identity, quantity, stage or acceptance condition is explicit and prevents corresponding completeness claims."
    source_ids:
      - usace-concrete-1994
  - rule_id: validate_assets
    applies_to: "steel_form_panel; crane_manufacture_share"
    rule: "Check same-configuration net mass, supported service-share basis and cumulative share ≤1 across all projects/periods/reuses. Unknown life/activity/previous assignments needs review; hired-service and direct-operation burdens cannot overlap."
    source_ids: []
  - rule_id: validate_environment
    applies_to: "site_plant; civil"
    rule: "Require actual release and matching substance/media/property. NO differs from NO2/N2O; NOx-as-NO2 is not molecular NO2. No particle overlap; water resources/supply/discharge/waste differ. Acoustic identity and actual unmeasured land/pollutant scope remain review/disclosure."
    source_ids:
