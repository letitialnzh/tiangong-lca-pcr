review_metadata:
  scientific_review: pending
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  semantic_boundary_review:
    decision: Distinct specialized facility construction/installation and delivery
      need; classification alone does not create identity.
    official_scope: "CPC3.0 pp277,281–282: chemicals/pharmaceuticals, blast/coke,
      iron foundries and specialized manufacturing n.e.c., with
      ordinary-building/mining/power/treatment/waste/nuclear exclusions."
    reuse_checks:
      - Existing other-constructions-for-manufacturing is empty_scaffold and
        remains unchanged.
      - Integration industrial-and-agricultural-building-delivery explicitly
        excludes specialized manufacturing; construction record principles are
        reusable but its output is not.
      - Factory-gate industrial furnace equipment method excludes customer site
        installation; use only as separately bounded upstream guidance.
      - Read-only integration inventory and batch jobs examined;
        water-treatment/mining/power sibling scopes excluded.
  unresolved_flow_identities:
    - row_id: road_freight
      flow_name: Road freight transport for incoming equipment and materials
      reason: Public road-freight primary mass*distance property lacks an
        independently established matching public unit group here; no
        unsupported linkage.
    - row_id: soil_disposal
      flow_name: Non-contaminated excavated mineral soil sent for disposal
      reason: Excavated-soil product and contaminated-soil candidates do not identify
        clean disposal waste.
    - row_id: ready_mix
      flow_name: Fresh ready-mixed Portland-cement concrete before placing
      reason: Placed-concrete identity includes site casting; factory generic concrete
        has prefabricated classification and does not verify fresh supplied
        concrete.
    - row_id: washed_sand
      flow_name: Washed siliceous sand for concrete batching
      reason: Construction-sand direct candidate is a South Korean
        SVE/biopile-remediation Volume identity without grading or density; it
        does not establish delivered washed siliceous concrete sand. This is a
        route/state limitation, not rejection solely for Volume versus Mass.
    - row_id: anchor_grout
      flow_name: Cementitious non-shrink equipment-base grout
      reason: Concrete, curtain grouting and cement candidates are not finished
        non-shrink grout.
    - row_id: steel_form_panel
      flow_name: Reusable fabricated steel formwork panel
      reason: Raw steel and estimated area-based formwork service do not identify a
        fabricated panel/manufacture boundary.
    - row_id: concrete_rubble
      flow_name: Hardened Portland-cement concrete construction rubble
      reason: Mixed waste treatment and recovered aggregate do not identify this
        concrete waste.
    - row_id: washwater
      flow_name: Portland-cement concrete washwater sent for treatment
      reason: Other industrial wastewater/treatment routes do not establish concrete
        washwater.
    - row_id: anchor_bolt
      flow_name: Steel equipment-foundation anchor bolt
      reason: Public unspecified CN factory final-assembly fasteners are not a
        verified structural anchor bolt.
    - row_id: welding_electrode
      flow_name: Flux-coated carbon-steel welding electrode
      reason: Carbon steel/generic welding candidates do not verify a flux-coated
        electrode.
    - row_id: steel_offcut
      flow_name: Clean carbon-steel site-fabrication offcut sent for recycling
      reason: Factory-gate CN scrap and mixed metal scrap do not establish the
        construction-site waste interface.
    - row_id: storage_tank
      flow_name: Fabricated carbon-steel atmospheric chemical-storage tank
      reason: Steel food cans/GRP tanks do not verify this tank.
    - row_id: reactor
      flow_name: Fabricated stainless-steel stirred pressure reactor
      reason: Power-system reactors and general vessels do not identify this complete
        reactor.
    - row_id: distillation_column
      flow_name: Fabricated stainless-steel distillation column
      reason: No complete column identity established in vessel/plant candidates.
    - row_id: induction_furnace
      flow_name: Complete coreless induction melting furnace
      reason: Broad furnace/laboratory category does not verify a complete coreless
        furnace with an inclusion schedule.
    - row_id: silica_brick
      flow_name: Silica refractory brick for coke-oven masonry
      reason: Generic/high-alumina/building-brick candidates do not establish
        coke-oven silica brick.
    - row_id: carbon_block
      flow_name: Carbon refractory block for blast-furnace hearth
      reason: Direct candidates identify coal-gangue brick or another
        formulation/state, not hearth carbon block.
    - row_id: silica_ramming
      flow_name: Silica dry ramming mass for induction-furnace lining
      reason: No exact dry ramming formulation established in bounded candidates.
    - row_id: coke_oven_door
      flow_name: Fabricated steel coke-oven door assembly
      reason: Coke/gas results do not identify a fabricated door.
    - row_id: sand_moulding_machine
      flow_name: Complete sand-moulding machine
      reason: Broad mineral-processing machinery/unrelated moulding candidates do not
        establish complete foundry sand-moulding equipment.
    - row_id: baghouse
      flow_name: Complete fabric-filter baghouse
      reason: Direct candidates are carbon-anode electrostatic or different filtering
        equipment.
    - row_id: distribution_transformer
      flow_name: Complete oil-immersed distribution transformer
      reason: Candidates impose specific ratings/wind application; no exact complete
        installed configuration verified.
    - row_id: water_supply
      flow_name: Treated fresh water supplied to construction site
      reason: HK tap water requires actual HK and verified transport/supply links;
        Sheyang paper-line water is route-specific.
    - row_id: noise_air
      flow_name: Construction airborne sound exposure to outdoor air
      reason: Bounded noise searches returned unrelated products; exact acoustic
        property/unit and impact linkage unresolved.
    - row_id: reference_facility
      flow_name: Accepted specialized manufacturing facility
      reason: No exact accepted specialized-facility identity established in bounded
        queries. Cement-factory count identity has a different route/mixed
        construction-operation description; count compatibility alone is not
        applicability.
  unresolved_methodology:
    - issue_id: route_foreground_completion
      reason: Real route-specific functional-system closure, supplier
        installation/test instructions and all additional required atomic
        exchanges must be collected. Historical qualitative documents do not
        prescribe numerical design or prove all route coverage.
    - issue_id: asset_share_evidence
      reason: Reusable assets require supported total service/life and all-project
        cumulative assignments; unknown denominator remains review and no full
        manufacture reset.
    - issue_id: environment_coverage
      reason: Actual source-specific releases, land changes, noise
        property/unit/impact link and unmeasured scope require foreground
        review; no complete upstream/full-life claim.
