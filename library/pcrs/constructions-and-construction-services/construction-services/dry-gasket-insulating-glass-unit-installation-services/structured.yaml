allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "survey; glaze; accept"
    rule: "Use node, lot, unit, material and event records to separate independently measured activity before attributing shared quantities. The installed service is the sole intended final output; no routine glazing co-product is assumed."
    source_ids: []
  - rule_id: allocation_shared_complete
    applies_to: "electricity and contracted services"
    rule: "Identify the actual shared asset/service, meter or invoice, period and every consumer. For electricity choose exactly one accounting mode for each overlapping master-meter period: direct records with complete included-node coverage, or full-master shared attribution across the complete consumer set. A direct quantity and a share of the same full master quantity are mutually exclusive. Partial direct-plus-master/residual accounting is not declared by this method. For contracts use actual direct records or one documented causal driver with positive total weight across the complete consumer set. Reconcile allocated quantities to the once-recorded total, including consumers outside this lot."
    source_ids: []
  - rule_id: allocation_paid_idle
    applies_to: "survey_shared_service; glaze_shared_service; accept_shared_service"
    rule: "Retain the full paid availability boundary, including paid idle time. For availability services, use actual reserved-availability hours or other evidenced contract drivers rather than deleting idle hours or automatically substituting productive tool time. Actual paid hours and weights are collected by node and period."
    source_ids: []
  - rule_id: allocation_bundle_boundary
    applies_to: "all purchased services"
    rule: "Inspect whether energy, operator, transport or equipment provision is included in the service dataset and invoice. Charge the documented scope once; do not also enter its fully included burdens as independent consumption. Disclose any independently metered excluded component."
    source_ids: []
  - rule_id: allocation_unused_material
    applies_to: "unused_igu_return; unused_glazing_component_return; unused_cleanup_material_return"
    rule: "Preserve gross physical draw as the input and usable exit as a positive product output in the matching property/unit. Attribute only original unused-material upstream burden to an actual usable exit. Installation, receipt, handling, cleaning, access, idle and rework burdens remain assigned to the actual service lot. No avoided-production credit, negative exchange or second subtraction is permitted."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "accept_rework_return; glaze_rework_feed; rejected units"
    rule: "Preserve original component burden when intact units cross a rework handoff. Do not charge the same IGU manufacture again. Include every actual extra material draw, electricity use, inspection, access and correction activity until final acceptance. Discarded-unit and treatment burdens follow the actual producing node and declared treatment boundary."
    source_ids: []
  - rule_id: allocation_period_carry
    applies_to: "stock; WIP; accepted and terminated lots"
    rule: "Record the opening/closing period, unit/material state, carrying burden and responsibility for each pool. Charge a purchased material and each actual service event once. Carry unfinished work to the linked later lot instead of counting it as this period's accepted output. A later acceptance can carry earlier lot burdens once using the recorded linkage."
    source_ids: []
  - rule_id: allocation_accepted_denominator
    applies_to: "all normalized rows"
    rule: "Divide the attributable lot quantities by A only after separating outside-lot activity and documenting opening/closing WIP. Unique accepted area is the denominator; rejected, unused, held and repeated-pass area is excluded. No accepted area means no accepted-service dataset."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "waste and usable exits"
    rule: "Do not infer a recycled co-product or avoided virgin-production credit from a waste-dispatch label. Any recovery and treatment modelling requires actual destination, technology and a separately disclosed applicable upstream/downstream allocation method."
    source_ids: []
  - rule_id: allocation_rule_10
    applies_to: "foreground_burden_allocation"
    rule: "For material i at node n, physical gross draw G is opening intact unissued stock O plus receipts R minus closing intact unissued stock C. Its exclusive unused supplier return U and unused external transfer X are positive outputs. Net consumed G − U − X is a diagnostic and the basis for separating original unused-material burden; it is not another inventory input and is not a negative credit. Returned and transferred items are absent from C. Processed assemblies, offcuts, damaged units and WIP are not intact unissued stock. Reconcile the processing-state balance separately so that movement into WIP is never mistaken for a usable stock return. For mixed material or specification pools, maintain distinct balances and upstream factors before summation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_survey_interface
      process_id: "survey"
      flow_role: "received existing frame interface"
      record_type: "opening survey and release"
      raw_fields: "lot_id; period_id; event_ID; producing_node; opening_ID; actual_opening_width_m; actual_opening_height_m; interface_area_convention; site_id; frame_system; unit_outline_convention; actual_opening_dimensions; release_date; accepted_receiving_condition; compatibility_detail; defects; repair_exclusion_decision"
      collection_method: "Survey each physical opening and preserve its actual measured area convention and manufacturer-approved IGU interface. Link openings to unit IDs. Sum relevant surveyed opening area, retain unfinished/opening-state differences, and divide by A; do not add new-frame production burdens. Stable-key mapping: Map surveyed_opening_area to the sum of actual_opening_width_m * actual_opening_height_m for the declared interface convention. Retain the actual dimensions and mapped unit/opening IDs; this is an existing interface area, not purchased frame mass. Field definitions: site_id = site; lot_id = lot; opening_ID = opening ID; frame_system = frame system; unit_outline_convention = unit-outline convention; actual_opening_dimensions = actual opening dimensions; release_date = release date; accepted_receiving_condition = accepted receiving condition; compatibility_detail = compatibility detail; defects = defects; repair_exclusion_decision = repair-exclusion decision."
      unit: "m2"
      frequency: "each opening and changed release"
      temporal_coverage: "receiving release and any relevant opening period"
      site_scope: "actual site openings in the lot"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed frame release; measured dimensions; photographs; system details; unit/opening mapping"
    - protocol_id: cp_survey_igus
      process_id: "survey"
      flow_role: "IGU physical draw, forward handoff, usable exit and incoming discard"
      record_type: "stock ledger, unit register, transfer and waste record"
      raw_fields: "lot_id; period_id; event_ID; producing_node; unit_ID; rectangular_outline_confirmed; outline_evidence; actual_unit_width_m; actual_unit_height_m; forward_event_ID; corrective_event_ID; unit_state_event_IDs; opening_processed_WIP; processed_receipts; processed_exits; closing_processed_WIP; carrying_burden_link; material_pool_ID; actual_original_upstream_burden_per_matching_unit; original_gross_draw_material_burden; actual_usable_exit_quantity; survey_opening_unit_IDs; survey_receipt_unit_IDs; survey_closing_unit_IDs; survey_supplier_return_unit_IDs; survey_external_transfer_unit_IDs; measured_complete_or_collected_composite_mass_kg; documented_actual_complete_build_kg_per_m2; discarded_unit_ID; actual_net_discarded_mass_j; site_id; actual_build; complete_unit_mass_where_needed; mass_bridge_source; opening_intact_unissued_quantity; receipts; closing_intact_unissued_quantity; usable_return_ids; external_transfer_ids; quarantine_ids; wip_ids; custodian; event_timestamp"
      collection_method: "Measure unit face area from actual width and height once per unit. Calculate physical gross IGU draw as opening intact unissued area plus receipt area minus closing intact unissued area, without subtracting usable exits. Separately sum mutually exclusive usable supplier-return and external-transfer areas, actual forward-handoff event areas and incoming discarded-unit masses. Weigh composite discarded units or use actual same-build mass/area evidence. Match unit IDs across all states and divide each attributable quantity by A. Stable-key mapping: For every unit, actual_unit_area = actual_unit_width_m * actual_unit_height_m. survey_opening_intact_unissued_area, survey_igu_receipt_area and survey_closing_intact_unissued_area are sums over their named exclusive unit-ID sets. survey_unused_supplier_return_area and survey_unused_external_transfer_area are separate actual usable-exit set sums; survey_usable_exit_area is their sum. survey_forward_area sums distinct forward_event_ID unit areas. actual_discarded_unit_area sums discarded_unit_ID actual areas; survey_discarded_igu_kg is actual complete/composite weighed mass or actual_discarded_unit_area times the evidenced actual complete-build kg/m2. gross_igu_draw comes from igu_stock_draw. Stockburden aliases refer only to this actual Area/m2 pool and its original upstream dataset. No count/area-to-mass factor is inferred from a different IGU build. Field definitions: site_id = site; lot_id = lot; producing_node = node; period_id = period; unit_ID = unit ID; actual_build = actual build; actual_unit_width_m = width; actual_unit_height_m = height; complete_unit_mass_where_needed = complete-unit mass where needed; mass_bridge_source = mass-bridge source; opening_intact_unissued_quantity = opening intact unissued quantity; receipts = receipts; closing_intact_unissued_quantity = closing intact unissued quantity; usable_return_ids = usable return IDs; external_transfer_ids = external-transfer IDs; quarantine_ids = quarantine IDs; wip_ids = WIP IDs; forward_event_ID = forward transfer ID; discarded_unit_ID = discarded-unit ID; custodian = custodian; event_timestamp = timestamps."
      unit: "m2; kg"
      frequency: "each receipt, stock boundary, transfer or rejection event"
      temporal_coverage: "all receiving periods contributing to this lot and linked opening/closing WIP"
      site_scope: "survey custody at actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier labels and build certificate; stock count; dimensional record; scale/tare or exact-build bridge; transfer/waste receipt; exclusive state ledger"
    - protocol_id: cp_survey_packaging
      process_id: "survey"
      flow_role: "discarded transport packaging"
      record_type: "segregation and waste weighing"
      raw_fields: "lot_id; period_id; event_ID; producing_node; material_pool_ID; gross_packaging_kg; tare_packaging_kg; packaging_driver_by_consumer; packaging_complete_driver_total; actual_net_discarded_mass_j; unit_shipment; material; rack_owner; packaging_state; gross_and_tare_mass; reusable_return_quantity; waste_custodian; event_timestamp"
      collection_method: "Separate discarded actual packaging by material and state, weigh net waste and exclude returned racks or reusable packaging from waste. Attribute shared shipment packaging by an evidenced physical driver over all covered units, preserve owner and destinations, and divide each waste amount by A. Stable-key mapping: survey_discarded_packaging_kg is the sum of actual_net_discarded_mass_j for this survey lot. Exclude returned racks before summation; retain distinct material/state j and complete shipment attribution evidence rather than assuming a kg-per-IGU packaging factor. Field definitions: lot_id = lot; unit_shipment = unit shipment; material = material; rack_owner = rack owner; packaging_state = packaging state; gross_and_tare_mass = gross and tare mass; reusable_return_quantity = reusable return quantity; waste_custodian = waste custodian; event_ID = event ID; event_timestamp = date."
      unit: "kg"
      frequency: "each unpacking or waste dispatch"
      temporal_coverage: "all included receiving/unpacking events"
      site_scope: "survey unpacking area"
      aggregation_rule: "per reference flow"
      quality_evidence: "tare records; material segregation photographs; rack return receipt; waste dispatch receipt; shared-packaging allocation record"
    - protocol_id: cp_glaze_handoffs
      process_id: "glaze"
      flow_role: "forward and corrective unit receipts and retained-unit output"
      record_type: "paired transfer and unit-pass ledger"
      raw_fields: "lot_id; period_id; event_ID; producing_node; unit_ID; rectangular_outline_confirmed; outline_evidence; actual_unit_width_m; actual_unit_height_m; forward_event_ID; corrective_event_ID; unit_state_event_IDs; opening_processed_WIP; processed_receipts; processed_exits; closing_processed_WIP; carrying_burden_link; opening_ID; build; measured_unit_area; pass_id; retained_output_id; event_timestamp; accepted_rejected_wip_state; original_carrying_burden_link"
      collection_method: "Pair every survey receipt with its survey forward event. Pair actual intact corrective receipts with accept_rework_return using unit and event IDs and equal area. Record each actual retained-unit forward pass to accept separately; preserve correction pass history and opening/closing WIP. Sum each distinct event stream separately and divide by A; do not repurchase the same IGU in a reverse transfer. Stable-key mapping: actual_unit_area = actual_unit_width_m * actual_unit_height_m for the matched actual unit ID, with received measured-dimension evidence. glaze_forward_received_area sums distinct survey forward receipt events. glaze_rework_received_area sums distinct corrective_event_ID receipts from accept. glaze_retained_forward_area sums distinct retained forward event/pass areas. Match exact counterpart event, unit ID and area; processed-WIP aliases remain separate state/event records. Field definitions: lot_id = lot; opening_ID = opening ID; unit_ID = unit ID; build = build; measured_unit_area = measured unit area; event_ID = event ID; pass_id = pass ID; forward_event_ID = received survey-transfer ID; corrective_event_ID = received accept-rework ID; retained_output_id = retained-output ID; event_timestamp = dates; accepted_rejected_wip_state = accepted/rejected/WIP state; original_carrying_burden_link = original carrying-burden link."
      unit: "m2"
      frequency: "each custody or gate transfer and each correction pass"
      temporal_coverage: "all glazing and correction periods through final acceptance"
      site_scope: "glaze node and identified receiving/sending counterparts"
      aggregation_rule: "per reference flow"
      quality_evidence: "matched signed handoffs; measured unit register; pass history; state photographs; carrying-burden ledger"
    - protocol_id: cp_glaze_materials
      process_id: "glaze"
      flow_role: "new support blocks, gaskets, mechanical retention and usable material exits"
      record_type: "material stock and fitting records"
      raw_fields: "lot_id; period_id; event_ID; producing_node; material_pool_ID; weighed_net_kg; actual_length_m; documented_same_grade_kg_per_m; actual_count; documented_same_grade_kg_per_item; opening_intact_unissued_i_kg; receipt_i_kg; closing_intact_unissued_i_kg; unused_supplier_return_i_kg; unused_external_transfer_i_kg; actual_original_upstream_burden_per_matching_unit; original_gross_draw_material_burden; actual_usable_exit_quantity; actual_mass_method; actual_grade_and_profile; manufacturer_approval; new_existing_status; opening_intact_unissued_stock; receipts; closing_intact_unissued_stock; length_count_if_recorded; actual_linear_item_mass_bridge; usable_supplier_returns; usable_external_transfers; issued_rework_quantity; wip; exit_custodian"
      collection_method: "For each actual new material/specification, weigh stock/receipts or convert actual length/count with a documented same-grade bridge. Calculate gross draw as opening plus receipts minus closing intact unissued stock, including real usable boundary exits. Record unused return and external transfer as separate positive kg outputs, excluding both from closing stock. Keep processed rejects and WIP separate, retain each actual correction draw, and divide each stream by A. Existing retained beads/fasteners are documented as received components without new purchase. Stable-key mapping: Choose exactly one actual_mass_method for each material/event: weighed net kg, actual length times evidenced same-grade/profile kg/m, or actual count times evidenced same-grade/item kg/item. The resulting actual_material_kg populates the relevant stock/receipt/usable-exit key, indexed by actual i. gross_draw_i_kg comes from glaze_material_gross_draw; setting_blocks_gross_draw_kg, gaskets_gross_draw_kg and beads_fasteners_gross_draw_kg are sums over the respective actual component-role material pools. glaze_usable_exit_kg sums distinct same-unit usable exits by material after retaining identities and original upstream factors. The burden aliases remain this own-node material pool; existing reused components have no new material draw. Field definitions: lot_id = lot; producing_node = node; period_id = period; material_pool_ID = material ID; actual_grade_and_profile = actual grade and profile; manufacturer_approval = manufacturer approval; new_existing_status = new/existing status; opening_intact_unissued_stock = opening intact unissued stock; receipts = receipts; closing_intact_unissued_stock = closing intact unissued stock; length_count_if_recorded = length/count if recorded; actual_linear_item_mass_bridge = actual linear/item mass bridge; usable_supplier_returns = usable supplier returns; usable_external_transfers = usable external transfers; issued_rework_quantity = issued/rework quantity; wip = WIP; exit_custodian = exit custodian; event_ID = event ID."
      unit: "kg; actual length or count with bridge"
      frequency: "each receipt, issue, correction draw, usable exit and stock boundary"
      temporal_coverage: "all glaze periods and linked material opening/closing pools"
      site_scope: "glaze material custody at actual site"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier specification and compatibility approval; scale calibration or actual mass bridge; stock and issue logs; component installation record; exit receipt"
    - protocol_id: cp_glaze_waste
      process_id: "glaze"
      flow_role: "component offcuts and composite IGU breakage"
      record_type: "material-resolved waste and rejection log"
      raw_fields: "lot_id; period_id; event_ID; producing_node; unit_ID; rectangular_outline_confirmed; outline_evidence; actual_unit_width_m; actual_unit_height_m; forward_event_ID; corrective_event_ID; unit_state_event_IDs; opening_processed_WIP; processed_receipts; processed_exits; closing_processed_WIP; carrying_burden_link; material_pool_ID; weighed_net_kg; actual_length_m; actual_count; documented_same_grade_kg_per_m; documented_same_grade_kg_per_item; measured_complete_or_collected_composite_mass_kg; documented_actual_complete_build_kg_per_m2; actual_net_discarded_mass_j; actual_mass_method; actual_build_or_material_grade; rejected_state; event_pass_id; net_waste_mass; tare; exact_build_mass_bridge_if_used; collection_method; destination; custodian; event_timestamp"
      collection_method: "Segregate component offcuts from composite IGU waste and usable stock exits. Weigh each discarded material/state and complete or collected broken IGU mass, preserving actual unit identity and remaining composite contents. Link every event to glaze activity and waste destination, reconcile it with input/WIP states, and divide each waste stream by A. Stable-key mapping: actual_discarded_unit_area = sum actual_unit_width_m * actual_unit_height_m over the identified discarded unit events. Match unit/build to the complete composite-mass bridge when a bridge is needed; generic glass-only thickness/density is insufficient. glaze_discarded_igu_kg sums actual_discarded_igu_kg from complete_igu_mass_bridge for glaze events. glaze_component_waste_kg sums distinct non-IGU component masses from actual_material_mass_bridge. actual_net_discarded_mass_j preserves both streams separately, with producing_node = glaze. Field definitions: lot_id = lot; producing_node = node; material_pool_ID = unit/material ID; actual_build_or_material_grade = actual build or material grade; rejected_state = rejected state; event_pass_id = event/pass ID; net_waste_mass = net waste mass; tare = tare; exact_build_mass_bridge_if_used = exact-build mass bridge if used; collection_method = collection method; destination = destination; custodian = custodian; event_timestamp = date."
      unit: "kg"
      frequency: "each rejection or waste dispatch"
      temporal_coverage: "every glaze and correction event included in the lot"
      site_scope: "glaze waste production and first custodian handover"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing/tare and bridge evidence; breakage photographs; unit/pass ledger; waste transfer and treatment-boundary record"
    - protocol_id: cp_glaze_releases
      process_id: "glaze"
      flow_role: "actual conditional non-H2O component-fitting/trimming direct release"
      record_type: "actual release-occurrence, species and measurement or validated-factor record"
      raw_fields: "lot_id; period_id; event_ID; producing_node; actual_component_material_ID; species; physical_state_particle_fraction; receiving_medium; release_occurrence_evidence; release_method; measured_species_mass_kg; actual_activity; validated_applicable_species_factor; control_capture_boundary; release_uncertainty; excluded_captured_waste_event_IDs"
      collection_method: "Record actual fitting/trimming operation and component identity, independently evidence whether a direct release occurred, and identify exact species/material particle basis and environmental receiving compartment. Choose direct sampled species mass or a validated applicable activity factor with actual units/control boundary. Captured offcuts/dust remain waste in cp_glaze_waste and cannot also be directly released. Unknown occurrence/species/medium/amount is a disclosed gap, not zero. Aggregate unique real release events once, retain every actual correction and normalize by final accepted A. Stable-key mapping and field definitions: lot_id = actual installation lot; period_id = actual glazing/correction reporting period; event_ID = unique actual releasing operation event; producing_node = glaze, the actual event owner; actual_component_material_ID = actual new gasket/block/bead/retention-component material/grade involved; not IGU field cutting; species = actual emitted substance/material species with identity evidence; physical_state_particle_fraction = actual physical state or particle-size/material fraction, not an inferred generic dust identity; receiving_medium = actual environmental receiving compartment; release_occurrence_evidence = independent actual observation/measurement/validated operation evidence of occurrence or evidenced absence; release_method = one actual direct mass or applicable activity-factor method per physical event; measured_species_mass_kg = actual sampled/direct species mass in kg with sampling scope; actual_activity = actual fitting/trimming or correction activity in the independently validated factor unit; validated_applicable_species_factor = actual material/species/activity/control-specific independently validated factor with source/evidence ID and uncertainty; control_capture_boundary = actual control and capture boundary; captured offcuts/dust remain waste; release_uncertainty = actual measurement/factor and representativeness uncertainty; excluded_captured_waste_event_IDs = captured glaze-waste events excluded from direct emission to prevent overlap. actual_release_species_kg uses the one chosen method in substance_release_normalization; glaze_species_release_kg aliases its actual own-glaze species/particle/compartment result. Never add a directly measured mass to a factor estimate for the same event. Match excluded_captured_waste_event_IDs to cp_glaze_waste; no release is inferred from an offcut or stock residual."
      unit: "kg; actual activity and factor units retained"
      frequency: "each actual component-fitting/trimming or correction event with a possible release"
      temporal_coverage: "all relevant included glaze and correction periods through acceptance"
      site_scope: "actual glaze node and actual environmental receiving compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "actual material/operation and occurrence evidence; species/particle/medium identity; direct sampling or applicable independently validated factor; actual control boundary; captured-waste exclusion; uncertainty; unique-event ledger"
    - protocol_id: cp_accept_handoffs
      process_id: "accept"
      flow_role: "retained-unit receipt, actual corrective return and final accepted service"
      record_type: "transfer ledger, inspection and signed acceptance"
      raw_fields: "lot_id; period_id; event_ID; producing_node; unit_ID; rectangular_outline_confirmed; outline_evidence; actual_unit_width_m; actual_unit_height_m; forward_event_ID; corrective_event_ID; unit_state_event_IDs; opening_processed_WIP; processed_receipts; processed_exits; closing_processed_WIP; carrying_burden_link; accepted_unit_ID; acceptance_timestamp; acceptance_status; opening_ID; area_convention; forward_event_pass_id; inspection_result; support_retention_and_gasket_inspection; drainage_status; surface_edge_condition; clean_status; held_rejected_state; acceptance_signature; original_burden_link"
      collection_method: "Match actual retained-unit receipt to the glaze forward event. Measure unit area and record every actual inspection and intact corrective-return event; pair returned area with glaze_rework_feed. Determine A from unique finally accepted unit IDs only, after approved support, retention, drainage and clean/undamaged checks. Keep held, discarded and repeated-pass units outside A. Divide each transfer event stream by A, and report final service as 1 m2 from A/A. Stable-key mapping: actual_unit_area = actual_unit_width_m * actual_unit_height_m using the same actual factory-unit outline convention. accepted_unit_area aliases actual_unit_area for unique accepted_unit_ID records only; A is the output of accepted_unit_area. accept_forward_received_area sums distinct retained forward receipt events; accept_rework_sent_area sums distinct corrective_event_ID actual intact-return events. A is shared only as the final accepted-area denominator by other node protocols; their raw custody quantities are never replaced with A. Field definitions: lot_id = lot; opening_ID = opening ID; unit_ID = unit ID; actual_unit_width_m = actual width; actual_unit_height_m = height; area_convention = area convention; forward_event_pass_id = forward event/pass ID; inspection_result = inspection result; support_retention_and_gasket_inspection = support/retention and gasket inspection; drainage_status = drainage status; surface_edge_condition = surface/edge condition; clean_status = clean status; corrective_event_ID = corrective-return event; held_rejected_state = held/rejected state; acceptance_signature = acceptance signature; acceptance_timestamp = acceptance date; period_id = period; original_burden_link = original burden link."
      unit: "m2"
      frequency: "each handoff, inspection, correction and final acceptance"
      temporal_coverage: "all final-inspection and correction periods through first acceptance"
      site_scope: "accept node and customer acceptance gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "matched transfer ledger; measured unit register; project/manufacturer acceptance criteria; drainage and retention checklist; signed unique-unit acceptance"
    - protocol_id: cp_accept_water
      process_id: "accept"
      flow_role: "supplied cleaning water, collected wastewater and actual vapour"
      record_type: "water stock/meter, fate and evidence records"
      raw_fields: "lot_id; period_id; event_ID; producing_node; opening_intact_unused_i_kg; receipt_i_kg; closing_intact_unused_i_kg; unused_supplier_return_i_kg; unused_external_transfer_i_kg; water_volume_m3; evidenced_water_density_kg_per_m3; opening_processed_retained_water_kg; actual_collected_wastewater_mixture_kg; wastewater_water_content; closing_processed_retained_water_kg; other_separately_measured_collected_water_kg; independently_evidenced_cleaning_H2O_vapour_kg; vapour_species; vapour_receiving_medium; evaporation_evidence_ID; water_fraction_uncertainty; material_pool_ID; actual_original_upstream_burden_per_matching_unit; original_gross_draw_material_burden; actual_usable_exit_quantity; water_provider_grade; opening_intact_unused_water; water_receipts_or_metered_supply; closing_unused_water; usable_water_returns_and_transfers; cleaning_event; water_content_of_cleaning_formulations; wastewater_mixture_mass_and_water_fraction; water_in_spent_wipes; opening_closing_retained_surface_or_equipment_water; actual_h2o_vapour_measurement_or_validated_evaporation_evidence; rain_runoff_exclusion; fate_id; uncertainty"
      collection_method: "Weigh water or meter its actual volume with the recorded density/temperature bridge; calculate supplied-water gross draw as opening plus receipts minus closing unused stock, with usable exits separately retained. Determine water supplied in actual cleaning formulations without double entering mixture mass. Measure collected wastewater and water content, spent-wipe water and retained/closing water independently. Quantify actual H2O vapour only with measurement or validated operation-specific evidence; never assign residual water to air by default. Reconcile mutually exclusive water fates including unused exits and opening/closing processed water. Divide each actual inventory stream by A; keep an unclosed balance as a data-quality finding. Stable-key mapping: When volume records are used, receipt_i_kg = water_volume_m3 * evidenced_water_density_kg_per_m3; otherwise use actual net kg. cleanup_water_gross_draw_kg aliases cleanup_gross_draw_i_kg from cleanup_stock_draw for supplied water only. actual_unused_water_exit_kg is that water pool supplier return plus external transfer. actual_collected_wastewater_mixture_kg is the same physical mixture value used by cleanup_wastewater; accept_collected_wastewater_kg aliases it. collected_wastewater_water_kg = actual_collected_wastewater_mixture_kg * wastewater_water_content, with its actual measured mass fraction. spent_wipe_water_kg is imported by matched fate/event ID from cp_accept_waste constituent measurement, not reweighed as another exit. actual_water_in_consumed_cleaning_formulations_kg is the upstream output of cleaning_formulation_water using cp_accept_materials only. evidenced_water_vapour_kg and accept_evidenced_water_vapour_kg both alias independently_evidenced_cleaning_H2O_vapour_kg for H2O emission to air / unspecified. Retained and other-collected-water keys require independent pool evidence and cannot be balance residuals. Field definitions: lot_id = lot; period_id = period; water_provider_grade = water provider/grade; opening_intact_unused_water = opening intact unused water; water_receipts_or_metered_supply = water receipts or metered supply; closing_unused_water = closing unused water; usable_water_returns_and_transfers = usable water returns and transfers; cleaning_event = cleaning event; water_content_of_cleaning_formulations = water content of cleaning formulations; wastewater_mixture_mass_and_water_fraction = wastewater mixture mass and water fraction; water_in_spent_wipes = water in spent wipes; opening_closing_retained_surface_or_equipment_water = opening/closing retained surface or equipment water; actual_h2o_vapour_measurement_or_validated_evaporation_evidence = actual H2O-vapour measurement or validated evaporation evidence; rain_runoff_exclusion = rain/runoff exclusion; fate_id = fate ID; uncertainty = uncertainty."
      unit: "kg; original metered volume and bridge"
      frequency: "each cleaning event, collection, usable exit and stock boundary"
      temporal_coverage: "all cleaning/recleaning events and linked opening/closing water pools"
      site_scope: "accept cleaning area; actual water collection and air release"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter/scale record; density bridge if needed; formulation/SDS water content; wastewater weights; wet/dry wipe determination; retention evidence; evaporation method validation; uncertainty and closure ledger"
    - protocol_id: cp_accept_materials
      process_id: "accept"
      flow_role: "cleaning/protection supplies and usable cleanup-material exits including water"
      record_type: "material stock and exit ledger"
      raw_fields: "lot_id; period_id; event_ID; producing_node; material_pool_ID; weighed_net_kg; actual_length_m; documented_same_grade_kg_per_m; actual_count; documented_same_grade_kg_per_item; opening_intact_unissued_i_kg; receipt_i_kg; closing_intact_unissued_i_kg; unused_supplier_return_i_kg; unused_external_transfer_i_kg; actual_original_upstream_burden_per_matching_unit; original_gross_draw_material_burden; actual_usable_exit_quantity; opening_intact_unused_i_kg; closing_intact_unused_i_kg; evidenced_actual_water_fraction_i; cleaning_formulation_pool_ID; actual_mass_method; water_exit_event_ID; actual_material_provider; formulation_grade; coating_compatibility; opening_intact_unissued_stock; receipts; closing_intact_unissued_stock; reusable_equipment_status; original_length_count; actual_mass_bridge; unused_water_exit_ids; usable_supplier_returns; usable_external_transfers; destination; wip"
      collection_method: "For each actual cleaning/protection material, weigh or use an actual material-specific bridge and calculate gross draw as opening plus receipts minus closing intact unissued stock. Separately sum positive usable returns and external transfers by the corresponding input material in kg, including water exits linked to cp_accept_water; do not record those exits twice. Exclude returned/transferred quantities from closing stock, distinguish processed WIP and spent materials, preserve original unused-material burden only, and divide each attributable quantity by A. Stable-key mapping: Use actual_material_mass_bridge for the real material/event. cleanup_gross_draw_i_kg comes from cleanup_stock_draw, separately for every actual material/formulation. cleanup_supplies_gross_draw_kg sums only actual cleaning/protection material pools, excluding supplied water already on cleanup_water. For actual formulation i, consumed_formulation_i_kg = cleanup_gross_draw_i_kg - unused_supplier_return_i_kg - unused_external_transfer_i_kg; multiply this exclusive net consumed mixture by evidenced_actual_water_fraction_i, then sum only actual water-containing formulation pools to obtain actual_water_in_consumed_cleaning_formulations_kg. Never multiply formula gross draw containing unused exits by a water fraction. accept_usable_cleanup_exit_kg sums distinct usable supplied-water and material exits in kg; water events link to cp_accept_water once. Burden aliases refer only to original actual material pools, not service burdens. Field definitions: lot_id = lot; producing_node = node; period_id = period; actual_material_provider = actual material/provider; formulation_grade = formulation/grade; coating_compatibility = coating compatibility; opening_intact_unissued_stock = opening intact unissued stock; receipts = receipts; closing_intact_unissued_stock = closing intact unissued stock; reusable_equipment_status = reusable equipment status; original_length_count = original length/count; actual_mass_bridge = actual mass bridge; unused_water_exit_ids = unused water exit IDs; usable_supplier_returns = usable supplier returns; usable_external_transfers = usable external transfers; destination = destination; event_ID = event ID; wip = WIP."
      unit: "kg; original count or length with bridge"
      frequency: "each receipt, issue, cleaning correction, usable exit and stock boundary"
      temporal_coverage: "all included cleaning/protection periods"
      site_scope: "accept custody and first usable-exit custodian"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier/SDS and compatibility evidence; calibrated weighing/bridge; stock/issue ledger; water cross-reference; return/transfer receipt; unique event ownership"
    - protocol_id: cp_accept_waste
