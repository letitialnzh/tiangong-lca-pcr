      collection_method: "Inspect each actual provider contract and its scope. Collect paid availability including idle time in actual hours; convert a billed day only with the contract-specific time basis. For a shared availability period, enumerate all node/job/period consumers, collect actual reserved-availability or other justified contract drivers with positive complete denominator, and assign the once-recorded total proportionally. Reconcile every consumer share to the total and avoid duplicate bundled burdens. Sum only this node/lot shares over all real periods and divide by A. Stable-key mapping: actual_contract_hours comes from contract_hours_conversion using the actual recorded hours or actual billed days times documented contract-specific hours per day. For a direct own-node contract own_node_attributed_paid_hours aliases actual_contract_hours. For a shared contract it aliases node_service_hours from shared_service_attribution, with complete positive weight denominator and no additional whole-invoice or direct charge for the same quantity. survey_attributed_contract_hours sums actual own_node_attributed_paid_hours across included periods. Availability weights retain paid idle and actual reservation responsibility; they do not silently substitute productive tool time or invent a shift. Field definitions: lot_id = lot; producing_node = node; provider = provider; asset_service_identity = asset/service identity; contract_ID = contract ID; scope_and_bundled_energy_operator = scope and bundled energy/operator; actual_start_end = actual start/end; billed_unit = billed unit; actual_paid_hours_or_contract_specific_hours_per_day = actual paid hours or contract-specific hours-per-day; paid_idle_hours = paid idle hours; master_event_id = master event ID; all_consumer_periods = all consumer-periods; reserved_availability_or_causal_weights = reserved-availability or causal weights; complete_positive_weight_sum = complete positive weight sum; node_share = node share; correction_use = correction use."
