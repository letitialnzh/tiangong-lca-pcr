      record_type: "contract, invoice and availability attribution"
      raw_fields: "lot_id; period_id; event_ID; producing_node; provider_id; asset_service_ID; contract_ID; recorded_actual_paid_hours; billed_days; documented_contract_hours_per_day; actual_node_contract_weight; actual_contract_weights_of_all_consumers; paid_idle_hours; contract_accounting_mode; provider; asset_service_identity; scope_and_bundled_energy_operator; actual_start_end; billed_unit; actual_paid_hours_or_contract_specific_hours_per_day; master_event_id; all_consumer_periods; reserved_availability_or_causal_weights; complete_positive_weight_sum; node_share; correction_use"
      collection_method: "Inspect each actual provider contract and its scope. Collect paid availability including idle time in actual hours; convert a billed day only with the contract-specific time basis. For a shared availability period, enumerate all node/job/period consumers, collect actual reserved-availability or other justified contract drivers with positive complete denominator, and assign the once-recorded total proportionally. Reconcile every consumer share to the total and avoid duplicate bundled burdens. Sum only this node/lot shares over all real periods and divide by A. Stable-key mapping: actual_contract_hours comes from contract_hours_conversion using the actual recorded hours or actual billed days times documented contract-specific hours per day. For a direct own-node contract own_node_attributed_paid_hours aliases actual_contract_hours. For a shared contract it aliases node_service_hours from shared_service_attribution, with complete positive weight denominator and no additional whole-invoice or direct charge for the same quantity. accept_attributed_contract_hours sums actual own_node_attributed_paid_hours across included periods. Availability weights retain paid idle and actual reservation responsibility; they do not silently substitute productive tool time or invent a shift. Field definitions: lot_id = lot; producing_node = node; provider = provider; asset_service_identity = asset/service identity; contract_ID = contract ID; scope_and_bundled_energy_operator = scope and bundled energy/operator; actual_start_end = actual start/end; billed_unit = billed unit; actual_paid_hours_or_contract_specific_hours_per_day = actual paid hours or contract-specific hours-per-day; paid_idle_hours = paid idle hours; master_event_id = master event ID; all_consumer_periods = all consumer-periods; reserved_availability_or_causal_weights = reserved-availability or causal weights; complete_positive_weight_sum = complete positive weight sum; node_share = node share; correction_use = correction use."
      unit: "h; original billed unit"
      frequency: "each contract/invoice period and consumer-set change"
      temporal_coverage: "every paid accept service period including idle and correction"
      site_scope: "actual accept use plus complete shared contract consumer set"
      aggregation_rule: "per reference flow"
      quality_evidence: "provider contract/invoice; actual hours-per-day evidence if relevant; paid idle and reserved-availability logs; complete weights; bundle declaration; allocation closure"
  calculation_rules:
    - id: accepted_unit_area
      applies_to: "reference_service"
      rule: "accepted_unit_area = actual_unit_width_m * actual_unit_height_m; A = sum accepted_unit_area over unique finally accepted unit IDs; A must be positive"
      inputs:
        - actual_unit_width_m
        - actual_unit_height_m
        - accepted_unit_ID
        - cp_accept_handoffs
      output: "A"
      source_ids: []
    - id: survey_interface_area
      applies_to: "frame_interface"
      rule: "surveyed_opening_intensity = surveyed_opening_area / A; preserve the receiving-interface area convention and assign no new-frame production from this documentary input"
      inputs:
        - surveyed_opening_area
        - A
        - cp_survey_interface
      output: "surveyed_opening_intensity"
      source_ids: []
    - id: igu_stock_draw
      applies_to: "supplied_igus"
      rule: "gross_igu_draw = survey_opening_intact_unissued_area + survey_igu_receipt_area - survey_closing_intact_unissued_area; supplied_igu_intensity = gross_igu_draw / A"
      inputs:
        - survey_opening_intact_unissued_area
        - survey_igu_receipt_area
        - survey_closing_intact_unissued_area
        - A
        - cp_survey_igus
      output: "supplied_igu_intensity"
      source_ids: []
    - id: igu_usable_exit
      applies_to: "unused_igu_return"
      rule: "survey_usable_exit_area = survey_unused_supplier_return_area + survey_unused_external_transfer_area; usable_igu_exit_intensity = survey_usable_exit_area / A; both exit pools are mutually exclusive and absent from closing stock"
      inputs:
        - survey_unused_supplier_return_area
        - survey_unused_external_transfer_area
        - A
        - cp_survey_igus
      output: "usable_igu_exit_intensity"
      source_ids: []
    - id: igu_net_diagnostic
      applies_to: "supplied_igus; unused_igu_return"
      rule: "diagnostic_consumed_igu_area = gross_igu_draw - survey_unused_supplier_return_area - survey_unused_external_transfer_area; use only for physical reconciliation and original-material burden attribution, never as another input or a negative credit"
      inputs:
        - gross_igu_draw
        - survey_unused_supplier_return_area
        - survey_unused_external_transfer_area
        - cp_survey_igus
      output: "diagnostic_consumed_igu_area"
      source_ids: []
    - id: actual_material_mass_bridge
      applies_to: "setting_blocks; gaskets; beads_fasteners; cleanup_supplies; glazing_offcuts; cleanup_waste"
      rule: "actual_material_kg = weighed_net_kg or actual_length_m * documented_same_grade_kg_per_m or actual_count * documented_same_grade_kg_per_item; choose exactly the evidenced method for the actual material"
      inputs:
        - weighed_net_kg
        - actual_length_m
        - documented_same_grade_kg_per_m
        - actual_count
        - documented_same_grade_kg_per_item
        - cp_glaze_materials
        - cp_glaze_waste
        - cp_accept_materials
        - cp_accept_waste
      output: "actual_material_kg"
      source_ids: []
    - id: complete_igu_mass_bridge
      applies_to: "survey_rejected_igu_waste; broken_igus; accept_rejected_igu_waste"
      rule: "actual_discarded_igu_kg = measured_complete_or_collected_composite_mass_kg or actual_discarded_unit_area * documented_actual_complete_build_kg_per_m2; use actual build evidence and never omit seals/spacers by assuming pure glass"
      inputs:
        - measured_complete_or_collected_composite_mass_kg
        - actual_discarded_unit_area
        - documented_actual_complete_build_kg_per_m2
        - cp_survey_igus
        - cp_glaze_waste
        - cp_accept_waste
      output: "actual_discarded_igu_kg"
      source_ids: []
    - id: glaze_material_gross_draw
      applies_to: "setting_blocks; gaskets; beads_fasteners"
      rule: "for each material i, gross_draw_i_kg = opening_intact_unissued_i_kg + receipt_i_kg - closing_intact_unissued_i_kg; normalized_input_i = gross_draw_i_kg / A; gross draw includes usable exits and actual correction draws"
      inputs:
        - opening_intact_unissued_i_kg
        - receipt_i_kg
        - closing_intact_unissued_i_kg
        - A
        - cp_glaze_materials
      output: "normalized_input_i"
      source_ids: []
    - id: glaze_material_usable_exit
      applies_to: "unused_glazing_component_return"
      rule: "for each material i, usable_exit_i_kg = unused_supplier_return_i_kg + unused_external_transfer_i_kg; normalized_exit_i = usable_exit_i_kg / A; sum only after retaining distinct identities and factors"
      inputs:
        - unused_supplier_return_i_kg
        - unused_external_transfer_i_kg
        - A
        - cp_glaze_materials
      output: "normalized_exit_i"
      source_ids: []
    - id: glaze_material_net_diagnostic
      applies_to: "setting_blocks; gaskets; beads_fasteners; unused_glazing_component_return"
      rule: "diagnostic_consumed_i_kg = gross_draw_i_kg - unused_supplier_return_i_kg - unused_external_transfer_i_kg; this is diagnostic and original-material attribution only, not a further exchange or credit"
      inputs:
        - gross_draw_i_kg
        - unused_supplier_return_i_kg
        - unused_external_transfer_i_kg
        - cp_glaze_materials
      output: "diagnostic_consumed_i_kg"
      source_ids: []
    - id: cleanup_stock_draw
      applies_to: "cleanup_water; cleanup_supplies"
      rule: "for each actual water/material i, cleanup_gross_draw_i_kg = opening_intact_unused_i_kg + receipt_i_kg - closing_intact_unused_i_kg; normalized_cleanup_input_i = cleanup_gross_draw_i_kg / A; retain usable exits in gross draw"
      inputs:
        - opening_intact_unused_i_kg
        - receipt_i_kg
        - closing_intact_unused_i_kg
        - A
        - cp_accept_water
        - cp_accept_materials
      output: "normalized_cleanup_input_i"
      source_ids: []
    - id: cleanup_usable_exit
      applies_to: "unused_cleanup_material_return"
      rule: "for each actual water/material i, cleanup_usable_exit_i_kg = unused_supplier_return_i_kg + unused_external_transfer_i_kg; normalized_cleanup_exit_i = cleanup_usable_exit_i_kg / A; report each exclusive actual exit once in the matching input property/unit"
      inputs:
        - unused_supplier_return_i_kg
        - unused_external_transfer_i_kg
        - A
        - cp_accept_materials
        - cp_accept_water
      output: "normalized_cleanup_exit_i"
      source_ids: []
    - id: cleanup_net_diagnostic
      applies_to: "cleanup_water; cleanup_supplies; unused_cleanup_material_return"
      rule: "diagnostic_cleanup_consumed_i_kg = cleanup_gross_draw_i_kg - unused_supplier_return_i_kg - unused_external_transfer_i_kg; use for diagnostic balance/original-material attribution only, not another physical exchange or credit"
      inputs:
        - cleanup_gross_draw_i_kg
        - unused_supplier_return_i_kg
        - unused_external_transfer_i_kg
        - cp_accept_water
        - cp_accept_materials
      output: "diagnostic_cleanup_consumed_i_kg"
      source_ids: []
    - id: forward_transfer_areas
      applies_to: "accepted_igus; glaze_feed; retained_glazing; accept_feed"
      rule: "each_transfer_intensity = sum actual_unit_area over distinct actual events in that one forward stream / A; survey-to-glaze and glaze-to-accept counterpart quantities must match by event, period and unit ID"
      inputs:
        - actual_unit_area
        - forward_event_ID
        - unit_ID
        - A
        - cp_survey_igus
        - cp_glaze_handoffs
        - cp_accept_handoffs
      output: "each_transfer_intensity"
      source_ids: []
    - id: corrective_transfer_areas
      applies_to: "accept_rework_return; glaze_rework_feed"
      rule: "corrective_transfer_intensity = sum actual_unit_area over distinct actual intact-return events / A; sending and receiving amounts must match, with original material burden carried and additional activity measured separately"
      inputs:
        - actual_unit_area
        - corrective_event_ID
        - unit_ID
        - A
        - cp_accept_handoffs
        - cp_glaze_handoffs
      output: "corrective_transfer_intensity"
      source_ids: []
    - id: discarded_mass_normalization
      applies_to: "igu_packaging; survey_rejected_igu_waste; glazing_offcuts; broken_igus; cleanup_waste; accept_rejected_igu_waste"
      rule: "waste_intensity_j = sum actual net discarded mass of material/state j at its producing node / A; preserve distinct component and composite-unit streams and actual custodian"
      inputs:
        - actual_net_discarded_mass_j
        - producing_node
        - event_ID
        - A
        - cp_survey_packaging
        - cp_survey_igus
        - cp_glaze_waste
        - cp_accept_waste
      output: "waste_intensity_j"
      source_ids: []
    - id: cleaning_formulation_water
      applies_to: "cleanup_supplies; cleanup_waste; cleanup_wastewater; accept_water_vapour"
      rule: "for each actual water-containing formulation i, consumed_formulation_i_kg = cleanup_gross_draw_i_kg - unused_supplier_return_i_kg - unused_external_transfer_i_kg; actual_water_in_consumed_cleaning_formulations_kg = sum consumed_formulation_i_kg * evidenced_actual_water_fraction_i over actual cleaning_formulation_pool_IDs; exclude separately supplied water and dry materials, retain mixture gross physical inputs and positive usable exits, and never use gross formulation quantity containing unused exits as consumed water"
      inputs:
        - cleanup_gross_draw_i_kg
        - unused_supplier_return_i_kg
        - unused_external_transfer_i_kg
        - evidenced_actual_water_fraction_i
        - cleaning_formulation_pool_ID
        - cp_accept_materials
      output: "actual_water_in_consumed_cleaning_formulations_kg"
      source_ids: []
    - id: cleaning_water_pool
      applies_to: "cleanup_water; cleanup_supplies; cleanup_waste; cleanup_wastewater; accept_water_vapour"
      rule: "cleaning_water_available_kg = cleanup_water_gross_draw_kg - actual_unused_water_exit_kg + actual_water_in_consumed_cleaning_formulations_kg + opening_processed_retained_water_kg; evidenced_water_fates_kg = collected_wastewater_water_kg + spent_wipe_water_kg + other_separately_measured_collected_water_kg + closing_processed_retained_water_kg + evidenced_water_vapour_kg; water_gap_kg = cleaning_water_available_kg - evidenced_water_fates_kg; every fate is exclusive and the gap remains a finding, never automatic vapour"
      inputs:
        - cleanup_water_gross_draw_kg
        - actual_unused_water_exit_kg
        - actual_water_in_consumed_cleaning_formulations_kg
        - opening_processed_retained_water_kg
        - collected_wastewater_water_kg
        - spent_wipe_water_kg
        - other_separately_measured_collected_water_kg
        - closing_processed_retained_water_kg
        - evidenced_water_vapour_kg
        - cp_accept_water
        - cp_accept_materials
        - cp_accept_waste
      output: "water_gap_kg"
      source_ids: []
    - id: wastewater_normalization
      applies_to: "cleanup_wastewater"
      rule: "wastewater_intensity = actual_collected_wastewater_mixture_kg / A; water-fate accounting uses the independently evidenced water content and does not add mixture mass again as pure water"
      inputs:
        - actual_collected_wastewater_mixture_kg
        - wastewater_water_content
        - A
        - cp_accept_water
      output: "wastewater_intensity"
      source_ids: []
    - id: vapour_normalization
      applies_to: "accept_water_vapour"
      rule: "water_vapour_intensity = independently_evidenced_cleaning_H2O_vapour_kg / A; unresolved water balance is not an input to this emission calculation"
      inputs:
        - independently_evidenced_cleaning_H2O_vapour_kg
        - A
        - cp_accept_water
      output: "water_vapour_intensity"
      source_ids: []
    - id: energy_unit_conversion
      applies_to: "survey_electricity; glaze_electricity; accept_electricity"
      rule: "actual_kwh = actual_MJ / 3.6 only when original electricity is in MJ; already recorded kWh is preserved"
      inputs:
        - actual_MJ
        - original_energy_unit
        - cp_survey_power
        - cp_glaze_power
        - cp_accept_power
      output: "actual_kwh"
      source_ids: []
    - id: shared_power_attribution
      applies_to: "survey_electricity; glaze_electricity; accept_electricity"
      rule: "only in shared_full mode for each shared master period, node_kwh = shared_total_kwh * actual_node_weight / sum actual_weights_of_all_consumers; complete total weight must be positive; sum all consumer shares equals the full master total; no overlapping direct_node_kwh is added"
      inputs:
        - power_accounting_mode
        - shared_total_kwh
        - actual_node_weight
        - actual_weights_of_all_consumers
        - cp_survey_power
        - cp_glaze_power
        - cp_accept_power
      output: "node_kwh"
      source_ids: []
    - id: own_node_power_normalization
      applies_to: "survey_electricity; glaze_electricity; accept_electricity"
      rule: "own_node_period_kwh = direct_node_kwh only in direct_complete mode, or node_kwh only in shared_full mode; node_power_intensity = sum selected own_node_period_kwh across included periods / A; the two modes are exclusive per overlapping master quantity; incomplete direct coverage is a gap unless complete shared_full data replace it without adding partial direct records; exclude already bundled service energy"
      inputs:
        - power_accounting_mode
        - direct_node_kwh
        - node_kwh
        - A
        - cp_survey_power
        - cp_glaze_power
        - cp_accept_power
      output: "node_power_intensity"
      source_ids: []
    - id: contract_hours_conversion
      applies_to: "survey_shared_service; glaze_shared_service; accept_shared_service"
      rule: "actual_contract_hours = recorded_actual_paid_hours; when invoiced only in days, actual_contract_hours = billed_days * documented_contract_hours_per_day; include actual paid idle availability and do not assume a shift length"
      inputs:
        - recorded_actual_paid_hours
        - billed_days
        - documented_contract_hours_per_day
        - cp_survey_service
        - cp_glaze_service
        - cp_accept_service
      output: "actual_contract_hours"
      source_ids: []
    - id: shared_service_attribution
      applies_to: "survey_shared_service; glaze_shared_service; accept_shared_service"
      rule: "node_service_hours = actual_contract_hours * actual_node_contract_weight / sum actual_contract_weights_of_all_consumers; complete total weight is positive; retain full paid availability and reconcile all shares to the master period"
      inputs:
        - actual_contract_hours
        - actual_node_contract_weight
        - actual_contract_weights_of_all_consumers
        - cp_survey_service
        - cp_glaze_service
        - cp_accept_service
      output: "node_service_hours"
      source_ids: []
    - id: own_node_service_normalization
      applies_to: "survey_shared_service; glaze_shared_service; accept_shared_service"
      rule: "node_service_intensity = sum actual own-node attributed paid hours across included periods / A; never apply a whole shared invoice separately to each node"
      inputs:
        - own_node_attributed_paid_hours
        - A
        - cp_survey_service
        - cp_glaze_service
        - cp_accept_service
      output: "node_service_intensity"
      source_ids: []
    - id: substance_release_normalization
      applies_to: "glaze_other_releases; accept_other_releases"
      rule: "actual_release_species_kg = measured_species_mass_kg or actual_activity * validated_applicable_species_factor; species_release_intensity = actual_release_species_kg / A; use one evidenced method and actual receiving medium per own-node event/exchange; glaze_species_release_kg and accept_species_release_kg alias only their respective own-node actual event result, including actual corrections; captured waste and unknown residuals are not emissions"
      inputs:
        - measured_species_mass_kg
        - actual_activity
        - validated_applicable_species_factor
        - species
        - receiving_medium
        - A
        - cp_glaze_releases
        - cp_accept_releases
      output: "species_release_intensity"
      source_ids: []
    - id: original_material_burden_split
      applies_to: "supplied_igus; setting_blocks; gaskets; beads_fasteners; cleanup_water; cleanup_supplies; unused_igu_return; unused_glazing_component_return; unused_cleanup_material_return"
      rule: "for each compatible material/specification pool, unused_original_upstream_burden = actual_usable_exit_quantity * actual_original_upstream_burden_per_matching_unit; remaining_original_material_burden = original_gross_draw_material_burden - unused_original_upstream_burden; all installation/correction/service burdens remain in the lot and no second input reduction or negative credit is created"
      inputs:
        - actual_usable_exit_quantity
        - actual_original_upstream_burden_per_matching_unit
        - original_gross_draw_material_burden
        - material_pool_ID
        - cp_survey_igus
        - cp_glaze_materials
        - cp_accept_water
        - cp_accept_materials
      output: "remaining_original_material_burden"
      source_ids: []
    - id: processed_wip_carry
      applies_to: "accepted_igus; glaze_feed; retained_glazing; accept_feed; accept_rework_return; glaze_rework_feed; reference_service"
      rule: "reconcile opening processed WIP plus actual processed receipts against actual forward/usable/waste exits and closing processed WIP by unit/state/event; transfer original carrying burden once between linked periods and add only actual new service/material events"
      inputs:
        - opening_processed_WIP
        - processed_receipts
        - processed_exits
        - closing_processed_WIP
        - unit_state_event_IDs
        - carrying_burden_link
        - cp_survey_igus
        - cp_glaze_handoffs
        - cp_accept_handoffs
      output: "period_reconciliation_record"
      source_ids: []
  data_quality_requirements:
    - id: dq_route_identity
      applies_to: "qualifying lot"
      requirement: "Confirm the received-frame boundary and factory-IGU dry mechanical retention route before compiling quantities. Do not silently include frame repair, wet sealants or altered finished IGUs."
      evidence: "Signed scope, frame release and approved glazing-system details; ATS-192 sections on edge damage, dry glazing and material compatibility"
    - id: dq_actual_component
      applies_to: "component and upstream data"
      requirement: "Identify actual IGU build, coating/orientation, seal system, every material/grade/profile, new versus retained parts and manufacturer compatibility approval. Each concrete exchange needs its matching verified identity and upstream scope."
      evidence: "Supplier labels, drawings, material certificates, approval documents, actual bill of materials and identity readback"
    - id: dq_area_unique
      applies_to: "reference_service and all unit streams"
      requirement: "Preserve actual dimensions, one area convention, unique unit and pass IDs, positive unique accepted area and all rejection/WIP states. Reconcile alternative commercial area conventions with a unit-specific bridge."
      evidence: "Measurement register; signed acceptance; event ledger and area conversion record"
    - id: dq_mass_bridge
      applies_to: "kg material and rejected-unit rows"
      requirement: "Use calibrated net weighing or actual same-grade/item/build evidence. A complete IGU is a composite; generic pane density or a nominal product thickness is insufficient for its complete mass."
      evidence: "Calibration, tare, supplier linear/item mass or exact-build complete-unit mass evidence"
    - id: dq_stock_exclusive
      applies_to: "material inputs and usable exits"
      requirement: "Demonstrate physical gross draw and separately positive usable exits. Closing intact unissued stock, usable return, external transfer, waste and processed WIP cannot overlap. Net consumed is diagnostic only."
      evidence: "State- and event-resolved stock reconciliation with custody receipts and original-burden ledger"
    - id: dq_reject_ownership
      applies_to: "rejected and corrective streams"
      requirement: "Retain own-node origin, actual state and destination for every discarded or returned unit. Match intact correction counterparts and include all extra activity while avoiding another IGU manufacture charge."
      evidence: "Damage/inspection decision, unit/pass/event ledger, paired transfer or waste receipt"
    - id: dq_water_closure
      applies_to: "cleaning-water pool"
      requirement: "Separately evidence wastewater water, spent-wipe water, retained water, unused exits and actual vapour, including water in formulations. Unexplained differences beyond measurement uncertainty block water-completeness claims."
      evidence: "Water-content measurements, collection and retention evidence, validated evaporation evidence, pool balance and uncertainty"
    - id: dq_power_complete
      applies_to: "own-node electricity"
      requirement: "Provide actual provider/voltage/period and direct metering or positive complete shared weights. Resolve bundled-energy scope and reconcile all consumers once."
      evidence: "Meter records, complete weights/consumer table, invoice and service scope"
    - id: dq_service_complete
      applies_to: "own-node services"
      requirement: "Provide actual provider/asset/contract, paid availability and idle hours, complete shared weights and actual billed-unit conversion. Do not insert a default eight-hour day."
      evidence: "Contract and invoice; actual availability schedule; hours-per-day evidence where needed; complete allocation table"
    - id: dq_period_lineage
      applies_to: "all stock, events and final lot"
      requirement: "Cover every relevant period through first acceptance, link opening/closing WIP and actual correction/termination events, and prevent double attribution. Later replacements require a separate declared boundary."
      evidence: "Period inventory, WIP lineage and original-burden carry record; acceptance and termination dates"
    - id: dq_range_status
      applies_to: "all inventory cards"
      requirement: "Provisional screens are replaceable reasoned estimates, except the exact normalization identity. Retain actual values and uncertainty; use independent reviewed observations to replace screens rather than validating a batch with its own maximum."
      evidence: "Range evidence tier and rationale; independent sample provenance; investigation record for outliers"
    - id: dq_release_specificity
      applies_to: "direct elementary releases"
      requirement: "Identify actual substance/state or particle fraction and receiving medium before selecting a concrete exchange. Missing data does not establish absence and unknown residual mass is not a pollutant."
      evidence: "Chemical identity, sampling/validated factor evidence, actual operation and compartment records"
    - id: dq_completeness
      applies_to: "completed data package"
      requirement: "Disclose measurement uncertainty, temporal/site/specification representativeness, upstream mismatches, excluded operations, unclosed pools and unresolved identities. Do not call a package fully validated when checks are skipped or gaps remain."
      evidence: "Collection coverage ledger; quality review; checker performed/skipped report; unresolved-gap list"
validation_rules:
  - rule_id: validate_dry_scope
    applies_to: "product category and lot"
    rule: "Verify actual received frames, finished factory IGUs, preformed dry gaskets and mechanical retention. Reject a scope that silently performs frame repair, field IGU alteration, wet/structural silicone or fire glazing."
    source_ids:
      - pilkington-general-glazing-2013
  - rule_id: validate_project_details
    applies_to: "support, gasket, retention and drainage acceptance"
    rule: "Use the actual approved IGU/frame-system requirements and compatibility evidence. The monolithic-glass dimensions in ATS-192 must not become default IGU limits; no universal block, pressure or drainage values are inferred."
    source_ids:
      - pilkington-general-glazing-2013
  - rule_id: validate_reference_area
    applies_to: "reference_service"
    rule: "First verify rectangular_outline_confirmed and exact actual outline evidence for every included unit; nonrectangular or unknown outlines fail applicability. Require positive A from unique finally accepted actual unit outline areas. Confirm the reference_service name, Area/m2 and 1 m2 amount; exclude pane/face multiplication, visible-only convention without conversion, rejected/held units and repeat inspections."
    source_ids: []
  - rule_id: validate_forward_handoffs
    applies_to: "accepted_igus; glaze_feed; retained_glazing; accept_feed"
    rule: "Match counterpart event/unit IDs, area, state and period; reconcile actual mismatches with stocks/WIP, never by replacing actual intermediate feed with 1 m2."
    source_ids: []
  - rule_id: validate_corrective_handoffs
    applies_to: "accept_rework_return; glaze_rework_feed"
    rule: "Activate only for actual intact corrective returns. Match counterpart event/unit IDs and area; carry original material burden without new manufacture and retain each actual extra material/service event."
    source_ids: []
  - rule_id: validate_own_node_discards
    applies_to: "survey_rejected_igu_waste; broken_igus; accept_rejected_igu_waste"
    rule: "Verify actual origin node, unit/build, complete composite mass or exact-build bridge, rejected state and real waste custodian. No intact usable return or unresolved hold can be disguised as waste, and no late discard can be assigned to a prior node for convenience."
    source_ids: []
  - rule_id: validate_physical_draw
    applies_to: "material inputs and usable exit cards"
    rule: "Recalculate opening plus receipts minus closing intact unissued stock as physical gross draw, including actual usable boundary exits. Confirm positive same-property exits and exclusive states; any net diagnostic must not also reduce physical input or create a credit."
    source_ids: []
  - rule_id: validate_unused_burden
    applies_to: "usable outputs"
    rule: "Transfer only evidenced original unused-material burden. Do not transfer service, idle, inspection, correction or installation burdens, and do not claim avoided manufacture."
    source_ids: []
  - rule_id: validate_mass_conversions
    applies_to: "all kg material and rejected-unit flows"
    rule: "Confirm actual weighing/tare or same-grade/item/complete-build conversion. Retain IGU usable exits as Area/m2; a kg waste counterpart requires its independently supported complete-unit mass bridge."
    source_ids: []
  - rule_id: validate_water_pools
    applies_to: "cleanup_water; cleanup_supplies; cleanup_waste; cleanup_wastewater; accept_water_vapour"
    rule: "Reconcile actual available water and exclusive wastewater, wipe, retained, unused-exit and evidenced-vapour fates within quantified uncertainty. Do not infer vapour from residuals or duplicate wet-wipe water as wastewater. Report an unclosed pool as incomplete."
    source_ids: []
  - rule_id: validate_electricity
    applies_to: "each own-node electricity card"
    rule: "Require node-owned metering or positive complete shared attribution with all consumers and periods, correct MJ/kWh handling, actual supplier/voltage and no overlapping bundled-service burden."
    source_ids: []
  - rule_id: validate_paid_service
    applies_to: "each own-node shared-service card"
    rule: "Require actual provider/asset/scope, actual paid contract hours including idle, contract-specific billed-day conversion, positive complete consumer weights and total closure; an assumed eight-hour day is invalid."
    source_ids: []
  - rule_id: validate_periods
    applies_to: "all node and stock records"
    rule: "Verify receiving, glazing, acceptance and correction period linkage; exclusive opening/closing intact stock and processed WIP; one-time carrying-burden attribution; no accepted denominator for a terminated unaccepted lot."
    source_ids: []
  - rule_id: validate_emission_identity
    applies_to: "glaze_other_releases; accept_other_releases; accept_water_vapour"
    rule: "Require known actual species, physical state where relevant, receiving compartment and measured or validated quantity basis. Unknown occurrence, species, medium or quantity remain data gaps; an umbrella label, missing captured waste and a water or stock residual are insufficient evidence. Exclude captured offcuts/dust from direct release and require each non-H2O event to use its actual own-node protocol."
    source_ids: []
  - rule_id: validate_range_evidence
    applies_to: "inventory ranges"
    rule: "Keep every provisional screen labelled reasoned_estimate and separate from real quantities. Investigate outliers using external or independent foreground evidence. The 1..1 final range represents A/A normalization only and proves no physical yield."
    source_ids: []
  - rule_id: validate_publication_completeness
    applies_to: "final downstream dataset"
    rule: "Report accepted inputs, performed checks, skipped checks, findings and completeness. Resolve actual exchange and support identities, material balances and review blockers before claiming a complete concrete dataset; an automated structural pass does not prove external identity or physical correctness."
    source_ids: []
published_dataset_profile:
  dataset_role: "A foreground installation-service data package with node-resolved component, event, stock, WIP, service, correction and waste records; completed and verified projections may be used as secondary_dataset or background_dataset"
  downstream_use: "One dry-gasket IGU installation service per 1 m2 of accepted unit area at the stated received-frame and final-acceptance gates; may support downstream LCA process and lifecyclemodel datasets within the same declared boundary"
  allowed_use: "Matching actual IGU/frame-system dry installation with disclosed specifications, geography, period, upstream supply and service/access conditions; retain actual uncertainty and correction/waste treatment"
  excluded_use: "Whole-window manufacture; frame installation/repair; demolition/replacement including deglazing; wet or structural-silicone/fire glazing; field-altered IGUs; complete building-envelope performance; use-phase energy or lifetime benefit; unqualified transfer to a different area convention, component build or access system"
  required_metadata: "Site, geography and periods; lot and unique unit IDs; unit dimensions and area convention; received-frame gate; actual IGU build/orientation/coatings/seals; compatible blocks/gaskets/retention; actual new versus retained parts; final support/retention/drainage and clean/condition acceptance; supplier/technology/voltage; physical stock and usable exits; WIP and original-burden lineage; all correction events; shared asset/contract scope and full attribution; actual waste destinations; upstream dataset coverage; method and version"
  required_quality_disclosure: "Record and uncertainty coverage; independent mass bridges; exclusive water-fate closure and actual emission evidence; complete shared weights and paid idle treatment; unresolved identities or upstream mismatches; exclusions; provisional range status; checks performed/skipped and all remaining findings"
  update_trigger: "Changed IGU build, coating/seal or frame system; changed approved component or dry retention method; altered received or accepted gate; changed area convention; changed supplier/energy/service or access setup; new correction/rejection pattern; changed reporting/WIP boundary; new measured evidence replacing provisional screens; revised manufacturer requirements"
data_sources:
  - id: "pilkington-general-glazing-2013"
    type: "handbook"
    reference: "Pilkington North America, Technical Information ATS-192, General glazing guidelines, 2013-01-02, eight pages; https://www.pilkington.com/-/media/pilkington/site-content/usa/window-manufacturers/technical-bulletins/ats192generalglazingguidelines2013102.pdf; read 2026-10-12"
    used_for: "Finished-edge protection and no field cutting/seaming/grinding; dry-system support and edge blocking; compatible resilient materials; drainage and glass protection; product/system-specific acceptance responsibilities. Its annealed-monolithic-glass dimensional table is not a default IGU specification. It supplies no inventory consumption, loss, power or service-hour ranges here."
