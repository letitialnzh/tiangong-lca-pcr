      flow_role: "spent cleaning solids and late composite IGU discard"
      record_type: "segregated waste weighing and unit rejection record"
      raw_fields: "lot_id; period_id; event_ID; producing_node; unit_ID; rectangular_outline_confirmed; outline_evidence; actual_unit_width_m; actual_unit_height_m; forward_event_ID; corrective_event_ID; unit_state_event_IDs; opening_processed_WIP; processed_receipts; processed_exits; closing_processed_WIP; carrying_burden_link; material_pool_ID; weighed_net_kg; actual_length_m; actual_count; documented_same_grade_kg_per_m; documented_same_grade_kg_per_item; measured_complete_or_collected_composite_mass_kg; documented_actual_complete_build_kg_per_m2; actual_net_discarded_mass_j; spent_wipe_wet_mass_kg; measured_spent_wipe_water_fraction; wipe_water_evidence_ID; actual_mass_method; actual_igu_build; waste_state; event_pass_id; wet_mass; tare; measured_water_content; independently_weighed_composite_igu_mass_or_exact_build_bridge; rejected_state; destination; custodian; event_timestamp"
      collection_method: "Weigh separated spent cleaning material and residues, documenting water already included in wet mass; exclude separately collected wastewater. Separately weigh actual composite IGUs discarded at accept, preserving actual build and ID rather than converting area into glass-only mass. Keep intact corrective returns and held units out of waste. Link each waste stream to its producing event and custodian, reconcile water with cp_accept_water, and divide each amount by A. Stable-key mapping: actual_discarded_unit_area uses actual discarded-unit dimensions from its matched unit ledger, preserving actual complete build. accept_discarded_igu_kg sums actual own-accept composite discarded mass using complete_igu_mass_bridge; producing_node = accept. accept_collected_solid_waste_kg sums actual collected non-IGU residues/spent consumable net mixture masses. spent_wipe_water_kg = spent_wipe_wet_mass_kg * measured_spent_wipe_water_fraction from a water-specific validated determination; a generic wet-minus-dry result that includes other volatile components is not sufficient. Pass this same fate-ID water constituent to cp_accept_water without another physical inventory output. Field definitions: lot_id = lot; producing_node = node; material_pool_ID = material/unit ID; actual_igu_build = actual IGU build; waste_state = waste state; event_pass_id = event/pass ID; wet_mass = wet mass; tare = tare; measured_water_content = measured water content; independently_weighed_composite_igu_mass_or_exact_build_bridge = independently weighed composite IGU mass or exact-build bridge; rejected_state = rejected state; destination = destination; custodian = custodian; event_timestamp = date."
      unit: "kg"
      frequency: "each cleaning-waste or unit-discard event"
      temporal_coverage: "all inspection/cleaning/correction periods included in the lot"
      site_scope: "accept waste production and first custodian handover"
