    - protocol_id: cp_accept_releases
      process_id: "accept"
      flow_role: "actual substance and compartment specific direct releases other than separately accounted H2O vapour"
      record_type: "direct release measurement or validated activity-factor record"
      raw_fields: "lot_id; period_id; event_ID; producing_node; measured_species_mass_kg; actual_activity; validated_applicable_species_factor; species; receiving_medium; release_method; event; actual_cleaning_chemistry; substance_species; cas_where_available; physical_state_particle_fraction; receiving_compartment; measured_concentration_and_sampled_volume_or_activity_and_validated_factor; capture_efficiency_where_relevant; mass_unit; uncertainty; excluded_collected_waste_and_h2o_vapour_ids"
      collection_method: "Establish the actual substance and receiving compartment before quantification. Use a traceable direct measurement or an applicable validated activity-factor method with its actual activity and control boundary. Expand each independent species/medium exchange, exclude collected waste/wastewater and separately recorded H2O vapour, retain all factor evidence and uncertainty, and divide the actual attributable mass by A. A missing record remains a gap, not a zero or generic pollutant. Stable-key mapping: actual_release_species_kg comes from the one chosen method in substance_release_normalization; accept_species_release_kg aliases it per actual species/receiving-medium pair. The factor method uses actual_activity in its matching factor unit. Direct measured mass is not added to a factor estimate for the same event. No broad VOC/dust identity is synthesized. Field definitions: lot_id = lot; event = event; actual_cleaning_chemistry = actual cleaning chemistry; substance_species = substance/species; cas_where_available = CAS where available; physical_state_particle_fraction = physical state/particle fraction; receiving_compartment = receiving compartment; measured_concentration_and_sampled_volume_or_activity_and_validated_factor = measured concentration and sampled volume or activity and validated factor; capture_efficiency_where_relevant = capture efficiency where relevant; mass_unit = mass unit; uncertainty = uncertainty; excluded_collected_waste_and_h2o_vapour_ids = excluded collected waste and H2O-vapour IDs."
      unit: "kg; actual measurement basis"
      frequency: "each actual releasing operation or representative validated measurement period"
      temporal_coverage: "all relevant cleaning/recleaning operations in the lot"
      site_scope: "accept node and actual environmental receiving compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling report or validated factor source and applicability; chemical identity; capture boundary; measurement uncertainty; duplicate-release checks"
    - protocol_id: cp_survey_power
      process_id: "survey"
      flow_role: "survey electricity"
      record_type: "meter and complete shared-attribution record"
      raw_fields: "lot_id; period_id; event_ID; producing_node; supplier_id; meter_ID; master_period_ID; power_accounting_mode; direct_node_kwh; actual_MJ; original_energy_unit; shared_total_kwh; actual_node_weight; actual_weights_of_all_consumers; bundled_energy_scope; supplier; voltage; technology_mix; start_end_readings; direct_attributable_kwh; shared_total_event_id; complete_consumer_list; actual_causal_weight_per_consumer; total_weight; allocated_share; service_bundle_boundary"
      collection_method: "Read the own-node meter and subtract start from end for each actual period, with documented unit conversion. For a genuinely shared meter record the total once and use direct submetering first; otherwise collect positive complete causal weights for all consumers and calculate this node share as total times its weight divided by complete total weight. Reconcile all shares to the once-counted total, exclude energy already contained in charged service scope, sum this node and lot shares across periods, and divide by A. Stable-key mapping: Map original MJ to actual_kwh by energy_unit_conversion; actual recorded kWh is preserved. Select exactly one mode per master_period_ID across all overlapping nodes: direct_complete uses actual direct_node_kwh and adds no full-master allocation; shared_full uses node_kwh from shared_power_attribution over the complete consumer set and adds no overlapping direct quantity. Partial direct plus a full-master share is forbidden, and a partial-direct/residual method is not declared here. If direct coverage is incomplete, use a complete evidenced shared_full method without separately adding the partial meters, or retain a data gap. own_node_period_kwh aliases the selected direct_node_kwh or node_kwh only. survey_attributed_kwh sums selected own_node_period_kwh across actual included intervals after removing any already bundled energy. Complete shared weights have a positive sum and all shares reconcile to the once-counted master total. Field definitions: lot_id = lot; producing_node = node; period_id = period; supplier = supplier; voltage = voltage; technology_mix = technology/mix; meter_ID = meter ID; start_end_readings = start/end readings; original_energy_unit = original energy unit; direct_attributable_kwh = direct attributable kWh; shared_total_event_id = shared-total event ID; complete_consumer_list = complete consumer list; actual_causal_weight_per_consumer = actual causal weight per consumer; total_weight = total weight; allocated_share = allocated share; service_bundle_boundary = service bundle boundary."
      unit: "kWh; original MJ if used"
      frequency: "each meter period and changed shared-consumer set"
      temporal_coverage: "every included survey and correction period"
      site_scope: "actual survey activity plus full external consumer set for a shared total"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration/readings; supplier invoice; complete consumer weights and rationale; unit conversion; bundle-scope check; allocation closure"
