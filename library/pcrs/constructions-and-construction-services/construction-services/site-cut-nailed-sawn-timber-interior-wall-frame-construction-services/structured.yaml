      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Use cp_erect_acceptance to measure one elevation plane once, subtract clear openings, and retain every plate, stud, blocking and opening-member burden. Never count both wall faces or stud surface area. Positive net accepted area is required."
  - id: timber_state
    applies_to: "sawn_timber; prepared_members; prepared_feed; cut_rework_feed"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use traceable weighed mass at declared moisture/treatment state. Actual sections and lengths support reconciliation only; geometry requires actual species/state-specific density and moisture evidence before mass conversion. Report moisture-basis and density uncertainty; no generic timber density or oven-dry substitution."
  - id: services_basis
    applies_to: "cut_energy; erect_energy; cut_services; erect_services"
    required_property_ref:
      name: "Actual service property"
      uuid: ""
    required_unit: "Actual supplier or meter unit"
    rule: "Preserve actual energy and service units, coverage and asset IDs. Allocate real shared totals by metering or documented causal use and report uncertainty; no invented conversion from hours to energy."
