allocation_rules:
  - rule_id: retained_rework
    applies_to: "cut_members; erect_frame"
    rule: "Retain timber, fasteners, energy, services and waste from every rejected attempt and correction in the accepted lot. Do not add rejected area to the denominator. Pair erection-to-cutting rework and prepared-member return transfers; internal transfers carry existing burden without new procurement or a second final output."
    source_ids: []
  - rule_id: usable_custody
    applies_to: "both nodes"
    rule: "Use gross attributable material receipts/issues with actual custody-return outputs; never pre-net a return and model it again as an output. Retained closing stock is a balance, never an outbound product. Declare its carried-forward burden ownership separately from the accepted service; do not invent a stock credit. Usable offcuts, fasteners and packaging require owner and later-use/return evidence. Erection recutting transfers are a separately matched subset; supplier returns are not recut feed. Waste retains producing-node responsibility and actual destination."
    source_ids: []
  - rule_id: shared_services
    applies_to: "cut_services; erect_services; cut_energy; erect_energy"
    rule: "Identify each shared asset/provider and all consuming nodes, jobs and service periods. Prefer direct metering or activity evidence; otherwise document a causal allocation key with complete denominator, standby treatment and uncertainty. Attributed shares cannot exceed the event total. Provider coverage and direct quantities are mutually reconciled so tool manufacture, logistics, compressor energy and removal are not counted twice."
    source_ids: []
  - rule_id: no_automatic_credit
    applies_to: "both nodes"
    rule: "No automatic coproduct, waste recovery, avoided virgin timber or biogenic storage credit. A documented usable material exit requires explicit retained-burden treatment and separate later-use boundary; timber carbon/moisture facts require actual evidence."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_cut_material
      process_id: "cut_members"
      flow_role: "timber issue; prepared handoff; rework; usable returns/stock"
      record_type: "material and transfer ledger"
      raw_fields: "lot; elevation; member ID; cut-list revision; supplier; species; grade; treatment; section; length; moisture basis; weighed mass; opening/closing stock; return owner; transfer ID"
      collection_method: "Record gross actual supply/stock issues to the defined lot, without pre-netting custody returns. Weigh prepared members and real usable outbound transfers; closing stock is a retained balance with declared carried-forward burden, never an output exchange. Pair prepared handoffs to cp_erect_material and recutting returns separately; retain repeats. Reconcile gross issues, stock, transfers, waste and actual releases at declared state and uncertainty; divide attributable lot totals by cp_erect_acceptance net accepted area."
      unit: "kg"
      frequency: "Each issue/cut batch/transfer and closeout"
      temporal_coverage: "Full construction lot including corrections"
      site_scope: "Actual site cutting station and stock area"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale traceability; moisture method/state; cut-list dimensional checks; delivery receipts; paired transfers; closing stock custody; reconciliation gaps"
    - protocol_id: cp_cut_services
      process_id: "cut_members"
      flow_role: "energy; shared cutting tools/services"
      record_type: "meter and service-event ledger"
      raw_fields: "event ID; asset/provider; supply unit; meter start/end; use/standby period; consumers/jobs/nodes; allocation key; total activity; share; coverage; energy source"
      collection_method: "Meter cutting/extraction direct energy and record actual bounded provider quantities separately. Match complete shared consumer/period totals with cp_erect_services, allocate only attributable shares, reconcile included energy/tool/logistics/air coverage and divide by accepted net area. Preserve each actual provider unit."
      unit: "kWh; h; actual service units"
      frequency: "Each meter/service event and allocation close"
      temporal_coverage: "Full preparation and recutting period"
      site_scope: "Site cutting operation and actual shared providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter readings; complete sharing denominator; event IDs; actual provider scope; standby decision; allocation uncertainty"
    - protocol_id: cp_cut_waste
      process_id: "cut_members"
      flow_role: "offcuts; sawdust; packaging waste; actual air release"
      record_type: "segregated waste and emission record"
      raw_fields: "cut batch; waste material; timber treatment; mass; capture route; receiver; transfer ticket; emission substance/size; air compartment; activity/factor provenance; uncertainty"
      collection_method: "Weigh offcuts, collected sawdust and packaging separately after usable-stock classification. Identify actual contamination and destination. Characterize uncollected air releases through monitoring or compatible activity/factor evidence, excluding collected dust; disclose absent factors rather than zero. Divide attributable totals by accepted net area."
      unit: "kg"
      frequency: "Each segregation/dispatch and applicable monitored event"
      temporal_coverage: "Full preparation and correction period"
      site_scope: "Cutting and extraction boundary with actual receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighing/tickets; treatment state; collection efficiency evidence; pollutant definition; factor applicability; uncertainty and unresolved gaps"
    - protocol_id: cp_erect_material
      process_id: "erect_frame"
      flow_role: "prepared feed; nails/connectors; usable returns"
      record_type: "component and transfer ledger"
      raw_fields: "elevation; member/connector specification; received mass; transfer ID; cut-list revision; used/replaced quantity; unit mass evidence; return state/destination/owner; stock balance"
      collection_method: "Match prepared receipts to cp_cut_material without resupplying upstream burden. Record gross actual fastener receipts/issues without pre-netting returns. Separate actual recutting transfers, supplier/owner exits, retained closing-stock balance and waste; pair only recutting members to cut_rework_feed. Retained stock carries declared burden custody and has no output quantity. Count-to-mass requires actual product evidence. Divide attributable totals by accepted net area."
      unit: "kg"
      frequency: "Each receipt/fixing/correction/return and lot close"
      temporal_coverage: "Full erection including closed corrections"
      site_scope: "Actual elevation, interfaces and site stock"
      aggregation_rule: "per reference flow"
      quality_evidence: "Paired member IDs; fastening schedule; host compatibility; product mass evidence; supplier return receipts; closing stock and defect records"
    - protocol_id: cp_erect_services
      process_id: "erect_frame"
      flow_role: "direct energy; tools/access/logistics/air services"
      record_type: "meter and service-event ledger"
      raw_fields: "event ID; asset/provider; supply unit; meter start/end; use/standby period; all consumers; allocation key; total activity; share; coverage; actual power/air source"
      collection_method: "Measure actual drilling/nailer/charging/compressor use and bounded services. Pair shared event totals with cp_cut_services including other jobs/periods; reconcile direct versus provider energy/material/asset coverage. Retain correction and removal obligations and divide attributable totals by accepted net area. Preserve actual service units."
      unit: "kWh; h; actual service units"
      frequency: "Each service/meter event and allocation close"
      temporal_coverage: "Full erection/correction and attributed service period"
      site_scope: "Actual site and service providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter/service records; event/consumer reconciliation; complete denominator; provider boundary; retained/removal custody; uncertainty"
    - protocol_id: cp_erect_acceptance
      process_id: "erect_frame"
      flow_role: "accepted bare-frame service"
      record_type: "as-built geometry and acceptance record"
      raw_fields: "elevation ID; actual length/height; clear-opening dimensions; gross area; net accepted area; design revision; actual members/spacing; host approval; fixing inspection; alignment/stability; defects; signed date"
      collection_method: "Measure one wall elevation plane once using traceable dimensions. Deduct clear projected door/other openings while retaining all surrounding framing burdens. Inspect actual specified members/fixings, nonloadbearing/host compatibility and unlined-stage stability; close defects and sign before later trades. Use positive total net accepted area as the sole lot denominator."
      unit: "m2"
      frequency: "Each elevation and final signed correction closeout"
      temporal_coverage: "Initial construction through acceptance only"
      site_scope: "Actual accepted frame elevations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved framing elevation/local applicability; dimensional uncertainty; host acceptance; inspection photos/signature; closed defect list; opening reconciliation"
    - protocol_id: cp_erect_waste
      process_id: "erect_frame"
      flow_role: "discarded components/packaging; actual drilling release"
      record_type: "segregated waste and emission record"
      raw_fields: "elevation; event; actual host material; waste composition/treatment; mass; destination; ticket; particle/substance/size; air compartment; factor/monitoring; uncertainty"
      collection_method: "Separate usable returns from discarded timber/fasteners/packaging and captured host drilling debris; retain node and destination evidence. Determine actual uncollected particle release using applicable monitoring/factors with capture evidence; report absence as a gap. Exclude cutting-node waste and divide by accepted net area."
      unit: "kg"
      frequency: "Each correction/cleanup/dispatch and applicable emission event"
      temporal_coverage: "Full erection and closed corrections"
      site_scope: "Actual erection boundary and waste receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Material/treatment identification; weighed waste tickets; actual host/drilling activity; pollutant characterization; capture evidence; uncertainty"
  calculation_rules:
    - id: accepted_net_area
      applies_to: "accepted_frame"
      rule: "Sum accepted gross elevation areas once and subtract their clear projected opening areas; do not deduct the framing around those openings or count both faces."
      inputs:
        - "cp_erect_acceptance dimensions"
        - acceptance
        - openings
      output: "Positive net accepted area in m2"
      source_ids: []
    - id: lot_normalization
      applies_to: "all inventory rows"
      rule: "For each material, waste, emission and actual service unit, divide the attributable lot amount by the same positive net accepted area. Retain actual prepared-member and rework-transfer masses, independently of final output area."
      inputs:
        - "Node-specific protocol totals"
        - "cp_erect_acceptance net accepted area"
        - "allocation evidence"
      output: "Amount of each actual exchange per reference flow"
      source_ids: []
    - id: stock_reconciliation
      applies_to: "sawn_timber; cut_usable_returns; erect_usable_returns"
      rule: "Reconcile gross lot receipts/issues and initial stock with installed/prepared transfers, actual custody returns, retained closing-stock balance, waste and actual releases at consistent moisture state. Closing stock is not a product output; disclose its carried-forward burden ownership. Separate recutting transfers from supplier exits. Internal transfers cancel only in whole-lot physical totals; keep node records and never pre-net returns also modelled as outputs."
      inputs:
        - cp_cut_material
        - cp_erect_material
        - cp_cut_waste
        - cp_erect_waste
      output: "Traceable material reconciliation and disclosed difference"
      source_ids: []
  data_quality_requirements:
    - id: design_gate
      applies_to: "reference product"
      requirement: "Actual nonloadbearing design and accepted compatible host interface are required; illustrative PNNL sizes/spacing do not establish project acceptance."
      evidence: "Approved elevation and fixing specification; cp_erect_acceptance"
    - id: transfer_state
      applies_to: "both nodes"
      requirement: "Match measured cut-list handoffs and recutting loops by member, state, moisture and transfer ID. Do not fix an internal amount to the reference area."
      evidence: "cp_cut_material and cp_erect_material reconciliation"
    - id: range_collection
      applies_to: "all cards"
      requirement: "Collect actual comparable lot variability, measurement error and identity qualifiers before setting a QA range. No source here supports universal material, loss, fastening, energy or service ranges. Missing amounts/identities are explicit data gaps."
      evidence: "Node-specific records; per-card Range evidence needs"
    - id: material_conversion
      applies_to: "timber and fasteners"
      requirement: "Mass conversion requires actual dimensions/density/moisture or measured unit mass at compatible state; retain uncertainty and reject unexplained generic factors."
      evidence: "Weighing, moisture record and supplier specification"
    - id: shared_coverage
      applies_to: "all services"
      requirement: "Keep complete consumers and service periods, actual attribution evidence and provider/direct coverage reconciliation."
      evidence: "cp_cut_services; cp_erect_services"
    - id: release_identity
      applies_to: "waste and elementary outputs"
      requirement: "Distinguish offcuts, captured sawdust, returns/stock and actual substance/size-specific airborne release; missing characterization cannot mean zero."
      evidence: "cp_cut_waste; cp_erect_waste"
    - id: temporal_completeness
      applies_to: "all cards"
      requirement: "Use the full initial job with corrections and final acceptance. Record supplier geography/date, site period, gaps and representativeness; never mix a prototype/example bill with actual site data."
      evidence: "Lot ledger; source/version disclosure; signed closeout"
validation_rules:
  - rule_id: scope_acceptance
    applies_to: "reference product"
    rule: "Reject a data package with unknown loadbearing function, unaccepted host/design, missing specified members/fixings, unresolved frame-stage stability or open defects. Confirm signed unlined acceptance before later trades."
    source_ids:
      - pnnl-minimum-wall-studs
  - rule_id: area_consistency
    applies_to: "all inventory rows"
    rule: "Check one positive net accepted elevation area, explicit opening deductions, retained opening-member burdens and the same denominator on every quantity. Reject both-face counting and invented final-area internal timber quantities."
    source_ids: []
  - rule_id: handoff_rework
    applies_to: "both nodes"
    rule: "Match actual prepared-member and recutting transfers and moisture states, retain repeat burdens, and exclude rejected area from accepted output. Inspect unmatched quantities as gaps rather than silent losses."
    source_ids: []
  - rule_id: stock_waste_air
    applies_to: "both nodes"
    rule: "Verify distinct usable custody, stock, offcut, sawdust, packaging and actual air-release paths; use material-specific treatment and receiving medium. No duplicate subtraction, automatic recovery credit or missing-emission zero."
    source_ids: []
  - rule_id: sharing_check
    applies_to: "all services"
    rule: "Reconcile shared assets, every consumer/period, complete allocation denominator, standby and provider coverage against total events; no energy/service/material duplicate."
    source_ids: []
  - rule_id: identity_quantity
    applies_to: "all cards"
    rule: "Before a final exchange is produced, verify its concrete actual flow identity, property and unit, and supply actual collection evidence and any reviewed ranges. An umbrella card or automated candidate check does not establish quantity, UUID verification or publication readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground construction-service data package for the declared bare interior wall-frame route"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projection"
  allowed_use: "Comparable site-cut nonloadbearing interior timber frames with declared actual design/host/acceptance and consistent net elevation measurement"
  excluded_use: "Loadbearing/shear walls, whole buildings, factory panels, lined partition performance, old-wall removal, later maintenance or inferred carbon-storage/avoided-waste benefits"
  required_metadata: "Actual project/elevation/design and cut-list; member and fastening specification; host approval; supplier/delivery gates; moisture/treatment; site geography/date; opening/net-area rule; paired transfers; corrections and acceptance; shared-service coverage/custody"
  required_quality_disclosure: "Per-card quantities/identity evidence and gaps; density/moisture and area uncertainty; range evidence; complete waste/air/stock paths; allocation/standby/provider limits; temporal/technology representativeness"
  update_trigger: "Change to load path/design, material state, member layout/openings, host/fixings, cut-list or staging route, power/provider/air service, waste route, measurement method or acceptance requirements"
