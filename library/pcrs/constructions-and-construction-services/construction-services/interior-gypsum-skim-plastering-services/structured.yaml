system_boundary:
  rules:
    - rule_id: scope_gate
      applies_to: "substrate; finish"
      rule: "Verify selected plaster suitability for the actual background and include local preparation; major substrate correction remains an upstream prerequisite."
      source_ids:
        - british-gypsum-multifinish-installation
    - rule_id: reaction_gate
      applies_to: "mix; finish; dry_accept"
      rule: "Powder and water form paste in mix; gypsum setting within finish changes retained composition. Report actual product and water states at handoffs, unreacted surplus and residues; do not invent a stoichiometric yield, gas by-product or complete reaction."
      source_ids: []
    - rule_id: dryness_gate
      applies_to: "dry_accept"
      rule: "Trowelling/setting does not prove dry-to-decorate readiness. Continue actual relevant ventilation/heating and monitoring until the declared criterion is met; the manufacturer's staged application timings are product-specific and provide no universal drying endpoint."
      source_ids:
        - british-gypsum-multifinish-installation
    - rule_id: utility_owner
      applies_to: "prep; mix; finish; dry_accept"
      rule: "Identify shared lighting, access platforms and equipment, every consuming node and service period; attribute measured service demand once and disclose mobilization, rental/capital and upstream coverage. Keep the full work lot through actual multi-day drying: record unaccepted surface and water at any reporting cutoff and carry its existing burdens into the same final accepted lot without resetting, truncating or counting them twice."
      source_ids: []
    - rule_id: water_destination
      applies_to: "mix; finish; dry_accept"
      rule: "Keep supplied mixing/finishing/cleaning water, retained water, collected slurry/condensate and actual vapour or direct discharge distinct. No wastewater or dust category may be assumed an elementary emission without substance and receiving-medium evidence."
