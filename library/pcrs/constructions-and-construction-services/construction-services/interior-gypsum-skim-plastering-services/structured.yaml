allocation_rules:
  - rule_id: subdivision
    applies_to: "work_lots"
    rule: "Subdivide measured zones, batches and utility events before allocation; this route has no intended co-product. Unexpected saleable recovered outputs require their actual status and a separately justified burden decision."
    source_ids: []
  - rule_id: batch_owner
    applies_to: "mix; finish"
    rule: "Index all ingredients, paste transfers, cleaning and changeovers by batch and zone. Assign end-of-shift cleaning once using documented consumed batch mass or measured work time when direct metering is unavailable; preserve the denominator and uncertainty."
    source_ids: []
  - rule_id: shared_owner
    applies_to: "prep; mix; finish; dry_accept"
    rule: "Identify each shared asset, invoice/meter total and period; prefer direct metering, otherwise measured runtime/load or attributable service hours. Sum shares across all consumers to the measured total, including other trades, without duplicating rental/capital, lighting or mobilization."
    source_ids: []
  - rule_id: reject_owner
    applies_to: "mix; finish; dry_accept"
    rule: "Retain all failed-batch and rework burdens in the producing lot. Authorised return material keeps transfer ids and prior burden ownership; rework is additional actual activity, never negative avoided burden or accepted area."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_prep
      process_id: "prep"
      flow_role: "preparation input, interface, utility and residue"
      record_type: "zone records and meter/service logs"
      raw_fields: "lot_id; zone_id; substrate_acceptance; prep_material_mass; prep_metered_kwh; prep_shared_total_kwh; prep_shared_node_share; prep_direct_service_hours; prep_shared_service_hours; prep_service_share; prepared_area; prep_waste_mass; transfer_id; accepted_area"
      collection_method: "Survey net surface, weigh materials/residues, read attributable meters and equipment logs; link final area by zone and custody receipt. Sum attributable preparation raw or linked derived quantities after unique-event reconciliation, then divide by positive same-lot accepted_area."
      unit: "kg; kWh; h; m2"
      frequency: "Every zone and utility/service event"
      temporal_coverage: "Full work lot including rework and changeovers"
      site_scope: "Named project and preparation zone"
      aggregation_rule: "per reference flow"
      quality_evidence: "Survey/opening schedule; supplier identity; calibrated instruments; shared-share reconciliation"
    - protocol_id: cp_mix
      process_id: "mix"
      flow_role: "formulation ingredients, paste, utilities, rejects and emissions"
      record_type: "batch weighing and custody records"
      raw_fields: "lot_id; batch_id; zone_id; opening_powder_mass; received_powder_mass; closing_powder_mass; returned_powder_mass; external_transfer_powder_mass; mix_water_mass; mix_metered_kwh; mix_shared_total_kwh; mix_shared_node_share; mix_clean_water_mass; paste_transfer_mass; mix_reject_mass; mix_packaging_mass; mix_slurry_mass; mix_emission_mass; opening_paste_mass; closing_paste_mass; supplied_process_water; paste_transfer_water; collected_slurry_water; rejected_water_mass; emitted_water_mass; bound_water_change; free_water_change; water_balance_uncertainty; transfer_id; accepted_area"
      collection_method: "Weigh opening, received, closing, returned and externally transferred powder separately; returns and external transfers are disjoint exits, neither includes closing stock. Derive powder_net_mass by calc_powder_stock. Weigh delivered/returned stock, meter recipe/cleaning water, weigh wet paste and residues; obtain named-species air evidence if applicable; separate captured dust and wash slurry. Reconcile powder and process water against wet paste, separately recorded waste/emissions and stock changes; divide each attributable node numerator by positive same-lot accepted_area without deducting recorded waste twice."
      unit: "kg; kWh; m2"
      frequency: "Every batch, wash and transfer"
      temporal_coverage: "Whole lot, including off-spec batches and final wash"
      site_scope: "Actual mixing station feeding named zones"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/water-meter calibration; bag specifications; batch/zone links; waste custody; species/medium evidence"
    - protocol_id: cp_finish
      process_id: "finish"
      flow_role: "parent/paste feed, surface output, utilities and rejects"
      record_type: "zone application and correction records"
      raw_fields: "lot_id; batch_id; zone_id; finish_substrate_area; finish_paste_mass; finish_water_mass; trowel_water_mass; cleanup_water_mass; finish_metered_kwh; finish_shared_total_kwh; finish_shared_node_share; finish_direct_service_hours; finish_shared_service_hours; finish_service_share; trowelled_area; finish_waste_mass; finish_slurry_mass; thickness; transfer_id; reject_route; received_paste_water; received_finish_water; transferred_surface_water; residue_water; slurry_water; finish_evaporation_method; directly_measured_finish_vapour_mass; opening_finish_water_stock; closing_finish_water_stock; bound_water_change; free_water_change; water_balance_uncertainty; accepted_area"
      collection_method: "Survey zone feed/output; weigh received paste and collected residues; split trowelling/cleaning water; measure received/handed-off water states and direct vapour or full water-balance evidence with uncertainty; log setting observations and defects with return-to-finish links. Sum each unique physical event once while retaining all distinct repeated correction and rework events and their burdens; divide each attributable numerator by positive same-lot accepted_area."
      unit: "kg; kWh; h; m2; mm"
      frequency: "Each zone, paste batch and correction"
      temporal_coverage: "Application through set/trowelled handoff including corrections"
      site_scope: "Named work zone and application team"
      aggregation_rule: "per reference flow"
      quality_evidence: "Thickness/finish inspection; transfer reconciliation; calibrated measurements; rejected-zone register"
    - protocol_id: cp_dry_accept
      process_id: "dry_accept"
      flow_role: "surface feed, drying utilities, vapour, condensate and final service"
      record_type: "monitoring and final acceptance records"
      raw_fields: "lot_id; zone_id; dry_surface_area; dry_metered_kwh; dry_shared_total_kwh; dry_shared_node_share; dry_heat_mj; evaporation_method; directly_measured_vapour_mass; received_surface_water; added_drying_water; opening_water_stock; closing_water_stock; condensate_mass; collected_drying_slurry_water; other_evidenced_water_out; retained_bound_water; residual_free_water; water_balance_uncertainty; dry_start; dry_end; climate; dryness_criterion; dryness_observation; rejected_area; accepted_area"
      collection_method: "Survey accepted net area; retain actual dryness inspection evidence; meter fans/dehumidifiers/heat across real duration; record incoming surface water by paired moisture-state handoff, actual retained bound/free water and all collected or otherwise evidenced outlets. Calculate vapour by calc_evaporation or directly measure a defensible air-volume/humidity difference with calibrated instruments and uncertainty; a balance residual with missing fates is unquantified, not automatically vapour. Sum complete-lot attributable drying-node quantities across the actual monitoring duration and divide by positive same-lot accepted_area; final accepted service = accepted_area / accepted_area = 1 m2."
      unit: "m2; kg; kWh; MJ"
      frequency: "Each monitoring interval and final zone acceptance"
      temporal_coverage: "Actual set-surface receipt through decorative-readiness acceptance, spanning all needed days"
      site_scope: "Named zone and allocated shared heating/ventilation system"
      aggregation_rule: "per reference flow"
      quality_evidence: "Acceptance signatures and criterion; dated observations; climate log; utility attribution; water-balance uncertainty"
  calculation_rules:
    - id: calc_prep
      applies_to: "prep_materials; prep_electricity; prep_access; prepared_area; prep_waste"
      rule: "Each prep card numerator is its declared raw or linked derived cp_prep numerator after unique-event stock/share reconciliation, divided by positive same-lot accepted_area."
      inputs:
        - cp_prep
        - prep_material_mass
        - prep_kwh
        - prep_service_hours
        - prepared_area
        - prep_waste_mass
        - accepted_area
      output: "Per-reference prep exchange amounts"
      source_ids: []
    - id: calc_mix
      applies_to: "gypsum_powder; mix_water; mix_electricity; mix_clean_water; mixed_paste; mix_reject; mix_packaging; mix_slurry; mix_air"
      rule: "Each mix card numerator is its declared raw or linked derived cp_mix numerator, divided by positive same-lot accepted_area; wet paste balance retains measured losses and stock changes."
      inputs:
        - cp_mix
        - powder_net_mass
        - mix_water_mass
        - mix_kwh
        - mix_clean_water_mass
        - paste_transfer_mass
        - mix_reject_mass
        - mix_packaging_mass
        - mix_slurry_mass
        - mix_emission_mass
        - accepted_area
      output: "Per-reference mix exchange amounts"
      source_ids: []
    - id: calc_finish
      applies_to: "finish_vapour; finish_substrate; finish_paste; finish_water; finish_electricity; finish_access; trowelled_area; finish_waste; finish_slurry"
      rule: "Each finish card numerator sums its declared raw or linked derived cp_finish numerator across unique physical events, counting each event once and retaining every distinct correction or rework event and its burdens, divided by positive same-lot accepted_area; do not fix intermediate paste or surface feeds to reference output."
      inputs:
        - cp_finish
        - finish_substrate_area
        - finish_paste_mass
        - finish_water_mass
        - finish_kwh
        - finish_service_hours
        - trowelled_area
        - finish_waste_mass
        - finish_slurry_mass
        - finish_vapour_mass
        - accepted_area
      output: "Per-reference finish exchange amounts"
      source_ids: []
    - id: calc_dry_accept
      applies_to: "dry_surface; dry_electricity; dry_heat; accepted_skim; evaporated_water; dry_condensate"
      rule: "Each dry_accept numerator is its declared raw or linked derived cp_dry_accept numerator divided by positive accepted_area; accepted service = accepted_area / accepted_area = 1 m2. Quantify vapour only after measured collected liquid, chemically bound water, residual moisture and other evidenced fates are reconciled."
      inputs:
        - cp_dry_accept
        - dry_surface_area
        - dry_kwh
        - dry_heat_mj
        - evaporated_water_mass
        - condensate_mass
        - retained_bound_water
        - residual_free_water
        - accepted_area
      output: "Per-reference drying amounts and normalized accepted service"
      source_ids: []
    - id: calc_powder_stock
      applies_to: "gypsum_powder"
      rule: "powder_net_mass = opening_powder_mass + received_powder_mass - closing_powder_mass - returned_powder_mass - external_transfer_powder_mass. Returns and external transfers are mutually exclusive measured boundary exits and exclude closing stock; consumed powder includes batch losses, which are recorded as outputs and never subtracted twice."
      inputs:
        - cp_mix
        - opening_powder_mass
        - received_powder_mass
        - closing_powder_mass
        - returned_powder_mass
        - external_transfer_powder_mass
      output: "powder_net_mass"
      source_ids: []
    - id: calc_node_energy
      applies_to: "prep_electricity; mix_electricity; finish_electricity; dry_electricity"
      rule: "prep_kwh = prep_metered_kwh + prep_shared_total_kwh * prep_shared_node_share; mix_kwh = mix_metered_kwh + mix_shared_total_kwh * mix_shared_node_share; finish_kwh = finish_metered_kwh + finish_shared_total_kwh * finish_shared_node_share; dry_kwh = dry_metered_kwh + dry_shared_total_kwh * dry_shared_node_share. Shared totals exclude directly metered demand; shares derive from recorded runtime/load and reconcile across all consumers. Each result is normalized by its node rule."
      inputs:
        - cp_prep
        - cp_mix
        - cp_finish
        - cp_dry_accept
        - prep_metered_kwh
        - prep_shared_total_kwh
        - prep_shared_node_share
        - mix_metered_kwh
        - mix_shared_total_kwh
        - mix_shared_node_share
        - finish_metered_kwh
        - finish_shared_total_kwh
        - finish_shared_node_share
        - dry_metered_kwh
        - dry_shared_total_kwh
        - dry_shared_node_share
      output: "Attributable node electricity numerators"
      source_ids: []
    - id: calc_node_service
      applies_to: "prep_access; finish_access"
      rule: "prep_service_hours = prep_direct_service_hours + prep_shared_service_hours * prep_service_share; finish_service_hours = finish_direct_service_hours + finish_shared_service_hours * finish_service_share. Shared service pools exclude direct service and reconcile to invoice/log periods across all consumers; normalize each result by its node rule."
      inputs:
        - cp_prep
        - cp_finish
        - prep_direct_service_hours
        - prep_shared_service_hours
        - prep_service_share
        - finish_direct_service_hours
        - finish_shared_service_hours
        - finish_service_share
      output: "Attributable access/service numerators"
      source_ids: []
    - id: calc_evaporation
      applies_to: "evaporated_water"
      rule: "For declared balance method: evaporated_water_mass = received_surface_water + added_drying_water + opening_water_stock - closing_water_stock - retained_bound_water - residual_free_water - condensate_mass - collected_drying_slurry_water - other_evidenced_water_out. All terms use mutually exclusive same-period water ownership: closing_water_stock covers only other unaccepted end-period water stock and excludes accepted-surface retained_bound_water/residual_free_water; opening_water_stock excludes received_surface_water counted at the period entry. No retained surface water is counted again in other outlets. Water is the same measured process-water pool at all terms; exclude inherited dry-powder crystal water consistently, retain paired batch/zone moisture handoffs, and keep pre-drying losses at their producing nodes. For direct method: evaporated_water_mass = directly_measured_vapour_mass, with calibrated ventilation flow/humidity evidence. Declare method and water_balance_uncertainty; missing fates or negative unexplained balance require investigation, never clamping to zero."
      inputs:
        - cp_dry_accept
        - cp_mix
        - cp_finish
        - evaporation_method
        - directly_measured_vapour_mass
        - received_surface_water
        - added_drying_water
        - opening_water_stock
        - closing_water_stock
        - retained_bound_water
        - residual_free_water
        - condensate_mass
        - collected_drying_slurry_water
        - other_evidenced_water_out
        - water_balance_uncertainty
      output: "evaporated_water_mass before calc_dry_accept normalization"
      source_ids: []
    - id: calc_finish_evaporation
      applies_to: "finish_vapour"
      rule: "Balance method: finish_vapour_mass = received_paste_water + received_finish_water + opening_finish_water_stock - transferred_surface_water - residue_water - slurry_water - closing_finish_water_stock. All terms are the same process-water pool and exclude inherited dry-powder crystal water; surface handoff includes bound and free water and is paired with dry_accept received_surface_water. The dry node receives only actual transferred_surface_water remaining after finish-stage vapour, slurry and residue removal, never original paste-plus-water dosing; dry_accept cannot count those prior losses again. Opening stock excludes received inputs; closing stock excludes transferred surface and other recorded outlets. Direct method: finish_vapour_mass = directly_measured_finish_vapour_mass using calibrated ventilation-flow/humidity observations. Record finish_evaporation_method and water_balance_uncertainty; missing fates or unexplained negative residuals remain data gaps."
      inputs:
        - cp_finish
        - finish_evaporation_method
        - directly_measured_finish_vapour_mass
        - received_paste_water
        - received_finish_water
        - opening_finish_water_stock
        - transferred_surface_water
        - residue_water
        - slurry_water
        - closing_finish_water_stock
        - water_balance_uncertainty
      output: "finish_vapour_mass before calc_finish normalization"
      source_ids: []
  data_quality_requirements:
    - id: dq_gate
      applies_to: "accepted_skim"
      requirement: "Actual system, thickness, substrate and finish-quality observations plus declared dryness criterion are mandatory; no fixed manufacturer timing proves dryness."
      evidence: "Supplier system sheet; signed zone acceptance and moisture/visual criterion"
    - id: dq_balance
      applies_to: "all nodes"
      requirement: "Reconcile batches, transfers, stock and water destinations with measurement uncertainty; never back-calculate unmeasured internal quantities merely to close a balance."
      evidence: "Node records, paired transfer ids and documented residuals"
    - id: dq_identity
      applies_to: "all cards"
      requirement: "Concrete downstream exchanges require verified product/substance, property/unit and destination identities; expand conditional umbrellas using actual foreground records."
      evidence: "Supplier/waste/emission records and identity verification"
    - id: dq_period
      applies_to: "all nodes"
      requirement: "Represent the actual site work lot, weather and duration; document missing readings, estimation and temporal/geographic coverage."
      evidence: "Full-period event log and coverage statement"
    - id: dq_ranges
      applies_to: "all cards"
      requirement: "Provisional ranges are investigation screens only; investigate values outside them and replace with independently reviewed comparable evidence before stronger reuse."
      evidence: "Raw data, explicit uncertainty and independent comparator set"
validation_rules:
  - rule_id: validate_reference
    applies_to: "accepted_skim"
    rule: "Require positive accepted net area with openings/reveals policy, declared actual system/thickness and final dryness evidence; exclude all unresolved rejects."
    source_ids: []
  - rule_id: validate_transfers
    applies_to: "prep; mix; finish; dry_accept"
    rule: "Match paired interface, paste and set-surface transfer ids and measured quantities; explain handling losses and state changes without forcing equality to final accepted area."
    source_ids: []
  - rule_id: validate_batch
    applies_to: "mix; finish"
    rule: "Require batch/zone links, off-spec paths, wash/changeover ownership and complete attribution; no batch cleaning or failed material may disappear."
    source_ids: []
  - rule_id: validate_shared
    applies_to: "all nodes"
    rule: "Reconcile shared utilities/equipment/mobilization across every consumer and relevant period; identify one owner for every burden and prevent duplicated upstream equipment service."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "finish; dry_accept"
    rule: "Require rejected-zone records and actual correction/discard paths linked to producing node; retain rework burdens while accepted area counts each accepted face once."
    source_ids: []
  - rule_id: validate_water
    applies_to: "mix; finish; dry_accept"
    rule: "Reconcile powder/water/paste and water retention, slurry, condensate and vapour with uncertainty; captured solids/liquid are waste, not invented direct emissions."
    source_ids: []
  - rule_id: validate_binding
    applies_to: "all cards"
    rule: "Verify concrete downstream UUID/support and actual qualifiers; ambiguous preparation, service, waste or pollutant umbrellas require foreground disaggregation and cannot inherit a generic UUID."
    source_ids: []
  - rule_id: validate_range
    applies_to: "all cards"
    rule: "Treat provisional reasoned screens as prompts for investigation, not universal acceptable limits, measured values or substitute inventory."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground construction-service data package with process and lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared interior gypsum skim service with equivalent starting surface, finish system, thickness, acceptance gate and site conditions"
  excluded_use: "Manufacturing gypsum powder; whole wall construction; exterior/cement rendering; paint; hazardous removal; asserted universal service life or whole-building performance"
  required_metadata: "Reference area/gate; substrate/system/thickness; site/period; zone/batch links; starting and downstream ownership; utility and waste scope; geographic/technology compatibility"
  required_quality_disclosure: "Measured versus estimated quantities; provisional ranges; missing upstream datasets; water balance and drying uncertainty; shared/rework attribution; unresolved identities and concrete-exchange resolution"
  update_trigger: "Change to plaster formulation, thickness, substrate, acceptance criteria, equipment, drying conditions, utility supply, waste routing or representative evidence"
data_sources:
  - id: "british-gypsum-multifinish-installation"
    type: "handbook"
    reference: "British Gypsum, Thistle MultiFinish installation instructions, https://www.british-gypsum.com/installation/installation-guidance-and-support/installation-guides/thistle-multifinish-installation-instructions"
    used_for: "Selected-product route illustration: background suitability, mixing, staged skim/trowelling and variable application timings. Product-specific quantities/times are not generic PCR defaults or proof of decorative dryness."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:e9a7deb38c9da790009a39a55e3a367c8481ee860f3504a6c00fc87fd3f5bb79"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_3825"
      family: "system_boundary"
      span:
        start:
          offset: 3825
          line: 55
          column: 1
        end:
          offset: 23047
          line: 371
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Existing substrate accepted suitable for the selected gypsum finish, with substrate construction complete and local joints/edges identified |\n| starting_condition_role | Upstream handover prerequisite, followed by included local interface preparation |\n| product_classification_scope | A narrower interior gypsum skim route within plastering services |\n| recursive_input_rule | Purchased same-category service enters once as identified upstream activity; remove overlapping foreground operations and disclose any recursive truncation. |\n| upstream_dataset_requirement | Link powder, supplied water, preparation materials, energy, equipment and transport services to compatible upstream datasets; substrate is an explicit upstream prerequisite with separate ownership, never silently assumed zero. |\n| disclosure | Record excluded substrate production/repair and downstream decoration; construction-site location, period, starting acceptance, actual system, utility and waste responsibilities; report unavailable upstream coverage. |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| scope_gate | substrate; finish | Verify selected plaster suitability for the actual background and include local preparation; major substrate correction remains an upstream prerequisite. | british-gypsum-multifinish-installation |\n| reaction_gate | mix; finish; dry_accept | Powder and water form paste in mix; gypsum setting within finish changes retained composition. Report actual product and water states at handoffs, unreacted surplus and residues; do not invent a stoichiometric yield, gas by-product or complete reaction. | |\n| dryness_gate | dry_accept | Trowelling/setting does not prove dry-to-decorate readiness. Continue actual relevant ventilation/heating and monitoring until the declared criterion is met; the manufacturer's staged application timings are product-specific and provide no universal drying endpoint. | british-gypsum-multifinish-installation |\n| utility_owner | prep; mix; finish; dry_accept | Identify shared lighting, access platforms and equipment, every consuming node and service period; attribute measured service demand once and disclose mobilization, rental/capital and upstream coverage. Keep the full work lot through actual multi-day drying: record unaccepted surface and water at any reporting cutoff and carry its existing burdens into the same final accepted lot without resetting, truncating or counting them twice. | |\n| water_destination | mix; finish; dry_accept | Keep supplied mixing/finishing/cleaning water, retained water, collected slurry/condensate and actual vapour or direct discharge distinct. No wastewater or dust category may be assumed an elementary emission without substance and receiving-medium evidence. | |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Joint and edge preparation materials (`prep_materials`)\n\nProcess / prospective direction / type: `prep` / `inputs` / `product`.\n\nConditional materials for local joint and edge treatment of the accepted substrate; expand the umbrella into actual identified products.\n\n- Collection subject: Joint and edge preparation materials\n- Flow property / unit: Mass / kg\n- Amount rule: prep_material_mass / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_prep`\n- Unverified optional screening aid: Provisional screen. Provisional wide screen for local tape, beads and compatible joint treatment; chemistry is system-specific. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 5\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Preparation access and equipment service (`prep_access`)\n\nProcess / prospective direction / type: `prep` / `inputs` / `product`.\n\nInclude actual access provision and mobilization when attributable to local preparation; preserve asset and service units in downstream concrete exchanges.\n\n- Collection subject: Preparation access and equipment service\n- Flow property / unit: Duration / h\n- Amount rule: prep_service_hours / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_prep`\n- Unverified optional screening aid: Provisional screen. Provisional screen for attributed platform and equipment hours; no lifetime or service factor is prescribed. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 2\n  - Unit: h\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Prepared suitable substrate interface (`prepared_area`)\n\nProcess / prospective direction / type: `prep` / `outputs` / `product`.\n\nInternal area handoff after local preparation, with substrate acceptance and zone transfer id; existing substrate manufacture is upstream background.\n\n- Collection subject: Prepared suitable substrate interface\n- Flow property / unit: Area / m2\n- Amount rule: prepared_area / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_prep`\n- Unverified optional screening aid: Provisional screen. Provisional screen permits prepared areas awaiting acceptance and rework; not an identity quantity. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0.5\n  - Upper: 3\n  - Unit: m2\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Preparation residues to collection (`prep_waste`)\n\nProcess / prospective direction / type: `prep` / `outputs` / `waste`.\n\nRecord collected scraps by composition and custodian; do not call collected residue an air emission.\n\n- Collection subject: Preparation residues to collection\n- Flow property / unit: Mass / kg\n- Amount rule: prep_waste_mass / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_prep`\n- Unverified optional screening aid: Provisional screen. Provisional broad local-preparation residue screen; hazardous removal remains excluded. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 5\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Off-spec paste and powder to collection (`mix_reject`)\n\nProcess / prospective direction / type: `mix` / `outputs` / `waste`.\n\nKeep stale or contaminated paste out of accepted production; record authorised rework only when supplier instructions permit it.\n\n- Collection subject: Off-spec paste and powder to collection\n- Flow property / unit: Mass / kg\n- Amount rule: mix_reject_mass / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_mix`\n- Unverified optional screening aid: Provisional screen. Provisional reject screen includes stale paste and spill recovery, with actual destination required. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 10\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Plaster packaging to collection (`mix_packaging`)\n\nProcess / prospective direction / type: `mix` / `outputs` / `waste`.\n\nSeparate packaging by material and recycling or disposal custodian.\n\n- Collection subject: Plaster packaging to collection\n- Flow property / unit: Mass / kg\n- Amount rule: mix_packaging_mass / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_mix`\n- Unverified optional screening aid: Provisional screen. Provisional packaging screen pending actual bag composition and packaging mass. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 2\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Measured mixing air emissions (`mix_air`)\n\nProcess / prospective direction / type: `mix` / `outputs` / `elementary`.\n\nConditional measured particulate, water vapour or other named species only; mixing-stage vapour, when evidenced, belongs here and never at dry_accept; expand species and size fractions rather than assuming one generic dust UUID.\n\n- Collection subject: Measured mixing air emissions\n- Flow property / unit: Mass / kg\n- Amount rule: mix_emission_mass / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_mix`\n- Unverified optional screening aid: Provisional screen. Provisional screening envelope only; pollutant identity and receiving air compartment need measured evidence. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 1\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Prepared suitable substrate feed (`finish_substrate`)\n\nProcess / prospective direction / type: `finish` / `inputs` / `product`.\n\nInternal interface from prep, with the same transfer id and accepted substrate state.\n\n- Collection subject: Prepared suitable substrate feed\n- Flow property / unit: Area / m2\n- Amount rule: finish_substrate_area / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_finish`\n- Unverified optional screening aid: Provisional screen. Provisional area screen reconciled by zone with prep output; no production of substrate in this node. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0.5\n  - Upper: 3\n  - Unit: m2\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Application access and equipment service (`finish_access`)\n\nProcess / prospective direction / type: `finish` / `inputs` / `product`.\n\nRecord actual access service share, equipment identity and delivery mobilization; avoid duplicated preparation charges.\n\n- Collection subject: Application access and equipment service\n- Flow property / unit: Duration / h\n- Amount rule: finish_service_hours / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_finish`\n- Unverified optional screening aid: Provisional screen. Provisional attributed equipment-hour screen without assumed asset lifetime. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 2\n  - Unit: h\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Set and trowelled skim surface transfer (`trowelled_area`)\n\nProcess / prospective direction / type: `finish` / `outputs` / `product`.\n\nApplied gypsum sets within this responsibility; identify reacted retained material, surplus paste and wet residues, without presuming complete reaction or a gas by-product.\n\n- Collection subject: Set and trowelled skim surface transfer\n- Flow property / unit: Area / m2\n- Amount rule: trowelled_area / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_finish`\n- Unverified optional screening aid: Provisional screen. Provisional intermediate area screen; setting is not evidence of dry-to-decorate readiness. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0.5\n  - Upper: 3\n  - Unit: m2\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Application and rework residues to collection (`finish_waste`)\n\nProcess / prospective direction / type: `finish` / `outputs` / `waste`.\n\nRejected zones return for correction to finish with repeat labour and material retained; removed plaster exits as measured waste and rejected area is excluded from accepted_area.\n\n- Collection subject: Application and rework residues to collection\n- Flow property / unit: Mass / kg\n- Amount rule: finish_waste_mass / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_finish`\n- Unverified optional screening aid: Provisional screen. Provisional residue screen for dropped plaster and removed defects; no assumed waste percentage. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 10\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Set and trowelled skim surface feed (`dry_surface`)\n\nProcess / prospective direction / type: `dry_accept` / `inputs` / `product`.\n\nReceive set surface into monitored drying and inspection; actual retained water state remains a recorded uncertainty.\n\n- Collection subject: Set and trowelled skim surface feed\n- Flow property / unit: Area / m2\n- Amount rule: dry_surface_area / accepted_area\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_dry_accept`\n- Unverified optional screening aid: Provisional screen. Provisional handoff area screen reconciled by zone to finish output. All provisional screens prompt investigation; they are neither observed facts, allowed limits nor default inventory amounts.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0.5\n  - Upper: 3\n  - Unit: m2\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n"
