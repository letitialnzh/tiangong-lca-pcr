boundary_abstraction:
  declared_starting_condition: "Existing substrate accepted suitable for the selected gypsum finish, with substrate construction complete and local joints/edges identified"
  starting_condition_role: "Upstream handover prerequisite, followed by included local interface preparation"
  product_classification_scope: "A narrower interior gypsum skim route within plastering services"
  recursive_input_rule: "Purchased same-category service enters once as identified upstream activity; remove overlapping foreground operations and disclose any recursive truncation."
  upstream_dataset_requirement: "Link powder, supplied water, preparation materials, energy, equipment and transport services to compatible upstream datasets; substrate is an explicit upstream prerequisite with separate ownership, never silently assumed zero."
  disclosure: "Record excluded substrate production/repair and downstream decoration; construction-site location, period, starting acceptance, actual system, utility and waste responsibilities; report unavailable upstream coverage."
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted dry-to-decorate gypsum skim service"
    uuid: ""
  flow_property_ref:
    uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
  unit_group_ref:
    uuid: "93a60a57-a3c8-18da-a746-0800200c9a66"
  reference_unit: "m2"
  required_qualifiers:
    - "site and period"
    - "accepted substrate and local preparation"
    - "finish plaster grade"
    - "actual thickness and coat sequence"
    - "net-area measurement and openings"
    - "zone/batch links"
    - "quality gate"
    - "actual dryness criterion and observation"
    - "climate/ventilation/heating"
    - "rework and waste destinations"
    - "upstream and downstream boundary ownership"
reference_flows:
  []
measurement_rules:
  - id: net_area
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: ""
    required_unit: "m2"
    rule: "Measure net accepted surface; subtract openings and unaccepted zones; report treatment of reveals and returns, without counting the same physical face twice."
  - id: wet_dry_water
    applies_to: "gypsum_powder; mixed_paste; finish_paste; evaporated_water"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep dry delivered powder, wet paste, chemically retained water, residual free water, collected liquid and vapour distinct; document stock and transfer changes."
  - id: retain_energy
    applies_to: "prep_electricity; mix_electricity; finish_electricity; dry_electricity; dry_heat"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh; MJ"
    rule: "Preserve metered electricity and delivered heat separately; declare conversion and device boundaries rather than treating kWh as a fuel mass."
process_map:
  - id: prep
    name: "Local substrate interface preparation"
    inclusion: "required"
    inclusion_condition: "Accepted suitable existing background"
    role: "Local joints/edges and preparation interface"
    quantitative_reference: "Measured prepared area by zone"
  - id: mix
    name: "Finish plaster powder/water mixing"
    inclusion: "required"
    inclusion_condition: "Actual selected gypsum finish system"
    role: "Batch formulation, powder/water reconciliation and fresh paste handoff"
    quantitative_reference: "Measured fresh paste mass by batch"
  - id: finish
    name: "Hand application, setting and trowelling"
    inclusion: "required"
    inclusion_condition: "Prepared interface and usable fresh paste available"
    role: "Surface finish and gypsum setting responsibility; correction loops return here"
    quantitative_reference: "Measured set/trowelled area by zone"
  - id: dry_accept
    name: "Drying, inspection and decorative readiness"
    inclusion: "required"
    inclusion_condition: "Set/trowelled area awaiting actual final acceptance"
    role: "Dryness monitoring, attributable utilities and final net accepted service"
    quantitative_reference: "1 m2 accepted_skim"
