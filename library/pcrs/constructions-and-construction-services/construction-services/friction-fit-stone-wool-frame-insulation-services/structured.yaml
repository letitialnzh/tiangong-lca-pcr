boundary_abstraction:
  declared_starting_condition: "An accepted stable dry open wall frame with accessible cavities, and supplied unfaced semi-rigid stone wool slabs of declared grade; frame defects and hazardous materials have been resolved outside this service"
  starting_condition_role: "Existing-frame component interface plus separately supplied insulation material input; the frame is not manufactured in the foreground"
  product_classification_scope: "Only the stated narrower installation service within cpc:3.0:54652"
  recursive_input_rule: "A purchased installation service in the same category is an externally supplied service with supplier scope and quantities disclosed; use its upstream dataset and avoid reproducing its surveyed, cut or fitted activities in this foreground package"
  upstream_dataset_requirement: "Link actual supplied slabs, electricity and actual accessories to compatible upstream datasets; frame construction remains with the incoming frame owner. Preserve transport and offsite waste-treatment links and disclose their model ownership. No automatic burden-free input or avoided-product credit is implied."
  disclosure: "Site, work-lot boundary, accepted starting state, excluded corrective work, material specification, tool and shared-meter ownership, transport/treatment responsibility, actual retention condition, internal transfers and acceptance gate"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted friction-fit stone wool frame insulation service"
    uuid: ""
  flow_property_ref:
    uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
  unit_group_ref:
    uuid: "93a60a57-a3c8-18da-a746-0800200c9a66"
  reference_unit: "m2"
  required_qualifiers:
    - "site and work lot"
    - "wall/frame and cavity geometry"
    - "net aperture-area method"
    - "slab manufacturer and grade"
    - "stone wool identity"
    - "unfaced semi-rigid form"
    - thickness
    - "density basis"
    - "conductivity and test/declaration basis"
    - "resistance if claimed"
    - "installation instruction edition"
    - "acceptance gate and date"
    - "reject/rework status"
    - "custody and waste routes"
reference_flows:
  []
measurement_rules:
  - id: accepted_area
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "A is positive net accepted insulated cavity area measured from actual clear apertures using cp_fit_area; exclude frame members, openings, voids, rejected and unaccepted work. Do not use gross wall elevation or purchased slab area."
  - id: material_mass
    applies_to: "delivered_stone_wool; cut_slabs_transfer; cut_wool_feed; cut_reusable_exit; fit_reusable_exit; cut_wool_waste; fit_wool_waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use traceable actual mass records. If converted from pieces or slab volume, retain same-grade dimensions, density evidence and uncertainty; never treat area as mass without these conversion inputs."
  - id: transfer_pairing
    applies_to: "prepared_frame_interface; ready_frame_feed; cut_slabs_transfer; cut_wool_feed"
    required_property_ref:
      name: "Area or Mass appropriate to the card"
      uuid: ""
    required_unit: "m2 or kg appropriate to the card"
    rule: "Paired handoffs retain matching transfer id, lot, state, unit and quantity. Record actual feed and transfer amounts; neither intermediate area nor slab mass is fixed to the final 1 m2 reference."
  - id: thermal_qualifiers
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Thickness, density and declared conductivity qualify the service; preserve their units and declaration conditions. Material resistance calculations require consistent thickness and conductivity and cannot substitute for a whole-wall calculation."
