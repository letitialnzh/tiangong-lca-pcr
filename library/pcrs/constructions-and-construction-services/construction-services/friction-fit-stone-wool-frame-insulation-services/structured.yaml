          description: "Custodial fitting waste exit including removed unusable slabs. State: Damaged, unsuitable or contaminated wool and captured cleanup residue under fitting ownership. Destination: Actual waste receiver with material and route disclosure. Condition: Always for the declared route."
          amount:
            expression: "fit_waste_mass / A"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m2 reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_fit_material
              source_ids: []
            ranges:
              - role: qa_guardrail
                lower: "0"
                upper: "100"
                unit: "kg"
                basis: "per 1 m2 reference flow"
                basis_kind: "reference_flow"
                evidence_kind: "reasoned_estimate"
                source_ids: []
      elementary:
        []
allocation_rules:
  - rule_id: lot_subdivision
    applies_to: "work-lot burdens"
    rule: "Prefer direct node and lot records. Divide each attributable node numerator by the same positive accepted A. Rejected work, failed fitting attempts and their cleanup remain burdens of the producing lot; do not divide them by rejected area or count them as another final product."
    source_ids: []
  - rule_id: reusable_exits
    applies_to: "cut_reusable_exit; fit_reusable_exit"
    rule: "Record reusable exits as physical product outputs with recipient and state; they are not insulation services or waste. Gross physical slab input retains these exits. Net-use diagnostics subtract them once; never subtract the same return again from gross input because it is already an output. Only the actual unused material's inherited upstream burden may follow that material on exit; survey, cutting, fitting and rework service burdens remain with this service lot. Declare the material-burden transfer method and sensitivity; no automatic avoided-production credit."
    source_ids: []
  - rule_id: rework_ownership
    applies_to: "slab_cutting; fit_acceptance"
    rule: "A usable offcut reused within cutting or a removed piece refitted within the lot is an internal loop with event ids. Carry its inherited burdens once and add actual new cutting/fitting/cleanup burdens at the responsible node. Material leaving the node is classified as reusable product or custodial waste, never both."
    source_ids:
      - rockwool-thermal-frame-slab-installation-2025
  - rule_id: shared_meter
    applies_to: "all electricity and shared access/equipment service cards"
    rule: "For a meter interval, E_total = end reading - start reading after unit and multiplier correction. Identify all consumers, including outside-scope users. Prefer submeter totals; otherwise use documented observed runtime-and-power/activity weights. Shares across all consumers sum to one; assign each share once to one consuming node and lot before normalization. Do not add a site's full bill to each node. For actual rented access or equipment, use shared_service_calc and the node-specific shared-service protocol; enumerate every beneficiary in the same contract period and separately resolve availability versus active-use basis."
    source_ids: []
  - rule_id: changeover_cleanup
    applies_to: "work lots"
    rule: "Assign material-grade changeover and local cleaning to the originating lot where identifiable; document the common event and actual beneficiary shares otherwise. One cleanup event belongs to cutting or fitting ownership, with each physical waste or energy quantity counted once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_survey_area
      process_id: "aperture_survey"
      flow_role: "supplied and measured frame interfaces"
      record_type: "aperture survey and supplier acceptance record"
      raw_fields: "site; lot; room/wall; aperture_id; clear_width; clear_height; irregular_geometry_dimensions; noninsulatable_area; starting_acceptance; ready_state; frame_transfer_id; timestamp"
      collection_method: "Measure actual clear apertures with checked tape or laser; calculate geometry from recorded dimensions; retain drawings and starting-frame acceptance Aggregation algorithm: Sum actual surveyed and ready cavity areas separately; divide each by A from cp_fit_area; retain failed/held cavity records outside ready area"
      unit: "m; m2"
      frequency: "Each aperture and any corrected survey"
      temporal_coverage: "Same work lot before cutting and fitting"
      site_scope: "Named wall/frame cavities only"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Instrument check; signed aperture sheet; photographs; transfer reconciliation"
    - protocol_id: cp_survey_energy
      process_id: "aperture_survey"
      flow_role: "conditional survey lighting"
      record_type: "node meter or shared-event record"
      raw_fields: "site; lot; node; asset_id; period_start; period_end; meter_start; meter_end; meter_unit; multiplier; meter_to_kWh_factor; conversion_evidence; actual_runtime; observed_power; all_consumers; consumer_weights; allocation_share; billed_service_inclusions"
      collection_method: "Read node meter or link shared interval to actual survey lighting; retain full consumer ledger before computing allocation Aggregation algorithm: Correct end-minus-start; multiply by survey share once; sum survey-attributable kWh; divide by A"
      unit: "kWh"
      frequency: "Each metered interval or shared event"
      temporal_coverage: "Survey period for same lot"
      site_scope: "Survey consumers plus every other consumer of that shared meter"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Meter calibration or bill; activity log; shares reconcile to one; no duplicate interval"
    - protocol_id: cp_cut_material
      process_id: "slab_cutting"
      flow_role: "slab draw, cut transfer, reusable exits, wool and packaging waste"
      record_type: "stock, scale, transfer and waste event records"
      raw_fields: "site; lot; grade; slab_dimensions; piece_dimensions; piece_count; pack_mass; thickness; density_evidence; documented_density_kg_per_m3; opening_stock; receipts; closing_stock; opening_cut_wip; closing_cut_wip; supplier_returns; external_handover; event_id; exit_class; wool_transfer_id; cut_piece_mass; usable_internal_recut; wool_waste_mass; packaging_material; packaging_mass; vacuum_event; destination; timestamp; piece_id; mass_geometry_state; density_reference_state; actual_piece_volume_m3; compatible_density_kg_per_m3; density_state_bridge_evidence; measured_piece_mass_kg; accepted_piece_ids; retained_piece_mass_evidence"
      collection_method: "Weigh by material with checked scales or use traceable grade-specific pack/piece mass conversion; record opening and closing stock and every mutually exclusive exit; separate packaging from wool Aggregation algorithm: Compute gross slab draw and diagnostic net use; sum transfer/reusable/waste/packaging separately; divide each numerator by A; closing stock excludes material already recorded as external exit For geometry-to-mass conversion, record piece_id, mass_geometry_state and density_reference_state, actual_piece_volume_m3, compatible_density_kg_per_m3 and density_state_bridge_evidence. Use relaxed cut-piece dimensions with density evidenced for that same state, or actual installed/compressed geometry only with its compatible actual-state density. A shared grade or thermal-declaration density alone does not establish state compatibility. Prefer traceable measured_piece_mass_kg; retained_piece_mass_evidence links independently weighed/converted pieces and actual measured removals to accepted_piece_ids without solving the mass-balance residual. Unknown state conversion leaves a mass-data gap, never zero or an invented compression factor; actual accepted area is determined independently."
      unit: "kg"
      frequency: "Each receipt, transfer, return and waste event; stock at lot boundaries"
      temporal_coverage: "Entire cutting lot including recutting and cutting-owned cleanup"
      site_scope: "Cutting custody and named downstream recipients"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Scale check; supplier mass/density documentation; stock ledger; signed transfer and waste receipt; event uniqueness"
    - protocol_id: cp_cut_energy
      process_id: "slab_cutting"
      flow_role: "conditional powered cutting, lighting and local vacuum"
      record_type: "node meter or shared-event record"
      raw_fields: "site; lot; node; asset_id; period_start; period_end; meter_start; meter_end; meter_unit; multiplier; meter_to_kWh_factor; conversion_evidence; actual_runtime; observed_power; all_consumers; consumer_weights; allocation_share; cleanup_event_id; billed_service_inclusions"
      collection_method: "Meter actual powered equipment or link common interval to cutting-owned consumption; do not estimate powered saw use when a hand knife was used Aggregation algorithm: Correct interval energy; apply documented cutting shares once; sum numerator before division by A"
      unit: "kWh"
      frequency: "Each metered interval or shared event"
      temporal_coverage: "Full cutting period including actual recutting and cleanup"
      site_scope: "Cutting consumers and all other shared-meter consumers"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Meter/bill evidence; activity and vacuum ownership; full shares reconciliation"
    - protocol_id: cp_cut_air
      process_id: "slab_cutting"
      flow_role: "conditional direct airborne release"
      record_type: "measured release or supported site-specific emission calculation"
      raw_fields: "site; lot; cutting_event; substance_or_composition; particle_size_basis; receiving_air_medium; measured_concentration; sampled_air_volume; capture_efficiency_evidence; release_algorithm; factor_records; method; uncertainty; release_duration; collected_waste_exclusion; measurement_scope; source_boundary; background_corrected_concentration_mg_m3; actual_source_flow_m3_s; interval_duration_s; gas_state_basis; source_coverage_evidence; measured_total_release_kg; total_release_method; control_factor_basis; measured_source_concentration_mg_m3; measured_background_concentration_mg_m3; background_correction_method; source_flow_measurement_evidence"
      collection_method: "Quantify the whole event release across the actual environmental boundary, not the mass caught by a sampler. For a representative measured source stream, retain background-corrected concentration, the full source flow and matching duration on the same temperature/pressure and dry/wet basis. Sampling-pump volume and worker/room exposure concentration alone cannot establish an event total. For diffuse releases use a validated site-specific total-flux method or supported activity-factor model, with actual event coverage and uncertainty; unknown coverage remains a gap. Exclude captured waste. A downstream release measurement or already controlled release factor receives no second capture deduction. Sum each actual species/size/medium event once and divide by A once. Retain original measured_source_concentration_mg_m3 and measured_background_concentration_mg_m3, the validated background_correction_method and source_flow_measurement_evidence; raw observations and method must support background_corrected_concentration_mg_m3 and the actual flow."
      unit: "mg/m3; m3; m3/s; s; kg"
      frequency: "Each assessed cutting release event"
      temporal_coverage: "Same cutting lot and actual release period"
      site_scope: "Cutting environmental boundary only"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Sampling report; method/factor provenance; uncertainty; custody/release separation"
    - protocol_id: cp_fit_material
      process_id: "fit_acceptance"
      flow_role: "paired frame and wool feed; accessories; reusable and waste exits; conditional actual accessory and packaging waste"
      record_type: "transfer, scale, accessory and rework records"
      raw_fields: "site; lot; frame_transfer_id; frame_feed_area; wool_transfer_id; feed_mass; opening_wool_wip; closing_wool_wip; installed_wool_mass; installed_piece_geometry; installed_density_evidence; documented_density_kg_per_m3; accessory_identity; accessory_instruction; accessory_opening; accessory_receipts; accessory_closing; accessory_returns; accessory_external_handover; removal_event; removed_mass; reuse_or_discard; fit_reusable_mass; fit_waste_mass; vacuum_event; recipient; timestamp; aperture_id; final_acceptance_record; installed_acceptance_status; accessory_waste_mass; accessory_packaging_waste_mass; accessory_waste_event; accessory_waste_material; accessory_waste_custodian; accessory_waste_destination; piece_id; mass_geometry_state; density_reference_state; actual_piece_volume_m3; compatible_density_kg_per_m3; density_state_bridge_evidence; measured_piece_mass_kg; accepted_piece_ids; retained_piece_mass_evidence"
      collection_method: "Reconcile actual incoming frame and cut-piece transfers; weigh actual material exits and accessory records; tag removal as same-lot rework, external reusable exit or waste; actual accessory instructions establish activation Aggregation algorithm: Sum actual paired feed; compute accessory net issue; sum reusable/waste exits once; retain WIP and refitting loops; divide each numerator by A Record installed wool only by final acceptance membership; unaccepted installed wool belongs to mutually exclusive closing WIP. Weigh actual accessory waste and packaging separately by material/event/custodian; reusable returns and closing stocks are not waste. For geometry-to-mass conversion, record piece_id, mass_geometry_state and density_reference_state, actual_piece_volume_m3, compatible_density_kg_per_m3 and density_state_bridge_evidence. Use relaxed cut-piece dimensions with density evidenced for that same state, or actual installed/compressed geometry only with its compatible actual-state density. A shared grade or thermal-declaration density alone does not establish state compatibility. Prefer traceable measured_piece_mass_kg; retained_piece_mass_evidence links independently weighed/converted pieces and actual measured removals to accepted_piece_ids without solving the mass-balance residual. Unknown state conversion leaves a mass-data gap, never zero or an invented compression factor; actual accepted area is determined independently."
      unit: "m2; kg"
      frequency: "Each transfer, accessory issue, removal and cleanup event; WIP at lot limits"
      temporal_coverage: "Whole fitting lot through acceptance and final cleanup"
      site_scope: "Fitting custody and named recipients"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Transfer signatures; checked scale; accessory product evidence; removal-route log; receiver receipt"
    - protocol_id: cp_fit_energy
      process_id: "fit_acceptance"
      flow_role: "conditional fitting, inspection lighting and final vacuum"
      record_type: "node meter or shared-event record"
      raw_fields: "site; lot; node; asset_id; period_start; period_end; meter_start; meter_end; meter_unit; multiplier; meter_to_kWh_factor; conversion_evidence; actual_runtime; observed_power; all_consumers; consumer_weights; allocation_share; cleanup_event_id; billed_service_inclusions"
      collection_method: "Meter actual fitting-node consumers or allocate a common interval using documented consumer data and one ownership record Aggregation algorithm: Correct interval energy; apply fitting shares once; sum numerator before division by A"
      unit: "kWh"
      frequency: "Each metered interval or shared event"
      temporal_coverage: "Fitting, inspection, rework and final cleanup period"
      site_scope: "Fitting consumers and all other shared-meter consumers"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Meter/bill evidence; final-cleanup ownership; full shares reconciliation"
    - protocol_id: cp_fit_area
      process_id: "fit_acceptance"
      flow_role: "actual accepted reference service"
      record_type: "signed acceptance and aperture measurement record"
      raw_fields: "site; lot; aperture_id; accepted_clear_dimensions; noninsulated_deductions; slab_grade; thickness; density_basis; conductivity_basis; visible_gap_check; compression_check; rejection_area; rework_status; enclosure_status; acceptance_date; approver"
      collection_method: "Reconcile installed aperture geometry to survey and inspect fit before enclosure; acceptance signoff identifies actual conforming apertures; retain rejected work until corrected and reaccepted Aggregation algorithm: A = sum net finally accepted aperture areas; count each aperture once after final disposition; A/A = 1 m2 reference service"
      unit: "m; m2"
      frequency: "Every accepted aperture and each subsequent rejection/reacceptance"
      temporal_coverage: "One complete lot ending at acceptance"
      site_scope: "Actual inspected cavity faces; frame members excluded"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Signed pre-enclosure checklist; dimensions; photos; grade delivery record; rejected-work log"
    - protocol_id: cp_fit_air
      process_id: "fit_acceptance"
      flow_role: "conditional fitting direct airborne release"
      record_type: "measured release or supported site-specific emission calculation"
      raw_fields: "site; lot; fitting_or_cleanup_event; substance_or_composition; particle_size_basis; receiving_air_medium; measured_concentration; sampled_air_volume; capture_efficiency_evidence; release_algorithm; factor_records; method; uncertainty; release_duration; collected_waste_exclusion; measurement_scope; source_boundary; background_corrected_concentration_mg_m3; actual_source_flow_m3_s; interval_duration_s; gas_state_basis; source_coverage_evidence; measured_total_release_kg; total_release_method; control_factor_basis; measured_source_concentration_mg_m3; measured_background_concentration_mg_m3; background_correction_method; source_flow_measurement_evidence"
      collection_method: "Quantify the whole event release across the actual environmental boundary, not the mass caught by a sampler. For a representative measured source stream, retain background-corrected concentration, the full source flow and matching duration on the same temperature/pressure and dry/wet basis. Sampling-pump volume and worker/room exposure concentration alone cannot establish an event total. For diffuse releases use a validated site-specific total-flux method or supported activity-factor model, with actual event coverage and uncertainty; unknown coverage remains a gap. Exclude captured waste. A downstream release measurement or already controlled release factor receives no second capture deduction. Sum each actual species/size/medium event once and divide by A once. Retain original measured_source_concentration_mg_m3 and measured_background_concentration_mg_m3, the validated background_correction_method and source_flow_measurement_evidence; raw observations and method must support background_corrected_concentration_mg_m3 and the actual flow."
      unit: "mg/m3; m3; m3/s; s; kg"
      frequency: "Each assessed fitting release event"
      temporal_coverage: "Same fitting lot and actual release period"
      site_scope: "Fitting environmental boundary only"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Sampling report; raw data and factor provenance; uncertainty; no overlap with fitting waste"
    - protocol_id: cp_survey_shared_service
      process_id: "aperture_survey"
      flow_role: "conditional shared access/equipment availability service"
      record_type: "rental contract, asset event and complete consumer ledger"
      raw_fields: "site; lot; node; asset_id; actual_equipment_identity; supplier_contract; service_gate; time_basis; availability_start; availability_end; billed_quantity; billed_unit; documented_time_conversion; all_consumers; consumer_activity_records; weights; allocation_share; energy_inclusions; capital_and_maintenance_inclusions; setup_removal_owner; timestamp"
      collection_method: "Record the actual supplied availability period and contract units; reconcile observed consumer activity and every beneficiary for the same asset period; preserve evidence distinguishing availability from active operation; collect this node's own actual records before allocation Aggregation algorithm: Convert documented availability quantity to h; multiply by this node's beneficiary share once; sum attributable service hours and divide by A; do not add invoice-wide service repeatedly or separately add burdens already included by supplier"
      unit: "h"
      frequency: "Each asset/service period and change of consumers"
      temporal_coverage: "Complete aperture_survey participation within the contracted availability period"
      site_scope: "This node plus all other asset consumers, including outside-scope users"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Supplier contract/invoice; asset logs; exact unit conversion; all-consumer shares sum to one; inclusion/exclusion reconciliation"
    - protocol_id: cp_cut_shared_service
      process_id: "slab_cutting"
      flow_role: "conditional shared access/equipment availability service"
      record_type: "rental contract, asset event and complete consumer ledger"
      raw_fields: "site; lot; node; asset_id; actual_equipment_identity; supplier_contract; service_gate; time_basis; availability_start; availability_end; billed_quantity; billed_unit; documented_time_conversion; all_consumers; consumer_activity_records; weights; allocation_share; energy_inclusions; capital_and_maintenance_inclusions; setup_removal_owner; timestamp"
      collection_method: "Record the actual supplied availability period and contract units; reconcile observed consumer activity and every beneficiary for the same asset period; preserve evidence distinguishing availability from active operation; collect this node's own actual records before allocation Aggregation algorithm: Convert documented availability quantity to h; multiply by this node's beneficiary share once; sum attributable service hours and divide by A; do not add invoice-wide service repeatedly or separately add burdens already included by supplier"
      unit: "h"
      frequency: "Each asset/service period and change of consumers"
      temporal_coverage: "Complete slab_cutting participation within the contracted availability period"
      site_scope: "This node plus all other asset consumers, including outside-scope users"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Supplier contract/invoice; asset logs; exact unit conversion; all-consumer shares sum to one; inclusion/exclusion reconciliation"
    - protocol_id: cp_fit_shared_service
      process_id: "fit_acceptance"
      flow_role: "conditional shared access/equipment availability service"
      record_type: "rental contract, asset event and complete consumer ledger"
      raw_fields: "site; lot; node; asset_id; actual_equipment_identity; supplier_contract; service_gate; time_basis; availability_start; availability_end; billed_quantity; billed_unit; documented_time_conversion; all_consumers; consumer_activity_records; weights; allocation_share; energy_inclusions; capital_and_maintenance_inclusions; setup_removal_owner; timestamp"
      collection_method: "Record the actual supplied availability period and contract units; reconcile observed consumer activity and every beneficiary for the same asset period; preserve evidence distinguishing availability from active operation; collect this node's own actual records before allocation Aggregation algorithm: Convert documented availability quantity to h; multiply by this node's beneficiary share once; sum attributable service hours and divide by A; do not add invoice-wide service repeatedly or separately add burdens already included by supplier"
      unit: "h"
      frequency: "Each asset/service period and change of consumers"
      temporal_coverage: "Complete fit_acceptance participation within the contracted availability period"
      site_scope: "This node plus all other asset consumers, including outside-scope users"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Supplier contract/invoice; asset logs; exact unit conversion; all-consumer shares sum to one; inclusion/exclusion reconciliation"
  calculation_rules:
    - id: accepted_area_calc
      applies_to: "accepted_insulation_service"
      rule: "For each finally accepted aperture, net_area = measured geometric area - recorded noninsulated deductions; A = sum(net_area); reference amount = A / A = 1 m2; A must be positive."
      inputs:
        - accepted_clear_dimensions
        - noninsulated_deductions
        - visible_gap_check
        - compression_check
        - rejection_area
        - rework_status
        - acceptance_date
        - approver
        - cp_fit_area
      output: "A; accepted_insulation_service"
      source_ids: []
    - id: survey_area_calc
      applies_to: "supplied_frame_interface; prepared_frame_interface"
      rule: "survey_area = sum surveyed net cavity areas; ready_area = sum surveyed net cavity areas with accepted ready state; normalize each by A."
      inputs:
        - clear_width
        - clear_height
        - irregular_geometry_dimensions
        - noninsulatable_area
        - ready_state
        - cp_survey_area
        - A
      output: "survey_area / A; ready_area / A"
      source_ids: []
    - id: cut_stock_calc
      applies_to: "delivered_stone_wool; cut_reusable_exit"
      rule: "gross_slab_draw = opening_stock + receipts - closing_stock; cut_reusable_exit_mass = supplier_returns + external_handover; diagnostic_net_use = opening_stock + receipts - closing_stock - supplier_returns - external_handover. Returns and external handovers are mutually exclusive and excluded from closing stock. Physical gross input is not reduced again when reusable exits are output cards. Normalize gross_slab_draw and cut_reusable_exit_mass separately by A."
      inputs:
        - opening_stock
        - receipts
        - closing_stock
        - supplier_returns
        - external_handover
        - cp_cut_material
        - A
      output: "gross_slab_draw / A; cut_reusable_exit_mass / A; diagnostic_net_use"
      source_ids: []
    - id: cut_mass_calc
      applies_to: "cut_slabs_transfer; cut_wool_waste; cut_packaging_waste"
      rule: "Sum cut_piece_mass for wool_transfer_id into cut_transfer_mass; separately sum unusable wool plus cutting-owned captured dust into cut_waste_mass; separately sum discarded packaging by actual material into cut_packaging_mass. Normalize each sum by A; usable internal recuts are not new external input/output."
      inputs:
        - cut_piece_mass
        - wool_waste_mass
        - packaging_mass
        - wool_transfer_id
        - event_id
        - cp_cut_material
        - A
      output: "cut_transfer_mass / A; cut_waste_mass / A; cut_packaging_mass / A"
      source_ids: []
    - id: fit_feed_calc
      applies_to: "ready_frame_feed; cut_wool_feed"
      rule: "frame_feed_area = sum actual frame transfers; fit_feed_mass = sum actual cut-piece transfers; normalize each separately by A and reconcile each to the paired source card without fixing either to 1."
      inputs:
        - frame_feed_area
        - feed_mass
        - frame_transfer_id
        - wool_transfer_id
        - cp_fit_material
        - A
      output: "frame_feed_area / A; fit_feed_mass / A"
      source_ids: []
    - id: fit_exit_calc
      applies_to: "retention_accessories; fit_reusable_exit; fit_wool_waste"
      rule: "accessory_mass = accessory_opening + accessory_receipts - accessory_closing - accessory_returns - accessory_external_handover, after actual instruction activation; fit_reusable_mass = sum external reusable exits; fit_waste_mass = sum unusable removals and fitting-owned captured cleanup residue. Normalize each by A; refitting within the lot is an internal loop and each removed portion has one disposition. accessory_returns and accessory_external_handover are mutually exclusive and neither includes accessory_closing; accessory_mass includes actual discarded accessory losses, recorded once through fit_accessory_packaging_waste rather than subtracted again."
      inputs:
        - accessory_opening
        - accessory_receipts
        - accessory_closing
        - accessory_returns
        - accessory_external_handover
        - accessory_identity
        - accessory_instruction
        - removal_event
        - reuse_or_discard
        - fit_reusable_mass
        - fit_waste_mass
        - cp_fit_material
        - A
      output: "accessory_mass / A; fit_reusable_mass / A; fit_waste_mass / A"
      source_ids: []
    - id: electricity_calc
      applies_to: "survey_electricity; cutting_electricity; fitting_electricity"
      rule: "For each interval, meter_to_kWh_factor = 1 for kWh, 1/1000 for Wh and 1/3.6 for MJ; any other meter unit needs a documented conversion factor and conversion_evidence. corrected_energy = (meter_end - meter_start) * multiplier * meter_to_kWh_factor; derive allocation_share = this consumer weight / sum(all consumer weights) from consumer_weights and actual_runtime/observed_power or retain the documented direct submeter assignment. Under the weight method, sum(all consumer weights) must be positive; zero or unknown total weights or missing consumers require a data gap or another reviewed attribution basis, never 0/0 or automatic share 1. Direct submeters may use an explicit independent node assignment without undefined weight division. consumer_energy = corrected_energy * allocation_share; sum consumer_energy for the respective node into survey_energy, cut_energy or fit_energy and divide its numerator by A. All consumer shares, including outside-scope consumers, sum to one. Use direct submeter readings where available; measured runtime/power weights are fallback evidence, not additional energy."
      inputs:
        - meter_start
        - meter_end
        - meter_unit
        - multiplier
        - meter_to_kWh_factor
        - conversion_evidence
        - actual_runtime
        - observed_power
        - all_consumers
        - consumer_weights
        - allocation_share
        - cp_survey_energy
        - cp_cut_energy
        - cp_fit_energy
        - A
      output: "survey_energy / A; cut_energy / A; fit_energy / A"
      source_ids: []
    - id: release_calc
      applies_to: "cut_airborne_particles; fit_airborne_particles"
      rule: "For each independently identified direct air release, mass_kg = sum(background_corrected_concentration_mg_m3 * actual_source_flow_m3_s * interval_duration_s) / 1000000 only for representative actual source-boundary intervals with compatible gas_state_basis and source_coverage_evidence. actual_source_flow_m3_s is the full environmental source stream, never sampling-pump flow; sampled_air_volume is sample-analysis evidence only. Concentration times sampler volume gives sample mass, not the whole event release. Alternatively use measured_total_release_kg from a validated total_release_method, or a fully supported source-specific release_algorithm with actual activity and factor_records. Diffuse/room or worker-exposure samples require an independently validated source-flux bridge before they can establish total released mass. Retain measurement_scope, source_boundary, method, uncertainty and control_factor_basis; do not apply capture correction again to a downstream release measurement or factor that already contains it. Unknown source coverage remains a gap, not zero. Sum actual event masses by substance_or_composition, particle_size_basis and receiving_air_medium into cut_air_mass or fit_air_mass; divide by A once. Captured waste is excluded. Retain original source and background concentration observations, validated background_correction_method and source_flow_measurement_evidence; the correction and actual source flow must be independently supported."
      inputs:
        - measurement_scope
        - source_boundary
        - background_corrected_concentration_mg_m3
        - actual_source_flow_m3_s
        - interval_duration_s
        - gas_state_basis
        - source_coverage_evidence
        - measured_total_release_kg
        - total_release_method
        - control_factor_basis
        - sampled_air_volume
        - method
        - uncertainty
        - release_algorithm
        - factor_records
        - substance_or_composition
        - particle_size_basis
        - receiving_air_medium
        - cp_cut_air
        - cp_fit_air
        - A
        - measured_source_concentration_mg_m3
        - measured_background_concentration_mg_m3
        - background_correction_method
        - source_flow_measurement_evidence
      output: "cut_air_mass / A; fit_air_mass / A"
      source_ids:
        - epa-eiip-sample-source-flow
    - id: mass_conversion_calc
      applies_to: "delivered_stone_wool; cut_slabs_transfer; cut_wool_feed"
      rule: "Where actual weighing is unavailable, mass_kg = sum(actual_piece_volume_m3 * compatible_density_kg_per_m3) for each exact piece/current-state group. Derive actual_piece_volume_m3 from measured piece_dimensions or installed_piece_geometry only after declaring mass_geometry_state. density_reference_state must match that geometry state, moisture and physical condition, proved by density_state_bridge_evidence. Relaxed cut-piece volume may use its evidenced relaxed-state density; compressed installed volume may not use an uncompressed nominal or thermal-declaration density merely because the grade matches. Use an independently supported actual-state conversion or retain the mass gap. Keep piece_id, dimensional observations, density source, uncertainty and measured_piece_mass_kg where available. Exact same-state supplier pack/piece mass is an alternative, never added again. No default density or compression factor is prescribed."
      inputs:
        - piece_dimensions
        - installed_piece_geometry
        - grade
        - density_evidence
        - installed_density_evidence
        - documented_density_kg_per_m3
        - pack_mass
        - piece_count
        - cp_cut_material
        - cp_fit_material
        - piece_id
        - mass_geometry_state
        - density_reference_state
        - actual_piece_volume_m3
        - compatible_density_kg_per_m3
        - density_state_bridge_evidence
        - measured_piece_mass_kg
        - accepted_piece_ids
        - retained_piece_mass_evidence
      output: "material_mass_kg"
      source_ids: []
    - id: cut_balance_calc
      applies_to: "delivered_stone_wool; cut_slabs_transfer; cut_reusable_exit; cut_wool_waste; cut_airborne_particles"
      rule: "Check gross_slab_draw + opening_cut_wip = cut_transfer_mass + cut_reusable_exit_mass + cut_waste_mass + cut_air_mass + closing_cut_wip + unexplained_difference. Opening/closing intact-slab stock is distinct from cut-piece WIP. Where direct release evidence is absent, retain unknown release/difference as a data gap rather than zero or exact closure. Resolve material differences against measurement uncertainty; internal recutting is not an additional external feed or exit."
      inputs:
        - gross_slab_draw
        - opening_cut_wip
        - cut_transfer_mass
        - cut_reusable_exit_mass
        - cut_waste_mass
        - cut_air_mass
        - closing_cut_wip
        - cp_cut_material
        - cp_cut_air
      output: "cutting_mass_balance; unexplained_difference"
      source_ids: []
    - id: fit_balance_calc
      applies_to: "cut_wool_feed; fit_reusable_exit; fit_wool_waste; fit_airborne_particles"
      rule: "Check fit_feed_mass + opening_wool_wip = installed_wool_mass + fit_reusable_mass + fit_waste_mass + fit_air_mass + closing_wool_wip + unexplained_difference. installed_wool_mass includes only wool in finally accepted apertures, obtained by traceable actual weighing or piece geometry times documented state-compatible density under mass_conversion_calc for that accepted portion; exclude accessories. closing_wool_wip includes installed wool in unaccepted or rejected apertures that has not yet been removed, plus other end-of-period wool awaiting work, and excludes installed_wool_mass and all already recorded exits; assign each physical portion to one mutually exclusive pool. Refitting loops do not add new feed. Where release evidence is absent, retain unknown release/difference as a gap rather than claiming exact closure or zero. For geometry-to-mass conversion, record piece_id, mass_geometry_state and density_reference_state, actual_piece_volume_m3, compatible_density_kg_per_m3 and density_state_bridge_evidence. Use relaxed cut-piece dimensions with density evidenced for that same state, or actual installed/compressed geometry only with its compatible actual-state density. A shared grade or thermal-declaration density alone does not establish state compatibility. Prefer traceable measured_piece_mass_kg; retained_piece_mass_evidence links independently weighed/converted pieces and actual measured removals to accepted_piece_ids without solving the mass-balance residual. Unknown state conversion leaves a mass-data gap, never zero or an invented compression factor; actual accepted area is determined independently."
      inputs:
        - fit_feed_mass
        - opening_wool_wip
        - installed_wool_mass
        - installed_piece_geometry
        - installed_density_evidence
        - fit_reusable_mass
        - fit_waste_mass
        - fit_air_mass
        - closing_wool_wip
        - cp_fit_material
        - cp_fit_air
        - aperture_id
        - final_acceptance_record
        - installed_acceptance_status
        - mass_conversion_calc
        - piece_id
        - mass_geometry_state
        - density_reference_state
        - actual_piece_volume_m3
        - compatible_density_kg_per_m3
        - density_state_bridge_evidence
        - measured_piece_mass_kg
        - accepted_piece_ids
        - retained_piece_mass_evidence
      output: "fitting_mass_balance; unexplained_difference"
      source_ids: []
    - id: shared_service_calc
      applies_to: "survey_shared_access_service; cut_shared_access_service; fit_shared_access_service"
      rule: "For each actual asset contract period, availability_hours = documented billed quantity times its traceable h conversion, or elapsed contracted seconds / 3600; never assume a working day equals 8 h. Compute each beneficiary weight from recorded actual use/activity on a declared basis; allocation_share = beneficiary weight / sum(all beneficiary weights). If all weights are zero or beneficiaries unknown, document another reviewed attribution basis or retain a data gap. Include outside-scope beneficiaries and assign unused availability burden explicitly. Node shared_hours = sum(availability_hours * allocation_share); normalize each node numerator by A. Supplier-included energy, setup/removal, maintenance or capital burden must not be added twice."
      inputs:
        - actual_equipment_identity
        - supplier_contract
        - time_basis
        - availability_start
        - availability_end
        - billed_quantity
        - billed_unit
        - documented_time_conversion
        - all_consumers
        - consumer_activity_records
        - weights
        - allocation_share
        - energy_inclusions
        - capital_and_maintenance_inclusions
        - setup_removal_owner
        - cp_survey_shared_service
        - cp_cut_shared_service
        - cp_fit_shared_service
        - A
      output: "survey_shared_hours / A; cut_shared_hours / A; fit_shared_hours / A"
      source_ids: []
  data_quality_requirements:
    - id: identity_fit
      applies_to: "all product and waste rows"
      requirement: "Verify actual material/state/destination identities before final dataset exchanges; a generic wool, asbestos-labelled translation or manufactured slab flow cannot represent the installation service. Material umbrellas require actual resolved exchanges."
      evidence: "Product delivery sheets; selected-system instructions; actual identity verification"
    - id: geometry_quality
      applies_to: "accepted area and transfers"
      requirement: "Same lot and cavity ids connect surveyed ready geometry, actual frame handoff and final accepted area; no frame member, duplicate face, rejected work or purchased slab area in A."
      evidence: "cp_survey_area; cp_fit_material; cp_fit_area"
    - id: material_reconciliation
      applies_to: "slab cutting and fitting"
      requirement: "Reconcile gross slab draw to cut transfers, reusable exits, wool waste and supported direct release, with WIP and measurement uncertainty; fitting feed reconciles to incorporated wool, WIP, reusable exits, waste and releases. Installed mass is an actual weighing or declared dimension-density diagnostic, not an added service output."
      evidence: "Stock and transfer ledger; piece geometry/density records; receiver receipts"
    - id: complete_period
      applies_to: "all nodes"
      requirement: "Cover the entire named lot from starting survey to final cleanup, including failed cuts, fitting rework, changeovers and all relevant receipts/stock changes. Disclose missing events, imputed quantities and uncertainty."
      evidence: "Timestamped node records and acceptance chronology"
    - id: shared_ownership
      applies_to: "shared electricity and cleanup"
      requirement: "Retain interval start/end, all consumers, weights, shares, ownership and bill inclusion. Record each physical event once even when multiple nodes reference its evidence."
      evidence: "Node meters; shared-event ledger; full consumer reconciliation"
    - id: provisional_range_use
      applies_to: "all screening ranges"
      requirement: "Provisional reasoned screens are neither default inventory values nor factual bounds, performance thresholds or automatic acceptance/rejection criteria. Investigate outliers against raw records; establish empirical guardrails from independent reviewed lots."
      evidence: "Explicit range metadata; external or independently reviewed future reference sample"
validation_rules:
  - rule_id: service_gate
    applies_to: "reference product"
    rule: "Check positive net A, actual pre-enclosure acceptance and declared slab/system qualifiers; output only accepted insulated cavity area. A manufactured insulation material flow is incompatible with this service gate."
    source_ids:
      - rockwool-thermal-frame-slab-installation-2025
  - rule_id: aperture_and_fit
    applies_to: "aperture_survey; fit_acceptance"
    rule: "Check actual clear-aperture measurements, gap/compression inspection and final disposition of every rejected aperture. Rework adds real burdens and cannot inflate A."
    source_ids:
      - rockwool-thermal-frame-slab-installation-2025
  - rule_id: transfer_and_stock
    applies_to: "slab_cutting; fit_acceptance"
    rule: "Reconcile paired frame_transfer and wool_transfer ids, units, quantities and states. Check stock terms, exclusive returns/external handovers, WIP and mass balance. Do not subtract returned mass twice across gross physical and diagnostic net accounts. Confirm mass_geometry_state and density_reference_state before each geometry-to-mass bridge. Require matching density_state_bridge_evidence or independent same-piece mass evidence linked by piece_id and accepted_piece_ids. Installed compression does not permit using relaxed nominal density by grade alone. Unknown mass conversion blocks that mass/closure claim, not the independently measured physical acceptance area."
    source_ids: []
  - rule_id: condition_validation
    applies_to: "retention_accessories; all conditional rows"
    rule: "Require actual activation evidence; documented absence permits zero, missing evidence is a data gap. Resolve actual accessory/packaging material and direct-release identities before final exchange creation."
    source_ids:
      - rockwool-thermal-frame-slab-installation-2025
  - rule_id: node_ownership
    applies_to: "all nodes"
    rule: "Check production-lot and period coverage, cut/fit rejection paths, cleanup ownership and shared-meter shares across all consumers. Reconcile shares to one and prevent repeated whole-site or supplier-included burdens."
    source_ids: []
  - rule_id: thermal_claims
    applies_to: "reference qualifiers"
    rule: "Check thickness, density and conductivity declaration conditions. A slab lambda or its thickness/lambda ratio cannot alone justify whole-wall thermal performance or building-life claims."
    source_ids: []
  - rule_id: range_validation
    applies_to: "all flow cards"
    rule: "Verify quantities against original records and declared algorithms. Explain provisional-screen outliers; do not replace missing records with a range midpoint or label these reasoned intervals observed data."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for the declared installation service; downstream process and lifecyclemodel projections retain the same boundary and accepted-area reference"
  downstream_use: "secondary_dataset; background_dataset, only when the supplied service scope and quality match the receiving study"
  allowed_use: "Site/period-specific friction-fit unfaced semi-rigid stone wool installation into equivalent accepted open wall-frame cavities with disclosed upstream inputs and downstream treatment ownership"
  excluded_use: "Generic all-insulation average; manufactured wool inventory; complete wall/building thermal performance; asbestos, glass-wool/foam/blown systems; frame construction, enclosure or exterior render"
  required_metadata: "PCR id/version; geography/site/lot/period; net-area and acceptance records; incoming frame condition; slab identity and grade; thickness/density/conductivity bases; manufacturer instruction edition; equipment/electricity mix; conditional accessories; stock and transfer ledger; waste receivers/routes; upstream and downstream dataset ownership"
  required_quality_disclosure: "Verified and unresolved identities; measured versus calculated records; coverage and data gaps; conversion uncertainty; provisional screening status; rework and rejected work; shared allocations; excluded transport/treatment/capital responsibilities; suitability limits"
  update_trigger: "Changed slab system, frame interface, installation/retention route, handover gate, source instructions, electricity or waste route, evidence quality or accepted identity changes"
data_sources:
  - id: "rockwool-thermal-frame-slab-installation-2025"
    type: "handbook"
    reference: "ROCKWOOL, Thermal Frame Slab 32 installation guide, issue 23.10.2025, version 2.00, pages 1–3. https://www.rockwool.com/syssiteassets/rw-uk/downloads/installation-guides/thermal-frame-slab-32-installation-guide.pdf"
    used_for: "Current route evidence: frame checks, actual aperture measurement, cutting and friction fitting, gap inspection and vacuum cleanup; named-product dimensions and allowances remain product-specific, not universal quantity defaults"
  - id: "epa-eiip-sample-source-flow"
    type: "official_guidance"
    reference: "US EPA, EIIP Volume II Chapter 2, Preferred and Alternative Methods for Estimating Air Emissions from Boilers, printed p. 2.4-13 dated 8 January 2001, equation 2.4-12; https://19january2021snapshot.epa.gov/sites/static/files/2015-08/documents/ii02.pdf"
    used_for: "Supports only the distinction between sampler gas volume and full source flow when deriving emitted mass from concentration. Boiler/stack methods, factors and example values are not adopted for installation dust or diffuse releases; actual source-specific method and event coverage remain required."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:3902854d25db581bb23186d889f005167b4a3c3b9ed017d73b0d1a0a371a4f6c"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5583"
      family: "system_boundary"
      span:
        start:
          offset: 5583
          line: 58
          column: 1
        end:
          offset: 30143
          line: 398
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | An accepted stable dry open wall frame with accessible cavities, and supplied unfaced semi-rigid stone wool slabs of declared grade; frame defects and hazardous materials have been resolved outside this service |\n| starting_condition_role | Existing-frame component interface plus separately supplied insulation material input; the frame is not manufactured in the foreground |\n| product_classification_scope | Only the stated narrower installation service within cpc:3.0:54652 |\n| recursive_input_rule | A purchased installation service in the same category is an externally supplied service with supplier scope and quantities disclosed; use its upstream dataset and avoid reproducing its surveyed, cut or fitted activities in this foreground package |\n| upstream_dataset_requirement | Link actual supplied slabs, electricity and actual accessories to compatible upstream datasets; frame construction remains with the incoming frame owner. Preserve transport and offsite waste-treatment links and disclose their model ownership. No automatic burden-free input or avoided-product credit is implied. |\n| disclosure | Site, work-lot boundary, accepted starting state, excluded corrective work, material specification, tool and shared-meter ownership, transport/treatment responsibility, actual retention condition, internal transfers and acceptance gate |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| starting_frame | aperture_survey | Accept the existing frame condition and measure clear apertures; substantial repairs or construction are separate supplied activities. Record their owner before beginning the covered service. | `rockwool-thermal-frame-slab-installation-2025` |\n| cut_and_fit | slab_cutting; fit_acceptance | Include measuring, cutting, friction fitting, gap inspection and local cleanup. Follow actual selected-system instructions; no universal cutting allowance, framing centres or fixing quantity is prescribed. | `rockwool-thermal-frame-slab-installation-2025` |\n| component_integration | fit_acceptance | Integrate cut stone wool with the measured existing-frame component interface. The frame transfer carries geometric and acceptance state only; frame manufacture stays upstream. Joining is friction fitting; retention accessories are conditional on actual system requirements. Do not invent mixing, chemical reaction or a single-component assembly. | `rockwool-thermal-frame-slab-installation-2025` |\n| waste_and_release | slab_cutting; fit_acceptance | Keep collected offcuts and vacuum dust as waste under custody, with named receiver and treatment link. Report direct airborne release only from independent composition/size/medium evidence; do not turn collected waste into an elementary emission. | `rockwool-thermal-frame-slab-installation-2025` |\n| shared_services | all processes | Attribute actual shared electricity for survey lighting, cutting, fitting or vacuuming using meter/event and consumer records for the same period. Every meter or shared service has one accounting owner. Include actual shared access-platform, scaffold or rented-equipment availability services with named asset, all consuming nodes and contract periods; use actual h records and documented beneficiary shares. Declare equipment/access capital treatment and supplier-service inclusions. | |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Accepted dry open frame cavity interface (`supplied_frame_interface`)\n\nProcess / prospective direction / type: `aperture_survey` / `inputs` / `product`.\n\nExisting component interface; upstream frame burden remains with supplier. State: Structurally sound dry open frame accepted before insulation. Destination: aperture_survey. Condition: Always for the declared route.\n\n- Collection subject: Accepted dry open frame cavity interface\n- Flow property / unit: Area / m2\n- Amount rule: survey_area / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_survey_area`\n- Unverified optional screening aid: Provisional reasoned screening interval. Area ratios screen unexpectedly large rejected or unaccepted work and mismatched handoff records; values outside this broad provisional screen require explanation rather than exclusion.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 5\n  - Unit: m2\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Shared access and rented equipment service (`survey_shared_access_service`)\n\nProcess / prospective direction / type: `aperture_survey` / `inputs` / `product`.\n\nConditional supplied shared equipment/access service, actual asset and service contract resolved from foreground records. Only when an actual rented or externally supplied access/equipment service is used by this node; actual service type and included energy/capital responsibilities must be declared. The time basis is contracted availability, not assumed active tool time. Resolve each actual service and supplier dataset before final exchanges; no universal platform/scaffold identity is asserted.\n\n- Collection subject: Actual shared access platform, scaffold or rented equipment availability service\n- Flow property / unit: Duration / h\n- Amount rule: survey_shared_hours / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_survey_shared_service`\n- Unverified optional screening aid: Provisional reasoned service-time screen. A wide provisional reasoned time screen accommodates absent rental, irregular access and long availability periods; it is not a recommended use time, cost proxy, empirical bound or default. Investigate outliers against contract and consumer records.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 100\n  - Unit: h\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Measured ready open frame cavity interface (`prepared_frame_interface`)\n\nProcess / prospective direction / type: `aperture_survey` / `outputs` / `product`.\n\nMeasured existing-frame component handoff; not manufactured frame output. State: Accepted frame with measured clear apertures; no insulation yet. Destination: fit_acceptance via transfer frame_transfer. Condition: Always for the declared route.\n\n- Collection subject: Measured ready open frame cavity interface\n- Flow property / unit: Area / m2\n- Amount rule: ready_area / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_survey_area`\n- Unverified optional screening aid: Provisional reasoned screening interval. Area ratios screen unexpectedly large rejected or unaccepted work and mismatched handoff records; values outside this broad provisional screen require explanation rather than exclusion.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 5\n  - Unit: m2\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Shared access and rented equipment service (`cut_shared_access_service`)\n\nProcess / prospective direction / type: `slab_cutting` / `inputs` / `product`.\n\nConditional supplied shared equipment/access service, actual asset and service contract resolved from foreground records. Only when an actual rented or externally supplied access/equipment service is used by this node; actual service type and included energy/capital responsibilities must be declared. The time basis is contracted availability, not assumed active tool time. Resolve each actual service and supplier dataset before final exchanges; no universal platform/scaffold identity is asserted.\n\n- Collection subject: Actual shared access platform, scaffold or rented equipment availability service\n- Flow property / unit: Duration / h\n- Amount rule: cut_shared_hours / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_cut_shared_service`\n- Unverified optional screening aid: Provisional reasoned service-time screen. A wide provisional reasoned time screen accommodates absent rental, irregular access and long availability periods; it is not a recommended use time, cost proxy, empirical bound or default. Investigate outliers against contract and consumer records.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 100\n  - Unit: h\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Reusable stone wool leaving cutting custody (`cut_reusable_exit`)\n\nProcess / prospective direction / type: `slab_cutting` / `outputs` / `product`.\n\nIntact returns or separately recorded usable third-party handover. State: Uninstalled reusable stone wool; destination and grade retained. Destination: Supplier return or external reuse recipient; mutually exclusive event tags. Condition: Only if reusable material actually leaves custody; closing stock is not an exit.\n\n- Collection subject: Reusable stone wool leaving cutting custody\n- Flow property / unit: Mass / kg\n- Amount rule: cut_reusable_exit_mass / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_cut_material`\n- Unverified optional screening aid: Provisional reasoned screening interval. The interval is deliberately broad because geometry, reusable offcuts and contamination differ by lot; investigate outliers and replace this provisional screen with independently reviewed evidence.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 100\n  - Unit: kg\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Separated slab packaging waste by actual material (`cut_packaging_waste`)\n\nProcess / prospective direction / type: `slab_cutting` / `outputs` / `waste`.\n\nConditional material-resolved packaging waste umbrella. State: Actual film, board or other packaging separated without wool double counting. Destination: Actual waste receiver by material and treatment route. Condition: Only actual discarded packaging; retained returnable packaging remains stock.\n\n- Collection subject: Separated slab packaging waste by actual material\n- Flow property / unit: Mass / kg\n- Amount rule: cut_packaging_mass / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_cut_material`\n- Unverified optional screening aid: Provisional reasoned screening interval. The interval is deliberately broad because geometry, reusable offcuts and contamination differ by lot; investigate outliers and replace this provisional screen with independently reviewed evidence.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 10\n  - Unit: kg\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Reported stone wool airborne particles by substance and size (`cut_airborne_particles`)\n\nProcess / prospective direction / type: `slab_cutting` / `outputs` / `elementary`.\n\nConditional direct release umbrella. State: Measured species or mineral composition, particle-size basis and air receiving medium. Destination: Air compartment actually reported. Condition: Only independently quantified direct releases with substance or mineral composition, particle size and receiving medium evidence.\n\n- Collection subject: Reported stone wool airborne particles by substance and size\n- Flow property / unit: Mass / kg\n- Amount rule: cut_air_mass / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_cut_air`\n- Unverified optional screening aid: Provisional reasoned screening interval. This broad provisional screen flags unusual release estimates; it is not a measured emission factor or a health limit. Captured dust is custodial waste and excluded here.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 1\n  - Unit: kg\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Measured ready open frame cavity interface (`ready_frame_feed`)\n\nProcess / prospective direction / type: `fit_acceptance` / `inputs` / `product`.\n\nExisting frame component input paired to frame_transfer. State: Same surveyed accepted open cavity; no manufacture or duplicate upstream frame burden. Destination: fit_acceptance. Condition: Always for the declared route.\n\n- Collection subject: Measured ready open frame cavity interface\n- Flow property / unit: Area / m2\n- Amount rule: frame_feed_area / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_fit_material`\n- Unverified optional screening aid: Provisional reasoned screening interval. Area ratios screen unexpectedly large rejected or unaccepted work and mismatched handoff records; values outside this broad provisional screen require explanation rather than exclusion.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 5\n  - Unit: m2\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Actual manufacturer-required insulation retention accessories (`retention_accessories`)\n\nProcess / prospective direction / type: `fit_acceptance` / `inputs` / `product`.\n\nConditional actual material-resolved accessory umbrella. State: Actual accessory chemistry, form and fastening role recorded. Destination: Retained insulation assembly. Condition: Only when the selected slab/system instructions and actual installation require retention; never presumed for ordinary friction fitting.\n\n- Collection subject: Actual manufacturer-required insulation retention accessories\n- Flow property / unit: Mass / kg\n- Amount rule: accessory_mass / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_fit_material`\n- Unverified optional screening aid: Provisional reasoned screening interval. Zero is usual where friction fit needs no fixings; the broad provisional screen permits evidenced special retention requirements without prescribing a material or dose.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 10\n  - Unit: kg\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Shared access and rented equipment service (`fit_shared_access_service`)\n\nProcess / prospective direction / type: `fit_acceptance` / `inputs` / `product`.\n\nConditional supplied shared equipment/access service, actual asset and service contract resolved from foreground records. Only when an actual rented or externally supplied access/equipment service is used by this node; actual service type and included energy/capital responsibilities must be declared. The time basis is contracted availability, not assumed active tool time. Resolve each actual service and supplier dataset before final exchanges; no universal platform/scaffold identity is asserted.\n\n- Collection subject: Actual shared access platform, scaffold or rented equipment availability service\n- Flow property / unit: Duration / h\n- Amount rule: fit_shared_hours / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_fit_shared_service`\n- Unverified optional screening aid: Provisional reasoned service-time screen. A wide provisional reasoned time screen accommodates absent rental, irregular access and long availability periods; it is not a recommended use time, cost proxy, empirical bound or default. Investigate outliers against contract and consumer records.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 100\n  - Unit: h\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Reusable stone wool leaving fitting custody (`fit_reusable_exit`)\n\nProcess / prospective direction / type: `fit_acceptance` / `outputs` / `product`.\n\nConditional reusable material boundary exit. State: Uninstalled or removed clean reusable pieces with grade and recipient record. Destination: Supplier or external reuse recipient; no internal transfer represented as exit. Condition: Only actual external exit; same-lot re-fitting remains an internal loop.\n\n- Collection subject: Reusable stone wool leaving fitting custody\n- Flow property / unit: Mass / kg\n- Amount rule: fit_reusable_mass / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_fit_material`\n- Unverified optional screening aid: Provisional reasoned screening interval. The interval is deliberately broad because geometry, reusable offcuts and contamination differ by lot; investigate outliers and replace this provisional screen with independently reviewed evidence.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 100\n  - Unit: kg\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Conditional retention-accessory and accessory-packaging waste by material (`fit_accessory_packaging_waste`)\n\nProcess / prospective direction / type: `fit_acceptance` / `outputs` / `waste`.\n\nOnly when actual retention accessories or their packaging produce discarded material. Separate each actual accessory composition and packaging material with mass, custodian and destination; reusable returns and closing stock are excluded. This conditional umbrella excludes wool waste and direct environmental release. Actual accessory and packaging composition/state remain unknown; expand material-resolved exchanges before publication.\n\n- Collection subject: Conditional retention-accessory and accessory-packaging waste by material\n- Flow property / unit: Mass / kg\n- Amount rule: accessory_waste_total_mass / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_fit_material`\n- Unverified optional screening aid: Provisional reasoned screening interval. The wide provisional mass screen permits conditional retention/packaging differences and absence; it is not an expected loss rate, default or factual upper limit. Investigate actual records and replace with independent reviewed evidence.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 10\n  - Unit: kg\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Reported fitting airborne particles by substance and size (`fit_airborne_particles`)\n\nProcess / prospective direction / type: `fit_acceptance` / `outputs` / `elementary`.\n\nConditional direct release umbrella. State: Measured species or mineral composition, particle-size basis and air receiving medium. Destination: Air compartment actually reported. Condition: Only independently quantified direct releases with substance or mineral composition, particle size and receiving medium evidence.\n\n- Collection subject: Reported fitting airborne particles by substance and size\n- Flow property / unit: Mass / kg\n- Amount rule: fit_air_mass / A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per 1 m2 reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_fit_air`\n- Unverified optional screening aid: Provisional reasoned screening interval. This broad provisional screen flags unusual release estimates; it is not an emission factor or health limit. Vacuum-collected particles belong to fit_wool_waste.\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 1\n  - Unit: kg\n  - Basis: per 1 m2 reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n"
