      collection_method: "Use direct species/medium measurement or valid actual activity-factor/composition-fate evidence; retain distinction between burned-fuel activity and upstream fuel supply and prevent incident/routine overlap."
      unit: "kg"
      frequency: "Each actual event and stock/acceptance reconciliation"
