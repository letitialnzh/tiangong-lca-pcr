  calculation_rules:
    - id: normalize_actual
      applies_to: "prepreg_length; prepreg_area; prepreg_count; prepreg_mass; filler_components; primer_components; ancillary_mass; ancillary_length; ancillary_area; ancillary_count; water_supply; process_medium; electricity; fuel_supply; freight; bounded_provider; shared_assets; usable_return_mass; usable_return_length; usable_return_area; usable_return_count; repair_wastes; identified_releases"
      rule: "Normalized quantity = actual attributable native quantity / N; N = unique finally accepted defect IDs in declared campaign. Never divide by attempts, wraps, layers or unaccepted defects."
      inputs:
        - "Actual primary quantities"
        - N
        - "linked cp for each row"
      output: "Per 1 item reference repair quantities"
      source_ids: []
    - id: stock_attribution
      applies_to: "prepreg_length; prepreg_area; prepreg_count; prepreg_mass; filler_components; primer_components; ancillary_mass; ancillary_length; ancillary_area; ancillary_count; water_supply; process_medium; fuel_supply"
      rule: "Supply = opening attributable stock + external net-tare gross receipts - closing carried stock. Gross-with-outlets preserves matched usable return; consumed-only supply = supply - matched usable outward return, excluded once without return credit. Nonreturned waste/loss retains supply burden."
      inputs:
        - SKU
        - native_unit
        - opening
        - receipts
        - tare
        - closing
        - return
        - "outlet state"
      output: "Actual attributable supply by SKU and native unit"
      source_ids: []
    - id: component_reconciliation
      applies_to: "filler_components; primer_components"
      rule: "For each component, reconcile actual dosed mass to compatible mixed intermediate, cured-retained, mixed/unmixed waste and evidenced loss states; intermediates are nonadditive. Kit/component purchase views are exclusive; no guessed ratio."
      inputs:
        - "Component masses"
        - "actual approved ratio"
        - "batch states"
        - residues
        - "supply scope"
      output: "Component and mixed-state physical audit, not duplicate exchanges"
      source_ids: []
    - id: burn_activity
      applies_to: "fuel_supply; identified_releases"
      rule: "Burn activity = actual fuel burned; reconcile stock to burn + usable nonburned return + nonreturned waste + uncontained loss + closing stock with disjoint outlets. Upstream supply is not restricted to burn. Total spill is audit-only; closing recovered spill is not additional loss."
      inputs:
        - "Actual fuel stock/receipt/outlets"
        - "fuel grade"
        - "actual compatible factor"
      output: "Fuel supply and separate combustion activity"
      source_ids: []
    - id: freight_work
      applies_to: "freight"
      rule: "Freight work = sum of actual kg payload * actual km by owned leg with actual load/empty-leg allocation and coverage; avoid provider/supplier duplication."
      inputs:
        - leg_id
        - actual_payload
        - distance
        - load_share
        - empty_leg
        - coverage
      output: "kg*km before division by N"
      source_ids: []
    - id: asset_attribution
      applies_to: "shared_assets"
      rule: "Asset equivalents = job compatible measured driver / all-consumer complete-life driver; full-life scope includes manufacture + maintenance + replacements + EOL exactly once. Complete observed life or observed history + evidenced remainder/replacement/termination/EOL; retain uncertainty/sensitivity/update; missing coverage blocks finalization."
      inputs:
        - asset_id
        - "full-life scope"
        - "all consumer/period drivers"
        - "observed history"
        - "evidenced remainder"
        - replacements
        - EOL
      output: "Attributable full-life asset equivalents before division by N"
      source_ids: []
    - id: medium_reconciliation
      applies_to: "process_medium"
      rule: "Use disjoint whole-medium final outlets: opening + external_supply = closing + usable_outward_return + consumed_transformed + collected_waste + uncontained_loss. Closing includes all retained/recovered stock. Captured/reinjected and used/dosed quantities are intermediate audit views, not extra final outlets; vented is a subset of uncontained_loss, not an additional outlet. Never subtract capture plus reinjection/return/closing, or vented plus loss, twice. Job-attributed medium upstream supply and species/medium elementary releases remain separate nonadditive views."
      inputs:
        - opening
        - external_supply
        - closing
        - usable_outward_return
        - consumed_transformed
        - collected_waste
        - uncontained_loss
        - "actual state/composition records"
      output: "Disjoint whole-medium physical balance before normalization; intermediate audits are nonadditive"
      source_ids: []
    - id: species_release
      applies_to: "identified_releases"
      rule: "Species release = directly measured identified species mass to actual medium OR actual compatible activity * matched factor with composition/fate/capture treatment. Whole-medium physical views are nonadditive; do not infer species or release from residual/SDS/No VOCs."
      inputs:
        - "Actual species/medium"
        - "measured release or compatible activity/factor/composition/fate"
        - "routine/incident owner"
      output: "Identified species mass before division by N"
      source_ids: []
  data_quality_requirements:
    - id: complete_gate
      applies_to: "accepted_repair"
      requirement: "Preserve defect survey, engineered design, technician qualification, approved instruction version, pressure/operating state, preparation/lay-up/full-cure/test evidence and signed acceptance."
      evidence: "cp_accepted_repair"
    - id: complete_inventory
      applies_to: "all inventory rows"
      requirement: "Collect complete campaign from setup to final closure including failed work and all provider-paid resources; document absence, gaps and uncertainty rather than zero-filling."
      evidence: "Event and ownership register / 事件及责任方登记"
    - id: state_and_native
      applies_to: "all inventory rows"
      requirement: "Retain SKU native unit, calibration, net tare, batch/component states, return condition/destination and actual state-specific conversion evidence."
      evidence: "Supplier and meter records / 供应商及计量记录"
    - id: asset_complete_life
      applies_to: "shared_assets"
      requirement: "Retain all-consumer full-life driver, observed history plus any evidenced remainder and replacement/termination/EOL, uncertainty sensitivity and update date. No arbitrary lifespan."
      evidence: "cp_shared_assets"
    - id: identity_and_factors
      applies_to: "all inventory rows"
      requirement: "Verify concrete flow/support identities at dataset production; identify exact factor source/version/activity/state/geography/species/medium where used and report support gaps separately."
      evidence: "Identity and factor evidence / 身份及因子证据"
validation_rules:
  - rule_id: eligibility_and_gate
    applies_to: "accepted_repair"
    rule: "Verify retained long-distance carbon-steel non-leaking external metal loss and approved design/instruction; block accepted output for ineligible defect, missing qualification, incomplete full cure, failed required test or unsigned acceptance."
    source_ids:
      - csnri-xt-ps-0625
  - rule_id: count_denominator
    applies_to: "all inventory rows"
    rule: "N must be positive, unique finally accepted defect IDs with the same declared campaign/qualifiers; compare all normalized quantities against N and prevent layer/roll/attempt duplication."
    source_ids: []
  - rule_id: native_stock_reconcile
    applies_to: "all inventory rows"
    rule: "Check SKU/unit-exclusive supply/return views, complete opening-receipt-closing-outlet reconciliation, prepreg resin inclusion, kit/component exclusivity, component dosing and installed/retained versus waste/release states; unresolved balance blocks finalization."
    source_ids: []
  - rule_id: run_rework_linkage
    applies_to: "composite_repair"
    rule: "Check batch/event/period links for setup, cleaning, changeover, failed material removal, reapplication, recure and retest; no rejected repair may enter N or leave without a declared path."
    source_ids: []
  - rule_id: asset_period_coverage
    applies_to: "shared_assets"
    rule: "Check every consumer and lifecycle phase/period including remainder/replacements/termination/EOL, compatible driver and complete denominator with sensitivity/update. Missing coverage or duplicate manufacture/maintenance/rental/provider scope blocks finalization."
    source_ids: []
  - rule_id: species_fate
    applies_to: "identified_releases"
    rule: "Check substance/species and receiving medium, routine/incident owner, actual measurement or matched activity-factor/composition-fate, fuel burn separation and captured/returned/waste exclusions. No VOCs/SDS/stock residual cannot establish zero or identity."
    source_ids: []
  - rule_id: range_scope
    applies_to: "all inventory rows"
    rule: "Require actual role-specific Range evidence before final quantity. Brochure temperatures, ply/hardness/cure times and mixed-technology case totals are not generic consumption/yield or acceptance defaults. Set time is not full cure."
    source_ids:
      - csnri-xt-ps-0625
  - rule_id: exchange_readiness
    applies_to: "all inventory rows"
    rule: "Every final exchange requires actual concrete verified identity, support property/unit and primary quantity/coverage evidence. Conditional actual absence may be documented; unknown is incomplete. Automated target checks alone do not verify identities or publication readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projections of the accepted bounded service"
  allowed_use: "Actual matching retained steel long-distance external non-leaking metal-loss prepreg repair with disclosed engineered qualifiers, complete job inventory and gate"
  excluded_use: "Universal wrap recipe or repair lifespan; leaking/internal/crack/dent repair; clamp/sleeve; replacement/new pipeline or later transport; avoided replacement credit"
  required_metadata: "Host and defect/design ID; location/date; system/instruction/SKUs; pressure/medium; geometry/lay-up; acceptance; N; stock/view and ownership; period/asset scope; conversions and source versions"
  required_quality_disclosure: "Actual data coverage, calibration, Range evidence, lifecycle/provider completeness, uncertainty/sensitivity, exact flow/support and factor readiness, missing records and conditional absence"
  update_trigger: "Changed defect/design/system/instruction or acceptance gate; actual new SKU/provider identity; stock/fate corrections; new asset history/remainder/replacement/termination/EOL or factors; changed representative job mix"
data_sources:
  - id: "un-cpc-3-2025"
