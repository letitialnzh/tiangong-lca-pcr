      collection_method: "Measure actual outward return and recipient acceptance; match to the same SKU/unit supply ledger and gross-with-outlets or consumed-only view exactly once."
      unit: "item"
      frequency: "Each actual event and stock/acceptance reconciliation"
      temporal_coverage: "Complete campaign including setup/cleaning/changeover/rework; complete asset life for shared_assets"
      site_scope: "Declared pipeline repair campaign and all attributable provider/asset consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated measurement; primary records; ownership and gate/fate reconciliation; actual role-specific Range evidence"
