boundary_abstraction:
  declared_starting_condition: "Existing exposed supported eligible pipeline defect and retained contents/support, with actual pressure/operating state and approved current design; no excavation or new pipe manufacture"
  starting_condition_role: "Retained host state interface for the bounded repair treatment"
  product_classification_scope: "Only the declared prepreg external metal-loss repair subset within long-distance pipeline construction services"
  recursive_input_rule: "An actual prior same-category repair is disclosed as retained state or an independently bounded purchased service with exact scope; do not recursively repurchase this job or the whole pipeline"
  upstream_dataset_requirement: "Actual compatible supplied prepreg inclusive of resin, component/kit scope, ancillary inputs, attributable lost/consumed medium, utilities/fuel, freight, bounded providers, complete-life assets and actual waste treatment; one owner per covered scope"
  disclosure: "Host/defect/design/system state; contractor/provider ownership; campaign, batch, stock and asset lifecycle periods; actual exclusions, quantities, conversions, gaps, uncertainty and handover evidence"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted engineered external metal-loss composite wrap repair of retained long-distance steel pipeline"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "Unique defect/design ID"
    - "overland long-distance function"
    - "carbon-steel grade/diameter/wall"
    - "non-leaking external metal-loss geometry/eligibility"
    - "exposed supported host"
    - "actual medium/pressure/temperature state"
    - "system/SKU/instruction"
    - "wrap length/width/plies/overlaps/directions"
    - surface
    - "cure and test results"
    - "technician qualification"
    - "acceptance date"
    - "campaign/asset periods and coverage"
reference_flows:
  []
measurement_rules:
  - id: accepted_count
    applies_to: "accepted_repair"
    required_property_ref:
      name: "Count"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "N = unique finally accepted defect repairs; N > 0. Do not count rolls, layers, passes, attempts or unaccepted defects. Record diameter, wall, defect and wrap geometry as qualifiers, not a mass denominator."
  - id: native_unit_ledgers
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual native property"
      uuid: ""
    required_unit: "Actual compatible unit"
    rule: "Preserve each SKU native Length, Area, Count or Mass and outward return in the same unit. Only use independently evidenced compatible conversion with actual width/contents/density/state; never force native returns to mass."
  - id: paired_component_state
    applies_to: "filler_components; primer_components"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Purchased kit/component attribution, dosed component masses, mixed intermediate activity, cured-retained mass and residue are distinct nonadditive ledgers. Prepreg already contains PU resin."
  - id: medium_species_state
    applies_to: "process_medium; identified_releases"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep whole-medium stock/capture/reinjection/test ledger separate from identified species/medium elementary exchanges; actual pressure-temperature-composition evidence is required for volume conversion."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: composite_repair
    name: "Integrated engineered prepreg composite repair"
    inclusion: "required"
    inclusion_condition: "Eligible retained exposed supported non-leaking external metal-loss defect and approved engineered system"
    role: "Job/defect batch treatment; qualification/design, actual pressure-state controls, preparation, component dosing, activation/lay-up, full cure, inspection/testing, cleaning and repeat-work loop with declared waste/return/release exits"
    quantitative_reference: "1 item accepted_repair"
