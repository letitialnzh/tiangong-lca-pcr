    used_for: "Factory glass/PU prepreg, moisture cure, filler/primer/prepreg system roles and conditional technical data only. Set/cure table, ply thickness, hardness and marketing compliance are not universal job quantities or field acceptance."
  - id: "csnri-xt-product-page"
