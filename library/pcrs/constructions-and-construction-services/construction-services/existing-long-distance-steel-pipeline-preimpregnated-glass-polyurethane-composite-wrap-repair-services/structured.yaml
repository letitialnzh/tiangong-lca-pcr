    reference: "UN Statistics Division, CPC Version 3.0 explanatory notes (30 June 2025), code 54241; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
