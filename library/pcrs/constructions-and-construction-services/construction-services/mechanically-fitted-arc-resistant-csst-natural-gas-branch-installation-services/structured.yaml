        []
  - id: rough_in_test
    label: "Isolated rough-in pressure test, corrections and handover"
    inputs:
      product:
        - row_id: test_branch
          role: "Assembled isolated capped CSST branch awaiting rough-in test"
          name: "Assembled isolated capped CSST branch awaiting rough-in test"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "Internal receipt from assembled_branch uses the same transfer and branch identifiers, state and count. Failed tests route the branch back to branch_assembly for documented correction and retest; no new upstream branch supply is invented on each loop. Range evidence need: Actual paired custody/transfer and defect logs are required; accepted final counts are not a substitute for intermediate tracking."
          amount:
            expression: "Actual received branch count by unique handoff identifier, reconciled with assembly output and unaccepted work in progress."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
