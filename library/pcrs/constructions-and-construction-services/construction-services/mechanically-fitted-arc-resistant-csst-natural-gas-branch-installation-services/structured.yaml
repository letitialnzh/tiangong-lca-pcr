          name: "Actual non-corrosive leak-check solution"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Record the actual compatible leak-check formulation at its purchased or prepared concentration. Distinguish purchased diluted product from separately mixed water/stock; count each preparation ingredient once. Range evidence need: Require supplier composition/concentration and gross issue/stock records or weighed use; guide recommendation establishes compatibility, not kg per test."
          amount:
            expression: "Actual gross issued formulation mass by batch and test/correction cycle; separately record consumed amount, real outward usable return and retained closing stock without double netting."
