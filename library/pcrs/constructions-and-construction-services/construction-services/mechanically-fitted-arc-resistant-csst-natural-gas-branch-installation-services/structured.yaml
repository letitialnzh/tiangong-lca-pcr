boundary_abstraction:
  declared_starting_condition: "Approved actual indoor route/design and accepted host; upstream source isolated from fuel gas, downstream appliances absent/disconnected; supplied compatible system components at declared supply gates"
  starting_condition_role: "Host/design/isolation prerequisites with documented ownership; unchanged building stock excluded, new installation-attributable modification included"
  product_classification_scope: "Gas-conducting branch rough-in service within CPC54640; excludes heating/ventilation and later operational work"
  recursive_input_rule: "Do not recurse into the same installation service for internal branch handoffs or corrections. Purchased subcontract work has declared scope and one upstream burden owner."
  upstream_dataset_requirement: "Actual finished jacketed CSST, fittings, support/protection/bonding and consumables with supplier manufacturing/packaging coverage; actual tool/test/transport provision and electricity; unresolved identities resolved before final exchange production"
  disclosure: "Actual design, host, route, supplied states, material custody, test and bonding scope, provider exclusions, shared assets/periods and remaining commissioning responsibilities"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted isolated pressure-tested indoor natural-gas CSST branch rough-in installation service"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "branch id/endpoints"
    - "actual indoor route/segment lengths/diameters"
    - "manufacturer/system/jacket/fitting revisions"
    - "design gas/pressure/capacity"
    - "applicable jurisdiction and approved design"
    - "support/protection/bonding scope"
    - "host alterations"
    - "installer qualifications"
    - "test medium/protocol/conditions/results"
    - "inspection and handover date"
    - "custody and remaining commissioning owner"
reference_flows:
  []
measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Only one complete uniquely identified accepted branch is 1 item. Metres, fittings, outlets and repeated tests are configuration/activity evidence, not additional reference outputs; do not compare different branch configurations as equivalent without disclosure."
  - id: composite_mass
    applies_to: "jacketed_csst"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep jacketed finished composite mass distinct from bare steel and packaging. Actual diameter-specific mass per length or calibrated composite weighing is required; length alone does not establish kg."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: branch_assembly
    name: "Route, mechanically fit, support and protect the branch"
    inclusion: "required"
    inclusion_condition: "Always; conditional material/service exchanges follow actual work"
    role: "Assemble independent jacketed tubing, fittings/caps, supports/protection and applicable bonding; output unaccepted isolated branch to rough_in_test; receive failed branches for correction"
    quantitative_reference: "Actual unique assembled branches by transfer id"
  - id: rough_in_test
    name: "Isolated rough-in pressure test, corrections and handover"
    inclusion: "required"
    inclusion_condition: "Always; all failed cycles and retests remain attributable"
    role: "Receive assembled branch; isolate/cap, pressure-test/inspect, route failures back to branch_assembly; output accepted branch only after signed gate"
    quantitative_reference: "1 item accepted complete branch"
process_inventory:
  - id: branch_assembly
    label: "Route, mechanically fit, support and protect the branch"
    inputs:
      product:
        - row_id: jacketed_csst
          role: "Actual black arc-resistant jacketed CSST at supplier handover"
          name: "Actual black arc-resistant jacketed CSST at supplier handover"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Finished manufacturer-qualified jacketed corrugated stainless steel tubing enters the installation boundary, recorded by actual product revision, diameter, length and composite mass. Do not substitute bare stainless steel tube or discard the jacket burden. Range evidence need: Collect supplier or measured composite mass per length for the actual diameter/jacket, issued length, installation offcuts and batch variation; the guide has no universal kg per branch."
          amount:
            expression: "Actual gross issued mass attributable to the reference branch, retaining separate unused stock and outward returns."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_assembly_materials
              source_ids:
                - omegaflex-tracpipe-2026
            ranges: []
        - row_id: assembly_electricity
          role: "Actual assembly tool charging or direct electricity"
          name: "Actual assembly tool charging or direct electricity"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Conditional electricity for powered installation tools and actual charging crosses the boundary separately where not already covered by provider provision. Geography, supplier mix and voltage/use state follow actual metering and invoices. Range evidence need: Obtain meter/charger records, charge-state change, actual job allocation and provider scope; no assumed kWh per branch and Energy support must be resolved for final exchanges."
          amount:
            expression: "Actual metered or traceably allocated assembly electricity including charging losses; substantiate manual-only zero and provider coverage."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_assembly_resources
              source_ids:
                - omegaflex-tracpipe-2026
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: assembled_branch
          role: "Assembled isolated capped CSST branch awaiting rough-in test"
          name: "Assembled isolated capped CSST branch awaiting rough-in test"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "Internal handoff to rough_in_test preserves the actual branch identifier, endpoints and installed configuration. This is an unaccepted intermediate with no gas introduction, not the reference output or a separately sold appliance-ready system. Range evidence need: Use actual transfer and defect records; do not force intermediate counts to accepted-output counts when a branch is rejected or carried unfinished."
          amount:
            expression: "Actual number of identifiable branch handoffs; exclude repeated correction-loop transfers from new completed branch credit."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
