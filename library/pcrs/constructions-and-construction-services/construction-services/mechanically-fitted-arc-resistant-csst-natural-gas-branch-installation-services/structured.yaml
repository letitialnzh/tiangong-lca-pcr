allocation_rules:
  - rule_id: one_service_output
    applies_to: "all processes"
    rule: "One intended service output only; offcuts, usable returns and waste are not assumed co-products. Retain all correction/retest burdens with the eventual accepted branch; unresolved failures remain unfinished/rejected, not accepted. No avoided steel/gas production, recycling or operating savings credit."
    source_ids:
      - omegaflex-tracpipe-2026
  - rule_id: shared_attribution
    applies_to: "assembly_provision; test_provision; electricity"
    rule: "Use actual asset/service scope and complete consumer/activity logs to attribute burdens by causal time/use, transport activity or directly metered electricity for the declared service period. Reconcile allocated shares to the source total across both nodes and other jobs; apply once, never add a second component burden already included in a provider package."
    source_ids:
      - omegaflex-tracpipe-2026
  - rule_id: custody_balance
    applies_to: "material and residual rows"
    rule: "Reconcile opening stock plus gross receipts with installed stock, actual outward usable returns, dispatched waste, measured consumption/releases and retained closing stock. Closing stock carries declared burden forward and is not an outward exchange. Never net a return then count it again. Document treatment and reusable cap/cylinder custody without invented recovery credits."
    source_ids:
      - omegaflex-tracpipe-2026
  - rule_id: period_attribution
    applies_to: "assembly_provision; test_provision"
    rule: "For each actual asset identify provision/manufacture period, each use/upkeep period and consumer, replacement event and termination/removal duty. Assign production and terminal shares with actual complete service-life/use evidence, separately charge job use and upkeep, and reconcile all periods/consumers to source totals. Record provider-covered phases; do not charge full production again on each job, shift an unowned terminal duty out of the ledger or double count a replacement. The accepted first branch cycle remains the product denominator; no universal lifetime or annualization."
    source_ids:
      - omegaflex-tracpipe-2026
dataset_production:
  collection_protocols:
    - protocol_id: cp_assembly_materials
      process_id: "branch_assembly"
      flow_role: "Components, consumables, usable returns and waste"
      record_type: "Material issue/stock/custody record"
      raw_fields: "branch_id; part_id; system_revision; diameter; gross_receipt; opening_stock; issued_length; composite_mass; installed_mass; return_mass; waste_mass; closing_stock; receiver; provider_coverage"
      collection_method: "Trace actual approved bill of materials and batch/supplier masses; calibrate weighing; pair gross issues with installation/offcuts/returns/retained stock. Normalize actual gross lot-attributable inputs and separately record real outward usable returns and retained-stock carried-forward burden. Consumption is a disposition, never a second net-input convention."
      unit: "kg; m; item"
      frequency: "Each issue, installation, correction and outward transfer"
      temporal_coverage: "Initial receipt through final branch handover including corrections"
      site_scope: "Actual branch site, supplier and receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Bills, calibrated scales or traceable part masses; composition and custody; separate packaging coverage; balance residual and uncertainty"
    - protocol_id: cp_assembly_resources
      process_id: "branch_assembly"
      flow_role: "Shared tools/access/logistics, energy and characterized releases"
      record_type: "Meter, task and provider activity log"
      raw_fields: "branch_id; task_id; asset_id; service_scope; consumer_id; service_period; provision_period; use_period; upkeep_period; replacement_event; terminal_period; phase_owner; phase_burden; attribution_decision; use_time; life_activity; maintenance; removal_owner; meter_start; meter_end; supplier; load; distance; empty_leg; substance; medium; released_mass; uncertainty"
      collection_method: "Measure job electricity and physical service use; retain complete all-consumer and period totals; link manufacture/provision, use/upkeep, replacement and termination to actual periods and responsible owners; allocate causal share to branch_assembly without double counting test or supplier coverage; collect actual release method and medium."
      unit: "kWh; item; kg; h; km"
      frequency: "Each task, charge, transport leg and release event"
      temporal_coverage: "Declared provider service period and complete installation cycle"
      site_scope: "Actual branch and provider operations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meters/activity logs, supplier scope, complete consumer allocation, actual lifetime/service evidence and release detection/uncertainty"
    - protocol_id: cp_assembly_gate
      process_id: "branch_assembly"
      flow_role: "Untested internal branch transfer and corrections"
      record_type: "Branch/configuration transfer register"
      raw_fields: "branch_id; transfer_id; endpoints; segment_length; diameter; fitting_revision; support_protection; bonding_record; qualified_installer; defect_id; transfer_count; custody_time"
      collection_method: "Record unique isolated capped assembly and actual configuration; pair transfer_id with test receipt; carry failures/corrections and unfinished stock; reconcile each eventual accepted branch without counting repeated loops as new production."
      unit: "item; m"
      frequency: "Each initial handoff and correction loop"
      temporal_coverage: "Assembly through completed test handover"
      site_scope: "One actual declared indoor branch"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved design, part compatibility, installer qualification, route photos, applicable bonding acceptance and paired signed transfers"
    - protocol_id: cp_test_materials
      process_id: "rough_in_test"
      flow_role: "Medium, leak solution, rinse water, wastes and releases"
      record_type: "Test material/custody and physical balance log"
      raw_fields: "branch_id; cycle_id; medium_identity; composition; source_gate; isolated_volume; volume_unit; absolute_pressure; pressure_unit; temperature; temperature_unit; meter; delivered_mass; solution_id; concentration; rinse_mass; residual_mass; recovered_mass; waste_mass; substance; receiving_medium; receiver; outward_product_return; provider_internal_residual; retained_stock; intake_convention; uncertainty"
      collection_method: "Meter or validate actual medium mass from documented conditions and composition; retain all cycles, leaks/corrections and disposition; measure solution/rinse and actual residues; distinguish supplied versus ambient_air_intake elementary input versus test_medium external product input; pair real outward test_usable_returns and retained stock/provider-internal residual separately from environmental and waste custody; normalize complete attributable cycle quantities to this accepted reference branch. Retain the actual protocol volume, absolute-pressure and temperature units with each measured value and every state conversion; document gauge-to-absolute and temperature-scale conversion when applicable."
      unit: "kg; actual volume_unit; actual absolute pressure_unit; actual temperature_unit"
      frequency: "Each test, retest, rinse, collection and release"
      temporal_coverage: "First test preparation through final depressurization/cleanup and custody"
      site_scope: "Actual branch, supply and receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Authorized test protocol; calibration; density/state/model evidence; composition/SDS; complete mass/disposition balance and uncertainty"
    - protocol_id: cp_test_resources
      process_id: "rough_in_test"
      flow_role: "Test apparatus, drying, access and electricity"
      record_type: "Provider service, calibration and meter log"
      raw_fields: "branch_id; cycle_id; asset_id; calibration; service_scope; consumer_id; service_period; provision_period; use_period; upkeep_period; replacement_event; terminal_period; phase_owner; phase_burden; attribution_decision; use_time; life_activity; maintenance; drying_material; removal_owner; electricity; supplier; transport_leg; uncertainty"
      collection_method: "Read actual test instruments/compressor energy and drying consumption; retain manufacture/provision, use/upkeep, replacement and terminal period/event ownership and shared consumer totals, separate included service electricity/materials and allocate actual rough_in_test share once."
      unit: "item; kWh; kg; h; km"
      frequency: "Each setup/test/retest/cleanup and shared-service statement"
      temporal_coverage: "Complete testing cycle and declared provider service period"
      site_scope: "Actual site, provider and other documented consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration/service invoices, metered activity, complete allocation reconciliation and scope/drying/removal evidence"
    - protocol_id: cp_test_gate
      process_id: "rough_in_test"
      flow_role: "Internal receipt, test acceptance and final output"
      record_type: "Signed test, inspection and custody register"
      raw_fields: "branch_id; transfer_id; received_count; design_gas; design_pressure; design_capacity; jurisdiction; fitting_revision; medium; test_protocol; test_pressure; pressure_unit; test_duration; duration_unit; result; defect_id; retest_id; inspection; bonding; capped_isolated; accepted_count; commissioning_owner"
      collection_method: "Match receipt to assembled_branch; verify actual qualified installation, isolation/caps, approved test conditions, accessible inspection and applicable bonding. Close failures through branch_assembly and retest; count each complete qualified accepted circuit once and assign later commissioning to a named external scope. Retain the actual authorized protocol pressure and duration units with the measured test settings/results; do not infer a pressure or time default."
      unit: "item; actual pressure_unit; actual duration_unit"
      frequency: "Each receipt/test/retest and final signed handover"
      temporal_coverage: "Initial test receipt through final rough-in acceptance"
      site_scope: "One specified complete indoor branch"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved design/jurisdiction and current applicable guide, qualified installer, calibration, test/inspection signatures, closed defect chain and custody"
  calculation_rules:
    - id: reference_attribution
      applies_to: "all inventory rows"
      rule: "Record actual attributable exchange quantity per reference flow. For a pooled job retain accepted branch identifiers and a causal allocation supported by actual configuration/activity; do not divide blindly among unequal circuits."
      inputs:
        - "actual exchanges"
        - "unique accepted branch register"
        - cp_assembly_gate
        - cp_test_gate
        - "allocation evidence"
      output: "exchange quantity per qualified reference circuit"
      source_ids:
        - omegaflex-tracpipe-2026
    - id: material_reconciliation
      applies_to: "material and residual rows"
      rule: "Reconcile opening stock plus gross receipts against installed material, outward returns, dispatched waste, actual consumed/released quantity and retained stock; investigate residual against measurement uncertainty. Do not add internal transfers to external receipts."
      inputs:
        - cp_assembly_materials
        - cp_test_materials
      output: "audited material disposition and carried-forward burden"
      source_ids:
        - omegaflex-tracpipe-2026
    - id: test_medium_balance
      applies_to: "test_medium; ambient_air_intake; test_usable_returns; test_releases"
      rule: "Use traceable actual meter mass or justified conditions/composition conversion; reconcile medium input/intake with retained, recovered, waste-custody and substance-specific environmental disposition for every cycle. Retain absolute pressure and actual state evidence, not a universal ideal-gas factor."
      inputs:
        - cp_test_materials
        - "actual authorized medium and conversion method"
      output: "actual medium mass and disposition by substance/compartment"
      source_ids:
        - omegaflex-tracpipe-2026
  data_quality_requirements:
    - id: identity_configuration
      applies_to: "all rows"
      requirement: "Declare actual material/service identity, supplier/state and units; actual test medium and release species/compartments; resolve concrete UUID and support before final process exchanges."
      evidence: "Part records, provider scopes, composition and verified detail/support rows"
    - id: full_cycle
      applies_to: "all processes"
      requirement: "Include all initial installation, failed tests, corrections/retests, cleanup, logistics and reusable provision/removal responsibilities; unfinished work is explicitly reconciled."
      evidence: "Dated task/defect/custody log and complete consumer totals"
    - id: measurement_uncertainty
      applies_to: "all rows"
      requirement: "Report calibration/resolution, sampling, supplier mass variability, stock/balance residual, allocated shares and state conversion uncertainty. Missing evidence is a gap, not a numerical zero or arbitrary range."
      evidence: "Meter/scale certificates, bills, physical balances and documented uncertainty"
    - id: version_jurisdiction
      applies_to: "rough_in gate"
      requirement: "Use actual current applicable system/fitting instructions and qualified approved jurisdiction design; July2026 guide examples do not establish universal pressure, duration, spacing or capacity."
      evidence: "Dated guide/revision, approved plans, qualification, actual protocol/inspection and bonding record"
validation_rules:
  - rule_id: accepted_gate
    applies_to: "accepted_branch"
    rule: "Reject accepted credit unless the complete declared branch is isolated/capped and pre-gas, compatible and undamaged, supported/protected, applicable bonding verified, authorized test and accessible inspection passed, defects/retests closed and signed handover recorded."
    source_ids:
      - omegaflex-tracpipe-2026
  - rule_id: transfer_rework
    applies_to: "assembled_branch; test_branch"
    rule: "Pair internal transfer quantities and ids; link every failed pressure test to correction in branch_assembly and subsequent retest. No failed branch, duplicate loop or unfinished stock may inflate accepted output."
    source_ids:
      - omegaflex-tracpipe-2026
  - rule_id: inventory_coverage
    applies_to: "all inventory rows"
    rule: "Check every conditional card against actual tasks; expand umbrella materials/providers/substances into real exchanges. Gross materials, returns, closing stock, waste/washwater, medium disposition, energy and tool/transport scope reconcile once with uncertainty; blank evidence is not zero."
    source_ids:
      - omegaflex-tracpipe-2026
  - rule_id: bonding_test_specificity
    applies_to: "all processes"
    rule: "Require actual jurisdiction/system/fitting-specific protection, bonding and test evidence. AR jacket does not waive applicable bonding; no generic numerical pressure/time/support spacing, methane leakage, sealant dose or actual operational performance is inferred."
    source_ids:
      - omegaflex-tracpipe-2026
  - rule_id: scope_classification
    applies_to: "reference product"
    rule: "Use only the declared narrower gas-conducting rough-in category; no heat/ventilation installation, live-gas commissioning or full CPC54640 coverage assertion."
    source_ids:
      - un-cpc3-2025
  - rule_id: period_completeness
    applies_to: "assembly_provision; test_provision"
    rule: "Verify manufacture/provision-use/upkeep-replacement-termination period links and ownership, causal allocation across actual jobs/consumers, complete phase totals and no double attribution. Missing service-life/replacement/terminal evidence blocks finalization and cannot be hidden behind initial branch handover."
    source_ids:
      - omegaflex-tracpipe-2026
  - rule_id: medium_typing
    applies_to: "test_medium; ambient_air_intake; test_usable_returns; test_releases"
    rule: "Choose actual evidenced external product supply or onsite atmospheric elementary intake for each medium quantity, with compressor service/energy once. Pair disposition and substance/medium identity; real usable product returns have custody and burden evidence, whereas provider-internal cylinder residual is no second output."
    source_ids:
      - omegaflex-tracpipe-2026
published_dataset_profile:
