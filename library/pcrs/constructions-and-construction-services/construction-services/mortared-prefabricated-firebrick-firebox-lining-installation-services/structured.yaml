allocation_rules:
  - rule_id: single_service
    applies_to: "install_lining"
    rule: "Assign all attributable receipts, preparation, installation, cure/support/removal and correction burdens to accepted complete lining service. Unresolved rejects are not accepted output; failed attempts are retained in actual job attribution. No useful co-product is presumed."
    source_ids: []
  - rule_id: gross_stock
    applies_to: "panels; mortar; consumables; material_returns"
    rule: "Reconcile opening stock plus gross receipts with installed consumption, actual outward usable returns, wastes and closing stock by material/state. Retained closing stock carries its disclosed upstream burden forward and is not an outward exchange. Never net a return in input then subtract/count it again."
    source_ids: []
  - rule_id: rework_owner
    applies_to: "install_lining"
    rule: "Link each off-spec panel/adhesion/seam/void failure to its corrective loop or actual product return/waste exit and producing-node event. Preserve replacement, cleanup, support extension and repeat logistics burdens; no automatic recovery or avoided-product credit."
    source_ids: []
  - rule_id: shared_provision
    applies_to: "holders_tools; energy; logistics"
    rule: "For each reusable asset/provider, declare all job/period consumers and bounded provision service life, measured physical use driver and evidence. Allocate production/upkeep/removal/terminal provision once by target physical use over total compatible service capacity. State uncertainty and owner of future termination; supplier-included provision/energy/logistics must not be counted twice."
    source_ids: []
  - rule_id: period_allocation
    applies_to: "holders_tools; logistics"
    rule: "Record period-specific provision shares and their physical-use/capacity evidence for production, service-use, upkeep/replacement and terminal events. Reconcile target-job and other-consumer shares to the complete bounded provision lifecycle; count each event once across periods. No universal asset lifetime or annualization is imposed, and no initial cure/removal duty is transferred out of the lining acceptance gate."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "install_lining"
      flow_role: "component/consumable inputs and usable returns"
      record_type: "receipt_issue_return_stock"
      raw_fields: "job_id; material_id; part_id; supply_state; lot_id; opening_stock_kg; gross_receipt_kg; issue_kg; installed_kg; outward_return_kg; waste_kg; closing_stock_kg; burden_owner"
      collection_method: "Weigh or use traceable supplier batch masses; identify hearth/rear/sides and exact mortar supply state. Reconcile gross job ledger by material; distinguish return destination from retained stock. Attribute all actual correction inputs and retain closing-stock burden."
      unit: "kg"
      frequency: "Each receipt, issue, return, correction and closing count"
      temporal_coverage: "Entire initial cycle through holder removal and acceptance"
      site_scope: "One declared fireplace job and its suppliers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Balances and custody tickets; scale calibration; missing masses/state conversions and uncertainty; no double packaging burden"
    - protocol_id: cp_water
      process_id: "install_lining"
      flow_role: "supplied water"
      record_type: "task_meter_record"
      raw_fields: "job_id; purpose; provider; supply_state; water_mass_kg; measured_volume; measured_density; conversion_method; wastewater_kg; retained_water_kg"
      collection_method: "Weigh water or meter actual task volume and retain measured compatible conversion. Separate wetting/mixing/cleanup and supplier premix water; reconcile waste/retention without inventing evaporative emissions."
      unit: "kg"
      frequency: "Every task or task-separated meter interval"
      temporal_coverage: "All wetting, mixing and cleanup in initial cycle"
      site_scope: "Declared site supply and install_lining"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration; conversion/state basis; wastewater boundary; missing data and uncertainty"
    - protocol_id: cp_assets
      process_id: "install_lining"
      flow_role: "holder/tool/access provision"
      record_type: "asset_service_log"
      raw_fields: "job_id; asset_id; owner; provision_scope; other_consumer_jobs; service_periods; production_period; use_period; upkeep_replacement_period; terminal_period; event_period_id; period_share; service_life_capacity; actual_use_driver; target_use; total_use; maintenance; removal_authorization; removal_date; terminal_owner"
      collection_method: "Identify each holder/tool/access asset and all target/other job consumers across the declared provision life. Use measured compatible physical-use count or equipment-time share; assign full burden if single use. Cover production, upkeep, transport, deployment, retained cure support, removal and terminal responsibility once. Link actual input/service/event IDs to production, service-use, upkeep/replacement and terminal period IDs; record period-specific physical-use shares and reconcile all consumers without double attribution. Initial lining cure/removal stays in the job gate."
      unit: "item"
      frequency: "Deployment, cure release, removal and provision update"
      temporal_coverage: "Initial cycle plus declared asset provision service-life denominator"
      site_scope: "Target node and named other jobs/service periods"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset register; physical-use evidence; lifecycle supplier coverage matrix; capacity uncertainty; full share reconciliation"
    - protocol_id: cp_energy
      process_id: "install_lining"
      flow_role: "actual supplied energy"
      record_type: "meter_equipment_record"
      raw_fields: "job_id; equipment_id; carrier; provider; geography; meter_start; meter_end; attributable_energy; unit; included_provider_scope"
      collection_method: "Measure actual equipment energy by job and subtract only evidenced non-job activity. Preserve each actual carrier and its unit; do not infer energy from manual labour or separately add supplier-included fuel. Verify actual support chain before final exchanges."
      unit: "kWh"
      frequency: "Each powered task or metering interval"
      temporal_coverage: "Initial preparation through cleanup/removal"
      site_scope: "Actual foreground equipment and supply"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter/provider evidence; allocation coverage; exact Energy support gap; uncertainty and missing tasks"
    - protocol_id: cp_logistics
      process_id: "install_lining"
      flow_role: "attributable freight provision"
      record_type: "trip_load_record"
      raw_fields: "job_id; trip_id; provider; origin; receiver; distance_km; load_mass_t; load_share; vehicle; included_fuel; asset_provision_scope"
      collection_method: "Use actual dispatch/receipt and route records for delivery, replacement, returns, assets and collected wastes. Derive actual provider-unit service from physical loads and distance; document vehicle/fuel coverage and one event owner."
      unit: "t*km"
      frequency: "Every attributable trip leg"
      temporal_coverage: "Receipt through final removal/collection"
      site_scope: "Declared site and actual supply/receiver routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable trip/load evidence; sharing denominator; provider coverage; support-unit verification and uncertainty"
    - protocol_id: cp_acceptance
      process_id: "install_lining"
      flow_role: "reference service"
      record_type: "signed_lining_acceptance"
      raw_fields: "job_id; host_model; instruction_revision; compatibility; panel_part_ids; mortar_id; seam_void_layout; cure_evidence; support_owner; removal_authorization; holder_removed; defects_closed; accepted_count; handover_owner"
      collection_method: "Inspect the complete actual hearth/rear/two-side configuration and compatible mortar against matching current instructions. Retain intended rear void evidence, cure/stability authorization and holder removal record; count only complete accepted sets after defects close. Sign remaining commissioning custody."
      unit: "item"
      frequency: "Every installed set and final defect closure"
      temporal_coverage: "Complete initial cold installation cycle"
      site_scope: "One declared compatible single-opening firebox"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed inspection/cure/holder-removal evidence; no numerical universal cure; rejected attempts excluded from count"
    - protocol_id: cp_residuals
      process_id: "install_lining"
      flow_role: "outward waste solids and washwater"
      record_type: "segregated_waste_custody"
      raw_fields: "job_id; event_id; defect_id; material_id; wet_dry_state; mass_kg; hazard_class; composition; receiver; transfer_id"
      collection_method: "Weigh segregated solid and collected aqueous waste; record actual product-versus-waste status, composition and recipient. Link defect/rework movements to install_lining and reconcile with gross materials/water; keep captured pollutants out of elementary release totals."
      unit: "kg"
      frequency: "Every segregation and outward transfer"
      temporal_coverage: "Initial cycle corrections through cleanup/removal"
      site_scope: "Foreground job and actual first receiving gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated tickets; receiver/hazard records; solids/water basis; missing composition and uncertainty"
    - protocol_id: cp_releases
      process_id: "install_lining"
      flow_role: "actual environmental releases"
      record_type: "substance_medium_record"
      raw_fields: "job_id; event_id; substance; species_size_basis; receiving_medium; measured_mass_kg; method; captured_fraction; uncertainty"
      collection_method: "Characterize only actual direct releases by substance/particle fraction and receiving medium using traceable measurement or justified composition model. Distinguish captured wastes and supplier emissions; no presumed cutting/combustion or broad pollutant UUID."
      unit: "kg"
      frequency: "Each actual emitting/discharge event"
      temporal_coverage: "Initial cold cycle only"
      site_scope: "Declared direct environmental boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Method/speciation/medium evidence; detection limits; capture reconciliation; actual verified identities before exchange construction"
  calculation_rules:
    - id: job_attribution
      applies_to: "all inventory rows"
      rule: "Collect the full declared initial job cycle, including correction and retained-support/removal burdens. Attribute each physical event once to its actual accepted complete lining output; retain rejected attempt burdens and report stock carry-forward separately. Express each resulting exchange per reference flow without assuming panel count or mass equivalence."
      inputs:
        - "Actual node-specific protocols"
        - "acceptance ledger"
        - "event ownership"
      output: "Exchange amounts per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: current_compatibility
      applies_to: "install_lining"
      requirement: "Check actual host/lining/mortar instruction applicability; historical source revision alone is insufficient. Keep model strata and no universal cure/time/fire-rating conversion."
      evidence: "Manufacturer compatibility and project authorization; cp_acceptance"
    - id: closure_quality
      applies_to: "all inventory rows"
      requirement: "Retain whole-cycle receipts/issues/returns/stock, defects, cure extension, holder removal and all receiver coverage. Missing quantity, Range evidence or actual identity remains an explicit data gap, never assumed zero."
      evidence: "Node-specific protocols and custody balances"
    - id: support_quality
      applies_to: "energy; logistics; holders_tools"
      requirement: "Confirm actual exchange property/unit and provider boundaries; Count support does not verify Energy, Duration or Transport. Retain uncertain provision life and shared-driver sensitivity."
      evidence: "Support rows, asset register, supplier coverage matrix and meter/trip records"
validation_rules:
  - rule_id: accepted_gate
    applies_to: "accepted_lining"
    rule: "Require actual compatible host/model and panel/mortar IDs, undamaged complete set, accepted bedding/seams/intended void, actual cure/stability, authorized holder removal and closed defects; count 1 item only at signed lining-stage gate."
    source_ids:
      - mason-lite-firebrick-rev20090301a
  - rule_id: inventory_closure
    applies_to: "all inventory rows"
    rule: "Reconcile materials and water with installed amount, outward usable returns, waste, characterized releases and retained closing stock; do not count stock as product output or double subtract returns. Missing data are disclosed rather than invented zero."
    source_ids: []
  - rule_id: ownership_check
    applies_to: "holders_tools; logistics; energy"
    rule: "Verify shared consumers/service-life driver, complete provision/removal/terminal duty and one owner per physical burden. No cure support disappears at receipt; no duplicate supplier packaging/energy/transport."
    source_ids: []
  - rule_id: identity_range
    applies_to: "all inventory rows"
    rule: "Require actual concrete UUID/property/unit support before final exchange construction; resolve semantic umbrellas from real records. Retain source-backed Range or specific actual-evidence need on every card; no near-match identity or fabricated numeric range."
    source_ids: []
  - rule_id: stage_limit
    applies_to: "accepted_lining"
    rule: "Dataset metadata must distinguish cold lining installation from whole fireplace construction and first firing/operation; remaining commissioning custody is explicit."
    source_ids:
      - un-cpc3-54590
  - rule_id: period_closure
    applies_to: "holders_tools; logistics"
    rule: "Require asset and period IDs linking production, service-use, upkeep/replacement and termination/removal events with period-specific attribution. Check share closure across all consumers/periods and single event ownership. Unresolved service-life, replacement or terminal duty blocks finalized provision exchange construction; no fireplace lifetime claim follows from asset accounting."
    source_ids: []
