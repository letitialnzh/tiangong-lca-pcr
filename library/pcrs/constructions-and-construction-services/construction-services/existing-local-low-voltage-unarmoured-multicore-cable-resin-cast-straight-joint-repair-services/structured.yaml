boundary_abstraction:
  declared_starting_condition: "Existing exposed qualified isolated/proved-dead cable ends and retained local network; no new cable insert or trench needed; actual slack/compatibility and controlled work access"
  starting_condition_role: "Retained host interface with incremental repair burdens and removed materials explicitly attributed"
  product_classification_scope: "Narrower repair-service subset of CPC3.0 54252; classification is context, not an instruction to duplicate PCRs"
  recursive_input_rule: "Purchased independently completed repair service within the same category carries its upstream scope once; internal repeated attempts are events in this job, not recursive purchases or extra accepted outputs"
  upstream_dataset_requirement: "Actual compatible kit OR disaggregated component datasets; real separately supplied consumables, utilities, transport/provider and complete-life shared assets with exact declared coverage and exclusions"
  disclosure: "Existing cable condition and qualified interfaces; physical route and full cured-state gate; all actual events and periods; rejected attempts; gross/consumed-only choice; stocks/tare/returns; one kit representation; provider/direct/asset scopes; actual waste/release fate"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Fully cured accepted local LV multicore compression resin-cast straight-joint repair service"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "Joint/site ID"
    - "local network function"
    - "cable/conductor/cores/CSA/insulation/diameter/rating"
    - "retained-end qualification and slack"
    - "kit/pouch/connector/die/lot"
    - "actual cure conditions/state"
    - "electrical method/threshold/results"
    - "isolation authority"
    - "accepted IDs"
    - "completed period"
    - "energisation/backfill authorisations"
    - "kit representation"
    - "provider/asset/waste boundaries"
reference_flows:
  []
measurement_rules:
  - id: accepted_count
    applies_to: "accepted_joint"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "Use actual positive N unique final accepted joint IDs and N/N = 1 item. Repeats, all cores, connectors, pouch counts and metres never add reference outputs."
  - id: native_ledgers
    applies_to: "joint_kit; separate_connectors; kit_components; supplementary_materials; count_returns; mass_returns"
    required_property_ref:
      name: "Actual native Count or Mass"
      uuid: ""
    required_unit: "item; kg"
    rule: "Preserve separate SKU count and material/pack net-mass ledgers. Count-to-mass requires actual same-SKU unit net mass and scope; volume-to-mass requires actual measured volume/unit/density/state/temperature/source. Record actual discarded counts; mixed-waste kg cannot solve count balance. Gross means net of tare before outward returns."
  - id: carrier_units
    applies_to: "repair_electricity; job_fuel; job_water; freight; provider_service; shared_assets"
    required_property_ref:
      name: "Actual Energy; Mass; Mass*distance; Time"
      uuid: ""
    required_unit: "kWh; kg; t*km; h"
    rule: "Preserve actual carrier and service units. Explicit traced conversions only. Hours, cycles, callouts and item are distinct; pricing never selects a unit. Whole-fluid balance and substance emissions are nonadditive views."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: joint_repair
    name: "Integrated compression joining, resin casting and accepted repair"
    inclusion: "required"
    inclusion_condition: "Every in-scope repair"
    role: "Integrated repair assembly and protection with owner handover; finite paired-pouch mixing batches and actual joint attempts indexed inside the job"
    quantitative_reference: "1 item accepted joint repair"
process_inventory:
  - id: joint_repair
    label: "Integrated compression joining, resin casting and accepted repair"
    inputs:
      product:
        - row_id: joint_kit
          role: "Actual complete approved resin-cast straight-joint kit"
          name: "Actual complete approved resin-cast straight-joint kit"
          flow_type: "product"
          property_unit: "Count / item"
          description: "Only complete-kit upstream mode uses this input. Declare the actual SKU, delivered components and excluded connectors. The paired polyurethane resin/hardener pouch, mould, cap, tape, abrasive and gloves inside that kit remain physical subledgers rather than second purchased exchanges. Connector qualification and each actual included component must be evidenced. Supply attribution includes actual same-scope opening stock plus new net-of-tare receipts minus carried closing stock and its upstream burden; actual return treatment follows the declared inventory view. Range evidence need: Actual compatible kit specification, approved cable dimensions, receipts, net package contents and independent representative kit-use records are needed; source selection tables are compatibility envelopes, not universal consumption."
          amount:
            expression: "Actual native SKU stock-adjusted job-attributable kit supply per accepted N, using cp_materials and the declared return view."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_materials
              source_ids:
                - 3m-90na-issue3
            ranges: []
        - row_id: separate_connectors
          role: "Separately supplied approved compression conductor connectors"
          name: "Separately supplied approved compression conductor connectors"
          flow_type: "product"
          property_unit: "Count / item"
          description: "Record each actual connector SKU and conductor compatibility, CSA, core identity including protective conductor where present, die and crimp criteria. This input covers only connectors excluded from the kit dataset or supplied separately in component mode; any connector already inside a chosen kit dataset cannot be purchased twice. Failed connectors remain consumed and traceable. Supply attribution includes actual same-scope opening stock plus new net-of-tare receipts minus carried closing stock and its upstream burden; actual return treatment follows the declared inventory view. Range evidence need: Actual connector approvals, SKU counts and observed accepted/failed uses across comparable joints are required; no one-connector-per-joint or universal crimp count."
          amount:
            expression: "Actual native SKU stock-adjusted job-attributable connector supply per accepted N, using cp_materials and the declared return view."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_materials
              source_ids:
                - 3m-90na-issue3
            ranges: []
        - row_id: repair_electricity
          role: "Actual electricity supplied to the repair job"
          name: "Actual electricity supplied to the repair job"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Meter actual crimping, testing, charging, lighting, cure protection and other electrically powered job support where used, including repeats. A manual tool or ambient cure does not establish zero job electricity. Keep grid, generator and provider electricity boundaries distinct; battery charging losses belong once at the observed supply boundary. Range evidence need: Actual meter/charging records and representative job duty are required; no default tool power-times-hours or cure-energy assumption."
          amount:
            expression: "Actual attributable metered supply kWh per accepted N, using cp_energy."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_energy
              source_ids: []
            ranges: []
        - row_id: job_water
          role: "Actual water supplied for preparation, cleanup or test support"
          name: "Actual water supplied for preparation, cleanup or test support"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Record real water receipts and consumption at this job, including rinsing, containment and test support when approved and actually used. Distinguish incorporated/retained water, closing stock, true return, collected wastewater and verified evaporation or release; neither wet waste total nor a resin-casting route supplies water quantity. Supply attribution includes actual same-scope opening stock plus new net-of-tare receipts minus carried closing stock and its upstream burden; actual return treatment follows the declared inventory view. Range evidence need: Measured actual use and fate records are needed; no mandatory water washing or unsupported volume-to-mass conversion."
          amount:
            expression: "Actual stock-adjusted job-attributable water net kg supply per accepted N, using cp_water and the declared return view."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_water
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_joint
          role: "Fully cured accepted local LV multicore compression resin-cast straight-joint repair service"
          name: "Fully cured accepted local LV multicore compression resin-cast straight-joint repair service"
          flow_type: "product"
          property_unit: "Count / item"
          description: "One item is one uniquely identified complete multicore straight joint after the actual required full cured-state, electrical and signed repair acceptance gate. N is the positive count of unique final accepted joint IDs; the reference is N/N = 1 item. All cores/connectors, pouches, crimps, attempts, retests and incomplete or rejected joints are excluded from N. Include their attributed burdens. Count does not establish equal cable size, service life or electrical performance across configurations. Range evidence need: This is an exact normalization definition, not an empirical yield range. Actual accepted IDs and gate evidence are mandatory; representative configurations and observed rework are needed for comparative datasets."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_acceptance
              source_ids:
                - 3m-90na-issue3
            ranges: []
      waste:
        - row_id: wastewater
          role: "Actual collected wastewater or recovered liquid waste"
          name: "Actual collected wastewater or recovered liquid waste"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Record only real collected liquid crossing to a receiver, retaining cleaner/resin contamination and treatment identity. Recovered spills use their actual final return, waste or retained-stock destination once; total spill volume is an audit event, not an additional output. Uncontained fluid belongs to physical fate reconciliation; elementary substance quantities are a separate nonadditive view. Range evidence need: Measured quantity, composition and receiver evidence are required; zero requires documented actual absence, not room-temperature cure."
          amount:
            expression: "Actual collected liquid waste net kg attributed per accepted N, using cp_water."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_water
              source_ids: []
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: allocation_joint
    applies_to: "joint_repair"
    rule: "No intended co-product is created. Attribute all actual attempts, cutback, mixing/pour cleanup, protection and tests to the actual positive final accepted N in the bounded comparable campaign. Discarded or abandoned jobs retain burdens; if N is zero the campaign cannot supply this accepted-reference dataset. Scrap sale is not a repair co-product or avoided-production credit."
    source_ids: []
  - rule_id: allocation_events
    applies_to: "joint_repair"
    rule: "Assign each finite pouch batch, changeover, isolation/setup and cleanup event a unique owner and period. Direct joint events use their actual IDs; shared events use recorded causal use shares across every consuming joint, including failed attempts. Report uncertainty and rejected paths; never count the same event both directly and in a shared pool."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "shared_assets"
    rule: "For each actual asset use a compatible causal measured driver across all jobs/nodes/periods. Attribute full-life manufacture, maintenance, replacement and disposal burden by the target driver divided by the complete full-life driver. Use completed observed life or observed history plus justified remaining-service/replacement/termination/EOL scenario, source, uncertainty, sensitivity and update trigger. Missing denominator or coverage blocks final dataset. Period totals reconcile once; do not allocate full manufacture anew every reporting year."
    source_ids: []
  - rule_id: allocation_overlap
    applies_to: "joint_repair"
    rule: "Select gross-with-outlet or consumed-only inventory treatment explicitly and consistently. Gross input is net of tare before return netting; stocks preserve upstream burden. A consumed-only view cannot also claim the same return output credit. Count and mass physical subledgers, whole-fluid and species views, component and kit scopes, freight and direct vehicles, provider and physical resources, asset/spares/rental scopes are mutually reconciled rather than added twice."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "joint_repair"
      flow_role: "Unique complete accepted joint"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; period_id; cable_id; network_function; conductor_material; cores; CSA_mm2; cable_diameter_mm; insulation; rated_voltage_V; retained_end_slack; isolation_authority; prove_dead_result; connector_SKU; die_id; crimp_pattern; kit_SKU; pouch_lot; mixing_time; fill_time; cure_conditions; full_cured_state_criterion; cure_result; test_method; test_threshold; calibration; test_results; defect_closure; acceptance_time; acceptance_signature; accepted_joint_count_N; energisation_authority; backfill_authority"
      collection_method: "Verify owner isolation/compatibility and actual delivered instructions. Link every core and attempt to one joint; retain actual required cured-state and electrical results and signed final accepted IDs. N is positive unique accepted IDs; no attempt is counted twice."
      unit: "item; recorded numeric units and categorical attributes"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed tests, cure evidence, actual kit/connector instructions and calibration; no catalogue field-test defaults"
    - protocol_id: cp_materials
      process_id: "joint_repair"
      flow_role: "Actual kit/component/consumable receipts, states and returns"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; batch_id; period_id; material_id; SKU; kit_mode; included_scope; excluded_scope; opening_attributable_count; gross_received_count; final_used_SKU_count; discarded_count; outward_return_count; closing_carried_count; opening_attributable_net_kg; gross_received_net_kg; package_tare_kg; net_chamber_A_kg; net_chamber_B_kg; used_intermediate_kg; installed_retained_net_kg; discarded_net_kg; outward_return_net_kg; closing_carried_net_kg; actual_released_net_kg; unit_net_mass_kg; quantity_volume; volume_unit; density_kg_per_volume_unit; density_state; density_temperature; density_source; receiver; custody; upstream_burden_carry; event_share; accepted_joint_count_N; attribution_scope; inventory_view; transformation_id; opened_kit_count_audit; transformation_component_ids; component_net_kg; transformation_component_fates"
      collection_method: "Record actual matched SKU native counts and weighed net mass with package tare separate. Gross input is before returns. Reconcile opening plus external gross receipts to closing carried stock, disjoint final used-SKU count, actual discarded count, outward returns and appropriate final mass destinations. Do not add internal issues or intermediate dosing as external exchanges; pair whole-kit/component scopes and retain their physical subledgers. Count-mass or volume-mass conversions require actual matching evidence. final_used_SKU_count excludes separately logged discarded_count; a failed used kit/connector has one declared native count final fate, not two. Job-attributable supply is same-scope opening attributable stock plus external net-of-tare gross receipts minus closing carried stock, with upstream burden carry. Gross-with-outlets retains actual outward exits; consumed-only also excludes corresponding actual returned supply once and has no duplicate return credit. Native final_used_SKU_count and discarded_count are disjoint final SKU states, not dosed/consumed activity. Count discarded only for an actual whole SKU assigned that final state; separate packaging/resin mass fates never fabricate whole-kit discarded count. Internal dosing is nonadditive. Opened-kit count is an audit activity linked by transformation_id to actual original SKU counts, component identities/net mass and final fates. Component physical records never imply invented whole-kit count equivalence; final_used_SKU_count, discarded_count, outward_return_count and closing_carried_count are disjoint final source-SKU states."
      unit: "item; kg; declared actual volume unit"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scale, receipts/labels, same-SKU unit mass, lot/chamber/net-pack evidence and return custody. Installed/retained excludes separate waste/releases. Retained spill is closing stock; recovered spill takes its final fate once"
    - protocol_id: cp_energy
      process_id: "joint_repair"
      flow_role: "Actual electricity and compatible use shares"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; period_id; equipment_id; supply_boundary; meter_start_kWh; meter_end_kWh; charging_loss_kWh; included_scope; excluded_scope; event_share; accepted_joint_count_N"
      collection_method: "Meter actual supply; difference readings with traceable charging-loss ownership. Reconcile direct and shared duty and exclude provider/generator overlap before attribution."
      unit: "kWh"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration and all consumer shares sum to the observed event scope; documented absence for unused electricity"
    - protocol_id: cp_fuel
      process_id: "joint_repair"
      flow_role: "Fuel gross input, stocks, burned quantity and fates"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; period_id; equipment_id; fuel_identity; opening_attributable_net_kg; gross_received_net_kg; closing_carried_net_kg; outward_return_net_kg; nonburned_waste_net_kg; nonburned_release_net_kg; other_nonburned_final_net_kg; total_spill_audit_kg; recovered_spill_final_destination; retained_spill_in_closing_kg; quantity_volume; volume_unit; density_kg_per_volume_unit; density_state; density_temperature; density_source; package_tare_kg; included_scope; event_share; accepted_joint_count_N; receiver; custody; treatment_scope; contamination; absorber_fuel_fraction_kg; attribution_scope; inventory_view; upstream_burden_carry"
      collection_method: "Weigh net receipts and stocks or use actual traced conversion evidence. Burned kg equals opening plus gross receipts minus closing and mutually exclusive nonburned final outlets. Total spills are audit-only; recovered spills enter their final fate once and retained spills are already closing stock. Link actual burned fuel and device to species calculations, without treating whole fuel loss as generic elementary emission. Job-attributable supply is same-scope opening attributable stock plus external net-of-tare gross receipts minus closing carried stock, with upstream burden carry. Gross-with-outlets retains actual outward exits; consumed-only also excludes corresponding actual returned supply once and has no duplicate return credit."
      unit: "kg; actual volume unit when evidenced"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Receipt/stock/fate reconciliation with same period/boundary; direct plant scope and conversion evidence"
    - protocol_id: cp_water
      process_id: "joint_repair"
      flow_role: "Water and recovered liquid fates"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; period_id; water_identity; opening_attributable_net_kg; gross_received_net_kg; closing_carried_net_kg; installed_retained_net_kg; outward_return_net_kg; collected_liquid_waste_net_kg; actual_evaporation_net_kg; uncontained_liquid_net_kg; composition; receiver; treatment_scope; spill_event_id; recovered_spill_destination; event_share; accepted_joint_count_N; custody; attribution_scope; inventory_view; upstream_burden_carry"
      collection_method: "Measure actual net receipts and final liquid fates; maintain whole-fluid balance and separately attributed substance releases as nonadditive views. Track contaminated liquid receiver and avoid adding recovered liquid both as a spill and as waste. Job-attributable supply is same-scope opening attributable stock plus external net-of-tare gross receipts minus closing carried stock, with upstream burden carry. Gross-with-outlets retains actual outward exits; consumed-only also excludes corresponding actual returned supply once and has no duplicate return credit."
      unit: "kg"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Water meter/scale and receiver record; actual absence statement where unused; unresolved fate retained"
    - protocol_id: cp_freight
      process_id: "joint_repair"
      flow_role: "Actual purchased tonne-kilometre service"
      record_type: "foreground_record"
      raw_fields: "joint_id; period_id; carrier; leg_id; payload_net_t; distance_km; empty_return_scope; included_scope; excluded_scope; carrier_service_tkm; event_share; accepted_joint_count_N"
      collection_method: "Use measured payload and actual leg route or verified compatible carrier service activity. Compare payload times distance with declared carrier treatment. Reconcile all consumers and direct vehicle scope."
      unit: "t*km; t; km"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Waybills, leg records and transport dataset reference/scope; no double ownership"
    - protocol_id: cp_provider
      process_id: "joint_repair"
      flow_role: "Completed actual time-reference support"
      record_type: "foreground_record"
      raw_fields: "joint_id; period_id; provider_id; service_identity; actual_reference_property; actual_reference_unit; completed_hours; time_records; completed_results; included_scope; excluded_scope; event_share; accepted_joint_count_N"
      collection_method: "Verify true purchased service identity and hour reference, actual hours and completed support results. Map included/excluded physical resources and asset/travel/waste scope; retain uncovered resources on physical cards."
      unit: "h"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Contract, timesheets and isolation/test results; mismatch in actual service unit requires actual matching exchange"
    - protocol_id: cp_assets
      process_id: "joint_repair"
      flow_role: "Complete-life shared asset and all consumers"
      record_type: "foreground_record"
      raw_fields: "asset_id; asset_identity; lifetime_phase; period_id; consuming_job_id; consuming_node_id; measured_driver_unit; target_driver_h; complete_life_driver_h; manufacture_scope; maintenance_scope; replacement_scope; EOL_scope; direct_operation_exclusions; provider_rental_exclusions; observed_history; remaining_service_evidence; replacement_scenario; termination_scenario; EOL_scenario; burden_source; burden_uncertainty; sensitivity; update_trigger; accepted_joint_count_N"
      collection_method: "Compile all jobs/nodes/periods and causal compatible hour use, full-life component burden and complete denominator. Completed observed life or observed history plus justified remaining-life scenarios must cover manufacture through EOL. Attribute once, with direct operation/provider/rental/spare exclusions."
      unit: "h; actual upstream burden units"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset records, full consumer ledger, scenario sources and uncertainty/sensitivity; missing coverage or denominator blocks final dataset"
    - protocol_id: cp_waste
      process_id: "joint_repair"
      flow_role: "Actual removed materials, residues and package fates"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; batch_id; period_id; waste_identity; origin_material; cure_state; contamination; fraction_net_kg; package_tare_kg; discarded_SKU_count; receiver; custody; transport_scope; treatment_scope; event_share; accepted_joint_count_N"
      collection_method: "Weigh actual segregated fractions or traceable mixed composition, separating host cuttings, cured/uncured resin, packaging and contaminated consumables. Pair discarded counts with materials ledger. Link each failed attempt to actual receiver and avoid duplicate packaging tare or retained mould/resin."
      unit: "kg; item for native discarded-count audit"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weigh tickets, actual composition/cure-state, receiver acceptance and legal route; no universal household-waste assumption"
    - protocol_id: cp_releases
      process_id: "joint_repair"
      flow_role: "Actual species/media, routine and incident emissions"
      record_type: "foreground_record"
      raw_fields: "joint_id; attempt_id; period_id; event_id; event_owner; routine_or_incident; substance_species; particle_size; receiving_medium; measured_species_kg; measurement_method; actual_activity; activity_unit; factor_kg_per_activity_unit; factor_source; factor_applicability; formulation_component_kg; component_fraction; fate_fraction; temperature_state; whole_fluid_audit_kg; calculation_basis; uncertainty; event_share; accepted_joint_count_N"
      collection_method: "Use actual species measurements or valid activity-times-factor or actual component composition-times-fate calculations; keep evidence and units for all operands. Distinguish incident ownership and whole-fluid physical balance from partial-species view. Never calculate release from unexplained balance residual."
      unit: "kg; actual matching activity units"
      frequency: "Each actual receipt, issue, attempt, event and acceptance; reconcile campaign close"
      temporal_coverage: "Entire bounded campaign and actual linked asset-life/service periods"
      site_scope: "Declared repair site and actual supplier/provider/receiver scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Instrument evidence or current applicable source/fate evidence with uncertainty; SDS content alone is not emission fraction or zero proof"
  calculation_rules:
    - id: material_intake
      applies_to: "joint_kit; separate_connectors; kit_components; supplementary_materials"
      rule: "For each actual SKU and one chosen upstream representation, job-attributable supply in its native item or kg = opening attributable stock plus gross external receipts net of tare minus closing carried stock, with matched units, scope and upstream burden carry. In gross-with-outlets mode input per reference = this supply times event_share / accepted_joint_count_N and actual outward exits remain separate. Consumed-only mode additionally excludes the corresponding actual returned supply once before attribution and omits duplicate return output credit. Waste and releases remain burden-bearing fates. Kit component physical subledgers do not imply fabricated whole-kit count equivalence."
      inputs:
        - cp_materials
        - gross_received_count
        - gross_received_net_kg
        - event_share
        - accepted_joint_count_N
        - opening_attributable_count
        - closing_carried_count
        - opening_attributable_net_kg
        - closing_carried_net_kg
        - inventory_view
        - outward_return_count
        - outward_return_net_kg
        - upstream_burden_carry
      output: "Actual SKU input item or kg per reference"
      source_ids: []
    - id: count_return
      applies_to: "count_returns"
      rule: "Returned item per reference = outward_return_count times event_share / accepted_joint_count_N. Native count audit by SKU: opening_attributable_count plus gross_received_count equals final_used_SKU_count plus discarded_count plus outward_return_count plus closing_carried_count. No count inferred from waste kg."
      inputs:
        - cp_materials
        - opening_attributable_count
        - gross_received_count
        - final_used_SKU_count
        - discarded_count
        - outward_return_count
        - closing_carried_count
        - event_share
        - accepted_joint_count_N
      output: "Actual matched outward return item per reference"
      source_ids: []
    - id: mass_return
      applies_to: "mass_returns"
      rule: "Returned kg per reference = outward_return_net_kg times event_share / accepted_joint_count_N. Mass audit by actual material: opening_attributable_net_kg plus gross_received_net_kg equals closing_carried_net_kg plus installed_retained_net_kg plus discarded_net_kg plus outward_return_net_kg plus actual_released_net_kg; destinations mutually exclusive and used_intermediate_kg nonadditive. Kit physical subledgers reconcile without duplicate purchases."
      inputs:
        - cp_materials
        - opening_attributable_net_kg
        - gross_received_net_kg
        - closing_carried_net_kg
        - installed_retained_net_kg
        - discarded_net_kg
        - outward_return_net_kg
        - actual_released_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual outward material kg per reference and physical reconciliation"
      source_ids: []
    - id: energy_attribution
      applies_to: "repair_electricity"
      rule: "Electricity kWh per reference = actual same-boundary metered kWh plus only additional not-already-metered charging_loss_kWh, attributed by event_share / accepted_joint_count_N. Metered kWh is meter_end_kWh minus meter_start_kWh."
      inputs:
        - cp_energy
        - meter_start_kWh
        - meter_end_kWh
        - charging_loss_kWh
        - event_share
        - accepted_joint_count_N
      output: "Attributed supply kWh per reference"
      source_ids: []
    - id: fuel_input
      applies_to: "job_fuel"
      rule: "Job-attributable fuel supply kg = opening attributable stock plus gross receipts net of tare minus closing carried stock, with same identity/scope and upstream burden carry. Gross-with-outlets input per reference = this supply times event_share / accepted_joint_count_N, retaining actual outward outlets. Consumed-only input additionally excludes corresponding actual returned fuel once and omits duplicate return credit. Burned kg audit = opening_attributable_net_kg plus gross_received_net_kg minus closing_carried_net_kg minus outward_return_net_kg minus nonburned_waste_net_kg minus nonburned_release_net_kg minus other_nonburned_final_net_kg. Nonburned outlets are mutually exclusive; total_spill_audit_kg is not subtracted again. Recovered spills take final destination once; retained spills already belong to closing. Carry stocks/upstream burdens across the same scope."
      inputs:
        - cp_fuel
        - opening_attributable_net_kg
        - gross_received_net_kg
        - closing_carried_net_kg
        - outward_return_net_kg
        - nonburned_waste_net_kg
        - nonburned_release_net_kg
        - other_nonburned_final_net_kg
        - event_share
        - accepted_joint_count_N
        - inventory_view
      output: "Gross fuel input kg per reference and actual burned kg audit"
      source_ids: []
    - id: water_input
      applies_to: "job_water"
      rule: "Job-attributable water supply kg = opening attributable stock plus gross receipts net of tare minus closing carried stock, with same identity/scope and upstream burden carry. Gross-with-outlets input per reference = this supply times event_share / accepted_joint_count_N with actual outward outlets separate. Consumed-only input additionally excludes corresponding actual returned water once and omits duplicate return credit. Whole-water audit: opening_attributable_net_kg plus gross_received_net_kg equals closing_carried_net_kg plus installed_retained_net_kg plus outward_return_net_kg plus collected_liquid_waste_net_kg plus actual_evaporation_net_kg plus uncontained_liquid_net_kg, using exclusive final fates. Unknown balance is a gap."
      inputs:
        - cp_water
        - opening_attributable_net_kg
        - gross_received_net_kg
        - closing_carried_net_kg
        - installed_retained_net_kg
        - outward_return_net_kg
        - collected_liquid_waste_net_kg
        - actual_evaporation_net_kg
        - uncontained_liquid_net_kg
        - event_share
        - accepted_joint_count_N
        - inventory_view
      output: "Gross actual water kg per reference and fate audit"
      source_ids: []
    - id: freight_attribution
      applies_to: "freight"
      rule: "Compatible purchased t*km per reference = actual carrier_service_tkm times event_share / accepted_joint_count_N; compare each actual payload_net_t times distance_km with its compatible leg/service treatment, including declared empty-return scope."
      inputs:
        - cp_freight
        - carrier_service_tkm
        - payload_net_t
        - distance_km
        - event_share
        - accepted_joint_count_N
      output: "Actual purchased freight t*km per reference"
      source_ids: []
    - id: provider_attribution
      applies_to: "provider_service"
      rule: "Compatible completed purchased support h per reference = completed_hours times event_share / accepted_joint_count_N; use only actual matching Time/h service and completed resources/results, with scope exclusions."
      inputs:
        - cp_provider
        - completed_hours
        - event_share
        - accepted_joint_count_N
      output: "Compatible purchased support h per reference"
      source_ids: []
    - id: asset_attribution
      applies_to: "shared_assets"
      rule: "Compatible asset service h per reference = target_driver_h / accepted_joint_count_N. Its full-life upstream burden share = target_driver_h / complete_life_driver_h applied to compatible manufacture, maintenance, replacement and EOL burden_source with exclusions. Complete denominator includes all jobs/nodes/periods and justified remaining service; do not add burden again as a second direct exchange."
      inputs:
        - cp_assets
        - target_driver_h
        - complete_life_driver_h
        - burden_source
        - accepted_joint_count_N
      output: "Actual compatible asset h per reference and disclosed upstream burden share"
      source_ids: []
    - id: waste_attribution
      applies_to: "cable_cuttings; resin_pack_waste"
      rule: "Actual fraction kg per reference = fraction_net_kg times event_share / accepted_joint_count_N, separately for actual host cuttings, resin cure-state/contamination and packaging fractions. Packaging tare is a material fraction once, not net resin. Link discarded_SKU_count to native count audit without conversion from mixed kg."
      inputs:
        - cp_waste
        - fraction_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual receiver-specific waste kg per reference"
      source_ids: []
    - id: liquid_waste
      applies_to: "wastewater"
      rule: "Actual collected liquid kg per reference = collected_liquid_waste_net_kg times event_share / accepted_joint_count_N; match actual identity, contamination, receiver and exclusive final fate without duplicate spill output."
      inputs:
        - cp_water
        - collected_liquid_waste_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual collected liquid waste kg per reference"
      source_ids: []
    - id: release_attribution
      applies_to: "actual_releases"
      rule: "For each actual substance/species and receiving medium select one supported basis: measured_species_kg, or actual_activity times factor_kg_per_activity_unit with matching activity_unit and applicability, or formulation_component_kg times component_fraction times fate_fraction. Attributed species kg per reference = selected supported species kg times event_share / accepted_joint_count_N. Keep whole_fluid_audit_kg nonadditive, routine/incident ownership distinct and uncertainty explicit; missing factor/fate is not zero."
      inputs:
        - cp_releases
        - measured_species_kg
        - actual_activity
        - factor_kg_per_activity_unit
        - formulation_component_kg
        - component_fraction
        - fate_fraction
        - event_share
        - accepted_joint_count_N
      output: "Actual species-and-medium kg per reference"
      source_ids: []
    - id: fuel_return
      applies_to: "fuel_returns"
      rule: "Actual returned fuel kg per reference = outward_return_net_kg times event_share / accepted_joint_count_N; closing stock and actual recovered-spill destination remain exclusive."
      inputs:
        - cp_fuel
        - outward_return_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual returned fuel kg per reference"
      source_ids: []
    - id: fuel_waste_attribution
      applies_to: "fuel_waste"
      rule: "Actual nonburned fuel waste kg per reference = nonburned_waste_net_kg times event_share / accepted_joint_count_N; reconcile final recovered-spill destination and absorber/fuel fraction once."
      inputs:
        - cp_fuel
        - nonburned_waste_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual nonburned fuel waste kg per reference"
      source_ids: []
    - id: water_return
      applies_to: "water_returns"
      rule: "Actual unused returned water kg per reference = outward_return_net_kg times event_share / accepted_joint_count_N, excluding closing stock and collected contaminated wastewater."
      inputs:
        - cp_water
        - outward_return_net_kg
        - event_share
        - accepted_joint_count_N
      output: "Actual returned water kg per reference"
      source_ids: []
  data_quality_requirements:
    - id: quality_gate
      applies_to: "accepted_joint"
      requirement: "Actual current owner/kit/connector instructions and cable compatibility control. No universal voltage, time, insulation-resistance, cure or service-life default; full required cured-state/electrical acceptance is evidenced."
      evidence: "Actual delivered instructions, calibration, lot/cure conditions, test and handover records"
    - id: quality_scope
      applies_to: "joint_repair"
      requirement: "Cover every actual period, attempt, pouch batch, shared event and resource including real provider-paid consumption; trace absence, uncertainty and unresolved gaps. Compare configurations explicitly rather than equating every counted joint."
      evidence: "Complete accepted/rejected ID ledger, dated scope and uncertainty review"
    - id: quality_balances
      applies_to: "joint_repair"
      requirement: "Reconcile native Count and Mass ledgers, package tare/chambers, actual stock burden carry, exclusive installed/return/waste/release destinations and chosen upstream representation. Unknown is not zero; residual is not emission."
      evidence: "Receipts, stock/scale records, actual discarded counts, receiver/custody and species evidence"
    - id: quality_life
      applies_to: "shared_assets; provider_service"
      requirement: "Complete all consumers, compatible denominator, manufacture/maintenance/replacement/EOL scope and prospective remaining-life sources/uncertainty/sensitivity/update. Provider actual unit and bounded results/resources are verified. Missing material scope blocks final dataset."
      evidence: "Full-life asset register, scenario records, supplier scope/contracts and service evidence"
validation_rules:
  - rule_id: validation_route
    applies_to: "joint_repair"
    rule: "Reject incompatible local function, cable/connector/kit, missing isolation authority or exposure/slack and any excluded new-insert/trench/armour/shield/branch/shear-bolt/shrink-only/gel route. Actual approved ≤1 kV rating controls; no live-work permission is implied."
    source_ids:
      - un-cpc3-2025
      - 3m-90na-issue3
  - rule_id: validation_gate
    applies_to: "accepted_joint"
    rule: "Require actual preparation/crimp/seal/fill/lot/cure evidence, full required cured-state criterion, applicable calibrated electrical tests, defects closed and signed owner handover. Type-test numbers are not universal field settings. N is positive unique accepted joints only; incomplete/rejected/repeated attempts cannot inflate it."
    source_ids:
      - 3m-90na-issue3
  - rule_id: validation_burden
    applies_to: "joint_repair"
    rule: "Verify all actual campaign phases/periods and finite pouch batches, rejected states/rework loops, cleanup/changeover and shared-event ownership. Every failed attempt has a linked repair/waste/return/retained/release path and all burdens stay attributed. N=0 cannot yield an accepted-reference dataset."
    source_ids: []
  - rule_id: validation_balance
    applies_to: "joint_repair"
    rule: "Check one upstream kit mode and every bundled exclusion, native count including actual discarded count, net chamber/pack/material stocks and exclusive final fates. Gross net-of-tare input precedes return netting. Consumed-only and gross-with-outlet treatments cannot give duplicate return credit. Verify actual factor/volume conversion evidence; unknown/residual does not become zero or an elementary flow."
    source_ids: []
  - rule_id: validation_life
    applies_to: "shared_assets; provider_service; freight"
    rule: "Require complete-life asset scope and all jobs/nodes/periods with compatible measured denominator and justified remaining-service/replacement/termination/EOL scenario where prospective. Missing denominator/coverage or unresolved service property/unit/results blocks final dataset. Cross-check direct operation, spares, tools, rental/provider and freight for overlaps."
    source_ids: []
  - rule_id: validation_identity_range
    applies_to: "joint_repair"
    rule: "Resolve each actual concrete exchange with correct identity/state/gate/property/unit before final dataset production. Conditional actual identities require foreground evidence. Range evidence needs stay visible until representative independent evidence is supplied; structural check does not establish UUID verification, quantitative plausibility or publication readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground completed cable-joint repair service data package with downstream process/lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset after actual identity, quantity, scope and review gaps are resolved"
  allowed_use: "Declared compatible existing local LV unarmoured/unshielded multicore compression resin-cast fully cured straight-joint repair under its actual service conditions"
  excluded_use: "Unqualified cable sizes/conditions or different gates; new cable/route/trench; operation-life benefits; branch/armour/shield/shear-bolt/shrink-only/gel or building/telecom/HV work"
  required_metadata: "All reference qualifiers; actual joint/attempt/batch/period IDs; N; geography/time; gate and testing criteria; current actual instructions; kit mode/scope; native ledgers; provider/transport/asset coverage and destinations"
  required_quality_disclosure: "Measured versus calculated quantities; evidence needs/unknowns; rework completeness; physical balances and fate; identity status; full-life denominator/scenario source/uncertainty/sensitivity/update; allocation and representation exclusions"
  update_trigger: "Actual kit/resin/connector or cable/route change; acceptance criterion/gate change; significant job/rework/resource change; corrected identities/fates; new asset-life/consumer or provider scope evidence"
