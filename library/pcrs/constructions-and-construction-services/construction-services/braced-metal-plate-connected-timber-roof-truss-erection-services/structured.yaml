boundary_abstraction:
  declared_starting_condition: "Factory-complete identified timber trusses and specified installation components at their declared supply gate, with existing bearings accepted for the actual package and lifting access available"
  starting_condition_role: "Foreground erection boundary; host readiness is a documented interface, not a zero-burden substitute for construction in a whole-building model"
  product_classification_scope: "Narrower timber-truss erection subset of CPC 3.0 54522; separate from roof coverings under 54530"
  recursive_input_rule: "Record factory trusses as component products, not as this erection service. If a previously erected set or subcontracted erection service enters the package, disclose its completed scope and prevent repeating the same erection or resource burden; a relocation is outside first erection."
  upstream_dataset_requirement: "Use actual supply-gate truss/component and resource datasets with declared packaging, freight, energy and temporary-asset coverage. Include upstream manufacture through these inputs; do not recreate factory production in the site node."
  disclosure: "Declare supplied-kit coverage, excluded host/diaphragm work, physical state and responsibilities at the erection gate, all shared consumers and periods, and temporary-support production/use/removal coverage and later owner. Unresolved stability or service coverage blocks a completed dataset."
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Braced timber roof-truss set erection-stage service"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "Project/site and set/package ID"
    - "truss IDs/count and factory supply gate"
    - "timber species/grade/treatment and design geometry"
    - "actual span/pitch/spacing/layout"
    - "bearing types/locations/connections"
    - "design and placement document revisions"
    - "applicable current jobsite instructions"
    - "engineer-approved lifting/temporary/permanent bracing plans"
    - "permanent member-bracing schedule"
    - "retained temporary supports and later diaphragm dependency"
    - "erection and continuation periods"
    - "inspection/defect closure"
    - custody
    - "later removal owner and burden allocation"
    - "geographic/temporal resource supply"
reference_flows:
  []
measurement_rules:
  - id: counted_set_reference
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "One accepted complete set is 1 item. Individual truss count is a qualifier and input quantity, never the reference set count; no conversion from roof area, timber mass or one truss is allowed without explicit set records."
  - id: material_mass_evidence
    applies_to: "roof_trusses; permanent_bracing; bearing_connectors; transport_packaging; reusable_returns; erection_waste"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain actual counted pieces and material-specific measured/supplier net masses. Geometry does not supply timber density or moisture correction; any count-to-mass conversion needs actual configuration-specific records. Keep mixed materials and waste destinations separate."
  - id: service_unit_evidence
    applies_to: "temporary_stability_service; lifting_access_service; logistics; installation_energy; direct_fuel"
    required_property_ref:
      name: "Actual service property"
      uuid: ""
    required_unit: "h; t*km; kWh; kg"
    rule: "Preserve the measured service/fuel/energy units and provider boundary. Hours cannot replace fuel or asset manufacture. Any conversion requires the actual factor, unit and measured basis; never infer fuel from lift count or nominal capacity."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: roof_truss_erection
    name: "Roof-truss placement, anchoring and braced erection-stage handover"
    inclusion: "required"
    inclusion_condition: "Actual first erection of the declared factory timber roof-truss set on accepted bearings"
    role: "Integrate finished trusses, bearing connectors and permanent braces; install/retain temporary stability; own erection corrections and disposition exits"
    quantitative_reference: "1 item accepted complete erection-stage set"
process_inventory:
  - id: roof_truss_erection
    label: "Roof-truss placement, anchoring and braced erection-stage handover"
    inputs:
      product:
        - row_id: roof_trusses
          role: "Factory metal-plate-connected timber roof trusses at supply gate"
          name: "Factory metal-plate-connected timber roof trusses at supply gate"
          flow_type: "product"
          property_unit: "Number of items 01846770-4cfe-4a25-8ad9-919d8d378345 / item"
          description: "Record each finished truss design ID delivered for this set, including replacement pieces. Factory connector plates and factory timber belong to this finished-product input and must not be added again as raw materials. Range evidence need: Obtain the actual package schedule, dispatch/receipt and replacement records; no universal truss count, factory yield or mass-per-truss range is established."
          amount:
            expression: "Actual delivered truss counts by design ID, reconciled to installed, returned, discarded and retained-stock states; all attributable replacement supply remains included."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_components
              source_ids:
                - sbca-installation-2023
            ranges: []
        - row_id: installation_energy
          role: "Actual electricity supplied to erection equipment"
          name: "Actual electricity supplied to erection equipment"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Record directly controlled fastening/drilling tools, compressor, charging and other installation electricity when used and not covered in a provider service. Exclude factory energy already in truss inputs. Range evidence need: Obtain actual meter/charging/compressor records and shared-consumer allocation; an unspecified grid, compressor efficiency or energy-per-truss is not a numerical range."
          amount:
            expression: "Metered or traceably allocated actual electricity by supply and equipment/period, including correction activity and shared compressor/charging use."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_resources
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: erected_roof_truss_set
          role: "Braced timber roof-truss set erection-stage service"
          name: "Braced timber roof-truss set erection-stage service"
          flow_type: "product"
          property_unit: "Number of items 01846770-4cfe-4a25-8ad9-919d8d378345 / item"
          description: "The sole reference output is the actual complete specified set accepted at the qualified braced erection-stage gate. Later diaphragm dependency, retained supports and responsibility transfer remain declared in this service identity. Range evidence need: The exact 1 item defines the complete accepted set; it is not a yield prior. Actual set completeness and inspection evidence are needed, and different geometries/packages are not automatically equivalent."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_acceptance
              source_ids:
                - sbca-installation-2023
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: single_accepted_service
    applies_to: "roof_truss_erection"
    rule: "There is one intended accepted erection service. Do not allocate to the existing bearing structure or later roof covering as a co-product. Rejected trusses, waste and returns are not accepted erection output; retain all attributable failed-attempt and replacement burdens."
    source_ids: []
  - rule_id: local_corrections_and_exits
    applies_to: "roof_truss_erection"
    rule: "Local repositioning/refastening repeats within this node. Link each correction to the original event and retain its extra materials, power and equipment. Link quarantine to product return or waste exit with actual receiver/status. Retained stock is reconciled separately; gross inputs, stock and returns must not be netted twice. No default recycling or biogenic-carbon credit is awarded."
    source_ids:
      - sbca-installation-2023
  - rule_id: shared_resource_attribution
    applies_to: "temporary_stability_service; lifting_access_service; logistics; installation_energy; direct_fuel"
    rule: "Identify asset/service IDs, roof_truss_erection and every other consuming work package or reporting period. Prefer separately metered activity and directly attributable trips; split inseparable common burdens by a documented causal driver suited to the actual resource, retaining the whole consumer denominator, standby/mobilization treatment and sensitivity. Record rejected alternatives and inventory coverage; do not divide by this PCR output alone when other consumers exist."
    source_ids: []
  - rule_id: support_phase_attribution
    applies_to: "temporary_stability_service"
    rule: "Index P1 erection to signed gate, P2 retained support pending the separately owned diaphragm/stability gate, and P3 authorized removal/return/end-of-use. Attach each asset, replacement, maintenance, transport and removal event to its actual phase and consumer. Allocate production and termination burdens once across the documented service cycle; phase shares and receiving dataset responsibilities must reconcile to that whole cycle. Provider ownership does not remove burdens. Missing termination owner or service coverage blocks finalization."
    source_ids:
      - sbca-bcsi-current
  - rule_id: provider_and_direct_operations
    applies_to: "lifting_access_service; temporary_stability_service; logistics; installation_energy; direct_fuel; direct_releases"
    rule: "For each actual provider boundary, choose service-inclusive inventory or underlying disaggregated operation. Explicitly mark which fuel, electricity, asset and release burdens are included and which require separate exchanges. Counting service duration alone is insufficient. Material returns already included inside a service must not appear again as separate return outputs."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_components
      process_id: "roof_truss_erection"
      flow_role: "component receipts, use, replacements and stock"
      record_type: "material ledger"
      raw_fields: "set_id; truss/design_id; supplier_gate; kit_coverage; material/specification; piece_count; net_mass; moisture_basis; receipts; replacement; installed; returned; closing_stock; period; event_id"
      collection_method: "Reconcile supplier schedule and delivery tickets to installation count/BOM, calibrated weighing or actual item-specific mass records; keep species/grade/treatment/coating and material types distinct. Attribute receipts/use/stock to this set and correction events before normalizing to accepted complete sets."
      unit: "item; kg"
      frequency: "each receipt, issue, correction and stock closure"
      temporal_coverage: "P1 erection plus actual replacement events"
      site_scope: "actual site, package and suppliers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable schedule, weighing/calibration, receipts, stock reconciliation and approved connection/brace documents; no generic density."
    - protocol_id: cp_services
      process_id: "roof_truss_erection"
      flow_role: "temporary stability, lifting and access"
      record_type: "service and asset ledger"
      raw_fields: "set_id; asset/provider_id; approved_plan; component_inventory; coverage; all_consumers; P1/P2/P3; start/end; hours; operating/standby; mobilization; maintenance; replacement; custody; removal_owner; removal/return_event; driver; total_denominator; allocation_share"
      collection_method: "Reconcile crane/access logs and approved temporary-bracing records with provider inventory coverage. Record every consumer and phase, actual period-specific causal driver and full denominator, including later roof work. Obtain production/use/removal/transport/end-of-use coverage or explicit linked inventories; unresolved future events remain disclosed obligations and prevent a completed package."
      unit: "h; underlying material/energy/service units"
      frequency: "each service period, custody transfer and termination event"
      temporal_coverage: "P1 erection, P2 retention, P3 authorized removal and return"
      site_scope: "actual site plus every shared consumer/provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Plan acceptance, provider primary inventory, complete consumer denominator and phase ledger; shares sum to the bounded cycle, removals authorized only after documented later stability."
    - protocol_id: cp_logistics
      process_id: "roof_truss_erection"
      flow_role: "component, residual and return freight"
      record_type: "consignment ledger"
      raw_fields: "set_id; transfer_id; material; net_payload; origin/destination; mode; vehicle/provider; distance; empty_return; included_upstream; shared_consumers; period"
      collection_method: "Collect actual weigh/dispatch and route records for each leg. Calculate actual payload-distance activity, attribute inseparable shared legs with complete payload/consumer data, and reconcile provider/upstream coverage before normalizing to accepted sets."
      unit: "t*km"
      frequency: "each physical transport leg"
      temporal_coverage: "P1 and attributable P2/P3 legs"
      site_scope: "actual source-site-receiver routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Payload and route evidence, allocation records, matched transfer IDs and transport coverage without duplicated trips."
    - protocol_id: cp_resources
      process_id: "roof_truss_erection"
      flow_role: "direct electricity and fuel"
      record_type: "meter and fuel ledger"
      raw_fields: "set_id; equipment; provider_coverage; supply/fuel_identity; opening_stock; delivered; closing_stock; meter_start/end; charging; operating_period; all_consumers; allocation_driver; factor/unit"
      collection_method: "Use actual electricity meters/charging and consumed fuel stock reconciliation. Distinguish fuel and electricity, include compressor/tools and correction events, and allocate shared operation using measured consumption or documented causal use with complete denominator; record factors for any actual conversion."
      unit: "kWh; kg; original measured units"
      frequency: "each meter/refuelling period and stock closure"
      temporal_coverage: "P1 and any directly owned P2/P3 operation"
      site_scope: "actual site equipment and supplies"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, receipts, stocks, equipment logs, conversion evidence and confirmation that provider inputs omit these direct operations."
    - protocol_id: cp_residuals
      process_id: "roof_truss_erection"
      flow_role: "packaging, usable returns, rejected trusses, waste and stock"
      record_type: "material disposition ledger"
      raw_fields: "set_id; event_id; transfer_id; material/truss_id; count; net_mass; opening/closing_stock; received; installed; product/waste_status; defect; manufacturer_disposition; receiver; route; capture; phase"
      collection_method: "Track incoming packaging and each residual by material and state. Reconcile usable return dispatch to receiving custody; quarantine rejected trusses until written disposition; use waste tickets for discarded material. Keep retained stock and service-internal asset returns separate, with gross supply and stock/return adjustment made once."
      unit: "kg; item"
      frequency: "each receipt, rejection, return, waste transfer and stock closure"
      temporal_coverage: "P1 with attributable continuation/removal residuals linked to P2/P3"
      site_scope: "actual site, suppliers and named receivers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighing/counts, matched receiver evidence, status/defect decisions, waste treatment and material closure; no assumed recovery credit."
    - protocol_id: cp_acceptance
      process_id: "roof_truss_erection"
      flow_role: "complete accepted erection-stage set"
      record_type: "documented acceptance record"
      raw_fields: "set_id; truss_ids/count; span/pitch/spacing/layout; bearing_acceptance; design/placement_revision; instruction_edition; approved_lift/temporary/permanent_plans; connection/brace_completion; temporary_support_list; later_stability_dependency; P1/P2/P3; custody/removal_owner; inspection; defect_closure; accepted_complete_set_count"
      collection_method: "Compare actual installed truss IDs, bearing connections and permanent member bracing to approved documents. Inspect and close defects, record retained temporary stability and downstream responsibilities, then obtain signed erection-stage handover; count only complete qualified sets. The reference remains one declared set rather than individual trusses or area."
      unit: "item"
      frequency: "one complete set at signed gate and each change to retained-support obligations"
      temporal_coverage: "P1 signed gate with explicit P2/P3 responsibility linkage"
      site_scope: "actual declared set at its site"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed designer/installer/receiver documents as applicable, inspection and closure evidence; incomplete or unsafe sets are not accepted."
    - protocol_id: cp_releases
      process_id: "roof_truss_erection"
      flow_role: "direct characterized releases"
      record_type: "measurement or activity-factor record"
      raw_fields: "set_id; equipment/source; provider_coverage; substance; medium; particle_size/basis; activity; factor/source/date; control/capture; measurement; uncertainty; period; allocation"
      collection_method: "For directly controlled actual operation obtain calibrated sampling or a justified source-specific factor applied to measured activity. Record each substance and compartment separately and attributable phase/consumer; distinguish captured waste and provider-included emissions, and document uncertainty or unmeasured gaps."
      unit: "kg"
      frequency: "each measurement or equipment/activity period"
      temporal_coverage: "actual direct P1 and attributable P2/P3 operation"
      site_scope: "actual site receiving compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measurement QA or actual applicable factor reference with technology/fuel/controls and uncertainty; generic pollutant names cannot select concrete identities."
  calculation_rules:
    - id: normalize_complete_set
      applies_to: "all inventory rows"
      rule: "Aggregate actual attributable material, resource, residual and service quantities for the declared complete package; where one measured campaign covers several accepted sets, retain each configuration and allocate with its actual records before expressing quantities per reference flow. Do not divide individual truss counts into a new reference product."
      inputs:
        - "actual records"
        - "accepted complete set ledger"
        - "allocation evidence"
      output: "per reference flow inventory quantities"
      source_ids: []
    - id: component_closure
      applies_to: "roof_trusses; permanent_bracing; bearing_connectors; transport_packaging; reusable_returns; rejected_truss_returns; erection_waste"
      rule: "Reconcile opening stock plus receipts to installed/consumed quantities, genuine product returns, characterized waste and closing stock by actual material or truss ID. Record unresolved balance gaps and correction supply explicitly; do not use an output service count as a material mass."
      inputs:
        - cp_components
        - cp_residuals
      output: "material-specific count/mass reconciliation"
      source_ids: []
    - id: shared_cycle_closure
      applies_to: "temporary_stability_service; lifting_access_service; logistics; installation_energy; direct_fuel"
      rule: "For each event/resource, apply its evidenced allocation share to the full covered inventory, not just billed hours. Reconcile all consumer and P1/P2/P3 shares to the complete resource/service boundary, then retain each accepted set attribution once."
      inputs:
        - cp_services
        - cp_logistics
        - cp_resources
        - "all-consumer and phase ledger"
      output: "complete allocated underlying burden with service activity"
      source_ids: []
    - id: release_calculation
      applies_to: "direct_releases"
      rule: "Use measured released mass or actual measured activity with a source-specific documented factor, retaining unit conversion, capture assumptions and uncertainty. List the actual external factor reference in the constructed dataset; do not invent a factor in this PCR."
      inputs:
        - cp_releases
        - "actual activity/factor or measurements"
      output: "substance- and compartment-specific released mass"
      source_ids: []
  data_quality_requirements:
    - id: actual_design_and_gate
      applies_to: "reference product"
      requirement: "Preserve actual set identity, design/placement revisions, accepted host interfaces, document applicability and signed gate. No unresolved defect may be hidden in accepted output."
      evidence: "cp_acceptance; actual project/manufacturer/engineer records"
    - id: supply_and_quantity_quality
      applies_to: "all component and residual cards"
      requirement: "Retain material identity and state, actual gross/stock/return amounts, net mass/count evidence, moisture basis and uncertainty. Candidate numerical ranges require independently reviewed comparable evidence; a batch maximum cannot validate itself."
      evidence: "cp_components; cp_residuals"
    - id: phase_and_service_completeness
      applies_to: "temporary_stability_service; lifting_access_service"
      requirement: "Declare P1/P2/P3 dates/owners and full service coverage; reconcile capital materials, maintenance/use, replacements and termination once across all consumers. Unconfirmed later removal is a gap rather than zero."
      evidence: "cp_services; provider inventory; responsibility transfer"
    - id: resource_release_quality
      applies_to: "installation_energy; direct_fuel; direct_releases; logistics"
      requirement: "Use actual supply, fuel, technology/mode and receiving media; retain meter/stock/distance evidence and applicable factors. Disclose unmeasured resources/releases and provider exclusions."
      evidence: "cp_resources; cp_releases; cp_logistics"
    - id: identity_and_range_gaps
      applies_to: "all cards"
      requirement: "Resolve each concrete exchange identity, support property/unit and actual-evidence Range needs before final TIDAS publication. A conditional umbrella becomes zero, one or several exchanges from foreground evidence; absence of evidence is not zero."
      evidence: "actual lookup/support verification and foreground collection package"
validation_rules:
  - rule_id: reference_completeness
    applies_to: "erected_roof_truss_set"
    rule: "Require 1 item, the real output link and identical complete-set meaning in both languages. Match each truss to the approved package and signed erection gate; exclude unresolved rejects from accepted output."
    source_ids:
      - un-cpc3-2025
      - sbca-installation-2023
  - rule_id: structural_handover
    applies_to: "roof_truss_erection"
    rule: "Verify actual bearing acceptance, placement/connection records, permanent member restraints/bracing, retained temporary stability, construction-stage restrictions, inspection closure and named responsibility transfer; do not infer finished diaphragm/roof performance."
    source_ids:
      - sbca-installation-2023
      - sbca-bcsi-current
  - rule_id: reject_path_and_balance
    applies_to: "all material and residual cards"
    rule: "Reconcile each material state and defect event to installed output, stock, genuine usable return, rejected product return or waste. Require receiver/status and transfer IDs; retain correction burdens and prevent double subtraction or rejected-set acceptance."
    source_ids: []
  - rule_id: shared_phase_coverage
    applies_to: "temporary_stability_service; lifting_access_service; logistics; installation_energy; direct_fuel; direct_releases"
    rule: "Require complete all-consumer and P1/P2/P3 ledgers, actual causal allocations and full service coverage. Verify replacement/termination owner, authorized support removal gate and matching receiving dataset responsibility; unresolved phase/asset/removal coverage blocks completion. Count provider-included and direct operation once."
    source_ids: []
  - rule_id: actual_identity_quantity
    applies_to: "all inventory rows"
    rule: "Require actual identity/property/unit compatibility and traceable linked node-specific protocols. Each Range evidence need must be closed by actual evidence or disclosed as unresolved; fixed reference quantity is a definition, not a yield range. Check every actual conditional material/waste/substance separately and reject fabricated default fuel, density, loss, fastener, emission or carbon-credit values."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground site erection data package, with process and lifecyclemodel projections and actual component/resource background links"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Model first erection of the declared matching timber roof-truss set at its qualified braced erection-stage gate, with disclosed later stability obligations"
  excluded_use: "Generic roof area, one factory truss, complete building/roof structural or weather performance, floor/metal trusses, relocation, manufacturing or structural repair"
  required_metadata: "All required reference qualifiers; node and set ID; supply-kit and provider boundaries; component/resource geography and dates; P1/P2/P3 owners/events; all-consumer allocation; receiver/stock/waste paths; actual source versions and exchange identities"
  required_quality_disclosure: "Identity and support gaps; unresolved Range evidence; measurements and uncertainty; exclusions; shared/capital/service/termination coverage; actual later diaphragm dependency and support-removal responsibility"
  update_trigger: "Changed design/package or host interface; current instruction applicability; truss/bracing/connection specification; damaged/altered components; service/provider allocation or phase owner; resource/factor identity; revised stability gate or removal plan"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, printed p. 291, 54522 and adjacent 54530. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope and narrower roof-truss route; roof-covering separation"
  - id: "sbca-installation-2023"
    type: "extension_guidance"
    reference: "Structural Building Components Association, BCSI Guides Truss Installation Process, Pt 2, 8 August 2023. https://www.sbcacomponents.com/media/bcsi-guides-truss-installation-process-pt-2"
    used_for: "Qualitative pre-review, bearing/placement/anchoring, temporary stability, permanent member-bracing and inspection sequence; no universal numerical design values adopted"
  - id: "sbca-bcsi-current"
    type: "extension_guidance"
    reference: "Structural Building Components Association, Building Component Safety Information Guide landing page, revised BCSI-2025, accessed 15 October 2026. https://www.sbcacomponents.com/bcsi"
    used_for: "Current edition context and distinction of temporary/permanent restraint and bracing; full paid guide not claimed read"
  - id: "sbca-jobsite-packages"
    type: "extension_guidance"
    reference: "Structural Building Components Association, Jobsite Packages, accessed 15 October 2026. https://www.sbcacomponents.com/jobsite-packages"
    used_for: "Job-specific installation/safety package and truss design/project-document requirement; actual package applicability remains foreground evidence"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:3b1d4b1572f67bffdadf1981d6bb062ec95ba94990eadaf05c2078b6e173eb24"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6734"
      family: "system_boundary"
      span:
        start:
          offset: 6734
          line: 60
          column: 1
        end:
          offset: 27401
          line: 310
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Factory-complete identified timber trusses and specified installation components at their declared supply gate, with existing bearings accepted for the actual package and lifting access available |\n| starting_condition_role | Foreground erection boundary; host readiness is a documented interface, not a zero-burden substitute for construction in a whole-building model |\n| product_classification_scope | Narrower timber-truss erection subset of CPC 3.0 54522; separate from roof coverings under 54530 |\n| recursive_input_rule | Record factory trusses as component products, not as this erection service. If a previously erected set or subcontracted erection service enters the package, disclose its completed scope and prevent repeating the same erection or resource burden; a relocation is outside first erection. |\n| upstream_dataset_requirement | Use actual supply-gate truss/component and resource datasets with declared packaging, freight, energy and temporary-asset coverage. Include upstream manufacture through these inputs; do not recreate factory production in the site node. |\n| disclosure | Declare supplied-kit coverage, excluded host/diaphragm work, physical state and responsibilities at the erection gate, all shared consumers and periods, and temporary-support production/use/removal coverage and later owner. Unresolved stability or service coverage blocks a completed dataset. |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `document_and_host_gate` | roof_truss_erection | Before erection, reconcile actual truss design/placement/jobsite documents, approved erection/bracing plans and accepted bearings; resolve conflicts through the responsible designer/manufacturer. Record project-specific applicability rather than importing public article dimensions or tolerances. | `sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages` |\n| `erection_components` | roof_truss_erection | Own finished trusses, additional bearing fasteners/hangers, permanent brace/restraint members and their fixings, temporary-stability service, lifting/access, installation energy, freight, actual auxiliary consumption, packaging and correction losses. Identify which items are already in the supplied kit to avoid counting them twice. | `sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages` |\n| `erection_gate` | erected_roof_truss_set | Handover requires every specified truss positioned, securely connected at its accepted bearings, required permanent individual-member restraints/bracing installed, closed inspection findings and signed responsibility transfer. This is an erection-stage gate; do not claim complete roof load, weather, fire or thermal performance. | `sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages` |\n| `retained_temporary_stability` | temporary_stability_service | Where a later diaphragm is needed, retain required temporary restraint. Index erection, post-handover continuation, later stability confirmation and authorized removal/return; name custody and removal owner at each change. A bounded service must include or explicitly link asset production, installation, maintenance/use, replacement, removal, return transport and end-of-use treatment; it cannot erase these burdens. | `sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages` |\n| `external_repair_boundary` | roof_truss_erection | Placement/connection corrections loop within this node with their full resource burdens. Damaged, unsuitable or altered trusses remain quarantined; return or characterize their waste exit. Cutting/notching/drilling trusses and structural repair are not admitted operations in this PCR. | `sbca-installation-2023`; `sbca-bcsi-current`; `sbca-jobsite-packages` |\n| `resource_and_release_boundary` | roof_truss_erection | For crane, access, temporary bracing and freight, identify full provider coverage and every actual consumer/period, including other work packages. If the provider includes operation fuel/emissions, do not add the same operation again. For directly controlled equipment collect fuel, energy and characterized direct releases separately; no unmeasured zero assumption. |  |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Specified pre-sized permanent timber restraint and bracing members (`permanent_bracing`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `inputs` / `product`.\n\nInclude the actual members and reinforcements installed at this erection gate. Separate components supplied in the truss kit from additional purchases; no site transformation of trusses is permitted.\n\n- Collection subject: Specified pre-sized permanent timber restraint and bracing members\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66` / kg\n- Amount rule: Actual gross job receipts/issues attributable to this set by material/specification, including correction supply; measure the net material mass of those receipts/issues and record installed, usable-return and retained-stock states separately, without subtracting a separately modelled return again.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_components`\n- Sources: `sbca-installation-2023`; `sbca-bcsi-current`\n\nRange evidence need: Actual engineer-approved brace schedule, pieces and measured/supplier masses are needed; no generic brace spacing, timber density, loss fraction or force capacity is supplied.\n\n#### Collection requirement: Specified bearing connectors and installation fasteners (`bearing_connectors`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `inputs` / `product`.\n\nRecord actual hangers, bearing connections, brace fixings and fasteners not already included in the factory product or other service input. Split material and corrosion-protection identities using actual purchase and installation records.\n\n- Collection subject: Specified bearing connectors and installation fasteners\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66` / kg\n- Amount rule: Actual gross job receipts/issues of connectors and fasteners by material/type attributable to this set, including correction supply; retain counted items and their net material mass, with installed, usable-return and retained-stock states recorded separately and no double net subtraction.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_components`\n- Sources: `sbca-installation-2023`\n\nRange evidence need: Obtain actual approved connection schedule and item-specific mass evidence; no standard nail count, anchor capacity or generic steel substitution is valid.\n\n#### Collection requirement: Bounded temporary roof-truss restraint and bracing service (`temporary_stability_service`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `inputs` / `product`.\n\nThis conditional umbrella identifies the actual temporary restraint/bracing system and service provider or owner. Disaggregate each actual system. Coverage includes capital materials/assets and installation, retention, maintenance, replacement, authorized removal and return/end-of-use burdens; the h unit only records the declared service interval.\n\n- Collection subject: Bounded temporary roof-truss restraint and bracing service\n- Flow property / unit: Duration / h\n- Amount rule: Actual allocated service-hours and underlying system quantities/resources for the erection period and the separately indexed retained-support continuation; include linked future removal obligations and disclose unresolved provider coverage.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_services`\n- Sources: `sbca-installation-2023`; `sbca-bcsi-current`\n\nRange evidence need: Obtain actual approved temporary-bracing plan, member/asset inventory, dates, all consumers, ownership and removal/return records; neither a default duration nor zero asset burden can be inferred.\n\n#### Collection requirement: Bounded crane, lifting and access equipment service (`lifting_access_service`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `inputs` / `product`.\n\nIdentify actual crane/rigging, hoisting and access systems serving the erection. For each provider disclose included mobilization, equipment production/maintenance, operation and demobilization; separate direct-operation inputs only when absent from that service.\n\n- Collection subject: Bounded crane, lifting and access equipment service\n- Flow property / unit: Duration / h\n- Amount rule: Actual service-specific operating/standby hours and allocated mobilization/demobilization events, retaining all other consuming jobs and the provider inventory basis.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_services`\n- Sources: `sbca-installation-2023`\n\nRange evidence need: Obtain actual lift plan and equipment/service logs, provider coverage and whole-period consumer denominator; no fuel-per-lift or capacity/time defaults are specified.\n\n#### Collection requirement: Actual component and residual freight service (`logistics`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `inputs` / `product`.\n\nRecord actual transport legs for trusses, additional components, packaging and residual/return movements not included upstream or in a bounded service. Keep payloads, mode and provider boundaries distinct.\n\n- Collection subject: Actual component and residual freight service\n- Flow property / unit: Transport / t*km\n- Amount rule: Actual consignment mass and loaded distance by leg, with allocated empty-return/mobilization coverage where applicable; exclude freight already covered by upstream/provider datasets.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_logistics`\n\nRange evidence need: Obtain actual payload, route, distance and vehicle/service records; no typical distance or load factor is justified for an unspecified site.\n\n#### Collection requirement: Actual fuel supplied to directly controlled erection equipment (`direct_fuel`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `inputs` / `product`.\n\nConditional umbrella for actual combustion fuel identities crossing the site boundary. Use this card only for operation not already included in crane/access/logistics services; keep fuel types and supply forms separate.\n\n- Collection subject: Actual fuel supplied to directly controlled erection equipment\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66` / kg\n- Amount rule: Actual fuel consumed by fuel type and equipment/period from refuelling and opening/closing stock records; convert volume only with actual fuel density evidence.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_resources`\n\nRange evidence need: Obtain actual equipment, fuel specification, consumed quantities and provider exclusions; fuel identity, density and consumption cannot be inferred from lifting requirements.\n\n#### Collection requirement: Actual auxiliary installation consumables (`ancillary_materials`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `inputs` / `product`.\n\nConditional umbrella for genuinely consumed supplementary materials such as equipment lubricants when attributable and absent from provider inputs. No coating, adhesive, truss repair chemical or water-consuming route is presumed.\n\n- Collection subject: Actual auxiliary installation consumables\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66` / kg\n- Amount rule: Actual consumed net mass by substance/product identity and declared use, separating returned stock and waste; add any real water input with its property/unit from actual records.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_components`\n\nRange evidence need: Actual purchase/use/stock records and material identity are needed; a zero, one or multiple exchange outcome depends on the job and cannot use a generic chemical factor.\n\n#### Collection requirement: Actual incoming transport packaging (`transport_packaging`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `inputs` / `product`.\n\nIdentify actual wrapping, straps, dunnage and reusable packaging at the declared supply gate. Activate a separate burden-bearing input only for separately supplied packaging or the portion not covered by the upstream product dataset. Supplier-included packaging still requires physical custody/exit records, without a second upstream material-production burden. Reusable temporary-bracing assets remain in their service.\n\n- Collection subject: Actual incoming transport packaging\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66` / kg\n- Amount rule: Actual incoming packaging mass by material and coverage: only separately supplied or upstream-uncovered packaging becomes an additional burden-bearing input; retain all packaging in the custody ledger and reconcile stock, genuine return and waste without double counting.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_residuals`\n\nRange evidence need: Obtain supplier packaging declarations and site counts/weighing with actual custody; no universal packaging intensity or return rate is established.\n\n#### Collection requirement: Usable installation-material and packaging returns (`reusable_returns`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `outputs` / `product`.\n\nConditional product-output umbrella for genuine unused connectors/braces and reusable packaging leaving to a named supplier or store. Record separate materials and destinations; retained site stock is a ledger state rather than an invented exit. Do not place rejected trusses here.\n\n- Collection subject: Usable installation-material and packaging returns\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66` / kg\n- Amount rule: Actual dispatched usable return mass by identity, receiving custodian and transfer ID, reconciled to gross supply and retained stock without a second net subtraction.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_residuals`\n\nRange evidence need: Obtain actual return acceptance, custody and mass records; no default reusable fraction or avoided-production credit is assumed.\n\n#### Collection requirement: Quarantined roof trusses returned for disposition (`rejected_truss_returns`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `outputs` / `product`.\n\nConditional product-output umbrella only when the receiving manufacturer or other identified custodian accepts the actual trusses for further use or authorized disposition as products. Include defect state and transfer record; waste-status trusses use the waste card instead.\n\n- Collection subject: Quarantined roof trusses returned for disposition\n- Flow property / unit: Number of items `01846770-4cfe-4a25-8ad9-919d8d378345` / item\n- Amount rule: Actual returned count by truss ID with disposition, recipient and matching receipt; prevent those pieces from entering the accepted-set count or being counted again as waste.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_residuals`\n- Sources: `sbca-installation-2023`\n\nRange evidence need: Actual damage/inspection and manufacturer/engineer disposition plus return records determine quantities and product/waste classification; no reject fraction is established.\n\n#### Collection requirement: Characterized erection and packaging waste (`erection_waste`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `outputs` / `waste`.\n\nConditional waste-output umbrella for actual discarded connectors, braces, damaged trusses and packaging; segregate by material, hazardous status and receiving treatment. Retain failed-attempt and correction burdens. This route does not assume truss-cutting sawdust.\n\n- Collection subject: Characterized erection and packaging waste\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66` / kg\n- Amount rule: Actual weighed or traceably documented waste mass by material/status and destination with transfer IDs; keep captured residue distinct from releases and usable returns.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_residuals`\n\nRange evidence need: Obtain actual waste tickets, segregation and treatment evidence; no generic installation loss or recycling yield is imposed.\n\n#### Collection requirement: Characterized direct erection releases to the environment (`direct_releases`)\n\nProcess / prospective direction / type: `roof_truss_erection` / `outputs` / `elementary`.\n\nConditional elementary-output umbrella for actual directly operated equipment combustion species and measured installation particles or other releases. Establish substance, receiving medium and particle class/basis before selecting each concrete flow; provider-included releases are not repeated.\n\n- Collection subject: Characterized direct erection releases to the environment\n- Flow property / unit: Mass `93a60a56-a3c8-11da-a746-0800200b9a66` / kg\n- Amount rule: Actual measured or defensibly calculated substance-specific mass using recorded activity and applicable source-specific factors, with capture controls and receiving compartment; unknown releases remain data gaps.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_releases`\n\nRange evidence need: Obtain actual equipment/fuel/emission-factor or sampling evidence and receiving medium; no generic VOC, particulate or exhaust quantity is fabricated.\n\n"
