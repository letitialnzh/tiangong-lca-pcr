          role: "Actual supplied equipment lubricant formulation"
          name: "Actual supplied equipment lubricant formulation"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Conditional on attributable lubrication. Resolve each formulation and supplied state independently; recoverable oil, retained inventory and accidental release are separate outlets. Supplier-included machine lubricant must not be charged twice. Range evidence need: Obtain product instructions and measured replenishment/change/return records for the actual equipment; no generic oil factor is justified."
          amount:
            expression: "Gross net-tare actual lubricant formulation issued to campaign custody divided by A. Opening-stock burden transfer and retained closing-stock carryforward follow custody_and_stocks."
            value_mode: "foreground_record"
