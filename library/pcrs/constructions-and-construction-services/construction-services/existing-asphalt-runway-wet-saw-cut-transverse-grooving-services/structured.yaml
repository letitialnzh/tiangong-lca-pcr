          name: "Actual separately identified material supplied for job-induced damage remedy"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Conditional on directed job-induced damage remedy. Each actual asphalt repair mixture, binder, sealant or other distinct product becomes its own verified exchange; the card is a collection obligation and never a blended generic material total. Prior major repair is outside this service with explicit owner and incoming soundness gate. Range evidence need: Only actual approved remedy and measured lot records can establish supply; no assumed defect rate or repair recipe is prescribed."
          amount:
            expression: "Gross net-tare supply of each actual repair material for job-induced defects divided by A; retain identity-specific outlets and stocks."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
