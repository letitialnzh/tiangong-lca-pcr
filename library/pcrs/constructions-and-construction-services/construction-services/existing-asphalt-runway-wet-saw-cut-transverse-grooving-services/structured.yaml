allocation_rules:
  - rule_id: campaign_attribution
    applies_to: "all inventory rows"
    rule: "Attribute direct campaign records to the accepted footprint A. Setup, approved control strip, machine alignment, cleaning, stoppages and rework retain burdens even when their areas are not accepted saleable output. For mixed work orders, separately meter where feasible, otherwise document causal machine-time/service evidence and sensitivity; price is not a default allocation key."
    source_ids: []
  - rule_id: run_attribution
    applies_to: "groove_finish"
    rule: "Link every issue, water/energy demand, waste collection, changeover, blade replacement and remedy to machine/head/day/run and work window. Shared setup/cleaning is assigned once to its actual beneficiary runs before campaign summation. Accepted polygons are deduplicated across passes and runs."
    source_ids: []
  - rule_id: asset_complete_life
    applies_to: "capital_service"
    rule: "For each asset enumerate all jobs/nodes/reporting periods and complete manufacture, maintenance, replacement and EOL coverage. Use actual campaign service divided by complete-life service with consistent driver, before dividing by A; observed history for completed lives, justified prospective remaining-service/replacement/termination/EOL scenario for in-service assets. Label observed/forecast components, sensitivity, denominator evidence and update triggers; missing coverage or denominator blocks finalization."
    source_ids: []
  - rule_id: no_duplicate_burden
    applies_to: "all inventory rows"
    rule: "Retained host is not a newly produced asset. Machine fuel/electricity, diamond blades, lubrication, freight and treatment are owned once: disclose supplier/dataset inclusions and remove overlaps from capital or bundled services. No avoided construction/recycling credit or co-product allocation is assumed."
    source_ids: []
  - rule_id: reject_retention
    applies_to: "groove_finish"
    rule: "Off-spec geometry, uncleared slurry and damaged pavement remain WIP/reject until directed remedy and acceptance. Rework loops to groove_finish retain all original and repeat burdens; discarded material leaves as identified waste. Unresolved/abandoned zones contribute burdens but never accepted footprint."
    source_ids:
      - faa-p621-2018
  - rule_id: custody_and_stocks
    applies_to: "all inventory rows"
    rule: "Gross net-tare material/fuel issue is not reduced by outward returns if those returns are outputs. Transfer opening-stock physical quantity and its unconsumed upstream burden from the prior custody/period ledger exactly once; charge newly issued products at their actual supply gate. Attribute used/transformed quantities and actual outward returns/waste/releases without recharging the transferred opening stock. Retained closing-stock physical quantity and its unconsumed upstream burden carry forward to the next period/custody ledger; they do not create outward exchanges. State how the normalized campaign inventory and stock transfers preserve total upstream burden across periods, without losing opening-stock burden or charging closing stock again. Product returns, collected waste and actual environmental release are mutually exclusive outlets; incident spill total is partitioned and not subtracted twice."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "groove_finish"
      flow_role: "Accepted area and geometry"
      record_type: "Foreground measured/logged records"
      raw_fields: "site_id; runway_coordinates; campaign_id; work_window; machine_id; head_id; pass_id; polygon_vertices_m; excluded_polygon_vertices_m; accepted_polygon_vertices_m; rejected_polygon_vertices_m; control_strip_area_m2; groove_width_mm; groove_depth_mm; groove_spacing_mm; orientation_deg; alignment_deviation_mm; alignment_length_m; edge_clearance_m; light_clearance_mm; joint_clearance_mm; zone_id; test_time; instrument_range_mm; instrument_resolution_mm; adopted_unit_system; specification_revision; acceptance_signature; handback_time"
      collection_method: "Survey plan-view polygon union A, omitted zones and separately identified control strip; retain adopted P-621 geometry and alignment values, original unit-system samples and signed zone acceptance. P-621 SI alignment ±38 mm over 23 m with realignment every 150 m; retain printed nominal SI spacing 38 mm (-3/+0) and separately printed minimum acceptance spacing 34 mm as distinct clauses; obtain documented adopted project hierarchy/resolution of this discrepancy before accepting spacing. Do not silently harmonize rounded SI/inch values. Zone distributions apply under that declared criterion. Width/depth instruments range ≥12 mm and resolution ≤0.13 mm; spacing range ≥80 mm and resolution ≤0.5 mm. Record actual equivalent inch criteria if adopted, without interchanging rounded thresholds."
      unit: "m2; mm; m; degree"
      frequency: "Every pass spot check and adopted zone-testing frequency; each final acceptance"
      temporal_coverage: "Entire campaign plus attributable setup/control strip/rework and stock handover"
      site_scope: "Declared runway, machines/heads, work windows and supply/receiver gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated survey and gauges; five zones and five consecutive grooves/head with ≥3 rounds/day; P-621 depth/width distribution ≥90% at least 5 mm, ≥60% at least 6 mm, ≤10% beyond 8 mm under adopted SI system; retain exact specified threshold conventions and corrective adjustments, edge/light/joint exclusions and signatures. Do not turn instrument resolution into permission to widen tolerances."
    - protocol_id: cp_water
      process_id: "groove_finish"
      flow_role: "Purchased/abstracted water, internal reuse and water balance"
      record_type: "Foreground measured/logged records"
      raw_fields: "water_source; provider; water_grade; meter_id; meter_start_m3; meter_end_m3; tank_open_m3; tank_close_m3; reused_m3; slurry_water_kg; host_moisture_kg; weather_water_kg; release_water_kg; density_kg_m3; density_temperature_C"
      collection_method: "Meter actual external purchased and abstracted quantities separately; track internal recycling, tanks, wet/dry slurry analysis, evidenced host moisture/weather and actual water release/evaporation. Divide external entries by A; use actual density/temperature only where mass-volume conversion is required."
      unit: "m3; kg; kg/m3; degC"
      frequency: "Each fill/withdrawal/work window and campaign closure"
      temporal_coverage: "Entire campaign plus attributable setup/control strip/rework and stock handover"
      site_scope: "Declared runway, machines/heads, work windows and supply/receiver gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, tank checks, source/permit/provider documents, paired wet/dry sample and water closure; investigate residuals instead of assuming emission."
    - protocol_id: cp_fuel
      process_id: "groove_finish"
      flow_role: "Fuel issues, burned activity and outlets"
      record_type: "Foreground measured/logged records"
      raw_fields: "fuel_grade; equipment_id; issue_gross_kg; container_tare_kg; opening_stock_kg; opening_stock_upstream_burden; closing_stock_upstream_burden; outward_return_kg; closing_stock_kg; waste_collected_kg; total_spill_kg; spill_collected_kg; spill_released_kg; density_kg_m3; temperature_C; operating_hours"
      collection_method: "By actual grade derive net-tare gross issues and physical stock balance, transfer opening stock with its unconsumed upstream burden exactly once, and carry retained closing stock with remaining burden to the next custody/period ledger; do not recharge prior stock or lose its burden. Burned kg = opening + issues - closing - usable outward returns - collected waste - actual environmental release; collected spill appears once within waste and released spill once within release. Total spill is an audit partition, not another subtraction. Normalize input/output and burned activity separately by A."
      unit: "kg; kg/m3; degC; h"
      frequency: "Each issue, work window, return and incident"
      temporal_coverage: "Entire campaign plus attributable setup/control strip/rework and stock handover"
      site_scope: "Declared runway, machines/heads, work windows and supply/receiver gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/delivery density evidence; grade and equipment compatibility; mutually exclusive custody outlets and balance uncertainty; no net-input plus duplicated return."
    - protocol_id: cp_energy
      process_id: "groove_finish"
      flow_role: "Externally purchased electricity"
      record_type: "Foreground measured/logged records"
      raw_fields: "provider; connection_id; meter_id; voltage_V; meter_start_kWh; meter_end_kWh; work_window; equipment_id; generator_boundary; overlap_dataset"
      collection_method: "Submeter attributable external electrical demand and assign shared-load periods with actual time/load evidence before division by A; identify generator supplied energy already charged through fuel."
      unit: "kWh; V"
      frequency: "Each work window and attributable setup/cleanup"
      temporal_coverage: "Entire campaign plus attributable setup/control strip/rework and stock handover"
      site_scope: "Declared runway, machines/heads, work windows and supply/receiver gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, supplier boundary, load attribution and zero duplicate generator-fuel charge; retain uncertainty and actual supply qualifiers."
    - protocol_id: cp_materials
      process_id: "groove_finish"
      flow_role: "Distinct supplied tools, lubricant, repair materials, packaging and unused returns"
      record_type: "Foreground measured/logged records"
      raw_fields: "product_id; formulation; supplier; lot_id; supplied_gross_kg; tare_kg; opening_stock_kg; opening_stock_upstream_burden; closing_stock_upstream_burden; outward_return_kg; closing_stock_kg; incorporated_or_used_kg; waste_kg; released_kg; blade_diameter_mm; blade_wear_mm; replacement_time; damage_zone_id; supplier_included_coverage"
      collection_method: "Record gross net-tare issue, opening physical stock and unconsumed upstream-burden transfer, true outward returns and retained closing physical stock with its carried-forward unconsumed upstream burden for each concrete identity. Preserve cross-period ledger ownership once; no recharge of opening stock or missing opening-stock burden. Include actual distinct absorbents/wipes/containment when used and their contaminated waste composition. Reconcile use, tool wear, waste/release and remedy incorporation. Retain approved compatible blade/remedy instructions and no duplicate bundled packaging/lubrication charge; divide each distinct exchange by A."
      unit: "kg; mm"
      frequency: "Each receipt/issue/replacement/return, remedy and closure"
      temporal_coverage: "Entire campaign plus attributable setup/control strip/rework and stock handover"
      site_scope: "Declared runway, machines/heads, work windows and supply/receiver gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Lot/scale/tare evidence, supplier composition and custody tickets; blade uniformity and job-induced remedy linkage; retained-stock burden carried forward, not emitted as output."
    - protocol_id: cp_transport
      process_id: "groove_finish"
      flow_role: "Actual freight legs and coverage"
      record_type: "Foreground measured/logged records"
      raw_fields: "cargo_identity; mode; provider; leg_id; origin; destination; net_cargo_kg; distance_km; loaded_trip; empty_vehicle_distance_km; vehicle_service_record; supplier_included_coverage; fuel_overlap"
      collection_method: "For each mode/provider leg multiply actual net cargo kg by actual km, allocate only documented campaign cargo and divide by A; retain empty-leg vehicle records and explicit model/dataset boundary, without inventing tonnes for an empty vehicle."
      unit: "kg; km; kg*km"
      frequency: "Every delivery/mobilization/demobilization/collection leg"
      temporal_coverage: "Entire campaign plus attributable setup/control strip/rework and stock handover"
      site_scope: "Declared runway, machines/heads, work windows and supply/receiver gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Bills, maps/odometer and loading records; verify kg*km chain and t*km factor 1000; provider inclusions prevent direct vehicle-fuel duplication."
    - protocol_id: cp_assets
      process_id: "groove_finish"
      flow_role: "Complete-life asset service and shared consumers"
      record_type: "Foreground measured/logged records"
      raw_fields: "asset_id; asset_type; manufacture_dataset; maintenance_dataset; replacement_dataset; eol_dataset; coverage_exclusions; consumer_job; consumer_node; reporting_period; observed_service; campaign_service; forecast_remaining_service; service_driver_unit; replacement_scenario; termination_scenario; eol_scenario; uncertainty; sensitivity; update_date"
      collection_method: "Enumerate every saw/vacuum/tanker/cleaner/generator/metrology asset and actual access/protection/containment/remedy equipment actually used, including bounded third-party provider resources once, complete-life burden coverage and all consumers/periods. Compute campaign service/complete-life service for each asset, then divide by A; service driver must match numerator/denominator. Retired assets use observed full history; operating assets use observed history plus justified remaining service and replacement/termination/EOL scenarios."
      unit: "item; actual documented driver unit"
      frequency: "Each asset/work window and lifecycle scenario update"
      temporal_coverage: "Entire campaign plus attributable setup/control strip/rework and stock handover"
      site_scope: "Declared runway, machines/heads, work windows and supply/receiver gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Coverage matrix excludes direct blades, fuel, electricity, lubrication, transport already charged. Denominator source, observed/forecast labels, uncertainty/sensitivity and update triggers required; missing evidence blocks finalization."
    - protocol_id: cp_residuals
      process_id: "groove_finish"
      flow_role: "Slurry, spent tools, packaging, fluids and remedy debris"
      record_type: "Foreground measured/logged records"
      raw_fields: "residual_identity; composition; receiver; waste_code; wet_gross_kg; tare_kg; dry_solids_kg; water_kg; opening_residual_stock_kg; closing_residual_stock_kg; removed_asphalt_dry_kg; blade_wear_kg; spill_collected_kg; damage_zone_id; transfer_time; treatment_coverage"
      collection_method: "Weigh net outgoing residual by concrete identity and receiver; paired dry-solids/water samples distinguish wet slurry, dewatered fines and separated water without duplicating components. Link spent blade/wear and actual remedy debris, plus contaminated cleanup consumables as distinct composition/receiver exchanges with absorbed fluid counted only once; all retained residual stock remains closure balance. Match approved waste disposition records and include required treatment once."
      unit: "kg"
      frequency: "Each collection/transfer/sample and closure"
      temporal_coverage: "Entire campaign plus attributable setup/control strip/rework and stock handover"
      site_scope: "Declared runway, machines/heads, work windows and supply/receiver gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated weigh/tare, representativeness and dry-solids method, receiver acceptance and custody, retained-host moisture and fines/tool reconciliation; no default density or recovery credit."
    - protocol_id: cp_emissions
      process_id: "groove_finish"
      flow_role: "Identified engine species, fugitive particles and actual environmental release"
      record_type: "Foreground measured/logged records"
      raw_fields: "equipment_id; fuel_grade; burned_fuel_kg; substance; particle_size_um; receiving_medium; compartment; measured_release_kg; factor_value; factor_unit; factor_source; factor_applicability; factor_uncertainty; total_spill_kg; collected_spill_kg; released_spill_kg; water_density_kg_m3; temperature_C"
      collection_method: "For each actual substance/medium use measured release or burned fuel times documented applicable species factor with matching units. Record method, engine/load/fuel and uncertainty; air particles require size/composition. Incidents partition total into collected and released; actual water discharge/evaporation needs outlet/measurement and density where converted. Divide actual species mass by A."
      unit: "kg; um; declared factor unit; kg/m3; degC"
      frequency: "Each applicable work window/test and each incident"
      temporal_coverage: "Entire campaign plus attributable setup/control strip/rework and stock handover"
      site_scope: "Declared runway, machines/heads, work windows and supply/receiver gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Method/factor provenance and applicability; species/compartment resolution; no residual-as-emission, generic NOx/VOC identity or duplication of supplier electricity/freight emissions."
  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "Each distinct attributable campaign exchange quantity divided by positive accepted polygon-union A gives its quantity per 1 m2. Reference service is exactly 1 m2. Repeated passes do not enlarge A; failed/abandoned-zone and control-strip burdens remain assigned with disclosed causality."
      inputs:
        - cp_acceptance
        - "relevant row protocol"
        - "distinct campaign exchange quantity"
        - A
      output: "Distinct reference-normalized exchange"
      source_ids: []
    - id: burned_fuel_balance
      applies_to: "fuel_supply, combustion_emissions, spent_fluids, unused_returns, liquid_release"
      rule: "By actual grade burned fuel = opening stock + gross net-tare issues - closing stock - usable outward returns - collected waste - actual release. Total spill partitions into collected and released portions and is not another subtraction."
      inputs:
        - cp_fuel
        - cp_materials
        - cp_residuals
        - cp_emissions
      output: "Burned fuel kg for applicable factors; separate gross input and outlets per reference flow"
      source_ids: []
    - id: asset_share
      applies_to: "capital_service"
      rule: "Asset-equivalent share = campaign service divided by complete-life service; reference quantity = share divided by A. Use same physical driver and complete life across all jobs/periods, observed plus justified forecast when operating; include complete coverage and exclude direct rows."
      inputs:
        - cp_assets
        - cp_acceptance
      output: "item of each concrete asset-equivalent per reference flow"
      source_ids: []
    - id: cargo_leg_service
      applies_to: "freight_service"
      rule: "For each actual provider/mode sum net cargo kg times leg km then divide by A; convert t*km using factor 1000 only. Empty-leg service follows documented actual vehicle dataset boundary."
      inputs:
        - cp_transport
        - cp_acceptance
      output: "kg*km by actual freight identity per reference flow"
      source_ids: []
    - id: combustion_species
      applies_to: "combustion_emissions"
      rule: "For each actual engine/fuel/species, species kg = burned fuel kg times applicable factor kg species/kg fuel, or actual measured species kg; divide by A. Other factor units require evidenced compatible activity conversion before use, not an assumed heating value."
      inputs:
        - cp_fuel
        - cp_emissions
        - cp_acceptance
      output: "kg of each identified species/air compartment per reference flow"
      source_ids: []
    - id: wet_residual_closure
      applies_to: "captured_slurry, spent_blades, liquid_release, fugitive_particles"
      rule: "Net wet slurry = measured water + dry solids for the same outgoing lot. Reconcile removed host dry material and blade wear with captured solids, actual escaped particles and residual stock; water balance separately tracks external supply, host moisture, weather, slurry, stock and actual release/evaporation. Unknown residual remains investigation."
      inputs:
        - cp_water
        - cp_materials
        - cp_residuals
        - cp_emissions
      output: "Distinct mass/water closures and flagged uncertainty; no invented emission"
      source_ids: []
  data_quality_requirements:
    - id: dq_actual_route
      applies_to: "groove_finish"
      requirement: "Complete possession and actual equipment/head/day/pass lineage with qualified asphalt and adopted geometry; no presumed quantities from CPC or payment rate."
      evidence: "cp_acceptance; approved method; incoming condition and handback records"
    - id: dq_complete_campaign
      applies_to: "all inventory rows"
      requirement: "Cover setup/control strip, productive cutting, continuous recovery/cleanup, idle windows, changeovers, replacements, job-induced repair and final disposal without unsupported zeros."
      evidence: "All linked CPs; stock and period reconciliation"
    - id: dq_uncertainty
      applies_to: "all inventory rows"
      requirement: "Keep meter/scale/survey/sample error, temporal variability, attribution and scenario uncertainty; obtain comparable empirical ranges before final limits. Exact 1 m2 is reference definition, not observed yield."
      evidence: "Calibration certificates, paired samples, actual run data, scenario sensitivity"
    - id: dq_asset_evidence
      applies_to: "capital_service"
      requirement: "Document all service periods/consumers, complete-life sources and justified forecast components; no universal life assumption, duplicate direct tool coverage or observed future retirement requirement."
      evidence: "cp_assets coverage matrix and denominator/scenario evidence"
    - id: dq_final_binding
      applies_to: "all inventory rows"
      requirement: "Resolve each concrete identity/support chain before final TIDAS exchange; disclose unresolved card identities/quantity evidence and prohibit conceptual umbrella binding."
      evidence: "Verified identity evidence and row-addressable manifest metadata"
validation_rules:
  - rule_id: check_scope_start
    applies_to: "groove_finish"
    rule: "Verify retained existing asphalt scope, incoming soundness, explicit owner of prior repair, current project adoption, approved method/guides/control strip, possession dates and actual weather suitability. Do not import the new-pavement 30-day cure clause as a universal waiting rule for existing qualified asphalt."
    source_ids:
      - faa-p621-2018
  - rule_id: check_geometry_zone
    applies_to: "accepted_grooving"
    rule: "Check documented project resolution/criterion hierarchy for the printed nominal spacing 38 mm (-3/+0) versus separately printed 34 mm minimum acceptance; retain both original clauses without universal correction or silent SI/inch equivalence. Check project-adopted P-621 geometry/alignment, omitted edge/light/joint zones and actual signed sampling results. P-621 uses five widthwise zones, five consecutive grooves near middle blade of every head, each machine/day, at least three measurement rounds/day. Record selected-unit instrument range/resolution and actual acceptance/adjustment thresholds; surface variability can require more tests."
    source_ids:
      - faa-p621-2018
  - rule_id: check_unique_area
    applies_to: "accepted_grooving"
    rule: "Require positive accepted polygon-union A, excluded zones and accepted/rejected/WIP reconciliation, not blade length, void cross section, summed multiple passes or control-strip co-product. Reference/output property is Area, amount 1 m2, support chain verified independently; service UUID unresolved blocks final exchange binding."
    source_ids: []
  - rule_id: check_custody_balance
    applies_to: "all inventory rows"
    rule: "Reconcile opening-stock physical quantity/upstream-burden transfer and retained closing-stock carryforward across periods exactly once, then reconcile net-tare gross issues plus opening stocks against outward usable returns, closing stocks, transformation/consumption, collected waste and evidenced release per distinct identity. Burned fuel derives from mutually exclusive outlets. Slurry wet mass, dry solids, water and blade wear reconcile with actual removed asphalt and moisture/weather terms; unknown residual is investigated, not automatic emission."
    source_ids: []
  - rule_id: check_asset_and_runs
    applies_to: "capital_service"
    rule: "Require indexed manufacture/service/maintenance/replacement/EOL phases, all consuming jobs/periods, justified complete-life denominator and observed/forecast labels, scenario sensitivity and updates. Confirm no shared run, blade, fuel, electricity or capital charge appears twice. Missing scenario evidence or ownership blocks completion."
    source_ids: []
  - rule_id: check_reject_and_cleanup
    applies_to: "groove_finish"
    rule: "Require every off-spec/damaged zone linked to repeat work or documented exit, all attributable remedies and final handback, continuous cleanup, approved residual receiver and no assumed sewer disposal. Rejected/unfinished surface is not accepted output."
    source_ids:
      - faa-p621-2018
  - rule_id: check_identity_range
    applies_to: "all inventory rows"
    rule: "Verify actual exchange identity, state, gate, direction, provider/receiver, species and medium plus property/unit before final UUID binding. Require row-applicable CP/calculation and either justified range or explicit evidence need; no universal resource/defect/lifetime/emission factor from technical groove specification. Unknown quantities remain disclosed blockers."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground incremental construction-alteration service package for accepted existing-asphalt grooving footprint"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Runway alteration service with same retained asphalt, wet rectangular transverse saw route, adopted geometry, campaign and acceptance gate; downstream process/lifecyclemodel projection"
  excluded_use: "New pavement asset production, other substrate/groove technology, complete airport operation, friction coefficient or service-life guarantee, avoided replacement credit"
  required_metadata: "Site/runway coordinates; retained-host qualification/prior-repair owner; actual contract/unit system; campaign/run/head/weather; footprint/exclusions; measured geometry and acceptance; product/provider/receiver gates; supply/stock/waste balances; equipment and complete-life scenarios"
  required_quality_disclosure: "Unresolved identities, missing range evidence, meter/scale/survey uncertainty, actual variability, CP coverage, allocation assumptions, observed versus forecast asset life, emission factors and species, residual destinations, excluded/unfinished zones"
  update_trigger: "Changed geometry/substrate, route, provider/receiver, energy supply, equipment/blades, defect route, asset scenario, contract, acceptance or material evidence; resolve flow identities before final exchange publication"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations CPC Version 3.0 explanatory notes, 30 June 2025, printed p284; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope of runway construction, repair and alteration"
  - id: "faa-p621-2018"
    type: "official_guidance"
    reference: "FAA AC 150/5370-10H, 21 December 2018, errata updated 19 August 2020, Item P-621 printed pp537–540; https://www.faa.gov/documentLibrary/media/Advisory_Circular/150-5370-10H.pdf"
    used_for: "Adopted rectangular geometry, existing-pavement qualification, wet saw equipment, continuous capture/cleanup, control strip, damage remedy, zone testing and accepted area"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:a30d6b8a490ef552ec97f32ff9ffc931609b7d965ae805e6ccab87a97c65c58c"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5618"
      family: "system_boundary"
      span:
        start:
          offset: 5618
          line: 58
          column: 1
        end:
          offset: 27591
          line: 316
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Existing sound stable asphalt runway at authorized airside possession; pre-existing bumps, depressed, badly cracked/spalled or defective zones already repaired by declared owner and accepted for grooving. |\n| starting_condition_role | Retained host interface; not a newly supplied complete runway or burden-free incremental work. |\n| product_classification_scope | Narrow runway alteration service within CPC 3.0 54213, independent of classification-derived identity. |\n| recursive_input_rule | A separately purchased same-category grooving service is recorded at its actual accepted area and supply gate with upstream dataset; do not recursively invent retained-runway manufacture or duplicate subcontractor resources. |\n| upstream_dataset_requirement | Actual supplied water, fuels, blades, lubricant, repair products, electricity, transport, packaging, distinct asset service and external treatment use verified compatible upstream/downstream datasets and declared boundary coverage. |\n| disclosure | Incoming substrate/condition and prior-repair owner; project adopted P-621 and unit system; campaign/work-window limits; setup/control-strip inclusion; actual remedy responsibility; assets/coverage, supply and receiver gates; omitted areas, weather and stock carry-forward. |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `retained_host` | `groove_finish` | Retain the existing asphalt host without a new whole-runway upstream charge or avoided-replacement credit. Include incremental possession, guides, control strip, wet cutting, capture, cleanup, transport and job-induced remedies. Prior major rehabilitation is separately bounded with explicit responsibility. | `faa-p621-2018` |\n| `continuous_capture` | `groove_finish` | Use actual wet diamond-saw cutting with integrated continuous slurry vacuum and continuous cleanup. Account water supply and actual approved residual disposition. No routine slurry entry to airport storm sewer; freezing conditions that prevent immediate debris removal/water drainage preclude this route. | `faa-p621-2018` |\n| `equipment_blades` | `diamond_blades` | Record machine/head and blade configuration appropriate to asphalt hardness, one-pass groove capability, depth/alignment control and uniform blade wear/diameter. P-621 minimum 0.5 m multi-groove pass capability is equipment qualification, not area productivity or water consumption. | `faa-p621-2018` |\n| `airside_gate` | `accepted_grooving` | End only after measured geometry/zone acceptance, continuous cleanup complete, residual custody documented, directed damage remedies accepted and signed maintenance handback. Later airport/aircraft operation and friction/service-life claims are outside this output. | `faa-p621-2018` |\n| `campaign_asset_boundary` | `capital_service` | Index campaign possession/work windows, setup/control-strip/rework, manufacturing and service periods of every actual asset, maintenance, replacements and end of life. Saw/vacuum/cleaner/tanker/generator/metrology and actual access/protection/containment/remedy equipment, including bounded provider physical resources, shared with other jobs require complete-life attribution and explicit exclusion of direct fuel, electricity and tool rows from their capital coverage. |  |\n| `actual_exchange_expansion` | all inventory rows | Conditional material/service/substance cards are foreground collection obligations. Expand each into distinct actual identity/gate/provider/receiver/property exchange; never bind or add unlike products, wastes, or species together. Record substantiated absence; unknown activity is not zero. |  |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Actual supplied engine fuel grade at equipment supply gate (`fuel_supply`)\n\nProcess / prospective direction / type: `groove_finish` / `inputs` / `product`.\n\nConditional on combustion equipment. Resolve each actual fuel grade as a distinct exchange; never sum unlike fuels. Include saw, vacuum, cleaning, setup and remedy demand once. Include actual combustion-powered access, protection and remedy equipment and bounded provider resources once. Range evidence need: Fuel grade, engine load and elapsed work records are required; FAA production-rate blanks and groove tolerances do not establish fuel consumption.\n\n- Collection subject: Actual supplied engine fuel grade at equipment supply gate\n- Flow property / unit: Mass / kg\n- Amount rule: Gross net-tare fuel issues into campaign custody divided by A; derive burned fuel separately from returns, retained stock, collected waste and partitioned releases.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_fuel`\n- Sources: `faa-p621-2018`\n\n#### Collection requirement: Actual compatible diamond saw blades or cutting segments supplied for asphalt grooving (`diamond_blades`)\n\nProcess / prospective direction / type: `groove_finish` / `inputs` / `product`.\n\nIdentify the complete supplied blade versus replacement segment, bond/material, diameter and compatible cutting head. Keep distinct supplied identities separate. New/worn blade mixing and unequal wear must satisfy the adopted P-621 requirements; direct tool supply is excluded from capital maintenance coverage to avoid duplication. Range evidence need: Actual supplied mass, wear, replacement and usable remaining-service records are needed; minimum cutting-head width is not a blade-use factor.\n\n- Collection subject: Actual compatible diamond saw blades or cutting segments supplied for asphalt grooving\n- Flow property / unit: Mass / kg\n- Amount rule: Gross net-tare blade or segment supply attributable to the campaign divided by A; include starting usable tool stock transfer with disclosed burden, returns and closing stock balance.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_materials`\n- Sources: `faa-p621-2018`\n\n#### Collection requirement: Actual cargo-specific campaign freight service (`freight_service`)\n\nProcess / prospective direction / type: `groove_finish` / `inputs` / `product`.\n\nInclude mobilization/demobilization, water/fuel/tool delivery and residual collection where outside supplier or receiver datasets. Empty vehicle movement is documented with actual vehicle service records rather than fictitious cargo mass; avoid charging vehicle fuel both here and directly. Range evidence need: Actual cargo, leg distance, vehicle loading and provider boundaries are required; no default distance or return-load factor is available.\n\n- Collection subject: Actual cargo-specific campaign freight service\n- Flow property / unit: mass*distance / kg*km\n- Amount rule: Sum actual attributable net cargo kg multiplied by route-leg km, separately for each mode/provider, divided by A.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_transport`\n\n#### Collection requirement: Complete-life service share of each actual grooving campaign asset (`capital_service`)\n\nProcess / prospective direction / type: `groove_finish` / `inputs` / `product`.\n\nEnumerate saw, integrated vacuum, external recovery/tanker/cleaner, generator when present, and measurement instruments, plus actual access, protection, containment and job-induced remedy equipment when used. Bounded third-party provider physical resources are included once with documented coverage, rather than treating approval paperwork as physical supply. Assets used in several work periods/jobs have complete manufacture, maintenance, replacements and end-of-life coverage; separate direct fuel/electricity and diamond-tool rows are excluded from capital coverage. Range evidence need: Measured service history plus evidenced remaining-service/replacement/termination/EOL scenarios and sensitivity are needed for in-service assets; observed completed life applies to retired assets. Unknown life denominators block finalization.\n\n- Collection subject: Complete-life service share of each actual grooving campaign asset\n- Flow property / unit: Number of items / item\n- Amount rule: For each separately identified asset, attributable campaign service divided by evidenced complete-life service, then divided by A, as asset-equivalent item.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_assets`\n\n#### Collection requirement: Actual separately supplied campaign packaging material (`packaging_supply`)\n\nProcess / prospective direction / type: `groove_finish` / `inputs` / `product`.\n\nConditional on actual packaging entering custody. Supplier-included packaging already represented upstream is retained in the physical balance without a second upstream supply burden; additional purchased packaging is separately charged. Pallets/containers used as durable assets follow complete-life service treatment. Range evidence need: Actual packaging composition, net mass, reuse, true return and stock records are required; no universal packaging proportion is justified.\n\n- Collection subject: Actual separately supplied campaign packaging material\n- Flow property / unit: Mass / kg\n- Amount rule: Gross net-tare supplied packaging material divided by A, separately by material and custody gate.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_materials`\n\n#### Collection requirement: Actual separately supplied spill cleanup or containment consumable (`cleanup_consumables`)\n\nProcess / prospective direction / type: `groove_finish` / `inputs` / `product`.\n\nConditional on actual supplied absorbent, wipe or containment product used for campaign spills/cleanup. Identify each actual product, composition, state, supplier and use separately; do not sum unlike consumables. Supplier/provider included products are accounted once. Used contaminated products leave through composition-specific spent_fluids waste exchanges, with captured fluid counted only once. Range evidence need: Actual spill/cleanup event, supplied product records, net mass and contaminated receiver route are needed; no routine consumption, spill frequency, formulation or generic range is assumed.\n\n- Collection subject: Actual separately supplied spill cleanup or containment consumable\n- Flow property / unit: Mass / kg\n- Amount rule: Gross net-tare issue of each actual cleanup consumable divided by A, with opening-stock burden transfer, true outward returns and retained closing-stock balance.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_materials`\n\n#### Collection requirement: Actual water abstracted from the identified environmental resource (`abstracted_water`)\n\nProcess / prospective direction / type: `groove_finish` / `inputs` / `elementary`.\n\nConditional on direct withdrawal from a declared surface-water or groundwater source. Purchased water belongs to supplied_water; internal recycling is not a new abstraction exchange. Range evidence need: Require abstraction meter, permitted source and uncertainty records; no abstraction fraction can be inferred from supplied-water or captured-slurry quantities.\n\n- Collection subject: Actual water abstracted from the identified environmental resource\n- Flow property / unit: Volume / m3\n- Amount rule: Metered actual direct environmental abstraction divided by A, separately by resource and location.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_water`\n\n#### Collection requirement: Actual unused supplied product returned outward from campaign custody (`unused_returns`)\n\nProcess / prospective direction / type: `groove_finish` / `outputs` / `product`.\n\nConditional on documented physical transfer to supplier or other holder. Preserve fuel grade, blade configuration, lubricant formulation, remedy material and packaging identities separately, with matching gross input basis. Closing stock retained in custody is a carried-forward balance, not an outward exchange. No avoided-production credit is implied. Range evidence need: Actual return notes and scales define quantities; no assumed return rate or heterogeneous combined total is permitted.\n\n- Collection subject: Actual unused supplied product returned outward from campaign custody\n- Flow property / unit: Mass / kg\n- Amount rule: Actual outward net-tare unused quantity of each distinct supplied product divided by A; never an already netted return.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_materials`\n\n#### Collection requirement: Actual spent diamond blade or segment waste at receiver gate (`spent_blades`)\n\nProcess / prospective direction / type: `groove_finish` / `outputs` / `waste`.\n\nReconcile supplied tool, remaining usable stock, returned product, wear transferred to slurry or air, and collected spent tool. Steel carrier and abrasive composition require actual evidence. A reusable tool retained for future jobs is stock, not waste. Range evidence need: Actual spent-tool weighing, replacement and wear evidence is needed; do not infer waste equals supplied mass or assume full retirement each campaign.\n\n- Collection subject: Actual spent diamond blade or segment waste at receiver gate\n- Flow property / unit: Mass / kg\n- Amount rule: Actual net spent tool mass leaving custody divided by A, separately by complete blade or segment and receiver.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_residuals`\n- Sources: `faa-p621-2018`\n\n#### Collection requirement: Actual segregated campaign packaging waste (`packaging_waste`)\n\nProcess / prospective direction / type: `groove_finish` / `outputs` / `waste`.\n\nConditional on discarded packaging. Distinguish real reusable product returns from waste and retained packaging; no combined paper/plastic/wood waste identity or automatic recovery credit. Range evidence need: Actual composition, tare-corrected receiver tickets and return/stock balance are needed; no generic waste fraction is justified.\n\n- Collection subject: Actual segregated campaign packaging waste\n- Flow property / unit: Mass / kg\n- Amount rule: Net outward discarded mass by packaging material and receiver divided by A.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_residuals`\n\n#### Collection requirement: Actual collected waste fuel, lubricant or contaminated cleanup consumable to documented receiver (`spent_fluids`)\n\nProcess / prospective direction / type: `groove_finish` / `outputs` / `waste`.\n\nConditional on fuel draining, oil change or recovered spill collection. Resolve fuel and lubricant wastes as distinct exchanges; align with gross issues, retained stocks, usable outward returns and actual released fraction. The total spill is partitioned between collected and released mass and never subtracted again. Contaminated absorbents, wipes or containment products require their actual contaminated composition and receiver as distinct waste exchanges; do not combine their gross contaminated mass with duplicate separately counted absorbed fluid mass. Range evidence need: Require incident/oil-change records, net mass, composition and receiver acceptance; no assumed waste fraction applies.\n\n- Collection subject: Actual collected waste fuel, lubricant or contaminated cleanup consumable to documented receiver\n- Flow property / unit: Mass / kg\n- Amount rule: Net outward collected waste quantity by actual formulation, contamination and receiver divided by A.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_residuals`\n\n#### Collection requirement: Actual separately identified combustion substance released to air (`combustion_emissions`)\n\nProcess / prospective direction / type: `groove_finish` / `outputs` / `elementary`.\n\nConditional on actual on-site combustion. Each substance and receiving-air compartment must be identified before UUID binding; NOx, VOC or particulate umbrellas are not fixed substances. Purchased electricity or freight datasets do not duplicate their upstream exhaust here. Range evidence need: Obtain engine/fuel and operating condition-specific measurement or documented applicable factor with uncertainty; no general emissions factor or speciation split is supplied.\n\n- Collection subject: Actual separately identified combustion substance released to air\n- Flow property / unit: Mass / kg\n- Amount rule: For each actual engine/fuel/species, burned activity multiplied by applicable documented species factor or measured species mass, divided by A.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_emissions`\n\n#### Collection requirement: Actual separately characterized fugitive cutting particle release to air (`fugitive_particles`)\n\nProcess / prospective direction / type: `groove_finish` / `outputs` / `elementary`.\n\nConditional on observed or substantiated escape despite wet cutting and vacuum collection. Captured fines belong in slurry; blade wear in recovered solids is not also air emission. Unknown balance residual is investigated rather than assigned to dust. Range evidence need: Require task-specific release measurement and particle-size/composition evidence; no dry-cutting or assumed removal-efficiency factor transfers automatically.\n\n- Collection subject: Actual separately characterized fugitive cutting particle release to air\n- Flow property / unit: Mass / kg\n- Amount rule: Measured actual escaped mass by substance/particle size and air compartment divided by A.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_emissions`\n- Sources: `faa-p621-2018`\n\n#### Collection requirement: Actual separately identified liquid or substance release to documented environment (`liquid_release`)\n\nProcess / prospective direction / type: `groove_finish` / `outputs` / `elementary`.\n\nConditional on evidenced environmental release, including actual water discharge/evaporation or fuel/lubricant incident. Distinct substances and media require separate exchanges; water volume may convert to mass only with evidenced density/temperature. Storm-sewer slurry entry is prohibited under adopted P-621 and cannot be a routine modeled disposal route. Range evidence need: Actual incident, authorized outlet or measured evaporation records, density when needed, and medium/species evidence are required; no unclosed water balance is an automatic emission.\n\n- Collection subject: Actual separately identified liquid or substance release to documented environment\n- Flow property / unit: Mass / kg\n- Amount rule: Measured actual released mass by substance and receiving medium divided by A, separate from collected incident waste.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_emissions`\n- Sources: `faa-p621-2018`\n\n"
