boundary_abstraction:
  declared_starting_condition: "Existing sound stable asphalt runway at authorized airside possession; pre-existing bumps, depressed, badly cracked/spalled or defective zones already repaired by declared owner and accepted for grooving."
  starting_condition_role: "Retained host interface; not a newly supplied complete runway or burden-free incremental work."
  product_classification_scope: "Narrow runway alteration service within CPC 3.0 54213, independent of classification-derived identity."
  recursive_input_rule: "A separately purchased same-category grooving service is recorded at its actual accepted area and supply gate with upstream dataset; do not recursively invent retained-runway manufacture or duplicate subcontractor resources."
  upstream_dataset_requirement: "Actual supplied water, fuels, blades, lubricant, repair products, electricity, transport, packaging, distinct asset service and external treatment use verified compatible upstream/downstream datasets and declared boundary coverage."
  disclosure: "Incoming substrate/condition and prior-repair owner; project adopted P-621 and unit system; campaign/work-window limits; setup/control-strip inclusion; actual remedy responsibility; assets/coverage, supply and receiver gates; omitted areas, weather and stock carry-forward."
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted rectangular transverse wet saw grooving service on existing asphalt runway"
    uuid: ""
  flow_property_ref:
    uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
  unit_group_ref:
    uuid: "93a60a57-a3c8-18da-a746-0800200c9a66"
  reference_unit: "m2"
  required_qualifiers:
    - "Runway/site and coordinates"
    - "qualified retained asphalt condition"
    - "possession dates"
    - "groove orientation/width/depth/spacing and adopted unit system"
    - "exclusion zones"
    - "machine/head/run identifiers"
    - "zone samples and acceptance"
    - "slurry destination"
    - "damage remedy"
    - "accepted footprint and signed handback"
reference_flows:
  []
measurement_rules:
  - id: accepted_area
    applies_to: "accepted_grooving"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Survey A as the union of accepted grooved plan-view polygons, excluding omitted edge/light/joint zones, unresolved rejects and untreated gaps. Count repeated passes once. The output amount is exactly 1 m2 per reference flow; all attributable campaign quantities divide by positive A."
  - id: groove_geometry
    applies_to: "accepted_grooving"
    required_property_ref:
      name: "Length"
      uuid: ""
    required_unit: "mm"
    rule: "Record the adopted project unit system and exact specification. P-621 SI nominal width 6 mm (+2/-0), depth 6 mm (±2), spacing 38 mm (-3/+0), transverse perpendicular orientation; retain actual zone acceptance distributions and alignment criteria instead of using nominal dimensions as resource factors. The printed nominal SI spacing 38 mm (-3/+0) and separately printed acceptance minimum 34 mm are distinct source clauses with an arithmetic discrepancy; retain both verbatim and obtain the adopted project criterion hierarchy/resolution from the responsible engineer before acceptance. Do not silently equate rounded SI/inch clauses or invent a universal corrected limit."
  - id: quantity_custody
    applies_to: "fuel_supply, diamond_blades, lubricant_supply, remedy_materials, packaging_supply, unused_returns"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure product gross issue quantity before outward return netting with vehicle/container tare removed. Record true outward returns, retained closing stocks and consumed/transformed or released amounts by identity. Volume-to-mass needs actual product density at declared temperature; no assumed water or fuel density."
  - id: freight_units
    applies_to: "freight_service"
    required_property_ref:
      name: "mass*distance"
      uuid: ""
    required_unit: "kg*km"
    rule: "Use net cargo kg times actual route-leg km; conversion from listed t*km uses factor 1000 kg*km per t*km. Do not confuse vehicle distance with cargo transport service."
  - id: energy_units
    applies_to: "electricity_supply"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Retain measured electrical kWh and actual supply boundary. Do not substitute heating-value energy for generic electrical Energy identity; fuel mass and electrical energy remain separate physical quantities."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: groove_finish
    name: "Coupled wet saw grooving and slurry recovery"
    inclusion: "required"
    inclusion_condition: "Qualified existing asphalt and approved work possession"
    role: "Surface finishing from retained sound asphalt to accepted clean grooved area; cutting and recovery are physically coupled"
    quantitative_reference: "1 m2 accepted unique footprint"
