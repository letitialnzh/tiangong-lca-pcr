          name: "Actual purchased electricity at grooving equipment connection"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Conditional on external electrical supply, with actual voltage/provider/mix and connection gate declared. A generator fuel input already covering delivered power does not also acquire a purchased-electricity input. Cover actual access/protection/remedy equipment and bounded provider resources when powered, with ownership and overlap disclosed. Range evidence need: Obtain actual submeter accuracy, work-window loads and uncertainty; no published resource prior applies to the unspecified powered equipment."
          amount:
