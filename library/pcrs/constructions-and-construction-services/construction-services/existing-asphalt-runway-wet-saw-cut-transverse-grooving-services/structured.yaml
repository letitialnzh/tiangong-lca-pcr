  covered_products: "Incremental accepted rectangular transverse wet saw grooving of existing sound asphalt runway"
  excluded_products: "New pavement; concrete or trapezoidal grooves; grinding; major prior repairs; airport operations"
  representative_product: "Accepted grooved clean asphalt footprint at signed airside maintenance handback"
  production_route: "Qualified retained asphalt → wet diamond saw grooves with continuous vacuum recovery and cleanup → zone-tested accepted surface"
  market_state: "Site-specific completed construction alteration service; no standalone new pavement asset"
functional_unit:
  what: "Accepted rectangular transverse wet saw grooving service on existing asphalt runway"
  how_much: "1 m2 accepted unique grooved plan-view footprint"
  how_well: "Declared project-adopted P-621 groove geometry, zone-test acceptance, cleanliness and remedy completion"
  how_long_or_cycle: "One bounded possession and grooving campaign including attributable control strip, work windows and rework; no lifetime performance promise"
  reference_flow_link: "accepted_grooving"
system_boundary:
  rules:
    - rule_id: retained_host
      applies_to: "groove_finish"
      rule: "Retain the existing asphalt host without a new whole-runway upstream charge or avoided-replacement credit. Include incremental possession, guides, control strip, wet cutting, capture, cleanup, transport and job-induced remedies. Prior major rehabilitation is separately bounded with explicit responsibility."
      source_ids:
        - faa-p621-2018
    - rule_id: continuous_capture
      applies_to: "groove_finish"
      rule: "Use actual wet diamond-saw cutting with integrated continuous slurry vacuum and continuous cleanup. Account water supply and actual approved residual disposition. No routine slurry entry to airport storm sewer; freezing conditions that prevent immediate debris removal/water drainage preclude this route."
      source_ids:
        - faa-p621-2018
    - rule_id: equipment_blades
      applies_to: "diamond_blades"
      rule: "Record machine/head and blade configuration appropriate to asphalt hardness, one-pass groove capability, depth/alignment control and uniform blade wear/diameter. P-621 minimum 0.5 m multi-groove pass capability is equipment qualification, not area productivity or water consumption."
      source_ids:
        - faa-p621-2018
    - rule_id: airside_gate
      applies_to: "accepted_grooving"
      rule: "End only after measured geometry/zone acceptance, continuous cleanup complete, residual custody documented, directed damage remedies accepted and signed maintenance handback. Later airport/aircraft operation and friction/service-life claims are outside this output."
      source_ids:
        - faa-p621-2018
    - rule_id: campaign_asset_boundary
      applies_to: "capital_service"
      rule: "Index campaign possession/work windows, setup/control-strip/rework, manufacturing and service periods of every actual asset, maintenance, replacements and end of life. Saw/vacuum/cleaner/tanker/generator/metrology and actual access/protection/containment/remedy equipment, including bounded provider physical resources, shared with other jobs require complete-life attribution and explicit exclusion of direct fuel, electricity and tool rows from their capital coverage."
      source_ids: []
