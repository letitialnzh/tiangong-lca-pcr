        - row_id: accepted_grooving
          role: "Accepted rectangular transverse wet saw grooving service on existing asphalt runway"
          name: "Accepted rectangular transverse wet saw grooving service on existing asphalt runway"
          flow_type: "product"
          property_unit: "Area / m2"
          description: "Measure accepted unique plan-view grooved footprint A using georeferenced boundaries and signed zone acceptance; exclusions, rejected areas and unfinished areas do not enter A. Repeated passes cannot increase the footprint. The control strip outside the traffic area has assigned burdens and is not an invented saleable co-product. Range evidence need: The exact 1 m2 quantity defines the reference and is not an empirical yield range. Actual campaign A and measurement uncertainty require surveyed boundaries and acceptance records; no minimum campaign size is asserted."
          amount:
            expression: "1 m2"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
