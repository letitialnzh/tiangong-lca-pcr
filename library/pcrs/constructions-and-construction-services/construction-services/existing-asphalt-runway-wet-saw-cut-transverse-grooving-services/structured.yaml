          description: "Record the actual potable or process-water grade and provider separately. Tank/container tare is excluded; do not substitute environmental abstraction for purchased supply. Range evidence need: The reviewed sources do not provide a site-independent numerical water-consumption range; obtain meter uncertainty and campaign distributions by machine, asphalt, groove geometry and recovery circuit before setting limits."
