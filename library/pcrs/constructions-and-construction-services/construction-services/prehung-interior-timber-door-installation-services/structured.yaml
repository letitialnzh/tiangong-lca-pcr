measurement_rules:
  - id: accepted_count
    applies_to: "reference product; reference_service"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "Obtain N from unique signed completed-unit acceptance records at complete_accept. Exclude held, rejected, only fixed, or not-yet-dry units. Normalize each applicable same-cohort quantity by this positive N."
  - id: custody_basis
    applies_to: "prehung_unit; lockset; usable exits and material rows"
    required_property_ref:
      name: "Original input property"
      uuid: ""
    required_unit: "item or kg as specified by card"
    rule: "Keep physical gross draw and positive unused outputs on the same property/unit. Door and lockset count cannot be replaced by mass without measured matching IDs and an explicit bridge."
  - id: handoff_identity
    applies_to: "conditioned_unit; fix_feed; fixed_unit; complete_feed"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "Pair node transfers by unique transfer/event IDs, state and timestamps. Carry actual count; never set an internal transfer to one simply because the final reference is one."
  - id: material_fate
    applies_to: "material, dust, residue, water and liquid-waste rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh net of tare and record composition/moisture. Use disjoint retained, installed/WIP, reusable exit, discarded solid/liquid and direct-release pools. A measured kg/item coefficient is not mass: convert each actual same-ID/current-state count stream to kg or weigh that exact stream directly before mass balance. Length-based actual total mass has its own calculation. Opening observations are outside material pools. Final accepted installed mass is retained once, not again as outgoing handover. Unexplained/missing-bridge balance is a gap."
  - id: energy_service
    applies_to: "node electricity and shared-service rows"
    required_property_ref:
      name: "Energy or actual service-duration requirement"
      uuid: ""
    required_unit: "kWh or documented h"
    rule: "Preserve actual electricity unit and meter boundary. Convert billable periods from actual contract duration only. Do not infer an eight-hour day or use labour time as equipment energy."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
