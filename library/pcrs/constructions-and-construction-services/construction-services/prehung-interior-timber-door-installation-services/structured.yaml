      record_type: "Node-owned foreground ledger"
      raw_fields: "job_id; node_id; period_id; event_id; material_id; assembly_id; custodian_id; transfer_id; waste_stream; gross_mass_kg; tare_mass_kg; incoming_transfer_mass_kg; outgoing_transfer_mass_kg; open_processed_wip_kg; close_processed_wip_kg; accepted_retained_kg; custody_time; water_fraction; species_id; particle_fraction; receiving_medium; direct_mass_kg; emission_method; emission_method_inputs; detection_limit; uncertainty; water_open_processed_wip_kg; water_close_processed_wip_kg; water_accepted_retained_kg; water_usable_return_kg; water_external_transfer_kg; water_solid_waste_kg; water_liquid_waste_kg; water_direct_measured_kg; balance_pool_id; stream_id; stream_pool_kind; stream_actual_unit; stream_item_count; stream_quantity_kg; stream_direct_net_mass_kg; stream_same_ids; stream_state; stream_period; stream_bridge_group; constituent_scope; composite_group_id"
      collection_method: "At completion, weigh actual local finishing residues, captured sanding fines, spent abrasive/wipe/protection materials and accessory packaging; distinguish nonusable rejected hardware/door and collected local cleanup liquid by waste_stream. Measure actual moisture/constituent fractions and net tare. Under the gross-issued water basis, reconcile accepted retained water, processed installed closing WIP, usable fresh-water/formulation returns/external handovers, wet solid waste, collected liquid and independently evidenced vapour/direct release. Unissued closing water is already excluded from gross draw. Specify actual species/particle fraction, receiving medium, method and uncertainty for any direct finishing/sanding/cleanup release; unknown balance remains gap. For mass reconciliation, give each physical stream an exclusive stream_pool_kind and balance_pool_id. Native kg streams enter with their actual measured kg; Number streams enter only with actual same-ID/current-state measured kg or the matching measured kg-per-item coefficient times count. Record pool mass by ID/state, not one factor applied after cutting or assembly changes. Missing bridge permits count reconciliation only and leaves mass reconciliation incomplete. An intact or installed composite is counted once in a documented composite group including its contributing inputs, or has evidenced constituent splits; never book the entire composite again in each component pool. Outgoing transfer mass is only an actual uniquely owned internal handoff, return-to-node/rework transfer or separately documented custody exit; it is exclusive of usable U/X outputs, waste, closing WIP and final accepted retention. Final customer acceptance leaves installed mass in accepted_retained only, not a second outgoing mass. opening_interface is observational and excluded from every material balance."
