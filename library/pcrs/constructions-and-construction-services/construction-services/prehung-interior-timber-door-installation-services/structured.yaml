allocation_rules:
  - rule_id: no_service_coproduct
    applies_to: "foreground_burden_allocation"
    rule: "This route produces one accepted installation service and no presumed co-product. Keep every actual failed/repeated event's job resources with the job. No avoided-production/disposal credit follows from scrap, a return or a held unit."
    source_ids: []
  - rule_id: unused_original_material
    applies_to: "foreground_burden_allocation"
    rule: "Gross input is opening intact stock plus receipts minus closing intact unissued stock. Record unused usable supplier returns and external handovers as separate positive outputs in the same material identity/property/unit. Attribute only their original unused-material upstream burden to those actual exits when upstream scope can be traced; installation, conditioning, cutting and rework remain with the job. Net-consumed G-R-X is diagnostic/original-material attribution, not another negative exchange or second physical draw."
    source_ids: []
  - rule_id: shared_complete_set
    applies_to: "foreground_burden_allocation"
    rule: "Direct submeter assignment belongs directly to its measured consumer and needs no shared denominator. Reconcile residual shared electricity/service B in period p after all independent direct assignments and provider overlaps. Fully direct, exactly zero residual requires no shared denominator. Nonzero eligible residual needs every residual-eligible consuming job/node, including outside this job, and evidenced causal weights w; allocate B times w divided by the complete positive eligible sum. Unknown/negative residual, missing consumers, zero/unknown sum or unsupported weights is an allocation gap requiring reviewed alternative evidence. Do not silently assign the entire shared meter to this job."
    source_ids: []
  - rule_id: service_overlap
    applies_to: "foreground_burden_allocation"
    rule: "For rented access, tools, storage or conditioning availability, use actual provider contract and paid active/idle periods. Disclose whether provider dataset includes energy, capital, maintenance, delivery/setup and removal. Count each included burden once; separate site electricity only for a genuinely nonoverlapping meter/coverage. A separately owned durable tool needs its evidenced attribution basis, not a full new tool per installation."
    source_ids: []
  - rule_id: period_bridge
    applies_to: "foreground_burden_allocation"
    rule: "Follow the identified job cohort through all reporting periods and finish the whole-job attribution at acceptance. If reporting at a cutoff, bridge opening/closing unprocessed stock, unaccepted installed WIP, shared service commitments and unresolved defects by ID/state; never normalize unfinished work by an invented accepted count. A terminated job needs documented fate and explicit burden treatment before consolidation with an accepted cohort. No universal lifetime, workday or annualization factor applies."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_receive_condition_material
      process_id: "receive_condition"
      flow_role: "material"
      record_type: "Node-owned foreground ledger"
      raw_fields: "job_id; node_id; period_id; event_id; material_id; actual_unit; unit_alias; assembly_id; provider_id; S_open; R_received; S_close_intact_unissued; U_return; X_transfer; return_recipient; transfer_recipient; custody_time; bridge_item_count; bridge_net_mass_kg; bridge_same_ids; bridge_source; bridge_state; bridge_period; bridge_balance_pool_id"
      collection_method: "At receipt/conditioning, count matching factory-finished prehung assembly IDs and opening intact stock, actual receipts and closing intact unissued assemblies. Record actual usable supplier returns/external handovers separately with recipients. Obtain an actual same-ID weighed mass bridge only if the receipt-stage discarded assembly mass requires reconciliation. Packaging is removed and weighed in cp_receive_condition_fate, not netted against door count. Closing stock excludes returned units and held conditioning/processed WIP. For a required count-to-mass balance, obtain actual same-ID, same-state, same-period net mass evidence; kg per item is a coefficient and the physical stream mass requires count times that coefficient, or direct weighing of the entire exact stream. Mixed units/configurations/states are measured and summed separately, never assigned one mean. This bridge does not change the external Number-of-items exchanges."
      unit: "item; kg"
      frequency: "Each receipt, issue, usable exit and reporting cutoff"
      temporal_coverage: "Actual node job periods through acceptance or disclosed cutoff/termination"
      site_scope: "Actual job/site node, retaining full shared-consumer evidence where needed"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual assembly counts/specifications; factory-finish receiving evidence; receipts and stock/usable-exit IDs; real recipient custody; calibrated same-ID mass bridge if required"
    - protocol_id: cp_receive_condition_events
      process_id: "receive_condition"
      flow_role: "events"
      record_type: "Node-owned foreground ledger"
      raw_fields: "job_id; node_id; period_id; event_id; assembly_id; opening_id; transfer_id; state_before; state_after; received_count; released_count; opening_id_count; actual_start; actual_end; elapsed_h; actual_RH; actual_temperature; product_criteria; factory_finish_status; opening_geometry; opening_soundness; moisture_condition; defect_id; repeat_attempt_id; disposition; cutoff_wip_ids; termination_decision"
      collection_method: "Inspect actual assembly size/handing/core/species and incoming factory finish, and the dry sound compatible opening geometry. Record real RH/temperature/moisture observations and actual protection/conditioning intervals against this selected product criteria. Release conditioned assembly IDs with transfer_id and released_count. Record receiving defects, any actual repeated inspection/conditioning, held stock/WIP and documented termination disposition. This protocol does not collect fixing or final customer acceptance."
      unit: "item; actual h; actual opening dimensions/RH/temperature units"
      frequency: "Each actual event/transfer; environmental monitoring at evidenced suitable intervals"
      temporal_coverage: "Actual node job periods through acceptance or disclosed cutoff/termination"
      site_scope: "Actual job/site node, retaining full shared-consumer evidence where needed"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual product/contract criteria; dated measurement/environment records; paired transfer IDs; signer; defect/WIP and termination register"
    - protocol_id: cp_receive_condition_resources
      process_id: "receive_condition"
      flow_role: "resources"
      record_type: "Node-owned foreground ledger"
