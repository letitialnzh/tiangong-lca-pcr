  data_quality_requirements:
    - id: identity_traceability
      applies_to: "All cards"
      requirement: "Actual material/product/service/substance identities and states must fit the card. Conditional umbrella rows expand using real foreground specifications. Fixed UUIDs require independently confirmed detail/property/unit evidence."
      evidence: "Specifications, composition, supplier/provider scope, verified binding review"
    - id: acceptance_quality
      applies_to: "Reference and node handoffs"
      requirement: "Incoming factory finish, compatible sound opening, actual conditioning release, permitted cut state, alignment/fixings, lockset operation, local finishing/dryness and signed final acceptance must be traceable. Use actual applicable tolerances and supplier requirements."
      evidence: "Own-node inspection/event logs and signed acceptance"
    - id: measurement_quality
      applies_to: "Counts, masses, energy and service"
      requirement: "Calibrated/reconciled instruments, tare, ID/count reconciliation, consistent numerator units and original-stock units. Record uncertainty and actual detection limits. No guessed count-to-mass density or assumed workday."
      evidence: "Calibration/tare sheets, receipts, meters, contract and same-ID bridge"
    - id: completeness_quality
      applies_to: "All nodes"
      requirement: "Reconcile every real failure/repeat event, stock/usable return, packaging, accessory/cleanup material, residue, waste/liquid and potential direct release. Observed absence, not-applicable scope and unmeasured gap are distinguishable."
      evidence: "Node fate/stock reconciliation, event register and gap register"
    - id: period_quality
      applies_to: "Job and shared resources"
      requirement: "Cover actual receipt-to-handover periods and paid idle/availability; state excluded earlier opening works and later use. Register complete outside-job shared consumers and provider dataset overlap. Document unresolved replacement/termination before finalization."
      evidence: "Period/WIP bridge, contracts, consumer register and reviewed burden ownership"
    - id: range_quality
      applies_to: "Every nonreference card"
      requirement: "Nonreference Range is provisional reasoned_estimate QA only with card-specific rationale; reference Range is strict calculated N/N identity. Replace provisional screens with reviewed source/foreground ranges when available. Never impute a missing amount or conditional absence from the lower bound."
      evidence: "Card Range rationale and reviewed foreground distribution where available"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Fail scope review for unfinished supply/full painting, major opening construction, wrong door type or unsupported exterior/fire/acoustic claim. Inspect the actual product specification and factory-finish receipt rather than a broad classification label."
    source_ids:
      - jeldwen-jii109
  - rule_id: validate_acceptance
    applies_to: "foreground_dataset_conformance"
    rule: "Confirm N is positive, unique and drawn only from completed operation/local-dryness-accepted units, with reference_service in complete_accept. Exclude unaccepted installed WIP and unresolved defects."
    source_ids: []
  - rule_id: validate_handoffs
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile conditioned_unit/fix_feed and fixed_unit/complete_feed by actual transfer IDs, counts, state and period. Each protocol belongs to its card's real node. Do not force internal counts to the reference quantity."
    source_ids: []
  - rule_id: validate_material_pools
    applies_to: "foreground_dataset_conformance"
    rule: "Check gross physical inputs, separate positive unused exits and closing/WIP pools, preserving count for door/lockset returns and Mass for other materials. Confirm no second net-consumed exchange or duplicated upstream credit."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "foreground_dataset_conformance"
    rule: "Trace every actual off-spec event to its producing node and real repair, held, usable exit or waste fate. Count every real repeat operation's resources once and remove only duplicate records. Waste cannot count as accepted service."
    source_ids: []
  - rule_id: validate_direct_releases
    applies_to: "foreground_dataset_conformance"
    rule: "Verify substance/material, particle definition where needed, receiving medium and quantity method before elementary binding. Cutting direct dust belongs position_fix; captured dust is waste. Completion water/chemical losses use exclusive constituent pools; missing fate is incomplete coverage."
    source_ids: []
  - rule_id: validate_shared_periods
    applies_to: "foreground_dataset_conformance"
    rule: "Check all consumers and actual periods, positive evidenced residual-allocation denominator, independent direct assignments, paid idle/service units and nonoverlapping provider/site energy/capital/setup scope. Missing replacement/termination decisions or unresolved WIP burden treatment blocks finalization."
    source_ids: []
  - rule_id: validate_identity_range
    applies_to: "foreground_dataset_conformance"
    rule: "Unresolved flow/support identities remain explicitly unresolved; no generic near-match or guessed UUID is accepted. Provisional Range membership does not establish quantity, safety, identity or readiness. Report actual checks, skipped conditional checks and data gaps."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground site-installation data package with downstream process or lifecyclemodel projection after identities and measurements are resolved"
  downstream_use: "secondary_dataset and/or background_dataset for the same disclosed installation boundary and actual qualifiers"
  allowed_use: "Modelling accepted factory-finished interior timber prehung installation with declared input manufacture/service links and local completion scope"
  excluded_use: "Door manufacturing; complete building/opening construction; unfinished/full-paint route; demolition; exterior/fire/acoustic product claims; use/maintenance/end of life; unresolved partial job presented as completed service"
  required_metadata: "PCR/version; site and geography; door/core/species/jamb/finish/hardware/dimensions/handing; opening acceptance; job and period IDs; actual route/local finish; upstream coverage; N; node quantities; measured bridges; shared consumer/provider boundaries; custody and rework records"
  required_quality_disclosure: "Fixed versus unresolved identity/support coverage; measured versus estimated amounts; provisional reasoned ranges; calibration/uncertainty; constituent/fate gaps; conditional absent/unmeasured distinction; period/WIP/termination and shared attribution limitations"
  update_trigger: "Product/route/finish or opening boundary change; changed hardware/material/provider; new measurement/fate/UUID evidence; altered site energy/shared contract; revised applicable supplier criteria or observed repeated quality problem"
data_sources:
  - id: "jeldwen-jii109"
    type: "handbook"
    reference: "JELD-WEN, Installation Instructions for Interior Pre-Hung Doors, JII109 3/25, pp.1-6. https://cmd-jeld-wen.s3.us-east-2.amazonaws.com/assets/documents/3476246473.pdf"
    used_for: "Product and opening checks; environmental conditioning/storage; one-piece/split-jamb distinction; permitted jamb trimming, shims and fixings; lockset, holes, conditional finish/caulk/protection completion gate. Its numeric recommendations are not universal inventory defaults."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:2fde8842c7d30ea29c8a361f2a51837f9b6ef856b36c8f73ad25b30f226e7aee"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_7415"
      family: "system_boundary"
      span:
        start:
          offset: 7415
          line: 62
          column: 1
        end:
          offset: 57029
          line: 770
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Existing interior rough opening is dry, sound and geometrically compatible with the actual assembly; supplied timber prehung slab/jamb/hinges are factory-finished and finish-accepted |\n| starting_condition_role | Received installation interface and separately recorded supplied assembly; the opening observation is not newly consumed wall |\n| product_classification_scope | Narrow timber prehung interior door installation route within broader joinery installation coverage; external classification does not define the canonical identity |\n| recursive_input_rule | A prior installation-service input from this category is an explicit upstream service with a nonoverlapping scope/time interval; do not recursively expand the same job or use it in place of the actual door assembly |\n| upstream_dataset_requirement | Declare whether each actual upstream material/service dataset includes manufacture, transport, packaging, power, capital and hired-provider setup; missing upstream links remain disclosed gaps |\n| disclosure | Job/site, incoming finished state, opening acceptance, actual selected jamb route, all exclusions, reporting windows, custody transfers and upstream coverage overlap |\n\n| rule_id | Rule | source_ids |\n| --- | --- | --- |\n| `boundary_start_gate` | Verify actual opening and incoming assembly before installation. If the opening needs major correction, stop this route until an externally accepted corrected interface exists; retain observed failed inspection resources without inventing wall construction as an installation input. | jeldwen-jii109 |\n| `boundary_conditioning` | Keep product environmental adjustment and actual protecting/storage resources inside receive_condition. Record actual RH/temperature, duration and release rationale. Supplier instructions govern the selected product; source example durations/tolerances/fastener spacings are not universal PCR quantities. | jeldwen-jii109 |\n| `boundary_node_states` | Receive_condition releases inspected conditioned assemblies; position_fix changes permitted jamb/shim geometry and joins assembly, shims and fasteners into a fixed aligned unit; complete_accept adds lockset and actual local finishing, then releases the operation/dryness-accepted service. | jeldwen-jii109 |\n| `boundary_local_finish` | Include actual fastener-hole filler, sanding, exposed-cut protection, incidental compatible touchup and selected split-jamb joint caulk. Incoming unfinished assemblies and full-door/frame site painting require a different declared route. | jeldwen-jii109 |\n| `boundary_periods` | Index receipt, conditioning/waiting, cutting/fixing, local repair/drying, inspection, rework, acceptance and any closing/termination by real period and job. Include actual shared storage/access/tools/conditioning service only with recorded ownership and coverage. |  |\n| `boundary_releases` | Distinguish captured cutting/sanding waste, actual direct airborne release, aqueous residues and collected wastewater at their real producing nodes. Unknown medium, composition or fate is unresolved coverage, never an assumed release or automatic zero. |  |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Accepted interior rough-opening installation interface (`opening_interface`)\n\nProcess / prospective direction / type: `receive_condition` / `inputs` / `product`.\n\nExisting dry sound opening accepted by ID against this door specification; not newly made or consumed wall material. Destination: Receipt interface only. Condition: Required when the described physical event occurs.\n\nQuantity method: Use receive_condition_event_counts and receive_condition_normalize with cp_receive_condition_events: actual opening_id_count / N, matched by IDs/state. The opening interface is observation only, not consumed wall material.\n\n- Collection subject: Accepted interior rough-opening installation interface\n- Flow property / unit: Number of items `01846770-4cfe-4a25-8ad9-919d8d378345` / item\n- Unit group: Units of items `5beb6eed-33a9-47b8-9ede-1dfe8f679159`\n- Amount rule: actual opening_id_count / N\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_condition_events`\n- Unverified optional screening aid: Provisional QA screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 5\n  - Unit: item\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n  - Rationale: Broad count screen permits surveyed alternatives and rejected openings before an accepted installation; review repeated IDs rather than inventing extra openings. Review trigger only. Neither a measured amount, a source-supported factual interval, a substitute for missing records, nor an acceptance limit. Zero requires observed absence or explicit inactive condition.\n\n#### Collection requirement: Actual rented equipment, access or conditioning availability service for inspection, receipt and environmental conditioning (`receive_condition_shared_service`)\n\nProcess / prospective direction / type: `receive_condition` / `inputs` / `product`.\n\nConditional actual provider/asset/contract boundary and billable unit; paid idle/availability periods retained. Duration is h only when contract records justify hours. Destination: Actual service consumed by receive_condition. Condition: Actual paid availability/hour service occurs; do not invent it from mere tool presence.\n\nQuantity method: Use receive_condition_service_total and receive_condition_normalize: actual H_receive / N from documented bill-to-hour bridge, paid idle and nonoverlapping provider coverage. No eight-hour day. Fully direct zero residual requires no shared denominator.\n\n- Collection subject: Actual rented equipment, access or conditioning availability service for inspection, receipt and environmental conditioning\n- Flow property / unit: Duration / h\n- Amount rule: actual H_receive / N\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_condition_resources`\n- Unverified optional screening aid: Provisional QA screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 240\n