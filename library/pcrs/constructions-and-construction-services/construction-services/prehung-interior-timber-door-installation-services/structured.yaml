      collection_method: "At this node, collect actual local sanding/finishing/cleanup tools, local dry-acceptance conditioning/lighting or hired completion access/tool availability. Read this node actual meter/provider periods and documented kWh conversion. Distinguish direct measured assignment from remaining eligible shared residual using the full actual outside-job consumer register. Reconcile provider energy/capital/setup coverage; actual contract bill_quantity times documented_hours_per_bill_unit governs h, including paid idle. Fully direct zero residual needs no weights; nonzero residual needs complete positive eligible weights, and unknown/negative residual is gap. Identify each meter record owner, actual interval, coverage and topology. For meter_role direct, the measured delta times documented actual-unit-to-kWh factor supplies direct_energy_kWh. For meter_role shared_master, its measured delta supplies shared_energy_total_kWh; any included direct submeters are explicitly listed in master_includes_direct_ids and removed once through all_direct_energy_kWh. Direct records outside the master scope are not removed from that master; direct records inside it are not charged again as residual. Each raw reading is owned once. Missing topology/source-to-total linkage is an energy gap."
