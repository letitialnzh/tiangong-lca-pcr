allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "No intended co-product is assumed. Keep failed assembly, aiming, tests and corrections with the original installation burden; neither unchanged returns nor discarded parts receive an avoided-production credit. Record every actual reject state and destination, including in-node repair, actual usable return, recovery/discard or a separately reviewed downgrade. Unfinished or failed installations never enter D."
    source_ids: []
  - rule_id: job_specific
    applies_to: "job materials and corrective work"
    rule: "Assign traceable job-specific supplies, losses, energy and test/retest to that job. Shared actual costs require a documented causal pool; do not allocate by accepted count where physical activities differ."
    source_ids: []
  - rule_id: resource_share
    applies_to: "shared equipment and contracted event pools"
    rule: "For resource r and job j, a_rj = A_rj / sum(A_rk) over all benefiting jobs k in the same defined lifecycle/resource packet. Use a consistent causal activity basis, complete consumer coverage, positive denominator and sum(a_rj) = 1. Attribute a_rj / D item and burden B_r * a_rj / D; uncertain remaining use prevents a final unsupported fraction."
    source_ids: []
  - rule_id: period_ownership
    applies_to: "all resource and event packets"
    rule: "Index acquisition/manufacture, each service/reporting period, maintenance, replacement and retirement/termination. Link every input, asset, output and event to period and job and retain the period-specific attribution decision/evidence. A replacement is its own actual event packet. Reconcile each source pool and resource owner once, including other jobs; never duplicate provider capital or annualize without resource evidence."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "install_accept"
      flow_role: "accepted installation and job configuration"
      record_type: "job acceptance record"
      raw_fields: "job/configuration id; site/date; model/BOM; substrate/mount; coax route/endpoint; mast/coax bonding interface/design; target transmitter; test criterion/results; correction/retest; signed acceptance; actual D"
      collection_method: "Audit actual completed job and signed test/handover records; independently count complete accepted same-configuration installations"
      unit: "item"
      frequency: "Every job and correction/retest"
      temporal_coverage: "Whole receipt-to-handover job; explicit reporting period"
      site_scope: "Actual installation site and declared receiver interface"
      aggregation_rule: "per reference flow"
      quality_evidence: "Competent acceptance, dated test records, positive D and justified configuration equivalence"
    - protocol_id: cp_materials
      process_id: "install_accept"
      flow_role: "supplies, packaging and usable returns"
      record_type: "shipment and material custody ledger"
      raw_fields: "job/period; shipment/SKU/material/state; inclusion/BOM; net mass; actual count/length; matching mass factor; opening/closing stock; installed amount; return/receiver; supplier delivery/packaging boundary"
      collection_method: "Calibrated weighing or traceable matching-SKU conversion; reconcile receipts/issues, installation, stock and recipient-confirmed returns with original events"
      unit: "kg"
      frequency: "Each receipt, issue, installation and return"
      temporal_coverage: "All job receipts and stock movements in stated periods"
      site_scope: "Installer custody and actual job site"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; SKU/state conversion provenance; upstream inclusion ledger; receiver tickets"
    - protocol_id: cp_energy
      process_id: "install_accept"
      flow_role: "installation electricity"
      record_type: "meter and shared-load activity record"
      raw_fields: "job/period; provider/voltage/site; meter boundary; start/end kWh; tool/test/charger activity; all shared consumers; provider inclusions"
      collection_method: "Read actual meter or validated submeter; match charging/tests and shared consumers to the same job/period and causal boundary"
      unit: "kWh"
      frequency: "Every relevant meter interval and shared activity"
      temporal_coverage: "All included pre-handover electricity intervals"
      site_scope: "Actual supply/meter boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter validity; load-coverage checks; no power/capacity proxy; disclosed exact support gap"
    - protocol_id: cp_services
      process_id: "install_accept"
      flow_role: "owned assets and hired whole support events"
      record_type: "resource lifecycle and contract ledger"
      raw_fields: "resource model/serial/owner; job/node/period consumers; acquisition/manufacture; actual service activity; maintenance/replacement; retirement; remaining-use uncertainty; actual whole-event contract reference; delivery/energy/capital inclusions"
      collection_method: "Read exact resource and contract packets; enumerate all consumers across jobs/nodes and periods; verify actual causal activity and nonduplicated burden ownership"
      unit: "item; actual physical activity units retained"
      frequency: "Each resource use, contract event and lifecycle change"
      temporal_coverage: "Whole resource lifecycle packet plus indexed service/reporting periods"
      site_scope: "Current installer and all benefiting consumer jobs/nodes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Complete consumer denominator; positive activity; share closure; provider boundaries; unresolved life/Duration disclosure"
    - protocol_id: cp_releases
      process_id: "install_accept"
      flow_role: "waste and identified emissions"
      record_type: "event and destination release record"
      raw_fields: "job/period; originating issue/rework id; material/chemistry; state/hazard; receiver/ticket; captured/retained mass; emitted species/particle fraction/air compartment; formulation/SDS; actual task; method uncertainty"
      collection_method: "Weigh and confirm actual receiver streams; measure or justify constituent/particulate releases from actual task and product evidence; separate retained, captured and emitted material"
      unit: "kg"
      frequency: "Each waste exit or release-producing activity"
      temporal_coverage: "All relevant original/rework events through handover"
      site_scope: "Actual work location and receiver or receiving-air compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Destination tickets; method and uncertainty; species/size/medium support; material balance residual disclosure"
  calculation_rules:
    - id: normalize_actual
      applies_to: "all non-reference inventory rows"
      rule: "q_i = n_i / D; n_i is the independently retained actual attributable numerator for the concrete exchange; D is positive actual complete acceptance count. Never backsolve n_i from the reference output."
      inputs:
        - n_i
        - D
        - cp_acceptance
        - "corresponding material/energy/service/release protocol"
      output: "q_i per reference flow"
      source_ids: []
    - id: sku_mass
      applies_to: "mass inventory rows"
      rule: "Use measured net kg; when only count or length exists, multiply actual quantity by a traceable matching SKU/state mass factor and preserve its uncertainty. A heterogeneous total is a diagnostic rather than a concrete exchange."
      inputs:
        - cp_materials
        - cp_releases
        - "matched conversion evidence"
      output: "actual kg numerator"
      source_ids: []
    - id: custody_closure
      applies_to: "identifiable material source pools"
      rule: "Opening stock + receipts = retained installed material + closing stock + usable returns + actual waste + identified releases + disclosed residual. Reconcile each material/source pool, never assign the residual to dust or fill missing data with zero."
      inputs:
        - cp_materials
        - cp_releases
        - "original-event and receiver ledger"
      output: "material pool closure and unresolved residual"
      source_ids: []
    - id: asset_attribution
      applies_to: "owned_equipment_attribution; shared hired_support_service"
      rule: "Apply resource_share to each exact resource pool, retaining A_rj, all A_rk, B_r, consumer/node/period indexing and ownership; divide the attributable actual packet quantity by D. No service-to-mass equivalence exists."
      inputs:
        - cp_services
        - cp_acceptance
        - "exact activity and lifecycle evidence"
      output: "resource fraction or genuine event per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: configuration_quality
      applies_to: "accepted output"
      requirement: "Document every reference qualifier and configuration equivalence. Product point specifications apply only to the matching model and are not universal service amounts or reception guarantees."
      evidence: "cp_acceptance; manufacturer model instructions"
    - id: custody_quality
      applies_to: "materials and exits"
      requirement: "Retain exact identity, units, calibrated quantities, event/receiver and upstream manufacture/delivery/packaging inclusions; report stock and mass-balance residuals."
      evidence: "cp_materials; cp_releases"
    - id: resource_quality
      applies_to: "assets and shared services"
      requirement: "Complete consumer/period indexing and causal allocation with replacement/termination ownership. Unknown remaining life or incomplete consumers remain explicit finalization blockers."
      evidence: "cp_services; resource_share; period_ownership"
    - id: conditional_quality
      applies_to: "conditional umbrella exchanges"
      requirement: "Require actual activity/custody proof for an absent flow; missing supply, electricity, waste or release evidence is a gap. Actual SKU/species/medium and support must be verified before binding."
      evidence: "All actual protocols; no zero imputation"
    - id: quantity_quality
      applies_to: "all inventories"
      requirement: "Collect actual temporal/site coverage, conversion provenance and uncertainty. Manufacturer sources supply no universal installation Range; preserve card-specific evidence needs rather than inventing bounds."
      evidence: "Calibrations; matched source packets; declared gaps"
validation_rules:
  - rule_id: acceptance_gate
    applies_to: "reference and install_accept"
    rule: "Verify actual scope/interfaces, all qualifiers, positive independent D, signed complete output and correction/retest closure. Match reference link/name/property/unit to accepted_installation and require explicit 1 item. Failed/unfinished work stays outside D."
    source_ids:
      - channelmaster-advantage-installation
      - channelmaster-advantage-support
      - channelmaster-advantage-product
  - rule_id: stream_gate
    applies_to: "inventory and material exits"
    rule: "Check every actual SKU/state/receiver stream, material-pool custody closure and original reject/rework/exit linkage. Separate retained weatherproofing, captured waste and identified airborne species/size/medium; generic dust/VOC is insufficient. Missing evidence is inconclusive, not zero."
    source_ids: []
  - rule_id: resource_gate
    applies_to: "resource and period packets"
    rule: "Check all consuming jobs/nodes and periods, actual activity denominators and share closure, period-specific decisions and replacement/termination evidence. Reconcile acquisition, provider capital, delivery, packaging and shared energy once; unresolved remaining use blocks finalization."
    source_ids: []
  - rule_id: binding_gate
    applies_to: "reference and concrete exchanges"
    rule: "Verify exact identity and compatible support chain before each final exchange. Register unresolved identities separately; confirm bilingual semantics, source/protocol/calculation links and projection fingerprints. Report performed/skipped checks, findings and completeness distinctly; a mechanical check does not establish publication readiness or resolved UUIDs."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground installation data package for downstream process and lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset, only with compatible configuration, scope and installer handover gate"
  allowed_use: "Matched passive residential terrestrial antenna installation and its actual component/service interfaces"
  excluded_use: "Operational reception electricity, long-term reception/lifetime claims, later maintenance, satellite/powered/distribution routes or whole-building/whole-lightning-protection equivalence"
  required_metadata: "Site/time; actual model/BOM and configuration; accepted D; interface/design; test/acceptance and corrections; upstream datasets; inventories/protocols; ownership, consumer and period attribution"
  required_quality_disclosure: "Identity/support gaps; missing inventory Range evidence; meter/calibration/conversion uncertainty; custody residuals; remaining-use and allocation uncertainty; actual performed/skipped validation"
  update_trigger: "Changed model, mounting/interface, lead-in, BOM, design, acceptance method, route or stronger actual quantity/identity evidence"
