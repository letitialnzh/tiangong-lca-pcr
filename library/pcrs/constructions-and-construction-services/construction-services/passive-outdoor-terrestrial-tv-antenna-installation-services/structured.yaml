    name: "Install, aim, test and accept passive outdoor antenna"
    inclusion: "required"
    inclusion_condition: "Every included job"
    role: "Integrate independent antenna, mount, coax and bonding roles into the declared accepted installation; own correction/retest and original-event-linked exits"
    quantitative_reference: "D actual accepted complete installations; normalized output 1 item"
process_inventory:
  - id: install_accept
    label: "Install, aim, test and accept passive outdoor antenna"
    inputs:
      product:
        - row_id: antenna
          role: "Passive directional terrestrial-TV antenna assembly"
          name: "Passive directional terrestrial-TV antenna assembly"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Receive the actual VHF/UHF antenna assembly before mounting. Record factory-included clamps, bolts and matching balun inside this supply packet; no powered amplifier or rotator belongs to this identity. Quantity evidence gap: Matching SKU net weighing, accessory inclusion and accepted-configuration records are needed before any inventory bounds can be justified."
          amount:
            expression: "Measured attributable supplied antenna mass / D; reconcile included accessories against the job BOM."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_materials
              source_ids:
                - channelmaster-advantage-installation
                - channelmaster-advantage-support
                - channelmaster-advantage-product
            ranges: []
