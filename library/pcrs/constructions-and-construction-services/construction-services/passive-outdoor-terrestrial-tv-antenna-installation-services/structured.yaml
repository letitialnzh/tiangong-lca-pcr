          role: "Actual pre-handover tool, charger and test electricity"
          name: "Actual pre-handover tool, charger and test electricity"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Record externally supplied electricity within the actual installer meter boundary, with provider/voltage/site and any shared consumers. Keep charging and testing inclusions explicit; operational receiver use after handover is excluded. Energy support remains unresolved and capacity, NCV or operating duration is not a substitute. Quantity evidence gap: Actual meter coverage, shared-load allocation and matched job activity are needed; manufacturer antenna specifications do not establish electricity bounds."
          amount:
            expression: "Actual attributable metered pre-handover kWh / D."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_energy
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_installation
          role: "Accepted passive outdoor directional residential terrestrial-TV antenna installation"
          name: "Accepted passive outdoor directional residential terrestrial-TV antenna installation"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "The output is the installed antenna, mast/mount, one coax receiver connection and approved mast/coax bonding scope after aiming, actual test, correction/retest and signed handover. Count actual complete accepted installations of the declared equivalent configuration independently as D; components, visits, tests and unfinished jobs are not outputs. Quantity evidence gap: Reference normalization is a definition after independent acceptance counting, not a productivity or reception-performance bound."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_acceptance
              source_ids:
