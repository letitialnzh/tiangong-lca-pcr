measurement_rules:
  - id: accepted_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Use actual independent complete-installation acceptance count D > 0; the final normalized output is 1 item."
  - id: material_mass
    applies_to: "mass inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net supply, return, waste and identified release masses with calibrated records. Count/length-to-mass conversion requires matching SKU and state evidence, not a heterogeneous installation weight. Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66."
  - id: metered_energy
    applies_to: "installation_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Preserve actual meter-based electricity and its consumer boundary; power rating, battery Ah, NCV and duration do not measure electrical energy. Exact support identity remains unresolved."
  - id: counted_resource
    applies_to: "owned_equipment_attribution; hired_support_service"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "A reusable asset fraction addresses one identified asset lifecycle packet; a hired event must be a genuine complete contracted service. Actual hourly hire requires Duration support and review."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
