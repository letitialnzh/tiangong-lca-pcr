allocation_rules:
  - rule_id: service_owner
    applies_to: "accepted_demolition"
    rule: "Assign removal and corrective-work burdens to the accepted demolition service. Unresolved defects remain in the same local work loop; do not create another accepted output for repeated work or erase failed-attempt resources."
    source_ids: []
  - rule_id: material_exits
    applies_to: "removed materials"
    rule: "Declare ownership and legal/product status of each outgoing lot. Retain demolition burdens with the demolition service under this service-boundary model; report reusable material separately without avoided-production credit. A later system requiring co-product allocation must declare a reviewed boundary/method and cannot silently overwrite this rule."
    source_ids: []
  - rule_id: shared_resources
    applies_to: "bounded_resource_service; site_electricity"
    rule: "Identify each shared provider service, all consuming jobs/nodes and relevant service periods. Prefer direct activity records; allocate only the measured residual service total by recorded causal driver, preserving totals across consumers. State driver, coverage and uncertainty; do not allocate a service charge and its included electricity/capital twice."
    source_ids: []
  - rule_id: returns
    applies_to: "consumed_supplies; supplies_waste"
    rule: "Usable packaging, containers and unused supplies return under actual stock/custody records or remain closing stock. Record issued, consumed, returned and retained quantities once; the return is not simultaneously waste and cannot receive a second net subtraction. Spent contaminated items follow their actual waste route."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_area
      process_id: "demolition"
      flow_role: "accepted removal area and initial stock"
      record_type: "survey and signed handover"
      raw_fields: "job_id; wall_id; geometry; openings; retained_area; thickness; brick_mortar_identity; survey_release; method_id; isolation_clearance; hazard_clearance; accepted_area; rework_events; handover_date"
      collection_method: "Measure polygons in one declared elevation plane; deduct openings and retained portions, match physically removed thickness and signed accepted area. Record dimensions, instrument tolerance and corrective-work closure. Attribute all job quantities to the same accepted net area before recording per reference flow."
      unit: "m2"
      frequency: "Each wall and final handover"
      temporal_coverage: "Complete job including corrective visits"
      site_scope: "The declared wall and collection area"
      aggregation_rule: "per reference flow"
      quality_evidence: "Survey/dimension record; approved method; signed inspection; tolerance and area reconciliation"
    - protocol_id: cp_resources
      process_id: "demolition"
      flow_role: "electricity supplies and bounded resource services"
      record_type: "meters issue/return records and provider logs"
      raw_fields: "job_id; resource_id; material_identity; provider; service_coverage; period_id; other_consumers; issued; consumed; returned; closing_stock; meter_readings; native_unit; direct_use; shared_total; driver_total; job_driver"
      collection_method: "Use meter differences or verified supplier amounts; trace issue/consume/return/stock by material. For shared services enumerate every consumer and period, subtract directly attributed quantities from the shared pool, and distribute residual by documented causal use driver. Divide attributable job amount by cp_area accepted net area to record per reference flow."
      unit: "kg; kWh; h or verified native service unit"
      frequency: "Every resource event and service period close"
      temporal_coverage: "Whole job and all contributing shared-service periods"
      site_scope: "Declared site; actual provider service boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated meters/scales; provider coverage; full consumer ledger; sum of assigned burdens equals pool; no overlap with included service energy"
    - protocol_id: cp_water
      process_id: "demolition"
      flow_role: "supplied water and collected wastewater"
      record_type: "water meter supply and collection records"
      raw_fields: "job_id; source; supplied_mass; collected_wastewater_mass; suspended_solids; remaining_water; moisture_basis; meter_unit; conversion_evidence; receiver; transfer_id"
      collection_method: "Measure supplied water and collected waste liquid independently; retain native readings and validated conversion only where needed. Reconcile water retained with debris, discharged, evaporated or remaining without assuming a split. Divide attributable quantities by accepted net area."
      unit: "kg"
      frequency: "Each supply/collection event"
      temporal_coverage: "Full job including final cleanup"
      site_scope: "Workfront through actual collection gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration; collection weights; moisture/solids basis; unexplained water balance and sampling uncertainty"
    - protocol_id: cp_exits
      process_id: "demolition"
      flow_role: "removed masonry reuse waste and spent supplies"
      record_type: "custody transfer and weighing"
      raw_fields: "job_id; lot_id; transfer_id; material; status; tare; gross_mass; moisture; contamination; receiver; acceptance; retained_stock; transport_owner; treatment_owner; usable_return"
      collection_method: "Weigh or use traceable receiving weights, classify each lot once and retain acceptance/destination evidence. Link rejected reuse lots back to demolition stock then actual waste/retention route; prevent product/waste double classification. Divide actual outgoing mass by accepted net area."
      unit: "kg"
      frequency: "Each outgoing lot and closing stock count"
      temporal_coverage: "From first removal to final collection-gate reconciliation"
      site_scope: "Declared on-site collection gate and documented receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale traceability; unique transfer ids; accepted product quality; waste classification; closing stock and mass reconciliation"
    - protocol_id: cp_emissions
      process_id: "demolition"
      flow_role: "characterized air releases"
      record_type: "measurement or validated estimation dossier"
      raw_fields: "job_id; substance; particle_class; air_compartment; sampling_duration; control_state; emitted_mass; estimation_method; captured_mass; uncertainty; missing_coverage"
      collection_method: "Use representative emission measurements or a validated job-specific total-release method with actual control state. Preserve species/particle basis and medium; do not convert worker exposure concentration to total release without a defensible mass calculation. Exclude measured captured waste and normalize attributed emitted mass by accepted net area."
      unit: "kg"
      frequency: "Each representative operation/control state and full-job estimate"
      temporal_coverage: "Removal and cleanup including corrective work"
      site_scope: "Actual workfront receiving air compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Method validation; monitoring coverage; measurement uncertainty; explicit uncovered species/stages"
  calculation_rules:
    - id: area_normalization
      applies_to: "all inventory rows"
      rule: "Record attributable job exchange quantity per reference flow by dividing by the measured accepted net removal area in m2. Sum disjoint accepted wall polygons once; record uncertainty and reject a zero or unresolved denominator. No area-to-mass conversion is implied."
      inputs:
        - cp_area
        - "node-specific quantity protocol"
      output: "Exchange quantity per reference flow"
      source_ids: []
    - id: shared_attribution
      applies_to: "bounded_resource_service; site_electricity"
      rule: "Use direct job measurement first. Distribute only the residual shared pool by the documented job causal-use share of all consumers in that period; reconcile allocated totals to that residual. Apply area_normalization after attribution."
      inputs:
        - cp_resources
        - cp_area
      output: "Attributable resource quantity per reference flow"
      source_ids: []
    - id: custody_closure
      applies_to: "reusable_removed_material; masonry_waste; supplies_waste; cleanup_wastewater; characterized_air_release"
      rule: "Compare removed stock and added supplies/water with accepted reusable exits, waste exits, actual emissions and remaining stock on compatible mass/moisture bases. Keep uncertain or unmeasured terms visible; do not infer missing air release as a balance residual or force an artificial zero."
      inputs:
        - cp_area
        - cp_resources
        - cp_water
        - cp_exits
        - cp_emissions
      output: "Material/water closure and unexplained difference"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "demolition"
      requirement: "Prove nonloadbearing bare brick/mortar wall, isolation, hazard clearance and approved hand-tool method; stop on contradictory conditions."
      evidence: "Survey; engineering/method approval; local release record"
    - id: dq_quantity
      applies_to: "all inventory rows"
      requirement: "Use the same accepted area denominator; disclose instrument error, stock carryover, moisture and incomplete measurements. Record nonuse separately from missing quantities."
      evidence: "cp_area and all linked protocols"
    - id: dq_time
      applies_to: "all inventory rows"
      requirement: "Cover actual work and corrective visits with dated resource, transfer and completion events; disclose gaps instead of replacing them with zero."
      evidence: "Complete job/event ledger"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Resolve each actual exchange to a compatible concrete flow, property and unit with detail evidence. Conditional umbrella cards require actual foreground identities; support gaps remain explicit."
      evidence: "Identity dossier and actual material/provider/medium records"
    - id: dq_ranges
      applies_to: "all inventory rows"
      requirement: "Replace missing Range evidence with observed job distributions or defensible technology-specific evidence when available. Retain the stated evidence need until resolved; no universal water, energy, dust, density or recovery coefficient is prescribed."
      evidence: "Per-card evidence needs; measurements with uncertainty"
    - id: dq_gate
      applies_to: "accepted_demolition; material exits"
      requirement: "Keep inspection failure/rework and undecided material lots out of accepted service/product quantities. Close correction or disclose incomplete output."
      evidence: "Signed handover and custody acceptance records"
validation_rules:
  - rule_id: scope_release
    applies_to: "demolition"
    rule: "Verify scope and actual approved sequence/limits against ready-to-work evidence. A structural, hazardous or unresolved wall cannot pass this category gate."
    source_ids:
      - hse-demolition
      - osha-masonry-removal
  - rule_id: area_once
    applies_to: "accepted_demolition"
    rule: "Require 1 m2 reference with verified Area support; reconcile net accepted elevation, openings, thickness, no second wall face and all corrective work. Missing/zero accepted area blocks normalization."
    source_ids: []
  - rule_id: rework_gate
    applies_to: "demolition"
    rule: "Reconcile initial work, failed inspection, repeat cleanup/removal and final acceptance in one node. Exclude unresolved/rejected area; retain failed-attempt burdens."
    source_ids: []
  - rule_id: exit_closure
    applies_to: "material exits"
    rule: "Verify unique material/transfer ids, product acceptance versus waste status, retained stock and characterized air/water split. Missing receiving status cannot become reusable product or recovery credit."
    source_ids: []
  - rule_id: shared_conservation
    applies_to: "bounded_resource_service; site_electricity"
    rule: "Verify actual shared consumers/periods, causal driver evidence, coverage and conservation of residual pool; reject overlap with energy/capital already inside a provider service."
    source_ids: []
  - rule_id: identity_coverage
    applies_to: "all inventory rows"
    rule: "Require verified concrete identity and property/unit before final dataset exchanges. Report unresolved umbrella/UUID/support identities and Range evidence gaps as coverage limits even when structural checks pass."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site-specific foreground data package for completed manual nonloadbearing brick-partition demolition"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Building renovation or demolition models matching the declared wall, method, site and collection gate; downstream process and lifecyclemodel projections"
  excluded_use: "Structural demolition; hazardous abatement; new wall production; machinery collapse; universal demolition benchmark; automatic recycling or avoided-production credit"
  required_metadata: "Wall dimensions/thickness/materials; once-only net area; survey/method releases; actual hand tools/control system; reporting dates; providers and shared consumers; stock and waste ownership; collection and treatment gates"
  required_quality_disclosure: "Area/mass uncertainty; incomplete air/water coverage; identity and Energy/Duration support gaps; unresolved Range evidence; local correction burdens; upstream wall and capital-service exclusions"
  update_trigger: "Changed wall composition or thickness; method/control/access change; new supplier/service coverage; survey/hazard change; altered material destination; revised measurement or accepted gate"
data_sources:
  - id: "hse-demolition"
    type: "official_guidance"
    reference: "https://www.hse.gov.uk/construction/safetytopics/demolition.htm"
    used_for: "Planning context for competent survey/method, structure/services/hazards and sequence-dependent stability/debris controls; not a universal national legal prescription"
  - id: "osha-masonry-removal"
    type: "standard"
    reference: "OSHA 29 CFR 1926.854, Removal of walls, masonry sections, and chimneys; https://www.osha.gov/laws-regs/regulations/standardnumber/1926/1926.854"
    used_for: "Technical context for masonry floor-load and remaining-wall stability constraints; apply actual local requirements and approved job limits"
  - id: "un-cpc3-notes-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, PDF p. 288; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Demolition services classification scope; no inventory factors"
