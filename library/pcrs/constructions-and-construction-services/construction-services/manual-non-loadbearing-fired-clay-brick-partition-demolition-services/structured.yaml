measurement_rules:
  - id: net_area
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Measure removed elevation polygons in one wall plane, subtract unremoved openings and retained areas, and count neither the opposite face nor thickness as extra area. Record thickness independently. cp_area reconciles survey and signed completion; partial or rejected area is not accepted area."
  - id: material_mass
    applies_to: "removed material and waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use tare-corrected measurements or traceable receiving weights with moisture/contamination basis. Area or volume cannot become mass through an assumed wall density."
  - id: native_energy
    applies_to: "electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Keep metered or supplier energy in its native recorded unit; retain conversion evidence before changing units. Electricity property/support and supply identity must be verified for concrete exchanges."
