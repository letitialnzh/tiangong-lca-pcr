product_category_identity:
  canonical_pcr_id: "pcr.manual-non-loadbearing-fired-clay-brick-partition-demolition-services"
  classification_refs: "cpc:3.0:54310; narrower than Demolition services"
  covered_products: "Completed manual dismantling and cleared-area handover for the specified nonloadbearing partition"
  excluded_products: "Whole-building or structural demolition; mechanical collapse; hazardous abatement; wall construction; independent recovery processing"
  representative_product: "One square metre of net brick-partition elevation removed and accepted after clearance"
  production_route: "Approved ready-to-work interface; controlled hand-tool removal; contained transfer of debris; segregation by actual receiving route; cleanup; inspection and corrective work; signed handover"
  market_state: "Site-delivered completed demolition service with documented material custody at the declared collection gate"
functional_unit:
  what: "Accepted removal of the declared interior partition"
  how_much: "1 m2 of net wall elevation measured once"
  how_well: "Entire declared thickness removed; retained structure stable; collection area cleared; unresolved inspection defects excluded from accepted area"
  how_long_or_cycle: "One documented job through corrective-work closure and signed handover; no building-use lifetime"
  reference_flow_link: "accepted_demolition"
system_boundary:
  rules:
    - rule_id: ready_interface
      applies_to: "demolition"
      rule: "Require actual competent survey, method and isolation evidence before hand-tool work; use HSE planning guidance and OSHA masonry stability/loading principles as technical context, with applicable local requirements independently declared. No generic top-down instruction substitutes for the approved job sequence."
      source_ids:
        - hse-demolition
        - osha-masonry-removal
    - rule_id: removal_gate
      applies_to: "demolition"
      rule: "The independent removal responsibility ends at stable retained structure, cleared accepted area and separately documented outgoing materials at the on-site collection gate. Screening and segregation here serve this gate; off-site crushing or recovery is not an embedded production node."
      source_ids: []
    - rule_id: stock_ledger
      applies_to: "demolition"
      rule: "Record the existing wall geometry/materials in a custody ledger. Reconcile removed mass, remaining stock, outgoing products/wastes and actual characterized releases; do not invent an exchange buying the existing wall or label it waste before the actual removal decision."
      source_ids: []
    - rule_id: resources
      applies_to: "demolition"
      rule: "Include attributable hand-tool/access/visit service, dust-control water/extraction power, consumed protection and cleanup materials, contained debris transfer, cleanup and corrective work when used. A bounded provider service owns its stated capital coverage; separately disclose any exclusion and never invent a tool lifetime."
      source_ids: []
    - rule_id: sharing
      applies_to: "demolition"
      rule: "Maintain shared asset/service ids with this demolition node and all other consuming jobs or reporting periods. Record service coverage, period totals, job use and attribution driver; meter local use first and allocate only a residual actually shared burden."
      source_ids: []
    - rule_id: exit_owner
      applies_to: "demolition"
      rule: "Record solid waste, wastewater and air releases at their actual distinct gates. Downstream transport/treatment is excluded from this on-site service inventory but its responsible dataset owner and transfer evidence are mandatory; no avoided virgin production or recovery credit is automatic."
      source_ids: []
    - rule_id: boundary_atomic_completion
      applies_to: "all processes"
      rule: "Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
      rule: "The following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool."
