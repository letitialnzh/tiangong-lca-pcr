boundary_abstraction:
  declared_starting_condition: "Named retained qualified existing apartment building, actual geometry/structure/occupancy/services survey and approved integrated retrofit design; historic assets and actual interfaces identified"
  starting_condition_role: "existing_asset_intervention_start"
  product_classification_scope: "CPC:3.0:54112; narrower integrated retrofit subset"
  recursive_input_rule: "A same-category subcontract service may enter only as a bounded actual completed upstream service with physical native quantity and full scope; exclude this foreground job from that input and resolve overlapping nodes/resources"
  upstream_dataset_requirement: "Complete applicable manufacture/materials, energy, transport, assets, service delivery, loss/waste and end-of-life coverage for each purchased package or service; explicitly collect gaps"
  disclosure: "Retained baseline, all phases/periods, actual design/test gate, provider/asset coverage, stock convention, actual refrigerant and gross power fates, exclusions and uncertainty"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Completed accepted integrated existing multi-dwelling building energy retrofit service"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "unique existing physical building ID"
    - "at least three dwellings and actual dwelling count"
    - "retained structure and occupancy/vacating state"
    - "measured floor area and convention"
    - "retained/replaced schedule"
    - "actual prefab facade/window/roof package specifications"
    - "heat-pump/HRV/PV installed configuration"
    - "actual approved project targets and jurisdiction"
    - "survey and compatibility evidence"
    - "gross test-energy source and meter boundary"
    - "refrigerant species/precharge/topup/fates"
    - "event/phase/period coverage"
    - "tests/retests/defect closure"
    - "signed final acceptance date"
reference_flows:
  []
measurement_rules:
  - id: m_reference
    applies_to: "accepted_retrofit"
    required_property_ref:
      name: "Count"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "One reference is one complete accepted physical building retrofit. N>0 counts unique IDs, with at least three dwellings and no added dwellings; floor area/dwelling count/configuration are comparability qualifiers, never denominators or equivalent output counts."
  - id: m_native
    applies_to: "all inventory rows"
    required_property_ref:
      name: "actual physical property"
      uuid: ""
    required_unit: "actual native unit"
    rule: "Preserve actual Count/Area/Length/Volume/Mass supply and matched-return units. Any independent mass conversion requires SKU, material state, moisture basis, density value/unit, temperature value/unit and source, with uncertainty. This mass audit and physical native view are nonadditive. Actual electrical energy, time or provider units require independent verified support; no NCV/GCV/Count substitution."
  - id: m_fates
    applies_to: "fuel_species; refrigerant_releases; support_releases; installation_releases; preparation_releases"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use actual species and receiving medium. Measured species mass OR matched activity-species factor OR actual whole-fluid release times evidenced composition/fate are alternatives. Complete species factors already include their declared basis and must not receive a second composition/fate multiplier; whole-fluid audit is nonadditive."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: prepare
    name: "Existing-building survey and independent selective removal"
    inclusion: "required"
    inclusion_condition: "Always; actual removal follows retained/replaced schedule, with explicit zero where no item is removed."
    role: "Retained-building starting condition, survey/design, separately accountable selective removal and actual source-to-usable-recipient or qualified waste-treatment handoff; recorded hazard clearance releases the retained structure to integrate. This responsibility ends before integration, not at final retrofit acceptance, and does not perform waste treatment."
    quantitative_reference: "per reference flow"
  - id: integrate
    name: "Prefab envelope and building-services integration"
    inclusion: "required"
    inclusion_condition: "Always; actual item ledger defines zero, one or multiple concrete exchanges per role."
    role: "Join insulated facade/windows and roof, heat pump/hot water, HRV, roof PV, distribution, electrical protection and controls to retained structure; rework loops remain here until conforming."
    quantitative_reference: "per reference flow"
  - id: support
    name: "Project-owned logistics temporary utilities and shared resources"
    inclusion: "required"
    inclusion_condition: "Always; only actually incurred resources and individually documented absent roles."
    role: "One owner for direct/provider/rental freight, scaffold/lift/tools, fuel, gross test power/water and fates across prepare, integrate and accept."
    quantitative_reference: "per reference flow"
  - id: accept
    name: "Integrated commissioning defect closure and handover"
    inclusion: "required"
    inclusion_condition: "Always; N follows actual complete physical joint acceptance. LCA quantity/identity/scope gaps block dataset finalization without reversing a physically accepted building."
    role: "Actual required blower-door/ventilation balance, heat-pump/hydronic, electrical/PV protection/control tests and signed owner acceptance; failed tests return to integrate and support resources remain in numerator."
    quantitative_reference: "per reference flow"
