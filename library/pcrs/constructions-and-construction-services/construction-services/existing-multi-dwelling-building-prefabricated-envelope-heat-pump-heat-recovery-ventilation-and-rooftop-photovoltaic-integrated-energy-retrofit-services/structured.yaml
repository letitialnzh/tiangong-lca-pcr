          amount:
            expression: "Only when the input is a lifecycle-complete asset burden per asset, use (job_driver/full_life_driver)/N item; job_driver and full_life_driver share the same physical unit. Include manufacture, maintenance, replacements and end-of-life across all jobs/nodes/periods."
            value_mode: "calculated_value"
