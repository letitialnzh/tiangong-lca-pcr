allocation_rules:
  - rule_id: a_reference
    applies_to: "all inventory rows"
    rule: "Aggregate actual attributable resources from all successful and failed attempts and preparation into the job numerator; divide by N unique finally accepted building retrofit IDs exactly once. Retests, dwellings, panels and shared phase events never increase N. Missing final acceptance does not erase incurred burdens."
    source_ids: []
  - rule_id: a_stock
    applies_to: "all inventory rows"
    rule: "For each SKU/native unit use S = attributed opening stock + external net-tare gross receipts - carried closing stock. Choose declared gross-with-outlets OR consumed-only subtracting actual matched usable outward returns once. Internal issue/installation is not supply; closing is not outward return. Nonreturned waste/loss retains upstream burden. Historic removals cannot be negative purchases."
    source_ids: []
  - rule_id: a_assets
    applies_to: "asset_equivalent; asset_native_service"
    rule: "One asset ledger spans all consumers/jobs/nodes/periods, manufacture, maintenance, replacement and end-of-life. Compatible actual job_driver/full_life_driver gives asset-equivalent item, then /N; alternatively actual job_driver/N native service units multiply a lifecycle-complete burden per identical driver unit. Never combine views, divide by life again in service view or normalize twice. Observed life or observed history plus evidenced remainder/replacement/termination/end-of-life needs sources, uncertainty, sensitivity and update triggers."
    source_ids: []
  - rule_id: a_rejects
    applies_to: "integrate"
    rule: "Tie failed installations and retests to the producing attempt and integrate-to-integrate rework loop. Use actual repaired-in-place, usable outward return, recovery, downgrade or waste destination. Rework adds its real resources but no duplicate purchase or accepted output; unclosed defects cannot enter N."
    source_ids: []
  - rule_id: a_outlets
    applies_to: "all outputs"
    rule: "Record usable historic recovery, new outward returns and actual test electricity export with recipient and declared treatment, distinct from intended accepted service; no automatic avoided production, fuel, energy, disposal or future saving credit. Recycled-content inputs require actual SKU coverage, never inferred from recovered outlets."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "Starting condition, survey and historic removal"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; survey_id; occupancy_state; dwelling_count; floor_area; floor_area_unit; floor_area_convention; structural_capacity_evidence; thermal_bridge_record; moisture_record; fire_interface_record; air_path_record; retained_replaced_schedule; hazardous_clearance; retained_structure_release_id; integration_recipient; design_target_id; provider_deliverable; native_quantity; native_unit; material_state; hazard; recipient; waste_mass; species; receiving_medium; species_mass; activity; activity_unit; factor; factor_unit; factor_basis; factor_source; composition; composition_basis; composition_source; fate_fraction; fate_basis; fate_source; uncertainty; source_id"
      collection_method: "Survey and document qualified existing structure/services with competent approved design; measure actual physical provider deliverables and removed materials by native unit/weighing and trace actual reuse/treatment recipient; measure actual species releases or use valid matched factors with original operands. Aggregation detail: Aggregate attributable actual quantities per reference flow; each job quantity divided by N once; historic baseline is not new supply."
      unit: "actual native unit; kg"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed survey/design, calibrated records, recipient and hazardous-handling evidence, direct-release/factor applicability."
    - protocol_id: cp_packages
      process_id: "integrate"
      flow_role: "Package and separate installation stock, returns, rejects and releases"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; sku; specification; unit; native_quantity; activity; activity_unit; opening_attributed; external_gross_receipts; container_tare; carried_closing; internal_issue; installed_activity; usable_outward_return; return_receipt; ledger_view; package_scope; precharge_included; provider_scope; reject_id; rework_event; destination; waste_mass; density; density_unit; material_state; moisture; moisture_basis; temperature; temperature_unit; conversion_factor; conversion_unit; conversion_source; species; receiving_medium; species_mass; factor; factor_unit; factor_basis; factor_source; composition; composition_basis; composition_source; fate_fraction; fate_basis; fate_source; uncertainty; source_id"
      collection_method: "Use actual purchase/delivery net-tare, opening/closing stock, SKU specifications and installed as-built records; document package constituents and covered upstream scope before adding any loose input. Match each usable outward return to its input and each reject/rework exit to its attempt. Collect actual species/medium and conversion operands only where needed. Aggregation detail: Per reference flow use S/N for each SKU/native unit with one declared return convention; do not sum nonadditive views or normalize twice."
      unit: "item; m2; m; m3; kg"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier production gate/BOM scope, calibrated quantities, return receipts, rejection and fate evidence."
    - protocol_id: cp_refrigerant
      process_id: "integrate"
      flow_role: "Circuit-specific refrigerant stock and disjoint fates"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; circuit_id; equipment_id; refrigerant_specification; historic_charge; factory_precharge; cylinder_id; cylinder_tare; opening_attributed; external_receipts; carried_closing; usable_return; topup_measured; circuit_closing; recovered_usable_mass; contained_waste_mass; whole_fluid_release_mass; species; receiving_medium; measured_species_mass; activity; activity_unit; factor; factor_unit; factor_basis; factor_source; composition; composition_basis; composition_source; fate_fraction; fate_basis; fate_source; recipient; treatment_id; uncertainty; source_id"
      collection_method: "Weigh cylinders and actual transfers with tare; distinguish historic charge, factory-precharged equipment and separately supplied field top-up. Complete required old-equipment isolation/recovery and circuit-record handoff before the affected prepare removal; this integrate ledger keeps the true event phase/time with one owner, not a later physical recovery assumption. Link each circuit event to retained charge, usable recovery, contained waste and actual release; obtain actual species, medium and measured/factor/composition/fate evidence without default leakage. Aggregation detail: Per reference flow field stock S/N and each independent actual fate/N once; factory precharge is inside equipment, and whole-fluid audit is nonadditive to species."
      unit: "kg"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scales, charge sheets, recipient/treatment documents, mixture and factor basis plus uncertainty."
    - protocol_id: cp_provider
      process_id: "support"
      flow_role: "Provider scope and native completed result"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; provider_id; contract_scope; native_result; native_quantity; native_unit; verified_service_id; verified_property_id; verified_unit_group_id; included_materials; included_energy; included_transport; included_assets; included_tests; included_waste; uncovered_resources; overlap_owner; allocation_driver; allocation_source; uncertainty; source_id"
      collection_method: "Obtain primary provider records for actual completed physical results and complete lifecycle/upstream scope, reconcile every direct and provider-paid resource with one owner; missing coverage must be collected rather than inferred from cost or hours. Aggregation detail: Per reference flow attributable actual physical service quantity/N once, or uncovered individual resources in their own ledgers, without overlap."
      unit: "verified actual native service unit"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed scope matrix, physical completion, native unit support, uncovered-resource closure."
    - protocol_id: cp_freight
      process_id: "support"
      flow_role: "Actual transport legs and empty returns"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; leg_id; shipment_id; mode; vehicle_id; load_kg; load_mass_unit; distance_km; distance_unit; empty_return_activity; empty_activity_unit; shared_load_driver; driver_unit; provider_scope; included_legs; uncovered_activity; upstream_dataset_scope; uncertainty; source_id"
      collection_method: "Retain actual load and travel records, route and delivery/return/waste recipient; reconcile complete transport upstream and empty-return inclusion, using compatible physical allocation of shared loads. Aggregation detail: Per reference flow sum attributable load_kg*distance_km/N once; empty legs need explicit service coverage or separate vehicle activity and are not fictitious cargo work."
      unit: "kg*km"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighbridge/load records, measured routes, provider scope, conversion and allocation evidence."
    - protocol_id: cp_assets
      process_id: "support"
      flow_role: "All-consumer temporary asset lifecycle and one native view"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; asset_id; provider_id; consumer_jobs; consumer_nodes; consumer_periods; service_start; service_end; attribution_view; job_driver; driver_unit; full_life_driver; full_life_driver_unit; observed_history; evidenced_remaining_use; manufacture_scope; maintenance_events; replacement_events; termination_event; end_of_life_scope; lifecycle_burden; burden_unit; burden_denominator_unit; verified_service_id; verified_property_id; verified_unit_group_id; evidence_source; uncertainty; sensitivity; update_trigger"
      collection_method: "Build complete all-consumer lifecycle ledgers from actual asset/provider records. Resolve observed completed life or observed history plus evidenced remainder, maintenance, replacements, termination and end-of-life; use a physically compatible driver and verify its native service support. Select exactly one quantity/burden view per asset. Aggregation detail: Per reference flow asset-equivalent=(job_driver/full_life_driver)/N with per-asset lifecycle burden OR native-service=job_driver/N with complete burden per same driver unit; do not combine or divide again."
      unit: "item or verified actual native driver unit"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "Complete asset lifetime across ALL consumers/jobs/nodes/periods: observed history plus evidenced remaining use, maintenance, replacement, termination and end-of-life"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Complete manufacture/maintenance/replacement/end-of-life coverage, denominator evidence, uncertainty/sensitivity and live update requirement."
    - protocol_id: cp_power
      process_id: "support"
      flow_role: "Gross temporary and integrated test electricity"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; meter_id; source_id; recipient_id; electricity_origin; baseline_retained_generation; interval_start; interval_end; import_start; import_end; export_start; export_end; meter_multiplier; electricity_unit; circulation; test_load; loss; test_id; failed_test_id; retest_id; attribution_driver; attribution_unit; included_provider_scope; uncertainty; verification_record"
      collection_method: "Use source-resolved import/export meters, not net billing. Log actual test run/failed/retest loads, retained PV/generator baseline and internal circulation/loss boundaries; separate production factors and provider coverage. Independently verify actual electrical-energy property/unit support. Aggregation detail: Per reference flow actual gross attributable imports/N and exports/N separately; no future savings or netting and no duplicate internal circulation."
      unit: "kWh"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated meter intervals, energy reconciliation, native support and source/provider ownership."
    - protocol_id: cp_water
      process_id: "support"
      flow_role: "Supply, hydronic contents and wastewater fates"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; source_id; water_grade; meter_id; opening_contents; external_supply; natural_water_resource_id; natural_abstraction_quantity; natural_abstraction_unit; environment_discharge_quantity; environment_discharge_unit; receiving_water_medium; water_property_id; water_unit_group_id; closing_contents; circulation; recovered_quantity; discharge_quantity; quantity_unit; material_state; temperature; temperature_unit; quality_analysis; receiving_treatment; included_treatment_scope; direct_species; direct_medium; species_mass; activity; activity_unit; factor; factor_unit; factor_basis; factor_source; composition; composition_basis; composition_source; fate_fraction; fate_basis; fate_source; uncertainty; evidence_id"
      collection_method: "Meter actual external water, retained circuit contents, recovery and wastewater destination by actual event; distinguish internal recirculation and quality. Obtain direct species/medium evidence separately when present; no discharge assumed from supply. Aggregation detail: Per reference flow each independent actual supply/wastewater quantity/N once, with contained and direct-release boundaries separate."
      unit: "m3; kg actual species when present"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated readings, circuit and discharge balance, treatment acceptance and contaminant quality records."
    - protocol_id: cp_fuel
      process_id: "support"
      flow_role: "Fuel supply, measured burn and mutually exclusive fates"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; fuel_specification; equipment_id; supplier_scope; native_unit; opening_attributed; external_receipts; tare; carried_closing; usable_return; nonburned_waste; uncontained_loss; total_spill_audit; recovered_closing; measured_burn; complete_fates_audit; unknown_loss_investigation; density; density_unit; density_source; conversion_value; conversion_unit; conversion_source; material_state; moisture; moisture_basis; temperature; temperature_unit; species; receiving_medium; measured_species_mass; factor; factor_unit; factor_basis; factor_source; composition; composition_basis; composition_source; fate_fraction; fate_basis; fate_source; uncertainty; evidence_id"
      collection_method: "Obtain actual fuel net-tare stock and calibrated burn records or audited complete disjoint native-unit fates; investigate unknown losses rather than label a residual as burn. Reconcile returned, nonburned waste, loss and carried stock, and actual equipment/fuel-specific species factors or measurement. If an independent Mass fuel/waste/activity view is required from native Volume, retain the measured density value/unit/source, state/moisture/temperature and temperature_unit, and conversion value/unit/source; this Mass view is nonadditive to the native ledger. Aggregation detail: Per reference flow supplied S/N once and independent actual species/N once; measured burned activity is not another fuel purchase and total-spill audit is nonadditive."
      unit: "kg or actual native fuel unit; kg species"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated burn/stock, complete fates and unknown-loss audit, factor applicability and uncertainty."
    - protocol_id: cp_supportstock
      process_id: "support"
      flow_role: "Temporary materials, usable returns, waste and direct releases"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; sku; specification; unit; native_quantity; activity; activity_unit; opening_attributed; external_gross_receipts; container_tare; carried_closing; internal_issue; installed_activity; usable_outward_return; return_receipt; ledger_view; package_scope; precharge_included; provider_scope; reject_id; rework_event; destination; waste_mass; density; density_unit; material_state; moisture; moisture_basis; temperature; temperature_unit; conversion_factor; conversion_unit; conversion_source; species; receiving_medium; species_mass; factor; factor_unit; factor_basis; factor_source; composition; composition_basis; composition_source; fate_fraction; fate_basis; fate_source; uncertainty; source_id; whole_fluid_release_mass; recovered_closing; total_spill_audit; fuel_return_transfer_id"
      collection_method: "Reconcile actual stock/native receipts and actual usable outward returns, spares, test/cleaning materials, contained waste and direct species/medium fates. Fuel outward return and nonburned waste reference cp_fuel event IDs once; full fluid and species audit views are nonadditive. Aggregation detail: Per reference flow S/N with one return convention and each independent actual waste/release/N once; no duplicate package/provider/asset coverage."
      unit: "actual native unit; kg species"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Net-tare stock, receipts, treatment destinations and actual species/factor/composition/fate evidence."
    - protocol_id: cp_accept
      process_id: "accept"
      flow_role: "Unique final building retrofit gate"
      record_type: "foreground_record"
      raw_fields: "project_id; site_id; building_id; process_id; campaign_id; event_id; phase_id; period_id; time_start; time_end; owner_id; transfer_id; accepted_building_ids; N; dwelling_count; floor_area; floor_area_unit; floor_area_convention; configuration; design_target_id; asbuilt_envelope; anchorage_record; weather_air_water_fire_interfaces; blowerdoor_required_result; airflow_balance; heatpump_hydronic_result; electrical_PV_protection_control_result; failed_test_ids; retest_ids; defect_closure; owner_signoff; authority_signoff_if_applicable; acceptance_date; evidence_id"
      collection_method: "Reconcile unique retained building IDs against completed integrated scope, as-built interfaces, actual approved tests/retests, closed defects and signed handover. Treat sections of one physical building as one ID; record dwelling count/area convention for comparability only. Aggregation detail: N unique finally accepted physical building retrofit IDs; reference output is 1 item; supporting job quantities divide by N once."
      unit: "item"
      frequency: "Each actual event, stock interval and final close"
      temporal_coverage: "All survey/removal/integration/test/retest/acceptance periods"
      site_scope: "Named job/site/building and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed owner/authority records as applicable, as-builts, calibrated tests, defect and duplicate-ID closure."
  calculation_rules:
    - id: c_normalize
      applies_to: "all inventory rows"
      rule: "Sum actual attributable job quantities of the same flow, unit and scope including failed attempts and divide by N once; final service is 1 item. Do not apply a second normalization to already per-reference asset or provider quantities."
      inputs:
        - "actual job quantities"
        - N
        - cp_accept
      output: "Exchange amount per reference flow"
      source_ids: []
    - id: c_stock
      applies_to: "all stock-linked inventory rows"
      rule: "S = attributed opening + external net-tare gross receipts - carried closing; declared gross-with-outlets uses S and actual matched return outlet; consumed-only subtracts that same usable outward return once. Internal installation, loss and waste do not become another purchase."
      inputs:
        - opening
        - "external receipts"
        - tare
        - closing
        - "usable outward return"
        - "ledger view"
      output: "Actual native supply with one return convention"
      source_ids: []
    - id: c_species
      applies_to: "preparation_releases; refrigerant_releases; installation_releases; fuel_species; support_releases"
      rule: "Choose measured species mass OR actual compatible activity * valid species factor OR measured whole-fluid release * evidenced mass composition * receiving-medium fate. Preserve units/bases/sources. Complete species factor receives no extra composition/fate multiplier; fluid audit is nonadditive."
      inputs:
        - "measured species mass"
        - "actual activity"
        - "factor unit/basis/source"
        - "whole-fluid release"
        - "composition basis/source"
        - "fate basis/source"
      output: "Species mass per receiving medium before one normalization"
      source_ids: []
    - id: c_asset_views
      applies_to: "asset_equivalent; asset_native_service"
      rule: "Choose asset_equivalent = (job_driver/full_life_driver)/N item with per-asset complete lifecycle burden OR asset_native_service = job_driver/N actual native units with complete burden per identical driver unit. Driver units must match; no combined views or extra life/N division."
      inputs:
        - job_driver
        - full_life_driver
        - "driver units"
        - "burden denominator"
        - attribution_view
        - N
        - cp_assets
      output: "One asset contribution per reference flow"
      source_ids: []
    - id: c_freight
      applies_to: "freight"
      rule: "Sum attributable load_kg * distance_km over actual cargo legs, then /N; empty-return service coverage or vehicle activity remains explicit. Convert t*km to kg*km only with the factor 1000 and declared input units."
      inputs:
        - load_kg
        - distance_km
        - "empty-return coverage"
        - "actual allocation"
        - N
        - cp_freight
      output: "kg*km per reference flow with empty activity coverage"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "all inventory rows"
      requirement: "Use actual project, geography, period, retained structure, occupancy and configuration; compare only like scope, dwelling count and declared area convention, without declaring unlike buildings equivalent."
      evidence: "Survey, actual design/as-builts and signed handover"
    - id: dq_operands
      applies_to: "all protocols"
      requirement: "Retain original operands, units, factor/composition/fate basis and sources, uncertainty and calibration. Every event has one node owner and transfer/period link; no duplicated raw field names or hidden netting."
      evidence: "Primary measurements and audited source/scope matrices"
    - id: dq_gaps
      applies_to: "all inventory rows"
      requirement: "Individually document absence or measured coverage; do not replace missing provider/asset scope, species, native unit or range evidence with a universal zero/default. Update when actual design, supplier, refrigerant, tests or asset lifetime evidence changes."
      evidence: "Completeness, uncertainty/sensitivity and update log"
validation_rules:
  - rule_id: v_environment_water
    applies_to: "water_supply; wastewater; support_releases"
    rule: "If actual direct natural-water abstraction or direct environmental whole-water Volume discharge occurs, the foreground package MUST add independently measured elementary input/output exchanges in the verified actual water-resource/receiving-medium identity and native Volume unit, with its own event/owner and original quantity. It is not purchased product water or wastewater-to-treatment. Keep whole-water Volume and any actual dissolved species Mass as distinct nonadditive physical/species views; c_species/m_fates govern only the named species-Mass rows, never convert or replace environmental water Volume. Missing actual water-resource identity/unit support blocks dataset finalization, not physical acceptance."
    source_ids: []
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Require actual SKU/service/species/destination and verified concrete flow/property/unit group for final exchanges. Reject at-plant Mass building flows as Count retrofit services and unknown native provider/energy support. Track each missing identity; a methodological target check cannot prove external identity verification."
    source_ids: []
  - rule_id: v_gate
    applies_to: "accepted_retrofit"
    rule: "Check retained-building survey/compatibility, actual design and installed anchorage/thermal/moisture/fire/air/weather interfaces; actual required blower-door, airflow balance, heat-pump/hydronic and electrical-PV-protection-control tests/retests, defect closure and signed owner/authority acceptance as applicable. Historical PHPP2007 targets and annual net-zero claims are not default handover tests."
    source_ids:
      - iea-annex50-design-guide-2011
      - iea-annex50-factsheet-2014
      - energiesprong-hameln-completed-2021
  - rule_id: v_stock_fates
    applies_to: "all inventory rows"
    rule: "Reconcile stock, external receipts, closing and matched usable outward returns once. Reconcile factory precharge, field supply, circuit closing, usable recovery, contained waste and actual species releases without overlapping origin or mass views. Fuel burned must be measured or supported by audited complete disjoint fates with unknown-loss investigation; never residual burn."
    source_ids: []
  - rule_id: v_power
    applies_to: "electricity_import; electricity_export"
    rule: "Require gross source-resolved imports/exports and retained-generation baseline, test circulation/load/loss ownership and meter reconciliation. Reject netting and future energy credits; construction handover does not certify annual operation."
    source_ids: []
  - rule_id: v_assets
    applies_to: "support"
    rule: "Check all asset consumers, nodes, jobs, periods, driver units, full-life denominator, observed history and evidenced remainder/replacement/termination/end-of-life. Check mutually exclusive asset-equivalent/native-service views, provider full upstream coverage and numerator/N once; missing lifecycle scope or unresolved replacements block finalization."
    source_ids: []
  - rule_id: v_rework
    applies_to: "integrate; accept"
    rule: "Every reject has producing node/event and repair, return, recovery, downgrade or disposal path; failed attempts/retests retain all real resources. Rejected or partially commissioned buildings do not enter N and shared events cannot be duplicated across periods."
    source_ids: []
  - rule_id: v_completeness
    applies_to: "all inventory rows"
    rule: "No missing role is assumed zero. Require documented absence or actual measured coverage, source applicability, full provider coverage and species fates. Preserve actual ranges/uncertainty; missing numerical range evidence is disclosed rather than invented. Any material measurement, acceptance, resource or identity gap prevents final data delivery."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground integrated construction-retrofit service dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual completed integrated retrofit comparison within matching retained-building/configuration and acceptance scope; downstream process/lifecyclemodel projections of this foreground package"
  excluded_use: "New-building manufacture, isolated trades, uninstalled equipment, annual net-zero/operating performance guarantees, universal energy-saving or future avoided-impact credits"
  required_metadata: "unique existing physical building ID; at least three dwellings and actual dwelling count; retained structure and occupancy/vacating state; measured floor area and convention; retained/replaced schedule; actual prefab facade/window/roof package specifications; heat-pump/HRV/PV installed configuration; actual approved project targets and jurisdiction; survey and compatibility evidence; gross test-energy source and meter boundary; refrigerant species/precharge/topup/fates; event/phase/period coverage; tests/retests/defect closure; signed final acceptance date"
  required_quality_disclosure: "Identity/support gaps; scope exclusions; actual measurement/factor provenance; stock/native units and return view; factory/provider double-count checks; asset complete-life attribution; gross power and species fates; numerical-range limits; uncertainty/sensitivity and data completeness"
  update_trigger: "Changed retained condition/design, jurisdiction/required acceptance tests, prefab supplier/BOM/precharge, refrigerant, provider scope, actual generation/test boundary, asset history/remainder/replacement/termination or new measured range evidence"
