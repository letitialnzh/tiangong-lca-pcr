          description: "Separate grid import, retained on-site generation consumed, test load/circulation and losses using a reconciled meter boundary. Never net exports or future operational savings against imported electricity. Range evidence need: gross source-resolved imported test/temporary kWh, retained-generation consumption and circulation/loss need interval meters, actual test IDs and ownership; obtain those records without net-billing or future-saving proxies. No transferable numeric interval is established by the available historical route evidence; retain actual observations and uncertainty through cp_power."
