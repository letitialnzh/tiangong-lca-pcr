boundary_abstraction:
  declared_starting_condition: "Ready accessible internal building route, agreed supply and terminal interfaces, component supply at installer custody boundary"
  starting_condition_role: "Declared foreground starting condition, neither installation-service input nor a credit for excluded existing work"
  product_classification_scope: "Narrow copper-crimp PEX-B potable-water installation scope within CPC 3.0 54621"
  recursive_input_rule: "If same-category installation is actually purchased, declare supplier responsibility and handover boundary; never recurse the same job as its own input. New independent responsibility requires scope review."
  upstream_dataset_requirement: "Matching landed material, formulation and service supply with explicit inclusions and delivery/packaging ownership; retain gaps for uncovered portions."
  disclosure: "Start/end interfaces, readiness, excluded works, job periods, upstream/packaging boundaries, asset/rental responsibility, unclosed quantities and identity/range gaps"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted copper-crimp PEX-B potable-water pipe installation"
    uuid: ""
  flow_property_ref:
    uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
  unit_group_ref:
    uuid: "838aaa22-0117-11db-92e3-0800200c9a66"
  reference_unit: "m"
  required_qualifiers:
    - "Building/job and period"
    - "actual PEX-B supplier SKU"
    - sizes
    - "hot/cold function"
    - "branch and physical piece IDs"
    - "interfaces/endpoints"
    - "ring/fitting BOM"
    - "support/penetration protection"
    - "hydraulic test conditions/results"
    - "correction and acceptance gate"
    - "measured D"
    - "upstream dataset boundaries"
reference_flows:
  []
measurement_rules:
  - id: accepted_length
    applies_to: "reference product"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "D is the sum of actual material centreline length of final unique accepted tube pieces in cp_acceptance; divide each exchange numerator by the same positive D. Include insertion/true bends/slack; exclude fitting bodies and removed/rejected/stock pieces."
  - id: material_conversion
    applies_to: "incoming_packaging; pex_tube; barbed_fittings; copper_crimp_rings; support_and_protection; compatible_seal_material; disinfection_product; cleaning_consumables; unused_product_return"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use measured mass per SKU or exact count/length times matching kg factor; stock, usable returns and residuals stay separate. Do not apply to electricity or asset duration."
  - id: water_and_constituent
    applies_to: "supplied_test_flush_water; dispatched_wastewater; water_to_air; aqueous_release_constituent"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Volume requires actual temperature/density; carrier water and constituent mass must not be summed twice; first confirm the source-gal convention."
  - id: asset_and_event
    applies_to: "owned_equipment_attribution; hired_support_service"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Attribute asset shares from actual activity/lifetime activity; count only complete contracted service events. Preserve true hourly rental for Duration verification; never relabel it as count."
  - id: metered_energy
    applies_to: "installation_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Use only cp_energy actual external metering and causal shares; Energy/kWh support is unverified and cannot be replaced with NCV or material mass."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: install_accept
    name: "Installation and acceptance"
    inclusion: "required"
    inclusion_condition: "Actual declared installation scope"
    role: "One installation-to-acceptance responsibility including rework and residuals"
    quantitative_reference: "1 m accepted_installation"
process_inventory:
  - id: install_accept
    label: "Installation and acceptance"
    inputs:
      product:
        - row_id: pex_tube
          role: "PEX-B potable-water tube by size and SKU"
          name: "PEX-B potable-water tube by size and SKU"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Receive and weigh each actual grade/size/SKU, or convert traceable issued length with the matching supplier mass factor. Gross entry includes pieces later cut out or discarded; do not replace entry mass with accepted tube length. Keep stock and actual usable returns separately. Range evidence need: RWC PDF 44 gives nominal 0.054, 0.103 and 0.170 lb/ft for 1/2, 3/4 and 1 in respectively. Matching SKU, supplier tolerance, routing, insertion, cuts, offcuts and rework are required before these factors can support consumption evidence; they are not observed kg per accepted m ranges."
          amount:
            expression: "Measured kg numerator for each actual exchange under cp_materials divided by D."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_materials
              source_ids:
                - rwc-piping-2024
            ranges: []
        - row_id: copper_crimp_rings
          role: "Copper crimp rings by approved size"
          name: "Copper crimp rings by approved size"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Use the approved corresponding ring size at each crimped tube end. Record each original and replacement ring event and weigh or apply exact SKU kg/item. A retained ring serves the permanent mechanical connection; crimp tool use is recorded separately. Range evidence need: The number of successfully crimped tube ends constrains retained rings; actual rejected/replaced events and ring mass are still needed. It supplies neither a universal rings/m ratio nor a mass tolerance interval."
          amount:
            expression: "Measured kg numerator for each actual exchange under cp_materials divided by D."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_materials
              source_ids:
                - sharkbite-pex-2021
            ranges: []
        - row_id: compatible_seal_material
          role: "Compatible minor penetration sealing product"
          name: "Compatible minor penetration sealing product"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Activate only for minor nonstructural closure within the installer responsibility. Identify substrate, interface and compatible supplied formulation; weigh issued, returned and residual contents using container tare. Exclude separately responsible rated firestop and thermal insulation systems. Range evidence need: Actual penetration count/annulus geometry, formulation, applied volume/density and container reconciliation are needed. There is no generic sealant kg/m prior."
          amount:
            expression: "Measured kg numerator for each actual exchange under cp_materials divided by D."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_materials
              source_ids:
                - sharkbite-pex-2021
            ranges: []
        - row_id: supplied_test_flush_water
          role: "Externally supplied potable test and flushing water"
          name: "Externally supplied potable test and flushing water"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Meter fresh external supply by source, interval and hydraulic test/flush/disinfection event. Use actual volume with traceable temperature-dependent density, or directly measured mass. Record recovered internal reuse and retained water separately; repeated filling increases actual input only where new supply enters. Range evidence need: RWC PDF 44 capacities 0.009, 0.018 and 0.030 source gal/ft for 1/2, 3/4 and 1 in diagnose one fill. The US-liquid-gallon interpretation is a declared convention requiring confirmation. Sections, retests, recoveries, retention and flushing endpoints determine actual use; capacity is not a consumption interval."
          amount:
            expression: "Measured kg numerator for each actual exchange under cp_water divided by D."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_water
              source_ids:
                - rwc-piping-2024
            ranges: []
        - row_id: disinfection_product
          role: "Approved supplied disinfectant formulation"
          name: "Approved supplied disinfectant formulation"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Activate only where actual commissioning requires compatible chemical disinfection. Record supplied formulation, concentration, dose batch, container tare, issued/returned contents and solution destination. Supplied mixture mass and active chemical mass remain different quantities. Range evidence need: Actual dose volume, formulation active fraction, batch concentration, contact conditions and residual/disposal records are needed. A prescribed concentration or contact time is not a formulation kg/m interval."
          amount:
            expression: "Measured kg numerator for each actual exchange under cp_water divided by D."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_water
              source_ids:
                - rwc-piping-2024
            ranges: []
        - row_id: installation_electricity
          role: "Electricity at the installation supply meter"
          name: "Electricity at the installation supply meter"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Meter external kWh for tools, pump operation, owned-tool charging and actual corrections/retests. Retain meter start/end, calibration and event times; subtract other-user consumption only with documented causal shares. Energy is not a weighed material or count-to-mass conversion. Later building operation is outside this responsibility. Range evidence need: Energy/kWh support remains unresolved. Comparable metered events with standby/charging ownership, all users and accepted-output shares are needed for a kWh/m interval; a pipe mass factor or NCV identity cannot provide it."
          amount:
            expression: "Measured kWh numerator for each actual exchange under cp_energy divided by D."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_energy
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_installation
          role: "Accepted copper-crimp PEX-B potable-water pipe installation"
          name: "Accepted copper-crimp PEX-B potable-water pipe installation"
          flow_type: "product"
          property_unit: "Length / m"
          description: "Measure D from final unique physical tube-piece IDs at signed acceptance. Include retained insertion within socket/barb and the true curved centreline of bends/slack; exclude fitting/valve/manifold body length, offcuts, removed/rejected pieces and stock. Record each final piece material, diameter, hot/cold function, branch and accepted endpoints. Count hot and cold as different physical pieces, even along one route. Reconcile actual cut-piece/as-built records with endpoints, insertion and bends; gross delivered or issued length is not D. Reworked splits receive new final IDs linked to the removed ID. Repeated drawings, overlapping test sections and retests add no length. Range evidence need: The normalized output is exactly one reference metre, not an empirical yield range. Accepted denominator evidence and excluded/held/rejected-work traceability remain required; retain configuration distinctions."
          amount:
            expression: "1 m"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "method_formula"
              collection_protocol_id: cp_acceptance
              source_ids:
                - accepted-length-normalization
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: single_intended_service
    applies_to: "accepted_installation"
    rule: "The sole intended product is accepted installation. Usable stock return and waste/residual exits are custody dispositions, not intended co-products. Subdivide genuinely separately measured jobs first; retain gross issues and explicit returns consistently rather than netting twice."
    source_ids: []
  - rule_id: failed_work_burden
    applies_to: "install_accept"
    rule: "All failed inspections, tests and corrective work remain within the accepted job numerator. Held/unresolved or rejected length never increases D. A recovered material leaves at its evidenced gate with disclosed treatment; no automatic avoided-product credit or burden erasure."
    source_ids: []
  - rule_id: asset_lifetime_share
    applies_to: "owned_equipment_attribution"
    rule: "For each exact owned asset use actual asset count times current-job service activity / documented total lifetime service activity on the same causal basis. The matching manufacture/maintenance packet includes actual replacements and termination once. List every consumer and period, reconcile shares, and disclose remaining-life uncertainty. Missing lifetime/replacement/termination evidence blocks finalized attribution."
    source_ids: []
  - rule_id: provider_and_period_owner
    applies_to: "hired_support_service; installation_electricity"
    rule: "Keep provider-included manufacture, maintenance, fuel and electricity out of duplicate foreground asset/energy burdens. Attribute genuine shared event or metered energy only by actual use with all consumers. Record period-specific decisions and event IDs; never annualize an already lifetime-attributed resource again or count original and replacement assets as simultaneous whole inputs."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "install_accept"
      flow_role: "accepted_installation"
      record_type: "acceptance register"
      raw_fields: "job; period; final piece ID; retired ID; material; diameter; hot/cold; branch; accepted endpoints; actual centreline length; insertion/bend/slack; test-section IDs; signed gate"
      collection_method: "Reconcile actual cut-piece and as-built lengths to final endpoints, retained insertion and curved/slack records; inspect unique physical IDs and signed acceptance. Exclude fitting bodies, removed/rejected pieces and stock."
      unit: "m"
      frequency: "each final piece and acceptance"
      temporal_coverage: "all installation/correction events to signed gate"
      site_scope: "Declared building job; asset all-consumer/period register"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated length records; as-built; go/no-go and hydraulic test results"
    - protocol_id: cp_materials
      process_id: "install_accept"
      flow_role: "incoming_packaging; pex_tube; barbed_fittings; copper_crimp_rings; support_and_protection; compatible_seal_material; cleaning_consumables; unused_product_return"
      record_type: "material custody ledger"
      raw_fields: "job; period; shipment; SKU/material/state; gross entry; stock opening/closing; installed retained mass; usable return; pack owner; count/length; kg factor; tare; correction ID"
      collection_method: "Weigh each material/packaging/formulation and return with calibrated scale and tare, or use traceable exact SKU count/length-to-mass evidence. Keep embedded packaging physical source pool without repeating its upstream burden."
      unit: "kg"
      frequency: "each receipt, withdrawal, return and closeout"
      temporal_coverage: "all job events including replacements"
      site_scope: "Declared building job; asset all-consumer/period register"
      aggregation_rule: "per reference flow"
      quality_evidence: "scale calibration; supplier factors; issues/returns; pack boundary evidence"
    - protocol_id: cp_water
      process_id: "install_accept"
      flow_role: "supplied_test_flush_water; disinfection_product; dispatched_wastewater; water_to_air; aqueous_release_constituent"
      record_type: "water and constituent ledger"
      raw_fields: "job; period; stream/source/receiver; event; meter start/end; volume; temperature/density; fresh; reused; retained; wastewater; evaporation method; species/concentration; formulation/SKU; active fraction; issued/returned mass; container tare"
      collection_method: "Weigh actual supplied disinfection formulation and usable returns by batch/SKU with container tare; record concentration, dose and residual destination. Meter external withdrawals and actual outgoing streams separately. Reconcile internal reuse and retained water. Quantify evaporation only with actual-condition measurement/model; direct releases require receiving compartment and constituent-specific evidence."
      unit: "kg"
      frequency: "each fill, retest, flush, disinfection and discharge"
      temporal_coverage: "entire commissioning including corrections"
      site_scope: "Declared building job; asset all-consumer/period register"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; density evidence; receiver manifests; constituent measurements"
    - protocol_id: cp_energy
      process_id: "install_accept"
      flow_role: "installation_electricity"
      record_type: "meter register"
      raw_fields: "job; period; tool/pump/charger; start/end kWh; calibration; interval; standby; other consumers; causal share; provider inclusions"
      collection_method: "Read calibrated external supply meter for actual installation/test/charging intervals; retain causal subtraction records for other users and reconcile provider energy coverage. Never weigh energy."
      unit: "kWh"
      frequency: "each supply-meter interval"
      temporal_coverage: "all job use and corrections, excluding later operation"
      site_scope: "Declared building job; asset all-consumer/period register"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter data; calibration; event and consumer share records"
    - protocol_id: cp_services
      process_id: "install_accept"
      flow_role: "owned_equipment_attribution; hired_support_service"
      record_type: "asset and service register"
      raw_fields: "job; period/phase; asset model/serial/count; owner; manufacture packet; maintenance/replacement/termination events; all consumers; job activity; lifetime activity; contract/event definition; completed events; provider inclusions"
      collection_method: "Identify each exact asset and all consuming jobs/periods; collect same-basis job and lifetime activity and actual maintenance/replacement/retirement history. Count genuine complete provider events only; preserve true hourly rental separately for measurement review."
      unit: "item"
      frequency: "each asset-use/service and lifecycle event"
      temporal_coverage: "asset manufacture through use/maintenance/replacement to retirement; all reporting periods"
      site_scope: "Declared building job; asset all-consumer/period register"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset history; lifetime evidence; contracts; all-user share reconciliation"
    - protocol_id: cp_residuals
      process_id: "install_accept"
      flow_role: "dry_material_waste; rejected_component_waste; contaminated_solid_waste; airborne_particulate"
      record_type: "residual and correction ledger"
      raw_fields: "job; period; failed piece/joint; replacement ID; source pool; material/state; gross/tare; captured/airborne; particle fraction; tool/control; receiver; dispatch; monitoring/factor/activity"
      collection_method: "Weigh each recipient-specific waste stream; link failed/replaced material to install_accept and original issue. Quantify direct particulate only through actual monitoring or a verified matching material/tool/control factor and measured activity. Captured dust stays waste."
      unit: "kg"
      frequency: "each correction, collection, release and dispatch"
      temporal_coverage: "entire job including failed work and closeout"
      site_scope: "Declared building job; asset all-consumer/period register"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibrated scales; manifests; failure lineage; release monitoring/factor evidence"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "incoming_packaging; pex_tube; barbed_fittings; copper_crimp_rings; support_and_protection; compatible_seal_material; cleaning_consumables; unused_product_return"
      rule: "Divide each actual material/SKU/state exchange kg numerator by D; activate packaging burden only when supply is separately modelled. Do not net gross entry and return twice."
      inputs:
        - actual_kg
        - D
        - cp_materials
        - cp_acceptance
      output: "kg per reference flow"
      source_ids: []
    - id: formulation_normalize
      applies_to: "disinfection_product"
      rule: "Divide actual supplied formulation kg numerator by D; record active fraction separately without replacing supplied mixture mass or inferring residual chlorine."
      inputs:
        - formulation_mass
        - active_fraction
        - D
        - cp_water
        - cp_acceptance
      output: "kg per reference flow"
      source_ids: []
    - id: owned_asset_normalize
      applies_to: "owned_equipment_attribution"
      rule: "Actual asset count × job service activity / documented same-basis lifetime service activity / D; match manufacture/actual maintenance/replacement packet to exact asset, reconcile all job/period shares and withhold finalization without lifetime/termination evidence."
      inputs:
        - asset_count
        - job_activity
        - lifetime_activity
        - D
        - cp_services
        - cp_acceptance
      output: "item per reference flow"
      source_ids: []
    - id: service_normalize
      applies_to: "hired_support_service"
      rule: "Genuine complete contract-event count × evidenced current-job share / D; hourly rental is not a counted event, and actual hours await Duration support and scope review."
      inputs:
        - complete_events
        - actual_share
        - D
        - cp_services
        - cp_acceptance
      output: "item per reference flow"
      source_ids: []
    - id: energy_normalize
      applies_to: "installation_electricity"
      rule: "Divide actual metered kWh after evidenced other-user attribution by D; reconcile provider inclusions and charging boundary. No mass conversion."
      inputs:
        - meter_kWh
        - actual_share
        - D
        - cp_energy
        - cp_acceptance
      output: "kWh per reference flow"
      source_ids: []
    - id: water_normalize
      applies_to: "supplied_test_flush_water; dispatched_wastewater; water_to_air"
      rule: "Divide each separately measured water-stream kg by D; volume times evidenced temperature-density applies only to the matching stream. Reuse is not new fresh input; evaporation needs independent evidence."
      inputs:
        - stream_volume
        - stream_density
        - actual_mass
        - D
        - cp_water
        - cp_acceptance
      output: "kg per reference flow"
      source_ids: []
    - id: residual_normalize
      applies_to: "dry_material_waste; rejected_component_waste; contaminated_solid_waste"
      rule: "Divide actual net dispatched kg for each classification/state/receiver by D; removed pieces retain original issue and failure-event links."
      inputs:
        - gross
        - tare
        - actual_stream
        - D
        - cp_residuals
        - cp_acceptance
      output: "kg per reference flow"
      source_ids: []
    - id: emission_normalize
      applies_to: "airborne_particulate; aqueous_release_constituent"
      rule: "Divide measured kg per substance/fraction/compartment, or matching independent factor times measured activity, by D. Aqueous species may use measured volume times its concentration with compatible unit conversion; no residual-derived emissions."
      inputs:
        - actual_substance_mass
        - measured_activity
        - matched_factor
        - D
        - cp_residuals
        - cp_water
        - cp_acceptance
      output: "kg per reference flow"
      source_ids: []
    - id: reference_output
      applies_to: "accepted_installation"
      rule: "Normalize recorded accepted output D m by the numerical accepted length D to give 1 m; only final unique accepted physical tube pieces determine D."
      inputs:
        - D
        - cp_acceptance
      output: "1 m"
      source_ids: []
    - id: nominal_pipe_factor
      applies_to: "pex_tube"
      rule: "Only for matching RWC SKU/size, source lb/ft × 0.45359237 / 0.3048 gives kg/m; 1/2, 3/4, 1 in respectively yield 0.08036085, 0.15328089, 0.25298787. Nominal point factors are not gross issue/accepted-m intervals."
      inputs:
        - matching_SKU
        - source_factor
        - actual_length
      output: "conditional kg estimate"
      source_ids:
        - rwc-piping-2024
    - id: fill_geometry_diagnostic
      applies_to: "supplied_test_flush_water"
      rule: "For matching SKU/size only, 0.009, 0.018, 0.030 source gal/ft diagnose one geometric fill. Source does not explicitly state US: confirm the US-liquid-gallon convention before using 3.785411784 L/gal and 0.3048 m/ft; actual supplier unit records take priority. This is neither fresh-water demand nor default wastewater."
      inputs:
        - matching_SKU
        - actual_length
        - confirmed_volume_convention
      output: "one-fill diagnostic"
      source_ids:
        - rwc-piping-2024
  data_quality_requirements:
    - id: same_job_basis
      applies_to: "all inventory rows"
      requirement: "Every protocol uses the same job, period, positive D and accepted configuration. Preserve original numerator, conversion factor and unit. Mark unknown occurrence unknown; allow zero only with complete coverage."
      evidence: "Six-protocol row trace"
    - id: source_applicability
      applies_to: "all inventory rows"
      requirement: "Retain actual manufacturer/SKU, revision, quality conditions, instrument calibration and measurement error. Reconcile manufacturer gauge/hydraulic/compatibility requirements with project specification; waiting/contact duration is not a Duration input."
      evidence: "Supplier originals and project acceptance records"
    - id: phase_and_asset_completeness
      applies_to: "owned_equipment_attribution; hired_support_service"
      requirement: "Record all consuming nodes, jobs and periods per asset/service; manufacture, use, maintenance/replacement and retirement/termination events share one index. Unknown lifetime-activity denominator, remaining life or maintenance ownership prevents finalized attribution."
      evidence: "cp_services all-consumer and lifecycle register"
    - id: range_incoming_packaging
      applies_to: "incoming_packaging"
      requirement: "Range evidence need: Shipment weights, composition, pack sizes and documented reuse/return cycles are needed, together with the supplier dataset boundary. Packaging waste cannot prove an otherwise unrecorded incoming quantity; no universal kg/m interval is established."
      evidence: "cp_materials"
    - id: range_owned_equipment_attribution
      applies_to: "owned_equipment_attribution"
      requirement: "Range evidence need: Collect manufacture/BOM or matching dataset, maintenance, replacement and retirement/termination records, all consuming jobs and periods, job activity and lifetime denominator uncertainty. A whole tool per job, assumed lifetime, fixed reuse count or generic cutoff cannot establish an interval."
      evidence: "cp_services"
    - id: range_pex_tube
      applies_to: "pex_tube"
      requirement: "Range evidence need: RWC PDF 44 gives nominal 0.054, 0.103 and 0.170 lb/ft for 1/2, 3/4 and 1 in respectively. Matching SKU, supplier tolerance, routing, insertion, cuts, offcuts and rework are required before these factors can support consumption evidence; they are not observed kg per accepted m ranges."
      evidence: "cp_materials"
    - id: range_barbed_fittings
      applies_to: "barbed_fittings"
      requirement: "Range evidence need: Collect topology-specific fittings/valves/manifolds, accepted and replaced counts, SKU kg/item and returns. Comparable branch and terminal configurations are required for a kg/m interval."
      evidence: "cp_materials"
    - id: range_copper_crimp_rings
      applies_to: "copper_crimp_rings"
      requirement: "Range evidence need: The number of successfully crimped tube ends constrains retained rings; actual rejected/replaced events and ring mass are still needed. It supplies neither a universal rings/m ratio nor a mass tolerance interval."
      evidence: "cp_materials"
    - id: range_support_and_protection
      applies_to: "support_and_protection"
      requirement: "Range evidence need: Actual spacing, terminal constraints, stud/slab penetration locations, fixing SKU and installed/returned mass are required. A support-spacing limit is a geometry condition, not a universal consumption interval."
      evidence: "cp_materials"
    - id: range_compatible_seal_material
      applies_to: "compatible_seal_material"
      requirement: "Range evidence need: Actual penetration count/annulus geometry, formulation, applied volume/density and container reconciliation are needed. There is no generic sealant kg/m prior."
      evidence: "cp_materials"
    - id: range_supplied_test_flush_water
      applies_to: "supplied_test_flush_water"
      requirement: "Range evidence need: RWC PDF 44 capacities 0.009, 0.018 and 0.030 source gal/ft for 1/2, 3/4 and 1 in diagnose one fill. The US-liquid-gallon interpretation is a declared convention requiring confirmation. Sections, retests, recoveries, retention and flushing endpoints determine actual use; capacity is not a consumption interval."
      evidence: "cp_water"
    - id: range_disinfection_product
      applies_to: "disinfection_product"
      requirement: "Range evidence need: Actual dose volume, formulation active fraction, batch concentration, contact conditions and residual/disposal records are needed. A prescribed concentration or contact time is not a formulation kg/m interval."
      evidence: "cp_water"
    - id: range_cleaning_consumables
      applies_to: "cleaning_consumables"
      requirement: "Range evidence need: Collect cleaned object/area or tested-joint count, events, SKU doses and container weights. Comparable dose/event and event/m observations are needed; no blanket mass interval is justified."
      evidence: "cp_materials"
    - id: range_installation_electricity
      applies_to: "installation_electricity"
      requirement: "Range evidence need: Energy/kWh support remains unresolved. Comparable metered events with standby/charging ownership, all users and accepted-output shares are needed for a kWh/m interval; a pipe mass factor or NCV identity cannot provide it."
      evidence: "cp_energy"
    - id: range_hired_support_service
      applies_to: "hired_support_service"
      requirement: "Range evidence need: Collect actual contract reference unit, event completeness or true hourly basis, configuration/capacity, provider manufacture/maintenance/fuel/electricity inclusions and all users. True hourly Duration is unresolved; no universal event/m interval is established."
      evidence: "cp_services"
    - id: range_unused_product_return
      applies_to: "unused_product_return"
      requirement: "Range evidence need: Actual gross issues, stock changes and measured usable returns are needed per SKU. Neither a default return fraction nor a mixed-material return identity is justified."
      evidence: "cp_materials"
    - id: range_dry_material_waste
      applies_to: "dry_material_waste"
      requirement: "Range evidence need: Need weighed dispatches and material/state-specific recipient evidence. Nominal installed component mass does not establish a waste-rate interval."
      evidence: "cp_residuals"
    - id: range_rejected_component_waste
      applies_to: "rejected_component_waste"
      requirement: "Range evidence need: Need complete failure, removal, rework and dispatch coverage with classified actual receiver. No default defect fraction; an evidenced zero requires complete event coverage."
      evidence: "cp_residuals"
    - id: range_contaminated_solid_waste
      applies_to: "contaminated_solid_waste"
      requirement: "Range evidence need: Need formulation-specific residues, container tare and receiver classification. No default loss fraction or assumption that all supplied chemical evaporates is supported."
      evidence: "cp_residuals"
    - id: range_airborne_particulate
      applies_to: "airborne_particulate"
      requirement: "Range evidence need: Need material/tool/control/size-specific monitoring or factor and measured activity. An unclosed material balance is a data gap, not invisible dust or a generic emission quantity."
      evidence: "cp_residuals"
    - id: range_dispatched_wastewater
      applies_to: "dispatched_wastewater"
      requirement: "Range evidence need: Need actual collection/dispatch measurements, composition, reuse and retention evidence. Fresh supply and geometric fill capacity do not establish outgoing wastewater or its interval."
      evidence: "cp_water"
    - id: range_water_to_air
      applies_to: "water_to_air"
      requirement: "Range evidence need: Need actual-condition evaporation measurement/model evidence. No evaporation fraction is established; it must not duplicate a chemical solvent loss."
      evidence: "cp_water"
    - id: range_aqueous_release_constituent
      applies_to: "aqueous_release_constituent"
      requirement: "Range evidence need: Need recipient compartment, actual carrier/constituent identities and concentration/flow evidence. Residual chlorine cannot be inferred from disinfectant issues; mixed wastewater is not an elementary pure-water identity."
      evidence: "cp_water"
    - id: range_accepted_installation
      applies_to: "accepted_installation"
      requirement: "Range evidence need: The normalized output is exactly one reference metre, not an empirical yield range. Accepted denominator evidence and excluded/held/rejected-work traceability remain required; retain configuration distinctions."
      evidence: "cp_acceptance"
validation_rules:
  - rule_id: scope_and_gate
    applies_to: "install_accept"
    rule: "Verify actual PEX-B potable-water hot/cold scope, copper-crimp/barb route and declared interfaces. Acceptance must trace inspections, applicable hydraulic test/flush and all corrections; an assumed test result or another joining route is not accepted evidence."
    source_ids:
      - sharkbite-pex-2021
      - rwc-piping-2024
  - rule_id: denominator_integrity
    applies_to: "accepted_installation"
    rule: "Require positive D from unique final accepted physical tube pieces; include insertion and actual curved/slack length, exclude fitting bodies and removed/held/rejected/stock pieces. Reconcile hot/cold and rework ID lineage; test overlaps and repeat visits add no reference output."
    source_ids: []
  - rule_id: identity_and_units
    applies_to: "all inventory rows"
    rule: "Expand conditional cards to exact actual material/SKU/state/recipient exchanges and verify each UUID/support chain before downstream publication. Unresolved occurrence stays unknown. Preserve Energy/kWh and true hourly Duration gaps; do not substitute NCV or a counted event."
    source_ids: []
  - rule_id: balance_and_fate
    applies_to: "install_accept"
    rule: "Check input, return, stock, retained material and each actual residual within compatible pools. Water partitions must distinguish external supply, reuse, retention, wastewater, evidenced evaporation and direct carrier/constituents. No duplicated destination or residual-derived emission; declare unclosed amounts and uncertainty."
    source_ids: []
  - rule_id: assets_and_periods
    applies_to: "owned_equipment_attribution; hired_support_service"
    rule: "Verify exact ownership, all consumers and relevant manufacture/use/maintenance/replacement/retirement periods, consistent causal lifetime denominator and actual service contract. Reconcile period shares and duplicate provider/foreground inclusions. Unknown replacement or termination prevents finalized attribution."
    source_ids: []
  - rule_id: evidence_quality
    applies_to: "all inventory rows"
    rule: "Require complete six-protocol records, source applicability and individual range evidence needs below. Nominal point factors and quality conditions are not observed service-normalized intervals. A zero needs covered records; a missing record is not zero."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground-measured installation-to-acceptance service data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "One metre of copper-crimp PEX-B potable-water installation with declared configuration/interfaces/gate, and downstream process/lifecyclemodel projections"
  excluded_use: "Clamp, expansion, push-fit and other material/joining routes; whole-building systems; fixtures/heaters/civil mains; pipe operating lifetime; final publication with unresolved identities"
  required_metadata: "Location/job/period, SKU/sizes/hot-cold/branch BOM, final piece IDs and D method, interfaces, test/correction/acceptance, supply/packaging/asset/service boundaries, six protocols and source revisions"
  required_quality_disclosure: "Identity and Energy/Duration support gaps, per-card range evidence needs, metering/causal attribution uncertainty, unclosed quantities, lifetime/maintenance/termination evidence and uncovered responsibilities"
  update_trigger: "Changes in route/material/SKU, interfaces, acceptance specification, supply boundary, asset/contract, measurement or source evidence"
data_sources:
  - id: "sharkbite-pex-2021"
    type: "handbook"
    reference: "https://www.sharkbite.com/sites/default/files/files/sharkbite-pex-install-guide-2021-02.pdf"
    used_for: "PDF p5 copper crimp/go-no-go and restrictions; p6 supports. Route, compatibility, damaged-component and support responsibility; thermal expansion example is not a consumption factor."
  - id: "rwc-piping-2024"
    type: "handbook"
    reference: "https://www.sharkbite.com/sites/default/files/files/RWC-Piping-Systems-Install-Guide-2024.pdf"
    used_for: "PDF p18 crimp; p44 dimensions/nominal mass/capacity; p46 conditional disinfection; p47 water testing. Route and conditional point factors; confirm source-gal convention and do not import other-route tests."
  - id: "accepted-length-normalization"
    type: "method_factor"
    reference: "This PCR sections 3 and 8: accepted-length normalization identity and cp_acceptance measurement"
    used_for: "Local mathematical method: divide each recorded job quantity by the positive numerical accepted length D measured in m; normalized output is 1 m. No external empirical factor or range is claimed."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:e532d302629c84234bcbc26ec3868e1b60dd37f6d6099b0645efa6c51800a458"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5772"
      family: "system_boundary"
      span:
        start:
          offset: 5772
          line: 59
          column: 1
        end:
          offset: 27662
          line: 327
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Ready accessible internal building route, agreed supply and terminal interfaces, component supply at installer custody boundary |\n| starting_condition_role | Declared foreground starting condition, neither installation-service input nor a credit for excluded existing work |\n| product_classification_scope | Narrow copper-crimp PEX-B potable-water installation scope within CPC 3.0 54621 |\n| recursive_input_rule | If same-category installation is actually purchased, declare supplier responsibility and handover boundary; never recurse the same job as its own input. New independent responsibility requires scope review. |\n| upstream_dataset_requirement | Matching landed material, formulation and service supply with explicit inclusions and delivery/packaging ownership; retain gaps for uncovered portions. |\n| disclosure | Start/end interfaces, readiness, excluded works, job periods, upstream/packaging boundaries, asset/rental responsibility, unclosed quantities and identity/range gaps |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| installation_owner | install_accept | One installer responsibility covers receipt/withdrawal, layout, cutting and preparation, copper-ring crimp assembly, support/protection, hydraulic tests and corrections, acceptance, usable returns and residual dispatch. Phase journals are not extra service exchanges or process nodes. | `sharkbite-pex-2021`; `rwc-piping-2024` |\n| accepted_gate | accepted_installation | Handover requires compatible approved tube/fittings/rings, actual support and penetration protection, inspected crimp joints with go/no-go results, recorded applicable hydraulic test and completed correction/flush requirements. Record project specification, actual pressure, temperature, duration and result; do not import air-testing or push-fit/expansion procedures. | `sharkbite-pex-2021`; `rwc-piping-2024` |\n| starting_interfaces | foreground_boundary | Begin at a declared accessible internal building route with agreed supply and terminal interfaces and component supply at the installer custody boundary. Readiness is a condition, not consumed work. Fixtures, heaters, civil mains, structural works, specialist firestop/insulation and later use/maintenance of the installed pipe are excluded and disclosed. |  |\n| landed_supply | upstream_inputs | Require matching landed component and formulation supply datasets with delivery and packaging boundary disclosed. Do not hide freight as zero or add packaging manufacture already embedded upstream. A separately responsible freight or different installation subcontract needs scope/card review before extension. |  |\n| reject_owner | rework_and_exits | install_accept retains all original material, electricity, water and service burdens through failures and corrections. Link internal correction to the failed joint/piece and resulting final accepted pieces; distinguish usable returns from nonusable waste. Recovery/downgrade is recorded only with its actual receiver and does not create an assumed credit. | `sharkbite-pex-2021` |\n| resource_periods | shared_assets | Index asset manufacture, service use, actual maintenance/replacement and retirement/termination with every consuming job/node and reporting period. The current installer job is one consumer among the asset lifetime users; permanent installed hardware is separate. Rented provider asset burdens belong to the contracted service boundary. |  |\n| physical_pools | material_and_water | Close compatible SKU/material/state pools using gross entries, stock changes, usable returns, retained installed material and measured residual exits. Keep water-carrier balance separate from chemical constituents and any carbon check; neither a mixed mass sum nor an asset share is an installed-material exchange. Do not create oxygen or any inferred loss exchange from a closure residual. |  |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Incoming packaging by material and supply owner (`incoming_packaging`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nRecord the actual package material and shipment at receipt. Weigh it or reconcile pack counts to same-batch tare records. Maintain its physical source pool even when component supply already includes packaging manufacture. Activate a separate packaging input burden only for a genuinely separately modelled supply; trace returns, reuse, stock and discarded packaging to that pool. Range evidence need: Shipment weights, composition, pack sizes and documented reuse/return cycles are needed, together with the supplier dataset boundary. Packaging waste cannot prove an otherwise unrecorded incoming quantity; no universal kg/m interval is established.\n\n- Collection subject: Incoming packaging by material and supply owner\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_materials divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources:\n\n#### Collection requirement: Attributed share of each owned reusable asset (`owned_equipment_attribution`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nFor each actual cutter, crimp tool, go/no-go gauge, drill, charger, hydraulic pump, meter or access asset, identify model/serial and ownership. Attribute its manufacture and actual maintenance/replacement resource packet using measured job activity divided by evidenced lifetime activity on the same basis. Multiply by actual asset count, then divide by D. This fractional item quantity is an asset share, not installed material or an hourly rental. Range evidence need: Collect manufacture/BOM or matching dataset, maintenance, replacement and retirement/termination records, all consuming jobs and periods, job activity and lifetime denominator uncertainty. A whole tool per job, assumed lifetime, fixed reuse count or generic cutoff cannot establish an interval.\n\n- Collection subject: Attributed share of each owned reusable asset\n- Flow property / unit: Number of items / item\n- Amount rule: Measured item numerator for each actual exchange under cp_services divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_services`\n- Sources: `sharkbite-pex-2021`; `rwc-piping-2024`\n\n#### Collection requirement: Approved barbed fittings and interface components by SKU (`barbed_fittings`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nRecord the actual approved fitting, valve or manifold material/size/SKU and its branch or terminal duty. Weigh issues or use exact SKU count-to-mass evidence; preserve replacements and usable returns. Fitting and valve bodies belong to the BOM and do not contribute length to D. Range evidence need: Collect topology-specific fittings/valves/manifolds, accepted and replaced counts, SKU kg/item and returns. Comparable branch and terminal configurations are required for a kg/m interval.\n\n- Collection subject: Approved barbed fittings and interface components by SKU\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_materials divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources: `sharkbite-pex-2021`\n\n#### Collection requirement: Supports, fasteners and protective sleeves by SKU (`support_and_protection`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nMeasure each actual support, fixing and sleeve separately by mass or evidenced count-to-mass conversion. Link it to the accepted tube geometry and penetration. Approved supports must protect the tube and accommodate the specified route; their material is distinct from reusable access equipment. Range evidence need: Actual spacing, terminal constraints, stud/slab penetration locations, fixing SKU and installed/returned mass are required. A support-spacing limit is a geometry condition, not a universal consumption interval.\n\n- Collection subject: Supports, fasteners and protective sleeves by SKU\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_materials divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources: `sharkbite-pex-2021`\n\n#### Collection requirement: Actual cleaning or leak-location consumable by SKU (`cleaning_consumables`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nActivate only for consumed soap, wipe or other compatible cleaning product. Record exact SKU, intended cleaning/leak-location event, issued contents, usable returns and container/residual tare. Material used in corrections remains attributable to installation. Range evidence need: Collect cleaned object/area or tested-joint count, events, SKU doses and container weights. Comparable dose/event and event/m observations are needed; no blanket mass interval is justified.\n\n- Collection subject: Actual cleaning or leak-location consumable by SKU\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_materials divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources: `rwc-piping-2024`\n\n#### Collection requirement: Complete contracted support event by provider and configuration (`hired_support_service`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nActivate the item card only for a genuinely complete contract-defined equipment/access service event. Record provider, event definition, delivered configuration, completion and actual consumer shares. An hourly rental keeps its actual hourly quantity and requires explicit Duration support and scope/measurement review; it is not converted into one counted event. Range evidence need: Collect actual contract reference unit, event completeness or true hourly basis, configuration/capacity, provider manufacture/maintenance/fuel/electricity inclusions and all users. True hourly Duration is unresolved; no universal event/m interval is established.\n\n- Collection subject: Complete contracted support event by provider and configuration\n- Flow property / unit: Number of items / item\n- Amount rule: Measured item numerator for each actual exchange under cp_services divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_services`\n- Sources:\n\n#### Collection requirement: Usable unchanged product returned by SKU (`unused_product_return`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `product`.\n\nRecord an actual custody-boundary return of usable unchanged product with original incoming SKU and state. Weigh or use the same verified count/length mass conversion. Keep gross input and explicit return auditable, avoiding a second deduction of a return already netted elsewhere. Range evidence need: Actual gross issues, stock changes and measured usable returns are needed per SKU. Neither a default return fraction nor a mixed-material return identity is justified.\n\n- Collection subject: Usable unchanged product returned by SKU\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_materials divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources:\n\n#### Collection requirement: Dry packaging and offcut waste by material and recipient (`dry_material_waste`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `waste`.\n\nWeigh each dry stream with container tare at actual dispatch. Link packaging to its incoming source pool and offcuts to issued tube/component records. Identify material, state and receiver separately; captured drilling dust is waste when actually collected. A mixed mass total is only a ledger diagnostic. Range evidence need: Need weighed dispatches and material/state-specific recipient evidence. Nominal installed component mass does not establish a waste-rate interval.\n\n- Collection subject: Dry packaging and offcut waste by material and recipient\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_residuals divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_residuals`\n- Sources:\n\n#### Collection requirement: Nonusable rejected or removed component by recipient (`rejected_component_waste`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `waste`.\n\nLink failed gauge checks, damaged pieces or failed test/correction events to the original issued component and install_accept. Weigh removed nonusable tube, fittings and rings, or use exact SKU count/mass evidence, and record actual waste destination. Retired piece IDs cannot remain in accepted D. Range evidence need: Need complete failure, removal, rework and dispatch coverage with classified actual receiver. No default defect fraction; an evidenced zero requires complete event coverage.\n\n- Collection subject: Nonusable rejected or removed component by recipient\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_residuals divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_residuals`\n- Sources:\n\n#### Collection requirement: Contaminated wipes, containers and formulation residues (`contaminated_solid_waste`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `waste`.\n\nWeigh actual contaminated stream gross and tare; retain composition, state and receiver acceptance. Distinguish reusable returned product and empty recyclable packaging. Supplied formulation mass does not establish evaporated mass, and a contaminated container is not automatically a dry packaging stream. Range evidence need: Need formulation-specific residues, container tare and receiver classification. No default loss fraction or assumption that all supplied chemical evaporates is supported.\n\n- Collection subject: Contaminated wipes, containers and formulation residues\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_residuals divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_residuals`\n- Sources:\n\n#### Collection requirement: Used water at sewer or waste-treatment handover (`dispatched_wastewater`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `waste`.\n\nMeasure each used-water outgoing stream by collected mass or volume with tare, density/temperature and composition. Link unique stream and receiver to reused and retained inventories. The same water cannot be both a treatment/sewer handover and a direct environmental discharge. Range evidence need: Need actual collection/dispatch measurements, composition, reuse and retention evidence. Fresh supply and geometric fill capacity do not establish outgoing wastewater or its interval.\n\n- Collection subject: Used water at sewer or waste-treatment handover\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_water divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_water`\n- Sources:\n\n#### Collection requirement: Material-specific airborne particulate fraction (`airborne_particulate`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `elementary`.\n\nActivate only with evidence of atmospheric release. Identify substrate/material, tool, capture controls, particle-size fraction and actual receiving air compartment. Quantify monitored release or a matching independently supported factor times actual activity; collected dust remains waste. Range evidence need: Need material/tool/control/size-specific monitoring or factor and measured activity. An unclosed material balance is a data gap, not invisible dust or a generic emission quantity.\n\n- Collection subject: Material-specific airborne particulate fraction\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_residuals divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_residuals`\n- Sources:\n\n#### Collection requirement: Actual water-vapour release to the receiving air compartment (`water_to_air`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `elementary`.\n\nActivate only for independently evidenced water evaporation. Use measured exposure/mass loss or a verified model matched to the installation conditions, and identify the actual air compartment. Exclude chemical vapours, retained water and captured liquids; water-balance residual alone is not an emission. Range evidence need: Need actual-condition evaporation measurement/model evidence. No evaporation fraction is established; it must not duplicate a chemical solvent loss.\n\n- Collection subject: Actual water-vapour release to the receiving air compartment\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_water divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_water`\n- Sources:\n\n#### Collection requirement: Direct aqueous release of each actual substance (`aqueous_release_constituent`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `elementary`.\n\nActivate only for evidenced authorized discharge directly to a specified environmental water compartment. Measure discharged volume and substance-specific concentration/mass for each constituent; identify carrier water separately. Pollutant/active mass is not a second physical bulk-water stream. Sewer/waste-treatment handover is excluded for that discharge. Range evidence need: Need recipient compartment, actual carrier/constituent identities and concentration/flow evidence. Residual chlorine cannot be inferred from disinfectant issues; mixed wastewater is not an elementary pure-water identity.\n\n- Collection subject: Direct aqueous release of each actual substance\n- Flow property / unit: Mass / kg\n- Amount rule: Measured kg numerator for each actual exchange under cp_water divided by D.\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_water`\n- Sources:\n\n"
