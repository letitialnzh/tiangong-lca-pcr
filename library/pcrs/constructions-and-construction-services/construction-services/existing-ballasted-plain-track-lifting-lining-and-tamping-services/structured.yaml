boundary_abstraction:
  declared_starting_condition: "Existing qualified retained plain track with known rail, sleeper and ballast state; actual possession/protection and approved geometry available"
  starting_condition_role: "Host asset and retained stock, not purchased new track or ballast input"
  product_classification_scope: "Only retained plain-track geometry-correction maintenance within CPC 3.0 54212"
  recursive_input_rule: "An external same-category subcontract is a separately bounded purchased input with owner, treated intervals and upstream scope; exclude its duplicate direct resources; no self-recursive final service"
  upstream_dataset_requirement: "Verified actual material/energy/transport/provider datasets at declared gates; disclose included packaging, direct operation, maintenance, tooling and capital"
  disclosure: "Campaign/window/period IDs; retained host baseline; supplied and returned lots; failures/rework; stability and protection ownership; full asset life and inventory carry-over; missing evidence"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted lifting, lining and tamping service on existing ballasted plain track"
    uuid: ""
  flow_property_ref:
    uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
  unit_group_ref:
    uuid: "838aaa22-0117-11db-92e3-0800200c9a66"
  reference_unit: "m"
  required_qualifiers:
    - "Track ID and accepted chainages"
    - gauge
    - "retained rail/sleeper/ballast condition"
    - "approved target geometry and tolerances/source"
    - "machine/tamping technology"
    - "possession windows"
    - "actual stability method"
    - "postwork test coverage"
    - "handback authority/date"
    - "residual restrictions and closure responsibility"
reference_flows:
  []
measurement_rules:
  - id: accepted_length
    applies_to: "reference product"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "Measure accepted centreline chainage intervals using cp_acceptance; reconcile calibrated survey units, track ID and handback signature. One reference output is 1 m."
  - id: gross_net_tare
    applies_to: "material inputs and custody outputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Remove vehicle/container tare from gross weighing; receipts are gross supplied material before outward return netting. Keep moisture basis and actual lot identity."
  - id: energy_units
    applies_to: "fuel_gross; electricity"
    required_property_ref:
      name: "Mass; Energy"
      uuid: ""
    required_unit: "kg; kWh"
    rule: "Record actual fuel variant and net material mass, not engine nameplate power. Electricity uses metered imported kWh; any conversion needs a traceable actual unit factor and property chain."
  - id: geometry_units
    applies_to: "cp_acceptance"
    required_property_ref:
      name: "Length; Duration"
      uuid: ""
    required_unit: "mm; m; s"
    rule: "Record actual gauge/level/alignment/lift, spatial base length, temperatures in degC and work duration in s with instrument and adopted tolerance source; no universal settings."
  - id: transport_units
    applies_to: "mobilisation_transport"
    required_property_ref:
      name: "mass*distance"
      uuid: ""
    required_unit: "kg*km"
    rule: "Use actual cargo kg and loaded km by leg; compatible t*km requires the verified listed factor 1000. Empty returns belong in the provider boundary or explicit vehicle activity, never invented cargo."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
