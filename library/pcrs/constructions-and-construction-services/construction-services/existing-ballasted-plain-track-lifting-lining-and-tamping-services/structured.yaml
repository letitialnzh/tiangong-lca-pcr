allocation_rules:
  - rule_id: campaign_share
    applies_to: "all inventory rows"
    rule: "Assign directly attributable quantities to the campaign, then divide campaign totals by measured accepted L. Allocate shared mobilisation/idle/protection by evidenced causal activity across every receiving job/window, with shares summing to one. Document driver and sensitivity rather than assume length describes every shared event."
    source_ids: []
  - rule_id: rework_retention
    applies_to: "track_geometry_correction"
    rule: "Retain failed tests, repeated tamping, additional stability, remedy and cleanup burdens in the producing campaign. Unaccepted intervals have no accepted output; disclose their burden destination rather than silently excluding them. No separate output for each pass."
    source_ids: []
  - rule_id: asset_life_share
    applies_to: "shared_asset_service"
    rule: "For each asset, calculate its complete-life attributable service fraction from observed history plus justified prospective remaining service/replacement/termination/EOL when in service. Enumerate all consuming jobs/nodes/periods; use evidenced comparable activity units, sum fractions to one, label forecasts, test sensitivity and update. Missing life coverage or denominator blocks finalisation."
    source_ids: []
  - rule_id: period_stock
    applies_to: "material flows; shared_asset_service"
    rule: "Assign receipt/use/return/replacement/EOL events to explicit periods and prevent carry-over stock or asset coverage from receiving a second charge. For fuel and other materials, bridge gross boundary exchanges to burden attribution with inherited opening-stock burden actually used and closing-stock burden carried forward, each linked to its source period and recorded once. Neither stock balance is a fictitious outward product flow. Actual return value or waste recovery is not an automatic avoided-product credit; disclose the chosen actual burden handoff."
    source_ids: []
  - rule_id: provider_partition
    applies_to: "stability_service; protection_service; mobilisation_transport; shared_asset_service"
    rule: "Retain one owner for each service and its included direct fuel, emissions, tooling, maintenance and capital. Split contracted scope or direct inventory at documented interfaces. Returned material, recovered waste and the maintenance service are not assumed joint sale co-products."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "track_geometry_correction"
      flow_role: "Accepted length and pre/post geometry/stability/handback"
      record_type: "survey and acceptance record"
      raw_fields: "campaign_id; window_id; period_id; track_id; chainage_start_m; chainage_end_m; accepted_flag; gauge_mm; level_mm; alignment_mm; geometry_base_m; target_geometry; actual_lift_mm; tamping_depth_mm; squeezing_duration_s; vibration_frequency_Hz; hydraulic_pressure_Pa; actual_pass_count; machine_setting_source; ballast_condition; support_profile; stability_method; actual_temperature_degC; geometry_tolerance_mm; temperature_limits_degC; tolerance_source; instrument_id; calibration; pretest_id; posttest_id; defect_id; repeat_pass_id; handback_authority; handback_time_utc; restrictions; closure_owner"
      collection_method: "Measure pre/post geometry with calibrated actual system and adopted spatial bases/tolerances; retain actual tamping depth, squeeze duration, vibration frequency, hydraulic pressure and pass counts with their machine instruction/approved setting source and units, without a universal value; retain approved work/possession and target source. Map distinct accepted intervals, remove overlap, record actual stability evidence/defect closure and signed restricted or unrestricted handback. L is union accepted centreline metres by track, not pass distance."
      unit: "m; mm; degC; s; Hz; Pa"
      frequency: "Every treated interval, failed test, repeat and handback"
      temporal_coverage: "All campaign windows, setup/repeats/cleanup and linked source periods"
      site_scope: "Identified track intervals and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable calibrated survey, target/tolerance adoption and signed authority; zero or unresolved L blocks dataset"
    - protocol_id: cp_materials
      process_id: "track_geometry_correction"
      flow_role: "Material supply/stock/return/waste and water"
      record_type: "weighing, issues and custody ledger"
      raw_fields: "campaign_id; window_id; period_id; event_id; transfer_id; lot_id; material_identity; part_id; supplier_gate; owner; opening_stock_kg; scale_gross_kg; vehicle_container_tare_kg; gross_receipt_kg; issue_kg; incorporation_or_use_kg; return_kg; waste_kg; released_species_kg; closing_stock_kg; moisture_basis; dry_solids_kg; water_kg; measured_volume_m3; density_kg_per_m3; temperature_degC; weather_water_kg; source_medium; destination; treatment_route; included_upstream_scope"
      collection_method: "Weigh gross less vehicle/container tare; do not net returns. Preserve exact lots, moisture and stock burden history. Pair outward custody with transfer IDs and receiver. Expand each distinct material/part/waste, track host ballast separately, calibrate water meters and document any actual density conversion. Reconcile material-specific opening plus receipts to use/incorporation, returns, waste, evidenced releases and closing stock; flag residual."
      unit: "kg; m3; kg/m3; degC"
      frequency: "Each receipt/issue/return/replacement/waste and period closing stock"
      temporal_coverage: "All campaign windows, setup/repeats/cleanup and linked source periods"
      site_scope: "Identified track intervals and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/meter certificates, supplier documents and signed custody; retained stock not output; no unexplained residual emission"
    - protocol_id: cp_energy
      process_id: "track_geometry_correction"
      flow_role: "Fuel/electricity, burns and returns"
      record_type: "tank and meter records"
      raw_fields: "campaign_id; window_id; period_id; event_id; machine_id; fuel_identity; engine_technology; load_mode; operating_duration_s; idle_duration_s; initial_tank_kg; volume_m3; density_kg_per_m3; temperature_degC; fuel_gross_kg; fuel_return_kg; recovered_fuel_waste_kg; uncontained_fuel_kg; final_tank_kg; meter_start_kWh; meter_end_kWh; charging_losses_kWh; opening_stock_burden; opening_stock_used_kg; closing_stock_carried_burden; stock_burden_source; supplier_scope; uncertainty"
      collection_method: "Record actual fuel supplied and tanks in net mass with meter/temperature/density conversion evidence when native volume is used; assign complete activity and idle windows to jobs. Gross physical supplied fuel remains the boundary input; separately document opening_stock_used_kg and its inherited material burden and closing_stock_carried_burden, with source-period linkage. Use total opening/closing tank quantities only once in burn_balance. Do not add a second opening-draw physical exchange or deduct closing stock twice; reconcile the stock-burden bridge with actual consumed/returned/waste/released outlets and carried-forward material burden. Derive burn from mutually exclusive outlets, not nameplate power. Meter electricity imports and actual charging scope; provider-inclusive operation is excluded."
      unit: "kg; m3; kg/m3; degC; kWh; s"
      frequency: "Each tank/meter event and operating window"
      temporal_coverage: "All campaign windows, setup/repeats/cleanup and linked source periods"
      site_scope: "Identified track intervals and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated tank/meter, receipts and machine log; fuel balance reconciled with incident record; actual fuel/source verified"
    - protocol_id: cp_transport
      process_id: "track_geometry_correction"
      flow_role: "Mobilisation, delivery, returns and waste logistics"
      record_type: "leg and provider record"
      raw_fields: "campaign_id; window_id; period_id; leg_id; provider; mode; cargo_identity; cargo_kg; loaded_distance_km; origin; destination; empty_return_scope; service_unit; service_quantity; job_driver; all_job_drivers; included_fuel; included_maintenance; included_capital"
      collection_method: "Match actual cargo weights to real loaded legs and routes. Calculate cargo_kg * loaded_distance_km and allocate shared leg by evidenced driver across all jobs. Identify self-propelled machine/empty return with explicit provider vehicle activity boundary, not artificial cargo. Include outbound returns and waste transport exactly once, checking upstream gate."
      unit: "kg; km; kg*km"
      frequency: "Every actual mobilisation/delivery/return/waste leg"
      temporal_coverage: "All campaign windows, setup/repeats/cleanup and linked source periods"
      site_scope: "Identified track intervals and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Transport receipts/routes/weights; provider inclusion evidence; separate leg IDs prevent double attribution"
    - protocol_id: cp_services
      process_id: "track_geometry_correction"
      flow_role: "External protection and required stability completion"
      record_type: "contract and service delivery record"
      raw_fields: "campaign_id; window_id; period_id; service_id; provider; service_identity; service_unit; service_quantity; track_intervals; technology; pass_id; stability_approval_source; possession_id; scope_included; scope_excluded; fuel_owner; materials_owner; emissions_owner; capital_owner; acceptance_record"
      collection_method: "Read actual contract unit and service coverage, delivery/work logs and approved stability criteria. Define any counted service package; use actual provider unit when not an item. Link all prescribed stability/protection events to one owner. Subtract duplicate direct quantities only by documented scope partition; actual approval paperwork is not a measured physical service quantity."
      unit: "Actual provider unit; item only if defined"
      frequency: "Each provider service event and work window"
      temporal_coverage: "All campaign windows, setup/repeats/cleanup and linked source periods"
      site_scope: "Identified track intervals and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed delivery, adopted method, acceptance and full resource-owner matrix; missing required closure is blocker"
    - protocol_id: cp_assets
      process_id: "track_geometry_correction"
      flow_role: "Complete-life shared equipment attribution"
      record_type: "asset life and consumer activity ledger"
      raw_fields: "asset_id; campaign_id; window_id; period_id; consumer_job_id; consumer_node_id; activity_unit; campaign_activity; observed_life_activity; forecast_remaining_activity; manufacture_scope; maintenance_scope; replacement_event; termination_scenario; EOL_scope; source; forecast_label; excluded_direct_fuel_spares; provider_coverage; uncertainty; sensitivity; update_date"
      collection_method: "For each actual asset enumerate all consumers and reporting periods. Use observed complete life for retired assets; for in-service equipment justify remaining service, replacements, termination and EOL scenario with sources and sensitivity. Derive complete_life_activity = observed_life_activity + forecast_remaining_activity in comparable units, campaign fraction = campaign_activity / complete_life_activity. Allocate phase burdens consistently, remove separately recorded fuel/spares, sum all consumer fractions to one."
      unit: "Actual comparable activity unit; item-equivalent"
      frequency: "Each asset life review, replacement/termination and campaign assignment"
      temporal_coverage: "All campaign windows, setup/repeats/cleanup and linked source periods"
      site_scope: "Identified track intervals and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset register, history/forecast source, full consumer ledger and life-scope coverage; no unsupported life default"
    - protocol_id: cp_emissions
      process_id: "track_geometry_correction"
      flow_role: "Species exhaust/dust/water releases"
      record_type: "measurement or matched factor calculation"
      raw_fields: "campaign_id; window_id; period_id; event_id; species; receiving_medium; particle_fraction; fossil_biogenic_basis; activity_identity; activity_quantity; activity_unit; measured_release_kg; factor_kg_per_activity_unit; factor_source; engine_mode; ballast_moisture; capture_efficiency; water_input_kg; water_waste_kg; weather_water_kg; retained_host_water_kg; closing_water_kg; uncertainty"
      collection_method: "Prefer actual calibrated emissions/outlet measurement; otherwise retain applicable official/primary factor source, units, engine/fuel/load or ballast/moisture/control match and uncertainty. Expand exact species/media and size fractions individually. Link burned fuel to cp_energy and dust/water to actual handled material and capture/custody. No residual-as-emission assumption."
      unit: "kg; actual activity unit"
      frequency: "Each reported species/outlet and matching activity window"
      temporal_coverage: "All campaign windows, setup/repeats/cleanup and linked source periods"
      site_scope: "Identified track intervals and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Measured release or factor applicability record; captured waste and atmospheric species separated; factor/particle/medium gaps block final exchange"
    - protocol_id: cp_incidents
      process_id: "track_geometry_correction"
      flow_role: "Spill partition and recovery"
      record_type: "incident and cleanup custody record"
      raw_fields: "campaign_id; window_id; period_id; incident_id; fluid_identity; composition_source; total_spill_kg; recovered_fluid_kg; absorbent_input_kg; contaminated_solids_kg; retained_residue_kg; uncontained_fluid_kg; species; evidenced_actual_constituent_fraction; constituent_fraction_source; constituent_fraction_basis; uncontained_species_kg; receiving_medium; receiver; waste_transfer_id; uncertainty"
      collection_method: "Map each incident total to mutually exclusive recovered fluid waste, retained residue and uncontained_fluid_kg. Collect evidenced_actual_constituent_fraction, its source and mass basis separately to derive each actual species/medium release; a partial reported species sum is not the whole fluid mass. Record supplied absorbent separately and distinguish its mass from recovered fluid. Link recovered fuel component to fuel burn balance. Do not subtract total spill after subtracting its component outlets; unknown fate remains unresolved."
      unit: "kg; constituent mass fraction kg/kg"
      frequency: "Every actual spill/leak and cleanup transfer"
      temporal_coverage: "All campaign windows, setup/repeats/cleanup and linked source periods"
      site_scope: "Identified track intervals and attributable provider/asset scopes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Incident assessment, constituent evidence and waste manifest; no generic leak rate and no duplicated incident component"
  calculation_rules:
    - id: divide_campaign
      applies_to: "ballast_topup; fuel_gross; electricity; hydraulic_makeup; grease; tine_components; other_spares; supplied_water; water_withdrawal; packaging_supply; spill_absorbent; ballast_return; fuel_return; other_product_returns; ballast_solid_waste; removed_fluid_waste; wear_parts_waste; packaging_waste; recovered_spill_waste"
      rule: "For each distinct exchange, amount_per_m = attributable_campaign_amount / L; L = accepted unique centreline length in m from cp_acceptance. Receipt inputs precede return netting; stock burden transfer is documented separately."
      inputs:
        - "Actual campaign quantities"
        - cp_acceptance
        - cp_materials
        - cp_energy
        - cp_incidents
      output: "Actual exchange unit per 1 m reference service"
      source_ids: []
    - id: burn_balance
      applies_to: "fuel_gross; exhaust_species"
      rule: "burned_fuel_kg = initial_tank_kg + fuel_gross_kg - final_tank_kg - fuel_return_kg - recovered_fuel_waste_kg - uncontained_fuel_kg; every outlet is mutually exclusive. Retained incident residue is included in final attributable inventory or a separately recorded unburned outlet. No second total-spill subtraction."
      inputs:
        - cp_energy
        - cp_incidents
      output: "Burned actual fuel kg per campaign, separately from gross product input"
      source_ids: []
    - id: leg_activity
      applies_to: "mobilisation_transport"
      rule: "transport_per_m = sum(cargo_kg * loaded_distance_km * evidenced_job_share) / L; shares over all consuming jobs sum to 1; t*km to kg*km requires factor 1000. Empty returns or self-propelled equipment use evidenced provider vehicle boundary."
      inputs:
        - cp_transport
        - cp_acceptance
      output: "kg*km per 1 m reference service with full leg scope disclosed"
      source_ids: []
    - id: service_quantity
      applies_to: "protection_service; stability_service"
      rule: "service_per_m = actual_delivered_service_quantity * evidenced_campaign_share / L; service unit and scope must be defined, shares over all consuming jobs sum to 1."
      inputs:
        - cp_services
        - cp_acceptance
      output: "Actual provider-unit quantity per 1 m reference service"
      source_ids: []
    - id: complete_life_fraction
      applies_to: "shared_asset_service"
      rule: "asset_fraction_per_m = campaign_activity / (observed_life_activity + forecast_remaining_activity) / L; same activity unit for numerator and denominator; retired life has zero forecast_remaining_activity. Retain each asset fraction separately and full-life phase coverage; all consumers sum to 1 before final normalisation."
      inputs:
        - cp_assets
        - cp_acceptance
      output: "Item-equivalent of a specific complete-life asset service per 1 m"
      source_ids: []
    - id: species_release
      applies_to: "exhaust_species; dust_species; water_release"
      rule: "species_per_m = measured_release_kg / L, or actual_activity * applicable_factor_kg_per_activity_unit / L; use only one method per species/event and actual capture partition. No aggregation of different species or receiving media."
      inputs:
        - cp_emissions
        - cp_energy
        - cp_materials
        - cp_acceptance
      output: "kg of actual species/medium per 1 m"
      source_ids: []
    - id: incident_partition
      applies_to: "recovered_spill_waste; oil_release_species"
      rule: "For each incident, total_spill_kg = recovered_fluid_kg + retained_residue_kg + uncontained_fluid_kg; constituent_release_kg = uncontained_fluid_kg * evidenced_actual_constituent_fraction for its actual medium. Waste quantity includes separately measured absorbent/solids only once. Divide each actual outlet by L."
      inputs:
        - cp_incidents
        - cp_energy
        - cp_acceptance
      output: "Distinct actual waste and species outlet kg per 1 m"
      source_ids: []
  data_quality_requirements:
    - id: survey_gate
      applies_to: "accepted_track_geometry_service"
      requirement: "Track ID/chainage, actual target, spatial base, units, tolerance/temperature source, calibrated survey, pre/post support/stability evidence and signed restrictions must agree. L excludes failed and repeated intervals."
      evidence: "cp_acceptance records and adopted owner criteria"
    - id: scope_temporal
      applies_to: "all inventory rows"
      requirement: "Cover every campaign/window/period including idle/setup/changeover, cleaning, failures, repeats and closure; map every event to node and single owner; enumerate asset life phases and stock carry-over periods."
      evidence: "All event/transfer IDs and period/consumer ledgers"
    - id: identity_actual
      applies_to: "all inventory rows"
      requirement: "Expand conditional requirements into actual distinct material, spare, service, waste and species identities; verify flow/property/unit and provider/substance/medium qualifiers. Energy/Duration support needs actual verification; no inferred absence outside supplied published snapshot."
      evidence: "Supplier/provider/substance documents and identity verification"
    - id: custody_balance
      applies_to: "material flows; fuel_gross"
      requirement: "Gross supply excludes tare and precedes returns. Reconcile stocks and exclusive outlets per identity/moisture; carry closing-stock burden. Track dry solids, water, weather and host moisture separately. Burned fuel differs from gross exchange."
      evidence: "cp_materials; cp_energy; cp_incidents"
    - id: asset_forecast
      applies_to: "shared_asset_service"
      requirement: "Require manufacture/maintenance/replacement/EOL and all consumers/periods; label observed/forecast remaining life, uncertainty, termination and update scenarios. Missing evidence blocks finalisation, rather than requiring observed future retirement."
      evidence: "cp_assets and source-backed sensitivity"
    - id: quantity_uncertainty
      applies_to: "all inventory rows"
      requirement: "No universal quantities adopted. Record instrument/factor uncertainty and actual low/high sensitivity for missing range evidence; source examples, fuel densities and nameplates do not establish general kg/m or kWh/m ranges."
      evidence: "Actual instrument certificates, factors and campaign variability"
    - id: no_duplicate
      applies_to: "all inventory rows"
      requirement: "Cross-check provider/material-included packaging, transport, fuel, spares, maintenance and capital against direct rows and life scopes; stock transfers and incident components count once."
      evidence: "Resource scope matrix, custody ledger and consumer shares"
validation_rules:
  - rule_id: gate_complete
    applies_to: "accepted_track_geometry_service"
    rule: "Require qualified prestate, approved targets, calibrated pre/post geometry and support/profile/stability evidence, actual adopted tolerance source, closed campaign defects and authorised handback/restrictions. No unaccepted interval or repeated pass inflates L."
    source_ids:
      - plasser-tamping-precision
      - plasser-tamping-control
  - rule_id: run_complete
    applies_to: "track_geometry_correction"
    rule: "Reconcile every campaign/window, setup/changeover/idle/cleanup, failure, retest and prescribed stability action to an owner and period; accepted output excludes unresolved rejects."
    source_ids: []
  - rule_id: material_balance
    applies_to: "material flows"
    rule: "Check net-tare gross receipts and opening/closing stock against mutually exclusive use/incorporation, actual outward returns, waste and evidenced species releases. Dry solids, water, retained host moisture and weather are distinct terms. Investigate residuals; unknown residual is not automatic emission."
    source_ids: []
  - rule_id: fuel_balance
    applies_to: "fuel_gross; fuel_return; recovered_spill_waste; exhaust_species; oil_release_species"
    rule: "Separate fuel receipt, opening/closing inventory, return, waste and incident-release fractions to derive burned fuel. Partition each spill total into recovered fluid, retained residue and actual uncontained fluid; derive species/medium releases only from the evidenced uncontained partition. Assign retained residue to closing inventory or its distinct unburned outlet once; do not subtract incident total again. Match factors to fuel/engine/mode and units."
    source_ids: []
  - rule_id: assets_complete
    applies_to: "shared_asset_service"
    rule: "Require complete-life phases, all consumers/periods, observed/forecast labels, replacement/termination/EOL scenarios and source/denominator uncertainty; block missing coverage. Exclude direct fuel/spares already recorded and provider-included capital."
    source_ids: []
  - rule_id: identity_ranges
    applies_to: "all inventory rows"
    rule: "Verify each actual distinct material/provider/substance and its property/unit before final exchange; no speculative generic UUID, substance or particle fraction. Replace explicit Range evidence needs using actual route records or disclose unbounded uncertainty; checker pass is not quantity or external identity evidence."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground maintenance-service dataset for accepted existing plain-track geometry correction"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matching retained ballasted plain-track maintenance route, gate, technology, region and accepted length basis"
  excluded_use: "New railway construction; turnout/slab track; full ballast renewal; universal safety/speed or life-extension benefit claims; train transport"
  required_metadata: "Reference qualifiers; campaign/window/period and chainages; actual machine/provider; residual restrictions; acceptance source; material custody; shared life/service attribution"
  required_quality_disclosure: "Meter/survey accuracy; failed work; stock balances; fuel/emission factors/species; life forecasts/sensitivity; upstream scope; unresolved identities and Range needs"
  update_trigger: "Changed machine, ballast/track state, target/handback criteria, provider scope, inventory period, asset life scenario, quantity evidence or flow identity"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations CPC Version 3.0 explanatory notes, 30 June 2025, printed p.284; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "54212 classification repair/restoration and ballast/rail service context; does not supply LCA quantities"
  - id: "plasser-tamping-precision"
    type: "literature"
    reference: "Plasser & Theurer, Tamping technology: Precision; https://www.plassertheurer.com/en/tamping-technology/precision"
    used_for: "Interdependent lifting/lining and tamping, geometry measurement and separate dynamic stabilisation capability; no universal handback authority or quantities"
  - id: "plasser-tamping-control"
    type: "literature"
    reference: "Plasser & Theurer, The tamping unit that understands the ballast; https://www.plassertheurer.com/en/pt-research/artikel/the-tamping-unit-that-understands-the-ballast"
    used_for: "Physical cycle, under-sleeper filling/compaction, condition-dependent settings and repeats; research examples not generic ranges"
