system_boundary:
  rules:
    - rule_id: retained_host
      applies_to: "track_geometry_correction"
      rule: "Retained track/ballast is not a new material input and earns no avoided replacement credit. Include incremental handling and actual top-up; qualified prestate and accepted poststate are mandatory."
      source_ids:
        - plasser-tamping-precision
        - plasser-tamping-control
    - rule_id: cycle_owner
      applies_to: "track_geometry_correction"
      rule: "One physical forming responsibility owns the interdependent lifting/lining/tine-insertion/squeezing/under-sleeper compaction cycle. There is no independently accepted lifted-track intermediate. Include actual profiling, failed cycles, clean-up, worksite protection, geometry measurement and required stability closure under this responsibility."
      source_ids:
        - plasser-tamping-control
    - rule_id: handback_owner
      applies_to: "track_geometry_correction"
      rule: "Actual adopted track-owner criteria govern geometry, stability, temperature, defects, possession and speed restrictions. Required additional stabilisation has an actual operator/resource owner or explicitly bounded provider; it cannot vanish as a future third-party task. Manufacturer description is not operating authority."
