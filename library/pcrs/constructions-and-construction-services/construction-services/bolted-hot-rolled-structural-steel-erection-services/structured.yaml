system_boundary:
  rules:
    - rule_id: boundary_start
      applies_to: "steel_erect"
      rule: "Begin at the released foundation/anchor and access interface with identified delivered members. Record existing support geometry, load path and interface release as starting-condition observations; do not fabricate product cards for design approval, geometry or readiness."
      source_ids:
        - osha-steel-site
    - rule_id: boundary_assembly
      applies_to: "steel_erect"
      rule: "Own lifting, initial connection, alignment, permanent field bolting and actual owned steel shims, nonsteel base completion, incidental preparation/touch-up and cleanup. Component roles are fabricated columns/beams/bracing and permanent bolts/nuts/washers/plates/shims. Initial connection or crane release is not final acceptance; use the actual project connection inspection and stability gate."
      source_ids:
        - fhwa-inspection-steel
        - osha-steel-stability
    - rule_id: boundary_gate
      applies_to: "reference_service"
      rule: "End at one documented aligned, permanently bolted and stable accepted assembly after all actual owned grout/base and surface-repair obligations and controlled temporary-support release are complete. Record inapplicable duties with evidence; unresolved duties prevent declaring this gate. Do not include the later building use or demolition."
      source_ids:
        - steel-erection-accounting-method
        - osha-steel-stability
    - rule_id: boundary_phases
      applies_to: "steel_erect"
      rule: "Index receiving/staging, lifting/initial connection, alignment/permanent bolting, owned base/repair completion and support release/acceptance by actual dates and reporting periods. Link every material, equipment, utility, output, rework and replacement event to its phase and owner. Preserve open stocks and uncompleted periods rather than advancing them to acceptance."
      source_ids:
        - steel-erection-accounting-method
    - rule_id: boundary_node
      applies_to: "steel_erect"
      rule: "One accountable node owns the complete erection episode and its internal fitting/rebolting/touch-up loops. Phase records, stock movements and changed existing-asset condition are observations, not independent products. A genuinely separately owned material-state transfer requires a transfer identifier and explicit node/boundary review; never erase that handoff."
      source_ids:
        - steel-erection-accounting-method
    - rule_id: boundary_scope_review
