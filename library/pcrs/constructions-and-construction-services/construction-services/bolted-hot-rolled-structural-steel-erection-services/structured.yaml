                lower: "1"
                upper: "1"
                unit: "kg"
                basis: "per 1 kg reference flow"
                basis_kind: "reference_flow"
                evidence_kind: "calculated_from_collection"
                source_ids:
                  - steel-erection-accounting-method
      waste:
        - row_id: captured_preparation_solids
          role: "Captured surface-preparation solids"
          name: "Captured surface-preparation solids"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "When preparation occurs, record captured solids with actual parent steel/coating constituents, added abrasives, capture method and receiver. A range needs those available pools and independently measured collected state. Captured solids and uncaptured airborne particles are exclusive fates of the same source portion. Embedded moisture and mixed coating constituents require measured bridges; the closure residual is not collected dust."
          amount:
            expression: "Independently measured and attributed quantity of each actual concrete exchange divided once by S."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_steel_erect_material
              source_ids:
                - steel-erection-accounting-method
            ranges: []
        - row_id: collected_wastewater_slurry
          role: "Collected wastewater and cleaning slurry"
          name: "Collected wastewater and cleaning slurry"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Only actual collected wastewater or cutting/cleaning slurry sent to treatment is waste output. Identify receiver, wet state, water-only mass and entrained dry solids/chemicals independently. A range needs actual water supply, collection/capture and constituent records. Entrained solids cannot also be counted as dry dispatched waste; uncollected discharge and evaporation require their own evidence and are not inferred from a missing balance."
          amount:
            expression: "Independently measured and attributed quantity of each actual concrete exchange divided once by S."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_steel_erect_material
              source_ids:
                - steel-erection-accounting-method
            ranges: []
      elementary:
        - row_id: fossil_co2_air
          role: "Carbon dioxide (fossil), to air unspecified"
          name: "Carbon dioxide (fossil), to air unspecified"
          flow_type: "elementary"
          flow_ref:
            uuid: "08a91e70-3ddc-11dd-923d-0050c2490048"
          property_unit: "Mass / kg"
          description: "For evidenced combustion, quantify fossil CO2 from measured fuel-carbon/species data or a documented compatible model. This fixed identity is specifically unspecified air and must not be relabelled as another compartment. Identified CO2 carbon cannot exceed independently measured fossil carbon burned; the upper 44/12 conversion is a carbon-mass constraint, not a diesel-mass emission factor or an assertion of complete oxidation. Do not invent oxygen inputs or other species to close fuel mass."
          amount:
            expression: "Independently measured and attributed quantity of each actual concrete exchange divided once by S."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_steel_erect_release
              source_ids:
                - steel-erection-accounting-method
                - carbon-oxidation-identity
            ranges:
              - role: qa_guardrail
                lower: "0"
                upper: "3.6666666666666665"
                unit: "kg CO2/kg fossil carbon burned"
                basis: "per kg independently measured fossil carbon burned; upper is 44/12"
                basis_kind: "fuel_inventory"
                evidence_kind: "method_formula"
                source_ids:
                  - carbon-oxidation-identity
        - row_id: water_vapour_air
          role: "Water vapour, to air unspecified"
          name: "Water vapour, to air unspecified"
          flow_type: "elementary"
          flow_ref:
            uuid: "fe0acd60-3ddc-11dd-ac04-0050c2490048"
          property_unit: "Mass / kg"
          description: "Use this H2O-to-unspecified-air identity only for independently supported actual evaporation from a wet operation. A range needs separately measured available water-only pools and an applicable evaporation measurement/model. Separate water in formulations, supplied water and other evidenced sources from dry constituents; account for retained water, wastewater and actual discharge. A residual is not vapour, and absence of evaporation needs evidence; a different compartment needs its own identity."
          amount:
            expression: "Independently measured and attributed quantity of each actual concrete exchange divided once by S."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_steel_erect_release
              source_ids:
                - steel-erection-accounting-method
            ranges: []
allocation_rules:
  - rule_id: allocation_direct
    applies_to: "all inventory rows"
    rule: "Assign directly measured piece, connection and phase activity first. For genuinely shared crane/access/meter use, list every consuming episode/node and period, retain owned idle/tests/rework, then allocate only the unassigned residual using documented causal use or occupation evidence. Record period-specific shares and uncertainty; shares must be nonoverlapping and reconcile to observed coverage."
    source_ids:
      - steel-erection-accounting-method
  - rule_id: allocation_provider
    applies_to: "hired_equipment_services; diesel_fuel; electricity; lubricants_other_operating_products"
    rule: "Read each service boundary before adding owned fuel, electricity, maintenance or capital burdens. Count provider-included burdens once. For a self-owned reusable crane, tool or temporary brace, use evidenced actual service capacity/lifetime, use and damage/replacement records for manufacture attribution; unknown life or coverage remains a gap, never a default reuse count."
    source_ids:
      - steel-erection-accounting-method
  - rule_id: allocation_rework
    applies_to: "steel_erect; reference_service"
    rule: "Keep failed member/connection inspection, damaged coating and unaccepted assemblies linked to their original piece, node and period. Approved fitting, rebolting or touch-up retains its burdens within steel_erect. Record actual return, downgrade, recovery, waste or retained WIP destinations separately. Acceptance counts each permanent steel constituent once after successful rework; neither repeated installation nor unresolved reject mass enlarges S."
    source_ids:
      - steel-erection-accounting-method
  - rule_id: allocation_exits
    applies_to: "usable_material_exits; returnable_packaging_exit; steel_scrap_waste"
    rule: "An actual usable return is not an accepted erection service or an automatic avoided-product credit. Keep dispatch identity, state, ownership and receiver. Report waste treatment responsibilities and any separately reviewed recovery allocation explicitly; do not net heterogeneous returns or scrap against the reference mass. Used equipment returns are custody events rather than unused material exits."
    source_ids:
      - steel-erection-accounting-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_steel_erect_material
      process_id: "steel_erect"
      flow_role: "materials, products, waste and accepted S"
      record_type: "weighing, piece/connection and fate register"
      raw_fields: "event_id; lot/configuration; process_id; phase; timestamp/period; owner; role; actual_identity/current_state; native_amount/unit; measured_same_state_bridge; receiver/medium; evidence; uncertainty"
      collection_method: "Use calibrated weighing or traceable same-state supplier mass records; reconcile piece marks, connection schedule, whole/constituent bridges and acceptance/fate documents. Observe actual foundation/anchor release, geometry, inspections and stock as contextual records. Measure S from unique accepted permanent steel constituents, not from a balancing residual."
      unit: "kg; native count/volume with measured bridge"
      frequency: "Each receipt, issue, rework, acceptance, return or dispatch; stock at period boundaries"
      temporal_coverage: "Starting interface release through completed acceptance; all phases and actual reporting periods, including open periods and stock boundaries"
      site_scope: "Actual erection site and declared equipment/service ownership boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations, supplier constituent data, permanent accepted schedule, inspection/release signatures, custody and waste tickets"
    - protocol_id: cp_steel_erect_utility
      process_id: "steel_erect"
      flow_role: "fuel, electricity and supplied water"
      record_type: "meter, stock and equipment-duty journal"
      raw_fields: "event_id; lot/configuration; process_id; phase; timestamp/period; owner; role; actual_identity/current_state; native_amount/unit; measured_same_state_bridge; receiver/medium; evidence; uncertainty"
      collection_method: "Read calibrated meters and opening/closing stocks with delivery, source/state and equipment duty. Include owned idle, tests and rework. Mark provider coverage and direct assignments before residual attribution. Convert liquid volume only using evidenced actual state density; preserve native kWh."
      unit: "kg; kWh; native meter units with bridge"
      frequency: "Every meter/stock interval and duty event, including interruptions"
      temporal_coverage: "Starting interface release through completed acceptance; all phases and actual reporting periods, including open periods and stock boundaries"
      site_scope: "Actual erection site and declared equipment/service ownership boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter topology/calibration, receipts, density evidence, full duty log and provider coverage"
    - protocol_id: cp_steel_erect_asset
      process_id: "steel_erect"
      flow_role: "hired services and reusable asset observations"
      record_type: "service, custody, shared-use and replacement journal"
      raw_fields: "event_id; lot/configuration; process_id; phase; timestamp/period; owner; role; actual_identity/current_state; native_amount/unit; measured_same_state_bridge; receiver/medium; evidence; uncertainty"
      collection_method: "Link each actual crane/access/logistics/temporary-support asset to provider/owned coverage, custody and use/occupation intervals, all consumers and periods. Observe mass without treating it as consumption. Obtain actual manufacture capacity/life, use, damage and replacement evidence if self-owned; otherwise retain the gap."
      unit: "h; kg asset observation; native service units"
      frequency: "Each hire, custody transfer, use interval, damage, replacement and release"
      temporal_coverage: "Starting interface release through completed acceptance; all phases and actual reporting periods, including open periods and stock boundaries"
      site_scope: "Actual erection site and declared equipment/service ownership boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Contracts, equipment IDs, duty/occupation and all-consumer logs, actual life/use/damage documents"
    - protocol_id: cp_steel_erect_release
      process_id: "steel_erect"
      flow_role: "direct resource intake and substance-specific releases"
      record_type: "source, medium, sampling and model journal"
      raw_fields: "event_id; lot/configuration; process_id; phase; timestamp/period; owner; role; actual_identity/current_state; native_amount/unit; measured_same_state_bridge; receiver/medium; evidence; uncertainty"
      collection_method: "For actual abstraction/emission/discharge record exact substance or reported basis, environmental medium, source pool and phase. Use calibrated direct measurements or a documented compatible species/fate model with measured inputs and uncertainty. Keep fossil carbon and water-only pools separate; record capture and treatment links without deriving emissions from closure."
      unit: "kg substance; native sampling units with measured bridge"
      frequency: "Each actual release/abstraction event or evidenced model interval"
      temporal_coverage: "Starting interface release through completed acceptance; all phases and actual reporting periods, including open periods and stock boundaries"
      site_scope: "Actual erection site and declared equipment/service ownership boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Occurrence evidence, samples/calibrations, actual fuel-carbon/formulation data, model/factor applicability and receiver"
  calculation_rules:
    - id: derive_accepted_steel
      applies_to: "reference_service"
      rule: "S = sum of unique actual net steel masses permanently retained in accepted members, permanent connections and steel shims; derive each steel constituent from its measured whole-state item and documented constituent bridge. Require S > 0 and complete gate evidence; exclude temporary items, nonsteel grout/coatings, returns, scrap and WIP."
      inputs:
        - cp_steel_erect_material
        - "accepted piece/connection schedule"
        - "measured whole-state/steel bridges"
      output: "S in kg"
      source_ids:
        - steel-erection-accounting-method
    - id: normalize_concrete_exchange
      applies_to: "all inventory rows"
      rule: "For each independently identified concrete exchange, convert its native event quantity to its required unit using an evidenced same-state bridge, assign its owned share, then divide its episode numerator once by S. Keep different SKU/state/receiver or substance/medium numerators separate. Only reference_service uses S/S = 1 kg; a mixed ledger sum is QA, not an exchange."
      inputs:
        - cp_steel_erect_material
        - cp_steel_erect_utility
        - cp_steel_erect_asset
        - cp_steel_erect_release
        - S
      output: "concrete unit per 1 kg reference flow"
      source_ids:
        - steel-erection-accounting-method
    - id: compatible_pool_check
      applies_to: "all inventory rows"
      rule: "Within one compatible identity/state or evidenced constituent pool, compare opening stock plus actual inputs with independently observed retained incorporation, closing stock and exclusive actual exits/releases. Record differences and uncertainty as findings; do not solve for an unmeasured exchange. Separate factory coating, added coating/grout, dry constituents and water-only fates."
      inputs:
        - cp_steel_erect_material
        - cp_steel_erect_utility
        - cp_steel_erect_release
        - "compatible identity/constituent bridge"
      output: "pool-specific QA residual and uncertainty"
      source_ids:
        - steel-erection-accounting-method
    - id: fossil_carbon_check
      applies_to: "fossil_co2_air"
      rule: "Identified fossil CO2 mass <= independently measured fossil carbon burned * 44/12. Obtain fossil carbon from actual burned fuel and evidenced carbon/fossil fractions; do not assume generic diesel fossil fraction or complete oxidation. This constrains CO2 carbon only and is not a total combustion mass balance."
      inputs:
        - cp_steel_erect_utility
        - cp_steel_erect_release
        - "actual fossil carbon burned"
      output: "fossil-carbon QA constraint"
      source_ids:
        - carbon-oxidation-identity
  data_quality_requirements:
    - id: quality_concrete_identity
      applies_to: "all inventory rows"
      requirement: "Record actual occurrence as yes/no/unresolved, with evidence for nonoccurrence and zero. Expand conditional roles to each concrete SKU/state/receiver or substance/medium and verify flow and support identities before final exchange use; no conceptual umbrella or unsupported support substitution."
      evidence: "Occurrence register; identity/state/receiver evidence"
    - id: quality_denominator
      applies_to: "reference_service; fabricated_steel_members; permanent_connection_steel"
      requirement: "Reconcile accepted piece marks and permanent connection/shim schedule, whole delivered-state masses and independently evidenced steel/factory-coating constituents. Require a positive steel-only S and the full project gate. Design geometry or invoice mass cannot silently stand in for accepted constituent mass."
      evidence: "Calibrated same-state mass/bridge records; signed acceptance"
    - id: quality_range_needs
      applies_to: "all inventory rows"
      requirement: "The reference normalization and fossil-carbon identity are the only numeric ranges specified here. For every other row, obtain its card-specific quantitative evidence need before claiming a numerical prior: actual masses/constituents, grout geometry/formulation, repair area/film, tool events, duty/meters, water-only fates, service intervals, packaging custody, waste state/receiver or exact emission substance/model as applicable. Preserve each unresolved range need and physical QA; no arbitrary upper limit or residual-derived exchange."
      evidence: "Per-card range evidence register; source applicability and uncertainty"
    - id: quality_exclusive_roles
      applies_to: "all inventory rows"
      requirement: "Assign each event/material portion once among base/grout, incidental surface-repair, solid tool/temporary replacement, operating fluids, fuel/electricity, separately supplied water and packaging. Track intrinsic formulation water within its purchased product. Use exclusive retained, returned, captured, waste and environmental fates for each evidenced constituent."
      evidence: "Event-to-role ledger and compatible constituent bridges"
    - id: quality_period_ownership
      applies_to: "steel_erect"
      requirement: "Cover all actual phases/periods, receipts and stocks, owned idle/tests/rework, asset use, replacements, returns and termination. Pair genuine cross-owner transfers and list all shared consumers. Require attribution coverage, provider exclusions and actual life/use evidence for self-owned capital; retain missing intervals or unknown fates as gaps."
      evidence: "Full phase/event journal; contracts; all-consumer allocation reconciliation"
    - id: quality_release_pools
      applies_to: "direct_freshwater_abstraction; fossil_co2_air; other_engine_species_air; physical_particulate_air; volatile_species_air; water_vapour_air; specific_direct_water_releases"
      requirement: "Water-only availability and fates, fuel fossil-carbon/species constraints and dry material pools are independently evidenced QA. Do not mix whole wet waste mass with water mass, fuel with CO2, captured solids with uncaptured particles, or treatment-bound waste with direct environmental releases. Record methods, source-state compatibility, detection limits and model uncertainty."
      evidence: "Separate compatible-pool, water-only and carbon/species checks"
validation_rules:
  - rule_id: validate_gate
    applies_to: "reference_service"
    rule: "Require positive independently measured S and piece/connection acceptance, actual alignment and bolting inspection, stability, owned completion and controlled support release. Receipt weight or initial connection alone cannot pass. Exclude returns, scrap, temporary items and unaccepted WIP."
    source_ids:
      - steel-erection-accounting-method
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Resolve each concrete material/SKU/state, service and receiver or elementary substance/medium before final exchange production. Fixed generic diesel, fossil CO2 to unspecified air and H2O to unspecified air retain their actual identity limits. Verify flow-property/unit-group chains independently; no unresolved umbrella is a concrete UUID."
    source_ids:
      - steel-erection-accounting-method
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Check native numerator, same-state conversion, protocol ownership, unique event and one division by S. Reference alone self-normalizes to one. Whole coated-product input mass cannot be replaced by retained net steel. Range gaps and unknown occurrence remain explicit; no arbitrary numeric bounds prove completeness."
    source_ids:
      - steel-erection-accounting-method
  - rule_id: validate_phases
    applies_to: "steel_erect"
    rule: "Check actual five-phase and reporting-period journal, all piece/asset/utility/output links and attribution decisions. Rework, replacement and termination require resolved state and destination. Open periods or missing release obligations prevent episode finalization and cannot be silently carried into accepted output."
    source_ids:
      - steel-erection-accounting-method
  - rule_id: validate_shared
    applies_to: "hired_equipment_services; diesel_fuel; electricity"
    rule: "Reconcile shared assets/services, all consumers/periods, direct assignments and residual shares. Test provider fuel/capital/maintenance against owned rows for duplicate coverage. Missing self-owned lifetime/use evidence remains a disclosed gap rather than full asset manufacture or zero burden."
    source_ids:
      - steel-erection-accounting-method
  - rule_id: validate_fates
    applies_to: "all inventory rows"
    rule: "Close only compatible material/state or evidenced constituent pools, including opening/closing stock. Keep water-only and fossil-carbon checks separate. Distinguish captured/uncaptured, wet/dry and product/waste/environment destinations. A residual is a finding and never a fabricated exchange; do not equate fuel kg with CO2 kg or invent oxygen."
    source_ids:
      - steel-erection-accounting-method
      - carbon-oxidation-identity
  - rule_id: validate_scope
    applies_to: "steel_erect"
    rule: "Review any separately owned handoff, structural field welding or independent fabrication/full coating before applying this category. Record actual local/project acceptance requirements; safety guidance examples supply no default final-bolt criterion, design tolerance or inventory rate."
    source_ids:
      - fhwa-inspection-steel
      - osha-steel-site
      - osha-steel-stability
published_dataset_profile:
  dataset_role: "Foreground data package for an actual bolted hot-rolled structural steel erection episode"
  downstream_use: "LCA process or lifecyclemodel projection and actual supply-chain linking once identity and quality conditions are met"
  allowed_use: "Constructing or comparing actual erection data with matched boundary, acceptance gate, net permanent steel basis and disclosures"
  excluded_use: "Proxy for steel fabrication or whole-building lifecycle; universal construction performance or regulatory compliance proof; final exchanges with unresolved identities"
  required_metadata: "All reference qualifiers, full phase/period journal, S and constituent bridges, actual substances/media, equipment/service coverage, shared attribution and fate ownership"
  required_quality_disclosure: "Identity/support gaps; unresolved occurrence and range evidence; measurement/model uncertainty; data periods/coverage; open WIP/rejects; capital-life and supplier-boundary gaps; performed/skipped checks and completeness"
  update_trigger: "Material changes to member/coating/connection state, ownership boundary, permanent joining route, equipment/service coverage, acceptance requirements, measurement bridges, release methods or new evidence"
data_sources:
  - id: "fhwa-inspection-steel"
    type: "official_guidance"
    reference: "FHWA, Construction Program Management and Inspection Guide, Appendix D, Structural Steel (updated 2017-06-27), https://www.fhwa.dot.gov/construction/cpmi04d2.cfm"
    used_for: "Identifies lifting, field-connection inspection, bearing alignment and field cleaning/coating responsibilities; supplies no universal consumption rates or acceptance tolerances"
  - id: "osha-steel-site"
    type: "official_guidance"
    reference: "OSHA eTools, Steel Erection, Site Preparation, https://www.osha.gov/etools/steel-erection/site-preparation"
    used_for: "Starting foundation/anchor interface, staging, lifting planning and responsibility identification; US safety context, not inventory quantities or universal thresholds"
  - id: "osha-steel-stability"
    type: "official_guidance"
