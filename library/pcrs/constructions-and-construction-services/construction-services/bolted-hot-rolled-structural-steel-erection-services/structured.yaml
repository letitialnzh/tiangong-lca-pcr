boundary_abstraction:
  declared_starting_condition: "Released foundation/anchor interface, existing geometry/load path and access, plus delivered members with piece marks and connection schedules"
  starting_condition_role: "Observed interface condition; existing assets are not products newly manufactured by this erection service"
  product_classification_scope: "Classification is mapping context; this service is limited to hot-rolled member erection with permanent field bolting"
  recursive_input_rule: "Record any same-category prior erection service by actual provider, state, ownership boundary and transfer; do not recursively rebuild existing supports or duplicate accepted steel output; review any real cross-owner handoff"
  upstream_dataset_requirement: "Provide supply-chain datasets/boundaries for actual fabricated-state members, connection products, materials, utilities and equipment services; count provider-included burdens once and disclose unknown coverage"
  disclosure: "Disclose starting release evidence, work periods, ownership, equipment coverage, actual acceptance/release, WIP/reject states and unresolved data"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Bolted hot-rolled structural steel erection service"
    uuid: ""
  flow_property_ref:
    uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
  unit_group_ref:
    uuid: "93a60a57-a4c8-11da-a746-0800200c9a66"
  reference_unit: "kg"
  required_qualifiers:
    - "Project/site"
    - "piece marks and steel grade"
    - "fabrication/factory-coating state"
    - "permanent connection/shim schedule"
    - "whole-product/steel bridges"
    - "foundation/anchor interface release"
    - "actual phases/reporting periods"
    - "equipment/service coverage"
    - "project inspection/acceptance gate"
    - "grout/touch-up ownership"
    - "temporary-support release"
    - "stock/reject fates"
reference_flows:
  []
measurement_rules:
  - id: accepted_steel_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "S is actual net steel mass of uniquely accepted permanent members, connections and steel shims, independently measured using cp_steel_erect_material; derive_accepted_steel and normalize_concrete_exchange produce per 1 kg reference flow without substituting whole incoming coated-product mass for S."
  - id: same_state_bridges
    applies_to: "fabricated_steel_members; permanent_connection_steel; base_completion_products; incidental_surface_repair_products; tool_temporary_replacement_products; diesel_fuel; water_supplied; lubricants_other_operating_products; packaging_received; direct_freshwater_abstraction; reference_service; usable_material_exits; returnable_packaging_exit; steel_scrap_waste; coating_grout_residue_waste; captured_preparation_solids; packaging_waste; oily_consumable_waste; collected_wastewater_slurry; fossil_co2_air; other_engine_species_air; physical_particulate_air; volatile_species_air; water_vapour_air; specific_direct_water_releases"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use measured same-state weighing or traceable mass records and supplier constituent bridges for count, volume, steel and coating conversions; length, area and design geometry alone do not establish mass. Keep wet waste, water-only and dry constituent masses distinct."
  - id: utility_service_units
    applies_to: "electricity; hired_equipment_services"
    required_property_ref:
      name: "Energy; Duration"
      uuid: ""
    required_unit: "kWh; h"
    rule: "Preserve electricity in kWh and service in actual hours, without substituting calorific value, labour hours or composite area-time properties. Verify each concrete exchange support identity and conversion; disclose gaps."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: steel_erect
    name: "Complete bolted steel erection episode"
    inclusion: "required"
    inclusion_condition: "Every actual episode within this rule"
    role: "Owned five-phase erection, rework loops and accepted handover"
    quantitative_reference: "per 1 kg reference flow; S is unique accepted net permanent steel"
process_inventory:
  - id: steel_erect
    label: "Complete bolted steel erection episode"
    inputs:
      product:
        - row_id: fabricated_steel_members
          role: "Delivered fabricated hot-rolled steel members"
          name: "Delivered fabricated hot-rolled steel members"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Required columns, beams and bracing cross the site-erection boundary in their actual fabricated and coated state. Identify each piece mark, grade and coating system. Record whole delivered-state product mass separately from evidenced steel, factory-coating and other constituents. A quantitative range requires actual piece masses, constituent bridges, accepted steel and return, scrap and WIP observations; coated product mass divided by S is not necessarily one. Reconcile only matching piece and constituent pools."
          amount:
            expression: "Independently measured and attributed quantity of each actual concrete exchange divided once by S."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_steel_erect_material
              source_ids:
                - steel-erection-accounting-method
            ranges: []
        - row_id: diesel_fuel
          role: "Diesel fuel"
          name: "Diesel fuel"
          flow_type: "product"
          flow_ref:
            uuid: "9d258d75-6792-4f1c-9856-81602ed8f816"
          property_unit: "Mass / kg"
          description: "Record diesel actually burned by owned or separately metered equipment, including attributable idle, tests and rework, where occurrence is established. The fixed identity is generic diesel with no asserted grade, refinery or fossil fraction. A range requires calibrated stocks/meters, actual equipment and complete duty intervals with independent S. Delivered fuel, burnt fuel and stock change must be reconciled; useful lifting work is not fuel mass, and provider-included fuel is not charged again."
          amount:
            expression: "Independently measured and attributed quantity of each actual concrete exchange divided once by S."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_steel_erect_utility
              source_ids:
                - steel-erection-accounting-method
            ranges: []
        - row_id: electricity
          role: "Attributed electricity supply"
          name: "Attributed electricity supply"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "When actually consumed, resolve the source, voltage and provider and preserve metered Energy in kWh. A range needs meter topology, complete intervals, device duty and independent S. Direct assignments precede residual shared-meter attribution; totals across consumers cannot exceed observed supply. Energy support identity still requires verification for the concrete exchange; a calorific-value property is not a substitute."
          amount:
            expression: "Independently measured and attributed quantity of each actual concrete exchange divided once by S."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_steel_erect_utility
              source_ids:
                - steel-erection-accounting-method
            ranges: []
        - row_id: water_supplied
          role: "Supplied process and cleanup water"
          name: "Supplied process and cleanup water"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Record actual purchased or supplied water for wet operations and cleanup; require occurrence evidence rather than assuming use. A range needs measured draw, recirculation/return and independently supported water-only fates. Volume-to-mass conversion needs actual same-state density. Exclude water already intrinsic to a purchased formulation and any identical quantity recorded as direct abstraction. Internal circulation is not a new external input."
          amount:
            expression: "Independently measured and attributed quantity of each actual concrete exchange divided once by S."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_steel_erect_utility
              source_ids:
                - steel-erection-accounting-method
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: reference_service
          role: "Bolted hot-rolled structural steel erection service"
          name: "Bolted hot-rolled structural steel erection service"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "This is the accepted erection service measured by net permanent steel S, not another sale of its component inputs. Count only uniquely accepted retained members, permanent connection items and steel shims after alignment, permanent-bolt inspection, stability, all actual owned base/repair completion and controlled temporary-support release are evidenced. Independently derive positive S from piece/connection records and steel-constituent bridges. Exclude temporary items, nonsteel grout/coatings, returns, scrap and unresolved WIP. The reference quantity alone is S/S = 1 kg."
          amount:
            expression: "1 kg"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_steel_erect_material
              source_ids:
                - steel-erection-accounting-method
            ranges:
