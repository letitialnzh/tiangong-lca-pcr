            expression: "Unique actual defect-host entries linked to repair and work-order IDs, divided by accepted count N; no host-production upstream burden."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_p_host
              source_ids:
                - romac-install-2024
            ranges: []
