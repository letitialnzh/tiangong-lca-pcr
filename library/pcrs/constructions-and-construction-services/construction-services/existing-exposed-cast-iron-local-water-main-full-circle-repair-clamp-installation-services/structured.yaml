  calculation_rules:
    - id: calc_normalize
      applies_to: "All inventory rows"
      rule: "For each row q_ref = attributed actual quantity / N, with original physical row unit retained. N is unique accepted final repair count and must be positive; internal transfer quantities retain their distinct event register."
      inputs:
        - "Node-specific protocols and cp_i_host"
        - "actual attributed row quantity and accepted_count_N"
      output: "Row physical units per 1 item accepted repair"
      source_ids: []
    - id: calc_mass
      applies_to: "prep_supplies; prep_water; prep_fuel; prep_returns; prep_solid_waste; prep_wastewater; gasket_lubricant; hygiene_chemicals; test_flush_water; install_fuel; install_consumables; install_returns; install_solid_waste; install_wastewater"
      rule: "Net contents kg = gross kg - tare kg. Where measured volume is used, mass kg = volume m3 * actual density kg/m3, or volume L * actual density kg/L; record actual temperature and state. Product count to mass requires actual SKU mass kg/item. Gross receipt/issue precedes outward returns."
      inputs:
        - "Applicable node cp_materials"
        - cp_water
        - "cp_utilities or cp_residuals"
        - "actual raw weight"
        - volume
        - density
        - temperature
        - "state and SKU net mass"
      output: "Actual physical net mass kg, separately normalized over N"
      source_ids: []
    - id: calc_power
      applies_to: "prep_power; install_power"
      rule: "Attributed electricity kWh = (meter_end_kWh - meter_start_kWh) * meter_multiplier * node_share; divide by N. Actual shares reconcile to whole metered consumer scope."
      inputs:
        - cp_p_utilities
        - cp_i_utilities
        - "actual meters/multiplier/node_share/N"
      output: "kWh per accepted repair"
      source_ids: []
    - id: calc_freight
      applies_to: "prep_freight; install_freight"
      rule: "Freight kg*km = sum(cargo_mass_kg * loaded_distance_km * target_share); divide by N. Cargo tare removed. Verified 1 t*km = 1000 kg*km only when actual exchange uses that supported unit. Empty legs use actual separate service/fuel resources without cargo invention."
      inputs:
        - cp_p_freight
        - cp_i_freight
        - "cargo mass"
        - "leg distance"
        - "target shares and accepted_count_N"
      output: "kg*km per accepted repair"
      source_ids: []
    - id: calc_assets
      applies_to: "prep_assets; install_assets"
      rule: "Asset-equivalent item = target_node_service / complete_life_service, then divide by N. Complete_life_service = observed_life_service + evidenced prospective_remaining_service for in-service scenarios; use same compatible driver units and coverage, all consumers and periods. Scale actual complete-life upstream burden with this fraction once."
      inputs:
        - cp_p_assets
        - cp_i_assets
        - "compatible target and complete-life service"
        - "forecast/observed labels"
        - "full-life burden coverage"
        - accepted_count_N
      output: "Asset-equivalent item and attributed complete-life burden per repair"
      source_ids: []
    - id: calc_fuel
      applies_to: "prep_fuel; install_fuel; prep_combustion; install_combustion"
      rule: "S_fuel = opening_fuel_kg + gross_fuel_kg - closing_fuel_kg; gross_fuel_kg is external net fuel content before return deduction, excluding container/vehicle tare. burned_fuel_kg = S_fuel - unburned_return_kg - captured_unburned_waste_kg - whole_uncontained_fuel_kg on the same bounded tank/event scope, with exclusive final outlets; incident total spill is audit only. Upstream fuel input is S_fuel/N with actual outlets, OR (S_fuel-unburned_return_kg)/N under the declared matched-usable-return convention without a second return credit. Both supply views retain all nonreturned unburned waste/loss burdens. Use burned_fuel_kg only for matching combustion activity and never as the sole upstream supply."
      inputs:
        - cp_p_utilities
        - cp_i_utilities
        - "stock/gross/exclusive outlets and boundary choice"
      output: "Upstream fuel supply kg per N and separate actual burned activity kg"
      source_ids: []
    - id: calc_combustion
      applies_to: "prep_combustion; install_combustion"
      rule: "Emission kg = burned_fuel_kg * applicable emission_factor_kg_per_kg_fuel, or actual measured_emission_kg, separately for verified substance/receiver; divide by N. Factor source and fuel/equipment/abatement/basis must match."
      inputs:
        - cp_p_utilities
        - cp_i_utilities
        - "actual burned fuel"
        - "species/factor/source or measured emission"
      output: "Species kg per accepted repair to actual air receiver"
      source_ids: []
    - id: calc_releases
      applies_to: "prep_releases; install_releases"
      rule: "Species kg = actual concentration_kg_per_m3 * discharged volume_m3, or measured_species_kg; divide by N. Record concentration basis/unit conversion evidence. Whole-fluid mass kg = actual volume_m3 * actual density_kg_per_m3 when not weighed; species sum is not whole-fluid mass. Dose, retained/reaction/captured/neutralised quantities remain separate evidence, never assumed emitted."
      inputs:
        - cp_p_residuals
        - cp_i_residuals
        - "concentration/basis"
        - "discharged volume"
        - "density/temperature/state"
        - "species and medium"
      output: "Actual species kg per repair and separate whole-fluid physical balance"
      source_ids: []
    - id: calc_stock_bridge
      applies_to: "prep_supplies; prep_returns; complete_clamp; gasket_lubricant; hygiene_chemicals; install_consumables; install_returns; clamp_returns"
      rule: "Maintain separate Count/item SKU ledgers and Mass/kg material/formulation ledgers at one chosen receipt OR issue boundary. Opening stock + actual receipts/issues = final retained installation/destinations + real outward returns + captured waste + actual whole release + closing stock. Final retained destinations exclude separately logged losses/outlets; dosed/used activity is intermediate and never another additive final outlet. Match opening carried-in upstream burden and receipt burden to actual use, returns/dispositions and closing carried-forward burden using actual compatible lot data. Never count receipt and internal issue together."
      inputs:
        - cp_p_materials
        - cp_i_materials
        - cp_i_clamp_returns
        - "actual separate SKU count fields (opening_stock_count"
        - receipts_count
        - final_retained_count
        - outward_returns_count
        - discarded_count
        - "closing_stock_count) and material mass fields"
        - "lot custody and opening/closing burden references"
      output: "Physical stock and upstream-burden bridge without fake closing-stock output"
      source_ids: []
  data_quality_requirements:
    - id: quality_route
      applies_to: "Host, assembly and reference output"
      requirement: "Actual main/OD/defect/clamp/gasket/potable approval and gate qualification required; site and PDF gauge conflict is resolved by actual SKU documentation, not an inferred BOM."
      evidence: "cp_p_host; cp_i_host; cp_i_materials; actual manufacturer/utility approval"
    - id: quality_closure
      applies_to: "Accepted repair and bounded closure provider"
      requirement: "Actual adopted authority and product editions, responsibility and mechanical/hygienic criteria/results required; documented non-applicability for any omitted test; future unowned test blocks final count."
      evidence: "cp_i_host; cp_i_closure; approved procedure/results/owners"
    - id: quality_completeness
      applies_to: "Every inventory row"
      requirement: "Collect all attempts, returns, stocks, actual waste/release outlets and provider resources from start to gate. Distinguish unknown from zero with detection limits and balance discrepancy investigation."
      evidence: "All node-specific protocols; custody, calibrated meter and receiver evidence"
    - id: quality_assets
      applies_to: "Shared assets/jobs/periods"
      requirement: "Complete-life service and burden coverage, all consumers, prospective scenario sources/uncertainty and update policy required; unsupported denominator or replacement/termination/EOL gap blocks finalisation."
      evidence: "cp_p_assets; cp_i_assets; full-life and all-consumer records"
    - id: quality_identity
      applies_to: "Concrete downstream exchanges"
      requirement: "Resolve actual supplier/provider/material/waste/substance and support identities before final TIDAS exchange; candidate semantic umbrella does not permit a near-match or invented UUID."
      evidence: "Actual foreground identities and independent detail/support verification"
    - id: quality_periods
      applies_to: "Work orders, loops, stocks and shared providers"
      requirement: "Declare start/end, node/event/period links and service ownership; reconcile shared setup/cleaning/travel and changing stock burdens without repeat attribution."
      evidence: "Every CP work_order_id/event_id/period_id/provider_id; consumer totals and stock bridge"
validation_rules:
  - rule_id: validate_qualification
    applies_to: "prepare_host; host_to_install"
    rule: "Reject unqualified host, unsupported defect/OD/clamp fit, missing authorised isolation/depressurisation or unresolved job-caused damage; retain clean seat and transfer evidence."
    source_ids:
      - romac-install-2024
      - romac-submittal-2024
  - rule_id: validate_assembly
    applies_to: "install_accept"
    rule: "Require distinct retained host and actual complete clamp component roles, flat clean gasket, centring, actual instruction-compliant torque/retorque and passed pre-concealment mechanical criterion; no coupling/tapping/separated ends."
    source_ids:
      - romac-install-2024
  - rule_id: validate_hygiene
    applies_to: "accepted_repair; closure_provider"
    rule: "Require actual adopted-authority contamination classification, hygiene/flushing/sampling/neutralisation criteria/results and actual responsible providers; complete all actual required closure before final output. Record applicable waiver evidence and authorised reinstatement/utility handback interfaces."
    source_ids:
      - ontario-watermain-2020
  - rule_id: validate_count_reject
    applies_to: "Reference count, work-order runs and loops"
    rule: "N counts only unique signed accepted final repairs; rejected attempts/clamps/tests and repeated preparation/retorque/retest retain burdens and explicit node-linked rework/return/waste paths. No failed attempt adds final count."
    source_ids: []
  - rule_id: validate_resources
    applies_to: "Shared assets/providers, stocks and all periods"
    rule: "Reconcile all consumers/periods, complete-life assets and prospective scenario evidence, direct versus bundled operation, freight/empty service, stock quantities/upstream-burden bridge and no repeated allocation. Missing life coverage or denominator blocks finalisation."
    source_ids: []
  - rule_id: validate_outlets
    applies_to: "Materials, water, fuel, waste and elementary releases"
    rule: "Gross before real returns; stock is not outward flow. Fuel outlets exclusive and whole uncontained fluid measured separately from species; total spill audit only. Chemical dose is not release and unclosed residual is not automatic emission; actual waste receiver/substance/medium and balance evidence required."
    source_ids: []
  - rule_id: validate_candidate
    applies_to: "Foreground package and downstream exchange production"
    rule: "Require all applicable protocols/qualifiers, actual units/conversion operands/uncertainty and verified concrete final exchanges before production. A candidate/check pass does not prove SKU potable approval, quantity truth, authority compliance or UUID verification."
    source_ids: []
  - rule_id: validate_fuel_supply
    applies_to: "prep_fuel; install_fuel; prep_combustion; install_combustion"
    rule: "Reconcile S_fuel, usable returns, nonreturned unburned waste/loss and burned activity separately. A nonreturned spill or fuel waste retains its upstream supply burden even when it emits no combustion CO2; no burned-only upstream input or duplicate return deduction is allowed."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset; downstream process/lifecyclemodel projection of the foreground repair package"
  allowed_use: "Declared single-defect exposed cast-iron local potable-main clamp repair subset with matching route/quality/gate qualifiers"
  excluded_use: "Whole pipeline construction/operation; live-pressure or tapping/coupling route; pipe replacement; unsupported life or watertightness equivalence; unaccepted work"
  required_metadata: "Unique repair and defect IDs; local potable-water main function; retained cast-iron OD, condition and supported defect extent; actual single-section clamp SKU/range/length/gasket and potable certification; authorised isolation/depressurisation; contamination classification and adopted authority/instruction editions; actual torque/retorque, pressure/leak and hygiene criteria/results/providers; gate and handback owners; reporting/job/asset periods."
  required_quality_disclosure: "Providers/interfaces, actual closure criteria/results, uncertainty, missing identities, measured versus calculated records, reject loops, stock/burden bridges, asset-life scenarios, temporal/geographical/technology coverage and excluded services"
  update_trigger: "Changed approved clamp/gasket/potable documents, host/defect/pressure, adopted hygiene authority, provider/boundary, evidence, asset scenario, supply mix or release criterion"
