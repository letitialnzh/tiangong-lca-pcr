          offset: 51809
          line: 697
          column: 1
      markdown: "## 7. Allocation and Co-product Handling\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `allocation_repair` | All repair-cycle resources | Attribute directly to unique repair ID where possible; setup, failed clamps, cleaning, retorque and repeated tests remain over accepted N. Do not create co-products, accepted counts or displacement credit from rejected work or recovered waste. |  |\n| `allocation_shared` | Shared crews, equipment and bounded providers | Identify all consuming jobs/nodes/periods and physical service driver; use measured driver shares that sum to the declared total. Reconcile shared-run setup, travel/empty return, hygiene and cleanup once. Purchased-provider bundles exclude duplicate direct resources. |  |\n| `allocation_asset_life` | `prep_assets`; `install_assets` | Allocate complete-life burdens by evidenced target service divided by total compatible life service across all jobs/nodes/periods. Observed completed life or justified prospective in-service remaining service/replacement/termination/EOL scenario with uncertainty and updates is required; missing denominator or life coverage blocks finalisation. No default lifetime or future observed retirement requirement. |  |\n| `allocation_stock` | Supplies, returns and retained stock | Gross input exchanges precede actual outward returns. Closing retained stock is a balance with carried-forward upstream burden, never an outward exchange. Opening stock brings its evidenced carried-in burden; purchase receipt/internal issue are alternative boundaries, not duplicates. Keep separate SKU-count and material-mass ledgers. Reconcile receipt or issue against final retained installation/destinations, real outward returns, captured waste, actual releases and closing stock. Final retained destinations exclude separately logged losses/outlets; dosed/used activity is intermediate, not another additive outlet. Reconcile upstream burden on that same custody basis. |  |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 170
              line: 8
              column: 1
            end:
              offset: 262
              line: 8
              column: 93
          text: "# Existing exposed cast-iron local water-main full-circle repair-clamp installation services"
