          name: "Actual supplied pressure-test flushing and hygienic closure water"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Include actual separately supplied water for pressure/leak testing, flushing, disinfection and sampling displacement through the declared gate. Separately record post-start drained main water as host-content contribution, not a second purchased-water input. Range evidence need: Actual meters, source/quality, test/flush records, drains, custody and provider bundle scope required; no nominal pipe volume or automatic flushing exemption."
          amount:
            expression: "Measured supplied net water mass per N; volume-to-mass only with actual density/temperature/state; retain repeat-test and repeat-flush quantities."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
