      rule: "Accept exposed secured retained cast iron only after actual OD/defect/condition and clamp compatibility review; clean dirt/corrosion from the intended seal area without inventing new pipe input. Job-caused damage/remedy belongs its actual owner and blocks handoff until resolved."
