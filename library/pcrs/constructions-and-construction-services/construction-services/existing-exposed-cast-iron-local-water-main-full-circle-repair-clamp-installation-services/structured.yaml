          role: "Accepted single-defect full-circle clamp repair installation on an existing exposed cast-iron local potable-water main"
          name: "Accepted single-defect full-circle clamp repair installation on an existing exposed cast-iron local potable-water main"
          flow_type: "product"
          property_unit: "Count / item"
          description: "Only a unique final intervention with approved fit, flat clean gasket, actual staged torque/retorque, passed mechanical/hygienic criteria, closed defects and signed bounded repair release counts. Explicit authorised reinstatement/utility return-to-service owners remain in handback metadata. N unique accepted final repair IDs divided by N equals 1 item; N positive. Rejected clamp/test, repeated attempts, bolts and clamp sections add no accepted output. Range evidence need: Actual signed acceptance register and actual required closure results/providers establish N and the exact reference; no numerical performance/life range is imposed."
          amount:
