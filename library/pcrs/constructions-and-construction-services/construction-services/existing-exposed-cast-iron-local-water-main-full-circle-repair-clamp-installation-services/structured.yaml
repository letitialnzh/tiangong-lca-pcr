          amount:
            expression: "Meter difference times actual multiplier and target node share divided by N."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_i_utilities
              source_ids: []
