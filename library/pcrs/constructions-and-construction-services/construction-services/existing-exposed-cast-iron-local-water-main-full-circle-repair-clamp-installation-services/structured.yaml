          name: "Actual complete single-section stainless full-circle repair-clamp assembly with compatible gasket"
          flow_type: "product"
          property_unit: "Count / item"
          description: "Actual factory clamp assembly with shell/bolts/armour/gasket and included coatings/packaging crosses supplier gate once. Record SKU, certified size/range, overlap/defect suitability and actual potable documentation; SBR is the cited standard compound, not assumed EPDM. Range evidence need: Actual SKU count, approved BOM/supplier gate and package scope required; site/PDF shell-gauge discrepancy prevents default composition/mass; NSF61/372 upon request is not proof for every SKU."
          amount:
            expression: "Gross actual complete supplied assembly count per N before outward returns; separate actual replacement parts only if outside the bundled assembly."
