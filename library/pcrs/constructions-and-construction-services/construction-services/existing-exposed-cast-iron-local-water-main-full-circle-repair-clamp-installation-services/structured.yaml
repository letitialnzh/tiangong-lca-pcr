  []
measurement_rules:
  - id: measure_repair_count
    applies_to: "accepted_repair; reference flow"
    required_property_ref:
      name: "Count"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Count unique signed final repair IDs N; N must be positive. Bolts, clamp sections, attempts and main length are not accepted interventions; retain failed/repeated burdens over N."
  - id: measure_transfer
    applies_to: "qualified_host; host_to_install; retained_host"
    required_property_ref:
      name: "Count"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Pair one qualified retained-host handoff per unique defect ID and transfer ID; repeated preparation is a loop, not extra host manufacture or final accepted count."
  - id: measure_physical
    applies_to: "Material, water, fuel, residual and freight rows"
    required_property_ref:
      name: "Actual verified exchange property"
      uuid: ""
    required_unit: "Actual verified exchange unit"
    rule: "Use calibrated net contents after tare, gross before outward returns; actual density/state/temperature for volume-to-mass and actual load/distance for freight. Do not infer mass from count, nominal pipe diameter, shell gauge or design envelope."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: prepare_host
    name: "Prepare and qualify retained exposed host"
    inclusion: "required"
    inclusion_condition: "Every intervention at declared start"
    role: "Independent cleaning/qualification responsibility; retained host to clean compatible seal-seat handoff"
    quantitative_reference: "Unique qualified defect handoffs; final burden normalized over accepted repair count N"
  - id: install_accept
    name: "Install clamp and complete repair acceptance"
    inclusion: "required"
    inclusion_condition: "Qualified host and actual compatible factory clamp"
    role: "Assembly/integration, torque, mechanical and hygienic closure; signed repair handback"
    quantitative_reference: "Accepted unique intervention count N"
