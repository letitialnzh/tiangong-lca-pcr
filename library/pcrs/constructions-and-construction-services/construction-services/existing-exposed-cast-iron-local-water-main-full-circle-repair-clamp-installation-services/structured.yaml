          property_unit: "Mass / kg"
          description: "Supplied water used for host cleaning and included hygienic protection crosses at the actual supply gate. Utility-owned drainage after start is separately measured from added water; do not charge pre-start operational leakage. Range evidence need: Actual meter/scale, water quality, density/temperature for conversion and provider boundaries are required; no fixed flush volume."
          amount:
            expression: "Measured supplied water mass per N; actual metered volume times evidenced density at measured state/temperature only when mass is unavailable."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
