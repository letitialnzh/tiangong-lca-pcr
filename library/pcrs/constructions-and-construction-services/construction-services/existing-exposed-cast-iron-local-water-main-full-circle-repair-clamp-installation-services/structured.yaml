allocation_rules:
  - rule_id: allocation_repair
    applies_to: "All repair-cycle resources"
    rule: "Attribute directly to unique repair ID where possible; setup, failed clamps, cleaning, retorque and repeated tests remain over accepted N. Do not create co-products, accepted counts or displacement credit from rejected work or recovered waste."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "Shared crews, equipment and bounded providers"
    rule: "Identify all consuming jobs/nodes/periods and physical service driver; use measured driver shares that sum to the declared total. Reconcile shared-run setup, travel/empty return, hygiene and cleanup once. Purchased-provider bundles exclude duplicate direct resources."
    source_ids: []
  - rule_id: allocation_asset_life
    applies_to: "prep_assets; install_assets"
    rule: "Allocate complete-life burdens by evidenced target service divided by total compatible life service across all jobs/nodes/periods. Observed completed life or justified prospective in-service remaining service/replacement/termination/EOL scenario with uncertainty and updates is required; missing denominator or life coverage blocks finalisation. No default lifetime or future observed retirement requirement."
    source_ids: []
  - rule_id: allocation_stock
    applies_to: "Supplies, returns and retained stock"
    rule: "Gross input exchanges precede actual outward returns. Closing retained stock is a balance with carried-forward upstream burden, never an outward exchange. Opening stock brings its evidenced carried-in burden; purchase receipt/internal issue are alternative boundaries, not duplicates. Keep separate SKU-count and material-mass ledgers. Reconcile receipt or issue against final retained installation/destinations, real outward returns, captured waste, actual releases and closing stock. Final retained destinations exclude separately logged losses/outlets; dosed/used activity is intermediate, not another additive outlet. Reconcile upstream burden on that same custody basis."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_p_host
      process_id: "prepare_host"
      flow_role: "retained/qualified host and accepted repair state"
      record_type: "inspection_and_acceptance_record"
      raw_fields: "repair_id; defect_id; work_order_id; event_id; node_id; period_id; provider_id; bundle_scope; accepted_count_N; transfer_id; pipe_OD_mm; host_condition; defect_extent_mm; pipe_material; local_main_function; isolation_record; depressurisation_record; hygiene_authority_edition; contamination_class; clamp_SKU; gasket_compound; potable_document; torque_instruction_edition; torque_values_units; retorque_times; pressure_test_criterion_units; pressure_test_result; hygiene_criteria; sample_result; closure_owner; reinstatement_owner; utility_release_owner; acceptance_status; acceptance_signature; gate_time"
      collection_method: "Verify actual utility-authorised starting condition, qualified handoffs and final release against approved current product and adopted-authority instructions; pair transfer IDs and deduplicate unique final accepted repair IDs. Retain failed/repeated event links."
      unit: "item"
      frequency: "Every defect, transfer, attempt and final gate"
      temporal_coverage: "Declared work-order start through accepted gate including loops; reporting/asset periods linked"
      site_scope: "Actual repair site and declared provider/supply gates; external interfaces named"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed inspection, actual SKU/approval/torque/pressure/hygiene results and explicit owners; no paper-only future closure"
    - protocol_id: cp_p_materials
      process_id: "prepare_host"
      flow_role: "supplies returns stock and upstream burden custody"
      record_type: "lot_custody_record"
      raw_fields: "repair_id; defect_id; work_order_id; event_id; node_id; period_id; provider_id; bundle_scope; accepted_count_N; lot_id; product_identity; formulation; concentration_value; concentration_basis; SKU; quantity_count; gross_mass_kg; tare_kg; net_mass_kg; volume_L; density_kg_per_L; temperature_C; physical_state; opening_stock_count; closing_stock_count; receipts_count; final_retained_count; outward_returns_count; discarded_count; opening_stock_kg; opening_burden_reference; receipts_kg; issues_kg; dosed_activity_kg; final_retained_destination_kg; outward_returns_kg; waste_kg; whole_release_kg; closing_stock_kg; closing_burden_reference; receiver; return_acceptance; upstream_gate"
      collection_method: "Weigh actual net contents after tare before real outward returns; retain actual count per clamp SKU. Reconcile receipt or issue boundary, opening burden and closing carried burden; match real return tickets. Actual chemical formulation/concentration/compatibility needed before concrete exchanges."
      unit: "kg; item; L"
      frequency: "Every lot, issue, return, use and period stock closure"
      temporal_coverage: "Declared work-order start through accepted gate including loops; reporting/asset periods linked"
      site_scope: "Actual repair site and declared provider/supply gates; external interfaces named"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated weights, SKU/BOM and actual pack mass; custody and stock/burden bridge; no webpage-gauge-derived mass"
    - protocol_id: cp_p_water
      process_id: "prepare_host"
      flow_role: "supplied water and post-start host-content drainage"
      record_type: "water_meter_record"
      raw_fields: "repair_id; defect_id; work_order_id; event_id; node_id; period_id; provider_id; bundle_scope; accepted_count_N; source_id; water_quality; meter_id; meter_start; meter_end; meter_multiplier; meter_unit; supplied_volume_m3; supplied_mass_kg; density_kg_per_m3; temperature_C; physical_state; post_start_drained_mass_kg; rain_contribution_kg; retained_host_moisture_kg; waste_fluid_mass_kg; direct_fluid_release_kg; returned_water_kg; retained_water_kg; measurement_uncertainty"
      collection_method: "Read source/use meters or scales for each preparation/test/flush/disinfection event; keep supplied water separate from actual post-start drained host contents and evidenced weather/moisture. Reconcile fluid receivers and provider bundles."
      unit: "kg; m3"
      frequency: "Every water use/drain/test/retest event"
      temporal_coverage: "Declared work-order start through accepted gate including loops; reporting/asset periods linked"
      site_scope: "Actual repair site and declared provider/supply gates; external interfaces named"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated meters, actual density for mass conversion, quality/source and outlet records; pre-start leakage excluded"
    - protocol_id: cp_p_utilities
      process_id: "prepare_host"
      flow_role: "electricity fuel and direct combustion"
      record_type: "meter_and_fuel_record"
      raw_fields: "repair_id; defect_id; work_order_id; event_id; node_id; period_id; provider_id; bundle_scope; accepted_count_N; energy_source; equipment_id; meter_start_kWh; meter_end_kWh; meter_multiplier; node_share; fuel_identity; gross_fuel_kg; fuel_volume_L; density_kg_per_L; temperature_C; physical_state; opening_fuel_kg; closing_fuel_kg; unburned_return_kg; captured_unburned_waste_kg; whole_uncontained_fuel_kg; incident_total_spill_kg; burned_fuel_kg; fuel_boundary_choice; substance; emission_factor_kg_per_kg_fuel; factor_source; factor_scope; abatement; measured_emission_kg; receiver_medium"
      collection_method: "Meter actual energy by node/event and reconcile fuel stock, gross/consumed boundary and mutually exclusive unburned outlets. Incident total spill audits its partitions only. Direct combustion uses actual compatible factor or species measurement; included provider/energy emissions are excluded."
      unit: "kWh; kg; L"
      frequency: "Every meter/fuel interval and emission basis"
      temporal_coverage: "Declared work-order start through accepted gate including loops; reporting/asset periods linked"
      site_scope: "Actual repair site and declared provider/supply gates; external interfaces named"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration, fuel density/state, stock/outlet logs, actual factor applicability and species/receiver evidence"
    - protocol_id: cp_p_assets
      process_id: "prepare_host"
      flow_role: "complete-life assets and shared-node attribution"
      record_type: "asset_life_service_record"
      raw_fields: "repair_id; defect_id; work_order_id; event_id; node_id; period_id; provider_id; bundle_scope; accepted_count_N; asset_id; manufacture_burden_reference; maintenance_events; replacement_events; termination_scenario; EOL_burden_reference; operation_exclusions; service_driver_unit; target_node_service; all_consumers; consumer_periods; observed_life_service; prospective_remaining_service; complete_life_service; scenario_source; forecast_observed_labels; uncertainty; sensitivity; update_date"
      collection_method: "For each reusable asset enumerate all node/job/period consumers and manufacture/maintenance/replacements/EOL coverage. Scale by measured compatible target service share; observed completed lives or justified prospective in-service remaining-life scenarios, labelled forecast/observed, are permitted."
      unit: "item; actual compatible service-driver unit"
