          role: "Retained exposed secured cast-iron local potable-main defect at repair start"
          name: "Retained exposed secured cast-iron local potable-main defect at repair start"
          flow_type: "product"
          property_unit: "Count / item"
          description: "State/interface flow for the already existing host, not a purchase or new-main manufacture. Actual localised defect, OD, condition, security, isolation/depressurisation and access/contamination responsibility must qualify the start. Range evidence need: Actual defect/host register and eligibility records establish the unique event count; there is no default pipeline length, clamp count or defect density."
