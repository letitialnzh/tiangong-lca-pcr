          property_unit: "Count / item"
          description: "Only complete unused assemblies actually transferred outward and accepted by their recipient as products count. Disaggregate actual SKU and quantity; match original gross complete_clamp inputs and burden custody. Retained stock and discarded/rejected used clamps are not unused complete-clamp product returns. Range evidence need: Actual return ticket, recipient acceptance, SKU, intact state and counted assemblies required; no default clamp mass/BOM/shell gauge or count-to-mass conversion."
          amount:
            expression: "Actual accepted outward complete-assembly count per SKU divided by N; no netting from the gross clamp input followed by another output charge. If downstream actually needs mass, use only actual matching measured SKU net mass kg/item and a separately documented conversion."
            value_mode: "foreground_record"
            specificity: "site_specific"
