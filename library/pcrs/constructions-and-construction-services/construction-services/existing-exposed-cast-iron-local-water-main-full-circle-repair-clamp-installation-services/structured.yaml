          name: "Actual purchased electricity for preparation equipment"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Record actual preparation/cleaning/pumping equipment electricity at the real supplier/connection gate when separately supplied; provider-included electricity is not charged again. Range evidence need: Actual electricity source, meter periods, equipment/consumer scope and verified concrete exchange support required; no assumed duration or kWh per repair."
          amount:
            expression: "Meter difference after actual multiplier and node allocation divided by N."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
