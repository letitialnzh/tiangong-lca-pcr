          name: "Actual collected preparation wastewater sent to treatment"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Collected cleaning/drainage fluids delivered to an actual sewer/treatment receiver are waste transfers, including their actual contamination and water content; no direct-release row for the same captured fluid. Range evidence need: Actual receiver, fluid quantity, sampling and route evidence required; contaminant sum is not whole-fluid quantity."
          amount:
            expression: "Actual transferred whole-fluid net mass per N; actual metered volume requires recorded density/temperature/state."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
