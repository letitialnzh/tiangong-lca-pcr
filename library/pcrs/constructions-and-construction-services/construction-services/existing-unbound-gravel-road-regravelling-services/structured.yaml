allocation_rules:
  - rule_id: single_repair
    applies_to: "accepted_regravelling"
    rule: "One intended final repair service; rejected chainages are not accepted output. Retain all actual failed passes, rework, retests and their resources in the eventual accepted repair; no avoided-new-road or substitution credit."
    source_ids: []
  - rule_id: asset_attribution
    applies_to: "prep_plant; finish_plant"
    rule: "Use actual asset logs to enumerate consuming nodes, other jobs and reporting periods. Allocate complete-life manufacture, maintenance/replacement and end-of-life burdens using justified measured service/utilization over the documented service boundary; retain idle/mobilization attribution and termination assumptions. Event/asset IDs have one owner. Provider service coverage and separately modelled plant/fuel must not overlap. Completed asset lives use observed historical service. An in-service asset may use evidence-based prospective remaining service, replacement/termination and end-of-life scenarios: distinguish forecasts from observations, disclose the complete-life utilization denominator, source, uncertainty/sensitivity and update trigger. Do not invent a future retirement date or default lifespan; missing justified full coverage or denominator, rather than continued operation, is the data gap."
    source_ids: []
  - rule_id: period_custody
    applies_to: "all inventory rows"
    rule: "Link receipts/issues, host handoff, rework, returns, acceptance and asset replacements/termination to dated periods. Reconcile opening plus gross receipts with installation, outward returns/waste, measured losses and closing stock. Carry stock and its burden into later periods once; never net a return then record it again as outward flow."
    source_ids: []
  - rule_id: outward_material
    applies_to: "host_surplus; aggregate_return; prep_removed_waste; rejected_layer"
    rule: "Classify each actual outward lot by legal custody and destination: usable product return/surplus versus waste versus actual environmental release. Recovery or sale does not establish automatic coproduct credit; disclose any chosen allocation with evidence and keep burdens/transport ownership closed."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_prep_plant
      process_id: "prepare_host"
      flow_role: "Actual road-preparation plant and tool service"
      record_type: "Actual site/supplier record"
      raw_fields: "asset_id; provider; task; event_id; start_time; end_time; service_hours_h; idle_hours_h; other_job_consumers; period; manufacture_maintenance_replacement_end_of_life_scope; utilization_denominator; attribution_share"
      collection_method: "Use meter/job logs and provider scope; enumerate this node, finishing and other contracts/periods, then attribute complete-life service consistently with asset_attribution."
      unit: "h"
      frequency: "Every event/lot and all repeated operations"
      temporal_coverage: "Complete bounded repair campaign, linked reporting dates"
      site_scope: "Actual declared chainages and responsible provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Retain full life phase evidence, replacement/termination decisions and single ownership of fuel/plant service; Duration support still requires confirmation. Completed asset lives use observed historical service. An in-service asset may use evidence-based prospective remaining service, replacement/termination and end-of-life scenarios: distinguish forecasts from observations, disclose the complete-life utilization denominator, source, uncertainty/sensitivity and update trigger. Do not invent a future retirement date or default lifespan; missing justified full coverage or denominator, rather than continued operation, is the data gap."
    - protocol_id: cp_prep_fuel
      process_id: "prepare_host"
      flow_role: "Actual preparation-machine fuel by supplied grade"
      record_type: "Actual site/supplier record"
      raw_fields: "fuel_grade; asset_id; period; opening_kg; gross_issues_kg; closing_kg; other_job_kg; density_kg_per_m3; temperature_C; fuel_service_owner; outward_return_kg; outward_transfer_kg; transfer_owner; spill_kg; spill_medium_or_waste_receiver; spill_treatment; actual_consumed_kg"
      collection_method: "Reconcile issues, tanks and job meter logs; attribute actual shared consumption to this node once, retaining calibration and conversion evidence. Close opening stock plus gross issues against actual consumption, closing stock, true outward return/transfer and spilled material. Link every actual return/transfer/spill to a separate real product/waste/elementary exchange as its actual custody requires; never include that mass in combustion."
      unit: "kg"
      frequency: "Every event/lot and all repeated operations"
      temporal_coverage: "Complete bounded repair campaign, linked reporting dates"
      site_scope: "Actual declared chainages and responsible provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Fuel receipts and measured density; no default consumption or combustion factor. No missing disposition treated as consumed fuel; record unresolved balance gap."
    - protocol_id: cp_prep_electricity
      process_id: "prepare_host"
      flow_role: "Actual preparation electricity supply"
      record_type: "Actual site/supplier record"
