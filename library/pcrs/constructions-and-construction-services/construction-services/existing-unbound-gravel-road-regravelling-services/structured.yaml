boundary_abstraction:
  declared_starting_condition: "Qualified existing unbound natural-gravel road, with recorded distress, crown/drainage and structural suitability; supplied new aggregate at its declared upstream gate"
  starting_condition_role: "Retained host and its on-site stock, not newly procured aggregate or a newly constructed road output"
  product_classification_scope: "Bounded repair subset of non-elevated road construction service; no automatic whole-road construction scope"
  recursive_input_rule: "A prior road repair dataset may document retained condition but is not a new same-category purchase. Record actual subcontracted preparation at its real interface once, with an explicit owner and included/excluded burdens."
  upstream_dataset_requirement: "Actual aggregate supply, energy, logistics and plant/support data at matching gates and units, with coverage of production and relevant lifecycle burdens; missing coverage remains a data gap"
  disclosure: "Declare repair chainages/periods, retained host boundary, drainage ownership, supplier haul coverage, actual rework/exits, stock carry-forward and plant lifecycle attribution; no avoided-replacement credit"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted existing unbound gravel-road regravelling repair service"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "Road ID"
    - "exact chainages/width/area"
    - "initial structural and surface condition"
    - "specified crown/drainage"
    - "aggregate source"
    - "natural origin"
    - "grading/plasticity and received moisture"
    - "actual spread/finished layer geometry and density test basis"
    - "actual water/roller method"
    - "acceptance criteria source/tolerances/results"
    - dates
    - "weather and signed repair handover"
reference_flows:
  []
measurement_rules:
  - id: counted_contract
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: ""
    required_unit: "item"
    rule: "Use 1 item only for the declared accepted contract segment, never one kilometre or one tonne of gravel. Record actual area, length, thickness and acceptance under cp_accepted_regravelling; geometry intensities are derived disclosures."
  - id: aggregate_state
    applies_to: "new_aggregate; aggregate_return; rejected_layer"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep received gross wet mass, installed material, actual return and closing stock separately; record moisture and any dry-mass conversion from the same lot. Loose volume is not finished volume; measure density/state before conversion."
  - id: native_service_units
    applies_to: "prep_plant; finish_plant; aggregate_haul; finish_water_product; finish_water_abstraction; prep_electricity; finish_electricity"
    required_property_ref:
      name: "Actual native property"
      uuid: ""
    required_unit: "h; tkm; m3; kWh"
    rule: "Keep actual duration, freight, water-volume and electricity units; verify their support chains before dataset binding. Volume-to-mass requires measured lot water/material density with temperature and moisture basis; no count surrogate, universal shrinkage, fuel or emissions factor."
  - id: receipt_mass_basis
    applies_to: "new_aggregate; host_surplus; prep_removed_waste; aggregate_return; rejected_layer"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For receipts/issues and outward dispatch, gross means total material before netting returns or other outward transfers, after removing vehicle/container tare. Where gross_kg and tare_kg record weighed vehicle/container and tare, subtract tare_kg from gross_kg to obtain material mass for the balance; never enter gross vehicle mass as material. Retain scale accuracy and matched moisture/state."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: prepare_host
    name: "Scarify, reshape and prepare retained road"
    inclusion: "required"
    inclusion_condition: "Qualified existing host requires documented preparation before new layer"
    role: "Independent forming responsibility: distressed existing road geometry to accepted scarified/reshaped crown and drainage handoff"
    quantitative_reference: "Same actual contract chainages and prepared area"
  - id: regravel_finish
    name: "Place and finish new unbound wearing layer"
    inclusion: "required"
    inclusion_condition: "After preparation gate; actual water/roller operations when method calls for them"
    role: "Surface finishing on retained prepared parent: gross aggregate delivery, embedded equalizing/spreading, actual compaction and accepted repair"
    quantitative_reference: "1 item accepted chainage-bounded repair"
process_inventory:
  - id: prepare_host
    label: "Scarify, reshape and prepare retained road"
    inputs:
      product:
        - row_id: prep_electricity
          role: "Actual preparation electricity supply"
          name: "Actual preparation electricity supply"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Include actual metered purchased electricity for this node when used, separately by supply and without duplicating plant/provider coverage. Range evidence need: Collect campaign electricity interval from meters/job records with meter accuracy and allocation; no assumed grid or consumption."
          amount:
            expression: "Actual attributable metered electricity; documented no-use when absent; cp_prep_electricity."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_prep_electricity
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: prepared_host
          role: "Prepared existing road at regravelling handoff"
          name: "Prepared existing road at regravelling handoff"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "This internal in-situ host interface retains original road identity and material; it is not new road production, a purchased road or a second final repair. Range evidence need: Obtain actual gate counts, segment geometry and survey/inspection uncertainty; an observed count ratio of one is not a generic intermediate-quantity bound."
          amount:
            expression: "Actual independently recorded approved host handoff count for the declared segment/state divided by the positive accepted contract-segment count N_host; pair the same transfer IDs and state at both nodes. A same-segment ratio of one requires actual gate evidence, never default assignment from final output."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_prepared_host
              source_ids:
                - fhwa-gravel-2015
            ranges: []
      waste:
        []
      elementary:
        []
  - id: regravel_finish
    label: "Place and finish new unbound wearing layer"
    inputs:
      product:
        - row_id: host_to_finish
          role: "Prepared existing road received for new wearing layer"
          name: "Prepared existing road received for new wearing layer"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "The same retained in-situ segment is received across the internal preparation gate; it carries actual preparation burdens once and no new whole-road construction charge. Range evidence need: Independently establish linked actual handoff count/state, transfer survey uncertainty and gate tolerances; never assume acceptance or a quantity equal to the final reference."
          amount:
            expression: "Actual independently recorded approved host handoff count for the declared segment/state divided by the positive accepted contract-segment count N_host; pair the same transfer IDs and state at both nodes. A same-segment ratio of one requires actual gate evidence, never default assignment from final output."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_host_to_finish
              source_ids:
                - fhwa-gravel-2015
            ranges: []
        - row_id: new_aggregate
          role: "Actual specified natural wearing-course aggregate at supply gate"
          name: "Actual specified natural wearing-course aggregate at supply gate"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Each actual natural quarried/crushed or gravel aggregate lot must match its supplied grading/origin/moisture and wearing-course use; do not replace it with a quarry excavation or asphalt flow. Range evidence need: Collect lot receipt/issue mass interval, moisture, loose/placed density and specified grading/plasticity limits; FHWA shrinkage/thickness examples are not defaults."
          amount:
            expression: "Gross actual received mass by supplier/lot, before returns; cp_new_aggregate."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_new_aggregate
              source_ids:
                - fhwa-gravel-2015
            ranges: []
        - row_id: finish_water_product
          role: "Actual purchased water for moisture conditioning"
          name: "Actual purchased water for moisture conditioning"
          flow_type: "product"
          property_unit: "Volume / m3"
          description: "Only externally supplied water crosses as a product input; distinguish its source/treatment and any included supply transport from actual environmental abstraction and internal reuse. Range evidence need: Collect metered purchased-volume interval, accuracy and actual distribution losses; any kg conversion requires actual density/temperature."
          amount:
            expression: "Gross actual purchased water volume issued to this repair; cp_finish_water_product."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_finish_water_product
              source_ids:
                - fhwa-gravel-2015
            ranges: []
        - row_id: finish_electricity
          role: "Actual layer-finishing electricity supply"
          name: "Actual layer-finishing electricity supply"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Meter actual electricity used in finishing/testing when present, by supply and coverage; do not duplicate provider included electricity. Range evidence need: Collect measured kWh interval and allocation uncertainty; no assumed grid mix or area factor."
          amount:
            expression: "Actual attributable metered electricity; documented non-use if absent; cp_finish_electricity."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_finish_electricity
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_regravelling
          role: "Accepted existing unbound gravel-road regravelling repair service"
          name: "Accepted existing unbound gravel-road regravelling repair service"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "The actual chainage-bounded repair is complete at signed handover on the retained host, with specified new natural wearing layer and closed defects. No new complete road or future traffic service is produced. Range evidence need: The one-accepted-segment definition is exact; collect geometry, density/moisture, material and acceptance-test intervals and specified tolerances. No universal layer thickness or road-life interval."
