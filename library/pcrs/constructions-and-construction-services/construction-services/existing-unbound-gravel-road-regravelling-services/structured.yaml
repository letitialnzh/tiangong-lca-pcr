product_category_identity:
  canonical_pcr_id: "pcr.existing-unbound-gravel-road-regravelling-services"
  classification_refs: "cpc:3.0:54211; narrower repair subset; classification does not establish product identity"
  covered_products: "Accepted natural-gravel wearing-layer repair of a qualified existing unbound road segment"
  excluded_products: "New roads and structural rebuilding; bound or chemically treated surfacing; recycled-asphalt route; subsequent traffic/maintenance"
  representative_product: "One specified chainage-bounded road segment repaired and accepted after substrate preparation and regravelling"
  production_route: "Retained host qualification → scarification/reshaping and drainage preparation gate → gross natural aggregate delivery, windrow/equalize/spread → actual moisture/roller operations → geometry, material and compaction acceptance"
  market_state: "Completed site-specific repair service at signed client handover; existing road remains in situ"
functional_unit:
  what: "Accepted existing unbound gravel-road regravelling repair service"
  how_much: "1 item: one actual repair contract segment with declared chainages, width and treated area; different segment sizes are not equivalent items"
  how_well: "Host qualifies; prepared crown/drainage accepted; specified aggregate grading/plasticity/moisture, uniform layer and actual contract geometry/compaction criteria met, defects closed"
  how_long_or_cycle: "One bounded repair campaign from site qualification through signed handover; declare start/end dates, every reporting period, and preparation/placement/rework phases. No promised future traffic life"
  reference_flow_link: "accepted_regravelling"
system_boundary:
  rules:
    - rule_id: bounded_host
      applies_to: "prepare_host"
      rule: "Original host construction is outside this incremental repair. Include actual scarification, reshaping, relevant drainage correction and handling/removal; on-site retained material is not a free purchased input or negative waste."
      source_ids:
        - fhwa-gravel-2015
    - rule_id: physical_gates
      applies_to: "prepare_host; regravel_finish"
      rule: "Preparation hands off the same identified in-situ road only after crown/drainage and distress correction meet actual criteria. Placement finishes the new layer on that parent state. Records/receipts are evidence, not additional process outputs."
      source_ids:
        - fhwa-gravel-2015
    - rule_id: supply_ownership
      applies_to: "regravel_finish"
      rule: "Include upstream specified aggregate production and all actual inbound/return/waste and equipment/water logistics once under the whole-repair lead ledger. Do not repeat quarry processing or supplier-included haul as foreground operation. Receipts are gross; retain closing stock with carried-forward burden, separate true outward returns."
      source_ids:
        - fhwa-gravel-2015
    - rule_id: asset_boundary
      applies_to: "prep_plant; finish_plant"
      rule: "For each shared grader, roller, bowser and traffic-control tool identify both nodes and other jobs/reporting periods. Cover manufacture, mobilization, use/maintenance, replacement and end-of-life through actual provider scope or a complete-life asset ledger; disclose gaps instead of assigning an arbitrary lifetime."
      source_ids: []
    - rule_id: water_release
