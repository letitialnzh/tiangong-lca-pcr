    inclusion_condition: "After preparation gate; actual water/roller operations when method calls for them"
    role: "Surface finishing on retained prepared parent: gross aggregate delivery, embedded equalizing/spreading, actual compaction and accepted repair"
    quantitative_reference: "1 item accepted chainage-bounded repair"
