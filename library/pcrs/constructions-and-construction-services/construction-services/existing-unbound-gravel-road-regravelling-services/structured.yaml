  calculation_rules:
    - id: repair_normalization
      applies_to: "all inventory rows"
      rule: "Sum unique node-owned physical events including rework for this accepted contract segment; express amounts per reference flow. The regravel_finish lead logistics ledger owns each leg once through its producing-node/leg-owner matrix. Internal host transfers are paired, not duplicated final output."
      inputs:
        - "Node event IDs"
        - "contract acceptance"
        - "all node protocols"
      output: "Exchange amounts for the one declared accepted repair"
      source_ids: []
    - id: aggregate_reconcile
      applies_to: "new_aggregate; aggregate_return; rejected_layer"
      rule: "Reconcile opening stock plus gross receipts with installed material, actual outward usable returns, outward waste, supported losses and closing stock at matched moisture/state. Derive loose/compacted volume only with actual density; FHWA examples are not conversion factors."
      inputs:
        - cp_new_aggregate
        - cp_aggregate_return
        - cp_rejected_layer
        - "actual density/moisture tests"
      output: "Lot-specific material balance and carried-forward stock burden"
      source_ids:
        - fhwa-gravel-2015
    - id: service_attribution
      applies_to: "prep_plant; finish_plant"
      rule: "Assign complete-life shared asset burdens to actual node/job/period service using measured utilization and justified idle/mobilization/termination treatment; retain one event owner and no overlap with separately modelled fuel/energy/haul."
      inputs:
        - cp_prep_plant
        - cp_finish_plant
        - "full asset lifecycle ledger"
        - "all consumers/periods"
      output: "Attributable plant service and coverage gaps"
      source_ids: []
    - id: fuel_consumption
      applies_to: "prep_fuel; finish_fuel"
      rule: "Actual consumed fuel is the balanced portion of opening stock plus gross issues after closing stock, true outward returns/transfers and actual spills. Model each real outward disposition by its custody and destination separately; consumption alone may drive combustion calculations."
      inputs:
        - cp_prep_fuel
        - cp_finish_fuel
        - "return/transfer/spill disposition records"
      output: "Actual grade-specific consumed exchange and separately owned exits"
      source_ids: []
    - id: emission_calculation
      applies_to: "prep_dust; prep_exhaust; finish_dust; finish_exhaust"
      rule: "Calculate species/fraction campaign mass from measured emission rate times actual activity duration, or actual applicable activity times a documented species/fraction-specific factor. Record method/factor source, units, applicability to actual machine/fuel/material/moisture/control and receiving medium, sampling/extrapolation and propagated uncertainty; derived totals are not direct measurement."
      inputs:
        - "Actual rate/duration or activity/factor and method reference"
        - "all four emission protocols"
      output: "Calculated actual campaign emissions with method/evidence gap disclosure"
      source_ids: []
    - id: water_balance
      applies_to: "finish_water_product; finish_water_abstraction; captured_runoff; finish_water_release"
      rule: "Reconcile purchased/abstracted water, stock changes, new aggregate incoming moisture, retained-host initial/final moisture and actual influential rainfall/external run-on with retained moisture, captured outflow and substantiated releases. Weather/material moisture are measured balance terms, not extra purchases/credits. Internal reuse is paired; any missing term is a gap, never automatic evaporation. Use actual density/temperature for kg conversion."
      inputs:
        - cp_finish_water_product
        - cp_finish_water_abstraction
        - cp_new_aggregate
        - cp_captured_runoff
        - cp_finish_water_release
        - "host moisture and actual weather/run-on evidence"
      output: "Pathway quantities with uncertainty and unmatched balance gaps"
      source_ids: []
  data_quality_requirements:
    - id: qualified_geometry
      applies_to: "prepared_host; accepted_regravelling"
      requirement: "Retain actual host qualification, pre-spread gate, final chainage/width/area/thickness/crown/drainage, material/moisture/density methods, units, criterion source and tolerances."
      evidence: "Survey/test/inspection and signed gate records"
    - id: complete_events
      applies_to: "all inventory rows"
      requirement: "Cover every lot/operation/period, include rework/retests, dated physical IDs and actual no-use declarations; no missing equals zero."
      evidence: "Dated ledgers, leg ownership matrix and closed defects"
    - id: honest_ranges
      applies_to: "all inventory rows"
      requirement: "Replace specific Range evidence needs with actual collection/calculation uncertainty before final dataset; exact counted definition does not establish material/energy/productivity range."
      evidence: "Measurement accuracy, actual sample ranges, method applicability"
    - id: real_identities
      applies_to: "all inventory rows"
      requirement: "Resolve each actual distinct material/provider/waste/species/property/unit chain before binding; native units and actual scope, no heterogeneous sum or near-match UUID."
      evidence: "Supplier/receiver/substance and verified support evidence"
    - id: full_asset_life
      applies_to: "prep_plant; finish_plant"
      requirement: "Complete manufacture, operation/maintenance/replacement and end-of-life/termination; all consumers/jobs/periods, measured utilization, actual provider coverage and gaps."
      evidence: "Complete-life provider/asset dossier"
    - id: uncertainty_coverage
      applies_to: "all inventory rows"
      requirement: "Document raw measurement/sampling and calculation uncertainty, density/moisture, stock/return/transfer/spill custody, actual emissions methods and attribution sensitivity. Retain actual aggregate/host moisture and weather/run-on balance terms and unmatched gaps."
      evidence: "Calibrations, actual tests, primary records, method references and scenario disclosures"
validation_rules:
  - rule_id: host_gate
    applies_to: "prepare_host"
    rule: "Require initial suitability, actual scarification/shape/drainage correction and accepted pre-spread gate. Reject missing drainage ownership or structural unsuitability for this route."
    source_ids:
      - fhwa-gravel-2015
  - rule_id: repair_gate
    applies_to: "accepted_regravelling"
    rule: "Verify actual chainages, natural aggregate source/gradation/plasticity/moisture, uniform finished geometry, actual specified compaction/quality tests, weather and signed handover; no universal thickness, shrinkage or future-life assumption."
    source_ids:
      - fhwa-gravel-2015
  - rule_id: balance_paths
    applies_to: "all inventory rows"
    rule: "Check gross received/issued material and water balances with uncertainty, retained host treatment, internal reuse, real outward custody and closing stock; no duplicate stock/return or burden. Resolve every defect/retest/rework path before counting accepted output."
    source_ids: []
  - rule_id: asset_periods
    applies_to: "prep_plant; finish_plant"
    rule: "Check full shared-asset phase coverage, all consumers/reporting periods, utilization denominator, replacements/termination and single event ownership; missing lifecycle/support coverage blocks dataset finalization."
    source_ids: []
  - rule_id: identity_range
    applies_to: "all inventory rows"
    rule: "Expand conditional material/service/waste/substance requirements into actual distinct exchanges. Verify exact flow/property/unit identities and actual numerical uncertainty evidence for each; never equate generic dust with a particle fraction or fuel with exhaust. Missing data is explicit, not zero."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for one accepted bounded regravelling repair, with process/lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset when gate/units and complete upstream scope match"
  allowed_use: "Incremental repair modelling for the declared qualified natural-gravel road and actual contract"
  excluded_use: "New complete roads, structural reconstruction, bound/recycled routes, future traffic operation, equivalent service life or avoided-replacement claims"
  required_metadata: "Reference qualifiers; actual two-node gates; gross supply and exit custody; dates/periods; source and transport coverage; asset consumers and complete-life boundary"
  required_quality_disclosure: "Measurement/uncertainty coverage; rejected/reworked chainages; missing identities/support and ranges; supplier coverage; lifecycle attribution and stock carry-forward"
  update_trigger: "Change in host suitability, repair limits, aggregate/source, approved placement/acceptance method, actual plant/coverage, drainage ownership or evidence"
data_sources:
  - id: "fhwa-gravel-2015"
    type: "official_guidance"
    reference: "Federal Highway Administration, Gravel Roads Construction and Maintenance Guide, August 2015, sections 3.18–3.21, printed pp.71–74. https://www.fhwa.dot.gov/construction/pubs/ots15002.pdf"
    used_for: "Preparation before fresh gravel; loose versus finished state; actual hauling/spread control; windrow/equalize/spread and actual water/roller operations. Illustrative quantities are not PCR defaults."
