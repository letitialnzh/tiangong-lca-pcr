        []
      elementary:
        []
allocation_rules:
  - rule_id: reject_burden
    applies_to: "install_accept"
    rule: "There is no intended co-product. Retain unsuccessful work, damaged inputs, corrective work and retesting with the original accepted job. Rework stays in install_accept; usable return and actual waste/recovery/discard exit need event, state and recipient. Unresolved rejects do not enter accepted output and returns receive no avoided-production credit."
    source_ids: []
  - rule_id: resource_share
    applies_to: "owned_equipment_attribution; hired_support_service"
    rule: "For exact resource r and job j, a_rj = A_rj / sum(A_rk), with every benefiting job k across the same resource lifecycle packet and a common causal physical activity basis. Require positive complete denominator and sum(a_rj) = 1. Attribute asset quantity a_rj / D item and burden B_r * a_rj / D. Record period-specific shares and their evidence; output-count allocation is inappropriate where use differs. Never invent lifetime or omit other jobs."
    source_ids: []
  - rule_id: phase_reconciliation
    applies_to: "install_accept"
    rule: "Tie resource manufacture/acquisition, every service/reporting period, maintenance/replacement and retirement/termination to identifiable packets, jobs and dates. Replacement has its own actual event; remaining-use uncertainty is explicit. Reconcile phase totals once and carry each packet only once; provider asset manufacture is not an additional installer input when a hired service includes it. Job-specific losses retain their job owner."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "install_accept"
      flow_role: "accepted installation and corrections"
      record_type: "job_acceptance"
      raw_fields: "job/configuration/model/rating; BOM; circuit/box/earth/design; isolation/proof-dead; termination/earth/polarity/function test results; failure/correction/retest events; dates; signature; independently counted D"
      collection_method: "Inspect actual scope and compatible interfaces; retain competent test and signed acceptance records and reconcile complete accepted jobs separately from components, attempts and rejects. Establish positive D from independent accepted complete installation count."
      unit: "item"
      frequency: "every job and retest"
      temporal_coverage: "receipt through signed acceptance"
      site_scope: "declared indoor fitting site/configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed tests; exclusion reconciliation; dates and configuration coverage"
    - protocol_id: cp_materials
      process_id: "install_accept"
      flow_role: "supplies, packaging and usable returns"
      record_type: "material_custody"
      raw_fields: "shipment/job/date; SKU/material/state; net mass; counts/lengths and matching factors; installed/stock/return/waste; receipt/return receiver; upstream manufacture/delivery/packaging inclusions"
      collection_method: "Weigh net quantities with calibrated equipment or use traceable matching-SKU conversion records; follow each source pool from receipt to installed retention, closing stock and original event-linked exits. Calculate actual attributable mass / D by SKU and state."
      unit: "kg"
      frequency: "every shipment and custody event"
      temporal_coverage: "opening stock through job closure"
      site_scope: "all supplies attributable to declared jobs"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; factor/SKU match; supplier boundary; receiver and residual ledger"
    - protocol_id: cp_energy
      process_id: "install_accept"
      flow_role: "supplied pre-handover electricity"
      record_type: "meter_record"
      raw_fields: "provider/voltage/site/meter; job/tool/charger/test/load; start/end kWh and dates; all shared consumers/activity; contract energy inclusions"
      collection_method: "Read actual meter differences at the declared boundary and attribute shared supply using recorded activity; preserve raw energy apart from rated power, Ah and elapsed time. Calculate attributable actual kWh / D."
      unit: "kWh"
      frequency: "every metered activity/period"
      temporal_coverage: "installation through acceptance only"
      site_scope: "declared meters and all benefiting consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration/resolution; inclusion ledger; complete activity denominator; Energy support gap"
    - protocol_id: cp_services
      process_id: "install_accept"
      flow_role: "owned assets and purchased support"
      record_type: "resource_lifecycle"
      raw_fields: "manufacturer/model/serial or provider/contract/event; ownership; reference unit; every consuming node/job and period; physical activity A_rj and complete sum(A_rk); manufacture/acquisition/service/maintenance/replacement/retirement packets; B_r; remaining use; energy inclusions"
      collection_method: "Reconcile exact asset and contract logs across all jobs and phases; record the actual causal share decision for each period and purchased complete event; distinguish hourly hire and unresolved Duration support. Calculate attributed resource fraction or complete event count / D."
      unit: "item"
      frequency: "every use, event and phase change"
      temporal_coverage: "entire resource packet, all service/reporting periods and termination"
      site_scope: "install_accept instances and every other benefiting job/period"
      aggregation_rule: "per reference flow"
      quality_evidence: "complete consumer list; positive activity denominator; share closure; provider ownership; remaining-life uncertainty"
    - protocol_id: cp_releases
      process_id: "install_accept"
      flow_role: "waste exits and direct-release evidence"
      record_type: "exit_record"
      raw_fields: "original issue/rework/job/date; material/SKU/state/hazard; waste/return ticket and recipient; net mass; captured/retained/emitted distinction; species/particle size/receiving medium; measured or justified method and uncertainty"
      collection_method: "Reconcile recipient tickets with original custody and defect events; collect relevant release evidence separately from captured waste and unexplained residuals, disclosing every closure gap. Calculate each attributable evidenced exit mass / D."
      unit: "kg"
      frequency: "every exit or evidenced release"
      temporal_coverage: "receipt/correction through closure, including an owned lifecycle event only when attributable"
      site_scope: "declared jobs and actual authorised receivers"
      aggregation_rule: "per reference flow"
      quality_evidence: "receiver tickets; calibrated mass; hazard/state evidence; release method; closure tolerance and gap"
  calculation_rules:
    - id: actual_normalization
      applies_to: "all nonreference inventory rows"
      rule: "q_i = N_i / D; N_i is independently collected attributable actual numerator in its own row unit; D is positive independently counted accepted complete same-configuration installations. Preserve raw N_i and its protocol; never solve N_i from a target reference quantity."
      inputs:
        - N_i
        - D
        - cp_acceptance
        - cp_materials
        - cp_energy
        - cp_services
        - cp_releases
      output: "q_i"
      source_ids: []
    - id: custody_closure
      applies_to: "receptacle; plate_and_fixings; incoming_packaging; unused_product_return; installation_waste"
      rule: "For each identifiable source pool, opening stock + receipts = installed retained material + closing stock + usable returns + actual waste + identified releases + residual. Document tolerance and residual; unresolved mass is a gap, not dust. Heterogeneous mass totals are diagnostic only."
      inputs:
        - cp_materials
        - cp_releases
      output: "pool closure and residual"
      source_ids: []
    - id: asset_attribution
      applies_to: "owned_equipment_attribution"
      rule: "a_rj = A_rj / sum(A_rk); attributed quantity = a_rj / D; attributed burden = B_r * a_rj / D. Apply resource_share to the complete lifecycle packet and retain every period-specific owner and phase total once."
      inputs:
        - A_rj
        - A_rk
        - B_r
        - D
        - cp_services
      output: "asset quantity and burden share"
      source_ids: []
  data_quality_requirements:
    - id: configuration_quality
      applies_to: "install_accept"
      requirement: "Match site, period, model, technical instructions, single-feed state, interfaces, BOM and acceptance. Do not transfer example product specs to all installations."
      evidence: "cp_acceptance; actual model/design records"
    - id: measurement_quality
      applies_to: "all inventory rows"
      requirement: "Keep calibration, traceable SKU-specific conversion, raw numerators and independent positive D. Missing data and conditional absence require evidence; no zero imputation."
      evidence: "all linked protocols and uncertainty ledger"
    - id: identity_quality
      applies_to: "all inventory rows"
      requirement: "Preserve actual function/state/gate, exact property/unit support and separate concrete exchanges; unsupported UUID, Energy/Duration and quantitative range evidence remain explicit gaps."
      evidence: "actual foreground identity and support records"
    - id: resource_quality
      applies_to: "cp_services"
      requirement: "Cover every consumer, period and phase; record causal decision, complete activity denominator, remaining-use uncertainty, share closure and unique burden ownership."
      evidence: "serial/contract logs; lifecycle and inclusion packets"
validation_rules:
  - rule_id: scope_and_acceptance
    applies_to: "install_accept"
    rule: "Check the declared first-installation exclusions and prepared box/circuit/earth interfaces, actual model compatibility and every required qualifier; require signed termination/earth/polarity/function tests and completed correction/retest."
    source_ids:
      - leviton-receptacle-installation
      - leviton-5320-product
  - rule_id: reference_integrity
    applies_to: "accepted_installation"
    rule: "Check independently positive D, same-configuration equivalence, exclusion of unfinished/rejected work, and matching reference name, card id, property, unit and explicit 1 item output in both languages."
    source_ids: []
  - rule_id: custody_and_route
    applies_to: "install_accept"
    rule: "Check each actual SKU/state supply and installed/stock/return/waste/release closure, recipient and original producing event. Confirm correction remains linked to install_accept and every reject has a verified return, rework, recovery or discard route. No mixed identity, residual-as-pollutant or missing-record zero is permitted."
    source_ids: []
  - rule_id: shared_period_integrity
    applies_to: "install_accept"
    rule: "Verify exact asset/service, every consuming node/job and service/reporting period, acquisition/manufacture, maintenance/replacement and retirement/termination links, physical share decision and positive complete denominator. Check sum(a_rj) = 1 within each packet, reconcile period/phase totals once, and prevent repeated delivery, packaging, provider capital or test energy. Missing replacement/remaining-use/termination evidence blocks final attribution."
    source_ids: []
  - rule_id: evidence_completeness
    applies_to: "all inventory rows"
    rule: "Check collection/calculation/protocol links, actual numerator basis and fixed or unresolved identity/support counts. Report checks performed, skipped, findings and completeness separately from missing Range warnings; a structural check does not verify concrete UUIDs or resolve Energy/Duration and quantitative evidence gaps."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground fitting-installation package, with downstream process or lifecyclemodel projections."
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible first-installation scope, exact configuration, prepared interface and acceptance gate."
  excluded_use: "Whole-building equivalence; different termination/device routes; replacement; later operating electricity, maintenance or monitoring; lifetime/performance guarantees."
  required_metadata: "Site/time; exact model/configuration/BOM; interfaces/design/jurisdiction; quantity and positive D; test/acceptance; supply datasets; inventory/protocols; resource ownership/periods and attribution."
  required_quality_disclosure: "Coverage, uncertainty, custody residuals, missing consumer/period evidence, identity/property support and quantitative range gaps, and actual validation completeness."
  update_trigger: "Changed model, interface, route, BOM, acceptance design or stronger measured/identity evidence."
data_sources:
  - id: "unsd-cpc3-explanatory-notes"
    type: "official_guidance"
    reference: "https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "CPC 3.0 explanation, PDF page 293: electrical fitting subset and separation from alarm/telecommunications services; classification alone creates no PCR identity."
  - id: "leviton-receptacle-installation"
    type: "handbook"
    reference: "https://leviton.com/content/dam/leviton/residential/product_documents/instruction_sheet/15a-receptacle-instruction-sheet.pdf"
    used_for: "Representative isolation/proof-off, side-screw copper termination, separate hot/neutral/earth, mounting and plate/restoration route. Model-specific strip length/torque/gauge are not universal inventory ranges. Foreground protocols specify actual collection without inventing quantities."
  - id: "leviton-5320-product"
    type: "official_guidance"
    reference: "https://leviton.com/products/5320-4w"
    used_for: "Representative 15 A 125 V two-pole three-wire grounding duplex fitting; actual materials, strap, supplied hardware and model compatibility. It establishes no complete service mass, energy, waste, asset life or bounds."
