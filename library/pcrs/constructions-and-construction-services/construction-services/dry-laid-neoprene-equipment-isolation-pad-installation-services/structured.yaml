measurement_rules:
  - id: accepted_count
    applies_to: "accepted_isolation"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "D is the independently recorded count of completed accepted same-configuration installations in cp_gate. Count one entire installation, not individual pads or supports."
  - id: mass_records
    applies_to: "neoprene_pads; packaging; usable_returns; installation_waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh actual material by grade and custody state. Piece-to-mass conversion requires the actual SKU and verified unit mass; rated supported load, gross shipping weight and pad plan area are not pad net mass."
  - id: interface_count
    applies_to: "equipment_interface"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Record actual equipment custody once, including unsuccessful jobs; do not fix its input count to the final reference or purchase the customer equipment again."
  - id: service_units
    applies_to: "owned_resources; contracted_services; installation_electricity"
    required_property_ref:
      name: "Actual verified count, service or energy property"
      uuid: ""
    required_unit: "item; actual service unit; kWh"
    rule: "Keep metered energy distinct from rated power. A service packet is countable only with a defined scope and quantity; hourly hire keeps its duration unit and verified support chain."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
