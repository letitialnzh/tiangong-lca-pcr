          description: "Conditional on actual electricity used in the defined installation work. Manual pad cutting and placement do not imply zero instrument charging. Separate shared charging by measured use and do not count electricity embedded in a provider service twice. Equipment operating energy is outside the handover gate. Range evidence need: meter/charging-session records and allocation basis; no inference from equipment motor rating, battery label or operating power."
          amount:
