product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.dry-laid-neoprene-equipment-isolation-pad-installation-services"
  classification_refs: "cpc:3.0:54651 — Sound or vibration insulation services; narrower"
  covered_products: "First dry placement of single-layer modular neoprene pads under a declared indoor machine; local lifting, loaded inspection, correction and signed isolation-only handover"
  excluded_products: "Complete machinery installation; foundations; restraints; bonded, shimmed or multilayer systems; spring isolators; acoustic wall finishes; replacements; machinery operation"
  representative_product: "Accepted single-machine dry-laid neoprene isolation installation"
  production_route: "Approve actual support/load schedule → receive pads and equipment interface → hand-cut complete modules → local lift and dry place → lower, inspect and correct → signed handover"
  market_state: "Completed isolation installation service on customer equipment, before equipment commissioning"
functional_unit:
  what: "Accepted single-machine dry-laid neoprene isolation installation"
  how_much: "1 item complete accepted installation for one declared equipment configuration"
  how_well: "Actual supplier-approved pad grade, module arrangement and per-support loads; complete bearing contact, stable level placement and no unintended rigid bridge; signed installation inspection"
  how_long_or_cycle: "One installation work order including correction and final acceptance; asset burdens may span reporting periods; no machine operating life assigned"
  reference_flow_link: "accepted_isolation"
system_boundary:
  rules:
    - rule_id: installation_gate
      applies_to: "place_inspect"
      rule: "The two physical component roles are customer equipment interface and supplied isolation pads. Existing floor is a declared substrate interface. Only local lifting for pad placement belongs here; accept all supports as one installation after loaded inspection."
      source_ids: []
    - rule_id: route_eligibility
      applies_to: "neoprene_pads; accepted_isolation"
      rule: "Use single-layer neoprene complete modules and actual approved layout. Manufacturer information supports this product family and selected unbolted applications, not all locations; anchoring or stacking requirements move the work outside this scope."
      source_ids:
        - mason-super-w-2014
    - rule_id: design_inputs
      applies_to: "accepted_isolation"
      rule: "Retain actual per-support loads, number and arrangement of pads and disturbing-frequency/design evidence. Do not assume even load sharing merely by dividing total weight by pad count. Actual product design approval controls execution."
      source_ids:
        - karman-isolator-selection
    - rule_id: event_ownership
      applies_to: "all cards"
      rule: "Record receipt, local lifting, cutting, correction, inspection, cleanup and exits for the entire work order. Include measured battery charging and external support when present. Check chemical use or powered work as scope changes, not zero-valued emissions."
      source_ids: []
    - rule_id: time_boundary
      applies_to: "owned_resources; contracted_services"
      rule: "Index acquisition, maintenance, replacement and retirement of reusable equipment separately from work-order activity and acceptance dates; keep charges and transfers attributable to the actual reporting period."
      source_ids: []
