    label: "Dry placement and loaded inspection"
    inputs:
      product:
        - row_id: neoprene_pads
          role: "Modular neoprene vibration-isolation pads at site supply"
          name: "Modular neoprene vibration-isolation pads at site supply"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Actual selected neoprene grade and module geometry for single-layer compression placement. Include gross material drawn into the work order, hand-cut losses and replacements. Separate unused returns and waste so receipts are not netted twice. Range evidence need: per-support design and actual SKU net masses determine consumption; supplier load ratings in kg describe supported equipment, not pad mass. No generic kg per installation interval is established."
          amount:
            expression: "Actual pad mass drawn from reconciled stock, divided by D"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_materials
              source_ids:
                - mason-super-w-2014
            ranges: []
