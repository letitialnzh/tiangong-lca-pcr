      flow_role: "equipment_interface; accepted_isolation"
      record_type: "custody and acceptance record"
      raw_fields: "work_id; machine_id; configuration; loading_schedule; pad_layout; eligibility_approval; inspection_criteria; observations; correction_id; receipt_count; accepted_count; D; date"
      collection_method: "Reconcile each received machine with signed installation acceptance or documented reject status; inspect every support under actual static load."
      unit: "item"
      frequency: "each receipt, correction and acceptance"
      temporal_coverage: "complete work order through signed handover"
      site_scope: "actual site and configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "D positive and independently counted; originals and inspector identity; raw receipt count divided by D; no unaccepted job in D"
    - protocol_id: cp_materials
      process_id: "place_inspect"
      flow_role: "neoprene_pads; packaging"
      record_type: "stock and mass record"
      raw_fields: "SKU; grade; dimensions; opening_stock; receipts; closing_stock; drawn_mass; packaging_material; scale_id; tare; return_ticket"
      collection_method: "Reconcile work-order draw from stock with weighed receipts and unused holdings; determine net pad mass separately from packaging and supported machine weight."
      unit: "kg"
      frequency: "each receipt, draw and stock closure"
      temporal_coverage: "entire work order including corrections"
      site_scope: "actual site store and installation node"
      aggregation_rule: "per reference flow"
      quality_evidence: "Material-specific stock balance and scale checks; gross draw includes downstream returns and waste; each drawn_mass divided by D"
    - protocol_id: cp_resources
      process_id: "place_inspect"
      flow_role: "owned_resources; contracted_services"
      record_type: "resource and supplier record"
      raw_fields: "asset_id; owner; whole_life_packet; acquisition; maintenance; replacement; retirement; all_consumers; period; u_j; u_all; provider; service_scope; actual_unit; activity"
      collection_method: "Reconcile actual equipment-use logs and contracts; select packet versus disaggregated service representation; verify full-life denominator and period allocation."
      unit: "item per defined packet; original service unit retained"
      frequency: "each asset or service event"
      temporal_coverage: "work order and documented whole resource life"
      site_scope: "all shared consuming sites/jobs and target node"
      aggregation_rule: "per reference flow"
      quality_evidence: "Whole-life packet evidence, shares sum to 1; count packet shares or actual service quantities and divide by D; retain unknown retirement/lifetime evidence as unresolved"
    - protocol_id: cp_energy
      process_id: "place_inspect"
      flow_role: "installation_electricity"
      record_type: "meter or charging record"
      raw_fields: "meter_id; start; end; session; owner; charging_losses; attribution_basis; allocated_kWh"
      collection_method: "Read actual installation-only meters or allocate shared charging using measured session use; exclude separately inventoried provider energy."
      unit: "kWh"
      frequency: "each use or charging session"
      temporal_coverage: "sessions causally assigned to work order"
      site_scope: "site supply or evidenced offsite charging"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated readings and session ownership; sum allocated_kWh including losses then divide by D; absent use needs explicit records, not assumed zero"
    - protocol_id: cp_exits
      process_id: "place_inspect"
      flow_role: "usable_returns; installation_waste"
      record_type: "custody and receiving record"
      raw_fields: "material; condition; quantity; tare; ticket; owner; destination; receiver; treatment_scope; correction_id"
      collection_method: "Weigh and reconcile separate reusable returns and waste at release, link to actual recipient and originating work-order material."
      unit: "kg"
      frequency: "each exit"
      temporal_coverage: "work order and linked later exit"
      site_scope: "node release and declared receiver gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed tickets and material balance; sum each classified exit mass and divide by D; do not recategorize waste as product for a UUID match"
  calculation_rules:
    - id: normalization
      applies_to: "all non-reference cards"
      rule: "For actual work-order quantity Q_i, q_i = Q_i / D; D > 0. Keep separate quantities for each material, asset packet and real service unit."
      inputs:
        - Q_i
        - D
        - cp_gate
        - cp_materials
        - cp_resources
        - cp_energy
        - cp_exits
      output: "quantity per reference flow"
      source_ids: []
    - id: stock_closure
      applies_to: "neoprene_pads; packaging"
      rule: "For each material, opening stock + receipts = closing unused stock + retained installation material + usable returns + waste + documented discrepancy. Correct attribution and weighing differences; do not force discrepancies into emissions."
      inputs:
        - cp_materials
        - cp_exits
        - "installation records"
      output: "reconciled material inventory"
      source_ids: []
    - id: resource_share
      applies_to: "owned_resources"
      rule: "For each declared whole-life packet, s_j = u_j / sum(u_all); q_resource = s_j / D. Require positive complete denominator, period ownership and no overlapping maintenance or retirement packet."
      inputs:
        - cp_resources
        - cp_gate
      output: "resource packet share per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "accepted_isolation"
      requirement: "Keep grade, load distribution, module geometry and design-approved eligibility; separate different designs rather than claiming equal performance."
      evidence: "supplier/project design and signed gate records"
    - id: range_evidence
      applies_to: "all cards"
      requirement: "Develop quantitative guardrails only from comparable independent measured jobs or verified SKU data. Manufacturer supported-load tables are neither consumed material masses nor installation yields."
      evidence: "card-specific actual evidence and independent sample scope"
    - id: identity
      applies_to: "all cards"
      requirement: "Resolve actual exchange identity, state, provider/destination, property and unit before final dataset production. A conditional umbrella expands into actual exchanges and never receives an assumed universal UUID."
      evidence: "full matching flow and property/unit evidence"
    - id: periods
      applies_to: "owned_resources; contracted_services"
      requirement: "Close ownership and period allocations, replacements and retirement; prevent duplicate burdens across jobs and services."
      evidence: "resource life and all-consumer ledger"
validation_rules:
  - rule_id: gate_complete
    applies_to: "accepted_isolation"
    rule: "Check supplier/project authorization for no restraint, approved per-support loads and layout, actual contact/level/stability/bridge criteria and correction closure. Missing design approval or inspection criteria blocks acceptance; do not assert a numerical operating attenuation."
    source_ids: []
  - rule_id: row_completeness
    applies_to: "all cards"
    rule: "Verify each actual input, return, waste and conditional service at place_inspect; reconcile material and equipment custody. Actual excluded activities require boundary extension, not silent deletion."
    source_ids: []
  - rule_id: resource_closure
    applies_to: "owned_resources; contracted_services"
    rule: "All consumers and periods must be represented; shares sum to 1 and owned/provider burdens do not overlap. Unknown lifetime, replacement or retirement allocation blocks finalization."
    source_ids: []
  - rule_id: normalization_check
    applies_to: "all cards"
    rule: "D must be positive and exclude rejected jobs. Reference output is exactly 1 item; other quantities come from actual records and are not fixed to one. Preserve real service units, energy and mass conversions."
    source_ids: []
  - rule_id: exchange_readiness
    applies_to: "all cards"
    rule: "Require exact verified identities, property/unit chains and traceable quantities for final exchanges; no checker result substitutes for these records."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground isolation-installation service data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matching first dry-laid single-layer neoprene equipment isolation services with the same disclosed gate and configuration"
  excluded_use: "Whole-machine manufacture/installation/operation, seismic design, spring or layered isolation, acoustic performance guarantees and unqualified category averages"
  required_metadata: "Location, dates, equipment and pad configuration, load schedule, approved eligibility, inspection gate, D, method/source editions, ownership and boundary interfaces"
  required_quality_disclosure: "Actual versus absent conditional activity; UUID and quantitative gaps; service unit conversions; resource-life allocations; material discrepancies and configuration representativeness"
  update_trigger: "Changed pad grade, support design, restraint requirement, installation technique, handover criterion or verified evidence"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Ver.3.0 explanatory notes, 30 June 2025, pp.295 and 298; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope only: vibration insulation versus acoustic wall/ceiling finishing"
  - id: "mason-super-w-2014"
    type: "handbook"
    reference: "Mason Industries, Bulletin SW-16-3, May 2014; https://mason-ind.com/download/36780/"
    used_for: "Modular neoprene supply, complete-module cutting and selected unbolted applications; no generic inventory quantities"
  - id: "karman-isolator-selection"
    type: "handbook"
    reference: "Karman Rubber, Selecting the Right Vibro-Isolators; https://karman.com/products/selection-steps"
    used_for: "Design inputs and load-distribution qualification; no adopted performance percentage or generic load/mass factor"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:ebeca0b2ab254cd5f9ca3d3c70a76ae0633ae323b9fdcd0738839373f3fee803"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6274"
      family: "system_boundary"
      span:
        start:
          offset: 6274
          line: 60
          column: 1
        end:
          offset: 16655
          line: 196
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Customer equipment stopped and isolated at the prepared position; accepted existing support surface, approved loading and pad schedule, authorized lifting arrangement and verified permission for unanchored dry placement |\n| starting_condition_role | Customer equipment and existing substrate are physical interfaces; supplied pads enter as new consumables |\n| product_classification_scope | Isolation installation only, a narrow part of CPC 54651; excludes machinery installation and acoustic finishing services |\n| recursive_input_rule | A purchased isolation subcontract is either a documented external service package or disaggregated foreground work, never both; do not recursively add another complete copy of the same isolation service |\n| upstream_dataset_requirement | Supply-chain data for actually consumed pads, packaging, electricity, owned-resource shares and external services at matching gates; no second manufacture of customer equipment or existing building |\n| disclosure | Declare which party owns equipment, lifting tools, transport, packaging, rejects and external treatment. Link to a wider project when excluded work is necessary; no claim of a whole machine or building life cycle |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| installation_gate | place_inspect | The two physical component roles are customer equipment interface and supplied isolation pads. Existing floor is a declared substrate interface. Only local lifting for pad placement belongs here; accept all supports as one installation after loaded inspection. |  |\n| route_eligibility | neoprene_pads; accepted_isolation | Use single-layer neoprene complete modules and actual approved layout. Manufacturer information supports this product family and selected unbolted applications, not all locations; anchoring or stacking requirements move the work outside this scope. | mason-super-w-2014 |\n| design_inputs | accepted_isolation | Retain actual per-support loads, number and arrangement of pads and disturbing-frequency/design evidence. Do not assume even load sharing merely by dividing total weight by pad count. Actual product design approval controls execution. | karman-isolator-selection |\n| event_ownership | all cards | Record receipt, local lifting, cutting, correction, inspection, cleanup and exits for the entire work order. Include measured battery charging and external support when present. Check chemical use or powered work as scope changes, not zero-valued emissions. |  |\n| time_boundary | owned_resources; contracted_services | Index acquisition, maintenance, replacement and retirement of reusable equipment separately from work-order activity and acceptance dates; keep charges and transfers attributable to the actual reporting period. |  |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Customer equipment at pad-placement interface (`equipment_interface`)\n\nProcess / prospective direction / type: `place_inspect` / `inputs` / `product`.\n\nRecord the actual customer-owned machine received for local pad placement and its return at handover. This is an interface/custody exchange; its upstream manufacture is outside this separately declared service and is not an additional purchased machine.\n\n- Collection subject: Customer equipment at pad-placement interface\n- Flow property / unit: Number of items / item\n- Amount rule: Actual machines entering the work order, including unaccepted jobs, divided by D\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_gate`\n\nRange evidence need: retain actual machine IDs, receipts and final status. A universal one-input-per-accepted-output ratio would hide unsuccessful work.\n\n#### Collection requirement: Packaging entering with installation supplies (`packaging`)\n\nProcess / prospective direction / type: `place_inspect` / `inputs` / `product`.\n\nExpand by actual material and single-use or returnable custody. Do not count packaging already included in a supplier inventory again. Returnable packaging physical mass remains separate from its allocated upstream burden.\n\n- Collection subject: Packaging entering with installation supplies\n- Flow property / unit: Mass / kg\n- Amount rule: Actual incoming packaging mass by material, divided by D\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_materials`\n\nRange evidence need: actual packing specification, weighing and reuse/custody evidence; gross delivery mass is insufficient.\n\n#### Collection requirement: Attributed owned lifting and inspection resource packets (`owned_resources`)\n\nProcess / prospective direction / type: `place_inspect` / `inputs` / `product`.\n\nFor actually used jacks, slings, hand cutters, gauges and other owned assets, define each whole-resource-life packet including procurement, maintenance, replacements and retirement. Allocate its burden using measured causal use across every job/node/period; retain physical asset IDs and avoid recounting provider-owned equipment.\n\n- Collection subject: Attributed owned lifting and inspection resource packets\n- Flow property / unit: Number of items / item\n- Amount rule: Actual documented whole-life resource packet shares attributable to this work order, divided by D\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_resources`\n\nRange evidence need: asset-specific whole-life service evidence and actual use logs; no assumed lifetime or fixed equipment-consumption fraction.\n\n#### Collection requirement: Contracted local handling and supporting services (`contracted_services`)\n\nProcess / prospective direction / type: `place_inspect` / `inputs` / `product`.\n\nConditional umbrella for actual local lift provider, attributable logistics or separately procured waste handling. Expand into concrete provider/scope exchanges. Include a service package once or its activity inventory once; hourly and transport units retain their real property chains.\n\n- Collection subject: Contracted local handling and supporting services\n- Flow property / unit: Number of items / item\n- Amount rule: Actual defined provider service packages attributable to the work order, divided by D\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_resources`\n\nRange evidence need: actual contract scope, trips or hire records and upstream inclusion; no universal count, hours or distance.\n\n#### Collection requirement: Usable uninstalled pads and packaging returned (`usable_returns`)\n\nProcess / prospective direction / type: `place_inspect` / `outputs` / `product`.\n\nConditional actual reusable offcuts, uninstalled pad modules and returnable packaging leaving the work order for a named owner and destination. Distinguish contamination and damage; no automatic sale, co-product or recycling credit.\n\n- Collection subject: Usable uninstalled pads and packaging returned\n- Flow property / unit: Mass / kg\n- Amount rule: Actual usable return mass by material and recipient, divided by D\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_exits`\n\nRange evidence need: weighed return tickets, condition and ownership; no assumed recoverable fraction.\n\n#### Collection requirement: Pad offcuts, rejected pads and discarded packaging (`installation_waste`)\n\nProcess / prospective direction / type: `place_inspect` / `outputs` / `waste`.\n\nExpand actual waste by neoprene/material identity, contamination, condition and named receiving treatment gate. Include irrecoverable corrections and captured debris; solid offcuts are waste, not automatically airborne elementary emissions. Disposal services and waste-transfer mass must have compatible nonduplicated treatment ownership.\n\n- Collection subject: Pad offcuts, rejected pads and discarded packaging\n- Flow property / unit: Mass / kg\n- Amount rule: Actual waste mass by material and destination, divided by D\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_exits`\n\nRange evidence need: actual cutting plan, waste tickets and correction history; no preset scrap or recycling fraction.\n\n"
