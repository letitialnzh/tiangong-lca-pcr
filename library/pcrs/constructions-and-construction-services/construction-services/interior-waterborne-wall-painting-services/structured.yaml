allocation_rules:
  - rule_id: campaign_attribution
    applies_to: "prepare; finish"
    rule: "Subdivide records by campaign, room and node first. Attribute shared electricity by metering or documented power-time; shared transport by measured load-distance and reusable consumables by documented usage and replacement. Reconcile consumer shares to one total per period; use area allocation only for homogeneous same-system campaigns with justified evidence."
    source_ids: []
  - rule_id: rework_retention
    applies_to: "finish"
    rule: "Retain failed-coat removal, extra coating, energy and cleanup with the producing campaign; count final accepted area once. Downgrade, recovery or discard requires an actual destination and no automatic avoided-product credit."
    source_ids: []
  - rule_id: no_coproduct
    applies_to: "all processes"
    rule: "The defined route has one service output. Returned usable paint is a stock correction. No paint-leftover, waste or existing-wall coproduct allocation is allowed. If a real independently marketed coproduct arises, document a separately reviewed method before reuse."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_prepare
      process_id: "prepare"
      flow_role: "Preparation cards; reference signed finish-node accepted area"
      record_type: "Campaign ledger and acceptance survey"
      raw_fields: "campaign; room; event; timestamp; preparation product and batch; stock issued returned opening closing; wet mass; water volume; energy meter or power-time; transport load and distance; cp_finish accepted net area survey reference; preparation/rework tasks; waste and wastewater quantity and destination; particle size/composition medium method and uncertainty; shared asset consumer shares"
      collection_method: "Reconcile preparation material, transport, electricity, cleaning-water, collected residue and particle records with invoices, stock and meters. Reference the signed cp_finish accepted-area survey as denominator without creating an accepted output at prepare. Assign each preparation or shared event once."
      unit: "kg; m3; kWh; t*km; m2"
      frequency: "Each issue, coat, cleanup, shared event and acceptance"
      temporal_coverage: "Full campaign including rework and final cleanup"
      site_scope: "Declared site and contractor; prepare node only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; signed area survey; supplier densities; traceable stock/waste records; approved attribution; species evidence and uncertainty"
    - protocol_id: cp_finish
      process_id: "finish"
      flow_role: "Finishing cards and accepted service output"
      record_type: "Campaign ledger and acceptance survey"
      raw_fields: "campaign; room; event; timestamp; coating and primer product/batch; stock issued returned opening closing; wet mass; volume and density; actual coat count and layer areas; thinning and cleanup water; energy meter or power-time; net area and deductions; accepted rejected reworked area; drying regime; acceptance and defect closure; waste quantity and destination; emission species medium composition method and uncertainty; shared asset consumer shares"
      collection_method: "Reconcile each primer/finish-coat issue and stock return with wet mass or traceable density, layer areas, thinning, cleanup, electricity and species evidence. Survey accepted net area after drying and defect closure and sign the acceptance record. Assign each finish or shared event once."
      unit: "kg; m3; kWh; t*km; m2"
      frequency: "Each issue, coat, cleanup, shared event and acceptance"
      temporal_coverage: "Full campaign including rework and final cleanup"
      site_scope: "Declared site and contractor; finish node only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrations; signed area survey; supplier densities; traceable stock/waste records; approved attribution; species evidence and uncertainty"
  calculation_rules:
    - id: area_normalization
      applies_to: "all inventory rows"
      rule: "For accepted net area A_accepted > 0, calculate Q_i = Q_lot_i / A_accepted × 1 m2 for each actual node-attributable lot total, preserving the original numerator unit, original totals and node ownership. Zero accepted area cannot form an accepted-service dataset. The reference output uses its own cp_finish accepted-area record and normalizes to 1 m2."
      inputs:
        - cp_prepare
        - cp_finish
        - "actual node lot totals"
        - "accepted net area"
      output: "Amounts per reference flow"
      source_ids: []
    - id: stock_reconciliation
      applies_to: "waterborne_finish; waterborne_primer; repair_compounds; protection_consumables"
      rule: "Accounted use = opening stock + receipts - closing stock - usable returns transferred outside this lot accounting boundary and not already included in closing stock. A usable return already counted in closing stock must not be subtracted again. Reconcile accounted use to separately traced applied/consumed material, waste and other documented exits; invoices alone do not determine applied paint. Retain the ledger boundary, original units and return ownership before area_normalization."
      inputs:
        - cp_prepare
        - cp_finish
        - "opening stock"
        - receipts
        - "closing stock"
        - "exclusive usable returns"
        - "applied/consumed and waste records"
      output: "Reconciled actual lot use before normalization"
      source_ids: []
    - id: wet_mass_conversion
      applies_to: "waterborne_finish; waterborne_primer; repair_compounds"
      rule: "Multiply recorded supplied volume by product-specific density on a compatible basis; retain both original volume and converted wet mass. No generic paint density is permitted."
      inputs:
        - "supplier density"
        - "recorded volume"
      output: "Wet product kg"
      source_ids: []
    - id: species_emissions
      applies_to: "finish_air_species"
      rule: "Use measured species release or a documented species-specific material balance of actually applied products, retained coating, captured waste and emitted fractions. Record indoor release and any outdoor transfer consistently, avoiding duplicate releases. EPA describes activity/content-based estimation but provides no universal species split for this PCR."
      inputs:
        - cp_finish
        - "product composition"
        - "release evidence"
      output: "Species kg to declared air medium"
      source_ids:
        - epa-eiip-architectural-coating-1995
  data_quality_requirements:
    - id: coverage
      applies_to: "all processes"
      requirement: "Cover all campaign inputs, stock corrections, rework, waste, shared burdens and area; disclose missing records and cut-offs without silent zeros."
      evidence: "Reconciled node ledgers and acceptance records"
    - id: representativeness
      applies_to: "all inventory rows"
      requirement: "Report site, country, dates, coating formulation, wall starting state and application/drying technology; geographic electricity and transport choices must match actual supply."
      evidence: "Project and supplier records"
    - id: identity_resolution
      applies_to: "all inventory rows"
      requirement: "Resolve each actual exchange of umbrella cards to a verified concrete UUID, property and unit before TIDAS exchange publication; retain gaps rather than selecting a broad convenient match."
      evidence: "Independent identity verification and support rows"
    - id: range_evidence
      applies_to: "all ranges"
      requirement: "Provisional estimates are screens only, including zeros for conditional absence, and never substitute for measured totals. Investigate outliers against independent evidence; do not derive a guardrail from the same batch it validates."
      evidence: "Independent reviewed comparison and uncertainty disclosure"
validation_rules:
  - rule_id: reference_conformance
    applies_to: "accepted_painting_service"
    rule: "Require positive measured net area, matching service output/property/unit and a signed acceptance record; count no unresolved rejected area or duplicate coat area."
    source_ids: []
  - rule_id: campaign_completeness
    applies_to: "prepare; finish"
    rule: "Every material, cleaning, changeover, rework, residue and emission event links to one campaign and producing node. Confirm shared asset consumers and period shares sum to one owned event total."
    source_ids: []
  - rule_id: coating_quality
    applies_to: "finish"
    rule: "Verify declared project requirements, actual layer count, drying and closed defects against acceptance evidence; do not substitute a generic prescribed coat count."
    source_ids:
      - ufgs-architectural-coatings-2026
  - rule_id: release_and_waste
    applies_to: "prepare_air_particles; finish_air_species; finish_wastewater"
    rule: "Require emission species/size and air medium and separate captured waste/wastewater destination; missing speciation is incomplete evidence, not zero VOC. Check material and water reconciliations and avoid emission/treatment double counting."
    source_ids:
      - epa-eiip-architectural-coating-1995
published_dataset_profile:
  dataset_role: "Foreground contractor painting-service data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible installed-wall interior brush/roller waterborne painting at the declared service gate"
  excluded_use: "Paint product kg, wall production, full building life cycle, exterior/spray/specialty routes and future repainting without separate modelling"
  required_metadata: "All reference qualifiers; campaign/node/event ids; accepted net area; material, energy, transport, shared-asset and waste boundaries"
  required_quality_disclosure: "Measured versus modelled quantities; unresolved identities or species; provisional ranges; attribution; upstream gaps; capital-equipment treatment; excluded works and uncertainty"
  update_trigger: "Coating formulation, wall starting state, specification, application route, grid, waste route or measured inventory changes materially"
data_sources:
  - id: "ufgs-architectural-coatings-2026"
    type: "official_guidance"
    reference: "USACE/NAVFAC/AFCEC UFGS 09 90 00 Architectural Paints and Coatings, August 2026; sections 3.6.2, 3.8, 3.10 and 3.11. https://www.wbdg.org/FFC/DOD/UFGS/UFGS%2009%2090%2000.pdf"
    used_for: "Preparation/application/acceptance/waste-management evidence; no quantitative consumption range or fixed service normalization"
  - id: "epa-eiip-architectural-coating-1995"
    type: "method_factor"
    reference: "US EPA EIIP Volume III Chapter 3, Architectural Surface Coating, 11/08/1995, sections 2 and 4. https://www.epa.gov/sites/default/files/2015-08/documents/archsfc.pdf"
    used_for: "Application/drying release pathways and activity/content estimation approach; no universal species fractions"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:26b1306c7568fb0b79580590323ecc6823399b6e552e17e7d557fcc9b6efb9b7"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_4210"
      family: "system_boundary"
      span:
        start:
          offset: 4210
          line: 54
          column: 1
        end:
          offset: 19087
          line: 306
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Installed gypsum/plaster interior wall accepted for minor preparation; substrate ownership and prior works remain outside the service inventory |\n| starting_condition_role | Existing parent surface condition, not a free wall-material input or output |\n| product_classification_scope | A narrower service subset of CPC 54730 Painting services |\n| recursive_input_rule | Subcontracted same-category painting must be represented once as a purchased verified service or decomposed foreground work, never both; retain subcontract boundaries and area |\n| upstream_dataset_requirement | Link coating, primer, repair, water, electricity, consumables and transport inputs to compatible upstream datasets; missing links remain explicit. Do not import wall production into the service reference |\n| disclosure | Report starting wall condition, excluded prior works, supplier-dataset transport coverage, shared asset attribution, hazards and excluded future maintenance |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `service_gate` | all processes | Include campaign minor preparation through accepted coating, cleanup and defect closure. Installed substrate manufacture/installation stays outside; document deviations before reuse. | `ufgs-architectural-coatings-2026` |\n| `actual_system` | finish | Record actual primer decision, layer count, coating identities, drying and application conditions; no fixed two-coat assumption. | `ufgs-architectural-coatings-2026` |\n| `shared_assets` | prepare; finish | Identify shared task lighting, ventilation, electrical supply and reusable tools, list prepare and finish consumers and campaign periods, and record one owner for each shared event. Retain operating and replacement burdens where attributable; disclose capital-equipment treatment. |  |\n| `waste_gate` | prepare; finish | Track residue and wash-water handover and treatment destinations separately from direct releases; cleaning and residual paint storage follow the declared site management plan. | `ufgs-architectural-coatings-2026` |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Minor repair compounds (`repair_compounds`)\n\nProcess / prospective direction / type: `prepare` / `inputs` / `product`.\n\nRecord each repair formulation and wet supplied mass; exclude plasterboard manufacture and major plastering.\n\n- Collection subject: Gypsum or compatible spackling compounds actually used\n- Flow property / unit: Mass / kg\n- Amount rule: Calculate actual attributable kg from cp_prepare records per accepted net area; retain all rework consumption.\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_prepare`\n\n- Unverified optional screening aid: Provisional broad screening estimate; replace with independent reviewed evidence\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 1\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Surface protection and expendable tools (`protection_consumables`)\n\nProcess / prospective direction / type: `prepare` / `inputs` / `product`.\n\nConditional umbrella: instantiate each actual material; reusable items use measured attributable replacement consumption, not full purchase per lot.\n\n- Collection subject: Actual masking, protective sheeting and consumed preparation tools\n- Flow property / unit: Mass / kg\n- Amount rule: Calculate actual attributable kg from cp_prepare records per accepted net area; retain all rework consumption.\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_prepare`\n\n- Unverified optional screening aid: Provisional broad screening estimate; replace with independent reviewed evidence\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 1\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Contractor attributable transport services (`contractor_transport`)\n\nProcess / prospective direction / type: `prepare` / `inputs` / `product`.\n\nConditional umbrella for vehicle and load-specific services; own all campaign mobilization here once, including return trips where attributable; omit upstream supplier transport already included in a purchased dataset.\n\n- Collection subject: Actual material and equipment transport services\n- Flow property / unit: Goods transport (mass*distance) `838aaa20-0117-11db-92e3-0800200c9a66` / t*km\n- Amount rule: Calculate actual attributable t*km from cp_prepare records per accepted net area; retain all rework consumption.\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_prepare`\n\n- Unverified optional screening aid: Provisional broad screening estimate; replace with independent reviewed evidence\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 5\n  - Unit: t*km\n  - Basis: per reference flow\n  - Basis kind: Reference flow (`reference_flow`)\n  - Evidence kind: Reasoned estimate (`reasoned_estimate`)\n\n#### Collection requirement: Collected preparation residues (`prepare_residue`)\n\nProcess / prospective direction / type: `prepare` / `outputs` / `waste`.\n\nSplit collected residues by composition and destination; distinguish dry solid wastes from air releases and wastewater.\n\n- Collection subject: Actual sanding dust, repair debris and used protection wastes\n- Flow property / unit: Mass / kg\n- Amount rule: Calculate actual attributable kg from cp_prepare records per accepted net area; retain all rework consumption.\n- Value mode: Cal