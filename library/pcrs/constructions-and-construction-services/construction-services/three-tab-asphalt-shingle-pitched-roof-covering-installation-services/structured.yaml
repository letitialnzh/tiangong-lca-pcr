measurement_rules:
  - id: reference_area
    applies_to: "accepted_roof_service"
    required_property_ref:
      name: "Area"
      uuid: ""
    required_unit: "m2"
    rule: "Use unique accepted sloped geometry A > 0, not horizontal plan area. The final reference is A/A = 1; internal surface areas remain measured physical numerators."
  - id: observational_interface
    applies_to: "CP deck/readiness observation and adjacent acceptance records"
    required_property_ref:
      name: "Area"
      uuid: ""
    required_unit: "m2"
    rule: "Physical accepted timber-deck interface differs from design-document quality evidence. Carry no new deck manufacturing mass or duplicate asset burden."
  - id: material_mass
    applies_to: "Material, packaging, waste, usable-exit and species cards"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve actual material ID and current state. Convert count, length, supplied area or volume only through a measured/supplier-confirmed same-ID/current-state bridge with unit and uncertainty; do not add native counts or lengths directly to kg."
  - id: water_state
    applies_to: "finish_water, water-bearing materials and finish water fates"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Gross fresh water and actual formulation/received/opening processed water are exclusive. Retained bound/free water, solid/liquid waste water, direct liquid release, handoff and closing WIP are separate water pools. A missing closure is a data gap."
  - id: electricity_measure
    applies_to: "Each node electricity card"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Use actual converted meter differences and topology/period evidence. Retain the exact energy-property identity requirement; never substitute an NCV property solely to match units."
  - id: service_measure
    applies_to: "Each node access/support service card"
    required_property_ref:
      name: "Duration"
      uuid: ""
    required_unit: "h"
    rule: "Use actual contract/billed service availability and attributable periods, including owned idle where relevant. No labor-hour, assumed eight-hour day, lifetime or arbitrary annualization proxy."
  - id: quantity_once
    applies_to: "All cards and calculations"
    required_property_ref:
      name: "Declared physical property"
      uuid: ""
    required_unit: "Declared unit"
    rule: "Calculation outputs are physical numerators except normalized_accepted_roof_service; normalize once by A at inventory amount. A/A is already normalized. Document measured absence; unknown is not zero."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: survey_receive
    name: "Confirm timber-deck release and receive roofing materials"
    inclusion: "required"
    inclusion_condition: "For this installation route; each optional material/finish/support occurrence follows actual records and evidenced absence."
    role: "Inspect the actual dry timber deck, fixing compatibility, slopes, penetrations, roof geometry and externally accepted junction interfaces against the project design and installed product instructions. Identify the responsible party for every interface. Reconcile each delivered component and packaging ledger with calibrated mass measurements or exact same-ID conversion evidence. Sign each issue and physical deck handoff; receipt rejects and usable exits remain separately evidenced."
    quantitative_reference: "Measured actual state/quantity; normalize attributable physical numerators by final A once."
  - id: underlay_edges
    name: "Install specified underlay, leak barriers and drip edges"
    inclusion: "required"
    inclusion_condition: "For this installation route; each optional material/finish/support occurrence follows actual records and evidenced absence."
    role: "Match the physical deck release and each material issue to actual receipt. Record the selected layer schedule, leak-barrier locations, overlaps, edge order and fixing/sealing operations prescribed for this roof. Measure actual installed quantities, cuts, removed liners and packaging at this node. Inspect concealed interfaces before the underlaid surface is handed to shingling; record and retain every correction."
    quantitative_reference: "Measured actual state/quantity; normalize attributable physical numerators by final A once."
  - id: shingle_details
    name: "Nail three-tab covering and complete junctions and owned vents"
    inclusion: "required"
    inclusion_condition: "For this installation route; each optional material/finish/support occurrence follows actual records and evidenced absence."
    role: "Match the underlaid surface and component issues, then record field layout, cuts, starter/cap sourcing, actual nail specification and application, valleys, wall/chimney/penetration flashings and owned ventilation accessories. Record cement/hand-seal application when required. Keep cut-from-field caps in the original field-stock ledger. Collect captured waste separately from actual uncaptured species releases and retain each rework event."
    quantitative_reference: "Measured actual state/quantity; normalize attributable physical numerators by final A once."
  - id: finish_accept
    name: "Finish actual accessories, close seal conditions and accept roof"
    inclusion: "required"
    inclusion_condition: "For this installation route; each optional material/finish/support occurrence follows actual records and evidenced absence."
    role: "Match the installed surface, finish-material issues and accompanying packaging. Record only actually specified coating or cleanup operations and direct fresh-water supply. Inspect required seal state, drainage continuity, junction completion and owned ventilation interfaces after any actual waiting/protection interval. Measure every waste, unused exit and water fate and sign final acceptance only when the declared gate is satisfied."
    quantitative_reference: "Measured actual state/quantity; normalize attributable physical numerators by final A once."
