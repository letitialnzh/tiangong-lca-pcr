allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "All nodes"
    rule: "Assign measured actual material, waste, power and services directly to their real node, lot and period before any shared allocation. Internal area/material/packaging transfers carry existing burdens and are not co-produced final roofing services."
    source_ids: []
  - rule_id: allocation_unused
    applies_to: "Original usable unused materials"
    rule: "Report U returns and X external usable transfers as positive exclusive physical outputs. Transfer only evidenced upstream burden of the original unused material in its actual unchanged state. Keep all receipt handling, construction, protection, service and rework with the roofing lot; do not grant avoided-production credits or subtract U/X a second time from gross inputs. Net-consumed quantity may be a diagnostic only."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "Rejected and corrected work"
    rule: "Retain the original material and all actual repeated installation/removal/cleaning/service burdens with this lot. Record producing node, defect, actual rework destination or waste/usable/recovery disposition and linked events. Unresolved rejected work is not accepted output; recovery or downgrade treatment needs its actual destination and reviewed boundary."
    source_ids: []
  - rule_id: allocation_power
    applies_to: "All node electricity cards and meter periods"
    rule: "For each meter boundary use converted actual deltas. Subtract every inside-master directly assigned consumer once to obtain residual; outside-master direct assignments stay outside that subtraction. Zero residual needs no weight. Positive residual requires a complete eligible register and evidence-backed positive weights summing to the denominator. Direct plus allocated residual must reconcile the master exactly once. Negative/unknown residual blocks attribution."
    source_ids: []
  - rule_id: allocation_service
    applies_to: "Shared access/lifting/scaffold/protection and periods"
    rule: "Identify actual provider/asset, service scope, billed quantity and period; enumerate all consuming nodes/lots/periods, direct assignments and actual owned idle. Assign direct service first, then only remaining actual billed service with a reviewed positive eligible basis. Reconcile to billed total once; no labor/default shift or lifetime proxy."
    source_ids: []
  - rule_id: allocation_periods
    applies_to: "Receipt through final acceptance"
    rule: "Keep period/phase/event links and reviewed attribution decisions for every input, shared asset, correction, waste, stock and WIP movement. Carry only unmatched physical stocks forward; do not repurchase them or attribute the same service to two periods. Final unique A is counted once after gate completion. Replacement/termination or incomplete WIP requires explicit disposition and cannot be silently annualized."
    source_ids: []
  - rule_id: allocation_assembly_mass
    applies_to: "Retained installed components"
    rule: "Use retained component mass only for closure of actual composite assembly. A compound total and its constituent subrows are exclusive aggregation views. Accepted material is not counted a second time as both retained output and customer-handover mass in addition to the area service."
    source_ids: []
