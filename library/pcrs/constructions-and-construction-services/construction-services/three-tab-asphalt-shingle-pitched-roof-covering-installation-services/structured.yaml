    - id: calc_finish_accept_electricity
      applies_to: "finish_accept / finish_accept_electricity"
      rule: "actual_finish_accept_electricity = directly assigned actual converted meter deltas + eligible share of positive reconciled master residual. Each delta = (meter_end - meter_start) * unit_factor for its actual period. Residual = converted master_total - inside_master_direct_total, including every directly assigned inside-master consumer once; outside_master_direct_total is recorded but never subtracted from this master. If residual is zero, no weights are required. If residual is positive, share = residual * consumer_weight / all_eligible_weights with a complete eligible consumer register and positive weights/denominator. Negative or unknown residual requires correction and remains a gap. The output is physical kWh, normalized only at the card."
