        - "raw:finish_accept_electricity_outside_master_direct_total"
        - "raw:finish_accept_electricity_master_total"
        - "raw:finish_accept_electricity_consumer_weight"
        - "raw:finish_accept_electricity_all_eligible_weights"
        - "raw:finish_accept_electricity_period"
