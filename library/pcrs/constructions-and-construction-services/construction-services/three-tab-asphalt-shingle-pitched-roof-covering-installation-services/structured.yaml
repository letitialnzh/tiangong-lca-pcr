      collection_method: "Inspect the actual dry timber deck, fixing compatibility, slopes, penetrations, roof geometry and externally accepted junction interfaces against the project design and installed product instructions. Identify the responsible party for every interface. Reconcile each delivered component and packaging ledger with calibrated mass measurements or exact same-ID conversion evidence. Sign each issue and physical deck handoff; receipt rejects and usable exits remain separately evidenced. Close this node's physical material ledger using calc_survey_receive_material_closure and an independently measured whole-or-constituent covering-component mass manifest, excluding the observational timber-deck/Area interface. Assign each material/water-bearing portion one exclusive fate; keep signed unexplained closure gaps and uncertainty visible. Deduplicate electronic copies by unique physical event; retain distinct repeated operations. Sum physical numerator by actual identity/state/period and divide once by final positive unique A. Observational interface area carries no new deck manufacture. Compound and constituent quantities use exclusive grouping.  Existing-deck geometry and signed release are observation/acceptance records, not product inventory exchanges. deck_interface, physical_interface_release and physical_interface_construction_feed are retained observation ledger keys only; their raw fields and calc rules still measure unique surface IDs, actual area, state and adjacent responsibility gates. Original issue_* material role keys are per-SKU/state transfer subledgers; conditional handoff cards expand separately into actual concrete exchanges without a mixed-material fixed UUID or conflating different material quantities."
      unit: "Raw declared native units; physical masses kg, geometry m2, supplied energy kWh and service h kept distinct; exact same-ID/current-state bridge required before conversion."
      frequency: "At each actual receipt, issue, installation pass, correction, waste/usable exit, meter boundary, stock close and state acceptance; retain every event and correction lineage."
      temporal_coverage: "All actual periods from this node's first lot event to its last attributable correction, stock/work-in-progress closure and final roofing acceptance; retain dates and incomplete gate status."
      site_scope: "Named roof/site, lot, actual surface IDs and custody sublocations operated by survey_receive; link external suppliers/custodians and all eligible shared consumers without importing another node's quantity."
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed actual product/design and interface revisions; calibrated instruments and exact bridges; supplier receipts/issues; matched custody; material-resolved waste tickets; actual meter topology/service contracts and complete consumer register; as-built gate photographs/signatures, water/mass closure and correction history. Retain independent incoming/outgoing assembly component masses in kg, exclusive whole-versus-constituent view, material-fate ownership and signed closure diagnostic; the final retained covering mass is not a second customer output."
