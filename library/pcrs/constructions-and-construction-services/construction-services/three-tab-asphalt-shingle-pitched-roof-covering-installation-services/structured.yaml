  data_quality_requirements:
    - id: quality_instructions
      applies_to: "Actual route and every component"
      requirement: "Retain the actual installed supplier/SKU instruction revision and project design, deck acceptance and named interface ownership. Historical route references do not provide current universal prescriptions."
      evidence: "Actual instruction/design package, signed release and complete component schedule; gaf-three-tab-route; gaf-fiberglass-physical-state"
    - id: quality_identity
      applies_to: "Each actual concrete exchange"
      requirement: "Resolve material, composite versus constituent view, physical state, provider/geography/voltage or waste destination. Direct releases require actual substance/particle basis, medium and direction. A useful semantic umbrella is not a verified concrete final exchange."
      evidence: "Supplier IDs/state/formulation, waste custody tickets and substance sampling evidence."
    - id: quality_geometry
      applies_to: "Final and internal area states"
      requirement: "Keep distinct measured surfaces/state IDs, openings subtracted once and actual accepted gates. No plan-area substitution, repeated-pass output or automatic internal A/A."
      evidence: "As-built geometry, unique surface registry and matched handoff signatures."
    - id: quality_stock
      applies_to: "Receipt, issues, usable exits and packaging"
      requirement: "Reconcile gross opening/receipts/closing by exact material and state at all actual custody sublocations. Unissued stock, issued unused exits, waste, retained mass and processed WIP are mutually exclusive. Packaging downstream requires an entering custody link."
      evidence: "Stock counts/scales, unique issue/feed records, return and waste tickets, supplier dataset boundary."
    - id: quality_mass_water
      applies_to: "All real nodes and actual periods"
      requirement: "Close material and water pools on compatible units with current-state bridges and uncertainty. Do not include observational area in kg balances. Incoming retained assembly mass and formulation/received water must be measured rather than guessed from area. Gaps remain disclosed; no emission by difference without validated fate evidence."
      evidence: "Node component/water-fate manifests, independent quantities/fractions, mass/water closure and uncertainty records."
    - id: quality_rework
      applies_to: "Rejected, removed, corrected and WIP states"
      requirement: "Record defect, producing node, disposition, directed transfer and actual repeated inputs/service. Corrected electronic records retain lineage. Unresolved rejected or installed-unaccepted work cannot enlarge accepted A."
      evidence: "Timestamped defect/disposition and rework logs, receiving custody and final gate."
    - id: quality_periods
      applies_to: "All lot and reporting periods"
      requirement: "Provide complete event dates, stock/WIP movements and period-specific input/asset/output attribution through actual acceptance, including waiting/protection and termination/replacement decisions."
      evidence: "Period/phase register and signed attribution decisions; missing intervals remain explicit gaps."
    - id: quality_shared
      applies_to: "All shared power and service consumers"
      requirement: "Provide meter topology/converted deltas or actual billed service periods, all inside-master direct assignments, complete eligible consumers and evidence-backed weights only where residual allocation is needed."
      evidence: "Calibrated meters/topology, provider records, consumer register and assignment reconciliation."
    - id: quality_estimates
      applies_to: "Each individual Range"
      requirement: "Keep all non-reference screens provisional reasoned_estimate; no external quantitative support is claimed for them. They are not recipes or default activity data. Replace with independent reviewed evidence and do not validate a batch using a range derived from its own maximum."
      evidence: "Separate reviewed reference sample or documented measurement/factor uncertainty; investigation records for out-of-screen values."
    - id: quality_completeness
      applies_to: "Dataset and boundary disclosure"
      requirement: "Report unknowns, actual nonoccurrence evidence, performed/skipped checks and unfinished gates. Zero, absence and unknown are different states; omitted actual work requires scope correction."
      evidence: "Auditable field completeness/gap register and signed boundary/acceptance review."
validation_rules:
  - rule_id: validate_scope
    applies_to: "Site/lot and actual work"
    rule: "Confirm dry compatible accepted timber deck and actual three-tab mechanical-nailed route. Reassess and inventory actual deck/structural/cricket/chimney/counterflashing/vent work beyond the released external interface; reject hidden exclusions."
    source_ids:
      - gaf-three-tab-route
  - rule_id: validate_components
    applies_to: "Assembly and joining"
    rule: "Reconcile the complete actual component schedule, required layers and junction/vent ownership with receipt, measured issues, same-state feeds, installed retention and real waste/unused/WIP fates. Verify actual instruction/design acceptance requirements without universal counts or performance defaults."
    source_ids:
      - gaf-three-tab-route
      - gaf-fiberglass-physical-state
  - rule_id: validate_handoffs
    applies_to: "All deck/material/assembly/packaging transfers"
    rule: "Compare both sides by event, material or surface ID, current state, quantity/unit, period and custodian. Keep physical observational interfaces separate from design evidence. Never fix internal feeds to one or create additional external production at downstream nodes."
    source_ids: []
  - rule_id: validate_final_area
    applies_to: "accepted_roof_service"
    rule: "Require A > 0 from unique final accepted sloped geometry, openings excluded once and all gate evidence present. Count A/A exactly once; exclude incomplete seal/junction/vent conditions, unresolved rejects and unaccepted WIP. Do not add laps, cuts or rework area."
    source_ids:
      - gaf-three-tab-route
  - rule_id: validate_receipt_exit
    applies_to: "Gross stock and positive U/X"
    rule: "Check G = opening + receipts - intact unissued closing once with exact custody/sublocation. Match all gross to measured issues, actual receipt waste, usable exits and exclusive fates. No second exit subtraction, negative credit, missing downstream entry or duplicate packaging coverage."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "Each rejected/off-spec event"
    rule: "Require producing node/state, disposition and matched directed rework/return or real waste/recovery/usable boundary exit. Retain all repeated operations and original material burdens; no unresolved rejected area counted as accepted output."
    source_ids: []
  - rule_id: validate_finishing
    applies_to: "finish_accept"
    rule: "Verify actual parent-to-finished handoff, specified/actual finish occurrence, supplied materials/services and exclusive residues/releases. Record seal waiting and actual protection loads, with no assumed paint, fixed seal time or invented heating."
    source_ids:
      - gaf-three-tab-route
  - rule_id: validate_mass_water
    applies_to: "All nodes and finish water fates"
    rule: "Check exact native-to-kg bridges and exclusive material/component water pools, retaining actual incoming assembly mass/water. Water gross excludes intact stock once; U/X, retained bound/free, handoff, waste water, direct liquid, closing processed WIP and other transfers cannot overlap. A residual or negative balance is a gap, never automatic H2O vapour or another emission."
    source_ids: []
  - rule_id: validate_release
    applies_to: "Each direct environmental exchange"
    rule: "Require actual substance/particle basis, direction, medium, quantity and capture evidence. Separate captured waste and liquid custodian transfer from uncaptured environment releases; H2O-to-air identity alone supplies neither occurrence nor quantity."
    source_ids: []
  - rule_id: validate_power_service
    applies_to: "Every shared asset, node and period"
    rule: "Identify provider/asset and actual period/topology, all consuming nodes/lots/periods and reviewed assignment basis. Reconcile converted meter/billed totals once. Subtract inside-master direct only; zero residual needs no weights, positive residual needs complete positive eligible denominator. Negative/unknown closure blocks attribution. No default shift/labor/lifetime proxy."
    source_ids: []
  - rule_id: validate_periods
    applies_to: "Full lot through acceptance"
    rule: "Verify every actual period/phase/event and stock/WIP carry-forward with period-specific attribution. Investigate gaps, unresolved replacements/termination and duplicate burden assignment; final unique A appears once."
    source_ids: []
  - rule_id: validate_dimensions
    applies_to: "Cards, protocols and calculations"
    rule: "Require own-node protocol linkage, declared ASCII raw fields/inputs and compatible units. Every inventory-linked actual_* output is the unnormalized physical numerator named in its rule and card amount; normalize once by A. Observation-only and component subledger outputs remain protocol measurements and must not create additional exchanges. normalized_accepted_roof_service is the sole already-normalized output."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "Every individual flow card"
    rule: "Keep an individual provisional reasoned_estimate diagnostic Range for every non-reference card and the strict calculated 1..1 reference identity. Investigate extremes, required-role absence and completeness independently; a screen pass never proves physical or identity readiness."
    source_ids: []
  - rule_id: validate_reporting
    applies_to: "Published dataset package"
    rule: "Disclose actual boundary, supplier instruction/design and dataset coverage, periods, method/measurement evidence, gaps and performed/skipped checks. Do not finalize an exchange with an unresolved concrete identity or property/unit support."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground installation-service data package; downstream process and lifecyclemodel projections retain this reviewed boundary and acceptance gate."
  downstream_use: "secondary_dataset and background_dataset where actual product, route, geography, period, released interface and acceptance conditions are compatible and disclosed."
  allowed_use: "The specified complete mechanically nailed fiberglass three-tab covering installation service on a received accepted dry timber deck, using actual component/finish/support records normalized to accepted unique A."
  excluded_use: "Universal roofing, framing/deck repair/production, reroof tear-off/overlay, other roofing routes or future use/maintenance/end-of-life; extrapolation of historical product dimensions/performance or provisional screens as defaults."
  required_metadata: "PCR identity, actual site/lot and dates, geometry/openings, supplier/SKU/batches/instruction revisions, design/release/ownership, component/packaging source boundaries, periods/assets, rework/dispositions, all actual exchange units and final gate."
  required_quality_disclosure: "Identity/support coverage, actual measurement/bridge and calibration evidence, collection coverage, stock/custody/meter and material/water reconciliation, provisional ranges, allocation decisions, missing periods/quantities/species and performed/skipped checks."
  update_trigger: "Change in product/route, deck interface, responsibility, design/instructions, layer/detail/seal/vent requirements, actual finish/cleanup, supplier/property/unit, service topology, allocation treatment, period coverage or new evidence affecting a gap or screen."
data_sources:
  - id: "gaf-three-tab-route"
    type: "handbook"
    reference: "https://www.gaf.com/en-us/document-library/documents/installation-instructions-%26-guides/royal-sovereign-shingles-english-size-installation-instructions.pdf"
    used_for: "GAF Royal Sovereign/Sentinel English-size installation instructions, historical cover Updated 10/14; product-specific route decomposition, underlay/edge/nailing/starter/hip-ridge/junction/valley/vent roles, hand-seal conditionality, retained shingle release film and potential cutting dust/fumes. Actual supplier instructions/design govern the installed roof. No numeric slope/layer/lap/nail/temperature/time/performance default is adopted."
  - id: "gaf-fiberglass-physical-state"
    type: "handbook"
    reference: "https://www.gaf.com/en-us/document-library/documents/data-sheets/royal-sovereign-metrics-_data-sheet.pdf"
    used_for: "GAF Royal Sovereign metric datasheet, explicit fiberglass/asphalt finished construction only. Metric dimensions, piece/nail counts and performance/warranty/standards statements supply no generic activity or design factors."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:a892f04b303c99098fd93d48bf69a2697f22ffdc82b324db37b008456232acc4"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_7554"
      family: "system_boundary"
      span:
        start:
          offset: 7554
          line: 64
          column: 1
        end:
          offset: 97483
          line: 1162
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Dry accepted timber deck, compatible actual nail-holding substrate and released geometry/interfaces; actual roof product/design instruction set and ownership register available. |\n| starting_condition_role | Externally delivered physical asset interface observed in area, with no deck manufacture represented as a new material input. |\n| product_classification_scope | The specified new three-tab covering installation service; classification context does not broaden it to every roofing or structural service. |\n| recursive_input_rule | A received component uses an appropriate upstream product dataset; do not recursively expand another roofing service or treat the observational deck interface as this service. Any same-category subcontract must have an explicit nonoverlapping responsibility and burden boundary. |\n| upstream_dataset_requirement | Actual material/provider/state/geography and dataset gate, including transport/packaging coverage, must be declared. Preserve component upstream burdens at the single external gross acquisition; internal issues/feed retain them without repurchase. |\n| disclosure | Site/roof/lot, released deck and external owners, actual supplier instruction and design revisions, every period, component/packaging boundary, actual accessory/finish occurrence, rework, incomplete seals, waste destinations and gaps. |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_received_deck | survey_receive | Start at the signed accepted dry compatible timber-deck release. Keep the physical deck geometry separate from drawings/inspection evidence. If actual deck repair or new structural/junction work occurs, reassess and include that responsibility before finalizing the lot. | gaf-three-tab-route |\n| boundary_components | survey_receive; underlay_edges; shingle_details | Enumerate actual underlay/leak-barrier, edge metal, underlay fixings/seal consumables, field shingles, separately purchased starter/caps, roof nails, flashing/owned vents and sealing formulations. Keep exact supplier/material/current state and component schedule; field-stock caps are internal transformation rather than a second purchase. | gaf-three-tab-route; gaf-fiberglass-physical-state |\n| boundary_gross_custody | All staged materials and packaging | External gross draw G = opening + external receipts - intact unissued closing stock once across actual sublocations. G includes real receipt waste and positive U/X usable exits. Match every measured source issue to its actual downstream internal feed. No later external repurchase, inferred residual issue or duplicate closing-stock subtraction. |  |\n| boundary_packaging | All four nodes | Packaging remaining with materials follows its measured source issue/feed. Count actual unpacking at its real node; supplier packaging coverage carries upstream burden once. Required retained shingle release film is not assumed loose waste. | gaf-three-tab-route |\n| boundary_assembly_handoffs | underlay_edges; shingle_details; finish_accept | Release the underlaid edge-detailed surface to shingling and the installed detailed covering to finishing using matched actual surface/state/custody records and component manifests. These internal interfaces are not additional final services or fixed unit quantities. | gaf-three-tab-route |\n| boundary_finishing | finish_accept | Start finishing from the installed detailed roof. Apply only actual specified accessory finish/cleanup, direct fresh water and owned support services. Catalogue appearance preferences alone do not require paint. Keep residues, unused exits and species releases distinct until the completed accepted output is recorded. | gaf-three-tab-route |\n| boundary_gate | accepted_roof_service | Acceptance requires the actual declared seal, drainage, junction and owned ventilation conditions. Record waiting/weather and actual protection loads. Do not infer instant sealing, a fixed curing time or invented heating. All attributable corrections and services through this gate remain in the lot. | gaf-three-tab-route |\n| boundary_period_assets | Each node and actual reporting period | Enumerate receipt, installation, waiting/protection, correction, stock/WIP closure and acceptance periods. Link assets, inputs, transfers and disposition to periods; identify all actual shared power/access consumers, contract/meter boundaries and reviewed period-specific assignment decisions. No universal lifetime or annual period is assumed. |  |\n| boundary_water_species | Actual operation and destination | Fresh supplied water belongs only to finish_accept for this route. Extra water-using operations require explicit semantic scope/card review. Measure formulation/received water and exclusive fates at the actual node. Identify actual species and receiving medium for direct releases; mass differences remain gaps. |  |\n| boundary_outside | Excluded work and phases | Exclude delivered accepted framing/deck production, old-roof tear-off/overlay, hot-bitumen/torch/liquid-membrane systems and future use/maintenance/end-of-life; disclose external providers and interfaces rather than concealing actual contractor work. | gaf-three-tab-route |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Receipt protection and handling packaging (`receive_packaging`)\n\nProcess / prospective direction / type: `survey_receive` / `inputs` / `product`.\n\nPackaging and receipt protection actually entering with the roofing materials, resolved by composition and reusable status. Retain the supplier dataset packaging boundary so upstream production is represented once. Packaging remaining on issued stock follows a measured issue/feed link to the unpacking node.\n\n- Collection subject: Receipt protection and handling packaging\n- Flow property / unit: Mass / kg\n- Amount rule: actual_receive_packaging/A\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_survey_receive`\n- Unverified optional screening aid: Receipt protection and handling packaging — provisional diagnostic screen\n  - Range role: QA guardrail (`qa_guardrail`)\n  - Lower: 0\n  - Upper: 500\n  - Unit: kg\n  - Basis: per 1 m2 final accepted unique net s