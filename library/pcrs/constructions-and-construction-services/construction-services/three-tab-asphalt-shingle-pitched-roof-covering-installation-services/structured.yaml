system_boundary:
  rules:
    - rule_id: boundary_received_deck
      applies_to: "survey_receive"
      rule: "Start at the signed accepted dry compatible timber-deck release. Keep the physical deck geometry separate from drawings/inspection evidence. If actual deck repair or new structural/junction work occurs, reassess and include that responsibility before finalizing the lot."
      source_ids:
        - gaf-three-tab-route
    - rule_id: boundary_components
      applies_to: "survey_receive; underlay_edges; shingle_details"
      rule: "Enumerate actual underlay/leak-barrier, edge metal, underlay fixings/seal consumables, field shingles, separately purchased starter/caps, roof nails, flashing/owned vents and sealing formulations. Keep exact supplier/material/current state and component schedule; field-stock caps are internal transformation rather than a second purchase."
      source_ids:
        - gaf-three-tab-route
        - gaf-fiberglass-physical-state
    - rule_id: boundary_gross_custody
      applies_to: "All staged materials and packaging"
      rule: "External gross draw G = opening + external receipts - intact unissued closing stock once across actual sublocations. G includes real receipt waste and positive U/X usable exits. Match every measured source issue to its actual downstream internal feed. No later external repurchase, inferred residual issue or duplicate closing-stock subtraction."
      source_ids: []
    - rule_id: boundary_packaging
      applies_to: "All four nodes"
      rule: "Packaging remaining with materials follows its measured source issue/feed. Count actual unpacking at its real node; supplier packaging coverage carries upstream burden once. Required retained shingle release film is not assumed loose waste."
      source_ids:
        - gaf-three-tab-route
    - rule_id: boundary_assembly_handoffs
      applies_to: "underlay_edges; shingle_details; finish_accept"
      rule: "Release the underlaid edge-detailed surface to shingling and the installed detailed covering to finishing using matched actual surface/state/custody records and component manifests. These internal interfaces are not additional final services or fixed unit quantities."
      source_ids:
        - gaf-three-tab-route
    - rule_id: boundary_finishing
      applies_to: "finish_accept"
      rule: "Start finishing from the installed detailed roof. Apply only actual specified accessory finish/cleanup, direct fresh water and owned support services. Catalogue appearance preferences alone do not require paint. Keep residues, unused exits and species releases distinct until the completed accepted output is recorded."
      source_ids:
        - gaf-three-tab-route
    - rule_id: boundary_gate
      applies_to: "accepted_roof_service"
      rule: "Acceptance requires the actual declared seal, drainage, junction and owned ventilation conditions. Record waiting/weather and actual protection loads. Do not infer instant sealing, a fixed curing time or invented heating. All attributable corrections and services through this gate remain in the lot."
      source_ids:
        - gaf-three-tab-route
    - rule_id: boundary_period_assets
      applies_to: "Each node and actual reporting period"
      rule: "Enumerate receipt, installation, waiting/protection, correction, stock/WIP closure and acceptance periods. Link assets, inputs, transfers and disposition to periods; identify all actual shared power/access consumers, contract/meter boundaries and reviewed period-specific assignment decisions. No universal lifetime or annual period is assumed."
      source_ids: []
    - rule_id: boundary_water_species
      applies_to: "Actual operation and destination"
      rule: "Fresh supplied water belongs only to finish_accept for this route. Extra water-using operations require explicit semantic scope/card review. Measure formulation/received water and exclusive fates at the actual node. Identify actual species and receiving medium for direct releases; mass differences remain gaps."
      source_ids: []
