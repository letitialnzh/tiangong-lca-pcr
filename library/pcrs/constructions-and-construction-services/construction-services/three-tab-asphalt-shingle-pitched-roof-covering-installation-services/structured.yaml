  calculation_rules:
    - id: calc_deck_interface
      applies_to: "survey_receive / observational acceptance record (deck_interface)"
      rule: "actual_deck_interface = measured deck_interface_actual_quantity converted to m2 with the recorded geometry bridge, reconciled by unique surface IDs, state and directed transfer. Do not sum repeated measurements of the same state or replace measured internal area with final A. Rework operations retain their real burdens while final unique area is counted once. The output is the physical area numerator."
      inputs:
        - "raw:deck_interface_actual_quantity"
        - "raw:deck_interface_native_unit"
        - "raw:deck_interface_mass_or_geometry_bridge"
        - "raw:deck_interface_actual_state"
        - "raw:deck_interface_measured_absence_evidence"
        - "raw:deck_interface_destination"
        - "cp:cp_survey_receive"
        - "symbol:A"
      output: "actual_deck_interface"
      source_ids: []
    - id: calc_receive_packaging
      applies_to: "survey_receive / receive_packaging"
      rule: "actual_receive_packaging = receive_packaging_opening + receive_packaging_receipts - receive_packaging_closing_intact, with each term first expressed in kg from the exact native quantity, actual_mass_factor and factor_state_evidence. Deduct intact unissued stock once; retain actual U/X exits in gross draw. The output is the physical numerator, not an intensity."
      inputs:
        - "raw:receive_packaging_opening"
        - "raw:receive_packaging_receipts"
        - "raw:receive_packaging_closing_intact"
        - "raw:receive_packaging_native_unit"
        - "raw:receive_packaging_native_quantity"
        - "raw:receive_packaging_actual_mass_factor"
        - "raw:receive_packaging_factor_state_evidence"
        - "cp:cp_survey_receive"
        - "symbol:A"
      output: "actual_receive_packaging"
      source_ids: []
    - id: calc_receive_reject
      applies_to: "survey_receive / receive_reject"
      rule: "actual_receive_reject = sum(receive_reject_actual_quantity) over unique actual events in kg after exact identity/state conversion from native_unit and mass_or_geometry_bridge. Preserve actual_state, destination and measured_absence_evidence; unknown occurrence or quantity remains a gap. Keep composition, water content, custodian and actual destination; discarded material is distinct from usable returns and direct environmental releases."
      inputs:
        - "raw:receive_reject_actual_quantity"
        - "raw:receive_reject_native_unit"
        - "raw:receive_reject_mass_or_geometry_bridge"
        - "raw:receive_reject_actual_state"
        - "raw:receive_reject_measured_absence_evidence"
        - "raw:receive_reject_destination"
        - "cp:cp_survey_receive"
        - "symbol:A"
      output: "actual_receive_reject"
      source_ids: []
    - id: calc_receive_packaging_waste
      applies_to: "survey_receive / receive_packaging_waste"
      rule: "actual_receive_packaging_waste = sum(receive_packaging_waste_actual_quantity) over unique actual events in kg after exact identity/state conversion from native_unit and mass_or_geometry_bridge. Preserve actual_state, destination and measured_absence_evidence; unknown occurrence or quantity remains a gap. Keep composition, water content, custodian and actual destination; discarded material is distinct from usable returns and direct environmental releases."
      inputs:
        - "raw:receive_packaging_waste_actual_quantity"
        - "raw:receive_packaging_waste_native_unit"
        - "raw:receive_packaging_waste_mass_or_geometry_bridge"
        - "raw:receive_packaging_waste_actual_state"
        - "raw:receive_packaging_waste_measured_absence_evidence"
        - "raw:receive_packaging_waste_destination"
        - "cp:cp_survey_receive"
        - "symbol:A"
      output: "actual_receive_packaging_waste"
      source_ids: []
    - id: calc_receive_unused_return
      applies_to: "survey_receive / receive_unused_return"
      rule: "actual_receive_unused_return = sum(receive_unused_return_actual_quantity) over unique actual events in kg after exact identity/state conversion from native_unit and mass_or_geometry_bridge. Preserve actual_state, destination and measured_absence_evidence; unknown occurrence or quantity remains a gap. Split usable returns U and usable external transfers X into mutually exclusive positive custody exits; exclude intact unissued stock, retained material, waste and processed WIP. Transfer only evidenced original unused material upstream burden; construction, service and rework burdens remain with this roofing lot. No avoided-production credit or second negative subtraction."
      inputs:
        - "raw:receive_unused_return_actual_quantity"
        - "raw:receive_unused_return_native_unit"
        - "raw:receive_unused_return_mass_or_geometry_bridge"
        - "raw:receive_unused_return_actual_state"
        - "raw:receive_unused_return_measured_absence_evidence"
        - "raw:receive_unused_return_destination"
        - "cp:cp_survey_receive"
        - "symbol:A"
      output: "actual_receive_unused_return"
      source_ids: []
    - id: calc_survey_receive_electricity
      applies_to: "survey_receive / survey_receive_electricity"
      rule: "actual_survey_receive_electricity = directly assigned actual converted meter deltas + eligible share of positive reconciled master residual. Each delta = (meter_end - meter_start) * unit_factor for its actual period. Residual = converted master_total - inside_master_direct_total, including every directly assigned inside-master consumer once; outside_master_direct_total is recorded but never subtracted from this master. If residual is zero, no weights are required. If residual is positive, share = residual * consumer_weight / all_eligible_weights with a complete eligible consumer register and positive weights/denominator. Negative or unknown residual requires correction and remains a gap. The output is physical kWh, normalized only at the card."
      inputs:
        - "raw:survey_receive_electricity_meter_id"
        - "raw:survey_receive_electricity_meter_start"
        - "raw:survey_receive_electricity_meter_end"
        - "raw:survey_receive_electricity_unit_factor"
        - "raw:survey_receive_electricity_meter_parent"
        - "raw:survey_receive_electricity_inside_master_direct_total"
        - "raw:survey_receive_electricity_outside_master_direct_total"
        - "raw:survey_receive_electricity_master_total"
        - "raw:survey_receive_electricity_consumer_weight"
        - "raw:survey_receive_electricity_all_eligible_weights"
        - "raw:survey_receive_electricity_period"
        - "raw:survey_receive_electricity_topology_evidence"
        - "cp:cp_survey_receive"
        - "symbol:A"
      output: "actual_survey_receive_electricity"
      source_ids: []
    - id: calc_survey_receive_access_service
      applies_to: "survey_receive / survey_receive_access_service"
      rule: "actual_survey_receive_access_service = survey_receive_access_service_actual_service_quantity + eligible residual share, where directly assigned survey_receive_access_service_actual_service_quantity is this node/lot/period consumer's actual contracted direct assignment. Residual = survey_receive_access_service_billed_quantity - survey_receive_access_service_all_direct_assignments_total; the latter is the sum of every actual directly assigned consumer inside the same provider/asset/contract/service-period boundary, each once, proved by survey_receive_access_service_direct_assignment_register_evidence. When residual = 0, allocated residual share = 0 and no weights are required. When residual > 0, residual share = residual * survey_receive_access_service_consumer_weight / survey_receive_access_service_all_eligible_weights, using the complete actual eligible consumer register and positive evidence-backed weights/denominator. Negative or unknown residual is an unresolved assignment gap, never zero-clamped or a release. Direct assignments plus residual shares reconcile the actual billed service once. survey_receive_access_service_owned_idle is included once in the applicable direct assignment or residual billed availability according to survey_receive_access_service_contract_idle_basis_evidence, never added again as extra h. Retain actual period_start/period_end, provider/asset and service scope. No labor-hour, assumed shift, lifetime or annualization proxy. Output is actual physical h before the card's single division by A."
      inputs:
        - "raw:survey_receive_access_service_asset_id"
        - "raw:survey_receive_access_service_period_start"
        - "raw:survey_receive_access_service_period_end"
        - "raw:survey_receive_access_service_billed_quantity"
        - "raw:survey_receive_access_service_actual_service_quantity"
        - "raw:survey_receive_access_service_owned_idle"
        - "raw:survey_receive_access_service_consumer_weight"
        - "raw:survey_receive_access_service_all_eligible_weights"
        - "raw:survey_receive_access_service_assignment_evidence"
        - "raw:survey_receive_access_service_all_direct_assignments_total"
        - "raw:survey_receive_access_service_direct_assignment_register_evidence"
        - "raw:survey_receive_access_service_contract_idle_basis_evidence"
        - "cp:cp_survey_receive"
        - "symbol:A"
      output: "actual_survey_receive_access_service"
      source_ids: []
    - id: calc_underlay
      applies_to: "underlay_edges / underlay"
      rule: "actual_underlay = sum(underlay_received_quantity_kg) over unique source issue IDs matched to issue_underlay and the same material/state/custody. Keep this internal numerator before own-node waste, unused exits or retained incorporation. It carries the existing upstream burden once, with no external repurchase or second stock deduction."
