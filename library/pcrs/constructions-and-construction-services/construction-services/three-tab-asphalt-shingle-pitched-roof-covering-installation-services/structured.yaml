l_owner_exclusivity_evidence so all bound/free retention, waste, direct liquid, handoff, other transfer and closing processed-WIP pools are exclusive; total wet formulation/waste mass is not a water mass. Require finish_water_vapour_validated_evaporation_evidence and uncertainty review for occurrence and quantity. A negative result or unclosed balance remains a gap, not automatic vapour, zero-clamping or another release. Output is actual own-node physical kg H2O to air unspecified before division by A."
