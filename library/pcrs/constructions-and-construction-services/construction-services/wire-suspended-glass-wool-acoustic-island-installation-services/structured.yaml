allocation_rules:
  - rule_id: single_service_output
    applies_to: "island_install"
    rule: "The only intended output is the accepted installation service. Retain all attributable materials, powered-tool/access consumption, cleanup, failed attempts and corrective work through acceptance. Usable returns and wastes are disposition exits, not intended co-products."
    source_ids: []
  - rule_id: shared_event_attribution
    applies_to: "island_install"
    rule: "For several islands in one job, identify the event and consumers. Prefer direct records; attribute demonstrably shared resource totals using documented measured use or a justified physical driver, with shares summing to the event total. Preserve differing configurations as separate strata; do not assume equal counts are equivalent."
    source_ids: []
  - rule_id: reject_return_treatment
    applies_to: "usable_returns; installation_waste"
    rule: "Link every reject to correction within island_install or a documented usable-return/waste exit. Exclude rejects from accepted count. Reconcile unused returned inventory once; do not credit failed installation effort, assume reuse for damaged material, or claim avoided virgin manufacture/recycling credits without a separately declared downstream method."
    source_ids: []
  - rule_id: access_energy_boundary
    applies_to: "access_service; installation_electricity"
    rule: "Document service provider and period, attributable access hours, and included equipment/fuel/charging burdens. Match the electricity boundary to the actual service dataset; keep one burden owner for each operation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_components
      process_id: "island_install"
      flow_role: "Panels, suspension and usable returns"
      record_type: "Receipt, issue, count, weighing and return records"
      raw_fields: "event_id; component_id; model; material; dimensions; finish; received_count; installed_count; replaced_count; returned_count; opening_stock; closing_stock; actual_net_mass; wire_length; anchor_position; destination; transfer_id; packaging_id; packaging_count; custody_owner"
      collection_method: "Count and identify panels and every fitted suspension part; use calibrated weighing or traceable exact-part net-mass records for kg rows; reconcile receipts/stock/returns and keep accepted structural-fixing evidence separate. Aggregation detail: Attributable net component quantities per reference flow; reconcile usable returns once without removing consumed failed-work resources Record reusable packaging material, count, net mass, custody transfers and opening/closing stocks."
      unit: "item; kg; mm"
      frequency: "Every installation and return/replacement"
      temporal_coverage: "Complete event through acceptance and assigned return disposition"
      site_scope: "One declared site and configuration stratum"
      aggregation_rule: "per reference flow"
      quality_evidence: "Invoices, part records, scale evidence, installation photographs, stock and return receipts"
    - protocol_id: cp_resources
      process_id: "island_install"
      flow_role: "Consumables, electricity, access and conditional water"
      record_type: "Meter, equipment log, issue and cleanup record"
      raw_fields: "event_id; resource_id; material; amount; unit; device; meter_start; meter_end; charging_boundary; equipment_id; service_start; service_end; service_hours; consumers; asset_id; period_start; period_end; attribution_driver; included_service_burdens; no_use_evidence"
      collection_method: "Meter actual electricity including assigned charging; identify tool/lift operations and supported manual alternatives; record supplied consumables/water and access duration; document supplier boundary and shared-event attribution. Aggregation detail: Attribute shared totals once with documented physical evidence, then divide attributable event totals by accepted installations to obtain amounts per reference flow"
      unit: "kg; kWh; h"
      frequency: "Every resource use or shared event"
      temporal_coverage: "Whole installation including corrective work and cleanup"
      site_scope: "Same site/event/configuration stratum"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter readings/calibration, logs, issue records, provider scope, allocation reconciliation and actual no-use observations"
    - protocol_id: cp_handover
      process_id: "island_install"
      flow_role: "Accepted installation service"
      record_type: "Inspection and signed acceptance"
      raw_fields: "event_id; island_id; panel_model; dimensions; material; four_wire_route; suspension_part_ids; support_fixing_ids; support_acceptance; capacity_evidence; anchor_positions; retention; level; suspension_depth; layout; clearance; inspection_date; failed_checks; corrective_actions; acceptance_signature; accepted_count"
      collection_method: "Inspect against the exact product route and project layout; verify existing support acceptance, all four retained connections and supported adjustment; record actual geometry and corrective work before signed acceptance. Aggregation detail: Count only signed accepted islands; 1 item per reference flow"
      unit: "item; mm"
      frequency: "Every island and corrective inspection"
      temporal_coverage: "First installation through signed acceptance"
      site_scope: "Identified island and site"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed checklist, approved layout/instructions, support acceptance and photographs"
    - protocol_id: cp_waste
      process_id: "island_install"
      flow_role: "Packaging, rejected materials and captured residues"
      record_type: "Weighing and destination manifest"
      raw_fields: "event_id; waste_id; material; state; source_operation; reject_id; net_mass; destination; carrier; receiving_gate; transfer_id; treatment_scope"
      collection_method: "Separate and weigh actual packaging and discarded material/residue by material and destination; reconcile rejects against replacements and returns; identify actual liquid waste from any wet cleanup. Aggregation detail: Total attributable kg by waste identity/destination per reference flow; assign each waste transport/treatment burden once"
      unit: "kg"
      frequency: "Every waste exit"
      temporal_coverage: "Complete event and assigned waste handoff"
      site_scope: "Attributable site work only"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale/tare evidence, waste receipts, carrier/destination records and stock/reject reconciliation"
    - protocol_id: cp_air
      process_id: "island_install"
      flow_role: "Conditional direct release to air"
      record_type: "Activity assessment, monitoring or applicable factor record"
      raw_fields: "event_id; operation; material; substance; particle_or_fibre_fraction; receiving_compartment; method; measured_concentration; volume_or_activity; factor; factor_basis; captured_mass; release_mass; uncertainty; no_release_evidence; missing_evidence"
      collection_method: "Assess actual handling and anchor fitting; retain monitoring or applicable reviewed factor with substance/fraction and air compartment; separate captured waste. Record justified non-occurrence and unavailable data distinctly. Aggregation detail: Aggregate identified release amounts per reference flow with method and coverage; never substitute missing data with zero"
      unit: "kg"
      frequency: "Every relevant operation or representative documented monitoring period"
      temporal_coverage: "Whole relevant event including cleanup"
      site_scope: "Specified work location and receiving air compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Monitoring/factor applicability, activity records, uncertainty and capture/destination evidence"
  calculation_rules:
    - id: event_normalization
      applies_to: "all inventory rows"
      rule: "For each configuration stratum, attributable event amount divided by signed accepted installation count gives amount per reference flow; retain excluded/failed work ownership and do not divide by merely supplied panels. If accepted count is zero, no accepted-service dataset can be produced."
      inputs:
        - "event quantities"
        - accepted_count
        - cp_handover
        - "relevant node protocol"
      output: "Amounts per 1 item accepted installation"
      source_ids: []
    - id: component_reconciliation
      applies_to: "panel_input; suspension_components; usable_returns; installation_waste"
      rule: "Reconcile opening stock plus received items to installed components, usable returns, discarded components and closing stock on a consistent count/mass basis; retain replacement-event links and exact-part weighing evidence. Do not infer total assembly kg from nominal panel kg."
      inputs:
        - cp_components
        - cp_waste
      output: "Component balance and missing-record flags"
      source_ids: []
    - id: shared_resources
      applies_to: "installation_electricity; access_service; handling_consumables; cleaning_water"
      rule: "Allocate each shared recorded event total across actual consumers using the documented physical driver; reconcile shares with the total, preserve the service dataset energy boundary, then use event_normalization."
      inputs:
        - cp_resources
        - cp_handover
      output: "Attributed resource amounts and boundary reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: route_identity
      applies_to: "all inventory rows"
      requirement: "Retain glass-wool identity, finished single horizontal panel state, exact model and four-wire interfaces. Do not pool alternate suspension topologies or infer other manufacturers are equivalent."
      evidence: "Exact-product instructions, part records and installation photographs"
    - id: support_gate
      applies_to: "accepted_island_installation"
      requirement: "Document prior structural fixing acceptance and capacity evidence plus signed retained-connection/geometry inspection; unknown support or failed retention prevents accepted output."
      evidence: "cp_handover; approved project layout; ecophon-ig402-2024"
    - id: coverage
      applies_to: "all inventory rows"
      requirement: "Cover the entire event and corrective work; disclose missing quantities, uncertain attribution, conditional non-use and upstream delivery/treatment boundaries. Unavailable direct-emission evidence stays explicit."
      evidence: "All node protocols, balances and missing-data register"
    - id: representativeness
      applies_to: "all inventory rows"
      requirement: "Report site, dates, configuration, crew/access practice, metering coverage and measurement uncertainty. Pool only compatible declared configurations and retain source-event denominators."
      evidence: "Event register, cp_components, cp_resources, cp_handover"
    - id: identity_resolution
      applies_to: "all inventory rows"
      requirement: "Before final TIDAS exchanges, verify each actual concrete product/waste/elementary identity and its property/unit chain. Conditional umbrella cards are recording requirements, not concrete exchange UUIDs."
      evidence: "Concrete exchange detail/support confirmation and destination evidence"
validation_rules:
  - rule_id: route_and_gate
    applies_to: "accepted_island_installation"
    rule: "Reject an accepted-output record without matched four-wire horizontal single-panel configuration, accepted support evidence, all required retained connections and signed installation inspection. Room acoustic results cannot substitute for this gate."
    source_ids:
      - ecophon-ig402-2024
  - rule_id: inventory_completeness
    applies_to: "island_install"
    rule: "Reconcile panels and suspension parts, usable returns, rejects and packaging; account for powered absorber-anchor fitting and actual access/charging/cleanup. Conditional zero-use must be observed and recorded, never inferred from pre-existing structural fixings."
    source_ids:
      - ecophon-ig402-2024
  - rule_id: reject_ownership
    applies_to: "usable_returns; installation_waste"
    rule: "Every off-spec island has a linked correction or exit. Unresolved rejects do not enter accepted count; repeated installation efforts and replaced components remain attributable once."
    source_ids: []
  - rule_id: quantity_and_ranges
    applies_to: "all inventory rows"
    rule: "Confirm normalization to signed accepted service count, actual kg/count identities and matching units. No generic yield, installation time, assembly mass, energy or waste range is prescribed; record the evidence need and obtain route-specific reference data before using guardrails."
    source_ids: []
  - rule_id: emission_and_identity
    applies_to: "airborne_release; all inventory rows"
    rule: "Require actual material/substance/fraction, receiving destination/compartment and applicable measurement/factor evidence for each concrete exchange. Missing identity or activity data remain disclosed gaps; no broad particulate identity or unsupported zero is acceptable."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground installation-event data package for a declared four-wire horizontal glass-wool acoustic island configuration"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projections after exchange identity resolution"
  allowed_use: "Model the declared first-installation event for compatible panels, support interfaces and access practice using actual upstream and destination datasets"
  excluded_use: "Structural-anchor construction, alternate mounting methods, full ceilings, added loads, normal use/maintenance/removal, universal room acoustic benefit or undocumented mass/area-equivalent installations"
  required_metadata: "Configuration/parts, site/dates, support acceptance, declared gates, handover count, actual geometry, collection/calculation methods, upstream delivery and access-energy boundaries, reject/return/waste destinations"
  required_quality_disclosure: "Data coverage and uncertainty, conditional non-use evidence, direct-release data gaps, unresolved identities, missing Range evidence and shared-resource attribution"
  update_trigger: "Panel material/dimensions, suspension topology, support/acceptance requirements, installation practice, boundary/provider scope, source instructions or data coverage changes"
data_sources:
  - id: "ecophon-ig402-2024"
    type: "handbook"
    reference: "Ecophon, Installation guide IG402 (2024.11), Solo Square M402; product page https://www.ecophon.com/en/products/free-hanging-units-and-baffles/solo/solo-square/ ; IG402 alternative 1 horizontal single-panel figures, pages 1, 3–8"
    used_for: "Four-wire route, panel anchor fitting, lift/support, adjustment, route-specific geometry and separation from other alternatives"
  - id: "ecophon-solo-square-spec"
    type: "handbook"
    reference: "Ecophon Solo Square specification, page 1. https://www.ecophon.com/globalassets/media/pdf-and-documents/specification-texts/pdf/solo/solo-square.pdf"
    used_for: "Finished glass-wool panel identity, installation-method dependence, retained hooks/anchors; laboratory absorption is a product descriptor, not room performance"
  - id: "un-cpc3-notes-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 explanatory notes (30 June 2025), subclass 54790, p. 298. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Acoustic panels/tiles applied to interior walls/ceilings within 54790; vibration insulation excluded"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:5644a56fdce0490ec9105890446e57745f5b763462dec01a9482b29b3a51f3db"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5509"
      family: "system_boundary"
      span:
        start:
          offset: 5509
          line: 58
          column: 1
        end:
          offset: 18550
          line: 215
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Finished panels and matched suspension components delivered to the site supply gate; suitable existing structural fixing points already installed, verified and accepted; work area accessible |\n| starting_condition_role | Declared prior physical interfaces; no claim that support construction has zero life-cycle burden |\n| product_classification_scope | Narrow acoustic-panel installation subset of CPC 3.0 54790; vibration insulation is outside this scope |\n| recursive_input_rule | If same-category installation is subcontracted, use the actual scoped subcontract service input and remove overlapping directly modelled work. Do not recursively substitute this PCR for an upstream burden dataset or count the same accepted island twice. |\n| upstream_dataset_requirement | Require upstream panel, hardware, electricity, access and relevant delivery/treatment datasets matching actual material, technology, geography and gate. Declare whether delivered input datasets include site delivery and packaging manufacture. |\n| disclosure | Record prior structural-anchor acceptance, exact four-wire route, inclusion of tool/lift operations and corrective work, upstream delivery gate, waste destination and all measured/estimated/unavailable activities. New structural fixing construction requires a separately disclosed process outside this PCR. |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| support_interface | island_install | Verify the existing fixing layout and capacity for the actual assembly before lifting. Follow the selected manufacturer route; do not import bracket-route torque, one-point geometry, inclined/stacked limits or added-load allowances. | `ecophon-ig402-2024` |\n| assembly_gate | island_install | Include component receipt/unpacking, panel marking and absorber-anchor fitting, temporary lift/support, four-wire engagement/adjustment and inspection through acceptance. Record tool, charging, access, consumable and cleanup activities when used. Adjust with the panel supported according to the guide. | `ecophon-ig402-2024` |\n| handover_limit | accepted_island_installation | Confirm retention, matching components, position, horizontality, suspension depth and clearance against the exact instructions/project criteria. A rejected or uninspected island is not an accepted output. Occupied use, later maintenance/removal and demonstrated room acoustic improvement are outside this event. | `ecophon-ig402-2024`; `ecophon-solo-square-spec` |\n| waste_release_split | installation_waste; airborne_release | Collected packaging, broken panels, trimmed wire and captured debris leave as destination-specific waste. Any actual airborne release requires identified substance/fraction, receiving air compartment and quantity evidence; captured dust is not an air emission. Missing evidence is a gap, not zero. |  |\n| `system_boundary_rule_5` | foreground_system_boundary | Shared tools, chargers and access equipment are shared infrastructure when they serve several island-installation instances in the same job. Identify each shared asset, every consuming island/event, the bounded service/charging period, measured use or documented physical attribution driver, and one burden owner. Record direct quantities where possible; reconcile allocated shares to the measured shared total. Provider equipment lifetime is supplied through its service dataset, not an invented installation-time lifetime. |  |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Matched adjustable-wire suspension and absorber-anchor components (`suspension_components`)\n\nProcess / prospective direction / type: `island_install` / `inputs` / `product`.\n\nRecord four matched adjustable wire hanger positions and four matched panel absorber-anchor positions for the representative single-panel route; include actual wire assemblies, locks/hooks and any specified cups/adapters installed. Existing structural fixings are the prior interface, not newly consumed components. Record concrete component identities separately when building exchanges.\n\n- Collection subject: Matched adjustable-wire suspension and absorber-anchor components\n- Flow property / unit: Mass / kg\n- Amount rule: Actual net kg of assigned suspension components by part identity, with installed counts, lengths, replacements, returns and waste reconciled.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_components`\n- Sources: `ecophon-ig402-2024`\n\nRange evidence need: the guide determines connection topology, not a kg range. Use actual part weights and matching installation configuration; no approximate panel-mass conversion.\n\n#### Collection requirement: Installation handling and cleanup consumables when used (`handling_consumables`)\n\nProcess / prospective direction / type: `island_install` / `inputs` / `product`.\n\nConditional umbrella for actual disposable protection and dry cleanup materials used by this event. Split actual materials and verify each identity; reusable equipment belongs to the access service boundary.\n\n- Collection subject: Installation handling and cleanup consumables when used\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable consumed kg by material; record an explicit no-use observation where none is consumed.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_resources`\n\nRange evidence need: collect route-specific consumable records; no presumed consumable dose.\n\n#### Collection requirement: Temporary panel-lifting and work-access service when used (`access_service`)\n\nProcess / prospective direction / type: `island_install` / `inputs` / `product`.\n\nRecord actual lifting/support/access service hours and equipment configuration. If supplier service data already include equipment energy, identify that boundary and do not add the same electricity again. No equipment-hour conversion to panels is assumed.\n\n- Collection subject: Temporary panel-lifting and work-access service when used\n- Flow property / unit: Duration / h\n- Amount rule: Actual attributable service h, documented from equipment/operator logs and event allocation; zero only with an evidenced no-use record.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_resources`\n- Sources: `ecophon-ig402-2024`\n\nRange evidence need: site access and lift practice vary; record actual service duration, with no universal installation-time prior.\n\n#### Collection requirement: Usable panels, components and reusable packaging returned as products (`usable_returns`)\n\nProcess / prospective direction / type: `island_install` / `outputs` / `product`.\n\nConditional exit for genuinely usable panels, suspension parts and reusable packaging returned to supplier/store or transferred to another job, identified by original product/material and destination. Record packaging custody and opening/closing stocks so reusable packaging is neither discarded waste nor a second net-input subtraction. Failed installed work remains unaccepted until corrected; not every removed item is reusable.\n\n- Collection subject: Usable panels, components and reusable packaging returned as products\n- Flow property / unit: Mass / kg\n- Amount rule: Actual net kg returned by concrete product/material identity; preserve panel/component/packaging counts and custody receipts, and reconcile removed, replaced, reassigned and retained stocks once.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_components`\n\nRange evidence need: quantify returns by actual disposition; no generic salvage or avoided-production credit.\n\n#### Collection requirement: Installation packaging waste at documented receiving treatment gate (`packaging_waste`)\n\nProcess / prospective direction / type: `island_install` / `outputs` / `waste`.\n\nRecord unpacked packaging by actual material and receiving reuse/recycling/disposal route. Reusable packaging returned as a product must be distinguished from packaging designated waste.\n\n- Collection subject: Installation packaging waste at documented receiving treatment gate\n- Flow property / unit: Mass / kg\n- Amount rule: Actual net kg by material and destination; include actual waste transport/treatment once through the declared downstream dataset boundary.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_waste`\n\nRange evidence need: weigh actual packaging for the delivered model/pack and split destinations; no universal packaging fraction.\n\n#### Collection requirement: Discarded panel, suspension and captured cleanup residues (`installation_waste`)\n\nProcess / prospective direction / type: `island_install` / `outputs` / `waste`.\n\nConditional umbrella for damaged glass-wool panels, discarded fasteners/wire offcuts and captured dust/debris. Split glass-wool, metal and other residues by material and destination; site construction waste outside the event is excluded. Include actual wastewater if wet cleanup produces it.\n\n- Collection subject: Discarded panel, suspension and captured cleanup residues\n- Flow property / unit: Mass / kg\n- Amount rule: Actual net kg by material/state and receiving destination, linked to the failed/replacement event and waste receipt.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_waste`\n\nRange evidence need: collect attributable reject and residue measurements; no assumed glass-wool waste factor or recycling recovery.\n\n#### Collection requirement: Identified installation-related substances released to air when evidenced (`airborne_release`)\n\nProcess / prospective direction / type: `island_install` / `outputs` / `elementary`.\n\nConditional semantic card requiring actual reported substance or particle/fibre fraction, receiving air compartment, event and measurement/factor basis before concrete exchange selection. Do not select a generic particulate UUID from the words glass wool; captured residues belong to waste.\n\n- Collection subject: Identified installation-related substances released to air when evidenced\n- Flow property / unit: Mass / kg\n- Amount rule: Actual measured or independently supported calculated kg by identified substance/fraction to the specified air compartment. Investigate plausible handling/anchor-fitting releases and disclose unavailable evidence rather than treating absence of data as zero.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_air`\n\nRange evidence need: no direct-emission factor or fibre-size distribution is established here. Obtain route/material-specific monitoring or an applicable reviewed factor before estimation.\n\n"
