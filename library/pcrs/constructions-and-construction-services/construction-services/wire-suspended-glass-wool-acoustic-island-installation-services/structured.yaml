  []
measurement_rules:
  - id: counted_service
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Count only one completely accepted single-island installation as 1 item. Panels, area, absorption equivalent area and mass are descriptors or component measurements; they do not replace service count. Record configuration per cp_handover."
  - id: material_accounting
    applies_to: "panel_input; suspension_components; usable_returns; installation_waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep panel count and actual net mass records distinct. Derive kg from traceable actual component records or weighing, excluding packaging; approximate panel mass is neither whole installed assembly mass nor a generic conversion."
  - id: energy_records
    applies_to: "installation_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Record actual tool, charging and powered access consumption with the metering or documented attribution boundary. Nominal tool power alone is not consumed energy. Preserve units and conversion evidence when upstream electricity uses another unit."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
