system_boundary:
  rules:
    - rule_id: support_interface
      applies_to: "island_install"
      rule: "Verify the existing fixing layout and capacity for the actual assembly before lifting. Follow the selected manufacturer route; do not import bracket-route torque, one-point geometry, inclined/stacked limits or added-load allowances."
      source_ids:
        - ecophon-ig402-2024
    - rule_id: assembly_gate
      applies_to: "island_install"
      rule: "Include component receipt/unpacking, panel marking and absorber-anchor fitting, temporary lift/support, four-wire engagement/adjustment and inspection through acceptance. Record tool, charging, access, consumable and cleanup activities when used. Adjust with the panel supported according to the guide."
      source_ids:
        - ecophon-ig402-2024
    - rule_id: handover_limit
      applies_to: "accepted_island_installation"
      rule: "Confirm retention, matching components, position, horizontality, suspension depth and clearance against the exact instructions/project criteria. A rejected or uninspected island is not an accepted output. Occupied use, later maintenance/removal and demonstrated room acoustic improvement are outside this event."
