        - ecophon-ig402-2024
        - ecophon-solo-square-spec
    - rule_id: waste_release_split
      applies_to: "installation_waste; airborne_release"
      rule: "Collected packaging, broken panels, trimmed wire and captured debris leave as destination-specific waste. Any actual airborne release requires identified substance/fraction, receiving air compartment and quantity evidence; captured dust is not an air emission. Missing evidence is a gap, not zero."
