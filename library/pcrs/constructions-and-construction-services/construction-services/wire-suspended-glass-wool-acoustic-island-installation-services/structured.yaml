          description: "The selected figure shows a powered driver fitting absorber anchors. Account actual driving/charging and powered lift electricity when used, including an allocation basis for shared charging. Do not assume zero from the existence of pre-installed structural anchors. Range evidence need: collect metered comparable event data and tool/lift use before defining an energy guardrail. A power rating is not an energy quantity."
          amount:
            expression: "Actual metered or documented attributed kWh for this event; retain device, meter, charging and shared-load evidence. Zero requires recorded non-use of powered resources in the actual permitted route."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_resources
              source_ids:
                - ecophon-ig402-2024
            ranges: []
        - row_id: cleaning_water
          role: "Cleaning water supplied to installation cleanup when used"
          name: "Cleaning water supplied to installation cleanup when used"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "The selected route does not require an assumed wet-cleaning step. Instantiate this card only when installation records show supplied cleanup water; do not import subsequent routine maintenance into the event. Range evidence need: no generic water demand is supported for this dry mounting route; collect actual cleanup records if wet cleanup occurs."
          amount:
            expression: "Actual attributable kg supplied; record water source and use. If liquid exits the boundary, record its destination and quantities as actual waste rather than making an evaporation assumption."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_resources
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
