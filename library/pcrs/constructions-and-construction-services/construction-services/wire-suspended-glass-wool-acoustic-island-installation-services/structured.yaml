        - row_id: accepted_island_installation
          role: "Accepted horizontal four-wire glass-wool acoustic island installation service"
          name: "Accepted horizontal four-wire glass-wool acoustic island installation service"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "The real reference output is the signed installation acceptance for one declared island after retention, layout, level, height and clearance checks. A panel supplied, a partially suspended panel and room acoustic performance are different states. Range decision: 1 item is the exact reference definition, not an empirical yield range. Collect accepted/rejected event counts for later yield QA."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
