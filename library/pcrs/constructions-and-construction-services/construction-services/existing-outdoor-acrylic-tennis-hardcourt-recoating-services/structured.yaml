boundary_abstraction:
  declared_starting_condition: "Existing structurally sound, adequately draining dense asphalt/compatible acrylic outdoor court qualified by actual inspection; original construction is retained host stock."
  starting_condition_role: "Retained site asset for incremental repair; prior construction is outside this bounded service, current preparation/repair burdens remain."
  product_classification_scope: "Bounded outdoor sports facility repair within CPC54270, not all facilities or all repair systems."
  recursive_input_rule: "A supplied same-category repair subcontract is an upstream service with explicit court/activity coverage. Include once and exclude overlapping in-house inputs; never recursively recreate old court construction."
  upstream_dataset_requirement: "Actual supplied-state datasets for each product and service, with manufacturing, packaging, transport and complete-life asset coverage identified; unresolved identities/coverage block final concrete exchange finalization."
  disclosure: "Host qualification, geometry, repair limits, supplier system/instructions, receipts and stock, internal transfer owner, wastes/releases, logistics coverage, subcontract exclusions and period/asset ledger."
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted existing outdoor acrylic tennis hardcourt recoating repair service"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "contract/court IDs"
    - "location and dates"
    - "host material/prior coating condition and qualification"
    - "treated/line areas m2 and line dimensions m"
    - "actual approved products and supplied states"
    - "tint/coat/run records"
    - "weather/drying/cure"
    - "inspection/defect closure and handover criteria"
    - "asset periods and upstream coverage"
reference_flows:
  []
measurement_rules:
  - id: counted_contract
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "One defined accepted repair contract is the reference; court counts and areas are attributes and do not establish equivalence between contracts."
  - id: wet_dry_mass
    applies_to: "coating, tint, repair material and residual rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve as-supplied wet quantities, actual added ingredients, applied wet amount and dry-film/evaporation quantities separately; volume-to-mass needs lot-specific density and temperature. Do not infer wet mass from dry thickness or universal coverage."
  - id: native_services
    applies_to: "electricity, asset time and logistics"
    required_property_ref:
      name: "Actual compatible property"
      uuid: ""
    required_unit: "kWh; h; t.km as recorded"
    rule: "Keep native units; confirm complete support chain for actual exchanges. No count conversion of electricity, duration or transport."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: prepare_host
    name: "Clean and locally repair qualified existing host"
    inclusion: "required"
    inclusion_condition: "Qualified existing dense host; actual cleaning and local repair extent"
    role: "foreground treatment; accepted clean flush host handoff"
    quantitative_reference: "Actual accepted treated area m2, linked to contract and transfer IDs"
  - id: finish_surface
    name: "Apply compatible acrylic system and accept marked cured surface"
    inclusion: "required"
    inclusion_condition: "Accepted prepared host; resurfacer only if actual specification requires"
    role: "foreground surface finishing; final repair handover"
    quantitative_reference: "1 item accepted contract"
