      rule: "Index owned washers, mixers, applicators and marking tools by asset, consuming node, other jobs and period; include production, maintenance, replacements and end-of-life attribution. A provider service must explicitly cover these burdens or expose an added uncovered share; retain remaining life/stock with its carried burden. Complete-life attribution does not require an in-service asset to have retired already: completed life uses observed history; an in-service asset may use evidence-supported prospective remaining service, replacement/termination and end-of-life scenarios. Label forecasts separately from observations, disclose total service denominator/source, uncertainty and sensitivity, and update when actual life events or use evidence change. Missing justified complete coverage or denominator blocks finalization; never invent a lifetime or future retirement."
      source_ids: []
