allocation_rules:
  - rule_id: single_service
    applies_to: "accepted_recoating_service"
    rule: "One accepted contract receives all attributable preparation, finishing and defect/recoat burdens. No marketable co-product is assumed; old host retention and waste are not co-products or substitution credits. Divide a multi-contract campaign only by traceable court/run physical use, with measured shares and distinct accepted denominators."
