  calculation_rules:
    - id: contract_attribution
      applies_to: "all inventory rows"
      rule: "Sum separately identified event quantities attributed to the actual accepted contract; share a multi-contract event only by documented measured causal driver. All inventory is per reference flow. Retain incomplete/rejected attempt burdens until final acceptance."
      inputs:
        - "node-specific protocols"
        - "court/run/event IDs"
        - "measured driver"
        - "signed accepted contract"
      output: "Individual amount per 1 item accepted repair contract"
      source_ids: []
    - id: lot_reconciliation
      applies_to: "all material, stock, return and residual rows"
      rule: "Opening usable stock + gross receipts = actual application/use + true usable outward returns + waste/residual losses + closing usable stock, with actual within-process transformations and measurement difference disclosed by lot/state. Applied wet coating is partitioned into retained film and actual volatilized/other loss evidence; never equate wet mass and dry film."
      inputs:
        - "node materials and residual protocols"
        - "supply state"
        - lot
        - "actual film and species evidence"
      output: "Wet-material and stock closure; carried-forward burden and unresolved difference"
      source_ids: []
    - id: volume_mass
      applies_to: "water, coating, tint, fuel and wastewater volumes"
      rule: "Convert each actual lot volume using its own measured/documented density at declared temperature and compatible units; retain original volume, density and uncertainty. No source coverage volume or universal water-density assumption supplies an unmeasured coating mass."
      inputs:
        - "actual volume"
        - "actual density"
        - temperature
        - calibration
      output: "kg by actual lot/source"
      source_ids: []
    - id: interface_match
      applies_to: "prepared_host_output; prepared_host_input"
      rule: "Match transfer IDs, accepted area/state, court/location and tolerance in both nodes; carry preparation burden once into finish_surface without external additional host production. Explain any rejected/returned area with event linkage."
      inputs:
        - cp_prep_state
        - cp_finish_state
        - "transfer IDs"
      output: "Paired m2 physical handoff and single burden owner"
      source_ids: []
    - id: asset_share
      applies_to: "prep_assets; finish_assets"
      rule: "Attribute actual complete-life asset burdens by measured service use of this node/job/period divided by total complete-life service for all consumers, with replacement/termination/end-of-life coverage and retained remaining-life burden disclosed. Do not use contract count to replace true asset service units."
      inputs:
        - "node operations protocols"
        - "complete-life ledger"
        - "provider inclusion"
      output: "Native service quantity and attributed complete-life burden without overlap"
      source_ids: []
    - id: fuel_consumption
      applies_to: "prep_fuel; finish_fuel; prep_returns; finish_returns; prep_fuel_wastes; finish_fuel_wastes; prep_releases; finish_releases"
      rule: "Actual burned fuel = opening node fuel stock + gross fuel inputs - closing node fuel stock - true usable outward returns/transfers - unburned fuel waste - actual unburned fuel released, by grade/event. All outlet terms are mutually exclusive; total incident spill is partitioned between recovered waste/retained material and actual release, never subtracted again as another term. This derived burned quantity drives combustion only; fuel input remains gross and recorded output returns/wastes are not netted twice."
      inputs:
        - "node operations/residual protocols"
        - "actual tank/receipt/return/waste/release records"
      output: "Actual burned fuel kg by grade/event, distinct from gross input exchange"
      source_ids: []
    - id: species_release
      applies_to: "prep_releases; finish_releases"
      rule: "For each actual substance and medium, calculate attributable measured activity times the applicable species factor with explicitly compatible numerator/denominator units and documented factor capture basis; apply measured capture correction only if not already included. Alternatively use direct monitoring mass integration from actual concentration/flow/time with compatible units. Use actual burned fuel, not returned/spilled fuel, for combustion; actual unburned releases use their own substance route. Propagate activity/factor/capture/monitoring uncertainty and identify unsupported species as missing evidence."
      inputs:
        - "node residual and operations protocols"
        - "measured activity"
        - "species method/factor units/applicability"
        - "capture and uncertainty"
      output: "kg by actual substance/medium per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: identity_gate
      applies_to: "all exchanges"
      requirement: "Finalize each actual material/provider/waste/substance identity and compatible support/property/unit before concrete dataset exchange creation. Expand each conditional umbrella into distinct actual identities. Reference candidate meaning is exact accepted repair, not generic wall paint/full court."
      evidence: "Actual supplier/SDS/provider and custody/substance data; verified detail and support chain"
    - id: host_scope
      applies_to: "host and accepted service"
      requirement: "Actual dense compatible host must qualify structurally and drain; existing acrylic does not prove sound underlying pavement. Record repair limits and actual current system compatibility."
      evidence: "Inspection/defect/drainage and substrate/coating compatibility records; current product instruction"
    - id: timing_units
      applies_to: "both nodes state/operations"
      requirement: "Retain actual units, specified tolerances and source for temperature/time/geometry/power/test attributes. Weather, drying and cure are measured event data; manufacturer example settings apply only to actual selected product."
      evidence: "Dated actual weather/coat/cure/line/test logs with current criteria"
    - id: completeness
      applies_to: "all resources and exits"
      requirement: "Reconcile receipts/issues/stock/true returns, wet/dry film, captured wastewater, actual species and waste custody; disclose any unreconciled difference. No presumed zero emissions, mandatory chemical recipe or missing actual local repairs. Record gross fuel input and reconcile actual burned activity separately from usable outward returns/transfers, retained stock, unburned waste and actual unrecovered release; incident spill totals must not duplicate recovered waste or environmental releases; route all exits by real custody/substance and do not treat unburned fuel as combustion activity."
      evidence: "Node ledgers, scale/meter uncertainty, actual species/capture and waste/return tickets"
    - id: period_asset
      applies_to: "shared services and assets"
      requirement: "Enumerate full campaign and all relevant asset lifecycle/reporting periods; link replacement/termination and all consumers. Justify causal shares, provider exclusions and carried stock; missing justified complete-life coverage or denominator blocks finalization; completed life uses observed history and still-in-service life uses justified labelled prospective scenarios, with denominator/source, uncertainty/sensitivity and update triggers."
      evidence: "Asset and provider coverage ledger; period and event IDs; complete-life share sums"
    - id: range_evidence
      applies_to: "every inventory row"
      requirement: "Numerical guardrails require independent compatible evidence by actual product/state/route/denominator. Current collection requests are explicit missing evidence, not a generic bound. Derive future empirical ranges from separate reviewed comparable campaigns and disclose sample/timing/uncertainty; do not validate a job with its own maximum."
      evidence: "Actual comparable independent records and uncertainty review; product-specific sources; explicit per-card Range evidence need"
validation_rules:
  - rule_id: accepted_scope
    applies_to: "accepted_recoating_service"
    rule: "Require qualified dense draining compatible host and actual nonstructural repair limits; final output is one identified contract after accepted surface/texture/colour, actual coat/cure conditions, tennis lines, defect closure, signed handover/opening permission. No new court, universal ITF class, guaranteed porosity or service-life-equivalence assertion."
    source_ids:
      - sportmaster-maintenance
      - sportmaster-neutral-ready-mix-202406
  - rule_id: recipe_identity
    applies_to: "finish_colour; finish_tint; finish_recipe_additions"
    rule: "Actual supply bill and current instructions must distinguish untinted Neutral Ready-Mix plus actual approved tint without added water from factory-tinted ready-mix or other product-specific concentrate/surfacer routes. Confirm exact product/lot/use and actual additions; tool cleaning water stays distinct."
    source_ids:
      - sportmaster-neutral-ready-mix-202406
      - sportmaster-tennis-surfaces
  - rule_id: transfer_rework
    applies_to: "prepared_host_output; prepared_host_input; all reject paths"
    rule: "Require identical physical area/state and transfer ownership, with no second upstream host production. Failed host and failed finish events are linked to owning node; original/corrective burdens remain, waste exits close, unresolved rejected area cannot enter accepted output."
    source_ids: []
  - rule_id: gross_balance
    applies_to: "all material and residual rows"
    rule: "Require lot/state gross receipts, actual use/application, true outward usable returns, waste and closing-stock closure. Verify wet/dry mass and actual density conversions, captured-water/solids partition, actual substance and receiving medium. Supplier-included packaging/logistics/treatment is counted once. Fuel input is gross; separate derived burning excludes actual unburned returns, closing stock, waste and unrecovered releases without subtracting total incident spill a second time; all such exits have real product/waste/elementary ownership. Species calculations preserve activity/factor units, applicability, capture basis and uncertainty without double correction."
    source_ids: []
  - rule_id: mode_period_complete
    applies_to: "both node campaigns and assets"
    rule: "Require actual job/court/tint-batch/coat/weather/changeover indexing and all event owners, complete-life asset consumers/periods/production/maintenance/replacement/termination/end-of-life shares, provider coverage and remaining-life/stock burden. Share sums close and no duplicate event/period charging; missing justified complete-life coverage or denominator blocks finalization; completed life is observed, in-service remaining life/replacement/termination/end-of-life may be justified labelled forecasts with source, uncertainty/sensitivity and actual-event updates."
    source_ids: []
  - rule_id: identity_and_ranges
    applies_to: "all inventory rows"
    rule: "Require actual UUID detail and compatible support/property/unit confirmation for final concrete exchanges, and justified source-backed or independent empirical Range where available. Explicit current evidence needs remain gaps and are not bounds. Preserve native kWh/h/t.km and honest unresolved support; broad nearest matches and count conversions are invalid."
    source_ids: []
  - rule_id: source_and_translation
    applies_to: "complete foreground package"
    rule: "Require English/Chinese equivalence for identifiers, reference, physical roles, custody, quantities, measurement/CP/calculation/quality rules and Range decisions, with actual source/instruction versions and generated deterministic projection."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site-specific foreground data package for one accepted incremental recoating repair; process/lifecyclemodel are downstream projections."
  downstream_use: "secondary_dataset; background_dataset only with transparent compatible scope and actual quality limitations"
  allowed_use: "Declared dense-host outdoor acrylic tennis hardcourt repair at the measured qualified system, site and handover gate; use measured geometry and physical resources for any explicit comparison."
  excluded_use: "New full-court/base construction; structural/drainage repair; porous permeability-preserving spray; concrete etching; cushion systems; generic paint application; indoor facility; future play/maintenance or service-life-equivalent court claims."
  required_metadata: "Contract/court/location/time and treated/line geometry; host qualification/limits; actual product/system/supply states and instruction versions; lot/tint/coat/weather/cure/line/acceptance records; actual providers/upstream coverage; waste/release custody; asset complete-life periods and drivers; reference/stock/transfer ownership."
  required_quality_disclosure: "Actual identity/support gaps, per-card Range evidence needs, measured uncertainty and physical balances, missing species/capture/coverage, rework and open defects, provider inclusions and asset remaining-life/stock burdens."
  update_trigger: "Change of host/scope/product recipe/instruction, supply state, geometry/acceptance, capture or species evidence, equipment/provider/complete-life attribution, actual recipe/coat weather route, or reviewed comparable quantitative evidence."
