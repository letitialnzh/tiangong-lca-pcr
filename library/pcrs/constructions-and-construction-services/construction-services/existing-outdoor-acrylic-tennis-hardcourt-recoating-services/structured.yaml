    reference: "United Nations, CPC Version3.0 Explanatory Notes 30June2025, printed288; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Outdoor tennis-ground repair/restoration classification scope; indoor exclusion; not a recipe or quantitative source"
  - id: "sportmaster-tennis-surfaces"
    type: "literature"
    reference: "SportMaster, Tennis Court Surfaces, current manufacturer product page; https://www.sportmaster.net/tennis-court-surfaces/"
    used_for: "Compatible asphalt/prior acrylic systems; distinction among ready-mix, concentrate, tint, resurfacer, repair and tennis-line supplied products; excludes cushion route"
  - id: "sportmaster-maintenance"
