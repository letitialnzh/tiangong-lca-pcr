  unresolved_range_evidence:
    - row_id: "prep_supplied_water"
      reason: "Range evidence need: Collect site cleaning method, treated area, actual
        fresh water by wash event, density and meter uncertainty; no universal
        kg/m2 cleaning factor."
    - row_id: "prep_cleaners"
      reason: "Range evidence need: Obtain actual approved cleaning instruction/SDS,
        dose and treated extent plus weighed issues/returns; no generic biocide
        recipe or range."
    - row_id: "prep_repairs"
      reason: "Range evidence need: Obtain actual defect map, approved repair product
        instructions, repair dimensions and lot measurements; no generic kg per
        crack length, recipe or depth."
    - row_id: "prep_consumables"
      reason: "Range evidence need: Collect article specifications, piece masses where
        counted, wash/containment method and measured use; no assumed consumable
        ratio."
    - row_id: "prep_electricity"
      reason: "Range evidence need: Obtain preparation-specific meter/run record and
        measured allocation uncertainty; no default kWh per area."
    - row_id: "prep_fuel"
      reason: "Range evidence need: Collect engine/fuel grade, tank/issue records,
        actual density and run-specific consumption uncertainty; no generic
        diesel dose."
    - row_id: "prep_logistics"
      reason: "Range evidence need: Collect trip manifests, route distance, payload
        and provider scope to derive uncertainty by leg; no universal haul
        distance or loading factor."
    - row_id: "prep_assets"
      reason: "Range evidence need: Obtain asset IDs, observed use/lifetime records,
        replacements/termination, other consumers and provider coverage; no
        assumed tool lifetime or h per court."
    - row_id: "prep_abstraction"
      reason: "Range evidence need: Obtain actual withdrawal meter and source/season
        records if abstraction occurs; zero only from evidenced absence, not a
        default."
    - row_id: "prepared_host_output"
      reason: "Range evidence need: Collect surveyed accepted geometry and tolerance,
        inspection and transfer record; no universal court area or assumed
        all-area acceptance."
    - row_id: "prep_returns"
      reason: "Range evidence need: Obtain return tickets, acceptance of usability and
        lot-level receipt/stock balance; no assumed return fraction."
    - row_id: "prep_removed_solids"
      reason: "Range evidence need: Obtain actual removal maps, segregated load
        weights/moisture and destination records; no assumed removal
        percentage."
    - row_id: "prep_wastewater"
      reason: "Range evidence need: Collect capture volumes/density, rainfall/runoff
        ingress, solids separation and treatment receipts plus sampling
        uncertainty; no default capture efficiency or discharge fraction."
    - row_id: "prep_used_articles"
      reason: "Range evidence need: Obtain actual packaging bill and spent article
        weights/contamination/destination; no generic packaging percentage."
    - row_id: "prep_releases"
      reason: "Range evidence need: Obtain actual substances/SDS/test results, exhaust
        or release method/factors and particle size/medium/capture evidence with
        uncertainty; no invented emission factor."
    - row_id: "prepared_host_input"
      reason: "Range evidence need: Obtain matched area/transfer/inspection records
        with survey tolerance and any area change explained; do not set a
        generic standard court area."
    - row_id: "finish_surfacer"
      reason: "Range evidence need: Obtain approved current product recipe, surface
        condition, actual coverage and lot mass; generic colour coverage is not
        surfacer kg/m2."
    - row_id: "finish_colour"
      reason: "Range evidence need: Obtain actual product/lot wet mass or
        density-supported volume, treated area, coats, weather and loss
        evidence. CMT68 approximate volume coverage cannot become universal
        kg/m2 or dry-film mass."
    - row_id: "finish_tint"
      reason: "Range evidence need: Obtain chosen current base/tint instructions and
        actual batch additions/density. CMT68 pail-specific volume instruction
        is not generic tint mass for other products."
    - row_id: "finish_recipe_additions"
      reason: "Range evidence need: Obtain actual current product-specific mixing
        instruction and batch weigh/meter records; no borrow of concentrate
        recipes for ready-mix."
    - row_id: "finish_line_paint"
      reason: "Range evidence need: Obtain actual line product instructions, line
        geometry and weighed application records; no area-to-paint-mass factor
        assumed."
    - row_id: "finish_auxiliaries"
      reason: "Range evidence need: Obtain approved actual procedure and each
        article/product specification/use record; no universal tape/primer
        allowance."
    - row_id: "finish_tool_water"
      reason: "Range evidence need: Collect actual wash method, changeover frequency,
        fresh makeup and capture balance with meter uncertainty; no fixed rinse
        or kg per paint pail."
    - row_id: "finish_electricity"
      reason: "Range evidence need: Obtain actual equipment/event electricity and
        supply records, load/time evidence and uncertainty; no generic cure
        energy."
    - row_id: "finish_fuel"
      reason: "Range evidence need: Collect actual engine, fuel, tank/issue and run
        evidence; no standard fuel/area factor."
    - row_id: "finish_logistics"
      reason: "Range evidence need: Obtain real trip/payload/route and supplier
        inclusion evidence; no illustrative freight default."
    - row_id: "finish_assets"
      reason: "Range evidence need: Collect asset
        use/production/maintenance/end-of-life evidence and other job/period
        drivers; no fictitious count conversion or default useful life."
    - row_id: "accepted_recoating_service"
      reason: "Range evidence need: Definition fixes one accepted contract as
        denominator, not its area or service life. Collect signed
        court/area/system/dates/defect closure and actual acceptance evidence;
        no numerical dose/yield/life range can be inferred."
    - row_id: "finish_returns"
      reason: "Range evidence need: Obtain actual dispatch/receiver usability
        evidence, wet state and lot balance; no presumed recovery/return ratio."
    - row_id: "finish_coating_wastes"
      reason: "Range evidence need: Collect actual unusable/residue/removed-film
        weights and solid content where required, defect maps and disposal
        receipts; no universal coating loss fraction."
    - row_id: "finish_spent_articles"
      reason: "Range evidence need: Obtain actual packaging/article specifications,
        waste weights and treatment/custody evidence; no generic container or
        tape mass."
    - row_id: "finish_wastewater"
      reason: "Range evidence need: Collect actual cleaning/capture/rain balance and
        treatment receipts with composition/sampling uncertainty; no default
        all-water discharge or capture rate."
    - row_id: "finish_releases"
      reason: "Range evidence need: Obtain actual product/SDS composition, dry-film
        evidence, species factors/monitoring, capture and receiving medium; no
        emission inferred from acrylic marketing label."
    - row_id: "finish_abstraction"
      reason: "Range evidence need: Collect source meter, source/season and actual
        cleaning event evidence; zero requires documented absence of
        abstraction."
    - row_id: "prep_fuel_wastes"
      reason: "Range evidence need: Obtain actual incident/tank drainage, segregated
        waste weights/composition and receiver records; absence requires event
        evidence, no assumed spill or recovery fraction."
    - row_id: "finish_fuel_wastes"
      reason: "Range evidence need: Obtain actual incident/tank drainage, segregated
        waste weights/composition and receiver records; absence requires event
        evidence, no assumed spill or recovery fraction."
