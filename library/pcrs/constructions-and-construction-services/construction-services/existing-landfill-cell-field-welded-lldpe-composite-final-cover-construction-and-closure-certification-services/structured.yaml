allocation_rules:
  - rule_id: stock_account
    applies_to: "all processes"
    rule: "For each native SKU/state, S = attributed_opening + external_net_tare_gross_receipts - carried_closing. Internal issue and installed activity are not receipts. Choose declared gross-with-outlets: input S and matched usable outward return separately, or consumed-only: input S minus matched usable outward return and no additional return burden subtraction or credit. In both views retain each independently measured physical outward-return record/card as an audit view; that physical record is not another modeled upstream subtraction or credit. The chosen supply and return burden views are nonadditive. Closing stock, recovered spill still held at close, contained waste, uncontained loss and usable external return are distinct disjoint fates. Nonreturned offcuts, rejects and losses retain their upstream burdens. Historic removed materials never reduce new purchases; no recycling or avoided-production credit is implied."
    source_ids: []
  - rule_id: asset_share
    applies_to: "all processes"
    rule: "For each shared plant/tool/test instrument and temporary installation, include manufacture, maintenance, replacements and end-of-life across ALL consumers, jobs, nodes and periods. Enumerate prepare/cap consumers and other jobs, calendar periods, setup/changeover/cleaning, replacements and termination. Choose one representation: native asset-equivalent quantity per reference flow = (job_driver / full_life_driver) / A with the full asset lifecycle burden in the matching native unit; OR lifecycle-complete per-driver service quantity per reference flow = job_driver / A with burden in the same driver unit. Do not combine them or divide twice. Full_life_driver requires observed life or observed history plus evidenced remaining use, future replacements, termination and end-of-life, source, uncertainty, sensitivity and update conditions. Job hours alone do not establish full-life service or a counted machine equivalent; missing life/coverage evidence blocks a completed dataset."
    source_ids: []
  - rule_id: campaign_rework
    applies_to: "all processes"
    rule: "Production is a project campaign indexed by cell, approved layer/zone, panel/weld or soil batch, event and period. Preparatory, placement, test/repair and final acceptance phases retain actual start/end dates. Attribute setup, changeover, idle/standby, cleaning and shared provider demand using evidenced causal physical drivers; retain failed/repeated work in this job numerator. Link failed soil tests to prepare reconditioning and failed seams/coupons/penetrations to cap repair/retest; identify retained repaired material, usable external return and actual waste exit at its producing node. Count final surface once only after defect closure. No default reject rate, annualization, postclosure life or credit for future avoided leachate/gas generation."
    source_ids:
      - epa-mswlf-closure-requirements
      - frtr-landfill-soil-capping
      - rid-em-rosehill-cqa-2006
dataset_production:
  collection_protocols:
