  calculation_rules:
    - id: normalize_area
      applies_to: "all inventory rows"
      rule: "quantity_per_reference = attributable_native_quantity / A; A is positive certified unique net developed final cover area in m2; final accepted reference output is 1 m2."
      inputs:
        - attributable_native_quantity
        - A
        - cp_cap_gate
      output: "Native quantity per 1 m2 certified final cover"
      source_ids: []
    - id: native_state
      applies_to: "prep_soil; cap_soil; prepare_fuel; cap_fuel; erosion_vegetation"
      rule: "Convert only compatible actual states: wet_mass = wet_volume * wet_density; dry_mass = wet_mass * (1 - wet_basis_water_fraction); loose_volume * loose_dry_density = compacted_volume * compacted_dry_density for the same retained dry solids after separately recorded additions and losses. Dry-basis moisture requires dry_mass = wet_mass / (1 + dry_basis_water_ratio). Retain actual units, temperature, density/moisture method, batch, sources and uncertainty. These are alternative nonadditive views; do not equate loose and compacted volumes or add water twice."
      inputs:
        - wet_volume
        - wet_density
        - wet_mass
        - wet_basis_water_fraction
        - dry_basis_water_ratio
        - loose_volume
        - loose_dry_density
        - compacted_volume
        - compacted_dry_density
      output: "Compatible reconciled native-state quantities"
      source_ids: []
    - id: fuel_fates
      applies_to: "prepare_fuel; cap_fuel"
      rule: "Supplied fuel upstream is distinct from measured burned fuel for emissions. Use directly measured burn OR audited complete disjoint native-unit fates: S = burned + usable_outward_return + contained_nonburned_waste + uncontained_loss, after closing stock already removed in S. Retain independent uncertainty and investigate unknown loss; never infer combustion from an incomplete residual. Total spill is audit-only; recovered spill retained in closing is already closing."
      inputs:
        - S
        - burned
        - usable_outward_return
        - contained_nonburned_waste
        - uncontained_loss
        - carried_closing
        - cp_prepare_energy
        - cp_cap_energy
      output: "Measured burn and disjoint reconciled fates"
      source_ids: []
    - id: species_release
      applies_to: "prepare_air; prepare_water_soil; cap_air; cap_water_soil"
      rule: "species_mass = measured_species_mass OR matched_activity * complete_species_factor OR measured_whole_fluid_release * evidenced_species_fraction * evidenced_release_fate. Choose one basis per event/species/medium; do not multiply a complete species factor by composition/fate again. Require actual factor numerator/denominator units, source, validity, composition/fate source and measured incremental attribution. Whole-fluid and total-spill views are nonadditive."
      inputs:
        - measured_species_mass
        - matched_activity
        - complete_species_factor
        - measured_whole_fluid_release
        - evidenced_species_fraction
        - evidenced_release_fate
      output: "Actual species mass by receiving medium"
      source_ids: []
    - id: freight_work
      applies_to: "prepare_freight; cap_freight"
      rule: "transport_work_kg_km = sum(actual_load_mass_kg * actual_loaded_distance_km); retain actual route, mode, load state, required empty-return activity and coverage. If native upstream t*km is used, 1 t*km = 1000 kg*km. Do not add fuel/vehicle burdens already inside a complete freight service."
      inputs:
        - actual_load_mass_kg
        - actual_loaded_distance_km
        - empty_return_activity
        - upstream_scope
      output: "Compatible actual mass-distance transport work"
      source_ids: []
  data_quality_requirements:
    - id: traceability
      applies_to: "All processes"
      requirement: "Retain approved plans, cell identity/baseline, suppliers/material lots, actual acceptance gate and period-linked raw physical records; no fabricated numbers or numeric ranges."
      evidence: "Signed approvals, surveys and source records"
    - id: coverage
      applies_to: "All exchanges and assets"
      requirement: "Document provider and shared-asset upstream scope, all-consumer life denominator, native supply/return fates, emission attribution and missing coverage with uncertainty and sensitivity. Missing material data blocks final production; identity support is not quantity evidence."
      evidence: "Resource coverage matrix and reconciled physical ledgers"
    - id: comparability
      applies_to: "Reference service"
      requirement: "Require matching cell waste/baseline, climate/topography, cap layer and barrier design, LLDPE specification, certification gate and slope area convention. Do not infer equivalence from equal m2 or future landfill performance."
      evidence: "Declared project qualifiers and quality disclosure"
validation_rules:
  - rule_id: acceptance_area
    applies_to: "all processes"
    rule: "Require A > 0, unique surveyed net developed surface polygons, declared slope measurement convention, exact certification extent and date, signed acceptance, defects closed and functional_unit.reference_flow_link = certified_final_cover. Overlaps, roll supplies, GCL/drain areas, prepared subgrade, coupons, repairs and repeated tests cannot increase A. Unfinished or interim protected zones cannot be accepted by default."
    source_ids:
      - epa-mswlf-closure-requirements
      - frtr-landfill-soil-capping
      - rid-em-rosehill-cqa-2006
  - rule_id: layer_quality
    applies_to: "all processes"
    rule: "Require actual approved LLDPE plus low-permeability GCL or soil composite contact design, layer traceability and sequence, qualified subgrade, actual plan-required soil/layer and seam/repair/penetration/anchorage/drainage/gas test records, erosion/vegetation gate, as-builts and responsible certification. No borrowed historical case thickness/frequency/acreage or universal technology performance. Soil-only ET cover, new bottom liner and bare roll supply fail this scope."
    source_ids:
      - epa-mswlf-closure-requirements
      - frtr-landfill-soil-capping
      - rid-em-rosehill-cqa-2006
  - rule_id: ledger_completeness
    applies_to: "all processes"
    rule: "Require native SKU supply/return/waste/stock closure, compatible soil moisture-density states, fuel fate closure, actual species-medium release basis and baseline-versus-incremental attribution. Own provider and shared asset upstream scope across all consumers/periods; one representation and normalization only. Unknown material activity, identity, factor, return, life denominator or subcontractor resource coverage blocks a completed dataset; record performed/skipped checks and uncertainty."
    source_ids:
      - epa-mswlf-closure-requirements
      - frtr-landfill-soil-capping
      - rid-em-rosehill-cqa-2006
  - rule_id: rework_period
