boundary_abstraction:
  declared_starting_condition: "Released existing building/substrate attachment interface, actual kit at issue with condition/custody records, and actual design/configuration and service ownership"
  starting_condition_role: "existing_asset_context"
  product_classification_scope: "Supported modular galvanized-steel facade scaffolding cycle; narrower context within CPC 3.0 54570, not the whole leaf"
  recursive_input_rule: "A separately purchased same-category service is an explicit upstream service with its actual gate and coverage; do not silently unfold or duplicate it inside this episode. Review genuine separate responsibility/handoffs."
  upstream_dataset_requirement: "Use compatible material/service and reusable-asset datasets matching concrete identity, state, geography, technology, provider coverage and actual use. Missing coverage or owned-asset lifetime/capacity is a gap."
  disclosure: "Disclose starting asset/substrate state, ownership, all actual phases/users, external handoffs, geometry cohorts, actual dates, omitted/unresolved quantities and denominator acceptance"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Supported modular galvanized-steel facade scaffolding cycle service"
    uuid: ""
  flow_property_ref:
    uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
  unit_group_ref:
    uuid: "93a60a57-a3c8-18da-a746-0800200c9a66"
  reference_unit: "m2"
  required_qualifiers:
    - "configuration and kit IDs"
    - "surveyed unique elevation A and polygons"
    - height
    - "loading class"
    - "deck/lift pattern"
    - "ties/anchors and substrate release"
    - "handover date"
    - "actual availability/unavailability intervals and duration"
    - "dismantling and return/repair/discard closure"
    - "owned restoration"
    - "provider and asset coverage"
reference_flows:
  []
measurement_rules:
  - id: unique_elevation
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Measure A from disjoint accepted facade-elevation polygons of the same stable configuration and closed episode. Exclude unserved gaps, overlap, ground-plan area and repeated deck/lift areas. A must be positive and independently surveyed under cp_scaffold_cycle_material."
  - id: concrete_numerators
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Mass / Area / Energy / Duration"
      uuid: ""
    required_unit: "native unit to kg, m2, kWh or h"
    rule: "Keep each concrete SKU, current state, substance and receiver separate. Use traceable count-to-mass, volume-to-mass or other same-state bridges where needed; divide each attributable episode numerator by A once. Mixed totals are QA rather than exchange identities."
  - id: time_qualifier
    applies_to: "reference product; asset services"
    required_property_ref:
      name: "Duration"
      uuid: ""
    required_unit: "h"
    rule: "Actual dates, availability and unavailability intervals, height, loading and deck/tie layout are required qualifiers. Do not replace the area reference with area multiplied by time. Resolve standalone time support before binding hour exchanges; no default day or shift."
  - id: energy_integrity
    applies_to: "electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Preserve metered electrical energy and its supply boundary; verify the compatible flow property independently. Do not substitute net calorific value for Energy or equipment useful work for metered use."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: scaffold_cycle
    name: "Supported modular steel facade scaffolding cycle services"
    inclusion: "required"
    inclusion_condition: "actual complete episode and declared responsibility"
    role: "single accountable foreground service node; phase gates are observations"
    quantitative_reference: "reference_service; 1 m2"
process_inventory:
  - id: scaffold_cycle
    label: "Supported modular steel facade scaffolding cycle services"
    inputs:
      product:
        - row_id: replacement_kit_products
          role: "Consumed new scaffold-component replacements"
          name: "Consumed new scaffold-component replacements"
          flow_type: "product"
          property_unit: "Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg"
          description: "Identify each new replacement SKU actually consumed by the episode, and its destination in the component ledger. Exclude mere deployment of existing reusable components. Range evidence need: component schedule, measured current-state mass and wear, approved repair and retirement decisions; a stock shortage or unreturned component proves neither consumption nor discard."
          amount:
            expression: "Each concrete identity/state/receiver has its independently measured or evidenced calculated episode numerator divided once by accepted A, following section 8 cycle numerator rules"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_scaffold_cycle_material
              source_ids:
                - cycle-normalization-method
                - compatible-pool-ledger-method
            ranges: []
        - row_id: diesel_fuel
          role: "Diesel fuel"
          name: "Diesel fuel"
          flow_type: "product"
          flow_ref:
            uuid: "9d258d75-6792-4f1c-9856-81602ed8f816"
          property_unit: "Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg"
          description: "Include actual diesel burned by owned equipment or separately metered duties attributable to this episode, including attributable idle, tests and rework. Exclude fuel already covered by a provider service. Range evidence need: equipment and interval logs plus calibrated stock or meter reconciliation; useful lifting work cannot substitute for consumed fuel mass."
          amount:
            expression: "Each concrete identity/state/receiver has its independently measured or evidenced calculated episode numerator divided once by accepted A, following section 8 cycle numerator rules"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_scaffold_cycle_utility
              source_ids:
                - cycle-normalization-method
                - compatible-pool-ledger-method
            ranges: []
        - row_id: electricity
          role: "Attributed electricity supply"
          name: "Attributed electricity supply"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Identify actual supply geography, voltage and meter boundary before choosing a concrete exchange. Range evidence need: meter topology, complete intervals, all consumers and device duty records. Record measured kWh; an energy unit group does not establish a compatible flow property and net calorific value must not be relabelled as generic Energy."
          amount:
            expression: "Each concrete identity/state/receiver has its independently measured or evidenced calculated episode numerator divided once by accepted A, following section 8 cycle numerator rules"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_scaffold_cycle_utility
              source_ids:
                - cycle-normalization-method
                - compatible-pool-ledger-method
            ranges: []
        - row_id: water_supplied
          role: "Supplied cleaning and process water"
          name: "Supplied cleaning and process water"
          flow_type: "product"
          property_unit: "Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg"
          description: "Record water delivered across the technosphere boundary, separately from direct abstraction. Range evidence need: actual wet operations, calibrated draws, recirculation and returns, with measured water-only fates. Internal recirculation does not create repeated incoming water; do not infer a universal water demand from scaffold area."
          amount:
            expression: "Each concrete identity/state/receiver has its independently measured or evidenced calculated episode numerator divided once by accepted A, following section 8 cycle numerator rules"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_scaffold_cycle_utility
              source_ids:
                - cycle-normalization-method
                - compatible-pool-ledger-method
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: reference_service
          role: "Supported modular galvanized-steel facade scaffolding cycle service"
          name: "Supported modular galvanized-steel facade scaffolding cycle service"
          flow_type: "product"
          property_unit: "Area 93a60a56-a3c8-19da-a746-0800200c9a66 / m2"
          description: "The sole final service covers one stable configuration from issue through erection and inspected handover, actual availability closure, dismantling, assessed component return/repair/discard and owned site restoration. Independently measure positive unique accepted elevation A; the normalized output is A/A. An open episode, unresolved return fate or unaccepted assembly does not establish this gate."
          amount:
            expression: "1 m2"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_scaffold_cycle_material
              source_ids:
