                lower: "1"
                upper: "1"
                unit: "m2"
                basis: "per reference flow"
                basis_kind: "reference_flow"
                evidence_kind: "calculated_from_collection"
                source_ids:
                  - cycle-normalization-method
      waste:
        - row_id: removed_deposit_waste
          role: "Removed dry deposits from used scaffold"
          name: "Removed dry deposits from used scaffold"
          flow_type: "waste"
          property_unit: "Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg"
          description: "Treat deposits arriving with issued kit or accumulating from outside user operations as independently observed incoming matter. Range evidence need: those additions and composition/moisture, cleaning-added solids and removed dry mass with actual waste receiver. A kit issue-minus-return deficit is not a deposit input; reconcile deposits separately from consumed kit and avoid repeating slurry-borne solids."
          amount:
            expression: "Each concrete identity/state/receiver has its independently measured or evidenced calculated episode numerator divided once by accepted A, following section 8 cycle numerator rules"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_scaffold_cycle_material
              source_ids:
                - cycle-normalization-method
                - compatible-pool-ledger-method
            ranges: []
        - row_id: collected_wastewater_slurry
          role: "Collected wastewater and cleaning slurry"
          name: "Collected wastewater and cleaning slurry"
          flow_type: "waste"
          property_unit: "Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg"
          description: "Represent actual collected liquid waste sent to an identified treatment receiver, retaining its current solids and water composition. Range evidence need: source water, chemicals and entrained solids, measured capture and constituent analyses. Do not treat a mixture mass as water-only, or also report captured solids as dry waste or direct environmental releases."
          amount:
            expression: "Each concrete identity/state/receiver has its independently measured or evidenced calculated episode numerator divided once by accepted A, following section 8 cycle numerator rules"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_scaffold_cycle_material
              source_ids:
                - cycle-normalization-method
                - compatible-pool-ledger-method
            ranges: []
      elementary:
        - row_id: fossil_co2_air
          role: "Carbon dioxide (fossil), to air unspecified"
          name: "Carbon dioxide (fossil), to air unspecified"
          flow_type: "elementary"
          flow_ref:
            uuid: "08a91e70-3ddc-11dd-923d-0050c2490048"
          property_unit: "Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg"
          description: "Record actual fossil CO2 from the attributable combustion using measured emissions or a documented applicable method and independent fossil-carbon consumption. This identity represents air unspecified only. The carbon upper constraint is not a fuel-to-CO2 factor and does not assert complete oxidation; preserve carbon in other products or pollutants separately."
          amount:
            expression: "Each concrete identity/state/receiver has its independently measured or evidenced calculated episode numerator divided once by accepted A, following section 8 cycle numerator rules"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_scaffold_cycle_release
              source_ids:
                - cycle-normalization-method
                - carbon-oxidation-identity
            ranges:
              - role: qa_guardrail
                lower: "0"
                upper: "3.6666666666666667"
                unit: "kg CO2/kg fossil carbon burned"
                basis: "per kg independently measured fossil carbon burned; 44/12 constraint"
                basis_kind: "fuel_inventory"
                evidence_kind: "method_formula"
                source_ids:
                  - carbon-oxidation-identity
        - row_id: water_vapour_air
          role: "Water vapour, to air unspecified"
          name: "Water vapour, to air unspecified"
          flow_type: "elementary"
          flow_ref:
            uuid: "fe0acd60-3ddc-11dd-ac04-0050c2490048"
          property_unit: "Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg"
          description: "Use this air-unspecified H2O identity only for independently supported actual evaporation from owned wet operations. Range evidence need: independently measured available water-only pools and an evaporation measurement/model with uncertainty. A water closure residual is a data gap, not vapour; zero also needs evidence, and a more specific compartment needs its own identity."
          amount:
            expression: "Each concrete identity/state/receiver has its independently measured or evidenced calculated episode numerator divided once by accepted A, following section 8 cycle numerator rules"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_scaffold_cycle_release
              source_ids:
                - cycle-normalization-method
                - compatible-pool-ledger-method
            ranges: []
allocation_rules:
  - rule_id: direct_episode
    applies_to: "scaffold_cycle"
    rule: "Attribute direct events to the actual configuration and phase first; all erection, idle, unavailable, test, dismantling and ordinary rework burdens belonging to this episode remain in its numerator. Repeated inspections or use periods do not create additional accepted area."
    source_ids:
      - cycle-normalization-method
  - rule_id: shared_consumers
    applies_to: "scaffold_cycle"
    rule: "Enumerate every real kit, auxiliary equipment and meter consumer and relevant period, including outside consumers. Subdivide actual measured use first; allocate only the remaining shared burden by a documented causal capacity/use basis with exclusive shares and uncertainty. Reconcile the whole provider/meter total before dividing this episode share by A."
    source_ids:
      - asset-attribution-method
  - rule_id: asset_coverage
    applies_to: "scaffold_cycle"
    rule: "Keep scaffold-kit occupation and auxiliary hired equipment mutually exclusive for each actual asset. Count provider-included manufacture, fuel and maintenance once. For self-owned assets require evidenced service capacity/lifetime, actual use, wear, repair and damage/retirement attribution, or declare a gap. No assumed reuse count and no full new-kit manufacture per deployment."
    source_ids:
      - asset-attribution-method
  - rule_id: replacement_and_return
    applies_to: "scaffold_cycle"
    rule: "Avoid charging the same replacement manufacture both as consumed product and unadjusted kit-service manufacture. Used kit return records its worn/cleaned/repair state and is not unused input return. Product/waste exits retain real recipients; return or recycling alone supplies no automatic substitution credit."
    source_ids:
      - asset-attribution-method
      - compatible-pool-ledger-method
  - rule_id: rejected_cycle
    applies_to: "scaffold_cycle"
    rule: "Link failed inspection, repeat joining, cleaning, quarantine, approved repair and exit decisions to the originating kit/configuration. Retain their actual burdens and unresolved fates. A partial handover, changed cohort or open return ledger cannot be allocated into a fictitious completed service output."
    source_ids:
      - cycle-normalization-method
      - compatible-pool-ledger-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_scaffold_cycle_material
      process_id: "scaffold_cycle"
      flow_role: "configuration geometry; materials; product and waste exits"
      record_type: "phase-indexed foreground event record"
      raw_fields: "event/lot/configuration ID; process/phase/time; owner; role; actual identity/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence; uncertainty"
      collection_method: "Survey disjoint accepted elevation polygons independently and reconcile handover and closure. Weigh each concrete material/current state and dispatch; retain counts and traceable same-state conversion when direct weighing is unavailable. Observe outside deposits and constituent moisture independently; identify actual receiver and phase."
      unit: "kg; m2"
      frequency: "each event and interval boundary"
      temporal_coverage: "full issue-to-return episode, including unavailability and rework"
      site_scope: "declared site/configuration and responsible off-site cleaning/return duties"
      aggregation_rule: "per reference flow"
      quality_evidence: "survey and acceptance records; scale calibration; component/SKU and dispatch documents; moisture/constituent evidence"
    - protocol_id: cp_scaffold_cycle_utility
      process_id: "scaffold_cycle"
      flow_role: "fuel; electricity; supplied water"
      record_type: "phase-indexed foreground event record"
      raw_fields: "event/lot/configuration ID; process/phase/time; owner; role; actual identity/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence; uncertainty"
      collection_method: "Read calibrated fuel/utility meters and opening/closing stocks over the entire owned duty, idle, test and rework intervals. Record supply identity and meter topology; reconcile every consumer and provider-covered quantities before episode attribution. Convert native units only using an independently evidenced same-state bridge."
      unit: "kg; kWh"
      frequency: "each event and interval boundary"
      temporal_coverage: "full issue-to-return episode, including unavailability and rework"
      site_scope: "declared site/configuration and responsible off-site cleaning/return duties"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration and readings; supply documents; equipment/phase log; allocation reconciliation"
    - protocol_id: cp_scaffold_cycle_asset
      process_id: "scaffold_cycle"
      flow_role: "kit occupation; distinct auxiliary services; asset observations"
      record_type: "phase-indexed foreground event record"
      raw_fields: "event/lot/configuration ID; process/phase/time; owner; role; actual identity/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence; uncertainty"
      collection_method: "Follow asset and component IDs from issue through handover, actual available/unavailable periods, dismantling and assessed return/repair/retirement. Record every user, provider boundary and actual occupation/use intervals. For self-owned attribution collect actual lifetime/capacity, use, wear and damage evidence rather than assuming cycles."
      unit: "h; kg observations"
      frequency: "each event and interval boundary"
      temporal_coverage: "full issue-to-return episode, including unavailability and rework"
      site_scope: "declared site/configuration and responsible off-site cleaning/return duties"
      aggregation_rule: "per reference flow"
      quality_evidence: "custody and condition ledger; dated user/availability log; provider contract; evidenced owned-asset attribution"
    - protocol_id: cp_scaffold_cycle_release
      process_id: "scaffold_cycle"
      flow_role: "abstraction; substance/compartment releases"
      record_type: "phase-indexed foreground event record"
      raw_fields: "event/lot/configuration ID; process/phase/time; owner; role; actual identity/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence; uncertainty"
      collection_method: "Measure actual abstraction and releases by source/substance/compartment; use documented applicable emission or evaporation models only with observed activity, composition and uncertainty. Preserve raw concentration/flow and capture records; separate direct discharge from treatment waste and fossil carbon from water pools."
      unit: "kg"
      frequency: "each event and interval boundary"
      temporal_coverage: "full issue-to-return episode, including unavailability and rework"
      site_scope: "declared site/configuration and responsible off-site cleaning/return duties"
      aggregation_rule: "per reference flow"
      quality_evidence: "sampling and analytical QA; meter/model provenance; activity and composition records; capture/receiver evidence"
  calculation_rules:
    - id: accepted_area
      applies_to: "reference_service"
      rule: "A = sum of disjoint accepted facade-elevation polygon areas for the stable configuration. Remove unserved gaps and duplicate overlap; do not sum decks, lifts, repeated days or ground plan."
      inputs:
        - survey
        - configuration
        - gate
        - cp_scaffold_cycle_material
      output: "A"
      source_ids:
        - cycle-normalization-method
    - id: cycle_numerators
      applies_to: "all inventory rows"
      rule: "For each concrete identity/state/receiver j, N_j = attributed episode quantity in its declared numerator unit, after measured same-state conversion and exclusive attribution; E_j = N_j / A. Retain distinct j values; heterogeneous totals only test ledger completeness."
      inputs:
        - N_j
        - A
        - cp_scaffold_cycle_material
        - cp_scaffold_cycle_utility
        - cp_scaffold_cycle_asset
        - cp_scaffold_cycle_release
      output: "E_j"
      source_ids:
        - cycle-normalization-method
        - asset-attribution-method
    - id: final_area_output
      applies_to: "reference_service"
      rule: "Final output = A / A = 1 m2 for the complete accepted cycle, with actual duration and configuration qualifiers retained. No other observation self-normalizes into a final product."
      inputs:
        - A
        - "closed gate"
        - cp_scaffold_cycle_material
      output: "1 m2"
      source_ids:
        - cycle-normalization-method
    - id: exclusive_attribution
      applies_to: "all inventory rows"
      rule: "Attribute independently metered events first. Partition only the residual shared provider/meter burden among all evidenced consumers by actual causal use/capacity; preserve exhaustive exclusive shares and uncertainty. Provider-included and separately recorded quantities must be reconciled before calculating E_j."
      inputs:
        - "consumer/phase register"
        - "provider coverage"
        - cp_scaffold_cycle_asset
        - cp_scaffold_cycle_utility
      output: "attributed N_j"
      source_ids:
        - asset-attribution-method
    - id: compatible_closure
      applies_to: "all inventory rows"
      rule: "For each compatible material/state/constituent pool, opening stock + observed external additions = closing stock + independently measured retained, returned, discarded and released constituents + residual. Evaluate uncertainty in residual; do not generate a balancing exchange. Keep used kit state and external deposits distinct."
      inputs:
        - "state/constituent ledgers"
        - cp_scaffold_cycle_material
        - cp_scaffold_cycle_release
      output: "closure findings"
      source_ids:
        - compatible-pool-ledger-method
    - id: water_only_closure
      applies_to: "water_supplied; direct_freshwater_abstraction; collected_wastewater_slurry; water_vapour_air; specific_direct_water_releases"
      rule: "Reconcile independently observed water-only inputs and opening water against water-only closing/retained/returned content, collected liquid waste, supported evaporation and direct releases. Internal recirculation cancels; solids and chemicals are separate constituents. Residual does not establish evaporation."
      inputs:
        - "water-only measurements"
        - cp_scaffold_cycle_utility
        - cp_scaffold_cycle_release
        - cp_scaffold_cycle_material
      output: "water closure findings"
      source_ids:
        - compatible-pool-ledger-method
    - id: fossil_carbon_constraint
      applies_to: "fossil_co2_air"
      rule: "For independently measured fossil carbon burned C_f, fossil CO2 <= C_f * 44 / 12. Record actual CO2 by applicable measurement/model; account separately for carbon in other species and residual uncertainty. This upper constraint does not assume complete oxidation and is not kg CO2 per kg diesel."
      inputs:
        - C_f
        - "actual emission evidence"
        - cp_scaffold_cycle_utility
        - cp_scaffold_cycle_release
      output: "fossil-carbon QA"
      source_ids:
        - carbon-oxidation-identity
  data_quality_requirements:
    - id: configuration_gate
      applies_to: "reference_service"
      requirement: "Retain configuration/kit IDs, surveyed elevation polygons and positive A, height, loading class, deck/lift and tie pattern, substrate release, handover and dismantling/return/restoration records, actual dated availability and unavailability and responsible parties. Changed geometry requires a separately reviewed cohort."
      evidence: "survey, design and closed acceptance journal"
    - id: actual_condition
      applies_to: "all inventory rows"
      requirement: "Each conditional card needs actual yes/no/unresolved occurrence and evidence. Instantiate each concrete material, SKU, state, species and receiver separately with its own native observation, conversion and N_j/A; unresolved occurrence cannot be set to zero."
      evidence: "event evidence and concrete exchange register"
    - id: temporal_asset_coverage
      applies_to: "scaffold_cycle"
      requirement: "Connect all phase events, inputs, assets, exits, deposits and maintenance to actual dates and IDs. Enumerate all kit/equipment/meter consumers and period shares. Retain provider coverage or evidenced owned lifetime/capacity, actual use, wear, damage, repair and retirement; disclose missing evidence."
      evidence: "phase ledger; contracts; asset condition and attribution reconciliation"
    - id: reject_and_fate
      applies_to: "scaffold_cycle"
      requirement: "Identify unready or altered scaffold, failed inspections and defective/quarantined components. Link repeat work and actual ordinary maintenance, external repair, usable return, retention or documented discard to the originating episode. Open return/fate is incomplete; lost/stolen stock is not waste. Used kit is not an unused return."
      evidence: "inspection and custody/fate records; positive discard/receiver evidence"
    - id: compatible_constituents
      applies_to: "all inventory rows"
      requirement: "Preserve independent incoming/use-period deposits and actual moisture, contamination and constituent bridges. Close each compatible material/state pool; do not equate whole wet mixture to its dry constituent. Separate water-only and fossil-carbon accounts; do not add O2 or fabricate dust, waste, vapour or other balancing flows."
      evidence: "independent measurements; compositional analyses; uncertainty and residual report"
    - id: range_evidence
      applies_to: "all inventory rows"
      requirement: "The 25 cards without numeric ranges each state the concrete missing evidence and physical constraint in their description. Collect those records and assess the actual envelope before treating a range as known. Do not insert broad arbitrary bounds or imply that manufacturer safety/design examples are LCA consumption factors."
      evidence: "row-specific collection and physical-QA assessment; supported normalization/carbon ranges"
    - id: identity_support
      applies_to: "all inventory rows"
      requirement: "Confirm actual flow identity and compatible support independently before final exchange creation. Keep Area and Mass support distinct from unresolved Energy and standalone Duration support. Identity confirmation is separate from quantity, range, actual activation and engineering acceptance."
      evidence: "identity/support verification and actual foreground evidence"
validation_rules:
  - rule_id: accepted_gate
    applies_to: "reference_service"
    rule: "Require positive independently measured A, inspected handover, dated availability closure, dismantling and reconciled component return/repair/discard plus owned restoration. Count each accepted elevation once; verify all required qualifiers and separate changed geometry."
    source_ids:
      - cycle-normalization-method
  - rule_id: identity_and_activation
    applies_to: "all inventory rows"
    rule: "Resolve each instantiated concrete identity, state, property, unit and receiver before final exchange delivery. Report actual occurrence as yes/no/unresolved with evidence; no evidence is not zero. A verified UUID does not prove quantity or activation. Use unspecified-air fixed identities only for that compartment."
    source_ids:
      - compatible-pool-ledger-method
  - rule_id: phase_and_asset_coverage
    applies_to: "scaffold_cycle"
    rule: "Check phase event continuity, kit/component identities and every shared consumer/period. Verify one owner and no duplicate kit, manufacture, maintenance, fuel or meter burden. Check failed/reworked states against their actual fate and prohibit unaccepted service in the denominator."
    source_ids:
      - asset-attribution-method
      - cycle-normalization-method
  - rule_id: physical_qa
    applies_to: "all inventory rows"
    rule: "Reconcile compatible material/current-state/constituent pools with opening and closing stocks and separately observed additions. Test water-only and fuel-carbon constraints separately. Never balance fuel kg against CO2 kg or invent oxygen, waste, dust, vapour or other exchanges from residuals."
    source_ids:
      - compatible-pool-ledger-method
      - carbon-oxidation-identity
  - rule_id: range_and_gaps
    applies_to: "all inventory rows"
    rule: "Preserve the two supported ranges and each of the other 25 row-specific range evidence needs. Assess the actual physical constraint using measured inputs and fates; missing range evidence, uncertain state, support identity or asset attribution remains a disclosed gap, never an invented bound."
    source_ids:
      - cycle-normalization-method
      - compatible-pool-ledger-method
  - rule_id: report_completeness
    applies_to: "foreground dataset"
    rule: "Report accepted input, performed and skipped checks, findings, uncertainty and completeness. An automated structural pass does not certify engineering compliance, final UUID readiness or closure of an incomplete cycle."
    source_ids:
      - cycle-normalization-method
published_dataset_profile:
  dataset_role: "Foreground scaffolding-cycle data package with process/lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Compatible supported modular galvanized-steel facade scaffold episodes with explicit area, configuration, actual duration and asset/provider coverage"
  excluded_use: "Engineering safety certification; rental alone; other scaffold systems; user-trade inventory; unqualified area-day comparison; incomplete cycles"
  required_metadata: "Site/geography; actual configuration/kit IDs; positive A and polygons; height/load/decks/ties/substrate; phase dates and actual availability duration; handover/closure; concrete identities; asset/provider and meter coverage"
  required_quality_disclosure: "Performed/skipped checks and completeness; unresolved identities, support, ranges, fates and owned-asset attribution; measured conversions, factor/model applicability, uncertainty and closure residuals"
  update_trigger: "Configuration/geometry, load/deck/tie, source/technology, ownership/provider coverage, duration/cohort, maintenance/fate evidence or identity/method changes"
data_sources:
  - id: "peri-instructions"
    type: "handbook"
    reference: "PERI UP Scaffolding Kit, Core components, Assembly instructions, Version 2.2, pp. 8, 10, 12–14. https://www.peri.ie/dam/jcr%3A8e2c13f7-1dd2-337d-a227-cb3329355256/peri-up-scaffolding-kit-core-components-instructions-for-assembly-and-use.pdf"
    used_for: "Manufacturer-specific cleaning/maintenance, component condition, support/anchoring, transport, marking and inspected handover. No universal lifespan, reuse count, consumption rate or safety threshold is adopted."
  - id: "osha-scaffold"
    type: "official_guidance"
