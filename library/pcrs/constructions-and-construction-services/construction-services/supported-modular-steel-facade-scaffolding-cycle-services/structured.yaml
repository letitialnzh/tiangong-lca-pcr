    - rule_id: cycle_responsibility
      applies_to: "scaffold_cycle"
      rule: "Maintain one event-linked responsibility across kit issue and owned transport, erection/joining/tying and inspection, handover, all actual available/unavailable intervals, dismantling, cleaning/assessment, return/repair/discard decisions and owned site restoration. The erected state is an observed gate inside this node, not another product output."
