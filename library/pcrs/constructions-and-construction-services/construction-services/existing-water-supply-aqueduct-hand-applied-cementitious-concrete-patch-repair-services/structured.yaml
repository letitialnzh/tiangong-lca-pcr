product_category_identity:
  canonical_pcr_id: "pcr.existing-water-supply-aqueduct-hand-applied-cementitious-concrete-patch-repair-services"
  classification_refs: "CPC 3.0 54231; narrower methodology subset"
  covered_products: "Finally accepted hand-applied one-part cementitious local spall repair service on retained non-pipeline water-supply concrete aqueduct/channel"
  excluded_products: "New conduit; irrigation/flood/navigation works; pipelines; sprayed full lining; crack injection; joint sealant; new/replaced reinforcement or major structural strengthening"
  representative_product: "Approved water-contact cementitious mortar patch compacted around qualified retained reinforcement on prepared sound host concrete"
  production_route: "Qualify/isolate/access → local removal and cleaning → conditional approved rebar protection/primer → measured powder/water batches → hand scratch coat, compaction and profile → protected curing → inspection/rework and signed hygienic handover"
  market_state: "Completed installed repair service at owner acceptance; neither dry mortar sale nor fresh mortar supply"
functional_unit:
  what: "Accepted local concrete patch repair of retained water-supply aqueduct"
  how_much: "1 m3 of unique finally accepted installed geometric patch volume"
  how_well: "Actual approved water-contact mortar/system; qualified retained sound substrate/rebar; completed required cure; accepted geometry/bond and owner hygienic gate"
  how_long_or_cycle: "One bounded job including all attempts, preparation, cure, tests and defect closure until signed handover; link stock carry and shared-asset manufacture, operation/maintenance/replacement and termination/end-of-life phases across all relevant periods; no assumed service life"
  reference_flow_link: "accepted_patch_repair"
system_boundary:
  rules:
    - rule_id: host_gate
      applies_to: "patch_repair"
      rule: "Map defects and remove only approved material without compromising structural integrity. Qualify stable clean roughened sound substrate and retained rebar; refer major bar damage or structural rebuilding outside this subset. Record actual instruction and approvals."
      source_ids:
        - sika-4100-protect-2025
        - sika-concrete-repair-handbook
    - rule_id: route_gate
      applies_to: "patch_repair"
      rule: "For adopted 4100 GB April 2025 v02.03, use 4.4–4.5 L water/25 kg powder, at least 3 minutes mixing and per-batch consistency check; 4–60 mm per-layer and +5 to +30 °C air/substrate limits apply to that product instruction only. Prewet and remove standing water, scratch coat and firmly compact without voids; do not add finishing water or feather-edge. Record actual approved layer strategy; if retained reinforcement is exposed under this adopted 4100 instruction, verify its Sa 2 (ISO 8501-1) preparation requirement against the actual approved method."
      source_ids:
        - sika-4100-protect-2025
    - rule_id: conditional_coatings
      applies_to: "patch_repair"
      rule: "Bonding primer is generally unnecessary on well-prepared roughened substrate; own actual required compatible primer wet-on-wet and any actual retained-rebar protection, including every supplied component and full exposed circumference. Do not assume their absence or invent recipe ratios."
      source_ids:
        - sika-4100-protect-2025
        - sika-concrete-repair-handbook
    - rule_id: cure_and_handover
      applies_to: "patch_repair"
      rule: "Protect fresh repair immediately from premature drying with compatible actual method. Retain curing resources and weather records; resolve actual product/current-instruction/owner cure, geometry, bond and water-contact/hygienic conditions before signed acceptance. A brochure laboratory strength or elapsed timer is not site acceptance."
      source_ids:
        - sika-4100-protect-2025
        - sika-concrete-repair-handbook
    - rule_id: complete_job
      applies_to: "All inventory rows"
      rule: "Own actual incremental isolation, diversion, dewatering, access, cleaning, prewetting, containment, disinfection/test water, cure and defect closure including provider-paid resources. Capture oversupply, off-spec mix, tools washout, packaging, waste transport/treatment, utilities and releases. Unknown is not zero; documented actual absence is allowed."
      source_ids: []
    - rule_id: one_owner
      applies_to: "providers; assets; freight; electricity; fuel"
      rule: "Maintain event/resource IDs and exactly one burden owner across direct work, provider bundles, rentals and assets. Existing host manufacture and hypothetical avoided replacement or water-treatment credits are excluded. Factory dry premix is one purchase, not second cement/aggregate/polymer purchases; in-job mixed mortar is a nonadditive activity."
      source_ids: []
    - rule_id: period_phase_boundary
      applies_to: "All inventory rows"
      rule: "Enumerate actual job/reporting periods, opening/closing carried-stock phases and reusable-asset manufacture, operation, maintenance/replacement and termination/end-of-life phases. Link every input, asset, output and event to period/phase IDs and original burden owner; no arbitrary annualization or whole-asset repurchase each period."
      source_ids: []
    - rule_id: boundary_atomic_completion
      applies_to: "all processes"
      rule: "Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry."
      source_ids: []
