boundary_abstraction:
  declared_starting_condition: "Surveyed existing water-supply concrete aqueduct with local spalling, retained sound substrate and potentially exposed retained reinforcement; owner-authorised repair scope and actual operational/isolation state"
  starting_condition_role: "Retained host state interface, not newly manufactured aqueduct or a purchased input exchange"
  product_classification_scope: "Water-supply non-pipeline construction service subset of CPC 3.0 54231"
  recursive_input_rule: "Treat purchased same-category subservice as an explicitly bounded upstream service with exact scope/resources/results; do not recursively purchase the whole aqueduct or count the same repair output twice"
  upstream_dataset_requirement: "Actual powder/formulation and other supplies, utilities, fuel, transport, providers and complete-life attributable tools/access assets need compatible upstream datasets and boundaries; mark missing coverage as incomplete"
  disclosure: "Declare access, operational state, isolation/diversion/dewatering, contractor scope, retained host, actual materials, excluded adjacent construction and all conditional actual absence evidence"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted hand-applied cementitious concrete patch repair of retained water-supply aqueduct"
    uuid: ""
  flow_property_ref:
    uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
  unit_group_ref:
    uuid: "93a60a57-a3c8-12da-a746-0800200c9a66"
  reference_unit: "m3"
  required_qualifiers:
    - "Water-supply function and non-pipe host"
    - "job/patch IDs"
    - "retained host/rebar assessment"
    - "actual mortar SKU/version/approval"
    - "net patch area"
    - "depth distribution and V survey/uncertainty"
    - "substrate and exposure"
    - "batch/layer/environment/cure records"
    - "actual primer/protection"
    - "water-contact/hygienic requirements"
    - "bond/geometry results"
    - "defect closure and signed acceptance"
reference_flows:
  []
measurement_rules:
  - id: accepted_geometry
    applies_to: "accepted_patch_repair"
    required_property_ref:
      name: "Volume"
      uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
    required_unit: "m3"
    rule: "Survey actual accepted patch geometry with disjoint patch IDs and measured depth distribution; determine V using cp_accepted_patch_repair; reject missing/nonpositive V and exclude unaccepted/overlapping/void volume."
  - id: state_conversion
    applies_to: "repair_powder; mix_water; material_waste; aqueous_waste"
    required_property_ref:
      name: "Actual measured state-specific property"
      uuid: ""
    required_unit: "Actual compatible unit"
    rule: "Keep dry powder, metered water, total fresh mix and cured retained material separate. A mass/volume conversion requires measured matching formulation, moisture, temperature/state and traceable density evidence; fresh density never defines accepted cured geometry."
  - id: native_units
    applies_to: "All inventory rows"
    required_property_ref:
      name: "Actual verified native property"
      uuid: ""
    required_unit: "Actual compatible native unit"
    rule: "Keep Count, Length, Area, Mass, Volume, Energy and transport units in independent compatible ledgers. Record actual SKU/component/provider and unit conversion support. No price/hours-to-Count or fuel calorific-property-to-electricity substitution."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: patch_repair
    name: "Integrated retained-aqueduct patch repair"
    inclusion: "required"
    inclusion_condition: "Qualified bounded hand-applied water-supply repair; only final signed acceptance creates output"
    role: "Damaged retained host → prepared host → measured hand-placed mortar → cured accepted patch; embedded removal/mixing/profile/cure have no independent product handoff"
    quantitative_reference: "1 m3 reference flow"
process_inventory:
  - id: patch_repair
    label: "Integrated retained-aqueduct patch repair"
    inputs:
      product:
        - row_id: repair_powder
          role: "Approved one-part dry repair mortar"
          name: "Approved one-part dry repair mortar"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Actual water-contact dry premix crosses as net dry powder; weigh batches and retain formulation/SKU and packaging tare. No second wet-mortar or constituent purchase. Range evidence need: Actual job/SKU dry-powder supply and uncertainty needed; theoretical consumption is not an empirical yield."
          amount:
            expression: "powder_supply / V; actual native kg quantity divided by accepted installed V in m3"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m3 reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_repair_powder
              source_ids:
                - sika-4100-protect-2025
            ranges: []
        - row_id: mix_water
          role: "Metered clean mixing water"
          name: "Metered clean mixing water"
          flow_type: "product"
          property_unit: "Volume / m3"
          description: "Meter clean water entering each powder batch; separate mixed, discarded, retained and evaporated water. Do not add mixed water twice through a bought wet-mortar exchange. Range evidence need: Actual mixing-water supply per accepted V, batch dosing variability, density/state and meter uncertainty need foreground evidence. The adopted-product water/powder instruction is a conditional method requirement, not a per-output quantity range."
          amount:
            expression: "mix_water_supply / V; actual native m3 quantity divided by accepted installed V in m3"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m3 reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_mix_water
              source_ids:
                - sika-4100-protect-2025
            ranges: []
        - row_id: aux_water
          role: "Actual preparation, cleaning, curing and test water"
          name: "Actual preparation, cleaning, curing and test water"
          flow_type: "product"
          property_unit: "Volume / m3"
          description: "Own actual prewet/standing-water removal, tool wash, curing, disinfection/test and incremental isolation/dewatering water. Distinguish purchased water from retained host-water transfer and identify actual fate. Retained host-water diversion is a physical state transfer, not another purchased water input; own its actual incremental supplies, energy, provider and waste/release fates. Range evidence need: Actual purpose-specific water volumes, origin/fate and meter uncertainty needed."
          amount:
            expression: "aux_water_supply / V; actual native m3 quantity divided by accepted installed V in m3"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m3 reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_aux_water
              source_ids:
                - sika-4100-protect-2025
                - sika-concrete-repair-handbook
            ranges: []
        - row_id: electricity
          role: "Actual direct electricity"
          name: "Actual direct electricity"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Record actual mixer, preparation, pumping, access, lighting, curing or testing electricity once, including off-spec work. Separate provider-included electricity; resolve actual Energy support before final dataset. Range evidence need: Actual metered energy by job/period and allocation uncertainty needed."
          amount:
            expression: "electricity_attributed / V; actual native kWh quantity divided by accepted installed V in m3"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m3 reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_electricity
              source_ids: []
            ranges: []
        - row_id: freight
          role: "Actual attributable freight transport"
          name: "Actual attributable freight transport"
          flow_type: "product"
          property_unit: "mass*distance / kg*km"
          description: "Track actual material, tools and waste movements with payload, distance, route and empty-leg allocation evidence; avoid bundled-delivery duplicates. Range evidence need: Actual route/payload and allocation records needed; no generic distance."
          amount:
            expression: "freight_work / V; actual native kg*km quantity divided by accepted installed V in m3"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m3 reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_freight
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_patch_repair
          role: "Accepted installed patch repair"
          name: "Accepted hand-applied cementitious concrete patch repair of retained water-supply aqueduct"
          flow_type: "product"
          property_unit: "Volume / m3"
          description: "Output exists only after signed complete cure, geometry/bond and actual water-contact/hygienic gate. Measure V from actual accepted geometry, excluding overlaps, voids and rejected attempts. Range evidence need: Exact 1 m3 is normalization only; actual patch volume/uncertainty and gate evidence required, no empirical yield implied."
          amount:
            expression: "1 m3"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m3 reference flow"
              kind: "reference_flow"
            evidence:
              kind: "method_formula"
              collection_protocol_id: cp_accepted_patch_repair
              source_ids:
                - sika-4100-protect-2025
                - sika-concrete-repair-handbook
            ranges: []
      waste:
        - row_id: aqueous_waste
          role: "Actual collected wastewater to treatment"
          name: "Actual collected wastewater to treatment"
          flow_type: "waste"
          property_unit: "Volume / m3"
          description: "Measure captured preparation, washout, cure/test and hygiene wastewater with sludge separation and treatment destination. Captured wastewater is not also an elementary release; inherited host water and supplied water stay distinguishable. Range evidence need: Actual collected volume/composition and treatment uncertainty needed."
          amount:
            expression: "wastewater_volume / V; actual native m3 quantity divided by accepted installed V in m3"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m3 reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_aqueous_waste
              source_ids:
                - sika-4100-protect-2025
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: supply_stock
    applies_to: "All supplied material/fuel rows and usable return rows"
    rule: "For each actual SKU and native unit, attributable gross supply = opening attributable stock + external net-tare gross receipts - closing carried stock; internal issue is not a purchase. Gross-with-outlets retains outward usable return exchanges; consumed-only removes matched usable returns from attributed supply once and omits a second return credit. Declare convention; never subtract nonreturned waste/loss. Closing stock is not outward return."
    source_ids: []
  - rule_id: single_repair_output
    applies_to: "accepted_patch_repair; material_waste; aqueous_waste"
    rule: "No intended coproduct is assumed. All preparation, setup/changeover/cleaning, failed batches, removals, repeat tests and repeat curing remain attributed to unique final positive V. Rejected mix/patch has a same-node rework loop or evidenced waste/recovery exit, never accepted output. Document actual recovery destination and burden treatment; no avoided-asset or hypothetical recycling credit."
    source_ids: []
  - rule_id: batch_attribution
    applies_to: "patch_repair"
    rule: "Index each batch and all consumers/patches with actual powder/water, applied fresh mix and residuals. Allocate shared preparation/cleaning/test resources by measured compatible causal driver, retain all consumers and sum shares to unity, assign each event once. Do not multiply V by batch/layer/attempt count or count intermediate mixed mortar as a second product."
    source_ids: []
  - rule_id: asset_life
    applies_to: "assets"
    rule: "For each asset, attributed equivalent = actual job compatible driver / whole-life all-consumer driver. Cover every job/node/period, full manufacture, maintenance, replacements and end-of-life. Use complete observed life or observed history plus evidenced remainder, replacements, termination and end-of-life scenario with uncertainty, sensitivity and update triggers. A short campaign denominator or rental hours alone cannot establish full-life coverage; missing denominator/coverage blocks final dataset."
    source_ids: []
  - rule_id: provider_exclusivity
    applies_to: "providers; assets; freight; electricity; fuel"
    rule: "Match genuine provider native unit to completed resource/result scope and disclosed full upstream coverage. One owner for each direct utility, supplied material, freight, rental, asset, spare and treatment burden. Exclude covered direct duplicates and include uncovered resources explicitly; price/hours are not invented service Count."
    source_ids: []
  - rule_id: phase_attribution
    applies_to: "All inventory rows"
    rule: "Assign actual period-specific resource use and stock burden carry to the receiving job once; retain original material burden with carried stock until attributed use/exit. Allocate manufacture and replacement/end-of-life asset burdens using the evidenced complete-life all-consumer driver, while actual period operation/maintenance has explicit coverage and one owner. Link phase shares and all consumers, prevent charging the whole asset or carried supply again in another period. Unknown replacement or termination assumptions block finalization."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_repair_powder
      process_id: "patch_repair"
      flow_role: "repair_powder"
      record_type: "Foreground measured records"
      raw_fields: "job_id; patch_id; event_id; period_id; phase_id; sku; dry_mass; opening_stock; receipts_net_tare; closing_stock; batch_id; powder_dosed; returns; waste; loss; powder_supply"
      collection_method: "Collect traceable actual job/batch/event measurements, stock/receipt/fate or completed service records in native units; reconcile original SKU/provider and exclusive burden owner. Denominator V is unique finally accepted installed geometric volume in m3."
      unit: "kg"
