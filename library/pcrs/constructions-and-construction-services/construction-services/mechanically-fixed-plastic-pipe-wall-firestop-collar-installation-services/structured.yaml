measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Count one accepted complete penetration stage once, after all required faces pass inspection; failed or incomplete stages are not accepted count."
  - id: component_measure
    applies_to: "collars; additional_fixings; material exits"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Where mass reconciliation is used for counted components, retain actual model-specific net unit mass or traceable weighing, excluding packaging; never apply an assumed steel density or generic collar mass."
  - id: energy_record
    applies_to: "installation_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Retain metered drilling, extraction and attributable charging electricity in the recorded unit. If a supplier service already includes it, disclose coverage and exclude the duplicate exchange; do not assume manual fitting is electricity-free."
  - id: resource_time
    applies_to: "tool_access_service; logistics_service"
    required_property_ref:
      name: "Duration"
      uuid: ""
    required_unit: "h"
    rule: "Use actual bounded supplier-service hours with complete provider and included-burden metadata; do not convert time into count or invent equipment lifetime."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: collar_install
    name: "Mechanical collar fitting, inspection and handover"
    inclusion: "required"
    inclusion_condition: "Compatible accepted preseal and actual matching wall/pipe/collar/fixing system established"
    role: "assembly integration of factory collar components with existing customer wall interface; rework/reject and shared infrastructure responsibilities"
    quantitative_reference: "1 item accepted complete penetration stage"
process_inventory:
  - id: collar_install
    label: "Mechanical collar fitting, inspection and handover"
    inputs:
      product:
        - row_id: collars
          role: "Factory steel-housed intumescent plastic-pipe firestop collars"
          name: "Factory steel-housed intumescent plastic-pipe firestop collars"
          flow_type: "product"
          property_unit: "Number of items 01846770-4cfe-4a25-8ad9-919d8d378345 / item"
          description: "Receive the actual finished collar model/size for every required wall face, including issue for failed attempts. Identify supplied hook/packaging coverage explicitly; steel and intumescent material are constituents, not alternative finished-collar identities. Range evidence need: Obtain actual collar count and variability by required face/configuration, including corrective issues. The guide describes two collars for its wall route, but that is a system-completeness rule rather than a universal loss or mass interval. Do not infer a numerical inventory Range from nominal diameter or expansion ratio."
          amount:
            expression: "Gross issued collar count by exact model for the declared work-order lot, attributed to accepted complete stages; keep unused return and stock change separate."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_materials
              source_ids:
                - hilti-firestop-guide-2016
            ranges: []
        - row_id: installation_electricity
          role: "Actual drilling, extraction and attributable charging electricity"
          name: "Actual drilling, extraction and attributable charging electricity"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Record mains or attributable battery charging electricity for fixing-hole drilling, dust extraction and cleanup. The actual supplier/site/geography and service coverage determine the final identity; service-included energy is not a second purchased exchange. Range evidence need: Obtain actual meter/charge-session records, operation duration, sharing denominator and uncertainty. Tool power rating alone is not consumed energy, and no exact Energy property chain or supplier electricity UUID is assumed."
          amount:
            expression: "Metered or traceably apportioned electricity outside provider-included coverage, including all corrective visits, per accepted stage."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_resources
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_collar_installation
          role: "Accepted complete plastic-pipe wall firestop collar installation service"
          name: "Accepted complete plastic-pipe wall firestop collar installation service"
          flow_type: "product"
          property_unit: "Number of items 01846770-4cfe-4a25-8ad9-919d8d378345 / item"
          description: "This is the actual stage handover after all required faces are mechanically complete, the compatible prior seal remains undamaged, inspection/identification records are complete and corrective work is closed. No field fire test or universal rating is represented. Range evidence need: The exact one-item reference is a definition, not a yield Range. Collect actual accepted/rejected stage counts and configuration-specific variability; no source establishes a universal yield, fire duration or resource interval."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_acceptance
              source_ids:
                - hilti-firestop-guide-2016
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: a_rework
    applies_to: "collar_install"
    rule: "Retain failed attempts, extra visits, replacement parts and cleanup in the responsible work-order burden. Only accepted complete stages form the denominator; unresolved rejects remain pending, with their incurred resources reported and not hidden by an inflated output count."
    source_ids: []
  - rule_id: a_shared
    applies_to: "tool_access_service; installation_electricity; logistics_service"
    rule: "Index shared drill/extractor/charger/access and transport services by provider, service period and every consuming job/visit, including collar_install initial and corrective visits. Attribute measured use directly where possible; otherwise use documented task time within that same complete service period. Reconcile shares to the full billed/metered resource and disclose other jobs. Count each service or energy component once."
    source_ids: []
  - rule_id: a_returns
    applies_to: "usable_returns; packaging_waste; component_waste"
    rule: "Use a gross issue and separate exit ledger: issued components/packaging = installed or consumed + usable returns + waste + stock change. Record actual returned product identity and destination separately; never both subtract it from gross inputs and give an avoided-production credit. Recovery or recycling credit requires a separately declared study method and receiving route, not a material label."
    source_ids: []
  - rule_id: a_products
    applies_to: "accepted_collar_installation"
    rule: "The accepted installation is the sole intended product. Usable surplus/packaging returns are custody transfers, not a second installation output; no automatic co-product split or future fire-performance credit is assigned."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "collar_install"
      flow_role: "accepted stage"
      record_type: "work order and inspection"
      raw_fields: "penetration_id; wall_config; pipe_config; annular_geometry; prior_seal_product; prior_seal_depth; prior_seal_acceptance; approval_id; approval_revision; current_instruction_version; required_faces; collar_model; hooks_anchors; initial_visit; correction_visits; accepted_stage_count; handover_date"
      collection_method: "Inspect and photograph every required face, reconcile the supplied component specification with the actual approval/current instructions, retain prior-seal acceptance and signed complete-stage handover. Report accepted homogeneous stages and pending/rejected jobs separately."
      unit: "item"
      frequency: "each penetration and each correction"
      temporal_coverage: "first visit through signed handover"
      site_scope: "declared site and work-order lot"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approval/configuration comparison, current document applicability, all-face checklist, seal-condition record, dated acceptance and rejected-stage register"
    - protocol_id: cp_materials
      process_id: "collar_install"
      flow_role: "collars, fixings and cleaning supplies"
      record_type: "issue and stock records"
      raw_fields: "part_id; package_coverage; gross_issued_count; net_unit_mass; weighed_mass; supplied_hooks; extra_fixings; cleaning_product; cleaning_mass; label_mass; stock_change; returned_id"
      collection_method: "Count actual issued collar models and separate extra parts; weigh consumables or use traceable net mass records. Retain kit contents and split cleaning/label inputs by actual identity. Keep gross issue separate from returns and stock change. Divide attributable lot quantities by accepted same-configuration stages after reconciliation."
      unit: "item; kg"
      frequency: "each issue/return and work-order close"
      temporal_coverage: "all installation and correction visits"
      site_scope: "work-order store and point of use"
      aggregation_rule: "per reference flow"
      quality_evidence: "Invoices, batch/model labels, calibrated scale or traceable net mass, physical count and custody reconciliation"
    - protocol_id: cp_resources
      process_id: "collar_install"
      flow_role: "electricity, shared tool/access and logistics services"
      record_type: "meter and provider service ledger"
      raw_fields: "resource_id; provider; service_start; service_end; consumer_job_ids; visit_ids; billed_hours; task_hours; meter_kWh; charge_sessions; included_energy; included_transport; route; load; distance; receiving_gate"
      collection_method: "Read actual metered drilling/extraction/charging use and bounded supplier service hours. Identify all consumers and periods, allocate shared amounts using measured consumption or documented task-time shares and reconcile to total. Record actual delivery/return movements and provider coverage. Retain actual transport load/distance metadata for later service matching, without a generic trip factor."
      unit: "kWh; h"
      frequency: "each meter/service period and visit"
      temporal_coverage: "supply to final correction and cleanup"
      site_scope: "all consumers of each declared service period"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration/readings, provider scope, time sheets, full denominator, shares sum to one and no duplicate included energy/transport"
    - protocol_id: cp_exits
      process_id: "collar_install"
      flow_role: "returns and waste exits"
      record_type: "weighing and receiving records"
      raw_fields: "exit_id; originating_visit; material_identity; condition; mass; destination; recipient; stock_receipt; waste_classification; transport_owner; treatment_owner; transfer_date"
      collection_method: "Weigh and separate usable surplus or packaging returns, damaged components, discarded packaging, captured drilling debris and cleaning residues by actual material and receiving gate. Reconcile issued stock, installed materials and exits; verify usable returns with receiving custody. Allocate only the declared work-order share to accepted stages; retain pending/reject burdens."
      unit: "kg"
      frequency: "each exit and work-order close"
      temporal_coverage: "all installation/correction/cleanup visits"
      site_scope: "declared installation and receiving gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated weights, transfer notes, recipient acceptance, material/waste classification and mass reconciliation"
    - protocol_id: cp_releases
      process_id: "collar_install"
      flow_role: "actual elementary air or other environmental release"
      record_type: "measurement or reviewed emission calculation"
      raw_fields: "substance_or_particle; composition; size_fraction; compartment; measured_mass; sampling_period; activity_record; factor_reference; capture_efficiency; uncertainty; controls"
      collection_method: "Characterize actual uncollected drilling particles and any cleaning-related release separately by substance/particle identity and receiving compartment, with measured mass or a reviewed task-specific emission calculation. Retain control and capture evidence. Captured debris is waste, not emitted mass; VOC content is not an emission factor. Absence of measurement/factor is a data gap, not zero."
      unit: "kg"
      frequency: "each relevant operation or representative measured period"
      temporal_coverage: "all drilling, cleaning and corrections"
      site_scope: "actual foreground operation and environment boundary"
      aggregation_rule: "per reference flow"
      quality_evidence: "Sampling/analysis, reviewed factor applicability, particle/chemical identity, measured activity, uncertainty and non-duplication with captured waste"
  calculation_rules:
    - id: lot_attribution
      applies_to: "all inventory rows"
      rule: "For each homogeneous accepted-stage lot, reconcile the attributable gross resource or exit amount including corrective work, then divide by its accepted complete-stage count. Report unresolved jobs and associated burdens separately; do not mix configurations without declared equivalence."
      inputs:
        - cp_acceptance
        - cp_materials
        - cp_resources
        - cp_exits
        - cp_releases
      output: "inventory per reference flow"
      source_ids: []
    - id: stock_balance
      applies_to: "collars; additional_fixings; usable_returns; component_waste; packaging_waste"
      rule: "Reconcile gross issues with installed/consumed quantity, usable returns, waste and stock change for each material and compatible unit. Use measured net unit mass when reconciling count and kg; packaging is separate from component net mass."
      inputs:
        - cp_materials
        - cp_exits
      output: "material-specific reconciliation"
      source_ids: []
    - id: shared_share
      applies_to: "tool_access_service; installation_electricity; logistics_service"
      rule: "Use measured task resource where available; otherwise allocate the bounded shared service by documented task time divided by total consumer task time within that service period. Reconcile every share to the actual billed/metered amount and provider coverage."
      inputs:
        - cp_resources
      output: "attributable service/resource amount"
      source_ids: []
  data_quality_requirements:
    - id: q_configuration
      applies_to: "reference product"
      requirement: "Keep actual approvals and current chosen instructions, material configurations and installed faces traceable. Product family marketing and historic rating maxima are insufficient for job acceptance."
      evidence: "cp_acceptance and source applicability review"
    - id: q_completeness
      applies_to: "all inventory rows"
      requirement: "Record drilling, extraction/charging, cleaning, shared access, logistics, packaging and corrective work; distinguish documented non-use, provider-included coverage and missing data."
      evidence: "cp_materials; cp_resources; cp_exits"
    - id: q_ranges
      applies_to: "all inventory rows"
      requirement: "Collect observed variability and uncertainty for the actual configuration. No manufacturer expansion ratio, thermal limit, rating duration or VOC content supplies an installation inventory Range."
      evidence: "Per-card Range evidence needs and actual lot records"
    - id: q_identities
      applies_to: "all inventory rows"
      requirement: "Resolve every actual product/waste/elementary exchange and its support property/unit chain before final TIDAS dataset emission; split conditional aggregate roles into concrete identities."
      evidence: "Verified detail and support evidence; explicit unresolved manifest entries"
    - id: q_releases
      applies_to: "air_releases"
      requirement: "Distinguish released particles/substances from captured dust and disposed wipes; never claim generic zero emissions from absence of wet sealing."
      evidence: "cp_releases and cp_exits"
validation_rules:
  - rule_id: v_entry
    applies_to: "collar_install"
    rule: "Reject reference completion when actual wall/pipe/seal/collar/fixing configuration lacks a matching approval and current applicable instructions, or prior seal compatibility/condition is unconfirmed."
    source_ids:
      - hilti-wl2078-2018
  - rule_id: v_handover
    applies_to: "accepted_collar_installation"
    rule: "Verify required faces, latched collars, hook/fastener arrangement, undamaged prior seal, identification and signed inspection. Count one whole penetration stage once; a generic fire-hour promise is not an acceptance test."
    source_ids:
      - hilti-firestop-guide-2016
  - rule_id: v_rework
    applies_to: "collar_install"
    rule: "Trace each failure to mechanical correction and reinspection, confirmed product return, classified waste exit or separately bounded interface repair; never count unresolved failures as accepted output."
    source_ids: []
  - rule_id: v_shared
    applies_to: "tool_access_service; installation_electricity; logistics_service"
    rule: "Check all consuming jobs/periods and resource-share totals; reject duplicate equipment/energy/transport burdens already included in the supplier service. No inferred equipment lifetime is permitted."
    source_ids: []
  - rule_id: v_materials
    applies_to: "collars; additional_fixings; usable_returns; component_waste; packaging_waste; captured_debris; cleaning_waste"
    rule: "Reconcile component/packaging coverage and material exits with measured units and custody; split material-specific exits and preserve burden ownership at receiving gates."
    source_ids: []
  - rule_id: v_emissions
    applies_to: "air_releases"
    rule: "Require actual identified release and measurement or reviewed task-specific factor; product VOC content, unspecified dust or silent zero is not an elementary-flow inventory."
    source_ids: []
  - rule_id: v_bindings
    applies_to: "all inventory rows"
    rule: "Check concrete flow identity, type, role, gate, property and unit before dataset publication. Candidate PCR support gaps do not authorize near-match UUIDs or unverified final exchanges."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground installation data package; a completed qualified dataset may be secondary_dataset or background_dataset for the same service boundary"
  downstream_use: "Process projection for the complete collar-installation stage and lifecyclemodel integration into a declared building system"
  allowed_use: "Same declared wall/pipe/collar/approval configuration and accepted stage gate, with transparent upstream resource and downstream waste ownership"
  excluded_use: "Standalone whole-building fire performance; sealant application; floor systems; automatic equivalence across pipe sizes, approvals or supplied kit coverage"
  required_metadata: "All reference qualifiers, lot size, acceptance dates, actual approval/current-instruction revisions, supplier service scopes, resource periods/consumers, return and waste gates"
  required_quality_disclosure: "Observed variability, measurement uncertainty, actual releases, pending/reject burdens, unresolved identities/support chains, exclusions and provider-included burdens"
  update_trigger: "Change in approved system, collar or fixing model, wall/pipe/seal configuration, instructions, installation route, supplier service coverage, measured resources or receiving waste/return gate"
