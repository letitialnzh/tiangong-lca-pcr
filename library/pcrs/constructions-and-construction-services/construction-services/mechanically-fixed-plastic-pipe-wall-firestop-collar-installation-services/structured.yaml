product_category_identity:
  canonical_pcr_id: "pcr.mechanically-fixed-plastic-pipe-wall-firestop-collar-installation-services"
  classification_refs: "CPC 3.0 54659 — Other insulation services, n.e.c.; proposed narrower fireproofing-service scope"
  covered_products: "Accepted mechanical collar-installation stage on a declared presealed plastic-pipe wall penetration"
  excluded_products: "Annular wet sealing; wall or pipe construction; floor collars; metal pipes; field fire testing; unrelated insulation services"
  representative_product: "Completed CP 643N-type collar fitting on both required faces of one approved existing wall penetration"
  production_route: "Interface verification → cleaning → drilled mechanical attachment of collars/hooks/fixings → inspection and identification → acceptance"
  market_state: "Completed installation service at signed stage handover; supplied components become part of the existing building interface"
functional_unit:
  what: "One accepted complete mechanical collar-installation stage for one declared existing plastic-pipe wall penetration"
  how_much: "1 item; the item is the entire penetration stage, not an individual collar or wall face"
  how_well: "The actual system configuration, required faces, collar sizes, hooks, approved fixings and prior seal condition satisfy documented inspection and signed acceptance"
  how_long_or_cycle: "One installation work order through closed corrective work and signed handover; no building service-life or generic fire-resistance duration is claimed"
  reference_flow_link: "accepted_collar_installation"
system_boundary:
  rules:
    - rule_id: b_interface
      applies_to: "collar_install"
      rule: "Before installation, match actual wall, pipe, annular geometry and preseal to the selected tested/approved system and current supplied instructions. Record the seal acceptance and inspect it for damage; absence of compatibility evidence blocks output."
      source_ids:
        - hilti-wl2078-2018
    - rule_id: b_route
      applies_to: "collar_install"
      rule: "Include cleaning, drilling and dust control, collar latching, hooks/fixings, identification, inspection, corrective mechanical refitting and cleanup through signed handover. Keep wet sealing and damaged-interface repair outside this stage and reopen only after separately documented acceptance."
      source_ids:
        - hilti-firestop-guide-2016
    - rule_id: b_components
      applies_to: "collar_install"
      rule: "The component roles are factory steel/intumescent collars, hooks and anchor/washer sets, plus identification material where used. Supply records identify kit coverage; record extra components only where not supplied in the kit. Never replace the collar with raw steel or raw intumescent compound."
      source_ids:
        - hilti-wl2078-2018
    - rule_id: b_services
      applies_to: "collar_install"
      rule: "Include actual energy, cleaning supplies and bounded supplier-owned drilling/extraction/access services. The same drill, extractor, charger and access service may serve collar_install across initial and corrective visits and other jobs; enumerate the service periods and all consumers in cp_resources. The provider owns equipment production/maintenance allocation within the documented service. Record separately purchased energy or delivery only outside that coverage."
      source_ids: []
    - rule_id: b_exits
      applies_to: "collar_install"
      rule: "Record each physical packaging, dust, damaged part and cleaning-residue exit at its actual receiving gate; document the owner of later transport/treatment. A material is a usable return only with confirmed reusable condition and recipient/stock custody, otherwise classify the actual waste route."
      source_ids: []
