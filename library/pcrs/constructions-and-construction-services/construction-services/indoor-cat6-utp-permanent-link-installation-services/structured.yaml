  reference_amount: "1"
  product_flow_ref:
    name: "Accepted indoor Cat 6 UTP permanent link at installer handover"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "Link identifier and end ports"
    - "actual cable manufacturer/model"
    - "four-pair solid-copper construction"
    - "jacket/fire rating and installed physical length including retained slack"
    - "exact jack models and pair pattern"
    - "carrier/pathway readiness and ownership"
    - "installation date"
    - "test standard and edition"
