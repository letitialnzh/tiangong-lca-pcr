    - unit_id: "normative_35246"
      family: "validation"
      span:
        start:
          offset: 35246
          line: 331
          column: 1
        end:
          offset: 37292
          line: 341
          column: 1
      markdown: "## 9. Validation Rules\n\n| rule_id | Rule | source_ids |\n| --- | --- | --- |\n| link_gate | Require declared endpoints/configuration, accessible existing pathway/carriers, correct matched cable/jacks and original permanent-link test result for every actual accepted link. Record selected standard edition/limit set, velocity setting, adapter and certifier calibration. Retain failures and retests; channel or continuity-only tests cannot establish this gate. | fluke-permanent-link-testing |\n| reference_integrity | Final output, reference name and accepted_link association must denote the same complete service and Number of items / item basis. D is independently observed; incomplete or rejected links do not enter D. Group or split materially different lengths/configurations with explicit equivalence evidence; never equate all counted links by count alone. |  |\n| custody_and_sources | Expand conditional cards into each actual SKU/material/state/receiver exchange, with its own verified concrete identity and net quantity. Check supplier delivery/packaging inclusions, stock/returns/waste and replacement events. Zero requires affirmative no-activity evidence; an unaccounted residual is a gap. A source about termination does not prove resource life, emission factor or waste range. |  |\n| resource_closure | Reconcile every owned resource, purchased provider, consuming job/node, reporting/use period and replacement/retirement event. Require positive causal-activity totals, complete shares and no duplicate capital or energy. Unknown future use or Duration/Energy support blocks final exchange binding. |  |\n| identity_and_range | Verify selected concrete flow detail and property-to-unit-group reference chain before downstream exchange creation. Preserve material/jacket, gate, direction and destination; no name-only or NCV substitution. Range evidence must match actual configuration and normalization denominator. Checker success verifies declared relationships, not physical values, UUID resolution or publication readiness. |  |\n\n"
