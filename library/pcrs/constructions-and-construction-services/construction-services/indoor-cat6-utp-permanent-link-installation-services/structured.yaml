allocation_rules:
  - rule_id: failed_work
    applies_to: "foreground_burden_allocation"
    rule: "Retain failed tests, discarded ends and corrective labour/resources with the original link job; no burden transfer to a hypothetical good link, avoided-production credit or intended co-product from returns. Recovery or waste treatment starts at the declared actual receiver and must not be counted twice."
    source_ids: []
  - rule_id: resource_share
    applies_to: "foreground_burden_allocation"
    rule: "For each resource r use recorded causal physical activity A_rj and a_rj = A_rj / sum_k(A_rk) across every benefiting job k in the same resource-life packet. Use one documented activity basis and positive total; shares sum to 1 across the complete packet. Attribute B_r * a_rj / D lifecycle burden and a_rj / D item of the exact owned asset. Missing lifetime, remaining use or other consumers is an evidence gap, not a default lifetime or equal link-count split."
    source_ids: []
  - rule_id: period_closure
    applies_to: "foreground_burden_allocation"
    rule: "Index original manufacture/acquisition, each use period, calibration/repair, replacement and retirement separately. Link all input, output, asset and defect events to job and period. Document each period-specific decision and reconcile packet totals once; a replacement event is not an automatic new whole certifier per link."
    source_ids: []
  - rule_id: purchased_service
    applies_to: "foreground_burden_allocation"
    rule: "Record actual purchased test/access/support events with their contractual reference and inclusion schedule. Reconcile provider-owned capital and embedded fuel, delivery and electricity before adding any separate foreground consumption. A provider test event and the same internally performed test cannot both own the same burden."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "install_certify"
      flow_role: "Accepted link and test evidence"
      record_type: "installation acceptance record"
      raw_fields: "job/link/end-port IDs; configuration and physical cable length; actual D; standard edition/limits; NVP; certifier/adapter serial/calibration; original pass/fail files; repairs/retests; acceptance date/signature"
      collection_method: "Independently count unique fully accepted links from signed records; reconcile each to original permanent-link test files, selected limits and complete defect closure. A simple continuity check or channel test is not the selected acceptance test."
      unit: "item"
      frequency: "Every link and every original/corrective test"
      temporal_coverage: "Receipt through signed acceptance with original reporting dates"
      site_scope: "One declared indoor job and disclosed same-configuration group"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed as-built/end-port map, complete native results including failed attempts, selected test setup and calibration evidence; Aggregation detail: Independent accepted D; per reference flow"
    - protocol_id: cp_materials
      process_id: "install_certify"
      flow_role: "Supply and installation inputs"
      record_type: "SKU custody and measurement record"
      raw_fields: "shipment/job/SKU; manufacturer/model/material; net mass; delivered and used lengths/counts; exact-SKU conversion; installed slack; opening/closing stock; bundled parts; upstream delivery/packaging inclusion"
      collection_method: "Weigh separately by matching SKU or use traceable same-SKU net-mass-per-length/item evidence. Reconcile the actual cable reel and both terminations with installed length, retained ends, waste and stock; do not substitute electrical test length for measured consumption."
      unit: "kg"
      frequency: "Every shipment, issue and stock event"
      temporal_coverage: "All materials attributable to receipt-to-acceptance job"
      site_scope: "Exact installation job and supplying records"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scale or matching conversion evidence; supplier inclusion schedule; event-level stock closure; Aggregation detail: Actual attributable supplied net mass; per reference flow"
    - protocol_id: cp_energy
      process_id: "install_certify"
      flow_role: "External electricity"
      record_type: "meter and charger record"
      raw_fields: "meter start/end kWh; date; provider/voltage; exact charger/tester; activities for all shared users; embedded service energy; corrections/retests"
      collection_method: "Measure attributable electricity at declared external supply boundary, including charging for this job. Reconcile shared consumer activities and service inclusions; missing metering remains a gap, not zero or battery capacity."
      unit: "kWh"
      frequency: "Every relevant charging/test interval"
      temporal_coverage: "Actual pre-acceptance intervals, retaining original dates"
      site_scope: "Declared job plus all sharing consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter trace/calibration and complete shared-use allocation/inclusion ledger; Aggregation detail: Actual attributable external electricity; per reference flow"
    - protocol_id: cp_resources
      process_id: "install_certify"
      flow_role: "Owned resources and purchased support"
      record_type: "resource-life and contract event ledger"
      raw_fields: "asset/model/serial/owner; acquisition/use/maintenance/replacement/retirement dates; complete lifecycle packet B_r; every consuming job/node/period; physical activity A_rj; future-use gap; contract event/reference/inclusions"
      collection_method: "Link exact reusable tools, certifier, adapters and chargers to all actual consumers and lifecycle periods. Record causal activity and actual complete purchased service events separately; verify provider asset ownership and energy inclusions. Do not assume lifespan."
      unit: "item"
      frequency: "Every resource period and contract event"
      temporal_coverage: "Full resource packet and original job periods; disclose unknown remaining use"
      site_scope: "All consuming jobs/nodes, including those outside the reported site"
      aggregation_rule: "per reference flow"
      quality_evidence: "Ownership, serial, activity and inclusion records; complete consumer/period/share closure with gaps explicit; Aggregation detail: Attributable exact asset fraction or genuine whole service events; per reference flow"
    - protocol_id: cp_releases
      process_id: "install_certify"
      flow_role: "Usable returns and waste"
      record_type: "exit and receiver ticket"
      raw_fields: "original job/issue/defect ID; material/SKU; actual mass and state; reusable versus waste classification; receiver and date; authorised treatment boundary; retained/captured/emitted distinction; closure residual"
      collection_method: "Weigh each actual unchanged usable return separately from each actual waste material/state/receiver stream. Link rejected terminations and cable ends to original in-node correction events. Investigate residual mass; do not label it an air emission or zero."
      unit: "kg"
      frequency: "Every return, rejection and disposal event"
      temporal_coverage: "All original installation and corrective exits through handover"
      site_scope: "Declared job and each actual receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable original-issue/defect link, weighing, custody and receiver evidence; Aggregation detail: Actual attributable usable-return or waste net mass; per reference flow"
  calculation_rules:
    - id: normalize_job
      applies_to: "all inventory rows"
      rule: "q_i = attributable collected numerator_i / D; D is the independently accepted same-configuration link count from cp_acceptance. Keep every numerator measured independently, including failed work."
      inputs:
        - numerator_i
        - D
        - cp_acceptance
      output: "q_i"
      source_ids: []
    - id: owned_resource_share
      applies_to: "owned_tools_and_certifier"
      rule: "a_rj = A_rj / sum_k(A_rk); sum over all jobs k in the same complete resource-life packet. Attributed asset = a_rj / D item; burden = B_r * a_rj / D. Preserve each period-specific ownership decision."
      inputs:
        - A_rj
        - A_rk
        - B_r
        - D
        - cp_resources
      output: "attributed asset quantity and lifecycle burden"
      source_ids: []
    - id: material_closure
      applies_to: "copper_data_cable, cat6_utp_jacks, permanent_accessories, incoming_packaging, usable_material_returns, installation_waste"
      rule: "opening stock + receipts = retained installed material + closing stock + usable returns + actual waste + identified releases + unexplained residual, checked per matching material/SKU and job. Report measured tolerance and unresolved residual separately; unlike masses are diagnostics only."
      inputs:
        - cp_materials
        - cp_releases
      output: "SKU custody closure and residual"
      source_ids: []
  data_quality_requirements:
    - id: range_copper_data_cable
      applies_to: "copper_data_cable"
      requirement: "Range evidence need: Exact-SKU net mass per physical length, actual issued/installed/stock/waste lengths and like-configuration link lengths; no universal kg per link."
      evidence: "Actual matching configuration/measurement records; absence remains explicit gap, not default quantity"
    - id: range_cat6_utp_jacks
      applies_to: "cat6_utp_jacks"
      requirement: "Range evidence need: Matching model assembly mass, actual issued/replaced/returned quantities and documented bundled parts; packaging mass is separate."
      evidence: "Actual matching configuration/measurement records; absence remains explicit gap, not default quantity"
    - id: range_permanent_accessories
      applies_to: "permanent_accessories"
      requirement: "Range evidence need: Actual retained SKU schedule and supply/return/waste counts with matching net masses."
      evidence: "Actual matching configuration/measurement records; absence remains explicit gap, not default quantity"
    - id: range_incoming_packaging
      applies_to: "incoming_packaging"
      requirement: "Range evidence need: Matching shipment material mass, reuse/custody history and upstream inclusion evidence."
      evidence: "Actual matching configuration/measurement records; absence remains explicit gap, not default quantity"
    - id: range_owned_tools_and_certifier
      applies_to: "owned_tools_and_certifier"
      requirement: "Range evidence need: Complete resource-life packet, causal use across all jobs/periods, replacements and remaining-use evidence; no generic lifespan."
      evidence: "Actual matching configuration/measurement records; absence remains explicit gap, not default quantity"
    - id: range_installation_electricity
      applies_to: "installation_electricity"
      requirement: "Range evidence need: Metered job and charger/test evidence, complete sharing denominator and exact supply; Energy support still needs verification."
      evidence: "Actual matching configuration/measurement records; absence remains explicit gap, not default quantity"
    - id: range_contracted_support
      applies_to: "contracted_support"
      requirement: "Range evidence need: Original contract event reference, scope/inclusions, quantities and shared activity; hourly hire needs Duration support."
      evidence: "Actual matching configuration/measurement records; absence remains explicit gap, not default quantity"
    - id: range_usable_material_returns
      applies_to: "usable_material_returns"
      requirement: "Range evidence need: Matching return tickets, original issue/stock linkage, retained usability and net mass."
      evidence: "Actual matching configuration/measurement records; absence remains explicit gap, not default quantity"
    - id: range_installation_waste
      applies_to: "installation_waste"
      requirement: "Range evidence need: Original cut/defect/packaging events, material-state separation, actual tickets/net masses and treatment boundary."
      evidence: "Actual matching configuration/measurement records; absence remains explicit gap, not default quantity"
    - id: range_accepted_link
      applies_to: "accepted_link"
      requirement: "Range evidence need: Definition requires independently observed D and actual matched configuration/test acceptance; it is not an assumed yield or numerical quantity prior."
      evidence: "Actual matching configuration/measurement records; absence remains explicit gap, not default quantity"
    - id: configuration_group
      applies_to: "all inventory rows"
      requirement: "Keep job/site/time and physical length, cable/jack configuration and acceptance scope aligned; split materially unlike groups unless actual equivalence is demonstrated"
      evidence: "As-built, matched BOM, original test and all raw numerator/D records"
    - id: support_chain
      applies_to: "all inventory rows"
      requirement: "Keep Energy and actual hourly Duration support gaps distinct from verified Mass/kg and count/item; never use a near-match UUID"
      evidence: "Concrete detail and exact property/unit reference chain"
validation_rules:
  - rule_id: link_gate
    applies_to: "foreground_dataset_conformance"
    rule: "Require declared endpoints/configuration, accessible existing pathway/carriers, correct matched cable/jacks and original permanent-link test result for every actual accepted link. Record selected standard edition/limit set, velocity setting, adapter and certifier calibration. Retain failures and retests; channel or continuity-only tests cannot establish this gate."
    source_ids:
      - fluke-permanent-link-testing
  - rule_id: reference_integrity
    applies_to: "foreground_dataset_conformance"
    rule: "Final output, reference name and accepted_link association must denote the same complete service and Number of items / item basis. D is independently observed; incomplete or rejected links do not enter D. Group or split materially different lengths/configurations with explicit equivalence evidence; never equate all counted links by count alone."
    source_ids: []
  - rule_id: custody_and_sources
    applies_to: "foreground_dataset_conformance"
    rule: "Expand conditional cards into each actual SKU/material/state/receiver exchange, with its own verified concrete identity and net quantity. Check supplier delivery/packaging inclusions, stock/returns/waste and replacement events. Zero requires affirmative no-activity evidence; an unaccounted residual is a gap. A source about termination does not prove resource life, emission factor or waste range."
    source_ids: []
  - rule_id: resource_closure
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile every owned resource, purchased provider, consuming job/node, reporting/use period and replacement/retirement event. Require positive causal-activity totals, complete shares and no duplicate capital or energy. Unknown future use or Duration/Energy support blocks final exchange binding."
    source_ids: []
  - rule_id: identity_and_range
    applies_to: "foreground_dataset_conformance"
    rule: "Verify selected concrete flow detail and property-to-unit-group reference chain before downstream exchange creation. Preserve material/jacket, gate, direction and destination; no name-only or NCV substitution. Range evidence must match actual configuration and normalization denominator. Checker success verifies declared relationships, not physical values, UUID resolution or publication readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground installation data package"
  downstream_use: "process and lifecyclemodel projections; secondary_dataset or background_dataset only with compatible boundary"
  allowed_use: "Same disclosed fixed indoor Cat 6 UTP solid-copper, two-tool-free-jack permanent-link installation, physical length/configuration and acceptance gate"
  excluded_use: "Exclude new trays, ducts, penetrations, racks, panel/outlet carriers and building works; old-link removal; shielded, fibre, coaxial, outdoor or inter-building routes; splices, consolidation points and plug-terminated MPTL; equipment/patch cords; active devices, network configuration, PoE load testing and operation. A separately purchased pathway or carrier construction service is an upstream interface, not a hidden installation input. Work needing chemical pulling aids, drilling or different termination technology requires a reviewed scope change."
  required_metadata: "Link identifier and end ports; actual cable manufacturer/model, four-pair solid-copper construction, jacket/fire rating and installed physical length including retained slack; exact jack models and pair pattern; carrier/pathway readiness and ownership; installation date; test standard and edition, permanent-link limit set, cable velocity setting, certifier/adapter identities and calibration; complete original results, repairs, retests and signed acceptance."
  required_quality_disclosure: "Actual numerator/D records; all method/source and matching-SKU conversion evidence; complete owned/provider resource and period packets; supply inclusion and custody closure; identity/support, quantity/Range and remaining-life gaps"
  update_trigger: "Changed cable/jack configuration, path or interface responsibility, termination/test limit set, contract/service ownership, stronger quantity/resource or identity evidence"
