    - "retests and signed acceptance."
reference_flows:
  []
measurement_rules:
  - id: count_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Use cp_acceptance to count D actual unique accepted complete links of the same disclosed configuration. D must be positive. A cable metre, connector, test run or passed pair is not a link. The output amount is 1 item; there is no service-mass conversion."
  - id: material_mass
    applies_to: "copper_data_cable, cat6_utp_jacks, permanent_accessories, incoming_packaging, usable_material_returns, installation_waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "cp_materials records input net mass; cp_releases records returned product and waste net mass. Use calibrated weighing or traceable exact-SKU count/length-to-net-mass evidence. Installed cable length includes retained slack and termination insertion; electrical test length is not automatically physical consumed length. Do not use gross shipping mass or sum unlike materials into one exchange."
  - id: electricity_basis
    applies_to: "installation_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Record actual external charger/test/tool electricity under cp_energy, including corrections and retests before acceptance. Preserve provider, voltage and meter boundary. Battery Ah, tester run-time and net calorific value are not electricity. A kWh unit-group row alone does not verify an Energy property."
  - id: resource_basis
    applies_to: "owned_tools_and_certifier, contracted_support"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "cp_resources distinguishes a lifecycle fraction of an exact owned asset from a real complete purchased service event. Genuine hourly hire requires compatible Duration support and a separately reviewed exchange; do not rename hours to item. Test adapters and reusable leads are tool assets, not installed patch cords."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: install_certify
    name: "Install and certify permanent link"
    inclusion: "required"
    inclusion_condition: "All in-scope first installations"
    role: "Independent integration: cable, two jack assemblies and permanent accessories; actual dry manual placement, termination, labels, rejected-state correction and test/handover responsibility"
    quantitative_reference: "One accepted complete same-configuration link; actual positive D"
process_inventory:
  - id: install_certify
    label: "Install and certify permanent link"
    inputs:
