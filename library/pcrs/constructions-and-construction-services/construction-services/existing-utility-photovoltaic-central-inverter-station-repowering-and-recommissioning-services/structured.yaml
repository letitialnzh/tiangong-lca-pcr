boundary_abstraction:
  declared_starting_condition: "Identified existing qualified ground-PV station with retained arrays/foundation/MVT/grid interface, old inverter and approved work plan."
  starting_condition_role: "Existing host state interface, not a new manufacture purchase."
  product_classification_scope: "CPC 3.0 54262; narrower"
  recursive_input_rule: "Do not purchase this same completed station service as its own input. A genuine bounded subcontract identifies actual scope/native activity and upstream coverage, with one owner and no duplication of the foreground work."
  upstream_dataset_requirement: "Actual new equipment/supplies, utilities, provider service, transport, asset life share and treatment require compatible upstream datasets and explicit coverage; retained host manufacture is excluded."
  disclosure: "Actual retained/replaced register, prior condition, qualified compatibility, local/OEM gates, N, all phases/periods, provider/resource owner, old-equipment fate and remaining data gaps."
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted existing utility PV central-inverter station repowering and recommissioning service"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "station/site ID"
    - "ground-mounted utility route"
    - "actual DC/AC ratings"
    - "conversion topology"
    - "retained/replaced BOM"
    - "retained MVT/array/foundation compatibility"
    - "approved local/OEM method"
    - "firmware/protection/SCADA/grid-control state"
    - "campaign/phase/period"
    - "complete tests/defect closure"
    - "signature/date"
    - "no MWp/kWh equivalence"
reference_flows:
  []
measurement_rules:
  - id: count_reference
    applies_to: "accepted_station_service"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "N>0 is the unique fully accepted station count, not inverter pieces, stack count, test attempts, capacity or kWh. Preserve actual numerator native units / N."
  - id: native_measurement
    applies_to: "Actual supplied components, exits and providers"
    required_property_ref:
      name: "Actual compatible native property"
      uuid: ""
    required_unit: "Actual verified native unit"
    rule: "Preserve Count/Length/Mass supply and usable-return native ledgers. An independently needed mass or water/fuel volume conversion requires matching actual specification, density/state/temperature/unit/source; Count is not a fallback for Energy, time or provider coverage."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: station_integration
    name: "Existing station replacement and recommissioning"
    inclusion: "required"
    inclusion_condition: "Actual qualified retained MVT/array/foundation central-inverter route"
    role: "Independent integration/handover responsibility with internal removal, install and commissioning phases"
    quantitative_reference: "1 item accepted_station_service"
process_inventory:
  - id: station_integration
    label: "Existing station replacement and recommissioning"
    inputs:
      product:
        - row_id: replacement_central_inverter
          role: "Replacement finished central inverter package"
          name: "Actual finished utility PV central inverter package at delivery"
          flow_type: "product"
          property_unit: "Count / item"
          description: "Identify OEM, exact model, serials, DC/AC ratings, conversion topology and package content. Count the delivered finished native unit only when that is its verified supply basis. Its factory electronics, integrated cooling and protection are included upstream; do not purchase the same BOM again. Range evidence need: Obtain actual approved package quantity and content by station; no universal inverter pieces per station or capacity equivalence."
          amount:
            expression: "Attributable actual native supplied package quantity under the declared gross-with-outlets or matched-usable-return-once convention / N."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_supply
              source_ids: []
            ranges: []
        - row_id: water_supply
          role: "Incremental supplied cleaning and test water"
          name: "Actual supplied water for cleaning, containment and testing"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Include all actual direct and provider-paid water; distinguish purchase, on-site recycled circulation, captured wastewater and actual release. Convert measured volume only with matching density, state, temperature, units and source. This does not prescribe water cooling. Range evidence need: Collect actual cleaning/test method and calibrated meter or delivery records; the route has no universal water demand."
          amount:
            expression: "Attributable supplied water mass / N."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_utilities
              source_ids: []
            ranges: []
        - row_id: electricity_import
          role: "External electricity imported during the job"
          name: "Actual grid or supplied electricity imported for station work and commissioning"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Meter import separately for isolation, installation auxiliaries, configuration, tests, repeated tests and provider equipment. Keep source, voltage and time interval. Standalone electrical Energy support and concrete exchange must be independently verified; calorific value is not a substitute. Range evidence need: Use actual time-resolved submeter or evidenced shared-meter attribution; no literature kWh-per-station default."
          amount:
            expression: "Attributable externally imported electricity / N."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_utilities
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_station_service
          role: "Accepted existing utility PV central-inverter station repowering and recommissioning service"
          name: "Accepted existing utility PV central-inverter station repowering and recommissioning service"
          flow_type: "product"
          property_unit: "Count / item"
          description: "Count a unique identified station only after approved retained-array/MVT/foundation compatibility, completed mechanical/electrical/protection/earthing/SCADA/grid-control tests, defect closure, required report and signed operator re-entry acceptance. N is the positive number of such station IDs in the job campaign, counted once. Range evidence need: Exact 1 is reference normalization, not empirical yield. Collect N and all required signed gates; failed attempts never increase N."
          amount:
            expression: "1 item"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_acceptance
              source_ids: []
            ranges: []
        - row_id: test_electricity_export
          role: "Metered external test electricity export"
          name: "Actual metered commissioning electricity exported at approved interface"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Record source, interval and interface independently from imported electricity and pre-existing array generation. This is an actual incidental measured exit, not future generation or a co-product target. Default construction burden receives no netting or avoided-grid credit; any separately authorized consequential model must be disclosed outside this attributional dataset. Range evidence need: Require actual export meter and causal job allocation; no assumed yield uplift or export equal to imports."
          amount:
            expression: "Actual externally exported commissioning electricity / N."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_utilities
              source_ids: []
            ranges: []
      waste:
        - row_id: contained_wastewater
          role: "Captured cleaning and test wastewater"
          name: "Actual contained wastewater dispatched to authorized treatment"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Track tank/batch, water source, contaminants, recovery and treatment receiver; contained liquid is not an elementary discharge. Include actual upstream treatment service once; upstream water stays owned even when captured. Range evidence need: Use actual weighed or state-compatible volume/density records and receiver evidence; no assumed wastewater ratio."
          amount:
            expression: "Actual outward contained wastewater mass / N."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_exits
              source_ids: []
            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: supply_convention
    applies_to: "New supply stocks and outlets"
    rule: "For each actual SKU and native unit let S = opening attributable stock + external net-tare gross receipts - closing carried stock. Internal issues are not receipts. Declare gross-with-outlets: upstream burden follows S and usable outward returns remain separate physical exits; or consumed-only: upstream burden follows S minus matched outward usable returns once. Never also give a return credit. All installed/used, nonreturned waste and uncontained loss retain supply burden; final installed retention excludes waste, return and release."
    source_ids: []
  - rule_id: historical_exit
    applies_to: "Removed historical equipment"
    rule: "Partition old serials and any independently measured mass into documented reusable equipment or actual electronic waste and temporary retained pending status. No serial is both reusable output and WEEE. Reuse is not a new intended co-product of this service and receives no arbitrary displacement credit. Missing final fate remains a quality gap; it is never a negative new-input quantity."
    source_ids: []
  - rule_id: repeat_mode
    applies_to: "Campaign and rework treatment"
    rule: "This is finite job/campaign production. Failed tests, rejected installations, cleaning, setup, mobilisation, changeover, repeated configuration and remedial removal stay in the actual station/campaign numerator. Link each rework loop or usable return/waste exit to its originating integration event. Count a station once only after complete acceptance; no planned MW, inverter stacks, attempts or partly repaired stations augment N. Shared campaign resources use an actual causal measured driver with a disclosed all-consumer denominator and one owner."
    source_ids: []
  - rule_id: asset_attribution
    applies_to: "Shared assets over full life"
    rule: "For each actual lifting unit, tool, test load or grid emulator, whole-life burden includes manufacture + maintenance + replacements + end-of-life. Allocate by actual job driver / compatible whole-life driver across ALL jobs, nodes and periods, including outside this campaign. Supply complete observed life or observed history plus evidenced remaining use, replacement, termination and end-of-life with uncertainty, sensitivity and update trigger. Missing coverage/denominator blocks final data; rental or provider inclusion must be reconciled before adding direct asset burdens."
    source_ids: []
  - rule_id: electricity_separation
    applies_to: "Commissioning electricity"
    rule: "Keep external import, external test export, retained-array electricity entering tests, internal circulation, dissipated test load and losses in distinct interval-consistent physical ledgers. Internal circulation is audit activity, never another purchased flow; supplied test-load equipment/resources are owned. Do not net export against import or forecast generation; no automatic negative construction burden or avoided-grid credit. No generic renewable-electricity co-product allocation is asserted."
    source_ids: []
  - rule_id: fuel_species_views
    applies_to: "Physical and species ledgers"
    rule: "Fuel closing usable stock, outward usable return, nonburned waste, uncontained loss and burned activity are disjoint. Total spill is audit-only; recovered spill in usable closing stock is already closing. Whole product/fuel physical balances and species-to-medium elementary exchanges are nonadditive views. Derive species only from actual measurement or applicable activity-factor/composition-fate evidence, excluding captured stock/returns/waste/treatment once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "station_integration"
      flow_role: "Reference and compatibility gate"
      record_type: "station_register"
      raw_fields: "job_id; station_id; site_id; asset_id; campaign_id; batch_id; event_id; phase; period; station_serial; retained_array_id; retained_mvt_id; retained_foundation_id; dc_ac_ratings; topology; mechanical_interface; earthing_protection; firmware_control_scada; approved_method; isolation_record; test_result; defect_closure; report_id; acceptance_signature; acceptance_date; N"
      collection_method: "Join competent approved design and actual isolation/installation/test/re-entry records. Verify actual MVT compatibility; a marketing majority is insufficient. Deduplicate final station IDs and exclude failed or incomplete gates. Aggregation: N = positive unique fully accepted station IDs; reference output 1 item; other attributable amounts / N, per reference flow."
      unit: "item"
      frequency: "Each station, every test/retest and signed acceptance"
      temporal_coverage: "Actual job start through signed acceptance, all phases and reporting periods"
      site_scope: "Actual station and retained interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "Qualified design, serial register, complete functional report and signatures"
    - protocol_id: cp_supply
      process_id: "station_integration"
      flow_role: "New components and mass supplies"
      record_type: "sku_stock"
      raw_fields: "job_id; station_id; site_id; asset_id; campaign_id; batch_id; event_id; phase; period; sku_id; serial_or_reel; specification; package_bom_coverage; native_quantity; native_unit; opening_stock; gross_receipts; tare; internal_issue; closing_stock; installed_retained; usable_outward_return; waste_exit; uncontained_loss; convention; supplier_record"
      collection_method: "Reconcile actual SKU delivery/stock/install/return records in compatible native units. Pair package coverage and component purchase exclusions. Stock final retention, physical activities and exits are separate; source any independent mass view. Aggregation: calc_supply attributable native supply / N, per reference flow; retain separate SKU ledgers."
      unit: "actual native unit"
      frequency: "Each receipt, stock close, installation and exit"
      temporal_coverage: "All job phases and carry-in/out reporting periods"
      site_scope: "Actual direct and provider supplies"
      aggregation_rule: "per reference flow"
      quality_evidence: "Invoices, tare, BOM, installation and return matched records"
    - protocol_id: cp_utilities
      process_id: "station_integration"
      flow_role: "Actual utility and test energy ledgers"
      record_type: "meter_ledger"
      raw_fields: "job_id; station_id; site_id; asset_id; campaign_id; batch_id; event_id; phase; period; resource_id; source_id; meter_id; interval_start; interval_end; imported_quantity; exported_quantity; retained_array_test_generation; internal_circulation; dumped_load; losses; water_quantity; quantity_unit; density; density_unit; material_state; temperature; conversion_source; shared_driver; shared_total; owner; temperature_unit"
      collection_method: "Read calibrated interval meters or documented actual causal shares; separate grid imports, exports, retained generation, circulation and dissipated test load. For actual water volume-to-mass retain same-state density/temperature/unit/source. Verify actual Energy support before final exchange generation. Aggregation: Each attributable utility input or actual export / N, per reference flow; internal circulation and dumped load are audit-only physical states."
      unit: "kWh; kg"
      frequency: "Every actual utility interval and test/retest event"
      temporal_coverage: "Complete job and provider periods, no later operation"
      site_scope: "Identified station and attributable shared meters"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, interval balance, owner and conversion evidence"
    - protocol_id: cp_fuel
      process_id: "station_integration"
      flow_role: "Supplied fuel and combustion activity"
      record_type: "fuel_balance"
      raw_fields: "job_id; station_id; site_id; asset_id; campaign_id; batch_id; event_id; phase; period; fuel_sku; equipment_id; opening_usable; gross_receipts; tare; closing_usable; outward_usable_return; burned_activity; nonburned_waste; uncontained_loss; total_spill_audit; recovered_spill_closing; quantity; unit; density; density_unit; material_state; temperature; conversion_source; convention; owner; measured_volume; volume_unit; burned_measurement_method; balance_audit; uncertainty; unknown_loss; temperature_unit"
      collection_method: "Measure compatible mass or volume with actual specification-specific density/state/temperature/source. Reconcile disjoint stock, return, burn, waste and loss with equipment logs; retain nonburned waste/loss upstream burden. Require measured burn or audited complete-fate balance and uncertainty; unresolved loss never becomes burned activity. Aggregation: Attributable upstream supplied fuel / N, per reference flow; burned activity retained independently for calc_species."
      unit: "kg"
      frequency: "Every fuel receipt, use and closing or loss/return event"
      temporal_coverage: "All job and attributable provider phases/periods"
      site_scope: "Each actual fuel owner/equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Fuel tickets, tank readings, equipment logs and mass-balance closure"
    - protocol_id: cp_services
      process_id: "station_integration"
      flow_role: "Providers, treatment and freight"
      record_type: "provider_shipment"
      raw_fields: "job_id; station_id; site_id; asset_id; campaign_id; batch_id; event_id; phase; period; provider_id; contract_id; scope; completed_result; native_quantity; native_unit; upstream_resources; coverage_matrix; shipment_id; transport_mode; payload_mass; payload_unit; distance; distance_unit; empty_return; shared_load_driver; shared_total; receiver; treatment_record; owner"
      collection_method: "Match actual completed service and resource statement to contract, actual cargo legs and waste receiver. Require native-unit compatibility and upstream boundaries, identify resources direct versus included provider exactly once. Aggregation: Actual attributable provider native activity or kg*km / N, per reference flow; no price-to-Count conversion."
      unit: "actual native unit; kg*km"
      frequency: "Each bounded service, shipment, treatment batch and invoice coverage close"
      temporal_coverage: "Complete job and actual upstream service periods"
      site_scope: "Actual providers/routes/receivers serving this station"
      aggregation_rule: "per reference flow"
      quality_evidence: "Contract, completed test, resource statement, waybill and receiver ticket"
    - protocol_id: cp_assets
      process_id: "station_integration"
      flow_role: "Whole-life shared asset attribution"
      record_type: "asset_life"
      raw_fields: "job_id; station_id; site_id; asset_id; campaign_id; batch_id; event_id; phase; period; asset_identity; consuming_jobs_nodes; manufacture; maintenance; replacements; termination; end_of_life; observed_history; observed_driver; evidenced_remainder; remainder_driver; whole_life_driver; job_driver; driver_unit; coverage; uncertainty; sensitivity; update_trigger; provider_inclusion; owner; selected_native_view; native_unit; remainder_source; replacement_source; termination_source; eol_source; last_update; next_update"
      collection_method: "Enumerate all consumers and periods. Obtain full observed life or observed history plus evidenced remainder/replacements/termination/EOL. Require identical compatible driver definition in job numerator and all-life denominator and reconcile provider/rental inclusion. Aggregation: Select exactly one verified view. Asset-equivalent quantity per reference flow = (actual job driver / whole-life driver) / N; lifecycle-complete native service-driver quantity per reference flow = actual job native service-driver quantity / N. Match the corresponding lifecycle-complete upstream unit burden once. No missing denominator; no mixture of views."
      unit: "actual compatible native service driver"
      frequency: "Each asset use, maintenance/replacement and evidence update"
      temporal_coverage: "Whole life across all jobs and periods, plus job phase share"
      site_scope: "All users of each actual shared lifting/test/tool asset"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset history, evidenced future service, replacements/EOL, uncertainty and sensitivity"
    - protocol_id: cp_exits
      process_id: "station_integration"
      flow_role: "Physical returns, removed equipment and wastes"
      record_type: "exit_manifest"
      raw_fields: "job_id; station_id; site_id; asset_id; campaign_id; batch_id; event_id; phase; period; exit_id; supply_or_old_asset_id; sku_or_serial; quantity; unit; net_tare; measured_mass; measured_length; material_state; density; density_unit; temperature; conversion_source; usable_condition; waste_class; temporary_stock; receiver; destination; treatment_coverage; transfer_pair; owner; temperature_unit"
      collection_method: "Match actual old serial or new supply SKU to measured native exit and qualified reuse/waste/return status; separate temporary retained stock. Use mass only when actually independently required and measured. Match receiver/treatment and prevent duplicate reusable versus waste outputs. Aggregation: Each actual outward native quantity / N, per reference flow; no negative new inputs or double return credits."
      unit: "item; m; kg"
      frequency: "Every outward exit, interim stock close and receiver confirmation"
      temporal_coverage: "Actual removal through final receiver confirmation, including carried periods"
      site_scope: "Old equipment and new supply exits of this station"
      aggregation_rule: "per reference flow"
      quality_evidence: "Serial/SKU register, weighing, condition and authorized receiver documents"
    - protocol_id: cp_releases
      process_id: "station_integration"
      flow_role: "Species and receiving-medium evidence"
      record_type: "release_event"
      raw_fields: "job_id; station_id; site_id; asset_id; campaign_id; batch_id; event_id; phase; period; event_type; resource_owner; product_sku; fuel_equipment; species; receiving_medium; measured_release; activity; activity_unit; factor; factor_unit; factor_applicability; composition; fate_fraction; captured_stock; outward_return; captured_waste; treatment; release_quantity; quantity_unit; uncertainty; absence_evidence; factor_source; composition_basis; composition_source; fate_basis; fate_source; physical_release_unit; complete_factor_coverage"
      collection_method: "Use actual measured species release or valid burned-activity factor/composition-fate chain with actual medium. Separate routine and incident events and physical whole-product audit; remove captured/returned/waste/treatment once. Safety concentrations or SDS alone are insufficient. Aggregation: Actual species-to-medium release mass / N, per reference flow; nonadditive to physical product/fuel ledger."
      unit: "kg"
      frequency: "Every actual routine interval or incident; each actual species/medium"
      temporal_coverage: "All job and attributable provider phases/periods"
      site_scope: "Actual release location and receiver medium"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated measurement or applicable factor/composition-fate evidence and incident log"
  calculation_rules:
    - id: calc_direct
      applies_to: "replacement_central_inverter,interface_parts_count,interface_cable_length,installation_mass_supplies,water_supply,fuel_supply,electricity_import,freight_service,specialist_service,shared_asset_service,removed_reusable_equipment,usable_count_returns,usable_length_returns,usable_mass_returns,test_electricity_export,removed_electronic_waste,new_supply_waste,contained_wastewater,nonburned_fuel_waste,direct_combustion_species,direct_incident_species,waste_treatment_service"
      rule: "For each actual native exchange, amount = attributable actual native quantity / N. N is the positive unique final accepted station count from cp_acceptance. Keep numerator units and disjoint roles; this is direct per-reference attribution, not a mass/capacity conversion."
      inputs:
        - "actual native quantity"
        - N
        - "relevant node-owned protocol"
      output: "native exchange per reference flow"
      source_ids: []
    - id: calc_supply
      applies_to: "replacement_central_inverter,interface_parts_count,interface_cable_length,installation_mass_supplies,fuel_supply,usable_count_returns,usable_length_returns,usable_mass_returns"
      rule: "S = opening attributable stock + external net-tare gross receipts - closing carried stock; gross-with-outlets uses S upstream and separate physical usable returns, consumed-only uses S minus matched outward usable returns once. Internal issue is not receipt. Nonreturned waste/loss stays upstream; no extra return credit."
      inputs:
        - cp_supply
        - cp_fuel
        - cp_exits
        - "declared supply convention"
      output: "attributable native supply and separate physical exits"
      source_ids: []
    - id: calc_fuel
      applies_to: "fuel_supply,nonburned_fuel_waste"
      rule: "Burned activity = opening usable fuel + external net-tare receipts - closing usable fuel - outward usable return - nonburned waste - uncontained nonburned loss. Each outlet is disjoint; total spill is audit-only, recovered spill already in closing usable stock. Upstream supply follows calc_supply, not burned activity alone. Burned activity must be measured or supported by an audited complete-fate balance and stated uncertainty; unknown/unmeasured loss remains unresolved, never automatically combustion."
      inputs:
        - cp_fuel
        - cp_exits
        - "actual specification"
      output: "separate burned activity and fuel physical balance"
      source_ids: []
    - id: calc_electricity
      applies_to: "electricity_import,test_electricity_export"
      rule: "Record interval-consistent import, actual export, retained-array test generation, internal circulation, dumped load and losses separately. Assign actual job causal share once; internal circulation is nonadditive audit activity. Do not subtract exported or forecast generation from imported electricity or construction burden."
      inputs:
        - cp_utilities
        - "actual meter intervals and owner"
      output: "separate actual electrical ledgers"
      source_ids: []
    - id: calc_freight
      applies_to: "freight_service"
      rule: "Actual owned freight activity = sum of actual cargo mass in kg times actual leg distance in km with evidenced load and empty-return attribution. Include only legs not already covered upstream/provider. Divide attributable kg*km by N through calc_direct."
      inputs:
        - cp_services
        - "shipment payload"
        - "leg distance"
        - ownership
      output: "actual kg*km service"
      source_ids: []
    - id: calc_provider
      applies_to: "specialist_service,waste_treatment_service"
      rule: "Use completed actual provider native activity with matched scope, results and upstream resource coverage. Attribute actual job share once; price/hours do not convert to Count and treatment exits alone are not treatment service inventories."
      inputs:
        - cp_services
        - "actual provider and native support"
      output: "bounded native provider service"
      source_ids: []
    - id: calc_asset
      applies_to: "shared_asset_service"
      rule: "Choose exactly one verified actual upstream view. Asset-equivalent view: native quantity = actual job driver / whole-life driver and upstream burden per asset-equivalent = manufacture + maintenance + replacements + end-of-life. Lifecycle-complete service-per-driver view: native service quantity = actual job driver and upstream burden per native driver unit = full-life burden / whole-life driver. Both yield job burden = full-life burden times actual job driver / whole-life driver. Verify the actual native unit and coverage before selecting; never mix hours with dimensionless share. Use complete observed life or observed history plus sourced evidenced remainder/replacements/termination/EOL over ALL jobs/nodes/periods, with uncertainty, sensitivity and update. Divide the chosen native quantity by N exactly once."
      inputs:
        - cp_assets
        - "compatible all-life denominator"
        - "coverage matrix"
      output: "job-attributed whole-life asset burden"
      source_ids: []
    - id: calc_exit
      applies_to: "removed_reusable_equipment,usable_count_returns,usable_length_returns,usable_mass_returns,removed_electronic_waste,new_supply_waste,contained_wastewater,nonburned_fuel_waste"
      rule: "Assign actual outward quantity to one disjoint native exit role with serial/SKU, condition, class and receiver evidence. Closing carried stock is not outward exit. Old reusable equipment and old WEEE are mutually exclusive; new usable returns match calc_supply once. Count/length exits need no invented mass conversion; independently required waste mass needs actual same-specification evidence."
      inputs:
        - cp_exits
        - cp_supply
        - cp_fuel
        - receiver
      output: "actual disjoint outward physical quantities"
      source_ids: []
    - id: calc_species
      applies_to: "direct_combustion_species,direct_incident_species"
      rule: "Actual species release = measured actual species mass, or applicable actual activity times valid species/medium factor, or actual released product amount times evidenced composition and fate. Exclude retained/captured stock, usable returns, waste and treatment once; preserve uncertainty. Do not use physical residual, safety concentration, SDS or no-VOC claim alone as emitted mass. Whole product and species views are nonadditive. A complete activity-to-species emission factor already contains its stated composition/fate; do not multiply composition or fate again unless its documented factor definition requires it."
      inputs:
        - cp_releases
        - cp_fuel
        - cp_exits
        - "actual species and receiving medium"
      output: "actual species/medium mass"
      source_ids: []
  data_quality_requirements:
    - id: q_identity
      applies_to: "Reference identity and configuration"
      requirement: "Require retained/replaced BOM, actual ratings/topology, firmware/protection/control state, station ID, site, design and acceptance date; no MWp/kWh equivalence."
      evidence: "cp_acceptance and design/serial records"
    - id: q_coverage
      applies_to: "Resource coverage and fate"
      requirement: "Complete all actual direct and provider resources, stock/outlets, transport, wastes and treatment. Evidence actual non-use explicitly; unresolved quantity, resource owner, support chain or waste fate remains a final-data blocker, not zero."
      evidence: "All node-owned protocols and coverage matrix"
    - id: q_ranges
      applies_to: "Ranges and uncertainty"
      requirement: "Collect station/configuration-specific observed distributions, actual design limits and uncertainty. No universal material/energy/test yield or service life is supplied. Range evidence needs must be resolved before using default estimates or asserting publication readiness."
      evidence: "Actual foreground range evidence and sensitivity"
    - id: q_period
      applies_to: "Temporal completeness"
      requirement: "Cover all actual campaign phases, retests and carry periods plus asset observed history/evidenced remainder. Record replacements/termination/EOL and update on real changes; no arbitrary annualization."
      evidence: "Phase/period/event join and full-life asset records"
validation_rules:
  - rule_id: v_gate
    applies_to: "Acceptance and retained interfaces"
    rule: "Require N>0, unique station IDs, actual compatible retained MVT/arrays/foundation and completed approved mechanical/electrical/protection/earthing/SCADA/grid-control test gates, defect closure, report and operator signature. Missing or failed gate blocks accepted output."
    source_ids:
      - sma-utility-repowering
      - sma-pv-commissioning
      - sma-industrial-services
  - rule_id: v_stock
    applies_to: "Native stock and disjoint exits"
    rule: "Reconcile each SKU/native unit, package-component exclusions, gross-with-outlets or consumed-only convention, old-versus-new equipment and disjoint usable/waste/release/closing roles. No arbitrary mass conversions, negative new inputs or double returns/credits."
    source_ids: []
  - rule_id: v_energy
    applies_to: "Commissioning resources and species"
    rule: "Keep import/export/retained generation/circulation/dumped-load ledgers distinct, own actual resources once and retain supplied fuel burdens including waste/loss. Verify actual burned-activity/species/medium evidence and nonadditive physical views. No automatic energy credit or theoretical emission inference."
    source_ids: []
  - rule_id: v_loops_periods
    applies_to: "Rework and period coverage"
    rule: "Link every failed/aborted/repeated test, rejected installation, cleaning/setup/changeover event and resource to actual campaign/batch/event/phase/period and originating node. No unresolved reject counts as accepted; no duplicated shared event across periods."
    source_ids: []
  - rule_id: v_assets
    applies_to: "Shared providers and assets"
    rule: "Require complete actual service results/upstream coverage and whole-life manufacture/maintenance/replacement/EOL asset evidence with compatible job/all-life driver across all jobs/periods. Missing remainder, replacement, termination, denominator or coverage blocks finalization; test direct/provider/rental duplicates and sensitivity."
    source_ids: []
  - rule_id: v_binding
    applies_to: "Final exchange identities"
    rule: "Before a final dataset, verify each actual flow, native property and unit support including standalone electricity Energy and actual provider/asset chains. A candidate with unresolved product identity is not publication-ready; a checker pass does not verify external identity or physical foreground data."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground station-repowering service data package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Same qualified existing utility ground-PV central-inverter retained-MVT service, with configuration and acceptance comparability disclosed; downstream process/lifecyclemodel projections."
  excluded_use: "Generic new plant, generic inverter supply, module/MVT replacement, batteries, home/string-only routes, capacity or electricity equivalence, future avoided-impact claims."
  required_metadata: "Actual station/site/serial IDs, retained/replaced BOM, ratings/topology, qualified MVT/foundation/array interfaces, firmware/protection/SCADA/grid state, actual local/OEM method, test/defect report, signature/date, N, campaign/phases/periods, resource ownership and old-equipment fate."
  required_quality_disclosure: "Actual quantity/range evidence, unresolved actual UUID/support chains, provider and asset upstream coverage/life denominator, stock/return convention, test energy separation, release uncertainty, missing fate and sensitivities; no publication claim while blockers persist."
  update_trigger: "Changed station configuration/retained MVT, actual approved route/gates, provider scope/resource coverage, receiver/fate, UUID support, metering, asset remainder/replacements/termination/EOL or material new foreground evidence."
