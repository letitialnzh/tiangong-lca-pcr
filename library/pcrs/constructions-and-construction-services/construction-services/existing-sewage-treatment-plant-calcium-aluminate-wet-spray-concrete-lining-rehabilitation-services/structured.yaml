boundary_abstraction:
  declared_starting_condition: "Identified existing acid-attacked plant-integral concrete chamber, retained host/steel condition and authorised repair scope; isolation/diversion/dewatering/access are actual owned foreground activities"
  starting_condition_role: "Existing host state interface, without repurchasing retained concrete/steel or inventing an avoided replacement credit"
  product_classification_scope: "Narrow wet-spray lining rehabilitation subset of sewage-treatment-plant construction services"
  recursive_input_rule: "A genuine bounded subcontract input of the same category stops recursion only with completed-resource/result evidence and explicit upstream coverage; retain provider-paid resources and avoid overlap with direct rows"
  upstream_dataset_requirement: "Actual premix/consumable/fuel/water/utility/transport/service/asset supplies require matching upstream burdens and verified concrete exchange identities before final dataset construction"
  disclosure: "Host condition and excluded structural work; actual contractors; stocks and outward returns; all attempts; material states; diversion/residue fates; gate evidence; asset life and incomplete evidence"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted calcium-aluminate wet-spray lining rehabilitation of existing sewage-treatment-plant concrete chamber"
    uuid: ""
  flow_property_ref:
    uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
  unit_group_ref:
    uuid: "93a60a57-a3c8-18da-a746-0800200c9a66"
  reference_unit: "m2"
  required_qualifiers:
    - "plant and chamber IDs/function"
    - "non-bioreactor/non-digester eligibility"
    - "retained concrete/steel condition"
    - "acid exposure"
    - "approved premix SKU/local instructions"
    - "pH method/criterion/results"
    - SSD
    - "net developed area survey/openings/reveals"
    - "thickness/volume/layer distribution"
    - orientation
    - "batch/run IDs"
    - "water ratio"
    - "equipment and contamination control"
    - "ambient/humidity/ventilation"
    - "cure/hardener and hardness criteria/results"
    - "bond/geometry/surface tests"
    - "defect closure"
    - "authorised sewage-return conditions"
    - "signed acceptance"
    - "reporting/asset periods"
reference_flows:
  []
measurement_rules:
  - id: area_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "A is the positive unique net developed finally accepted area surveyed under cp_acceptance. Exclude openings, count real reveals once, remove overlap and rejected sections; layers, passes, attempts and rebound do not multiply A. Zero/missing acceptance gives no accepted output."
  - id: batch_water_ratio
    applies_to: "premix; mix_water"
    required_property_ref:
      name: "Actual dry-powder Mass and mixing-water Volume"
      uuid: ""
    required_unit: "kg; L; m3"
    rule: "Under adopted UK 20 kg premix instruction, each 20 kg dry powder batch receives 2.8-3.2 L clean water; check actual batch powder/water and consistency under current approved instructions. Convert measured litres to m3 by /1000. This co-input recipe constraint is not an amount Range per accepted area."
  - id: material_states
    applies_to: "premix; mix_water; accepted_lining"
    required_property_ref:
      name: "Actual native Mass, Volume and Area by state"
      uuid: ""
    required_unit: "kg; m3; m2"
    rule: "Keep dry powder, added mixing water, total fresh mix and cured installed material distinct. Measure actual thickness distribution/installed geometry; density/yield conversions require exact product, state, temperature and source. Never use fresh density to infer cured mass or multiply purchased powder by assumed density to obtain A."
  - id: native_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual supplied or dispatched native property"
      uuid: ""
    required_unit: "actual compatible unit"
    rule: "Keep SKU-specific Mass/Count/Length/Area/Volume ledgers and same-unit returns; document actual conversions only where independently needed. Electricity/time/provider supports must be verified independently; do not replace Energy or Time with fuel calorific value or Count."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: lining
    name: "Integrated plant chamber lining rehabilitation"
    inclusion: "required"
    inclusion_condition: "Qualified existing chamber and approved wet-spray scope"
    role: "Retained acid-attacked parent to finally accepted cured protective lining, including preparation, batches/runs, startflush/clean/changeover, cure, tests and rejected-layer removal/reapplication"
    quantitative_reference: "Unique finally accepted A m2; every actual campaign/batch/event and asset period linked"
process_inventory:
  - id: lining
    label: "Integrated plant chamber lining rehabilitation"
    inputs:
      product:
        - row_id: premix
          role: "Approved dry calcium-aluminate cement-and-aggregate premix"
          name: "Approved one-part dry calcium-aluminate cement and calcium-aluminate aggregate repair premix"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Bought dry powder includes its calcium-aluminate aggregate; do not repurchase separate binder/aggregate or a second wet mortar. Weigh bags/residual powder by SKU and state. Range evidence need: Actual SKU dry-powder kg/m2 by measured thickness, roughness and loss ledger; PDS ~22 kg/m2/10 mm has ambiguous mass state relative to 2025 worked example and is not a dry-powder default."
          amount:
            expression: "Actual attributable dry premix kg / A"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 m2 reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_premix
              source_ids:
                - sika-4400-uk-pds-2021
                - sika-4400-uk-method-2025
            ranges: []
        - row_id: mix_water
          role: "Clean water added to premix"
          name: "Clean potable mixing water supplied"
          flow_type: "product"
          property_unit: "Volume / m3"
          description: "Meter each batch separately from SSD/cleaning/curing water; total fresh mass is powder plus actual water mass, without double counted purchased wet mortar. Range evidence need: Adopted UK20kg product:2.8-3.2 L/20kg dry powder, not m3/m2 default; actual water density is required for mass balance."
          amount:
            expression: "Actual measured mixing-water m3 / A; m3 = measured litres / 1000"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 m2 reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_mix_water
              source_ids:
                - sika-4400-uk-pds-2021
                - sika-4400-uk-method-2025
            ranges: []
        - row_id: process_water
