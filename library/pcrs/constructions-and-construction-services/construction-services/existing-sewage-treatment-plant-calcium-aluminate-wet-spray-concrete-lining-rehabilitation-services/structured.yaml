product_category_identity:
  canonical_pcr_id: "pcr.existing-sewage-treatment-plant-calcium-aluminate-wet-spray-concrete-lining-rehabilitation-services"
  classification_refs: "CPC 3.0 54253; narrower construction-service subset"
  covered_products: "Accepted calcium-aluminate wet-spray acid-resistant lining rehabilitation of retained concrete chambers integral to an existing sewage-treatment plant"
  excluded_products: "New plant; bio-reactor/digester tanks; external sewer mains/manholes; deep rebuilding; replaced reinforcement/mesh; dry-spray/centrifugal/hand-only application; later treatment operation"
  representative_product: "Existing plant wet well with qualified sound acid-decontaminated concrete and an approved cured calcium-aluminate wet-sprayed lining"
  production_route: "Isolation/diversion/dewatering and access; acid-damaged concrete removal and substrate qualification; SSD; clean equipment/starter; powder-water batches; low-pressure wet spray and finish; required cure/hardener; tests, defect closure and signed lining acceptance"
  market_state: "Completed, cured and authorised lining service at plant owner handover, with actual authorised return-to-sewage conditions"
functional_unit:
  what: "Accepted internal calcium-aluminate wet-spray lining rehabilitation of an existing sewage-treatment-plant concrete chamber"
  how_much: "1 m2 unique net developed accepted lining area A"
  how_well: "Actual approved material/system, surveyed thickness and layer profile, qualified substrate and pH, complete cure/hardness, bond/surface/geometry checks and signed owner acceptance"
  how_long_or_cycle: "One complete repair campaign through final accepted handover, including all failed attempts and repeat cleaning/cure/tests; disclose stock carry and all shared-asset manufacture, maintenance, replacement and end-of-life periods; no assumed service life"
  reference_flow_link: "accepted_lining"
system_boundary:
  rules:
    - rule_id: qualified_parent
      applies_to: "lining"
      rule: "Own authorised isolation, sewage diversion, desludging/dewatering, containment, confined-space access/ventilation and actual retained-steel cleaning. Remove acid-damaged/weak material to sound rough concrete, inspect microcracks/delamination including preparation-caused damage, and obtain required competent consent. Adopted UK V7 requires substrate pH >=10 before application: retain actual test location, dust/distilled-water/paper method and results, repeat removal/testing if failed. Any alternative system needs written competent approval and its own real criterion; unknown is not zero or passed. Major rebuilding/rebar/mesh replacement blocks this subset."
      source_ids:
        - sika-4400-uk-pds-2021
        - sika-4400-uk-method-2025
    - rule_id: wet_spray_system
      applies_to: "lining"
      rule: "SSD pre-wetting has no standing water and no dry-out. Use clean premix/equipment free of Portland contamination and an actual compatible calcium-aluminate slurry or approved chemical starter; own its input and discarded startflush. Mix only clean water, verify every batch consistency/pot life and actual layer/overhead/interface/thickness controls. Under adopted UK V7 larger wet wells/chambers require at least 25 mm; this source-specific requirement is not a universal denominator thickness. No additional Portland cement, aggregate or finishing water."
      source_ids:
        - sika-4400-uk-pds-2021
        - sika-4400-uk-method-2025
    - rule_id: cure_handoff
      applies_to: "lining"
      rule: "Own required wet curing, environment/dehydration mitigation under safety ventilation, and compatible approved surface hardener when actually used. UK V7 low-humidity/strong-airflow instruction is wet cure at least 8-12 h; its typical ~12 h hard-before-sewage statement, conditional 6-9 h hardening and ~1 h after hardener/moderate slow flow statements are not interchangeable universal timers. Actual approved cure/hard-state evidence, required bond/surface/geometry tests and signed authorised sewage-return gate control. The small live-manhole cover-only exception does not apply to this isolated plant chamber."
      source_ids:
        - sika-4400-uk-pds-2021
        - sika-4400-uk-method-2025
    - rule_id: all_resources
      applies_to: "all inventory rows"
      rule: "Include actual preparation, pH testing, PPE/containment, SSD, starter, periodic hopper/nozzle/rotor/pump/hose cleaning, cooling, curing, testing, rework, fuel/utilities, freight and provider-paid resources. Own routine and incident residues and actual species/medium releases. Complete pump/compressor/mixer/access-tool manufacture, maintenance, replacements and end-of-life is attributed over all jobs/nodes/periods. Actual absence needs evidence; unknown resources cannot be omitted."
      source_ids:
        - sika-4400-uk-pds-2021
        - sika-4400-uk-method-2025
    - rule_id: supply_stock
      applies_to: "material and fuel inputs; return_mass; return_count; return_length; return_area; return_volume"
      rule: "For each actual SKU and native unit, attributable supply = opening attributable stock + net-tare gross external receipts - closing carried stock. Internal issues are not new purchases; closing retained/recovered stock is not an outward return. Gross-with-outlets includes actual usable outward returns once; consumed-only subtracts the matched usable return once with its upstream burden and no second return credit. Nonreturned waste and uncontained losses retain upstream supply burden. Keep disjoint final retained/used, return, waste and release outlets; wet mix/use intermediate activities are nonadditive."
      source_ids: []
    - rule_id: fuel_and_releases
      applies_to: "fuel; species_release"
      rule: "Upstream fuel includes burned plus all attributable nonreturned waste/loss, not burned fuel alone. Separately close opening+receipts = closing+burned+usable return+nonburned waste+uncontained loss. Total spill is audit-only; recovered spill in closing is not another loss. Whole sewage/water/gas physical balances and species/medium elementary views are nonadditive; capture, waste, stock and returns are excluded from release once. H2S safety monitoring/SDS/absence claims cannot invent emission quantities."
      source_ids: []
    - rule_id: boundary_atomic_completion
      applies_to: "all processes"
      rule: "Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry."
      source_ids: []
    - rule_id: system_boundary_rule_8
      applies_to: "foreground_system_boundary"
