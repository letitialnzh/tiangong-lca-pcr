      raw_fields: "plant_id;chamber_id;job_id;campaign_id;batch_id;event_id;phase_id;period_id;species;medium;measured_kg;activity;activity_unit;factor;factor_unit;factor_source;composition;composition_basis;composition_source;fate;fate_basis;fate_source;parent_ledger_id;capture;stock;waste;method;uncertainty"
      collection_method: "Select traceable measured species/medium mass, actual compatible activity times species emission factor, or whole-fluid mass times evidenced composition and release fate. Record activity/factor units/sources, composition/fate basis/provenance and parent ledger; do not scale a complete species factor twice. Close physical parent balance separately."
      unit: "kg"
      frequency: "Each actual batch/run/event/dispatch/asset phase and final survey"
      temporal_coverage: "Whole campaign including failures; carried stocks and all relevant asset periods"
      site_scope: "Actual plant/chamber and actual providers/all asset consumers"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "Calibrated instruments, primary receipts/logs, state/destination and owner coverage; reconcile duplicates and missing records"
  calculation_rules:
    - id: unique_area
      applies_to: "accepted_lining"
      rule: "A = sum of disjoint accepted developed surfaces minus openings; add actual surveyed reveals once, remove overlaps and failed portions; layers and passes do not multiply area. With missing gate or A<=0 produce no accepted reference output."
      inputs:
        - cp_acceptance
      output: "A m2"
      source_ids: []
    - id: sku_stock
      applies_to: "premix; starter; hardener; consumable_mass; consumable_count; consumable_length; consumable_area; fuel; return_mass; return_count; return_length; return_area; return_volume"
      rule: "In each compatible native SKU ledger attributable supply = opening attributable stock + net-tare gross external receipts - closing carried stock. Gross-with-outlets retains actual outward usable return once; consumed-only subtracts matched return once with matching supply burden and no duplicate credit. All nonreturned losses/waste retain supply burden. Close disjoint final outlets and retain intermediate dosing/use as nonadditive."
      inputs:
        - "Actual receipt/stock/dispatch/use/waste/loss protocols"
      output: "Attributable native supply and matched outlets"
      source_ids: []
    - id: mix_state_check
      applies_to: "premix; mix_water"
      rule: "Fresh mix mass = actual dry powder mass + actual added water mass; mixing-water m3 = measured litres / 1000; added water mass = measured water volume times actual density with matching unit/state/temperature/source. Only when exact fresh density is evidenced, loss-free theoretical fresh volume = fresh mass / fresh density; do not infer cured density or accepted A. UK 2025 example at 25 mm / 1 m2 and 2200 kg/m3 gives 55 kg total fresh mix and 55 / 1.16 ~ 47.4 kg dry powder, not 55 kg powder plus water. PDS ~ 22 kg/m2/10 mm is not independently adopted as a dry-powder consumption factor."
      inputs:
        - cp_premix
        - cp_mix_water
        - cp_acceptance
        - "exact product/state/density"
      output: "State-specific diagnostic only, not a second purchased exchange"
      source_ids:
        - sika-4400-uk-method-2025
        - sika-4400-uk-pds-2021
    - id: fuel_close
      applies_to: "fuel; species_release"
      rule: "Opening+receipts = closing+burned+usable_return+nonburned_waste+uncontained_loss in compatible fuel mass. Retained recovered spill belongs in closing; total spill is audit-only. Upstream attribution follows sku_stock, while combustion activity uses burned only. Species release selects measured species/medium mass OR actual compatible activity * species emission_factor OR whole-fluid mass * evidenced composition * actual release fate. Do not apply composition/fate again to a factor that already reports the released species; remove captured/stock/returns/waste once; whole fluid balance is nonadditive with species view."
      inputs:
        - cp_fuel
        - cp_species_release
      output: "Fuel attribution, combustion activity and actual species release separately"
      source_ids: []
    - id: freight_work
      applies_to: "freight"
      rule: "Actual attributed freight work = sum of actual shipment load_kg * distance_km under documented allocation/empty-leg coverage; divide by A for reference amount."
      inputs:
        - cp_freight
        - cp_acceptance
      output: "kg*km per m2"
      source_ids: []
    - id: asset_life_share
      applies_to: "asset_share"
      rule: "Job share = complete manufacture+maintenance+replacement+end-of-life burden times measured compatible job_driver/life_driver across ALL consumers and periods; divide by A. Complete life or evidenced remainder is mandatory; reconcile phase/consumer shares, evaluate uncertainty/sensitivity and update on replacement/termination."
      inputs:
        - cp_asset_share
        - cp_acceptance
      output: "Actual native asset burden share per m2"
      source_ids: []
    - id: native_reference_amounts
      applies_to: "all inventory rows"
      rule: "Each inventory card states its actual native quantity divided by the same positive A, except accepted_lining=1m2. Never add different native units or double count an intermediate state, covered provider burden or outward credit."
      inputs:
        - "All linked collection protocols"
        - cp_acceptance
      output: "Native exchange quantities per 1 m2 reference flow"
      source_ids: []
  data_quality_requirements:
    - id: route_gate_evidence
      applies_to: "lining; accepted_lining"
      requirement: "Verify plant-integral function and excluded-tank/structural eligibility; actual current local approved product instructions, sound/rough clean concrete, microcracks/delamination/steel review, pH>=10 under adopted UKV7 and SSD; batch ratio/consistency, uncontaminated equipment, layer/thickness, actual cure/hardness, tests/rework and signed sewage-return acceptance."
      evidence: "Actual engineer/owner records and primary local product/method evidence"
    - id: quantity_state_quality
      applies_to: "all inventory rows"
      requirement: "Retain native units, tare, calibration, dates, batch/run/patch/event IDs, stock carry, full failure/changeover/cure/test coverage, composition/state/density evidence and duplicate-owner review. No quantitative template value replaces actual consumption."
      evidence: "Linked collection protocols and closure records"
    - id: support_and_range
      applies_to: "all inventory rows"
      requirement: "Resolve concrete flow/provider/species identities and exact support before final exchange construction; each card's stated Range evidence need requires actual comparable site/product observations or justified uncertainty. No fabricated broad universal bounds; disclose uncovered evidence and block unsupported final quantities."
      evidence: "Concrete verified identities, unit/property details and range evidence"
    - id: life_coverage
      applies_to: "asset_share; provider"
      requirement: "Missing full asset period/replacement/termination/end-of-life denominator or provider resource/results/upstream scope blocks final dataset; document observed history and evidence-based remainder/sensitivity/update when life incomplete."
      evidence: "Phase/consumer ledger and provider primary records"
validation_rules:
  - rule_id: reference_gate
    applies_to: "accepted_lining"
    rule: "Require same unique positive A, reference link/name/property/unit and passed actual substrate pH/SSD, layer/geometry, cure/hardness, bond/surface and authorised signed owner return gate. No fastest timer, cover-only exception, unresolved reject or zero-area campaign creates accepted output."
    source_ids:
      - sika-4400-uk-method-2025
      - sika-4400-uk-pds-2021
  - rule_id: supply_and_state_gate
    applies_to: "all inventory rows"
    rule: "Reconcile native SKU opening/receipt/closing/usable return/use/waste/release and exclusive factory product/components. Dry powder+water, fresh mix and cured retained states are distinct; no55kgfresh-as55kgdry plus water, wet-mix duplicate purchase, loss-only omission, or pass/layer area inflation."
    source_ids: []
  - rule_id: event_and_release_gate
    applies_to: "lining; species_release; solid_waste; wastewater"
    rule: "Every batch/run/period, startflush, periodic clean/changeover, failure, rework/reapplication and residue exit has owner and fate. Physical fluid/gas closure and species/medium evidence are nonadditive; safety concentration/SDS alone cannot establish release; captured streams are waste, not direct discharge."
    source_ids: []
  - rule_id: shared_period_gate
    applies_to: "asset_share; provider; electricity; fuel; freight"
    rule: "Require complete all-consumer/lifetime phase denominator or evidenced remainder and uncertainty/sensitivity/update, real replacement/termination/end-of-life, compatible driver and reconciled shares. Verify bounded provider native unit/resources/results/upstream scope and direct/rental/assets/spares ownership once. Missing coverage blocks final dataset."
    source_ids: []
  - rule_id: readiness_gate
    applies_to: "all inventory rows"
    rule: "Retain actual absence evidence, unresolved identities/supports/ranges and missing primary records; candidate methodology cannot supply unverified concrete final exchanges. Automated checks do not verify external UUIDs, full engineering approval or publication readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground repair data package for one actual completed plant chamber lining campaign"
  downstream_use: "secondary_dataset; background_dataset; process and lifecyclemodel projections after concrete identity/coverage completion"
  allowed_use: "Declared compatible plant-integral calcium-aluminate low-pressure wet-spray lining repair with actual condition/thickness/cure/acceptance and inventory coverage"
  excluded_use: "Whole plant construction or treatment operation; bio-reactor/digester; external sewer/manhole; new tank; major rebuild/replaced steel; dry-spray/centrifugal/hand-only or polymer-only repair; invented lifetime/avoided replacement/treatment credit"
  required_metadata: "Plant/chamber/function, host condition, approved SKU/system/local instructions, pH/SSD, unique A and thickness/volume/layer orientation, batch/run/event/period IDs, environment/ventilation, curing/hardness/tests/rework and signed return gate; providers/stocks/fates/assets/units"
  required_quality_disclosure: "Quantitative mass-state ambiguity and conditional timing evidence; actual state/geometry/consumption, concrete identity/support gaps, Range evidence needs, rejected attempts, provider ownership, asset coverage/remainder/sensitivity, temporal/geographical representativeness and uncertainty"
  update_trigger: "New local product/method or changed suitability/pH/cure; actual recipe/equipment/gate, thickness/host condition, provider, material fate, stock convention, measured consumption, asset replacement/termination or remainder evidence changes"
