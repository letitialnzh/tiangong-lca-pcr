allocation_rules:
  - rule_id: allocation_stock
    applies_to: "supplies and returns"
    rule: "Choose by SKU/unit either gross-with-outlets: S=opening_attributed+net_receipts-closing_carried, with usable_return as matched product output; or consumed-only: input S-usable_return and return as a nonadditive audit view. Declare one convention and deduct the return exactly once. Internal issue is not new purchase, closing stock is not outward return, and nonreturned waste/loss retains upstream burdens."
    source_ids: []
  - rule_id: allocation_assets
    applies_to: "shared_assets"
    rule: "Use cp_assets ALL-consumer/full-life driver records: whole-asset equivalents=(job_driver/life_driver)/N with complete manufacture, maintenance, replacement and EOL dataset. Alternatively, if actual dataset production explicitly adopts a lifecycle-complete per-driver service, service quantity=job_driver/N with matching per-unit burden; never combine views or normalize twice. Do not invent life; retain observed history, evidenced remainder, termination, replacements, sources, uncertainty, sensitivity and updates."
    source_ids: []
  - rule_id: allocation_failures
    applies_to: "integration"
    rule: "No default coproduct credit. Failed work, retests and losses burden completed interventions; rejected/incomplete work does not enter N. Separate actual usable recovered products from waste; any further functional product requires explicit review rather than default avoided burden."
    source_ids: []
  - rule_id: allocation_phases
    applies_to: "integration"
    rule: "Enumerate actual start/end periods for assessment/preparation, connection installation, correction/retest and final signed acceptance; link inputs, assets, outputs and events by event_id to phase_id/period_id and record period-specific attribution decisions. Retain full-life links to asset manufacture, maintenance, replacement, termination and EOL; interphase issue/carry is neither another purchase nor another completed output. Unresolved replacement/termination blocks final data."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_gate
      process_id: "integration"
      flow_role: "accepted outcome"
      record_type: "building acceptance register"
      raw_fields: "building_id; intervention_id; site_id; job_id; event_id; phase_id; period_id; phase_start; phase_end; assessment_preparation_phase; installation_phase; correction_retest_phase; acceptance_phase; event_phase_link; attribution_decision; survey_date; building_use; storeys; structural_geometry; roof_type; cladding_type; retained_condition; columns_foundations_assessment; load_path; seismic_demand; design_level; approved_scheme; actual_installed_connections; inspection_records; anchor_test_records; as_built_verification; defect_status; engineer_signoff; owner_signoff; completion_date; unique_completed_count_N"
      collection_method: "Inspect approved surveys, installation and test/as-built records and signed defect-closed completion; accept only full in-scope building interventions. Aggregation details: N unique completed interventions; 1 item per reference flow"
      unit: "item"
      frequency: "each intervention and final handover"
      temporal_coverage: "actual surveyed start through signed completion; relevant stock retains complete source scope"
      site_scope: "named site/intervention; shared assets enumerate all consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed gate; deduplicated IDs"
    - protocol_id: cp_supply
      process_id: "integration"
      flow_role: "new supplies and usable returns"
      record_type: "native stock and transfer ledger"
      raw_fields: "site_id; job_id; intervention_id; process_id; campaign_id; batch_id; event_id; phase_id; period_id; supplier_id; sku; formulation; state; native_property; native_unit; opening_attributed; external_gross; tare; net_receipts; internal_issue; installed_quantity; closing_carried; usable_return; return_unit; return_transfer_id; return_quality; nonreturned_waste; loss; convention; dimension; thickness; density; density_unit; density_source; moisture; moisture_basis; temperature; temperature_unit; mass_view_source; conversion_factor; conversion_unit; conversion_source; N"
      collection_method: "Reconcile receipts, supplier tickets, calibrated meters/scales and usable-return acceptance by actual SKU/native unit; separate historic removal from new stock. Aggregation details: calc_stock and calc_mass_view; normalize attributable amount / N once per reference flow"
      unit: "actual native item, kg, m2, m or m3"
      frequency: "each receipt, return and period closure"
      temporal_coverage: "actual surveyed start through signed completion; relevant stock retains complete source scope"
      site_scope: "named site/intervention; shared assets enumerate all consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "stock closure; no double return deduction"
    - protocol_id: cp_fuel
      process_id: "integration"
      flow_role: "fuel supply and actual burn"
      record_type: "fuel stock and disjoint fate records"
      raw_fields: "site_id; job_id; intervention_id; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; carrier; grade; native_unit; volume_state; density; density_unit; density_state; density_source; temperature; temperature_unit; pressure; pressure_unit; opening_attributed; external_gross; tare; net_receipts; closing_carried; usable_return; measured_burn; burn_method; burn_meter; nonburned_waste; uncontained_loss; carry; total_spill_audit; recovered_closing; fate_uncertainty; unknown_loss_investigation; conversion_factor; conversion_unit; conversion_source; N"
      collection_method: "Use calibrated burn measurement or audited complete mutually exclusive native-unit fate records; investigate unknown losses rather than assign them to combustion. Aggregation details: calc_stock supply and calc_fuel_fates burn / N once per reference flow"
      unit: "m3 with state; other actual native units expanded"
      frequency: "each fuel event and closure"
      temporal_coverage: "actual surveyed start through signed completion; relevant stock retains complete source scope"
      site_scope: "named site/intervention; shared assets enumerate all consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; complete fates; uncertainty"
    - protocol_id: cp_power
      process_id: "integration"
      flow_role: "actual electricity"
      record_type: "meter records"
      raw_fields: "site_id; job_id; intervention_id; asset_id; event_id; phase_id; period_id; meter_id; meter_source; opening_reading; closing_reading; gross_import; gross_export; export_register; onsite_generation; generation_source; generation_resource_coverage; internal_circulation; internal_losses; supplied_unit; job_share; attribution_driver; driver_unit; provider_coverage; conversion_factor; conversion_unit; conversion_source; N"
      collection_method: "Read calibrated gross import and export registers and actual onsite-generation meters; reconcile source, provider scope and actual allocation driver/unit. Keep internal circulation/losses without net export deduction; expand actual export as separate output and onsite-generation resources once; isolate shared and retest use. Aggregation details: attributable metered electricity / N once per reference flow"
      unit: "kWh; actual supplied unit retained"
      frequency: "each work and test phase"
      temporal_coverage: "actual surveyed start through signed completion; relevant stock retains complete source scope"
      site_scope: "named site/intervention; shared assets enumerate all consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter source and compatible upstream electricity"
    - protocol_id: cp_provider
      process_id: "integration"
      flow_role: "completed provider results"
      record_type: "physical service acceptance and coverage record"
      raw_fields: "site_id; job_id; intervention_id; provider_id; service_id; event_id; phase_id; period_id; actual_completed_result; native_property; native_unit; accepted_quantity; coverage_manufacture; coverage_materials; coverage_travel; coverage_energy; coverage_water; coverage_spares; coverage_rental; coverage_waste; upstream_dataset; excluded_resources; N"
      collection_method: "Verify actual completed physical result and full upstream boundary; expand any other native-unit provider exchange instead of converting price or hours to items. Aggregation details: matching physical completed quantity / N once per reference flow; uncovered resources explicitly added once"
      unit: "item for actual counted result; others expanded"
      frequency: "each service and acceptance"
      temporal_coverage: "actual surveyed start through signed completion; relevant stock retains complete source scope"
      site_scope: "named site/intervention; shared assets enumerate all consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "acceptance; coverage matrix; upstream gate"
    - protocol_id: cp_assets
      process_id: "integration"
      flow_role: "shared asset lifecycle attribution"
      record_type: "asset lifetime and use register"
      raw_fields: "site_id; job_id; intervention_id; asset_id; consumer_job_id; consumer_node_id; event_id; phase_id; period_id; service_period; driver_name; driver_unit; job_driver; life_driver; observed_history; observed_life; evidenced_remainder; replacement_schedule; termination_condition; manufacture_scope; maintenance_scope; replacement_scope; end_of_life_scope; lifecycle_dataset; evidence_source; uncertainty; sensitivity; update_trigger; N"
      collection_method: "Enumerate ALL asset consumers/jobs/nodes/periods; use observed complete life or observed history plus evidenced remainder, replacements, termination and EOL. Identify missing life/coverage as a final-data blocker. Aggregation details: (job_driver / life_driver) / N whole-asset equivalents once per reference flow; do not add per-driver view"
      unit: "compatible actual driver and whole-asset item"
      frequency: "each use and lifetime update"
      temporal_coverage: "ALL-consumer complete life: manufacture, ALL jobs/nodes/periods, maintenance, replacement, termination and EOL; not limited to this survey-to-completion interval."
      site_scope: "named site/intervention; shared assets enumerate all consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "all consumers; complete lifecycle; sensitivity and update evidence"
    - protocol_id: cp_freight
      process_id: "integration"
      flow_role: "transport boundary coverage"
      record_type: "load-distance dispatch record"
      raw_fields: "site_id; job_id; intervention_id; provider_id; vehicle_id; event_id; phase_id; period_id; transfer_id; cargo_identity; load_mass; mass_unit; distance; distance_unit; route; load_share; empty_return; upstream_coverage; vehicle_resources; conversion_factor; conversion_source; N"
      collection_method: "Reconcile dispatches and accepted returns/waste transfer tickets; retain actual load and route units, included empty returns and coverage exclusions. Aggregation details: calc_freight and division by N once per reference flow; no overlapping upstream legs"
      unit: "kg*km from actual units"
      frequency: "each trip and route closure"
      temporal_coverage: "actual surveyed start through signed completion; relevant stock retains complete source scope"
      site_scope: "named site/intervention; shared assets enumerate all consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "tickets; route; return coverage"
    - protocol_id: cp_waste
      process_id: "integration"
      flow_role: "contained waste and rejected work"
      record_type: "waste transfer and defect route ledger"
      raw_fields: "site_id; job_id; intervention_id; event_id; phase_id; period_id; transfer_id; origin; historic_or_new; waste_identity; hazard_class; gross_mass; tare; net_mass; mass_unit; measured_volume; volume_unit; volume_state; moisture; moisture_basis; dry_wet_basis; recovered_historic_state; rejected_connection_id; correction_loop; final_route; receiver; treatment_gate; transport_coverage; treatment_coverage; no_credit; N"
      collection_method: "Weigh separated actual waste, reconcile defective connection correction/retest and offsite receiver records; distinguish usable product return, recovered closing stock and waste. Aggregation details: attributable net waste mass / N once per reference flow; rejected state never counted in N"
      unit: "kg; other native waste units independently expanded"
      frequency: "each defect/removal/transfer"
      temporal_coverage: "actual surveyed start through signed completion; relevant stock retains complete source scope"
      site_scope: "named site/intervention; shared assets enumerate all consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighing; receiver and defect closure evidence"
    - protocol_id: cp_releases
      process_id: "integration"
      flow_role: "direct environmental withdrawals and releases"
      record_type: "measured elementary flow and species record"
      raw_fields: "site_id; job_id; intervention_id; asset_id; event_id; phase_id; period_id; substance; particle_fraction; receiving_medium; water_body; location; permit; direction; measured_mass; mass_unit; measured_volume; volume_unit; volume_state; temperature; temperature_unit; pressure; pressure_unit; matched_activity; activity_unit; species_factor; factor_unit; factor_basis; factor_source; whole_fluid_release; composition; composition_basis; composition_source; fate_fraction; fate_basis; fate_source; method_choice; complete_species_factor; captured_waste; recovered_closing; nonadditive_view; uncertainty; N"
      collection_method: "Measure actual species and medium or use compatible complete species EF / evidenced whole-fluid composition and fate. Record actual direct-water/gas roles and expand dedicated concrete exchanges; absence requires evidence, not a default zero. Aggregation details: calc_species or measured direct volume / N once per reference flow; whole-fluid and constituent views nonadditive"
      unit: "kg species; m3 actual water; actual native gas units expanded"
      frequency: "each intake/release/test event"
      temporal_coverage: "actual surveyed start through signed completion; relevant stock retains complete source scope"
      site_scope: "named site/intervention; shared assets enumerate all consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "species/medium; factor compatibility; fate closure"
  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "q_normalized = attributable_quantity / N; attribute compatible site/job/phase/period records first, then divide by N once per reference flow."
      inputs:
        - attributable_quantity
        - N
        - cp_gate
      output: "native-unit amount per reference flow"
      source_ids: []
    - id: calc_stock
      applies_to: "roof_connection_assemblies; cladding_connection_assemblies; repair_consumables; temporary_sheet_supplies; temporary_linear_supplies; product_water; site_fuel; usable_count_returns; usable_mass_returns; usable_area_returns; usable_length_returns; usable_volume_returns"
      rule: "net_receipts = external_gross - tare; S = opening_attributed + net_receipts - closing_carried; under allocation_stock, gross-with-outlets records S input and matched usable_return output; consumed-only records S-usable_return input and nonadditive return audit. Divide by N once."
      inputs:
        - opening_attributed
        - external_gross
        - tare
        - closing_carried
        - usable_return
        - convention
        - N
        - cp_supply
        - cp_fuel
      output: "native inputs and matched outward returns without duplicate deduction"
      source_ids: []
    - id: calc_mass_view
      applies_to: "all inventory rows"
      rule: "An independent mass view requires actual SKU dimensions or volume, density, state, moisture, temperature/unit and sources. Use compatible dimensions and mark the view nonadditive to the native physical ledger; no unevidenced item/area-to-mass conversion."
      inputs:
        - sku
        - dimension
        - thickness
        - density
        - density_unit
        - moisture
        - temperature
        - temperature_unit
        - mass_view_source
        - cp_supply
      output: "evidenced nonadditive mass view"
      source_ids: []
    - id: calc_fuel_fates
      applies_to: "site_fuel; actual_air_species; actual_water_soil_species"
      rule: "Use actual measured_burn or audited complete disjoint native-unit fates. Return, nonburned waste, uncontained loss and carry are mutually exclusive. total_spill_audit is audit-only; recovered_closing is already in closing_carried. Investigate unknown loss; do not infer burn as residual."
      inputs:
        - measured_burn
        - burn_method
        - usable_return
        - nonburned_waste
        - uncontained_loss
        - carry
        - total_spill_audit
        - recovered_closing
        - fate_uncertainty
        - unknown_loss_investigation
        - cp_fuel
      output: "actual combustion activity and separate noncombustion fates"
      source_ids: []
    - id: calc_freight
      applies_to: "freight"
      rule: "freight_work = load_mass_kg * distance_km * load_share; retain original mass/distance units and conversions; apply coverage to empty returns and uncovered vehicle resources, then divide by N once."
      inputs:
        - load_mass
        - mass_unit
        - distance
        - distance_unit
        - load_share
        - empty_return
        - upstream_coverage
        - conversion_factor
        - conversion_source
        - N
        - cp_freight
      output: "kg*km per reference flow and uncovered resources"
      source_ids: []
    - id: calc_species
      applies_to: "actual_air_species; actual_water_soil_species"
      rule: "Choose the actual valid method: measured species mass, matched activity * complete species EF, or actual whole-fluid release * evidenced composition * fate. Never multiply a complete species EF by composition/fate again. Divide each species/medium amount by N once; whole-fluid and constituent views are nonadditive."
      inputs:
        - measured_mass
        - matched_activity
        - activity_unit
        - species_factor
        - factor_unit
        - factor_basis
        - factor_source
        - whole_fluid_release
        - composition
        - composition_basis
        - composition_source
        - fate_fraction
        - fate_basis
        - fate_source
        - method_choice
        - complete_species_factor
        - N
        - cp_releases
      output: "actual species/receiving-medium mass per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: quality_gate
      applies_to: "integration"
      requirement: "Named building, actual approved scope and complete closed acceptance record; completion does not imply universal code, future risk or new-building equivalence."
      evidence: "reluis-industrial-retrofit-2024"
    - id: quality_complete
      applies_to: "all inventory rows"
      requirement: "Actual SKU, provider gate, native unit, coverage and environmental medium are required. Missing resources, lifecycle drivers or actual water/gas roles block final data; a candidate PCR check does not make them zero."
      evidence: "receipt/test/meter/provider-coverage/asset-life/environmental records"
    - id: quality_trace
      applies_to: "all inventory rows"
      requirement: "Link by site_id, job_id, intervention_id and actual asset/event/phase/period; never add incompatible units/states. Retain raw operands, uncertainty, sensitivity and update triggers."
      evidence: "traceable raw records and quality audit"
validation_rules:
  - rule_id: validate_gate
    applies_to: "accepted_connection_retrofit"
    rule: "Verify N>0 unique complete interventions, reference name/output row, actual foundations/columns and load-path assessment, approved connection scheme, inspections/tests and signed defect closure; panels/bolts/retests cannot enlarge N."
    source_ids:
      - reluis-industrial-retrofit-2024
  - rule_id: validate_stock
    applies_to: "all supply and return rows"
    rule: "Match native units/states; check stock, gross/net convention, usable returns exactly once, no negative historic-asset purchase and retained loss burdens."
    source_ids: []
  - rule_id: validate_shared
    applies_to: "shared_assets; provider_test_services; freight"
    rule: "Require complete shared-asset consumers/nodes/periods and life evidence; choose one whole-asset or service view. Actual service results/units, rental/test/spares/temporary utilities/travel/freight/empty-return coverage must neither duplicate nor omit burdens; gaps block."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "integration"
    rule: "Rejected connections remain in this node for correction/retest with actual waste and usable-return routes. Unresolved rejects never enter accepted output, and failure does not erase burdens."
    source_ids: []
  - rule_id: validate_environment
    applies_to: "all elementary rows"
    rule: "Expand actual species/medium and native water/gas withdrawal/releases with complete raw operands. Separate product/waste/elementary states, keep whole-fluid/species views nonadditive and avoid repeat composition/fate multiplication."
    source_ids: []
  - rule_id: validate_phases
    applies_to: "integration"
    rule: "Check period boundaries, links of events/inputs/assets/outputs, attribution decisions and replacement/termination records; avoid duplicate interphase/shared-lifecycle attribution, and block final data on unresolved replacement or termination."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground data package for a named retained-factory connection-retrofit service, supporting downstream process/lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "modelling completed industrial-building retrofit with compatible actual scope, starting state, connection strategy and signed gate"
  excluded_use: "whole new building asset; generic safety certification; future earthquake performance guarantee; unreviewed substitution for other uses/technologies"
  required_metadata: "building/intervention IDs; all reference qualifiers; N/count convention; periods, scope, technology, provider coverage, shared life, resources and environmental inventory"
  required_quality_disclosure: "gaps/uncertainty; actual acceptance evidence; release/conversion sources; full-life attribution/sensitivity; numerical-range evidence limitations"
  update_trigger: "approved-design/retained-state change; additional acceptance/stock; actual SKU/service/environmental evidence correction; shared-life/replacement/termination update"
