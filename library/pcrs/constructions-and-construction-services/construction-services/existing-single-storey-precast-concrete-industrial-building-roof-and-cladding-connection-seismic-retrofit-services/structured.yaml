          name: "Project-designed roof-to-beam restraint assemblies"
          flow_type: "product"
          property_unit: "Number of items 01846770-4cfe-4a25-8ad9-919d8d378345 / item"
          description: "Count each actual identified connector, plate, fastener, restraint or dissipative assembly by SKU/configuration and installed interface. Complete bought assemblies include their BOM once; separately supplied pieces retain separate item identities. Existing roof and beam are retained starting state. Range evidence need: Require the actual approved connection schedule and SKU/BOM counts, roof/panel interface geometry, delivery/stock balances, failed-installation replacements and counting uncertainty; no generic bolts-per-building or poster dimensions are evidenced."
