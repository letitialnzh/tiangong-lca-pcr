boundary_abstraction:
  declared_starting_condition: "Actual authorized non-flowing bedrock site, native formation/aquifer and declared access/enabling-work interfaces before first well construction."
  starting_condition_role: "Environmental formation/resource stock and explicit approved site/design interfaces; not a prebuilt well or invented zero-burden new enabling works."
  product_classification_scope: "Pump-free air-rotary civil well service narrower than CPC water-well drilling including possible pump/piping work."
  recursive_input_rule: "A same-category externally supplied well-construction scope is a bounded upstream service with actual gate/owner/quantity and coverage; do not recreate its covered foreground inventory or assume recursion ends at an unverified service label."
  upstream_dataset_requirement: "Actual supply-state casing/grout/components, energy/fuel and bounded service/asset datasets with provider coverage and missing phases stated."
  disclosure: "Actual geometry/geology/design/jurisdiction, interfaces, source-water/cuttings custody, tests/gate, failures, providers and asset periods/phases/attribution; later pump/system/water-service duties."
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted air-rotary bedrock civil water-well construction and development service"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "site and jurisdiction"
    - "non-flowing consolidated-bedrock geology/hydrogeology"
    - "actual bit/hammer route"
    - "well/bore identifiers"
    - "drilled depth/diameters and overburden profile"
    - "casing grade/length/diameter/joints"
    - "approved grout and placement"
    - "cap/seals/wellhead arrangement"
    - "actual development method/endpoint"
    - "temporary pump and test method/flow/duration/drawdown/recovery"
    - "construction disinfection/dilution/contact/flush/sample protocol and results"
    - "failed-hole disposition"
    - "signed pump-free civil gate"
    - "later permanent-pump and water-service approval owner"
reference_flows:
  []
measurement_rules:
  - id: count_reference
    applies_to: "accepted_civil_well"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Count one actual accepted civil well at exact qualified gate. Depth, diameter, yield and capacity cannot convert incompatible jobs to equivalent counts."
  - id: mass_basis
    applies_to: "all mass inventory rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain actual wet/dry/solution/substance basis; measured volume to mass requires actual temperature/state and documented density; product solution mass is not active substance mass."
  - id: physical_units
    applies_to: "support_electricity; support_assets; support_transport; support_services"
    required_property_ref:
      name: "Actual compatible property unresolved until verified"
      uuid: ""
    required_unit: "kWh; h; tkm; actual provider unit"
    rule: "Preserve actual physical energy/time/transport/provider measurements and independently verify support chain before final exchanges; no Count conversion for tool hours, samples, air volume or energy."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: bore_removal
    name: "Formation drilling and resource-removal responsibility"
    inclusion: "required"
    inclusion_condition: "Always; actual overburden/consolidated-bedrock removal and all attributable attempts"
    role: "Independent source/removal responsibility: drilled bore and captured cuttings/water handoff to completion/receivers; separate from component integration; lead operator owns whole-job shared purchases/assets/logistics once, attributes actual events among all three responsibilities without a support pseudo-process"
    quantitative_reference: "Actual drilled intervals/geometry and residual quantities attributable per reference flow"
  - id: well_completion
    name: "Casing sealing and wellhead integration"
    inclusion: "required"
    inclusion_condition: "Always; actual design may interleave casing/seal work with drilling"
    role: "Independent assembly/integration of supplied casing/couplings/grout/cap/seals to accepted well-completion gate before development; defects return here"
    quantitative_reference: "Actual installed casing/seal/wellhead quantities per reference flow"
  - id: develop_accept
    name: "Development temporary testing disinfection and civil acceptance"
    inclusion: "required"
    inclusion_condition: "Always; actual development/test/disinfection/sample protocols; failures repeat or close"
    role: "Independent treatment responsibility: completed-but-undeveloped/undisinfected civil well → actual fines removal/development/initial disinfection and tests → qualified accepted pump-free civil well handoff; distinct captured residuals and actual releases; later duty owners"
    quantitative_reference: "1 item accepted civil well per reference flow"
process_inventory:
  - id: bore_removal
    label: "Formation drilling and resource-removal responsibility"
    inputs:
      product:
        - row_id: drill_injected_water
          role: "Externally supplied water injected during air drilling"
          name: "Externally supplied water injected during air drilling"
          flow_type: "product"
          property_unit: "Mass 93a60a56-a3c8-11da-a746-0800200b9a66 / kg"
          description: "Water supplied across the job boundary for dust/cuttings control or drilling is a purchased product. Record actual source and quality; groundwater entrained by drilling is a separate resource withdrawal. Do not assume a mud-rotary fluid inventory. Range evidence need: Actual injection setting, duration, metered receipts/use and water quality are needed; no universal water-to-depth or fuel ratio is supported."
          amount:
            expression: "Record separately metered injected-water mass by source; actual volume requires temperature and documented density before kg conversion."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
