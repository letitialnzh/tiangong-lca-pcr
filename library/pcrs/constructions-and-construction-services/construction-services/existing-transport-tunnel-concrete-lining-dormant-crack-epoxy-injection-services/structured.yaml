allocation_rules:
  - rule_id: accepted_campaign
    applies_to: "crack_treatment"
    rule: "Directly assign finite campaign and batch inputs, outputs, setup/changeover, purge/cleaning and all failed injection/cure/test/rework to the accepted unique crack path L. Reject unresolved or zero-L jobs as incomplete, not zero-burden service. Branches/repeat passes never multiply output. Shared campaign events have one owner; use measured causal time/activity for different jobs with documented reconciliation, never resin value as default allocation."
    source_ids: []
  - rule_id: return_and_stock_burden
    applies_to: "resin_a; hardener_b; seal_paste; injection_ports; cleaner; water; consumables; fuel; product_returns; port_returns"
    rule: "Track separate physical and upstream-burden ledgers by lot/state/period: opening stock retains its carried burden, new gross receipts introduce matching burden, outward returns transfer declared actual burden, and retained closing stock carries burden forward without outward exchange. Job-assigned burden plus outgoing transfer burden plus closing burden must reconcile opening plus new burden. Internal issue is not an additional purchased receipt. No automatic return/recycling/avoided-production credit."
    source_ids: []
  - rule_id: shared_asset_life
    applies_to: "equipment_share"
    rule: "For each asset enumerate all jobs, nodes and periods, including this node; use measured compatible service driver to assign one complete-life burden share. Completed lives use observed service and retirement; in-service lives combine observed history and justified prospective remaining service/replacements/termination/EOL, labelled and sourced with uncertainty, sensitivity and updates. Missing scope/denominator blocks finalisation. Do not duplicate direct operating fuel, separately counted spare/consumable/tool coverage or another asset/rental dataset."
    source_ids: []
  - rule_id: period_and_reject
    applies_to: "crack_treatment"
    rule: "Link preparation, batches, injection, cure/protection, verification and defect closure to actual periods and the same job. Unused returned products retain identity/custody; failed or discarded materials take actual product-return, rework or waste paths. No rejected material or incomplete repair contributes accepted length. Common equipment and stock crossing periods carry one linked burden balance, not repeated charges."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "crack_treatment"
      flow_role: "accepted crack and qualification"
      record_type: "survey; owner acceptance"
      raw_fields: "job_id; period_id; tunnel_use; lining_state; structural_role; cause_movement_assessment; segment_id; branch_id; start_end_coordinates_m; unique_segment_length_m; crack_width_mm; crack_depth_mm; geometry_uncertainty_mm; moisture_state; standing_water_observation; hydrostatic_pressure_state; approved_method_revision; current_regional_PDS_revision; current_label_revision; current_SDS_revision; product_suitability_approval; seal_cure_record; batch_id; injection_pressure_value; injection_pressure_unit; injection_pressure_tolerance; injection_volume_value; injection_volume_unit; injection_duration_value; injection_duration_unit; substrate_temperature_C; ambient_temperature_C; cure_start_end_UTC; cure_duration_h; cure_condition_records; verification_method; verification_result_value; verification_result_unit; acceptance_threshold_value; acceptance_threshold_unit; acceptance_tolerance; owner_criteria_source; defect_id; defect_closure; acceptance_signatory; accepted_date; accepted_length_L_m"
      collection_method: "Survey crack map and dimensions before work and accepted segments after required verification. Record actual clean/sound/ported/cured-seal prestate, dosing/injection records and product-specific cure conditions; trace owner thresholds/tolerances with units to dated sources. Sum union of accepted unique segments L; exclude unaccepted portions/repeats and retain their burdens."
      unit: "m; mm; actual pressure/volume/time units; C; h"
      frequency: "Each segment, batch and acceptance"
      temporal_coverage: "Qualification to signed acceptance, including failed/repeated work"
      site_scope: "Same bounded retained lining and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved map, calibration/uncertainty, dated method/product/owner criteria, signed acceptance and closed defects"
    - protocol_id: cp_material
      process_id: "crack_treatment"
      flow_role: "supplied materials and outward product returns"
      record_type: "lot mass/custody ledger"
      raw_fields: "job_id; period_id; batch_id; lot_id; concrete_identity; supplied_state; supplier_boundary; receipt_gross_kg; receipt_container_tare_kg; receipt_net_kg; opening_stock_kg; opening_stock_count_items; new_receipt_kg; new_receipt_count_items; internal_issue_kg; internal_issue_count_items; dose_A_volume_value; dose_A_volume_unit; dose_B_volume_value; dose_B_volume_unit; volume_value; volume_unit; density_value; density_unit; density_temperature_C; density_state; density_source_revision; count_items; unit_mass_kg_per_item; used_kg; actual_dosed_kg; outward_return_kg; outward_return_count_items; return_custody_receipt; closing_stock_kg; closing_stock_count_items; installed_retained_kg; installed_retained_count_items; captured_waste_kg; captured_waste_count_items; port_disposition_event_id; port_disposition_record; uncontained_release_kg; reaction_mass_terms_kg; opening_burden_record; new_burden_record; return_burden_transfer; closing_burden_carry_forward; included_packaging_services"
      collection_method: "Weigh gross and tare before netting any return, or use traceable supplier net contents with receipt checks. Keep separate identity/state lot ledgers and actual component volume doses; collect density/temperature/state/units for every volume conversion and unit mass for count conversion. Reconcile opening stock and new receipts without counting an opening-stock internal issue as a second input. Actual dose/used quantity is intermediate activity, not an additive final destination; installed/retained quantities exclude all separately recorded return, waste and release outlets. Reconcile mass-based material returns in kg and expendable-port returns in item with actual matching gross inputs and outward custody; keep closing stock/burden separate. Record discarded expendable-port item from actual event/disposition evidence, never infer discarded count from contaminated mixed-waste kg; keep the waste mass separately measured or supported by matching actual per-port mass. Material destination terms require records, not assumed losses."
      unit: "kg; item; actual volume and density units; C"
      frequency: "Each receipt, issue, batch, return and closing stock"
      temporal_coverage: "All job periods with opening/closing balances"
      site_scope: "Each actual material/lot and supplier gate"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scales, supplier actual labels/SDS/density evidence, custody receipts and physical/upstream-burden reconciliation"
    - protocol_id: cp_utilities
      process_id: "crack_treatment"
      flow_role: "electricity fuel and purchased air"
      record_type: "meter; fuel and air ledger"
      raw_fields: "job_id; period_id; batch_id; equipment_id; utility_identity; supplier_boundary; meter_start_kWh; meter_end_kWh; nonjob_kWh; service_time_h; power_kW; fuel_opening_kg; fuel_gross_receipt_kg; fuel_container_tare_kg; fuel_net_receipt_kg; fuel_closing_kg; fuel_unused_return_kg; fuel_captured_waste_kg; fuel_uncontained_wholefluid_kg; fuel_other_outlet_kg; fuel_volume_value; fuel_volume_unit; fuel_density_value; fuel_density_unit; fuel_temperature_C; fuel_state; fuel_density_source; incident_total_spill_kg; purchased_air_volume_m3; air_pressure_value; air_pressure_unit; air_temperature_C; air_reference_conditions; air_quality; air_supply_boundary; factor_source_revision"
      collection_method: "Read actual circuits/meters for injection, mixing, access, ventilation and cure protection. For shared loads use measured service time/load and documented causal attribution; reconcile entire run. Fuel gross inputs/outward outlets determine burned activity; incident total only audits mutually exclusive partition. Purchased-air reference conditions and local-compressor boundary avoid double supply."
      unit: "kWh; h; kW; kg; actual volume/density/pressure units; C; m3"
      frequency: "Each meter interval, fuel transfer, batch and incident"
      temporal_coverage: "Setup through closure including idle/cure and failed work"
      site_scope: "Actual equipment circuits and fuel/air suppliers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, measured driver, stock/custody/outlet reconciliation and actual supply conditions"
    - protocol_id: cp_transport
      process_id: "crack_treatment"
      flow_role: "freight service"
      record_type: "cargo and route leg records"
      raw_fields: "job_id; period_id; leg_id; cargo_identity; vehicle_mode; provider; gross_cargo_container_kg; container_tare_kg; net_cargo_kg; actual_distance_km; loading_share; empty_leg_treatment; outward_return_link; waste_transfer_link; included_delivery_boundary"
      collection_method: "Pair actual net cargo with actual route distance for each leg; disclose loading/shared-leg and empty-travel method. Verify whether supplied product or receiver treatment already includes this transport and retain one owner."
      unit: "kg; km; kg*km"
      frequency: "Each actual leg"
      temporal_coverage: "All deliveries, returns and wastes for the job"
      site_scope: "Actual origin/destination and provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighbills, custody records, route evidence and supplier boundary check"
    - protocol_id: cp_assets
      process_id: "crack_treatment"
      flow_role: "complete-life equipment shares"
      record_type: "asset service and burden history/scenario"
      raw_fields: "job_id; asset_id; asset_configuration; consuming_job_id; consuming_node_id; consuming_period_id; service_driver_unit; job_service; all_consumer_observed_service; future_remaining_service; complete_life_service; manufacture_burden_scope; maintenance_history; replacement_history; observed_retirement_EOL; future_replacement_scenario; future_termination_EOL_scenario; forecast_source; forecast_uncertainty; sensitivity_cases; excluded_direct_fuel; excluded_spares_consumables_tools; rental_included_scope; update_trigger"
      collection_method: "Record injection/mixing, compressor, access/protection and ventilation assets separately and enumerate every consumer/period. Use compatible measured causal service units; obtain complete-life manufacture/maintenance/replacement/EOL coverage with observed and justified future portions explicitly distinguished. Document rental scope and remove overlaps; test denominator uncertainty and update when evidence changes."
      unit: "item equivalent; actual service-driver unit"
      frequency: "Each asset service interval and scenario update"
      temporal_coverage: "Complete observed life or observed history plus justified prospective remaining life"
      site_scope: "All consuming jobs/nodes/periods of each asset"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset registers, service logs, burden dataset scope, observed retirement or justified sourced future scenarios; incomplete coverage/denominator blocks finalisation"
    - protocol_id: cp_waste
      process_id: "crack_treatment"
      flow_role: "actual waste exits"
      record_type: "net weights; receiver records"
      raw_fields: "job_id; period_id; batch_id; incident_id; waste_identity; material_state; wet_dry_basis; composition; contamination; container_gross_kg; container_tare_kg; net_waste_kg; water_content_kg; wastewater_volume_value; wastewater_volume_unit; wastewater_density_value; wastewater_density_unit; wastewater_temperature_C; wastewater_state; concentration_value; concentration_unit; receiver; treatment_gate; custody_transfer; included_transport"
      collection_method: "Segregate concrete debris, cured/uncured epoxy/seal/cleaner residues, wipes/filters, wastewater and packaging/removed ports by actual identity/state and receiver. Weigh gross/tare; water and contaminants are explicit; convert volume only with evidenced density/state/temperature. Verify receiver and included transport, keeping actual outward product returns and environmental releases separate."
      unit: "kg; actual volume/density/concentration units; C"
      frequency: "Each removal, container and custody transfer"
      temporal_coverage: "Entire job including failures and cleanup"
      site_scope: "Actual producing node and destination"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale evidence, composition/moisture records, signed receiver transfers and treatment boundary"
    - protocol_id: cp_emissions
      process_id: "crack_treatment"
      flow_role: "direct and incident identified constituent releases"
      record_type: "measurement; activity-factor; incident balance"
      raw_fields: "job_id; period_id; batch_id; incident_id; concrete_substance; CAS_or_identity; receiving_medium; particle_size_basis; measurement_value; measurement_unit; sampling_duration_h; instrument_calibration; emission_activity; activity_unit; emission_factor_value; emission_factor_unit; factor_source_revision; fuel_burned_kg; actual_SDS_revision; component_mass_fraction; composition_fraction_basis; composition_fraction_source_revision; medium_fate_fraction; fate_fraction_basis; fate_fraction_source_revision; incident_constituent_measured_kg; retained_kg; captured_kg; reaction_terms_kg; incident_total_kg; recovered_product_kg; captured_waste_kg; uncontained_wholefluid_kg; liquid_volume_value; liquid_volume_unit; liquid_density_value; liquid_density_unit; liquid_temperature_C; liquid_state; host_moisture_kg; weather_water_kg; balance_uncertainty_kg"
      collection_method: "Identify substance and medium before elementary exchange; use actual measurements or compatible documented species-specific activity/factor and control conditions. Partition each fluid incident into recovered product, captured waste and uncontained whole fluid only in the physical ledgers; do not deduct total again. For elementary exchanges use actual measured released constituent kg or whole-fluid kg times evidenced constituent mass fraction and medium-specific fate fraction, retaining fraction basis/source and uncertainty. Whole formulation is not an elementary exchange. Give each substance/medium/event one owner, exclude fluid_release incident constituents from direct_species, and prevent whole-fluid/partial-species double counting. Separate supplied water, dry solids, retained-host moisture and evidenced weather terms; investigate unknown residual rather than assign emission."
      unit: "kg; actual activity/factor/measurement/volume/density units; C; h"
      frequency: "Each relevant batch/incident and emission measurement period"
      temporal_coverage: "Full job and actual emission duration"
      site_scope: "Actual node and receiving medium"
      aggregation_rule: "per reference flow"
      quality_evidence: "SDS/composition, factor applicability or measurement QA, capture/recovery records and uncertainty-qualified balance"
  calculation_rules:
    - id: accepted_union
      applies_to: "accepted_crack_repair"
      rule: "L = length of union of accepted unique crack segments in m; normalized reference output amount = 1 m; exclude rejected/incomplete segments and repeat passes."
      inputs:
        - cp_acceptance
        - "accepted segment map"
      output: "L m and 1 m reference service"
      source_ids: []
    - id: job_intensity
      applies_to: "resin_a; hardener_b; seal_paste; injection_ports; cleaner; water; consumables; electricity; fuel; purchased_air; product_returns; port_returns; concrete_debris; epoxy_waste; wastewater; packaging_waste"
      rule: "For each separately identified exchange, intensity = attributable actual campaign amount / L; L is accepted unique crack path in m. Keep campaign failed/repeated work in numerator; no output if L is zero."
      inputs:
        - cp_acceptance
        - cp_material
        - cp_utilities
        - cp_waste
        - "actual exchange amounts"
      output: "Each actual exchange unit per 1 m accepted crack path"
      source_ids: []
    - id: net_and_volume
      applies_to: "resin_a; hardener_b; seal_paste; cleaner; water; fuel; wastewater; fluid_release"
      rule: "Net mass = gross mass - actual container/vehicle tare before outward return deduction. When required, mass kg = actual volume times identity/state/temperature-specific density with evidenced unit conversion; count mass = actual count times measured matching unit mass. Volume dosing ratio is checked in its original units, never assumed to be a mass ratio."
      inputs:
        - cp_material
        - cp_utilities
        - cp_waste
        - cp_emissions
        - "actual density and units"
      output: "Traceable net mass and actual original dosing record"
      source_ids: []
    - id: material_custody
      applies_to: "resin_a; hardener_b; seal_paste; injection_ports; cleaner; water; consumables; product_returns; port_returns"
      rule: "For each lot/state in consistent physical units, opening stock + new gross net-of-tare receipts = installed/retained material + outward unused returns + captured waste + actual uncontained whole-fluid release + retained closing stock + evidenced reaction/other terms, with uncertainty stated. Installed/retained material excludes every separately recorded loss/outlet; actual dosed/used quantity is intermediate activity, never an additive final destination. Opening-stock internal issues are movements, not additional receipts. For expendable ports reconcile the same mutually exclusive destinations in item. Opening burden + new burden = job-assigned burden + outward transferred burden + closing carried-forward burden."
      inputs:
        - cp_material
        - cp_waste
        - cp_emissions
        - "custody and burden ledgers"
      output: "Physical and upstream-burden closure by lot/period"
      source_ids: []
    - id: fuel_activity
      applies_to: "fuel; direct_species; fluid_release"
      rule: "Burned fuel kg = opening fuel + gross net-of-tare new fuel - closing fuel - unused outward return - captured fuel waste - uncontained whole-fluid fuel - evidenced other nonburned outlet. Incident total spill = recovered product + captured waste + uncontained whole fluid and is not deducted again; record each mutually exclusive outlet once."
      inputs:
        - cp_utilities
        - cp_waste
        - cp_emissions
      output: "Burned kg and reconciled fluid outlets; intensity divided by L"
      source_ids: []
    - id: freight_activity
      applies_to: "transport"
      rule: "For each leg, transport intensity = actual net cargo kg times actual km times evidenced job share / L. Preserve compatible provider boundary and kg*km reference; conversion from t*km multiplies by 1000 only with confirmed support."
      inputs:
        - cp_transport
        - cp_acceptance
      output: "kg*km per 1 m accepted crack path"
      source_ids: []
    - id: asset_fraction
      applies_to: "equipment_share"
      rule: "For each asset, intensity item equivalent = (attributable job service / complete-life all-consumer service) / L; multiply the fraction by matching complete-life manufacture/maintenance/replacement/EOL burden. Service numerator and denominator use the same actual driver unit. Observed and justified future portions and overlaps remain explicit."
      inputs:
        - cp_assets
        - cp_acceptance
        - "complete-life burden scope"
      output: "Asset-specific equivalent fraction and burden per 1 m accepted crack path"
      source_ids: []
    - id: species_release
      applies_to: "direct_species"
      rule: "For each routine substance/medium/event, intensity kg = actual measured release kg / L, or actual compatible activity times documented substance-specific factor times applicable uncaptured fraction / L. Use burned fuel activity when factor requires combustion; account retention/capture/reaction explicitly without assumed 100% solids zero. Exclude incident constituent exchanges assigned to fluid_release; one owner per substance/medium/event, never a generic mixed-formulation elementary exchange."
      inputs:
        - cp_emissions
        - cp_utilities
        - cp_acceptance
        - "actual factor/measurement and controls"
      output: "Species/medium-specific kg per 1 m accepted crack path"
      source_ids: []
    - id: fluid_partition
      applies_to: "fluid_release"
      rule: "Physical ledger only: uncontained whole-fluid kg = incident total kg - recovered product kg - captured waste kg, with mutually exclusive measured outlets and uncertainty. For each identified constituent/medium elementary exchange, intensity kg = measured released constituent kg / L, or uncontained whole-fluid kg times evidenced constituent mass fraction times actual medium-specific release/fate fraction / L. Retain actual fraction basis/source and uncertainty; whole formulation stays audit-only, reported species subset is not whole-fluid total, and no duplicate direct_species or whole-fluid/partial-species impact exchange is allowed."
      inputs:
        - cp_emissions
        - cp_waste
        - cp_material
        - cp_utilities
        - cp_acceptance
      output: "Whole-fluid physical ledger only; identified constituent/medium kg per 1 m accepted crack path"
      source_ids: []
  data_quality_requirements:
    - id: gate_quality
      applies_to: "accepted_crack_repair"
      requirement: "Trace actual dormant cause/movement assessment, sound compatible substrate and moisture/pressure prestate, actual seal cure and product suitability; record injection/cure/verification units, actual thresholds/tolerances and dated owner source. All defects closed before signed length acceptance."
      evidence: "cp_acceptance; sika-sikadur52-us-2014"
    - id: separate_identity
      applies_to: "all inventory rows"
      requirement: "Every actual material, utility, waste and emission needs concrete identity/state/supplier or receiver, actual property/unit and verified final UUID. Conditional cards require disaggregation before dataset finalisation; unresolved is not verified absence."
      evidence: "Actual labels/SDS/custody and detail/support verification"
    - id: range_quality
      applies_to: "all inventory rows"
      requirement: "Collect actual geometry, uptake, batch/setup/purge/waste/utility and shared-equipment evidence before proposing quantitative intensity ranges. Exact 1 m definition is not an empirical yield prior; example laboratory data are not universal field performance or consumption."
      evidence: "Linked protocols and range evidence need on every card"
    - id: closure_quality
      applies_to: "all inventory rows"
      requirement: "Reconcile physical, custody and upstream-burden balances; report measurement precision, missingness and uncertainty. No generic residual emission, closing-stock output, net-then-return double count or hidden duplicate supplier/asset/service boundary."
      evidence: "cp_material; cp_utilities; cp_waste; cp_emissions; cp_assets"
    - id: life_quality
      applies_to: "equipment_share"
      requirement: "All consumer periods and complete-life coverage/denominator require evidence. In-service future scenarios must be justified, labelled and sensitivity-tested, with update triggers; missing coverage blocks finalisation."
      evidence: "cp_assets"
    - id: period_quality
      applies_to: "crack_treatment"
      requirement: "Preserve repair campaign, mix/injection batch, failed/rework links and preparation/injection/cure/acceptance dates; reconcile stock/asset carry across periods and keep one owner for shared event burdens."
      evidence: "All node protocols"
validation_rules:
  - rule_id: validate_scope
    applies_to: "crack_treatment"
    rule: "Reject scope crossing to new/major replacement, moving/hydrostatic-pressure cracks, PU waterstop or water/mining tunnels; retained host receives no new lining burden or avoided replacement credit."
    source_ids:
      - un-cpc3-2025
      - sika-sikadur52-us-2014
  - rule_id: validate_gate
    applies_to: "accepted_crack_repair"
    rule: "Require recorded qualified prestate, actual compatible regional materials/method, surface seal cure before injection, complete actual injection/cure records and owner-sourced verification criteria/results/tolerances with units, defect closure and signed acceptance. Lab strength or elapsed time alone is not acceptance."
    source_ids:
      - sika-sikadur52-us-2014
  - rule_id: validate_length
    applies_to: "accepted_crack_repair"
    rule: "Recompute union of accepted unique paths and L; count each branch once, never tunnel length, ports/faces/passes or unresolved rejects. Confirm every exchange uses same positive accepted-L denominator with all failed/setup/purge work retained once."
    source_ids: []
  - rule_id: validate_custody
    applies_to: "all inventory rows"
    rule: "Audit gross net-of-tare receipts before returns, internal movements, outward custody, retained closing stock and burden carry-forward. Verify actual whole-fluid fuel outlets and burn calculation without incident double subtraction; capture/waste/elementary releases remain distinct."
    source_ids: []
  - rule_id: validate_assets
    applies_to: "equipment_share"
    rule: "Verify every shared asset consumer/period, complete-life scope and compatible measured service driver; observed history plus justified future scenario for in-service assets includes replacement/termination/EOL and uncertainty/sensitivity/updates. Missing coverage or denominator blocks finalisation; remove overlapping direct fuel/spare/tool/rental coverage."
    source_ids: []
  - rule_id: validate_identity_and_emissions
    applies_to: "all inventory rows"
    rule: "Verify concrete identities/properties/units before final dataset exchange binding; do not substitute near-match resin manufacture/new tunnel/PU for repair service. Check actual species/medium and capture/retention/reaction, fluid partition and weather/host moisture; 100% solids never proves zero release. Record missing ranges, UUIDs and material evidence explicitly."
    source_ids: []
  - rule_id: validate_campaign
    applies_to: "crack_treatment"
    rule: "Trace all batches and preparation/injection/cure/verification periods, setup/changeover and rejects to this node and actual rework/waste/product-return destinations. Reject unresolved failures as accepted output; shared-job causal attribution reconciles once across periods."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground bounded repair-service data package with downstream process/lifecyclemodel projections"
  downstream_use: "secondary_dataset; background_dataset for actual compatible tunnel maintenance service"
  allowed_use: "Matching accepted dormant-crack epoxy injection repair of retained transport tunnel concrete lining with declared geometry/state/material/gate"
  excluded_use: "New tunnel/lining, active/hydrostatic cracks, PU leakage stopping, major replacement/strengthening, generic resin manufacture, tunnel operation or unsupported lifetime/structural/watertightness claims"
  required_metadata: "Location/road-rail tunnel/lining; cause and dormant qualification; segment/branch/width/depth; actual material and supply state; dated regional instructions and owner method/criteria; campaign/batch/periods; accepted L and signatory; utilities/transport/receiver/asset boundaries"
  required_quality_disclosure: "Unresolved concrete UUIDs and evidence, actual intensity/Range uncertainty, missingness, stock/custody and burden balances, failed/rework work, actual emissions/medium and shared-asset observed/future scenarios with sensitivity"
  update_trigger: "Change in approved materials/method/gate, crack movement or moisture/pressure state, accepted length/geometry, supplier/utility/receiver boundary, emission evidence, asset service/life scenario or corrected records"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UN Statistics Division, CPC Version 3.0 explanatory notes, 30 June 2025, printed p. 285; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Transport tunnel construction/repair classification scope and adjacent water-tunnel exclusion"
  - id: "sika-sikadur52-us-2014"
    type: "handbook"
    reference: "Sika US, Sikadur52 Product Data Sheet Edition 9.23.2014, both pages, currently linked at US product page; https://usa.sika.com/dam/dms/us01/0/Sikadur%2052.pdf"
    used_for: "Two-component low-viscosity epoxy route; clean/sound dry/damp without standing water; actual volume dosing; ports and cured surface seal before pressure injection; no thinning/hydrostatic-pressure injection; site-specific current instructions requirement; laboratory data limitations"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:7eb2d7abd0747c1c4c67526ba0fefe03aef808bb62927d11b6a800b0d457a949"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6641"
      family: "system_boundary"
      span:
        start:
          offset: 6641
          line: 60
          column: 1
        end:
          offset: 27153
          line: 297
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Existing sound retained concrete tunnel lining and engineer-qualified dormant crack with documented cause/movement, dimensions, access and moisture/pressure state; preparation is included, not assumed completed |\n| starting_condition_role | Retained host condition; no new lining exchange or replacement credit |\n| product_classification_scope | Bounded transport tunnel repair service; water/mining tunnel works excluded |\n| recursive_input_rule | If a subcontract supplies the same-category repair, record its actual bounded accepted service and declared boundary; use its upstream dataset without recursively recreating identical operations or duplicating our materials/utilities |\n| upstream_dataset_requirement | Actual supplied component/consumable, utility, transport, asset and waste-treatment datasets require matching product/state/geography/period and declared included packaging/service boundary |\n| disclosure | Declare retained host, all preparation and test work, campaign/batch/period boundary, actual supplier gates, custody, transport legs, shared assets, rejects and any omitted/unmeasured exchanges with consequences |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `host_and_route` | crack_treatment | Own actual incremental preparation/removal, minor job-caused repair and protection through signed acceptance. Keep retained lining outside new concrete production; no avoided replacement credit. Material treatment, seal, mixing, cure and inspection form one integrated job unless an actual independent physical handoff is evidenced. | un-cpc3-2025; sika-sikadur52-us-2014 |\n| `qualification` | crack_treatment | Require sound clean compatible substrate and engineer-approved dormant crack; document contaminants and removal, dry/damp state without standing water, no hydrostatic-pressure injection, approved ports/surface seal and verified seal cure before injection. Actual regional instructions and owner approval govern suitability and application limits. | sika-sikadur52-us-2014 |\n| `job_completeness` | crack_treatment | Include access, protection, ventilation, compressor/purchased air, dosing/mixing, injection, purge, cleaning, cure protection and testing. Enumerate campaign and mix batches, setup/changeover, rework and all periods until acceptance; unaccepted work retains burdens. | sika-sikadur52-us-2014 |\n| `custody_boundary` | crack_treatment | Record gross net-of-tare receipts/issues before actual outward product returns; retained closing stock is no outward product exchange. Reconcile opening stock burden, purchases, internal issues, use, returns and closing carried-forward burden. Separate product returns, wastes and direct releases; supplier-included packaging/service cannot be charged twice. |  |\n| `asset_boundary` | equipment_share | Include complete-life manufacture, maintenance, replacements and end-of-life burdens of actual injection/mixing/access/ventilation/compression/protection assets. Enumerate all nodes/jobs/period consumers; exclude separately inventoried fuel, consumables/spares and tools from duplicated asset coverage. |  |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Actual supplied cleaning or purge chemical (`cleaner`)\n\nProcess / prospective direction / type: `crack_treatment` / `inputs` / `product`.\n\nConditional: record each actual compatible cleaner/purge formulation independently by supplied wet state and intended job use. Distinguish equipment cleaning from concrete preparation; do not thin the injection resin. Range evidence need: Need actual approved cleaner identity/SDS, supplied quantity, retained/captured and waste/release records; no zero-solvent assumption from 100% solids.\n\n- Collection subject: Actual supplied cleaning or purge chemical\n- Flow property / unit: Mass / kg\n- Amount rule: Actual gross net-of-tare cleaner or purge material supplied over accepted L, with destination/outlets reconciled.\n- Value mode: Foreground record (`foreground_record`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Collected record (`collected_record`)\n- Collection protocol: `cp_material`\n- Sources: `sika-sikadur52-us-2014`\n\n#### Collection requirement: Actual preparation, cleanup and containment consumables (`consumables`)\n\nProcess / prospective direction / type: `crack_treatment` / `inputs` / `product`.\n\nConditional: expand into separately identified abrasive, wipe, filter, masking/protection, spill absorbent, cleanup/containment supply or minor repair materials actually supplied; heterogeneous materials never become one summed exchange. Avoid duplication with equipment maintenance or supplier coverage. Range evidence need: Need actual preparation method, protection/cleanup/spill-containment plan, separate material receipts/issues and destinations; cannot assign a common material factor.\n\n- Collection subject: Actual preparation, cleanup and containment consumables\n- Flow property / unit: Mass / kg\n- Amount rule: Actual gross net-of-tare amount of each distinct consumable over accepted L.\n- Value mode: Foreground record (`foreground_record`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Collected record (`collected_record`)\n- Collection protocol: `cp_material`\n\n#### Collection requirement: Actual purchased electricity (`electricity`)\n\nProcess / prospective direction / type: `crack_treatment` / `inputs` / `product`.\n\nMeter injection/mixing, access, ventilation, lighting, cleaning and on-site compression electricity attributable to this campaign. Expand actual supply boundaries/providers separately. Range evidence need: Need actual circuits, meter intervals, equipment load evidence and shared-time records including cure protection and failed work; Energy support must be verified for the actual exchange.\n\n- Collection subject: Actual purchased electricity\n- Flow property / unit: Energy / kWh\n- Amount rule: Actual attributable purchased electricity over accepted L, subtracting separately measured non-job loads once.\n- Value mode: Foreground record (`foreground_record`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Collected record (`collected_record`)\n- Collection protocol: `cp_utilities`\n\n#### Collection requirement: Actual supplied fuel whole-fluid input (`fuel`)\n\nProcess / prospective direction / type: `crack_treatment` / `inputs` / `product`.\n\nConditional: record each actual fuel formulation separately. Use gross net-of-tare boundary input when unused returns/wastes/releases occur; derive burned fuel separately using mutually exclusive outlets. Do not treat total incident spill as another deduction. Range evidence need: Need actual fuel identity, gross quantity, density/state/temperature for volume conversion, burn and outlet records; no universal consumption or fuel factor.\n\n- Collection subject: Actual supplied fuel whole-fluid input\n- Flow property / unit: Mass / kg\n- Amount rule: Actual gross supplied fuel mass over accepted L with opening/closing stock, outward unused fuel and captured/uncontained whole-fluid outlets reconciled; combustion activity is a separate balance result.\n- Value mode: Foreground record (`foreground_record`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Collected record (`collected_record`)\n- Collection protocol: `cp_utilities`\n\n#### Collection requirement: Actual attributable freight transport service (`transport`)\n\nProcess / prospective direction / type: `crack_treatment` / `inputs` / `product`.\n\nConditional: expand each actual cargo/vehicle/mode/route leg with provider and included-boundary evidence, covering deliveries, true returns and waste movements once. Empty travel and worker/access service require actual separate treatment rather than invented cargo. Range evidence need: Need actual cargo net-of-tare masses, distances, loading and provider boundaries; no universal haul distance.\n\n- Collection subject: Actual attributable freight transport service\n- Flow property / unit: mass*distance / kg*km\n- Amount rule: Sum actual leg net cargo kg times actual leg km attributable to this job, per accepted L; do not duplicate supplier-included delivery or waste treatment transport.\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_transport`\n\n#### Collection requirement: Actual complete-life equipment service share (`equipment_share`)\n\nProcess / prospective direction / type: `crack_treatment` / `inputs` / `product`.\n\nExpand each actual injection pump/mixer, compressor, access/protection and ventilation asset into its own matched service share. No physical new machine enters solely because a burden fraction is attributed. Range evidence need: Need actual asset identities, complete-life observed or observed-plus-justified-future denominator, manufacture/maintenance/replacements/EOL coverage and uncertainty; missing evidence blocks finalisation.\n\n- Collection subject: Actual complete-life equipment service share\n- Flow property / unit: Count / item\n- Amount rule: For each asset, complete-life equivalent fraction equals attributable job service divided by all-consumer complete-life service, per accepted L; pair with matching complete-life burden scope.\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_assets`\n\n#### Collection requirement: Actual unused mass-based material or fuel returned outside job custody (`product_returns`)\n\nProcess / prospective direction / type: `crack_treatment` / `outputs` / `product`.\n\nConditional: expand true outward unused resin A, B, seal, cleaner, fuel and other mass-based materials into separate identity/state/custody exchanges. This is not retained closing stock, internal movement or waste. Match gross input identity and avoid netting before counting return. Range evidence need: Need signed custody receipts, matching gross input lot/identity/state, mass kg and actual destination; no universal return fraction.\n\n- Collection subject: Actual unused mass-based material or fuel returned outside job custody\n- Flow property / unit: Mass / kg\n- Amount rule: Actual net-of-tare mass kg of each unused material or fuel leaving job custody over accepted L; match its gross input identity/state and declared burden transfer. No return credit without declared burden treatment.\n- Value mode: Foreground record (`foreground_record`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Collected record (`collected_record`)\n- Collection protocol: `cp_material`\n\n#### Collection requirement: Actual unused expendable ports returned outside job custody (`port_returns`)\n\nProcess / prospective direction / type: `crack_treatment` / `outputs` / `product`.\n\nConditional: record each actual unused expendable port identity/configuration returned across the job custody boundary, matching injection_ports gross input. Retained stock, installed/removed waste ports and internal movements are separate. Range evidence need: Need signed outward custody receipts, matching gross input port identity/configuration and actual counts; no universal port return fraction.\n\n- Collection subject: Actual unused expendable ports returned outside job custody\n- Flow property / unit: Count / item\n- Amount rule: Actual count item of each unused expendable port leaving job custody over accepted L; match gross input identity and declared burden transfer without netting input first.\n- Value mode: Foreground record (`foreground_record`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Collected record (`collected_record`)\n- Collection protocol: `cp_material`\n\n#### Collection requirement: Actual captured concrete preparation debris (`concrete_debris`)\n\nProcess / prospective direction / type: `crack_treatment` / `outputs` / `waste`.\n\nConditional: collected debris from actual bounded preparation or minor job-caused remedies; retained host is not entirely demolished. Expand contaminated and clean destination-specific wastes separately. Range evidence need: Need actual preparation method, contamination/moisture, captured mass and receiver records; geometry is not proof of debris mass.\n\n- Collection subject: Actual captured concrete preparation debris\n- Flow property / unit: Mass / kg\n- Amount rule: Actual captured net debris mass over accepted L, excluding container tare and separately reported water.\n- Value mode: Foreground record (`foreground_record`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Collected record (`collected_record`)\n- Collection protocol: `cp_waste`\n\n#### Collection requirement: Actual discarded epoxy and cleaning residues (`epoxy_waste`)\n\nProcess / prospective direction / type: `crack_treatment` / `outputs` / `waste`.\n\nConditional: expand actual cured/uncured A/B/mixed resin, seal paste, purge residues, wipes and contaminated filters separately by state/composition and receiver. No single generic hazardous waste factor. Range evidence need: Need actual state/composition, net weights, batch/incident linkage and waste transfer acceptance; no universal reject or purge fraction.\n\n- Collection subject: Actual discarded epoxy and cleaning residues\n- Flow property / unit: Mass / kg\n- Amount rule: Actual outgoing net waste mass of each identity over accepted L; separate retained/captured material from direct environmental releases.\n- Value mode: Foreground record (`foreground_record`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Collected record (`collected_record`)\n- Collection protocol: `cp_waste`\n\n#### Collection requirement: Actual discarded supplied packaging and removed ports (`packaging_waste`)\n\nProcess / prospective direction / type: `crack_treatment` / `outputs` / `waste`.\n\nConditional: expand actual empty containers, packaging materials and discarded ports by material, residual contamination and receiver. Returned reusable packaging is an actual product return only when outward custody is documented. Range evidence need: Need actual packaging/port material, tare/residual separation, weights and custody/treatment evidence; no assumed packaging factor.\n\n- Collection subject: Actual discarded supplied packaging and removed ports\n- Flow property / unit: Mass / kg\n- Amount rule: Actual net outgoing mass of each packaging/removed-port waste over accepted L; do not re-charge manufacture already inside supplied-product dataset.\n- Value mode: Foreground record (`foreground_record`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Collected record (`collected_record`)\n- Collection protocol: `cp_waste`\n\n#### Collection requirement: Actual identified direct releases to environmental media (`direct_species`)\n\nProcess / prospective direction / type: `crack_treatment` / `outputs` / `elementary`.\n\nConditional: expand each identified measured or evidence-modelled substance and receiving medium, including actual fuel combustion, routine resin/cleaner releases and size-specific uncaptured dust. Incident constituents owned by fluid_release are excluded here; each substance/medium/event has one owner. Source 100% solids is not zero emission proof; no generic VOC/NOx umbrella UUID. Range evidence need: Need actual SDS/species, medium, fuel burned activity, compatible factor/measurement, capture and reaction basis; unknown mass residual is not automatic emission.\n\n- Collection subject: Actual identified direct releases to environmental media\n- Flow property / unit: Mass / kg\n- Amount rule: Actual species release mass over accepted L from measured records or explicitly evidenced species-specific activity/factor and capture/retention/reaction balance.\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_emissions`\n\n#### Collection requirement: Actual identified incident constituents released to environmental media (`fluid_release`)\n\nProcess / prospective direction / type: `crack_treatment` / `outputs` / `elementary`.\n\nConditional: expand each actual incident release into identified constituent/substance and receiving-medium elementary exchanges. Whole uncontained fuel, resin, cleaner or contaminated-water mass remains only the physical incident/material/fuel ledger. Derive constituent release from actual measured constituent mass or evidenced whole-fluid mass, actual composition fraction and medium-specific fate; a reported species subset is not total fluid. Each substance/medium/event is owned here once and excluded from direct_species. Range evidence need: Need actual incident mass/volume and density/state/temperature, recovery/capture, actual constituent fractions and fraction basis, medium/fate evidence or constituent measurements; no generic mixed-formulation elementary exchange or default release fraction.\n\n- Collection subject: Actual identified incident constituents released to environmental media\n- Flow property / unit: Mass / kg\n- Amount rule: For each identified incident constituent and medium, actual measured released constituent kg / L, or actual uncontained whole-fluid kg times evidenced constituent mass fraction times actual medium-specific release/fate fraction / L. Whole-fluid quantity is audit-only, never a generic elementary exchange; no whole-plus-partial-species or direct_species double count.\n- Value mode: Calculated value (`calculated_value`)\n- Specificity: Site-specific (`site_specific`)\n- Normalization basis: per reference flow\n- Basis kind: Reference flow (`reference_flow`)\n- Evidence kind: Calculated from collection (`calculated_from_collection`)\n- Collection protocol: `cp_emissions`\n\n"
