boundary_abstraction:
  declared_starting_condition: "Existing sound retained concrete tunnel lining and engineer-qualified dormant crack with documented cause/movement, dimensions, access and moisture/pressure state; preparation is included, not assumed completed"
  starting_condition_role: "Retained host condition; no new lining exchange or replacement credit"
  product_classification_scope: "Bounded transport tunnel repair service; water/mining tunnel works excluded"
  recursive_input_rule: "If a subcontract supplies the same-category repair, record its actual bounded accepted service and declared boundary; use its upstream dataset without recursively recreating identical operations or duplicating our materials/utilities"
  upstream_dataset_requirement: "Actual supplied component/consumable, utility, transport, asset and waste-treatment datasets require matching product/state/geography/period and declared included packaging/service boundary"
  disclosure: "Declare retained host, all preparation and test work, campaign/batch/period boundary, actual supplier gates, custody, transport legs, shared assets, rejects and any omitted/unmeasured exchanges with consequences"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted epoxy injection repair of dormant concrete transport tunnel lining crack"
    uuid: ""
  flow_property_ref:
    uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
  unit_group_ref:
    uuid: "838aaa22-0117-11db-92e3-0800200c9a66"
  reference_unit: "m"
  required_qualifiers:
    - "Tunnel road/rail use and location"
    - "crack segment/branch map and unique path method"
    - "width/depth with units and uncertainty"
    - "lining state and structural role"
    - "cause/movement assessment"
    - "moisture/pressure state"
    - "actual component and seal/port identities"
    - "approved method and dated regional instructions"
    - "injection pressure/time/volume units and tolerance source"
    - "cure records"
    - "verification method/threshold units and owner source"
    - "accepted length L and acceptance date"
reference_flows:
  []
measurement_rules:
  - id: unique_length
    applies_to: "reference product"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "L is the measured accepted unique treated crack path from cp_acceptance. Segment unions remove overlap and repeat injection; count branches once by approved map. Tunnel centreline length, ports, sides and passes do not multiply L. No positive reference output if L is zero or acceptance incomplete."
  - id: component_conversion
    applies_to: "resin_a; hardener_b; seal_paste; cleaner; water; fuel"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use net material mass after actual container/vehicle tare, before outward returns. Convert actual supplied volume only with material-specific measured or supplier-evidenced density at recorded temperature/state and compatible units. Record A/B volume dosing independently; a volume ratio is not a mass ratio. Geometry alone does not prove void volume or absorbed resin."
  - id: utilities_units
    applies_to: "electricity; purchased_air; transport"
    required_property_ref:
      name: "Actual exchange property"
      uuid: ""
    required_unit: "kWh; m3; kg*km"
    rule: "Preserve metered energy units and supply boundary. Purchased-air volume must record pressure, temperature, reference conditions and unit; on-site compressor energy and purchased air are mutually exclusive for the same air. Transport uses net cargo kg times actual km; t*km equals 1000 kg*km only with compatible support and units."
  - id: emission_units
    applies_to: "direct_species; fluid_release"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record identified substance, receiving medium, actual measured/modelled basis and capture/retention/reaction terms. Separate whole uncontained fluid from partial reported species; 100% solids does not establish zero emissions. Unknown residual is not an emission."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
