      applies_to: "all_processes"
      requirement: "Cover full batch, cleanup, changeover, stock, rejected and shared events; record conditional absence with evidence, never blank=zero."
      evidence: "Event ledger and reconciliations"
    - id: qualifiers
      applies_to: "accepted_tiled_floor"
      requirement: "Preserve ready-substrate, product, geometry, joint, cure and acceptance qualifiers; no unverified durability or bond-strength claim."
      evidence: "Design, product sheet and signed inspection"
    - id: screening
      applies_to: "all inventory rows"
      requirement: "Replace provisional ranges using independent reviewed sites/lots; the same lot maximum cannot validate itself. Report uncertainty and outliers."
      evidence: "Independent range review and data-quality statement"
validation_rules:
  - rule_id: area_gate
    applies_to: "accepted_tiled_floor"
    rule: "Require A > 0 and one accepted output. Rejected, unfinished and intermediate areas are excluded from A and final sales output."
    source_ids: []
  - rule_id: transfer_gate
    applies_to: "all_processes"
    rule: "Pair all tile, paste and floor transfers; reconcile stock and wet/dry balance without demanding water-losing hydrated paste equal dry powder."
    source_ids: []
  - rule_id: event_gate
    applies_to: "all_processes"
    rule: "Check run/batch linkage, rework paths, waste custody, shared consumer shares and single event ownership. Missing evidence fails completeness."
    source_ids: []
  - rule_id: identity_gate
    applies_to: "all inventory rows"
    rule: "Verify actual formulation, service gate, flow type, property/unit and emission compartment; do not relabel manufactured tile as service or guess sealant/dust identity."
    source_ids: []
  - rule_id: range_gate
    applies_to: "all inventory rows"
    rule: "Investigate broad-screen outliers using measurement evidence. Provisional screening bounds do not establish conformity, publication readiness or missing-flow zeros."
    source_ids: []
  - rule_id: validate_physical_slurry_stream
    applies_to: "all collected wastewater/slurry"
    rule: "A wastewater/slurry card denotes one actual physically unseparated liquid/solid mixture at one receiver gate. Independently collected liquids, separated solids or different treatment destinations require distinct actual exchanges; do not recombine them to fit this card. Mixture mass and constituent water/solids are nonadditive views."
    source_ids: []
  - rule_id: validate_release_coverage
    applies_to: "all_processes"
    rule: "Check event_release and all five node protocols for independently supported whole-event/source coverage, compatible concentration/carrier units and gas state, background correction, species/size/medium and the measured total or validated actual method. Reject sampler/room exposure mass as event total, air-exhaust calculation for another medium, duplicate capture correction and inferred-zero missing coverage; retain the gap before dataset finalization."
    source_ids:
      - epa-eiip-sample-source-flow
published_dataset_profile:
  dataset_role: "foreground_data_package; secondary_dataset"
  downstream_use: "Compatible process and lifecyclemodel projections; may become a background_dataset for the same declared installation gate after review"
  allowed_use: "Area-based interior ceramic floor thinset service with matching substrate, product, joint and acceptance qualifiers"
  excluded_use: "Manufactured tile production, wall/stone/epoxy routes, substrate/membrane work, building use and universal lifetime comparisons"
  required_metadata: "Geography/site; lot/date; accepted A; substrate supply gate; tile/mortar/grout grades; joint/sealant design; process mode; transfers; supplier/upstream links; shared resource ownership"
  required_quality_disclosure: "Measured/calculated coverage; absent/unknown exchanges; unresolved identities; provisional range status; allocation/stock/rework evidence; uncertainty; excluded upstream work"
  update_trigger: "Change in tile system, substrate gate, chemistry, joint design, technology, supplier instructions, site practice or material measurement evidence"
data_sources:
  - id: "mapei-floor-installation"
    type: "handbook"
    reference: "MAPEI Home, Floors (accessed 2026-10-12): https://mapeihome.com/flooranddecor/projects/floors/"
    used_for: "Route stages, actual-product instructions and joint/cleanup responsibilities; not universal amounts or times"
  - id: "laticrete-thinsets"
    type: "handbook"
    reference: "LATICRETE, Thinsets FAQ (accessed 2026-10-12): https://www.laticrete.com/support-and-training/downloads-and-faq/faqs/planning-a-job/thinsets"
    used_for: "Ready-substrate prerequisite and separate correction responsibility"
  - id: "epa-eiip-sample-source-flow"
    type: "official_guidance"
    reference: "US EPA, EIIP Volume II Chapter 2, Preferred and Alternative Methods for Estimating Air Emissions from Boilers, 8 January 2001, printed p. 2.4-13 / PDF page 53, equation 2.4-12. https://19january2021snapshot.epa.gov/sites/static/files/2015-08/documents/ii02.pdf"
    used_for: "Sample mass versus complete source-flow emission rate only; no boiler factor, control efficiency, installation emission default or non-air method adopted."
