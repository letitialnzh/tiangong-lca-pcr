  calculation_rules:
    - id: event_mass
      applies_to: "whole_tiles; cut_water; prepared_tiles; tile_return; tile_offcuts; cut_slurry; tile_packaging; mortar_powder; mortar_water; mortar_additives; fresh_mortar; mortar_mix_residue; mortar_wash_effluent; mortar_packaging; grout_powder; grout_water; grout_additives; fresh_grout; grout_mix_residue; grout_wash_effluent; grout_packaging; tiles_feed; mortar_feed; bond_consumables; bond_reject; grout_feed; finish_water; movement_joint_materials; finish_consumables; finish_residue; finish_effluent; finish_packaging"
      rule: "event_quantity = gross - tare for weighing; alternatively event_quantity = count * unit_mass or volume * density using the selected measurement_route and consistent units; select exactly one route per event and retain the measured product/wet-dry identity."
      inputs:
        - gross
        - tare
        - count
        - unit_mass
        - volume
        - density
        - measurement_route
      output: "event_quantity"
      source_ids: []
    - id: event_energy
      applies_to: "cut_electricity; mortar_electricity; bond_electricity; grout_electricity; finish_electricity"
      rule: "meter_delta = meter_end - meter_start; share = driver_node / drivers_total; event_quantity = meter_delta * share; drivers_total must be positive and sum of consuming shares must equal 1; dedicated meter uses share = 1; convert kWh by electricity_convert after attribution and retain MJ readings unchanged."
      inputs:
        - meter_start
        - meter_end
        - meter_unit
        - driver_node
        - drivers_total
        - shared_consumers
      output: "event_quantity"
      source_ids: []
    - id: event_area
      applies_to: "ungrouted_floor; floor_feed; accepted_tiled_floor"
      rule: "survey_area = length * width for each measured rectangular part; use surveyed area for other geometry; A = sum of gross surveyed plan parts - openings - unfinished_area - rejected_area; these deduction regions are mutually exclusive and each is deducted exactly once; for ungrouted_floor and floor_feed, event_quantity = internal_area at the respective actual transfer; for accepted_tiled_floor, event_quantity = A; never assign A to an internal handoff by default."
      inputs:
        - length
        - width
        - area
        - internal_area
        - plan_dimensions
        - gross_plan_parts
        - openings
        - unfinished_area
        - rejected_area
        - cp_bond_cure
        - cp_grout_finish
      output: "A; event_quantity"
      source_ids: []
    - id: event_service
      applies_to: "shared_service"
      rule: "service_hours = service_end - service_start in hours; share = driver_node / drivers_total; event_quantity = service_hours * share; enumerate every consumer and exclude already recorded operational energy; retain supplied service quantity when billed on a documented equivalent hour basis."
      inputs:
        - service_start
        - service_end
        - driver_node
        - drivers_total
        - shared_consumers
        - shared_asset
        - shared_period
      output: "event_quantity"
      source_ids: []
    - id: event_release
      applies_to: "cut_air_release; mortar_mix_release; grout_mix_release; bond_release; finish_release"
      rule: "For each actual species/size/receiving-medium event, event_quantity is the whole-event released mass in kg, not sampler catch or a room/worker exposure result. Select one supported route: event_quantity = measured_total_release_kg from a validated total_release_method with release_measurement_scope, source_boundary and source_coverage_evidence; or, for an actual air-source stream only, integrate representative background-corrected concentration converted to kg/m3 times actual_full_source_flow_m3_s times interval_duration_s over its covered intervals. The concentration * exhaust_volume * unit_conversion form is allowed only when exhaust_volume is the measured full environmental source-stream volume for exactly the same represented event/intervals, with matching gas_state_basis, concentration units, exhaust_volume_unit, background_correction_evidence and concentration_representativeness; use interval integration when concentration/flow varies. sampled_air_volume is sample-analysis evidence only, never the full exhaust volume. Diffuse or occupational/room sampling requires an independently validated whole-source flux bridge before it can establish event mass. For water/soil or another actual receiving medium, do not use an air-exhaust volume: require independently supported whole-event mass or a validated medium-specific alternative_release_method with original alternative_release_operands, compatible units, temporal/source coverage and uncertainty. Captured waste is not environmental release; an already controlled release receives no second capture deduction under control_factor_basis. Unknown occurrence, coverage, conversion or identity remains a data gap, never zero. Sum distinct real events once and normalize only through lot_to_area."
      inputs:
        - concentration
        - exhaust_volume
        - unit_conversion
        - gross
        - tare
        - species
        - particle_size
        - receiving_medium
        - release_measurement_scope
        - source_boundary
        - source_coverage_evidence
        - concentration_unit
        - concentration_representativeness
        - background_correction_evidence
        - gas_state_basis
        - exhaust_volume_unit
        - actual_full_source_flow_m3_s
        - interval_duration_s
        - sampled_air_volume
        - measured_total_release_kg
        - total_release_method
        - control_factor_basis
        - alternative_release_method
        - alternative_release_operands
      output: "event_quantity"
      source_ids:
        - epa-eiip-sample-source-flow
    - id: card_quantity
      applies_to: "all inventory rows"
      rule: "q_lot = sum of event_quantity for the same row_id and lot_id after same-node event ownership and unit checks; remove only duplicate records of the same physical event, retaining every actual repeated rework operation with its iteration; whole_tiles and tile_return use stock_draw, and mixing-material/paste/waste/release cards use their node card bridge, instead of a second event sum; measured transfers remain unforced; avoid adding recirculated water as fresh supply."
      inputs:
        - event_quantity
        - row_id
        - lot_id
        - cp_layout_cut
        - cp_mortar_mix
        - cp_bond_cure
        - cp_grout_mix
        - cp_grout_finish
      output: "q_lot"
      source_ids: []
    - id: mortar_card_bridge
      applies_to: "mortar_powder; mortar_water; mortar_additives; fresh_mortar; mortar_mix_residue; mortar_wash_effluent; mortar_mix_release"
      rule: "mortar_powder_lot = powder_issued; mortar_water_lot = mixing_water + wash_addition; mortar_additives_lot = additive_issued; fresh_mortar_lot = transferred_wetpaste; mortar_mix_residue_lot = captured_mix_residue + retained_captured_wash_residue; mortar_wash_effluent_lot = effluent_transferred; mortar_mix_release_lot = measured_mix_releases + measured_wash_release; water totals are fresh additions only, excluding recirculation; residues assigned to the mix-residue card are disjoint from transferred wash effluent; tag each concrete actual species release by its owned pool/event and count it once; these row-specific lot totals become q_lot for area division."
      inputs:
        - powder_issued
        - mixing_water
        - wash_addition
        - additive_issued
        - transferred_wetpaste
        - captured_mix_residue
        - retained_captured_wash_residue
        - effluent_transferred
        - measured_mix_releases
        - measured_wash_release
        - cp_mortar_mix
      output: "q_lot"
      source_ids: []
    - id: grout_card_bridge
      applies_to: "grout_powder; grout_water; grout_additives; fresh_grout; grout_mix_residue; grout_wash_effluent; grout_mix_release"
      rule: "grout_powder_lot = powder_issued; grout_water_lot = mixing_water + wash_addition; grout_additives_lot = additive_issued; fresh_grout_lot = transferred_wetpaste; grout_mix_residue_lot = captured_mix_residue + retained_captured_wash_residue; grout_wash_effluent_lot = effluent_transferred; grout_mix_release_lot = measured_mix_releases + measured_wash_release; water totals are fresh additions only, excluding recirculation; residues assigned to the mix-residue card are disjoint from transferred wash effluent; tag each concrete actual species release by its owned pool/event and count it once; these row-specific lot totals become q_lot for area division."
      inputs:
        - powder_issued
        - mixing_water
        - wash_addition
        - additive_issued
        - transferred_wetpaste
        - captured_mix_residue
        - retained_captured_wash_residue
        - effluent_transferred
        - measured_mix_releases
        - measured_wash_release
        - cp_grout_mix
      output: "q_lot"
      source_ids: []
    - id: mix_state_balance
      applies_to: "mortar_mix; grout_mix"
      rule: "powder_issued + mixing_water + additive_issued + opening_wetstock = transferred_wetpaste + captured_mix_residue + mix_material_in_wash + measured_mix_releases + closing_wetstock + unexplained_balance; compare compatible measured wet masses, with original powder crystallization water included in its issued mass and retained hydration water remaining in paste/residue; unknown fate is unexplained_balance, not an emission or a forced yield."
      inputs:
        - powder_issued
        - mixing_water
        - additive_issued
        - opening_wetstock
        - transferred_wetpaste
        - captured_mix_residue
        - mix_material_in_wash
        - measured_mix_releases
        - closing_wetstock
        - unexplained_balance
        - cp_mortar_mix
        - cp_grout_mix
      output: "mix_balance"
      source_ids: []
    - id: wash_state_balance
      applies_to: "mortar_mix; grout_mix"
      rule: "wash_addition + mix_material_in_wash + opening_washstock = effluent_transferred + retained_captured_wash_residue + measured_wash_release + closing_washstock + unexplained_wash_balance; exclude wash_addition from mixing_water and exclude material sent to washing from captured_mix_residue; retain measured wet mass/solids basis and each custody event once, without inventing a direct discharge."
      inputs:
        - wash_addition
        - mix_material_in_wash
        - opening_washstock
        - effluent_transferred
        - retained_captured_wash_residue
        - measured_wash_release
        - closing_washstock
        - unexplained_wash_balance
        - cp_mortar_mix
        - cp_grout_mix
      output: "wash_balance"
      source_ids: []
    - id: lot_to_area
      applies_to: "all inventory rows"
      rule: "q_norm = q_lot / A; q_lot is the measured or attributed exchange of the declared node in its recorded unit; A is the same lot accepted net floor area in m2 and must be positive."
      inputs:
        - q_lot
        - A
        - cp_layout_cut
        - cp_mortar_mix
        - cp_bond_cure
        - cp_grout_mix
        - cp_grout_finish
      output: "q_norm"
      source_ids: []
    - id: stock_draw
      applies_to: "whole_tiles; tile_return"
      rule: "gross_issue = opening_stock + receipts - closing_stock; whole_tiles_lot = gross_issue; tile_return_lot = external_return; net_consumed = gross_issue - external_return; reconcile net_consumed to independently measured actual_processing_draw, meaning actual processing withdrawals excluding unused external returns, including cutting losses and new materials for rework but excluding repeated internal recutting of the same piece, never purchasing receipts; keep physical gross input and return output distinct from net burden attribution; stock and return event ids are disjoint, and waste is not deducted again."
      inputs:
        - opening_stock
        - receipts
        - closing_stock
        - external_return
        - actual_processing_draw
        - cp_layout_cut
      output: "gross_issue; tile_return_lot; net_consumed"
      source_ids: []
    - id: electricity_convert
      applies_to: "cut_electricity; mortar_electricity; bond_electricity; grout_electricity; finish_electricity"
      rule: "electricity_MJ = electricity_kWh * 3.6"
      inputs:
        - electricity_kWh
      output: "electricity_MJ"
      source_ids: []
    - id: transfer_reconcile
      applies_to: "all inventory rows"
      rule: "sending_quantity = receiving_quantity + documented_transfer_loss; compare same transfer id, unit and wet/dry state; charge loss once to the sending node, using kg for material and m2 for floor transfers."
      inputs:
        - sending_quantity
        - receiving_quantity
        - documented_transfer_loss
      output: "transfer_balance"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Resolve every actual exchange to a compatible concrete flow before TIDAS publication; umbrella cards may expand to multiple exchanges without changing service scope."
      evidence: "Flow detail and support property/unit evidence"
