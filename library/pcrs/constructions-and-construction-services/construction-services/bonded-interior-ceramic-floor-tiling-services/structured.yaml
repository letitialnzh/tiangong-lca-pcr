    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert counted tiles only with measured same-product unit mass; do not infer kg from m2 without actual area density and thickness."
  - id: energy_unit
    applies_to: "cut_electricity; mortar_electricity; bond_electricity; grout_electricity; finish_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Preserve meter units; electricity_MJ = electricity_kWh * 3.6; retain original readings."
