      collection_method: "Receive the measured tensioned parent and identify the actual finishing requirement before using any repair product or water. Record approved actual formulation, consumed constituents, fresh-water source and opening/receipt/unissued-closing stock, all water-only fates and an independent actual H2O-to-air observation or validated model. Weigh solid and liquid waste by material, measure uncaptured species and medium, and log U/X exits and package fates at this node. Inspect every owned component, tautness, trimmed bent ends, project-specific clearance and specified repair state. Survey unique accepted panel centerlines, resolve corners once and exclude opening/gate gaps, defects and WIP. Link final acceptance, metre denominator, meter and service records to the actual period. Complete aggregation and attribution method: Calculate each linked physical numerator by its literal calc rule with unique event keys. Preserve true repeat passes, all defects and material-specific pools. Divide physical card quantities once by the same positive L from calc_accepted_fence_service. Reconcile adjacent transfer IDs and period totals before normalizing.  Any evidenced direct liquid H2O exit is independently measured as a water portion of the actual finish_other_release physical carrier by source event, current state and receiving medium, exclusive of vapour, collected wastewater and all other fates. Unknown occurrence, medium or water quantity is a gap and cannot be inferred from a residual."
      unit: "kg; m; kWh; h, retained separately with the declared unit of each raw record"
      frequency: "Every receipt, issue, physical transfer, operation, defect/rework pass, exit and acceptance; stock census at reporting boundaries; meter reads over each recorded interval; service records over each billed period"
      temporal_coverage: "Complete installation-lot periods from actual node entry through acceptance or documented WIP/exit; retain opening and closing states for each period and all owned idle/rework intervals"
      site_scope: "Only finish_accept at the declared project/site and named actual custody locations; shared assets include the complete consumer set for the same interval"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scales/survey and meter checks; native-to-kg bridge samples for the same SKU/current state; signed design/condition and custody evidence; formulation and water-fate evidence; waste and receiver tickets; complete stock locations; all-consumer topology and allocation decision; record revision and uncertainty history"
  calculation_rules:
    - id: calc_post_interface
      applies_to: "post_interface"
      rule: "actual_post_interface = SUM_UNIQUE_SEGMENTS(post_interface_centerline_m, post_interface_segment_ids). The output is a physical numerator in m. This observation output is used only by its protocol and acceptance gate, not by an inventory Amount or exchange. Keep the measured physical geometry without assigning another product burden. Record actual received or transferred physical geometry and accepted/current state. Source and recipient paired events agree; partial lots and WIP are explicit. Neither a design document nor a fixed 1 m substitutes for actual geometry. Definition SUM_UNIQUE_SEGMENTS: Sum mutually disjoint measured centerline segments keyed by stable segment ID. Resolve shared corners once and remove actual gate and opening gaps before summing. Rework visits do not create new accepted segments. Only segments satisfying the named card current-state gate participate; for the final reference, every counted segment must be net and accepted. This is an existing-asset observation/readiness measurement with its own unchanged ID, measured Length/m/state and interface gate; not an inventory product exchange and not a manufactured material or design-document product."
      inputs:
        - post_interface_transfer_event_ids
        - post_interface_segment_ids
        - post_interface_centerline_m
        - post_interface_state_ids
        - post_interface_source_node
        - post_interface_recipient_node
        - post_interface_handoff_document_ids
        - post_interface_condition_evidence
        - post_interface_corner_and_opening_resolution
        - cp_survey_receive
        - SUM_UNIQUE_SEGMENTS
      output: "actual_post_interface"
      source_ids: []
    - id: calc_receive_packaging
      applies_to: "receive_packaging"
      rule: "actual_receive_packaging = receive_packaging_opening_kg + receive_packaging_external_receipts_kg - receive_packaging_closing_unissued_intact_kg. The output is a physical numerator in kg. Apply the inventory Amount rule once after this calculation; do not normalize any raw field or output twice. All three pools are actual kg after a same-SKU/current-state bridge. Closing is all intact stock unissued to this lot, counted once across real sublocations; issued U/X exits, retained installation and processed WIP are not closing intact. Gross includes actual unused exits; no second netting."
      inputs:
        - receive_packaging_opening_kg
        - receive_packaging_external_receipts_kg
        - receive_packaging_closing_unissued_intact_kg
        - receive_packaging_material_ids
        - receive_packaging_state_ids
        - receive_packaging_native_units
        - receive_packaging_native_quantities
        - receive_packaging_measured_kg_per_native_unit
        - receive_packaging_bridge_evidence
        - receive_packaging_stock_item_ids
        - receive_packaging_stock_sublocations
        - receive_packaging_stock_custodians
        - receive_packaging_stock_count_times
        - receive_packaging_receipt_event_ids
        - cp_survey_receive
      output: "actual_receive_packaging"
      source_ids: []
    - id: calc_receive_reject
      applies_to: "receive_reject"
      rule: "actual_receive_reject = SUM_ONCE(receive_reject_mass_kg, receive_reject_exit_event_ids). The output is a physical numerator in kg. Apply the inventory Amount rule once after this calculation; do not normalize any raw field or output twice. Each physical discarded quantity has one producing node and one measured fate; packaging and captured particles are composition-resolved. Closing WIP or usable exits are not waste. Split mixed liquid and solid constituents before a water-only balance. Definition SUM_ONCE: Sum quantities keyed by unique physical event IDs. Corrected duplicate readings replace originals. Distinct rework passes remain distinct events; do not deduplicate them merely because the same component reappears."
      inputs:
        - receive_reject_exit_event_ids
        - receive_reject_mass_kg
        - receive_reject_material_ids
        - receive_reject_state_ids
        - receive_reject_fate_codes
        - receive_reject_custodian_ids
        - receive_reject_waste_treatment_route
        - receive_reject_native_units
        - receive_reject_native_quantities
        - receive_reject_measured_kg_per_native_unit
        - receive_reject_bridge_evidence
        - receive_reject_absence_evidence
        - cp_survey_receive
        - SUM_ONCE
      output: "actual_receive_reject"
      source_ids: []
    - id: calc_receive_packaging_waste
      applies_to: "receive_packaging_waste"
      rule: "actual_receive_packaging_waste = SUM_ONCE(receive_packaging_waste_mass_kg, receive_packaging_waste_exit_event_ids). The output is a physical numerator in kg. Apply the inventory Amount rule once after this calculation; do not normalize any raw field or output twice. Each physical discarded quantity has one producing node and one measured fate; packaging and captured particles are composition-resolved. Closing WIP or usable exits are not waste. Split mixed liquid and solid constituents before a water-only balance. Definition SUM_ONCE: Sum quantities keyed by unique physical event IDs. Corrected duplicate readings replace originals. Distinct rework passes remain distinct events; do not deduplicate them merely because the same component reappears."
      inputs:
        - receive_packaging_waste_exit_event_ids
        - receive_packaging_waste_mass_kg
        - receive_packaging_waste_material_ids
        - receive_packaging_waste_state_ids
        - receive_packaging_waste_fate_codes
        - receive_packaging_waste_custodian_ids
        - receive_packaging_waste_waste_treatment_route
        - receive_packaging_waste_native_units
        - receive_packaging_waste_native_quantities
        - receive_packaging_waste_measured_kg_per_native_unit
        - receive_packaging_waste_bridge_evidence
        - receive_packaging_waste_absence_evidence
        - cp_survey_receive
        - SUM_ONCE
      output: "actual_receive_packaging_waste"
      source_ids: []
    - id: calc_receive_unused_return
      applies_to: "receive_unused_return"
      rule: "actual_receive_unused_return = SUM_ONCE(receive_unused_return_return_kg, receive_unused_return_return_event_ids) + SUM_ONCE(receive_unused_return_transfer_kg, receive_unused_return_transfer_event_ids). The output is a physical numerator in kg. Apply the inventory Amount rule once after this calculation; do not normalize any raw field or output twice. Return U and external transfer X are disjoint positive exits and exclude closing intact stock, retained product, WIP, waste and internal feed. Carry only the unchanged original material upstream burden; all site work, idle and rework burdens remain with the installation lot. Net-consumed diagnostics never create a second negative exchange or credit. Definition SUM_ONCE: Sum quantities keyed by unique physical event IDs. Corrected duplicate readings replace originals. Distinct rework passes remain distinct events; do not deduplicate them merely because the same component reappears."
      inputs:
        - receive_unused_return_return_event_ids
        - receive_unused_return_return_kg
        - receive_unused_return_transfer_event_ids
        - receive_unused_return_transfer_kg
        - receive_unused_return_material_ids
        - receive_unused_return_state_ids
        - receive_unused_return_native_units
        - receive_unused_return_native_quantities
        - receive_unused_return_measured_kg_per_native_unit
        - receive_unused_return_bridge_evidence
        - receive_unused_return_external_custodian_ids
        - receive_unused_return_original_input_ids
        - receive_unused_return_original_upstream_burden_evidence
        - receive_unused_return_exit_quality_evidence
        - receive_unused_return_retained_wip_exclusion_evidence
        - cp_survey_receive
        - SUM_ONCE
      output: "actual_receive_unused_return"
      source_ids: []
    - id: calc_survey_receive_electricity
      applies_to: "survey_receive_electricity"
      rule: "survey_receive_electricity_direct_kwh = SUM_ONCE((survey_receive_electricity_own_direct_end_reads - survey_receive_electricity_own_direct_start_reads) * survey_receive_electricity_own_direct_kwh_factors, survey_receive_electricity_own_direct_read_event_ids); survey_receive_electricity_master_kwh = CASE_PRESENT(survey_receive_electricity_master_scope_present, (survey_receive_electricity_master_end_read - survey_receive_electricity_master_start_read) * survey_receive_electricity_master_kwh_factor, 0); survey_receive_electricity_inside_direct_kwh = CASE_PRESENT(survey_receive_electricity_master_scope_present, SUM_ONCE((survey_receive_electricity_all_inside_end_reads - survey_receive_electricity_all_inside_start_reads) * survey_receive_electricity_all_inside_kwh_factors, survey_receive_electricity_all_inside_read_event_ids), 0); survey_receive_electricity_residual_kwh = survey_receive_electricity_master_kwh - survey_receive_electricity_inside_direct_kwh; survey_receive_electricity_allocated_interval_kwh = survey_receive_electricity_direct_kwh + CASE_ZERO(survey_receive_electricity_residual_kwh, 0, survey_receive_electricity_residual_kwh * survey_receive_electricity_own_residual_weight / SUM(survey_receive_electricity_all_eligible_residual_weights)); actual_survey_receive_electricity = SUM_ONCE(survey_receive_electricity_allocated_interval_kwh, survey_receive_electricity_allocation_instance_ids). The output is a physical numerator in kWh. Apply the inventory Amount rule once after this calculation; do not normalize any raw field or output twice. Evaluate direct, master, inside-direct, residual and allocation separately for each recorded same-master allocation interval; read-event IDs identify a meter plus interval, preserving repeated real intervals. Sum allocated interval quantities using unique allocation_instance_ids to the physical lot numerator. Own direct may include outside-master meters, but all_inside contains only direct consumers inside the measured master and each exactly once. Direct-only operation has an evidenced zero residual or an actual topology-proven direct-only branch with no shared master has diagnostic neutral zero terms, no weights required. An existing nonzero master exactly assigned to inside-direct consumers also has zero residual and needs no weights. Positive residual requires every eligible weight strictly positive, a complete eligible consumer set and a positive denominator. Unknown or negative residual is a gap. All node allocations plus other consumers must reconcile the same master interval. Definition SUM_ONCE: Sum quantities keyed by unique physical event IDs. Corrected duplicate readings replace originals. Distinct rework passes remain distinct events; do not deduplicate them merely because the same component reappears. Definition CASE_PRESENT: Evaluate the measured present branch only when actual meter-topology evidence says a shared-master scope exists; evaluate the absent branch only when that topology proves direct-only supply. Unknown scope is a gap. The absent-branch zero is a diagnostic neutral term, never an invented zero reading. Definition CASE_ZERO: CASE_ZERO(r, z, p) returns z when measured r equals zero without evaluating any weight division; it returns p only for a measured positive residual with a reviewed complete eligible consumer set, every eligible weight strictly positive and a positive denominator. A negative or unknown residual is invalid and remains a gap; it is never clipped to zero. Definition SUM: Arithmetic sum over the explicitly complete set recorded in the applicable protocol."
      inputs:
        - survey_receive_electricity_supply_id
        - survey_receive_electricity_allocation_instance_ids
        - survey_receive_electricity_interval_ids
        - survey_receive_electricity_interval_start
        - survey_receive_electricity_interval_end
        - survey_receive_electricity_own_direct_meter_ids
        - survey_receive_electricity_own_direct_read_event_ids
        - survey_receive_electricity_own_direct_start_reads
        - survey_receive_electricity_own_direct_end_reads
        - survey_receive_electricity_own_direct_kwh_factors
        - survey_receive_electricity_own_direct_topology
        - survey_receive_electricity_master_scope_present
        - survey_receive_electricity_master_meter_id
        - survey_receive_electricity_master_start_read
        - survey_receive_electricity_master_end_read
        - survey_receive_electricity_master_kwh_factor
        - survey_receive_electricity_all_inside_meter_ids
        - survey_receive_electricity_all_inside_read_event_ids
        - survey_receive_electricity_all_inside_start_reads
        - survey_receive_electricity_all_inside_end_reads
        - survey_receive_electricity_all_inside_kwh_factors
        - survey_receive_electricity_all_inside_consumer_ids
        - survey_receive_electricity_eligible_consumer_ids
        - survey_receive_electricity_own_residual_weight
        - survey_receive_electricity_all_eligible_residual_weights
        - survey_receive_electricity_weight_method_evidence
        - survey_receive_electricity_meter_topology_evidence
        - survey_receive_electricity_calibration_evidence
        - cp_survey_receive
        - SUM_ONCE
        - CASE_PRESENT
        - CASE_ZERO
        - SUM
      output: "actual_survey_receive_electricity; survey_receive_electricity_direct_kwh; survey_receive_electricity_master_kwh; survey_receive_electricity_inside_direct_kwh; survey_receive_electricity_residual_kwh; survey_receive_electricity_allocated_interval_kwh"
      source_ids: []
    - id: calc_survey_receive_access_service
      applies_to: "survey_receive_access_service"
      rule: "survey_receive_access_service_billed_h = survey_receive_access_service_billed_native_quantity * survey_receive_access_service_actual_hours_per_native_unit; survey_receive_access_service_direct_h = SUM_ONCE(survey_receive_access_service_own_direct_service_hours, survey_receive_access_service_own_direct_service_event_ids); survey_receive_access_service_residual_h = survey_receive_access_service_billed_h - SUM_ONCE(survey_receive_access_service_all_direct_service_hours, survey_receive_access_service_all_direct_service_event_ids); survey_receive_access_service_allocated_period_h = survey_receive_access_service_direct_h + CASE_ZERO(survey_receive_access_service_residual_h, 0, survey_receive_access_service_residual_h * survey_receive_access_service_own_residual_weight / SUM(survey_receive_access_service_all_eligible_residual_weights)); actual_survey_receive_access_service = SUM_ONCE(survey_receive_access_service_allocated_period_h, survey_receive_access_service_allocation_instance_ids). The output is a physical numerator in h. Apply the inventory Amount rule once after this calculation; do not normalize any raw field or output twice. Evaluate billed, direct, residual and allocation within each single recorded contract/billing allocation period, then sum allocated-period hours by unique allocation_instance_ids. Different periods retain their own eligible weights; every eligible weight is strictly positive when the residual is positive, and an evidenced ineligible node receives zero residual share; do not pool residuals across unlike periods. The contract and actual availability establish the conversion; no standard shift, calendar year or assumed lifetime is allowed. Own direct records include owned idle/rework exactly once. Complete billed-period consumers reconcile direct plus residual service; a zero residual needs no weights, a positive one needs complete positive weights. Provider-included energy or asset burden is not purchased again. Definition SUM_ONCE