    - rule_id: system_boundary_rule_112
      applies_to: "foreground_system_boundary"
      rule: "This conditional handoff role covers only unchanged-state Mass/kg installation materials actually dispatched by survey_receive to fabric_tension: chainlink_fabric, fabric_fittings. Foreground records expand it into zero, one or multiple concrete exchanges by actual SKU, material and current state, each with its own verified UUID and measured physical quantity. The Amount is selected separately for each actual material/SKU and current-state exchange; a lot-level dispatch sum is diagnostic only and never a mixed-product exchange, combined identity, default occurrence or fixed quantity. Preserve the individual component quantities and custody IDs from calc_issue_chainlink_fabric, calc_issue_fabric_fittings and reconcile each to its matching recipient material input. Upstream acquisition occurs once at the original external receipt; packaging uses its separately carried issue/feed."
