 WATER_PORTION(finish_water_vapour_closing_processed_wip_water_kg, SUM_ONCE(finish_accept_mass_closure_closing_processed_wip_kg, finish_accept_mass_closure_closing_processed_wip_event_ids), finish_water_vapour_pool_card_event_crosswalk). The output is a physical numerator in kg. Apply the inventory Amount rule once after this calculation; do not normalize any raw field or output twice. Actual H2O to air, unspecified, must be independently observed or supported by a validated operation-specific vapour model; the closure gap is diagnostic only. No intact-stock term occurs here: actual_finish_water has already excluded it once. Every coating/cleanup transfer retains its own measured formulation-water fraction, including zero only when evidenced; sum water constituent kg once across actual transfer IDs and reconcile the formulation feed mass to actual_coating_cleanup with finish_coating_feed_mass_gap_kg. Actual formulation and panel residual-water evidence establishes incoming water; opening processed WIP excludes those inputs. Water-only waste fractions, retained water, unused fresh U/X, processed transfers and closing WIP are mutually exclusive measured pools, not total mixed-waste masses. The absolute closure gap must fit the recorded measurement tolerance; otherwise retain a gap, never recast it as evaporation. Every water operand is an actual constituent portion of its explicitly named own-node physical carrier output or measured WIP stock, linked by exact raw card event/material/state/period. Positive processed water transfer requires a represented producing-card/recipient-feed pair; otherwise the scope gap blocks finalization, not a fabricated transfer or a zero default. All U/X fresh-water portions are members of actual_finish_unused_return, not independently netted input quantities. Definition SUM_ONCE: Sum quantities keyed by unique physical event IDs. Corrected duplicate readings replace originals. Distinct rework passes remain distinct events; do not deduplicate them merely because the same component reappears. Definition WATER_PORTION: Return the measured water-only kg portion of a named own-node physical mass output using exact raw event/material/state/period lineage. Check each water portion against the corresponding measured wet mass and actual formulation/fraction. It must neither exceed its physical carrier mass nor overlap another water pool. Definition LINKED_TRANSFER_MASS: Return a measured processed/internal-reuse/rework transfer kg quantity only when the crosswalk names its actual own-node producing card/output, recipient feed/output, event, material, source and actual state, period and unit. The paired quantities must agree. A positive transfer without a represented semantic pair is a blocking card-review finding, never a balance plug or automatic new exchange.  Direct liquid H2O is only its measured portion of actual_finish_other_release supported by the actual receiving medium and source event, excluding separately counted air vapour and collected wastewater. It cannot exceed that release carrier. Unknown portion or medium blocks water closure; do not invent a release or borrow the vapour-to-air UUID."
