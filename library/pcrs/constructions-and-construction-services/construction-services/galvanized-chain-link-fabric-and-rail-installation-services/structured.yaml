      rule: "L = SUM_UNIQUE_SEGMENTS(accepted_fence_service_net_centerline_m, accepted_fence_service_segment_ids); accepted_fence_service_retained_material_mass_kg = SUM_ONCE(accepted_fence_service_retained_component_mass_kg, accepted_fence_service_retained_component_event_ids). Sum only accepted segments with a complete signed configuration and finishing state. L > 0. Unknown acceptance, defects awaiting correction and WIP are excluded; the inventory Amount is L/L, exactly 1 m per reference flow. The retained-mass diagnostic sums measured new installation component/constituent kg linked to these actual panel handoff or acceptance events, with exact material/source-state/current-state/period and source input IDs. Exclude existing posts/foundations and pre-existing components. Use whole composite or measured constituents exclusively. Metres supply the transfer/acceptance gate, never a guessed kg conversion; the diagnostic creates no extra product exchange or procurement burden. Definition SUM_ONCE: Sum quantities keyed by unique physical event IDs. Corrected duplicate readings replace originals. Distinct rework passes remain distinct events; do not deduplicate them merely because the same component reappears. Definition SUM_UNIQUE_SEGMENTS: Sum mutually disjoint measured centerline segments keyed by stable segment ID. Resolve shared corners once and remove actual gate and opening gaps before summing. Rework visits do not create new accepted segments. Only segments satisfying the named card current-state gate participate; for the final reference, every counted segment must be net and accepted."
