allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "foreground lots and nodes"
    rule: "Use separately measured actual node and lot operations first. The accepted fence service is the intended final output; internal feeds, temporary panel states and unused original-material custody exits are not extra co-produced fence services."
    source_ids: []
  - rule_id: allocation_original_unused_exit
    applies_to: "all usable U/X outputs"
    rule: "U and X are positive, mutually exclusive physical exits of still-usable original material to real external custodians. Carry only the unchanged original material upstream burden to those exits using the same material/state evidence. Receipt and site installation, handling, idle and rework burdens remain with the installation lot. A net-consumed diagnostic may subtract U/X for reconciliation but must not create a second negative exchange or avoided-production credit."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "every rejected state and rework loop"
    rule: "Keep each defect, producing node, state, disposition, recipient and rework-pass event. Route it to correction at the same or named upstream node, evidenced usable return/transfer, recovery/downgrade requiring explicit changed-state review, actual waste, or closing WIP. Retain all real work and material losses. A repeat pass adds burden but never another unique accepted length; do not treat a rejected panel as final output."
    source_ids: []
  - rule_id: allocation_meter_residual
    applies_to: "all electricity cards"
    rule: "For the same calibrated interval, convert actual reads using recorded factors. Subtract all directly assigned consumers inside the master exactly once from the master delta; outside-master direct readings are not subtracted. Add the own direct quantity and only its share of a positive residual using a complete eligible consumer set and positive denominator. A measured zero residual uses no weights. Negative or unknown residual, missing topology or incomplete consumers is a gap. Never add direct readings to the full master delta."
    source_ids: []
  - rule_id: allocation_shared_services
    applies_to: "all service cards"
    rule: "Attribute actual contracted hours to direct uses, owned idle and rework, then share only the remaining actual service with a complete, evidenced eligible denominator. Record the asset, bill, period, provider coverage and attribution decision. No assumed eight-hour day, standard annualization, generic lifetime or labour-hours proxy may supply the service quantity. Do not repeat provider-included energy or asset production."
    source_ids: []
  - rule_id: allocation_periods
    applies_to: "period and phase ledgers"
    rule: "Assign each input, event, service interval and output exactly once to the actual period or declared split interval. Carry measured opening/closing stock and WIP between periods with identical custody/state IDs. Record the reason and evidence for period-specific shared-service decisions and any replacement, termination or restart; unknown state blocks finalization. Reconcile period totals to the whole lot before dividing once by final L."
    source_ids: []
  - rule_id: allocation_material_representation
    applies_to: "composite material burdens and mass"
    rule: "Use the actual purchased composite as a whole or a documented split into measured constituents, exclusively. Do not add constituent production to an already complete composite dataset. Accepted retained material mass is a physical stock check, not a second customer-handover exchange or an extra final reference output."
    source_ids: []
  - rule_id: allocation_rule_8
    applies_to: "foreground_burden_allocation"
    rule: "A damaged installation panel is not an automatically useful co-product. Actual recovery or downgrade needs a documented changed-state destination and burden treatment before a final exchange is selected. Physical retained material, temporary interfaces and usable original stock must remain distinguishable from the accepted installation service."
    source_ids: []
