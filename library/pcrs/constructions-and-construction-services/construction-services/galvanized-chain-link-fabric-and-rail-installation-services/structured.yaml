measurement_rules:
  - id: measure_reference_length
    applies_to: "accepted_fence_service"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "Calculate L by calc_accepted_fence_service using cp_finish_accept; sum unique actual net accepted centerline segments, count corners once, exclude gate/opening gaps and WIP; L > 0."
  - id: measure_physical_interface
    applies_to: "cp_survey_receive/cp_rail_brace observation keys: post_interface; physical_interface_release; physical_interface_construction_feed"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "Measure physical existing-post geometry by the owning node protocol. Design release documents support condition; they do not become kilogram or document-product exchanges."
  - id: measure_same_state_bridge
    applies_to: "all material, package and waste rows"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain measured mass or convert actual native count/length/area with the same SKU/current-state measured kg-per-native-unit bridge. Never add unlike native dimensions or borrow another material factor."
  - id: measure_composite_exclusive
    applies_to: "composites and retained material"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Record a whole purchased composite or its actual measured constituents exclusively. Net material mass excludes packaging; accepted retained mass is a stock check rather than a second final exchange."
  - id: measure_meter_lineage
    applies_to: "all electricity rows"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Convert each actual read delta with its source factor and interval. Preserve master/direct topology and every inside-master assignment. Do not borrow a different property such as net calorific value."
  - id: measure_service_time
    applies_to: "all access_service rows"
    required_property_ref:
      name: "Duration"
      uuid: ""
    required_unit: "h"
    rule: "Use actual contracted availability and recorded conversion, including owned idle and rework. No default eight-hour day, annualization, lifetime or labour proxy."
  - id: measure_normalize_once
    applies_to: "all inventory rows"
    required_property_ref:
      name: "row-specific"
      uuid: ""
    required_unit: "row-specific"
    rule: "First calculate the literal physical numerator named in section 8. Execute each card Amount expression once using the same positive L. Intermediate transfers retain actual quantities; only final L/L equals one."
  - id: measure_water_pools
    applies_to: "finish_water; finish_water_vapour; finish_wastewater; finish_unused_return"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use water-only measured pools at finish_accept. Gross fresh water already excludes closing intact once. H2O vapour to air, unspecified, requires independently validated occurrence/quantity, and closure residual remains diagnostic."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: survey_receive
    name: "Release the existing post interface and receive installation materials"
    inclusion: "required"
    inclusion_condition: "Every installation lot"
    role: "Entry survey, interface acceptance, external material and packaging custody, and actual issues to each working node Observations post_interface and physical_interface_release remain independently measured existing-post/foundation Length/m readiness and release states under cp_survey_receive and calc_post_interface/calc_physical_interface_release; they are not inventory product exchanges."
    quantitative_reference: "actual same-state handoff quantity; final accepted length L only at finish_accept"
  - id: rail_brace
    name: "Integrate rails, braces and specified tension wire"
    inclusion: "required"
    inclusion_condition: "Every installation lot; individual new component roles follow the accepted existing/new schedule"
    role: "Joining components to the released posts; incidental rail cutting is owned here Observation physical_interface_construction_feed confirms the same released asset geometry/state under cp_rail_brace and calc_physical_interface_construction_feed, with the same source-recipient observation IDs and real responsibility; no new asset manufacture or product acquisition."
    quantitative_reference: "actual same-state handoff quantity; final accepted length L only at finish_accept"
  - id: fabric_tension
    name: "Attach, join and tension galvanized chain-link fabric"
    inclusion: "required"
    inclusion_condition: "Every installation lot"
    role: "Integrate actual fabric and attachment components into taut secured panels"
    quantitative_reference: "actual same-state handoff quantity; final accepted length L only at finish_accept"
  - id: finish_accept
    name: "Complete specified finishing, clear installation debris and accept the fence service"
    inclusion: "required"
    inclusion_condition: "Every lot requires inspection and acceptance; surface repair, cleaning materials and water activate only on evidenced actual operations"
    role: "Receive the tensioned parent, perform actual project-owned finishing, and release a unique accepted output"
    quantitative_reference: "actual same-state handoff quantity; final accepted length L only at finish_accept"
