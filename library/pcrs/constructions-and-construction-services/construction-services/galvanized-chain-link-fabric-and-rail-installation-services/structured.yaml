  classification_refs: "cpc:3.0:54770; classification linkage is context and does not establish a broader scope or accepted mapping"
  covered_products: "Installation of actual galvanized woven steel chain-link fabric and rail/attachment infrastructure on released existing posts and foundations"
  excluded_products: "New complete-fence manufacture; new post/foundation/earthwork construction; gates/operators; barbed wire/tape; privacy slats; polymer-coated or non-galvanized alternative fabric routes without new review"
  representative_product: "One accepted metre of the actual project fence-panel centerline at its declared configuration"
  production_route: "Existing-interface release and receiving → rail/bracing integration → fabric joining/tensioning/attachment → actual specified completion and final acceptance"
  market_state: "Site-installed service at acceptance, with actual owned components complete and existing-post interface unchanged in ownership"
functional_unit:
  what: "Accepted galvanized chain-link fabric and rail installation service on the released existing post/foundation interface"
  how_much: "1 m of unique net accepted fence-panel centerline length"
  how_well: "Actual design-compatible height, mesh, gauge, selvage and galvanizing state; taut fabric, secure complete owned fittings, trimmed/bent ends, actual specified clearance and completion requirements accepted"
  how_long_or_cycle: "One actual installation lot from entry release through acceptance, with its real receipt/storage, rail, fabric, finishing, idle and rework periods; no assumed service life"
  reference_flow_link: "accepted_fence_service"
system_boundary:
  rules:
    - rule_id: boundary_start
      applies_to: "all nodes"
      rule: "Begin with existing line and terminal posts and foundations accepted for the actual fence loading, height, geometry and condition. Named upstream owners supply the signed design and physical-condition release. The physical post-interface length is an observed existing asset boundary, never a design-document product or post/concrete mass."
      source_ids:
        - clfmi-product-manual-2017
        - masterhalco-galvanized-components
    - rule_id: boundary_component_ownership
      applies_to: "all component roles"
      rule: "Resolve every cap, eye top, rail end, band, sleeve, brace, truss component, tension bar or strap, bolt, tie, hog ring and tension-wire role as already accepted existing or newly installed by this work package. Include every actual new owned item in its material-role ledger; one item has one operation owner. Unknown ownership blocks completion."
      source_ids:
        - clfmi-product-manual-2017
        - masterhalco-galvanized-components
    - rule_id: boundary_exclusions
      applies_to: "scope changes"
      rule: "New posts, earthworks, foundations, gates, gate operators, barbed wire, barbed tape, privacy slats and independent framework/fabric manufacture are outside this reviewed route. If actually needed or performed by the installation package, reassess the boundary and cards before modelling; do not hide those operations as zero or existing."
      source_ids:
        - clfmi-product-manual-2017
        - masterhalco-galvanized-components
    - rule_id: boundary_receipt
      applies_to: "survey_receive and all material feeds"
      rule: "Each staged material has one gross external draw at survey_receive followed by a measured issue and matching own-node internal feed. Gross equals opening plus external receipts minus all intact stock unissued to this lot. Receipt rejection and actual U/X exits stay within gross and have positive separate outputs. No new purchased acquisition occurs at the feed node."
      source_ids: []
    - rule_id: boundary_packaging
      applies_to: "all packaging roles"
      rule: "Receive accompanying packaging separately, then either record its receipt fate or its measured issue/feed to the actual unpacking node. At that node record waste, usable exit, actual reuse transfer or retained WIP exclusively. Supplier dataset packaging coverage is documented and counted once; material kg exclude packaging."
      source_ids: []
    - rule_id: boundary_handoff
      applies_to: "all panel and component transfers"
      rule: "Pair material, packaging and panel transfers using identical event, material or segment, current state, lot, source and recipient evidence. Record actual internal quantities rather than final reference 1 m. Retained components carry prior burdens once; later work adds only its own operations and inputs."
      source_ids: []
    - rule_id: boundary_actual_operations
      applies_to: "rail_brace and fabric_tension"
      rule: "Rail fitting and actual field cutting are incidental joining operations here. Include actual cutting tools, offcuts, captured dust, uncaptured releases and rework; an independent fabricated-product handoff would require new scope review. Stretching, joining, fastening and trimming/bending ends are actual fabric-stage operations without default rates or dimensions."
      source_ids:
        - clfmi-product-manual-2017
        - masterhalco-galvanized-components
    - rule_id: boundary_finishing
      applies_to: "finish_accept"
      rule: "The parent is the measured tensioned secured panel. Surface repair and chemical or water cleanup activate only from an actual approved requirement and operation record. Resolve formulation and actual application/cleanup states; absence requires evidence and unknown state remains a gap. Welded-gate zinc-paint clauses do not establish universal rail-cut repair in this excluded-gate route."
      source_ids:
        - clfmi-product-manual-2017
        - masterhalco-galvanized-components
    - rule_id: boundary_final_gate
      applies_to: "accepted_fence_service"
      rule: "Release only panels with actual taut fabric, secure fittings, trimmed and bent ends, specified clearance, complete owned components and all actual specified repair/cleanup requirements accepted. The final reference is unique net panel centerline length with corners counted once and gate/opening gaps excluded, at declared height/mesh/gauge/selvage/coating. Waiting alone is no separate preservation service."
      source_ids:
        - clfmi-product-manual-2017
        - masterhalco-galvanized-components
    - rule_id: boundary_actual_releases
      applies_to: "all waste and elementary roles"
      rule: "Measure solids, liquid waste, usable exits, retained material and WIP as exclusive physical fates at the node producing them. Elementary rows require exact substance or particle basis and receiving medium. Captured particles and liquid sent for treatment are waste; an unexplained closure gap is not an environmental release. finish_water_vapour is exclusively actual H2O to air, unspecified."
      source_ids: []
    - rule_id: boundary_periods
      applies_to: "all nodes"
      rule: "Enumerate actual receipt/storage, rail integration, fabric installation, any finishing, acceptance, rework and owned idle periods, with opening/closing states and event IDs. Link assets, receipts, material transfers, waste, service and final acceptance to those periods; a reporting cutoff retains unaccepted installation as WIP rather than assuming termination or acceptance."
      source_ids: []
    - rule_id: boundary_shared_assets
      applies_to: "all energy and service roles"
      rule: "Identify each actual shared meter, access asset, lift, hoist, extractor or protection service, its contractual/provider boundary and every consuming node and reporting period. Record direct assignments before residual attribution and avoid duplicate included energy, asset or packaging burdens."
      source_ids: []
    - rule_id: boundary_atomic_completion
      applies_to: "all processes"
      rule: "Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry."
      source_ids: []
