nce. Direct-only operation has an evidenced zero residual or an actual topology-proven direct-only branch with no shared master has diagnostic neutral zero terms, no weights required. An existing nonzero master exactly assigned to inside-direct consumers also has zero residual and needs no weights. Positive residual requires every eligible weight strictly positive, a complete eligible consumer set and a positive denominator. Unknown or negative residual is a gap. All node allocations plus other consumers must reconcile the same master interval. Definition SUM_ONCE: Sum quantities keyed by unique physical event IDs. Corrected duplicate readings replace originals. Distinct rework passes remain distinct events; do not deduplicate them merely because the same component reappears. Definition CASE_PRESENT: Evaluate the measured present branch only when actual meter-topology evidence says a shared-master scope exists; evaluate the absent branch only when that topology proves direct-only supply. Unknown scope is a gap. The absent-branch zero is a diagnostic neutral term, never an invented zero reading. Definition CASE_ZERO: CASE_ZERO(r, z, p) returns z when measured r equals zero without evaluating any weight division; it returns p only for a measured positive residual with a reviewed complete eligible consumer set, every eligible weight strictly positive and a positive denominator. A negative or unknown residual is invalid and remains a gap; it is never clipped to zero. Definition SUM: Arithmetic sum over the explicitly complete set recorded in the applicable protocol."
