  reference_unit: "item"
  required_qualifiers:
    - "ferrous metal family"
    - "retained and replaced equipment register"
    - "civil foundation pit and melt-deck scope"
    - "furnace count and configuration"
    - "rated capacity as descriptor"
    - "actual power cooling hydraulic charging and extraction interfaces"
    - "initial lining commissioning requirements"
    - "cold and hot acceptance criteria with authority and applicability"
    - "campaign and reporting periods"
