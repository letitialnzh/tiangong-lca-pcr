measurement_rules:
  - id: count_reference
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "N is the positive count of unique complete accepted intervention IDs from cp_acceptance. Count the coordinated contracted plant scope once; furnaces, phases, MW, heats and metal tonnes are qualifiers or activities."
  - id: native_and_mass
    applies_to: "native supplies and physical outlets"
    required_property_ref:
      name: "Actual native property; Mass only for an evidenced independent mass view"
      uuid: ""
    required_unit: "actual native unit"
    rule: "Preserve Count/Area/Length/Volume/Mass as supplied and matched usable returns. If an independent mass view is needed, use actual SKU-specific net mass or density with state, moisture, temperature, temperature_unit, unit conversion and evidence; never add it to the same native physical quantity."
  - id: utilities_and_species
    applies_to: "actual utilities and elementary exchanges"
    required_property_ref:
      name: "Actual verified native property; species Mass"
      uuid: ""
    required_unit: "actual native unit; kg"
    rule: "Meter actual electricity separately from thermal fuel; verify actual Energy and native gas/water support before final exchange creation. No NCV/GCV or Count substitute for electricity. Species release needs substance and medium and matched measured mass or compatible factor/composition/fate evidence."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: integrated_reconstruction
    name: "Retained-plant integrated reconstruction and hot commissioning"
    inclusion: "required"
    inclusion_condition: "Actual contracted integrated civil and process-interface reconstruction with necessary hot acceptance"
    role: "Assembly and integration responsibility through actual civil, lining and trial gates; rework loops remain here until real independent handoff"
    quantitative_reference: "accepted_service"
process_inventory:
  - id: integrated_reconstruction
    label: "Retained-plant integrated reconstruction and hot commissioning"
    inputs:
      product:
        - row_id: electricity
          role: "Actual purchased electricity for reconstruction and commissioning"
          name: "Actual purchased electricity for reconstruction and commissioning"
          flow_type: "product"
          property_unit: "Actual electrical Energy / metered native energy unit"
          description: "Record source-specific gross electricity imports separately from gross external exports and actual onsite generation. Meter installation tools, pumps, cooling/extraction circulation, furnace lining conditioning and every trial/retrial, including attributable idle/standby and losses, using actual physical driver and unit. Cover any actual onsite-generation fuel, assets and releases once; no netting or future saving credit. Identify voltage/grid/provider and upstream coverage. Verify electrical-energy support; do not invent a universal melting-energy factor. Range evidence need: Collect source-specific gross import/export meters, actual onsite generation, consumer/phase/circulation/loss coverage and physical driver/unit. An energy range needs independent comparable scope and hot-test data, not confidential vendor metrics."
          amount:
            expression: "attributable source-specific gross electricity = source-specific gross imported electricity/N after non-overlapping consumer, phase, physical-driver and period reconciliation; onsite generation and gross exports remain distinct."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_energy
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_service
          role: "Accepted integrated reconstruction and commissioning service for an existing ferrous foundry coreless-induction melting plant"
          name: "Accepted integrated reconstruction and commissioning service for an existing ferrous foundry coreless-induction melting plant"
          flow_type: "product"
          property_unit: "Number of items 01846770-4cfe-4a25-8ad9-919d8d378345 / item"
          description: "One actual complete accepted integrated intervention on the named retained plant. Mechanical completion alone, an unclosed defect or a successful individual heat is not this handover. Range evidence need: Exactly 1 item is normalization of the accepted service, not an empirical yield or proof of equivalent capacities; N counts real accepted IDs."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_acceptance
              source_ids:
                - electroheat-ferrous-foundry-commissioning
                - hongteng-induction-installation-2026
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: hot_attribution
    applies_to: "service and useful metal"
    rule: "The sole intended product here is the reconstruction service; useful historical assets and necessary trial metal are physical outlets. Deliberately commercial metal production is excluded until a separate boundary and attribution is justified. All necessary noncommercial commissioning, first-lining, failed trials, idle support, correction and retest burdens belong to the accepted reconstruction service. Physical historical-asset and useful metal outlets remain transparent without automatic allocation away or avoided-product credit. If any trial is deliberately commercial co-production, separate its production boundary, enumerate intended outputs and handoffs, then approve a project-specific causally justified subdivision/attribution with raw drivers, shares and sensitivity before final data; no default free commercial metal or invented zero share."
    source_ids: []
  - rule_id: stock_view
    applies_to: "new supplies and returns"
    rule: "Declare one consistent gross-with-outlets or consumed-only view per SKU and scope. S=attributed_opening+external_net_receipts-carried_closing; closing includes recovered closing. S/N is gross-with-outlets and (S-usable_return)/N is consumed-only. Opening and closing are stock observations, not disjoint fates. Internal installation/issue/recharge is not another receipt; unused outward returns reduce supply only once. Waste/loss retain supply burdens; historic assets/heel are separate inherited stocks with no negative purchase."
    source_ids: []
  - rule_id: shared_and_period
    applies_to: "shared assets and periods"
    rule: "Use complete manufacture+maintenance+replacement+EOL burden and compatible job_driver/life_driver across all consuming jobs/nodes/periods. Life_driver requires observed life or observed history plus evidenced remainder, replacements, termination and EOL, with sources, uncertainty, sensitivity and update. Choose asset_equivalent=(job_driver/life_driver)/N or lifecycle-complete native service=job_driver/N with matching unit burden; never combine views or normalize twice. Link phases, stock carryovers and replacements; unresolved lifetime/remainder/termination or consumer coverage blocks finalization."
    source_ids: []
  - rule_id: secondary_and_reject
    applies_to: "secondary and rejected states"
    rule: "For external secondary charge or recovered inputs, document origin and recovery handoff, current transport/treatment and inherited burden or justified prior-system cut-off. Retained heel/internal remelt carry their recorded existing burdens without new purchase. Failed lining, off-spec heats, components and samples must link to actual rework, reuse/downgrade, recovery or discard; retain repeated resource burdens and count no unresolved reject as accepted service or useful metal. No universal recycled-content or substitution default."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "integrated_reconstruction"
      flow_role: "whole accepted intervention and actual gate"
      record_type: "acceptance_record"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; scope_register; retained_equipment; replaced_equipment; civil_foundation_pit_deck_scope; metal_family; furnace_configuration; rated_capacity; capacity_unit; interface_register; authority; criteria_id; applicability_basis; cold_check_results; lining_requirement; lining_cycle_record; heat_ids; hot_tap_shutdown_results; defect_id; defect_closure; drawings_id; om_record; training_record; owner_signature; contractor_signature; accepted_date; N"
      collection_method: "Reconcile approved reconstruction contract, baseline survey and signed gate dossier; record actual criteria/results and defects through all attempts. Count N unique complete accepted intervention IDs; exclude repeated heats, test phases and unresolved rejects; one reference flow per ID. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count."
      unit: "item"
      frequency: "each intervention and gate event"
      temporal_coverage: "All actual phases/periods from retained survey to signed handover including failed/repeated events"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed authority/applicability, traceable cold and hot result records, closed-defect evidence"
    - protocol_id: cp_stock
      process_id: "integrated_reconstruction"
      flow_role: "new supplies and unused outward returns"
      record_type: "stock_ledger"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; sku; material_identity; material_state; native_property; native_unit; attributed_opening; gross_receipts; tare_receipts; external_net_receipts; carried_closing; recovered_closing; usable_return; return_receiver; return_transfer_id; internal_issue; installed_quantity; waste_quantity; loss_quantity; measurement_unit; conversion_factor; conversion_unit; conversion_source; density; density_unit; density_source; moisture; moisture_basis; temperature; temperature_unit; pressure; pressure_unit; return_view; scope_coverage; installed_or_temporary; lifecycle_coverage; uncertainty"
      collection_method: "Use calibrated quantity/weight/meter records, delivery/return notes and physical closing survey in the same native unit; reconcile by SKU and state. Apply stock_native once per reference flow; retain all nonreturned waste/loss supply burdens, with recovered closing included once. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count."
      unit: "actual native unit; kg only for separate evidenced mass view"
      frequency: "each receipt/return and period opening/closing"
      temporal_coverage: "All actual phases/periods from retained survey to signed handover including failed/repeated events"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Reconciled signed stock records, calibration, state/conversion evidence and investigated discrepancy"
    - protocol_id: cp_hot
      process_id: "integrated_reconstruction"
      flow_role: "external trial charge, heel, internal recycling and useful metal"
      record_type: "heat_ledger"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; heat_id; metal_grade; charge_sku; origin; secondary_status; recovery_handoff; inherited_burden; cutoff_decision; current_external_opening; charge_native_property; charge_native_unit; gross_receipts; tare_receipts; external_net_receipts; current_external_closing; recovered_closing; usable_return; return_receiver; return_transfer_id; inherited_heel_opening; heel_closing; charge_to_heat_kg; charge_to_heat_unit; cold_stock_opening; cold_stock_closing; cold_to_heat_transfer_id; heel_transfer_id; internal_transfer_id; internal_recharge_kg; sample_kg; tapped_kg; export_kg; receiver; output_grade; output_state; output_transfer_id; balance_basis; balance_basis_unit; metal_content; metal_content_unit; metal_content_source; slag_gross_quantity; slag_native_unit; slag_metal_content; slag_content_basis; slag_content_source; dust_gross_quantity; dust_native_unit; dust_metal_content; dust_content_basis; dust_content_source; actual_lining_transfer; lining_transfer_unit; actual_flux_addition; flux_unit; actual_gas_uptake; gas_uptake_unit; gas_uptake_source; slag_kg; captured_dust_kg; contained_metal_waste_kg; measured_species_release_kg; unaccounted_difference; mass_unit; measurement_basis; calibration; purpose; commercial_boundary; intended_outputs; attribution_method; raw_driver; driver_unit; output_share; evidence; uncertainty; sensitivity"
      collection_method: "Link weighed actual charge-to-heat, cold-stock/heel transfers, tapping/sample/export and residue records by heat. Map current_external_opening to stock_native attributed_opening and current_external_closing (including recovered_closing) to carried_closing for the current external charge SKU/native state; inherited heel stays separate. Record failed/repeated heats and purpose. Reconcile heat_ledger with stock_native and hot_attribution; external inputs and actual export_kg/N once; internal loops cancel as transfers, not purchases. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count."
      unit: "kg"
      frequency: "each heat and linked transfer; opening/closing campaign"
      temporal_coverage: "All actual phases/periods from retained survey to signed handover including failed/repeated events"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale records, metal-state/grade evidence, receiver acceptance, stock discrepancy investigation and explicit attribution approval"
    - protocol_id: cp_energy
      process_id: "integrated_reconstruction"
      flow_role: "metered electrical energy"
      record_type: "meter_record"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; meter_id; source_id; receiver; consumer_id; provider; gross_import; gross_export; onsite_generation; onsite_fuel_event; onsite_asset_id; onsite_release_id; physical_driver; driver_unit; construction_energy; lining_energy; hot_energy; retest_energy; circulation_energy; loss_energy; voltage; voltage_unit; native_property; native_unit; reading_start; reading_end; meter_factor; conversion_factor; conversion_unit; conversion_source; attributable_share; other_consumers; coverage_start; coverage_end; idle_energy; trial_id; provider_included_resources; calibration; uncertainty"
      collection_method: "Read calibrated submeter or reconcile total and disjoint consumers/periods; retain every lining, heat and retest event. Apply utility_meter once to raw non-overlapping source/consumer event records; result is already per reference flow, no second division by N. Do not add provider-included energy. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count."
      unit: "metered native electrical energy unit"
      frequency: "each metering interval and event"
      temporal_coverage: "All actual phases/periods from retained survey to signed handover including failed/repeated events"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, bill/submeter reconciliation and actual electrical property verification"
    - protocol_id: cp_fuel
      process_id: "integrated_reconstruction"
      flow_role: "supplied fuel and combustion fates"
      record_type: "fuel_ledger"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; fuel_identity; fuel_state; native_unit; attributed_opening; gross_receipts; tare_receipts; external_net_receipts; carried_closing; recovered_closing; usable_return; measured_burn; burn_meter_id; nonburned_waste; uncontained_loss; loss_investigation; total_spill_audit; recovered_to_closing; fate_coverage; fate_overlap_check; measurement_unit; conversion_factor; conversion_unit; conversion_source; density; density_unit; density_source; material_state; moisture; moisture_basis; temperature; temperature_unit; pressure; pressure_unit; uncertainty"
      collection_method: "Reconcile actual supply stocks separately from measured burn. If direct burn metering is unavailable, audit a complete disjoint native-unit fate ledger and investigate unknown losses. stock_native determines upstream supply; fuel_fates determines actual burn without residual assumptions or spill/recovery duplication. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count."
      unit: "actual fuel native unit"
      frequency: "each fill/burn/loss event and period"
      temporal_coverage: "All actual phases/periods from retained survey to signed handover including failed/repeated events"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Fuel meters or complete fate proof, density/state conversion, uncertainty and investigation record"
    - protocol_id: cp_provider
      process_id: "integrated_reconstruction"
      flow_role: "external completed service and scope"
      record_type: "provider_record"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; provider_id; service_identity; physical_completed_result; service_quantity; native_property; native_unit; acceptance_id; responsibility_limit; manufacture_scope; energy_scope; material_scope; labor_scope; asset_scope; transport_scope; maintenance_scope; replacement_scope; eol_scope; missing_scope; direct_overlap; upstream_dataset; unit_match; evidence; uncertainty"
      collection_method: "Obtain provider physical completion and full scope inventory/dataset; compare every omitted/overlapping resource against direct ledgers. provider_complete per reference flow; add omitted resources once, never convert price or unscoped hours to Count. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count."
      unit: "provider physical native unit"
      frequency: "each completed service package"
      temporal_coverage: "All actual phases/periods from retained survey to signed handover including failed/repeated events"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed completion, provider scope matrix and matching upstream boundary/unit"
    - protocol_id: cp_asset
      process_id: "integrated_reconstruction"
      flow_role: "shared temporary/test assets and all consumers"
      record_type: "lifecycle_driver_record"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; asset_identity; temporary_or_provider_support; permanent_delivered_exclusion; consumers_all_jobs_nodes_periods; service_start; service_end; job_driver; driver_unit; life_driver; life_driver_unit; observed_history; observed_life; evidenced_remainder; remainder_source; manufacture_burden; maintenance_burden; replacement_events; replacement_burden; termination_event; eol_burden; lifecycle_dataset; manufacture_source; maintenance_source; replacement_source; termination_source; eol_source; history_source; evidence_source; lifecycle_unit; selected_view; provider_inclusion; uncertainty; sensitivity; update_trigger"
      collection_method: "Use asset register and full-life compatible usage history plus evidenced remainder, maintenance, replacement and EOL; enumerate every consumer. shared_driver per reference flow with one lifecycle burden view and normalization only once. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count."
      unit: "actual driver unit or asset-equivalent item"
      frequency: "each usage, maintenance, replacement and termination event"
      temporal_coverage: "Full manufacture, all consuming jobs/nodes/periods, maintenance, replacements, termination and EOL; link the separate actual job/event window"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Full-life coverage, driver-unit equivalence, source-backed remainder and sensitivity/update proof"
    - protocol_id: cp_freight
      process_id: "integrated_reconstruction"
      flow_role: "actual freight work and empty-return coverage"
      record_type: "transport_record"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; shipment_id; leg_id; carrier; load; load_unit; tare; net_load; load_kg; load_conversion; load_conversion_source; distance; distance_unit; distance_km; distance_conversion; distance_source; attribution_share; shared_load; empty_return; empty_return_unit; upstream_inclusion; provider_coverage; responsibility; uncertainty"
      collection_method: "Reconcile actual shipment mass, route legs and carrier records with provider boundaries and shared-load attribution. freight_work per reference flow, each leg once; disclose actual empty service coverage without invented load. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count."
      unit: "kg*km"
      frequency: "each shipment and leg"
      temporal_coverage: "All actual phases/periods from retained survey to signed handover including failed/repeated events"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighbill, routing distance evidence and carrier upstream/empty return scope"
    - protocol_id: cp_residue
      process_id: "integrated_reconstruction"
      flow_role: "useful historical assets and contained wastes"
      record_type: "outlet_record"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; outlet_id; origin_event; historical_or_current; material_identity; material_state; native_property; native_unit; gross_quantity; tare; net_quantity; conversion_factor; conversion_unit; conversion_source; density; density_unit; density_source; moisture; moisture_basis; temperature; temperature_unit; receiver; transfer_id; useful_acceptance; waste_classification; hazard_evidence; treatment_route; treatment_coverage; reject_id; rework_transfer_id; recovery_or_disposal; uncertainty"
      collection_method: "Measure actual outlets and receiver records, distinguish historical useful assets from returned supply and waste; link rejection to its producing event and real fate. Apply physical_outlet once to raw net_quantity by state/destination; its result is already per reference flow, no second division by N. Pair treatment scope without duplicate provider burden. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count."
      unit: "actual native outlet unit"
      frequency: "each removal/rejection/transfer"
      temporal_coverage: "All actual phases/periods from retained survey to signed handover including failed/repeated events"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Receiver acceptance or waste tickets, calibration, hazard/state evidence and treatment chain"
    - protocol_id: cp_environment
      process_id: "integrated_reconstruction"
      flow_role: "actual resource intakes, water outfalls and species releases"
      record_type: "environment_record"
      raw_fields: "site_id; job_id; intervention_id; reference_gate_id; accepted_intervention_ids; asset_id; campaign_id; batch_id; event_id; phase_id; period_id; exchange_id; resource_or_substance; particle_basis; flow_direction; source_medium; receiving_medium; location; measurement_start; measurement_end; native_property; native_unit; measured_intake; measured_water_outfall; recirculation; evaporation; retained_water; contained_wastewater; measured_mass; mass_unit; activity; activity_unit; species_factor; factor_unit; factor_scope; factor_source; factor_complete; whole_release; whole_release_unit; native_gas_release; native_gas_unit; gas_reference_temperature; gas_reference_temperature_unit; gas_reference_pressure; gas_reference_pressure_unit; native_gas_compartment; density; density_unit; density_state; density_source; moisture; moisture_basis; composition; composition_basis; composition_source; fate; fate_basis; fate_source; temperature; temperature_unit; pressure; pressure_unit; conversion_factor; conversion_unit; conversion_source; capture_state; calibration; detection_limit; uncertainty"
      collection_method: "Use actual calibrated resource/outfall measurements and species monitoring or valid matched factors. Identify receiving medium and capture fate; investigate unknowns rather than interpreting SDS or hazards as quantities. environment_native and species_mass per reference flow; mutually exclusive measurement/factor/composition views and no contained-waste duplication. Use only cp_acceptance final unique accepted_intervention_ids/reference_gate_id for N; no phase or heat adds a new reference count."
      unit: "actual native unit; species kg"
      frequency: "each release/intake event and monitored interval"
      temporal_coverage: "All actual phases/periods from retained survey to signed handover including failed/repeated events"
      site_scope: "Named plant intervention and attributable offsite/provider scope"
      aggregation_rule: "per reference flow"
      quality_evidence: "Medium/substance evidence, calibration/detection limits, matched activity factor/composition/fate sources and uncertainty"
  calculation_rules:
    - id: stock_native
      applies_to: "installed_supplies; trial_charge; fuel_supply; process_water; process_gases; usable_supply_returns"
      rule: "external_net_receipts=gross_receipts-tare_receipts; S=attributed_opening+external_net_receipts-carried_closing; gross_input=S/N; consumed_input=(S-usable_return)/N. recovered_closing is included in carried_closing; return_view selects one expression, never both."
      inputs:
        - cp_stock
        - cp_hot
        - cp_fuel
        - N
      output: "Actual native-unit supply per reference flow; matched unused outward return ledger"
      source_ids: []
    - id: heat_ledger
      applies_to: "trial_charge; trial_metal_exports; contained_wastes"
      rule: "Use measured charge_to_heat and linked cold-stock/heel/internal transfer quantities for each actual heat; external receipts are not automatically furnace feed. Keep each gross native stream independent. Reconcile either an evidenced compatible elemental/metal-content basis with actual composition, units and sources for charge/metal/slag/dust, or a complete whole-stream mass basis including actual additions, lining transfers and evidenced reaction-gas uptake. Do not balance metal-charge kg directly against oxide/entrained-lining slag gross kg. Pair transfers and opening/closing stocks; investigate unaccounted_difference without inferring emissions or oxidation."
      inputs:
        - cp_hot
        - cp_stock
        - cp_residue
        - cp_environment
        - N
      output: "Auditable heat stock/fate closure; external charge and useful exports per reference flow"
      source_ids: []
    - id: utility_meter
      applies_to: "electricity; electricity_exports"
      rule: "utility_meter=sum(source-specific gross_import*conversion_factor*attributable_share)/N, reconciled with source meter deltas, onsite_generation, actual construction/lining/hot/retest/circulation/loss physical drivers and gross_export; electric_export=gross_export/N as a separate actual receiver Product outlet. Never net exports against imports; onsite-generation fuel/assets/releases are covered once."
      inputs:
        - cp_energy
        - N
      output: "Actual attributable native electrical energy per reference flow"
      source_ids: []
    - id: fuel_fates
      applies_to: "fuel_supply; species_releases"
      rule: "Use measured_burn, or verify opening+net_receipts=closing+usable_return+burn+nonburned_waste+uncontained_loss in one compatible native basis with complete disjoint fates and investigated unknowns. recovered_to_closing is already in closing; total_spill_audit is nonadditive. Only verified burn supports a matched combustion factor."
      inputs:
        - cp_fuel
        - cp_environment
        - N
      output: "Actual burn and disjoint fuel fates, separate from upstream fuel supply"
      source_ids: []
    - id: provider_complete
      applies_to: "provider_services"
      rule: "service_quantity/N with physical_completed_result, matching native_unit and full upstream scope; add missing_scope once and remove direct_overlap."
      inputs:
        - cp_provider
        - N
      output: "Lifecycle-complete actual provider service per reference flow"
      source_ids: []
    - id: shared_driver
      applies_to: "shared_assets"
      rule: "asset_equivalent=(job_driver/life_driver)/N OR service_quantity=job_driver/N with lifecycle-complete matching native service burden. life_driver includes all consumers and observed life or history plus evidenced remainder/replacement/termination/EOL. Select one view."
      inputs:
        - cp_asset
        - N
      output: "One attributed lifecycle burden per reference flow"
      source_ids: []
    - id: freight_work
      applies_to: "freight"
      rule: "freight_work=sum(load_kg*distance_km*attribution_share)/N; actual load/distance conversions and leg/provider coverage retained."
      inputs:
        - cp_freight
        - N
      output: "kg*km per reference flow and separately covered actual empty service"
      source_ids: []
    - id: physical_outlet
      applies_to: "historic_asset_exports; trial_metal_exports; contained_wastes"
      rule: "physical_outlet=net_quantity/N or export_kg/N on the actual compatible outlet ledger; no avoided-product credit."
      inputs:
        - cp_residue
        - cp_hot
        - N
      output: "Actual physical outlet by native unit, state and receiver"
      source_ids: []
    - id: environment_native
      applies_to: "environmental_intakes; water_outfalls"
      rule: "environment_native=actual attributable measured_intake/N OR measured_water_outfall/N by resource, direction and medium; retain water balance evidence without adding recirculation."
      inputs:
        - cp_environment
        - N
      output: "Actual direct environmental native exchange per reference flow"
      source_ids: []
    - id: species_mass
      applies_to: "species_releases"
      rule: "species_mass=measured_mass/N OR activity*species_factor/N OR whole_release*composition*fate/N after compatible unit/basis conversion. Use one valid path; factor_complete forbids multiplying composition/fate again; whole-fluid and species are nonadditive views."
      inputs:
        - cp_environment
        - cp_fuel
        - N
      output: "Species kg per reference flow with actual receiving medium"
      source_ids: []
  data_quality_requirements:
    - id: gate_trace
      applies_to: "reference and phases"
      requirement: "Every N entry has the same retained scope, actual civil and hot gate dossier, project-specific authority/criteria and period links. Missing civil scope, lining requirement, heat result or signed handover blocks final data."
      evidence: "cp_acceptance signed records"
    - id: quantities
      applies_to: "all flows and conversions"
      requirement: "Retain raw operands, native units, actual SKU/state/moisture/temperature/pressure and sources for every conversion. Bounds or source examples cannot replace actual measurements. Report uncertainty, detection limits and reconciled discrepancies."
      evidence: "Node-owned protocols and calibration records"
    - id: complete_coverage
      applies_to: "direct and upstream scope"
      requirement: "Reconcile all providers/assets/periods and receipts/returns/stock/fates with one owner. Missing upstream, asset life, replacement, termination, actual secondary origin or commercial attribution blocks finalization."
      evidence: "Scope matrices, asset evidence and stock/heat reconciliation"
    - id: identity_and_ranges
      applies_to: "actual expanded exchanges"
      requirement: "Before final process/lifecyclemodel publication verify each actual concrete identity and its native property/unit group; SKU/provider/species umbrellas require actual expansion. Any later empirical guardrail needs independent comparable evidence and disclosed applicability; no numerical defaults are asserted here."
      evidence: "Concrete dataset exchange evidence and independently sourced ranges"
validation_rules:
  - rule_id: scope_gate
    applies_to: "accepted_service"
    rule: "N>0 unique accepted IDs, complete actual civil/lining/hot-trial gate, exact qualifiers and 1 item; no furnace/heat/capacity counting or cold-only shortcut."
    source_ids: []
  - rule_id: stock_heat_fates
    applies_to: "stocks and outputs"
    rule: "Check SKU-native gross/consumed-only view, closing including recovered closing, one matched outward return, historical/new distinction, heel/internal loops, heat mass closure, receiver/state of useful exports and separate slag/captured dust/contained waste. Investigate unknowns; no residual burn/emission or automatic credit."
    source_ids: []
  - rule_id: burden_completeness
    applies_to: "provider, assets and periods"
    rule: "One owner and complete unit/boundary for direct/provider/offsite/rental/freight/test/spares/temporary utilities; all shared consumers, full asset lifecycle and source-backed remainder; period/replacement/termination links and no double normalization. Missing coverage is incomplete."
    source_ids: []
  - rule_id: actual_environment
    applies_to: "actual environmental exchanges"
    rule: "MUST expand actual purchased and direct environmental water/gas roles separately. Check measured intakes/outfalls and substance/medium/species basis, actual burn or complete fate proof, factor/composition/fate compatibility and nonadditive whole-fluid views; hazard/exposure lists are not emission quantities."
    source_ids: []
  - rule_id: output_attribution
    applies_to: "service, metal, historical assets and rejects"
    rule: "Necessary noncommercial trials retain all burdens on service; any deliberately commercial co-production needs separate boundary, complete intended outputs and justified raw-driver shares before final data. Verify secondary origin/prior burden and actual rework/exit paths. Rejects cannot enter accepted count or be silently free products."
    source_ids: []
  - rule_id: identity_projection
    applies_to: "actual expanded data package"
    rule: "Concrete UUID/type/direction/state/native unit and support verification is mandatory for every final exchange. Projection and bilingual ordered IDs/semantics must agree. Missing actual SKU/provider/species or authority evidence blocks final data regardless of an automated check."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground site-specific accepted integrated reconstruction and commissioning service data package"
  downstream_use: "secondary_dataset; background_dataset for compatible actual interventions and downstream process/lifecyclemodel projections"
  allowed_use: "Declared retained ferrous coreless-induction reconstruction scope with actual civil and first-lining/hot gate and matching qualifiers"
  excluded_use: "New foundry or furnace manufacture, cold-only installation, ordinary metal production, future savings/avoided equipment or generic safety/emissions claims"
  required_metadata: "Intervention/site ID, retained/replaced/civil and interface registers, furnace/metal/configuration/capacity descriptors, authority/criteria, phases and reporting periods, N, stock view, provider/assets and useful-output attribution"
  required_quality_disclosure: "Gate and physical coverage, uncertainties and discrepancies, raw stock/heat/fate/conversion evidence, secondary treatment, provider and lifecycle gaps, actual identity and environment-method evidence"
  update_trigger: "Changed retained scope, civil/interface package, metal/charge or lining route, criteria/authority, hot trial purpose, supplier/asset life, stock or environmental evidence and material data gaps"
