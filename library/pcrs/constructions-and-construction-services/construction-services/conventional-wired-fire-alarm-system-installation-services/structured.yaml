boundary_abstraction:
  declared_starting_condition: "Accepted conventional design and routes/mounting interfaces; prepared building and major trays; existing dedicated isolated mains supply at an explicitly located interface; supplied components at installer receipt"
  starting_condition_role: "Boundary readiness facts and existing interfaces, not a newly produced exchange or credit"
  product_classification_scope: "The conventional wired single-panel installation/commissioning subset of CPC 3.0 54612"
  recursive_input_rule: "If same-category prior installation enters the job, identify its actual handed-over state and upstream package; do not recursively recreate the accepted service or imply that readiness is a service input. A changed scope requires separate review."
  upstream_dataset_requirement: "Match actual supplied component/SKU/state and geography/technology; require upstream manufacture and landed delivery/packaging disclosure. Separate supply manufacture from foreground installation and prevent duplicated embedded packaging."
  disclosure: "Actual design, starting interfaces, installer feeder responsibility, site/job period, supply datasets and inclusions, accepted configuration/D, resource ownership and unclosed evidence gaps"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted complete conventional wired fire-alarm system installation and commissioning"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "Actual panel manufacturer/model"
    - "single-panel configuration"
    - "zones and detector/sounder circuits"
    - "exact device and accessory BOM/counts"
    - "circuit and installer feeder lengths/SKUs"
    - "permanent battery pair model/capacity/approval"
    - "existing isolated mains interface and installer segment"
    - "mounting/routes"
    - "design and acceptance specification"
    - "actual cause/effect and standby schedule"
    - "test/correction/restoration records"
    - "signed handover gate and dates"
reference_flows:
  []
measurement_rules:
  - id: reference_count
    applies_to: "accepted_installation"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Use cp_acceptance to count complete accepted same-configuration systems, not devices, zones, tests or progress. Every inventory quantity uses that same D."
  - id: mass_numerators
    applies_to: "incoming_packaging; control_panel; field_alarm_devices; standby_batteries; alarm_cable; fixings_and_containment; detector_test_agent; test_cleaning_consumables; unused_product_return; dry_material_waste; rejected_component_waste; contaminated_solid_waste; airborne_particulate; test_agent_constituent_to_air"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep separate SKU/material/state/recipient numerators. Use calibrated net weighing or traceable matching-SKU count/length-to-mass conversion. Units of mass 93a60a57-a4c8-11da-a746-0800200c9a66 has reference kg factor 1. Never apply this conversion to electricity or service duration."
  - id: energy_preservation
    applies_to: "installation_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Meter actual pre-handover kWh and causal shares using cp_energy. Energy support must be verified for downstream exchange construction; NCV, battery Ah, mass and elapsed hours alone do not provide it."
  - id: resource_count
    applies_to: "owned_equipment_attribution; hired_support_service"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Owned assets use exact attributed item fractions; counted hire requires genuine complete contract events. item reference factor is 1. An hourly contract requires true Duration support and review, not count conversion."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: install_accept
    name: "Conventional wired system installation and acceptance"
    inclusion: "required"
    inclusion_condition: "Actual accepted-design conventional wired job"
    role: "One accountable assembly, test/correction and handover responsibility"
    quantitative_reference: "accepted_installation; 1 item"
process_inventory:
  - id: install_accept
    label: "Conventional wired system installation and acceptance"
    inputs:
      product:
        - row_id: control_panel
          role: "Conventional wired fire-alarm control panel at receipt"
          name: "Conventional wired fire-alarm control panel at receipt"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Record the actual supplied conventional panel model and included accessory BOM. Weigh its net product mass or multiply that exact SKU count by a traceable net mass factor. The supplied permanent power supply/battery charger stays in this panel packet; do not repeat accessories also recorded under field devices or fixings. Link receipts, final installation and any removed unit to the same part record. Quantity calculation is specified in section 8 normalize_exchange. Range evidence need: actual panel mass, count and accessory boundary are required. A single-panel reference does not supply a mass interval covering different models."
          amount:
            expression: "Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_materials
              source_ids:
                - ctec-standard
            ranges: []
        - row_id: detector_test_agent
          role: "Actual physically consumed detector test formulation"
          name: "Actual physically consumed detector test formulation"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Activate only where a compatible physical aerosol or other formulation was actually used. Record exact product, current SDS, can gross/tare and before/after quantity, returned product and residual disposition; measure consumed formulation kg separately from empty container mass. Electronic/heat testing or a count of tested devices does not create this chemical input. Identify any emitted species independently under test_agent_constituent_to_air. Quantity calculation is specified in section 8 normalize_exchange. Range evidence need: compatible product/SDS, actual can mass changes and same-method dose observations are required; no verified generic grams-per-test factor is available."
          amount:
            expression: "Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_materials
              source_ids:
                - ctec-standard
            ranges: []
        - row_id: installation_electricity
          role: "Metered installation and pre-handover test electricity"
          name: "Metered installation and pre-handover test electricity"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Read calibrated supply-meter start/end kWh for the actual installation, external tool charging, panel energisation, standby-battery recharge, tests and repeated tests before handover. Attribute evidenced other-user consumption using the same meter interval and causal records; record each charging boundary once. Preserve Energy/kWh; do not weigh electricity, use mass conversion, substitute NCV or infer it from battery Ah. Later monitoring, standby and operation are outside this service cycle. Quantity calculation is specified in section 8 energy_normalize. Range evidence need: actual meter intervals, background supply/charging ownership, other users, accepted-system attribution and comparable observed kWh/reference records are required. Energy/kWh identity support is unresolved; no source-backed range is available."
          amount:
            expression: "Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_energy
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_installation
          role: "Accepted complete conventional wired fire-alarm system installation and commissioning"
          name: "Accepted complete conventional wired fire-alarm system installation and commissioning"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "Count only a complete installed, connected, configured, documented and signed accepted single-panel system of the same declared configuration. cp_acceptance links the actual design and BOM to initiation/notification, fault, mains-failure/standby, cause/effect and restored-normal-state evidence. Count systems, not zones, devices, tests, partial progress or rejected work. Repeated tests and corrections retain resource burdens without increasing D. Quantity calculation is specified in section 8 reference_output. Range evidence need: 1 item is the exact normalized reference output, not an observed yield range. Accepted denominator, failed/held work and configuration separation require traceable records."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "method_formula"
              collection_protocol_id: cp_acceptance
              source_ids:
                - accepted-count-normalization
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: allocate_job
    applies_to: "install_accept"
    rule: "Attribute actual material, electricity, test agent, service and correction burdens to the same accepted configuration/job. Subdivide independently recorded jobs before using a justified causal share. Rejects, repeated tests and failed work do not increase D or escape the job burden. The sole intended product output is accepted_installation; unchanged usable stock is a return rather than an intended co-product."
    source_ids: []
  - rule_id: allocate_returns
    applies_to: "unused_product_return; incoming_packaging"
    rule: "Preserve gross custody entry and actual unchanged return separately. The upstream consumed-supply numerator is gross issues less evidenced usable returns and remaining stock attributable elsewhere. Return handling/resources remain with this job; do not both net supply and grant a second avoided-product credit. Packaging already embedded in supply has no second manufacture burden."
    source_ids: []
  - rule_id: allocate_asset
    applies_to: "owned_equipment_attribution"
    rule: "For each exact asset manufacture packet use its count times actual job service activity divided by documented same-basis total lifetime activity. Enumerate install_accept and every other consuming job/period; shares reconcile to one over the declared life. Unknown service-life or remaining-use evidence blocks finalized attribution. No whole asset per job, default life or reuse count is allowed."
    source_ids: []
  - rule_id: allocate_period
    applies_to: "owned_equipment_attribution"
    rule: "Use one asset/phase/period index for manufacture/acquisition, all service jobs, maintenance/replacement and retirement/termination. Assign actual maintenance/replacement packets to evidenced benefiting periods or their causal job, with this specific assignment taking precedence over a general lifetime share. Index retirement once and disclose its burden owner. Closed assets use actual history; an in-service remaining-use estimate needs evidence and uncertainty. Do not annualize an already lifetime-attributed packet or count an original and replacement as simultaneous whole inputs."
    source_ids: []
  - rule_id: allocate_service
    applies_to: "hired_support_service; installation_electricity"
    rule: "Provider service owns its included rented asset manufacture/maintenance and operating resources. Use actual completed-event shares among all consumers and disclose inclusions; only add electricity or other resources outside that service packet. Owned-asset embodied shares and metered electricity are different packets, each counted once."
    source_ids: []
  - rule_id: allocate_residual
    applies_to: "dry_material_waste; rejected_component_waste; contaminated_solid_waste"
    rule: "Declare actual repair, stock return, recycling/recovery receiver or discard for each state; retain collection and any modelled treatment with its disclosed owner. Destination alone grants no automatic recovery/substitution credit. A downstream recovered-product model requires its own evidence and boundary."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "install_accept"
      flow_role: "accepted_installation"
      record_type: "signed acceptance ledger"
      raw_fields: "job/configuration/system IDs; panel/model/zones; exact device BOM; circuit/feeder lengths; battery pair/capacity/approval; design/cause-effect/standby schedule; tests/corrections/normal restoration; status/signature/date; D"
      collection_method: "Inspect the complete installed system against actual design and test/acceptance records. Count only final signed accepted same-configuration systems; keep held/failed/progress records separately."
      unit: "item"
      frequency: "each system and correction; final closeout"
      temporal_coverage: "actual installation start through signed acceptance"
      site_scope: "one declared site/job and configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed design/BOM/test/restoration record; denominator reconciliation"
    - protocol_id: cp_materials
      process_id: "install_accept"
      flow_role: "physical supplied materials, packaging and usable returns"
      record_type: "receipt/issue/return and installed-state ledger"
      raw_fields: "job/date/event/transfer IDs; supplier/SKU/state; gross/net/tare; count or length; matching kg/item or kg/m evidence; shipment/pack material; upstream inclusions; stock; retained installed mass; usable return"
      collection_method: "Weigh net materials with calibrated scales or use traceable same-SKU count/length mass factors. Trace gross custody inputs, actual unchanged returns, stock change and installed state separately; retain packaging physical pool independent of upstream burden owner."
      unit: "kg; item; m"
      frequency: "each receipt/withdrawal/return and final installed BOM"
      temporal_coverage: "all original and correction events through closeout"
      site_scope: "install_accept custody and declared shipment interfaces"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration/tare records; SKU factors; paired transfers; stock and BOM reconciliation"
    - protocol_id: cp_energy
      process_id: "install_accept"
      flow_role: "installation_electricity"
      record_type: "meter interval and user-share ledger"
      raw_fields: "job/date; meter ID/calibration; start/end kWh; supply/charging boundary; installation/test/retest/recharge interval; other users; causal shares; signed acceptance cutoff"
      collection_method: "Read actual supply meters, including external tool charging and pre-handover panel/battery recharge; reconcile shared-user intervals, subtract only evidenced other-user use and exclude post-handover operation."
      unit: "kWh"
      frequency: "each attributable operating/test/charging interval"
      temporal_coverage: "installation start through handover cutoff including corrections"
      site_scope: "actual supply meter boundary serving install_accept"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter readings/calibration; interval coverage; user shares; no battery-Ah substitution"
    - protocol_id: cp_services
      process_id: "install_accept"
      flow_role: "owned_equipment_attribution; hired_support_service"
      record_type: "asset/event and lifetime-period attribution ledger"
      raw_fields: "asset/model/serial/owner; manufacture packet/count; job activity; same-basis lifetime activity; all jobs/consumers/periods; maintenance/replacement/retirement event and beneficiaries; remaining-use evidence; service contract/configuration/completion/count; provider resource inclusions"
      collection_method: "Index actual asset manufacture/acquisition, every use job/reporting period, actual maintenance/replacement and retirement. Measure job and lifetime activity consistently; identify causal maintenance beneficiaries. For genuine counted hire inspect contract and completed-event count plus all consumer shares; retain true hourly rental quantity for separate review."
      unit: "item; actual service activity basis disclosed"
      frequency: "each job/event and each asset-period update"
      temporal_coverage: "job dates plus documented asset life and phase history"
      site_scope: "install_accept and every other consumer of selected resource"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset history/BOM; documented utilization/uncertainty; contract/invoice/completion; reconciled all-consumer shares"
    - protocol_id: cp_residuals
      process_id: "install_accept"
      flow_role: "waste streams and direct airborne species/particles"
      record_type: "residual dispatch, monitoring and constituent ledger"
      raw_fields: "job/date/event; original issue/source pool; material/SKU/state; waste code/recipient/transfer; gross/tare kg; fault/removal/retest; substrate/tool/capture/particle basis/air compartment; test product/SDS/composition; measured consumed/captured/residual quantities; matching factor/activity and uncertainty"
      collection_method: "Weigh each dispatched material/state/recipient separately and pair with custody/correction records. For actual air releases measure species/particle mass or use independently supported matching activity/composition/partition methods; distinguish captured waste and usable stock, and never turn unclosed residual into emission."
      unit: "kg"
      frequency: "each residual event/dispatch and actual emitting test or preparation event"
      temporal_coverage: "all installation/correction events to residual closeout"
      site_scope: "install_accept exits and actual receiving medium/receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "weighbridge/tare/receiver records; monitored or justified factors; SDS and compatible constituent balance"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "incoming_packaging; control_panel; field_alarm_devices; standby_batteries; alarm_cable; fixings_and_containment; detector_test_agent; test_cleaning_consumables; hired_support_service; unused_product_return"
      rule: "normalized quantity = Q / D. Q is the actual attributable material kg or genuine completed service-event count, each separately measured; preserve gross issues, stock and returns before applying allocate_returns to consumed supply."
      inputs:
        - Q
        - D
        - cp_materials
        - cp_services
        - cp_acceptance
      output: "normalized concrete exchange in its original unit per reference flow"
      source_ids: []
    - id: energy_normalize
      applies_to: "installation_electricity"
      rule: "normalized electricity = E_job / D. E_job is measured interval kWh less only evidenced other-user kWh; include attributable pre-handover charging/correction intervals once."
      inputs:
        - "meter start/end"
        - "other-user records"
        - E_job
        - D
        - cp_energy
        - cp_acceptance
      output: "kWh per reference flow"
      source_ids: []
    - id: owned_asset_normalize
      applies_to: "owned_equipment_attribution"
      rule: "normalized manufacture asset fraction = N_asset * A_job / A_life / D. N_asset is the actual count of the exact asset packet; A_job and A_life use the same documented service-activity basis. Maintenance/replacement/retirement packets follow allocate_period separately."
      inputs:
        - N_asset
        - A_job
        - A_life
        - D
        - cp_services
        - cp_acceptance
      output: "attributed item per reference flow"
      source_ids: []
    - id: residual_normalize
      applies_to: "dry_material_waste; rejected_component_waste; contaminated_solid_waste"
      rule: "normalized waste = W_stream / D. W_stream is independently measured net kg at the actual material/state/receiver gate, never an unexplained difference."
      inputs:
        - W_stream
        - D
        - cp_residuals
        - cp_acceptance
      output: "stream-specific waste kg per reference flow"
      source_ids: []
    - id: emission_normalize
      applies_to: "airborne_particulate"
      rule: "normalized airborne particulate = P_air / D. P_air is monitored mass or measured activity times an independently supported matching substrate/tool/capture/particle-basis factor; retain source, unit conversion and uncertainty."
      inputs:
        - P_air
        - "matching factor and activity or monitoring"
        - D
        - cp_residuals
        - cp_acceptance
      output: "particle-basis and air-compartment-specific kg per reference flow"
      source_ids: []
    - id: solvent_partition
      applies_to: "test_agent_constituent_to_air"
      rule: "normalized constituent emission = S_air / D. Determine S_air from species measurement or actual consumed formulation times exact constituent fraction times independently supported released fraction; reconcile retained/captured/residual fractions on the same constituent basis. Do not default release to all consumption."
      inputs:
        - "actual formulation consumption"
        - "SDS/composition"
        - "partition or species monitoring"
        - S_air
        - D
        - cp_residuals
        - cp_acceptance
      output: "identified species and air-compartment kg per reference flow"
      source_ids: []
    - id: reference_output
      applies_to: "accepted_installation"
      rule: "normalized accepted output = D / D = 1 item. Only final accepted same-configuration systems contribute to D."
      inputs:
        - D
        - cp_acceptance
      output: "1 item per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: dq_reference
      applies_to: "accepted_installation"
      requirement: "Keep all qualifiers, independently counted D and failed/held work; separate different configurations."
      evidence: "cp_acceptance"
    - id: dq_pools
      applies_to: "all inventory rows"
      requirement: "Retain gross input, stock, retained state, returns and measured residuals by SKU/state/recipient; heterogeneous sums are diagnostics only."
      evidence: "cp_materials; cp_residuals"
    - id: dq_ownership
      applies_to: "owned_equipment_attribution; hired_support_service; installation_electricity"
      requirement: "Reconcile manufacture/supply inclusions, all users/periods, actual maintenance/replacement/retirement and remaining-use evidence; avoid duplicate service/electricity packets."
      evidence: "cp_services; cp_energy"
    - id: dq_occurrence
      applies_to: "all inventory rows"
      requirement: "Unknown occurrence, missing measurement or identity is not zero; finalize concrete identity and Energy/Duration support before downstream exchange construction."
      evidence: "actual source and quantity records"
    - id: dq_range_incoming_packaging
      applies_to: "incoming_packaging"
      requirement: "Range evidence need: shipment-specific material weights, pack sizes, actual reuse/return history and supplier packaging boundary are required; no universal packaging mass per system is established."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_owned_equipment_attribution
      applies_to: "owned_equipment_attribution"
      requirement: "Range evidence need: exact asset manufacture/BOM, actual maintenance, all consuming jobs/periods, service-life utilization and remaining-use uncertainty are required. No default lifetime, reuse count or generic embodied mass per system is justified."
      evidence: "cp_services; actual matching-domain quantity evidence"
    - id: dq_range_control_panel
      applies_to: "control_panel"
      requirement: "Range evidence need: actual panel mass, count and accessory boundary are required. A single-panel reference does not supply a mass interval covering different models."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_field_alarm_devices
      applies_to: "field_alarm_devices"
      requirement: "Range evidence need: actual device-type BOM, compatible SKU masses, circuit loading and design coverage are required; one heterogeneous device total and a universal devices-per-system interval are invalid."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_standby_batteries
      applies_to: "standby_batteries"
      requirement: "Range evidence need: exact battery datasheet, approval/design requirement, accepted pair BOM and actual mass are required. Manufacturer standby Ah examples are neither installation energy nor universal battery consumption ranges."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_alarm_cable
      applies_to: "alarm_cable"
      requirement: "Range evidence need: actual circuit lengths, core/rating, slack and termination requirements, exact kg/m evidence and cutting/rework records are needed; no universal cable mass per system is established."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_fixings_and_containment
      applies_to: "fixings_and_containment"
      requirement: "Range evidence need: accepted configuration, actual installed/issued counts and SKU masses are required; prepared major supports and building structure cannot supply a new-material interval."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_detector_test_agent
      applies_to: "detector_test_agent"
      requirement: "Range evidence need: compatible product/SDS, actual can mass changes and same-method dose observations are required; no verified generic grams-per-test factor is available."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_test_cleaning_consumables
      applies_to: "test_cleaning_consumables"
      requirement: "Range evidence need: actual object/event coverage, SKU and issued/returned/residue/wipe measurements are required; dose observations apply only to the same device and method."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_installation_electricity
      applies_to: "installation_electricity"
      requirement: "Range evidence need: actual meter intervals, background supply/charging ownership, other users, accepted-system attribution and comparable observed kWh/reference records are required. Energy/kWh identity support is unresolved; no source-backed range is available."
      evidence: "cp_energy; actual matching-domain quantity evidence"
    - id: dq_range_hired_support_service
      applies_to: "hired_support_service"
      requirement: "Range evidence need: actual event definition or hourly contract, configuration/capacity, provider inclusions and all consumer shares are required. Hourly Duration is unresolved and is not covered by this count unit."
      evidence: "cp_services; actual matching-domain quantity evidence"
    - id: dq_range_unused_product_return
      applies_to: "unused_product_return"
      requirement: "Range evidence need: linked measured gross issues, unchanged state and actual returns by SKU are required; no default return fraction or automatic credit is established."
      evidence: "cp_materials; actual matching-domain quantity evidence"
    - id: dq_range_dry_material_waste
      applies_to: "dry_material_waste"
      requirement: "Range evidence need: weighed stream-specific manifests, source-pool links and actual diversion routes are required. Nominal component mass gives no waste-rate interval."
      evidence: "cp_residuals; actual matching-domain quantity evidence"
    - id: dq_range_rejected_component_waste
      applies_to: "rejected_component_waste"
      requirement: "Range evidence need: actual fault, removal/retest, original issue, classification and weighed dispatch records are required. There is no default defect rate; zero requires complete event coverage."
      evidence: "cp_residuals; actual matching-domain quantity evidence"
    - id: dq_range_contaminated_solid_waste
      applies_to: "contaminated_solid_waste"
      requirement: "Range evidence need: formulation-specific residue, container tare, wipe mass and recipient acceptance are required; no all-chemical evaporation assumption is valid."
      evidence: "cp_residuals; actual matching-domain quantity evidence"
    - id: dq_range_airborne_particulate
      applies_to: "airborne_particulate"
      requirement: "Range evidence need: matching substrate/tool/capture, particle-size basis, activity and release-factor/monitoring evidence are required; generic dust or balancing-loss quantities are unavailable."
      evidence: "cp_residuals; actual matching-domain quantity evidence"
    - id: dq_range_test_agent_constituent_to_air
      applies_to: "test_agent_constituent_to_air"
      requirement: "Range evidence need: exact product/SDS, constituent composition and delivered/captured/residual fractions are required. No generic aerosol/VOC interval or air subcompartment is inferred."
      evidence: "cp_residuals; actual matching-domain quantity evidence"
    - id: dq_range_accepted_installation
      applies_to: "accepted_installation"
      requirement: "Range evidence need: 1 item is the exact normalized reference output, not an observed yield range. Accepted denominator, failed/held work and configuration separation require traceable records."
      evidence: "cp_acceptance; actual matching-domain quantity evidence"
validation_rules:
  - rule_id: validate_gate
    applies_to: "accepted_installation"
    rule: "Require all reference qualifiers, positive D and signed complete acceptance. Confirm actual initiation/notification and cause/effect, fault/mains-failure/standby and final restored-normal-state records against the project acceptance schedule. A programmed test mode or a component check is not whole-system acceptance."
    source_ids:
      - ctec-standard
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Before a downstream exchange is finalized, verify each actual SKU/material/state/recipient or species/air-compartment identity and compatible property/unit. Conditional umbrellas expand to zero, one or multiple concrete exchanges according to actual occurrence; unknown is not zero. Count support does not verify a service UUID."
    source_ids: []
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Match each raw numerator, unit, CP, applicable section 8 calculation and common D. Check separate gross/return/stock/retained/residual pools; reject mixed-material UUIDs, mass conversion of electricity and event conversion of hourly rent. Missing compatible Energy or Duration support remains an explicit gap."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "rejected_component_waste; accepted_installation"
    rule: "Link original component/cable/battery defect, repair/replacement, repeat test and actual exit to install_accept. Keep failed/held work out of D while retaining its burdens. Every exit has actual state and receiver; no undocumented recovery path or credit."
    source_ids: []
  - rule_id: validate_shared_period
    applies_to: "owned_equipment_attribution; hired_support_service"
    rule: "Reconcile all resource consumers and periods, actual service-life shares and manufacture/maintenance/replacement/retirement event ownership. Missing remaining-use/replacement/termination evidence blocks finalized attribution. Prevent whole-tool defaults, repeated lifetime/annual allocation and duplicates across provider service, owned assets and electricity."
    source_ids: []
  - rule_id: validate_ranges
    applies_to: "all inventory rows"
    rule: "Preserve each role-specific range evidence need in section 8. A manufacturer design limit, nominal factor or exact 1 item reference is not an empirical quantity interval. Missing ranges remain disclosed; do not manufacture bounds to make a validation warning disappear."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground installation-to-acceptance data package for one disclosed conventional wired system configuration"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projections"
  allowed_use: "Installation and commissioning contributions for the same explicit scope, starting interfaces, configuration and handover gate, with actual compatible supply datasets"
  excluded_use: "Automatic comparison across different coverage/configurations; standalone device manufacture; addressable/wireless/two-wire AlarmSense/network/repeater/extinguishant systems; remote monitoring and operational service"
  required_metadata: "Panel and zones; exact device/accessory/BOM; actual circuit/feeder lengths; compatible standby pair/design; site/job/period; design and test/acceptance gate; D; supply/packaging boundaries; asset/service owners; all-consumer/phase index; quantity/identity evidence"
  required_quality_disclosure: "Unresolved concrete identities and Energy/conditional Duration support; role-specific range gaps; meter and balance completeness; faults/rework; asset remaining-use and period uncertainty; omitted/unknown occurrence and limits on functional equivalence"
  update_trigger: "Changed panel/configuration/route/design or scope/interface; changed battery/device specification; new actual quantity/range evidence; changed supply/resource boundary; verified identities; updated acceptance or asset history"
data_sources:
  - id: "ctec-standard"
    type: "handbook"
    reference: "C-TEC CFP 2/4/8 Zone Standard installation and maintenance manual, Approved Document DFU7004010 Rev 4, 01/11/21; https://c-tec.com/download?wpdmdl=13537 ; PDF pages 6–8, 10–13, 15, 17, 23"
    used_for: "Conventional separate detector/manual initiation and polarised sounder circuits; actual cable/mounting/earth/mains interfaces and component duties; permanent charger and compatible new VRLA pair; test-mode restoration and setup records; load/standby-specific battery completeness. No installation electricity, test-agent dose, asset lifetime or universal service-normalized quantity range is taken from the manual."
  - id: "accepted-count-normalization"
    type: "method_factor"
    reference: "Count normalization identity for positive accepted D: D / D = 1; this PCR sections 3 and 8; D contains only complete accepted same-configuration systems"
    used_for: "Exact normalized reference output 1 item; not an empirical yield or inventory range"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:18f818a2c4609f7039ea54bbb7f075805da527e0aa3ac22bcd364c1870a18464"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_6520"
      family: "system_boundary"
      span:
        start:
          offset: 6520
          line: 59
          column: 1
        end:
          offset: 31090
          line: 354
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Accepted conventional design and routes/mounting interfaces; prepared building and major trays; existing dedicated isolated mains supply at an explicitly located interface; supplied components at installer receipt |\n| starting_condition_role | Boundary readiness facts and existing interfaces, not a newly produced exchange or credit |\n| product_classification_scope | The conventional wired single-panel installation/commissioning subset of CPC 3.0 54612 |\n| recursive_input_rule | If same-category prior installation enters the job, identify its actual handed-over state and upstream package; do not recursively recreate the accepted service or imply that readiness is a service input. A changed scope requires separate review. |\n| upstream_dataset_requirement | Match actual supplied component/SKU/state and geography/technology; require upstream manufacture and landed delivery/packaging disclosure. Separate supply manufacture from foreground installation and prevent duplicated embedded packaging. |\n| disclosure | Actual design, starting interfaces, installer feeder responsibility, site/job period, supply datasets and inclusions, accepted configuration/D, resource ownership and unclosed evidence gaps |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_install | install_accept | One node owns receipt, preparation/mounting, detector and sounder circuit termination, permanent battery connection, configuration, actual tests/corrections and signed acceptance. Phase journals do not create new product exchanges. Keep compatible EOL, mains segregation and screen/earth interfaces in the actual design record. | `ctec-standard` |\n| boundary_mains | alarm_cable; installation_electricity | Existing dedicated isolated mains provision is an explicit starting interface. Include the actual installer-supplied feeder segment, connection and pre-handover metered use; exclude upstream building distribution works and later operation. | `ctec-standard` |\n| boundary_components | control_panel; field_alarm_devices; standby_batteries | Permanent panel power supply/charger, batteries and connected devices are installed product components. They are not reusable tool capital. Disclose accessory inclusions and the actual CFP approval/design battery condition rather than generalising it across models. | `ctec-standard` |\n| boundary_residuals | install_accept | Own every actual reject, correction, usable return and residual exit once. Link original issue/event/transfer and actual receiver. Internal retermination or configuration has no fictitious intermediate output; unclassified missing mass is a gap. | |\n| boundary_resources | owned_equipment_attribution; hired_support_service | Identify each shared asset: operator-owned tool/tester/external charger/access equipment and provider-owned services used across jobs/periods. Index every benefiting job and period, from manufacture/acquisition through service, maintenance/replacement to retirement/termination. Preserve actual remaining-use uncertainty. Do not repeat provider asset manufacture. | |\n| boundary_packaging | incoming_packaging; dry_material_waste | Keep received packaging in a physical source pool even where its manufacture is embedded in landed supply. Add a separate packaging burden only if excluded upstream; never invent a receipt from its outgoing waste. | |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Incoming packaging by material and shipment (`incoming_packaging`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nKeep packaging received with components, batteries, cable and consumables in a physical custody pool linked to its shipment. Weigh each material or use verified pack counts and tare. Create a separate burden-bearing input only where the landed component dataset excludes that packaging; embedded packaging manufacture is already owned upstream. Reconcile reuse, return, stock and waste without deriving receipts from waste exits.\n\nQuantity calculation is specified in section 8 `normalize_exchange`. Range evidence need: shipment-specific material weights, pack sizes, actual reuse/return history and supplier packaging boundary are required; no universal packaging mass per system is established.\n\n- Collection subject: Incoming packaging by material and shipment\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources:\n\n#### Collection requirement: Attributed share of each operator-owned reusable asset (`owned_equipment_attribution`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nIdentify each actual drilling/cable preparation tool, tester, external equipment charger or access asset by model and serial number. Measure job service activity and the documented lifetime activity on the same basis; apply owned_asset_normalize to the manufacture packet of that exact asset. Link actual maintenance, replacement and retirement packets to their benefiting jobs/periods under section 7. The permanent panel charger and standby batteries are installed components; rented equipment is owned by the provider service. This is an attributed item fraction, not installed mass or a whole tool consumed per job.\n\nQuantity calculation is specified in section 8 `owned_asset_normalize`. Range evidence need: exact asset manufacture/BOM, actual maintenance, all consuming jobs/periods, service-life utilization and remaining-use uncertainty are required. No default lifetime, reuse count or generic embodied mass per system is justified.\n\n- Collection subject: Attributed share of each operator-owned reusable asset\n- Flow property / unit: Number of items / item\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_services`\n- Sources: `ctec-standard`\n\n#### Collection requirement: Compatible initiation, notification and end-of-line devices by SKU (`field_alarm_devices`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nExpand detectors, bases, manual call points, polarised sounders and end-of-line devices into separate actual product identities. Retain detector/manual initiation circuits separately from notification circuits. Measure exact SKU mass by weighing or SKU-specific count-to-mass evidence, including replacements consumed in correction. Record included panel accessories once and reconcile the accepted device BOM and circuit terminations.\n\nQuantity calculation is specified in section 8 `normalize_exchange`. Range evidence need: actual device-type BOM, compatible SKU masses, circuit loading and design coverage are required; one heterogeneous device total and a universal devices-per-system interval are invalid.\n\n- Collection subject: Compatible initiation, notification and end-of-line devices by SKU\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources: `ctec-standard`\n\n#### Collection requirement: Permanent new VRLA standby batteries by SKU (`standby_batteries`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nFor the representative CFP route, record the two compatible new 12 V VRLA batteries connected in series, including exact capacity, approval applicability and supplied condition. Weigh each SKU or use its traceable count-to-net-mass factor. Battery sizing must follow the actual load, required standby/alarm periods and applicable manufacturer approval; the cited approval condition is not a universal battery specification. Pre-handover recharge electricity belongs to installation_electricity, separately from battery manufacture.\n\nQuantity calculation is specified in section 8 `normalize_exchange`. Range evidence need: exact battery datasheet, approval/design requirement, accepted pair BOM and actual mass are required. Manufacturer standby Ah examples are neither installation energy nor universal battery consumption ranges.\n\n- Collection subject: Permanent new VRLA standby batteries by SKU\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources: `ctec-standard`\n\n#### Collection requirement: Circuit and installer-supplied feeder cable by SKU (`alarm_cable`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nIdentify each actual fire-resistant screened alarm cable by construction and rating. Retain measured route, termination slack, issued length, offcuts and replacement length; obtain kg using direct weighing or the matching SKU kg/m factor. Record a panel feeder only for the segment actually supplied by this installer downstream of the agreed isolated mains interface. Existing dedicated supply and major trays are starting-condition assets, not new cable consumption.\n\nQuantity calculation is specified in section 8 `normalize_exchange`. Range evidence need: actual circuit lengths, core/rating, slack and termination requirements, exact kg/m evidence and cutting/rework records are needed; no universal cable mass per system is established.\n\n- Collection subject: Circuit and installer-supplied feeder cable by SKU\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources: `ctec-standard`\n\n#### Collection requirement: Installed fixings, glands, local containment and labels by SKU (`fixings_and_containment`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nInstantiate actual supplied screws, anchors, glands, supports, short containment and labels separately. Weigh each material/SKU or use its measured unit mass and actual issue count. Link installed counts to the accepted wall/routes and distinguish prepared building structure or major existing trays. Cable-entry preparation and screen/earth terminations remain assembly duties, not a separate fabricated product.\n\nQuantity calculation is specified in section 8 `normalize_exchange`. Range evidence need: accepted configuration, actual installed/issued counts and SKU masses are required; prepared major supports and building structure cannot supply a new-material interval.\n\n- Collection subject: Installed fixings, glands, local containment and labels by SKU\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources: `ctec-standard`\n\n#### Collection requirement: Consumed test, reset and cleaning materials by product (`test_cleaning_consumables`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nInclude only actual consumed wipes, cleaning products or other reset/test materials. Record the cleaned/tested object and event, exact SKU, issues, unused returns, container tare and residue; quantify net product mass by weighing or matching SKU factor. A reused reset key or tester is equipment, not consumable material. Separate wipe substrate, supplied formulation and outgoing contamination to avoid counting the same constituent twice.\n\nQuantity calculation is specified in section 8 `normalize_exchange`. Range evidence need: actual object/event coverage, SKU and issued/returned/residue/wipe measurements are required; dose observations apply only to the same device and method.\n\n- Collection subject: Consumed test, reset and cleaning materials by product\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources:\n\n#### Collection requirement: Genuine complete contracted equipment or access service event (`hired_support_service`)\n\nProcess / prospective direction / type: `install_accept` / `inputs` / `product`.\n\nUse this counted card only for an actual complete provider-defined event with explicit equipment/configuration and deliverable, evidenced by contract and completion record. Count completed events and their actual consumer share under cp_services. A real hourly rental retains its true quantity and requires scope/measurement review and verified Duration support; never convert hours into an invented item event. Record provider manufacture, maintenance, fuel and electricity inclusions before adding any separate resource.\n\nQuantity calculation is specified in section 8 `normalize_exchange`. Range evidence need: actual event definition or hourly contract, configuration/capacity, provider inclusions and all consumer shares are required. Hourly Duration is unresolved and is not covered by this count unit.\n\n- Collection subject: Genuine complete contracted equipment or access service event\n- Flow property / unit: Number of items / item\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_services`\n- Sources:\n\n#### Collection requirement: Usable unchanged stock returned by SKU (`unused_product_return`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `product`.\n\nRecord actual usable unchanged components, cable, consumables or reusable packaging that leave installer custody. Preserve original SKU/state and recipient, and measure net mass by weighing or exact count/length-to-mass factor. Pair the return transfer with its original issue. Keep gross issues and returns as auditable observations; charge net consumed upstream supply once under section 7 without deducting the return twice. Failed or contaminated items are not usable returns.\n\nQuantity calculation is specified in section 8 `normalize_exchange`. Range evidence need: linked measured gross issues, unchanged state and actual returns by SKU are required; no default return fraction or automatic credit is established.\n\n- Collection subject: Usable unchanged stock returned by SKU\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_materials`\n- Sources:\n\n#### Collection requirement: Dry packaging, offcuts and captured residues by recipient (`dry_material_waste`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `waste`.\n\nWeigh each real dry material stream with container tare and dispatch evidence, retaining material, state and actual receiver. Link packaging waste to its received physical pool even when packaging burden is embedded upstream. Keep captured dust in the applicable waste stream; an actual atmospheric fraction is distinct. Separate recycling destination evidence from any downstream treatment/recovery model; do not claim an avoided-product credit here.\n\nQuantity calculation is specified in section 8 `residual_normalize`. Range evidence need: weighed stream-specific manifests, source-pool links and actual diversion routes are required. Nominal component mass gives no waste-rate interval.\n\n- Collection subject: Dry packaging, offcuts and captured residues by recipient\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_residuals`\n- Sources:\n\n#### Collection requirement: Rejected or removed electrical components and VRLA waste (`rejected_component_waste`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `waste`.\n\nLink each nonusable panel, detector/base, manual call point, sounder/EOL part, damaged cable assembly or failed battery to its original issue, defect and correction event. Weigh each actual waste state or use exact SKU count/mass, with dispatch and authorised recipient. Keep battery, electronic and cable wastes separate. Internal repair is not a new product transfer; usable unchanged parts return under unused_product_return.\n\nQuantity calculation is specified in section 8 `residual_normalize`. Range evidence need: actual fault, removal/retest, original issue, classification and weighed dispatch records are required. There is no default defect rate; zero requires complete event coverage.\n\n- Collection subject: Rejected or removed electrical components and VRLA waste\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_residuals`\n- Sources:\n\n#### Collection requirement: Contaminated wipes, containers and formulation residues (`contaminated_solid_waste`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `waste`.\n\nRecord each actual contaminated wipe/container or residual formulation stream at its accepted waste receiver, with composition, physical state, gross mass and tare. Distinguish clean recyclable packaging and usable returns. Reconcile the supplied wipe/formulation constituent pool with retained residue and any independently evidenced emission. Gross chemical issues are not automatically evaporation.\n\nQuantity calculation is specified in section 8 `residual_normalize`. Range evidence need: formulation-specific residue, container tare, wipe mass and recipient acceptance are required; no all-chemical evaporation assumption is valid.\n\n- Collection subject: Contaminated wipes, containers and formulation residues\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_residuals`\n- Sources:\n\n#### Collection requirement: Evidenced material-specific airborne particulate fraction (`airborne_particulate`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `elementary`.\n\nActivate only for a measured or independently supported atmospheric release from actual drilling/cable preparation. Identify substrate/material, tool, capture control, particle-size/fraction basis and actual receiving air compartment. Quantify by monitoring or a matching material/tool/control-specific factor times measured activity, then apply emission_normalize. Captured dust remains waste; never use unexplained custody residuals as an air release.\n\nQuantity calculation is specified in section 8 `emission_normalize`. Range evidence need: matching substrate/tool/capture, particle-size basis, activity and release-factor/monitoring evidence are required; generic dust or balancing-loss quantities are unavailable.\n\n- Collection subject: Evidenced material-specific airborne particulate fraction\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_residuals`\n- Sources:\n\n#### Collection requirement: Identified test-agent constituent released to actual air compartment (`test_agent_constituent_to_air`)\n\nProcess / prospective direction / type: `install_accept` / `outputs` / `elementary`.\n\nFor actual physically consumed test agent, identify each substance and receiving subcompartment before defining an elementary exchange. Use species monitoring or a product-specific SDS composition and evidenced delivered/captured/residual partition method under solvent_partition. Keep constituent quantities compatible with the consumed formulation pool. Neither device-test count, an undifferentiated VOC label nor a 100% release assumption establishes substance mass or destination.\n\nQuantity calculation is specified in section 8 `solvent_partition`. Range evidence need: exact product/SDS, constituent composition and delivered/captured/residual fractions are required. No generic aerosol/VOC interval or air subcompartment is inferred.\n\n- Collection subject: Identified test-agent constituent released to actual air compartment\n- Flow property / unit: Mass / kg\n- Amount rule: Actual attributable numerator divided by D; retain raw records and the corresponding measurement basis\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `process_output`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_residuals`\n- Sources:\n\n"
