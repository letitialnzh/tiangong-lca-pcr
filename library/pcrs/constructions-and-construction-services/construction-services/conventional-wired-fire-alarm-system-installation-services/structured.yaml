      rule: "Identify each shared asset: operator-owned tool/tester/external charger/access equipment and provider-owned services used across jobs/periods. Index every benefiting job and period, from manufacture/acquisition through service, maintenance/replacement to retirement/termination. Preserve actual remaining-use uncertainty. Do not repeat provider asset manufacture."
