allocation_rules:
  - rule_id: allocation_service
    applies_to: "both nodes"
    rule: "No co-product credit for retained rails, removed failed gland, scrap or waste. Preserve all actual removal/preparation/rework/test burdens in the intervention; assign only accepted complete-joint length L as service denominator. Failed host/rejected joint has no accepted output; disclose its burden and final route rather than hiding it."
    source_ids: []
  - rule_id: material_custody
    applies_to: "both nodes"
    rule: "Input quantities remain gross net-of-tare before outward return netting. Reconcile receipt/issue with actual installed/used, real usable return, waste, release and closing stock by identity. Transfer evidenced opening-stock burden into this intervention and carry unused closing-stock burden into its later use; never represent retained stock as outward product. Use receipts or attributable internal issues without counting both for the same material. A consumed-only upstream fuel alternative excludes only matched usable outward returns once; nonreturned unburned waste and loss retain their supply burden. Metered burned fuel is combustion activity, never the sole upstream input."
    source_ids: []
  - rule_id: shared_life
    applies_to: "prepare_assets; install_assets"
    rule: "For each asset use actual job-node service over complete-life service; enumerate rail_qualification and gland_integration, all other jobs and reporting periods and lifecycle phases. Cover manufacture, maintenance, replacements and EOL once. Use completed observed histories or justified prospective remaining-service/replacement/termination/EOL scenario for an in-service asset; label observed/forecast and update/sensitivity. No duplicate direct fuel, spare, tool or provider-included capital."
    source_ids: []
  - rule_id: rework_routing
    applies_to: "both nodes"
    rule: "Dirty cavity loops within rail_qualification; failed seating, tearing, leakage or misfit loops within gland_integration or returns via paired transfer to rail_qualification. Keep repeat energy/materials/test resources, route removed rejects to actual usable return or classified waste, and count final accepted length once. No future unowned cleanup/test task may close the gate."
    source_ids: []
  - rule_id: periods
    applies_to: "both nodes"
    rule: "Index work windows, storage/idle/protection periods and repeat visits; link every input/event/output and shared-asset phase to its period and single owner. Sum the same intervention once across periods; do not annualise service output or invent future operating life."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_prepare_materials
      process_id: "rail_qualification"
      flow_role: "gross supplied materials, real usable returns and retained stock"
      record_type: "receipt_issue_balance"
      raw_fields: "event_id; job_id; joint_id; period_id; material_id; formulation; profile; batch; supplier_gate; instruction_revision; gross_kg; tare_kg; measured_volume_m3; density_kg_per_m3; temperature_C; density_source; opening_stock_kg; opening_stock_burden_record; closing_stock_burden_carryforward; receipt_kg; issue_kg; outward_return_kg; closing_stock_kg; installed_retained_kg; liquid_water_kg; dry_solids_kg; measured_length_m; mass_per_length_kg_per_m; transfer_id"
      collection_method: "Weigh gross containers/vehicles and tare separately; retain tickets, calibrated meter records and actual formulation/profile certificates. Record quantities before outward returns; use receipts or attributable internal issues without double counting. Transfer the evidenced opening-stock burden into this intervention and carry unused closing-stock burden forward; a physical stock change never silently removes or creates upstream burden. Use measured_volume_m3, actual temperature_C and evidenced density_kg_per_m3/density_source for each actual liquid conversion; kg = m3 times kg/m3, without defaults. Reconcile each material over periods, cut-offs, waste and actual releases; profile-specific gland mass/length requires batch evidence. Trace water supply, host/weather water and destination separately."
      unit: "kg; m; m3; kg/m3; °C"
      frequency: "Each event, run, receipt/return, test and handoff; close each work period"
      temporal_coverage: "Entire intervention including repeat visits and failures; assets across complete life"
      site_scope: "Identified joint/site and actual provider/asset fleet; other consumers for shared burdens"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable identities/units, calibration, dated tickets/logs and approval sources; completeness and uncertainty; actual accepted L denominator and no duplicated owner"
    - protocol_id: cp_prepare_energy
      process_id: "rail_qualification"
      flow_role: "purchased energy, actual fuel and external compressed air"
      record_type: "meter_and_fuel_balance"
      raw_fields: "event_id; job_id; period_id; equipment_id; provider_gate; fuel_identity; measured_volume_m3; density_kg_per_m3; temperature_C; density_source; opening_fuel_kg; opening_stock_burden_record; closing_stock_burden_carryforward; receipt_fuel_kg; closing_fuel_kg; returned_fuel_kg; collected_unburned_fuel_waste_kg; uncontained_unburned_fluid_release_kg; incident_total_kg; recovered_incident_waste_kg; recovered_incident_return_kg; retained_incident_stock_kg; other_unburned_outlet_kg; burned_fuel_kg; electricity_start_kWh; electricity_end_kWh; supplied_air_m3; metered_air_pressure_kPa; metered_pressure_basis; reference_air_pressure_kPa; reference_pressure_basis; atmospheric_pressure_kPa; metered_air_temperature_C; reference_air_temperature_C; metered_air_moisture; reference_air_moisture; air_conversion_source; service_time_h; shared_consumers; attribution_evidence"
      collection_method: "Meter delivered electricity; weigh actual fuel or convert measured_volume_m3 using actual temperature_C and evidenced density_kg_per_m3/density_source; kg = m3 times kg/m3. Balance exclusive outlets: all collected unburned fuel waste, actual uncontained unburned fluid release and any other distinct unburned outlet are subtracted once. Spill total is only an audit partition; recovered waste/returns/retained stock are assigned to their outlet once, never subtracted again. Carry opening-stock burden in and unused closing-stock burden forward, using receipts or attributable internal issues without duplication. Derive burned activity independently of gross input. Meter externally purchased air at a declared pressure/temperature/moisture state: record metered and reference pressure as absolute or gauge, actual atmospheric pressure if conversion requires it, both temperature/moisture states and an applicable conversion source. No reference-state or pressure-basis default is allowed; on-site compression owns fuel/electricity instead. Record all run, idle/protection, failed-work and test periods, actual shared attribution and included provider boundaries."
      unit: "kg; kWh; m3; kg/m3; kPa; °C; h"
      frequency: "Each event, run, receipt/return, test and handoff; close each work period"
      temporal_coverage: "Entire intervention including repeat visits and failures; assets across complete life"
      site_scope: "Identified joint/site and actual provider/asset fleet; other consumers for shared burdens"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable identities/units, calibration, dated tickets/logs and approval sources; completeness and uncertainty; actual accepted L denominator and no duplicated owner"
    - protocol_id: cp_prepare_assets
      process_id: "rail_qualification"
