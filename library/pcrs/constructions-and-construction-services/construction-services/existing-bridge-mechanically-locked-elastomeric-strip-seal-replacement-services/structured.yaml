    applies_to: "joint qualification and acceptance"
    required_property_ref:
      name: "Actual measured condition"
      uuid: ""
    required_unit: "mm; °C; h; actual test unit"
    rule: "Record opening, ambient/pavement temperature, timing and any required test quantity with units, tolerances and current approved instruction/owner source. L2 page2inch ease minimum is model-specific guidance, not a universal gap, setting or performance factor."
  - id: count_unit_alias
