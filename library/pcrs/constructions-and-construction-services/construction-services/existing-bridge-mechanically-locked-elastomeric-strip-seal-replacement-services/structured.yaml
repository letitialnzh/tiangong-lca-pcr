product_category_identity:
  canonical_pcr_id: "pcr.existing-bridge-mechanically-locked-elastomeric-strip-seal-replacement-services"
  classification_refs: "CPC 3.0 54221; narrower than General construction services of bridges and elevated highways"
  covered_products: "Accepted replacement of a matched continuous gland in sound retained single-gap bridge joint rails"
  excluded_products: "New bridge/joint construction; rail/header/anchor renewal; multi-gap reconstruction; field splicing; manufactured gland product alone; foam/compression/pourable seals"
  representative_product: "L2-family factory gland matched to retained SSPA or SSCM rails, at authorised maintenance handback"
  production_route: "Failed gland extraction and cavity preparation/qualification -> matched gland/adhesive integration -> complete-joint inspection, actual required test and handback"
  market_state: "Completed maintenance service on an identified existing joint; supplied factory gland and liquid adhesive are inputs, not the reference service"
functional_unit:
  what: "Mechanically locked elastomeric gland replacement in an identified retained sound single-gap bridge expansion joint"
  how_much: "1 m of accepted replacement along the measured as-built joint/seal centreline; actual upturns and factory mitres are included in the declared geometry"
  how_well: "Matched profile, movement duty, gap and temperature; clean qualified channels; both lugs fully seated without twist, stretch or damage; endpoints/mitres/upturns and cleanup accepted; actual required inspection/test criteria passed"
  how_long_or_cycle: "One complete intervention from protected access and removal through authorised maintenance handback, including repeats and defect closure; no promised future seal lifetime. Declare work periods and complete equipment-life phases separately."
  reference_flow_link: "accepted_gland_replacement"
system_boundary:
  rules:
    - rule_id: retained_host
      applies_to: "both nodes"
      rule: "Include incremental removal, preparation, actual minor sharp-edge/debris work, integration, protection, transport, testing, cleanup and defects. No full-new-bridge/joint charge or avoided virgin-rubber/replacement credit. Major host damage exits this scope explicitly."
      source_ids:
        - dsbrown-strip-seal-replacement-2024
        - dsbrown-l2-installation-2024
    - rule_id: qualification_gate
      applies_to: "rail_qualification"
      rule: "Input is failed gland within retained rails. Output is both clean unobstructed cavities checked at splices/edges and qualified for actual compatible profile/gap/weather; record removal and conditional abrasive cleaning. Contaminated cavities return within this node; damaged host stops integration."
      source_ids:
        - dsbrown-strip-seal-replacement-2024
        - dsbrown-l2-installation-2024
    - rule_id: integration_gate
      applies_to: "gland_integration"
      rule: "Inputs are qualified retained cavities, matched factory gland and specified lubricant adhesive. Integrate progressively on both sides without twist; fit actual factory mitres/upturns/endpoints; remove excess adhesive and tape. Only accepted complete joint exits; failed seating returns to this node or qualification. Actual owner-required watertightness test has declared method/threshold/responsibility."
      source_ids:
        - dsbrown-strip-seal-replacement-2024
        - dsbrown-l2-installation-2024
    - rule_id: utility_ownership
      applies_to: "both nodes"
      rule: "Own actual compressor, pulling/cutting/installation and test/protection resources once. Ambient air compressed on site has compressor energy; a purchased compressed-air product has a declared gate. Do not count a bundled compressor service plus its included energy again."
      source_ids:
        - dsbrown-strip-seal-replacement-2024
    - rule_id: chemical_custody
      applies_to: "both nodes"
      rule: "Separate supplied liquid, retained/applied material, real product return, collected chemical waste and actual species release. SDS composition is not an emission factor; no automatic VOC, decomposition products or water-only adhesive. Select actual cleaner; manufacturer solvent examples do not mandate toluene."
      source_ids:
        - dsbrown-1520-sds-2020
        - dsbrown-strip-seal-replacement-2024
    - rule_id: assets_periods
      applies_to: "both nodes"
      rule: "Include complete-life provision of shared extraction/insertion/air/blast/measuring/test/traffic-control assets across every consuming node, job and period. Manufacture, maintenance, replacement and EOL are covered once with observed or justified prospective history/scenario; exclude duplicated direct fuel/spares already recorded. Missing evidenced life coverage or denominator blocks finalisation."
