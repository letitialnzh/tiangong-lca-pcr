measurement_rules:
  - id: reference_length
    applies_to: "accepted_gland_replacement"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "Measure actual accepted seal centreline L with factory mitre/upturn geometry; repeated seating and parallel sides never multiply L. Full-joint acceptance is a gate, not a fractional output credit."
  - id: handoff_length
    applies_to: "qualified_rails_transfer; qualified_rails_input"
    required_property_ref:
      name: "Length"
      uuid: ""
    required_unit: "m"
    rule: "Pair transfer IDs and actual prepared channel coverage. A service length denotes one joint with both cavities qualified, not twice the length for two rails; do not force incomplete internal coverage to the final reference."
  - id: material_mass
    applies_to: "gland_supply; adhesive_supply; material_returns; removed_gland_waste; gland_offcuts"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record gross net-of-tare quantities before outward returns. Profile-specific measured mass-per-length may convert actual gland length to mass only with batch/profile evidence; no generic rubber density or elongation assumption."
  - id: transport_basis
    applies_to: "prepare_transport; install_transport"
    required_property_ref:
      name: "mass*distance"
      uuid: ""
    required_unit: "kg*km"
    rule: "Sum actual cargo mass kg times actual loaded-leg km per identified service; preserve empty-leg treatment and provider boundary; convert t*km only with verified factor1000."
