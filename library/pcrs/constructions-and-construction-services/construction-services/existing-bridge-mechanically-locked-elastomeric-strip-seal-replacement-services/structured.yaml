  calculation_rules:
    - id: calc_length_intensity
      applies_to: "all inventory rows"
      rule: "For each identified exchange divide its attributable intervention quantity Q in its native unit by accepted complete-joint length L in m; retain unit/m. The reference definition is 1 m. Sum repeats and periods once; do not sum heterogeneous identities. Internal coverage is actual paired transfer length divided by L."
      inputs:
        - Q
        - L
        - "corresponding node protocol"
        - cp_install_gate
      output: "Native-unit intensity per1 m accepted service"
      source_ids: []
    - id: calc_gland_mass
      applies_to: "gland_supply"
      rule: "Gland mass kg = actual supplied gland length m times evidenced same-batch/profile mass-per-length kg/m, or direct calibrated mass. Include actual factory geometry; do not assume elastic stretching or generic rubber density. Use gross net-of-tare supply before return netting."
      inputs:
        - cp_install_materials
        - measured_length_m
        - mass_per_length_kg_per_m
      output: "Actual supplied gland kg, then divide by L"
      source_ids: []
    - id: calc_fuel
      applies_to: "prepare_fuel; install_fuel; prepare_air_release; install_air_release"
      rule: "Burned fuel kg = opening fuel + gross receipts - closing fuel - outward usable returns - all collected unburned fuel waste - actual uncontained unburned fluid releases - any other distinct unburned outlet. Every outlet is mutually exclusive. Total spill is an audit partition only, never an additional subtraction: its recovered portion is included once in collected unburned fuel waste, usable return or closing stock, while its uncontained portion is included once in the actual unburned fluid release outlet. Retained incident residue belongs to closing stock or a distinct mutually exclusive unburned outlet. Carry opening-stock burden in and closing-stock burden forward; record receipts or attributable internal issues without duplication. Exclude provider-included fuel."
      inputs:
        - cp_prepare_energy
        - cp_install_energy
        - cp_prepare_waste
        - cp_install_waste
      output: "Burned fuel activity kg separately from gross input kg"
      source_ids: []
    - id: calc_asset_share
      applies_to: "prepare_assets; install_assets"
      rule: "For each actual asset, provision item =1 item times node-job service h divided by complete-life service h; then divide by accepted L. Complete-life service includes all observed history plus justified prospective remaining service for an in-service asset. Full provision covers manufacture, maintenance, replacements and EOL once, excluding direct quantities owned elsewhere. Same service unit and all consumers/phases required."
      inputs:
        - cp_prepare_assets
        - cp_install_assets
        - node_service_h
        - complete_life_service_h
      output: "Fractional asset provision item per m"
      source_ids: []
    - id: calc_transport
      applies_to: "prepare_transport; install_transport"
      rule: "Transport kg*km = sum of actual net cargo kg times leg km by identical provider/mode service; then divide by L. Retain actual empty-leg/shared-load attribution and boundary. A verified t*km unit has factor 1000 kg*km per t*km."
      inputs:
        - cp_prepare_assets
        - cp_install_assets
        - cargo_gross_kg
        - cargo_tare_kg
        - leg_km
      output: "kg*km per m by actual service"
      source_ids: []
    - id: calc_release
      applies_to: "prepare_air_release; prepare_water_release; install_air_release; install_water_release"
      rule: "For each substance/receiver, release kg = measured release mass, or actual compatible activity times evidenced applicable factor kg/activity, or concentration kg/m3 times actual discharge m3. Use one justified path and compatible units; then divide by L. Account for retained/collected/captured material and actual reaction/weather terms. SDS composition and uncharacterised residual are not release factors."
      inputs:
        - cp_prepare_waste
        - cp_install_waste
        - "actual activity"
        - "applicable factor"
        - "receiving compartment"
      output: "Species-specific release kg per m"
      source_ids: []
  data_quality_requirements:
    - id: identity_quality
      applies_to: "all inventory rows"
      requirement: "Expand variable cards to each actual distinct material, formulation, waste stream, service or elementary species/receiver. Verify concrete identity/property/unit before final exchange binding; a generic placeholder is not a final dataset exchange."
      evidence: "Actual product/rail/gland certificates, current SDS, provider gates and identity detail verification"
    - id: gate_quality
      applies_to: "rail_qualification; gland_integration"
      requirement: "Retain paired transfer, sound host/profile suitability and whole-joint seating/continuity/cleanup evidence; only actual owner-required testing has declared method/threshold/tolerance/responsibility. Accepted L excludes unresolved rejected output."
      evidence: "cp_prepare_gate; cp_install_gate; signed defect closure and authorised handback"
    - id: balance_quality
      applies_to: "both nodes"
      requirement: "Reconcile net-of-tare gross receipts/issues, actual use/installation, outward returns, retained stock, wastes and species releases by identity; no stock-as-product, double-netting, captured-waste-as-release or residual-as-emission."
      evidence: "cp_prepare_materials; cp_install_materials; cp_prepare_waste; cp_install_waste; mass/length and water/dry-solids balances"
    - id: life_quality
      applies_to: "prepare_assets; install_assets"
      requirement: "Missing complete-life coverage/service denominator blocks finalisation; prospective future phases may be justified, never assumed as observed. Record forecast/observed labels, source, update trigger and sensitivity."
      evidence: "cp_prepare_assets; cp_install_assets; phase/job/period ledger and provider-scope reconciliation"
    - id: coverage_quality
      applies_to: "all inventory rows"
      requirement: "Record actual applicable/zero/not-applicable/gap state and reason for every card; quantify uncertainty from measurement, allocation, forecast and factors. Missing important identity/quantity/capture or required owner acceptance blocks complete dataset finalisation."
      evidence: "Node-event-period matrix, calibration, source revisions and Range evidence needs resolved by actual records"
validation_rules:
  - rule_id: validate_host
    applies_to: "rail_qualification"
    rule: "Reject unsupported host soundness, profile/gap/weather suitability, incomplete both-cavity preparation or unpaired handoff. Major damaged rails/header/anchors require broader scoped work; do not hide it as cleaning."
    source_ids:
      - dsbrown-strip-seal-replacement-2024
      - dsbrown-l2-installation-2024
  - rule_id: validate_acceptance
    applies_to: "gland_integration"
    rule: "Require compatible supplied gland/adhesive, complete both-side seating without damage/twist/stretch, correct factory geometry/endpoints, excess adhesive/tape cleanup, actual setting/owner inspection and any required test/defect closure, signed handback and measured positive L. Partial leaking/rejected joint creates no accepted L."
    source_ids:
      - dsbrown-strip-seal-replacement-2024
      - dsbrown-l2-installation-2024
  - rule_id: validate_identity
    applies_to: "all inventory rows"
    rule: "Final dataset exchanges require actual distinct identities, verified UUID/property/unit and exact supplier/receiver state. Unknown actual identity, generic rubber/glue or unspeciated pollution is not a fixed match. Keep candidate semantic gaps explicit until resolved."
    source_ids: []
  - rule_id: validate_custody
    applies_to: "both nodes"
    rule: "Check gross net-of-tare inputs before outward return netting, actual stock/installed/waste/release closure, profile-specific gland mass/length and water/dry-solids balance. Separate fuel gross issue from burned activity and mutually exclusive unburned waste/fluid-release outlets; total spill is audit-only, never a second subtraction. Carry opening-stock burden in and closing-stock burden forward; no inferred residual release or SDS composition-as-emission."
    source_ids:
      - dsbrown-1520-sds-2020
  - rule_id: validate_shared_life
    applies_to: "both nodes"
    rule: "Check all consuming nodes/jobs/periods and complete-life phases with observed/forecast labels and evidenced service denominator, replacement/termination/EOL scenario and uncertainty/sensitivity. Missing coverage blocks finalisation. Check no provider/direct fuel/spares/transport/capital duplication."
    source_ids: []
  - rule_id: validate_rework_period
    applies_to: "both nodes"
    rule: "Trace each dirty cavity, misfit/torn gland, leak or failed test to its producing node, repeat loop or actual exit; retain all burdens, close defects and count accepted length once across periods. No rejected output or unowned future task is an accepted handback."
    source_ids: []
  - rule_id: validate_range
    applies_to: "all inventory rows"
    rule: "Resolve every card Range evidence need from actual site/profile/technology records or applicable external quantitative evidence; report missing quantities and uncertainty explicitly. Exact1 m defines the reference, not a generic material/energy quantity."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projections"
  allowed_use: "Declared profile/movement-duty maintenance intensity per1 m of fully accepted complete-joint gland replacement on qualified retained single-gap rails"
  excluded_use: "New bridge or rail/header construction, all CPC54221 services, modular reconstruction, manufacture-only gland, future bridge use, universal seal lifespan/performance claim or incomplete leaking-joint acceptance"
  required_metadata: "PCR/version; bridge/joint/geometry and accepted L; actual rail/gland/adhesive/cleaner specification and revision; gap/temperature/work periods; methods; provider gates; actual test/criteria/responsibility and handback; reference/property/unit; source and collection coverage"
  required_quality_disclosure: "Each actual identity/quantity and Range evidence; excluded host history; preparation/rework/reject paths; gross supply/return/stock/waste/release closure; shared complete-life observed/forecast attribution and uncertainty/sensitivity; transport/provider duplication check; remaining gaps"
  update_trigger: "Changed profile/formulation/rail condition or method; revised instruction/SDS/owner criteria; altered supplier/waste destination; new measurements/factors; changed asset forecast/termination or coverage and new defect/rework evidence"
