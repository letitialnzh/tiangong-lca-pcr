allocation_rules:
  - rule_id: retain_rework
    applies_to: "all processes"
    rule: "Retain burdens from failed tests, rejected pours and routine rework in the originating accepted service lot; track placement→finishing or finishing→curing rework and return to placement for replacement with event ids. Count final accepted geometry once."
    source_ids: []
  - rule_id: run_attribution
    applies_to: "all processes"
    rule: "Use identified pours and curing periods as production batches; assign startup, changeover and cleanup by event-linked measured activity. Shared events have one owner and documented shares summing to one across all consumers."
    source_ids: []
  - rule_id: shared_energy
    applies_to: "all processes"
    rule: "Prefer submetering. If absent, estimate node shares from recorded operating time, rated/observed power and utilization, disclosing uncertainty; never charge grid electricity and generator fuel for the same generation twice."
    source_ids: []
  - rule_id: no_automatic_credit
    applies_to: "returned_fresh_concrete; waste outputs"
    rule: "Record product returns or waste exits by recipient acceptance and legal status. No automatic avoided concrete or recycling credit; any consequential credit requires a separate declared study method."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_placement
      process_id: "placement"
      flow_role: "all inventory rows in this node"
      record_type: "event ledger, measurements and acceptance"
      raw_fields: "pour_id; delivery_id; event_id; transfer_id; asset_id; operating time; metered or rated power; utilization; consumer share; fuel carbon fraction/method; fossil carbon mass fraction and denominator; carbon oxidized-to-CO2 fraction; chosen combustion factor value/unit/source and applicability; factor uncertainty; fuel density/temperature/lower heating value; received fresh volume; measured density; diesel; electricity; water; equipment hours; dispatch_id; carrier; payload tonnes; route kilometres; empty-return activity; mobilization ownership/share; return volume; waste/slurry mass; emissions species and medium; direct washout release event and destination compartment; released liquid volume or mass; measured substance concentration, sampling time and unit; containment/treatment split; inventory changes"
      collection_method: "Reconcile signed event records, calibrated meters, supplier tickets, measured geometry/density, testing and recipient receipts; distinguish measurements from estimates and absence evidence."
      unit: "m3; kg; kWh; h; t; km; t*km"
      frequency: "each event/shift; continuous curing log"
      temporal_coverage: "complete pour through cure acceptance"
      site_scope: "declared single site and node"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed tickets; calibration; geometry/test and balance evidence"
    - protocol_id: cp_finishing
      process_id: "finishing"
      flow_role: "all inventory rows in this node"
      record_type: "event ledger, measurements and acceptance"
      raw_fields: "pour_id; event_id; transfer_id; asset_id; operating time; metered or rated power; utilization; consumer share; feed and finished volumes; surface specification; electricity; consumables; residues; actual emission substance/air compartment/particle size; rework events"
      collection_method: "Reconcile signed event records, calibrated meters, supplier tickets, measured geometry/density, testing and recipient receipts; distinguish measurements from estimates and absence evidence."
      unit: "m3; kg; kWh; h; t; km; t*km"
      frequency: "each event/shift; continuous curing log"
      temporal_coverage: "complete pour through cure acceptance"
      site_scope: "declared single site and node"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed tickets; calibration; geometry/test and balance evidence"
    - protocol_id: cp_curing
      process_id: "curing"
      flow_role: "all inventory rows in this node"
      record_type: "event ledger, measurements and acceptance"
      raw_fields: "pour_id; event_id; transfer_id; asset_id; operating time; metered or rated power; utilization; consumer share; feed volume; accepted net volume; dimensions; voids; cure start/end; water; materials; electricity; tests; acceptance; rejects; actual substance/medium releases"
      collection_method: "Reconcile signed event records, calibrated meters, supplier tickets, measured geometry/density, testing and recipient receipts; distinguish measurements from estimates and absence evidence."
      unit: "m3; kg; kWh; h; t; km; t*km"
      frequency: "each event/shift; continuous curing log"
      temporal_coverage: "complete pour through cure acceptance"
      site_scope: "declared single site and node"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed tickets; calibration; geometry/test and balance evidence"
  calculation_rules:
    - id: normalize_service
      applies_to: "all inventory rows"
      rule: "Divide each attributable event amount by accepted net in-place volume for the same pour set; report per reference flow. Preserve physical internal transfers before normalization."
      inputs:
        - "attributable event amount"
        - "accepted net volume"
        - cp_placement
        - cp_finishing
        - cp_curing
      output: "amount per reference flow"
      source_ids: []
    - id: receipt_reconcile
      applies_to: "fresh_concrete; returned_fresh_concrete; placement_concrete_waste"
      rule: "Reconcile received fresh volume with placed volume, supplier return, sampled volume, spills/pump residuals and stock change on compatible fresh-state bases; do not equate fresh volume with cured volume without evidence."
      inputs:
        - "delivery tickets"
        - "measured density"
        - "transfer ledger"
        - "return/waste receipts"
        - cp_placement
      output: "reconciliation and residual explanation"
      source_ids: []
    - id: mobilization_activity
      applies_to: "placement_mobilization_transport"
      rule: "For each loaded leg calculate payload tonnes × actual kilometres, apply its documented consumer share, and sum legs before normalize_service. Retain carrier evidence for empty-return coverage; never multiply an empty load by zero to erase its burden. If using a vehicle-service model, document its compatible t*km conversion and parameters; do not add return/fuel already included in the carrier or hire dataset."
      inputs:
        - cp_placement
        - dispatch_id
        - "payload tonnes"
        - "route kilometres"
        - "consumer share"
        - "carrier empty-return coverage"
        - "model and unit-conversion evidence"
      output: "attributable transport t*km per pour set before normalization"
      source_ids: []
    - id: fossil_carbon_emission
      applies_to: "placement_fossil_co2"
      rule: "Choose one documented method: m_CO2 = m_fuel × w_fossil_C × f_oxidized_to_CO2 × 44/12, where w_fossil_C is kg fossil carbon per kg actual fuel and f is the fraction of that fossil carbon emitted as CO2; or multiply compatible fuel activity by a reviewed CO2 factor with explicit units. Retain measured fuel, blend composition, method/factor source, applicability and uncertainty; do not sum the alternative methods or default either fraction to 1. Apply normalize_service after calculating the pour-set total."
      inputs:
        - cp_placement
        - "fuel mass or compatible energy activity"
        - "fossil-carbon fraction and basis"
        - "oxidation-to-CO2 fraction"
        - "factor value/unit/source"
        - uncertainty
      output: "fossil CO2 kg per pour set before normalization"
      source_ids: []
    - id: washout_release_mass
      applies_to: "placement_washout_releases"
      rule: "For each verified direct-release event and substance, calculate released volume × concentration after converting both to compatible units (for example m3 × kg/m3), or released liquid mass × measured kg-substance/kg-liquid fraction. Preserve actual receiving compartment, sampling and dissolved/total basis. pH alone cannot determine substance mass. Reconcile captured/treatment/direct-release portions once, then apply normalize_service; missing composition is an explicit gap, not zero."
      inputs:
        - cp_placement
        - "release event"
        - "volume or liquid mass"
        - "concentration and unit"
        - "substance and receiving compartment"
        - "sampling evidence"
        - "containment/treatment split"
      output: "substance kg to actual water or soil compartment per pour set before normalization"
      source_ids: []
    - id: shared_share
      applies_to: "all inventory rows"
      rule: "For a measured shared event, attribute its quantity using the documented consumer share; shares across all consumers sum to 1 and event ownership is unique."
      inputs:
        - event_id
        - asset_id
        - "consumer nodes/runs"
        - "measured activity"
        - cp_placement
        - cp_finishing
        - cp_curing
      output: "attributed event quantities"
      source_ids: []
  data_quality_requirements:
    - id: gate_traceability
      applies_to: "reference product"
      requirement: "Acceptance evidence must match element, pour, specification, cure regime and net volume; unaccepted quantity stays outside denominator."
      evidence: "signed acceptance; surveyed dimensions; test records"
    - id: inventory_completeness
      applies_to: "all inventory rows"
      requirement: "Record conditional presence, absence evidence and missing-data flags separately. Expand umbrella cards into concrete exchanges and species before publishing a dataset."
      evidence: "purchase records; equipment logs; SDS; waste records"
    - id: time_coverage
      applies_to: "all processes"
      requirement: "Cover full pours plus associated curing, testing, cleanup and rework, including idle or weather-protection burdens; document exclusions and meter calibration."
      evidence: "run ledger; cure diary; calibration certificates"
    - id: provisional_ranges
      applies_to: "all inventory rows"
      requirement: "Provisional reasoned-estimate ranges are broad review prompts, never defaults or compliance limits. Replace with independent reviewed evidence; do not validate a batch with its own maximum."
      evidence: "independent reference data; uncertainty disclosure"
validation_rules:
  - rule_id: final_acceptance
    applies_to: "accepted_concrete_placement_service"
    rule: "Require 1 m3 reference definition, exact reference row link, actual accepted geometry and specified acceptance evidence; output remains a service."
    source_ids: []
  - rule_id: transfer_pair
    applies_to: "placed_concrete_transfer; finishing_concrete_feed; finished_concrete_transfer; curing_concrete_feed"
    rule: "Pair each internal handoff by transfer_id, state and measured amount; prohibit duplicate upstream products and fixed 1 m3 internal feeds."
    source_ids: []
  - rule_id: loss_and_waste
    applies_to: "all processes"
    rule: "Explain delivery/placement differences, retained water and stock changes; reconcile each return, residue, slurry and reject once with recipient/state and rework path."
    source_ids:
      - epa-concrete-washout-2012
  - rule_id: shared_and_runs
    applies_to: "all processes"
    rule: "Check pour/run/event ids, changeover ownership, all shared asset consumers and shares; totals must avoid duplicate energy, capital, mobilization and cleanup."
    source_ids: []
  - rule_id: washout_release_route
    applies_to: "placement_washout_releases; placement_wash_slurry"
    rule: "Require event-specific substance, receiving water/soil compartment and concentration/quantity evidence for each verified direct release. Keep it on placement and cp_placement, separate from custodian-bound slurry and curing releases. Reconcile pathways without double counting; unresolved composition or occurrence remains incomplete coverage rather than zero."
    source_ids:
      - epa-concrete-washout-2012
  - rule_id: actual_identity
    applies_to: "all inventory rows"
    rule: "Require verified concrete flow/property/unit identities for final dataset exchanges; unresolved semantic cards and generic species are not publishable exchanges."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground construction-service data package with flow/process/lifecyclemodel projections."
  downstream_use: "secondary_dataset; background_dataset for declared building work-package models."
  allowed_use: "Matching element, specification, placement route and acceptance gate with linked upstream/downstream packages."
  excluded_use: "Ready-mix manufacture, complete building footprint, lifetime functional comparison, roads/bridges/marine concrete or wider concrete-services coverage without review."
  required_metadata: "Site/geography; dates and pours; accepted element geometry; mix/strength/age/exposure; finish; cure period; equipment; supplier gates; exclusion ownership; capital/transport/waste policy."
  required_quality_disclosure: "Measurement coverage, missing events, estimated shares, range provenance, identity gaps, wet/dry conversions and balance residuals."
  update_trigger: "Material change in mixture, equipment, cure/finish specification, acceptance criteria, supplier boundary, measurement evidence or identity verification."
