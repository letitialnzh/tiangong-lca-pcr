boundary_abstraction:
  declared_starting_condition: "Accessible building workface; surveyed geometry and inspected, installed formwork/reinforcement/embedded items accepted by the responsible upstream package; delivered fresh concrete at site receipt."
  starting_condition_role: "Declared supplied state, not burden-free production; this PCR owns only placement, finishing and curing responsibilities."
  product_classification_scope: "Narrower than CPC 3.0 54540; construction service, not concrete product or construction asset."
  recursive_input_rule: "If a subcontractor supplies the same service category, choose either its upstream service dataset or disaggregated activity once; do not recurse indefinitely or count both."
  upstream_dataset_requirement: "Link fresh-concrete supplier manufacture and delivery datasets and responsible formwork/rebar parent packages. Link actual fuel, power, water, material, equipment and downstream waste services using matching gates."
  disclosure: "Disclose truncated tasks, ownership of delivery/washout, excluded formwork/rebar and capital policy. A whole-project model must include those packages elsewhere; this service is not a whole building result."
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted cast-in-place building concrete placement service"
    uuid: ""
  flow_property_ref:
    uuid: "93a60a56-a3c8-22da-a746-0800200c9a66"
  unit_group_ref:
    uuid: "93a60a57-a3c8-12da-a746-0800200c9a66"
  reference_unit: "m3"
  required_qualifiers:
    - "Building element"
    - "site/date"
    - "mixture and strength at specified age"
    - "exposure class"
    - "accepted net geometry"
    - "finishing specification"
    - "pumping method"
    - "cure regime and duration"
    - "acceptance gate"
    - "formwork/rebar responsibilities"
    - "supplier and delivery boundary"
    - "return/waste destinations"
    - "shared assets and study capital policy."
reference_flows:
  []
measurement_rules:
  - id: accepted_volume
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Use accepted net geometric volume; exclude voids and unaccepted/rejected work. Link acceptance record to cp_curing. Never substitute delivered fresh volume."
  - id: fresh_density
    applies_to: "fresh_concrete; returned_fresh_concrete"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "When only mass is recorded, divide mass by measured density of the same fresh batch; preserve sampling and moisture/air-content state, without a universal density."
  - id: wet_waste
    applies_to: "placement_wash_slurry; placement_concrete_waste; finishing_residues; curing_removed_materials"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain wet/dry basis and density or solids fraction for conversions; wet slurry and its separated solids must not overlap."
  - id: fuel_mass
    applies_to: "placement_diesel"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Retain measured diesel mass; volume conversion requires supplier density at declared temperature and energy conversion requires the documented lower heating value."
  - id: energy_units
    applies_to: "placement_electricity; finishing_electricity; curing_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Retain fuel mass and electricity separately; convert kWh to MJ using 3.6 only when required, and fuel mass with documented lower heating value."
process_map:
  - id: placement
    name: "Place and compact fresh concrete"
    inclusion: "required"
    inclusion_condition: "Declared normal route"
    role: "Fresh flowable mixture to compacted design geometry; transfer to finishing; own pump cleanup and placement rejects."
    quantitative_reference: "per reference flow"
  - id: finishing
    name: "Finish formed concrete surface"
    inclusion: "required"
    inclusion_condition: "Declared normal route"
    role: "Compacted parent material to specified surface; transfer to curing; link finishing corrections/residues."
    quantitative_reference: "per reference flow"
  - id: curing
    name: "Hydrate, cure, test and accept"
    inclusion: "required"
    inclusion_condition: "Declared normal route"
    role: "Binder and water hydration within finished feed to hardened accepted state; preserve retained/unreacted constituents and loss exits."
    quantitative_reference: "per reference flow"
