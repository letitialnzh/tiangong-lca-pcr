system_boundary:
  rules:
    - rule_id: service_gate
      applies_to: "all processes"
      rule: "Include actual placement, compaction, finish, cure protection, inspection, routine corrections and cleanup until specified acceptance; later structural remediation requires separate scope."
      source_ids:
        - ufgs-cast-in-place-2019
    - rule_id: reaction_boundary
      applies_to: "curing"
      rule: "Hydration changes binder/water composition within finished concrete. Distinguish retained hardened material, unreacted constituents, evaporation, removed specimens and rejects; no assumed stoichiometric pathway, reaction yield or carbonation credit."
      source_ids:
        - epa-concrete-washout-2012
    - rule_id: washout_gate
      applies_to: "placement"
      rule: "Include on-site chute/pump/tool washing when contractually owned; segregate supplier off-site drum cleaning. Contain washwater; identify actual recycler/treatment handoff and any verified direct release."
      source_ids:
