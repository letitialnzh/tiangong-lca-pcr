        cannot bind this broader conditional electricity requirement.
    - row_id: placement_wash_water
      reason: Detail-confirmed construction water8e391b63-fb41-4159-89fa-ef0f824a88ba
        has Mass reference whereas semantic card requires measured Volume/m3. No
        compatible Volume identity or actual density-conversion support
        established.
    - row_id: placed_concrete_transfer
      reason: Compacted pre-finishing internal state not established by
        material/mixing candidates; paired finishing feed shares this unresolved
        state.
    - row_id: placement_concrete_waste
      reason: Concrete state and waste-custodian handover not established by generic
        construction-waste disposal/service and unrelated slag candidates.
    - row_id: placement_wash_slurry
      reason: Wet concrete washout slurry with declared contained waste-transfer gate
        not established by source-specific wastewater or discharge candidates.
    - row_id: finishing_concrete_feed
      reason: Paired placed_concrete_transfer candidate evidence does not verify
        compacted pre-finishing internal state; no borrowed final/output UUID.
    - row_id: finishing_electricity
      reason: Shared electricity candidate/detail evidence is China<1kV AC, whereas
        actual finishing power supply is conditional and geography/voltage
        unspecified.
    - row_id: finished_concrete_transfer
      reason: Finished pre-curing state and volume gate not established by material
        mixing/in-place concrete candidates; paired cure feed shares gap.
    - row_id: curing_concrete_feed
      reason: Paired finished_concrete_transfer candidate evidence does not verify
        finished pre-curing material state; never inherit service UUID.
    - row_id: curing_water
      reason: Curing-specific initial search returned concrete/admixtures/materials;
        construction-water detail from shared support review is Mass, not this
        Volume card. No exact identity established.
    - row_id: curing_electricity
      reason: Shared electricity evidence is narrower China<1kV user supply; actual
        cure/testing equipment may have different supply. Keep semantic card
        broad and unresolved.
    - row_id: accepted_concrete_placement_service
      reason: Main reviewer used one initial and one evidence-supported refinement. No
        exact accepted contractor service identity;
        closest3eaea622-5e99-4d29-aae9-50cfaf77a3b8 detail is Mass concrete
        material with CPC15200, not Volume construction service. Search budget
        exhausted; no relabeling.
