              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_install_emissions
              source_ids: []
            ranges: []
  - id: cap_accept
    label: "Steel cap integration and conditional test acceptance"
    inputs:
      product:
        - row_id: installed_pile_feed
          role: "Actual rotary-installed bolted steel helical pile assembly at cap integration handoff"
