allocation_rules:
  - rule_id: single_service
    applies_to: "accepted_foundation_service"
    rule: "The accepted group is the intended final output; no co-product from rejected steel, retained ground or temporary reaction piles is assumed. Use actual separate contract groups and resources when several products are delivered."
    source_ids: []
  - rule_id: rework_retention
    applies_to: "all processes"
    rule: "Failed depth/torque, damaged sections, misalignment, unacceptable cap or load test retain all attempts, additional sections, energy, relocation, extraction, reaction-pile work and retests in the accepted group. Link loop/event IDs and final reuse/return/waste disposition; unresolved failures cannot be accepted outputs."
    source_ids:
      - chance-helical-installation-2017
  - rule_id: gross_stock_return
    applies_to: "all material rows"
    rule: "Reconcile opening stock plus gross receipts with installed/consumed material, actual outward usable returns, measured waste/loss and closing retained stock by actual identity. Do not net returns in inputs then export them again. Closing stock is carried forward with its declared burden, not an outward exchange; actual reused components retain their prior allocation history. Gross receipts/issues mean material totals before returns or outward transfers are deducted, with vehicle/container tare already removed; they never mean gross loaded vehicle weight. Where gross_kg and tare_kg are recorded, subtract tare to obtain material mass entering the physical balance. Keep genuine outward flows and retained stock distinct."
    source_ids: []
  - rule_id: shared_complete_life
    applies_to: "asset rows"
    rule: "For each distinct asset use documented physical service during this job/node divided by actual complete-life service of the same unit and duty; apply that share to production, maintenance/replacement and end-of-life without duplicating operating fuel. Index every other consuming job/node/reporting period and reconcile total shares. If using a bounded provider service, document actual capital and operating coverage and remove the overlapping local rows.  For an asset whose life is completed, use observed full-life history. For an in-service asset, an evidenced prospective remaining-service, replacement, termination and end-of-life scenario is allowed; label forecasts separately from observed facts, record the denominator/source, uncertainty and sensitivity, and update when actual use, replacement or retirement changes. Do not fabricate a future retirement_date or assume an arbitrary default life; only missing evidenced complete-life coverage or denominator blocks finalization."
    source_ids: []
  - rule_id: period_events
    applies_to: "all processes"
    rule: "Declare mobilization/start, each installation/test/rework event, acceptance and stock close/open periods, plus asset commissioning/replacements/retirement. Assign each event once; reconcile carried-forward stock and remaining asset burden between periods without resetting lifetime at year end."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_install_materials
      process_id: "rotary_install"
      flow_role: "Leads/extensions/separate bolts and actual outward usable returns"
      record_type: "Part/lot stock and custody ledger"
      raw_fields: "contract_id; period_id; pile_id; purpose; part_id; model; grade; coating; opening_kg; gross_receipts_kg; gross_issues_kg; installed_kg; outward_returns_kg; waste_kg; closing_kg; unit_mass_kg; weighing_uncertainty_kg; receipt_id"
      collection_method: "Weigh by calibrated scales or traceable part-specific supplier masses; pair counts to model and supply bill. Reconcile opening plus gross receipts to installation, actual outward returns, waste and retained closing stock without netting twice; include reaction/failed/remedial positions."
      unit: "kg; part count; actual length m"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Matched part/lot counts, calibration and supplier inclusion evidence; investigate residual beyond actual measured uncertainty; retain stock burden carry-forward, no fixed loss or range."
    - protocol_id: cp_install_energy
      process_id: "rotary_install"
      flow_role: "Actual installation diesel/electricity/hydraulic top-up"
      record_type: "Meter/tank/maintenance event record"
      raw_fields: "contract_id; period_id; event_id; equipment_id; purpose; fuel_grade; fuel_kg; fuel_opening_kg; fuel_receipts_kg; fuel_closing_kg; fuel_returns_kg; fuel_transfer_out_kg; unburned_spill_kg; spill_disposition; fuel_volume_L; fuel_density_kg_per_L; density_temperature_C; electricity_kWh; oil_grade; oil_added_kg; oil_recovered_kg; operating_h; standby_h; provider_coverage; measurement_uncertainty"
      collection_method: "Measure full-job fuel/energy/oil with calibrated meters and tank balances. Compute actual consumed fuel from opening plus receipts minus closing, actual usable outward fuel returns/transfers and unburned spills/losses; link those dispositions without adding a duplicate generic product-return exchange. Combustion CO2 uses only actual burned fuel, not returned/transferred/spilled fuel; when volume converts to kg use actual batch density and temperature. Separate carrier and other-node event IDs; include idle/extraction/reaction work, avoid provider/lifetime-maintenance duplication."
      unit: "kg; L; kg/L; degC; kWh; h"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Complete opening/receipt/closing balances, density evidence and meter calibration; actual duty/activity and supply mix; independently verify Energy support before final exchanges; no assumed fuel/oil factors."
    - protocol_id: cp_install_assets
      process_id: "rotary_install"
      flow_role: "Carrier/head/adapter/access-mat complete-life asset shares"
      record_type: "Asset-life and consumer-period matrix"
      raw_fields: "contract_id; asset_id; supplied_assembly_id; component_id; node_id; period_id; job_id; commissioning_date; use_h; mat_loaded_use_days; lifetime_same_duty_h; lifetime_same_duty_days; maintenance_event_id; replacement_event_id; retirement_date; production_coverage; end_of_life_coverage; share_uncertainty"
      collection_method: "Identify each supplied asset; partition its actual same-duty service across nodes/jobs/periods and divide job-node use by its evidenced complete-life denominator. Use hours for carrier/head/tool duty or actual loaded occupation days for mats without treating h/days as product exchange units; fractional asset item carries capital share. Separate components with independent lifetime."
      unit: "item; h; days"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual life/service logs, remaining-life/replacement/retirement evidence and complete-life burden scope; sum all consumer shares without double ownership. Missing evidenced complete-life denominator/coverage blocks final asset attribution; an in-service prospective scenario may provide remaining service and end-of-life coverage, without invented observed retirement."
    - protocol_id: cp_install_logistics
      process_id: "rotary_install"
      flow_role: "Actual component/equipment freight for both nodes"
      record_type: "Leg/payload/gate transport record"
      raw_fields: "contract_id; leg_id; period_id; consuming_node; physical_exchange_owner_node; custody_event_id; origin; destination; carrier_mode; payload_kg; loaded_distance_km; empty_distance_km; return_leg; supplier_included_gate; equipment_mobilization; uncertainty"
      collection_method: "Record each actual inbound/inter-site/return/waste leg once, including cap/test supplies, usable component/fuel returns and waste-receiver legs of both nodes. This freight row and cp_install_logistics in rotary_install are the single physical exchange owner; consuming_node tags cap_accept demand without a second local exchange. Pair custody_event_id and leg_id to the appropriate return/waste record; use actual payload tonnes times loaded kilometres and documented actual empty-leg/provider method. Partition by destination node without a second local freight row; treat incompatible freight identities separately."
      unit: "t*km; kg; km"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Tickets/routes/payload and supplier gate evidence; actual empty/shared-load allocation; verify complete compatible Transport support chain before exchange delivery, no default distance or credit."
    - protocol_id: cp_install_records
      process_id: "rotary_install"
      flow_role: "Installed assembly handoff and every attempt"
      record_type: "Pile/transfer/as-built/defect record"
      raw_fields: "contract_id; pile_id; purpose; attempt_id; transfer_id; design_revision; manufacturer_revision; lead_id; extension_ids; bolt_ids; position_coordinates_m; angle_deg; depth_m; torque_Nm; torque_sampling_depth_m; rotation_rpm; advance_m_per_rev; shaft_torque_limit_Nm; required_min_effective_torque_Nm; specified_min_depth_m; effective_torque_rule; instrument_id; calibration_date; specified_tolerance; acceptance_source; disposition; event_date"
      collection_method: "Record each actual permanent/failed/reaction pile and attempt using current approved engineer/manufacturer procedures. Log calibrated installation torque history/depth/angle and instructed rotation/advance with actual units, tolerances and document clauses. Confirm engineer-authorized deviations and pair physical transfer to cap_accept; use project termination criteria, not guide example settings or torque-capacity factors."
      unit: "item; m; deg; Nm; rpm; m/rev"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Authorized installer and instrument calibration; full torque/depth record and approved departures; actual pile count/configuration and rejected dispositions; transfer counterpart agreement and location traceability."
    - protocol_id: cp_install_waste
      process_id: "rotary_install"
      flow_role: "Steel/timber/spent oil/incidental mineral waste exits"
      record_type: "Typed waste consignment and incident ledger"
      raw_fields: "contract_id; event_id; pile_id; period_id; waste_identity; grade; coating; contamination; waste_status; gross_kg; tare_kg; net_kg; volume_m3; actual_bulk_density_kg_per_m3; destination; receiver_id; custody_receipt; treatment_coverage; spill_id; uncertainty"
      collection_method: "Weigh each actual separately identified stream and retain receiver/custody evidence; volume-based mineral mass needs measured actual bulk density. Distinguish real usable return, stock, waste and incident release; no automatic ground spoil. Record removal/enabling fuel and equipment once."
      unit: "kg; m3; kg/m3"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighbridge/tare/calibration, waste classification and receiver receipts; life-maintenance ownership for spent oil; actual obstruction approval; unresolved material/destination triggers route-fit/inventory extension."
    - protocol_id: cp_install_emissions
      process_id: "rotary_install"
      flow_role: "Actual fossil CO2 and PM2.5 plus separately identified actual releases"
      record_type: "Measured emission or specific factor/composition model"
      raw_fields: "contract_id; event_id; period_id; equipment_id; fuel_kg; carbon_mass_fraction; oxidation_fraction; retained_carbon_kg; species; medium; particle_fraction; measured_release_kg; factor_value; factor_unit; factor_source; activity_value; activity_unit; uncertainty"
      collection_method: "Use calibrated measurements or actual fuel carbon/oxidation balance for fossil CO2, with carbon-to-CO2 molecular conversion source retained. PM2.5 requires a matching measured particle fraction or exact equipment/duty factor and actual activity. Every other actual substance/medium or spill constituent needs a distinct concrete exchange; do not substitute aggregate NOx/VOC/dust."
      unit: "kg; actual factor/activity units"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Retain source/chemistry/calibration, fossil/biogenic basis, fraction/medium and uncertainty; assess exhaust and incident completeness explicitly. Supplier upstream emissions and local direct releases have separate owners; no unverified default factor."
    - protocol_id: cp_cap_materials
      process_id: "cap_accept"
      flow_role: "Actual caps/bolts/repair coating and usable cap returns"
      record_type: "Approved bill and stock/custody ledger"
      raw_fields: "contract_id; period_id; pile_id; cap_id; drawing_revision; bolt_id; supplier_included_components; coating_product; product_revision; opening_kg; gross_receipts_kg; gross_issues_kg; installed_or_applied_kg; returns_kg; waste_kg; closing_kg; volatile_fraction; repair_area_m2; uncertainty"
      collection_method: "Collect actual approved steel interface bill and separate supplied masses. Weigh actual approved galvanized-surface repair product only if instructed and used, with wet/applied/residue/volatile evidence. Reconcile gross supply, outward returns and carried stock by identity; no duplicated factory coating or package bolts."
      unit: "kg; m2; actual supplied composition units"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved drawings/product instructions, actual part masses/calibration, supply bill and return receipts; separate material variants. No universal cap weight, dose, solids or volatile fraction."
    - protocol_id: cp_cap_energy
      process_id: "cap_accept"
      flow_role: "Actual cap/test diesel and electricity"
      record_type: "Meter/tank/event energy ledger"
      raw_fields: "contract_id; period_id; event_id; equipment_id; pile_id; test_id; test_required; fuel_grade; fuel_kg; fuel_opening_kg; fuel_receipts_kg; fuel_closing_kg; fuel_returns_kg; fuel_transfer_out_kg; unburned_spill_kg; spill_disposition; fuel_volume_L; fuel_density_kg_per_L; density_temperature_C; electricity_kWh; operating_h; standby_h; provider_coverage; uncertainty"
      collection_method: "Measure actual cap work, tests and retests by event. Actual consumed fuel equals opening plus receipts minus closing, usable outward returns/transfers and separately recorded unburned spills/losses. Link custody/incidents once and use only actual burned fuel for combustion emissions; retain meter/tank balances and actual density/temperature if fuel supplied volumetrically. Include auxiliaries and reaction-system handling, reconcile with rotary_install event ownership and provider coverage."
      unit: "kg; L; kg/L; degC; kWh; h"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration/density and complete test-event/activity logs; no mandatory test quantity, generic fuel factor or energy-to-count conversion; verify actual Energy identity chain."
    - protocol_id: cp_cap_assets
      process_id: "cap_accept"
      flow_role: "Tool/jack-pump/reaction-frame complete-life shares"
      record_type: "Asset-life and consuming-job/period matrix"
      raw_fields: "contract_id; asset_id; supplied_assembly_id; component_id; node_id; job_id; period_id; commissioning_date; use_h; lifetime_same_duty_h; maintenance_event_id; replacement_event_id; retirement_date; production_coverage; end_of_life_coverage; share_uncertainty"
      collection_method: "Record each actual cap tool, test jack/pump and reaction frame/beam independently unless supplied as one documented assembly with compatible life. Attribute actual node service divided by complete-life same-duty service, including test/retest erection/removal; reaction-pile steel/work stays with rotary_install and is not charged again as frame production."
      unit: "item; h"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual assembly/calibration/service logs, other consumer periods/jobs, replacements and retirement evidence; capital/operating provider coverage reconciled; unresolved evidenced life denominator or complete-life coverage blocks final attribution; in-service prospective scenarios are explicitly allowed with uncertainty and updates."
    - protocol_id: cp_cap_records
      process_id: "cap_accept"
      flow_role: "Paired pile feed and accepted contract interface"
      record_type: "Physical handoff, cap joining, test and acceptance record"
      raw_fields: "contract_id; period_id; pile_id; transfer_id; purpose; cap_id; connection_method; fastening_torque_Nm; specified_tolerance; test_required; test_plan_revision; load_acceptance_limit_value; load_acceptance_limit_unit; displacement_acceptance_limit_value; displacement_acceptance_limit_unit; hold_acceptance_limit_value; hold_acceptance_limit_unit; criterion_clause; test_id; reaction_pile_ids; load_kN; displacement_mm; hold_s; instrument_id; calibration_date; acceptance_source; defect_id; retest_id; disposition; accepted_group_count; signed_handover_date"
      collection_method: "Pair actual installed pile feeds to rotary_install outputs. Record approved cap/adapter connection and actual fastening criteria; perform load tests only per actual engineer plan, recording calibrated load/displacement/hold time and exact criteria. Close every failed/reaction/retest disposition and obtain signed foundation-interface acceptance before declaring one final service item."
      unit: "item; Nm; kN; mm; s"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Qualified installer, actual instrument/tolerance/source evidence and engineer approvals; zero unresolved defective accepted positions; matched transfer IDs and accepted count; no generic capacity or universal test settings."
    - protocol_id: cp_cap_waste
      process_id: "cap_accept"
      flow_role: "Actual steel and coating waste exits"
      record_type: "Typed waste consignment/residue ledger"
      raw_fields: "contract_id; period_id; event_id; pile_id; waste_identity; supplied_coating_product; grade; coating; contamination; wet_state; gross_kg; tare_kg; net_kg; receiver_id; destination; treatment_coverage; custody_receipt; uncertainty"
      collection_method: "Weigh separate actual steel and wet coating-residue streams; distinguish usable returns and closing stock. Reconcile applied/retained/waste and actual volatile releases using actual supplied formulation; add distinct packaging/cleaning waste identities when present."
      unit: "kg"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual classified consignment/tare and receiver evidence; matched cap/repair events; no assumed scrap or wet/dry factors, no duplicate installation waste and no silent unidentified release."
    - protocol_id: cp_cap_emissions
      process_id: "cap_accept"
      flow_role: "Actual cap/test fossil CO2 and other separately typed releases"
      record_type: "Emission measurement or exact fuel-composition model"
      raw_fields: "contract_id; period_id; event_id; equipment_id; test_id; fuel_kg; carbon_mass_fraction; oxidation_fraction; retained_carbon_kg; species; medium; measured_release_kg; actual_factor_source; activity; uncertainty"
      collection_method: "Use actual fuel carbon/oxidation with retained-carbon and molecular conversion evidence or calibrated exhaust measurement. Identify every additional actual repair-coating volatile species/medium and test-combustion pollutant as a distinct exchange before finalization; no generic VOC/wet-paint-water emission identity."
      unit: "kg; actual composition/activity units"
      frequency: "Each receipt/issue/use/transfer/test/rework/exit event and period close as applicable"
      temporal_coverage: "Complete actual contract campaign including mobilization, failed/reaction piles, retests and acceptance; link earlier/later stock and asset-life periods"
      site_scope: "Actual site, supplying lot/provider and named equipment/event; no unrelated job mixing"
      aggregation_rule: "per reference flow"
      quality_evidence: "Actual composition/measurement and factor compatibility, air/soil/water medium, uncertainty, campaign completeness and cross-node ownership; upstream fuel emissions are separate."
  calculation_rules:
    - id: event_normalization
      applies_to: "all inventory rows"
      rule: "Sum actual uniquely owned event quantities attributable to the accepted contract group; report per reference flow. Internal transfers cancel at the group boundary, and physical feed counts remain actual."
      inputs:
        - "Contract/event/period IDs"
        - cp_install_records
        - cp_cap_records
        - "relevant node protocol"
      output: "Actual exchange amount per reference flow"
      source_ids: []
    - id: direct_release_calculation
      applies_to: "installation_fossil_co2, installation_pm25, cap_fossil_co2"
      rule: "Use actual measured release kg as raw input or a documented source-specific model. For CO2, calculate oxidized fossil carbon from actual burned fuel mass and measured/source-supported carbon composition with retained/unoxidized carbon treated once; multiply by the documented CO2-to-carbon molecular-mass ratio with its source and units retained. For PM2.5, multiply an exact equipment/duty/particle-fraction factor by actual matched activity; convert only with documented unit factors. Sum uniquely owned release events per reference flow; propagate instrument, composition/factor and activity uncertainty without a universal emission factor."
      inputs:
        - "Node emission and fuel protocols"
        - "actual measurement/composition/factor source"
        - "actual unit-conversion evidence"
      output: "Actual substance-specific emitted kg per reference flow and uncertainty interval"
      source_ids: []
    - id: component_balance
      applies_to: "lead_sections, extension_sections, coupling_bolts, steel_caps, cap_bolts"
      rule: "Opening stock plus gross receipts equals installed/consumed plus actual outward usable returns plus measured waste/loss plus closing stock for the same identity. Actual differences require investigation using measured uncertainty; do not create a balancing invented exchange."
      inputs:
        - "Node material and waste protocols"
        - "actual gross receipts and closing stock"
      output: "Reconciled physical stock/custody balance and declared carried-forward burden"
      source_ids: []
    - id: asset_service_share
      applies_to: "rotary_carrier_asset, rotary_head_asset, temporary_access_mats_asset, cap_tool_asset, test_equipment_asset, test_reaction_frame_asset"
      rule: "Actual node same-duty service divided by documented complete-life same-duty service gives fractional asset item; apply to actual complete-life capital/maintenance/end-of-life burden with one consumer-period matrix. Keep fuel/energy separate and resolve missing life/terminal evidence before finalization."
      inputs:
        - cp_install_assets
        - cp_cap_assets
        - "actual asset lifecycle and consumer records"
      output: "Asset-specific fractional item and complete-life attributable burden per reference flow"
      source_ids: []
    - id: freight_measurement
      applies_to: "installation_freight"
      rule: "Actual payload kg divided by 1000 gives tonnes; multiply actual loaded route km to obtain t*km, with separately documented empty/shared-leg allocation and supplier gate coverage."
      inputs:
        - cp_install_logistics
        - "actual leg/provider records"
      output: "Actual tonne-kilometres per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: identity_and_gate
      applies_to: "all cards"
      requirement: "Actual identity, supply state, use, custody/waste status and elementary medium/fraction must match a verified concrete flow and independently verified property/unit chain before TIDAS exchange delivery. Candidate unresolved cards are not final exchange UUIDs."
      evidence: "Exact supplier/product/receiver records; platform detail/property/unitgroup chain; named unresolved manifest entries"
    - id: range_and_uncertainty
      applies_to: "all cards"
      requirement: "Obtain each card-specific missing Range evidence from actual approved configuration and complete campaign records; derive a traceable empirical or measurement uncertainty interval only for the stated gate and denominator. One reference item is a definition, not a physical intensity bound."
      evidence: "Actual minima/maxima or uncertainty method, instrument/specification evidence, sample/event coverage and exclusions; no illustrative guide values used as defaults"
    - id: period_completeness
      applies_to: "all processes"
      requirement: "Include failed/remedial/reaction positions, temporary access, mobilization, all supply/exit legs, standby, retests and actual emissions. Record each event once across periods; reconcile opening/closing stock and complete-life assets to other jobs."
      evidence: "Event coverage ledger, consumer-period matrix, receipts, handover and exception register"
    - id: project_gate
      applies_to: "accepted_foundation_service"
      requirement: "Current actual engineer/manufacturer instructions and approved deviations govern torque/depth/angle/cap/test limits. Record all measurement units, calibrated instruments, specified tolerances and exact acceptance source."
      evidence: "As-built pile schedule; torque history; approved cap/connection bill; test activation/load-displacement evidence; signed defect closure and interface handover"
validation_rules:
  - rule_id: scope_and_gate
    applies_to: "accepted_foundation_service"
    rule: "Confirm rotary insertion with subordinate thrust, no grout and approved steel cap interface for new construction. Required torque/depth and conditional load test criteria must be satisfied under actual current approved instructions; do not claim superstructure or building acceptance."
    source_ids:
      - chance-helical-installation-2017
      - un-cpc3-2025
  - rule_id: transfer_and_reference
    applies_to: "installed_pile_assembly, installed_pile_feed, accepted_foundation_service"
    rule: "Reconcile paired physical transfer IDs/count/configuration/purpose; preserve actual feed amount and count exactly one accepted group output as 1 item. Failed/reaction assemblies cannot masquerade as accepted service quantity."
    source_ids:
      - chance-helical-installation-2017
  - rule_id: reject_closure
    applies_to: "all processes"
    rule: "Every failure/rejected section/cap/test has a linked rework/replacement/return/waste disposition and retained burden. Missing closure or reaction/remedial resources blocks final foreground acceptance."
    source_ids:
      - chance-helical-installation-2017
  - rule_id: custody_balance
    applies_to: "all material and waste rows"
    rule: "Check gross receipts, actual outward returns, installed/consumed/waste/loss and carried closing stock by exact identity, period and custody. No net-return/double-output, retained-stock export or unsupported recycling credit."
    source_ids: []
  - rule_id: asset_and_period
    applies_to: "asset rows"
    rule: "Check each shared asset against all consuming nodes/jobs/periods and commissioning/maintenance/replacement/retirement evidence. Capital, operation and end-of-life coverage must sum once; unresolved life denominators/terminal coverage/provider overlap block final exchange production."
    source_ids: []
  - rule_id: release_and_range
    applies_to: "all cards"
    rule: "Review every card-specific Range need and actual emission/waste completeness; verify native physical units and actual species/medium/fraction before concrete exchange binding. Unknown flow or support UUID and unknown actual bounds remain declared gaps, never fabricated near-matches."
    source_ids: []
  - rule_id: enabling_complete
    applies_to: "rotary_install"
    rule: "Actual access/utility-protection/obstruction work has explicit material, equipment, energy, freight and exit owners. Required unrepresented work or out-of-route substantial excavation/concrete remediation blocks route finalization pending reviewed inventory extension."
    source_ids:
      - chance-helical-installation-2017
published_dataset_profile:
  dataset_role: "Foreground installation data package with process and lifecyclemodel projections for the declared accepted contract group"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual matching rotary ungrouted steel helical foundation installation at an approved steel cap interface, with configuration/gate and complete campaign resources disclosed"
  excluded_use: "Generic foundation average; driven/grouted/underpinning piles; complete building; another load duty, geology, configuration or lifetime claimed equivalent without evidence; final TIDAS exchanges with unresolved identity"
  required_metadata: "Contract/site/group and dates; engineer/manufacturer revisions; utilities and access baseline; qualified installer; as-built pile/cap schedule; torque/depth/angle criteria; actual test plan/results; provider gates; stock and rejected/reaction dispositions; asset/period matrix"
  required_quality_disclosure: "Actual measurement and uncertainty/Range coverage; missing exact flow/support identities; conditional activation and enabling exclusions; complete-life asset and logistics coverage; data periods; defect closure; candidate limitations"
  update_trigger: "Changed ground/design/component/supply state, cap interface, termination/test acceptance or approved instructions; actual changed enabling scope, provider coverage, shared asset life/period data or resolved identity/Range evidence"
data_sources:
  - id: "chance-helical-installation-2017"
    type: "handbook"
    reference: "Hubbell CHANCE Helical Piles Installation Instructions, Part C3031833, Revision A 11/17, pp1–8. https://hubbellcdn.com/installationmanuals/TD04203E_Helical%20Piles%20Inst%20Sheet.pdf"
    used_for: "Rotary installation, component interfaces, torque/depth records, approved changes, conditional tests, reaction piles and cap handover; example numbers are not universal current defaults"
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations CPC Version 3.0 explanatory notes, 30 June 2025, class 54512 and adjacent 54511. https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Foundation service classification and narrower rotary boundary; excludes excavation and concrete work"
