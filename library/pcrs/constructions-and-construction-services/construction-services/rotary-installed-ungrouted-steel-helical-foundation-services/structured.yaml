boundary_abstraction:
  declared_starting_condition: "Qualified new-construction site with ground/utility conditions and engineered pile schedule declared; supplied prefabricated coated steel sections at supplier gate; enabling access condition and owner documented"
  starting_condition_role: "Ground is retained environmental starting stock, not a purchased material or automatically exported soil. Previously built access is starting infrastructure only to the extent actually present and outside this contract."
  product_classification_scope: "A bounded rotary ungrouted steel helical foundation installation within broader foundation services"
  recursive_input_rule: "If the same-category installation service is subcontracted, use one bounded provider package for its physical work and upstream coverage; remove overlapping local inventories and keep its actual output/gate distinct from supplied components."
  upstream_dataset_requirement: "Actual supplied fabricated/coated lead, extension, cap and hardware datasets at the declared gate; actual fuel/electricity/freight; complete-life owned asset production, maintenance and end-of-life or verified provider coverage. No duplicated steel forming/galvanizing."
  disclosure: "Site baseline; access/enabling ownership; provider gates; all failed/remedial/reaction piles; conditional tests; actual emissions/waste destinations; gross material reconciliation; period and shared-asset matrix"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted ungrouted rotary-installed steel helical foundation service at steel cap interface"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "contract/site/group ID"
    - "approved engineer/manufacturer document revision"
    - "installer qualification"
    - "pile locations"
    - count
    - angles
    - "helix/shaft/lead/extension/connection schedule"
    - "actual depth and calibrated torque histories"
    - "caps and load duty"
    - "test activation and load-displacement evidence"
    - "failed/reaction pile dispositions"
    - "signed interface acceptance date"
    - "supplier/service coverage and attribution period"
reference_flows:
  []
measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "One accepted contract group is one reference item. Pile count, steel kg, depth m and load kN are configuration attributes; do not convert them to equivalent foundation service with a generic factor."
  - id: gross_material
    applies_to: "lead_sections, extension_sections, coupling_bolts, steel_caps, cap_bolts"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use actual component gross receipt/issue mass, retained stock and outward returns by part/lot. If measured by count, use actual part-specific traceable mass; no uniform pile mass."
  - id: native_energy
    applies_to: "installation_electricity, test_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Retain measured electrical energy in native kWh. A complete Energy support identity must be verified before concrete exchange delivery; a verified energy unit group alone is insufficient."
  - id: project_measurement
    applies_to: "installed_pile_assembly, accepted_foundation_service"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Record actual torque Nm, depth m, angle degrees, rpm and advance m/revolution where instructed; test load kN, displacement mm and hold duration s with calibrated instruments, tolerances and acceptance document revisions. These are quality/raw fields, not interchangeable exchange amounts."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: rotary_install
    name: "Rotary insertion and bolted extension assembly"
    inclusion: "required"
    inclusion_condition: "Actual designed rotary ungrouted pile installation"
    role: "Assembly and integration of lead/extension/coupling components into installed pile assemblies; embedded actual enabling/obstruction work"
    quantitative_reference: "Actual installed assemblies by pile and purpose, transferred to cap_accept; all failed/reaction work attributable per final reference flow"
  - id: cap_accept
    name: "Steel cap integration and conditional test acceptance"
    inclusion: "required"
    inclusion_condition: "Actual approved steel cap/interface connection; load tests only when engineer specifies or directs them"
    role: "Assembly and integration of installed pile and steel cap/hardware into accepted load-transfer interface"
    quantitative_reference: "1 item accepted foundation contract group; test and rework resources included before handover"
process_inventory:
  - id: rotary_install
    label: "Rotary insertion and bolted extension assembly"
    inputs:
      product:
        - row_id: lead_sections
          role: "Actual fabricated galvanized steel helical pile lead sections"
          name: "Actual fabricated galvanized steel helical pile lead sections"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Factory-fabricated/coated leads enter at their actual supply gate, separately by approved model, helix/shaft configuration and coating. Include permanent, failed, replacement and reaction-test positions; supplier-included couplings/bolts stay in that bill. Range evidence need: Obtain part-specific supplier weights or calibrated weighed lots and actual gross receipts for the declared pile schedule, including failed/test leads; no universal lead kg or helix-count conversion."
          amount:
            expression: "Measured gross received/issued lead mass allocated to this reference group; retain opening/closing stock and actual outward return ledger."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_install_materials
              source_ids:
                - chance-helical-installation-2017
            ranges: []
        - row_id: extension_sections
          role: "Actual fabricated galvanized steel helical pile extension sections"
          name: "Actual fabricated galvanized steel helical pile extension sections"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Actual extension sections and their integral couplings are supplied products; their extra depth and failed attempts belong to the job. Do not add a second forging/galvanizing burden. Range evidence need: Collect extension lengths, shaft/wall/model-specific masses, actual count, gross receipts and returns; project depth alone cannot determine kg and example guide dimensions are not current universal specifications."
          amount:
            expression: "Actual gross extension-section supply mass by model/lot and job issues, including replacement and reaction piles."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_install_materials
              source_ids:
                - chance-helical-installation-2017
            ranges: []
        - row_id: coupling_bolts
          role: "Actual separately supplied helical extension coupling bolts"
          name: "Actual separately supplied helical extension coupling bolts"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Only separately supplied bolts not already in extension supply enter this exchange, split by actual grade/size/coating identity. Range evidence need: Actual bolt bill of supply, package mass/count and verified part mass must establish the interval and included-component check; no generic bolt allowance."
          amount:
            expression: "Gross separately supplied bolt mass attributable to the actual installation group; zero when already supplier-included."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_install_materials
              source_ids:
                - chance-helical-installation-2017
            ranges: []
        - row_id: installation_diesel
          role: "Actual diesel fuel supplied to rotary installation plant"
          name: "Actual diesel fuel supplied to rotary installation plant"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Fuel covers actual mobilization, insertion, standby, extraction, remedial and reaction-pile work owned by this node. Provider-included fuel is excluded from a second local charge. Range evidence need: Use full-campaign tank/meter opening, receipts, issues and closing records, equipment duty and allocation uncertainty; no generic litres/pile or energy factor."
          amount:
            expression: "Actual consumed diesel mass: actual opening plus receipts minus closing, usable outward fuel returns/transfers and separately recorded unburned spills/losses; allocate combustion and other dispositions by event to this group."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_install_energy
              source_ids: []
            ranges: []
        - row_id: installation_electricity
          role: "Actual grid electricity for electrically powered installation equipment"
          name: "Actual grid electricity for electrically powered installation equipment"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Conditional on actual electrically powered rotary equipment, charging or other installation demand; electricity retains native energy measurement and actual supply mix. Range evidence need: Collect calibrated meter intervals, charging coverage, standby and allocation records under actual equipment duty; no fixed kWh per pile and no Count substitute for Energy."
          amount:
            expression: "Metered kWh attributable to this group/node when active, with charging and losses boundary documented."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_install_energy
              source_ids: []
            ranges: []
        - row_id: hydraulic_topup
          role: "Actual separately consumed hydraulic make-up oil"
          name: "Actual separately consumed hydraulic make-up oil"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Conditional on measured make-up oil consumed during this node; circulating equipment fill is not automatically consumed and lifetime maintenance oil must not be charged again. Range evidence need: Record actual grade, mass additions, recoveries, maintenance owner and leak incidents; no permanently consumed oil per operating hour assumption."
          amount:
            expression: "Actual separate oil issues less evidenced usable stock reconciliation; identify product grade and the reason for consumption."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_install_energy
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: installed_pile_assembly
          role: "Actual rotary-installed bolted steel helical pile assembly at cap integration handoff"
          name: "Actual rotary-installed bolted steel helical pile assembly at cap integration handoff"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "Physical internal transfer identifies actual pile position, lead/extensions, depth, angle, torque and disposition. Permanent and reaction/test assemblies are separately tagged; failed/unaccepted attempts never inflate final accepted service count. Range evidence need: Collect actual as-installed schedule, transfer acceptance, failed/reaction counts and design termination records; the group reference of one service does not prescribe pile count."
          amount:
            expression: "Actual number of installed assemblies transferred by pile ID and purpose; not fixed to one and not sold again as a final service."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
