            expression: "Actual weighed discarded matched mineral stream to its documented receiver; zero where rotary displacement retains ground and no removal occurred."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
