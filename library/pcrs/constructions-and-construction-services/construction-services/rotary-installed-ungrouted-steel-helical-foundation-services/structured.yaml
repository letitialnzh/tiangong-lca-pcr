          role: "Actual separately removed spent hydraulic oil to authorized receiver"
          name: "Actual separately removed spent hydraulic oil to authorized receiver"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Conditional on actual maintenance oil removal owned by this job; circulating fill is not a waste output and complete-life maintenance must not be counted again. Record actual formulation/contamination and receiver. Range evidence need: Obtain oil removal/receiver weights, maintenance event owner, grade and contamination; reconcile retained fluid, top-ups, recovered oil and actual spills without an assumed loss rate."
          amount:
            expression: "Measured mass of this actual removed spent-oil stream; no automatic equality to top-up mass."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
