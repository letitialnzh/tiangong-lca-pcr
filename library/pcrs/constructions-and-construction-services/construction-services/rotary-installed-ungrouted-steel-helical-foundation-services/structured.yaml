          name: "Actual discarded mineral obstruction removed from a pile location"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Conditional incidental removal approved within this route, with exact actual mineral/soil identity and custody. Different contaminated soils, rock, buried construction waste or reusable recovered material require separate correctly typed exchanges or route-fit review. Range evidence need: Collect obstruction event/location, approval, actual composition/contamination, weighbridge or measured volume with actual bulk-density evidence, receiver and enabling resources; no universal spoil yield."
