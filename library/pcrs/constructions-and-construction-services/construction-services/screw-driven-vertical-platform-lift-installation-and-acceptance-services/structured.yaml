    - "Manufacturer/model/serial"
    - "actual site-specific drawing and authorized instruction revisions"
    - "jurisdiction and approval"
    - "self-supporting width"
    - "travel/rated load/access"
    - "platform/ramp/guards and gate/interlock schedule"
    - "pad/foundation/anchor/fascia interfaces"
