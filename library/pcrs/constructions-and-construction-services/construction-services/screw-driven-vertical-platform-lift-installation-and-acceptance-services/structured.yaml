  []
measurement_rules:
  - id: accepted_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "One accepted complete installation is 1 item; collect cp_acceptance. Unaccepted assemblies and repeated tests are not additional accepted outputs."
  - id: preserve_physical_units
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual exchange-specific property"
      uuid: ""
    required_unit: "Actual physical unit"
    rule: "Keep electricity in kWh, freight in tkm, asset use in h, and each material in its measured kg or verified count. Verify the compatible property/unit-group chain for every final concrete exchange; missing support is a disclosed gap, never a conversion to item count."
  - id: configuration_and_test_units
    applies_to: "cp_acceptance; cp_interfaces"
    required_property_ref:
      name: "Actual recorded characteristic"
      uuid: ""
    required_unit: "Actual unit and tolerance"
    rule: "Record geometry/travel in stated mm or m, load in stated kg, electrical quantities in V/A/Hz, alignment/anchor and test requirements in their authorized units, durations in h or min, with actual tolerances and acceptance source. Do not apply nominal planning dimensions, power ratings or cycle limits as universal settings."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: lift_installation
    name: "Fixed screw-platform lift assembly, connection and commissioning"
    inclusion: "required"
    inclusion_condition: "Actual fixed unenclosed two-landing self-supporting-width route and accepted pad/supply handoffs; authorized installation and actual commissioning requirements available"
    role: "Independent assembly/integration of kit, anchoring and connection roles into one accepted commissioned installation. Receipt/document checks remain inside this node. Nonconforming assemblies loop here for correction/retest or leave by actual return/waste custody; failed states are never accepted output."
    quantitative_reference: "1 item accepted installation"
process_inventory:
  - id: lift_installation
    label: "Fixed screw-platform lift assembly, connection and commissioning"
    inputs:
      product:
        - row_id: factory_lift_kit
          role: "Complete factory screw-driven wheelchair platform-lift kit at job supply gate"
          name: "Complete factory screw-driven wheelchair platform-lift kit at job supply gate"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "The actual complete kit crosses the job boundary from its supplier. Identify model/serial/options and the bill of supply; independently supplied extras are separate. It is not raw metal, a hydraulic elevator or a lift operating service. Manufacturer sources support the equipment/task/interface context only; quantities, gross custody and LCA attribution are established by the stated foreground protocols. Range evidence need: Obtain job kit/replacement/return records by serial and complete-kit boundary; 1 accepted installation does not prove exactly 1 gross kit was consumed."
          amount:
            expression: "Record gross kits supplied and actually issued to this job by configuration, including replacements; reconcile real returned kits and closing stock without netting returns twice."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_materials
              source_ids:
                - savaria-multilift-current
                - savaria-multilift-planning-2020
                - savaria-multilift-owner-2024
            ranges: []
        - row_id: pad_work
          role: "Accepted job-specific concrete pad preparation service"
          name: "Accepted job-specific concrete pad preparation service"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "Use only for a real separately owned new or modified pad handoff, not a documentation mirror. The provider service includes measured actual excavation/subbase/reinforcement/concrete/insulation where required, plant, waste and acceptance to the job-defined boundary. Pre-existing pad evidence is recorded without pretending new work is free. Manufacturer sources support the equipment/task/interface context only; quantities, gross custody and LCA attribution are established by the stated foreground protocols. Range evidence need: Actual foundation design, provider work quantities and accepted interface are needed; nominal outdoor slab drawings are not a universal volume/mass range."
          amount:
            expression: "Record actual attributable accepted bounded pad-work service quantity and underlying measured work; zero new work requires pre-existence evidence. If no adequate upstream handoff exists, model measured preparatory work explicitly."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_interfaces
              source_ids:
                - savaria-multilift-current
                - savaria-multilift-planning-2020
                - savaria-multilift-owner-2024
            ranges: []
        - row_id: supply_work
          role: "Accepted job-specific dedicated electrical supply preparation service"
          name: "Accepted job-specific dedicated electrical supply preparation service"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "Use only for the separately owned upstream dedicated supply/disconnect/termination preparation with defined endpoint; in-scope final lift connection remains the installation responsibility. New cable/duct/protection work and its plant/waste cannot disappear. Manufacturer sources support the equipment/task/interface context only; quantities, gross custody and LCA attribution are established by the stated foreground protocols. Range evidence need: Require actual electrical design and measured provider bill of work; conflicting nominal public ratings cannot establish the actual service quantity or rating."
          amount:
            expression: "Record actual accepted supply-work service and underlying measured cable/protection/route quantities, identifying final connection ownership; zero new work needs existing-interface evidence."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_interfaces
              source_ids:
                - savaria-multilift-current
                - savaria-multilift-planning-2020
                - savaria-multilift-owner-2024
            ranges: []
        - row_id: electricity
          role: "Installation and commissioning electricity supplied to the job"
          name: "Installation and commissioning electricity supplied to the job"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Separately meter actual lift commissioning/test electricity, tool charging and electrically powered handling where in scope. Keep later passenger operation outside; avoid charges already included by a bounded provider. Range evidence need: Need actual meter/charging/test logs and metering uncertainty; motor nameplate power and advertised installation duration are not a consumption range."
          amount:
            expression: "Measured attributable kWh from job meters/submeters or documented actual equipment runtime and measured demand, including failed tests and retests; disaggregate circuits and provider coverage."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_energy
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_lift_installation
          role: "Accepted fixed unenclosed two-landing screw-driven wheelchair vertical-platform lift installation"
          name: "Accepted fixed unenclosed two-landing screw-driven wheelchair vertical-platform lift installation"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "The true final service crosses to the owner only after the authorized installer accepts assembly/anchoring/interfaces, actual safety and functional commissioning and required jurisdiction inspection pass, all corrections/retests close, and records/training/maintenance duties are handed over. Lift acceptance alone does not establish whole-building accessibility compliance. Manufacturer sources support the equipment/task/interface context only; quantities, gross custody and LCA attribution are established by the stated foreground protocols. Range evidence need: The exact amount defines the reference unit, not an empirical yield range. Collect actual accepted job count, configuration and signed commissioning/inspection/handover records; no default failure rate."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_acceptance
              source_ids:
                - savaria-multilift-current
                - savaria-multilift-planning-2020
                - savaria-multilift-owner-2024
            ranges: []
        - row_id: usable_kit_return
          role: "Actual outward usable factory kit or lift component return in counted supply state"
          name: "Actual outward usable factory kit or lift component return in counted supply state"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "Record real outward return to supplier/another identified custodian only for complete counted kits or traceable counted components with compatible identities. Internal correction/retest stays within lift_installation; closing stock never leaves as a fictitious product. Range evidence need: Need actual return authorization, physical transfer and product usability evidence; no assumed return fraction."
          amount:
            expression: "Gross actual outward counted units by matching incoming identity and transfer record. Keep the original receipt gross; never net the same return before counting this output."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_custody
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: accepted_job_burdens
    applies_to: "lift_installation"
    rule: "Attribute direct installation, replacement/correction and failed/repeated-test burdens to the accepted job. Do not produce an accepted output until defects and required inspections close. A terminated/unaccepted job retains a separately disclosed failed-job disposition; it is never silently discarded or counted as a second accepted service."
    source_ids: []
  - rule_id: asset_complete_life_attribution
    applies_to: "equipment_provision"
    rule: "For each shared reusable asset enumerate production/acquisition, deployment/use, maintenance/replacement and removal/end-of-life phases, all consuming jobs/nodes and reporting periods. Prefer actual service-meter hours as the causal allocation basis; justify another basis where hours do not represent wear/service. Reconcile attributed shares over the complete service denominator, record period-specific decisions and uncertainty, and avoid multiplying a full-life burden once in each year. Unresolved replacement or termination coverage blocks finalization."
    source_ids: []
  - rule_id: provider_and_energy_ownership
    applies_to: "all inputs"
    rule: "Reconcile provider coverage with direct material/energy/freight/asset rows. One supplied kit or bounded service cannot carry the same component, tool energy, packaging or capital burden a second time. Pad and supply burdens use the actual bounded handoff quantity with no unrelated whole-building allocation."
    source_ids: []
  - rule_id: returns_and_recovery
    applies_to: "usable_kit_return; usable_material_return; installation_waste"
    rule: "Use actual gross physical custody and consistent burden transfer. Retained stock carries disclosed burden forward and is not an output. Usable outward returns transfer their recorded burden once; waste follows its real treatment. Retain installation/correction/test burdens on this job; no automatic displaced-production/recycling credit or arbitrary negative input."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "lift_installation"
      flow_role: "Kit, actual extras, consumables and packaging"
      record_type: "receipt/issue/weighing"
      raw_fields: "job_id; date; supplier; identity; serial; specification; supplied_state; kit_inclusion; gross_receipt; actual_issue; installed_quantity; return_quantity; closing_stock; unit; measurement_uncertainty"
      collection_method: "Reconcile supplier bill of supply and serials with gross receipts, job issues, calibrated weighing or traceable supplier masses for each distinct identity. Retain closing stock with its burden owner. Normalize only job-attributable quantities by accepted installation count of the same configuration."
      unit: "item; kg"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Invoices, calibrated scale records/supplier masses, drawings, signed job issue/custody reconciliation; no mixed-identity sum"
    - protocol_id: cp_interfaces
      process_id: "lift_installation"
      flow_role: "Pad and dedicated electrical preparatory handoffs"
      record_type: "design/quantity/acceptance"
      raw_fields: "job_id; interface_id; provider; owner; existing_or_new; boundary_endpoint; drawing_revision; measured_work; quantity; unit; electrical_rating; tolerance; acceptance_source; acceptance_result; final_connection_owner; upstream_dataset_coverage"
      collection_method: "Verify actual foundation/supply design and completed work at exact endpoints; record physical work quantities and separately owned upstream dataset coverage. Existing host needs pre-existence evidence. Normalize real job-specific services by accepted installation count; do not replace missing new works with zero."
      unit: "Actual mm; m; m3; kg; V; A; Hz; service item"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved current site-specific drawings, concrete/pad/anchor and electrical signoff, measured bills of work, provider scope and boundary check"
    - protocol_id: cp_assets
      process_id: "lift_installation"
      flow_role: "Reusable equipment complete-life shares"
      record_type: "asset/service/period ledger"
      raw_fields: "job_id; asset_id; owner; provider_scope; phase; period_id; consuming_job; consuming_node; use_hours; total_service_hours; replacement_event; termination_event; capital_burden; excluded_coverage; attribution_basis; uncertainty"
      collection_method: "Record actual asset-use hours for installation/lifting/access/test apparatus and all relevant consuming jobs/periods; verify production, use, replacements and eventual removal coverage. Apply documented complete-life service share with period-specific ownership, then divide job-attributed burden by accepted job count. A provider gap needs separately accounted coverage."
      unit: "h; actual upstream burden units"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter/logbooks, provider boundaries, complete-life register, replacement/end-of-life evidence, share reconciliation and uncertainty"
    - protocol_id: cp_logistics
      process_id: "lift_installation"
      flow_role: "Real freight legs and mobilization"
      record_type: "dispatch/route records"
      raw_fields: "job_id; leg_id; provider; mode; origin; destination; load_identity; load_mass_t; distance_km; shared_load_basis; return_custody; supplier_included; allocation_uncertainty"
      collection_method: "Use actual dispatch masses and route km for each leg, including real return/mobilization legs. Attribute shared load using documented causal share and check supplier/provider inclusion; divide attributable tkm by accepted installation count."
      unit: "t; km; tkm"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Waybills, measured mass, route evidence, provider coverage and no double counted return leg"
    - protocol_id: cp_energy
      process_id: "lift_installation"
      flow_role: "Commissioning, tool and handling energy/fuel"
      record_type: "meter/fuel records"
      raw_fields: "job_id; date; equipment_or_circuit; task; test_id; failed_or_repeat; meter_start; meter_end; runtime_h; measured_demand_kW; fuel_identity; fuel_mass_kg; fuel_volume; fuel_volume_unit; density; density_unit; temperature; temperature_unit; unit; provider_inclusion; uncertainty; G_fuel; B_fuel; U_fuel; X_fuel; W_fuel_contained_mass; P_fuel_contained_mass; closing_usable_tank_stock; D_fuel; D_fuel_unit; fate_completeness; fuel_supply_burden_owner"
      collection_method: "Submeter commissioning and tool/handling circuits or document actual runtime with measured demand. Keep later passenger use outside. Reconcile measured actual consumed fuel and any evidenced density conversion; retain unused/returned fuel separately in the fuel ledger, outside usable_material_return, include correction/retest and exclude covered provider energy; divide job-attributable amounts by accepted count. Supply and burn are separate under fuel_supply_fate; collect every exclusive outlet, actual denominator and its unit, keep nonreturned waste/loss supply burdens, and report missing fates."
      unit: "kWh; kg; actual source volume unit"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration/readings, test/task timestamps, fuel record/density evidence, uncertainty and circuit/provider scope"
    - protocol_id: cp_acceptance
      process_id: "lift_installation"
      flow_role: "Actual final accepted service gate"
      record_type: "installation/test/inspection/handover"
      raw_fields: "job_id; model; serial; configuration; drawing_revision; authorized_instruction_revision; jurisdiction; installer_authorization; travel; platform_width; geometry_unit; rated_load; load_unit; supply_voltage_V; supply_current_A; supply_frequency_Hz; geometry_tolerance; load_tolerance; supply_tolerance; tolerance_source; pad_anchor_fascia_signoff; gate_interlock_guard_record; test_method; test_load; test_load_unit; test_duration; test_duration_unit; test_tolerance; pass_limit_source; actual_result; defect_id; correction; retest_result; inspection; owner_handover; accepted_count"
      collection_method: "Authorized mechanic records the actual installation, configured safety functions and authorized test protocol/results with all applicable units/tolerances; retain required inspector acceptance, defect closure, owner instruction/records and future maintenance responsibility. Count only signed accepted jobs matching this scope, then normalize to 1 item."
      unit: "item; actual test/geometry/electrical units"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Authorization, current job drawings/instructions, signed tests and required inspection, corrected defect records and owner handover"
    - protocol_id: cp_custody
      process_id: "lift_installation"
      flow_role: "Usable returns, closing stock and waste"
      record_type: "transfer/stock/disposal"
      raw_fields: "job_id; source_identity; source_receipt; defect_id; correction_task; disposition; usability; recipient; transfer_id; gross_outward_quantity; closing_stock_quantity; carried_burden_owner; waste_class; treatment; unit; uncertainty"
      collection_method: "Weigh/count real outward returns and waste by actual identity and custody document; distinguish internal rework and retained stock. Reconcile gross receipt with installed use, actual outward return, waste and closing stock. Normalize attributed outward quantities by accepted installation count; retain burden-transfer method."
      unit: "item; kg"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed return/usability acceptance, weights, closing-stock ledger, waste carrier/treatment record and defect linkage"
    - protocol_id: cp_releases
      process_id: "lift_installation"
      flow_role: "Actual species and receiving compartment"
      record_type: "monitoring or task-specific factor"
      raw_fields: "job_id; task; substance_or_particle_class; receiving_compartment; activity; activity_unit; factor_source; factor_unit; captured_fraction; release_mass_kg; uncertainty; zero_screen_evidence"
      collection_method: "Screen actual tasks first; characterize each real pollutant/medium and measure kg or apply a supported task-specific substance factor to measured activity. Record capture and avoid treating collected waste as emitted. Normalize attributable release by accepted count; unknown identity remains a gap."
      unit: "kg; actual factor/activity units"
      frequency: "Each event/reading and job closeout"
      temporal_coverage: "Complete first-installation job including corrections/retests; asset histories span all relevant periods"
      site_scope: "Actual installation site and named upstream providers/assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Monitoring/calibration or traceable factor with applicability, species/compartment/capture evidence and uncertainty"
  calculation_rules:
    - id: job_normalization
      applies_to: "all inventory rows"
      rule: "For each actual identity, divide its documented job-attributable physical amount or burden by the number of accepted installations with the same configuration; keep gross receipts, outward returns, waste and closing stock independently reconciled. The final reference output is 1 item."
      inputs:
        - "Actual records"
        - accepted_count
        - cp_acceptance
      output: "Amount per reference flow"
      source_ids: []
    - id: asset_share
      applies_to: "equipment_provision"
      rule: "Attribute the separately owned complete-life asset burden using this job actual service hours divided by evidenced total service hours across every consuming job and period; reconcile shares and phases, then normalize to the accepted installation. Justify and disclose any alternate causal basis."
      inputs:
        - cp_assets
        - "actual phase burdens"
        - "complete-life service denominator"
      output: "Job-attributed asset burden per reference flow"
      source_ids: []
    - id: fuel_supply_fate
      applies_to: "fuel"
      rule: "For each actual fuel identity and nonoverlapping node/event period, G_fuel = opening usable fuel + external receipts - closing usable fuel stock, including equipment tanks, with container tare excluded and same-boundary issues/transfers not added as new receipts. G_fuel is the gross physical product input before genuine usable outward U_fuel, outward transfer X_fuel, collected unburned fuel W_fuel and uncontained fuel P_fuel. Keep those exclusive outlets separate and resolve actual product, waste stream or substance/medium identities; a total spill is an incident diagnostic, never another deduction. W_fuel and P_fuel mean the contained fuel mass, not the total mass of contaminated absorbent or wastewater. B_fuel = G_fuel - U_fuel - X_fuel - W_fuel - P_fuel only with a complete supported fate ledger; unknown fate stays a gap and is not presumed burned. Only independently supported B_fuel drives combustion emissions. Retain upstream supply burdens of all nonreturned unburned fuel, waste and loss; only original unused-material burden may follow a documented usable exit, without a second net-input deduction or avoided-production credit. Carry opening/closing stock burden once. Normalize each physical quantity once by D_fuel, the independently measured positive accepted lot quantity in this PCR reference unit (accepted volume, area, axial length, steel mass or complete accepted count as defined in sections 3-4), never by a fuel quantity or an intermediate output. Existing actual_consumed/fuel-use fields are burn-activity records; they cannot replace G_fuel as the upstream input. Provider-included fuel and its emissions have one owner; do not add overlapping foreground supply or combustion."
      inputs:
        - "opening fuel"
        - "external receipts"
        - "closing intact fuel"
        - U_fuel
        - X_fuel
        - W_fuel
        - P_fuel
        - D_fuel
        - "actual node fuel protocol and fate evidence"
      output: "G_fuel product input; independently supported B_fuel; separately resolved exclusive outlets"
      source_ids: []
  data_quality_requirements:
    - id: route_identity
      applies_to: "reference output and kit"
      requirement: "Verify fixed/unenclosed/two-landing ACME screw route and self-supporting width against actual model/site drawings; nominal public guide and conflicting public ratings are not actual design acceptance."
      evidence: "Current authorized job drawing, model/serial, bill of supply, jurisdiction and installer authorization"
    - id: quantity_and_custody
      applies_to: "all inventory rows"
      requirement: "Preserve actual physical units, measurement method/calibration and uncertainty, receipt/issue/return/stock/waste balances by identity; zero needs positive evidence. Missing value or Range evidence is a data gap, not zero."
      evidence: "Linked protocols and complete job ledger"
    - id: asset_and_provider_coverage
      applies_to: "assets; pad; supply; freight; energy"
      requirement: "Audit single ownership and all relevant phases/periods; disclose service denominator, replacements/termination and gaps, no twice-counted supplier coverage."
      evidence: "Provider scope and measured interfaces; full-life asset/custody reconciliation"
    - id: acceptance_and_temporal_coverage
      applies_to: "accepted_lift_installation"
      requirement: "Cover receipt/mobilization through correction/retest/inspection/handover dates; no unresolved defects in accepted count and no later passenger energy or maintenance."
      evidence: "Signed cp_acceptance and aligned task/test records"
    - id: concrete_identity_and_ranges
      applies_to: "all exchange cards"
      requirement: "Resolve each actual exchange to a verified concrete UUID and compatible support chain before final TIDAS production; retain configuration/provider/geography/state and measurement fit. Collect the card-specific Range evidence needs; this candidate supplies no generic material/energy/lifetime defaults."
      evidence: "Actual flow detail/support evidence; metered/weight/task data and uncertainty"
validation_rules:
  - rule_id: route_fit
    applies_to: "reference product"
    rule: "Reject routes requiring hydraulic/traction/mobile/enclosed/hoistway/pit or wide wall-supported treatment. Check actual project route, current authorized drawings and support/supply interfaces before producing a dataset."
    source_ids:
      - savaria-multilift-current
      - savaria-multilift-planning-2020
      - savaria-multilift-owner-2024
  - rule_id: gate_complete
    applies_to: "accepted_lift_installation"
    rule: "Require authorized installer, accepted pad/supply/anchor/fascia/guard/gate/interlock configuration, actual safety/functional test and required jurisdiction inspection records, closed corrections/retests and signed owner handover. Missing commissioning criteria or an unresolved defect blocks accepted output; no claim of whole-building accessibility compliance."
    source_ids:
      - savaria-multilift-current
      - savaria-multilift-planning-2020
      - savaria-multilift-owner-2024
  - rule_id: units_balance_identity
    applies_to: "all inventory rows"
    rule: "Verify 1 item final output and identical reference denominator; linked node-specific protocols, physical units and compatible support chain; each actual component/provider/waste/pollutant identity; gross balances with real returns and non-output closing stock. No fixed UUID based only on name similarity."
    source_ids: []
  - rule_id: shared_period_and_rework
    applies_to: "equipment_provision; installation_waste"
    rule: "Require all shared consuming jobs/nodes and periods, complete-life phase coverage, actual denominator and single ownership. Unresolved replacement/termination/coverage blocks finalization. Link rejected assemblies to lift_installation correction/retest or actual usable return/waste exit, retaining their burdens and excluding rejects from accepted output."
    source_ids: []
  - rule_id: boundary_completeness
    applies_to: "pad_work; supply_work; all inputs"
    rule: "Require measured newly constructed pad/supply work with explicit bounded owner or inclusion, evidence for existing-host zero new work, kit-vs-extra reconciliation and no duplicate provider/material/energy/packaging/freight burdens. Disclose every unavailable quantity, Range and identity; absence is not zero."
    source_ids: []
  - rule_id: validate_fuel_supply_fate
    applies_to: "fuel"
    rule: "Check G_fuel, B_fuel and all exclusive outlets against the actual fuel protocol, stock and provider coverage. Nonreturned unburned waste/loss keeps its upstream burden; unresolved fate, fuel constituent or positive D_fuel blocks a complete quantitative fuel inventory. Do not substitute burned activity for purchased fuel or deduct total spill plus its component outlets."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground construction-stage installation service package, with process/lifecyclemodel projections retaining the same actual interfaces and acceptance gate"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Actual matching fixed unenclosed two-landing self-supporting-width screw-platform lift installation at its commissioned handover gate"
  excluded_use: "Hydraulic/traction/escalator, mobile/enclosed/hoistway/pit/wall-supported route; whole-building accessibility certification; passenger transport, lifetime lift operation or maintenance"
  required_metadata: "Reference qualifiers; model/serial/configuration; current authorized instruction/drawing revisions; actual permit/jurisdiction/test limits; dates; boundaries and owners; upstream kit/pad/supply/provider coverage; actual asset phases/periods and service denominator; custody/defect closure"
  required_quality_disclosure: "Unresolved identities/supports and Range evidence, measured quantities/calibration/uncertainty, missing provider/capital or new-work coverage, rework/retest and waste/returns/stock balances; no finalization with unresolved material gaps"
  update_trigger: "Changed model/configuration/drive or site interface; changed authorized drawing/instruction or jurisdiction; new supply/kit scope; measured activity or asset-life evidence; updated exact UUID/support verification"
