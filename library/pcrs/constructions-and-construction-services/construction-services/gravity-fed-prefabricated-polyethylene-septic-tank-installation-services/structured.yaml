            ranges: []
      elementary:
        []
allocation_rules:
  - rule_id: job_attribution
    applies_to: "tank_installation"
    rule: "Attribute direct actual job materials/energy/site work including failures, repair and retest to the finally accepted job. Internal repair loops do not create another accepted output. Incompatible configurations or incomplete jobs are separated and disclosed, never denominator dilution."
    source_ids: []
  - rule_id: asset_attribution
    applies_to: "equipment_provision"
    rule: "For each asset index production, each service/reporting period and consumer job, maintenance/replacement and final removal. Use actual documented service activity shares against complete supported service coverage, with residual/unused capacity explained. Retain capital/maintenance/removal burdens or verified provider inclusion once; fill missing provider phases explicitly and avoid duplicating included operational fuel. Do not assume universal lifetime or amortization."
    source_ids: []
  - rule_id: custody_attribution
    applies_to: "usable_product_returns; solid_waste; imported_support_fill"
    rule: "Maintain gross opening stock/receipts/issues/installed or consumed disposition/real outward returns/waste/closing stock balance by actual identity. All material input cards use gross job receipts/issues; placement or consumption is a disposition, not an alternate input basis. Fuel product inputs and actual burned activity follow fuel_supply_fate; usable exits remain separately recorded. Retained stock carries a declared unconsumed burden forward and is not a product output. Returned products have original-lot burden custody and do not earn automatic substitution credit. Native soil reused onsite has handling burdens and no purchased-production burden. Any genuine coproduct outside this scope requires explicit separate allocation review."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_components
      process_id: "tank_installation"
      flow_role: "vessel/components and usable returns"
      record_type: "supplier bills and calibrated quantity/stock records"
      raw_fields: "job_id; lot_id; product_identity; model; included_kit_parts; gross_receipts; gross_issues; installed_amount; real_outward_returns; waste_amount; closing_stock; mass_kg; matched_item_count; product_specific_mass_evidence; dimension_unit; native_soil_provenance; transfer_id"
      collection_method: "Reconcile factory bill and actual distinct extra roles using gross material receipts/issues and all dispositions, never net consumed/placed input. Weigh actual mass or use traceable matching supplier dimensions/mass; keep counted vessel/gasket records. Record real custody returns once and retained stock carry-forward. Cross-reference cp_soil native-soil provenance by transfer_id; use actual mass evidence to close counted vessel/gasket receipts against mass-based returns."
      unit: "kg; item; actual dimensions"
      frequency: "Each receipt/issue/install/return/replacement"
      temporal_coverage: "All preparation through final handover and failed attempts"
      site_scope: "Job and supplying lots"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed bills, serials, scale calibration, compatibility and lot balance"
    - protocol_id: cp_soil
      process_id: "tank_installation"
      flow_role: "excavation/support/backfill and finish"
      record_type: "site survey and material ledger"
      raw_fields: "job_id; native_soil_suitability; groundwater_state; excavated_quantity; surveyed_volume_unit; reused_onsite_quantity; import_mass_kg; material_identity; gross_receipts; gross_issues; placed_or_consumed; real_outward_returns; waste_quantity; closing_quantity; disposition_unit; moisture_basis; density_unit; finish_product_identity; closing_stock; exported_quantity; destination; custody_status; transfer_id"
      collection_method: "Measure actual excavation and soil/finish custody by material state; use field survey and weigh tickets, measured conversion properties and explicit balance uncertainty. Pair native-origin soil export with cp_components outward-custody record using transfer_id and actual measured mass, preserving site provenance rather than a purchased lot. Record local placement/compaction/grade acceptance with actual units and limits; onsite soil transfer creates no purchased input."
      unit: "kg; actual surveyed volume and geometry units"
      frequency: "Each excavation/import/placement/export and finish acceptance"
      temporal_coverage: "Entire civil preparation, backfill, correction and finish"
      site_scope: "Actual excavation and controlled stock areas"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved soil/site report, calibrated survey/scales and signed placement/compaction/grade records"
    - protocol_id: cp_energy
      process_id: "tank_installation"
      flow_role: "fuels and electricity"
      record_type: "meter and fuel stock/task logs"
      raw_fields: "job_id; task_id; asset_id; period_id; fuel_identity; fuel_mass_kg; fuel_volume; fuel_volume_unit; density_value; density_unit; density_temperature; density_temperature_unit; electricity_kWh; charging_boundary; provider_inclusion; G_fuel; B_fuel; U_fuel; X_fuel; W_fuel_contained_mass; P_fuel_contained_mass; closing_usable_tank_stock; D_fuel; D_fuel_unit; fate_completeness; fuel_supply_burden_owner"
      collection_method: "Reconcile actual task fuel and metered electricity including rework. Any activity allocation uses recorded tasks and a documented denominator; identify provider included use and future operating-energy exclusion. Reconcile unused stock and unconsumed fuel returns outside the consumed-fuel exchange. Preserve each physical unit and conversion evidence. Supply and burn are separate under fuel_supply_fate; collect every exclusive outlet, actual denominator and its unit, keep nonreturned waste/loss supply burdens, and report missing fates."
      unit: "kg; kWh"
      frequency: "Each task/refuel/meter interval"
      temporal_coverage: "Preparation through repair/retest/handover"
      site_scope: "Job equipment and declared charging supply"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter/scale calibration, fuel/density evidence and provider coverage"
    - protocol_id: cp_water
      process_id: "tank_installation"
      flow_role: "actual supplied and outgoing installation water"
      record_type: "meter and test/disposition logs"
      raw_fields: "job_id; event_id; actual_requirement; water_source; fill_level_unit; supply_mass_kg; measured_volume; measured_volume_unit; density_unit; retained_water; treatment_handoff; direct_release; receiving_medium; test_method; test_duration; test_duration_unit; test_pressure; pressure_unit; test_temperature; temperature_unit; test_volume; test_volume_unit; acceptance_limit_unit; test_result_value; result"
      collection_method: "Determine actual water requirement from applicable instructions. Meter each fill including retests; reconcile retained water, managed waste handoff and actual direct release. Record actual test/protection method and every applicable pressure, temperature, level, volume and duration unit with specified acceptance and authority; do not assume universal water filling or vacuum testing."
      unit: "kg; actual volume/level/time/test units"
      frequency: "Each actual fill, test and disposition"
      temporal_coverage: "All installation-stage fill/repair/retest events"
      site_scope: "Tank/site and actual water receiver"
      aggregation_rule: "per reference flow"
      quality_evidence: "Applicable approved instruction, calibrated meters, test/receiving records"
    - protocol_id: cp_assets
      process_id: "tank_installation"
      flow_role: "shared reusable assets and provision"
      record_type: "asset/service register and complete-life attribution"
      raw_fields: "asset_id; provider_id; coverage_boundary; production_phase; service_period_id; consumer_job_id; task_duration_h; total_service_basis; maintenance_event; replacement_event; termination_event; removal_coverage; allocation_decision; uncovered_phase"
      collection_method: "Link this node and all other consuming jobs/reporting periods to each asset. Retain actual job hours or contract unit and complete-life service basis; document phase-by-phase provider inclusion, operational/capital separation, any gaps, allocation and no duplicate event ownership."
      unit: "h or actual verified contract service unit"
      frequency: "Each asset/job/period and maintenance/replacement/termination event"
      temporal_coverage: "Complete asset production/service/removal coverage plus this job"
      site_scope: "Actual assets/providers and all supported service consumers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset register, activity meters, provider dataset scope, lifetime/termination evidence and uncertainty"
    - protocol_id: cp_transport
      process_id: "tank_installation"
      flow_role: "delivery return and waste movements"
      record_type: "consignment and route records"
      raw_fields: "job_id; transfer_id; provider_id; origin; destination; payload_mass_t; distance_km; vehicle_class; included_legs; upstream_coverage"
      collection_method: "Match actual outward/inward shipments and included transport to material/provider coverage. Compute actual transport work only from compatible payload and route units; document included empty legs and ensure no repeated freight record."
      unit: "t km; original t and km"
      frequency: "Each actual consignment/haul"
      temporal_coverage: "All job deliveries, returns and waste disposition"
      site_scope: "Actual routes/providers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Tickets, route distance evidence, payload and dataset-leg coverage"
    - protocol_id: cp_acceptance
      process_id: "tank_installation"
      flow_role: "accepted installation reference"
      record_type: "signed installation inspection and test records"
      raw_fields: "job_id; model; capacity_unit; compartments; design_revision; permit; nontraffic_state; groundwater_evidence; stub_endpoints; invert_units; cover_units; connection_parts; test_method; acceptance_source; limit_units; failed_state; correction_id; retest_result; handover_signature; accepted_count"
      collection_method: "Count only complete accepted stub-bounded jobs. Match actual model/site/support/components/backfill/grade and required test/inspection records. Record applicable limits with units and close each defect/correction/retest; denominator includes accepted jobs only and retains attributable failure burdens."
      unit: "item; actual design/test units"
      frequency: "Every job acceptance and correction closure"
      temporal_coverage: "First work through final signed handover"
      site_scope: "Actual installed tank and defined stubs"
      aggregation_rule: "per reference flow"
      quality_evidence: "Permit/design, manufacturer instructions, field acceptance and closed defect/retest ledger"
    - protocol_id: cp_waste
      process_id: "tank_installation"
      flow_role: "waste and actual environmental releases"
      record_type: "custody tickets and characterized release records"
      raw_fields: "job_id; event_id; material_identity; waste_status; composition; mass_kg; receiver; transfer_id; substance; receiving_medium; particle_size; activity_unit; factor_source; factor_basis; provider_inclusion"
      collection_method: "Separate actual waste from usable return and internal stock. Weigh each waste stream and obtain receiver evidence. Establish substance/media and documented activity/factor or measurement for each direct release; deduplicate provider emissions and retain uncertainty."
      unit: "kg; original factor/activity units"
      frequency: "Each waste/release and corrective event"
      temporal_coverage: "All attributable job and failed-work events"
      site_scope: "Job and actual receivers/media"
      aggregation_rule: "per reference flow"
      quality_evidence: "Authorized receiver tickets, calibrated measurements, composition and compatible release factor evidence"
  calculation_rules:
    - id: job_normalization
      applies_to: "all inventory rows"
      rule: "Aggregate each distinct attributable actual exchange for the defined job boundary and divide by the matched accepted installation count; preserve its physical unit and all failed-work burdens. Do not aggregate unlike models without declared stratification."
      inputs:
        - "Node-specific job records"
        - accepted_count
        - cp_acceptance
      output: "Exchange amount per reference flow"
      source_ids: []
    - id: stock_reconciliation
      applies_to: "factory_tank; extra_gaskets; extra_pipe_tees; extra_access_parts; joint_consumables; imported_support_fill; finish_products; usable_product_returns; solid_waste"
      rule: "Reconcile opening stock and gross receipts with installed/consumed dispositions, actual outward custody returns, waste and closing stock separately by identity. Internal issues/transfers are paired ledger movements, not repeated external receipts."
      inputs:
        - cp_components
        - cp_soil
        - cp_waste
      output: "Identity-specific custody balance and carried-forward closing-stock burden"
      source_ids: []
    - id: asset_share
      applies_to: "equipment_provision"
      rule: "Apply the documented actual job service share to complete supported asset phase burdens; reconcile all consumer/period shares and remaining capacity against the same service basis, with provider inclusions counted once."
      inputs:
        - cp_assets
        - cp_energy
        - "verified provider scope"
      output: "Attributed asset provision and explicit uncovered phase requirements"
      source_ids: []
    - id: fuel_supply_fate
      applies_to: "installation_fuels"
      rule: "For each actual fuel identity and nonoverlapping node/event period, G_fuel = opening usable fuel + external receipts - closing usable fuel stock, including equipment tanks, with container tare excluded and same-boundary issues/transfers not added as new receipts. G_fuel is the gross physical product input before genuine usable outward U_fuel, outward transfer X_fuel, collected unburned fuel W_fuel and uncontained fuel P_fuel. Keep those exclusive outlets separate and resolve actual product, waste stream or substance/medium identities; a total spill is an incident diagnostic, never another deduction. W_fuel and P_fuel mean the contained fuel mass, not the total mass of contaminated absorbent or wastewater. B_fuel = G_fuel - U_fuel - X_fuel - W_fuel - P_fuel only with a complete supported fate ledger; unknown fate stays a gap and is not presumed burned. Only independently supported B_fuel drives combustion emissions. Retain upstream supply burdens of all nonreturned unburned fuel, waste and loss; only original unused-material burden may follow a documented usable exit, without a second net-input deduction or avoided-production credit. Carry opening/closing stock burden once. Normalize each physical quantity once by D_fuel, the independently measured positive accepted lot quantity in this PCR reference unit (accepted volume, area, axial length, steel mass or complete accepted count as defined in sections 3-4), never by a fuel quantity or an intermediate output. Existing actual_consumed/fuel-use fields are burn-activity records; they cannot replace G_fuel as the upstream input. Provider-included fuel and its emissions have one owner; do not add overlapping foreground supply or combustion."
      inputs:
        - "opening fuel"
        - "external receipts"
        - "closing intact fuel"
        - U_fuel
        - X_fuel
        - W_fuel
        - P_fuel
        - D_fuel
        - "actual node fuel protocol and fate evidence"
      output: "G_fuel product input; independently supported B_fuel; separately resolved exclusive outlets"
      source_ids: []
  data_quality_requirements:
    - id: route_identity
      applies_to: "tank_installation"
      requirement: "Demonstrate actual nontraffic dry non-buoyant gravity route, permit/design/model, independent stub gate and full supply-kit completeness."
      evidence: "Approved site/design and actual bill of supply"
    - id: quantity_quality
      applies_to: "all inventory rows"
      requirement: "Retain actual identity-specific units, calibration, temporal/site/lot scope, conversion moisture/density or supplier mass, missing activity and uncertainty. No inferred defaults or zero-as-missing values."
      evidence: "Node-specific protocols and original records"
    - id: period_completeness
      applies_to: "equipment_provision"
      requirement: "Complete asset phase/consumer/period coverage, replacement/termination and provider gaps; unresolved service-life evidence blocks final asset attribution."
      evidence: "Asset/service register and complete-life supporting records"
    - id: acceptance_quality
      applies_to: "accepted_tank_installation"
      requirement: "Match accepted count to signed handover, actual inspection/test criteria with units and closed repair/retest path; a tank installation pass does not prove sewage-treatment performance."
      evidence: "cp_acceptance and applicable manufacturer/jurisdiction documents"
    - id: custody_quality
      applies_to: "usable_product_returns; solid_waste; water_waste; direct_releases"
      requirement: "Reconcile source, quantity, condition, real receiver and status; stock carry-forward and wastewater retained onsite are balances, not fictitious outward exchanges."
      evidence: "Transfer, stock, water and waste ledgers"
validation_rules:
  - rule_id: validate_fit
    applies_to: "tank_installation"
    rule: "Fail route fit for unqualified soil/groundwater/traffic, missing actual excavation/support ownership, unclear stubs or excluded equipment/works."
    source_ids:
      - ads-septic-tank-installation-2024
  - rule_id: validate_gate
    applies_to: "accepted_tank_installation"
    rule: "Require one complete accepted installation, actual model/site/parts, backfill/compaction/finish and applicable test/inspection criteria with original units; close failed states before counting the output. Do not assert treatment performance."
    source_ids:
      - ads-septic-tank-installation-2024
  - rule_id: validate_kit_balance
    applies_to: "all inventory rows"
    rule: "Reject duplicate kit component, supplier included packaging/freight, netted-plus-outward returns, untyped soil export or retained stock counted as an output. Expand variable umbrellas to actual distinct exchange identities."
    source_ids: []
  - rule_id: validate_assets
    applies_to: "equipment_provision"
    rule: "Require all consuming jobs/periods and complete production/service/maintenance/replacement/removal scope, actual share basis and single ownership per shared event; unresolved lifetime/termination or provider gaps block completion."
    source_ids: []
  - rule_id: validate_bindings
    applies_to: "all inventory rows"
    rule: "Every final TIDAS exchange requires exact actual flow, property/unitgroup and destination support; unresolved semantic identities and unsupported Energy/Duration/Transport chains remain explicit data requirements. No near-match or count conversion for convenience."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "tank_installation"
    rule: "Preserve damaged/off-spec materials, repair/replacement and repeated tests in the producing node, with actual internal loop, product return or waste exit. No discarded tank or unresolved failure enters accepted count."
    source_ids: []
  - rule_id: validate_fuel_supply_fate
    applies_to: "installation_fuels"
    rule: "Check G_fuel, B_fuel and all exclusive outlets against the actual fuel protocol, stock and provider coverage. Nonreturned unburned waste/loss keeps its upstream burden; unresolved fate, fuel constituent or positive D_fuel blocks a complete quantitative fuel inventory. Do not substitute burned activity for purchased fuel or deduct total spill plus its component outlets."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for one qualified stub-bounded gravity tank installation; process/lifecyclemodel are downstream projections"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Installation-stage comparisons only for matching declared site/model/interface/acceptance scope and asset/provider coverage"
  excluded_use: "Full septic-system operation, wastewater removal performance, drainfield design, traffic/buoyancy variants, generic capacity-equivalence claims and potable-water approval"
  required_metadata: "Actual site/time/permit/design and manufacturer model; material and kit identities; soil/groundwater and stubs; work/test/finish criteria; accepted count; upstream and asset phase/service coverage"
  required_quality_disclosure: "Missing records and unresolved bindings/support chains; measured/conversion uncertainty; failure/retest quantities; stock/custody and waste/release pathways; asset lifetime/coverage attribution limits"
  update_trigger: "Changed tank/site/route/interface, manufacturer/jurisdiction instruction, kit contents, test acceptance, provider or asset scope, new measured data or verified flow identity"
data_sources:
  - id: "ads-septic-tank-installation-2024"
    type: "handbook"
    reference: "Infiltrator Water Technologies / ADS, Infiltrator Septic Tank General Installation Instructions, February 2024, pp1-3 and6; https://assets.adspipe.com/asset/2c4fb1a6-27dd-4e01-9d46-c24e90bcd72b/Tank-General-Installation-Instructions.pdf"
    used_for: "Actual manufacturer route, nontraffic/site/soil and component instructions, backfill/finish, conditional protective filling and jurisdiction-specific testing; model examples are not universal values"
  - id: "un-cpc3-explanatory-notes-2025"
    type: "official_guidance"
    reference: "United Nations Statistics Division, CPC Version3.0 explanatory notes, 30June2025, printed pp289-290; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "Classification scope of septic-system and leach/drainfield installation; narrower tank-only semantic boundary"
