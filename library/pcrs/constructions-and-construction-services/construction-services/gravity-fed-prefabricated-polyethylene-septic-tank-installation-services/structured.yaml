measurement_rules:
  - id: counted_handover
    applies_to: "accepted_tank_installation"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "One accepted installation is counted only after its complete stated civil/connection gate passes; capacity is a design qualifier and cannot convert different tank models into equivalent counts."
  - id: physical_measurements
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual exchange property"
      uuid: ""
    required_unit: "Actual recorded unit"
    rule: "Retain each quantity in its physically measured unit: mass, energy, service duration, transport work or actual equipment service unit. Verify each property-to-unitgroup chain for final binding. Record actual density/moisture and calibrated measurement if converting soil or water volume to mass; never infer mass from tank capacity or replace time/energy with count."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: tank_installation
    name: "Civil preparation, tank integration and installation acceptance"
    inclusion: "required"
    inclusion_condition: "All in-scope jobs; protection/test water, extra components and replacement/retest use depend on actual records"
    role: "foreground installation and assembly integration"
    quantitative_reference: "1 item accepted stub-bounded tank installation"
process_inventory:
  - id: tank_installation
    label: "Civil preparation, tank integration and installation acceptance"
    inputs:
      product:
        - row_id: factory_tank
          role: "Factory polyethylene septic tank at declared supply gate"
          name: "Factory polyethylene septic tank at declared supply gate"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "The complete purchased vessel is an upstream product. Declare model/capacity/compartments, factory penetrations and included fittings/lids/risers; resin alone is not its identity. Range evidence need: Actual model-specific dispatch and job issue/serial records, replacement/damage log, supplier bill and stock custody are required; no universal tank mass or loss rate."
          amount:
            expression: "Record actual gross tank receipts/issues attributable to the job, including installed and damaged/replacement vessels; distinguish real returns and closing stock."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_components
              source_ids:
                - ads-septic-tank-installation-2024
            ranges: []
        - row_id: extra_gaskets
          role: "Separately supplied compatible inlet/outlet gaskets"
          name: "Separately supplied compatible inlet/outlet gaskets"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "Each genuine extra gasket is an actual discrete component matched to the approved tank/pipe penetration. Range evidence need: Actual kit exclusion, compatible gasket specification, issue/return quantities and damage records are required; no assumed two extra gaskets."
          amount:
            expression: "Record actual separately supplied gasket quantities by specific material/size, including replacement; omit a second burden for factory-included pieces."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_components
              source_ids:
                - ads-septic-tank-installation-2024
            ranges: []
        - row_id: installation_electricity
          role: "Actual installation and test electricity"
          name: "Actual installation and test electricity"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Actual supply mix/provider and metering boundary qualify the electricity product. Final binding requires an exact verified energy-property support chain. Range evidence need: Actual supply identity, task meter/charging allocation, measurement uncertainty and observed job duration are required; no default test energy or machine power multiplication."
          amount:
            expression: "Record actual metered tool/charger/test electricity attributable to the job, separately from future wastewater operation and provider-included energy."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_energy
              source_ids:
                - ads-septic-tank-installation-2024
            ranges: []
        - row_id: test_protection_water
          role: "Actual supplied test or protective-fill water"
          name: "Actual supplied test or protective-fill water"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Installation does not presume water filling. Any actual filling, test, repair and retest water is accountable, and subsequent retained water or discharge is recorded. Range evidence need: Actual applicable test/protection requirement, model-specific fill level, metered supply or volume with verified density and destination are required; no universal full-tank water quantity."
          amount:
            expression: "Record actual purchased/supplied water only when the actual test or rain-protection instruction requires it; retain source/quality and repeated fill quantities."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_water
              source_ids:
                - ads-septic-tank-installation-2024
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_tank_installation
          role: "Accepted gravity-fed nontraffic factory polyethylene septic-tank installation at defined stubs"
          name: "Accepted gravity-fed nontraffic factory polyethylene septic-tank installation at defined stubs"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "The accepted output has completed actual excavation/support, undamaged vessel integration, stubs, required access components, backfill/compaction/finish and installation-stage acceptance. The count excludes unresolved failures and does not certify future treatment performance. Range evidence need: The exact 1 item amount defines the reference, not an empirical range. Actual model/site/stub/acceptance record must demonstrate that this single completed job is the declared unit; no equivalence inferred from capacity."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_acceptance
              source_ids:
                - ads-septic-tank-installation-2024
            ranges: []
      waste:
        - row_id: water_waste
          role: "Actual test or protection water handed to treatment"
          name: "Actual test or protection water handed to treatment"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Collected contaminated test water crosses waste custody to a receiver only when that actual route occurs; a direct environmental discharge belongs in actual characterized releases. Range evidence need: Actual receiving route, measured quantity, contamination/acceptance record, retained inventory and applicable disposal authorization are required; no assumed sewage-treatment load."
          amount:
            expression: "Record actual water discharged to a managed treatment/waste receiver by source event and receiving route, accounting for retained water and repeat tests."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
