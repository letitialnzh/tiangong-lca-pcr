  normalization: "utf8-lf-v1"
  source_sha256: "sha256:564c5ecaead810cd6dff50307d60e98ecf09203c2d437c319cafe59017ac4c94"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5448"
      family: "system_boundary"
      span:
        start:
          offset: 5448
