  how_long_or_cycle: "One finite repair campaign from mobilisation/isolation through final closure acceptance, including rework and charging attributable to that campaign; declare event/reporting periods and shared-tool manufacture, maintenance, replacement, termination and end-of-life phases separately; no service-life promise"
