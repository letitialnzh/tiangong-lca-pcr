review_metadata:
  unresolved_flow_identities:
    - row_id: fan_appliance
      reason: Initial and one evidence-supported refinement did not verify exact basic
        intermittent Class II axial appliance. Detail d241cf7b is broad domestic
        fan/hood at plant, uses mass, and cannot be silently relabelled as exact
        item-count appliance.
    - row_id: installation_electricity
      reason: Multiple electricity/current rows remain plausible or incompatible.
        Detail 67b723a9 is Korean soil-washing-case electricity with NCV
        property, not a verified generic site Energy supply chain.
    - row_id: drilling_debris
      reason: Actual wall substrate, captured debris composition and waste destination
        required. Detail 2a6c9b60 is generic industrial dust rather than
        verified substrate-specific fixing-hole waste.
    - row_id: accepted_installation
      reason: One initial and one supported refinement did not verify exact accepted
        tested Class II basic intermittent wall fan installation service on
        declared preexisting interfaces. Equipment products cannot substitute
        for handover service.
  range_evidence_needs:
    - row_id: "fan_appliance"
      reason: "Range evidence need: Actual SKU and supplied-content issue/return
        counts, replacement records and accepted cohort are needed before any
        yield or appliance-input range. No numeric Range is asserted."
    - row_id: "fastening_components"
      reason: "Range evidence need: Actual substrate, fixing SKU, dimensions, quantity
        and weighed or documented unit masses are needed; no generic fixing BOM
        or mass interval is supported. No numeric Range is asserted."
    - row_id: "connection_components"
      reason: "Range evidence need: Actual conductor/connector specification, added
        length and traceable mass-per-length or weighing are needed; the example
        cable cross-section is not a component mass range. No numeric Range is
        asserted."
    - row_id: "ancillary_consumables"
      reason: "Range evidence need: Actual cleaning-water, collection-bag and other
        consumed-product identities and weighed quantities are needed; their
        occurrence is job dependent. No numeric Range is asserted."
    - row_id: "installation_electricity"
      reason: "Range evidence need: Task metering or measured device power, actual
        drilling/charging/testing runtimes and allocation records are needed;
        neither rated power nor an assumed test duration supports an energy
        interval. No numeric Range is asserted."
    - row_id: "transport_service"
      reason: "Range evidence need: Actual route legs, carried mass, vehicle/service
        units, crew travel and allocated shares are needed; no generic freight
        distance or load range is asserted. No numeric Range is asserted."
    - row_id: "site_fuel"
      reason: "Range evidence need: Actual equipment/vehicle activity, fuel identity,
        measured quantity and fuel-specific density/conditions are needed; no
        fuel-use or density interval is transferred between fuels. No numeric
        Range is asserted."
    - row_id: "returned_components"
      reason: "Range evidence need: Weighed product-return mass by component or
        reusable packaging identity and traceable count/length conversions are
        needed; unused-return fractions cannot be assumed. No numeric Range is
        asserted."
    - row_id: "packaging_waste"
      reason: "Range evidence need: Actual unpacked SKU, packaging material, separated
        mass, reuse/return and collection destinations are needed; no
        packaging-waste fraction is inferred. No numeric Range is asserted."
    - row_id: "drilling_debris"
      reason: "Range evidence need: Actual substrate, fixing-hole
        number/diameter/depth, preprepared-hole status, captured mass and
        collection effectiveness are needed; no core-hole or generic dust factor
        is substituted. No numeric Range is asserted."
    - row_id: "rejected_waste"
      reason: "Range evidence need: Actual defect/cutting/cleanup records and
        segregated mass/destination for discarded materials are needed, distinct
        from usable returns; no default reject fraction is supported. No numeric
        Range is asserted."
    - row_id: "direct_emissions"
      reason: "Range evidence need: Actual release activity, pollutant/species,
        particle-size basis, receiving medium, controls and measured or
        defensible activity-factor evidence are needed before emission
        intervals; missing evidence remains a gap. No numeric Range is
        asserted."
    - row_id: "accepted_installation"
      reason: "Range review: exactly one accepted service is the normalization
        definition. No empirical installation-yield range is asserted;
        cp_acceptance retains failed jobs and retests."
  unresolved_support_identities:
    - property: "Energy"
      unit: "kWh"
      reason: "No full exact Energy property-to-unit-group support chain verified; NCV
        reference on candidate electricity is not relabelled."
    - property: "Transport service"
      unit: "t*km and actual crew service unit"
      reason: "Actual transport-mode and unit support chains remain unverified;
        mass/count chains do not establish them."
  publication_blockers:
    - "13 concrete flow identities unresolved, including accepted_installation;
      actual conditional exchanges need verified distinct identities."
    - "Energy and transport support chain gaps; actual quantity Range evidence
      needs remain."
