allocation_rules:
  - rule_id: single_service
    applies_to: "fan_installation"
    rule: "The intended output is the accepted installation service; product returns and waste are not accepted services or automatic co-products. Retain all attributable failed-work and retest burdens in the declared cohort. No recovery or avoided-product credit is inferred."
    source_ids: []
  - rule_id: shared_resources
    applies_to: "fan_installation"
    rule: "Prefer task-specific measurements. Under cp_energy and cp_transport allocate shared job resources from documented activity drivers across all actual consumers, reconcile their shares to the whole job and disclose the selected driver and sensitivity. Do not charge the same meter interval, freight leg or tool burden twice. For each shared asset/service list fan_installation and every other actual consumer, record their service periods/jobs and measured driver, allocation rationale, denominator, share and evidence; if no sharing occurs record the single-consumer fact."
    source_ids: []
  - rule_id: reject_paths
    applies_to: "fan_installation"
    rule: "Link each failed fan or mounting/connection defect to its installation. Internal correction loops remain in this node; unused/repairable product exits use returned_components; discarded material uses rejected_waste and its actual route. Retain correction inputs/energy; unresolved failures cannot enter accepted_installation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "fan_installation"
      flow_role: "Appliance, fixing, connection, consumable inputs and product returns"
      record_type: "Issue/return records and measurements"
      raw_fields: "job_id; model; appliance_id; component_id; material; issued_count; returned_count; measured_mass; cable_length; mass_per_length; density; conversion_conditions; integrated_parts; defect_state; destination"
      collection_method: "Reconcile delivery, issue, installation and return records; weigh actual components or retain traceable supplier conversion; split each material identity and gate. Aggregation and attribution method: Attributable quantities per reference flow; separately retain issued, installed, returned and discarded quantities."
      unit: "item; kg; declared source units"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Receipts, stock movements, scale calibration, product sheets, conversion evidence and supplier return record"
    - protocol_id: cp_energy
      process_id: "fan_installation"
      flow_role: "Task electricity and actual conditional site fuel"
      record_type: "Meter, activity and allocation records"
      raw_fields: "job_id; device; task; meter_start; meter_end; electricity_kWh; measured_power; runtime; fuel_identity; fuel_mass; fuel_volume; density; conversion_conditions; activity_driver; job_total; allocated_share; tool_capital_policy; resource_event_id; consumer_node_or_job; service_period; allocation_denominator; allocation_rationale"
      collection_method: "Meter actual drilling/dust collection/charging/testing where possible; retain measured-power/runtime estimates and fuel records, allocation across all consumers and uncertainty. Aggregation and attribution method: Attributable task energy and fuel per reference flow; reconcile whole-job totals and disclose exclusions. For each shared resource event enumerate every actual consuming node/job and relevant period; retain allocation denominator, rationale and evidence and reconcile all shares."
      unit: "kWh; kg; declared source units"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, timestamps, equipment log, fuel receipts, density reference and allocation reconciliation"
    - protocol_id: cp_transport
      process_id: "fan_installation"
      flow_role: "Attributable delivery, return and crew transport"
      record_type: "Route and consignment records"
      raw_fields: "job_id; leg_id; service_type; carried_mass; distance; vehicle; actual_service_unit; consumer_list; allocation_driver; upstream_delivery_coverage; return_leg; resource_event_id; consumer_node_or_job; service_period; allocation_denominator; allocation_rationale"
      collection_method: "Collect actual origin/destination, mass and route by leg. Document mass-distance freight calculation and actual-unit crew transport separately; reconcile shared legs and upstream coverage. Aggregation and attribution method: Attributable transport per reference flow; no duplicate upstream and own-transport energy. For each shared resource event enumerate every actual consuming node/job and relevant period; retain allocation denominator, rationale and evidence and reconcile all shares."
      unit: "t*km; actual service unit"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Consignment record, route evidence, vehicle/service dataset and allocation worksheet"
    - protocol_id: cp_waste
      process_id: "fan_installation"
      flow_role: "Packaging, captured debris and rejected materials"
      record_type: "Segregated weighing and destination records"
      raw_fields: "job_id; material; source_card; waste_mass; reused_mass; hole_count; hole_diameter; hole_depth; substrate; drilling_state; collection_method; destination; treatment; defect; transfer_id"
      collection_method: "Weigh separated material; inspect preprepared holes or actual drilling records; reconcile captured and uncollected fractions with emissions assessment and receipt at collection gate. Aggregation and attribution method: Separated attributable waste per reference flow, with actual recovery/disposal route and no automatic credit."
      unit: "kg"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Scale calibration, hole/cleanup record, collection ticket and destination evidence"
    - protocol_id: cp_emissions
      process_id: "fan_installation"
      flow_role: "Conditional actual direct releases"
      record_type: "Measurement or defensible activity/factor records"
      raw_fields: "job_id; activity; pollutant; species; particle_size_basis; receiving_medium; emission_mass; control; measurement_method; activity_amount; factor_value; factor_unit; factor_source; uncertainty; capture_fraction"
      collection_method: "Establish actual substance and medium before binding; measure or apply an activity-specific defensible factor with retained source and uncertainty. Distinguish collected solids from release; document absence or unresolved evidence. Aggregation and attribution method: Identified attributable release per reference flow; no measured amount means a gap, not a zero."
      unit: "kg"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Sampling/control record or exact factor evidence, activity reconciliation and release destination"
    - protocol_id: cp_acceptance
      process_id: "fan_installation"
      flow_role: "Final service output and acceptance denominator"
      record_type: "Inspection, test and handover records"
      raw_fields: "job_id; site; date; appliance_id; model; speed; sleeve_length; sleeve_slope; guard; substrate; fixings; supply; class; wiring; isolation; impeller; shutter; clips; electrical_test_scope; electrical_results; extraction_method; delivered_flow; flow_unit; test_conditions; project_criterion; pass_fail; rectification; accepted_count; signature"
      collection_method: "Inspect accepted interfaces and secure installation, record actual electrical checks and extraction at selected speed against prior project criterion, then reconcile corrections and obtain signed handover. Aggregation and attribution method: Accepted installations per reference flow; failed or unsigned jobs remain excluded."
      unit: "item; actual test units"
      frequency: "Each installation or attributable job event"
      temporal_coverage: "Full installation campaign including corrections and retests"
      site_scope: "Declared installation site and job cohort"
      aggregation_rule: "per reference flow"
      quality_evidence: "Photographs, interface record, competent electrical test record, calibrated flow instrument/results and signed handover"
  calculation_rules:
    - id: cohort_attribution
      applies_to: "all inventory rows"
      rule: "For each actual exchange, retain the whole-job quantity and the documented attributable share; divide the attributable total by accepted installations in the same disclosed campaign. Do not dilute failed jobs through a different cohort or include unresolved acceptance in the denominator."
      inputs:
        - cp_materials
        - cp_energy
        - cp_transport
        - cp_waste
        - cp_emissions
        - cp_acceptance
      output: "Quantity per reference flow with allocation and uncertainty schedule"
      source_ids: []
    - id: electrical_consumption
      applies_to: "installation_electricity"
      rule: "Prefer the change in actual energy-meter reading. An estimate uses measured operating power and recorded task duration with explicit compatible unit conversion; disclose method, standby/charging coverage and uncertainty. Nameplate power alone is insufficient."
      inputs:
        - cp_energy
      output: "Attributable installation and test electricity"
      source_ids: []
    - id: component_reconciliation
      applies_to: "fan_appliance; fastening_components; connection_components; ancillary_consumables; returned_components; packaging_waste; drilling_debris; rejected_waste"
      rule: "Reconcile incoming quantities, installed quantities, product returns, waste and stock changes by actual material or appliance identity; keep generated substrate debris separate from purchased-component balance."
      inputs:
        - cp_materials
        - cp_waste
        - cp_acceptance
      output: "Traceable component/return/reject schedule and explained discrepancies"
      source_ids: []
  data_quality_requirements:
    - id: configuration_trace
      applies_to: "all inventory rows"
      requirement: "Preserve actual configuration, time/site, material identity and gate, instrument/source and compatible upstream datasets. Split materially different fans and installation conditions."
      evidence: "cp_materials; cp_acceptance"
    - id: completeness
      applies_to: "all inventory rows"
      requirement: "Record all actual required and conditional operations. Unknown material, emission, waste destination or resource attribution is disclosed as a gap. Missing measurements do not justify zero or generic defaults."
      evidence: "cp_materials; cp_energy; cp_transport; cp_waste; cp_emissions"
    - id: range_evidence
      applies_to: "all inventory rows"
      requirement: "No transferable quantitative Range is asserted. Appliance/fixing masses, power-time, transport, waste and extraction depend on the actual installation. Collect evidence for empirical ranges before claiming defaults; record the missing range evidence and assess sensitivity. The exact final service count is a normalization definition, not a yield prior."
      evidence: "Actual measurements, representative cohorts and uncertainty assessment"
    - id: acceptance_quality
      applies_to: "accepted_installation"
      requirement: "Retain delivered-extraction method, selected-speed state, measurement conditions and prior project criterion. A manufacturer-rated flow is not the installed delivered flow. Preserve failed results and retests."
      evidence: "cp_acceptance; vent-axia-494229j0626"
validation_rules:
  - rule_id: boundary_gate
    applies_to: "fan_installation"
    rule: "Reject use of this route if new core/sleeve/grille/circuit construction is hidden, variants are substituted without review, existing interfaces are unverified or the handover state differs."
    source_ids:
      - vent-axia-494229j0626
  - rule_id: acceptance_gate
    applies_to: "accepted_installation"
    rule: "Require all qualifiers, secure fixings/cover clips, free impeller and shutter, correct isolated connection/speed setup and documented electrical and delivered-extraction acceptance. Class II representative fan must not acquire a Class I earth-connection requirement. Missing project criterion or actual extraction result makes acceptance incomplete."
    source_ids:
      - vent-axia-494229j0626
  - rule_id: inventory_gate
    applies_to: "all inventory rows"
    rule: "Require actual resource, conditional-operation, waste/return/reject and emission coverage linked to node-specific protocols; inspect drilling or prior-hole evidence and retained failed-work burdens. Resolve actual concrete flow/property/unit identities before final exchanges; do not bind heterogeneous umbrella rows to a convenient near match."
    source_ids: []
  - rule_id: attribution_gate
    applies_to: "all inventory rows"
    rule: "Reconcile accepted-count denominator, job resource shares, upstream coverage, return paths and waste destinations; no duplicate transport/fuel, captured-debris emission or accepted-count credit for failed work. Disclose Range evidence gaps and capital/tool exclusions. Shared assets/services require all actual consuming nodes/jobs, periods and complete attribution evidence."
    source_ids: []
  - rule_id: bilingual_projection
    applies_to: "all inventory rows"
    rule: "Require aligned English/Chinese rules, cards, source attribution, qualifiers, measurement basis and literal constants, and a current deterministic canonical-Markdown structured projection."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground data package for a bounded first-installation service; process and lifecyclemodel are downstream projections"
  downstream_use: "secondary_dataset; background_dataset only with declared compatibility and quality limitations"
  allowed_use: "Compare or supply equivalent basic intermittent wall-fan installation services with matching configuration, starting interfaces and acceptance criteria"
  excluded_use: "Whole-building ventilation performance; ordinary fan operation; appliance-manufacture-only datasets; new core/sleeve/circuit construction; air conditioning, heat recovery or unreviewed variants"
  required_metadata: "actual basic intermittent model and appliance identifier; supply voltage/frequency and Class II design; speed selection; wall/substrate and fixing schedule; sleeve dimensions/length/slope and exterior guard acceptance; existing supply/isolation and cable compatibility; installed orientation and cover retention; electrical test scope/results; measured extraction test method, conditions, delivered flow and project criterion; installation date/site; drilling or inspected preprepared holes; failed-work and rework disposition; handover record; upstream coverage; component/transport/resource/waste schedules; normalization cohort"
  required_quality_disclosure: "Measured versus estimated resources; actual extraction evidence; unresolved UUIDs and support identities; missing empirical ranges; emissions gaps; allocation drivers and sensitivity; tool-capital policy; exclusions; translation/projection state"
  update_trigger: "Changed fan variant, electrical class, fixing/substrate or sleeve interface, test/acceptance method, upstream gate, material route, waste/rework treatment or new evidence affecting quantity/identity"
