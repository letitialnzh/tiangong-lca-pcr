measurement_rules:
  - id: reference_area
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Use cp_acceptance to establish actual accepted horizontal polygon area. The reference output amount is 1 m2; aggregate lot burdens are attributed to that same area. Retain surveying uncertainty and exclude duplicate rework passes from the denominator."
  - id: wet_residual_mass
    applies_to: "biomass_residual"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure net wet mass at actual custody transfer; record moisture method/date separately. Do not substitute dry mass or infer a universal area-to-mass conversion."
  - id: charging_boundary
    applies_to: "charging_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Retain charger-supply electricity including attributable losses/standby; battery nameplate capacity is not measured electricity. Exact Energy support must be resolved before concrete exchange construction."
  - id: freight_boundary
    applies_to: "freight_services"
    required_property_ref:
      name: "Freight transport"
      uuid: ""
    required_unit: "t*km"
    rule: "Keep actual payload mass and distance separate and preserve provider/empty-return coverage. Exact transport support must be verified for the chosen concrete exchange."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
