review_metadata:
  unresolved_flow_identities:
    - row_id: "precast_pile_sections"
      reason: "Initial plus one evidenced refinement found steel-pipe/raw concrete or wrong-purpose fabricated machinery frames, not the reviewed finished material/state/intended use. Closest generic pre-cast concrete does not establish prestressed pile identity; no broad commodity UUID borrowed."
    - row_id: "electricity"
      reason: "Actual voltage/source/geography are unknown; candidate detail uses reference NCV. Generic Energy is not independently verified in the support snapshot. Preserve Energy/kWh semantics and its support gap, never relabel NCV."
    - row_id: "water_supplied"
      reason: "Search and detail reveal tap/DI and geographic/provider variants. Actual supply/treatment state is unknown, so multiple identities remain plausible. No refinement invents potable/DI state."
    - row_id: "reference_service"
      reason: "Initial plus one evidenced refinement found no exact reviewed service/gate/property. Candidate must register this actual final product-output row, retain exact reference link/name and independently verified Length support; no active/publication readiness."
    - row_id: "damaged_pile_waste"
      reason: "Conditional actual material/SKU/state/substance/receiver or service identity is not concretely evidenced. No conceptual-umbrella fixed UUID or platform-absence claim; keep this row-addressable gap. "
    - row_id: "spent_cushion_waste"
      reason: "Conditional actual material/SKU/state/substance/receiver or service identity is not concretely evidenced. No conceptual-umbrella fixed UUID or platform-absence claim; keep this row-addressable gap. "
    - row_id: "collected_wastewater_slurry"
      reason: "Conditional actual material/SKU/state/substance/receiver or service identity is not concretely evidenced. No conceptual-umbrella fixed UUID or platform-absence claim; keep this row-addressable gap. "
  unresolved_support_identities:
    - row_id: "electricity"
      reason: "Energy property UUID remains unresolved; the independently verified units-of-energy group alone does not resolve Energy or the actual electricity identity."
    - row_id: "hired_equipment_services"
      reason: "Duration property and standalone time unit-group UUIDs remain unresolved; composite area/mass/volume-time groups are not substitutes."
  unresolved_range_evidence:
    - row_id: "precast_pile_sections"
      reason: "Range evidence need: actual section geometry and same-section mass, cutoff, splice and removal records must establish kg/m. Check each compatible section pool against accepted retained material, cutoffs, rejected/abandoned stock and exits; do not assume a universal pile mass per metre."
    - row_id: "shoe_joint_components"
      reason: "Range evidence need: the actual pile-ID component schedule and component masses; check retained and unused quantities against actual issue, never infer joints from length."
    - row_id: "pile_cushion_material"
      reason: "Range evidence need: actual material and changeout history under the specified driving duty; reconcile unused, retained and spent states without a default replacement rate."
    - row_id: "head_preparation_consumables"
      reason: "Range evidence need: actual cut/drill/repair work, product state and measured consumption. Check product issue and constituents against the same work and outgoing residues; no universal head-treatment dose is supplied."
    - row_id: "diesel_fuel"
      reason: "Range evidence need: actual equipment duty, calibrated meter/stock records and independent L; useful impact or lifting energy cannot substitute for fuel. Reconcile same-fuel stock and provider coverage before normalization. The identity supplies no density, fossil fraction or heating value."
    - row_id: "electricity"
      reason: "Range evidence need: device duty, calibrated interval readings and independent L. Reconcile direct and shared consumption with the meter total. Energy/kWh expresses the required physical quantity; a calorific-value property cannot establish electricity Energy support."
    - row_id: "water_supplied"
      reason: "Range evidence need: actual wet tasks, water draw and independently supported water-only fates. Compare water constituents rather than total slurry mass; no generic water demand is prescribed."
    - row_id: "lubricants_other_operating_products"
      reason: "Range evidence need: actual issue, density or measured mass and service/spill history. Compare like material and constituents with retained, return and oily-waste states; oily cloth mass is not pure oil mass."
    - row_id: "hired_equipment_services"
      reason: "Range evidence need: evidenced service boundary, occupied/duty hours and independent L. Labour hours or assumed shifts are not equipment duration. Existing equipment mass is an observation, not consumptive material."
    - row_id: "packaging_received"
      reason: "Range evidence need: supplier packaging masses and unpacking/return records. Reconcile each packaging pool across return, reuse, retained stock and waste; do not apply a packaging percentage to pile mass."
    - row_id: "direct_freshwater_abstraction"
      reason: "Range evidence need: actual water source, abstraction readings and operation demand. Reconcile with the water-only ledger and exclude any physical volume already represented by supplied water; source identity is not inferred from location."
    - row_id: "usable_material_exits"
      reason: "Range evidence need: material/SKU/current-state availability, independent mass and dispatch records. Each exit must be supported by its own compatible pool; a heterogeneous total is QA only, never a concrete exchange or avoided-production credit."
    - row_id: "returnable_packaging_exit"
      reason: "Range evidence need: matched packaging availability and custody/dispatch records. Prevent duplicate return, retained and waste assignment; used equipment return is not unused packaging return and no avoided-new-package credit is implicit."
    - row_id: "concrete_cutoff_waste"
      reason: "Range evidence need: actual removed geometry, composite constituents, capture and receiver records. Do not count physically separated steel twice or add captured fines again as airborne particles; accepted length alone does not establish a cutoff fraction."
    - row_id: "separated_reinforcement_waste"
      reason: "Range evidence need: steel actually present in the removed head pool and independent separated-metal weighing. Deduct that metal from composite-cutoff accounting; neither a default reinforcement ratio nor a designed steel schedule alone proves waste."
    - row_id: "damaged_pile_waste"
      reason: "Range evidence need: removed pile-ID masses and dispatch records. Preserve rejected, open and abandoned-in-place stock separately; an unaccepted buried pile is not a fabricated balancing waste exit and contributes no accepted L."
    - row_id: "spent_cushion_waste"
      reason: "Range evidence need: actual issued/retained cushion quantities and independently weighed waste state. Check only compatible cushion/constituent pools; no universal cushion-loss fraction is justified."
    - row_id: "packaging_waste"
      reason: "Range evidence need: matched packaging inputs/stock and exclusive return, reuse, retained and waste observations. Check compatible availability and any added contaminant; packaging balance residuals cannot become assumed waste."
    - row_id: "oily_consumable_waste"
      reason: "Range evidence need: measured waste-state mass, carrier issue and contamination records. Check all compatible constituent pools rather than bounding a mixed oily cloth by lubricant mass alone; treatment identity follows the real receiver."
    - row_id: "collected_wastewater_slurry"
      reason: "Range evidence need: actual water sources, entrained solids, concentration or separate constituent measurements and dispatch. Do not count slurry solids again in dry waste or aqueous direct releases; total mixture mass cannot close the water-only ledger."
    - row_id: "other_engine_species_air"
      reason: "Range evidence need: exact substance or reported species basis, actual operating condition and uncertainty. A conceptual engine-emission umbrella has no meaningful numeric envelope; do not borrow the fossil-CO2 identity or force full fuel-mass closure."
    - row_id: "physical_particulate_air"
      reason: "Range evidence need: actual source material and supported capture/emission quantity. Check compatible dry constituents without assigning all missing stock to air or prescribing a generic dust percentage."
    - row_id: "water_vapour_air"
      reason: "Range evidence need: available water-only pools and a supported evaporation estimate with uncertainty. Compare water constituents and inventory change; a closure residual is not vapour."
    - row_id: "specific_direct_water_releases"
      reason: "Range evidence need: actual discharge quantity, concentration/species and medium. Exclude wastewater sent to treatment and avoid double counting its constituents; the conceptual discharge umbrella has no generic numerical range."
