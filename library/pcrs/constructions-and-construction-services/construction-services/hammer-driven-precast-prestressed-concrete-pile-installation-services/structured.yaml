product_category_identity:
  canonical_pcr_id: "pcr.constructions-and-construction-services.construction-services.hammer-driven-precast-prestressed-concrete-pile-installation-services"
  classification_refs: "CPC 3.0 54511; proposed narrower correspondence, governed separately from methodology identity"
  covered_products: "Impact-hammer installation of factory precast prestressed concrete piles, with actually owned mechanical shoes/splices, handling, required restrikes/tests and head preparation"
  excluded_products: "Bored or cast-in-place shafts; steel/timber piles; vibratory, jetting or predrilling routes; welded splices/shoes and field structural welding; pile manufacture, pile caps, foundation excavation and independent site formation"
  representative_product: "Project-accepted driven prestressed concrete pile below its actual cutoff plane"
  production_route: "Receive sections; set up and handle; impact drive and mechanically fit actual specified parts; perform directed restrike/testing; prepare heads; accept and demobilize"
  market_state: "Completed installation service at the project pile-acceptance gate, without pile-cap construction"
functional_unit:
  what: "Installation service for accepted hammer-driven precast prestressed concrete piles"
  how_much: "1 m of unique accepted axial pile length L, measured from actual toe to actual cutoff plane"
  how_well: "Project-specific design/driving criteria and required tests met; owned mechanical connections and head preparation complete; pile ID and acceptance evidence retained"
  how_long_or_cycle: "The complete owned episode: receiving/custody, setup/driving, directed restrike/testing, head preparation, acceptance/demobilization. Index all actual periods and events; count a production-accepted test pile once and retain failed/open work and its burden separately"
  reference_flow_link: "reference_service"
system_boundary:
  rules:
    - rule_id: b_owned
      applies_to: "pile_install"
      rule: "Include received pile sections and actual permanent mechanical shoes/splices; separately retain cushion, head-work and operating consumables. The one accountable node owns actual handling, impact driving, fitting, necessary directed restrikes/tests, head preparation and incidental cleanup through pile acceptance. The output is the accepted installed pile service, never a pile cap."
      source_ids:
        - fhwa-gec15-2022
        - fhwa-pile-inspection
    - rule_id: b_start
      applies_to: "starting interfaces"
      rule: "Treat released locations, design/driving criteria, ground/platform and access condition as observed starting facts. Existing-asset readiness, inspection steps and within-node stock changes do not themselves create product cards. Reconsider nodes only for an evidenced separately owned material-state handoff."
      source_ids:
        - pile-installation-attribution-method
    - rule_id: b_route
      applies_to: "route changes"
      rule: "Stop for scope review if welded pile splices/shoe attachment, welded head buildup/structural repair, bored/steel/timber piles or vibration/jetting/predrilling are actually required. Retain the real responsibility; assess route materials, emissions, waste and acceptance rather than hiding welding as a material-free mechanical joint. Pile manufacture, pile caps, excavation and independent site formation are upstream/downstream interfaces outside this foreground."
      source_ids:
        - fhwa-gec15-2022
        - fhwa-pile-inspection
    - rule_id: b_phases
      applies_to: "periods and ownership"
      rule: "Index receiving/custody, setup/driving, directed restrike/testing, head preparation and acceptance/demobilization with pile, event, equipment and reporting-period links. Track unaccepted/damaged/rejected/abandoned states and engineer-directed redriving, removal or replacement inside pile_install; real material exits retain receiver and state."
      source_ids:
        - fhwa-gec15-2022
        - pile-installation-attribution-method
    - rule_id: b_assets
      applies_to: "equipment and meters"
      rule: "Identify actual hammer, crane, access/logistics and testing assets and all consuming piles/phases/periods, including owned idle and rework. Record provider fuel/capital/maintenance coverage and meter boundaries. Used asset return is an asset observation, not unused material return; self-owned manufacture attribution requires actual lifetime/service-capacity/use/damage evidence or a disclosed gap."
      source_ids:
        - pile-installation-attribution-method
    - rule_id: boundary_atomic_completion
      applies_to: "all processes"
