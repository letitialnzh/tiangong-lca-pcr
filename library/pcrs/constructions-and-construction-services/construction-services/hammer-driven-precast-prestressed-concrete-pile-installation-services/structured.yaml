boundary_abstraction:
  declared_starting_condition: "Released project pile positions and design/driving criteria, observed ground/platform and access condition, and actual delivered precast prestressed pile sections"
  starting_condition_role: "Observed installation interfaces, without invented site-formation or readiness exchanges"
  product_classification_scope: "This mechanical impact-driven precast prestressed route is a narrower installation category within CPC 3.0 54511"
  recursive_input_rule: "If an independently supplied installation service of this same category crosses the boundary, identify its actual scope and provider dataset; do not recursively reconstruct or count its included work again. Within-node phases are not purchased service inputs"
  upstream_dataset_requirement: "Link actual delivered pile/material and separately purchased services to compatible state/provider datasets; disclose missing production, transport, equipment-capital or treatment coverage. Identity alone does not prove dataset completeness"
  disclosure: "Declare starting interfaces, actual route and excluded responsibilities, pile acceptance gate, reporting periods, provider boundaries, open stock and unresolved identities/quantity evidence"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Hammer-driven precast prestressed concrete pile installation service"
    uuid: ""
  flow_property_ref:
    uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
  unit_group_ref:
    uuid: "838aaa22-0117-11db-92e3-0800200c9a66"
  reference_unit: "m"
  required_qualifiers:
    - "project/site and reporting interval"
    - "pile IDs"
    - "precast/prestressing system"
    - "actual section/void geometry"
    - "delivered lengths and mass"
    - "toe/cutoff surveys and axial/batter method"
    - "driving-criteria revision"
    - "hammer/cushion"
    - "mechanical shoe/splice schedule"
    - "test/acceptance/head-preparation state"
    - "equipment ownership and provider scope"
reference_flows:
  []
measurement_rules:
  - id: accepted_length
    applies_to: "reference_service"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "Measure L independently as the sum of unique accepted axial toe-to-cutoff lengths from the pile register and survey, with batter correction. L must be positive; use cp_pile_install_material. Repeated driving/test events do not add length."
  - id: same_state_bridges
    applies_to: "precast_pile_sections; shoe_joint_components; pile_cushion_material; head_preparation_consumables; diesel_fuel; water_supplied; lubricants_other_operating_products; packaging_received; direct_freshwater_abstraction; usable_material_exits; returnable_packaging_exit; concrete_cutoff_waste; separated_reinforcement_waste; damaged_pile_waste; spent_cushion_waste; packaging_waste; oily_consumable_waste; collected_wastewater_slurry; fossil_co2_air; other_engine_species_air; physical_particulate_air; water_vapour_air; specific_direct_water_releases"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain each native material or substance measurement. Convert count, geometry or volume only with a same-SKU, same-state measured bridge, including solid/void and reinforcement content. Do not use cross-SKU averages or infer unknown species from residual mass."
  - id: utility_service_units
    applies_to: "electricity; hired_equipment_services"
    required_property_ref:
      name: "Energy; Duration"
      uuid: ""
    required_unit: "kWh; h"
    rule: "Record electricity as measured actual electrical energy and equipment service as actual attributable equipment intervals. Use evidenced unit conversions; heating value is not a substitute for Energy, and labour or default shifts are not equipment Duration. Preserve each unresolved support identity explicitly."
process_map:
  - id: pile_install
    name: "Hammer-driven precast prestressed concrete pile installation"
    inclusion: "required"
    inclusion_condition: "Actual reviewed mechanical impact route"
    role: "One phase-indexed accountable node for handling, mechanical component fitting, driving, directed restrike/testing, head preparation and acceptance; rejected/open states and rework loops retain original pile links"
    quantitative_reference: "reference_service; 1 m"
process_inventory:
  - id: pile_install
    label: "Hammer-driven precast prestressed concrete pile installation"
    inputs:
      product:
        - row_id: precast_pile_sections
          role: "Delivered prestressed concrete pile sections"
          name: "Shop-cured precast prestressed concrete pile sections"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Record the whole delivered section, including its actual reinforcement, at receiving. Keep pile ID, prestressing system, solid/void section geometry, certified or measured section mass and delivery length. Record actual sections entering episode custody and allocated opening stock, with independent closing-stock and exit records. Returns recorded as outgoing exchanges must not also be subtracted from the same gross receipt; accepted length is not delivered length. Range evidence need: actual section geometry and same-section mass, cutoff, splice and removal records must establish kg/m. Check each compatible section pool against accepted retained material, cutoffs, rejected/abandoned stock and exits; do not assume a universal pile mass per metre."
          amount:
            expression: "Each actual concrete exchange attributable amount / L; collect with cp_pile_install_material; never use a heterogeneous total."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_pile_install_material
              source_ids:
                - pile-installation-attribution-method
                - fhwa-gec15-2022
                - fhwa-pile-inspection
            ranges: []
        - row_id: diesel_fuel
          role: "Diesel burned within the owned boundary"
          name: "Diesel fuel"
          flow_type: "product"
          flow_ref:
            uuid: "9d258d75-6792-4f1c-9856-81602ed8f816"
          property_unit: "Mass / kg"
          description: "Actual upstream fuel supplied to this node, before usable outward exits. Apply fuel_supply_fate to retain the supply burden of nonreturned waste/loss and derive burned activity separately. Keep actual fuel grade, equipment duty, provider coverage, density/state and measurement uncertainty. Range evidence need: actual equipment duty, calibrated meter/stock records and independent L; useful impact or lifting energy cannot substitute for fuel. Reconcile same-fuel stock and provider coverage before normalization. The identity supplies no density, fossil fraction or heating value."
          amount:
            expression: "Actual upstream supplied fuel mass G_fuel divided once by the independently measured positive accepted lot quantity D_fuel in the declared reference unit; retain all exclusive fuel outlets and derive actual burned B_fuel separately under section 8."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_pile_install_utility
              source_ids:
                - pile-installation-attribution-method
            ranges: []
        - row_id: electricity
          role: "Attributed electricity"
          name: "Actual electricity at its supply state"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Identify source, voltage and meter topology; allocate full recorded intervals, including tests and idle where owned. Range evidence need: device duty, calibrated interval readings and independent L. Reconcile direct and shared consumption with the meter total. Energy/kWh expresses the required physical quantity; a calorific-value property cannot establish electricity Energy support."
          amount:
            expression: "Each actual concrete exchange attributable amount / L; collect with cp_pile_install_utility; never use a heterogeneous total."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_pile_install_utility
              source_ids:
                - pile-installation-attribution-method
            ranges: []
        - row_id: water_supplied
          role: "Supplied process and cleanup water"
          name: "Actual supplied water at its treatment and delivery state"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Record actual supply state and independently metered wet-operation or cleanup use, including circulation and returns. Do not repeat the same draw as direct environmental abstraction. Range evidence need: actual wet tasks, water draw and independently supported water-only fates. Compare water constituents rather than total slurry mass; no generic water demand is prescribed."
          amount:
            expression: "Each actual concrete exchange attributable amount / L; collect with cp_pile_install_utility; never use a heterogeneous total."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_pile_install_utility
              source_ids:
                - pile-installation-attribution-method
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: reference_service
          role: "Accepted pile installation service"
          name: "Hammer-driven precast prestressed concrete pile installation service"
          flow_type: "product"
          property_unit: "Length / m"
          description: "Count only unique accepted piles after project driving/testing criteria, owned mechanical connections and head preparation are complete. Independently determine positive L as the sum of axial toe-to-actual-cutoff lengths, with surveyed elevations and batter correction. Ordered/delivered lengths, repeated driving passes, rejected piles and abandoned-in-place piles do not add L; their attributable burdens remain. Self-normalization L / L yields exactly 1 m. A test pile accepted as a production pile counts once."
          amount:
            expression: "1 m"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
