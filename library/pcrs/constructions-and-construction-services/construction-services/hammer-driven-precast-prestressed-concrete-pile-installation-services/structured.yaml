allocation_rules:
  - rule_id: a_direct
    applies_to: "shared operating burden"
    rule: "Assign directly measured pile/phase use first. For shared hammer, crane, meter or test resources, list every consumer and period and attribute only the reconciled residual by documented actual duty or another evidenced causal share; shares must exhaust that residual once. Declare idle/setup/test ownership and period-cutoff treatment."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: a_provider
    applies_to: "provider and reusable assets"
    rule: "Count provider-included fuel, capital and maintenance once; exclude duplicate own diesel/equipment entries for those same included activities. Attribute self-owned manufacture only with actual service capacity/lifetime, episode use and damage evidence, disclosing an unresolved gap otherwise. Reusable equipment mass and its used return do not constitute full consumptive material input/output."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: a_rework
    applies_to: "rework and accepted length"
    rule: "Retain attributable failed driving, restrike, testing, removal and replacement burdens in the installing lot. Record original pile and event links and actual return/downgrade/retained/waste/abandoned fate. Rejected or open piles contribute no L; repeated passes and a production-accepted test pile cannot repeat L. Unresolved replacement/termination remains an open gap at the period cutoff."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: a_exits
    applies_to: "material exits and normalization"
    rule: "Record real usable returns and waste dispatch by identity/state/receiver; do not assume avoided production or recovery credit. Separate any evidenced co-product responsibility by subdivision or documented causal treatment. Divide each concrete attributable numerator by the independently measured L once; heterogeneous totals serve QA only."
    source_ids:
      - pile-installation-attribution-method
dataset_production:
  collection_protocols:
    - protocol_id: cp_pile_install_material
      process_id: "pile_install"
      flow_role: "material components, consumables, stocks, exits and reference"
      record_type: "pile register and identity/event ledger"
      raw_fields: "event/lot/configuration; pile or asset ID; process/phase/time and reporting period; owner and role; actual identity/SKU/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence and uncertainty; actual occurrence yes/no/unresolved; pile prestressing system and section/void geometry; delivery/accepted/rejected state; toe/cutoff survey and batter; section mass; head/separation/capture; stock movement; criteria revision and head/test/acceptance records"
      collection_method: "Weigh or use traceable same-section mass certificates and calibrated native measures; survey actual toe and cutoff, correct for axial/batter geometry and reconcile unique accepted piles to inspection/test records. Track opening, receipts, issue, transfers, retained/rejected/abandoned stock and dispatch separately by concrete identity/state/receiver. Aggregation procedure: Determine independent positive accepted L; calculate each concrete attributable material numerator / L per 1 m reference flow; reference_service self-normalizes L / L; heterogeneous totals are QA only."
      unit: "kg; m; native count/geometry; measured bridges"
      frequency: "every receipt, issue, head/rework/separation, stock cutoff and acceptance/exit event"
      temporal_coverage: "full episode and opening/closing stocks across all reporting periods"
      site_scope: "project pile lot and actual material custody boundary"
      aggregation_rule: "per 1 m reference flow"
      quality_evidence: "calibration/certificates; surveys; pile and decision register; signed head/test/acceptance; dispatch receivers"
    - protocol_id: cp_pile_install_utility
      process_id: "pile_install"
      flow_role: "diesel, electricity and supplied water"
      record_type: "fuel/utility meter and stock ledger"
      raw_fields: "event/lot/configuration; pile or asset ID; process/phase/time and reporting period; owner and role; actual identity/SKU/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence and uncertainty; actual occurrence yes/no/unresolved; meter topology and reading interval; density/temperature; utility source/voltage/treatment; equipment duty/idle/test/rework; provider coverage; direct assignment and residual consumer shares; G_fuel; B_fuel; U_fuel; X_fuel; W_fuel_contained_mass; P_fuel_contained_mass; closing_usable_tank_stock; D_fuel; D_fuel_unit; fate_completeness; fuel_supply_burden_owner"
      collection_method: "Use calibrated readings or stock reconciliations for the full owned intervals. Convert only with actual same-fuel/state evidence; retain water circulation and shared-meter reconciliation. Distinguish useful equipment energy from purchased electricity or diesel and exclude provider-included duplicate consumption. Aggregation procedure: Assign direct use then evidenced reconciled shared residual once; each concrete attributed utility numerator / L per 1 m reference flow. Supply and burn are separate under fuel_supply_fate; collect every exclusive outlet, actual denominator and its unit, keep nonreturned waste/loss supply burdens, and report missing fates."
      unit: "kg; kWh; native volume and meter units"
      frequency: "each meter interval, fueling, stock change and wet task"
      temporal_coverage: "complete owned setup/idle/driving/restrike/test/head/rework/demobilization intervals and period cutoffs"
      site_scope: "all actual equipment and meters serving the project lot, with other consumers identified"
      aggregation_rule: "per 1 m reference flow"
      quality_evidence: "meter calibration, stock tickets, state-specific density, consumer reconciliation and provider boundary"
    - protocol_id: cp_pile_install_asset
      process_id: "pile_install"
      flow_role: "owned and supplied equipment use and capital coverage"
      record_type: "asset/service event and consumer ledger"
      raw_fields: "event/lot/configuration; pile or asset ID; process/phase/time and reporting period; owner and role; actual identity/SKU/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence and uncertainty; actual occurrence yes/no/unresolved; provider scope and asset identity; occupation/duty intervals; all consumers/periods; manufacture/maintenance/fuel inclusion; service capacity/lifetime and damage; used return/stock condition"
      collection_method: "Reconcile actual asset logs, provider contracts and invoices with pile/phase events; measure actual equipment service duration. Observe reusable mass/current condition without treating it as consumed material. For self-owned capital collect actual lifetime/capacity/use/damage; retain a gap where evidence is absent. Aggregation procedure: Each separately purchased concrete service numerator / L per 1 m reference flow; allocate shared and self-owned burden once using evidenced coverage and capacity/use; do not invent lifetime."
      unit: "h; native capacity/use and condition measures"
      frequency: "each mobilization, duty/idle/rework interval, maintenance, damage and return event"
      temporal_coverage: "complete service episode and relevant evidenced asset life/service periods"
      site_scope: "actual hammer/crane/access/logistics/test assets and every consumer"
      aggregation_rule: "per 1 m reference flow"
      quality_evidence: "contracts, invoices, interval logs, consumer list and actual life/use/damage evidence or gap"
    - protocol_id: cp_pile_install_release
      process_id: "pile_install"
      flow_role: "direct abstraction and substance/medium releases"
      record_type: "substance/medium measurement and model ledger"
      raw_fields: "event/lot/configuration; pile or asset ID; process/phase/time and reporting period; owner and role; actual identity/SKU/current state; native amount/unit; measured same-state bridge; receiver/medium; evidence and uncertainty; actual occurrence yes/no/unresolved; exact substance/species/particle and medium; source constituent pool; fossil carbon burned; wet-work water-only input/stock/fate; capture/discharge; model/factor applicability and uncertainty"
      collection_method: "Use direct measurements or documented applicable emission/evaporation/discharge models with actual fuel, equipment, wet task and source-pool evidence. Retain native measurements and constituent concentrations; independently measure abstraction. Preserve actual medium and do not turn ledger residuals into releases. Aggregation procedure: Calculate each concrete substance-and-medium numerator / L per 1 m reference flow; compare compatible dry constituents, water-only and fossil-carbon pools separately; no residual exchange."
      unit: "kg; native discharge volume/concentration and sampling units"
      frequency: "each emission-relevant duty/wet/discharge event and representative measurement interval"
      temporal_coverage: "all applicable phases and actual release/source intervals, including rework"
      site_scope: "actual equipment/material release points and receiving media for the project lot"
      aggregation_rule: "per 1 m reference flow"
      quality_evidence: "sampling/meter calibration; model/factor scope; composition, capture/receiver and uncertainty evidence"
  calculation_rules:
    - id: c_length
      applies_to: "reference_service"
      rule: "L = sum of unique accepted axial lengths from actual toe to actual cutoff plane; use surveyed geometry and batter correction, and exclude unaccepted/rejected/abandoned piles and duplicate driving or test passes. Reference amount = L / L = 1 m for positive L."
      inputs:
        - "pile register"
        - survey
        - "criteria/test/head/acceptance"
        - cp_pile_install_material
      output: "L; 1 m reference_service"
      source_ids:
        - accepted-axial-length-identity
        - fhwa-gec15-2022
        - fhwa-driven-length-review
    - id: c_exchange
      applies_to: "all inventory rows"
      rule: "For each actual concrete identity/SKU/current-state/receiver or substance/medium, q_concrete_ref = attributable native amount converted with its own evidenced same-state bridge / L. Apply once; retain constituent amounts separately from whole-mixture mass and do not export heterogeneous sums as exchanges."
      inputs:
        - "actual concrete event amounts"
        - "same-state bridge"
        - L
        - cp_pile_install_material
        - cp_pile_install_utility
        - cp_pile_install_asset
        - cp_pile_install_release
      output: "individual normalized concrete exchanges"
      source_ids:
        - pile-installation-attribution-method
    - id: c_shared
      applies_to: "all inventory rows"
      rule: "Separate directly assigned actual use from shared totals; remaining shared burden = reconciled total - direct assignments - explicitly excluded consumer coverage. Attribute that residual once to evidenced consumers/periods using actual duty or documented causal shares summing to one; retain uncertainty and provider coverage."
      inputs:
        - "consumer/phase/period ledger"
        - "direct readings"
        - "reconciled totals"
        - "provider scope"
        - cp_pile_install_utility
        - cp_pile_install_asset
      output: "nonduplicated attributable episode amounts"
      source_ids:
        - pile-installation-attribution-method
    - id: c_pools
      applies_to: "all inventory rows"
      rule: "For each compatible material/current-state or constituent pool, compare opening stock + actual inflows with retained installed/usable stock + closing rejected/open/abandoned stock + independently observed exits/releases. Transformations require explicit measured constituent bridges. Keep water-only fates and fossil carbon independent; report residual and uncertainty without inventing a balancing exchange."
      inputs:
        - "same-pool stock/inflows"
        - "measured transformations"
        - "actual fates"
        - cp_pile_install_material
        - cp_pile_install_release
      output: "pool QA, disclosed residuals and gaps"
      source_ids:
        - compatible-pool-balance-identity
    - id: c_carbon
      applies_to: "fossil_co2_air"
      rule: "m_CO2_fossil <= C_fossil_burned * 44 / 12; C_fossil_burned is independently determined fossil-carbon mass actually burned. The upper identity does not assert complete oxidation, estimate other species or equate fuel mass to CO2 mass."
      inputs:
        - "actual fuel and fossil-carbon composition"
        - duty
        - "applicable model/measurement"
        - cp_pile_install_release
      output: "fossil-carbon CO2 QA constraint"
      source_ids:
        - carbon-oxidation-identity
    - id: fuel_supply_fate
      applies_to: "diesel_fuel"
      rule: "For each actual fuel identity and nonoverlapping node/event period, G_fuel = opening usable fuel + external receipts - closing usable fuel stock, including equipment tanks, with container tare excluded and same-boundary issues/transfers not added as new receipts. G_fuel is the gross physical product input before genuine usable outward U_fuel, outward transfer X_fuel, collected unburned fuel W_fuel and uncontained fuel P_fuel. Keep those exclusive outlets separate and resolve actual product, waste stream or substance/medium identities; a total spill is an incident diagnostic, never another deduction. W_fuel and P_fuel mean the contained fuel mass, not the total mass of contaminated absorbent or wastewater. B_fuel = G_fuel - U_fuel - X_fuel - W_fuel - P_fuel only with a complete supported fate ledger; unknown fate stays a gap and is not presumed burned. Only independently supported B_fuel drives combustion emissions. Retain upstream supply burdens of all nonreturned unburned fuel, waste and loss; only original unused-material burden may follow a documented usable exit, without a second net-input deduction or avoided-production credit. Carry opening/closing stock burden once. Normalize each physical quantity once by D_fuel, the independently measured positive accepted lot quantity in this PCR reference unit (accepted volume, area, axial length, steel mass or complete accepted count as defined in sections 3-4), never by a fuel quantity or an intermediate output. Existing actual_consumed/fuel-use fields are burn-activity records; they cannot replace G_fuel as the upstream input. Provider-included fuel and its emissions have one owner; do not add overlapping foreground supply or combustion."
      inputs:
        - "opening fuel"
        - "external receipts"
        - "closing intact fuel"
        - U_fuel
        - X_fuel
        - W_fuel
        - P_fuel
        - D_fuel
        - "actual node fuel protocol and fate evidence"
      output: "G_fuel product input; independently supported B_fuel; separately resolved exclusive outlets"
      source_ids: []
  data_quality_requirements:
    - id: dq_gate
      applies_to: "reference_service"
      requirement: "Retain pile ID, prestressing system, section/void geometry, delivered mass/length, actual toe/cutoff elevations and axial/batter method, driving-criteria revision, hammer/cushion and mechanical shoe/splice schedule. Match required test, head-preparation and acceptance records; no generic bearing capacity, blow count, energy or test-frequency threshold is prescribed."
      evidence: "survey, signed pile/test/head/acceptance register; fhwa-gec15-2022; fhwa-pile-inspection"
    - id: dq_occurrence
      applies_to: "all inventory rows"
      requirement: "Record each conditional task/material/fate as yes, no or unresolved with evidence. Unknown is not inactive or zero. Instantiate every real SKU/state/receiver or substance/medium separately; verify its concrete identity and support before final exchange production. Preserve Energy and Duration support gaps rather than borrowing calorific value or composite time dimensions."
      evidence: "actual event/identity/phase ledger and concrete binding/support evidence"
    - id: dq_range
      applies_to: "all inventory rows"
      requirement: "Resolve each card-specific range evidence need using actual supplier/project/receiver data and applicable reviewed observations before asserting an envelope. Preserve identity, state, denominator and uncertainty. Only reference self-normalization and the fossil-carbon 44/12 upper constraint are supplied here; no arbitrary broad or falsely narrow numbers may replace the other 24 evidence needs."
      evidence: "each card description; actual range observations and applicable uncertainty"
    - id: dq_reject
      applies_to: "pile_install"
      requirement: "Track each failed/open/rejected/abandoned pile and original-to-restrike/removal/replacement links with actual engineer decisions and receiver/state. Keep burdens and period-cutoff stock; only accepted unique length enters L. Unresolved terminal fate or replacement is a disclosed gap and blocks dataset finalization."
      evidence: "pile decisions, event journal, stock/dispatch and period reconciliation"
    - id: dq_shared
      applies_to: "pile_install"
      requirement: "Record every actual shared hammer/crane/test/meter consumer and period, direct assignments, residual attribution and provider inclusions. Self-owned life/capacity/use/damage evidence is required for manufacture attribution; do not silently omit capital or charge the full existing asset."
      evidence: "contracts, meters, asset condition/use and reconciled consumer shares"
    - id: dq_pools
      applies_to: "all inventory rows"
      requirement: "Keep whole products and measured constituents distinct. Separate composite cutoff from physically separated steel, captured solids from airborne particles, collected slurry from direct discharges, and water-only from total wet mixtures. Fuel carbon is not fuel mass or total combustion mass; no invented O2 card or residual release is allowed."
      evidence: "constituent assays, same-state bridges, source pools and capture/receiver records"
    - id: dq_coverage
      applies_to: "pile_install"
      requirement: "Cover receiving through demobilization, owned setup/idle/test/rework and all period boundaries with calibration, uncertainty and missing-record disclosure. Retain both native measurements and each concrete numerator/L calculation; identity resolution alone is not quantity evidence or complete upstream coverage."
      evidence: "four node-owned protocols, event journal and data-gap register"
validation_rules:
  - rule_id: v_scope
    applies_to: "pile_install"
    rule: "Verify the actual precast prestressed impact-hammer mechanical route, owned phases and acceptance handoff. A welded or other excluded route requires scope review before applying these rules; separate handoffs require boundary reconsideration."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: v_reference
    applies_to: "reference_service"
    rule: "Require independent positive L, actual toe/cutoff and axial/batter evidence, criteria revision, complete owned head/mechanical connection duties and required tests/acceptance. Reconcile each unique pile; reject duplicate restrike/test length and unaccepted/rejected/abandoned length."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: v_events
    applies_to: "periods and rework"
    rule: "Reconcile every input, asset, output and rework/reject event to pile_install, its actual phase and reporting period. Verify real return/downgrade/removal/waste/retained/abandoned fates and original pile links; unresolved termination/replacement blocks finalization while burdens remain."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: v_shared
    applies_to: "shared assets/services/meters"
    rule: "Enumerate all real hammer/crane/access/test/meter consumers and periods; reconcile direct assignments and residual shares, including owned setup/idle/rework. Reject duplicate fuel/capital/maintenance already included in the provider service. Require actual self-owned life/capacity/use/damage or report the gap."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: v_exchanges
    applies_to: "all inventory rows"
    rule: "Verify concrete identity/SKU/state/receiver or substance/medium, conditional occurrence evidence, actual native amount and its own same-state bridge and numerator/L. Reject a heterogeneous summed exchange, borrowed UUID, unresolved final binding, duplicate constituent or unsubstantiated zero. Check water-only and fossil-carbon separately without closure-generated exchanges."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: v_evidence
    applies_to: "data package completeness"
    rule: "Report checks performed/skipped, findings, completeness, unresolved support and card-specific range evidence. Candidate quantity warnings do not establish an active-ready methodology. A final dataset requires resolved applicable identity/quantity/ownership/terminal-fate gaps and supported uncertainty; checker pass alone proves neither external verification nor readiness."
    source_ids:
      - pile-installation-attribution-method
  - rule_id: validate_fuel_supply_fate
    applies_to: "diesel_fuel"
    rule: "Check G_fuel, B_fuel and all exclusive outlets against the actual fuel protocol, stock and provider coverage. Nonreturned unburned waste/loss keeps its upstream burden; unresolved fate, fuel constituent or positive D_fuel blocks a complete quantitative fuel inventory. Do not substitute burned activity for purchased fuel or deduct total spill plus its component outlets."
    source_ids: []
  - rule_id: validate_physical_slurry_stream
    applies_to: "all collected wastewater/slurry"
    rule: "A wastewater/slurry card denotes one actual physically unseparated liquid/solid mixture at one receiver gate. Independently collected liquids, separated solids or different treatment destinations require distinct actual exchanges; do not recombine them to fit this card. Mixture mass and constituent water/solids are nonadditive views."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground installation data package for the declared pile lot"
  downstream_use: "secondary_dataset; background_dataset; process and lifecyclemodel projections"
  allowed_use: "The evidenced impact-driven precast prestressed mechanical route and declared accepted-length gate with complete ownership and coverage disclosure"
  excluded_use: "Design or structural certification; universal performance comparisons; excluded pile types/driving aids/welding; pile manufacture or pile-cap construction; unresolved final exchanges"
  required_metadata: "Required reference qualifiers; boundary and provider scopes; pile/phase/period event register; concrete flow identities/states/receivers; native records, bridges and independent L; upstream/treatment coverage"
  required_quality_disclosure: "Calibration, uncertainty, occurrence yes/no/unresolved, unresolved identity/support/range/life/fate gaps, rework/failed-stock burdens, pool residuals and performed/skipped validation"
  update_trigger: "Changed pile/section/prestressing or installation route, criteria/gate, equipment/provider coverage, source medium, concrete identity, material fate or improved quantitative/lifetime evidence"
data_sources:
  - id: "fhwa-gec15-2022"
    type: "official_guidance"
    reference: "FHWA-HIF-22-024 (2022), Acceptance Procedures for Deep Foundations, chapter 4, especially §§4.2–4.4, printed pp.4-6–4-9. https://www.fhwa.dot.gov/engineering/geotech/pubs/hif22024.pdf"
    used_for: "Project-specific installation plan, driving criteria, cushions, restrikes/tests, damaged-pile assessment and head inspection; no universal material/fuel rate or adopted example acceptance threshold"
  - id: "fhwa-pile-inspection"
    type: "official_guidance"
    reference: "FHWA, Construction Program Management and Inspection Guide, Appendix D, Driven Piling. https://www.fhwa.dot.gov/construction/cpmi04d2.cfm"
    used_for: "Pile/hammer/cushion/shoe/splice records, handling, actual toe/cutoff and delivered/order/embedded-length distinctions; only relevant driven-pile passages used, without generic consumption priors"
  - id: "fhwa-driven-length-review"
    type: "official_guidance"
    reference: "FHWA, Pile Driving Review, Measurement and Payment. https://www.fhwa.dot.gov/construction/reviews/revpile1.cfm"
    used_for: "Limited to the distinction of accepted driven length below cutoff from ordered length and record reconciliation. Steel-pile/casing, coating, splice, hammer and concrete-placement numeric examples are not transferred to precast prestressed piles"
  - id: "accepted-axial-length-identity"
    type: "method_factor"
    reference: "Author-defined normative method identity: unique accepted axial toe-to-actual-cutoff length, L > 0; L / L = 1 m reference service"
    used_for: "Independent denominator, axial/batter measurement, unique-pile acceptance and self-normalization; this is a declared method, not an external observation"
  - id: "pile-installation-attribution-method"
    type: "method_factor"
    reference: "Author-defined normative method identity: concrete event/identity/phase attribution and one normalization by independent accepted L"
    used_for: "Owned one-node event/period accounting, causal shared residual, provider overlap prevention, actual asset-capacity/use evidence and concrete exchange normalization; not an empirical rate"
  - id: "compatible-pool-balance-identity"
    type: "method_factor"
    reference: "Author-defined normative physical bookkeeping identity for compatible material/current-state/constituent pools with independently observed fates"
    used_for: "Separate stock/exit QA, dry constituents and water-only pools; residual disclosure without invented exchanges or full combustion-mass closure"
  - id: "carbon-oxidation-identity"
    type: "method_factor"
    reference: "Author-defined normative carbon stoichiometry identity: one mass unit of fossil carbon can form at most 44/12 mass units of fossil CO2"
    used_for: "Fossil-carbon-based CO2 upper QA constraint only, not a complete-oxidation or fuel-consumption factor"
