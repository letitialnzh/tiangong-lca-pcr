review_metadata:
  unresolved_flow_identities:
    - row_id: site_electricity
      reason: Low-voltage consumption mix candidate 50657322 detail is CN supply and
        references Net calorific value, not independently verified Energy
        support. Site geography and carrier coverage are not fixed across this
        PCR; no universal electricity UUID is asserted.
    - row_id: installer_travel
      reason: Candidate 74548aa5 detail is Belgian passenger-car vehicle distance with
        Length property, not the declared person-distance transport service.
        Other candidates are mode- or case-specific; actual
        itinerary/mode/passenger basis and support chain required.
    - row_id: accepted_installation
      reason: Initial and one refinement found manufactured electrical
        products/components, junction boxes and connectors; none verifies Class
        I wall-mounted resistive panel-convector installation at signed tested
        handover. This actual outputs.product row is the unresolved candidate
        reference anchor.
  unresolved_support_identities:
    - property: "Energy"
      reason: "Reference energy unit group alone does not verify an Energy property."
    - property: "Duration"
      reason: "Standalone time property and unit group require independent
        confirmation."
    - property: "Mass*distance and Number of persons*distance"
      reason: "Actual carrier/passenger transport support identities need confirmation
        before concrete exchange construction."
  blocking_findings:
    - "Reference installation-service UUID remains unverified; candidate only."
    - "Initial heat-up substance/quantity and conditional drilling release
      characterization remain direct-emission completeness gaps."
    - "Energy, Duration and actual freight/passenger transport support chains
      require confirmation for concrete exchanges."
  range_evidence_needs:
    - row_id: "heater_package"
      reason: "Range evidence need: supplier receipt and reject records must establish
        appliances consumed per accepted installation; the manual does not
        establish a generic replacement rate."
    - row_id: "fixings_connections"
      reason: "Range evidence need: actual substrate and supplier-approved
        fastening/connection schedule determine quantities; four bracket holes
        in this example do not determine every model BOM."
    - row_id: "site_electricity"
      reason: "Range evidence need: measured tool and commissioning records are
        required; manufacturer rated power is neither consumed electricity nor a
        supported generic kWh interval."
    - row_id: "material_transport"
      reason: "Range evidence need: job route, mass and carrier records are required;
        no representative mileage or load factor is imposed."
    - row_id: "installer_travel"
      reason: "Range evidence need: actual itinerary and shared-visit records must
        establish travel; do not infer a standard trip from the classification."
    - row_id: "tool_access"
      reason: "Range evidence need: actual tools and operating records determine
        access duration; no universal lifetime or hours-per-heater estimate is
        supported."
    - row_id: "accepted_installation"
      reason: "Range decision: the reference definition is exactly one accepted
        installation; configuration equivalence must be demonstrated rather than
        introducing a statistical yield interval."
    - row_id: "returned_heater"
      reason: "Range evidence need: real return records determine zero or positive
        count; no generic intact-return fraction is supported."
    - row_id: "usable_material_returns"
      reason: "Range evidence need: usable state, material and measured return records
        determine actual mass; no universal return/reuse fraction or automatic
        avoided-production credit is supported."
    - row_id: "packaging_waste"
      reason: "Range evidence need: weigh actual packaging for the chosen model; the
        manual gives no packaging mass or recycling fraction."
    - row_id: "drilling_debris"
      reason: "Range evidence need: hole/substrate and collection evidence must
        establish debris quantities; no generic concrete or gypsum mass is
        assumed."
    - row_id: "electrical_waste"
      reason: "Range evidence need: measured waste and failure records are required;
        no default defect or recovery rate is supported."
    - row_id: "airborne_drilling_release"
      reason: "Range evidence need: substrate, particle-size/species and capture
        evidence are unresolved until foreground characterization; a universal
        dust interval would misstate identity and exposure."
    - row_id: "initial_heat_release"
      reason: "Range evidence need: neither substance nor quantity is specified by the
        manual; no generic VOC, arbitrary mass range or zero may replace the
        missing evidence."
