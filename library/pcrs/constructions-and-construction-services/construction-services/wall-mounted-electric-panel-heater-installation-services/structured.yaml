  how_much: "One accepted installation of one declared appliance"
  how_well: "Matched H-frame secured to declared substrate; correct orientation, retention and model clearances; suitable isolated supply and protective earth; actual recorded electrical and functional heat-test acceptance; controls initialized; signed handover"
