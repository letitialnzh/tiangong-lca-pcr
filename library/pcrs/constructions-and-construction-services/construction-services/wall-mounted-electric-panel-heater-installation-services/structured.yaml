  []
measurement_rules:
  - id: reference_count
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Use one accepted installation of the same declared appliance configuration; failed or pending installations are excluded from the accepted denominator."
  - id: electricity_record
    applies_to: "site_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Record actual installation and commissioning electricity; nameplate W or kW is a rating and cannot substitute for consumed kWh."
  - id: component_measurement
    applies_to: "fixings_connections; packaging_waste; drilling_debris; electrical_waste"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Retain measured material-specific mass and calibrated weighing or traceable item-to-mass evidence; do not use whole appliance mass for added fixings."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: install_test_handover
    name: "Receive, wall mount, connect, test and hand over"
    inclusion: "required"
    inclusion_condition: "Defined first-installation route with accepted prepared interfaces"
    role: "Integrate appliance/H-frame with added fastening and connection roles; verify, rework within this node, or route rejected units to intact return or waste exit; accept only after test and signed handover"
    quantitative_reference: "1 item accepted installation"
process_inventory:
  - id: install_test_handover
    label: "Receive, wall mount, connect, test and hand over"
    inputs:
      product:
        - row_id: site_electricity
          role: "Installation tools and commissioning electricity"
          name: "Installation tools and commissioning electricity"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Include actual drilling, extraction, electrical testing, controls initialization and limited heat-test electricity attributable to this job. No household heating after handover is included. Range evidence need: measured tool and commissioning records are required; manufacturer rated power is neither consumed electricity nor a supported generic kWh interval."
          amount:
            expression: "Record metered or traceably submetered installation and heat-test electricity; separate heating-mode test interval and rework consumption. Do not multiply nameplate rating by an assumed test duration."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_resources
              source_ids:
                - dimplex-plxe-series-c-issue7
            ranges: []
        - row_id: installer_travel
          role: "Attributable installer travel service"
          name: "Attributable installer travel service"
          flow_type: "product"
          property_unit: "Number of persons*distance / person*km"
          description: "Conditional on installer travel incurred for this job. Retain mode, passengers, origin, destination and shared-visit allocation separately from material freight. Range evidence need: actual itinerary and shared-visit records must establish travel; do not infer a standard trip from the classification."
          amount:
            expression: "Record actual attributable passenger transport in person*km; shared visits need an explicit ownership and attribution record."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_transport
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_installation
          role: "Accepted Class I wall-mounted electric panel heater installation at tested handover"
          name: "Accepted Class I wall-mounted electric panel heater installation at tested handover"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "The only reference output is the installation of one identified Class I upright resistive panel convector on its matched secured H-frame, connected to existing suitable isolated fixed supply, with protective-earth/electrical verification, control setup and limited functional heat test completed. Record signed acceptance. Range decision: the reference definition is exactly one accepted installation; configuration equivalence must be demonstrated rather than introducing a statistical yield interval."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_acceptance
              source_ids:
                - dimplex-plxe-series-c-issue7
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: single_service
    applies_to: "accepted_installation"
    rule: "Attribute the installation-job inventory to accepted installations of the same configuration. There is no saleable heat co-product from the short test; do not credit incidental room warming."
    source_ids: []
  - rule_id: reject_burdens
    applies_to: "returned_heater; usable_material_returns; electrical_waste; install_test_handover"
    rule: "Retain corrective-work resources, failed commissioning and replacement handling attributable to the accepted job. Record intact supplier/material-return burden ownership and any supplier credit explicitly; no automatic avoided-production or recycling credit. Never count failed/pending units as accepted outputs."
    source_ids: []
  - rule_id: shared_visit
    applies_to: "material_transport; installer_travel; tool_access; site_electricity"
    rule: "Use job-resolved records first. If visits, meter periods or equipment are shared, identify all consumers, period and an evidenced physical driver; reconcile totals and count each burden once. Record material attribution uncertainty instead of applying an arbitrary equal split."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_components
      process_id: "install_test_handover"
      flow_role: "heater package and separately supplied component inputs"
      record_type: "receipt and issue reconciliation"
      raw_fields: "job_id; model; serial; package_BOM; substrate; fixing_schedule; issued_items; issued_mass; usable_return_exit_id; replacement_id; upstream_coverage"
      collection_method: "Inspect supplier package and approved instructions; reconcile gross issue records and separately weighed usable return exits; weigh separate material parts or retain traceable manufacturer part mass; distinguish prior supply interface; Aggregation procedure: per reference flow; sum gross actual job-owned component inputs; keep usable returned materials as separate exits without net subtraction or duplicated supplied bracket/lead"
      unit: "item; kg"
      frequency: "every receipt, issue and return"
      temporal_coverage: "complete installation job including corrections"
      site_scope: "identified site and job"
      aggregation_rule: "per reference flow"
      quality_evidence: "supplier BOM and delivery note; scale calibration; substrate/fixing record"
    - protocol_id: cp_resources
      process_id: "install_test_handover"
      flow_role: "site electricity and conditional tool access"
      record_type: "meter and equipment service log"
      raw_fields: "job_id; meter_id; start_reading; end_reading; test_start; test_end; test_mode; tool_id; access_hours; shared_consumers; attribution_driver; provider_coverage"
      collection_method: "Read traceable meters for job/test; separate other loads; log tool use and provider boundary; retain allocation evidence for shared periods; Aggregation procedure: per reference flow; aggregate attributable measured job electricity and provider-owned equipment hours once"
      unit: "kWh; h"
      frequency: "each tool/test event and corrective event"
      temporal_coverage: "arrival through signed handover"
      site_scope: "identified site, meter and equipment"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter accuracy; readings; test log; provider/service-boundary record"
    - protocol_id: cp_transport
      process_id: "install_test_handover"
      flow_role: "conditional freight and installer travel across declared shared job/visit periods"
      record_type: "dispatch and travel log"
      raw_fields: "job_id; movement_id; mode; origin; destination; distance; consignment_mass; passengers; shared_jobs; attribution_driver; upstream_delivery"
      collection_method: "Reconcile carrier notes and actual itineraries; distinguish material freight from personnel movement; retain shared-visit driver and empty-leg ownership; Aggregation procedure: per reference flow; sum attributable mode-specific services after checking upstream coverage"
      unit: "t*km; person*km"
      frequency: "each movement"
      temporal_coverage: "complete installation and corrective visits"
      site_scope: "actual route to identified site"
      aggregation_rule: "per reference flow"
      quality_evidence: "carrier note; route record; passenger/consignment log; allocation reconciliation"
    - protocol_id: cp_acceptance
      process_id: "install_test_handover"
      flow_role: "accepted reference output and job starting conditions"
      record_type: "inspection and signed test record"
      raw_fields: "job_id; model; serial; substrate; preprepared_holes; bracket; fixings; orientation; clearances; supply; isolation; earth_test; electrical_tests; heat_test; control_setup; acceptance; timestamp"
      collection_method: "Competent installer records applicable manufacturer and project acceptance criteria, interface readiness, electrical and functional test results and signed handover; unresolved failure is not accepted; Aggregation procedure: per reference flow; exactly one accepted installation"
      unit: "item"
      frequency: "each installation and retest"
      temporal_coverage: "complete job to acceptance"
      site_scope: "same model/configuration/site as inventory"
      aggregation_rule: "per reference flow"
      quality_evidence: "signed installation/test sheet; photographs; competent electrician record"
    - protocol_id: cp_exits
      process_id: "install_test_handover"
      flow_role: "intact appliance/material returns, packaging, drilling debris and electrical waste"
      record_type: "return and waste transfer record"
      raw_fields: "job_id; exit_id; serial_or_material; state; quantity; mass; recipient; treatment; upstream_coverage; rework_id"
      collection_method: "Separate intact product return from waste; weigh actual waste by material; link exit to receiver and producing job; reconcile captured debris and airborne release separately; Aggregation procedure: per reference flow; sum physical exits once with traced ownership; rework stays within node"
      unit: "item; kg"
      frequency: "every exit and correction"
      temporal_coverage: "complete job including returns"
      site_scope: "identified installation and receiving route"
      aggregation_rule: "per reference flow"
      quality_evidence: "return acceptance; calibrated mass evidence; waste transfer/receiver record"
    - protocol_id: cp_releases
      process_id: "install_test_handover"
      flow_role: "conditional drilling and initial heat-up air releases"
      record_type: "characterization and missing-data disclosure"
      raw_fields: "job_id; drilling_state; substrate; species; particle_basis; air_compartment; capture; test_interval; release_quantity; method; detection_limit; missing_characterization"
      collection_method: "For actual drilling obtain substance/particle and capture-specific evidence; for first heat-up seek defensible product-specific substance/quantity evidence; record uncertainty and missing coverage without inventing a VOC or zero; Aggregation procedure: per reference flow; aggregate characterized emissions by substance and compartment; retain unquantified potential releases as incomplete coverage"
      unit: "kg"
      frequency: "each drilling/initial heat-test scenario"
      temporal_coverage: "installation drilling and limited heat-test only"
      site_scope: "actual substrate/product and indoor receiving environment"
      aggregation_rule: "per reference flow"
      quality_evidence: "method validation; measurement report; detection limits; documented no-drilling condition; disclosure of gaps"
  calculation_rules:
    - id: job_normalization
      applies_to: "all inventory rows"
      rule: "Aggregate actual job-owned quantities per reference flow; use accepted service count of the same configuration for a multi-installation job, after recording resource attribution and failed/pending states. Do not merge different heater models as equivalent without evidence."
      inputs:
        - cp_components
        - cp_resources
        - cp_transport
        - cp_acceptance
        - cp_exits
        - cp_releases
      output: "inventory per reference flow"
      source_ids: []
    - id: receipt_exit_reconcile
      applies_to: "heater_package; returned_heater; electrical_waste"
      rule: "Reconcile physical appliance receipts, accepted installed serials, intact supplier returns, discarded units and remaining job stock; retain rework within the same job and prevent duplicate input/output treatment."
      inputs:
        - cp_components
        - cp_acceptance
        - cp_exits
      output: "serial-resolved appliance reconciliation"
      source_ids: []
  data_quality_requirements:
    - id: configuration
      applies_to: "all inventory rows"
      requirement: "Keep heater type, model, package coverage, wall substrate, fastening and supply conditions aligned; the manufacturer example is not a universal BOM."
      evidence: "cp_components; cp_acceptance; dimplex-plxe-series-c-issue7"
    - id: resource_coverage
      applies_to: "site_electricity; material_transport; installer_travel; tool_access"
      requirement: "Cover job and corrective events; separate installation and normal-use energy; disclose supplier gates and shared-event attribution."
      evidence: "cp_resources; cp_transport"
    - id: release_coverage
      applies_to: "airborne_drilling_release; initial_heat_release"
      requirement: "Unknown pollutant identity or amount remains a direct-emission completeness gap. Do not equate odour to a substance or claim zero without valid evidence."
      evidence: "cp_releases; dimplex-plxe-series-c-issue7"
    - id: acceptance_trace
      applies_to: "accepted_installation; returned_heater; electrical_waste"
      requirement: "Signed acceptance, reject path and quantities must reconcile; unaccepted jobs cannot silently disappear from resources or accepted denominator."
      evidence: "cp_acceptance; cp_exits"
validation_rules:
  - rule_id: boundary_check
    applies_to: "install_test_handover"
    rule: "Verify declared prepared wall and isolated supply; reject new circuit/heating-network or repair/replacement route from this category."
    source_ids: []
  - rule_id: mount_test_check
    applies_to: "accepted_installation"
    rule: "Require component, bracket retention, orientation, model clearance, protective-earth/electrical test, actual limited heat test, initialized controls and signed handover records. Manufacturer ratings are not measured consumption or achieved heating output."
    source_ids: []
  - rule_id: quantity_check
    applies_to: "all inventory rows"
    rule: "Reference output is 1 item; each quantity uses per reference flow basis and its own linked installation-node protocol. Check receipt, return, waste and job resource reconciliations and declared sharing."
    source_ids: []
  - rule_id: reject_route_check
    applies_to: "returned_heater; usable_material_returns; electrical_waste; install_test_handover"
    rule: "Trace failed/pending states to in-node corrective work, intact return, authorized waste exit or disclosed work in progress. Exclude unresolved rejects from accepted output and retain attributable burdens."
    source_ids: []
  - rule_id: release_check
    applies_to: "airborne_drilling_release; initial_heat_release"
    rule: "Check actual drilling state, emitted identity/particle basis and receiving medium; require valid commissioning substance evidence or mark direct emissions incomplete. No arbitrary zero or generic VOC identity is acceptable."
    source_ids: []
  - rule_id: identity_check
    applies_to: "all inventory rows"
    rule: "Resolve each actual exchange to a verified concrete flow, property and unit before final process publication. Conditional umbrella roles must split using actual records; semantically useful unresolved candidate cards do not prove final exchange coverage."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground installation-service inventory with supplied appliance and added-part upstream inputs; process and lifecyclemodel are downstream projections"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Specified first-installation service as a declared site or regional background work package; compatible construction modelling with explicit component ownership"
  excluded_use: "Bare appliance manufacturing; branch circuit works; hydronic/heat-pump installation; replacement/repair; lifetime building heat; untested installation or generic electrical product service"
  required_metadata: "Model/serial and rating; bracket and BOM coverage; wall/substrate/fixing/holes; supply/isolation/earth; test criteria/results/interval; controller setup; site/time/accepted count; incoming gates/logistics; reject routes; attribution"
  required_quality_disclosure: "Unresolved exchange/support identities; all Range evidence needs; missing first-heat emission characterization; drilling emissions evidence; measurement and shared-event uncertainties; upstream component and delivery coverage"
  update_trigger: "Change of model, package, wall/fixing/supply, acceptance or commissioning route, supplier gate, geography/electricity, reject route or newly available direct-release evidence"
data_sources:
  - id: "dimplex-plxe-series-c-issue7"
    type: "handbook"
    reference: "Glen Dimplex, PLXE Series C long manual, Issue 7, PDF pp. 3, 7-10. https://www.dimplex.co.uk/sites/g/files/emiian551/files/media_import/medias/docus/13/PLXE%20-%20Series%20C%20Long%20Manual%20-%20Issue%207%20%283%29.pdf"
    used_for: "Documented Class I earth/fixed supply route; H-frame and mounting/locking; model-dependent clearances; first-power setup; possible initial heat-up odour without pollutant identity or quantity"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:385eede40fb8d23913d1bfb8ef81f42b7853399d69090cc5cbf366e88ffd45bc"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_5740"
      family: "system_boundary"
      span:
        start:
          offset: 5740
          line: 58
          column: 1
        end:
          offset: 23055
          line: 290
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Existing accepted wall/substrate and suitably rated isolated fixed supply/connection point; packaged heater and additional components at their declared supply gates |\n| starting_condition_role | Prior site interfaces plus incoming product gates; wall and new circuit construction are not claimed by this installation record |\n| product_classification_scope | Only the defined narrower Class I resistive panel-heater installation service within heating-equipment installation |\n| recursive_input_rule | An input same-category subcontract installation service must replace its evidenced work package; either use that service or its disaggregated inventories, never both for the same physical work |\n| upstream_dataset_requirement | Match actual heater package, supplied bracket/lead, added parts, electricity, travel/freight and declared tool service; link waste to its receiving treatment with documented boundary ownership |\n| disclosure | Declare wall/supply readiness, drilling state, component/package and delivery coverage, regional electricity, tests and rejected-unit routes, tool/travel attribution and missing direct-release characterization |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| start_interfaces | install_test_handover | Reject scope if suitable wall or fixed supply is absent. Record interface evidence; do not hide new circuit, wall strengthening or predrilling work as zero. | `dimplex-plxe-series-c-issue7` |\n| mount_connect | install_test_handover | Include actual heater package and separate added fastening/connection roles; use matched bracket, orientation, clearances, hook engagement and locks, competent fixed connection and protective earth for the documented Class I route. | `dimplex-plxe-series-c-issue7` |\n| commissioning_gate | install_test_handover | Include installation electricity, control initialization, electrical verification, limited heat test and corrective work before signed acceptance; exclude routine heating after handover. Record actual pass criteria and results, not a claimed lifetime heating performance. |  |\n| direct_releases | airborne_drilling_release; initial_heat_release | Include characterized releases from actual drilling and first heat-up. Possible odour requires disclosure and characterization; unknown emissions are incomplete coverage, not a zero or a generic VOC. |  |\n| logistics_tools | material_transport; installer_travel; tool_access | Include attributable delivery, installer visits and reusable equipment service when incurred and owned by this boundary; disclose upstream inclusion, visit sharing and provider coverage to prevent duplication. |  |\n| `system_boundary_rule_6` | foreground_system_boundary | Shared infrastructure disclosure: when visits, meter periods or reusable tool services cross job periods, record the shared asset/service id, this installation node and every other consuming job, the common period and the evidenced attribution driver. The provider owns equipment life-cycle inventory; this node records attributable access service. No tool lifetime is invented. Reconcile all job shares to the single shared total. |  |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Packaged Class I resistive panel convector with matched H-frame and fitted supply lead (`heater_package`)\n\nProcess / prospective direction / type: `install_test_handover` / `inputs` / `product`.\n\nRecord every Class I appliance entering this job, including its manufacturer-matched bracket and supplied lead. A bracket already included in the supplier package is not a second upstream appliance input. Identify model, rating, serial number, supplied components and receipt state.\n\n- Collection subject: Packaged Class I resistive panel convector with matched H-frame and fitted supply lead\n- Flow property / unit: Number of items / item\n- Amount rule: Count appliances issued to the installation, including replacements; reconcile accepted unit, intact supplier returns and discarded units.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_components`\n- Sources: `dimplex-plxe-series-c-issue7`\n\nRange evidence need: supplier receipt and reject records must establish appliances consumed per accepted installation; the manual does not establish a generic replacement rate.\n\n#### Collection requirement: Substrate-compatible fixing and fixed-connection components (`fixings_connections`)\n\nProcess / prospective direction / type: `install_test_handover` / `inputs` / `product`.\n\nRecord actual separately supplied screws, anchors, connection terminals, connector boxes or other permitted connection consumables. Split the conditional umbrella into actual materials and identities; do not invent a universal kit. Existing fused spur and fixed wiring are declared prior interfaces.\n\n- Collection subject: Substrate-compatible fixing and fixed-connection components\n- Flow property / unit: Mass / kg\n- Amount rule: Record gross separately supplied components issued by material and part, with traceable item-to-mass records where needed. Usable surplus returned from the job is a separate product exit; do not also subtract it from this gross input.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_components`\n- Sources: `dimplex-plxe-series-c-issue7`\n\nRange evidence need: actual substrate and supplier-approved fastening/connection schedule determine quantities; four bracket holes in this example do not determine every model BOM.\n\n#### Collection requirement: Attributable appliance and component freight (`material_transport`)\n\nProcess / prospective direction / type: `install_test_handover` / `inputs` / `product`.\n\nConditional on delivery or movement owned by this service boundary. Identify actual carrier, mode, loaded mass, distance, legs and supplier-gate coverage; avoid adding delivery already in upstream datasets.\n\n- Collection subject: Attributable appliance and component freight\n- Flow property / unit: Mass*distance / t*km\n- Amount rule: Record attributable freight service from actual consignment mass and route records in t*km, retaining empty-leg treatment and upstream-delivery coverage.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_transport`\n\nRange evidence need: job route, mass and carrier records are required; no representative mileage or load factor is imposed.\n\n#### Collection requirement: Attributable reusable installation and test equipment access (`tool_access`)\n\nProcess / prospective direction / type: `install_test_handover` / `inputs` / `product`.\n\nConditional on reusable drill, extraction, lifting or electrical-test equipment whose service burden is included. Identify tool/provider and service boundary; consumables already included in the provider dataset are not duplicated.\n\n- Collection subject: Attributable reusable installation and test equipment access\n- Flow property / unit: Duration / h\n- Amount rule: Record attributable operating/access hours and documented provider or study capital-service attribution; a purchased tool is not entirely consumed in one installation.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_resources`\n\nRange evidence need: actual tools and operating records determine access duration; no universal lifetime or hours-per-heater estimate is supported.\n\n#### Collection requirement: Intact uninstalled or rejected heater returned to supplier (`returned_heater`)\n\nProcess / prospective direction / type: `install_test_handover` / `outputs` / `product`.\n\nConditional intact return with retained product status, traceable serial number, reason and recipient. Failed units held pending repair are not accepted installations; in-job corrective work remains in this process.\n\n- Collection subject: Intact uninstalled or rejected heater returned to supplier\n- Flow property / unit: Number of items / item\n- Amount rule: Count intact appliances leaving to supplier, retaining their issue/return ids, transport ownership and burden disposition; do not count the same unit as discarded waste.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_exits`\n\nRange evidence need: real return records determine zero or positive count; no generic intact-return fraction is supported.\n\n#### Collection requirement: Intact reusable packaging and usable component surplus returned from the job (`usable_material_returns`)\n\nProcess / prospective direction / type: `install_test_handover` / `outputs` / `product`.\n\nConditional product exit for intact reusable packaging or unused suitable fixing/connection parts returned to supplier or controlled stock. Split by actual material, usable state and recipient. This is neither heater appliance count nor waste.\n\n- Collection subject: Intact reusable packaging and usable component surplus returned from the job\n- Flow property / unit: Mass / kg\n- Amount rule: Weigh actual usable product returns by material and exit id; reconcile with gross issued component inputs or incoming packaging coverage. Do not both subtract returns from inputs and record the same product exit; declare credits or retained ownership separately.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_exits`\n\nRange evidence need: usable state, material and measured return records determine actual mass; no universal return/reuse fraction or automatic avoided-production credit is supported.\n\n#### Collection requirement: Separated installation packaging and protective-film waste (`packaging_waste`)\n\nProcess / prospective direction / type: `install_test_handover` / `outputs` / `waste`.\n\nRecord packaging and removed protective film by actual material and licensed or project-approved destination. Intact reusable packages crossing back to supplier or stock leave by usable_material_returns and are excluded from waste.\n\n- Collection subject: Separated installation packaging and protective-film waste\n- Flow property / unit: Mass / kg\n- Amount rule: Weigh separated waste by material and dispatch; distinguish reused/returned packaging with records and reconcile supplied packaging coverage.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_exits`\n- Sources: `dimplex-plxe-series-c-issue7`\n\nRange evidence need: weigh actual packaging for the chosen model; the manual gives no packaging mass or recycling fraction.\n\n#### Collection requirement: Captured wall drilling debris and spent installation consumables (`drilling_debris`)\n\nProcess / prospective direction / type: `install_test_handover` / `outputs` / `waste`.\n\nConditional on actual new fixing holes or consumable losses. Record wall substrate, captured fraction, extraction method and waste destination; verified preprepared holes may make drilling absent.\n\n- Collection subject: Captured wall drilling debris and spent installation consumables\n- Flow property / unit: Mass / kg\n- Amount rule: Weigh or use validated collection records for captured substrate debris and separately identify discarded consumables; exclude airborne release quantities recorded on their own row.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_exits`\n\nRange evidence need: hole/substrate and collection evidence must establish debris quantities; no generic concrete or gypsum mass is assumed.\n\n#### Collection requirement: Discarded heater or electrical component waste (`electrical_waste`)\n\nProcess / prospective direction / type: `install_test_handover` / `outputs` / `waste`.\n\nConditional damaged or unrepairable appliances/components sent to an authorized electrical-waste route. Intact supplier returns remain product flows; waste must not be relabelled as an installed output.\n\n- Collection subject: Discarded heater or electrical component waste\n- Flow property / unit: Mass / kg\n- Amount rule: Weigh discarded units/components and link serial or part ids to receiving treatment, retaining failed-installation and replacement burdens.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_exits`\n\nRange evidence need: measured waste and failure records are required; no default defect or recovery rate is supported.\n\n#### Collection requirement: Substrate-specific airborne drilling release to workplace air (`airborne_drilling_release`)\n\nProcess / prospective direction / type: `install_test_handover` / `outputs` / `elementary`.\n\nConditional on drilling. The actual substrate, emitted substance or particle-size basis, receiving-air compartment, extraction and capture efficiency must be established before creating concrete elementary exchanges. Captured solid debris remains waste.\n\n- Collection subject: Substrate-specific airborne drilling release to workplace air\n- Flow property / unit: Mass / kg\n- Amount rule: Require measured or validated substrate-specific emissions for the actual drilling operation and controls; verified no-drilling records support absence, whereas unmeasured drilling does not support a zero emission.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_releases`\n\nRange evidence need: substrate, particle-size/species and capture evidence are unresolved until foreground characterization; a universal dust interval would misstate identity and exposure.\n\n#### Collection requirement: Substance-specific initial heat-up release to indoor air (`initial_heat_release`)\n\nProcess / prospective direction / type: `install_test_handover` / `outputs` / `elementary`.\n\nThe manufacturer reports possible initial heat-up odour but identifies no chemical substance, emission factor or quantity. Retain the potential commissioning release as a characterization requirement; odour alone is not a VOC identity or proof of zero release.\n\n- Collection subject: Substance-specific initial heat-up release to indoor air\n- Flow property / unit: Mass / kg\n- Amount rule: Characterize actual substance/species and receiving medium with measured or defensible product-specific commissioning evidence before quantification; disclose missing characterization as incomplete direct-emission coverage.\n- Value mode: `foreground_record`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `collected_record`\n- Collection protocol: `cp_releases`\n- Sources: `dimplex-plxe-series-c-issue7`\n\nRange evidence need: neither substance nor quantity is specified by the manual; no generic VOC, arbitrary mass range or zero may replace the missing evidence.\n\n"
