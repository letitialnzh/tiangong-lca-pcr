  data_quality_requirements:
    - id: identity_scope
      applies_to: "all inventory rows"
      requirement: "Resolve each actual concrete exchange and support property/group/unit before final TIDAS projection; semantic umbrellas do not imply search or verification."
      evidence: "Exact detail/support evidence and actual foreground identities"
    - id: acceptance_completeness
      applies_to: "accepted_element_replacement"
      requirement: "Every counted ID has applicable retained-interface, element, lifting/installation, tightening/alignment/chain, follow-up/test and signed closure evidence; no inferred universal life or performance."
      evidence: "Actual project approved instructions, factory certificate and signed repair dossier"
    - id: ledger_complete
      applies_to: "all inventory rows"
      requirement: "All periods, attempts, stocks, supplies, final destinations, native-unit count discard/return and upstream carries reconcile with one owner."
      evidence: "Receipt/stock/activity/custody ledgers and quantitative checks"
    - id: asset_complete
      applies_to: "shared_asset_service;provider_service;transport_service"
      requirement: "Complete relevant life and consumer denominator or genuine bounded completed provider coverage; uncertain future phase has source/sensitivity/update; no resource overlap."
      evidence: "Asset history/projection, provider coverage and ownership matrix"
    - id: release_evidence
      applies_to: "routine_substance_release;incident_substance_release"
      requirement: "Actual species/particle class and medium with valid quantity evidence; whole-fluid/subspecies views nonadditive and no residual-as-emission."
      evidence: "Measurement or valid factor/composition/fate method and event ledger"
    - id: temporal_quality
      applies_to: "all inventory rows"
      requirement: "Cover actual preparation through follow-up release and asset phases; disclose geography, technology, dates, uncertainty, missing records and update triggers."
      evidence: "Dated complete source records and actual absence evidence"
validation_rules:
  - rule_id: scope_gate
    applies_to: "foreground_dataset_conformance"
    rule: "Reject outside technology/mounting or new quay/anchor/frame construction; retained defects or missing approved repair decision block this product."
    source_ids:
      - trelleborg-scn-sck-2018
      - trelleborg-fender-systems-2019
  - rule_id: installation_gate
    applies_to: "foreground_dataset_conformance"
    rule: "Check actual cone factory/configuration and retained compatibility, engineered support/handling, actual fastener/seating/sequence/torque results, symmetric orientation and chain adjustment, and all actually required retorque/test results before signed bounded release. Reverse-mount follow-up and future temperate-climate inspection intervals are not universal current gates."
    source_ids:
      - trelleborg-fender-systems-2019
      - trelleborg-scn-sck-2018
  - rule_id: accepted_only
    applies_to: "foreground_dataset_conformance"
    rule: "N must be positive unique final accepted IDs, each counted once. Unresolved rejects/rework states remain unaccepted; retain all associated burdens and actual exit/loop records."
    source_ids: []
  - rule_id: stocks_native
    applies_to: "foreground_dataset_conformance"
    rule: "Check gross/consumed choice, tare, opening/closing carry, native SKU count installed/returned/discarded fields and actual material/fluid destinations; no duplicate used activity, spill recovery subtraction or inferred count from mixed waste kg."
    source_ids: []
  - rule_id: shared_periods
    applies_to: "foreground_dataset_conformance"
    rule: "Require every consumer/period and complete shared manufacture/maintenance/replacement/EOL denominator or genuine provider scope. Missing termination/remaining-life evidence or overlaps block final dataset; do not silently annualise."
    source_ids: []
  - rule_id: actual_exchanges
    applies_to: "foreground_dataset_conformance"
    rule: "Before final dataset construction verify each concrete flow UUID and exact support/unit; keep unknown identities explicit. Check species/medium/quantity evidence and whole-fluid nonadditivity. Automated target pass does not verify a concrete exchange or establish publication readiness."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground-data production methodology for a bounded completed element-replacement repair service"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projections"
  allowed_use: "Actual declared standard-mount SCN element replacement with qualified retained interfaces and complete job evidence; compare only declared compatible configurations/boundaries"
  excluded_use: "Whole harbour or full fender system, new frames/anchors, other technology/mounting, vulcanisation repair, future berthing performance or lifetime/outage avoidance claims"
  required_metadata: "PCR/version; berth/position and accepted IDs; actual cone/configuration and retained interfaces; provider/resource boundaries; periods; measurement/ledger methods; upstream datasets; actual acceptance gate/results; destinations and shared-asset life/consumers"
  required_quality_disclosure: "All missing evidence/identities, uncertainty, representativeness, stocks/rework, conversion and species methods, complete-life prospective assumptions/sensitivity and overlap controls"
  update_trigger: "Changed approved cone/interface/route/gate, material/provider/unit, destination, shared denominator/life evidence, source applicability or resolved identity gap"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "United Nations, CPC Version 3.0 explanatory notes, 30 June 2025, printed p285; https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf"
    used_for: "54232 harbour/quay repair context only; does not create canonical product identity"
  - id: "trelleborg-scn-sck-2018"
    type: "handbook"
    reference: "Trelleborg, Super Cone (SCN) and Cell (SCK) fender handling/storage/installation/maintenance manual, footer MN-I&M-RUB-SCN&SCK-v1.0-EN2018, printed pp9–10,18–21; https://www.trelleborg.com/marine-and-infrastructure/-/media/marine-systems/resources/guides-and-design-manual/downloads/scn-sck_hsim.pdf?rev=f45ab129397b4f5bb202d0a78dea029d"
    used_for: "Protected handling, interconnected interfaces, actual damage assessment, cleaning and potential full rubber-element replacement; SCK/vulcanisation and future interval tables excluded"
  - id: "trelleborg-fender-systems-2019"
    type: "handbook"
    reference: "Trelleborg, Fender Systems handling/storage/installation/maintenance manual, 2019, printed pp14–22; https://www.trelleborg.com/marine-and-infrastructure/-/media/marine-systems/resources/guides-and-design-manual/downloads/fender_systems_hsim_2019.pdf?rev=152f8df1a47a4a3eb360ba42e548e3d7"
    used_for: "Standard-mount handling/support, actual weights/CG, component/anchor interfaces, fastening/sequence, chain/alignment and job-caused coating remedy; actual current approved project criteria control"
