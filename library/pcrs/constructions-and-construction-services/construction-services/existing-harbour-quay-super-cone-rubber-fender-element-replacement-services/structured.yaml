allocation_rules:
  - rule_id: accepted_denominator
    applies_to: "foreground_burden_allocation"
    rule: "Use actual positive N unique finally accepted position-replacement IDs for the bounded campaign. Assign all attributable attempts, rejects, failed handling, repeat checks, follow-up and rework to those IDs; do not discard burdens or count repeated attempts as additional products."
    source_ids: []
  - rule_id: ledger_method
    applies_to: "foreground_burden_allocation"
    rule: "For each component/formulation/fuel scope, choose consumed-only input or gross-with-outlets once. Gross means net of tare before return netting. Carry opening-stock upstream burden; closing stock stays in custody with its burden, not an outward flow. Internal issue/recovery does not create a second external receipt. Supply attribution explicitly starts from opening carried stock + new external gross receipts - closing carried stock, in the same SKU/unit with the corresponding upstream burden carried. Gross-with-outlets retains actual outward exits; consumed-only excludes the corresponding outward returned supply once. Installed/retained final destinations, discarded quantities, outward returns and closing stock are disjoint; intermediary used/dosed activity is nonadditive. Consumed-only fuel supply excludes only matched outward returned usable supply; nonburned waste and uncontained loss remain upstream-burden-bearing. The burned-fuel balance separately determines combustion activity."
    source_ids: []
  - rule_id: components_balance
    applies_to: "foreground_burden_allocation"
    rule: "Count ledgers reconcile opening + gross receipt = closing + final installed + returned + actual discarded + other documented count destinations, all mutually exclusive. Final installed excludes waste/release/returns; use recorded discarded counts, never infer them from mixed-waste mass. Mass ledgers reconcile material-specific final destinations in the same way; intermediary used/dosed activity is nonadditive."
    source_ids: []
  - rule_id: fuel_balance
    applies_to: "foreground_burden_allocation"
    rule: "Burned fuel = opening + gross receipt - closing - outward usable return - final nonburned waste - final uncontained whole-fluid loss - other documented nonburned exits, within one unit/scope. Recovered spill is allocated once to return/waste/closing stock; total spill is audit-only. Retained recovered spill is already in closing stock and is not subtracted again."
    source_ids: []
  - rule_id: reject_paths
    applies_to: "foreground_burden_allocation"
    rule: "A damaged or incompatible new cone/fastener remains in this node for actual correction only where approved, or exits by recorded usable return, external recovery or waste. Old removed element and rejects are never accepted replacement service outputs. No vulcanisation repair loop is covered."
    source_ids:
      - trelleborg-scn-sck-2018
  - rule_id: shared_full_life
    applies_to: "foreground_burden_allocation"
    rule: "For each shared asset/service identify all consuming jobs/nodes/periods, compatible measured driver and complete-life denominator; job share = job driver / all-consumer complete-life driver. Trace manufacture, maintenance, replacement and end-of-life. Use observed complete life or history plus justified remaining-life events with source, uncertainty, sensitivity and update plan. Missing denominator/coverage blocks final dataset, with no default life. Exclude direct-operation/spares/provider overlaps."
    source_ids: []
  - rule_id: period_events
    applies_to: "foreground_burden_allocation"
    rule: "Enumerate preparation, removal/install, repeated work, follow-up and release periods, and shared-asset acquisition, maintenance/replacement and termination/EOL phases. Link every input/event/output by ID and period; carry stocks once between periods. Attribute each event once to actual consumers, without assigning a generic future fender life."
    source_ids: []
  - rule_id: provider_and_cooutput
    applies_to: "foreground_burden_allocation"
    rule: "Do not allocate by price alone. A genuine bounded provider service uses its verified native reference unit and completed coverage; each direct resource has one owner. Waste and supplier returns are physical exits with declared upstream/treatment handling, not automatic coproduct credits. Any actual sale/recovery requiring another method is disclosed and reviewed before final dataset."
    source_ids: []
