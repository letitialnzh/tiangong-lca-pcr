    - rule_id: baseline_and_outlets
      applies_to: "retained parent and exits"
      rule: "Retained house and old foundation are not new material purchases. Record actual removed historic materials and their destinations without negative new-purchase quantities. Reusable returned job supplies and stock carry must be distinguished from removed old assets. No avoided-new-house, avoided-flood or recycling credit is assumed."
      source_ids:
