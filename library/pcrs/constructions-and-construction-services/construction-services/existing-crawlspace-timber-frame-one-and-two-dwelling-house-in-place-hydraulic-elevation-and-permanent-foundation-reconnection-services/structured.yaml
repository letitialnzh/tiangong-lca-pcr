        - fema-house-elevation-1997
    - rule_id: temporary_and_damage
      applies_to: "all work phases"
      rule: "Own disconnect/lifting preparation, beams/jacks/cribbing and other temporary support, temporary stairs/utilities if used, equipment mobilization, curing/testing, actual removed foundation/debris and actual damage repair. Demobilization does not erase these burdens."
