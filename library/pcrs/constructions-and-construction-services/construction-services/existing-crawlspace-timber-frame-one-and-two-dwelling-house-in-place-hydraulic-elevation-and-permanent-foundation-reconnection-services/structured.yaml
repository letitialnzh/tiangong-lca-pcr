      raw_fields: "site_id; job_id; house_id; campaign_id; batch_id; event_id; phase_id; period_id; record_id; owner; provider_id; leg_id; cargo_id; cargo_kg; distance_km; mass_unit; distance_unit; empty_return; load_share; vehicle_route; provider_coverage; transfer_id; native_amount; native_unit; conversion_factor; conversion_factor_unit; conversion_source; sku; material_state; density; density_unit; moisture; moisture_basis; temperature; temperature_unit"
