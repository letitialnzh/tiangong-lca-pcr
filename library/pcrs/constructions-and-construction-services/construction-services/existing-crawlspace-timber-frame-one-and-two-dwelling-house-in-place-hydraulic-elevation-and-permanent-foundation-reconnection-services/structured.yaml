    label: "Retained house elevation and permanent reconnection"
    inputs:
      product:
        - row_id: water_supply
          role: "Construction curing testing and temporary utility water supplied"
          name: "Construction curing testing and temporary utility water supplied"
          flow_type: "product"
          property_unit: "Volume / m3"
          description: "Meter or trace actual purchased water for foundation curing, utility tests and temporary site/house supply attributable to the job. Distinguish product supply from direct environmental abstraction if actually present. Range evidence need: Collect meter resolution/calibration, actual curing/test/temporary-use intervals, retained/circulated water and each measured wastewater/environmental fate; any observed bounds use the same supply boundary and unit. No assumed water consumption or supply-to-discharge ratio."
          amount:
            expression: "Attributed supplied water / N; trace supply, internal circulation and discharge separately."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_water
              source_ids: []
            ranges: []
