    - rule_id: period_boundary
      applies_to: "all work and asset lifecycle phases"
      rule: "The reporting campaign explicitly indexes preparation/disconnect, lift/support, foundation/curing, lowering/anchorage, access/utility restoration and acceptance phases, including their actual reporting periods. Each resource, stock carry, failure, repair, replacement and termination event links to its actual phase/period and one owner; the accepted output links to final acceptance. Cross-period carry is transferred once, not repurchased. Shared asset lifecycle phases span manufacture, all job uses, maintenance, replacement and end of life without an invented calendar lifetime."
