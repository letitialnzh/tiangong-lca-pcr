      raw_fields: "site_id; job_id; house_id; campaign_id; batch_id; event_id; phase_id; period_id; record_id; owner; provider_id; meter_id; supplier_mix; import_start; import_end; export_start; export_end; distribution_losses; allocation_driver; allocation_unit; coverage; native_amount; native_unit; conversion_factor; conversion_factor_unit; conversion_source; sku; material_state; density; density_unit; moisture; moisture_basis; temperature; temperature_unit"
      collection_method: "Read gross import/export meters and temporary utility shares, identify provider resource coverage and actual energy unit support Aggregation detail: Gross owned imports / N; exports/losses/onsite generation disclosed separately without automatic credit"
      unit: "kWh"
      frequency: "each phase meter interval"
      temporal_coverage: "all owned preparation through final closure and stock boundaries"
      site_scope: "declared project site and attributable provider locations"
      aggregation_rule: "per reference flow"
