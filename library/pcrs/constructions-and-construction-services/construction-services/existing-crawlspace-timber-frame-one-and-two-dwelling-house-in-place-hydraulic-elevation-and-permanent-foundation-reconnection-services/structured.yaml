boundary_abstraction:
  declared_starting_condition: "Named retained assessed timber-frame house on crawlspace, prior foundation/utilities/access condition and actual engineered permitted plan"
  starting_condition_role: "Retained parent and historical baseline; no purchase of a new house"
  product_classification_scope: "Integrated completed in-place house alteration service, narrower than CPC 3.0 54111"
  recursive_input_rule: "Bounded subcontracted tasks may enter once with actual completed physical result and native units; an upstream service matching this same whole accepted intervention cannot recursively replace an unrecorded foreground job"
  upstream_dataset_requirement: "Traceable supplier/material/service datasets at actual native units, technology, geography and gate with declared full upstream scope; resolve final exchange UUIDs before final data production"
  disclosure: "Retained/removed baseline; project design and applicable law/date; occupancy/temporary utilities; all contributors, stocks, provider boundaries, repair and exit fates; actual acceptance gate"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted in-place elevation and permanent foundation reconnection of retained timber-frame house"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - house_id
    - dwelling_count
    - timber_frame_condition
    - original_crawlspace
    - structural_assessment
    - site_id
    - jurisdiction
    - permit_id
    - flood_datum
    - required_elevation
    - surveyed_final_elevation
    - foundation_design
    - anchorage_inspection
    - permanent_access
    - utility_reconnection_tests
    - defect_closure
    - acceptance_date
    - reporting_period
reference_flows:
  []
measurement_rules:
  - id: count_reference
    applies_to: "accepted_elevation"
    required_property_ref:
      name: "Count"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "N > 0 unique accepted physical house IDs; one two-dwelling house counts once. All rows use per reference flow; aggregate job quantities once then divide by N."
  - id: native_units
    applies_to: "material and usable-return rows"
    required_property_ref:
      name: "Actual native property"
      uuid: ""
    required_unit: "Actual supplied unit"
    rule: "Preserve Count, Area, Length, Volume and Mass by SKU. Supply and matched usable return share unit and state. Do not force all supplies to Mass. Whole supplied packages exclude repurchase of their included constituents."
  - id: conversion_state
    applies_to: "any converted row"
    required_property_ref:
      name: "Actual compatible property"
      uuid: ""
    required_unit: "Actual target unit"
    rule: "Retain native amount/unit and conversion factor/unit/source; for density conversions collect actual SKU, delivered/installed state, density and density_unit, moisture/basis, temperature and temperature_unit. Wet mass, dry solids, loose delivered volume and installed compacted volume are nonadditive views."
  - id: fuel_energy
    applies_to: "fuel and electricity"
    required_property_ref:
      name: "Actual fuel Volume or Mass; actual electricity Energy"
      uuid: ""
    required_unit: "m3 or kg; kWh"
    rule: "Upstream fuel supply differs from actual burned fuel used for species calculations. Electricity uses gross metered supply and export/temporary distribution losses with ownership; no price, hours, NCV/GCV or item substitute for Energy."
  - id: freight_work
    applies_to: "freight"
    required_property_ref:
      name: "mass*distance"
      uuid: "118f2a40-50ec-457c-aa60-9bc6b6af9931"
    required_unit: "kg*km"
    rule: "Use actual carried mass in kg times actual loaded distance in km per leg, identify empty returns and upstream coverage; never multiply house count by distance as freight mass."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: house_elevation
    name: "Retained house elevation and permanent reconnection"
    inclusion: "required"
    inclusion_condition: "Qualified retained timber-frame crawlspace house; approved project-specific design"
    role: "Integrated disconnection, lift/support, foundation, anchorage, access, utilities and final acceptance"
    quantitative_reference: "1 item accepted service"
process_inventory:
