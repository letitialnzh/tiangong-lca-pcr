      raw_fields: "site_id; job_id; house_id; campaign_id; batch_id; event_id; phase_id; period_id; record_id; owner; provider_id; asset_id; consumer_job_node_period_ids; job_driver; driver_unit; observed_life_driver; observed_history_driver; evidenced_remaining_driver; lifetime_driver; driver_source; manufacture_inventory; maintenance_inventory; replacement_inventory; eol_inventory; termination_evidence; uncertainty; sensitivity; update_trigger; representation; native_amount; native_unit; conversion_factor; conversion_factor_unit; conversion_source; sku; material_state; density; density_unit; moisture; moisture_basis; temperature; temperature_unit"
      collection_method: "Match job driver to complete lifecycle driver over all consumers and same unit. Observe entire life or substantiate remaining use, replacements, termination/EOL; cover rental and provider assets Aggregation detail: Choose equivalent asset or lifecycle-complete per-driver service; aggregate once per reference flow"
      unit: "actual asset unit or compatible service driver unit"
      frequency: "each asset use and lifecycle update"
      temporal_coverage: "all consumers/jobs/nodes/periods over complete manufacture/use/maintenance/replacement/EOL lifecycle including evidenced remaining life"
