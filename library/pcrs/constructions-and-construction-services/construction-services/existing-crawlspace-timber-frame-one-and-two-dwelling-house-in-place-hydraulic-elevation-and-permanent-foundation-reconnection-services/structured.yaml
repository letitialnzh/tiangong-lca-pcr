    - rule_id: integrated_gate
      applies_to: "whole service"
      rule: "Own foundation concrete/grout/fill/reinforcement, anchors/connectors, access components and pipe/cable/fittings as required by actual plans. Couple them with retained structure at inspected permanent anchorage, surveyed elevation, safe stairs/landing, restored tested utilities and signed defect-closed acceptance."
