          role: "Gross purchased electricity for lifting construction testing and temporary utilities"
          name: "Purchased electricity"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Actual supplier/mix, gross meters/submeters and included temporary dwelling/site distribution losses; record any exports separately and reconcile resource ownership with providers. Range evidence need: Collect actual gross-import/export meter intervals, supplier/mix, temporary distribution losses and provider attribution uncertainty. Keep Energy support and unit compatibility explicit; no generic electricity per house or net export credit."
          amount:
            expression: "Gross attributable electricity imports / N; no automatic export net credit."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
