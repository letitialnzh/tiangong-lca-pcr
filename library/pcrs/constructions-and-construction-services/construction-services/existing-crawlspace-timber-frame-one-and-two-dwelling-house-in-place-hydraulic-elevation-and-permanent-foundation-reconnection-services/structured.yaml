    - protocol_id: cp_providers
      process_id: "house_elevation"
      flow_role: "completed bounded service results"
      record_type: "provider physical record"
      raw_fields: "site_id; job_id; house_id; campaign_id; batch_id; event_id; phase_id; period_id; record_id; owner; provider_id; completed_result; result_quantity; result_property; result_unit; acceptance_record; included_resources; excluded_resources; upstream_scope; dataset_gate; coverage_gap; native_amount; native_unit; conversion_factor; conversion_factor_unit; conversion_source; sku; material_state; density; density_unit; moisture; moisture_basis; temperature; temperature_unit"
      collection_method: "Verify physical completed result and upstream native-unit coverage; reconcile direct versus provider owned fuel materials assets transport tests and temporary utilities Aggregation detail: Each physically distinct completed bounded service / N once; missing coverage blocks final data"
      unit: "actual service native unit"
      frequency: "every service and coverage revision"
      temporal_coverage: "all owned preparation through final closure and stock boundaries"
      site_scope: "declared project site and attributable provider locations"
      aggregation_rule: "per reference flow"
