      raw_fields: "site_id; job_id; house_id; campaign_id; batch_id; event_id; phase_id; period_id; record_id; owner; provider_id; origin_historic_or_new; material_identity; rejected_state; rework_event_id; recovery_disposal_route; destination; wet_mass; dry_mass_view; moisture; moisture_basis; ticket_id; native_amount; native_unit; conversion_factor; conversion_factor_unit; conversion_source; sku; material_state; density; density_unit; temperature; temperature_unit; reusable_product_identity; reusable_state; usable_native_quantity; usable_native_unit; receiving_party; transfer_id"
      collection_method: "Trace every removed/rejected state to repair at house_elevation, recovery or disposal; weigh actual destination exits; separate temporary asset return from waste Aggregation detail: Each actual origin/destination mass / N; no rejected work in accepted N"
