        - row_id: accepted_elevation
          role: "Accepted in-place elevation and permanent foundation reconnection of retained timber-frame house"
          name: "Accepted in-place elevation and permanent foundation reconnection of retained timber-frame house"
          flow_type: "product"
          property_unit: "Count / item"
          description: "The completed integrated intervention on one retained qualified house at permanent foundation anchorage, surveyed elevation, permanent access and restored tested utilities with closed defects and signed owner/required authority handover. Range evidence need: The accepted output is exactly 1 item by normalization. Evidence is N unique physical house IDs with full surveyed permanent foundation/access/utility acceptance; do not seek an empirical range around one service or treat unfinished attempts as yield."
          amount:
            expression: "1 item"
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_acceptance
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: single_service
    applies_to: "accepted output and rejects"
    rule: "One physical retained house at the integrated gate is one service. No co-product is inferred from dwellings, temporary elevation, salvage or avoided flood damage. Retain preparation, failures, retests and nonreturned waste in numerator; failed/off-spec work loops to the producing house_elevation node or actual exit and cannot enter N."
    source_ids: []
  - rule_id: stock_balance
    applies_to: "materials fuel and usable returns"
    rule: "S = attributed_opening + external_net_receipts - carried_closing, with receipts corrected by measured gross/tare. Internal issue or installed activity is not a new purchase. Declare gross-with-outlets S OR consumed-only S minus matched usable outward return once. Keep all nonreturned waste/loss upstream; no extra return credit and no subtraction of historic removed assets."
    source_ids: []
  - rule_id: asset_lifecycle
    applies_to: "shared assets and providers"
    rule: "Choose one compatible representation on shared_assets. Lifetime_driver covers ALL consumers/jobs/nodes/periods; use observed completed life OR observed history plus evidenced remaining use, replacements, termination and EOL. Record sources, uncertainty, sensitivity and update trigger. Full manufacture/maintenance/replacement/EOL inventory follows the same denominator; job hours cannot be divided by price or asserted lifetime. Do not combine equivalent-asset and per-driver-service views or divide by N twice."
    source_ids: []
  - rule_id: period_attribution
    applies_to: "all phases and assets"
    rule: "Enumerate actual phase/period boundaries and event IDs; link resources, assets, stock carry, replacements and final output once. Preserve period-specific numerator ownership and carry transfers; reconcile lifecycle history and evidenced remainder/termination/EOL. Missing future-life or termination evidence blocks final asset attribution; update after new evidence with no double attribution."
    source_ids: []
  - rule_id: recovery_boundary
    applies_to: "removed material and secondary inputs"
    rule: "Document origin and recovery gate for any actual secondary input, inheritance/cutoff method and burden ownership without double-counting previous manufacture. No default recycled content or avoided-disposal credit. This route does not require a secondary purchase; retained parent is baseline and actual recovered exits are separately reported."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "house_elevation"
      flow_role: "accepted service"
      record_type: "survey and acceptance"
      raw_fields: "site_id; job_id; house_id; campaign_id; batch_id; event_id; phase_id; period_id; record_id; owner; provider_id; dwelling_count; timber_frame_condition; original_crawlspace; structural_assessment; permit_id; jurisdiction; flood_datum; required_elevation; surveyed_final_elevation; foundation_design; anchorage_inspection; permanent_access; utility_reconnection_tests; defect_closure; acceptance_date; accepted_flag"
      collection_method: "Read actual approved design and current local requirements; reconcile unique house IDs to survey, inspection, utility tests and signed acceptance Aggregation detail: Unique accepted houses N; per reference flow; exclude pending/failed house IDs from N"
      unit: "item"
      frequency: "every house and final gate"
      temporal_coverage: "all owned preparation through final closure and stock boundaries"
      site_scope: "declared project site and attributable provider locations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Survey datum and calibration; design/permit versions; signed inspections and closure"
    - protocol_id: cp_materials
      process_id: "house_elevation"
      flow_role: "native material stocks and usable returns"
      record_type: "stock and delivery"
      raw_fields: "site_id; job_id; house_id; campaign_id; batch_id; event_id; phase_id; period_id; record_id; owner; provider_id; native_amount; native_unit; conversion_factor; conversion_factor_unit; conversion_source; sku; material_state; density; density_unit; moisture; moisture_basis; temperature; temperature_unit; gross_receipt; tare; net_receipt; opening_stock; closing_stock; installed_activity; outward_return; return_match_id; transfer_id; package_scope; stock_method"
      collection_method: "Reconcile receipts, inventories and dispatch; preserve each native SKU state and matched outward return; separate removed historic material Aggregation detail: Compute each native S then the declared outlet method once / N; do not add installed issue"
      unit: "actual native unit"
      frequency: "every receipt issue return and stock boundary"
      temporal_coverage: "all owned preparation through final closure and stock boundaries"
      site_scope: "declared project site and attributable provider locations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Supplier tickets; calibrated volume/count/scale records; stock reconciliation"
    - protocol_id: cp_water
      process_id: "house_elevation"
      flow_role: "water supply wastewater and actual other water fates"
      record_type: "meter and disposal"
      raw_fields: "site_id; job_id; house_id; campaign_id; batch_id; event_id; phase_id; period_id; record_id; owner; provider_id; native_amount; native_unit; conversion_factor; conversion_factor_unit; conversion_source; sku; material_state; density; density_unit; moisture; moisture_basis; temperature; temperature_unit; supply_meter_start; supply_meter_end; wastewater_quantity; destination; retained_water; evaporation; direct_discharge; quality; meter_id; abstraction_medium; abstraction_quantity; abstraction_unit; discharge_medium; discharge_quantity; discharge_unit; occurrence_evidence"
      collection_method: "Meter attributed supply and collect actual discharge/treatment records; reconcile distinct fates without equating supply and wastewater Aggregation detail: Aggregate each owned physical water fate / N; internal recirculation nonadditive"
      unit: "m3"
      frequency: "each meter interval and discharge"
      temporal_coverage: "all owned preparation through final closure and stock boundaries"
      site_scope: "declared project site and attributable provider locations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration; destination tickets; uncertainty and water balance"
    - protocol_id: cp_fuel
      process_id: "house_elevation"
      flow_role: "fuel stocks burn recovered fluid and losses"
      record_type: "fuel and fluid fate"
      raw_fields: "site_id; job_id; house_id; campaign_id; batch_id; event_id; phase_id; period_id; record_id; owner; provider_id; native_amount; native_unit; conversion_factor; conversion_factor_unit; conversion_source; sku; material_state; density; density_unit; moisture; moisture_basis; temperature; temperature_unit; fuel_identity; fluid_identity; opening_stock; gross_receipt; tare; closing_stock; outward_return; measured_burn; nonburned_waste; uncontained_loss; recovered_to_closing; total_spill_audit; fate_record; uncertainty; unknown_loss_investigation"
      collection_method: "Measure actual burn directly OR audit complete disjoint native-unit fates; return, nonburned waste, uncontained loss and carry are mutually exclusive. Do not infer burn as an unexplained residual. Track hydraulic fluid separately; total spill is audit only and recovered closing is already closing Aggregation detail: S_fuel/N for supply; actual burn/activity only to cp_emissions; each physical fate once / N"
      unit: "actual compatible fuel/fluid native unit"
      frequency: "every refuel burn spill exit and boundary stock"
      temporal_coverage: "all owned preparation through final closure and stock boundaries"
      site_scope: "declared project site and attributable provider locations"
      aggregation_rule: "per reference flow"
      quality_evidence: "Fuel tickets/meters and calibrated tank measurements; full reconciliation; investigation of unknown loss"
    - protocol_id: cp_energy
      process_id: "house_elevation"
      flow_role: "electricity gross supply export and temporary losses"
