allocation_rules:
  - rule_id: single_output
    applies_to: "final output"
    rule: "One intended output is accepted Cat A service area. Internal state transfers and tested trade surfaces are not co-products; exclude unresolved or failed polygons from A until defect closure. No avoided-burden credit for historic recovered material."
    source_ids: []
  - rule_id: stocks_returns
    applies_to: "materials and fuel"
    rule: "S = attributed opening stock + external net tare-corrected receipts - carried closing stock. Internal issues/installed activity are not new purchases. Choose gross-with-outlets OR consumed-only matched usable outward-return netting once; no extra credit. All nonreturned loss/waste retains upstream supply burden."
    source_ids: []
  - rule_id: shared_complete_life
    applies_to: "site_support"
    rule: "Identify each shared access/utility/tool/test asset, all consuming nodes stripout/integration/test_handover and all external jobs/nodes/periods over full life. Use compatible actual job_driver / full_life_driver with observed life OR observed history plus evidenced remainder, replacements, termination and end of life; retain sources, uncertainty, sensitivity and update. Asset-equivalent amount=(job_driver/full_life_driver)/A with complete manufacture/maintenance/replacement/EOL burden; alternatively a lifecycle-complete per-driver service quantity=job_driver/A in matching unit, never both."
    source_ids: []
  - rule_id: phases_rework
    applies_to: "all nodes"
    rule: "Index survey/isolation, stripout, installation, testing/retesting and signed sectional/final completion by actual phase and period. Failed tests return affected installed state to integration with defect IDs; discarded/replaced items exit via the owning waste row. Retain all failed attempt and replacement burdens with accepted A once, without a second sale, year or area denominator."
    source_ids: []
