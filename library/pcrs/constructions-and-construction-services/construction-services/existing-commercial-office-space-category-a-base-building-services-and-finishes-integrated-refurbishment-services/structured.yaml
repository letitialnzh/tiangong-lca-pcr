      rule: "Start from surveyed retained building, demised footprint, live occupancy/phasing, retained-capacity/fire/access survey and retained/replaced services schedule. Own actual selective stripout, hazard controls and substrate release. Existing historic assets are neither new purchases nor negative receipts."
