product_category_identity:
  canonical_pcr_id: "pcr.inside-mount-cordless-fabric-roller-shade-installation-services"
  classification_refs: "CPC 3.0 54699 — Other installation services n.e.c.; proposed narrower relation"
  covered_products: "Completed inside-mount manual cordless factory fabric roller shade installation with mounting bar, without optional valance or hold-down accessories"
  excluded_products: "Outside mounting; motors; chains/corded operation; factory fabrication; window alteration; removal and maintenance"
  representative_product: "Factory-finished open-roll cordless fabric roller shade with mounting bar and matched fitting kit, installed inside an existing window recess"
  production_route: "Survey reveal and kit; mark and drill; fix level brackets; attach handles; engage mounting bar; fit end caps; correct tension if permitted; check operation and clean"
  market_state: "Accepted installation service at signed site handover; purchased finished shade kit is an upstream product, not the service output"
functional_unit:
  what: "Completed inside-mounted cordless fabric roller shade installation"
  how_much: "1 item"
  how_well: "Actual substrate and clearance accepted; required brackets retained, level and correctly oriented; handles/end caps fitted; unobstructed level raising/lowering and position holding checked with corrective work closed"
  how_long_or_cycle: "One initial installation and handover cycle; no shade or tool lifetime assumed"
  reference_flow_link: "shade_install_accepted"
system_boundary:
  rules:
    - rule_id: inside_fit
      applies_to: "shade_install"
      rule: "For the selected guide without valance, check minimum recess depth 1-5/8 in and minimum height 1-5/8 in; fully recessed depth is 2-1/8 to 4 in depending on actual roll diameter. Check crank/handle clearance and actual model limits before drilling. The optional valance depth table is outside this scope."
      source_ids:
        - levolor-cordless-25-0040-024
    - rule_id: brackets
      applies_to: "shade_install"
      rule: "For this guide: widths up to 36 in use 2 brackets; 36-1/8–48 use 3; 48-1/8–60 use 4; 60-1/8–72 use 5; 72-1/8–90 use 6; 90-1/8–108 use 7. Do not interpolate unsupported widths or transfer this table to other models. Mark end brackets 1-1/2–2-1/2 in from shade edges and evenly space additional brackets. Inside-mount clear tabs face the room. Use the 3/32 in pilot specified for the supplied system only where appropriate to approved substrate/fixings; determine actual anchor drilling from its instructions. Supplied screws do not establish suitability for every substrate. Drywall requires suitable anchors, not supplied."
      source_ids:
        - levolor-cordless-25-0040-024
    - rule_id: assembly_gate
      applies_to: "shade_install"
      rule: "Keep protective paper wrap until fully installed. Fix brackets level/aligned, shim if needed. Fit one handle centrally for width up to 42 in; wider shades have two handles per rail. For inside mount hook the mounting-bar BACK groove on the REAR bracket hooks, rotate toward FRONT clear tabs and push until EVERY bracket clicks/locks; do not use outside-mount top-groove/downward rotation. Fit end caps. Raise/lower using handles centrally to keep movement level, check clearance/fabric and level resting position, and record position holding under actual instructions. Permitted tension correction uses removal, spring-side/roll-direction identification and 5 mm Allen adjustment as instructed, followed by reinstallation and repeat checks. No invented acceptance load or holding duration."
      source_ids:
        - levolor-cordless-25-0040-024
    - rule_id: resources_and_exits
      applies_to: "shade_install"
      rule: "Include actual drilling/charging/extraction power, consumables, cleanup, attributable bounded reusable tool/access services and declared logistics. Manual operation does not imply zero installation electricity. Record usable parts/packaging return to named recipient or retained stock, and distinct waste exits. No assumed recovered material credit or generic direct-emission factor."
      source_ids:
        - levolor-cordless-25-0040-024
    - rule_id: boundary_atomic_completion
