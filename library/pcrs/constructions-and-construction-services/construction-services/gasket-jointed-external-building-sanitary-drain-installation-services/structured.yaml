boundary_abstraction:
  declared_starting_condition: "Safe stable pre-excavated trench on private untrafficked bare ground; compatible provided outside-building outlet and prepared authorized existing receiver; temporaryworks separately owned; no live tapping/bypass"
  starting_condition_role: "Documented upstream construction/endpoints handoff, not an invented readiness exchange"
  product_classification_scope: "CPC 3.0 54622; outside-building drain-laying subset, excluding 54621 indoor piping and 54251 local mains"
  recursive_input_rule: "Do not consume the same completed drain service recursively. Record supplied components/resources and separately owned upstream site responsibilities; an alternative completed-service starting point requires reviewed boundary change."
  upstream_dataset_requirement: "Matching delivered component/fill/lubricant/water/electricity and owned/provider lifecycle datasets; disclose delivery/packaging/maintenance. Preserve separately required trench/temporaryworks responsibility for downstream aggregation without duplicate soil haul."
  disclosure: "Actual site/design/owners/endpoints; handoff and final gate; resource/period boundaries; measured D; all quantity, identity, support and range gaps"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted fully buried gasketed external sanitary building drain connection"
    uuid: ""
  flow_property_ref:
    uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
  unit_group_ref:
    uuid: "838aaa22-0117-11db-92e3-0800200c9a66"
  reference_unit: "m"
  required_qualifiers:
    - "external outlet/receiver datums and authorization"
    - "job/site/dates"
    - "six-inch DR35 SKU and seal/fitting BOM"
    - "trench owner and geometry"
    - "soil/load/design"
    - "fill grade/phase/moisture/compaction criteria"
    - "test/approval chronology"
    - "final path IDs and D"
    - "bare-grade and signed acceptance"
    - "actual equipment/energy/provider boundary"
reference_flows:
  []
measurement_rules:
  - id: reference_path
    applies_to: "reference product"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "D is the sum of uniquely identified final accepted conveyance-path centreline segments, in m, from the declared outside-building outlet datum to the prepared existing receiver datum. Include the centreline traversed through each fitting once; add no socket overlap. Exclude standalone cleanout access-riser length, removed/failed/uninstalled pieces and duplicate or overlapping test sections. Access-riser materials remain in inventory. Reconcile final as-built survey/segment IDs and endpoints; gross delivered, body, cut and laying lengths are separate records. Replacements retire the original ID and receive final IDs; only the final path enters D."
  - id: mass_conversion
    applies_to: "gasketed_dr35_pipe; gasketed_fittings_and_interfaces; replacement_gaskets; imported_approved_fill; approved_gasket_lubricant; cleaning_and_protection_consumables; incoming_packaging; supplied_water; usable_stock_returns; dry_nonusable_residuals; rejected_joint_components; contaminated_consumable_residuals; used_water_to_recipient; airborne_particulate; water_to_air; other_evidenced_species_release"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated net weighing or validated exact SKU/stream/state conversion. Preserve raw amount, tare, density/moisture convention and factor source; different material pools stay separate. This rule does not convert electricity, service events or asset shares to mass."
  - id: energy_boundary
    applies_to: "installation_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Actual external metered kWh only, with actual shared-use/recharge allocation under cp_energy. Energy property support is unresolved; NCV is not a substitute."
  - id: count_scope
    applies_to: "owned_equipment_attribution; hired_support_service"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Fractional asset count means evidenced embodied share, not weighed mass or hourly use. Hired count activates only for a real complete contract event; actual hourly contracts retain hours and unverified Duration support."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: external_drain_install
    name: "Complete external drain installation and final acceptance"
    inclusion: "required"
    inclusion_condition: "Selected external gasket lateral scope"
    role: "One accountable owner, phase journal only"
    quantitative_reference: "accepted_external_drain_connection"
process_inventory:
  - id: external_drain_install
    label: "Complete external drain installation and final acceptance"
    inputs:
      product:
        - row_id: gasketed_dr35_pipe
          role: "Six-inch DR35 gasketed PVC pipe"
          name: "Six-inch DR35 gasketed PVC pipe"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Record net pipe mass at receipt and issue, with usable returns and retained pieces traced to the same SKU. Weigh or use validated net mass per supplied length; distinguish body, cut, laying and insertion lengths from service D. Supplied integral seals belong to this component. Calculation rule: normalize_exchange. Range evidence need: A comparable quantity interval needs exact gasketed SKU net weight, socket/seal inclusion, cut plan, fitting mix, rejects and returns. The 14 ft and 20 ft gasketed shipping points, 249.6 and 247.0 lb/100 ft, are approximate shipping data, not net installed factors or Range endpoints."
          amount:
            expression: "Actual attributable exchange numerator divided by measured D"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_materials
              source_ids:
                - charlotte-dr35
                - charlotte-plastics-manual
            ranges: []
        - row_id: approved_gasket_lubricant
          role: "Actual approved gasket lubricant formulation"
          name: "Actual approved gasket lubricant formulation"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Measure container beginning/end mass, tare, usable return and residue against actual six-inch joint application events. Identify the formulation; keep installed film, captured residues and evidenced releases distinct. Mechanical gasket joining adds no primer, solvent cement or cure duty. Calculation rule: normalize_exchange. Range evidence need: Need approved product/SDS, composition, application mass, density for volume conversion, spills/residues and actual fate/control; no universal kg/joint or kg/m dose is established."
          amount:
            expression: "Actual attributable exchange numerator divided by measured D"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_materials
              source_ids:
                - charlotte-plastics-manual
            ranges: []
        - row_id: supplied_water
          role: "Externally supplied water for actual installation activities"
          name: "Externally supplied water for actual installation activities"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Meter external withdrawal or multiply measured source volume by traceable temperature-specific density. Record water-only testing, cleaning and approved moisture conditioning separately, with batch reuse and retained states. Internal reuse is not withdrawal; moisture already in aggregate or formulation is not extra supplied water. Calculation rule: normalize_exchange. Range evidence need: Need source/quality, actual withdrawal, internal capacity/head geometry, compatible head/hold/venting criteria, retests/leaks/cleaning/reuse and fill moisture adjustments. No fixed water/path-m or fill/discharge ratio."
          amount:
            expression: "Actual attributable exchange numerator divided by measured D"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_water
              source_ids:
                - charlotte-plastics-manual
                - charlotte-dr35
            ranges: []
        - row_id: installation_electricity
          role: "External installation electricity"
          name: "External installation electricity"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Use actual supply-meter interval kWh allocated by complete job/activity records. Attribute battery recharge and charger losses within the stated supply boundary once; battery operation does not add the same energy again. Manual work has no assumed electricity; combustion equipment requires route review. Calculation rule: normalize_exchange. Range evidence need: Need actual tool/pump/compactor power source, meter intervals, shared-load and recharge allocation/efficiency boundary. Rating times unrecorded duration supplies no interval. Exact Energy support remains unverified."
          amount:
            expression: "Actual attributable exchange numerator divided by measured D"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_energy
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_external_drain_connection
          role: "Accepted fully buried gasketed external sanitary building drain connection"
          name: "Accepted fully buried gasketed external sanitary building drain connection"
          flow_type: "product"
          property_unit: "Length / m"
          description: "Use cp_acceptance and reference_path. Only signed final buried-lateral acceptance after exposed-joint water test, concealment approval, full backfill/layer compaction and agreed bare-ground grade permits this output. Cover-ready or failed work is held. Calculation rule: normalize_exchange. Range evidence need: Need final surveyed endpoint/path IDs and actual lengths with every acceptance gate; 1 m is a normalization convention, not an empirical yield or material-intensity interval."
          amount:
            expression: "1 m"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_acceptance
              source_ids:
                - charlotte-dr35
                - charlotte-plastics-manual
                - charlotte-underground
                - seattle-side-sewer-notes-2024
            ranges: []
      waste:
        - row_id: used_water_to_recipient
          role: "Collected used water transferred to an authorized recipient"
          name: "Collected used water transferred to an authorized recipient"
          flow_type: "waste"
          property_unit: "Mass / kg"
          description: "Meter transferred volume with actual density or weigh the stream; retain source/reuse/batch/retained IDs, quality and recipient receipt. This is technosphere waste, exclusive of direct environmental release for the same stream. Test filling and internal reuse are not discharge. Calculation rule: normalize_exchange. Range evidence need: Need actual collection/discharge, permission, quality, density and retained/reuse reconciliation. Fresh supply does not automatically equal wastewater."
          amount:
            expression: "Actual attributable exchange numerator divided by measured D"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_water
              source_ids:
                - charlotte-plastics-manual
            ranges: []
      elementary:
        - row_id: water_to_air
          role: "Evidenced water vapour to the actual air subcompartment"
          name: "Evidenced water vapour to the actual air subcompartment"
          flow_type: "elementary"
          property_unit: "Mass / kg"
          description: "Measure actual evaporation or use a validated exposure-specific water balance/factor with retained and recipient pathways measured. Reconcile source water in aggregate and lubricant. Uncollected balance remainder is a gap; do not force an unspecified-air identity. Calculation rule: release_normalize. Range evidence need: Need actual exposed area/time/conditions for testing, cleaning or moisture conditioning, validated evaporation and source-pool partition; no default evaporation fraction."
          amount:
            expression: "Actual attributable exchange numerator divided by measured D"
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "process_output"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_water
              source_ids: []
            ranges: []
allocation_rules:
  - rule_id: single_output
    applies_to: "external_drain_install"
    rule: "One intended accepted lateral service; stock returns and residual exits are not intended co-products. Keep actual correction, replacement, extra water test and deficient fill/compaction correction resources in this accepted job, once. Failed and held work is not accepted output."
    source_ids: []
  - rule_id: return_convention
    applies_to: "usable_stock_returns"
    rule: "Declare gross custody flows plus real returns, or reconcile net resource consumption to those flows. Do not both net issues and deduct the same return again. No default recovery/avoided-product credit follows a waste dispatch or stock return."
    source_ids: []
  - rule_id: owned_asset_shares
    applies_to: "owned_equipment_attribution"
    rule: "Attribute exact asset manufacture by actual same-basis job/lifetime activity and enumerate every consumer/period. Shares reconcile to 1 over the stated history/remaining-use basis. Maintenance/replacement goes to evidenced benefiting periods or causal job; a matched lifecycle dataset must own it, or correctly typed separate roles require review. Closed assets use closed history; in-service remaining use needs supported estimates and uncertainty. Unknown maintenance/termination blocks finalized attribution."
    source_ids: []
  - rule_id: resource_nonoverlap
    applies_to: "owned_equipment_attribution; hired_support_service; installation_electricity; incoming_packaging"
    rule: "Provider service owns rented asset burdens; operator-owned assets are separate. Reconcile manufacture, each maintenance/replacement/retirement event and period share once; do not annualize lifetime-attributed burdens again or assign whole original and replacement assets simultaneously. Meter electricity/charging once. Preserve embedded packaging custody without duplicating its upstream manufacture."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "external_drain_install"
      flow_role: "material/SKU/phase and packaging"
      record_type: "actual measured/traceable event records"
      raw_fields: "shipment; SKU/lot/specification; component/phase ID; receipt/issue/return/stock; mass/tare; net factor source; fill moisture/density; packaging owner"
      collection_method: "Weigh or use validated same-SKU net factors. Reconcile actual pipe/fitting/seal/lubricant/consumable quantities. Keep fill bedding/haunch/initial/upper phases and stock distinct; packaging physical pool and upstream burden owner are separate. Quantity aggregation: actual attributable external quantity / D; internal movement is ledger only"
      unit: "kg"
      frequency: "Each custody/placement event"
      temporal_coverage: "receipt to final stock/residual closure"
      site_scope: "one job, every selected shipment and placement phase"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; tickets; SKU net evidence; phase placement and supplier boundary"
    - protocol_id: cp_water
      process_id: "external_drain_install"
      flow_role: "external/retained/reused/dispatched water"
      record_type: "actual measured/traceable event records"
      raw_fields: "source/quality; volume or meter intervals; density/temperature; batch/reuse IDs; test head/hold/venting; retained inventory; recipient; aggregate/formulation water"
      collection_method: "Meter external supply and each outgoing/retained batch separately. Weigh or convert with actual density; preserve internal reuse and constituent water in fill/lubricant. Record actual water-only tests, retests, cleaning and approved moisture conditioning; no balance remainder is assigned a fate. Quantity aggregation: each actual external input/output mass / D; internal reuse excluded"
      unit: "kg"
      frequency: "Each withdrawal/test/transfer event"
      temporal_coverage: "first water activity through final retained/recipient closure"
      site_scope: "one job and all test/placement water batches"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; batch journal; quality/density evidence; receiver receipt"
    - protocol_id: cp_energy
      process_id: "external_drain_install"
      flow_role: "external tool/pump/compactor/charging energy"
      record_type: "actual measured/traceable event records"
      raw_fields: "asset/phase; source/provider; interval start/end kWh; battery charge/activity share; charger boundary; all shared users"
      collection_method: "Read calibrated supply meters. Allocate shared loads and battery recharge using matching complete activity/charge records; include charger loss only inside stated supply boundary. Do not count battery operation and recharge twice or infer energy for manual work. Combustion equipment requires route review. Quantity aggregation: actual attributable external kWh / D"
      unit: "kWh"
      frequency: "Each supply interval and recharge"
      temporal_coverage: "installation through corrections and final compaction"
      site_scope: "one job and complete shared-meter interval"
      aggregation_rule: "per reference flow"
      quality_evidence: "meter calibration; charging/share reconciliation; manual/no-electric-use evidence"
    - protocol_id: cp_services
      process_id: "external_drain_install"
      flow_role: "owned asset share and true hired event"
      record_type: "actual measured/traceable event records"
      raw_fields: "ownership; model/serial/count; all consumers/jobs/periods; actual and lifetime same-basis activity; manufacture/maintenance/replacement/termination; provider unit/event or hours; upstream readiness IDs"
      collection_method: "Index manufacture/acquisition, all service periods, actual maintenance/replacement and retirement. Record matched lifecycle dataset inclusions; otherwise review correctly typed maintenance roles. Count only complete accepted provider events; hours keep their true quantity/support gap. Link separately owned excavation/temporaryworks readiness without importing their burdens. Quantity aggregation: asset count × actual job activity/lifetime activity / D; actual accepted event count × job share / D"
      unit: "item"
      frequency: "Each asset/service/lifecycle event"
      temporal_coverage: "whole documented asset service history plus job dates"
      site_scope: "this job and every consuming job/period in asset denominator"
      aggregation_rule: "per reference flow"
      quality_evidence: "asset/period registers; contract/acceptance; lifecycle dataset boundary; remaining-use uncertainty"
    - protocol_id: cp_residuals
      process_id: "external_drain_install"
      flow_role: "material waste and evidenced species release"
      record_type: "actual measured/traceable event records"
      raw_fields: "stream/material/species/size/state; gross/tare/composition; source/phase/old/new ID; receiver/medium/subcompartment; measured release or factor/activity/control"
      collection_method: "Weigh actual exit streams separately by identity and recipient. Trace removed joints and replacement events. Quantify emissions only by specific measurements or a validated matched species/material/control factor with actual activity; distinguish captured waste, retained constituents and direct release. Quantity aggregation: each actual waste/species quantity / D; no automatic residual-to-air assignment"
      unit: "kg"
      frequency: "Each exit/reject/release event"
      temporal_coverage: "receipt through final correction/dispatch"
      site_scope: "one job, actual installer-owned releases only"
      aggregation_rule: "per reference flow"
      quality_evidence: "tare/calibration; dispatch tickets; composition; factor applicability and uncertainty"
    - protocol_id: cp_acceptance
      process_id: "external_drain_install"
      flow_role: "final accepted buried conveyance path"
      record_type: "actual measured/traceable event records"
      raw_fields: "provided endpoint datums/authorization; trench readiness owner; final path/segment IDs and lengths; fitting/access distinction; visible-joint water test/retest; concealment approval; fill/layer/compaction/grade evidence; signature/date"
      collection_method: "Survey and reconcile final unique conveyance centreline as reference_path. Record ready trench/endpoints, gasket laying/haunch, exposed-joint compatible water test and correction, competent concealment approval, then full cover/layer compaction and agreed bare-ground grade, then final signed buried-lateral acceptance. Failed or merely cover-ready work contributes no D. Quantity aggregation: final accepted path D / D = 1 m reference flow"
      unit: "m"
      frequency: "Each inspection/correction and final survey/handover"
      temporal_coverage: "ready-trench handoff through signed final acceptance"
      site_scope: "one actual external outlet-to-receiver path set"
      aggregation_rule: "per reference flow"
      quality_evidence: "as-built survey; test/approval chronology; full backfill/compaction records; final signature"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "Divide the actual attributable external quantity by D, retaining its own numerator unit and conversion evidence. For the final accepted path, D / D gives 1 m reference flow. Do not repeat internal transfers or embedded supply inputs."
      inputs:
        - "actual external quantity"
        - D
        - "linked collection protocol"
      output: "quantity per reference flow"
      source_ids: []
    - id: owned_asset_normalize
      applies_to: "owned_equipment_attribution"
      rule: "q_asset_per_m = asset_count × job_activity / lifetime_activity / D. Use the same documented activity basis for all consumers; manufacture once, maintenance/replacement by evidenced benefiting periods or causal job with explicit dataset ownership."
      inputs:
        - asset_count
        - job_activity
        - lifetime_activity
        - D
        - cp_services
      output: "attributed item per reference flow"
      source_ids: []
    - id: hired_service_normalize
      applies_to: "hired_support_service"
      rule: "q_service_per_m = true_contract_quantity × job_share / D. Here item applies only to an actual complete defined accepted event. A true hour contract requires reviewed Duration support; preserve hours and the gap."
      inputs:
        - true_contract_quantity
        - job_share
        - D
        - cp_services
      output: "true service quantity per reference flow"
      source_ids: []
    - id: fill_diagnostic
      applies_to: "imported_approved_fill"
      rule: "Keep surveyed phase volumes separate. Prefer weighed fill attributed to each phase; otherwise mass = actual phase volume × validated site/state bulk density with declared moisture convention. Deduct actual pipe displacement where applicable; reconcile all placed phases, returns, stocks and losses once."
      inputs:
        - "phase geometry"
        - "ticket mass"
        - density
        - moisture
        - cp_materials
        - cp_acceptance
      output: "phase mass diagnostic before normalize_exchange"
      source_ids: []
    - id: release_normalize
      applies_to: "airborne_particulate; water_to_air; other_evidenced_species_release"
      rule: "Use actual measured species mass / D, or actual matched activity × validated species-specific release factor / D. Identify real medium/subcompartment and controls; unknown partition or unmatched factor remains a gap."
      inputs:
        - "species mass or activity/factor"
        - D
        - cp_residuals
        - cp_water
      output: "species kg per reference flow"
      source_ids: []
    - id: source_pool_balance
      applies_to: "material and constituent ledgers"
      rule: "Opening stock + receipts = closing stock + usable returns + installed retention + captured/recipient waste + evidenced environmental release, with compatible units and uncertainty. Reconcile separate physical material/constituent pools, including packaging custody, aggregate moisture and formulation water; no automatic fate from an imbalance."
      inputs:
        - stocks
        - receipts
        - retention
        - returns
        - waste
        - release
        - cp_materials
        - cp_water
        - cp_residuals
      output: "diagnostic physical pool balance"
      source_ids: []
  data_quality_requirements:
    - id: dq_traceability
      applies_to: "all inventory rows"
      requirement: "Retain event dates, node ownership, actual SKU/state/recipient, instrument calibration, raw numerator/unit and matched conversion provenance. Unknown occurrence is unknown, not zero. Maintain physical and constituent pools separately with uncertainty."
      evidence: "cp_materials; cp_water; cp_energy; cp_services; cp_residuals; cp_acceptance"
    - id: dq_public_evidence
      applies_to: "all inventory rows"
      requirement: "Manufacturer shipping points are not net consumption or intervals. Engineering bedding/compaction recommendations and Seattle sample notes require actual site/design adaptation; no default density, water ratio, reject fraction, lubricant dose, lifetime or emission split is established."
      evidence: "charlotte-dr35; charlotte-plastics-manual; seattle-side-sewer-notes-2024"
    - id: range_gasketed_dr35_pipe
      applies_to: "gasketed_dr35_pipe"
      requirement: "A comparable quantity interval needs exact gasketed SKU net weight, socket/seal inclusion, cut plan, fitting mix, rejects and returns. The 14 ft and 20 ft gasketed shipping points, 249.6 and 247.0 lb/100 ft, are approximate shipping data, not net installed factors or Range endpoints."
      evidence: "cp_materials"
    - id: range_gasketed_fittings_and_interfaces
      applies_to: "gasketed_fittings_and_interfaces"
      requirement: "Need endpoint compatibility/approval, as-built fitting and access BOM, SKU weights/seal boundary and actual replacements before any fitting kg/path-m interval."
      evidence: "cp_materials"
    - id: range_replacement_gaskets
      applies_to: "replacement_gaskets"
      requirement: "Need actual compatible dimensions/material, net mass, extra issue count, replacement cause and destination. ASTM F477 conformity does not identify an elastomer or its mass."
      evidence: "cp_materials"
    - id: range_imported_approved_fill
      applies_to: "imported_approved_fill"
      requirement: "Need project soil/load/cover design, phase geometry, material grade, weighed quantity, moisture/density basis, losses and placement acceptance. General 4 in bedding, 6 in on rock, 6 in layers and 85–95% compaction guidance is conditional, not an inventory interval or evidence of site compliance."
      evidence: "cp_materials"
    - id: range_approved_gasket_lubricant
      applies_to: "approved_gasket_lubricant"
      requirement: "Need approved product/SDS, composition, application mass, density for volume conversion, spills/residues and actual fate/control; no universal kg/joint or kg/m dose is established."
      evidence: "cp_materials"
    - id: range_cleaning_and_protection_consumables
      applies_to: "cleaning_and_protection_consumables"
      requirement: "Need actual objects/frequency, product dose or article mass/composition, stock and captured residues; no generic cleaning kg/m interval."
      evidence: "cp_materials"
    - id: range_incoming_packaging
      applies_to: "incoming_packaging"
      requirement: "Need actual packaging material/weight and supplier boundary by shipment; even absence on bulk fill needs evidence. Packaging waste cannot stand in for a missing incoming source pool."
      evidence: "cp_materials"
    - id: range_supplied_water
      applies_to: "supplied_water"
      requirement: "Need source/quality, actual withdrawal, internal capacity/head geometry, compatible head/hold/venting criteria, retests/leaks/cleaning/reuse and fill moisture adjustments. No fixed water/path-m or fill/discharge ratio."
      evidence: "cp_water"
    - id: range_installation_electricity
      applies_to: "installation_electricity"
      requirement: "Need actual tool/pump/compactor power source, meter intervals, shared-load and recharge allocation/efficiency boundary. Rating times unrecorded duration supplies no interval. Exact Energy support remains unverified."
      evidence: "cp_energy"
    - id: range_owned_equipment_attribution
      applies_to: "owned_equipment_attribution"
      requirement: "Need asset-specific embodied evidence, all consumer/period activity, maintenance/replacement/termination and supported remaining-use uncertainty; no whole tool/job, standard lifetime or generic share interval."
      evidence: "cp_services"
    - id: range_hired_support_service
      applies_to: "hired_support_service"
      requirement: "Need true contract unit, accepted event definition or hours, provider manufacture/maintenance/fuel/electricity boundary and consumer shares. No generic events/m; hourly Duration support remains unresolved."
      evidence: "cp_services"
    - id: range_accepted_external_drain_connection
      applies_to: "accepted_external_drain_connection"
      requirement: "Need final surveyed endpoint/path IDs and actual lengths with every acceptance gate; 1 m is a normalization convention, not an empirical yield or material-intensity interval."
      evidence: "cp_acceptance"
    - id: range_usable_stock_returns
      applies_to: "usable_stock_returns"
      requirement: "Need actual acceptance/quantity/state and prior issue convention for each returned SKU, including unused fill and lubricant balances; no default return fraction."
      evidence: "cp_materials"
    - id: range_dry_nonusable_residuals
      applies_to: "dry_nonusable_residuals"
      requirement: "Need actual cut plan, pack losses, rejected/excess fill destination, collection and mass records; no universal waste percentage or mixed-material exchange."
      evidence: "cp_residuals"
    - id: range_rejected_joint_components
      applies_to: "rejected_joint_components"
      requirement: "Need observed cause, composition/mass, replacement linkage and destination. Recognized gasket displacement risk does not establish a defect rate."
      evidence: "cp_residuals"
    - id: range_contaminated_consumable_residuals
      applies_to: "contaminated_consumable_residuals"
      requirement: "Need actual SDS/formulation, container/wipe retention, residue quality and recipient requirements; neither a generic VOC nor hazardous fraction is supported."
      evidence: "cp_residuals"
    - id: range_used_water_to_recipient
      applies_to: "used_water_to_recipient"
      requirement: "Need actual collection/discharge, permission, quality, density and retained/reuse reconciliation. Fresh supply does not automatically equal wastewater."
      evidence: "cp_water"
    - id: range_airborne_particulate
      applies_to: "airborne_particulate"
      requirement: "Need composition/size fraction, actual task activity, wetting/enclosure/capture and matched measurement/factor; no total-dust-to-PVC/PM split or universal interval."
      evidence: "cp_residuals"
    - id: range_water_to_air
      applies_to: "water_to_air"
      requirement: "Need actual exposed area/time/conditions for testing, cleaning or moisture conditioning, validated evaporation and source-pool partition; no default evaporation fraction."
      evidence: "cp_water"
    - id: range_other_evidenced_species_release
      applies_to: "other_evidenced_species_release"
      requirement: "Need actual approved lubricant/cleaner SDS, applied mass, species, medium, control and partition/factor evidence. Gasket joining alone implies neither chemical identity nor release quantity."
      evidence: "cp_residuals"
validation_rules:
  - rule_id: validate_scope_gate
    applies_to: "reference product"
    rule: "Require declared external endpoints, approved six-inch gasketed DR35 specification and trench/temporaryworks owners. Check exposed-joint water test and concealment approval precede full cover; full cover, compaction, bare-ground grade and final signature precede accepted output. Do not apply air/gas testing or solvent-route cure conditions."
    source_ids: []
  - rule_id: validate_reference
    applies_to: "accepted_external_drain_connection"
    rule: "Verify D > 0 under reference_path and cp_acceptance. Include fitting path once, no socket overlap or cleanout access riser; reject gross-cut substitution, duplicate tests and retired failed pieces. All card numerators use the same accepted-job D."
    source_ids: []
  - rule_id: validate_rework
    applies_to: "rejected_joint_components; external_drain_install"
    rule: "Link damaged/misaligned/leaking/displaced-seal joint or failed fill/grade event to its original resource issue, correction/reseat/replacement, test/reapproval and final path/phase ID. Classify real usable return, nonusable waste and captured residue with recipients; internal correction without exit is an event. Keep correction burdens and exclude failed work from D."
    source_ids: []
  - rule_id: validate_quantities
    applies_to: "all inventory rows"
    rule: "Require actual SKU/state/recipient instances with compatible units, linked node-owned protocol, raw numerator and conversion evidence. Check fill phases and integral/replacement seals once; water batches/constituents and retained/recipient/environmental states exclusive. Do not turn imbalance into dust, evaporation or chemical release."
    source_ids: []
  - rule_id: validate_assets
    applies_to: "owned_equipment_attribution; hired_support_service"
    rule: "Review all consumers/periods, lifecycle events and maintenance dataset boundary, exact attribution and uncertainty. Prevent rented/owned, manufacture/replacement and recharge/use overlap. Unsupported hourly service and unknown remaining life/termination remain explicit blockers to finalized attribution."
    source_ids: []
  - rule_id: validate_identity_evidence
    applies_to: "all inventory rows"
    rule: "Final downstream exchanges require verified concrete identities and property/unit compatibility. Candidate names are not binding. Resolve exact Energy support for electricity and Duration support for a real hourly service before using those exchanges. Keep each role-specific range need visible; approximate shipping points and sample design notes are not observed quantity intervals or project approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_data_package"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matching external six-inch DR35 gasket sanitary-lateral installation with declared starting handoff and complete final gate; downstream process/lifecyclemodel construction preserving this service boundary"
  excluded_use: "Indoor pipework, local mains/full civil asset, excavation/road/pavement scope, other pipe/joining routes, incomplete cover-ready work, operational wastewater transport/treatment or design certification"
  required_metadata: "Job/site/geography/dates; endpoint datums/authorization; trench/temporaryworks owners; exact pipe/fitting/seal BOM; fill phase/design/soil/load; test and concealment approvals; complete compaction/grade/final signature; D/unique path IDs; supplier/packaging/delivery/asset period boundaries"
  required_quality_disclosure: "Actual measurement coverage and uncertainty; omitted/unresolved occurrences, identity/support and role-specific range gaps; factor applicability; water/source-pool closure; resource attribution and maintenance/remaining-use uncertainty; no candidate identity asserted as a final binding"
  update_trigger: "Changed pipe/joint/fill or equipment route; actual design/site/gate change; new measurements or supplier/identity evidence; changed maintenance/lifetime boundary or guidance"
