system_boundary:
  rules:
    - rule_id: boundary_owner
      applies_to: "external_drain_install"
      rule: "Start only after documented safe stable pre-excavated trench and compatible existing external endpoints are handed over. Excavation, separately owned shoring/dewatering and removed-soil custody/haulage stay with their declared suppliers; disclose their required upstream responsibility and prevent hidden omission in downstream aggregation. No excavated soil enters selected fill."
      source_ids:
        - cpc3-current
    - rule_id: installation_gate
      applies_to: "external_drain_install"
      rule: "Sequence readiness → new bedding/pipe/fitting/gasket/haunch with joints visible → compatible water-only test, corrections/retests and competent concealment approval → full new imported cover, layer compaction and agreed bare-ground grade → signed final as-built acceptance. Keep every phase in one node; cover-ready is not final output."
      source_ids:
        - charlotte-plastics-manual
        - seattle-side-sewer-notes-2024
    - rule_id: gasket_joining
      applies_to: "gasketed_dr35_pipe; gasketed_fittings_and_interfaces"
      rule: "Clean bell/seal/spigot, confirm seated seal, use approved lubricant and straight manual bar/block insertion to the correct mark. Abnormal resistance requires disassembly/check rather than powered forcing. Field cuts are square, bevelled and re-marked to matching component instructions. No solvent or curing step is implied."
      source_ids:
        - charlotte-plastics-manual
    - rule_id: resources_and_scope
      applies_to: "all inventory rows"
      rule: "Include actual permanent components, every approved imported-fill phase, consumables, packaging source pool, external water/electricity, attributed owned resources and true hired service. Use manual or grid/battery-electric resources only in this route; combustion or live bypass requires reviewed scope change. Mains/new chambers, indoor piping, pavement/road crossing, landscaping beyond bare grade and later operation/treatment are excluded. Landed supply datasets must disclose delivery and packaging boundaries."
      source_ids:
        - charlotte-dr35
        - charlotte-underground
    - rule_id: asset_periods
      applies_to: "owned_equipment_attribution; hired_support_service"
      rule: "Identify actual insertion tools/cutter/compactor/pump/meter/charger and ownership, manufacture/acquisition, all consuming jobs and reporting periods, maintenance/replacement and retirement. Link actual job inputs/events and accepted handover to this common period index; electricity and hired-provider burdens have single owners. Unknown utilization is retained as a gap."
      source_ids: []
    - rule_id: boundary_atomic_completion
      applies_to: "all processes"
      rule: "Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry."
