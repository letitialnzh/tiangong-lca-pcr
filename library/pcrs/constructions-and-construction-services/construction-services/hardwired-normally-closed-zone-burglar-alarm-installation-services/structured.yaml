allocation_rules:
  - rule_id: a_jobs
    applies_to: "install_accept"
    rule: "Assume no intended co-product. Keep original job failures, additional components, labour activity, tests and retests with that job. Link every actual return or waste/recovery exit to its originating event and receiver; give no avoided-production credit and do not erase rejected work."
    source_ids: []
  - rule_id: a_shared
    applies_to: "owned_equipment_attribution; hired_support_service"
    rule: "For resource r and job j, a_rj = A_rj / sum(A_rk), with k covering every benefiting job/node over the same complete resource-life packet. Use one evidenced causal physical activity basis; require a positive total and sum(a_rj) = 1. Record equipment identity, consuming nodes, service periods, activity method and ownership. Do not assume equivalent output counts or a generic tool lifetime."
    source_ids: []
  - rule_id: a_quantity
    applies_to: "owned_equipment_attribution"
    rule: "Attributed asset quantity = a_rj / D item; attributed lifecycle burden = B_r * a_rj / D. D is actual accepted same-configuration installation count. Keep B_r, physical activity and installation count independently observed. Remaining-life uncertainty or missing consumers prevents complete attribution."
    source_ids: []
  - rule_id: a_periods
    applies_to: "all inventory rows"
    rule: "Index procurement/manufacture, each service/reporting period, maintenance, replacement and retirement/termination. Link inputs, assets, outputs and correction/return events to dated job and period. Record each period-specific attribution decision and its evidence. Replacements are actual event packets, not automatically a whole asset per job. Reconcile each resource and period total once across all consumers and retain unresolved future-use/termination evidence."
    source_ids: []
  - rule_id: a_hire
    applies_to: "hired_support_service; installation_electricity"
    rule: "Use actual provider service references and inclusion ledger. Do not add provider capital manufacture separately or repeat fuel/electricity already in the purchased service. A genuinely whole contracted event may be counted; an hourly contract needs actual Duration support and review."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_acceptance
      process_id: "install_accept"
      flow_role: "accepted_installation"
      record_type: "acceptance record"
      raw_fields: "job id; site; panel model; zone/tamper schedule; BOM; mains interface; battery; programming; test results; corrections/retests; normal-state restoration; dates; customer signature; accepted count D"
      collection_method: "Inspect each installation design and competent signed test/handover record; independently count complete accepted same-configuration installations; Aggregation: per reference flow; retain actual positive D and raw acceptance events before normalization"
      unit: "item"
      frequency: "Every job and acceptance/retest event"
      temporal_coverage: "Actual receipt-to-handover dates including corrective work"
      site_scope: "Actual premises and declared configuration"
      aggregation_rule: "per reference flow"
      quality_evidence: "Signed acceptance; competent tests; rejected/unfinished exclusion; configuration-equivalence evidence"
    - protocol_id: cp_materials
      process_id: "install_accept"
      flow_role: "control_panel; field_alarm_devices; permanent_batteries; alarm_cable; fixings_and_containment; incoming_packaging"
      record_type: "material custody record"
      raw_fields: "job; shipment; SKU; material/state; supply boundary; included accessories/packaging/delivery; net mass; counts/lengths; conversion factors; stock; installed/return/waste amounts; original event; receiver"
      collection_method: "Calibrated net weighing or traceable matching-SKU count/length mass conversion; inspect supplier inclusion and event-linked custody records; Aggregation: per reference flow; sum attributable measured numerators for each matching SKU and divide by D"
      unit: "kg"
      frequency: "Every shipment, issue and custody change"
      temporal_coverage: "All installation dates and relevant stock opening/closing dates"
      site_scope: "Actual job, supplier packet and material pool"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; matching factor provenance; supply inclusion ledger; balance residual and tolerance"
    - protocol_id: cp_energy
      process_id: "install_accept"
      flow_role: "installation_electricity"
      record_type: "meter and activity record"
      raw_fields: "job; provider; voltage; meter boundary/id; start/end kWh; tool/charger/test/commissioning activity; times; all shared consumers; inclusion ledger"
      collection_method: "Read meters for actual external supply before handover; attribute shared measured energy by recorded causal activity and inspect purchased service inclusions; Aggregation: per reference flow; attributable actual kWh divided by D"
      unit: "kWh"
      frequency: "Every metered interval and activity"
      temporal_coverage: "Actual pre-handover intervals across all contributing dates"
      site_scope: "Actual premises and external charging site if used"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter accuracy; interval completeness; shared activity reconciliation; no Ah/power/duration substitution"
    - protocol_id: cp_services
      process_id: "install_accept"
      flow_role: "owned_equipment_attribution; hired_support_service"
      record_type: "resource and contract record"
      raw_fields: "asset manufacturer/model/serial; owner; provider; contract reference/unit; genuine whole event count; all consumer jobs/nodes; physical activity; reporting periods; manufacture/service/maintenance/replacement/retirement packets; B_r; remaining use; energy inclusion"
      collection_method: "Inspect serial-specific lifecycle records, complete consumer activity and actual provider invoices; separate owned assets from provider-owned services and document period decisions; Aggregation: per reference flow; actual asset share a_rj or genuine attributed whole event count divided by D"
      unit: "item"
      frequency: "Every asset use, contract event, replacement and attribution-period closure"
      temporal_coverage: "Full resource-life packet and each actual service/reporting period; unresolved remaining use disclosed"
      site_scope: "All benefiting jobs/nodes and periods, including other premises"
      aggregation_rule: "per reference flow"
      quality_evidence: "Positive complete activity total; sum(a_rj) = 1; ownership/inclusion ledger; actual replacement/termination evidence"
    - protocol_id: cp_releases
      process_id: "install_accept"
      flow_role: "unused_product_return; installation_waste; airborne_particulate"
      record_type: "return waste and release record"
      raw_fields: "original job/event; SKU/material/species; state; hazard; particle size; air compartment; recipient; ticket; net mass; drilling/capture activity; retained/captured/emitted quantities; method; uncertainty; residual"
      collection_method: "Weigh returns and separate waste streams with receiver tickets; use measured or justified species/size/compartment release evidence for actual work; reconcile material custody without inferring emissions from residuals; Aggregation: per reference flow; attributable quantity of each exact return/waste/release divided by D"
      unit: "kg"
      frequency: "Every return, waste transfer and relevant release event"
      temporal_coverage: "Actual installation and correction/retest dates through handover"
      site_scope: "Actual job and named receiving site/air compartment"
      aggregation_rule: "per reference flow"
      quality_evidence: "Receiver confirmation; calibrated mass; release method and uncertainty; capture distinction; closure gaps"
  calculation_rules:
    - id: c_actual
      applies_to: "all inventory rows"
      rule: "q_i = N_i / D; N_i is the independently retained attributable actual numerator for the individual exchange; D is independently counted accepted same-configuration installations. Never backsolve N_i from an expected reference output."
      inputs:
        - N_i
        - D
        - cp_acceptance
        - cp_materials
        - cp_energy
        - cp_services
        - cp_releases
      output: "q_i"
      source_ids: []
    - id: c_custody
      applies_to: "material custody pools"
      rule: "opening stock + receipts = installed retained material + closing stock + usable returns + actual waste + identified releases + residual. Reconcile each exact source pool and report residual/tolerance; a mixed mass diagnostic is not one flow or service mass."
      inputs:
        - cp_materials
        - cp_releases
        - "source pool"
        - "measured quantities"
      output: "custody reconciliation"
      source_ids: []
    - id: c_resource
      applies_to: "owned_equipment_attribution"
      rule: "a_rj = A_rj / sum(A_rk); attributed asset quantity = a_rj / D; attributed burden = B_r * a_rj / D. Use all consumers of the same lifecycle packet, positive total activity and sum(a_rj) = 1."
      inputs:
        - A_rj
        - A_rk
        - B_r
        - D
        - cp_services
      output: "asset share and lifecycle burden"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Retain exact model/SKU/state/provider/receiver or species/size/medium; verify concrete flow and compatible support chains before final binding."
      evidence: "Supplier and receiver records; verified identity support"
    - id: dq_measurement
      applies_to: "all measured quantities"
      requirement: "Retain calibration, factor matching, raw actual numerators, units, coverage and uncertainty. No universal component weight, waste factor, tool life or service energy range is established."
      evidence: "Meter/scale records; conversion provenance; matching packet"
    - id: dq_complete
      applies_to: "all collection protocols"
      requirement: "Cover all contributing dates, sites, stock changes, failures, corrections, returns and consumers. Report unknown remaining use and missing records; never zero-fill an absent record."
      evidence: "Event ledger; period/consumer reconciliation; acceptance linkage"
    - id: dq_range
      applies_to: "all inventory rows"
      requirement: "Quantity guidance needs actual matching component/packaging, energy/activity/contract, return/reject receiver and species-release evidence; supplier point specifications apply only to matching models."
      evidence: "Primary measured records and applicability assessment"
validation_rules:
  - rule_id: v_scope
    applies_to: "reference product"
    rule: "Require all declared configuration and interface qualifiers, compatible BOM, normally-closed zone schedule and independent global tamper design. Manual capabilities for fire/PA or later service do not enlarge this scope."
    source_ids:
      - texecom-veritas-installation
  - rule_id: v_intrusion
    applies_to: "install_accept"
    rule: "For actual occupied zones, retain detector/contact walk response, sounder/strobe operation as supplied, global tamper response, set/unset and customer-control checks. Record disabled zones, settings, faults, corrective actions, retests and restored normal state with competent test and signed handover evidence; missing or failed required tests block accepted output."
    source_ids:
      - texecom-veritas-installation
  - rule_id: v_reference
    applies_to: "accepted_installation"
    rule: "Require independently counted positive D for complete accepted installations of the same justified configuration. The reference link, semantic name, Number of items support, item unit and explicit 1 item output must agree. Components, tests, progress and unfinished work cannot substitute for D."
    source_ids: []
  - rule_id: v_custody
    applies_to: "all material inputs and outputs"
    rule: "Reconcile each matching source pool through receipts, installed retention, stock, usable returns, waste and identified releases. Distinguish permanent batteries from tool assets; link reject exits to install_accept and their actual receiver. Report residuals and measurement tolerances; missing records never imply zero."
    source_ids: []
  - rule_id: v_resource
    applies_to: "owned_equipment_attribution; hired_support_service"
    rule: "Verify all consumers and periods, positive physical-activity denominator, share closure, actual replacement/termination treatment and one owner per lifecycle burden. Check delivery, packaging, hire capital and energy inclusions for duplication. Incomplete remaining-life or consumer evidence blocks final attribution."
    source_ids: []
  - rule_id: v_identity
    applies_to: "all inventory rows"
    rule: "Expand conditional cards into separate actual SKU/state/provider/receiver or species-compartment exchanges. No heterogeneous fixed UUID or generic dust identity is allowed. Verify concrete flow and support chains before final binding, with actual protocol and calculation linkage; unresolved Energy or hourly Duration support remains a gap."
    source_ids: []
  - rule_id: v_quality
    applies_to: "all inventory rows"
    rule: "Report performed and skipped checks, findings and completeness separately from fixed/unresolved identity counts and quantity-range gaps. Inconclusive measurement, unverified support or missing foreground evidence cannot be described as a complete final-binding or publication pass."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground installation package; secondary_dataset or background_dataset only with compatible scope, configuration and acceptance gate"
  downstream_use: "process and lifecyclemodel projections of the same foreground package"
  allowed_use: "Declared single-panel normally-closed-zone/global-tamper intruder installation through signed handover"
  excluded_use: "Operation/monitoring/maintenance; fire-alarm equivalence; alternative technologies; whole-building equivalence; unsubstantiated long-term performance or lifetime claims"
  required_metadata: "Site/time; actual model/configuration and quantity; interface/design/BOM; test/correction/acceptance; supply sources; inventories/protocols; resource owners/periods/decisions"
  required_quality_disclosure: "Actual measured coverage, uncertainties and custody residuals; concrete identity/support gaps; quantity-range evidence gaps; remaining resource life and skipped checks"
  update_trigger: "Changed model, route, interface, BOM or acceptance design; stronger measured quantity, attribution or identity evidence"
data_sources:
