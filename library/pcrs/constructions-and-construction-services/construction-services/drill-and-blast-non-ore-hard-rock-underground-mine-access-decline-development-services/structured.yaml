allocation_rules:
  - rule_id: no_ore
    applies_to: "all inventory rows"
    rule: "This subset has no intentional saleable ore product. Non-ore spoil receives actual classified treatment/reuse/disposal fate without default avoided product or disposal credit. Valuable ore production requires another reviewed methodology."
    source_ids: []
  - rule_id: stock_supply
    applies_to: "explosives; initiators; drill_consumables; development_fuel; support_bolts; support_mesh; support_binder; service_extensions; support_consumables; support_fuel; development_other_native; support_other_native"
    rule: "Per actual SKU/native unit: attributable supply = opening attributable stock + external net-tare gross receipts - closing carried stock. Gross-with-outlets retains all actual outward exits; consumed-only may exclude matched usable outward return once with corresponding upstream burden. Never add a duplicate return credit. Nonreturned waste/loss keeps upstream burden."
    source_ids: []
  - rule_id: fuel_balance
    applies_to: "development_fuel; support_fuel; development_air; support_air"
    rule: "Actual supplied fuel is allocated to actual combustion, usable outward return, nonburned waste and uncontained loss with opening/closing state reconciled. Total spill is audit-only: recovered retained spill is already closing stock or a traced waste/return. Only actual combustion drives combustion emissions; fuel supply is not set to burned fuel only."
    source_ids: []
  - rule_id: blast_balance
    applies_to: "explosives; initiators; explosive_return; initiator_return; development_waste; development_air"
    rule: "Reconcile external supply and carried stock independently from issue, charge, actual detonation, misfire resolution, waste and usable returns by round. Internal issue/charging are nonadditive activity; use actual detonation for a compatible blast-emission method and retain upstream burden of nonreturned unused/misfired/disposed material."
    source_ids: []
  - rule_id: failed_rounds
    applies_to: "development; support; accepted_decline"
    rule: "Setup, failed rounds, repeat blasting/scaling/support, removals and retests retain their attributable burdens in the same unique accepted segment denominator. Failed/incomplete gates yield no accepted metres. Keep remediation loop and waste exit linked to the producing node."
    source_ids: []
  - rule_id: shared_periods
    applies_to: "development_electricity; support_electricity; development_assets; support_assets; development_provider; support_provider"
    rule: "Enumerate every consuming job/node/period and lifecycle phase. Direct meters first; otherwise use an actual compatible measured driver numerator divided by the complete consumer/period driver denominator. Allocate complete asset manufacture, maintenance, replacements and end of life across all jobs/nodes/periods. Whole-life denominator requires completed observed life or observed history plus evidenced remainder, replacements, termination and end of life with uncertainty, sensitivity and updates. Missing coverage/denominator blocks finalization. Period shares and direct/provider resource shares must reconcile once."
    source_ids: []
