  []
measurement_rules:
  - id: accepted_length
    applies_to: "accepted_decline"
    required_property_ref:
      name: "Length"
      uuid: ""
    required_unit: "m"
    rule: "L > 0 is unique final accepted developed centreline length from traceable survey and signed segment acceptance in cp_accept. Drillhole length, planned advance, round count, overbreak and repeat attempts never increase L."
  - id: native_ledger
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Actual native property"
      uuid: ""
    required_unit: "Actual native unit"
    rule: "Retain each actual SKU/native unit and each output state independently. Net-tare receipts, issues, returns and carried stock reconcile in that same unit; internal issues are not purchases. No invented count-to-mass or length-to-mass conversion."
  - id: rock_states
    applies_to: "rock_spoil"
    required_property_ref:
      name: "Mass; Volume"
      uuid: ""
    required_unit: "kg; m3"
    rule: "Independently record surveyed excavated in-situ volume, loose spoil volume and net weighed wet/dry mass. Use conversion only when independently needed, with matched density/state/moisture/temperature/source; never a generic swell factor."
  - id: explosive_states
    applies_to: "explosives; initiators; explosive_return; initiator_return; development_waste; development_air"
    required_property_ref:
      name: "Mass; Count"
      uuid: ""
    required_unit: "kg; item"
    rule: "Supplied, issued, charged, actually detonated, misfired, unused carried stock, usable outward return and hazardous disposal are distinct traced states. Initiators stay in native Count unless an independently necessary measured mass view exists."
  - id: environment_views
    applies_to: "development_air; support_air; development_water_out; support_water_out"
    required_property_ref:
      name: "Actual species/medium and whole fluid"
      uuid: ""
    required_unit: "kg; m3"
    rule: "Whole gas/fluid balance and species elementary releases are nonadditive views. Safety air concentrations and clearance thresholds do not establish emitted mass. Wet mix, dry binder, added water and cured installed state remain distinct."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: development
    name: "Drill-blast excavation mucking and scaling"
    inclusion: "required"
    inclusion_condition: "Actual non-ore hard-rock decline development"
    role: "Independent resource removal from in-situ face to cleared excavated opening and classified spoil, handed to support; no ore production"
    quantitative_reference: "Actual job inventory per 1 m reference flow"
  - id: support
    name: "Engineered ground support service integration and acceptance"
    inclusion: "required"
    inclusion_condition: "All included segments require actual engineered support and handover"
    role: "Integrate support components and actual extensions; inspect/test, remediate/retest and sign accepted usable segment"
    quantitative_reference: "1 m accepted supported decline"
