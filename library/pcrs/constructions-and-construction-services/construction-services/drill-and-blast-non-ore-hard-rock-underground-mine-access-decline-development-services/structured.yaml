system_boundary:
  rules:
    - rule_id: route_handoff
      applies_to: "development; support"
      rule: "Development independently changes in-situ rock to cleared excavated opening plus removed waste rock; its internal survey/ground-inspection record authorizes only the next task under competent safe-work controls, never unrestricted entry into unsupported ground or final acceptance. Support integrates bolts/mesh/actual binder and service extensions into inspected usable segment. Joining, grouting/shotcrete preparation and tests stay embedded; no fictitious separate formulation factory."
      source_ids:
        - minto-development-plan-2014
        - ontario-ground-control
    - rule_id: full_job
      applies_to: "all inventory rows"
      rule: "Include access qualification, setup, drilling/blast/re-entry ventilation, mucking/haul/scaling, support, temporary and permanent service extensions actually required, cleanup, defect removal, failed rounds, misfire response and retesting to signed handover. Exclude later mine operation and intentional ore production."
      source_ids:
        - minto-development-plan-2014
    - rule_id: ground_gate
      applies_to: "support; accepted_decline"
      rule: "Require current actual competent geotechnical/ground-control design, inspected/scaled ground and installed support quality evidence. Actual bolt/mesh/binder/support and testing duties follow approved site design. Do not universalize Ontario jurisdiction or historical case dimensions."
      source_ids:
        - ontario-ground-control
    - rule_id: blast_gate
      applies_to: "development; accepted_decline"
      rule: "Require actual authorized blast design, explosive traceability, exclusion and re-entry/air clearance and safe interface handover under actual governing requirements. Unresolved misfire or unsafe ground cannot contribute accepted output."
      source_ids:
        - minto-development-plan-2014
    - rule_id: water_spoil
      applies_to: "development; support"
      rule: "Include actual supply and abstraction, drilling/dust-suppression/cleaning/test water, mine inflow interception/pumping/treatment and classified destinations. Rock spoil is separately traced by classification/receiver; no generic useful-product or avoided-disposal credit."
      source_ids:
        - minto-development-plan-2014
    - rule_id: ownership
      applies_to: "all inventory rows"
      rule: "Maintain one resource owner for direct work, site utilities, transport, subcontractors, rentals, assets and spares. Factory packages and separately purchased constituent parts are exclusive; disclose provider coverage and eliminate overlaps."
