measurement_rules:
  - id: net_area
    applies_to: "accepted_waterproofing"
    required_property_ref:
      name: "Area / m2"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "A > 0 is unique net developed accepted waterproofed surface in the as-built survey. Exclude laps, layers, coupons, roll purchases, unaccepted faces and repeated attempts. One accepted patch contributes once."
  - id: native_supply
    applies_to: "liner_supply; anchor_profiles; anchor_fasteners; perimeter_seals; drain_components; additional_geonet; repair_auxiliaries; clean_test_supplies; fuel_supply"
    required_property_ref:
      name: "Actual supplied physical property"
      uuid: ""
    required_unit: "Actual native unit"
    rule: "Preserve actual SKU quantities and units, separating installed final material, wet use/mix, dry constituents, cured state, returns, wastes and releases. No area/length/count-to-mass inference; any independently needed conversion retains actual quantity/unit, density or unit mass, state, temperature and source. Installed retained final material excludes waste, releases and usable returns; wet use/mix activity is nonadditive. Factory composite or kit and constituent purchases are exclusive."
  - id: energy_preservation
    applies_to: "electricity; fuel_supply; bounded_services; shared_assets"
    required_property_ref:
      name: "Actual compatible physical property"
      uuid: ""
    required_unit: "Actual compatible unit"
    rule: "Preserve kWh, actual supplied fuel units, native provider units and measured asset drivers separately; no heat-value or Count surrogate for missing energy/time/service support. Match actual dataset boundaries and independently verify all exchange support."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
