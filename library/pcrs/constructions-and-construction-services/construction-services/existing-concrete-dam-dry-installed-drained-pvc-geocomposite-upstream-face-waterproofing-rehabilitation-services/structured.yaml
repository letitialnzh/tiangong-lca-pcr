allocation_rules:
  - rule_id: a_single
    applies_to: "rehabilitate"
    rule: "One accepted rehabilitation output owns failed attempts, cutoffs, rework, replacement and repeat tests. Rejected sheets, failed welds, loose anchors, leaking perimeter or blocked drains stay off accepted A until closure. Rework remains in rehabilitate with defect/event links; discarded material exits its producing event through waste and usable returns through matched native-unit output. No generic co-product, recycled-material or avoided-dam credit."
    source_ids: []
  - rule_id: a_stock
    applies_to: "rehabilitate"
    rule: "For each actual SKU/unit and period S = opening_stock + gross_receipts - tare - closing_stock, using actual external receipts and carried attributable stocks. Use gross-with-outlets: S retains upstream burdens of actual outward usable returns, nonreturned waste and loss and each outlet is recorded once. If a compatible consumed-only upstream convention is selected, subtract matched outward usable returns once and suppress its duplicate product-output burden/credit; disclose reconciliation. Internal issues are not purchases; closing recovered stock is not an outward outlet."
    source_ids: []
  - rule_id: a_shared
    applies_to: "shared_assets; bounded_services"
    rule: "Each shared access/pump/welder/test asset has a complete all-job/node/period consumer register. Attribute its full manufacture + maintenance + replacement + end-of-life burden using actual compatible job driver / full-life compatible driver, including every consumer. Supply complete observed life or observed history plus evidenced remainder, replacements, termination and end-of-life with uncertainty, sensitivity and update. Missing life coverage or denominator blocks a final dataset. Provider-included assets/utilities/freight/spares and direct resources have one owner, never both."
    source_ids: []
  - rule_id: a_period
    applies_to: "rehabilitate"
    rule: "Attribute each receipt, stock, input, asset use, output and routine/incident event to the actual job, phase and period; transfer balances by stable IDs. Early-period work carries to its eventual unique accepted surface without creating interim accepted area. Exclude unrelated reservoir operation using documented physical driver and period boundary."
    source_ids: []
