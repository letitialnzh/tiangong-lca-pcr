  rules:
    - rule_id: b_route
      applies_to: "rehabilitate"
      rule: "Retain actual qualified concrete substrate and pressure/anchor design. Include actual preparation, local repair, separate cushion/drainage if engineered, field seams, tension, perimeter and drain continuity. Additional geonet is conditional; factory-bonded geotextile is already in the composite."
      source_ids:
        - carpi-dam-rehab
        - cazzuffi-geosynthetic-barriers
    - rule_id: b_gate
      applies_to: "accepted_waterproofing"
      rule: "Actual competent design verifies substrate, anchor pull-out/attachment and pressure-appropriate perimeter. Required actual seam, connection, anchor, perimeter and drain tests must meet approved criteria; repair and retest defects before signed owner handover. Include impoundment/leakage observation only as required by approved actual handover; no brochure guarantee or universal test list."
      source_ids:
        - carpi-dam-rehab
        - cazzuffi-geosynthetic-barriers
    - rule_id: b_resources
      applies_to: "rehabilitate"
      rule: "Own all incremental shutdown/drawdown/dewatering, access, containment, preparation, cleaning, welding, cure, tests, rework, cleanup and actual water fate through acceptance. Providers must disclose paid-for actual resources and coverage; unknown is not zero. Operations after handover are outside this service; no future energy or water saving credits."
      source_ids:
        - carpi-dry-execution
    - rule_id: b_period
      applies_to: "rehabilitate"
      rule: "Index preparation, installation, curing if actual, tests, rework, cleanup and acceptance across every reporting period. Reconcile opening and closing stocks and outstanding defects. Shared assets cover manufacture, maintenance, replacement and end-of-life across all consumers and periods, not this job alone."
