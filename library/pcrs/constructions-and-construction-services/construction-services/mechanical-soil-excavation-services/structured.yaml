  []
measurement_rules:
  - id: reference_volume
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Use accepted original-position volume; retain design revisions and surveyed limits. Exclude unauthorized overbreak and count each accepted void once."
  - id: soil_volume_state
    applies_to: "reusable_soil_handover; waste_soil_handover"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep bank, loose and compacted states distinct. Any mass/volume or moisture conversion requires measured compatible density, moisture and state; never assume a universal bulking factor."
  - id: emission_basis
    applies_to: "engine_species_air; soil_dust_pm25_air; soil_dust_coarse_air"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Preserve chemical species, NOx reporting basis and aerodynamic particle size; inclusive PM10 and PM2.5 cannot both be additive totals."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
