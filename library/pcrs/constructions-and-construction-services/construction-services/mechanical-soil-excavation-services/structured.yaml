    - "soil class and contamination characterization"
    - "excavation depth and geometry/tolerances"
    - "survey and acceptance method"
    - "equipment and fuel route"
    - "loading/on-site relocation responsibility and distance"
    - "handover custodian"
    - "soil reuse/waste destinations"
    - "dewatering/shoring ownership"
