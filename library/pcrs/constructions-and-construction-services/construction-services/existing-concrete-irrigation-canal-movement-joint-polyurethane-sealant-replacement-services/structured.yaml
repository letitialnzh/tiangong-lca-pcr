allocation_rules:
  - rule_id: no_coproduct
    applies_to: "all inventory rows"
    rule: "This service has no assumed sale co-product. Retained concrete, removed old seal and rejected work are not accepted service. Record actual recovered material route separately without automatic substitution credit."
    source_ids: []
  - rule_id: rework_burden
    applies_to: "prepare_joint; reseal_joint"
    rule: "Failed preparation loops within prepare_joint; failed application/adhesion/cure/leakage loops reseal_joint to its actual responsible node. All repeat inputs, protection, tests/removal and exits stay with the job; accepted complete length enters denominator once. Unrepaired defects block acceptance."
    source_ids:
      - sika-pro3-purform-2024
  - rule_id: shared_assets
    applies_to: "prep_assets; apply_assets"
    rule: "Use per-asset physical service drivers justified by actual use (metered operating time or measured activity), enumerating all jobs, nodes and periods. Numerator is actual job service; denominator covers complete observed life or observed service plus evidenced prospective remaining service/replacement/termination/EOL scenario. Include manufacture, maintenance, replacements and EOL once; exclude direct fuel/spares already counted. Missing complete coverage/denominator blocks final dataset."
    source_ids: []
  - rule_id: period_bridge
    applies_to: "all inventory rows"
    rule: "Enumerate removal, application, protected cure, tests/rework and acceptance dates/reporting periods. Carry unfinished-work burden to the accepted job, never release a period-cut uncured output. Assign shared events once by job/node/period. Opening-stock burden plus gross receipts equals attributable used/dispatched burden plus closing-stock carry-forward; disclose returns/wastes and never call closing stock outward flow."
    source_ids: []
  - rule_id: service_overlap
    applies_to: "prep_transport; apply_transport; prep_electricity; apply_electricity; prep_assets; apply_assets"
    rule: "Document provider inclusion matrices; purchased complete service and its included energy/equipment/packaging/logistics are alternative representations. Internal prepared_joint transfer moves burden without purchasing the same complete treatment again."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_prep_material
      process_id: "prepare_joint"
      flow_role: "Distinct materials and stock"
      record_type: "Actual foreground records"
      raw_fields: "job_id; joint_id; period_id; event_id; material_id; formulation; product_revision; lot_id; supplier; state; opening_stock_native; gross_receipt_native; internal_issue_native; outward_return_native; retained_closing_stock_native; native_unit; gross_weight_kg; container_tare_kg; net_content_kg; actual_volume_L; actual_density_kg_per_L; density_temperature_degC; density_state; density_source; backing_length_m; backing_diameter_mm; opening_burden; receipt_burden; closing_carried_burden; inclusion_boundary"
      collection_method: "Record gross external receipts and internal issues without double burden. Weigh gross minus real tare before returns; map each product/lot to outward return, retained stock, installed/consumed material and waste. If mass derived from actual volume, use exact lot/formulation density at recorded temperature/state; if backing use actual m/profile. Link period stock burden and accepted L via cp_accept; divide attributable job-native quantity by L."
      unit: "kg; L; kg/L; degC; m; mm"
      frequency: "Each event/lot and reporting-period reconciliation"
      temporal_coverage: "Whole job including failed attempts through acceptance"
      site_scope: "Actual canal joint and responsible provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibrated scales/meters; supplier/lot instructions; signed custody and stock/burden bridge; no nominal pack density default"
    - protocol_id: cp_prep_utilities
      process_id: "prepare_joint"
      flow_role: "Electricity and distinct fuels"
      record_type: "Actual foreground records"
      raw_fields: "job_id; node_id; period_id; event_id; provider; equipment_id; energy_source; meter_start_kWh; meter_end_kWh; shared_load_driver; fuel_id; fuel_grade; opening_fuel_kg; gross_fuel_receipt_kg; closing_fuel_kg; outward_fuel_return_kg; fuel_waste_kg; recovered_spill_kg; retained_contaminated_residue_outside_stock_kg; whole_uncontained_fuel_kg; fuel_volume_L; fuel_density_kg_per_L; fuel_density_temperature_degC; fuel_density_state; runtime_h; included_service"
      collection_method: "Read actual meters and justified shared-load allocation. Fuel physical ledger identifies all exclusive unburned outlets; recovered spill is counted only at final return/waste/retained destination, never twice. Derive burned fuel separately. Actual volume conversion uses exact density/state/temperature. Assign all cure/pumping/test providers and divide job quantity by accepted L."
      unit: "kWh; kg; L; kg/L; degC; h"
      frequency: "Each event/lot and reporting-period reconciliation"
      temporal_coverage: "Whole job including failed attempts through acceptance"
      site_scope: "Actual canal joint and responsible provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration; tank/receipt/custody evidence; no total-spill extra deduction; service inclusion matrix"
    - protocol_id: cp_prep_logistics
      process_id: "prepare_joint"
      flow_role: "Distinct actual transport legs"
      record_type: "Actual foreground records"
      raw_fields: "job_id; node_id; period_id; leg_id; consignment_id; provider; mode; cargo_id; loaded_gross_kg; vehicle_container_tare_kg; net_cargo_kg; loaded_distance_km; empty_return_distance_km; inclusion_boundary; attribution_driver"
      collection_method: "Match actual consignment and route; cargo kg is gross less vehicle/container tare. Calculate net cargo kg × loaded km per leg; use explicit actual allocation and disclose empty-leg treatment. Divide attributed leg activity by accepted L. Do not add direct vehicle fuel to purchased same-leg service."
      unit: "kg; km; kg*km"
      frequency: "Each event/lot and reporting-period reconciliation"
      temporal_coverage: "Whole job including failed attempts through acceptance"
      site_scope: "Actual canal joint and responsible provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Weighbridge/movement/GPS records; route/provider and included delivery agreement; kg*km support chain"
    - protocol_id: cp_prep_assets
      process_id: "prepare_joint"
      flow_role: "Distinct asset complete-life service shares"
      record_type: "Actual foreground records"
      raw_fields: "asset_id; node_id; job_id; period_id; manufacture_dataset; manufacture_boundary; maintenance_history; replacement_history; end_of_life_route; direct_fuel_spares_excluded; service_driver_unit; job_driver; all_node_job_period_drivers; observed_life_driver; forecast_remaining_driver; forecast_source; termination_replacement_scenario; forecast_EOL_route; uncertainty; sensitivity; update_date"
      collection_method: "For each actual asset inventory manufacture, maintenance, replacements and EOL across complete life. Completed lives use history; in-service life uses observed driver plus evidenced prospective remaining-service scenario and projected replacement/termination/EOL labelled forecast. Allocate job/node driver over full-life total and divide by accepted L; track all consumers and no repeated fuel/spares. Missing coverage/driver evidence blocks finalisation."
      unit: "item; actual declared service-driver unit"
      frequency: "Each event/lot and reporting-period reconciliation"
      temporal_coverage: "Whole job including failed attempts through acceptance"
      site_scope: "Actual canal joint and responsible provider"
      aggregation_rule: "per reference flow"
      quality_evidence: "Asset register/history and justified forecast sources, uncertainty/sensitivity/update; per-asset shares across complete scope sum to one"
