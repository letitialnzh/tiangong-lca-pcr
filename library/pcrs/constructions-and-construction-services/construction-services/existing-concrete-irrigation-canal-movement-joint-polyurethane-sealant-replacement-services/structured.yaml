system_boundary:
  rules:
    - rule_id: retained_host
      applies_to: "all inventory rows"
      rule: "Exclude historic whole-canal construction and future conveyance; include all incremental current removal, minor job-caused remedies, pumping/cleanup, application, protection/cure and required test resources regardless of payer. No avoided-new-canal credit."
      source_ids:
        - un-cpc3-2025
        - sika-pro3-purform-2024
    - rule_id: prepare_gate
      applies_to: "prepare_joint"
      rule: "Input is failed contaminated seal/retained concrete. Remove incompatible residues and loose material, repair actual minor damaged edges, remove dust; sound clean dry faces and geometry require documented release to reseal_joint. Primer does not compensate for poor preparation. Major reconstruction leaves scope."
      source_ids:
        - sika-pro3-purform-2024
    - rule_id: application_gate
      applies_to: "reseal_joint"
      rule: "Input is qualified faces; approved regional system and project-specific adhesion trial cover old residues, movement and water exposure/head/chemistry. Place specified closed-cell PE backing, primer and ready-to-use one-part sealant; tool/protect and verify full required cure, required checks and owner acceptance before water return. No independent mixing or skin-time output."
      source_ids:
        - sika-pro3-purform-2024
        - sika-civil-water-joints
    - rule_id: stock_custody
      applies_to: "all inventory rows"
      rule: "Gross external receipt and internal issue ledgers are distinct. Record outward product returns as real custody exits without first netting input; closing stock is not an output exchange. Opening-stock upstream burden and closing-stock carry-forward accompany physical lots across periods; supplier-included packaging/services are charged once."
