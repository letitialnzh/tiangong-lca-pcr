boundary_abstraction:
  declared_starting_condition: "Existing failed applied joint in retained concrete irrigation canal; authorised isolation/dewatering/access and observed damage/contamination recorded"
  starting_condition_role: "Retained host condition, not purchased new canal; removal/preparation is included foreground work"
  product_classification_scope: "Irrigation waterworks repair under CPC 54234; water-supply and navigation function excluded"
  recursive_input_rule: "A purchased same-category resealing service substitutes its documented owned work; preserve its input boundary and never charge both contractor inventory and included subcontract service"
  upstream_dataset_requirement: "Actual supplied sealant/primer/backing/consumables, utilities, logistics, treatment and allocated assets require compatible upstream datasets with geography/time/technology and inclusion boundaries"
  disclosure: "Identify every provider, host condition, isolation responsibility, incremental pumping/diversion and protection, minor repairs, testing, failures, actual period bridge, and upstream exclusions"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted one-part polyurethane joint resealing service on retained concrete irrigation canal"
    uuid: ""
  flow_property_ref:
    uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
  unit_group_ref:
    uuid: "838aaa22-0117-11db-92e3-0800200c9a66"
  reference_unit: "m"
  required_qualifiers:
    - "irrigation function"
    - "owner/joint ID"
    - "complete accepted centreline L"
    - "movement/width/depth/head/water chemistry"
    - "retained host state"
    - "old/new material compatibility"
    - "approved regional sealant/primer/backing"
    - "preparation and full-cure criteria"
    - "adhesion/leakage requirements"
    - "water-reintroduction authority"
    - providers
    - "reporting periods"
reference_flows:
  []
measurement_rules:
  - id: reference_length
    applies_to: "reference product"
    required_property_ref:
      name: "Length"
      uuid: "838aaa23-0117-11db-92e3-0800200c9a66"
    required_unit: "m"
    rule: "Measure unique accepted centreline L with calibrated tape/survey and joint map via cp_accept; two faces, rod, bead passes and failed attempts never multiply L. Only complete joints meeting the full gate contribute."
  - id: material_state
    applies_to: "sealant_supplied; concrete_primer; repair_mortar; preparation_cleaner; tooling_cleaner"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use gross supplied net-content mass before outward returns, after tare removal. Pack count/nominal volume is not mass; any conversion needs actual quantity, exact product density at stated temperature/state and evidence via cp_prep_material or cp_apply_material."
  - id: backing_length
    applies_to: "polyethylene_backing; backing_returns"
    required_property_ref:
      name: "Length"
      uuid: ""
    required_unit: "m"
    rule: "Collect actual gross backing length and diameter/profile separately from final joint centreline; cuts/overlaps/waste do not alter accepted L."
  - id: transport_activity
    applies_to: "prep_transport; apply_transport"
    required_property_ref:
      name: "mass*distance"
      uuid: ""
    required_unit: "kg*km"
    rule: "For each leg multiply actual net cargo kg excluding vehicle/container tare by loaded distance km. kg*km is native; 1 t*km = 1000 kg*km only using verified unit support and actual leg basis."
  - id: energy_preservation
    applies_to: "prep_electricity; apply_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Keep measured electricity kWh without inferring Energy UUID from calorific-value properties. Confirm actual supplier exchange support before final dataset."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: prepare_joint
    name: "Remove failed seal and qualify concrete joint faces"
    inclusion: "required"
    inclusion_condition: "Every in-scope replacement; minor repair/cleaning/pumping resources conditional on actual work"
    role: "material_treatment_responsibility"
    quantitative_reference: "Measured prepared joint centreline handed to reseal_joint; not final accepted output"
  - id: reseal_joint
    name: "Apply system, protect full cure and accept joint"
    inclusion: "required"
    inclusion_condition: "Every in-scope replacement; required trials/tests and rework owned here"
    role: "surface_or_property_finishing_responsibility"
    quantitative_reference: "1 m accepted resealed joint centreline from complete accepted joint L"
process_inventory:
  - id: prepare_joint
    label: "Remove failed seal and qualify concrete joint faces"
    inputs:
      product:
        - row_id: preparation_water
          role: "Supplied water for actual preparation or leakage-related cleanup"
          name: "Supplied water for actual preparation or leakage-related cleanup"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Record only actual purchased/supplied water crossing preparation boundary for flushing after actual cutting, cleanup or incremental dewatering support. Retained canal water is not automatically supplied product water. Distinguish abstracted environmental water in a separate actual exchange if used. Range evidence need: Actual metered/weighted job water and preparation method, including density if converting volume; no per-metre default."
          amount:
            expression: "Actual supplied water kg / L; meter volume needs actual water density and temperature/state evidence."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_prep_material
              source_ids:
                - sika-pro3-purform-2024
            ranges: []
        - row_id: repair_mortar
          role: "Actual compatible minor joint edge repair material"
          name: "Actual compatible minor joint edge repair material"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Include only actual local minor edge repairs needed for this seal renewal. Split differing mortar/resin components and actual mixing water; substantial structural reconstruction is outside scope. Observe actual material cure before face qualification. Range evidence need: Actual damaged volume, approved repair product and gross receipt/issue/outlet records; no universal mortar quantity or assumed density."
          amount:
            expression: "Gross net-content kg supplied for actual minor repair / L."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_prep_material
              source_ids:
                - sika-pro3-purform-2024
            ranges: []
        - row_id: prep_electricity
          role: "Actual preparation electricity supply"
          name: "Actual preparation electricity supply"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Meter cutting/grinding, extraction, cleaning and actual incremental pumping/drying attributable to preparation, identifying provider and electricity source. Purchased complete service cannot also carry its included electricity. Range evidence need: Actual meters, operating intervals, provider boundaries and measured shared-load attribution; no default power or operating time."
          amount:
            expression: "Attributed metered preparation kWh / L."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_prep_utilities
              source_ids: []
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: prepared_joint
          role: "Qualified existing concrete irrigation canal joint faces"
          name: "Qualified existing concrete irrigation canal joint faces"
          flow_type: "product"
          property_unit: "Length / m"
          description: "Internal service handoff after removal of failed sealant/contamination, actual minor remedies and dust, verified sound clean dry concrete and geometry, with trial/compatibility conditions assigned to application. Retained concrete is not newly produced mass. Range evidence need: Actual mapped prepared length and face/geometry release record; may exceed accepted length through excluded/failed portions, so no assumed 1:1 quantity."
          amount:
            expression: "Measured released prepared centreline m / L; retain failed/repeated preparation quantities in event ledger."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_prepare_gate
              source_ids:
                - sika-pro3-purform-2024
            ranges: []
      waste:
        []
      elementary:
        []
  - id: reseal_joint
    label: "Apply system, protect full cure and accept joint"
    inputs:
      product:
        - row_id: qualified_joint_input
          role: "Qualified existing concrete irrigation canal joint faces"
          name: "Qualified existing concrete irrigation canal joint faces"
          flow_type: "product"
          property_unit: "Length / m"
          description: "Same actual prepared service handed from prepare_joint, with mapped centreline/face release. This internal link carries preparation burden once; never purchase its duplicate full service while also including its component inventory. Range evidence need: Actual signed prepared/received length and unreleased/rework exclusions; no fixed equality to final 1 m."
          amount:
            expression: "Actual received qualified centreline m / L with same event/lot as prepared_joint."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_apply_gate
              source_ids:
                - sika-pro3-purform-2024
            ranges: []
        - row_id: sealant_supplied
          role: "Actual one-part moisture-curing polyurethane sealant supplied"
          name: "Actual one-part moisture-curing polyurethane sealant supplied"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Gross wet supplied formulation remains distinct from cured retained seal. Record approved regional product and lot, shelf/storage state and actual supplier boundaries. Neither generic polyurethane resin nor low monomer/VOC label establishes supplied identity or release quantity. Range evidence need: Actual wet formulation issue weights, returns, retained stock and wet-to-cured mass/reaction evidence needed; NZ density/pack metres are not universal."
          amount:
            expression: "Gross actual net-content wet sealant kg supplied from receipt/stock lot / L."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_apply_material
              source_ids:
                - sika-pro3-purform-2024
            ranges: []
        - row_id: concrete_primer
          role: "Actual compatible concrete joint primer formulation"
          name: "Actual compatible concrete joint primer formulation"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Use the project-approved concrete primer for the actual regional system, separately from cleaning liquid and sealant. NZ PDS names Primer-3 N for concrete; actual primer instruction/flash-off and compatibility are collected rather than assumed across regions. Range evidence need: Actual primer formulation, issue/return weights, wet solids/volatile data and approved application/flash-off record needed."
          amount:
            expression: "Gross actual net-content primer kg supplied / L."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
