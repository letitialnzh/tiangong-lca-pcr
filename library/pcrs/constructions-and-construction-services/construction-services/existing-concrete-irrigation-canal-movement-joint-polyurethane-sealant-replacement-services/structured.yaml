      rule: "Use gross fuel input when returns/waste/releases are separately represented; burned fuel is derived after mutually exclusive unburned outlets/stock. Total spill is audit only; partition recovered, treated, retained outside closing stock and whole uncontained fluid, never deduct total again. Whole fluid kg is the physical incident/fuel ledger; elementary exchanges require identified constituents/media with measured species or evidenced composition/fate fractions. Whole-fluid and partial species views are nonadditive. Retained contaminated residue outside closing stock is a mutually exclusive outlet; never subtract it again when already in closing stock."
