functional_unit:
  what: "A completed non-loadbearing fired-clay brick interior partition construction service"
  how_much: "1 m2 of net unique finally accepted single-plane wall surface; openings excluded once; both faces not counted twice"
  how_well: "Meets the actual signed project design and supplier compatibility for wall geometry, support/restraint/slip/head details, lintels, movement/fire/acoustic closure, joint finish and acceptance; no universal fire/acoustic rating is inferred"
  how_long_or_cycle: "One actual construction lot from released entry through final acceptance; enumerate receipt, preparation, laying, protection/setting, cleaning/correction and acceptance periods with actual cutoffs, no fixed curing days or asset life"
