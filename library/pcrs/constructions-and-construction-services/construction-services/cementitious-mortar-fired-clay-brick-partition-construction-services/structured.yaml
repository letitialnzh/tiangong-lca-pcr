      rule: "Conditional unchanged-state Mass/kg dispatch from receive_setout to lay_joint, covering the actual material roles in component ledgers issue_bricks, issue_restraint_components. Expand the actual schedule into zero, one or many exchanges, each with its real material/SKU, composition, current state, measured component kg, transfer event, sender/recipient and concrete independently verified UUID when resolved. The umbrella is not a fixed mixed product and the mass of several materials is not an identity. Retain each original component quantity calculation and match the same-SKU/current-state recipient input; no repeated purchase or new upstream production burden. Each instantiated exchange uses its own actual SKU/state/concrete-identity numerator/A; the separately named diagnostic role total is only a reconciliation view: do not publish an aggregate exchange in addition to its instantiated components. Unknown component identity/quantity or custody link remains a gap; no guessed UUID, automatic sum of quantities."
