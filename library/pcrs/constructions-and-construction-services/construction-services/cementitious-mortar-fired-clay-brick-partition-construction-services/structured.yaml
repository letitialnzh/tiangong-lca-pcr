          column: 1
      markdown: "## 9. Validation Rules\n\nValidation evaluates declared route, ownership and evidence, preserving performed/skipped checks and uncertainty. Missing identities or quantities stay disclosed in their actual roles, never become zero or generic substitutes. A mathematical or structural check cannot alone certify physical design, external flow identities or publication readiness:\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `validation_gate` | scope_and_final_output | Confirm released entry design and final as-built completeness for all actual compatible restraints, lintels, movement/fire/acoustic closures and protection/cure/cleaning. Exclude unresolved panels from accepted A and retain their WIP/correction evidence. | `bda-workmanship-2023`; `ancon-restraint-interface` |\n| `validation_geometry` | area_and_mass | Require A > 0 from the union of finally accepted single-plane surfaces with openings excluded once. Neither two faces, repeated acceptance forms nor rework passes multiply A. Physical interface area is observational and cannot enter a kg balance or imply newly supplied structure. |  |\n| `validation_material` | gross_stock_and_transfers | Reconcile each material/SKU/state ledger from opening and external receipts through all-location intact closing stock, actual issues, own receipt waste/usable exits and exclusive WIP. Pair issue/feed by event, quantity, state and custody. All unissued future-lot stock remains in receipt custody wherever stored; no repeated purchase or second stock subtraction. |  |\n| `validation_units` | conversion_and_measured_absence | Require exact same-SKU/current-state count/length/area-to-kg bridges, calibrated units and explicit composition/whole-versus-component ownership. Never sum mixed dimensions. Prove nonoccurrence before zero; missing records and conditional activation uncertainty remain gaps. |  |\n| `validation_water` | mix_lay_cure | Check own-node time/state-exclusive water pools against actual gross supplied water and attached incoming water. Remove fresh closing intact once only. Separate actual handoff, final bound/free retention, wastes, liquid releases, usable exits and processed WIP. H2O to air unspecified needs actual validated evaporation; a residual or hydration state change is insufficient. | `bda-mortar-2023` |\n| `validation_release` | elementary_output_roles | Require actual outgoing substance/particle basis and receiving medium for direct releases; prevent captured-dust/waste duplication. Output release cards cannot represent uptake. Any evidenced uptake needs its own reviewed input semantics; no default carbonation or universal dust identity. |  |\n| `validation_meter` | meter_topology_and_service | Audit meter reading serial, source interval, factors, parent topology and complete eligible consumer set; check residual arithmetic, inside/outside boundary, zero-residual exception and aggregate reconciliation. Service h needs actual provider/contract unit and period, never an assumed shift or labour proxy. Negative or unknown residual blocks attribution and requires resolving reading/interval/topology/service evidence; never allocate, clip or convert it to a credit. Only a positive residual is allocated using a complete eligible consumer set and positive weight denominator. Exactly zero needs no weights after completeness is established. |  |\n| `validation_rework` | all_reject_routes | Each rejection has an actual state, owner and path: rework, documented usable exit, recovery/downgrade with reviewed burden treatment, waste or retained WIP. Match loop events and preserve all actual corrections. An unresolved rejected surface does not become final accepted output. | `bda-workmanship-2023` |\n| `validation_periods` | period_asset_event_linkage | Enumerate all lot phases and periods and link inputs, assets, outputs and correction/replacement/termination events. Review period-specific attribution and prevent duplicate carryover of burdens or accepted geometry. Unresolved replacement or termination ownership blocks finalization. |  |\n| `validation_quality` | ranges_and_identity | Treat all provisional reasoned_estimate ranges as review screens only. They are not empirical factors, acceptance limits or permission to use a missing value. Verify actual exchange identity and property/unit separately from quantity evidence; unresolved provider/material/species and Duration/Energy support remain explicit review gaps. |  |\n\n"
