    - id: calc_accepted_area
      applies_to: "cure_accept"
      rule: "A = UNION_AREA(cure_accept_accepted_surface_polygons, cure_accept_opening_polygons, cure_accept_excluded_surface_polygons, cure_accept_geometry_unit_factor) after cure_accept_final_acceptance_status and cure_accept_gate_component_completeness_ref confirm the gate. Union accepted single-plane surface polygons, exclude opening and unaccepted surface polygons once, and convert to m2 using the actual survey scale. A must be positive. Count repeated forms or remedial passes once in geometry but retain their physical burdens. UNION_AREA definition: Area of unique accepted single-plane surface union minus openings and excluded/unaccepted polygons once, converted using actual survey unit evidence."
      inputs:
        - cure_accept_accepted_surface_polygons
        - cure_accept_opening_polygons
        - cure_accept_excluded_surface_polygons
        - cure_accept_geometry_unit_factor
        - cure_accept_final_acceptance_status
        - cure_accept_gate_component_completeness_ref
        - cp_cure_accept
        - UNION_AREA
      output: "A"
      source_ids: []
    - id: calc_base_design_interface
