    - rule_id: system_boundary_rule_178
      applies_to: "foreground_system_boundary"
      rule: "The 40 kg/m2 upper screen for receipt packaging waste to custodian is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Only actual own receiving discard is included; downstream remedial removal stays at its actual producing node unless a real changed-state custody handoff is reviewed; the quantity still must reconcile to the matching material and water ledger. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value. Only material-resolved packaging physically opened/discarded during receipt belongs here; intact/reusable packaging returns and packaging discarded after an actual downstream issue have their own fates. No mortar or wall-removal mass is packaging waste. Actual rework or a custody return can affect this node only with independently evidenced real current-state transfer and reviewed compatible route/ownership; downstream removal stays with its actual producing node and is never reassigned merely by a waste name."
      source_ids: []
    - rule_id: system_boundary_rule_179
