al_receive_nonbrick_material_waste. The actual numerator and normalized amount apply to one selected actual SKU/state/concrete-identity exchange only. The separately named diagnostic sum is a reconciliation view over disjoint actual per-SKU/current-state component events, not a mixed-product/waste identity or an additional exchange. receive_material_waste_actual_component_exchange_records must identify every concrete material/SKU/state, measured kg, actual event/phase/disposition and custody/recipient, independently verified concrete UUID or explicit identity gap, and the matching original ledger role. Reconcile that schedule to both original component outputs; unknown or unmatched components block the affected handoff/waste conclusion. Do not automatically assume either component quantity, add the aggregate to components, repeat purchase. EXCHANGE_COMPONENT_MASS definition: For one actual instantiated exchange identified by the recorded exchange key, select and sum only its measured events from the original component ledgers. The key includes actual material/SKU/composition, current state, physical_event_id or a documented same-SKU/state/concrete-identity aggregation of deduplicated physical events over the lot, concrete independently verified UUID when resolved, and actual custody/recipient; waste also includes phase, custodian and treatment destination. Reconcile selected event portions to their matching source component outputs, with nonnegative portions not exceeding the physical source carrier and no overlap. Return that one concrete exchange numerator in Mass/kg, never the mixed role total. Only actual kg component operands are eligible; length, area, count and existing-interface observations cannot be summed here. Any native-unit conversion must already have the measured same-SKU/current-state mass bridge. Expand the actual schedule into zero, one or many exchanges without inventing identity or quantity. Unknown key, component amount or custody/destination remains a gap. A separately named diagnostic role sum is for reconciliation only and is not another exchange."
