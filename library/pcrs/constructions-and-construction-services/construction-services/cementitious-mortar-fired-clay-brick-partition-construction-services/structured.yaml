  classification_refs: "cpc:3.0:54560; classification reference only"
  covered_products: "Accepted construction service for non-loadbearing fired-clay brick interior partition using factory dry cementitious premix and actual supplied water, with all actual construction-owned compatible ancillary details"
  excluded_products: "Loadbearing/exterior/cavity masonry; lime-only and site raw-component mortar recipes; brick/premix/base manufacturing operations; paint/plaster finishes"
