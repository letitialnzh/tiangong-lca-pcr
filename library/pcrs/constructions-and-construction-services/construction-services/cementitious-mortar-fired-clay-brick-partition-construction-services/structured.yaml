      rule: "Process / prospective direction / type: receive_setout / outputs / waste."
      source_ids: []
    - rule_id: system_boundary_rule_180
      applies_to: "foreground_system_boundary"
      rule: "Conditional material-resolved receipt waste produced by receive_setout before actual downstream issue: fired-clay brick and actual dry premix, ancillary, protection or cleaning/remedial materials, in their measured real phase/current moisture/state. Expand each actual SKU/state/disposition/custodian/treatment destination into its own measured concrete waste exchange and independently verify its UUID only when actual identity evidence exists. Keep the original brick and non-brick component ledgers and their quantities in receipt material pools exactly once. Exclude packaging waste, usable supplier returns or external transfers, intact stock/WIP and downstream construction/remedial removals. A downstream removal stays with its actual producing node unless a real changed-state custody handoff has been reviewed; no such handoff is inferred. The umbrella is not one fixed mixed waste identity; each actual composition/state/custodian exchange has its own numerator/A, while a separately named diagnostic reconciliation view and its components are not separate additive exchanges. Unknown phase, quantity, identity or destination remains a gap."
      source_ids: []
