      rule: "actual_receive_nonbrick_material_waste = EVENT_SUM(receive_nonbrick_material_waste, cp_receive_setout) in actual Mass/kg, with each discarded material converted only by its same-SKU/current-state measured bridge; q_receive_nonbrick_material_waste = actual_receive_nonbrick_material_waste/A. Include all actual non-brick pre-issue receipt discards once, preserve every real occurrence and exclude duplicate electronic records. Brick waste, packaging waste, usable exits and stock/WIP have separate exclusive fates. Actual absent discard requires evidence; unknown amount stays missing. EVENT_SUM definition: Use the declared inventory-role or explicitly registered component-ledger selector and that role's own protocol raw fields to sum actual physical event amounts once after exact typed conversion. The ledger selector is not another inventory card or product identity. Duplicated electronic records collapse by physical event/revision; every real repeated work/correction event is retained. A component ledger is reconciled within its conditional umbrella, never also added as a separate umbrella exchange. The selector receive_nonbrick_material_waste is the original per-material/SKU/current-state component ledger inside receive_material_waste, not a separate inventory card. Preserve its physical event, quantity, phase/disposition and custody evidence; concrete exchanges instantiate only the umbrella once. No aggregate-plus-component exchange, purchase or credit is permitted."
