_whole_or_components_partition_ref), cure_accept_final_retained_bound_water_kg_water_portion_records). Each source card/output/event and actual state/time is retained in the portion record. Only measured bound water retained in the final accepted wall state; no default stoichiometry or hydration yield and no duplicate customer handover. Measured water kg or a measured same-state water fraction is required; a total wet mass is not water mass. Bound/free pools, source whole OR constituents and other fates are exclusive. Unknown water content blocks closure.; cure_water_vapour_final_retained_free_water_kg = WATER_PORTION(WALL_COMPONENT_MASS(accepted_partition_service_measured_component_mass_records, accepted_partition_service_same_state_mass_bridge_ref, accepted_partition_service_whole_or_components_partition_ref), cure_accept_final_retained_free_water_kg_water_portion_records). Each source card/output/event and actual state/time is retained in the portion record. Only measured free water retained in the final accepted wall state, exclusive of bound water and all other ending pools. Measured water kg or a measured same-state water fraction is required; a total wet mass is not water mass. Bound/free pools, source whole OR constituents and other fates are exclusive. Unknown water content blocks closure.; cure_water_vapour_solid_waste_water_kg = WATER_PORTION(actual_cure_solid_waste, cure_accept_solid_waste_water_kg_water_portion_records). Each source card/output/event and actual state/time is retained in the portion record. Only measured water within material discards/captured residues; material-resolved source waste retains current moisture, not a total-as-water assumption. Measured water kg or a measured same-state water fraction is required; a total wet mass is not water mass. Bound/free pools, source whole OR constituents and other fates are exclusive. Unknown water content blocks closure.; cure_water_vapour_aqueous_waste_water_kg = WATER_PORTION(actual_cure_wastewater, cure_accept_aqueous_waste_water_kg_water_portion_records). Each source card/output/event and actual state/time is retained in the portion record. Only actual water portion of collected wastewater, excluding suspended solids and other solutes; no duplicate direct release. Measured water kg or a measured same-state water fraction is required; a total wet mass is not water mass. Bound/free pools, source whole OR constituents and other fates are exclusive. Unknown water content blocks closure.; cure_water_vapour_direct_liquid_release_water_kg = WATER_PORTION(actual_cure_other_release, cure_accept_direct_liquid_release_water_kg_water_portion_records). Each source card/output/event and actual state/time is retained in the portion record. Only actually released outgoing liquid H2O component in an evidenced receiving medium, exclusive of vapour, other substances and collected wastewater. Measured water kg or a measured same-state water fraction is required; a total wet mass is not water mass. Bound/free pools, source whole OR constituents and other fates are exclusive. Unknown water content blocks closure.; cure_water_vapour_other_exclusive_water_exit_kg = EVIDENCED_ZERO(cure_accept_other_exclusive_water_exit_absence_records). Own-node full-period absence evidence; any actual nonzero or unknown other_exclusive_water_exit blocks closure and needs explicit role/path review. All water entries and endings are exclusive by actual source material/event/state/time and measured portion lineage. Fresh gross equals the own supplied-water card numerator, with intact fresh closing stock already excluded once. No fresh stock subtraction appears again. WATER_PORTION definition: As PORTION_MASS, but return only measured water kg in the same source event/current state, identifying bound/free form, medium and supplied-versus-process-water origin. A wet waste total is not pure water. Multiple water pools partition the same source mass without overlap; unknown content remains a gap. Water portions and their exclusive sum cannot exceed the actual physical carrier. WALL_COMPONENT_MASS definition: Return separately measured actual same-panel/current-state whole-wall mass OR measured constituent masses from the source area card bridge records, with event/panel/lot and paired handoff or final acceptance evidence. Require the whole-or-components partition and measurement bridge; never use area as a kg addend or an assumed density/recipe factor. Source area output identifies geometry only. WIP_WATER definition: Select measured water content of the exact processed WIP records used by WIP_MASS, by source event/current state/time, with bound/free and uncertainty. Do not include intact fresh closing stock, handoff, accepted retention or other exit pools again. EVIDENCED_ZERO definition: Return zero only when the named own-node absence records demonstrate that no such actual pool exists for the full lot/period. Unknown, missing or nonzero records block closure and require the actual role and path to be reviewed, never conceal it in a balancing amount. PORTION_MASS definition: Select only the recorded exclusive material/event/state portion of the named unnormalized source-card kg output. Portion records declare source_card_id, source_calc_output, physical_event_id, material/SKU, current state, period, measured portion kg or fraction with method/uncertainty, and exclusive destination. Partitioned portions must reconcile to the source output; unknown shares block closure. No area, composite-plus-constituents or already normalized value enters kg arithmetic. Each individual portion is nonnegative and cannot exceed its actual physical carrier; exclusive portions of one carrier together cannot exceed that carrier. Missing values are not zero. WIP_MASS definition: Sum actual opening/closing processed-stock observations by own card, source amount/event, material/SKU/state, period and custody. Records link prior closing stock or current retained event and distinguish intact unissued stock already removed in gross draw. Wall WIP requires the same measured whole-or-components kg bridge. Unknown quantities/ownership block closure."
      inputs:
