      rule: "cure_accept_water_gap_kg = cure_water_vapour_gross_fresh_draw_kg + cure_water_vapour_internal_received_water_kg + cure_water_vapour_material_bound_and_free_entry_water_kg + cure_water_vapour_opening_processed_water_kg - cure_water_vapour_unused_fresh_exit_kg - cure_water_vapour_next_handoff_water_kg - cure_water_vapour_final_retained_bound_water_kg - cure_water_vapour_final_retained_free_water_kg - cure_water_vapour_solid_waste_water_kg - cure_water_vapour_aqueous_waste_water_kg - cure_water_vapour_direct_liquid_release_water_kg - cure_water_vapour_closing_processed_wip_water_kg - cure_water_vapour_other_exclusive_water_exit_kg - actual_cure_water_vapour. Every pool is a calculated output of calc_cure_accept_water_pools with exact own-card/output/portion lineage. The gross fresh draw equals actual_cure_water and has already removed intact fresh closing stock. Unused fresh exits are only the measured supplied-water portion of actual_cure_unused_return. No second fresh-stock subtraction. Incoming water attached to mortar/brick is either internal_received_water or material_bound_and_free_entry_water, never both. At an intermediate handoff bound/free water is in next_handoff_water, not also final_retained water. At final acceptance final_retained contains water once and no duplicate customer handover. Each waste/exit/WIP water fraction belongs to exactly one current state/time pool per cure_water_vapour_pool_partition_ref; compare gap with cure_water_vapour_uncertainty_kg. Hydration changes bound/free state but not total retained water mass. Missing state evidence remains a finding, not evaporation."
