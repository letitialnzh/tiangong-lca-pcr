      rule: "Independently chosen provisional 0..600 kg/m2 screen for actual material discard owned by receipt. This is not a sum of the former brick and non-brick limits, an empirical reject fraction, a default waste amount or a permitted removal allowance. It screens only actual own receiving waste before issue, by measured SKU/state/phase and destination; downstream remedial removal remains at its producing node without a reviewed real changed-state custody handoff. Zero requires actual nonoccurrence evidence; unknown remains missing and a measured exceedance requires explanation, not clipping. Apply this screen to each actual instantiated exchange numerator/A; the separately named diagnostic role total has no inventory Range and is not substituted for a component amount. Only actual own receipt material discard before issue is in this role, using the real composition/SKU/current state/phase and custodian/treatment destination. Packaging, usable returns/transfers, stock/WIP and downstream wall removals remain separate. Actual rework or a custody return can affect this node only with independently evidenced real current-state transfer and reviewed compatible route/ownership; downstream removal stays with its actual producing node and is never reassigned merely by a waste name."
