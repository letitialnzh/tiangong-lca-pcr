allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "own_node_materials"
    rule: "Use directly measured node/material/event quantities before allocation. Internal issues and feeds transfer quantities and existing burdens; they are not new purchases, co-products or additional final services."
    source_ids: []
  - rule_id: allocation_usable_exits
    applies_to: "positive_original_unused_exits"
    rule: "Keep gross receipt/draw quantities including usable original-unused exits, and record those exits positively by same grade/current state and recipient. Separate the original upstream material burden attributable to the exit when supported; retain all construction/rework burdens with the lot. A net-use diagnostic may subtract exits once for reconciliation only: it is not another exchange or negative credit. No avoided-production claim is created."
    source_ids: []
  - rule_id: allocation_power
    applies_to: "four_node_electricity"
    rule: "Apply direct converted meter deltas first. Calculate the actual master residual after subtracting every inside-master direct assignment once, excluding outside-master direct loads from subtraction. Zero residual needs no weights. Allocate a positive residual only over all eligible consumers with a positive denominator and causal evidence; reconcile aggregate assignments to actual master/direct totals once. Negative or unknown residual blocks attribution and requires resolving reading/interval/topology/service evidence; never allocate, clip or convert it to a credit. Only a positive residual is allocated using a complete eligible consumer set and positive weight denominator. Exactly zero needs no weights after completeness is established."
    source_ids: []
  - rule_id: allocation_service
    applies_to: "four_node_access_service"
    rule: "Identify every shared scaffold/hoist/extraction/protection asset, provider/service boundary and consuming node/period. Assign direct actual availability first, then only the residual of the same service interval using a complete eligible positive denominator and recorded causal basis. Actual owned idle and rework remain included. No labour proxy, presumed shift, whole asset repurchase or invented life applies. Negative or unknown residual blocks attribution and requires resolving reading/interval/topology/service evidence; never allocate, clip or convert it to a credit. Only a positive residual is allocated using a complete eligible consumer set and positive weight denominator. Exactly zero needs no weights after completeness is established."
    source_ids: []
  - rule_id: allocation_period
    applies_to: "all_event_periods"
    rule: "Carry cutoff intact stock and processed WIP with their exact custody and period links. Maintain recorded attribution decisions for shared assets, replacements and termination by period; close overlaps and gaps before finalization. The same purchase, meter delta, service interval or event cannot be assigned again in the next period."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "rejected_and_corrected_states"
    rule: "Retain every actual correction event and link any loop to its producing and receiving nodes. Distinguish usable original goods, rework material, discarded waste and unresolved WIP. Repeated physical work remains in the numerator; only unique finally accepted geometry enters A. A downgraded/recovered destination needs actual evidence and a reviewed burden decision, not an assumed credit."
    source_ids:
      - bda-workmanship-2023
