      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Released existing physical base/support geometry with signed design and a resolved newly-installed-versus-existing component schedule |\n| starting_condition_role | Received external physical quality/interface condition; geometry is observational, documents are evidence, neither is a new material purchase |\n| product_classification_scope | The semantic interior non-loadbearing fired-clay brick construction service defined here, independent of external classification hierarchy |\n| recursive_input_rule | A same-category purchased completed partition or inherited unresolved partly built wall is not silently unfolded into this route. Record its supplied state and upstream owner; require a scope review before changing the starting gate or duplicating its construction inventory. |\n| upstream_dataset_requirement | Connect each actual external material/water/provider and waste route to an appropriate reviewed upstream dataset once. Internal material/feed and geometry handoffs carry existing ownership; document supplier packaging coverage and any separate residual packaging burdens. |\n| disclosure | Publish exact route, entry/release and acceptance gates, actual component ownership and product instructions, period/custody/WIP boundaries, upstream dataset coverage, allocation decisions and unresolved quantity/identity/measurement gaps |\n\n### Boundary Rules\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_entry` | entry_gate | Begin with an accepted physical base and released signed partition design. Require the exact brick/premix compatibility, geometry/openings, support loading, bottom/slip/head/lateral details, lintels, movement/fire/acoustic closures and temporary support ownership before work enters this route. An unresolved owner or compatibility is a gap. | `bda-workmanship-2023`; `ancon-restraint-interface` |\n| `boundary_work` | all_four_nodes | Include receipt/storage losses, actual factory-premix mixing, laying/cutting, designed ancillary integration, joint tooling, protection, cementitious setting, cleaning, actual corrections and final acceptance. Generic guidance lacking a detail never permits its omission from the actual work package. | `bda-workmanship-2023`; `bda-mortar-2023` |\n| `boundary_composition` | mix_mortar and cure_accept | The mix responsibility combines the exact factory dry cementitious premix and actual supplied water, handing over actual wet mortar. The cement-water reaction continues in its actual observed state through accepted wall handoff. Preserve bound/free water, unreacted/unused inputs, losses and off-spec states; infer neither a chemical pathway nor a yield or CO2 uptake. | `bda-mortar-2023` |\n| `boundary_assembly` | lay_joint | Join actual fired-clay bricks, wet mortar and every required compatible ancillary to the released existing interface. The intended uncured wall and its constituent state pass to cure_accept; rejected assemblies, cuts and losses retain their own dispositions and producing-node responsibility. | `bda-workmanship-2023`; `ancon-restraint-interface` |\n| `boundary_finishing` | lay_joint and cure_accept | Joint tooling is an explicit finishing responsibility within laying after a parent laid wall exists. Record parent state, actual tooling/closure inputs and finished uncured handoff. cure_accept owns later protection/cleaning and actual remedial finishing through accepted output, with residues and releases assigned to the producing node. No decorative coating or plaster is included by implication. | `bda-workmanship-2023` |\n| `boundary_receipt` | staged_materials_and_packaging | One external gross receipt owner supplies each staged material and its carried packaging. Preserve own receipt rejection/usable exits and match real issue to downstream internal feed. Supplied water enters only its actual using node. Packaging upstream dataset coverage is counted once; waste, reusable exits and stock have material-specific owners. |  |\n| `boundary_periods` | lot_and_shared_assets | Enumerate the actual receipt, mix, laying, protection/cure, cleaning/correction and acceptance periods, with cutoff stock, WIP, assets, replacement/termination events and every consumer linked to each period. Use actual boundaries and ownership; no assumed construction day, service life or annualization. |  |\n| `boundary_exclusions` | external_interfaces | Exclude manufacture of bricks/premix and pre-existing base/structure from foreground operations but connect actual upstream datasets once at external material entry. Exclude lime-only/site raw-recipe mortars, loadbearing/exterior/cavity wall routes, painting/plaster, structural base manufacture and use/end-of-life beyond acceptance. A changed incoming state or newly owned excluded operation requires scope review. | `bda-workmanship-2023`; `bda-mortar-2023` |\n| `boundary_atomic_completion` | all processes | Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry. |  |\n\n### Conditional inventory completion requirements\n\nThe following identifiers denote collection pools or documentary state ledgers. A pool may have zero, one or several actual members. Determine applicability from real records; retain the original quantity method and collection protocol for each member. Only compatible quantities may be reconciled together. Any old optional screening interval below remains a provisional aid for review and must not be imposed on a different material or on a mixed pool.\n\n#### Collection requirement: Packaging and handling materials used for receipt (`receive_packaging`)\n\nProcess / prospective direction / type: `receive_setout` / `inputs` / `product`.\n\nAccount for actual wrapping, bags, liners, pallets and handling protection at receipt by composition and custody. This includes packaging still attached to materials issued later. Record whether its manufacture is already covered by each supplier dataset before adding any separate production burden.\n\n- Collection subject: Packaging and handling materials used for receipt\n- Flow property / unit: Mass / kg\n- Amount rule: actual_receive_packaging/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 40\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 40 kg/m2 upper screen for packaging and handling materials used for receipt is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. It screens gross draw with losses and usable exits retained, not net installed material or a prescribed consumption rate. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Attributable access, shared plant and support service for receive, survey and set out the designed partition (`receive_setout_access_service`)\n\nProcess / prospective direction / type: `receive_setout` / `inputs` / `product`.\n\nRecord actual owned availability of access equipment, hoists, scaffolds, extraction or support plant for this node, including its attributable idle and remedial periods. Evidence must define the service unit and provider boundary. Actual contract service allocation cannot be replaced by human labour hours, an eight-hour shift or an assumed asset lifetime.\n\n- Collection subject: Attributable access, shared plant and support service for receive, survey and set out the designed partition\n- Flow property / unit: Duration / h\n- Amount rule: actual_receive_setout_access_service/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 100\n  - Unit: h\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 100 h/m2 upper screen for attributable access, shared plant and support service for receive, survey and set out the designed partition is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Actual paid availability can exceed active work time and vary with access sharing; the bound is neither a labour allowance nor a shift assumption. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: External receipt of designed partition restraint, lintel and closure components (`receive_restraint_components`)\n\nProcess / prospective direction / type: `receive_setout` / `inputs` / `product`.\n\nRecord the sole external material entry for every actual newly installed restraint, fixing, lintel, reinforcement and movement/fire/acoustic closure at receipt. Opening and final intact stock cover every custody location, including unissued future-lot goods at the point of use. Gross draw retains receipt rejection and usable exits; later internal issue does not create another acquisition.\n\n- Collection subject: External receipt of designed partition restraint, lintel and closure components\n- Flow property / unit: Mass / kg\n- Amount rule: actual_receive_restraint_components/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`; `ancon-restraint-interface`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 150\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 150 kg/m2 upper screen for external receipt of designed partition restraint, lintel and closure components is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. It screens gross draw with losses and usable exits retained, not net installed material or a prescribed consumption rate. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: External receipt of temporary protection and support service consumables (`receive_protection_material`)\n\nProcess / prospective direction / type: `receive_setout` / `inputs` / `product`.\n\nRecord the sole external material entry for actual covers, hessian and consumed protection articles distinguished from reusable service assets at receipt. Opening and final intact stock cover every custody location, including unissued future-lot goods at the point of use. Gross draw retains receipt rejection and usable exits; later internal issue does not create another acquisition.\n\n- Collection subject: External receipt of temporary protection and support service consumables\n- Flow property / unit: Mass / kg\n- Amount rule: actual_receive_protection_material/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 40\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 40 kg/m2 upper screen for external receipt of temporary protection and support service consumables is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. It screens gross draw with losses and usable exits retained, not net installed material or a prescribed consumption rate. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: External receipt of actual cleanup or specified closure repair consumables (`receive_cure_cleaning_material`)\n\nProcess / prospective direction / type: `receive_setout` / `inputs` / `product`.\n\nRecord the sole external material entry for actual formulation-resolved cleaning and remedial products under the approved procedure at receipt. Opening and final intact stock cover every custody location, including unissued future-lot goods at the point of use. Gross draw retains receipt rejection and usable exits; later internal issue does not create another acquisition.\n\n- Collection subject: External receipt of actual cleanup or specified closure repair consumables\n- Flow property / unit: Mass / kg\n- Amount rule: actual_receive_cure_cleaning_material/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 30\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 30 kg/m2 upper screen for external receipt of actual cleanup or specified closure repair consumables is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. It screens gross draw with losses and usable exits retained, not net installed material or a prescribed consumption rate. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Usable material boundary return or transfer at receipt (`receive_unused_return`)\n\nProcess / prospective direction / type: `receive_setout` / `outputs` / `product`.\n\nRegister original unused goods that actually leave receipt custody for a supplier or another work package, by material and current grade. A reject can enter this row only when it remains usable and its recipient and use are evidenced. Goods left intact anywhere in site storage are stock.\n\n- Collection subject: Usable material boundary return or transfer at receipt\n- Flow property / unit: Mass / kg\n- Amount rule: actual_receive_unused_return/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 1000\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 1000 kg/m2 upper screen for usable material boundary return or transfer at receipt is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Actual custody exits depend on procurement and reuse arrangements and do not determine a negative burden. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Packaging remaining with material issued to mix_mortar (`issue_packaging_mix_mortar`)\n\nProcess / prospective direction / type: `receive_setout` / `outputs` / `product`.\n\nDispatch actual packaging that accompanies material from receipt to mix_mortar, by material, article, current state and custody event. This is an internal material transfer, with supplier-dataset coverage retained; it does not add a second packaging manufacturing burden.\n\n- Collection subject: Packaging remaining with material issued to mix_mortar\n- Flow property / unit: Mass / kg\n- Amount rule: actual_issue_packaging_mix_mortar/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 40\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 40 kg/m2 upper screen for packaging remaining with material issued to mix_mortar is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The row retains its own real transfer or operating quantity; no supplier recipe, brick count factor or material identity is inferred. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Packaging remaining with material issued to lay_joint (`issue_packaging_lay_joint`)\n\nProcess / prospective direction / type: `receive_setout` / `outputs` / `product`.\n\nDispatch actual packaging that accompanies material from receipt to lay_joint, by material, article, current state and custody event. This is an internal material transfer, with supplier-dataset coverage retained; it does not add a second packaging manufacturing burden.\n\n- Collection subject: Packaging remaining with material issued to lay_joint\n- Flow property / unit: Mass / kg\n- Amount rule: actual_issue_packaging_lay_joint/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 40\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 40 kg/m2 upper screen for packaging remaining with material issued to lay_joint is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The row retains its own real transfer or operating quantity; no supplier recipe, brick count factor or material identity is inferred. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Packaging remaining with material issued to cure_accept (`issue_packaging_cure_accept`)\n\nProcess / prospective direction / type: `receive_setout` / `outputs` / `product`.\n\nDispatch actual packaging that accompanies material from receipt to cure_accept, by material, article, current state and custody event. This is an internal material transfer, with supplier-dataset coverage retained; it does not add a second packaging manufacturing burden.\n\n- Collection subject: Packaging remaining with material issued to cure_accept\n- Flow property / unit: Mass / kg\n- Amount rule: actual_issue_packaging_cure_accept/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 40\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 40 kg/m2 upper screen for packaging remaining with material issued to cure_accept is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The row retains its own real transfer or operating quantity; no supplier recipe, brick count factor or material identity is inferred. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Materials actually issued to the laying node (`issue_materials_lay_joint`)\n\nProcess / prospective direction / type: `receive_setout` / `outputs` / `product`.\n\nConditional unchanged-state Mass/kg dispatch from receive_setout to lay_joint, covering the actual material roles in component ledgers issue_bricks, issue_restraint_components. Expand the actual schedule into zero, one or many exchanges, each with its real material/SKU, composition, current state, measured component kg, transfer event, sender/recipient and concrete independently verified UUID when resolved. The umbrella is not a fixed mixed product and the mass of several materials is not an identity. Retain each original component quantity calculation and match the same-SKU/current-state recipient input; no repeated purchase or new upstream production burden. Each instantiated exchange uses its own actual SKU/state/concrete-identity numerator/A; the separately named diagnostic role total is only a reconciliation view: do not publish an aggregate exchange in addition to its instantiated components. Unknown component identity/quantity or custody link remains a gap; no guessed UUID, automatic sum of quantities.\n\n- Collection subject: Materials actually issued to the laying node\n- Flow property / unit: Mass / kg\n- Amount rule: actual_issue_materials_lay_joint/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 1200\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nAn independently selected provisional 0..1200 kg/m2 planning screen for actual receive_setout-to-lay_joint material dispatch. It is not the sum of former card bounds, a bill of materials, an empirical rate or a default amount. It permits review of actual lot procurement, detail density, intact stock and actual component dispatch without prescribing any SKU mix. Actual per-SKU/current-state component measurements and custody pairing control quantities; zero requires actual absence, unknown is not zero, and exceedance needs explanation rather than clipping. Apply this screen to each actual instantiated exchange numerator/A; the separately named diagnostic role total has no inventory Range and is not substituted for a component amount.\n\n#### Collection requirement: Materials actually issued to the cure and acceptance node (`issue_materials_cure_accept`)\n\nProcess / prospective direction / type: `receive_setout` / `outputs` / `product`.\n\nConditional unchanged-state Mass/kg dispatch from receive_setout to cure_accept, covering the actual material roles in component ledgers issue_protection_material, issue_cure_cleaning_material. Expand the actual schedule into zero, one or many exchanges, each with its real material/SKU, composition, current state, measured component kg, transfer event, sender/recipient and concrete independently verified UUID when resolved. The umbrella is not a fixed mixed product and the mass of several materials is not an identity. Retain each original component quantity calculation and match the same-SKU/current-state recipient input; no repeated purchase or new upstream production burden. Each instantiated exchange uses its own actual SKU/state/concrete-identity numerator/A; the separately named diagnostic role total is only a reconciliation view: do not publish an aggregate exchange in addition to its instantiated components. Unknown component identity/quantity or custody link remains a gap; no guessed UUID, automatic sum of quantities.\n\n- Collection subject: Materials actually issued to the cure and acceptance node\n- Flow property / unit: Mass / kg\n- Amount rule: actual_issue_materials_cure_accept/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 100\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nAn independently selected provisional 0..100 kg/m2 planning screen for actual receive_setout-to-cure_accept material dispatch. It is not the sum of former card bounds, a bill of materials, an empirical rate or a default amount. It permits review of actual lot procurement, detail density, intact stock and actual component dispatch without prescribing any SKU mix. Actual per-SKU/current-state component measurements and custody pairing control quantities; zero requires actual absence, unknown is not zero, and exceedance needs explanation rather than clipping. Apply this screen to each actual instantiated exchange numerator/A; the separately named diagnostic role total has no inventory Range and is not substituted for a component amount.\n\n#### Collection requirement: Receipt packaging waste to custodian (`receive_packaging_waste`)\n\nProcess / prospective direction / type: `receive_setout` / `outputs` / `waste`.\n\nRecord packaging actually discarded while receiving and opening packs here. Separate polymer, paper, timber and metal destinations. Packaging carried onward is an issue, and an intact reusable pallet returned to its owner is a usable exit.\n\n- Collection subject: Receipt packaging waste to custodian\n- Flow property / unit: Mass / kg\n- Amount rule: actual_receive_packaging_waste/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 40\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 40 kg/m2 upper screen for receipt packaging waste to custodian is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Only actual own receiving discard is included; downstream remedial removal stays at its actual producing node unless a real changed-state custody handoff is reviewed; the quantity still must reconcile to the matching material and water ledger. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value. Only material-resolved packaging physically opened/discarded during receipt belongs here; intact/reusable packaging returns and packaging discarded after an actual downstream issue have their own fates. No mortar or wall-removal mass is packaging waste. Actual rework or a custody return can affect this node only with independently evidenced real current-state transfer and reviewed compatible route/ownership; downstream removal stays with its actual producing node and is never reassigned merely by a waste name.\n\n#### Collection requirement: Materials actually discarded during receipt (`receive_material_waste`)\n\nProcess / prospective direction / type: `receive_setout` / `outputs` / `waste`.\n\nConditional material-resolved receipt waste produced by receive_setout before actual downstream issue: fired-clay brick and actual dry premix, ancillary, protection or cleaning/remedial materials, in their measured real phase/current moisture/state. Expand each actual SKU/state/disposition/custodian/treatment destination into its own measured concrete waste exchange and independently verify its UUID only when actual identity evidence exists. Keep the original brick and non-brick component ledgers and their quantities in receipt material pools exactly once. Exclude packaging waste, usable supplier returns or external transfers, intact stock/WIP and downstream construction/remedial removals. A downstream removal stays with its actual producing node unless a real changed-state custody handoff has been reviewed; no such handoff is inferred. The umbrella is not one fixed mixed waste identity; each actual composition/state/custodian exchange has its own numerator/A, while a separately named diagnostic reconciliation view and its components are not separate additive exchanges. Unknown phase, quantity, identity or destination remains a gap.\n\n- Collection subject: Materials actually discarded during receipt\n- Flow property / unit: Mass / kg\n- Amount rule: actual_receive_material_waste/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_receive_setout`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 600\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nIndependently chosen provisional 0..600 kg/m2 screen for actual material discard owned by receipt. This is not a sum of the former brick and non-brick limits, an empirical reject fraction, a default waste amount or a permitted removal allowance. It screens only actual own receiving waste before issue, by measured SKU/state/phase and destination; downstream remedial removal remains at its producing node without a reviewed real changed-state custody handoff. Zero requires actual nonoccurrence evidence; unknown remains missing and a measured exceedance requires explanation, not clipping. Apply this screen to each actual instantiated exchange numerator/A; the separately named diagnostic role total has no inventory Range and is not substituted for a component amount. Only actual own receipt material discard before issue is in this role, using the real composition/SKU/current state/phase and custodian/treatment destination. Packaging, usable returns/transfers, stock/WIP and downstream wall removals remain separate. Actual rework or a custody return can affect this node only with independently evidenced real current-state transfer and reviewed compatible route/ownership; downstream removal stays with its actual producing node and is never reassigned merely by a waste name.\n\n#### Collection requirement: Attributable access, shared plant and support service for prepare factory dry cementitious masonry mortar (`mix_mortar_access_service`)\n\nProcess / prospective direction / type: `mix_mortar` / `inputs` / `product`.\n\nRecord actual owned availability of access equipment, hoists, scaffolds, extraction or support plant for this node, including its attributable idle and remedial periods. Evidence must define the service unit and provider boundary. Actual contract service allocation cannot be replaced by human labour hours, an eight-hour shift or an assumed asset lifetime.\n\n- Collection subject: Attributable access, shared plant and support service for prepare factory dry cementitious masonry mortar\n- Flow property / unit: Duration / h\n- Amount rule: actual_mix_mortar_access_service/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_mix_mortar`\n- Sources: `bda-mortar-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 100\n  - Unit: h\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 100 h/m2 upper screen for attributable access, shared plant and support service for prepare factory dry cementitious masonry mortar is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Actual paid availability can exceed active work time and vary with access sharing; the bound is neither a labour allowance nor a shift assumption. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Received packaging accompanying materials at mix_mortar (`mix_mortar_packaging_feed`)\n\nProcess / prospective direction / type: `mix_mortar` / `inputs` / `product`.\n\nReceive the exact packaging issue to mix_mortar, matching article/composition and event. Give every part an actual material-specific waste, reusable exit or retained stock fate at this node. Do not treat unopened packaging automatically as discarded.\n\n- Collection subject: Received packaging accompanying materials at mix_mortar\n- Flow property / unit: Mass / kg\n- Amount rule: actual_mix_mortar_packaging_feed/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_mix_mortar`\n- Sources: `bda-mortar-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 40\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 40 kg/m2 upper screen for received packaging accompanying materials at mix_mortar is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The row retains its own real transfer or operating quantity; no supplier recipe, brick count factor or material identity is inferred. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Usable preparation material or water boundary exit (`mix_unused_return`)\n\nProcess / prospective direction / type: `mix_mortar` / `outputs` / `product`.\n\nMeasure unused original dry premix, fresh water or reusable packaging that actually leaves mixing custody. Keep material identities separate. Mixed or setting mortar does not qualify as unused original dry premix and follows the actual WIP or waste route.\n\n- Collection subject: Usable preparation material or water boundary exit\n- Flow property / unit: Mass / kg\n- Amount rule: actual_mix_unused_return/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_mix_mortar`\n- Sources: `bda-mortar-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 500\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 500 kg/m2 upper screen for usable preparation material or water boundary exit is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Actual custody exits depend on procurement and reuse arrangements and do not determine a negative burden. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Off-spec or residual wet mortar waste (`mix_mortar_waste`)\n\nProcess / prospective direction / type: `mix_mortar` / `outputs` / `waste`.\n\nMeasure rejected or leftover mixed mortar discarded at the mixer in its current wet state, with dry solids and water evidence. Distinguish it from unused dry premix, retained batch WIP and collected wash liquid.\n\n- Collection subject: Off-spec or residual wet mortar waste\n- Flow property / unit: Mass / kg\n- Amount rule: actual_mix_mortar_waste/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_mix_mortar`\n- Sources: `bda-mortar-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 300\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 300 kg/m2 upper screen for off-spec or residual wet mortar waste is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The quantity still must reconcile to the matching material and water ledger. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value. Only actual wet mortar rejected or left over by the mixing operation belongs here, with current wet mass, dry-solid and water evidence. Laying/acceptance wall removals are not reassigned to mixing by calling them mortar waste. Actual rework or a custody return can affect this node only with independently evidenced real current-state transfer and reviewed compatible route/ownership; downstream removal stays with its actual producing node and is never reassigned merely by a waste name.\n\n#### Collection requirement: Dry mortar packaging discarded during preparation (`mix_packaging_waste`)\n\nProcess / prospective direction / type: `mix_mortar` / `outputs` / `waste`.\n\nMeasure the exact packaging opened and discarded at mixing from the corresponding carried-packaging feed. Identify reusable articles, retained wrapping and actual treatment destinations separately so receipt packaging is not purchased or discarded twice.\n\n- Collection subject: Dry mortar packaging discarded during preparation\n- Flow property / unit: Mass / kg\n- Amount rule: actual_mix_packaging_waste/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_mix_mortar`\n- Sources: `bda-mortar-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 40\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 40 kg/m2 upper screen for dry mortar packaging discarded during preparation is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The quantity still must reconcile to the matching material and water ledger. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value. Only actual composition-resolved carried packaging opened/discarded by mixing belongs here and reconciles to the matched packaging feed. Receipt/later-node packaging discard, reusable packaging exits and mortar/wall residues are distinct. Actual rework or a custody return can affect this node only with independently evidenced real current-state transfer and reviewed compatible route/ownership; downstream removal stays with its actual producing node and is never reassigned merely by a waste name.\n\n#### Collection requirement: Other actual mixer dust or direct releases (`mix_direct_release`)\n\nProcess / prospective direction / type: `mix_mortar` / `outputs` / `elementary`.\n\nIf preparation releases matter directly, identify the actual outgoing substance or particle composition, size basis and receiving medium. Captured material belongs to waste instead. This umbrella requires composition-resolved exchanges; it supplies no universal cement-dust identity.\n\n- Collection subject: Other actual mixer dust or direct releases\n- Flow property / unit: Mass / kg\n- Amount rule: actual_mix_direct_release/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_mix_mortar`\n- Sources: `bda-mortar-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 20\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 20 kg/m2 upper screen for other actual mixer dust or direct releases is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The total is not a species factor; each actual outgoing substance still needs composition and medium evidence. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Fired-clay masonry bricks (`bricks`)\n\nProcess / prospective direction / type: `lay_joint` / `inputs` / `product`.\n\nReceive the fired-clay brick lot actually issued for laying, preserving non-refractory material identity, SKU, size, frog or perforation, current moisture and mass. Counts convert only with a measured same-SKU, same-state bridge. No second purchase occurs here. The sending inventory role is issue_materials_lay_joint; issue_bricks is its per-material component ledger, not a second product output. Match this specific receiving input to that component by actual material/SKU/current state, quantity and physical custody event; do not use the umbrella aggregate as every component or repeat an external purchase.\n\n- Collection subject: Fired-clay masonry bricks\n- Flow property / unit: Mass / kg\n- Amount rule: actual_bricks/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_lay_joint`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 1000\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 1000 kg/m2 upper screen for fired-clay masonry bricks is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The row retains its own real transfer or operating quantity; no supplier recipe, brick count factor or material identity is inferred. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Designed partition restraint, lintel and closure components (`restraint_components`)\n\nProcess / prospective direction / type: `lay_joint` / `inputs` / `product`.\n\nReceive all newly installed components required by the actual partition design: bottom/slip/head and lateral restraints, fixings, reinforcement, lintels and movement/fire/acoustic closures. Resolve metal, mineral and polymer items individually with compatibility and same-item mass evidence; pre-existing components remain physical interface facts. The sending inventory role is issue_materials_lay_joint; issue_restraint_components is its per-material component ledger, not a second product output. Match this specific receiving input to that component by actual material/SKU/current state, quantity and physical custody event; do not use the umbrella aggregate as every component or repeat an external purchase.\n\n- Collection subject: Designed partition restraint, lintel and closure components\n- Flow property / unit: Mass / kg\n- Amount rule: actual_restraint_components/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_lay_joint`\n- Sources: `bda-workmanship-2023`; `ancon-restraint-interface`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 150\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 150 kg/m2 upper screen for designed partition restraint, lintel and closure components is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The row retains its own real transfer or operating quantity; no supplier recipe, brick count factor or material identity is inferred. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Attributable access, shared plant and support service for lay, cut, restrain and finish brickwork joints (`lay_joint_access_service`)\n\nProcess / prospective direction / type: `lay_joint` / `inputs` / `product`.\n\nRecord actual owned availability of access equipment, hoists, scaffolds, extraction or support plant for this node, including its attributable idle and remedial periods. Evidence must define the service unit and provider boundary. Actual contract service allocation cannot be replaced by human labour hours, an eight-hour shift or an assumed asset lifetime.\n\n- Collection subject: Attributable access, shared plant and support service for lay, cut, restrain and finish brickwork joints\n- Flow property / unit: Duration / h\n- Amount rule: actual_lay_joint_access_service/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_lay_joint`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 100\n  - Unit: h\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 100 h/m2 upper screen for attributable access, shared plant and support service for lay, cut, restrain and finish brickwork joints is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Actual paid availability can exceed active work time and vary with access sharing; the bound is neither a labour allowance nor a shift assumption. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Received packaging accompanying materials at lay_joint (`lay_joint_packaging_feed`)\n\nProcess / prospective direction / type: `lay_joint` / `inputs` / `product`.\n\nReceive the exact packaging issue to lay_joint, matching article/composition and event. Give every part an actual material-specific waste, reusable exit or retained stock fate at this node. Do not treat unopened packaging automatically as discarded.\n\n- Collection subject: Received packaging accompanying materials at lay_joint\n- Flow property / unit: Mass / kg\n- Amount rule: actual_lay_joint_packaging_feed/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_lay_joint`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 40\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 40 kg/m2 upper screen for received packaging accompanying materials at lay_joint is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The row retains its own real transfer or operating quantity; no supplier recipe, brick count factor or material identity is inferred. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Usable laying materials boundary return or transfer (`lay_unused_return`)\n\nProcess / prospective direction / type: `lay_joint` / `outputs` / `product`.\n\nRegister only original unused bricks, actual ancillary components, supplied fresh water or reusable packaging that actually leave laying custody, with exact material/SKU/current state, quantity, recipient and use. Match each exit to the same material actually received by lay_joint. This route supplies dry premix only to mix_mortar: laying cannot return wet mortar as unused dry material or silently acquire a dry-material input. Retained work, removed/setting mortar, waste and closing intact/processed WIP have separate fates. Any actual new dry-material or changed-state input/exit path requires explicit scope and custody review; none is inferred.\n\n- Collection subject: Usable laying materials boundary return or transfer\n- Flow property / unit: Mass / kg\n- Amount rule: actual_lay_unused_return/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_lay_joint`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 1000\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 1000 kg/m2 upper screen for usable laying materials boundary return or transfer is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Actual custody exits depend on procurement and reuse arrangements and do not determine a negative burden. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Brick cuts, mortar and accessory installation waste (`lay_solid_waste`)\n\nProcess / prospective direction / type: `lay_joint` / `outputs` / `waste`.\n\nCollect actual brick cuts, mortar droppings, removed defective work, ancillary offcuts, carried-packaging discards and captured dust produced by laying. Retain composition and current moisture for each destination. Captured dust and uncaptured elementary releases are exclusive quantities.\n\n- Collection subject: Brick cuts, mortar and accessory installation waste\n- Flow property / unit: Mass / kg\n- Amount rule: actual_lay_solid_waste/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_lay_joint`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 1000\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 1000 kg/m2 upper screen for brick cuts, mortar and accessory installation waste is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The quantity still must reconcile to the matching material and water ledger. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value. Only actual brick cuts, mortar droppings, ancillary/packaging offcuts, captured dust and corrective removals physically generated by the laying operation belong here, each with composition/current moisture and destination. Uncaptured releases, collected slurry and another node's removal are not this solid-waste quantity. Actual rework or a custody return can affect this node only with independently evidenced real current-state transfer and reviewed compatible route/ownership; downstream removal stays with its actual producing node and is never reassigned merely by a waste name.\n\n#### Collection requirement: Laying or cutting aqueous waste to custodian (`lay_wastewater`)\n\nProcess / prospective direction / type: `lay_joint` / `outputs` / `waste`.\n\nCollect actual cutting or tooling wash liquid and slurry by event and destination, retaining suspended solids and water measurements. Direct discharges require outgoing substance/medium records instead, never a second wastewater exchange for the same liquid.\n\n- Collection subject: Laying or cutting aqueous waste to custodian\n- Flow property / unit: Mass / kg\n- Amount rule: actual_lay_wastewater/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_lay_joint`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 200\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 200 kg/m2 upper screen for laying or cutting aqueous waste to custodian is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The quantity still must reconcile to the matching material and water ledger. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value. Only actual cutting/tooling/cleaning liquid or slurry collected at the laying operation belongs here, with current suspended solids/water composition and destination. Other-node wash liquid, solid discard and direct releases are separately owned. Actual rework or a custody return can affect this node only with independently evidenced real current-state transfer and reviewed compatible route/ownership; downstream removal stays with its actual producing node and is never reassigned merely by a waste name.\n\n#### Collection requirement: Other actual brick cutting, drilling or closure application releases (`lay_direct_release`)\n\nProcess / prospective direction / type: `lay_joint` / `outputs` / `elementary`.\n\nFor actual cutting or tooling releases, retain outgoing substance, particulate basis, receiving medium and capture evidence. Use composition-resolved exchanges only after that evidence exists. Neither all cut brick mass nor a mass-balance gap is airborne dust.\n\n- Collection subject: Other actual brick cutting, drilling or closure application releases\n- Flow property / unit: Mass / kg\n- Amount rule: actual_lay_direct_release/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_lay_joint`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 50\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 50 kg/m2 upper screen for other actual brick cutting, drilling or closure application releases is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The total is not a species factor; each actual outgoing substance still needs composition and medium evidence. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Uncured partition received for protection and acceptance (`cure_wall_feed`)\n\nProcess / prospective direction / type: `cure_accept` / `inputs` / `product`.\n\nReceive the same uncured wall surface event and its constituent/water state from laying. Measure actual transfer geometry, without fixing it to one square metre. Its geometrical exchange is not itself an incoming kilogram in the material balance. For kg reconciliation only, retain separately measured same-panel/current-state whole-wall OR constituent mass records with transfer/acceptance event IDs and bridge evidence; use one mutually exclusive basis. Area itself is never converted by an assumed density or universal kg/m2 factor. Component water content is measured in that same state.\n\n- Collection subject: Uncured partition received for protection and acceptance\n- Flow property / unit: Area / m2\n- Amount rule: actual_cure_wall_feed/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_cure_accept`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 4\n  - Unit: m2\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 4 m2/m2 upper screen for uncured partition received for protection and acceptance is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Repeated interface or uncured-state handoffs may exceed final accepted geometry; the screen does not equate either area with material mass. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Temporary protection and support service consumables (`protection_material`)\n\nProcess / prospective direction / type: `cure_accept` / `inputs` / `product`.\n\nReceive actual covers, hessian and consumed temporary protection articles issued by receipt, classified by composition and state. Reusable scaffold or brace availability is a service with actual ownership and service period; do not charge the whole asset manufacture to every wall. The sending inventory role is issue_materials_cure_accept; issue_protection_material is its per-material component ledger, not a second product output. Match this specific receiving input to that component by actual material/SKU/current state, quantity and physical custody event; do not use the umbrella aggregate as every component or repeat an external purchase.\n\n- Collection subject: Temporary protection and support service consumables\n- Flow property / unit: Mass / kg\n- Amount rule: actual_protection_material/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_cure_accept`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 40\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 40 kg/m2 upper screen for temporary protection and support service consumables is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The row retains its own real transfer or operating quantity; no supplier recipe, brick count factor or material identity is inferred. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Actual cleanup or specified closure repair consumables (`cure_cleaning_material`)\n\nProcess / prospective direction / type: `cure_accept` / `inputs` / `product`.\n\nReceive the actual cleaning and remedial materials used to achieve acceptance, identifying composition and product instructions. Include every actual repair pass. Neither acid cleaning nor an additional mortar recipe is assumed from generic brickwork guidance. The sending inventory role is issue_materials_cure_accept; issue_cure_cleaning_material is its per-material component ledger, not a second product output. Match this specific receiving input to that component by actual material/SKU/current state, quantity and physical custody event; do not use the umbrella aggregate as every component or repeat an external purchase.\n\n- Collection subject: Actual cleanup or specified closure repair consumables\n- Flow property / unit: Mass / kg\n- Amount rule: actual_cure_cleaning_material/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_cure_accept`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 30\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 30 kg/m2 upper screen for actual cleanup or specified closure repair consumables is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The row retains its own real transfer or operating quantity; no supplier recipe, brick count factor or material identity is inferred. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Attributable access, shared plant and support service for protect, cure, clean and accept the partition (`cure_accept_access_service`)\n\nProcess / prospective direction / type: `cure_accept` / `inputs` / `product`.\n\nRecord actual owned availability of access equipment, hoists, scaffolds, extraction or support plant for this node, including its attributable idle and remedial periods. Evidence must define the service unit and provider boundary. Actual contract service allocation cannot be replaced by human labour hours, an eight-hour shift or an assumed asset lifetime.\n\n- Collection subject: Attributable access, shared plant and support service for protect, cure, clean and accept the partition\n- Flow property / unit: Duration / h\n- Amount rule: actual_cure_accept_access_service/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_cure_accept`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 100\n  - Unit: h\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 100 h/m2 upper screen for attributable access, shared plant and support service for protect, cure, clean and accept the partition is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Actual paid availability can exceed active work time and vary with access sharing; the bound is neither a labour allowance nor a shift assumption. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Received packaging accompanying materials at cure_accept (`cure_accept_packaging_feed`)\n\nProcess / prospective direction / type: `cure_accept` / `inputs` / `product`.\n\nReceive the exact packaging issue to cure_accept, matching article/composition and event. Give every part an actual material-specific waste, reusable exit or retained stock fate at this node. Do not treat unopened packaging automatically as discarded.\n\n- Collection subject: Received packaging accompanying materials at cure_accept\n- Flow property / unit: Mass / kg\n- Amount rule: actual_cure_accept_packaging_feed/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_cure_accept`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 40\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 40 kg/m2 upper screen for received packaging accompanying materials at cure_accept is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The row retains its own real transfer or operating quantity; no supplier recipe, brick count factor or material identity is inferred. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Usable protection, cleaning material or fresh-water boundary exit (`cure_unused_return`)\n\nProcess / prospective direction / type: `cure_accept` / `outputs` / `product`.\n\nMeasure original unused protection/cleaning goods, fresh water and reusable packaging actually returned or transferred from this node, by identity and custody. Consumed chemicals and removed wall materials are not unused original products.\n\n- Collection subject: Usable protection, cleaning material or fresh-water boundary exit\n- Flow property / unit: Mass / kg\n- Amount rule: actual_cure_unused_return/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_cure_accept`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 500\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 500 kg/m2 upper screen for usable protection, cleaning material or fresh-water boundary exit is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Actual custody exits depend on procurement and reuse arrangements and do not determine a negative burden. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n#### Collection requirement: Protection, cleanup and rejected-wall material waste (`cure_solid_waste`)\n\nProcess / prospective direction / type: `cure_accept` / `outputs` / `waste`.\n\nMeasure material-resolved carried-packaging discards, protection/cleaning residues and brickwork physically removed during acceptance corrections, with composition, current water content and custody. Defective work left unresolved in place remains installed WIP and contributes no final accepted area.\n\n- Collection subject: Protection, cleanup and rejected-wall material waste\n- Flow property / unit: Mass / kg\n- Amount rule: actual_cure_solid_waste/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_cure_accept`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 1000\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 1000 kg/m2 upper screen for protection, cleanup and rejected-wall material waste is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The quantity still must reconcile to the matching material and water ledger. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value. Only actual protection/cleaning/packaging residues and defective work physically removed by this protection/acceptance operation belong here, with current composition/moisture and custody. Unremoved unresolved wall remains WIP; other-node discard, wastewater and direct releases stay separate. Actual rework or a custody return can affect this node only with independently evidenced real current-state transfer and reviewed compatible route/ownership; downstream removal stays with its actual producing node and is never reassigned merely by a waste name.\n\n#### Collection requirement: Other actual cure or cleanup elementary exchanges (`cure_other_release`)\n\nProcess / prospective direction / type: `cure_accept` / `outputs` / `elementary`.\n\nRecord actual outgoing substances released during cure, remedial work or cleaning, excluding the H2O vapour already counted separately and resolving every substance and receiving medium. Any actually evidenced direct liquid H2O release belongs to this own-node conditional role with its real receiving medium; a collected liquid custodian transfer remains wastewater, and unknown occurrence or medium is a gap. This output role cannot describe uptake. No carbonation uptake, reaction pathway or solvent emission is presumed; any evidenced uptake needs a separately reviewed input role.\n\n- Collection subject: Other actual cure or cleanup elementary exchanges\n- Flow property / unit: Mass / kg\n- Amount rule: actual_cure_other_release/A\n- Value mode: `calculated_value`\n- Specificity: `site_specific`\n- Normalization basis: per reference flow\n- Basis kind: `reference_flow`\n- Evidence kind: `calculated_from_collection`\n- Collection protocol: `cp_cure_accept`\n- Sources: `bda-workmanship-2023`\n- Unverified optional screening aid: Provisional individual planning screen\n  - Range role: `qa_guardrail`\n  - Lower: 0\n  - Upper: 30\n  - Unit: kg\n  - Basis: per reference flow\n  - Basis kind: `reference_flow`\n  - Evidence kind: `reasoned_estimate`\n\nThe 30 kg/m2 upper screen for other actual cure or cleanup elementary exchanges is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. The total is not a species factor; each actual outgoing substance still needs composition and medium evidence. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value.\n\n"
