  data_quality_requirements:
    - id: dq_design
      applies_to: "entry and final acceptance"
      requirement: "Retain signed design, exact supplier compatibility and current project instructions for every required component and the as-built acceptance schedule."
      evidence: "design_release_ref; component_schedule_ref; supplier_instruction_ref; acceptance_ref"
    - id: dq_stock
      applies_to: "all material and packaging ledgers"
      requirement: "Document every material/state/custody sublocation and exclusive final fate, including point-of-use future stock; join each gross draw, issue, feed, exit and WIP quantity to actual events."
      evidence: "stock_custody_partition_ref; custody evidence; scale records; upstream_coverage_ref"
    - id: dq_water
      applies_to: "each water-bearing node"
      requirement: "Distinguish the water content of incoming/handed-over/retained/waste states at their actual time. Bound water remains mass; unexplained closure is uncertainty."
      evidence: "pool_partition_ref; moisture methods; evaporation_method_ref; uncertainty_kg"
    - id: dq_meter
      applies_to: "each energy or shared-service node"
      requirement: "Keep actual serial, factors, source intervals, topology and the full eligible consumer set. Reconcile direct and residual assignments; prove the zero-residual case."
      evidence: "reading interval arrays; conversion_factor_ref; meter_topology_ref; contract_unit_ref"
    - id: dq_event
      applies_to: "all real occurrences"
      requirement: "Deduplicate electronic revisions using physical event lineage, while preserving real repeated work and its node/period. Unresolved replacement/termination remains a gap."
      evidence: "physical_event_id; record_revision; rework_parent_event_id; period_attribution_ref"
    - id: dq_quantity
      applies_to: "all published amounts"
      requirement: "Keep original records and bridge uncertainty, with unnormalized quantities and one A normalization. Replace provisional screens only using reviewed independent evidence; never validate a sample by its own maximum."
      evidence: "calibration; native quantities; actual same-state bridge; calculation audit"
    - id: dq_identity
      applies_to: "all resolved and unresolved exchanges"
      requirement: "Resolve actual material/provider/species/medium and independent dimensional supports before claiming final downstream exchange readiness. A usable quantity does not prove database identity."
      evidence: "actual supplier/material and waste destination evidence; verified identity/support decisions"
validation_rules:
  - rule_id: validation_gate
    applies_to: "scope_and_final_output"
    rule: "Confirm released entry design and final as-built completeness for all actual compatible restraints, lintels, movement/fire/acoustic closures and protection/cure/cleaning. Exclude unresolved panels from accepted A and retain their WIP/correction evidence."
    source_ids:
      - bda-workmanship-2023
      - ancon-restraint-interface
  - rule_id: validation_geometry
    applies_to: "area_and_mass"
    rule: "Require A > 0 from the union of finally accepted single-plane surfaces with openings excluded once. Neither two faces, repeated acceptance forms nor rework passes multiply A. Physical interface area is observational and cannot enter a kg balance or imply newly supplied structure."
    source_ids: []
  - rule_id: validation_material
    applies_to: "gross_stock_and_transfers"
    rule: "Reconcile each material/SKU/state ledger from opening and external receipts through all-location intact closing stock, actual issues, own receipt waste/usable exits and exclusive WIP. Pair issue/feed by event, quantity, state and custody. All unissued future-lot stock remains in receipt custody wherever stored; no repeated purchase or second stock subtraction."
    source_ids: []
  - rule_id: validation_units
    applies_to: "conversion_and_measured_absence"
    rule: "Require exact same-SKU/current-state count/length/area-to-kg bridges, calibrated units and explicit composition/whole-versus-component ownership. Never sum mixed dimensions. Prove nonoccurrence before zero; missing records and conditional activation uncertainty remain gaps."
    source_ids: []
  - rule_id: validation_water
    applies_to: "mix_lay_cure"
    rule: "Check own-node time/state-exclusive water pools against actual gross supplied water and attached incoming water. Remove fresh closing intact once only. Separate actual handoff, final bound/free retention, wastes, liquid releases, usable exits and processed WIP. H2O to air unspecified needs actual validated evaporation; a residual or hydration state change is insufficient."
    source_ids:
      - bda-mortar-2023
  - rule_id: validation_release
    applies_to: "elementary_output_roles"
    rule: "Require actual outgoing substance/particle basis and receiving medium for direct releases; prevent captured-dust/waste duplication. Output release cards cannot represent uptake. Any evidenced uptake needs its own reviewed input semantics; no default carbonation or universal dust identity."
    source_ids: []
  - rule_id: validation_meter
    applies_to: "meter_topology_and_service"
    rule: "Audit meter reading serial, source interval, factors, parent topology and complete eligible consumer set; check residual arithmetic, inside/outside boundary, zero-residual exception and aggregate reconciliation. Service h needs actual provider/contract unit and period, never an assumed shift or labour proxy. Negative or unknown residual blocks attribution and requires resolving reading/interval/topology/service evidence; never allocate, clip or convert it to a credit. Only a positive residual is allocated using a complete eligible consumer set and positive weight denominator. Exactly zero needs no weights after completeness is established."
    source_ids: []
  - rule_id: validation_rework
    applies_to: "all_reject_routes"
    rule: "Each rejection has an actual state, owner and path: rework, documented usable exit, recovery/downgrade with reviewed burden treatment, waste or retained WIP. Match loop events and preserve all actual corrections. An unresolved rejected surface does not become final accepted output."
    source_ids:
      - bda-workmanship-2023
  - rule_id: validation_periods
    applies_to: "period_asset_event_linkage"
    rule: "Enumerate all lot phases and periods and link inputs, assets, outputs and correction/replacement/termination events. Review period-specific attribution and prevent duplicate carryover of burdens or accepted geometry. Unresolved replacement or termination ownership blocks finalization."
    source_ids: []
  - rule_id: validation_quality
    applies_to: "ranges_and_identity"
    rule: "Treat all provisional reasoned_estimate ranges as review screens only. They are not empirical factors, acceptance limits or permission to use a missing value. Verify actual exchange identity and property/unit separately from quantity evidence; unresolved provider/material/species and Duration/Energy support remain explicit review gaps."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground construction-lot data package, with downstream process or lifecyclemodel projections"
  downstream_use: "secondary_dataset and/or background_dataset only within the declared accepted interior partition route and qualifiers"
  allowed_use: "Construction-stage modelling of the exact defined service, using actual upstream materials, providers and destinations with reviewed scope and measurements"
  excluded_use: "Universal wall design/certification; material manufacturing inventory; exterior/loadbearing/cavity/lime-only/site-recipe routes; decorative finish or building use/end-of-life inventory; assumed lifetime/curing/weather/recipe defaults"
  required_metadata: "PCR identity/version; geography/site/lot and actual phase/period boundaries; brick/premix/ancillary IDs and state; component ownership/design/instruction/asbuilt acceptance; unique area and opening geometry; all stock/custody/WIP and rework event lineage; upstream dataset/packaging coverage; energy/service consumer topology and allocation; measured uncertainty"
  required_quality_disclosure: "Measured/calculated quantities versus provisional screens; performed/skipped checks; identity/property/unit gaps; source age/scope limits; material/water closure and missing records; residual allocation evidence; reject/rework dispositions and unresolved period/ownership decisions"
  update_trigger: "Actual product/route/design ownership, supplier instructions, accepted gate or upstream dataset boundary changes; materially revised measurements/period attribution; new supported identities or independent quantitative evidence"
data_sources:
  - id: "bda-workmanship-2023"
    type: "handbook"
    reference: "Brick Development Association, Good Site Practice and Workmanship, April 2023, 19 pages. https://d23z90m210izbx.cloudfront.net/uploads/downloads/13.-Good-Site-Practice-Workmanship-General-Guide-2023.f1678702110.pdf"
    used_for: "pp5-8 design, reference acceptance, delivery/storage/handling; pp9-11 setout, full joints, cutting and timing/tooling; pp14-15 actual protection/weather context. Generic procedure only; project/supplier details control."
  - id: "bda-mortar-2023"
    type: "handbook"
    reference: "Brick Development Association, Mortar for Brickwork, April 2023, 18 pages. https://d23z90m210izbx.cloudfront.net/uploads/downloads/08.-Mortar-for-Brickwork-Technical-Guide-2023.f1678701358.pdf"
    used_for: "pp5-6 function and design selection; pp8-10 water/suction, actual mixing and waste; pp12-14 cementitious factory dry/silo states; p15 lime-only alternatives outside this route. No universal numeric conversion or curing factor."
  - id: "ancon-restraint-interface"
    type: "extension_guidance"
    reference: "Ancon, What is a Head Restraint and why are Head Restraints required in masonry panels?, 8 May 2017. https://www.ancon.co.uk/blog/what-is-a-head-restraint-and-why-are-head-restraints-required-in-masonry-panels"
    used_for: "Designer-controlled top restraint and movement interface, compatibility and omission consequences only; no article dimensions/spacing/load factors are imported into this PCR."
