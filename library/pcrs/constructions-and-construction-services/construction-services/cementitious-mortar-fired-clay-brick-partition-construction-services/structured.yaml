    - id: calc_receive_setout_mass_pools
      applies_to: "receive_setout"
      rule: "receive_setout_opening_processed_wip_kg = WIP_MASS(receive_setout_opening_processed_wip_records). Every observation names a listed own card and unnormalized source output/event, exact current-state measured kg and period/custody, linking prior closing WIP or current retention. Whole assembly OR constituents; intact unissued stock already removed at gross draw is excluded. Closing WIP is after all actual handoffs, accepted retention and exits.; receive_setout_closing_processed_wip_kg = WIP_MASS(receive_setout_closing_processed_wip_records). Every observation names a listed own card and unnormalized source output/event, exact current-state measured kg and period/custody, linking prior closing WIP or current retention. Whole assembly OR constituents; intact unissued stock already removed at gross draw is excluded. Closing WIP is after all actual handoffs, accepted retention and exits.; receive_setout_fresh_external_draw_kg = actual_receive_packaging + actual_receive_dry_mortar + actual_receive_bricks + actual_receive_restraint_components + actual_receive_protection_material + actual_receive_cure_cleaning_material. Full unnormalized own-card outputs, each counted once by actual material/event/state/period; whole recorded amounts.; receive_setout_material_internal_in_kg = EVIDENCED_ZERO(receive_setout_material_internal_in_kg_absence_records). Own-node full-period absence evidence; any actual nonzero or unknown material_internal_in_kg blocks closure and needs explicit role/path review.; receive_setout_final_retained_mass_kg = EVIDENCED_ZERO(receive_setout_final_retained_mass_kg_absence_records). Own-node full-period absence evidence; any actual nonzero or unknown final_retained_mass_kg blocks closure and needs explicit role/path review.; receive_setout_next_material_handoff_kg = actual_issue_dry_mortar + actual_issue_bricks + actual_issue_restraint_components + actual_issue_protection_material + actual_issue_cure_cleaning_material + actual_issue_packaging_mix_mortar + actual_issue_packaging_lay_joint + actual_issue_packaging_cure_accept. Full unnormalized own-card outputs, each counted once by actual material/event/state/period; whole recorded amounts.; receive_setout_material_discard_kg = actual_receive_rejected_brick + actual_receive_nonbrick_material_waste + actual_receive_packaging_waste. Full unnormalized own-card outputs, each counted once by actual material/event/state/period; whole recorded amounts.; receive_setout_aqueous_waste_kg = EVIDENCED_ZERO(receive_setout_aqueous_waste_kg_absence_records). Own-node full-period absence evidence; any actual nonzero or unknown aqueous_waste_kg blocks closure and needs explicit role/path review.; receive_setout_direct_release_kg = EVIDENCED_ZERO(receive_setout_direct_release_kg_absence_records). Own-node full-period absence evidence; any actual nonzero or unknown direct_release_kg blocks closure and needs explicit role/path review.; receive_setout_usable_exit_kg = actual_receive_unused_return. Full unnormalized own-card outputs, each counted once by actual material/event/state/period; whole recorded amounts.; receive_setout_other_exclusive_transfer_kg = EVIDENCED_ZERO(receive_setout_other_exclusive_transfer_absence_records). Own-node full-period absence evidence; any actual nonzero or unknown other_exclusive_transfer blocks closure and needs explicit role/path review. All pool assignments preserve the same source event/material/state/period and reconcile to actual source outputs. A source whole amount and its components use one basis only. Internal mass uses source handoff records; geometry is excluded. Original-unused positive exits remain in gross inputs and have no negative credit. Actual gross product mass excludes separately counted packaging using a measured constituent split; never add a packaged whole and its packaging again. Own-node full-period absence evidence; any actual nonzero or unknown aqueous_waste_kg blocks closure and needs explicit role/path review. This absence concerns only an additional aqueous pool after excluding every liquid or other phase already counted in receive_material_waste; it is not a claim that receipt can have no liquid discard. Any additional actual aqueous path needs an explicit own-node role before closure. WIP_MASS definition: Sum actual opening/closing processed-stock observations by own card, source amount/event, material/SKU/state, period and custody. Records link prior closing stock or current retained event and distinguish intact unissued stock already removed in gross draw. Wall WIP requires the same measured whole-or-components kg bridge. Unknown quantities/ownership block closure. EVIDENCED_ZERO definition: Return zero only when the named own-node absence records demonstrate that no such actual pool exists for the full lot/period. Unknown, missing or nonzero records block closure and require the actual role and path to be reviewed, never conceal it in a balancing amount. Component outputs actual_issue_bricks, actual_issue_restraint_components, actual_issue_protection_material, actual_issue_cure_cleaning_material belong to their declared current umbrellas; use those original per-SKU/state amounts once, never the umbrella aggregate plus components. They are ledger quantities, not phantom inventory cards. Component outputs actual_issue_bricks, actual_issue_restraint_components, actual_issue_protection_material, actual_issue_cure_cleaning_material belong to their declared current umbrellas; use those original per-SKU/state amounts once, never the umbrella aggregate plus components. They are ledger quantities, not phantom inventory cards. Component outputs actual_issue_bricks, actual_issue_restraint_components, actual_issue_protection_material, actual_issue_cure_cleaning_material belong to their declared current umbrellas; use those original per-SKU/state amounts once, never the umbrella aggregate plus components. They are ledger quantities, not phantom inventory cards. Component outputs actual_receive_rejected_brick, actual_receive_nonbrick_material_waste belong to their declared current umbrellas; use those original per-SKU/state amounts once, never the umbrella aggregate plus components. They are ledger quantities, not phantom inventory cards."
