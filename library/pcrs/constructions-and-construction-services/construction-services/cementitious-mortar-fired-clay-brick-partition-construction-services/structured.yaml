          property_unit: "Energy / kWh"
          description: "Measure the electricity attributable to this node, with meter serial, multiplier, interval and parent topology. Use direct deltas first. A master residual subtracts every inside-master directly assigned consumer exactly once; it never subtracts an outside-master direct load. Allocate only a positive residual over a complete positive eligible weight set. Negative or unknown residual blocks attribution and requires resolving reading/interval/topology/service evidence; never allocate, clip or convert it to a credit. Only a positive residual is allocated using a complete eligible consumer set and positive weight denominator. Exactly zero needs no weights after completeness is established. The 50 kWh/m2 upper screen for attributable electricity for receive, survey and set out the designed partition is an independently chosen provisional planning trigger, allowing lot size, detail density and repeated actual work to vary. Small tool and shared-site campaigns may vary widely with actual meter periods and idle loads; no machine rating or operating-hours factor is implied. Zero is an allowable screening bound only; it never converts missing required evidence into nonoccurrence. Exceedance calls for review and explanation, not rejection of valid measurements or clipping. This is not empirical evidence or a default inventory value."
