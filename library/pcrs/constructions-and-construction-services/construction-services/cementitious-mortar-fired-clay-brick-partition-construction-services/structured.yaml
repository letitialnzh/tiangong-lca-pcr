system_boundary:
  rules:
    - rule_id: boundary_entry
      applies_to: "entry_gate"
      rule: "Begin with an accepted physical base and released signed partition design. Require the exact brick/premix compatibility, geometry/openings, support loading, bottom/slip/head/lateral details, lintels, movement/fire/acoustic closures and temporary support ownership before work enters this route. An unresolved owner or compatibility is a gap."
      source_ids:
        - bda-workmanship-2023
        - ancon-restraint-interface
    - rule_id: boundary_work
      applies_to: "all_four_nodes"
      rule: "Include receipt/storage losses, actual factory-premix mixing, laying/cutting, designed ancillary integration, joint tooling, protection, cementitious setting, cleaning, actual corrections and final acceptance. Generic guidance lacking a detail never permits its omission from the actual work package."
      source_ids:
        - bda-workmanship-2023
        - bda-mortar-2023
    - rule_id: boundary_composition
      applies_to: "mix_mortar and cure_accept"
      rule: "The mix responsibility combines the exact factory dry cementitious premix and actual supplied water, handing over actual wet mortar. The cement-water reaction continues in its actual observed state through accepted wall handoff. Preserve bound/free water, unreacted/unused inputs, losses and off-spec states; infer neither a chemical pathway nor a yield or CO2 uptake."
      source_ids:
        - bda-mortar-2023
    - rule_id: boundary_assembly
      applies_to: "lay_joint"
      rule: "Join actual fired-clay bricks, wet mortar and every required compatible ancillary to the released existing interface. The intended uncured wall and its constituent state pass to cure_accept; rejected assemblies, cuts and losses retain their own dispositions and producing-node responsibility."
      source_ids:
        - bda-workmanship-2023
        - ancon-restraint-interface
    - rule_id: boundary_finishing
      applies_to: "lay_joint and cure_accept"
      rule: "Joint tooling is an explicit finishing responsibility within laying after a parent laid wall exists. Record parent state, actual tooling/closure inputs and finished uncured handoff. cure_accept owns later protection/cleaning and actual remedial finishing through accepted output, with residues and releases assigned to the producing node. No decorative coating or plaster is included by implication."
      source_ids:
        - bda-workmanship-2023
    - rule_id: boundary_receipt
      applies_to: "staged_materials_and_packaging"
      rule: "One external gross receipt owner supplies each staged material and its carried packaging. Preserve own receipt rejection/usable exits and match real issue to downstream internal feed. Supplied water enters only its actual using node. Packaging upstream dataset coverage is counted once; waste, reusable exits and stock have material-specific owners."
      source_ids: []
    - rule_id: boundary_periods
      applies_to: "lot_and_shared_assets"
      rule: "Enumerate the actual receipt, mix, laying, protection/cure, cleaning/correction and acceptance periods, with cutoff stock, WIP, assets, replacement/termination events and every consumer linked to each period. Use actual boundaries and ownership; no assumed construction day, service life or annualization."
      source_ids: []
    - rule_id: boundary_exclusions
      applies_to: "external_interfaces"
      rule: "Exclude manufacture of bricks/premix and pre-existing base/structure from foreground operations but connect actual upstream datasets once at external material entry. Exclude lime-only/site raw-recipe mortars, loadbearing/exterior/cavity wall routes, painting/plaster, structural base manufacture and use/end-of-life beyond acceptance. A changed incoming state or newly owned excluded operation requires scope review."
      source_ids:
        - bda-workmanship-2023
        - bda-mortar-2023
    - rule_id: boundary_atomic_completion
      applies_to: "all processes"
      rule: "Section 5 collection requirements are mandatory collection and applicability instructions, not aggregate inventory exchanges. Instantiate a distinct atomic flow card/exchange for every actual product, waste stream, substance and environmental compartment before completing a foreground dataset. Preserve every actual event, upstream burden, return and native unit; apply the linked formula to each compatible identity separately. Record environmental withdrawals as inputs and releases as outputs. Never sum unlike native units, substitute one UUID for a pool, infer zero from missing records, or duplicate an existing concrete card. Documentary retained-host interfaces carry state only and create no new purchased asset. Quantified completion is blocked until applicable members are resolved or evidenced absent; nonbinding screening aids do not supply missing amounts or chemistry."
