boundary_abstraction:
  declared_starting_condition: "Released existing physical base/support geometry with signed design and a resolved newly-installed-versus-existing component schedule"
  starting_condition_role: "Received external physical quality/interface condition; geometry is observational, documents are evidence, neither is a new material purchase"
  product_classification_scope: "The semantic interior non-loadbearing fired-clay brick construction service defined here, independent of external classification hierarchy"
  recursive_input_rule: "A same-category purchased completed partition or inherited unresolved partly built wall is not silently unfolded into this route. Record its supplied state and upstream owner; require a scope review before changing the starting gate or duplicating its construction inventory."
  upstream_dataset_requirement: "Connect each actual external material/water/provider and waste route to an appropriate reviewed upstream dataset once. Internal material/feed and geometry handoffs carry existing ownership; document supplier packaging coverage and any separate residual packaging burdens."
  disclosure: "Publish exact route, entry/release and acceptance gates, actual component ownership and product instructions, period/custody/WIP boundaries, upstream dataset coverage, allocation decisions and unresolved quantity/identity/measurement gaps"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted interior brick partition construction service"
    uuid: ""
  flow_property_ref:
    uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
  unit_group_ref:
    uuid: "93a60a57-a3c8-18da-a746-0800200c9a66"
  reference_unit: "m2"
  required_qualifiers:
    - "site and geography"
    - "actual lot periods"
    - "wall/panel surface IDs and openings"
    - "thickness/bond/joint profile"
    - "non-loadbearing interior use"
    - "exact fired-clay SKU and moisture"
    - "factory cementitious premix grade/instructions"
    - "physical support and signed design release"
    - "actual restraint/lintel/movement/fire/acoustic detail schedule"
    - "temporary-support owner"
    - "actual protection/cure/cleaning conditions"
    - "final as-built acceptance"
    - "upstream dataset and packaging coverage"
reference_flows:
  []
measurement_rules:
  - id: measure_accepted_area
    applies_to: "final service"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Derive A from final accepted single-plane union geometry, subtract openings and unaccepted work once and require positive A. Normalize each physical numerator once; A/A is calculated 1."
  - id: measure_interface_area
    applies_to: "existing base and wall handoffs"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Physical interface geometry is observational. Its documents are evidence. Neither enters kg mass reconciliation, and no new structural material is inferred."
  - id: measure_material_bridge
    applies_to: "all material/waste/usable exits"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Preserve current moisture and state. Convert count/length/area only using actual same-SKU/state mass evidence; do not add a whole assembly and its constituent totals."
  - id: measure_gross_stock
    applies_to: "external staged materials and supplied water"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Gross draw equals opening intact plus external receipts minus closing intact over all relevant custody locations. It includes usable exits; exclude closing intact once only and keep waste/WIP/exits exclusive."
  - id: measure_water_state
    applies_to: "water-bearing mixes/walls/wastes"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Track total and bound/free water by actual state/time. Internal handoff water is separate from final retained water. Hydration retains bound water; missing closure is not vapour."
  - id: measure_energy_lineage
    applies_to: "electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "kWh"
    rule: "Use actual meter deltas with factor, interval and topology, and only the eligible master residual after all inside-master direct assignment once; exact dimensional support remains independently required."
  - id: measure_service_unit
    applies_to: "access and support"
    required_property_ref:
      name: "Duration"
      uuid: ""
    required_unit: "h"
    rule: "Use actual contract/service availability and ownership periods. Do not substitute labour, a presumed shift or unsupported dimensions."
  - id: measure_species_medium
    applies_to: "direct elementary outputs"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Identify actual outgoing substance, particulate basis and receiving medium, with capture distinction. No output uptake or generic dust substitution."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: receive_setout
    name: "Receive, survey and set out the designed partition"
    inclusion: "required"
    inclusion_condition: "Actual scope route; conditional exchanges only when actual evidence establishes occurrence"
    role: "Inspect the released base and project design before recording entry. Reconcile delivery tickets, SKU/state weighing, rejection and storage inspection. Log all intact stock at central stores and point-of-use sublocations, including unissued goods for future lots, with one custody owner. Document every actual material and carried-packaging dispatch and its recipient. Design paperwork proves readiness but is not a material. Maintain a complete installed-versus-existing component schedule. Existing interface observation roles base_design_interface and physical_interface_release preserve actual geometry/state and release/receipt responsibility, not product inventory."
    quantitative_reference: "same final A; internal handoffs retain actual quantities"
  - id: mix_mortar
    name: "Prepare factory dry cementitious masonry mortar"
    inclusion: "required"
    inclusion_condition: "Actual scope route; conditional exchanges only when actual evidence establishes occurrence"
    role: "At every actual batch record exact dry premix ID, weighed received internal feed, actual supplied water, mixing operation and product instructions. Weigh wet dispatch and match laying receipt. Measure discarded mortar, wash liquid, packaging and usable exits separately. Characterize solids and water before setting; record reaction state changes, not an invented mix recipe or retarder time."
    quantitative_reference: "same final A; internal handoffs retain actual quantities"
  - id: lay_joint
    name: "Lay, cut, restrain and finish brickwork joints"
    inclusion: "required"
    inclusion_condition: "Actual scope route; conditional exchanges only when actual evidence establishes occurrence"
    role: "At each panel/pass match actual brick, wet mortar, designed ancillary and packaging receipts. Record physical base interface release, geometry, cutting method, tooling, restraint and closure installation, water, waste and releases. Preserve cut/offcut and rejected assembly dispositions and all remedial events. Dispatch the actual uncured wall area with its constituent/water state to acceptance; no extra material purchase is created. Existing interface observation roles physical_interface_construction_feed preserve actual geometry/state and release/receipt responsibility, not product inventory."
    quantitative_reference: "same final A; internal handoffs retain actual quantities"
  - id: cure_accept
    name: "Protect, cure, clean and accept the partition"
    inclusion: "required"
    inclusion_condition: "Actual scope route; conditional exchanges only when actual evidence establishes occurrence"
    role: "Follow actual protection/cure and cleaning procedures, recording conditions, temporary-support ownership, cleaning/repair goods and all actual correction events. Match the received uncured wall state and actual water pools. Collect as-built evidence for every required design detail and signed acceptance. Survey only finally accepted unique surfaces for A; leave unresolved work in identified WIP."
    quantitative_reference: "same final A; internal handoffs retain actual quantities"
process_inventory:
  - id: receive_setout
    label: "Receive, survey and set out the designed partition"
    inputs:
      product:
        - row_id: receive_setout_electricity
          role: "Attributable electricity for receive, survey and set out the designed partition"
