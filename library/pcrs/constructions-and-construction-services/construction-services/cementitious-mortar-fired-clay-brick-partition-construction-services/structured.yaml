      rule: "actual_base_design_interface = OBSERVED_GEOMETRY(base_design_interface, cp_receive_setout); q_base_design_interface = actual_base_design_interface/A. This own-node observational calculation preserves all original measured geometry/native-unit/current-state fields, surface/panel IDs, actual interface event/recipient links and release/acceptance evidence. It is not an inventory flow, material purchase or production handoff burden. Area remains m2; never use it in kg closure. The observed quantity is actual, not reference1; unknown state/geometry blocks the design gate. OBSERVED_GEOMETRY definition: Read the explicitly declared observational role and its own protocol raw geometry/native-unit/current-state records, preserving actual panel/surface IDs, independently measured m2, release/acceptance evidence and same-event sender/recipient responsibility. Match physical_interface_release to physical_interface_construction_feed by their real interface event and geometry/state. Unknown geometry or release status remains a blocking gate gap; documented nonoccurrence is not a presumed one. These are existing-asset observations only: no product exchange, supplier purchase, production burden, inventory Range or kg contribution is created."
