  data_quality_requirements:
    - id: dq_route
      applies_to: "lot boundary"
      requirement: "Establish unpasted paper/paste-the-paper construction and compatible ready-mixed aqueous adhesive plus received dry, sound, appropriately primed wall. A broader or incompatible exchange identity cannot widen the category."
      evidence: "actual paper/adhesive instructions; received-wall acceptance"
    - id: dq_area
      applies_to: "reference and handoffs"
      requirement: "Use surveyed actual patch geometry, opening/overlap rule and final acceptance. Record moisture-dependent paper dimension changes; preserve actual wet-state transfers rather than forcing them to final A."
      evidence: "survey; strip/patch/transfer ledger; moisture and acceptance records"
    - id: dq_material
      applies_to: "stock and exits"
      requirement: "Reconcile exclusive intact stock, gross draw, processed/WIP, original usable exits and actual waste in kg by material/state. Document packaging tare and wet/dry basis."
      evidence: "calibrated scales; stock, transfer, return and custodian records"
    - id: dq_water
      applies_to: "paste_book, hang_trim, dry_accept"
      requirement: "State full/partial fate coverage, each exclusive constituent pool, actual gate moisture and uncertainty. No partial balance supports a default vapour quantity or zero loss."
      evidence: "independently traceable moisture/formulation/wastewater evidence and node balance"
    - id: dq_rework
      applies_to: "actual events"
      requirement: "Retain every physical correction, replacement and discard once; deduplicate only record copies. Failed/terminated states and outgoing correction transfers have explicit destinations and burdens."
      evidence: "event predecessor IDs; correction and termination records"
    - id: dq_shared
      applies_to: "utilities/services"
      requirement: "Match provider/source period and all consumers; allocate electricity only to eligible residual activity shares after direct assignment, requiring positive complete weights only for a positive residual. Known zero residual keeps direct assignment alone; unknown/negative residual remains a gap. For services reconcile the full charged availability with positive complete consumer weights and paid idle, avoiding service/electricity overlap."
      evidence: "meter; contract; charge conversion; allocation reconciliation"
    - id: dq_period
      applies_to: "multi-period lot"
      requirement: "Cover every actual work, waiting, drying and correction period through final acceptance; carry state without duplicate purchase, burden or evaporation."
      evidence: "cutoff inventory; period-linked event ledger; final acceptance"
    - id: dq_identity
      applies_to: "concrete exchanges"
      requirement: "Resolve actual material/provider/substance identity and property/unit before a final exchange. Conditional umbrella cards remain semantic until actual exchanges are specified; substance and medium evidence is required for direct releases."
      evidence: "verified identity details plus foreground qualifier records"
    - id: dq_range
      applies_to: "every Range"
      requirement: "Keep these broad author intervals provisional. Test empirical replacements against an independent reviewed reference population; do not use the current batch maximum to validate the same batch. Outliers retain their actual quantities and documented explanation."
      evidence: "independent reference sample and review; provisional-range disclosure"
validation_rules:
  - rule_id: validate_scope
    applies_to: "actual route"
    rule: "Fail scope compatibility for vinyl, self-adhesive, prepasted, paste-the-wall, manufacture or substrate-preparation activities presented as this service. Verify the actual received primed/dry interface."
    source_ids:
      - roman-wall-preparation
      - roman-paper-preparation
  - rule_id: validate_reference
    applies_to: "accepted service"
    rule: "Require positive A, a unique actual final accepted-area ledger and the reference_service link. A/A = 1 is normalization only; a terminated zero-A lot is separately disclosed."
    source_ids: []
  - rule_id: validate_handoffs
    applies_to: "paired gates"
    rule: "Match transfer IDs, state, property/unit, actual quantity, moisture and period on both sides of every handoff. Explain actual loss/correction between gates; never force an internal numerator to 1 m2."
    source_ids: []
  - rule_id: validate_stock
    applies_to: "material draw and usable exits"
    rule: "Require gross input opening + receipts - exclusive intact unissued closing stock; separately positive original usable outputs. Reject double subtraction, retained closing stock reported as return, processed reject reported as unused material and service/rework credit."
    source_ids: []
  - rule_id: validate_water
    applies_to: "three water nodes"
    rule: "Test own-node inputs and all exclusive retained, liquid, solid, stock/WIP, usable-exit and air fates with uncertainty and transfer continuity. Complete reconciled or independently measured evaporation is required for a numerical vapour exchange. Missing fate is incomplete coverage; negative residual is a finding."
    source_ids: []
  - rule_id: validate_dryness
    applies_to: "final acceptance"
    rule: "Use actual applicable dryness and visual criteria and observed result. Booking, trim allowance, primer waiting and final drying durations are product/site records; no universal 3–5 minutes, two inches, 24 hours or service lifetime. Accepted residual moisture is not silently zero."
    source_ids:
      - roman-paper-preparation
      - roman-first-strip
      - roman-wall-preparation
  - rule_id: validate_rework
    applies_to: "failed states and corrections"
    rule: "Every rejected state has rework, retained WIP, usable original-material exit or actual discard destination at its producing/custody node. Count each accepted patch once and every real correction event once; discard record duplicates only."
    source_ids: []
  - rule_id: validate_services
    applies_to: "shared sources"
    rule: "Require actual provider, period and source reconciliation. For electricity deduct all direct assignments and allocate a known positive residual only to eligible actual activity shares not covered directly, with complete positive weights and denominator. Known zero residual retains only direct quantities without a shared denominator; unknown or negative residual is a gap. For services allocate the full charged availability using all actual consumers and complete positive weights, including paid idle. Reject invented working-day conversion and electricity/component duplication."
    source_ids: []
  - rule_id: validate_periods
    applies_to: "lot event coverage"
    rule: "Reconcile opening/closing WIP and burdens across all actual periods. Unresolved termination/replacement ownership blocks finalization; no state rollforward may create duplicate purchase or evaporation."
    source_ids: []
  - rule_id: validate_own_node_releases
    applies_to: "paste_book_other_releases; hang_trim_other_releases; dry_accept_other_releases"
    rule: "Require actual occurrence, species/state, receiving compartment, quantity method and own-node protocol before a concrete non-H2O release exchange. Do not infer occurrence or a numerical zero from missing evidence, assign all releases to drying, or count captured waste again as an elementary release."
    source_ids: []
  - rule_id: validate_identity
    applies_to: "all exchange identities"
    rule: "Verify concrete identity fits material/formulation/state/provider/medium and the declared property/unit. A water-vapour UUID can be reused only for its exact H2O air identity; it does not prove quantity. Unknown species/medium never becomes generic VOC or mixed dust."
    source_ids: []
  - rule_id: validate_coverage
    applies_to: "completed package"
    rule: "Report performed and skipped checks, quantity/identity gaps and uncertainty. Mechanical projection or checker success cannot certify real completeness, identity confirmation or provisional Range plausibility. Material gaps block a completed dataset claim."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground collection package for the declared installation service; process or lifecyclemodel projection only after exchange resolution and quality review"
  downstream_use: "secondary_dataset; background_dataset, subject to the disclosed job scope and quality"
  allowed_use: "Modelling the specified paste-the-paper installation responsibility from an accepted prepared wall to actual dry acceptance, with compatible material and site context"
  excluded_use: "Wallpaper/adhesive/wall manufacture; old-cover removal/major repair/primer application; vinyl or other installation route; use-phase lifetime, maintenance or end of life; a claim that this narrower route represents every 54750 activity"
  required_metadata: "job/lot and site/geography; wall/primer received condition; actual paper construction/batches/pattern; adhesive product/formulation; route and provider responsibilities; patch/strip IDs; area rule and A; booking/drying and acceptance evidence; periods, corrections and termination; upstream datasets; transfer, waste and water destinations; utilities/services attribution"
  required_quality_disclosure: "measurement method/calibration and uncertainty; full/partial fate coverage; original usable-exit treatment; shared consumers/paid idle; unresolved exchange/support identities and quantities; skipped checks; provisional author Ranges; scope limits and representativeness"
  update_trigger: "Changed paper or adhesive, received substrate/interface, installation route or acceptance criterion; revised measured quantity/fate evidence; new utility/provider or service contract; corrected rework/period attribution; stronger independent ranges or resolved identities"
