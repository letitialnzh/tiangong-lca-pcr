      unit: "kWh; h"
      frequency: "each meter/source/contract period and actual allocation revision"
      temporal_coverage: "all work, waiting, drying and correction periods attributable to this lot at this node"
      site_scope: "actual layout_cut consumer and every source-period co-consumer"
      aggregation_rule: "per 1 m2 reference flow"
      quality_evidence: "meter/invoice; provider/voltage evidence; complete consumer and weight ledger; signed contract/calendar; actual charge-unit conversion; service component reconciliation"
