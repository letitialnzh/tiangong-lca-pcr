boundary_abstraction:
  declared_starting_condition: "Accepted smooth, sound, clean, dry and appropriately primed interior wall; actual unpasted paper rolls and compatible ready-mixed aqueous adhesive supplied to the job"
  starting_condition_role: "Upstream received installation interface, with separate proof of preparation and acceptance; it does not imply primer application within this foreground boundary"
  product_classification_scope: "The specific paper-wallpaper installation service above; classification 54750 has a wider semantic scope than this selected route"
  recursive_input_rule: "A same-category service purchased for another contractor's portion crosses the declared responsibility gate once. Record its scope, accepted area, provider and period; either use its upstream service dataset or expand its work records, never both. Do not feed this lot's own intermediate state back as a purchased final service."
  upstream_dataset_requirement: "Identify separate datasets or explicit gaps for actual paper, aqueous adhesive, water, electricity and charged services. Link upstream wall preparation separately when the downstream study includes it. Internal cut, booked and hung states have custody IDs and measured states rather than invented market-product identities."
  disclosure: "Publish the received-wall condition and evidence; material grades/formulations; included node responsibility and periods; outsourced service scope; actual rework and waste routing; measured/estimated water fates; shared-service attribution; remaining identity and quantity gaps"
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Paste-the-paper interior wallpaper installation services"
    uuid: ""
  flow_property_ref:
    uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
  unit_group_ref:
    uuid: "93a60a57-a3c8-18da-a746-0800200c9a66"
  reference_unit: "m2"
  required_qualifiers:
    - "job/lot and wall IDs"
    - "site/geography"
    - "received substrate and primer state"
    - "actual unpasted paper construction"
    - coating
    - grade
    - "roll batch"
    - "pattern match and repeat"
    - "actual aqueous adhesive product and compatibility"
    - "booking instruction and observed interval"
    - "net-area measurement rule"
    - "dryness criterion and observed acceptance"
    - "work and correction periods"
    - "utilities and service providers"
    - "waste and water destinations"
reference_flows:
  []
measurement_rules:
  - id: accepted_area
    applies_to: "reference product"
    required_property_ref:
      name: "Area"
      uuid: ""
    required_unit: "m2"
    rule: "A is the positive net wall surface finally accepted for this lot, measured from actual dimensions and openings with an explicit overlap/corner rule. Count each accepted patch once. Trial, rejected, unaccepted and repeated covering areas do not enlarge A. Use cp_dry_accept."
  - id: common_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "Declared row unit"
    rule: "Normalize each node's attributed physical total once by the same A. The final service is A/A = 1 m2. An internal transfer keeps its own actual numerator and is never set to 1 merely because the reference is 1 m2."
  - id: paper_mass_area_bridge
    applies_to: "paper_rolls; cut_strips; paste_feed; booked_strips; hang_feed; wet_wallcovering; dry_feed"
    required_property_ref:
      name: "Mass and Area"
      uuid: ""
    required_unit: "kg and m2"
    rule: "Record actual paper dimensions and weighing/moisture condition by strip and transfer ID. Retain both wet/dry mass and area observations where needed. Count, nominal roll area or dry grammage alone cannot replace actual wet handoff mass or hydrated installed area."
  - id: water_constituent_basis
    applies_to: "paste_book_vapour; hang_trim_vapour; dry_vapour"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Water is constituent H2O, not total adhesive, total wet-paper or total wastewater mass. Record wet masses and corresponding measured or traceable water fractions with time and moisture method. No complete-fate assumption from a partial balance."
  - id: stock_exclusivity
    applies_to: "paper_rolls; adhesive; wash_consumables; unused_paper_return; unused_adhesive_return; unused_hanging_consumable_return"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Gross physical draw includes usable returns or external unused transfers: opening intact unissued stock + receipts - closing intact unissued stock. Use separate positive usable-exit outputs in kg. Closing intact stock, return, external transfer, processed material and WIP are exclusive pools."
  - id: service_time
    applies_to: "layout_cut_shared_service; paste_book_shared_service; hang_trim_shared_service; dry_accept_shared_service"
    required_property_ref:
      name: "Duration"
      uuid: ""
    required_unit: "h"
    rule: "Use actual contract start/end and charged availability periods, including attributable paid idle. No 8-hour day or assumed booking/drying interval. Keep a supplier's incompatible charge unit in the source record and establish an evidenced conversion before producing an h exchange."
process_map:
  - id: layout_cut
    name: "Accept wall, plan pattern and cut paper"
    inclusion: "required"
    inclusion_condition: "All covered installations"
    role: "Receive accepted wall and paper; establish strip layout and cut-state handoff; own dry offcuts and roll packaging"
    quantitative_reference: "actual cut-strip mass and dimensions; normalized by final A"
  - id: paste_book
    name: "Paste paper and book"
    inclusion: "required"
    inclusion_condition: "All covered installations"
    role: "Receive cut strips; apply actual compatible aqueous adhesive and book according to actual instructions; hand over wet booked strips"
    quantitative_reference: "actual wet booked-strip mass and water state; normalized by final A"
  - id: hang_trim
    name: "Hang, match, smooth, trim and wet-clean"
    inclusion: "required"
    inclusion_condition: "All covered installations"
    role: "Receive booked strips, apply to received wall, complete matching and wet cleanup; hand over actual hung surface awaiting dryness"
    quantitative_reference: "actual hung area and constituent masses; normalized by final A"
  - id: dry_accept
    name: "Dry, inspect and accept"
    inclusion: "required"
    inclusion_condition: "All covered installations"
    role: "Receive wet hung surface, observe dryness and visual quality, route failed states and hand over accepted service"
    quantitative_reference: "A m2 finally accepted surface"
process_inventory:
  - id: layout_cut
    label: "Accept wall, plan pattern and cut paper"
    inputs:
      product:
        - row_id: paper_rolls
          role: "Unpasted paper wallpaper in rolls"
          name: "Unpasted paper wallpaper in rolls"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Actual decorative paper construction/coating, grade, batch, pattern and supplied moisture state; exclude vinyl, base paper and prepasted material."
          amount:
            expression: "Gross paper draw / A; never deduct unused exits in this input."
            value_mode: "calculated_value"
            specificity: "site_specific"
            basis:
              text: "per 1 m2 reference flow"
