      collection_method: "Receive identified cut strips at measured moisture state; weigh actual formulated adhesive issue and exclusive stock/returns. Retain product-specific compatibility and actual booking instruction and observed times. Measure wet booked strips and moisture using traceable wet/dry specimens or validated formulation/constituent evidence without assuming all mass gain is adhesive. Assign water in every residue, container, usable exit and WIP to one fate. Use paste_water_balance only with full fate coverage or independently measured evaporation. Preserve actual repeated pasting/bookings and match outgoing transfers. Divide physical own-node totals once by final A.  Generic stock and unused-exit keys map to this material ledger adhesive_* fields. formulation_water_draw_kg is gross formulated adhesive draw times its evidenced adhesive_water_fraction, with different batch fractions calculated separately; do not treat it as additional water input. Container and residue water are counted exclusively.  Generic gate mass/area/water keys are this node's time-specific strip or patch handoff observations; generic waste keys are individual material-resolved transfers, not additional quantities. Opening/closing WIP IDs and outgoing_rework_water_kg identify separately owned actual loop states.  For actual non-H2O direct releases at this node, retain occurrence evidence, exact species and physical-state basis, receiving compartment, released mass, method and uncertainty. Apply direct_release_total using this own-node protocol only. Unknown occurrence, species, medium or mass remains a gap; a documented absence requires evidence and is not inferred from another node. Captured solid and liquid transfers are not counted again as direct releases."
