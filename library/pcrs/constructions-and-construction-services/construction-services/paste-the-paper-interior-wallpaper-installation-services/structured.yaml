      rule: "H_source = actual contract charged availability hours including paid idle, from actual contract periods and evidenced charge-unit conversion. H_node = H_source × positive_weight_node / sum(all positive consumer weights). Sum exclusive source periods and divide H_node by A. Include reserved/idle consumers in the evidenced weighting method; no 8-hour working-day multiplier or assumed drying duration. Preserve provider service boundary and avoid duplicated included electricity."
