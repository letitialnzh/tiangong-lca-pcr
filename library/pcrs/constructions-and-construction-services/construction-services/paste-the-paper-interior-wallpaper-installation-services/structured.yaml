      raw_fields: "event_id; job_lot_id; period_id; wall_id; wall_dimensions_m; openings_m2; received_area_m2; primer_identity; wall_condition; wall_acceptance; paper_grade; roll_id; pattern_match; pattern_repeat_m; paper_opening_kg; paper_receipts_kg; paper_closing_intact_kg; paper_unused_return_kg; paper_unused_external_transfer_kg; strip_id; transfer_id; strip_dimensions_m; strip_mass_kg; paper_moisture_fraction; offcut_mass_kg; packaging_tare_kg; waste_custodian; rework_origin; rework_destination; closing_wip_id; closing_wip_mass_kg; A_m2; material_id; opening_intact_unissued_kg; receipts_kg; closing_intact_unissued_kg; unused_return_kg; unused_external_transfer_kg; actual_wet_mass_kg; tare_kg; evidenced_water_fraction; waste_material; custodian; gate_mass_kg; gate_area_m2; gate_water_kg; moisture_fraction; opening_wip_id; outgoing_rework_water_kg"
      collection_method: "Survey actual wall and openings; retain received primed/dry interface acceptance. Identify rolls and cut strips; weigh actual material and intact stock on calibrated scales or use traceable same-grade mass records. Keep supplied paper mass exclusive of packaging tare. Log real cuts, corrections, offcut discards and usable custody exits separately. Match strip transfers and WIP across periods. Reconcile gross_draw, paired_transfer and waste_totals before dividing each own-node numerator by the same final A.  Generic stock keys are the per-material paper ledger fields: paper_opening_kg, paper_receipts_kg and paper_closing_intact_kg; generic unused-exit keys map to the corresponding paper return/transfer fields.  Generic gate mass/area/water keys are this node's time-specific strip or patch handoff observations; generic waste keys are individual material-resolved transfers, not additional quantities. Opening/closing WIP IDs and outgoing_rework_water_kg identify separately owned actual loop states."
      unit: "kg; m; m2"
