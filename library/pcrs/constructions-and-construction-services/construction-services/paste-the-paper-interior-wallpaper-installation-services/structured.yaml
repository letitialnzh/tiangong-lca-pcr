      record_type: "exclusive source-period attribution ledger"
      raw_fields: "event_id; job_lot_id; period_id; node_id; source_id; meter_id; meter_start_kWh; meter_end_kWh; direct_node_kWh; shared_source_kWh; utility_provider; voltage; mix_geography; source_period_start; source_period_end; consumer_id; consumer_node; consumer_period; positive_weight; all_consumer_weight_sum; service_provider; asset_id; contract_id; charge_unit; contract_start; contract_end; charged_hours; active_hours; paid_idle_hours; service_component_boundary; already_included_energy; A_m2; source_total_kWh; direct_consumer_kWh; positive_weight_node; source_period"
