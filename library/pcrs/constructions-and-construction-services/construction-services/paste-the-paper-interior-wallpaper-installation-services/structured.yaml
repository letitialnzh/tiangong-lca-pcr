allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "node activities"
    rule: "Prefer measured separate responsibilities and exclusive events. Record purchased service portions once at their actual boundary; do not count both the supplier's service and its expanded material/utilities inventory."
    source_ids: []
  - rule_id: allocation_service_lot
    applies_to: "accepted installation lot"
    rule: "Assign this lot's actual layout, booking, hanging, drying, failed attempts, corrections, handling and waste burdens to its finally accepted A. Neither discarded paper nor a usable unused return receives installation or correction burdens as a credit."
    source_ids: []
  - rule_id: allocation_unused
    applies_to: "usable unprocessed boundary exits"
    rule: "Keep gross physical inputs and positive usable outputs unchanged. Transfer only the original unused material's corresponding upstream burden with a demonstrably usable unprocessed exit. Net-consumed material is a diagnostic, not an additional physical exchange, negative credit or avoided-production claim. Processed rejects do not qualify as unused original material."
    source_ids: []
  - rule_id: allocation_shared
    applies_to: "shared electricity, assets and services"
    rule: "For electricity, subtract all independently assigned direct-consumer quantities from the source total first. Allocate a positive residual only among remaining eligible actual activity shares not already covered by direct assignment, using their evidenced positive weights and positive complete denominator. Fully directly assigned activity shares do not receive the residual again. If the known residual is zero, retain direct_node_kWh alone without inventing a shared denominator; unknown or negative residual is a data gap. For charged services, allocate the complete actual charged availability total, including paid idle/reserved availability, over all evidenced consuming shares using positive complete weights. Reconcile every source total including consumers outside this lot."
    source_ids: []
  - rule_id: allocation_periods
    applies_to: "work, waiting, correction and acceptance periods"
    rule: "Link each unique event and opening/closing state to actual periods and the service lot. Carry WIP state and already incurred burdens across a reporting cutoff without repeating them as new purchases/events. Combine the relevant period burdens for the final accepted lot; no universal annualization or lifetime factor."
    source_ids: []
  - rule_id: allocation_rework
    applies_to: "loops, rejects and terminated lots"
    rule: "Retain every real correction event once and remove only duplicate records. A failed patch becomes accepted area only at its final accepted state. A terminated lot with no accepted area cannot be divided by zero or merged invisibly into an unrelated successful lot: disclose its separate failed-service inventory and attribution decision."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "captured waste and treatment"
    rule: "Report actual custodian transfers by material and moisture state. Any treatment dataset responsibility and recovery claim need an explicit boundary; collection itself does not prove recycling or an avoided burden."
    source_ids: []
