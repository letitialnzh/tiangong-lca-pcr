boundary_abstraction:
  declared_starting_condition: "Factory-assembled bench and separately supplied mechanical anchor hardware received; existing reinforced slab already constructed and explicitly accepted for actual anchor/bench system"
  starting_condition_role: "Upstream supply gates and accepted existing host interface; unknown pre-existing concrete is not default accepted"
  product_classification_scope: "Narrow street-furniture installation service subset of CPC 3.0 54400"
  recursive_input_rule: "Any purchased same-category installation contribution is an explicit bounded subcontract input with its actual gate/coverage; do not recursively recreate it or claim a completed installation as an uninstalled bench."
  upstream_dataset_requirement: "Separate upstream bench, hardware, packaging and actual resource/service datasets with geography/time/technology and included transport/energy coverage. Retain unresolved coverage; no fabricated proxy."
  disclosure: "Record host evidence, ownership, actual instructions, receipt/acceptance dates, stock/returns, correction history and all shared asset consumers/periods. Existing slab production is outside this service gate; newly required slab work changes the boundary."
reference_flow_definition:
  reference_amount: "1"
  product_flow_ref:
    name: "Accepted mechanically surface-anchored prefabricated park bench installation service"
    uuid: ""
  flow_property_ref:
    uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
  unit_group_ref:
    uuid: "5beb6eed-33a9-47b8-9ede-1dfe8f679159"
  reference_unit: "item"
  required_qualifiers:
    - "Actual bench model/length/material/finish/supports/arms"
    - "anchor SKUs/count/design/current instructions"
    - "slab strength/cure/thickness/condition/reinforcement/edge and spacing compatibility"
    - "levelling arrangement"
    - "site/date"
    - "acceptance/correction evidence"
    - "upstream supply and service boundaries"
reference_flows:
  []
measurement_rules:
  - id: count_reference
    applies_to: "reference product"
    required_property_ref:
      name: "Number of items"
      uuid: "01846770-4cfe-4a25-8ad9-919d8d378345"
    required_unit: "item"
    rule: "Count complete accepted installations only; bench, leg, seat and anchor counts are not installation equivalence."
  - id: retain_measurements
    applies_to: "inventory records"
    required_property_ref:
      name: "Actual exchange property"
      uuid: ""
    required_unit: "Actual documented unit"
    rule: "Retain native mass, count, energy and service measurements. Mass requires measured or traceable SKU masses; do not convert geometry or time to mass/energy without actual evidence. Verify each support property and unit group before final exchange construction; unresolved Energy/Duration or service support cannot be borrowed from count."
  - id: count_unit_alias
    applies_to: "Count-based exchanges where present"
    required_property_ref:
      name: "Count"
      uuid: ""
    required_unit: "item"
    rule: "The PCR display alias item denotes the verified Number of items unit-group reference unit Item(s), factor 1. Preserve the actual reference-unit identity in a concrete dataset; this spelling change creates no mass, area or service equivalence."
process_map:
  - id: bench_install
    name: "Mechanical bench-to-slab assembly integration and acceptance"
    inclusion: "required"
    inclusion_condition: "Compatible accepted existing slab and actual mechanical system; conditional materials/services follow recorded activity"
    role: "Own component interface, drilling/cleaning/fastening, inspection and closed rework loop; supplier returns and actual waste exits originate here"
    quantitative_reference: "1 item accepted installation"
process_inventory:
  - id: bench_install
    label: "Mechanical bench-to-slab assembly integration and acceptance"
    inputs:
      product:
        - row_id: assembled_bench
          role: "Factory-assembled four-legged park bench at supply gate"
          name: "Factory-assembled four-legged park bench at supply gate"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "The complete bench arrives with its specified supports and ordered arms already attached. Preserve actual model, length, materials, finish, support and arm configuration; do not substitute raw metal/wood or fabricate component assembly onsite. Range evidence need: Obtain delivery/acceptance and replacement counts for this configuration and comparable jobs before deriving a supply-to-accepted-output interval."
          amount:
            expression: "Record complete benches entering the job, including replacements, with serial/lot and fate reconciliation."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_materials
              source_ids:
                - lf-austin-installation-2009
                - lf-austin-product
            ranges: []
        - row_id: electricity
          role: "Actual electricity for drilling and field tools"
          name: "Actual electricity for drilling and field tools"
          flow_type: "product"
          property_unit: "Energy / kWh"
          description: "Record site/provider/voltage and metering boundary for electric drilling, fastening, charging and cleanup. Compressor or hired-service electricity is included here only when excluded from the corresponding service dataset. Range evidence need: Require meter records, task duration, equipment operating state and all shared consumers; neither power rating alone nor an assumed Energy support identity defines a valid range."
          amount:
            expression: "Meter attributable electricity; separate direct meters from documented shared allocation and included service energy."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_resources
              source_ids: []
            ranges: []
        - row_id: touchup_material
          role: "Conditional localized finish-damage repair material"
          name: "Conditional localized finish-damage repair material"
          flow_type: "product"
          property_unit: "Mass / kg"
          description: "Only actual minor mechanical handling damage closed before handover activates this card. Identify approved touch-up formulation, amount and curing/cleaning requirements. Substantial refinishing or chemical anchoring requires boundary review outside this dry mechanical route. Range evidence need: Actual approved product, damage area, measured use and manufacturer composition are required; no normal painting consumption is assumed."
          amount:
            expression: "Measure actual consumed repair product; retain its solids/solvent composition and disposal. Recorded absence is zero."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_repairs
              source_ids:
                - lf-austin-installation-2009
            ranges: []
      waste:
        []
      elementary:
        []
    outputs:
      product:
        - row_id: accepted_installation
          role: "Accepted mechanically surface-anchored prefabricated park bench installation service"
          name: "Accepted mechanically surface-anchored prefabricated park bench installation service"
          flow_type: "product"
          property_unit: "Number of items / item"
          description: "One complete actual bench is level, undamaged and mechanically fixed at every required connection on accepted compatible existing reinforced concrete. All corrections are closed and signed site handover records identify bench and anchors. Range evidence need: Exactly one accepted installation defines the reference, not a yield range; obtain job acceptance/reject histories to quantify acceptance uncertainty."
          amount:
            expression: "1 item"
            value_mode: "fixed_value"
            specificity: "site_specific"
            basis:
              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_acceptance
              source_ids:
                - lf-austin-installation-2009
            ranges: []
      waste:
        []
      elementary:
        []
allocation_rules:
  - rule_id: retain_corrections
    applies_to: "bench_install"
    rule: "Keep all installation attempts, drilling/clearing, failed anchors and minor repair burdens associated with the accepted job; exclude unresolved rejects from accepted counts. Internal correction is a loop within bench_install, not a second successful product. Trace usable supplier returns, stock and discard separately; no assumed recovery or avoided-production credits."
    source_ids: []
  - rule_id: shared_attribution
    applies_to: "shared resources"
    rule: "Allocate metered or provider-documented resource burdens with actual causal service time/load evidence over the complete asset consumer ledger and stated period; enumerate this job and other consumer nodes/jobs/periods. Disclose chosen driver and unallocated balance. If driver evidence is absent keep attribution incomplete; no default equal share or invented asset lifetime."
    source_ids: []
  - rule_id: coverage_overlap
    applies_to: "materials and service boundaries"
    rule: "Use one owner for each physical event and each upstream burden. A gross receipt with explicit outward return must not also subtract that return from purchases. Opening/closing stock reconciliation is separate from crossed-boundary returns. Split provider-included electricity/fuel/air/equipment/transport from separately metered exchanges; never add both."
    source_ids: []
  - rule_id: no_coproduct_default
    applies_to: "outgoing usable products"
    rule: "Usable glides/packaging/hardware and supplier-returned benches are documented custody exits, not automatically economic co-products. Retain job burdens without substitution credit; any actual multi-output attribution requires separately evidenced review."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_materials
      process_id: "bench_install"
      flow_role: "Bench hardware shims packaging receipts and use"
      record_type: "Receipt and material ledger"
      raw_fields: "job_id; model; serial_lot; sku; actual_configuration; supply_gate; received_count; measured_mass; unit_mass_basis; opening_stock; closing_stock; installed; damaged; return_id; upstream_coverage"
      collection_method: "Record gross job-boundary hardware/shim receipts/issues, then reconcile installed, wasted, actual outward returns and closing stock separately without netting the same return from the input. Use calibrated weighing or supplier SKU masses. Packaging already included upstream stays in the custody/exit ledger without a second supply exchange; keep actual mass. Record glides removed from bench without inventing a separate new glide input. Normalize attributable job totals by accepted complete installation count; reconcile failed attempts."
      unit: "item; kg"
      frequency: "Each receipt/use/stock change"
      temporal_coverage: "Entire first-installation job including corrections"
      site_scope: "Actual job and supplier gates"
      aggregation_rule: "per reference flow"
      quality_evidence: "Traceable invoices, scale checks, SKU weights, stock/transfer records and configuration match"
    - protocol_id: cp_resources
      process_id: "bench_install"
      flow_role: "Electricity compressed air shared assets and services"
      record_type: "Meters and service ledger"
      raw_fields: "job_id; asset_id; provider; meter_start; meter_end; native_unit; operating_hours; idle_hours; air_delivery; pressure; service_period; consumer_id; consumer_driver; total_driver; included_energy; maintenance_coverage"
      collection_method: "Meter direct use; record compressor cleaning and actual lifting/tool sessions. Enumerate every consumer and period in each shared ledger; document causal driver and reconciliation to total burden. Preserve actual air delivery and provider units. Include electricity once according to service coverage; divide job-attributable totals by accepted count."
      unit: "kWh; h; actual provider units"
      frequency: "Every task/session and shared period close"
      temporal_coverage: "Full job and complete relevant shared-service periods"
      site_scope: "Actual site/job plus every external consumer of shared assets"
      aggregation_rule: "per reference flow"
      quality_evidence: "Meter calibration, compressor/provider records, task logs, all-consumer ledger and overlap/driver evidence"
    - protocol_id: cp_logistics
      process_id: "bench_install"
      flow_role: "Material return and waste freight"
      record_type: "Route and cargo records"
      raw_fields: "job_id; leg_id; carrier; vehicle; origin; destination; loaded_distance; actual_cargo_mass; load_share; empty_leg; transfer_id; upstream_transport_coverage"
      collection_method: "Use shipment/transfer records and evidenced routes/cargo masses; attribute shared/empty legs with actual logistics evidence, state overlap with supplied datasets and reconcile outbound recipient. Normalize attributable service by accepted count."
      unit: "t*km; kg; km"
      frequency: "Every actual leg"
      temporal_coverage: "Receipt to handover and attributed return/waste legs"
      site_scope: "Actual routes serving job"
      aggregation_rule: "per reference flow"
      quality_evidence: "Carrier documents, route evidence, cargo weighings, load ledger and dataset-boundary comparison"
    - protocol_id: cp_repairs
      process_id: "bench_install"
      flow_role: "Conditional minor finish repair"
      record_type: "Damage repair log"
      raw_fields: "job_id; damage_id; area; approved_product; formulation; used_mass; solids; solvent_species; curing; method; waste_id; approval; closure"
      collection_method: "Document actual mechanical damage, approved minor repair and measured product consumption. Link to release/residue evidence and signed closure; no repair becomes a normal painting route. Divide job totals by accepted count; major work triggers boundary review."
      unit: "kg; actual repair units"
      frequency: "Every actual repair or documented absence"
      temporal_coverage: "Full job before acceptance"
      site_scope: "Actual damaged bench and repair supplier"
      aggregation_rule: "per reference flow"
      quality_evidence: "Approved product data/composition, measured use, photographs and signed repair closure"
    - protocol_id: cp_acceptance
      process_id: "bench_install"
      flow_role: "Accepted reference output"
      record_type: "Inspection and handover"
      raw_fields: "job_id; bench_serial; model; length; material; finish; support; arms; anchor_sku; fixing_count; current_instructions; slab_evidence; level; fastener_check; defects; correction_closure; accepted_count; signoff_date"
      collection_method: "Inspect actual slab/anchor compatibility before drilling and finished installed bench after all corrections. Reconcile every required fixing, levelling and support/finish condition with current instructions and signed handover. Count only complete accepted installations; denominator excludes unresolved rejects."
      unit: "item"
      frequency: "Each acceptance and correction close"
      temporal_coverage: "First-installation job through signed handover"
      site_scope: "Actual installed bench and host interface"
      aggregation_rule: "per reference flow"
      quality_evidence: "Design/current instructions, slab records, pre/post inspections and signed client acceptance"
    - protocol_id: cp_fates
      process_id: "bench_install"
      flow_role: "Bench returns usable glides packaging hardware and discard"
      record_type: "Custody stock and waste ledger"
      raw_fields: "job_id; transfer_id; source_receipt; material; condition; count; measured_mass; fate; recipient; receipt_ack; opening_stock; closing_stock; reject_cause; treatment; hazard"
      collection_method: "Pair actual outward transfers to receipt and condition. Separate complete bench returns, usable material returns, retained stock and actual waste; bench_install owns rejection/correction exits. Weigh by material and reconcile recipient/treatment; do not subtract a return twice. Normalize job totals by accepted count."
      unit: "item; kg"
      frequency: "Every transfer/reject and stock close"
      temporal_coverage: "Entire job and recorded linked outbound fates"
      site_scope: "Job boundary and actual receivers"
      aggregation_rule: "per reference flow"
      quality_evidence: "Recipient acknowledgement, scales, stock balance, reject photos and waste/treatment receipts"
    - protocol_id: cp_releases
      process_id: "bench_install"
      flow_role: "Captured debris airborne particulate and conditional repair release"
      record_type: "Debris and emission records"
      raw_fields: "job_id; bore_id; concrete_composition; particle_size; captured_mass; moisture_basis; uncollected_release; substance; compartment; measurement_method; capture_efficiency_evidence; repair_id; uncertainty; treatment_id"
      collection_method: "Measure captured debris and separately characterize uncaptured release by substance/size and receiving air; applicable emission calculations retain actual activity and method uncertainty. For minor repair link product composition and actual release conditions. Reconcile captured/emitted masses on stated basis, avoid treating whole removed concrete as airborne or whole repair product as solvent; normalize by accepted count."
      unit: "kg; actual sampling units"
      frequency: "Each drilling/clearing and actual repair event"
      temporal_coverage: "All installation and correction tasks"
      site_scope: "Actual bench installation exposure/control conditions"
      aggregation_rule: "per reference flow"
      quality_evidence: "Sampling/scale quality, method applicability, material/species evidence, treatment receipt and uncertainty statement"
  calculation_rules:
    - id: normalize_job
      applies_to: "non-reference inventory"
      rule: "q_ref = q_job / N; N = complete accepted installations in the declared comparable job lot; retain all attributable correction burdens and disclose any rejected-job treatment. Do not normalize if N is zero."
      inputs:
        - q_job
        - "accepted_count N"
        - "linked collection protocol"
      output: "q_ref per reference flow"
      source_ids: []
    - id: stock_custody
      applies_to: "material ledger"
      rule: "Reconcile opening stock plus receipts against installed/consumed material, actual outward usable returns, discard and closing stock by consistent material/unit. Returns are explicit exits; never also deduct them from gross receipts."
      inputs:
        - cp_materials
        - cp_fates
        - transfer_id
      output: "Reconciled material/custody ledger"
      source_ids: []
    - id: shared_ledger
      applies_to: "shared resource rows"
      rule: "Attribute actual shared burden using documented causal job_driver / total_driver for the complete declared consumer period; reconcile all consumer shares and unallocated residual. Service boundary excludes separately counted included energy."
      inputs:
        - cp_resources
        - "consumer ledger"
        - "provider coverage"
      output: "Attributable resource amounts and disclosed residual"
      source_ids: []
    - id: freight_activity
      applies_to: "freight"
      rule: "Calculate each evidenced loaded-leg cargo mass in tonnes times actual distance in km, retaining actual loading/empty-return allocation evidence. Do not invent mass or distance."
      inputs:
        - cp_logistics
      output: "t*km by actual leg"
      source_ids: []
  data_quality_requirements:
    - id: actual_identity
      applies_to: "all exchanges"
      requirement: "Resolve actual model/SKU/provider/substance, state, receiving compartment and property/unit before final dataset exchanges. Conditional umbrellas expand only after actual records; unresolved identity remains a blocker."
      evidence: "Supply data, provider detail and concrete identity/support confirmation"
    - id: host_and_gate
      applies_to: "reference"
      requirement: "Unknown existing slab is not accepted; retain actual compatibility and instruction evidence, every required fixing and closed defects. Historical dimensions are illustrative system evidence."
      evidence: "cp_acceptance; lf-austin-installation-2009"
    - id: complete_job
      applies_to: "all quantities"
      requirement: "Cover receipts through final correction/acceptance, stock/custody, shared periods and outbound waste; disclose missing meters, release characterization and provider coverage."
      evidence: "All linked protocols and reconciliations"
    - id: range_evidence
      applies_to: "all cards"
      requirement: "No universal inventory interval is evidenced here. Obtain card-specific actual observations/method uncertainties before range authoring; exact reference is definition. Do not present unmeasured emission or service quantities as zero."
      evidence: "Linked protocol, card Range evidence need and uncertainty evidence"
validation_rules:
  - rule_id: scope_gate
    applies_to: "job"
    rule: "Reject this route if cantilever/epoxy, unaccepted slab or new slab/foundation work is required; current actual bench/anchor instructions and compatible concrete precede drilling."
    source_ids:
      - lf-austin-installation-2009
  - rule_id: handover_complete
    applies_to: "accepted_installation"
    rule: "Require complete level undamaged installed bench, all specified mechanical fixings, closed corrections and signed handover; rejected/returned bench is not an accepted output."
    source_ids:
      - lf-austin-installation-2009
  - rule_id: inventory_complete
    applies_to: "bench_install"
    rule: "Reconcile separately supplied bench/hardware/shims, protective packaging, actual drilling/clearing electricity and compressed air, actual assets/logistics, usable glides/packaging/stock, captured waste and characterized airborne release. Record actual minor repair only when activated."
    source_ids:
      - lf-austin-installation-2009
  - rule_id: shared_and_fates
    applies_to: "allocation"
    rule: "Check complete asset consumers/periods, attributable driver evidence and one owner per burden. No service/energy overlap, double return subtraction, invented recovery credit or stock-as-return exchange."
    source_ids: []
  - rule_id: binding_and_uncertainty
    applies_to: "final foreground dataset"
    rule: "All concrete exchanges need verified identity/property/unit; no generic dust/VOC UUID or borrowed service support. Unresolved records/ranges/support remain explicit incompleteness even if candidate structural checks pass."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground first-installation service data package with explicit upstream supply and accepted existing host interface"
  downstream_use: "secondary_dataset; background_dataset; downstream process and lifecyclemodel projections"
  allowed_use: "Declared first mechanical surface anchoring of comparable fully assembled four-legged park bench at the same qualified gate"
  excluded_use: "Furniture manufacture, cantilever/epoxy anchoring, new foundations/slabs, maintenance/use/end of life, safety design or generic equivalence across unspecified bench systems"
  required_metadata: "All reference qualifiers; job/site/time; actual instructions and host/design acceptance; supplier/service boundaries; consumer ledger; stock/custody and corrections"
  required_quality_disclosure: "Unresolved concrete flow/support identities; missing quantities/ranges; release characterization; actual shared attribution/overlap; conditional activation and acceptance coverage"
  update_trigger: "Changed bench/anchor/host system or instructions; altered service boundary; changed material/finish repair or refinishing; new verified identities or quantity/range evidence"
