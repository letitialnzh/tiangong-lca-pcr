allocation_rules:
  - rule_id: allocation_avoid
    applies_to: "foreground_burden_allocation"
    rule: "First separate measured directly attributable electricity/materials and product cohorts; use line/submeter or documented causal runtime partition only where tested against joint meters. Do not borrow coniferous sawmill allocation shares."
    source_ids:
      - yu-bamboo-flooring-2019
  - rule_id: allocation_coproduct
    applies_to: "foreground_burden_allocation"
    rule: "Document whether shavings are saleable coproducts or wastes with destination, dry mass and value. If shared burdens cannot be separated causally, require a justified allocation decision and sensitivity analysis before claiming complete product LCI; no automatic mass or economic share is prescribed. Physical shavings and internal handoffs keep original amounts."
    source_ids:
      - inbar-industrial-bamboo-2015
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "profile_production"
      flow_role: "profile_reference"
      record_type: "scale"
      raw_fields: "cohort; species; configuration; continuous profile; accepted final net mass; moisture; coating solids; packaging tare; rejects"
      collection_method: "Calibrated scale of accepted finished strips excluding packaging; pair sample moisture with constant-mass dry weighing and retain drawings/BOM proving no glue or assembly"
      unit: "kg"
      frequency: "each batch; operating-period meters and representative tests"
      temporal_coverage: "same declared production period, covering all shifts, states and rejects"
      site_scope: "selected site and matched product cohort; separately trace upstream suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw records; drawings/specifications; routing closure; uncertainty and detection limits"
    - protocol_id: cp_material
      process_id: "profile_production"
      flow_role: "material exchanges"
      record_type: "weighing"
      raw_fields: "lot; row; process; origin/destination; gross/tare/net mass; treatment; moisture; solid volume; paired density; rejects; same handoff id"
      collection_method: "Weigh lot flows on calibrated scales; inspect substrate and physical profile; paired specimens/actual solid cross-section for density; reconcile source/destination without allocation"
      unit: "kg"
      frequency: "each batch; operating-period meters and representative tests"
      temporal_coverage: "same declared production period, covering all shifts, states and rejects"
      site_scope: "selected site and matched product cohort; separately trace upstream suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw records; drawings/specifications; routing closure; uncertainty and detection limits"
    - protocol_id: cp_energy
      process_id: "profile_production"
      flow_role: "electricity"
      record_type: "meter"
      raw_fields: "meter id; process; start/end kWh; voltage; supply mix; standby; extraction/UV/shrink runtime; parent/child coverage"
      collection_method: "Read calibrated process/utility meters, including extraction and curing; reconcile parent/child meter totals and cohort routing"
      unit: "MJ"
      frequency: "each batch; operating-period meters and representative tests"
      temporal_coverage: "same declared production period, covering all shifts, states and rejects"
      site_scope: "selected site and matched product cohort; separately trace upstream suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; raw records; drawings/specifications; routing closure; uncertainty and detection limits"
