measurement_rules:
  - id: reference_mass
    applies_to: "profile_reference"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh accepted net finished strip including retained coating and measured moisture; exclude all transport packaging. Use cp_reference. All inventory rows use the same final-product kg denominator."
  - id: moisture_basis
    applies_to: "bamboo material rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure paired wet and oven-dry uncoated bamboo specimen masses; dry-basis moisture u = (wet mass - dry mass) / dry mass, dimensionless. Record sampling and constant-mass drying method. For coated specimens separate coating solids; do not count fossil coating carbon as bamboo. Wood Handbook equations are measurement definitions only, not bamboo property defaults."
  - id: solid_volume
    applies_to: "bamboo material rows"
    required_property_ref:
      name: "Mass / solid volume"
      uuid: ""
    required_unit: "kg"
    rule: "Mass = measured solid material volume × paired measured density at the same moisture and coating state. Measure actual shaped cross-section, excluding grooves/voids; bounding-box, stacked/bulk volume and nominal wood density cannot substitute. Preserve a precise volume-reference flow where applicable with this verified conversion."
  - id: electric_energy
    applies_to: "shaping_electricity; coating_electricity; pack_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Record meter kWh and convert using 1 kWh = 3.6 MJ; retain raw readings and supply condition. Do not sum a parent meter and its child meter amounts."
