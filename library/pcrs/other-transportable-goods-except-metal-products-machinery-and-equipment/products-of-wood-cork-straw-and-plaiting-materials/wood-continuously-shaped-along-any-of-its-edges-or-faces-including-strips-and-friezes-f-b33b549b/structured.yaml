  calculation_rules:
    - id: physical_normalization
      applies_to: "all inventory rows"
      rule: "Divide each unallocated cohort exchange total by the same accepted final net product kg. Keep matched handoff totals equal; profile_reference = 1 kg. Preserve raw totals."
      inputs:
        - cp_reference
        - cp_material
        - cp_energy
        - cp_coating
        - cp_residue
        - cp_air
        - cp_pack
      output: "physical amount per 1 kg reference flow"
      source_ids:
        - yu-bamboo-flooring-2019
    - id: bamboo_dry_mass
      applies_to: "bamboo material rows"
      rule: "Dry bamboo mass = uncoated wet bamboo mass / (1 + measured dry-basis moisture); for coated material first exclude measured coating solids and separately establish water. Do not assume all finished mass is biogenic dry matter."
      inputs:
        - cp_material
        - cp_reference
        - cp_coating
      output: "dry bamboo and water ledgers"
      source_ids:
        - usda-wood-handbook-2021
    - id: air_mass
      applies_to: "shaping_pm25; shaping_pm25_10; shaping_pm_gt10; coating_formaldehyde"
      rule: "Concentration × matching gas volume over operating period after blank/moisture/unit corrections gives species mass. From comparable cumulative measurements: middle fraction = PM10 - PM2.5; coarse fraction = TSP - PM10. Require nonnegative compatible totals and propagated uncertainty; incompatible or incomplete sampling is unresolved, never zero. Do not add cumulative PM10 or TSP again."
      inputs:
        - cp_air
        - cp_reference
      output: "disjoint species emissions per 1 kg reference flow"
      source_ids:
        - yu-bamboo-flooring-2019
    - id: balance_and_attribution
      applies_to: "all inventory rows"
      rule: "Reconcile original process input, retained product, separate residues, air releases and storage changes for bamboo dry matter, water and coating solids; investigate residuals against measured uncertainty. Match internal edges first. Build separate burden account using measured causal attribution or an explicitly reviewed allocation decision; do not multiply physical product/coproduct/transfers by burden shares. Track bamboo biogenic carbon separately from coating fossil carbon with measured composition; do not claim storage credits from mass alone."
      inputs:
        - cp_material
        - cp_reference
        - cp_coating
        - cp_residue
        - cp_air
        - cp_energy
      output: "closed physical accounts plus separate attributable LCI"
      source_ids:
        - inbar-industrial-bamboo-2015
        - yu-bamboo-flooring-2019
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Match physical role/state, Tiangong type, full route qualifiers, reference property/unit and emission compartment. Missing identity does not authorize an approximate UUID."
      evidence: "flow original and product specification"
    - id: quality_complete
      applies_to: "all processes"
      requirement: "Screen site BOM, permits, cleaning, lubricants, retained moisture, coating release species and wastes. Additional observed exchanges require individual specific rows, measurement and identity review before complete dataset use. Distinguish zero, absence, below detection and unknown; quantify missing upstream coverage."
      evidence: "cp_material; cp_coating; cp_residue; cp_air; supplier evidence"
    - id: quality_variability
      applies_to: "all protocols"
      requirement: "Cover actual shifts and representative lots, moisture/coating and controls; report time, geography, sample counts, meter reconciliation, uncertainty and limits. No literature industry range or default bamboo density is prescribed."
      evidence: "raw records and calibration"
validation_rules:
  - rule_id: validate_scope
    applies_to: "foreground_dataset_conformance"
    rule: "Fail applicability if adhesive/laminated/strand-compressed substrate, assembled floor, missing continuous profile or unproven single-culm state occurs. Compare cohort routing with actual purchase/sales evidence; status labels cannot establish product boundary."
    source_ids:
      - un-cpc3-2025
      - inbar-industrial-bamboo-2015
      - yu-bamboo-flooring-2019
  - rule_id: validate_inventory
    applies_to: "foreground_dataset_conformance"
    rule: "Require one atomic exchange per row, equal internal links, one final denominator, true conditional absence and no dust/residue double counting. Keep physical quantities separate from attributed burden. Unresolved identities, missing upstream inventories, unclosed balances or unsupported allocation leave a dataset incomplete."
    source_ids:
      - yu-bamboo-flooring-2019
  - rule_id: validate_air_carbon
    applies_to: "foreground_dataset_conformance"
    rule: "Air UUIDs use emissions to outdoor air, unspecified subcompartment, kg mass. Refine site compartments only with matching direct identity. Reject cumulative particle overlap and product-test-limit substitution. Do not delete upstream biogenic CO2 or grant universal carbon-negative credits; classify biogenic and fossil carbon from actual material composition."
    source_ids:
      - inbar-industrial-bamboo-2015
      - yu-bamboo-flooring-2019
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Documented factory-gate supply of this unglued profiled strip; compatible upstream chain only when verified"
  excluded_use: "Generic bamboo board/laminate/scrimber/flooring LCI; installed service comparison; automatic CPC-wide coverage; unverified carbon storage or end-of-life benefit"
  required_metadata: "All reference qualifiers; process map; raw cohort basis; upstream boundary; chosen flow/property/unit; conditional routes; co-product/waste status; attributed burden decision"
  required_quality_disclosure: "Measured vs absent vs unknown; identity gaps; omitted scope; uncertain partition/air balance; sampling/time/geography; no industry recipe defaults"
  update_trigger: "Changed bamboo construction/profile, treatments, coating chemistry, meters, control, supply boundary, routing, allocation or flow identity"
data_sources:
  - id: "un-cpc3-2025"
    type: "official_guidance"
    reference: "UNSD, CPC 3.0 Explanatory Notes, 30 June 2025, printed pp.137, 141, 143; 31212, 31450, 31626. [Original](https://unstats.un.org/unsd/classifications/Econ/Download/In%20Text/CPC_Ver_3.0_Exp_Notes_30Jun2025.pdf)"
    used_for: "Continuous-shape/unassembled classification boundary; labels do not prove engineered-route applicability"
  - id: "inbar-industrial-bamboo-2015"
    type: "official_guidance"
    reference: "Vogtländer and van der Lugt, INBAR Technical Report 35, second edition, 2015, pp.4, 15–20. [Original held by TU Delft](https://repository.tudelft.nl/file/File_877d4812-8c8d-446e-a048-5c14cb9994b9)"
    used_for: "Distinguish strip lamination, compression and flattening; separate carbon boundaries. MOSO-specific case: no recipe/density/yield/carbon-credit defaults adopted"
  - id: "yu-bamboo-flooring-2019"
    type: "literature"
    reference: "Yu, Zeng, Zhang and Wang (2019), Environmental Impact of Bamboo Laminated Flooring and Bamboo Scrimber Flooring Investigated via Life Cycle Assessment, BioResources 14(4), 9132–9145; Fig.1 and pp.9135–9138. [Publisher full text](https://bioresources.cnr.ncsu.edu/resources/environmental-impact-of-bamboo-laminated-flooring-and-bamboo-scrimber-flooring-investigated-via-life-cycle-assessment/)"
    used_for: "Qualitative separation of planing/panel-making/mortise/coating/packing; polyurethane, abrasive paper, PE film and carton prompts subject to site proof. Three Zhejiang/Sichuan makers, 2005–2009. Engineering route data, borrowed wood combustion emissions, estimated formaldehyde limits and omission of TSP are rejected as actual strip inventory"
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood Handbook, FPL-GTR-282 (2021), Chapter 4 pp.4–1 and 4–11. [Original](https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf)"
    used_for: "Only dry-basis moisture and mass/solid-volume definitions, applied to measured bamboo specimens; no wood species density, drying schedule or softwood survey value transferred"
