      record_type: "transfer and composition"
      raw_fields: "separate dust/offcut/bark/ash/effluent/oil, moisture and resin/ash composition, source, recirculation destination, mass, recipient/treatment"
      collection_method: "Weigh/meter each stream and reconcile transfer records; collected ash differs from air PM and cured residues differ from uncured fibres. Aggregation calculation: each actual external waste amount / accepted net MDF mass, per 1 kg reference flow; internal recovery retains equal links only This protocol attributes only actual mdf-line rows/sources; the other process uses cp_residues_utilities. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kg"
      frequency: "shift and transfer"
      temporal_coverage: "complete same declared survey period"
      site_scope: "plant and recipients; actual owning process: mdf-line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "transfer receipts, composition, destination, stocks"
    - protocol_id: cp_residues_utilities
      process_id: "utilities"
      flow_role: "each waste; scoped to utilities"
      record_type: "transfer and composition"
      raw_fields: "separate dust/offcut/bark/ash/effluent/oil, moisture and resin/ash composition, source, recirculation destination, mass, recipient/treatment"
      collection_method: "Weigh/meter each stream and reconcile transfer records; collected ash differs from air PM and cured residues differ from uncured fibres. Aggregation calculation: each actual external waste amount / accepted net MDF mass, per 1 kg reference flow; internal recovery retains equal links only This protocol attributes only actual utilities rows/sources; the other process uses cp_residues. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kg"
      frequency: "shift and transfer"
