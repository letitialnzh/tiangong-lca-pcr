      collection_method: "Test drying, pressing/cooling, finishing/handling and boiler separately or use applicability-verified factors times measured activity; count a shared final stack once while retaining source decomposition. Aggregation calculation: attributable post-control release mass of each species / accepted net MDF mass, per 1 kg reference flow; no overlapping size bins Prove the same monitoring/LCI/LCIA-mapping mass definition for aggregate NOx; assume no NO2 equivalence, do not duplicate speciated releases and retain pending quantity compatibility if unproven. This protocol attributes only actual mdf-line rows/sources; the other process uses cp_air_utilities. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kg"
      frequency: "representative operating modes plus activity logs"
      temporal_coverage: "same declared period including abnormal/start-stop modes"
      site_scope: "each plant emission source; actual owning process: mdf-line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "test methods, detection limits, stack diagram, control records, factor boundaries"
    - protocol_id: cp_air_utilities
      process_id: "utilities"
