      record_type: "stack and fugitive tests"
      raw_fields: "source/stack/stage, species, compartment, carbon origin, concentration, gas flow, hours, oxygen/dry-wet/temperature-pressure basis, control state, detection limits, size/condensable fraction, factor applicability; NOx NO2-equivalent or actual NO+NO2 mass definition, NO/NO2 coverage, N2O exclusion and selected LCIA-mapping mass definition"
      collection_method: "Test drying, pressing/cooling, finishing/handling and boiler separately or use applicability-verified factors times measured activity; count a shared final stack once while retaining source decomposition. Aggregation calculation: attributable post-control release mass of each species / accepted net MDF mass, per 1 kg reference flow; no overlapping size bins Prove the same monitoring/LCI/LCIA-mapping mass definition for aggregate NOx; assume no NO2 equivalence, do not duplicate speciated releases and retain pending quantity compatibility if unproven. This protocol attributes only actual utilities rows/sources; the other process uses cp_air. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kg"
      frequency: "representative operating modes plus activity logs"
      temporal_coverage: "same declared period including abnormal/start-stop modes"
      site_scope: "each plant emission source; actual owning process: utilities"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "test methods, detection limits, stack diagram, control records, factor boundaries"
  calculation_rules:
    - id: normalize_output
      applies_to: "all inventory rows"
      rule: "Normalized exchange = attributable actual total exchange for that row in the period / accepted net MDF mass. Preserve numerator kg, m3 or MJ; denominator is cp_output kg; mdf_output is fixed at 1 kg per reference flow."
      inputs:
        - "actual row amount"
        - "accepted net mass"
        - cp_output
      output: "per 1 kg reference flow"
      source_ids:
        - corrim-mdf-2024
    - id: moisture_conversion
      applies_to: "furnish_chips, furnish_sawdust, furnish_shavings, mdf_output"
      rule: "Dry mass = wet mass/(1+u); water = wet mass - dry mass; w=u/(1+u). u is dry-basis and w wet-basis fraction; resin and inorganic additives are not dry wood."
      inputs:
        - "wet mass"
        - "dry-basis moisture"
        - cp_furnish
        - cp_output
      output: "dry solids and water"
      source_ids:
        - usda-wood-handbook-2021
    - id: recipe_split
      applies_to: "binder_uf, binder_muf, binder_pmdi, additive_wax, additive_hardener"
      rule: "Formulation solids = delivered formulation mass × measured solids fraction; carrier water uses its actual formulation fraction, not assumed all nonsolids. Apply this analytical split to each actual supply in its verified complete-product or independently supplied chemical reference basis; a whole prepared formulation cannot be assigned to a constituent UUID. These component ledgers do not create duplicate purchases. Preserve supplier manufacture/preparation/delivery once and separately record true onsite purchases, mixing water/utilities and losses."
      inputs:
        - "delivered formulation"
        - "solids fraction"
        - "water fraction"
        - cp_recipe
      output: "component ledger"
      source_ids:
        - corrim-mdf-2024
    - id: volume_conversion
      applies_to: "furnish_chips, mdf_output, dryer_gas, control_gas, boiler_gas"
      rule: "Board volume = measured area × thickness. Measure chip k = Vs/Vb on the same lot/moisture/state: use Vs for a supplier/background solid-volume definition or Vb at matching compaction for bulk volume; reconcile gates using measured stocks/losses. Background-process multiplier = matching volume / its actual reference amount A; normalize the actual inventory exchange by accepted net MDF mass separately. Unknown A/definition leaves the link incomplete; unknown density/packing is no substitute. Gas quantity conversion requires measured meter T/P, dry-wet composition, Z and matching background-m3 state, with no assumed standard volume."
      inputs:
        - Vs
        - Vb
        - k
        - A
        - "measured stocks/losses"
        - "gas T/P/composition/Z"
        - cp_furnish
        - cp_energy
        - cp_energy_utilities
        - cp_output
      output: "consistent volume or mass"
      source_ids:
        - usda-wood-handbook-2021
        - corrim-mdf-2024
    - id: thermal_reconciliation
      applies_to: "line_steam, line_heat, boiler_steam, boiler_heat, condensate_return, boiler_condensate"
      rule: "Indirect net delivered heat = sum(supply mass × supply specific enthalpy) - sum(return mass × return specific enthalpy), using common enthalpy datum and period. Supplier/background definition must match this boundary. For no-return/direct digestion disclose condensate fate and reference datum; fuel calorific value or property name is no substitute. Heat remains unresolved until demonstrated."
      inputs:
        - mass
        - "supply/return states"
        - "enthalpy definition"
        - cp_thermal
        - cp_thermal_utilities
      output: "carrier mass and verified delivered heat"
      source_ids:
        - epa-mdf-2002
        - corrim-mdf-2024
    - id: emission_mass
      applies_to: "all elementary outputs"
      rule: "Emission mass = species concentration on consistent dry/wet, temperature/pressure and oxygen basis × matching gas flow × operating time, or applicability-verified factor × measured activity on the same basis. Do not count both upstream and final stack for a shared exhaust."
      inputs:
        - concentration
        - "gas flow"
        - "operating time"
        - activity
        - cp_air
        - cp_air_utilities
      output: "species emission mass"
      source_ids:
        - epa-mdf-2002
        - epa-wood-boiler-2022
    - id: pm_partition
      applies_to: "all particulate outputs"
      rule: "Only for the same stack/test coverage with compatible cumulative sizes: PM2.5 row = cumulative PM2.5; PM2.5–10 row = cumulative PM10 - cumulative PM2.5; >PM10 row = total PM - cumulative PM10. Check nonnegativity; incompatible condensable/filterable definitions or missing sizes prevent partition and remain unresolved."
      inputs:
        - "same-basis total PM"
        - "cumulative PM10"
        - "cumulative PM2.5"
        - cp_air
        - cp_air_utilities
      output: "nonoverlapping particulate masses"
      source_ids:
        - epa-mdf-2002
        - epa-wood-boiler-2022
    - id: physical_reconciliation
      applies_to: "mdf-line; utilities"
      rule: "Retain each stage unallocated wood solids, resin solids, water and carbon: inputs = product/residue/emission outputs + stock change. Equal internal transfers; combustion carbon tracks wood biogenic origin separately from resin/fuel fossil origin without assuming complete combustion."
      inputs:
        - "stage flows"
        - stocks
        - "component composition"
        - cp_furnish
        - cp_recipe
        - cp_water
        - cp_water_utilities
        - cp_air
        - cp_air_utilities
        - cp_fuel
      output: "physical mass/water/carbon ledgers"
      source_ids:
        - corrim-mdf-2024
        - epa-wood-boiler-2022
    - id: nox_compatibility
      applies_to: "dryer_nox, handling_nox, boiler_nox"
      rule: "Compare monitoring, LCI and selected LCIA-mapping NOx mass definitions and NO/NO2 coverage. Generate an aggregate quantity using the applicable cp_air or cp_air_utilities record only when all three share the same basis; infer neither NO2-equivalent mass nor NO/NO2 ratio, exclude N2O and avoid speciated duplicates. Otherwise quantity remains pending."
      inputs:
        - "monitoring mass definition"
        - "flow mass definition"
        - "LCIA mapping"
        - cp_air
        - cp_air_utilities
      output: "compatible NOx quantity or explicit pending result"
      source_ids:
        - epa-mdf-2002
        - epa-wood-boiler-2022
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: quality_primary
      applies_to: "all inventory rows"
      requirement: "Retain actual production, metering, stocks and representative operating modes for the same period; never generalize CORRIM regional recipes/energy or softwood sawmill surveys into category parameters."
      evidence: "collection originals and applicability review"
    - id: quality_missing
      applies_to: "all inventory rows"
      requirement: "Distinguish unknown, unmeasured, BDL and true zero; ranges need independent compatible evidence. This candidate has no synthesized reviewed universal ranges."
      evidence: "missingness, detection limits, range-evidence gaps"
    - id: quality_claims
      applies_to: "mdf_output"
      requirement: "Density, thickness, moisture and formaldehyde class require test state/method/date and applicable version; report titles/classification labels establish no performance/regulatory conformity."
      evidence: "product tests and supplier declarations"
validation_rules:
  - rule_id: validation_reference
    applies_to: "mdf_output"
    rule: "Require one final reference output, matched mass property/unit and every qualifier; same-period net accepted mass excludes packaging. Other stage states are physical-ledger entries within the line, not duplicate MDF outputs."
    source_ids:
      - corrim-mdf-2024
      - epa-mdf-2002
      - usda-wood-handbook-2021
  - rule_id: validation_quantity_compatibility
    applies_to: "furnish_chips; dryer_gas; control_gas; boiler_gas; dryer_nox; handling_nox; boiler_nox"
    rule: "Confirmed UUID/property/unit does not establish quantity compatibility. Chips require supplier A, volume definition, matched-moisture/state Vs/Vb/k and loss/gate correspondence; gas requires T/P, dry-wet composition, Z and background-m3 correspondence; NOx requires common monitoring/LCI/LCIA mass definition, NO/NO2 coverage, N2O exclusion and no speciated duplicates. Any unknown remains quantity compatibility pending and the affected link/result incomplete."
    source_ids:
      - corrim-mdf-2024
      - epa-mdf-2002
      - epa-wood-boiler-2022
  - rule_id: validation_inventory
    applies_to: "all inventory rows"
    rule: "Each actual exchange has one atomic identity, state, direction, type, property/unit, protocol and denominator. Resolve blank UUIDs and route/grade mismatches before complete use of the affected route; never select a nearby board or correction flow."
    source_ids:
      - corrim-mdf-2024
      - epa-mdf-2002
      - usda-wood-handbook-2021
  - rule_id: validation_balances
    applies_to: "mdf-line; utilities"
    rule: "Reconcile separate physical solids/water/carbon ledgers and environmental-burden accounts. Demonstrate equal internal links, actual recirculation fates and allocation evidence without scaling physical coproduct outputs."
    source_ids:
      - corrim-mdf-2024
  - rule_id: validation_thermal
    applies_to: "line_steam; line_heat; boiler_steam; boiler_heat"
    rule: "A steam/heat MJ property is insufficient evidence of net delivered heat. Require supplier/background definition, metering boundary and matched state/enthalpy balance; unknown basis is inconclusive. Do not double count utility fuels and purchased heat."
    source_ids:
      - epa-mdf-2002
      - corrim-mdf-2024
  - rule_id: validation_air
    applies_to: "all elementary outputs"
    rule: "Verify species, outdoor-air medium, actual source and biogenic/fossil origin; retain biogenic CO2 in LCI regardless of impact-accounting conventions. Use compatible nonoverlapping PM bins and disclose detection limits/condensables. Manufacturing factors are not boiler factors; clean-wood factors require review for resin-bearing dust."
    source_ids:
      - epa-mdf-2002
      - epa-wood-boiler-2022
  - rule_id: validation_readiness
    applies_to: "all inventory rows"
    rule: "Methodology is authored candidate guidance requiring independent scientific review. Passing structural/measurement checks establishes neither legal conformity nor a completed site LCI; unresolved identities, heat definitions and range evidence remain explicit."
    source_ids:
      - corrim-mdf-2024
      - epa-mdf-2002
      - usda-wood-handbook-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Upstream manufacture for uncoated dry-process wood MDF inputs"
  allowed_use: "Use after matching route/recipe/delivery state/location-year and resolving applicable gaps; disclose quality and boundary"
  excluded_use: "Wet hardboard, other fibreboard, nonwood fibre, special/coated recipes, default life/end-use scenario or formaldehyde legal proof"
  required_metadata: "PCR identity/version; survey period/location/output; full reference qualifiers; energy/upstream boundary; atomic flows/protocols; allocation/physical ledgers"
  required_quality_disclosure: "Unresolved UUIDs/measurement basis, exclusions/detection limits, range evidence, location/year/route proxies and review state"
  update_trigger: "Changes to furnish species/provenance, recipe/moisture, drying/dosing sequence, press, fuel/heat definition, controls, electricity, grade or background boundary"
data_sources:
  - id: "corrim-mdf-2024"
    type: "literature"
    reference: "[Cradle-to-grave Life Cycle Assessment of North American Medium Density Fiberboard](https://corrim.org/wp-content/uploads/2024/07/MDF-Cradle-to-grave-LCA-Final.pdf); pp. 1, 13, 18–19, 24–30, 32; Tables 4, 7, 9, 11"
    used_for: "Report December 22, 2023, final revision April 3, 2024; 2021/2022 North American CPA-member survey. Supports route, components, collection and allocation conditions, not transferable recipes/density/moisture/energy/legal findings or cradle-to-grave scenarios. Section 3.2.4 states 12 facilities supplied data and also 13 manufacturers; weighting uses 13. Preserve the discrepancy instead of inventing one sample count."
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "[Wood handbook—wood as an engineering material, FPL-GTR-282](https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf); Chapters 4 and 11, pp. 4–1 to 4–3, 11–13 to 11–15"
    used_for: "2021 technical handbook: wood-moisture definitions, fibre formation and dry MDF versus wet hardboard. Other fibreboard/adhesive and historical certification examples are not universal recipes or limits for this PCR."
  - id: "epa-mdf-2002"
    type: "official_guidance"
    reference: "[AP-42 Section 10.6.3 Medium Density Fiberboard Manufacturing](https://www.epa.gov/sites/default/files/2020-10/documents/c10s0603.pdf); August 2002; §§10.6.3.1–3; Figure 10.6.3 process diagram; Tables 10.6.3-1 onward with footnotes"
    used_for: "Supports blowline/post-drying dosing routes, pressing, finishing, source decomposition and testing bases. Historical factors require compatible equipment/fuel/species/resin/control/unit evidence; no default amounts/current legal limits and no substitute for boiler evidence."
  - id: "epa-wood-boiler-2022"
    type: "official_guidance"
    reference: "[AP-42 Section 1.6 Wood Residue Combustion in Boilers](https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf); March 2022; §§1.6.1–3; Tables 1.6-1 onward and PM/factor footnotes"
    used_for: "Supports separate boiler boundary, fuel/moisture/control dependence and GHG/PM bases; resin-bearing fuel requires specific applicability evidence. Treatment of biogenic CO2 in greenhouse-gas reporting is no basis for omitting it from LCI."
