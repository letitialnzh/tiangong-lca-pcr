system_boundary:
  rules:
    - rule_id: boundary_stages
      applies_to: "mdf-line"
      rule: "Include receipt, size preparation, digestion/refining, actual resin dosing, drying, forming/prepress, hot pressing, cooling, sanding/trimming and packaging; measure each stage even within one aggregated process."
      source_ids:
        - corrim-mdf-2024
        - epa-mdf-2002
        - usda-wood-handbook-2021
    - rule_id: boundary_energy
      applies_to: "mdf-line; utilities"
      rule: "Choose on-site utility generation or purchased carrier for each supply share. Link equal carrier quantities at both internal ends and cancel internal transfers when aggregating; do not add purchased heat burdens to the same on-site fuels. Direct dryer/oxidizer/mobile combustion and boiler stacks remain distinct."
      source_ids:
        - corrim-mdf-2024
        - epa-mdf-2002
        - epa-wood-boiler-2022
    - rule_id: boundary_upstream
      applies_to: "all inventory rows"
      rule: "Include actual upstream manufacture and inbound transport and disclose residue allocation/recovery boundary. End at the uncoated mill gate; downstream use, service life and disposal are separate scenarios, never copied from CORRIM cradle-to-grave averages."
      source_ids:
        - corrim-mdf-2024
    - rule_id: boundary_coverage
      applies_to: "all inventory rows"
      rule: "Conditional rows are included only with actual activity/composition evidence. Missing UUID or amount is not zero and blocks complete use of the affected route. Expand every additional actual chemical, fuel, packaging or treatment exchange as its own atomic row; never conceal it in a collection label."
      source_ids:
        - corrim-mdf-2024
        - epa-mdf-2002
        - usda-wood-handbook-2021
