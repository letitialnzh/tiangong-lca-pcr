measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_output to weigh accepted net MDF at the same declared state, excluding packaging. All rows are per 1 kg reference flow; wet furnish, dry wood mass and unsanded rough panels are not the denominator."
  - id: moisture_basis
    applies_to: "furnish_chips, furnish_sawdust, furnish_shavings, mdf_output"
    required_property_ref:
      name: "Auxiliary wet/oven-dry Mass; each exchange retains its verified native reference property"
      uuid: ""
    required_unit: "kg for auxiliary solids/water ledgers and mass-reference exchanges; m3 for native furnish_chips exchange"
    rule: "Use cp_furnish and cp_output to retain auxiliary wet mass, oven-dry solids and water separately; dry-basis moisture u is water/dry mass and wet-basis moisture w is water/wet mass, both as fractions. These auxiliary kg measurements do not replace furnish_chips verified Volume/m3 exchange or normalized numerator. Convert its auxiliary kg ledger only with measured same-lot/moisture/material-state density; volume_basis and volume_conversion separately require the actual supplier solid/bulk volume definition, Vs/Vb/k and loss/gate correspondence, with unknown links unresolved."
  - id: volume_basis
    applies_to: "furnish_chips, dryer_gas, control_gas, boiler_gas"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Volume/m3 identity defines neither solid/bulk wood volume nor gas state. cp_furnish obtains supplier actual reference A, volume definition, same-lot/moisture Vs/Vb and measured k with loss/gate conversion. The applicable cp_energy or cp_energy_utilities record obtains gas T/P, dry-wet composition, Z and background-m3 reference conditions. Any unproven correspondence remains quantity compatibility pending."
  - id: electricity_conversion
    applies_to: "line_electricity, boiler_electricity"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert metered kWh to MJ by multiplying by 3.6. The electricity dataset net-calorific-value property represents electric energy bookkeeping and proves no steam/process-heat net-heat basis."
  - id: thermal_basis
    applies_to: "line_steam, line_heat, boiler_steam, boiler_heat, condensate_return, boiler_condensate"
    required_property_ref:
      name: "Steam mass; delivered heat"
      uuid: ""
    required_unit: "kg; MJ"
    rule: "The applicable cp_thermal or cp_thermal_utilities record retains steam mass, condensation/return mass, temperature/pressure/quality and enthalpy boundary. Populate heat MJ only when supplier/background definition agrees with site supply-return enthalpy balance; property or product name alone is insufficient and unknown basis remains unresolved."
  - id: nox_mass_basis
    applies_to: "dryer_nox, handling_nox, boiler_nox"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "NOx kg requires a demonstrated common monitoring/LCI/LCIA-mapping mass basis and NO/NO2 boundary, excluding N2O and speciated duplicates; otherwise quantity compatibility pending."
