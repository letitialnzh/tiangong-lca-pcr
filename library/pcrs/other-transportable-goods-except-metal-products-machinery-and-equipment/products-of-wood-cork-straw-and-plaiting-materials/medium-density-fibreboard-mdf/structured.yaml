allocation_rules:
  - rule_id: allocation_physical
    applies_to: "all inventory rows"
    rule: "Retain unallocated physical stream quantities and mass/water/carbon balances; do not multiply actual MDF, residue or internal-link quantities by a burden-allocation fraction. Internal recovered dust is not a second saleable output."
    source_ids:
      - corrim-mdf-2024
  - rule_id: allocation_single_product
    applies_to: "mdf-line"
    rule: "Where accepted MDF is the only valuable product, assign attributable line burdens to MDF and retain actual waste/energy recovery separately. Determine waste versus saleable coproduct from contracts and actual use, not from the word residue."
    source_ids:
      - corrim-mdf-2024
  - rule_id: allocation_shared
    applies_to: "mdf-line; utilities"
    rule: "First separate causal stage/customer loads using submetering and source-specific activity. If irreducible shared coproduct burdens remain, document the chosen physical relationship and consistent moisture/energy basis; any economic alternative needs current transaction evidence, sensitivity and review. Do not assume that CORRIM upstream residue mass allocation or one-product A3 condition applies to every plant."
    source_ids:
      - corrim-mdf-2024
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "mdf_line"
      flow_role: "accepted MDF"
      record_type: "weighing"
      raw_fields: "time, lot, board type, accepted net mass, area, thickness, volume, moisture/test basis, density, packaging tare, opening/closing stocks"
      collection_method: "Use calibrated scales and same-lot dimension/moisture tests to measure net board mass; exclude packaging/rejects and reconcile counts/stocks. Aggregation calculation: accepted net board mass in same period is denominator for per 1 kg reference flow"
      unit: "kg"
      frequency: "batch"
      temporal_coverage: "complete same declared survey period"
      site_scope: "declared plant and board grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, acceptance and moisture tests"
    - protocol_id: cp_furnish
      process_id: "mdf_line"
      flow_role: "furnish"
      record_type: "receipt and sampling"
      raw_fields: "each furnish lot, supplier/species, wet/oven-dry mass, moisture basis, bulk volume/density, transport, allocation, stocks and stage transfers; supplier/background actual reference A and solid/bulk volume definition, Vs, Vb, k, matched moisture/state, loss/delivery gate"
      collection_method: "Weigh each furnish and use representative same-lot oven-dry/moisture testing; measure volume directly or convert with same-lot density; record bark/fibre stage ledger. Aggregation calculation: sum attributable amount of each furnish / accepted net MDF mass, per 1 kg reference flow Verify supplier A and background quantity definition. Measure representative same-lot/same-moisture Vs and Vb with loose/compacted state; k = Vs/Vb. Retain receipt-gate, loss and stock conversions; unknown correspondence leaves the link incomplete."
      unit: "kg; m3"
      frequency: "lot and shift"
      temporal_coverage: "complete same declared survey period"
      site_scope: "suppliers and plant"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge, sampling, moisture and upstream-boundary records"
    - protocol_id: cp_recipe
      process_id: "mdf_line"
      flow_role: "each chemical"
      record_type: "supplier and dosing"
      raw_fields: "separate resin/wax/hardener/urea/lubricant identity, delivered mass, solids, carrier water, carbon origin, dosing point, batch, stocks, recirculation"
      collection_method: "Reconcile supplier specifications and actual recipes with calibrated dosing scales/pumps and purchases/stocks; infer no universal concentration or urea nitrogen content. Distinguish each actual independently supplied chemical from a bought complete resin/emulsion/hardener formulation. Whole bought formulations require specific compatible complete-product identities/providers retaining supplier manufacture/preparation/delivery once; included constituents/carrier water stay analytical. Actual separately purchased additions and onsite mixing/emulsification water/utilities/losses remain separate foreground records. Aggregation calculation: attributable consumption of each separate product / accepted net MDF mass, per 1 kg reference flow; solids/carrier water retained in separate physical ledgers"
      unit: "kg"
      frequency: "batch"
      temporal_coverage: "complete same declared survey period"
      site_scope: "plant recipe and suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier evidence, recipe and dosing calibration"
    - protocol_id: cp_energy
      process_id: "mdf_line"
      flow_role: "electricity and each fuel; scoped to mdf-line"
      record_type: "meter and invoice"
      raw_fields: "stage, meter, voltage, kWh, each fuel mass/volume, temperature/pressure/composition/calorific basis, hours, control use, output and stocks; each gas supplier/background actual reference A, T, absolute P, dry-wet composition, Z, background-m3 and site-meter reference conditions/gate"
      collection_method: "Submeter refining, drying, pressing, finishing, controls and boiler; reconcile fuel purchases/stocks and purchased/on-site shares. Aggregation calculation: sum attributable stage amount of each carrier / accepted net MDF mass, per 1 kg reference flow; electricity converted to MJ Match supplier/background m3 quantity definition to site meters; unknown T/P, dry-wet composition, Z or loss gate prevents assumed conversion. This protocol attributes only actual mdf-line rows/sources; the other process uses cp_energy_utilities. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kWh; MJ; kg; m3"
      frequency: "shift and billing period"
      temporal_coverage: "complete same declared survey period"
      site_scope: "plant and energy-supply boundary; actual owning process: mdf-line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration, bills, fuel certificates, boundary reconciliation"
    - protocol_id: cp_energy_utilities
      process_id: "utilities"
      flow_role: "electricity and each fuel; scoped to utilities"
      record_type: "meter and invoice"
      raw_fields: "stage, meter, voltage, kWh, each fuel mass/volume, temperature/pressure/composition/calorific basis, hours, control use, output and stocks; each gas supplier/background actual reference A, T, absolute P, dry-wet composition, Z, background-m3 and site-meter reference conditions/gate"
      collection_method: "Submeter refining, drying, pressing, finishing, controls and boiler; reconcile fuel purchases/stocks and purchased/on-site shares. Aggregation calculation: sum attributable stage amount of each carrier / accepted net MDF mass, per 1 kg reference flow; electricity converted to MJ Match supplier/background m3 quantity definition to site meters; unknown T/P, dry-wet composition, Z or loss gate prevents assumed conversion. This protocol attributes only actual utilities rows/sources; the other process uses cp_energy. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kWh; MJ; kg; m3"
      frequency: "shift and billing period"
      temporal_coverage: "complete same declared survey period"
      site_scope: "plant and energy-supply boundary; actual owning process: utilities"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration, bills, fuel certificates, boundary reconciliation"
    - protocol_id: cp_thermal
