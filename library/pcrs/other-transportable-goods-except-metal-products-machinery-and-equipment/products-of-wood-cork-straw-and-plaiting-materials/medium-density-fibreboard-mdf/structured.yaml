    - protocol_id: cp_fuel
      process_id: "utilities"
      flow_role: "each wood fuel"
      record_type: "weighing and analysis"
      raw_fields: "each fuel mass, moisture, heating value and gross/net basis, resin/carbon origin, ash, provenance/internal link, firing conditions"
      collection_method: "Weigh each actual fuel and sample moisture/carbon composition representatively; external factors require demonstrated matching fuel/equipment conditions. Aggregation calculation: actual consumption of each fuel / accepted net MDF mass, per 1 kg reference flow"
      unit: "kg"
      frequency: "fuel lot and shift"
      temporal_coverage: "complete same declared survey period"
