      collection_method: "Reconcile calibrated mass/heat meters and temperature/pressure records at a common enthalpy basis; obtain supplier definition and demonstrate agreement with background exchange; unknown heat basis stays unresolved. Aggregation calculation: actual delivered quantity of each carrier / accepted net MDF mass, per 1 kg reference flow; equal internal link ends, steam mass and net heat separate This protocol attributes only actual mdf-line rows/sources; the other process uses cp_thermal_utilities. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
