      raw_fields: "fresh make-up, recirculation, formulation water, steam condensation, fibre/board moisture, effluent, opening/closing storage, meter"
      collection_method: "Calibrate boundary meters and weigh/sample fibre/board moisture; avoid duplicate fresh/recycled/steam water accounting. Aggregation calculation: attributable fresh water amount / accepted net MDF mass, per 1 kg reference flow; retain internal water balances separately This protocol attributes only actual utilities rows/sources; the other process uses cp_water. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kg"
      frequency: "shift"
      temporal_coverage: "complete same declared survey period"
      site_scope: "plant line/boiler boundary; actual owning process: utilities"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter and water balance"
    - protocol_id: cp_pack
      process_id: "mdf_line"
      flow_role: "each packaging component"
      record_type: "mass and count"
      raw_fields: "material, supply route, count, unit net mass, loss, stocks, corresponding accepted board mass"
      collection_method: "Weigh each actual packaging material or multiply counts by measured unit mass; exclude packaging from MDF net mass. Aggregation calculation: consumption of each packaging component / accepted net MDF mass, per 1 kg reference flow"
      unit: "kg"
      frequency: "batch"
      temporal_coverage: "complete same declared survey period"
      site_scope: "plant packaging"
