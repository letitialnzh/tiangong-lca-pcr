system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "profile production"
      rule: "Include receiving/stock handling, conditional reconditioning, rip/crosscut operations, continuous profiling, dust extraction/conveyance, grading and separate dispatch packaging. This PCR starts with already kiln-dried sawn stock; no sawing-log yield or upstream drying energy is inferred here."
      source_ids:
        - usda-wood-handbook-2021
        - corrim-northern-lumber-2025
    - rule_id: boundary_upstream
      applies_to: "supplier and integrated route"
      rule: "Purchased stock carries compatible upstream forestry, sawing, primary drying and delivery burdens once. In an integrated mill, use a separately evidenced upstream sawn-stock module with an identical kiln-dried handoff quantity/state; remove any purchased-stock dataset burden for that same internal flow. Shared drying, heat and handling meters are assigned once to their actual stage. A supplier dataset including profiling is not untreated sawn-stock input."
      source_ids:
        - corrim-northern-lumber-2025
    - rule_id: boundary_heat
      applies_to: "thermal routes"
      rule: "External steam heat uses a provider dataset only after its heat-quantity boundary, distribution-loss inclusions and condensate reference have been verified against steam_heat_basis; provider combustion is upstream. On-site steam generation records actual individual fuels, ash, water and direct emissions in heat. Match internal heat at the same receiver, and do not add a purchased-heat production dataset to internal_steam_in. Hot-air firing, non-steam heat, purchased green stock and preservative/glue/coating routes require a separately evidenced extension before use."
      source_ids:
        - epa-wood-boiler-2022
        - usda-wood-handbook-2021
    - rule_id: boundary_emissions
      applies_to: "air and waste"
      rule: "Screen all actual discharge points and control devices. Captured dust and separated shavings/sawdust are physical material streams; only escaping matter is an elementary air emission. PM rows are outdoor-air unspecified identity, not a claim that all exhaust has that site subcompartment. Where a different receiving compartment is required, verify another identity. Add other actual chemicals, packaging, water inputs, wastes and emissions as separate atomic rows before dataset release; absence requires evidence, not omission."
      source_ids:
        - epa-sawmill-pte-2014
        - epa-wood-boiler-2022
        - corrim-northern-lumber-2025
    - rule_id: boundary_carbon
      applies_to: "wood carbon"
      rule: "Retain biogenic CO2, CO and CH4 in LCI, with fossil fuel carbon separate. Product, sold residue, internal fuel, waste, ash carbon and stock changes form a carbon ledger; the same carbon is never sold, discarded and combusted simultaneously. Forestry uptake belongs upstream once, not a negative profiling emission. Product carbon at the gate is a material content disclosure, not a substitution or permanent-storage credit. Statistical omission of short-cycle CO2 does not delete the physical LCI flow."
      source_ids:
        - epa-wood-boiler-2022
        - corrim-northern-lumber-2025
    - rule_id: boundary_excluded
      applies_to: "downstream and infrastructure"
      rule: "Exclude flooring assembly, joinery assembly, installation, building use, maintenance, end-of-life and substitution credits from this manufacturing gate. Declare infrastructure/capital and worker-activity treatment with a significance assessment; omitted stages are not proven zero. Gate-to-gate foreground alone is not a cradle-to-gate result."
      source_ids:
        - corrim-northern-lumber-2025
