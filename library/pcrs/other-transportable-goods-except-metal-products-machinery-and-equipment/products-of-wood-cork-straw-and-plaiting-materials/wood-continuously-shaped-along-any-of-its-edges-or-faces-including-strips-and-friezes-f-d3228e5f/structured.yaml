allocation_rules:
  - rule_id: allocation_ledger
    applies_to: "physical graph and burden account"
    rule: "First close unallocated dry-wood, water and carbon balances and equal internal links. Every physical row below is cohort amount divided by Q kg of net accepted final wood, without burden allocation. Keep a separate product-specific environmental-burden ledger; do not multiply sold-residue physical outputs, terminal 1 kg output or internal links by an allocation share."
    source_ids:
      - corrim-northern-lumber-2025
      - usda-wood-handbook-2021
  - rule_id: allocation_separation
    applies_to: "joint wood outputs"
    rule: "Prefer measured process subdivision. Assign dedicated profiling/reconditioning energy to its actual process/product cohort; isolate upstream sawing allocation. Uncontaminated shavings, sawing dust or offcuts actually sold with recipient/specification evidence may be coproducts; non-saleable collected residue is waste, and internally burned residue remains an internal fuel stream. Record origin, status and destination separately; no substitution credit within this dataset."
    source_ids:
      - corrim-northern-lumber-2025
      - epa-wood-boiler-2022
  - rule_id: allocation_shared
    applies_to: "remaining joint burdens"
    rule: "Where subdivision cannot separate actual joint wood-processing burdens, use measured oven-dry mass shares only for comparable solid-wood coproducts at the actual split with a documented physical causal relationship between dry wood mass and the shared process burdens: a_j=m_dry,j/sum(m_dry,j) over eligible reference wood and actual sold wood coproducts, not wet mass, discarded waste, internal fuel or water. Document joint-step boundaries and an economic sensitivity using same-period net prices if the ranking changes. Dedicated residue handling/disposal and on-site boiler burdens are assigned to their actual recipient/service; internally generated fuel is not added as a coproduct denominator and again charged with a duplicate purchased production burden. Do not apply dry-mass allocation when output composition, product state or processing function makes the wood outputs physically incomparable, or when the causal relationship is unsubstantiated; retain the unresolved allocation need and establish a justified method before dataset release."
    source_ids:
      - corrim-northern-lumber-2025
  - rule_id: allocation_shared_heat
    applies_to: "shared boiler or site service"
    rule: "Assign heat-service burdens using measured useful MJ delivered to each receiver, including a justified assignment of generation/distribution losses. Retain physical fuel and steam totals and receiver shares separately. A boiler supplying other products needs all recipients and meters; no unexplained whole-boiler charge to this product. Electricity, compressed air and shared handling use measured causal service drivers with reconciliation, not an arbitrary fraction."
    source_ids:
      - epa-wood-boiler-2022
      - corrim-northern-lumber-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "profiling"
      flow_role: "accepted net reference"
      record_type: "weighing and specification record"
      raw_fields: "cohort; species; lot; profile drawing; actual section/length; grade; moisture samples; accepted net wood kg Q; opening/closing/returned profile inventory; packaging tare"
      collection_method: "Calibrated net weighing and acceptance inspection; oven-dry moisture checks or species/temperature calibrated moisture meter with oven-dry validation; profile dimensions from actual section drawing and measurements; Preparation before aggregation: Q=sum accepted final net wood kg; exclude packaging and rejected wood; inventory-adjust accepted final totals before division by Q"
      unit: "kg; m; m2; moisture fraction"
      frequency: "each lot and release"
      temporal_coverage: "Complete declared accounting period and representative lots for the same profile/species cohort"
      site_scope: "Selected site and profile cohort; separate moisture/grade states"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; drawings; grade acceptance; sampling/oven log; inventory bridge"
    - protocol_id: cp_stock
      process_id: "profiling"
      flow_role: "sawn stock"
      record_type: "receipt and inventory record"
      raw_fields: "supplier gate; species; untreated/kiln-dried state; stock kg; moisture; solid volume/density if converted; opening/closing inventory; returns; supplier upstream dataset"
      collection_method: "Weigh receipts and stocks; sample moisture by lot; document supplier stages and integrated-mill handoff rather than assume upstream processing; Preparation before aggregation: q_stock=receipts+opening-closing-returns, trace attribution to cohort; x_stock=q_stock/Q; keep absolute dry stock mass"
      unit: "kg; moisture fraction; m3"
      frequency: "each delivery and period endpoints"
      temporal_coverage: "Same accounting period and production cohort as cp_reference"
      site_scope: "Supplier gates and selected foreground site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; supplier declaration; moisture sampling; module boundary audit"
    - protocol_id: cp_energy
      process_id: "profiling"
      flow_role: "electricity"
      record_type: "meter and service record"
      raw_fields: "meter id; start/end reading; kWh; time; equipment/stage; compressed air driver; production cohort; shared-service recipient totals; actual owner profiling; raw_record_id; shared_meter_id; boundary/internal status; matched transfer id"
      collection_method: "Submeter actual stage equipment; reconcile site meter, load logs and measured shared-service drivers; no duplicated meter intervals; Preparation before aggregation: q_energy=unique metered kWh×3.6, attribute by measured service; x_energy=q_energy/Q Collect only actual profiling stage records; retain the original fields and QA only where physically applicable to that stage. A shared master meter or source record is a reconciliation witness, not an extra exchange: retain each attributable external raw record once across companion protocols using measured stage/service attribution, with fractions reconciled to the master total. Keep internal sending/receiving records separately with equal state, period and quantity; do not add either endpoint as another external purchase or emission. All companions use the same complete accepted-output reporting pool, retaining failed/rework activity and raw native units."
      unit: "kWh; MJ"
      frequency: "meter intervals and cohort shifts"
      temporal_coverage: "Complete same production accounting period"
      site_scope: "Stage equipment and all shared-service recipients"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; reconciliation; service allocation record"
    - protocol_id: cp_energy_heat
      process_id: "heat"
      flow_role: "electricity"
      record_type: "meter and service record"
      raw_fields: "meter id; start/end reading; kWh; time; equipment/stage; compressed air driver; production cohort; shared-service recipient totals; actual owner heat; raw_record_id; shared_meter_id; boundary/internal status; matched transfer id"
      collection_method: "Submeter actual stage equipment; reconcile site meter, load logs and measured shared-service drivers; no duplicated meter intervals; Preparation before aggregation: q_energy=unique metered kWh×3.6, attribute by measured service; x_energy=q_energy/Q Collect only actual heat stage records; retain the original fields and QA only where physically applicable to that stage. A shared master meter or source record is a reconciliation witness, not an extra exchange: retain each attributable external raw record once across companion protocols using measured stage/service attribution, with fractions reconciled to the master total. Keep internal sending/receiving records separately with equal state, period and quantity; do not add either endpoint as another external purchase or emission. All companions use the same complete accepted-output reporting pool, retaining failed/rework activity and raw native units."
      unit: "kWh; MJ"
      frequency: "meter intervals and cohort shifts"
      temporal_coverage: "Complete same production accounting period"
      site_scope: "Stage equipment and all shared-service recipients"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; reconciliation; service allocation record"
    - protocol_id: cp_residue
      process_id: "profiling"
      flow_role: "segregated wood residue"
      record_type: "weighing and destination record"
      raw_fields: "shavings/dust/offcut form; point of generation; wet kg; moisture; dry kg; sold/waste/internal status; receiver; invoice; opening/closing stock; internal transfer id"
      collection_method: "Separate and weigh each form at collection/dispatch; sample moisture and record dust-control capture versus emissions, with recipient/treatment documentation; Preparation before aggregation: Sum unique amounts by form and status, adjust stocks, x_i=q_i/Q; compute dry kg separately; internal fuel handoff equals cp_fuel_heat receipt"
      unit: "kg; moisture fraction"
      frequency: "each batch dispatch and stocktake"
      temporal_coverage: "Same accounting period as Q, including inventory change"
      site_scope: "Each residue point and destination at the selected site"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "segregation plan; weighing; moisture; sales/treatment documents; internal link audit"
