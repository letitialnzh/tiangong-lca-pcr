      collection_method: "Weigh wood/diesel consumption or reconcile tank records; meter gaseous natural gas at stated conditions; use actual supplier/test density, calorific value and composition; reconcile internal residue without a purchased upstream burden; Preparation before aggregation: q_fuel=net consumed quantity by fuel and source; x_fuel=q_fuel/Q in its declared unit; internal wood fuel equals cp_residue transfer; measured conversions only Collect only actual profiling stage records; retain the original fields and QA only where physically applicable to that stage. A shared master meter or source record is a reconciliation witness, not an extra exchange: retain each attributable external raw record once across companion protocols using measured stage/service attribution, with fractions reconciled to the master total. Keep internal sending/receiving records separately with equal state, period and quantity; do not add either endpoint as another external purchase or emission. All companions use the same complete accepted-output reporting pool, retaining failed/rework activity and raw native units."
