  calculation_rules:
    - id: normalize_reference
      applies_to: "all physical exchanges"
      rule: "x_i=q_i/Q; Q is accepted final net wood kg excluding packaging for one common accounting cohort. Reference output Q/Q=1 kg. Sum and inventory-adjust q_i before dividing; normalization is not allocation."
      inputs:
        - q_i
        - Q
        - cp_reference
        - "linked row protocol"
      output: "x_i per 1 kg reference flow"
      source_ids: []
    - id: calc_moisture
      applies_to: "wood at each measured state"
      rule: "u=(m_wet-m_dry)/m_dry; w=u/(1+u); m_dry=m_wet/(1+u); m_water=m_wet-m_dry. u and w are fractions; divide percentages by 100. Require m_dry>0, u≥0, 0≤w<1."
      inputs:
        - cp_reference
        - cp_stock
        - cp_residue
        - cp_fuel
        - cp_fuel_heat
      output: "dry mass and water kg, distinct from wet reference kg"
      source_ids:
        - usda-wood-handbook-2021
    - id: calc_volume
      applies_to: "actual profile and wood volume"
      rule: "V_u=sum(A_net,k×L_k) from actual continuous solid cross-sections excluding voids; m_wet=rho_u×V_u with measured species/moisture-specific density at the same state. Variable sections need a measured integration. Do not use rectangular envelope, nominal size, installed floor area or loose shavings volume as solid V_u."
      inputs:
        - "actual A_net and L"
        - "measured rho_u"
        - cp_reference
        - cp_stock
      output: "V_u m3; compatible m_wet kg"
      source_ids:
        - usda-wood-handbook-2021
    - id: calc_energy
      applies_to: "individual carriers"
      rule: "E_MJ=E_kWh×3.6. For a verified equal-mass steam/returned-condensate circuit at the declared receiver, H=M_steam×(h_supply-h_condensate)/1000 MJ with kg and kJ/kg on the same enthalpy datum. This receiver-boundary heat is useful only to the extent confirmed by the receiver heat balance. For nonreturned condensate, unequal masses, accumulated energy or other receiver energy outlets/losses, establish the full measured enthalpy balance and declared condensate reference before deriving net useful heat. Align the supplier/background reference heat and distribution-loss boundary by an evidence-backed conversion; unknown baselines remain unresolved, not assumed equal. Fuel heat=m_fuel×measured LHV or HHV on matching moisture basis, with the choice explicit; heat delivered is not fuel heat input. Gaseous fuel mass=V_ref×rho_ref with actual reference temperature/pressure and composition."
      inputs:
        - cp_energy
        - cp_energy_heat
        - cp_heat
        - cp_heat_heat
        - cp_fuel
        - cp_fuel_heat
      output: "individual energy/volume/mass quantities divided by Q"
      source_ids:
        - epa-wood-boiler-2022
    - id: calc_pm
      applies_to: "compatible filterable nested measurements"
      rule: "q_≤2.5=q_PM2.5; q_2.5–10=q_PM10-q_PM2.5; q_>10=q_PMtotal-q_PM10. Require same method, source, interval and control basis with 0≤q_PM2.5≤q_PM10≤q_PMtotal; investigate violations rather than clip. Normalize each exclusive bin by Q. Condensable PM is not included without separate evidence/identity."
      inputs:
        - cp_emission
        - cp_emission_heat
        - "compatible filterable PM observations"
      output: "three exclusive filterable kg/Q exchanges"
      source_ids:
        - epa-sawmill-pte-2014
        - epa-wood-boiler-2022
    - id: calc_balances
      applies_to: "unallocated cohort ledgers"
      rule: "For profiling only: oven-dry wood input+opening stock=accepted dry wood+sold dry residue+dry residue transferred to heat+waste dry wood+verified wood-origin dry material loss+closing stock. Retain the origin-specific wood loss method. The boiler has a separate consumed-fuel carbon/ash/emissions ledger; do not also count its gaseous combustion products as profiling dry-wood outputs. Water input+opening water=product/residue water+water vapor+effluent+closing water, explicitly including humidification and steam condensate transfers when present. Carbon uses measured dry carbon fractions, fuel composition, product/residue/ash/stock carbon and gaseous carbon. Internal links cancel only after both equal ends are retained."
      inputs:
        - cp_stock
        - cp_reference
        - cp_residue
        - cp_fuel
        - cp_fuel_heat
        - cp_heat
        - cp_heat_heat
        - cp_emission
        - cp_emission_heat
      output: "physical residuals with measurement uncertainty; no invented acceptance threshold"
      source_ids:
        - usda-wood-handbook-2021
        - corrim-northern-lumber-2025
        - epa-wood-boiler-2022
    - id: calc_carbon
      applies_to: "separate biogenic and fossil combustion"
      rule: "Within each origin, carbon in CO2=mass_CO2×12/44, in CO=mass_CO×12/28, and in CH4=mass_CH4×12/16. Reconcile measured consumed fuel carbon with these species, other measured organic carbon, ash/unburned carbon and stock changes. If CO2 is derived by residual carbon, use the validated balance and multiply remaining CO2-carbon by 44/12; do not assume 100% or copy a survey conversion percentage."
      inputs:
        - cp_fuel
        - cp_fuel_heat
        - cp_heat
        - cp_heat_heat
        - cp_emission
        - cp_emission_heat
        - "actual fuel carbon and species"
      output: "biogenic/fossil carbon balance and individual kg/Q"
      source_ids:
        - epa-wood-boiler-2022
    - id: calc_allocation
      applies_to: "environmental burdens only"
      rule: "a_j=m_dry,j/sum(m_dry,j); B_j=a_j×B_joint+B_dedicated,j. Eligible outputs and joint step follow allocation_shared. Sensitivity a_value,j=(m_j×p_j)/sum(m_j×p_j) requires consistent same-period sale quantity and net prices. Shared heat burdens use useful measured MJ receiver shares. Physical wood/fuel/heat rows remain q_i/Q unallocated."
      inputs:
        - cp_residue
        - cp_reference
        - cp_energy
        - cp_energy_heat
        - cp_heat
        - cp_heat_heat
        - "joint burdens"
        - "actual net prices"
      output: "separate allocated product burden account"
      source_ids:
        - corrim-northern-lumber-2025
        - epa-wood-boiler-2022
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: quality_scope
      applies_to: "product and stock"
      requirement: "Keep botanical species, actual continuous geometry, grade, untreated/unglued/uncoated status, lot moisture and starting-gate stage disclosures; mixed specifications are separate strata"
      evidence: "cp_reference; cp_stock"
    - id: quality_coverage
      applies_to: "all rows"
      requirement: "Cover complete declared production period and representative seasons/batches; disclose exclusions, shared equipment, sampling frequency, metering coverage and unmeasured rows. No actual supplier/factory records obtained by this methodology itself"
      evidence: "cp_energy; cp_energy_heat; cp_fuel; cp_fuel_heat; cp_heat; cp_heat_heat; cp_aux; cp_reference"
    - id: quality_sources
      applies_to: "numerical values and gaps"
      requirement: "Use actual foreground collection or validated route-specific original factors; no CORRIM regional or EPA PTE value adopted as profiling industry parameter. Identify additional species and missing identities before data release; preserve detection-limit and uncertainty statements"
      evidence: "cp_emission; cp_emission_heat; original factor and test records"
    - id: quality_allocation
      applies_to: "physical and burden ledgers"
      requirement: "Keep complete unallocated balances, coproduct status, period-matched allocation drivers/prices, useful heat receiver shares, integrated-stock upstream boundary and allocated result traceability separate"
      evidence: "cp_residue; cp_stock; cp_heat; cp_heat_heat; allocation_ledger"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference and applicability"
    rule: "Verify coniferous botanical species, continuous longitudinal edge/face profile drawing, actual net section/length, kiln-dried untreated sawn-stock starting state, no glue/coating/preservative, no assembly, declared dispatch moisture/grade and Q>0. A CPC label or planar smooth face alone is insufficient. Missing qualifiers block a complete reference definition."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_identity
    applies_to: "individual exchange"
    rule: "Each row is atomic. Verify public identity, selected reference property/unit and receiving compartment against the actual flow. Unresolved UUID requires identity review; no generic biomass, correction emission, coal fly ash, paper effluent or cable tie substitutes for a specific unresolved row. Identity lookup supplies no numerical inventory."
    source_ids:
      - usda-wood-handbook-2021
      - epa-wood-boiler-2022
  - rule_id: validate_basis
    applies_to: "all physical rows"
    rule: "Use one same-cohort Q kg net final wood excluding packaging for every row, inventory adjustment and collection aggregation, in both languages. Distinguish total q_i from normalized x_i=q_i/Q. Net solid volume, density, moisture and energy conversions require actual consistent measurements; board-foot nominal volume and loose residue volume do not establish solid profile kg."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_balance
    applies_to: "dry wood, water, carbon and heat"
    rule: "Reconcile internal shavings/sawdust fuel and useful steam links at identical handoff conditions. Keep measured stock change, residues, vapor, steam condensate and ash carbon; document balance residuals against measurement uncertainty and investigate discrepancies, without an invented tolerance. Verify upstream stock and heat counted once. Physical coproduct quantities remain unallocated."
    source_ids:
      - usda-wood-handbook-2021
      - corrim-northern-lumber-2025
      - epa-wood-boiler-2022
  - rule_id: validate_particles
    applies_to: "air sources"
    rule: "Use filterable PM2.5, PM2.5–PM10 and >PM10 as exclusive bins only when the actual measurements have compatible methods. Nested PM totals are retained as supporting observations, not additional exchanges. Condensable aerosol and unidentified organic totals are separate evidence gaps; do not force them into filterable size bins. The EPA sawmill PTE memo excludes boilers and supplies no profiling default factor."
    source_ids:
      - epa-sawmill-pte-2014
      - epa-wood-boiler-2022
  - rule_id: validate_completeness
    applies_to: "dataset release"
    rule: "An absent conditional row needs route and measurement evidence; lack of measurement is an open gap, not zero. Extend the inventory for actual packaging scrap, rejected profiles, humidification water, treatment chemicals, leaks and additional identified species before release. Check site-period quality, controls, treatment destinations, allocation sensitivity, upstream compatibility and uncertainty. Candidate methodology, translation alignment and mechanical checks are not scientific approval."
    source_ids:
      - corrim-northern-lumber-2025
      - epa-wood-boiler-2022
      - epa-sawmill-pte-2014
published_dataset_profile:
  dataset_role: "Foreground manufacturing process inventory"
  downstream_use: "secondary_dataset; background_dataset, only after actual data completion and independent review"
  allowed_use: "Matching untreated kiln-stock-route coniferous solid continuous profiles with declared geometry/moisture and compatible upstream modules"
  excluded_use: "Ordinary sawn stock; assembled flooring/doors/windows; treated, coated, glued, engineered/non-coniferous products; functional floor-area comparison; storage/substitution credit; universal sector parameter"
  required_metadata: "PCR id/version; site/period; species/grade/profile dimensions; dispatch moisture/method; Q kg; supplier starting gate and primary-drying inclusions; reconditioning and heat route; allocation drivers; flow/property/compartment identities; linked upstream providers"
  required_quality_disclosure: "Metering/sampling and original factors; physical/burden ledger distinction; balance residuals and uncertainty; coproduct/waste/fuel destinations; pollutant/size-bin coverage; missing UUIDs or upstream evidence; omitted stages; methodological review status"
  update_trigger: "Change of species/profile/grade/moisture, drying/heat route, stock supplier scope, control devices, coproduct destination, packaging or significant metered operating conditions"
data_sources:
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory (2021), Wood handbook—wood as an engineering material, FPL-GTR-282, Ch.4 pp.4–1/4–11; Ch.6 p.6–12 Fig.6–3; Ch.13 pp.13–2/13–5–13–6. https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Worked-softwood identity and moisture/density measurement principles only; no universal product specification or numerical factory factor"
  - id: "corrim-northern-lumber-2025"
    type: "literature"
    reference: "CORRIM (2025-07-22 revision), Life Cycle Assessment of Softwood Lumber Production – Northern Region, §§3.2.4, 3.2.6, 3.3, 4.6–4.7, pp.14,16,18,21–22. https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Northern-Lumber-Report-07222025.pdf"
    used_for: "Northern-US softwood lumber case: upstream step context, dry-mass bookkeeping and source screening; this lumber survey does not directly establish allocation applicability for continuously profiled wood. No profile yield, regional moisture/density, energy/emission factor or universal no-hazardous-substance claim reused"
  - id: "epa-sawmill-pte-2014"
    type: "official_guidance"
    reference: "US EPA Region 10 (2014-05-08), Particulate Matter Potential to Emit Emission Factors for Activities at Sawmills, Excluding Boilers, Located in Pacific Northwest Indian Country, memorandum p.1 and attachment table/footnotes. https://www.epa.gov/sites/default/files/2016-09/documents/spmpteef_memo.pdf"
    used_for: "Sawmill PTE scope and compatible nested filterable particle definitions; no boiler or profiling default factor, measured LCI or generic indoor-zero assumption"
  - id: "epa-wood-boiler-2022"
    type: "official_guidance"
    reference: "US EPA (March 2022), AP-42 §1.6 Wood Residue Combustion in Boilers, §§1.6.1–1.6.4 and Table1.6–1 footnotes. https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf"
    used_for: "Conditional wood-residue boiler pollutant/fuel/control screening and factor-basis caution; no numerical factor transplanted; retain biogenic CO2 LCI despite greenhouse statistical convention"
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:752699b31610269f972247cd4a0bb07931d6aae75afd114d4ec4ea91045b9c23"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8433"
      family: "system_boundary"
      span:
        start:
          offset: 8433
          line: 61
          column: 1
        end:
          offset: 12975
          line: 83
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Delivered kiln-dried untreated unglued uncoated coniferous sawn stock, rough or straight-planed; actual species/moisture declared |\n| starting_condition_role | Foreground profiling gate-to-gate with stock production upstream |\n| product_classification_scope | Continuous edge/face profile of solid coniferous wood, unassembled; CPC31211 context narrower |\n| recursive_input_rule | Purchased same-category pre-profiled wood cannot silently substitute for sawn stock; any remanufacturing route requires explicit boundary adaptation, supplier gate and inherited burdens once |\n| upstream_dataset_requirement | Compatible forestry/harvest, sawing/primary drying and stock delivery; electricity, external steam heat, fuels, auxiliaries and treatment providers. Verify species/moisture, geography/period, allocation/carbon conventions and stage inclusions |\n| disclosure | Starting gate, integrated versus purchased stock, drying already included versus later reconditioning, heat route, internal links, product state, stage exclusions and unresolved data/identity |\n\n| rule_id | Applies to | Rule | source_ids |\n| --- | --- | --- | --- |\n| `boundary_route` | profile production | Include receiving/stock handling, conditional reconditioning, rip/crosscut operations, continuous profiling, dust extraction/conveyance, grading and separate dispatch packaging. This PCR starts with already kiln-dried sawn stock; no sawing-log yield or upstream drying energy is inferred here. | `usda-wood-handbook-2021`; `corrim-northern-lumber-2025` |\n| `boundary_upstream` | supplier and integrated route | Purchased stock carries compatible upstream forestry, sawing, primary drying and delivery burdens once. In an integrated mill, use a separately evidenced upstream sawn-stock module with an identical kiln-dried handoff quantity/state; remove any purchased-stock dataset burden for that same internal flow. Shared drying, heat and handling meters are assigned once to their actual stage. A supplier dataset including profiling is not untreated sawn-stock input. | `corrim-northern-lumber-2025` |\n| `boundary_heat` | thermal routes | External steam heat uses a provider dataset only after its heat-quantity boundary, distribution-loss inclusions and condensate reference have been verified against steam_heat_basis; provider combustion is upstream. On-site steam generation records actual individual fuels, ash, water and direct emissions in heat. Match internal heat at the same receiver, and do not add a purchased-heat production dataset to internal_steam_in. Hot-air firing, non-steam heat, purchased green stock and preservative/glue/coating routes require a separately evidenced extension before use. | `epa-wood-boiler-2022`; `usda-wood-handbook-2021` |\n| `boundary_emissions` | air and waste | Screen all actual discharge points and control devices. Captured dust and separated shavings/sawdust are physical material streams; only escaping matter is an elementary air emission. PM rows are outdoor-air unspecified identity, not a claim that all exhaust has that site subcompartment. Where a different receiving compartment is required, verify another identity. Add other actual chemicals, packaging, water inputs, wastes and emissions as separate atomic rows before dataset release; absence requires evidence, not omission. | `epa-sawmill-pte-2014`; `epa-wood-boiler-2022`; `corrim-northern-lumber-2025` |\n| `boundary_carbon` | wood carbon | Retain biogenic CO2, CO and CH4 in LCI, with fossil fuel carbon separate. Product, sold residue, internal fuel, waste, ash carbon and stock changes form a carbon ledger; the same carbon is never sold, discarded and combusted simultaneously. Forestry uptake belongs upstream once, not a negative profiling emission. Product carbon at the gate is a material content disclosure, not a substitution or permanent-storage credit. Statistical omission of short-cycle CO2 does not delete the physical LCI flow. | `epa-wood-boiler-2022`; `corrim-northern-lumber-2025` |\n| `boundary_excluded` | downstream and infrastructure | Exclude flooring assembly, joinery assembly, installation, building use, maintenance, end-of-life and substitution credits from this manufacturing gate. Declare infrastructure/capital and worker-activity treatment with a significance assessment; omitted stages are not proven zero. Gate-to-gate foreground alone is not a cradle-to-gate result. | `corrim-northern-lumber-2025` |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 338
              line: 9
              column: 1
            end:
              offset: 404
              line: 9
              column: 67
          text: "# Untreated solid coniferous wood continuously shaped by machining"
          depth: 1
        - kind: "heading"
          span:
