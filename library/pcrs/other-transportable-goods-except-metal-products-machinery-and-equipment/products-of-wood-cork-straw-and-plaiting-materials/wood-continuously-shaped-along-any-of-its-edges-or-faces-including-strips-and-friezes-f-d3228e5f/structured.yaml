measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated net accepted finished wet wood mass at measured dispatch moisture from cp_reference; Q excludes packaging, rejects and upstream residues."
  - id: moisture_basis
    applies_to: "wood and residue"
    required_property_ref:
      name: "Dry-basis moisture fraction"
      uuid: ""
    required_unit: "dimensionless; % explicitly converted"
    rule: "Apply calc_moisture with paired wet/oven-dry measurements. Dispatch wet kg and oven-dry balance kg are distinct. No generic target moisture. [usda-wood-handbook-2021 Ch.4/13.]"
  - id: volume_basis
    applies_to: "volume-reported stock/profile/residue"
    required_property_ref:
      name: "Measured solid volume and matched density"
      uuid: ""
    required_unit: "m3; kg/m3"
    rule: "Apply calc_volume using net actual section and measured density at the same species/moisture state. Basic density, dry density, wet density and loose bulk density are different; no universal density."
  - id: carrier_basis
    applies_to: "electricity, steam and individual fuel"
    required_property_ref:
      name: "Verified carrier reference property"
      uuid: ""
    required_unit: "MJ; kg; m3"
    rule: "Use calc_energy. Retain the verified electricity energy property. Fuel HHV, boiler total generated heat and receiver-net steam heat are different quantities; a Gross calorific value property or a common MJ unit does not establish a conversion. For receiver-net steam heat, require the declared control volume, condensate return/reference enthalpy and distribution-loss boundary to match the supplier and background heat dataset. Follow steam_heat_basis; leave steam heat identity unresolved while compatibility is unproved. Gaseous natural gas has Volume/m3 reference: preserve metered reference conditions and measured density for mass/carbon conversion, without using the database secondary mass coefficient as a universal gas density."
  - id: steam_heat_basis
    applies_to: "purchased_steam; internal_steam_in; internal_steam_out"
    required_property_ref:
      name: "Net useful steam heat at the declared profiling receiver"
      uuid: ""
    required_unit: "MJ"
    rule: "Define the receiver control volume, steam state, enthalpy datum, returned condensate state/routing and reference enthalpy for any nonreturned mass. Retain supplier delivery/meter specifications, the matched background dataset reference-exchange documentation and the measured receiver steam/condensate balance. Confirm identical quantity boundaries and condensate references, or derive a documented mass/enthalpy/loss conversion with actual measurements and source conditions. Internal steam ends use the same validated receiver quantity. If any reference or conversion is unknown, keep the precise row with no selected UUID and report an unresolved heat-basis condition; no same-MJ or property-label assumption resolves it."
  - id: nox_quantity_basis
    applies_to: "handling_nox; boiler_nox"
    required_property_ref:
      name: "Mass; verified quantity convention"
      uuid: ""
    required_unit: "kg"
    rule: "Before calculation, document the actual measured or factor-derived NOx quantity convention, chemical/species scope, concentration and gas-state basis and its independently verified relation to the selected LCI flow and assessment method. Native Mass/kg does not establish an NO2-equivalent convention. Keep actual NO/NO2 species quantities and documented conversion/speciation evidence when an equivalent basis is used; no universal conversion or assumed split. Reconcile any aggregate with separately modelled NO/NO2 and keep N2O separately, without counting the same release twice. Missing convention/speciation or LCI/assessment compatibility leaves the raw result and its normalized exchange pending review; never silently label a mass as NO2-equivalent or invent zero."
