    - protocol_id: cp_aux
      process_id: "profiling"
      flow_role: "oil, spent oil, film and strap in separate fields"
      record_type: "consumable and waste record"
      raw_fields: "material/formulation; consumed kg; opening/closing inventory; returned material; oil spent kg; film/strap specification; counted units and sampled mass if converted; recipient; supplier scope"
      collection_method: "Weigh each material and waste independently, reconcile inventories/invoices; sample mass for any count conversion; record actual composition, grade, recycled content and destination; Preparation before aggregation: q_i=consumed material or independently dispatched waste adjusted for stock; x_i=q_i/Q; do not infer oil waste equals oil consumption"
      unit: "kg"
      frequency: "each lot, dispatch and stocktake"
      temporal_coverage: "Same accounting period as accepted Q"
      site_scope: "Selected profiling/packing equipment and suppliers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing; material specification/SDS; supplier and treatment records"
    - protocol_id: cp_emission
      process_id: "profiling"
      flow_role: "each individual substance and exclusive size bin"
      record_type: "measurement and calculation record"
      raw_fields: "source point; operating hours; species; medium; fuel origin; sampling method; concentration; dry/standard gas flow; control capture; filterable/condensable status; PM/PM10/PM2.5 observations; raw factor basis if justified; carbon test; uncertainty; detection limit; actual owner profiling; raw_record_id; shared_meter_id; boundary/internal status; matched transfer id"
      collection_method: "Measure actual post-control stacks/fugitive emissions over representative operation including starts/stops; otherwise document a source-specific validated calculation with original factor conditions, units, applicability and control basis. Distinguish captured material, individual VOC species and nested particle measurements; Preparation before aggregation: q_species=sum compatible concentration×gas-volume intervals plus justified fugitive estimates; apply particle differences and carbon reconciliation; x_i=q_i/Q; unknown is a gap, not zero Collect only actual profiling stage records; retain the original fields and QA only where physically applicable to that stage. A shared master meter or source record is a reconciliation witness, not an extra exchange: retain each attributable external raw record once across companion protocols using measured stage/service attribution, with fractions reconciled to the master total. Keep internal sending/receiving records separately with equal state, period and quantity; do not add either endpoint as another external purchase or emission. All companions use the same complete accepted-output reporting pool, retaining failed/rework activity and raw native units."
      unit: "kg; mg/m3; m3/h; h"
      frequency: "representative testing plus continuous activity logs"
      temporal_coverage: "Same accounting period as Q with justified test coverage"
      site_scope: "Every actual emitting source at selected site, kept separate by process"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "original test reports; factor originals if used; control/fuel logs; uncertainty/detection limits; compartment and double-count audit"
    - protocol_id: cp_emission_heat
      process_id: "heat"
