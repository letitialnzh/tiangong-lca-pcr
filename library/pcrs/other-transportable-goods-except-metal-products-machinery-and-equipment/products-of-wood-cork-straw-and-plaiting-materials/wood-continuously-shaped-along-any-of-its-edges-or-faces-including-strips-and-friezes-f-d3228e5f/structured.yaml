      raw_fields: "purchased/internal status; steam mass; pressure/temperature/enthalpy; returned condensate mass/enthalpy; receiver MJ; generated MJ; losses; tap-water kg; water vapor; bottom/fly ash kg and carbon; blowdown kg/composition; receiver totals; actual owner profiling; raw_record_id; shared_meter_id; boundary/internal status; matched transfer id"
      collection_method: "Meter steam and condensate at the same receiver; document steam_heat_basis and supplier/background heat reference-exchange compatibility, including loss inclusions, enthalpy datum and nonreturned-condensate reference; calculate useful heat only from a verified receiver enthalpy balance; weigh water and wastes or meter with verified density; identify all boiler recipients, controls and treatment destinations; Preparation before aggregation: q_steam=useful receiver MJ; x_steam=q_steam/Q; both internal ends equal; water/wastes separately sum physical kg/Q and preserve complete mass-water-carbon ledger Collect only actual profiling stage records; retain the original fields and QA only where physically applicable to that stage. A shared master meter or source record is a reconciliation witness, not an extra exchange: retain each attributable external raw record once across companion protocols using measured stage/service attribution, with fractions reconciled to the master total. Keep internal sending/receiving records separately with equal state, period and quantity; do not add either endpoint as another external purchase or emission. All companions use the same complete accepted-output reporting pool, retaining failed/rework activity and raw native units."
      unit: "MJ; kg; kJ/kg"
      frequency: "operating interval, batch waste dispatch and stocktake"
      temporal_coverage: "Same full period as Q, including heat losses"
      site_scope: "Steam receiver and on-site heat unit; external provider gate disclosed"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "steam/condensate meter calibration; supplier meter/delivery definition; background heat reference-exchange definition; enthalpy-datum and condensate/loss compatibility record or explicit unresolved finding; water balance; ash analysis; treatment receipts"
    - protocol_id: cp_heat_heat
      process_id: "heat"
      flow_role: "steam heat, makeup water and boiler wastes"
      record_type: "heat and boiler balance record"
      raw_fields: "purchased/internal status; steam mass; pressure/temperature/enthalpy; returned condensate mass/enthalpy; receiver MJ; generated MJ; losses; tap-water kg; water vapor; bottom/fly ash kg and carbon; blowdown kg/composition; receiver totals; actual owner heat; raw_record_id; shared_meter_id; boundary/internal status; matched transfer id"
      collection_method: "Meter steam and condensate at the same receiver; document steam_heat_basis and supplier/background heat reference-exchange compatibility, including loss inclusions, enthalpy datum and nonreturned-condensate reference; calculate useful heat only from a verified receiver enthalpy balance; weigh water and wastes or meter with verified density; identify all boiler recipients, controls and treatment destinations; Preparation before aggregation: q_steam=useful receiver MJ; x_steam=q_steam/Q; both internal ends equal; water/wastes separately sum physical kg/Q and preserve complete mass-water-carbon ledger Collect only actual heat stage records; retain the original fields and QA only where physically applicable to that stage. A shared master meter or source record is a reconciliation witness, not an extra exchange: retain each attributable external raw record once across companion protocols using measured stage/service attribution, with fractions reconciled to the master total. Keep internal sending/receiving records separately with equal state, period and quantity; do not add either endpoint as another external purchase or emission. All companions use the same complete accepted-output reporting pool, retaining failed/rework activity and raw native units."
      unit: "MJ; kg; kJ/kg"
