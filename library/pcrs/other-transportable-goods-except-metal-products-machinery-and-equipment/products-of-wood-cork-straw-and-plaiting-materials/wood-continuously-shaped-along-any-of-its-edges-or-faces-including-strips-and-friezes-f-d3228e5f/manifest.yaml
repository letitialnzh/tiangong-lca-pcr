review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  source_flow_classification_review:
    - flow_uuid: acc22294-8e77-4784-988f-2499be3c60eb
      row_ids:
        - waste_offcut
      reported_classification: CPC 39282 agglomerated wood waste and scrap
      physical_identity_evidence: Bilingual wood-offcut names/synonyms and
        woodworking-cut-remnant comment agree; Waste flow, Mass/kg, and no
        treatment route requiring agglomeration.
      qualification: Retain broad physical identity only for actual non-agglomerated
        coarse wood offcuts with documented wood/adhesive state and
        recipient/provider compatibility.
      review_state: Source classification inconsistency unresolved; source/provider
        clarification required. No fully verified classification or treatment
        compatibility claim.
    - flow_uuid: e64eb06c-6dc9-45f1-b003-3dc6c44b27e2
      row_ids:
        - packing_film
      reported_classification: CPC 29220 luggage and handbags
      physical_identity_evidence: Concordant polyethylene-film names, CAS 9002-88-4
        and physical-film comment.
      qualification: Actual polyethylene-film material/state and grade, supplier and
        provider boundaries must match; no generic packaging background is
        implied.
      review_state: Source classification inconsistency unresolved; source/provider
        clarification required. No fully verified classification or background
        compatibility claim.
  scientific_review: pending
  semantic_boundary:
    decision: Promote matching retained unpublished scaffold. Untreated, unglued,
      uncoated, unassembled solid coniferous continuously shaped profiles from
      kiln-dried sawn stock. Plain sawn/straight-planed wood is upstream;
      assembled floors, doors/windows and engineered/glued/treated profiles
      excluded.
    classification_relation: narrower
    rationale: Continuous net cross-section, dimensional/grade/moisture acceptance,
      profiling dust and separated shavings/sawdust, energy and stock upstream
      double-count control establish a material boundary distinct from existing
      kiln-dried sawn-coniferous PCR. No overlapping material profile PCR found;
      no shared accepted mapping changed.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  reference_identity:
    flow_id: ff81f231-e5cb-4744-8c0f-a7cb5ec4f8bd
    flow_type: Product flow
    flow_property_id: 93a60a56-a3c8-11da-a746-0800200b9a66
    unit_group_id: 93a60a57-a4c8-11da-a746-0800200c9a66
    reference_unit: kg
    scope_note: Public classification product identity only; narrower actual
      stock/profile and untreated/unglued/uncoated/unassembled qualifiers are
      mandatory.
  unresolved_flow_uuid_reviews:
    status: open
    row_ids:
      - shavings_sold
      - sawdust_sold
      - offcuts_sold
      - shavings_fuel_out
      - sawdust_fuel_out
      - waste_shavings
      - packing_strap
      - shavings_fuel_in
      - sawdust_fuel_in
      - bottom_ash
      - fly_ash
      - blowdown
      - purchased_steam
      - internal_steam_in
      - internal_steam_out
      - machine_oil
    policy: Retain precise atomic name and blank UUID. Bounded successful
      searches/direct reads did not establish exact matching identities; no
      mixed hog-fuel/biomass, chips-for-dust, coal fly ash, BOD index, paper
      effluent or wiring cable-tie substitution. Steam heat has a known
      candidate identity but its receiver-net heat/condensate basis is unproved;
      selected UUIDs are withheld pending matched heat-boundary evidence.
      Resolve before complete dataset release.
  identity_rejections:
    - row_id: shavings_sold
      reason: No exact clean coniferous planer-shavings product identity in bounded
        search. Generic biomass lacks origin/state; particle board is a
        manufactured panel.
    - row_id: sawdust_sold
      reason: Wood chips e0ccd0e1-9f75-4f2a-a9b9-5ebc8b3e5315 has English Wood chips
        and no confirming dust form. Hog fuel
        5f5a176e-cae4-4978-be10-76bf7b92a3d6 explicitly combines
        sawdust/chips/shavings/bark. Reject both for separated sawing dust.
    - row_id: offcuts_sold
      reason: Waste offcut cannot represent a sold clean solid-wood coproduct. No
        exact product identity established.
    - row_id: shavings_fuel_out
      reason: Mixed hog fuel and unspecified biomass do not establish this separated
        untreated coniferous planer shavings stream. No exact identity
        confirmed; actual moisture/heating value collection remains required.
    - row_id: sawdust_fuel_out
      reason: Mixed hog fuel and unspecified biomass do not establish this separated
        untreated coniferous sawing dust stream. No exact identity confirmed;
        actual moisture/heating value collection remains required.
    - row_id: waste_shavings
      reason: Generic Wood waste 2ef9d37a-2fbf-42f6-8ccf-5d6677d5cfd8 does not
        establish separated clean planer-shavings form.
    - row_id: packing_strap
      reason: Cable tie 74d3acda-f550-4f11-9560-d2980881829d is wiring-harness
        accessory; PP resin/twine/bags and mixed packaging do not establish
        packaging strap.
    - row_id: shavings_fuel_in
      reason: Mixed hog fuel and unspecified biomass do not establish this separated
        untreated coniferous planer shavings stream. No exact identity
        confirmed; actual moisture/heating value collection remains required.
    - row_id: sawdust_fuel_in
      reason: Mixed hog fuel and unspecified biomass do not establish this separated
        untreated coniferous sawing dust stream. No exact identity confirmed;
        actual moisture/heating value collection remains required.
    - row_id: bottom_ash
      reason: No exact wood-residue bottom ash found; alkaline liquor is physically
        different. Require ash source, carbon and treatment identity.
    - row_id: fly_ash
      reason: 4389f300-6792-4990-bf43-c257d13a1197 explicitly identifies
        coal-combustion residue; reject for wood boiler fly ash.
    - row_id: blowdown
      reason: Industrial waste water 7ef0f262-39b8-43cd-86b0-87486b1aab11 comment is
        BOD5 index, not specific wood-residue steam-boiler blowdown composition;
        paper effluent wrong origin.
    - row_id: machine_oil
      uuid: aec6f1a5-7b09-4704-870d-434d3ada0edd
      reason: Retained original direct record explicitly specifies fully synthetic
        PAO/total synthesis, contrary to this mineral petroleum-fraction
        lubricant. Keep the precise mineral-oil exchange with no selected UUID
        until compatible identity/formulation/provider evidence exists.
  evidence_limitations:
    - No actual site-period mass, dimensions, moisture, carbon fraction, metered
      energy, fuel calorific value/density, supplier upstream module, coproduct
      value or emissions collected. All quantitative exchanges are real
      collection requirements, not observations or copied ranges.
    - USDA supports measurement and worked-profile identity; CORRIM is a
      northern-US softwood lumber case only. No numerical survey parameter
      transferred to profiling. Dry-mass joint-burden allocation is an
      author-selected extension requiring independent methodological review.
    - EPA sawmill PTE excludes boilers, is not profiling LCI and omits
      condensable PM. AP42 supports wood-residue boiler screening only, without
      transferred factors. Fossil ignition/handling values require actual
      source-specific emissions evidence.
    - Green/air-dried stock, coating/preservation/glue, direct-fired non-steam
      heat and steam sales to outside providers are outside declared route.
      Other actual packaging scraps, reject/rework transfers, humidification
      water, chemicals or species require explicit atomic extensions before data
      release.
    - Author verified paired inventory identities, exact official Chinese names,
      row/rule IDs, reference denominator, collection aggregation and
      calculation formulas. Translation is aligned, not independently reviewed;
      scientific review and actual foreground data remain pending.
  measurement_basis:
    physical_inventory: Unallocated same-period cohort totals divided by accepted
      final net wet wood Q kg, excluding packaging.
    graph: profiling with stage-specific packing/reconditioning/dust energy, plus
      conditional on-site steam heat; only one reference-product output.
    allocation: Environmental burdens separately attributed/allocated; physical
      final/coproduct/internal quantities retained.
  allocation_method_review:
    status: pending_independent_methodological_review
    rule_id: allocation_shared
    authoring_record: Dry-mass allocation for the profiling split is an
      author-selected extension. CORRIM northern-US softwood lumber evidence
      supports upstream context and bookkeeping, not direct validation of
      allocation for continuously shaped wood.
    applicability: Actual joint step, comparable solid-wood coproducts, measured
      oven-dry shares and substantiated physical causal relationship; retain
      economic sensitivity. Incomparable outputs or unsupported causal
      relationship leave allocation unresolved.
  steam_heat_semantic_review:
    status: unresolved_heat_quantity_and_identity_compatibility
    row_ids:
      - purchased_steam
      - internal_steam_in
      - internal_steam_out
    candidate_flow_uuid: fcf9e128-688f-42f0-9dca-85d2319cfac5
    candidate_base_name_en: Process heat from steam
    candidate_base_name_zh: 蒸汽工艺热
    candidate_reference_property_uuid: 93a60a56-a3c8-14da-a746-0800200c9a66
    candidate_reference_property: Gross calorific value
    decision: Preserve prior candidate and direct-read history, but withhold
      selected UUID for all three precise receiver-net useful steam-heat rows.
      Product identity and MJ energy dimension are confirmed; receiver-net heat,
      supplier delivery boundary and condensate reference are not confirmed by
      the original flow/property records.
    missing_evidence:
      - Supplier steam-delivery/meter control-volume and loss-inclusion
        specification.
      - Matched background heat dataset reference-quantity definition,
        condensate enthalpy datum and return/nonreturn convention.
      - Measured receiver steam/condensate enthalpy balance and any justified
        conversion between those definitions.
    conditional_adoption: Adopt the candidate only after documentary and measured
      evidence establishes the same quantity basis, or a validated
      measurement-based mass/enthalpy/loss conversion. Fuel HHV and boiler total
      generated heat cannot substitute for receiver-net useful heat. Unknown
      compatibility remains unresolved.
    historical_audit_note: Earlier author audit treated the energy label as
      compatible. This review supersedes that current decision without altering
      the preserved original queries, direct reads, rejection history or
      prior-commit evidence.
  cpc3_audit_20261012:
    scope: independent final-content consistency remediation; no formal
      methodology,translation,mapping or publication approval
    prior_metadata: []
    review_state: fresh final review pending
