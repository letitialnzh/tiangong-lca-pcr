allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Keep two linked accounts: an unallocated wood/water/carbon physical process ledger, and an environmental-burden allocation ledger. Directly attribute exclusive receiving, rechipping, screening and storage burdens wherever measurable; subdivide before joint allocation. Co-products already separated at an upstream sawmill must arrive with that stage’s inherited burden. Do not reassign upstream lumber drying to chips separated before drying; do retain any actual drying of the received offcut. [corrim-northern-lumber-2025, §3.2.6, Northern US sawmill case only.]"
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "For a causally suitable joint wood-material step, allocate only shared burdens by measured oven-dry useful output mass: a_i=d_i/sum(d_j). Use outputs of that same step, excluding waste and internal loops. The cohort’s shares sum to one; all physical output masses stay unchanged and finished reference remains 1 m3. This is this PCR’s dry-mass implementation, not a universal surveyed yield. If outputs have materially different functions or causal basis, require explicit review and contemporaneous economic sensitivity before dataset use; no universal price or allocation share."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "Dedicated chipping assigns its dedicated burdens to the produced chips, with explicit jointly saleable bark/fine treatment. Imported residue never becomes a free input by assumption. Waste receives actual handling/treatment burden without a saleable-output share by default. Partition bark/fines by actual sale, return and waste destinations without overlap. Internal energy use requires a distinct verified energy unit and transfer ledger; excluded foreground boiler operation cannot be hidden as a credit. No avoided-fuel, avoided-disposal or substitution credit is allowed in this attributional gate dataset. [usda-wood-handbook-2021; corrim-northern-lumber-2025.]"
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "preparation"
      flow_role: "accepted dispatch"
      record_type: "measurement and traceable record"
      raw_fields: "lot; species; specification; moisture; wet mass; tare; accepted solid volume V_s; bulk volume V_b; particle density; packing; storage age; provider reference amount/solid-bulk definition; documented moisture/species/packing and included loss gate; compatibility evidence locator"
      collection_method: "Weigh net accepted bulk product on calibrated scales. Sample representative particles by species/size and moisture at dispatch; measure solid displacement volume with absorption correction or traceable same-state density and derive V_s. Measure calibrated vessel/truck bulk volume with recorded settling, without imposing generic solid/bulk factors. Check cp_volume_link independently; measured foreground solid volume is not proof of the provider reference convention."
      unit: "kg; m3"
      frequency: "Each lot or metering interval; storage repeated over residence"
      temporal_coverage: "Declared representative operating period, including seasonal moisture variation; no invented minimum duration"
      site_scope: "One declared site and matched cohorts/routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; matched stock; sampling representativeness; uncertainty; supplier/test boundaries"
    - protocol_id: cp_material
      process_id: "preparation"
      flow_role: "each wood or water exchange"
      record_type: "measurement and traceable record"
      raw_fields: "source; gate; species; producer route/allocation; upstream prior drying; wet/dry mass; moisture basis; bark; impurity; receipt; stock; destination; V_s; V_b; provider reference amount/solid-bulk definition; documented moisture/species/packing and included loss gate; compatibility evidence locator"
      collection_method: "Weigh streams separately and pair batch moisture samples. Oven-dry representative wood samples using the handbook Ch.13 method to stable mass, retaining temperature, interval, extractive bias and uncertainty. Supplier moisture meters require species/temperature calibration. Treat sampled moisture as material evidence, not a universal range. Check cp_volume_link independently; measured foreground solid volume is not proof of the provider reference convention."
      unit: "kg; m3"
      frequency: "Each lot or metering interval; storage repeated over residence"
      temporal_coverage: "Declared representative operating period, including seasonal moisture variation; no invented minimum duration"
      site_scope: "One declared site and matched cohorts/routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; matched stock; sampling representativeness; uncertainty; supplier/test boundaries"
    - protocol_id: cp_energy
      process_id: "preparation"
      flow_role: "each energy/material input"
      record_type: "measurement and traceable record"
      raw_fields: "stage meter start/end; voltage; kWh; diesel receipts/use/stock/density; lubricant mass; hours; reprocessing"
      collection_method: "Use stage submeters and documented reconciliation; separate carrier and maintenance oil; include reprocessing and dust collection consumption."
      unit: "MJ; kg"
      frequency: "Each lot or metering interval; storage repeated over residence"
      temporal_coverage: "Declared representative operating period, including seasonal moisture variation; no invented minimum duration"
      site_scope: "One declared site and matched cohorts/routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; matched stock; sampling representativeness; uncertainty; supplier/test boundaries"
    - protocol_id: cp_transport
      process_id: "preparation"
      flow_role: "inbound haulage"
      record_type: "measurement and traceable record"
      raw_fields: "truck class; provider; origin/gate; wet payload; loaded km; load factor; empty return; duplicate provider boundary"
      collection_method: "Use dispatch weights and route records; check actual 30-ton diesel service. Match each upstream delivery gate to haulage start to avoid missing or duplicate legs."
      unit: "kg*km"
      frequency: "Each lot or metering interval; storage repeated over residence"
      temporal_coverage: "Declared representative operating period, including seasonal moisture variation; no invented minimum duration"
      site_scope: "One declared site and matched cohorts/routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; matched stock; sampling representativeness; uncertainty; supplier/test boundaries"
    - protocol_id: cp_recirculation
      process_id: "preparation"
      flow_role: "oversize and fines returns"
      record_type: "measurement and traceable record"
      raw_fields: "transfer id; stage; pass; cohort; wet/dry mass; moisture; return origin/destination; meter energy"
      collection_method: "Weigh oversize returns and fine returns separately each pass. Pair physical endpoints at identical quantities before burden attribution; track accumulated processing energy without treating circulation as new yield."
      unit: "kg"
      frequency: "Each lot or metering interval; storage repeated over residence"
      temporal_coverage: "Declared representative operating period, including seasonal moisture variation; no invented minimum duration"
      site_scope: "One declared site and matched cohorts/routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; matched stock; sampling representativeness; uncertainty; supplier/test boundaries"
    - protocol_id: cp_waste
      process_id: "preparation"
      flow_role: "each separate residue"
      record_type: "measurement and traceable record"
      raw_fields: "stream; material; sale/waste status; destination; wet/dry mass; moisture; receiver/treatment; bin and stock; recovery route"
      collection_method: "Weigh bark waste, wood screening reject, mineral soil, steel, captured dust, spoiled wood and used oil separately; retain receiver and treatment evidence. Add a specific row for any additional actual material."
      unit: "kg"
      frequency: "Each lot or metering interval; storage repeated over residence"
      temporal_coverage: "Declared representative operating period, including seasonal moisture variation; no invented minimum duration"
      site_scope: "One declared site and matched cohorts/routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; matched stock; sampling representativeness; uncertainty; supplier/test boundaries"
    - protocol_id: cp_storage
      process_id: "preparation"
      flow_role: "water and biological storage losses"
      record_type: "measurement and traceable record"
      raw_fields: "cohort; opening/closing wet/dry stock; receipts/dispatch; residence; temperature; cover; rain uptake; evaporated water; runoff; dry removal; C content; gas species; measurement uncertainty"
      collection_method: "Measure cohort stock, moisture and losses repeatedly over actual residence. Meter collected runoff and rain uptake. Measure gases or calibrate a species-specific carbon model with real monitoring. Separate biological loss, wood dust export and water change; unexplained deficit is a data gap, never assigned wholly to CO2."
      unit: "kg"
      frequency: "Each lot or metering interval; storage repeated over residence"
      temporal_coverage: "Declared representative operating period, including seasonal moisture variation; no invented minimum duration"
      site_scope: "One declared site and matched cohorts/routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; matched stock; sampling representativeness; uncertainty; supplier/test boundaries"
    - protocol_id: cp_dust
      process_id: "preparation"
      flow_role: "each nonoverlapping particle fraction"
      record_type: "measurement and traceable record"
      raw_fields: "source stage; operating hours; handling mass; PMtotal; PM10; PM2.5; sampling method; control; capture; escape; blank; size definition"
      collection_method: "Use compatible actual emissions measurements or site-specific validated factors matched to stage/control. Reconcile captured solids. EPA PTE table is a scope and size-definition check, not actual emission data and not boiler evidence."
      unit: "kg"
      frequency: "Each lot or metering interval; storage repeated over residence"
      temporal_coverage: "Declared representative operating period, including seasonal moisture variation; no invented minimum duration"
      site_scope: "One declared site and matched cohorts/routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; matched stock; sampling representativeness; uncertainty; supplier/test boundaries"
    - protocol_id: cp_engine
      process_id: "preparation"
      flow_role: "each engine gas"
      record_type: "measurement and traceable record"
      raw_fields: "fuel identity; grade; fossil/biogenic fraction; engine type; load/hours; measured burn; C/N/S; species-resolved measured emissions or supplier factor; control; unit"
      collection_method: "Use actual engine test/monitoring evidence or applicable supplier factors with their units and load conditions; multiply by measured activity. Retain uncertainty; missing species is a gap, not zero. Diesel row here is petroleum-only; any blend needs separated identity and carbon origin."
      unit: "kg"
      frequency: "Each lot or metering interval; storage repeated over residence"
      temporal_coverage: "Declared representative operating period, including seasonal moisture variation; no invented minimum duration"
      site_scope: "One declared site and matched cohorts/routes"
      aggregation_rule: "per reference flow"
      quality_evidence: "Calibration; raw records; matched stock; sampling representativeness; uncertainty; supplier/test boundaries"
    - protocol_id: cp_volume_link
      process_id: "preparation"
      flow_role: "Wood Chip quantity and provider-link compatibility"
      record_type: "provider reference documentation and matched measurement"
      raw_fields: "supplier/background Process id and version; reference amount A_provider and unit; solid/bulk definition; definition locator; species/mix; moisture value and basis; chip size; packing/settling; rho_ws; V_s; V_b; k; measurement cohort and calibration; uncertainty; supplier/receipt/dispatch gates; included losses and storage; evidence locator; compatibility decision and missing evidence"
      collection_method: "Read the provider reference-exchange documentation and obtain a traceable supplier declaration if ambiguous. Compare it independently with receipt and output solid-volume definitions. Measure packing/density on the same batch or use representative traceable data with documented species, moisture, size, packing and state applicability. Match delivery and loss gates without double counting; moisture/species changes require an evidenced material-state reconciliation. Database secondary-property coefficients and FAO average tables do not establish a matched conversion. If provider definition, conversion or boundary evidence is missing, record pending, withhold the completed link and mark the affected dataset incomplete."
      unit: "m3; kg"
      frequency: "Each proposed provider link and batch; recheck on state/provider change"
      temporal_coverage: "Declared measured cohort or documented representative coverage"
      site_scope: "Supplier gate, receipt, accepted output and each proposed background interface"
      aggregation_rule: "per reference flow"
      quality_evidence: "Provider reference locator; calibrated matched measurements; representativeness; uncertainty; nonduplicated loss reconciliation; explicit pending gaps"
  calculation_rules:
    - id: normalize_solid
      applies_to: "all inventory rows"
      rule: "x_i=X_i/V_s; X_i is the attributable exchange quantity for the matched production cohort and V_s its accepted solid-volume dispatch. Reference chips output equals 1 m3. Divide sums by the sum of matched V_s; do not average batch ratios."
      inputs:
        - X_i
        - V_s
        - cp_reference
      output: "Exchange per reference flow"
      source_ids: []
    - id: wood_moisture
      applies_to: "cp_material; cp_reference"
      rule: "w=(m_w-m_d)/m_w; u=(m_w-m_d)/m_d; m_d=m_w*(1-w)=m_w/(1+u). Convert measured percentages to fractions first."
      inputs:
        - m_w
        - m_d
        - cp_material
      output: "Wet/dry wood and water masses"
      source_ids:
        - usda-wood-handbook-2021
        - fao-units
    - id: solid_bulk
      applies_to: "cp_reference"
      rule: "V_s=m_w/rho_ws; k=V_s/V_b. Use same-state measured particle density and retain uncertainty; density must exclude interparticle voids."
      inputs:
        - m_w
        - rho_ws
        - V_b
        - cp_reference
      output: "Solid and bulk volumes kept distinct"
      source_ids:
        - usda-wood-handbook-2021
        - fao-units
    - id: particle_intervals
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "PMfine=PM2.5; PMcoarse=PM10-PM2.5; PMlarge=PMtotal-PM10. All measurements must cover the same source, time, aerosol method and control. Negative differences are inconsistent evidence; neither nested totals nor captured wood mass are added to emitted intervals."
      inputs:
        - cp_dust
      output: "Three disjoint airborne particle quantities"
      source_ids:
        - epa-sawmill-pte-2014
    - id: storage_balance
      applies_to: "cp_storage"
      rule: "Opening dry stock + dry receipts = closing dry stock + dry dispatch + dry solid rejects + dry wood dust leaving + biological dry loss + unresolved residual. Reconcile water separately, including rain/suppression inputs, runoff, retained moisture and vapour. Compare like moisture/volume states; volume settling alone is not wood loss."
      inputs:
        - cp_material
        - cp_storage
        - cp_waste
        - cp_dust
      output: "Unallocated wood and water reconciliation"
      source_ids:
        - usda-wood-handbook-2021
    - id: carbon_balance
      applies_to: "cp_storage; cp_engine"
      rule: "Keep biogenic and fossil carbon accounts separate. Measured dry mass times measured carbon fraction defines material carbon; reconcile carbon in product, stock, residues, dissolved/suspended carbon and gases. C in CO2=12/44 times CO2 mass; C in CH4=12/16 times CH4 mass. Missing gas partition or carbon fate remains explicit, not a forced CO2 closure or carbon-storage credit."
      inputs:
        - cp_storage
        - cp_engine
      output: "Physical carbon closure and explicit gaps"
      source_ids: []
    - id: joint_burdens
      applies_to: "joint wood step"
      rule: "a_i=d_i/sum(d_j); B_i=a_i*B_joint+B_exclusive,i. d_j is measured oven-dry useful output of that same step; apply shares only in the burden account, not to physical exchanges."
      inputs:
        - cp_material
        - "joint-step data"
      output: "Separate allocated burden account"
      source_ids:
        - corrim-northern-lumber-2025
        - usda-wood-handbook-2021
    - id: provider_volume_link
      applies_to: "incoming_chips; chips"
      rule: "For a matched provider gate/state, V_b,provider=V_s,link/k_provider, where k_provider=V_s,provider/V_b,provider is the evidenced solid/bulk packing conversion applicable to that provider state. For a bulk-m3 background, n_provider=V_b,provider/A_provider; for a solid-m3 background, n_provider=V_s,link/A_provider. A_provider is the provider’s documented reference amount in its stated volume convention. V_s,link is the physical quantity at the matched provider gate, not automatically receipt or final dispatch volume; reconcile actual losses and stocks between gates independently. Apply these relations only after moisture/species/packing and loss-boundary compatibility is established; any state adjustment needs its own measured evidence. Unknown definition, k_provider or required adjustment gives pending compatibility, not a numerical demand, generic fallback or completed link."
      inputs:
        - cp_volume_link
        - cp_reference
        - cp_material
        - cp_storage
      output: "Provider-reference demand with verified compatibility, or explicit pending"
      source_ids: []
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
