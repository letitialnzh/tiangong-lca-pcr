validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Validate one accepted final chips output of 1 m3 and a matching cohort denominator in every protocol and inventory row. Verify all required qualifiers, upstream origin burden, delivery gates and provider coverage. Compare solid/bulk volume and wet/dry mass independently; do not accept an unsupported packing factor or density. Check each return pair, bark sale/waste split, fines sale/return split, stock and storage balances before burden allocation. Check allocation shares sum to one for each actual joint step and that physical outputs were not scaled."
