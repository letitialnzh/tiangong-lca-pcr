  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "For incoming_chips, chips and each Wood Chip supplier/background link, validate three distinct statuses: known product/property-unit identity, measured PCR solid-volume quantity, and provider-reference compatibility. Inspect provider reference amount/definition and its evidence locator, then independently verify solid/bulk, moisture/species/packing, same-state conversion and included transport/handling/storage losses. If the background is per bulk m3, express demand through the evidenced provider-state k_provider and A_provider in provider_volume_link, not a copied solid-m3 quantity. Do not substitute database secondary-property coefficients or FAO average values for matching measurement evidence. A missing provider volume definition or applicable conversion/state/loss evidence keeps quantity/background compatibility pending and the affected dataset incomplete; block a completed link and complete-dataset use while retaining the verified Wood Chip identity. Builder checks passing does not resolve this pending state."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "Check elemental mass/species/medium and fossil/biogenic origin, three disjoint particle intervals, captured dust versus emitted dust, and water evaporation versus dry-matter loss. Retain biogenic CO2 in LCI. A missing or incompatible identity, unexplained balance, unsupported amount, direct wastewater discharge without species/medium rows, or foreground thermal drying/boiler makes the affected dataset incomplete and requires resolution before use as a complete dataset. Builder measurement checks verify declared denominator relationships; they do not establish scientific approval, measured yields, provider validity or all balance equations."
    source_ids: []
