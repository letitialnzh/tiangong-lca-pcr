measurement_rules:
  - id: solid_basis
    applies_to: "reference product"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Solid volume excludes air gaps and is measured at dispatch moisture. Collect cp_reference; retain species and moisture-matched density, not generic conversion factors."
  - id: moisture_basis
    applies_to: "wood exchanges"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep wet mass m_w, oven-dry mass m_d and water separately. w=(m_w-m_d)/m_w; u=(m_w-m_d)/m_d; m_d=m_w*(1-w)=m_w/(1+u). w and u are fractions, not percentages; report percent only with explicit /100 conversion. [usda-wood-handbook-2021; fao-units.]"
  - id: volume_state
    applies_to: "cp_reference; cp_material"
    required_property_ref:
      name: "Volume and mass"
      uuid: ""
    required_unit: "m3; kg"
    rule: "V_s=m_w/rho_ws for the same measured moisture state; V_b is measured loose bulk volume including air gaps. k=V_s/V_b is batch-specific. Do not use dry-solid density with wet mass."
  - id: energy_state
    applies_to: "electricity; diesel"
    required_property_ref:
      name: "energy; mass"
      uuid: ""
    required_unit: "MJ; kg"
    rule: "Electricity kWh*3.6=MJ. Diesel remains kg; volumetric delivery needs actual supplier density. Fuel calorific energy is not useful heat."
  - id: nox_quantity_basis
    applies_to: "nox"
    required_property_ref:
      name: "Mass; verified quantity convention"
      uuid: ""
    required_unit: "kg"
    rule: "Before calculation, document the actual measured or factor-derived NOx quantity convention, chemical/species scope, concentration and gas-state basis and its independently verified relation to the selected LCI flow and assessment method. Native Mass/kg does not establish an NO2-equivalent convention. Keep actual NO/NO2 species quantities and documented conversion/speciation evidence when an equivalent basis is used; no universal conversion or assumed split. Reconcile any aggregate with separately modelled NO/NO2 and keep N2O separately, without counting the same release twice. Missing convention/speciation or LCI/assessment compatibility leaves the raw result and its normalized exchange pending review; never silently label a mass as NO2-equivalent or invent zero."
