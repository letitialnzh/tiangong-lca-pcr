review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  reference_identity_review: Exterior Window is a genuine complete product flow
    for factory production, Mass/kg. The PCR narrows this inclusive identity to
    spruce frame, single sash, triple argon IGU and installed hardware; the
    direct record has no opposing hard limitation. Mixed doors/stairs/wood goods
    remain rejected.
  unresolved_flow_rows:
    - row_id: wood_blank
      selected_flow: Kiln-dried laminated spruce window scantling
      reason: No candidate specifies kiln-dried laminated spruce scantling. Sawn
        timber and dry unglued wood do not include lamination.
    - row_id: coat_acrylic
      selected_flow: Acrylic resin waterborne binder
      reason: Water-paint resin does not identify acrylic polymer chemistry; UV
        coating is a formulated finished product, not this constituent.
    - row_id: coat_pur
      selected_flow: Polyurethane resin coating binder
      reason: Generic water-paint resin does not identify polyurethane polymer
        chemistry.
    - row_id: coat_alkyd
      selected_flow: Alkyd resin
      reason: A chemically specific alkyd binder must match supplier chemistry and
        product state; inspected candidates remain unresolved.
    - row_id: coat_butoxy
      selected_flow: 2 Butoxyethanol
      reason: Specific coating constituent requires CAS 111-76-2 in product form;
        emissions records cannot supply product identity.
    - row_id: coat_pg
      selected_flow: Propylene glycol
      reason: Propylene carbonate, polyols, antifreeze, humectant and glycol ethers
        are not propylene glycol CAS 57-55-6.
    - row_id: glazing_sealant
      selected_flow: Silicone sealant
      reason: Generic sealant is not a declared silicone glazing sealant; wafer
        reactive adhesive is a different route.
    - row_id: hinge
      selected_flow: Zinc plated steel window hinge
      reason: Steel hinge direct-read has assembly route but no zinc-plating
        statement. Do not collapse galvanized hinge to unqualified steel.
    - row_id: locking
      selected_flow: Zamak window locking fitting
      reason: Broad locks and fittings do not establish zamak window locking part
        identity; received safe/lock routes differ.
    - row_id: handle
      selected_flow: Anodised aluminium window handle
      reason: Aluminium ingot, foil, shell and anodising are not a finished anodised
        window handle.
    - row_id: gasket_tpe
      selected_flow: Thermoplastic elastomer window gasket
      reason: No thermoplastic elastomer gasket; TPT film and plastic sheet are
        distinct products.
    - row_id: gasket_epdm
      selected_flow: EPDM window gasket
      reason: No EPDM window gasket. Glass, pallet and generic waterproofing are
        different products.
    - row_id: glazing_tape
      selected_flow: Polyethylene foam glazing tape
      reason: Generic foam, EVA film, packing tape and aluminium/PE sealing tape are
        not polyethylene foam glazing tape.
    - row_id: glazing_block
      selected_flow: Polypropylene glazing block
      reason: PP granulate or generic polymer is not a finished glazing block.
    - row_id: pins
      selected_flow: Galvanized steel glazing bead pin
      reason: Glass beads are not galvanized steel glazing bead pins.
    - row_id: rain_profile
      selected_flow: Anodised aluminium window rain protection profile
      reason: Generic extrusion profile does not establish anodised finished
        rain-protection profile.
    - row_id: cleaning_water
      selected_flow: Process water
      reason: Direct-read process water ec205030 is reaction/solution medium; do not
        assume cleaning-water supply route equivalence.
    - row_id: pack_rack
      selected_flow: Spruce wooden transport rack
      reason: Pallet, general wrapping material and untreated stock do not identify
        spruce window transport rack.
    - row_id: pack_strap
      selected_flow: Polyester packaging strap
      reason: Steel band, leather belt, fibre and mixed packaging are not PET
        packaging strap.
    - row_id: offcut
      selected_flow: Clean spruce machining offcut
      reason: Generic wood waste/scrap lacks clean spruce machining coproduct state
        and delivery specification.
    - row_id: waste_wood
      selected_flow: Waste wood chemically treated
      reason: Generic wood waste does not establish chemically treated wood
        composition and treatment route.
    - row_id: waste_sludge
      selected_flow: Paint sludge
      reason: Sludge or discarded paint is not necessarily captured coating sludge
        with declared solids/liquid state.
    - row_id: wastewater
      selected_flow: Wastewater from coating cleaning
      reason: Generic wastewater and other industrial cleaning routes do not prove
        coating-cleaning effluent identity.
    - row_id: waste_glass
      selected_flow: Broken insulating glass unit
      reason: Glass shards/cullet omit assembled insulating unit spacers, sealants and
        gas; not interchangeable.
    - row_id: waste_film
      selected_flow: Waste polyethylene film
      reason: Waste polyethylene direct read does not specify film and may discuss
        HDPE. Retain LDPE film-specific waste unresolved.
    - row_id: bought_glue_pvac
      selected_flow: Supplier-formulated PVAc corner-joint adhesive
      reason: Actual whole supplier-formulated product requires its own compatible
        complete-product identity/reference and provider boundary; pure
        constituent UUIDs cannot identify the supplied mixture. No new identity
        query or recipe assumed.
    - row_id: bought_coat_acrylic
      selected_flow: Supplier-formulated acrylic primer
      reason: Actual whole supplier-formulated product requires its own compatible
        complete-product identity/reference and provider boundary; pure
        constituent UUIDs cannot identify the supplied mixture. No new identity
        query or recipe assumed.
    - row_id: bought_coat_pur
      selected_flow: Supplier-formulated polyurethane finish
      reason: Actual whole supplier-formulated product requires its own compatible
        complete-product identity/reference and provider boundary; pure
        constituent UUIDs cannot identify the supplied mixture. No new identity
        query or recipe assumed.
    - row_id: bought_coat_alkyd
      selected_flow: Supplier-formulated alkyd impregnation coating
      reason: Actual whole supplier-formulated product requires its own compatible
        complete-product identity/reference and provider boundary; pure
        constituent UUIDs cannot identify the supplied mixture. No new identity
        query or recipe assumed.
  dataset_recipe_requirements: Each actual whole bought PVAc glue/acrylic
    primer/PUR finish/alkyd impregnation formulation has one specific
    complete-product exchange, identity and compatible supplier reference; all
    listed ingredient IDs retain analytical composition/fate ledgers. Ingredient
    external cards apply only to true separately purchased onsite inputs.
    Missing whole product, composition or boundary evidence remains incomplete.
  dataset_background_requirements: Exact chemical/utility/elementary UUID identity
    does not prove complete upstream datasets or supplier recipe. Glazing Area
    requires measured delivered unit area and matching
    triple-argon/aluminium-spacer background. Complete supplied formulations
    retain supplier manufacture/formulation/preparation
    utilities/losses/packaging/delivery once; actual onsite additions/mixing
    remain separate. No pure-ingredient UUID or constituent-production subtotal
    stands for a whole supplier product.
  mapping_recommendation: "narrower scope only: manually operated single-sash spruce windows with purchased triple-argon IGU, delivered dried laminated wood and electric foreground route; excludes frame-only and French-window products. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  scientific_review: Not independently reviewed; no publication authorized.
  cpc3_audit_20261012_followup:
    scope: physical/product-formulation consistency repair; no
      lifecycle,mapping,scientific or translation promotion
    prior_metadata:
      - dataset_recipe_requirements: Supplier declarations must establish every
          adhesive, primer, preservative and finish constituent. Named chemical
          rows are conditional physical candidates, not evidence that a surveyed
          window uses that recipe. Add every unrepresented actual constituent as
          an atomic row before a dataset is declared composition-complete.
        dataset_background_requirements: Exact chemical/utility/elementary UUID identity
          does not prove complete upstream datasets or supplier recipe. Glazing
          Area requires measured delivered unit area and matching
          triple-argon/aluminium-spacer background.
