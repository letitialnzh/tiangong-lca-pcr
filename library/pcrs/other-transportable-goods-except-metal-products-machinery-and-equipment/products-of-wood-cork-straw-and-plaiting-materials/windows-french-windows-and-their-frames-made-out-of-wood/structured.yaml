allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "foreground_burden_allocation"
    rule: "First subdivide the cohort by separate stage measurements from other products. Attribute shared energy only with measured operating-time/load causal evidence; disclose coverage and unmeasured shares rather than transferring industry averages."
    source_ids:
      - bau-timber-window-2022
  - rule_id: allocation_physical_ledger
    applies_to: "foreground_burden_allocation"
    rule: "Keep process graph, mass/water/carbon balances and coproduct outputs at full unallocated physical quantities. Allocate only in a separate environmental burden ledger. Internal links match at both ends; transferred offcuts cannot also fuel foreground."
    source_ids:
      - bau-timber-window-2022
  - rule_id: allocation_coproduct_review
    applies_to: "foreground_burden_allocation"
    rule: "Trace sold offcut use, price and treatment gate. The original EPD’s negligible-share rationale is no automatic allocation exemption. If measured causal subdivision is unavailable, declare alternative method, shares, rationale and sensitivity for independent methodological review; do not hide default credits."
    source_ids:
      - bau-timber-window-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "window_manufacture"
      flow_role: "accepted finished product"
      record_type: "foreground and original records"
      raw_fields: "product/configuration; unit serial; net weighed mass; tare; rejected output; cohort; Q"
      collection_method: "Weigh every accepted complete same-configuration window using a calibrated scale, excluding rack, film and straps; sum measured net masses to Q. No generic per-window mass. Aggregate each atomic cohort exchange total divided by measured accepted net mass Q."
      unit: "kg"
      frequency: "each cohort and delivery"
      temporal_coverage: "same declared production period and acceptance cohort"
      site_scope: "same factory, configuration and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing and calibration records"
    - protocol_id: cp_stock
      process_id: "window_manufacture"
      flow_role: "wood input"
      record_type: "foreground and original records"
      raw_fields: "supplier/lot; species; lamination; drying state; gross incoming mass; opening/closing stock; returns; moisture sample wet/dry mass"
      collection_method: "Weigh incoming stock and retained inventories; measure representative moisture by oven-dry comparison or calibrated species-specific meter cross-check. Supplier background includes drying/lamination. Aggregate each atomic cohort exchange total divided by measured accepted net mass Q."
      unit: "kg; %"
      frequency: "each cohort and delivery"
      temporal_coverage: "same declared production period and acceptance cohort"
      site_scope: "same factory, configuration and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale, oven and supplier gate documentation"
    - protocol_id: cp_formula
      process_id: "window_manufacture"
      flow_role: "each bought formulation; composition/fate diagnostics; actual separate ingredient purchases"
      record_type: "foreground and original records"
      raw_fields: "procurement status; supplier/product/layer; whole supplied formulation mass/state; complete component fractions/CAS; actual separate purchase receipts; opening/closing stock; unused returns; onsite additions/preparation; supplier manufacture/preparation utilities/losses/packaging/delivery; retained film; air/waste fate"
      collection_method: "Obtain complete supplier composition and actual whole supplied usage per product/layer; weigh and stock/return-adjust each whole formulation. Preserve listed nine ingredient IDs as separate composition/fate diagnostics using documented fractions; presence in a bought formulation alone creates no external ingredient purchase. External ingredient cards use actual separately purchased compatible quantities for onsite preparation only. Retain complete supplier formulation/manufacture/preparation utilities/losses/packaging/delivery once and genuine onsite mixing/additions once; do not add diagnostic ingredient burdens to an already complete formulation background. Unknown identity, fractions or procurement/boundaries stay specific gaps. Normalize each actual external whole-product or separate-purchase raw total once by Q under complete_period_normalization; never normalize a previously divided amount again."
      unit: "kg"
      frequency: "each cohort and delivery"
      temporal_coverage: "same declared production period and acceptance cohort"
      site_scope: "same factory, configuration and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier formulation originals; batch/return and loss records"
    - protocol_id: cp_components
      process_id: "window_manufacture"
      flow_role: "each purchased glass assembly and each hardware/seal part"
      record_type: "foreground and original records"
      raw_fields: "part/lot; material; finish; incoming installed rejected masses; delivered IGU area; individual pane schedule; argon; spacer; desiccant; seals; net geometry; thermal declaration"
      collection_method: "Weigh each material-specific part; measure each delivered IGU area and mass; verify constituent/geometry/performance original declarations and supplier manufacturing boundary. Count each assembly separately. Aggregate each atomic cohort exchange total divided by measured accepted net mass Q."
      unit: "kg; m2"
      frequency: "each cohort and delivery"
      temporal_coverage: "same declared production period and acceptance cohort"
      site_scope: "same factory, configuration and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier bill of materials, drawings, performance originals and calibration"
    - protocol_id: cp_energy
      process_id: "window_manufacture"
      flow_role: "electricity"
      record_type: "foreground and original records"
      raw_fields: "meter start/end; voltage; region/year; stage; compressed-air/extraction loads; other products; attribution basis"
      collection_method: "Meter each stage and shared auxiliaries; subtract separately measured unrelated consumption. Use measured operating-time/load evidence only when direct subdivision is unavailable; disclose unmeasured shares. Aggregate each atomic cohort exchange total divided by measured accepted net mass Q."
      unit: "MJ"
      frequency: "each cohort and delivery"
      temporal_coverage: "same declared production period and acceptance cohort"
      site_scope: "same factory, configuration and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter records and attribution ledger"
    - protocol_id: cp_water
      process_id: "window_manufacture"
      flow_role: "cleaning water"
      record_type: "foreground and original records"
      raw_fields: "supply meter; water specification; reusable volume; density if converted; discharge meter; opening/closing tanks; evaporation"
      collection_method: "Measure supply, reuse and external discharge separately; conversion from volume to mass requires measured temperature/density and compatible supplier quantity. Aggregate each atomic cohort exchange total divided by measured accepted net mass Q."
      unit: "kg"
      frequency: "each cohort and delivery"
      temporal_coverage: "same declared production period and acceptance cohort"
      site_scope: "same factory, configuration and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter, density and tank-balance records"
    - protocol_id: cp_packaging
      process_id: "window_manufacture"
      flow_role: "each packaging item"
      record_type: "foreground and original records"
      raw_fields: "film grade; strap grade; rack species/net mass; shipped mass; scrap; return/reuse trips; opening/closing stock"
      collection_method: "Weigh film, rack and strap separately. Preserve full physical delivery quantities; retain an independent returnable-rack service ledger. Aggregate each atomic cohort exchange total divided by measured accepted net mass Q."
      unit: "kg"
      frequency: "each cohort and delivery"
      temporal_coverage: "same declared production period and acceptance cohort"
      site_scope: "same factory, configuration and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighing, dispatch and rack reuse records"
    - protocol_id: cp_residues
      process_id: "window_manufacture"
      flow_role: "each coproduct or waste"
      record_type: "foreground and original records"
      raw_fields: "stream; contamination; wet/dry mass; glass assembly composition; storage changes; recipient; treatment; sold quantity; price"
      collection_method: "Weigh each separated stream and verify treatment/recipient; retain physical wood, water, glass and coating balance before environmental allocation. Aggregate each atomic cohort exchange total divided by measured accepted net mass Q."
      unit: "kg"
      frequency: "each cohort and delivery"
      temporal_coverage: "same declared production period and acceptance cohort"
      site_scope: "same factory, configuration and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "transfer tickets, assays, invoices and balance ledger"
    - protocol_id: cp_emissions
      process_id: "window_manufacture"
      flow_role: "each outdoor species or disjoint particle interval"
      record_type: "foreground and original records"
      raw_fields: "species/CAS; air compartment; process; post-control concentration; exhaust volume; operating time; particle cutpoints; captured amount; detection limits"
      collection_method: "Use species-specific measured post-control releases for the cohort, including fugitive releases. Integrate calibrated concentration and compatible exhaust volume; unknown is not zero. Keep captured waste separate. Aggregate each atomic cohort exchange total divided by measured accepted net mass Q."
      unit: "kg"
      frequency: "each cohort and delivery"
      temporal_coverage: "same declared production period and acceptance cohort"
      site_scope: "same factory, configuration and route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling methods, assays and exhaust/control records"
  calculation_rules:
    - id: cohort_normalization
      applies_to: "all inventory rows"
      rule: "Normalized row amount = net physical atomic cohort exchange total / Q; Q = sum of individually measured accepted complete-window net masses in the same cohort, kg. Output remains 1 kg; glazing is m2/kg, electricity MJ/kg, other rows kg/kg."
      inputs:
        - "row protocol"
        - cp_mass
      output: "normalized atomic exchange"
      source_ids:
        - bau-timber-window-2022
    - id: formulation_constituents
      applies_to: "glue_pvac, glue_water, coat_acrylic, coat_pur, coat_alkyd, coat_butoxy, coat_water, coat_tio2, coat_pg"
      rule: "Diagnostic constituent mass = actual net whole supplied formulation usage × complete original supplier constituent mass fraction; calculate each product/layer separately, sum identical diagnostic constituent once and trace retained/air/waste/stock fate. These contained quantities are not external purchases or extra background exchanges. Whole bought formulations retain their own whole-product amount and matched complete supplier formulation/manufacture/preparation utilities/losses/packaging/delivery once; pure ingredient UUIDs cannot represent them. Only actual separately purchased compatible ingredients for onsite preparation use the corresponding external ingredient cards and measured stock/return-adjusted quantities, with onsite mixing/dilution/additions once. Do not add diagnostic constituent production burdens to a complete supplied-product background. Unknown complete-product identity, recipe or procurement remains pending."
      inputs:
        - cp_formula
      output: "diagnostic constituent/fate totals; actual whole-formulation and separate-purchase ledgers kept distinct"
      source_ids:
        - bau-timber-window-2022
    - id: physical_closure
      applies_to: "wood_blank, offcut, waste_wood, glazing_unit, finished_window"
      rule: "Cohort inputs + opening stock = retained window composition + physical outputs/waste + releases + closing stock. Close dry wood, water, glazing and chemicals separately; carbon uses supplier/measured fractions, with no universal wood carbon fraction."
      inputs:
        - cp_stock
        - cp_formula
        - cp_components
        - cp_mass
        - cp_residues
        - cp_emissions
      output: "unallocated mass/water/carbon balances"
      source_ids:
        - usda-wood-handbook-2021
        - bau-timber-window-2022
    - id: particles_disjoint
      applies_to: "pm25, pmcoarse, pmover10"
      rule: "If measurements are cumulative PM2.5, PM10 and total particulate, disjoint intervals are PM2.5, PM10-PM2.5 and total-PM10; require identical sampling, basis and control state, with nonnegative intervals. Incompatible measurements cannot be subtracted."
      inputs:
        - cp_emissions
      output: "three disjoint measured intervals"
      source_ids: []
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "all inventory rows"
      requirement: "Match configuration, species, moisture, glazing and delivery route; source averages serve only as boundary evidence."
      evidence: "supplier and acceptance originals"
    - id: dq_recipes
      applies_to: "cp_formula"
      requirement: "Resolve every actual adhesive, primer, preservative treatment and finish composition and fate under the listed ingredient IDs; unknown additives/fractions block composition completeness and cannot default to zero. Separately verify each actual whole supplied formulation or true separately purchased ingredient, its physical identity/reference basis and compatible supplier/onsite preparation boundary. Composition presence alone does not establish procurement."
      evidence: "complete recipes, procurement originals and whole-product/diagnostic/separate-purchase usage ledgers"
    - id: dq_coverage
      applies_to: "all inventory rows"
      requirement: "Retain metering period, calibration, stocks and detection limits; distinguish missing, below-detection and evidenced inapplicability."
      evidence: "raw records and coverage table"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Exactly one terminal complete-window output uses the 1 kg measured net complete-window basis. Do not substitute frame or glazing UUIDs, or hide known identity to evade multiple-output checks."
    source_ids: []
  - rule_id: validate_native_quantities
    applies_to: "foreground_dataset_conformance"
    rule: "Measured glazing assembly area matches upstream Area/m2; window/opening area and thermal performance come from measurement/originals and establish no fixed mass or lifetime."
    source_ids:
      - bau-timber-window-2022
  - rule_id: validate_atomic
    applies_to: "foreground_dataset_conformance"
    rule: "Each external row contains one actual supplied physical product or released species; each bought whole formulation remains one product, while ingredients contained in it remain composition/fate diagnostics and are not additional purchases. Ingredient external cards apply only to actual separate purchases for onsite preparation. Add each actual distinct formulation, separately purchased additive, glazing assembly and hardware item separately; verify whole supplied identity/reference basis, supplier manufacture/preparation/delivery and actual onsite additions once. Verify elementary species, medium/submedium, unit and fossil/biogenic origin where applicable; correction flows and broad substitutes are prohibited."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "foreground_dataset_conformance"
    rule: "Check unallocated physical mass/water/carbon balances separately from environmental allocation. Do not double-count particles or delete background/actual combustion biogenic CO2 from LCI because of a GHG impact convention. Foreground combustion requires a new boundary and is not covered by this route."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "foreground_dataset_conformance"
    rule: "Missing reference identity, complete recipe, upstream compatibility, actual measurement or unresolved relationships remain incomplete; tool failure and unsupported relationships cannot be reported as passing."
    source_ids: []
published_dataset_profile:
  dataset_role: "Factory-gate foreground manufacturing process linked to verified upstreams"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Manufacturing inventory for the declared single-sash spruce, triple-argon glazing, electric machining/assembly route"
  excluded_use: "Full CPC coverage; frame-only or French-window products; equivalent thermal-service comparison; fixed service life; building EPD certification"
  required_metadata: "Site/time, configuration, measured net mass, separate areas, performance originals, incoming states, component recipes, meter coverage and upstream gates"
  required_quality_disclosure: "Missing identities, recipes and background compatibility; sampling uncertainty; shared-load attribution; allocation method and sensitivity"
  update_trigger: "Changed configuration, species, glazing/recipe, gate, energy route, supplier background or methodological evidence"
