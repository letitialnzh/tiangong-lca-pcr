measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use cp_mass to weigh each accepted complete same-configuration window net mass and sum cohort Q. Exclude packaging; impose no universal per-window weight. Frame or glazing mass cannot replace complete-window mass."
  - id: glass_area
    applies_to: "glazing_unit"
    required_property_ref:
      name: "Area"
      uuid: "93a60a56-a3c8-19da-a746-0800200c9a66"
    required_unit: "m2"
    rule: "Use cp_components measured delivered-assembly area. Numerator is area while inventory denominator remains 1 kg window. Opening area or an unverified kg/m2 factor cannot replace the declared area."
  - id: energy_unit
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain meter kWh records; 1 kWh = 3.6 MJ. Verify <1 kV consumer supply and background region/year. This electricity unit rule establishes no net delivered steam heat."
  - id: wood_moisture
    applies_to: "wood_blank, offcut, waste_wood"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use dry-basis moisture u = (wet mass - oven-dry mass)/oven-dry mass; retain wet physical mass and dry wood separately. Wood mass excludes adhesive/coating. See usda-wood-handbook-2021 chapter 13."
