  scientific_review: "pending"
  semantic_boundary:
    decision: "Promote the matching unpublished retained scaffold in place. Directly supported route: untreated temperate non-coniferous wood, longitudinal sawing, green feedstock, aggregate indirect steam kiln drying/straight planing/packing with separately metered stages; final actual thickness >6 mm. One net-wet-mass kiln-dried planed reference only."
    rationale: "No overlapping material hardwood sawnwood identity was found. Distinct species/moisture/drying/allocation rules are needed; coniferous methodology and resin-VOC survey parameters do not establish hardwood evidence. Narrower than CPC 31102: excludes tropical species, green/air-dried final products, sliced/peeled forms, non-steam kilns and unplaned final products. Drying/planing/packing are aggregated with separate stage measurement; no separately exported rough-kiln exchange is omitted."
  evidence_limitations:
    - "CORRIM report dated 2020-04-27 uses 2017 data from six NE/NC US mills; its species mix, yields, moisture values, allocation shares and energy/emission quantities are not universal defaults. Table 8 uses secondary boiler data, not hardwood kiln VOC measurements."
    - "No tropical survey or green/air-dried terminal reference adaptation is established. These states and ecozones cannot reuse the kiln reference; future adaptation needs its own complete reference object, denominator, linked output and applicable primary evidence."
    - "Actual foreground records must establish quantities, kiln schedule, species, density, moisture, upstream forest/land-use origin and chemical/emission completeness. No actual mill dataset, numerical industry range or independent scientific review claimed."
  unresolved_flow_identities:
    - row_id: "sawlogs_in"
      flow: "Non-coniferous sawlogs with bark, delivered to mill"
      reason: "Search candidates include other non-coniferous roundwood explicitly excluding sawlogs, dry biomass/emergy, or veneer; none establishes delivered sawlog function."
    - row_id: "sawing_oil"
      flow: "Petroleum lubricating oil for sawmill machinery"
      reason: "No physically specific sawmill petroleum lubricant identity established; formulated oils cannot be inferred from unrelated materials."
    - row_id: "chips_coproduct"
      flow: "Untreated non-coniferous wood chips, mill coproduct"
      reason: "Wood Chip 3fa2a6a7 reference is Volume; direct record does not establish loose/bulk versus solid reference volume or species/state. Measurement protocol allows matched density conversions, but this particular volume definition cannot be verified. Wood chips e0ccd0e1 has leavening-agent route; not adopted."
    - row_id: "bark_coproduct"
      flow: "Non-coniferous bark, mill coproduct"
      reason: "Product Bark search does not establish separate untreated hardwood bark product; waste Bark cannot be used as Product flow."
    - row_id: "sawdust_coproduct"
      flow: "Untreated non-coniferous sawdust, mill coproduct"
      reason: "Non-agglomerated scrap and hog fuel are broad/mixed products; waste sawdust is not a market co-product identity."
    - row_id: "yard_runoff"
      flow: "Sawmill log-yard runoff sent to wastewater treatment"
      reason: "No exact log-yard runoff waste identity; individual BOD/substance elementary rows and generic municipal wastewater are different exchanges."
    - row_id: "strap_in"
      flow: "Polypropylene packaging strap"
      reason: "Exact polypropylene strap identity not established; films, textile or other resins are not this finished strap."
    - row_id: "shavings_coproduct"
      flow: "Untreated non-coniferous planer shavings, mill coproduct"
      reason: "No returned exact isolated untreated hardwood planer shavings product; generic hardwood boards are different physical product."
    - row_id: "heat_bark_fuel"
      flow: "Untreated non-coniferous bark fuel"
      reason: "Hog fuel is a material mixture and non-coniferous fuelwood is not separated bark."
    - row_id: "heat_sawdust_fuel"
      flow: "Untreated non-coniferous sawdust fuel"
      reason: "Hog fuel is mixed chips/bark/sawdust/shavings; cannot replace the separated sawdust fuel exchange."
    - row_id: "heat_chips_fuel"
      flow: "Untreated non-coniferous wood-chip fuel"
      reason: "Wood Chip volume convention lacks solid/bulk basis; the alternative leavening agent is wrong route. Hog fuel is a mixture of chips/sawdust/bark/shavings, not this atomic chip stream."
    - row_id: "heat_bottom_ash"
      flow: "Bottom ash from untreated wood combustion"
      reason: "Generic mixed/coal combustion ash is not isolated untreated-wood bottom ash."
    - row_id: "heat_fly_ash"
      flow: "Fly ash from untreated wood combustion"
      reason: "Coal fly ash is not untreated-wood fly ash."
    - row_id: "finishing_sawdust"
      flow: "Untreated non-coniferous sawdust, mill coproduct"
      reason: "Non-agglomerated scrap and hog fuel are broad/mixed products; waste sawdust is not a market co-product identity."
    - row_id: "yard_propane"
      flow: "Propane forklift fuel"
      reason: "Direct propane candidate carries suspect standard attribution and extraneous ether chemistry; no reliable supplier-grade forklift propane convention established. Liquefied petroleum gas is a mixture, not pure propane."
    - row_id: "heat_blowdown"
      flow: "Boiler blowdown sent to wastewater treatment"
      reason: "No exact boiler blowdown waste identity established; unspecified water and municipal wastewater are not this industrial waste stream."
    - row_id: "heat_shavings_fuel"
      flow: "Untreated non-coniferous planer shavings fuel"
      reason: "No exact isolated shavings fuel found; hog fuel blends several residues."
