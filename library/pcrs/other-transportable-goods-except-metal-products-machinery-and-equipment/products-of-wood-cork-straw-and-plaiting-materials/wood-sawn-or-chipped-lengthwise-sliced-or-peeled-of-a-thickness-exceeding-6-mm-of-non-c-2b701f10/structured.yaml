      rule: "Include receiving, debarking, sawing, internal transfers, kiln fans/controls/steam, drying rejects, planing/grading, packing, wastewater and actual emissions. On-site boiler is conditional; purchased heat has upstream coverage and no duplicated on-site emissions. No use/end-of-life or employee commute; disclose capital scope. No automatic small-mass cut-off for hazardous flows."
