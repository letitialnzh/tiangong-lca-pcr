allocation_rules:
  - rule_id: allocation_separate
    applies_to: "physical graph and burden account"
    rule: "Keep the unallocated physical process graph, dry-matter/water/carbon balances, equal internal links and complete co-product masses separate from the environmental burden ledger. Never multiply physical co-product outputs or internal handoffs by an allocation share. Allocate original shared energy/upstream/emission burdens only after reconciling measured physical totals; do not break the terminal 1 kg object."
    source_ids:
      - corrim-hardwood-2020
      - usda-wood-handbook-2021
  - rule_id: allocation_steps
    applies_to: "joint wood-producing steps"
    rule: "First subdivide metered steps and assign exclusive operations directly. For inseparable same-material wood co-products use measured oven-dry mass shares a_i=m_od_i/sum(m_od_j) for products leaving that joint step; this is a PCR methodological choice informed by the report’s mass-allocation case, not reported site shares. Include internally used fuel residues in the joint-step product denominator and carry their production burden to heat. Green bark/chips leaving before drying receive no subsequent kiln/planing burden. Drying burdens attach to the lumber actually dried; planing shares apply only at planing."
    source_ids:
      - corrim-hardwood-2020
      - usda-wood-handbook-2021
  - rule_id: allocation_destination
    applies_to: "residue and waste destinations"
    rule: "Separate each residue’s sold, internally burned and discarded portions using transfers and sales/treatment evidence. Waste without product function gets treatment burden, not a manufactured negative credit. Internal fuel cannot be simultaneously exported or assigned zero inherited burden. No automatic avoided fossil-fuel/disposal credit. Keep economic allocation or substitution as separately justified sensitivity cases with prices/time/boundary and results, not mixed with the baseline."
    source_ids:
      - corrim-hardwood-2020
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "processing"
      flow_role: "reference net mass and state"
      record_type: "Acceptance/dispatch records"
      raw_fields: "lot; species; provenance/ecozone; grade; finished dimensions; net wet kg; rejects; moisture; packaging tare reporting-period pool; wholly failed batches; rework origin and final acceptance IDs"
      collection_method: "Calibrated net weighing excluding packaging; reconcile acceptance and dispatch; match sampled moisture and actual geometry Reconcile the complete pool including failed and rework records; only finally accepted net output enters the denominator once, and a zero-output pool remains unnormalized."
      unit: "kg"
      frequency: "Each lot/batch and meter/monitoring interval"
      temporal_coverage: "Complete declared production period, with seasonal drying coverage"
      site_scope: "Declared mill and matched suppliers only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, lot/stock reconciliation, sampling and source applicability; unknown records excluded from averages with coverage disclosed"
    - protocol_id: cp_material
      process_id: "sawing"
      flow_role: "wood and co-products"
      record_type: "Lot and transfer ledger"
      raw_fields: "species; actual solid dimensions/volume; net wet mass; dry/wet basis; oven-dry sample; bark; destination; internal handoff pair; stock changes; actual owner sawing; raw_record_id; shared_meter_id; boundary/internal status; matched transfer id"
      collection_method: "Weigh lots and residues; stratify species/thickness/heartwood/sapwood; promptly seal/weigh representative samples, oven dry to stable mass following USDA Ch.13, assess extractive bias; paired volume and mass at same moisture. Meters need species/temperature calibration and oven-dry checks. Collect only actual sawing stage records; retain the original fields and QA only where physically applicable to that stage. A shared master meter or source record is a reconciliation witness, not an extra exchange: retain each attributable external raw record once across companion protocols using measured stage/service attribution, with fractions reconciled to the master total. Keep internal sending/receiving records separately with equal state, period and quantity; do not add either endpoint as another external purchase or emission. All companions use the same complete accepted-output reporting pool, retaining failed/rework activity and raw native units."
      unit: "kg; m3; moisture fraction"
      frequency: "Each lot/batch and meter/monitoring interval"
      temporal_coverage: "Complete declared production period, with seasonal drying coverage"
      site_scope: "Declared mill and matched suppliers only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, lot/stock reconciliation, sampling and source applicability; unknown records excluded from averages with coverage disclosed"
    - protocol_id: cp_material_processing
      process_id: "processing"
      flow_role: "wood and co-products"
      record_type: "Lot and transfer ledger"
      raw_fields: "species; actual solid dimensions/volume; net wet mass; dry/wet basis; oven-dry sample; bark; destination; internal handoff pair; stock changes; actual owner processing; raw_record_id; shared_meter_id; boundary/internal status; matched transfer id"
      collection_method: "Weigh lots and residues; stratify species/thickness/heartwood/sapwood; promptly seal/weigh representative samples, oven dry to stable mass following USDA Ch.13, assess extractive bias; paired volume and mass at same moisture. Meters need species/temperature calibration and oven-dry checks. Collect only actual processing stage records; retain the original fields and QA only where physically applicable to that stage. A shared master meter or source record is a reconciliation witness, not an extra exchange: retain each attributable external raw record once across companion protocols using measured stage/service attribution, with fractions reconciled to the master total. Keep internal sending/receiving records separately with equal state, period and quantity; do not add either endpoint as another external purchase or emission. All companions use the same complete accepted-output reporting pool, retaining failed/rework activity and raw native units."
      unit: "kg; m3; moisture fraction"
      frequency: "Each lot/batch and meter/monitoring interval"
      temporal_coverage: "Complete declared production period, with seasonal drying coverage"
      site_scope: "Declared mill and matched suppliers only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, lot/stock reconciliation, sampling and source applicability; unknown records excluded from averages with coverage disclosed"
    - protocol_id: cp_lubricant
      process_id: "sawing"
      flow_role: "Actual separately supplied lubricant"
      record_type: "Lubricant receipt, issue and stock ledger"
      raw_fields: "grade/SDS and composition; supplier; raw kg; opening/closing stock; issues/returns; equipment; spent-oil destination; reporting pool and failed-batch IDs"
      collection_method: "Weigh actual issues, returns and stock; reconcile additions, actual consumption, retained oil and separate spent-oil handoff. Preserve absolute kg before normalization; no timber species or oven-dry sampling applies to lubricant."
      unit: "kg"
      frequency: "Each lot/batch and meter/monitoring interval"
      temporal_coverage: "Complete declared production period, with seasonal drying coverage"
      site_scope: "Declared mill and matched suppliers only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, lot/stock reconciliation, sampling and source applicability; unknown records excluded from averages with coverage disclosed"
    - protocol_id: cp_energy
      process_id: "sawing"
      flow_role: "electricity and useful heat"
      record_type: "Meter and kiln records"
      raw_fields: "kWh; steam heat MJ and its accounting boundary; supplier/background heat-definition evidence; piping/meter location; steam/condensate masses, absolute pressure, temperature, steam quality, enthalpies and common reference datum; condensate return fraction/destination; vent/leak/line losses; meter definition/calibration; kiln batch/species/thickness; time/temperature/humidity; boiler/control; shared-meter split; actual owner sawing; raw_record_id; shared_meter_id; boundary/internal status; matched transfer id"
      collection_method: "Read calibrated stage meters and inspect the steam/return piping diagram. Obtain the supplier statement or matched-background quantitative-reference definition and compare boundary, loss inclusion and condensate/enthalpy convention against the meter quantity. If enthalpy differences are calculated, use measured fluid states and a documented property method with consistent datum and all relevant return/discharge streams; never assume all steam returns or use boiler feedwater as receiver condensate without evidence. Record a source-specific measured reconciliation for any different boundary before binding heat to a UUID/background. Unknown definitions are retained as pending compatibility gaps, not verified conversions. Record batch schedules, seasons and rejects separately. Collect only actual sawing stage records; retain the original fields and QA only where physically applicable to that stage. A shared master meter or source record is a reconciliation witness, not an extra exchange: retain each attributable external raw record once across companion protocols using measured stage/service attribution, with fractions reconciled to the master total. Keep internal sending/receiving records separately with equal state, period and quantity; do not add either endpoint as another external purchase or emission. All companions use the same complete accepted-output reporting pool, retaining failed/rework activity and raw native units."
