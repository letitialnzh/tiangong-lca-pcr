      rule: "Screen actual process diagram, supplier SDS, permit/stack speciation and wastewater destinations. Add each actual missing chemical, waste or elementary species as one atomic exchange before a complete site dataset claim. Do not force all conditional example pollutants to occur or treat missing data as zero."
