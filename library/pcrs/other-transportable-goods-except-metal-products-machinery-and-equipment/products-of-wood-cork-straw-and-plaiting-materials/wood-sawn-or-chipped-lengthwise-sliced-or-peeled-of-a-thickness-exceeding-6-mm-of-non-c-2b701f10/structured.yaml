measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated accepted net dispatch wet mass from cp_reference, excluding packaging. Each dataset fixes one species/grade/moisture/geometry scope."
  - id: moisture_basis
    applies_to: "wood and wood residues"
    required_property_ref:
      name: "Explicit dry or wet water fraction"
      uuid: ""
    required_unit: "dimensionless fractions"
    rule: "u=(m_wet-m_od)/m_od; w=(m_wet-m_od)/m_wet; w=u/(1+u); u=w/(1-w); m_od=m_wet/(1+u)=m_wet×(1-w). Convert percentages by /100; m_od>0, u≥0, 0≤w<1. Measure each species/state separately, including bark and fuels. [usda-wood-handbook-2021 Ch.4 eqs.4-1/4-2; corrim-hardwood-2020 §3.3; algebraic conversion.]"
  - id: solid_volume
    applies_to: "wood reported in volume"
    required_property_ref:
      name: "Matched mass and solid volume"
      uuid: ""
    required_unit: "kg; m3"
    rule: "m_wet=rho_u×V_u, with species, moisture and geometry matched. Basic density is oven-dry mass/green solid volume, unlike oven-dry density or dispatch wet density. Measure dimensions and density; keep drying shrinkage and planing loss separate. Nominal board-foot/log scales and stacked/loose volume cannot substitute for solid volume without a measured conversion. No universal hardwood density. [usda-wood-handbook-2021 Ch.4 Table4-5; corrim-hardwood-2020 Tables2–4.]"
  - id: carrier_units
    applies_to: "electricity, steam heat and fuels"
    required_property_ref:
      name: "Verified reference property"
      uuid: ""
    required_unit: "MJ; kg; m3"
    rule: "Retain each verified reference property/unit. Electricity kWh×3.6 gives MJ. Steam heat requires the separately documented heat boundary and condensate convention below: equal MJ units or a database Gross calorific value label do not equate fuel HHV, total boiler production and receiver net useful heat. Fuel mass/volume/heat conversions require actual composition, density, moisture and a stated measured LHV/HHV basis. Do not assume biomass heating value, gas reference conditions or boiler efficiency."
  - id: steam_heat_basis
    applies_to: "drying_heat; heat_out"
    required_property_ref:
      name: "Documented transferred heat boundary"
      uuid: ""
    required_unit: "MJ"
    rule: "The chosen steam flow confirms an industrial-steam identity and Gross calorific value/MJ reference only; its original does not define receiver net useful heat or condensate reference enthalpy. Before using its UUID with an amount/background dataset, obtain supplier or matched-background documentation defining the same delivery point, included losses, steam/condensate streams and enthalpy reference as this row. Confirm on site using the piping/meter diagram, calibrated heat-meter definition or measured mass/pressure/temperature/steam quality and traceable steam-property calculation; record return fraction, condensate temperature/pressure, enthalpy datum and discharged/leaking streams. Retain the boundary comparison and any measured conversion/loss reconciliation. A label or common MJ unit is not conversion evidence. Unknown compatibility remains pending review: retain the site record, but do not treat the UUID–quantity/background binding as established or the dataset as complete."
  - id: gas_volume_basis
    applies_to: "heat_gas"
    required_property_ref:
      name: "Volume at documented gas conditions"
      uuid: ""
    required_unit: "m3"
    rule: "Use gaseous pipeline natural gas on its verified Volume/m3 reference; record m3 per 1 kg terminal reference without forcing kg. Match supplier/meter and background reference temperature, absolute pressure, dry/wet basis and composition. If conversion is needed, use a documented meter/supplier correction with actual compressibility/composition and conditions; disclose its inputs and uncertainty. A normal/standard m3 state, pure methane composition, generic density/heating value or a Mass meanValue of 1.0 is not established by the original. Unknown volume/background compatibility remains unresolved for the concrete dataset."
  - id: nox_quantity_basis
    applies_to: "yard_nox; heat_nox"
    required_property_ref:
      name: "Mass; verified quantity convention"
      uuid: ""
    required_unit: "kg"
    rule: "Before calculation, document the actual measured or factor-derived NOx quantity convention, chemical/species scope, concentration and gas-state basis and its independently verified relation to the selected LCI flow and assessment method. Native Mass/kg does not establish an NO2-equivalent convention. Keep actual NO/NO2 species quantities and documented conversion/speciation evidence when an equivalent basis is used; no universal conversion or assumed split. Reconcile any aggregate with separately modelled NO/NO2 and keep N2O separately, without counting the same release twice. Missing convention/speciation or LCI/assessment compatibility leaves the raw result and its normalized exchange pending review; never silently label a mass as NO2-equivalent or invent zero."
