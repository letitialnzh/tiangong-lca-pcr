  calculation_rules:
    - id: normalize_records
      applies_to: "all inventory rows"
      rule: "Sum each attributable physical exchange over the same declared period and divide by accepted terminal net wet kg; preserve its numerator unit. Terminal product equals 1 kg; no denominator change to dry kg, m3, kiln batch or green output. Aggregate sites only within one qualified state/species/route using sum exchange / sum matched output; unknown is not zero. Use one documented same-product, grade, route, configuration and site reporting-period pool across every card and linked protocol; include all attributable startup, shutdown, wholly failed batches, rejects and rework in the raw numerator totals. Count reworked product once only when finally accepted. Divide each summed native-unit exchange once by the same strictly positive pooled accepted net kg; do not average batch ratios or discard a zero-output batch. If the complete matched pool has zero accepted output, retain the absolute inventory and require review without a per-kg result; do not invent output or transfer burdens to an unrelated product/period. Preserve physical handoffs and stock balances independently of burden allocation."
      inputs:
        - "Each row protocol"
        - cp_reference
        - "attributable exchange totals"
        - "accepted net kg"
      output: "physical exchange per 1 kg reference flow"
      source_ids:
        - corrim-hardwood-2020
    - id: convert_moisture_volume
      applies_to: "wood mass and volume"
      rule: "Apply moisture_basis and solid_volume to paired measured states; dry wood, contained water, solid volume shrinkage and machining loss are separate. Use same-state measured density for a volume-reference database row rather than rejecting it solely for its unit."
      inputs:
        - cp_material
        - cp_material_processing
        - cp_reference
      output: "traceable mass/volume/moisture conversion"
      source_ids:
        - usda-wood-handbook-2021
        - corrim-hardwood-2020
    - id: steam_heat_reconciliation
      applies_to: "drying_heat; heat_out"
      rule: "First compare the site heat-meter boundary/definition with supplier or matched-background heat reference, including condensate enthalpy datum, return fraction, discharge and line-loss treatment. Use the documented meter quantity, or a recorded fluid energy balance from measured mass/state/enthalpy on a consistent datum, only after establishing equivalence or an evidenced conversion. Keep fuel-HHV input, total boiler heat and receiver useful transfer as separate quantities; no coefficient is inferred from equal MJ or the Gross calorific value label. Apply the same verified delivery quantity at both internal ends, then divide by the same accepted net terminal kg. If evidence is absent, retain raw totals and mark compatibility pending; do not invent a delivered-MJ conversion."
      inputs:
        - cp_energy
        - cp_energy_processing
        - cp_energy_heat
        - cp_water
        - cp_water_heat
        - cp_reference
      output: "conditionally verified delivery MJ per 1 kg reference flow, or pending compatibility"
      source_ids:
        - corrim-hardwood-2020
    - id: gas_volume_reconciliation
      applies_to: "heat_gas"
      rule: "Keep the supplier/meter volume at explicitly documented temperature, absolute pressure and dry/wet/composition basis, matched to background gas reference volume. Normalize the verified m3 total by accepted terminal net kg; no gas-to-kg conversion is required. Any correction between states uses the actual documented meter/supplier procedure and inputs, not an assumed normal state, density or property meanValue. Missing background/reference conditions are pending compatibility."
      inputs:
        - cp_fuel
        - cp_fuel_heat
        - cp_reference
      output: "m3 per 1 kg reference flow, or pending compatibility"
      source_ids:
        - epa-wood-boiler-2022
    - id: drying_water
      applies_to: "kiln water balance"
      rule: "For each matched charge reconcile wood water in minus wood water out plus spray/steam additions, less condensate/liquid discharge and stock change, to vented water. Do not count contained input water again as a separate purchased flow, and do not attribute boiler combustion water to kiln wood moisture loss."
      inputs:
        - cp_material
        - cp_material_processing
        - cp_energy
        - cp_energy_processing
        - cp_energy_heat
        - cp_water
        - cp_water_heat
      output: "water ledger and vapour amount"
      source_ids:
        - usda-wood-handbook-2021
        - corrim-hardwood-2020
    - id: particle_fractions
      applies_to: "PM air rows"
      rule: "Only with matched method/source/control/time and compatible particle definition: PM2.5–10=PM10-PM2.5; PM>10=total compatible PM-PM10. Require nonnegative differences. Do not add total PM, PM10 and PM2.5; condensable PM requires a separately supported definition and must not be subtracted across incompatible tests."
      inputs:
        - cp_air
        - cp_air_sawing
        - cp_air_processing
        - cp_emission
        - cp_emission_processing
        - cp_emission_heat
      output: "nonoverlapping PM fractions"
      source_ids:
        - epa-wood-boiler-2022
        - epa-sawmill-pte-2014
    - id: allocated_burdens
      applies_to: "environmental burden ledger"
      rule: "At each joint step assign shared burden a_i×original shared burden; sum shares to one and trace carry-over to later processing/heat. Keep unallocated physical rows and equal handoffs intact. Directly assign exclusive burdens; retain economic sensitivity separately."
      inputs:
        - cp_material
        - cp_material_processing
        - cp_energy
        - cp_energy_processing
        - cp_energy_heat
        - cp_air
        - cp_air_sawing
        - cp_air_processing
        - cp_emission
        - cp_emission_processing
        - cp_emission_heat
        - allocation_steps
      output: "separate assigned product LCI"
      source_ids:
        - corrim-hardwood-2020
    - id: carbon_balance
      applies_to: "wood and combustion carbon"
      rule: "Use sampled dry fuel/wood carbon and documented fossil fractions to reconcile carbon in wood products/residues, CO2, CO, CH4, other carbon-containing species, ash and stocks; CO2 carbon mass=CO2 mass×12/44. Report biogenic CO2 in LCI irrespective of GHG statistical conventions; uptake/storage/end-of-life are disclosed separately without automatic neutrality."
      inputs:
        - cp_fuel
        - cp_fuel_heat
        - cp_material
        - cp_material_processing
        - cp_air
        - cp_air_sawing
        - cp_air_processing
        - cp_emission
        - cp_emission_processing
        - cp_emission_heat
      output: "separate biogenic/fossil carbon ledger"
      source_ids:
        - epa-wood-boiler-2022
        - corrim-hardwood-2020
  data_quality_requirements:
    - id: quality_species
      applies_to: "product and timber inputs"
      requirement: "Botanical identity, temperate source ecozone and mix fractions; measure state-specific moisture/density/yield. No tropical extrapolation, universal hardwood density or resin-based VOC default. Table4 of CORRIM is a regional mix and is not a species-identification authority."
      evidence: "Supplier/provenance documentation and lot sampling"
    - id: quality_missing
      applies_to: "all rows"
      requirement: "Distinguish measured, calculated, modelled, nondetect and missing amounts; conditional absence needs documented physical absence. Publish coverage and uncertainty; no universal numeric range or fabricated mill data."
      evidence: "Raw records, monitoring basis and detection limits"
    - id: quality_identity
      applies_to: "all applicable exchanges"
      requirement: "Confirm exact flow type, reference property/unit, state and compartment. Identity verification alone does not confirm quantity/background compatibility: require explicit supplier/background heat and condensate definitions for steam and matching gas reference-volume conditions. Unknown identities or physical conventions remain disclosed review gaps and prevent a complete dataset claim. Elementary total-metal identities require measured total metal, not arbitrary compounds."
      evidence: "Producer identity and compartment reconciliation"
validation_rules:
  - rule_id: validate_reference
    applies_to: "one dataset reference"
    rule: "Require 1 kg net kiln-dried planed temperate non-coniferous >6-mm sawnwood and exactly one linked finished_kiln_product. Reject tropical, green/air-dried, rough, sliced/peeled, treated or alternate-kiln use of this reference. Check all qualifiers and identical EN/ZH denominators, formulas, row and source counts."
    source_ids:
      - corrim-hardwood-2020
      - usda-wood-handbook-2021
  - rule_id: validate_balances
    applies_to: "all stages"
    rule: "Check dry wood, water, energy and carbon physical balances, stock movements, source-specific losses and equal internal links. Check burden shares separately and trace to original totals; do not scale co-product physical outputs. Explain residuals with measured uncertainty, not an invented tolerance."
    source_ids:
      - corrim-hardwood-2020
      - usda-wood-handbook-2021
  - rule_id: validate_emissions
    applies_to: "air and other releases"
    rule: "No coniferous resin factors as hardwood measurements, no CORRIM secondary boiler LCI as kiln-specific monitoring, no PTE capacity factors as actual emissions and no sawmill dust memo for boilers. Require matched chemical/source/fossil-biogenic/medium and measured controls, disjoint PM; retain biogenic CO2. Report NOx as NO2-equivalent mass only when measurement basis supports it."
    source_ids:
      - corrim-hardwood-2020
      - epa-wood-boiler-2022
      - epa-sawmill-pte-2014
  - rule_id: validate_energy_compatibility
    applies_to: "drying_heat; heat_out; heat_gas"
    rule: "Require site meter/supplier evidence and matching background quantitative-reference definitions. For steam check common delivery/loss boundary, condensate return and enthalpy datum; require evidence for any conversion and equal internal handoffs. A Gross calorific value label or common MJ units cannot prove equality of fuel HHV, total boiler heat and receiver net useful heat. For gas require pipeline-gaseous state, actual composition and matching temperature/absolute-pressure/dryness volume convention. Unsupported or missing compatibility is pending review/incomplete applicability, never a validated binding merely because the flow UUID is known. Builder reference-basis checks do not verify these site conditions."
    source_ids:
      - corrim-hardwood-2020
      - epa-wood-boiler-2022
  - rule_id: validate_completeness
    applies_to: "site dataset readiness"
    rule: "Confirm every applicable identity, site-screened missing exchange and upstream boundary before claiming a complete resolved dataset. Blank identities are review gaps, not a pass; no scientific approval follows from builder checks."
    source_ids:
      - corrim-hardwood-2020
published_dataset_profile:
  dataset_role: "Site-specific manufacturing method with separate unallocated physical graph and allocated kiln-product LCI"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Species/origin, kiln, planing, dimensions, moisture and boundary-matched manufacturing after identity/completeness review"
  excluded_use: "EPD certification; structural equivalence; tropical/green/air-dried/rough or other kiln substitution; carbon-neutrality or complete resolved inventory claims while applicable identities remain unresolved"
  required_metadata: "Required reference qualifiers; process/physical diagram; period/site; supplier coverage; measured conversion; equal handoffs; co-product destinations; burden shares; biogenic/fossil carbon convention"
  required_quality_disclosure: "Measured versus estimated records, uncertainty, losses, exclusions, missing identities and unreviewed applicability"
  update_trigger: "Species/origin/state, product geometry/grade, kiln/heat/control route, allocation, boundary or evidence change"
data_sources:
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA FPL (2021), Wood handbook—wood as an engineering material, FPL-GTR-282. Ch.4 pp.4-1,4-11 and Table4-5; Ch.13 pp.13-1–13-7. [Official original](https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf)."
    used_for: "Moisture/density-state definitions, sampling and air/kiln distinction; no numerical density default"
  - id: "corrim-hardwood-2020"
    type: "literature"
    reference: "Hubbard, Bergman, Sahoo and Bowe (2020-04-27), A Life Cycle Assessment of Hardwood Lumber Production in the Northeast and North Central United States, CORRIM, 45 pp. §§1.2.3–1.2.6,3.2–3.3,4.4,6.4; Tables2–10. [USDA original](https://research.fs.usda.gov/download/treesearch/60571.pdf); [CORRIM original](https://corrim.org/wp-content/uploads/2020/06/FINAL-Northeast-and-Northcentral-Hardwood-Lumber-Production-LCA-CORRIM-Report.pdf)."
    used_for: "2017 six-mill NE/NC case: physical stages, indirect steam kiln, planing/packaging, mass-allocation precedent and limits. No survey quantity or tropical default adopted"
  - id: "epa-wood-boiler-2022"
    type: "official_guidance"
    reference: "EPA (March 2022), AP-42 §1.6 Wood Residue Combustion in Boilers; §§1.6.1–1.6.4 and Table1.6-1 footnotes. [Original](https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf)."
    used_for: "Boiler source/fuel/moisture/control dependence, emissions screening and nested PM caution; no generic emission factor adopted, biogenic CO2 retained"
  - id: "epa-sawmill-pte-2014"
    type: "official_guidance"
    reference: "EPA Region10 (2014-05-08), Particulate Matter Potential to Emit Emission Factors for Activities at Sawmills, Excluding Boilers, Located in Pacific Northwest Indian Country; memorandum p.1 and table p.2. [Original](https://www.epa.gov/sites/default/files/2016-09/documents/spmpteef_memo.pdf)."
    used_for: "Scope exclusion and cumulative PM method warning only; PTE is capacity, not actual mill emission; no numerical factors adopted"
