measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Weigh accepted dry-to-specification finished ornaments on a calibrated scale, excluding packaging. Retained shellac, moisture and residual solvent are included in net output; keep component amounts separately. Aggregate by homogeneous species/design/finish batch."
  - id: moisture_basis
    applies_to: "dry_wood; finished_ornament; offcut_sale; offcut_waste; dust_waste; reject_waste"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record dry-basis moisture u = water mass / oven-dry wood mass. For uncoated wood, dry wood mass = wet wood mass / (1 + u); use measured species/batch moisture. For coated output/rejects, subtract measured coating and solvent masses before applying the wood-moisture conversion. Volatile extractives can bias oven-dry moisture measurements; assess the actual species and uncertainty rather than drying a coated object as a wood sample. [usda-wood-handbook-2021]"
  - id: solvent_basis
    applies_to: "ethanol; ethanol_air; shellac_waste; solvent_waste"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep delivered liquid mass, ethanol species mass, shellac dry solids and water distinct. Confirm supplier reference basis before linking; no generic alcohol, denaturant or wet/dry substitution. Volume-to-mass requires actual temperature and measured or supplier-verified solution density, not a database secondary coefficient."
  - id: electrical_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "The electricity record uses the energy property with MJ reference, not fuel combustion heat. Convert metered kWh to MJ using 1 kWh = 3.6 MJ; match <1 kV consumer delivery and avoid double-counting transformer losses."
  - id: particle_basis
    applies_to: "pm25; pmcoarse; pmover10"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Report disjoint size bins from the same source/time/method and actual release boundary. Reject negative difference or incompatible totals; retain unknown size distribution as pending rather than treating missing fractions as zero."
