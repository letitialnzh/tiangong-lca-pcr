system_boundary:
  rules:
    - rule_id: boundary_upstream
      applies_to: "all inventory rows"
      rule: "Include upstream production and actual delivered transport once; retain upstream biogenic and fossil carbon emissions as distinct LCI exchanges. No GHG reporting convention permits deletion of biogenic CO2. Missing delivered background or waste receiver linkage is incomplete data."
      source_ids:
        - corrim-northern-lumber-2025
    - rule_id: boundary_stages
      applies_to: "ornament_manufacture"
      rule: "Aggregate carving, sanding, mixing, brush coating, ambient drying, inspection and packing as one foreground unit, while preserving independent stage measurements. No duplicated intermediate finished-product exchange; process links, if later decomposed, carry equal physical quantities at both ends."
      source_ids:
        - usda-wood-handbook-2021
        - epa-coating-eiip-2001
    - rule_id: boundary_losses
      applies_to: "ornament_manufacture"
      rule: "Account for reject/rework, collection equipment, escaped dust and solvent/water releases. Plant lighting/ventilation electricity is measured and attributed; reusable capital equipment/brush manufacture is outside the declared foreground, with exclusions and significance reviewed. No threshold is assumed to justify omission of a detected chemical or important waste."
      source_ids:
        - epa-coating-eiip-2001
    - rule_id: boundary_route
      applies_to: "ornament_manufacture"
      rule: "Verify brush application and ambient drying, with no combustion, drying kiln, thermal abatement or solvent recovery. Introducing these operations, denaturants, post-coating sanding or another finish requires additional atomic inventories and method review; do not silently apply this route."
      source_ids:
        - gsa-shellac-2017
        - usda-finishing-1999
boundary_abstraction:
  declared_starting_condition: "Untreated kiln-dried non-coniferous sawn blank and separately purchased dry shellac, ethanol and consumables delivered to the factory"
  starting_condition_role: "foreground_entry"
  product_classification_scope: "Carved decorative subset of CPC3.0 31913; no classification-wide method"
  recursive_input_rule: "Purchased finished ornaments or previously coated blanks are outside this manufacturing route; do not relabel them as virgin dry sawn blanks. Internal rework of the same batch remains in the single unit without a new reference output."
  upstream_dataset_requirement: "Trace wood forestry/sawmill/drying, resin refining, ethanol manufacture, electricity and each consumable to compatible supplier/background datasets, including inbound freight and waste treatment. An entry boundary is not a burden cut-off."
  disclosure: "Declare site/time, species/supply treatment, meters, coating formulation, packaging, release subcompartments, stock changes, residue destinations, allocation and unresolved supplier quantity compatibility."
