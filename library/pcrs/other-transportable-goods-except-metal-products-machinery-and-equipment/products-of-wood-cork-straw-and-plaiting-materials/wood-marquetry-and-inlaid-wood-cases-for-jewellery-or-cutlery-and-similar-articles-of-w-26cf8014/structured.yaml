allocation_rules:
  - rule_id: allocation_physical
    applies_to: "ornament_manufacture"
    rule: "Maintain an unallocated physical wood/water/coating/carbon ledger and a separate environmental-burden ledger. Never multiply measured product/co-product output masses by allocation fractions. Internal transfers and stock are physical quantities; reconciled yields precede allocation."
    source_ids:
      - corrim-northern-lumber-2025
      - usda-wood-handbook-2021
  - rule_id: allocation_status
    applies_to: "offcut_sale; offcut_waste; dust_waste; reject_waste"
    rule: "Assign residue status by actual function, market specification, clean/contaminated condition and receiver. Do not classify every wood loss as burden-free waste. Sale alone does not establish an avoided-product credit. Waste transport/treatment remains assigned to production; contaminants determine receiver suitability."
    source_ids:
      - corrim-northern-lumber-2025
  - rule_id: allocation_burdens
    applies_to: "ornament_manufacture"
    rule: "First subdivide attributable stage burdens using records; final finishing and packaging belong to the ornament. For remaining genuinely shared burdens, justify a physical relationship and its measured basis. If no defensible physical relationship exists, disclose economic allocation using consistent quantities/prices and sensitivity analysis. Do not import CORRIM lumber mass shares or apply automatic zero burdens."
    source_ids:
      - corrim-northern-lumber-2025
  - rule_id: allocation_no_credit
    applies_to: "ornament_manufacture"
    rule: "No automatic substitution or energy credit for exported offcuts/dust and no onsite biomass use in this route. Any expanded system must separately identify actual displaced function, receiver process, quality and mutually exclusive attribution; retain all real carbon releases."
    source_ids:
      - corrim-northern-lumber-2025
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "ornament_manufacture"
      flow_role: "accepted output"
      record_type: "measured_record"
      raw_fields: "Batch id; species; design; accepted net product kg; rejected count/mass; finish/wax; dry film; moisture; retained solvent; packaging tare; final stock"
      collection_method: "Calibrated batch weighing after finish acceptance, with documented moisture and retained-coating/solvent tests; retain drawings, single-piece proof and signed acceptance."
      unit: "kg"
      frequency: "Each accepted batch"
      temporal_coverage: "Complete selected production period, seasonal/shift coverage disclosed"
      site_scope: "One declared site and homogeneous species/design/finish route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw tickets; calibration; uncertainty; supplier certificates; stock and stage reconciliation"
    - protocol_id: cp_materials
      process_id: "ornament_manufacture"
      flow_role: "dry wood and abrasive"
      record_type: "measured_record"
      raw_fields: "Supplier/batch; botanical species; origin; kiln treatment; net wood kg; moisture sample wet/dry masses; abrasive mass/mineral/backing/binder; receipts; opening/closing stock; returns; density/volume basis when used"
      collection_method: "Calibrated scales and representative untreated wood oven-dry moisture samples; separate coating solids from wood. Reconcile invoice/stock and supplier delivered background."
      unit: "kg"
      frequency: "Each receipt and production batch"
      temporal_coverage: "Complete selected production period, seasonal/shift coverage disclosed"
      site_scope: "One declared site and homogeneous species/design/finish route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw tickets; calibration; uncertainty; supplier certificates; stock and stage reconciliation"
    - protocol_id: cp_energy
      process_id: "ornament_manufacture"
      flow_role: "electricity"
      record_type: "measured_record"
      raw_fields: "Meter ids; voltage; kWh readings; stage equipment runtimes; fan/ventilation/lighting loads; production batch/idle status; attribution evidence"
      collection_method: "Read calibrated <1 kV consumer meter and submeters; reconcile whole-period electricity including downtime and collection fans; attribute using measured stage use."
      unit: "MJ"
      frequency: "Each shift plus batch reconciliation"
      temporal_coverage: "Complete selected production period, seasonal/shift coverage disclosed"
      site_scope: "One declared site and homogeneous species/design/finish route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw tickets; calibration; uncertainty; supplier certificates; stock and stage reconciliation"
    - protocol_id: cp_finish
      process_id: "ornament_manufacture"
      flow_role: "shellac and ethanol balance"
      record_type: "measured_record"
      raw_fields: "Resin/ethanol delivery mass and composition; purity/wax; water fraction; solvent origin; supplier amount basis; formulation sheet; batch additions; cleaning withdrawals; opening/closing stocks; retained product/reject solvent; unused coating and separate rinse liquids; measured exhaust/fugitive ethanol; uncertainty"
      collection_method: "Calibrated gravimetric mixing/stock reconciliation and supplier certificates; sample distinct waste liquids and retained film/solvent. Verify brush/ambient route and no denaturants. Use species mass balance with representative testing, not total VOC as carbon or percent recipes."
      unit: "kg"
      frequency: "Each mixture, cleaning event and batch"
      temporal_coverage: "Complete selected production period, seasonal/shift coverage disclosed"
      site_scope: "One declared site and homogeneous species/design/finish route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw tickets; calibration; uncertainty; supplier certificates; stock and stage reconciliation"
    - protocol_id: cp_residues
      process_id: "ornament_manufacture"
      flow_role: "each segregated residue"
      record_type: "measured_record"
      raw_fields: "Row id; stage; batch; gross/tare; wet wood and dry solids; coating/solvent/dust on abrasive; stock changes; sale contracts; prices if needed; receiver and accepted treatment; transfer receipts"
      collection_method: "Weigh each separate offcut/dust/reject/abrasive stream and reconcile receiving tickets. Record composition and physical destination before environmental allocation; exclude double counting between waste streams."
      unit: "kg"
      frequency: "Each bin/dispatch and batch"
      temporal_coverage: "Complete selected production period, seasonal/shift coverage disclosed"
      site_scope: "One declared site and homogeneous species/design/finish route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw tickets; calibration; uncertainty; supplier certificates; stock and stage reconciliation"
    - protocol_id: cp_air
      process_id: "ornament_manufacture"
      flow_role: "each outdoor particulate/species"
      record_type: "measured_record"
      raw_fields: "Source/stage; sampling method; volume and T/P/moisture basis; emission concentration; duration; capture/outlet/fugitive measurement; PMtotal/PM10/PM2.5; wood/mineral share; CAS speciation; nondetection limits; ambient blank; uncertainty"
      collection_method: "Representative post-control outdoor-release tests with synchronized compatible gas basis and size methods; integrate concentration × exhaust quantity and fugitive periods. Screen actual wood/finish species. EPA sawmill PTE factors and softwood survey values are not carving defaults."
      unit: "kg"
      frequency: "Representative operating states and each changed route/species"
      temporal_coverage: "Complete selected production period, seasonal/shift coverage disclosed"
      site_scope: "One declared site and homogeneous species/design/finish route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw tickets; calibration; uncertainty; supplier certificates; stock and stage reconciliation"
    - protocol_id: cp_water
      process_id: "ornament_manufacture"
      flow_role: "net ambient water transfer"
      record_type: "measured_record"
      raw_fields: "Incoming/final wood and residue dry masses and moisture; water in resin/ethanol and waste liquids; retained product water; opening/closing stocks; ambient T/RH; uptake versus evaporation"
      collection_method: "Use paired gravimetric moisture and liquid composition records with stock correction. State uncertainty and sign; distinguish ambient uptake from vapour release without assuming kiln drying."
      unit: "kg"
      frequency: "Each batch, including ambient-drying period"
      temporal_coverage: "Complete selected production period, seasonal/shift coverage disclosed"
      site_scope: "One declared site and homogeneous species/design/finish route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw tickets; calibration; uncertainty; supplier certificates; stock and stage reconciliation"
    - protocol_id: cp_pack
      process_id: "ornament_manufacture"
      flow_role: "carton and PE film"
      record_type: "measured_record"
      raw_fields: "Actual material specification/fibre furnish; PE polymer/thickness; supplier; net issued mass; returns/scrap; output package bill; inbound freight basis"
      collection_method: "Weigh each packaging component separately and reconcile store/pack-out. Declare unused film with documented absence; add separate atomic packaging-waste rows if generated, with receivers."
      unit: "kg"
      frequency: "Each packing batch"
      temporal_coverage: "Complete selected production period, seasonal/shift coverage disclosed"
      site_scope: "One declared site and homogeneous species/design/finish route"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Raw tickets; calibration; uncertainty; supplier certificates; stock and stage reconciliation"
  calculation_rules:
    - id: batch_normalization
      applies_to: "all inventory rows"
      rule: "For each row sum the attributable measured exchange amount over the selected homogeneous production period, then divide by accepted net finished-ornament kg. The final reference output is 1 kg. Failed output contributes burdens and waste, not the accepted denominator."
      inputs:
        - "batch exchange amount"
        - "accepted net finished-ornament kg"
        - cp_product
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "Metered electricity MJ = recorded kWh × 3.6; divide attributable MJ by the same accepted net finished-ornament kg."
      inputs:
        - "meter kWh"
        - cp_energy
        - cp_product
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: uncoated_wood_moisture
      applies_to: "uncoated wood samples and measured product-component separation"
      rule: "Use these collection-ledger equations before normalization or burden allocation. B is accepted batch net ornament mass (kg). For every uncoated wood sample, u = (m_wet - m_dry) / m_dry and m_dry = m_wet / (1 + u). Coated final/reject masses are first separated into wood, water, retained shellac and retained solvent by measured composition; whole ornament mass is not oven-dry wood mass."
      inputs:
        - cp_materials
        - cp_product
        - cp_residues
      output: "separate wood, water, coating and solvent quantities"
      source_ids:
        - usda-wood-handbook-2021
    - id: dry_wood_reconciliation
      applies_to: "ornament_manufacture physical dry-wood ledger"
      rule: "Dry wood entering + opening dry-wood stock = dry wood retained in accepted products + dry wood in saleable offcuts + discarded offcuts + collected dust + rejects + dust retained on spent abrasive + outdoor wood-dust release + wood-derived volatile mass + closing dry-wood stock + measured reconciliation residual. Separate wood/mineral dust by composition; do not force all total-PM mass into wood yield. Inventory changes of work-in-progress are included, and rework transfers cancel within the unit. The residual has measurement uncertainty and investigation, not a new fictitious waste exchange."
      inputs:
        - cp_materials
        - cp_product
        - cp_residues
        - cp_air
      output: "dry-wood balance, WIP/rework and measured residual"
      source_ids: []
    - id: ethanol_shellac_reconciliation
      applies_to: "shellac and ethanol species ledgers"
      rule: "For ethanol species: delivered ethanol + opening ethanol stock = retained ethanol in accepted product/rejects + ethanol in discarded coating solution + ethanol in separate rinse solvent + outdoor ethanol release + closing stock + reconciliation residual. Incoming species mass = delivered liquid mass × measured ethanol mass fraction. Sum releases across mixing/application/drying/cleaning once, net of ambient background; no assumed 100% volatilization. Shellac dry solids are balanced independently among accepted film, rejects, waste coating, rinse residue and stock."
      inputs:
        - cp_finish
        - cp_product
        - cp_residues
        - cp_air
      output: "ethanol species and independent shellac dry-solids balances"
      source_ids:
        - epa-coating-eiip-2001
    - id: matched_particle_partition
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "For matched cumulative particle observations: PM2.5 bin = PM2.5; coarse bin = PM10 - PM2.5; >PM10 bin = PMtotal - PM10. Require PMtotal ≥ PM10 ≥ PM2.5 ≥ 0, same size definitions/method/time/source, and post-control outdoor releases. These bins sum to PMtotal once; filter catch remains waste, and indoor samples cannot be added to the same released mass. PTE tables are not measurements."
      inputs:
        - cp_air
        - cp_residues
      output: "exclusive outdoor particle masses"
      source_ids:
        - epa-sawmill-pte-2014
    - id: water_carbon_reconciliation
      applies_to: "ornament_manufacture physical water/carbon ledgers"
      rule: "Water ledger covers wood moisture, liquid-input water, waste-liquid water, product/residue retained water, stock and net ambient uptake/vapour. Carbon ledger separately records dry wood and shellac carbon from measured/supplier composition, ethanol carbon from confirmed species amount, retained carbon, sale/waste transfers and outdoor volatile/particle carbon. Reconcile without assuming a universal wood carbon fraction or transferring a northern softwood survey coefficient. Track biogenic versus fossil origin for wood/resin/ethanol/background emissions; LCIA conventions never change the physical ledger."
      inputs:
        - cp_materials
        - cp_finish
        - cp_product
        - cp_residues
        - cp_air
        - cp_water
      output: "separate measured water and biogenic/fossil carbon ledgers"
      source_ids: []
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: quality_basis
      applies_to: "all inventory rows"
      requirement: "Same accepted 1 kg denominator in all records; one species/design/finish scope or separately measured strata. Reject unsupported count, volume, wet/dry or supplier reference conversions."
      evidence: "cp_product; cp_materials; cp_finish"
    - id: quality_absence
      applies_to: "conditional rows"
      requirement: "Nondetection, measured zero, absent process and unmeasured are distinct. State test coverage and detection limits; uncertainty/speciation gaps remain pending. Add a specific atomic row for any identified additional ingredient, packaging waste or released species."
      evidence: "cp_air; cp_finish; cp_pack"
    - id: quality_identity
      applies_to: "UUID-bearing rows"
      requirement: "Verify actual material, route, medium, property, supplier amount basis and background context. Identity success does not complete the data package. Unknown UUIDs or source defects must remain disclosed and resolved before claiming complete compatible linkage."
      evidence: "supplier certificates; receiver manifests; direct identity metadata"
    - id: quality_coverage
      applies_to: "ornament_manufacture"
      requirement: "Disclose production period, season/shift/site representation, calibration and uncertainty; retain complete stage and physical ledgers and the separate burden allocation ledger. Source survey numbers are not industry defaults for the selected hardwood route."
      evidence: "all collection protocols"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Reject classification-label-only applicability. Verify single-piece untreated kiln-dried hardwood, indoor decorative function, shellac/undenatured-ethanol brush route and all required qualifiers; excluded product functions require another method."
    source_ids:
      - usda-wood-handbook-2021
      - usda-finishing-1999
  - rule_id: validate_reference
    applies_to: "all inventory rows"
    rule: "Exactly one finished_ornament product output carries the reference UUID and 1 kg. All row, protocol and normalization denominators agree; exclude packaging from net reference mass and exclude rejected product from the denominator."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "ornament_manufacture"
    rule: "Check measured dry wood, coating solids, ethanol species, water and carbon balances with declared uncertainties and stock changes. Investigate residuals; confirm equal internal transfer quantities and no physical allocation of co-product outputs."
    source_ids:
      - usda-wood-handbook-2021
      - epa-coating-eiip-2001
      - corrim-northern-lumber-2025
  - rule_id: validate_emissions
    applies_to: "elementary outputs"
    rule: "Verify outdoor-air subcompartment, CAS and species mass rather than total VOC-as-carbon. Require disjoint particle size bins and no indoor/outdoor double count. No unverified correction, surrogate, enantiomer or missing-fraction substitution; unmeasured emissions remain unresolved."
    source_ids:
      - epa-coating-eiip-2001
      - epa-sawmill-pte-2014
  - rule_id: validate_destinations
    applies_to: "waste and coproduct outputs"
    rule: "Verify clean/contaminated state, separate receiver function, composition and upstream/treatment linkage. No zero-burden wood-loss default and no automatic substitution credit. Declare missing UUIDs and source metadata defects rather than claiming scientific approval or full completeness."
    source_ids:
      - corrim-northern-lumber-2025
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Supply of the declared indoor carved shellac-coated hardwood ornament, after complete data collection, compatible linkage and independent quality review"
  allowed_use: "Same species/design/function/route and reference basis; explicit uncertainty and applicability review"
  excluded_use: "Whole CPC31913 coverage; storage case, inlay, tableware or furniture substitution; alternate coating; generic per-piece aesthetic equivalence; methodology approval inferred from packaging"
  required_metadata: "All reference qualifiers, production period/site, supplier/background pins and delivery bases, receiver routes, full physical ledgers and burden allocation"
  required_quality_disclosure: "UUID gaps; metadata defects; measurements/nondetection; uncertainty; balances; representativeness; exclusions; pending independent scientific review"
  update_trigger: "Wood species/supply treatment, design, coating/solvent/denaturant, application/drying/abatement, supplier reference basis, electricity boundary or residue destination changes"
data_sources:
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA FPL, Wood handbook, FPL-GTR-282 (2021), Ch4 pp4-1,4-11; Ch13 pp13-2; Ch16 pp16-29–16-30. https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Dry-basis moisture, measured mass/density and indoor surface preparation; no universal species moisture or density adopted."
  - id: "usda-finishing-1999"
    type: "handbook"
    reference: "USDA FPL, Williams (1999), FPL-GTR-113, Ch15 p15-31, Surface Coats. https://research.fs.usda.gov/download/treesearch/7145.pdf"
    used_for: "Shellac as an indoor transparent coat and water sensitivity; historical description is not a production recipe or quantified service life."
  - id: "gsa-shellac-2017"
    type: "official_guidance"
    reference: "GSA, Cleaning and refinishing of woodwork, procedure modified 2017-07-28, Part2 materials and Part3 §3.02. https://www.gsa.gov/real-estate/historic-preservation/historic-preservation-policy-tools/preservation-tools-resources/technical-procedures/cleaning-and-refinishing-of-woodwork"
    used_for: "Shellac/alcohol combination and substrate-dependent acceptance. Restoration cloth/wax steps and overnight time are not transferred to ornament manufacture; supplier must substantiate the selected ethanol-only brush route."
  - id: "epa-coating-eiip-2001"
    type: "official_guidance"
    reference: "US EPA EIIP VolII Ch7 (July 2001), §§3.1.1,4.1,4.2,6.1.1; pp7.4-10–7.4-11. https://www.epa.gov/sites/default/files/2015-08/documents/ii07_july2001.pdf"
    used_for: "Site-specific coating material balance, species composition and captured/fugitive distinction; no example application rate, recipe or removal efficiency adopted."
  - id: "corrim-northern-lumber-2025"
    type: "literature"
    reference: "CORRIM, Life Cycle Assessment of Softwood Lumber Production – Northern Region (2025-07-22), §3.2.6 p16. https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Northern-Lumber-Report-07222025.pdf"
    used_for: "Counterevidence to treating all residues as burden-free: report partitions environmental loads among lumber/byproducts and attributes packaging to final product. Its softwood survey, factors and prescribed allocation shares are not transferred to hardwood ornaments."
  - id: "epa-sawmill-pte-2014"
    type: "official_guidance"
    reference: "US EPA Region10 (2014-05-08), PM Potential to Emit Factors for Activities at Sawmills Excluding Boilers, pp1–2. https://www.epa.gov/sites/default/files/2016-09/documents/spmpteef_memo.pdf"
    used_for: "Limits of the sawmill PTE table and nested PM size conventions; its maximum-capacity factors do not quantify actual carving emissions or boiler emissions."
