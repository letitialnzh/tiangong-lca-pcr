  how_much: "1 kg net accepted kiln-dried timber at mill gate, excluding dispatch packaging"
  how_well: "Declared species mix, measured dimensions >6 mm thickness, grade, moisture basis and actual moisture; not interchangeable with green/air-dried timber"
