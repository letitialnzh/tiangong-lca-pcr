measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use net accepted dispatch wet mass; collect by calibrated weighing in cp_reference. Packaging is separately counted."
  - id: moisture_basis
    applies_to: "wood and residue mass"
    required_property_ref:
      name: "Water fraction on explicitly stated basis"
      uuid: ""
    required_unit: "dimensionless; % explicitly converted"
    rule: "USDA dry-basis moisture u=(m_wet-m_dry)/m_dry; wet-basis w=(m_wet-m_dry)/m_wet. With fractions, w=u/(1+u), u=w/(1-w), m_dry=m_wet/(1+u). Require m_dry>0, u≥0 and 0≤w<1. Divide a reported percentage by 100 before using these expressions. [usda-wood-handbook-2021, Ch.4 eqs.4-1/4-2; algebraic conversion.]"
  - id: volume_mass
    applies_to: "volume-reported wood"
    required_property_ref:
      name: "Mass; volume at the same moisture state"
      uuid: ""
    required_unit: "kg; m3"
    rule: "m_wet=rho_u×V_u with matched species, moisture and actual solid volume. Measure density; basic density (oven-dry mass/green volume), oven-dry density and dispatch wet density are different. Nominal board-foot log scales and loose chip volume are not actual solid lumber volume. [usda-wood-handbook-2021 Ch.4; corrim-northern-lumber-2025 §3.2.4.]"
  - id: energy_basis
    applies_to: "electricity, heat and fuel"
    required_property_ref:
      name: "Declared carrier-specific property"
      uuid: ""
    required_unit: "MJ; kg"
    rule: "Convert metered kWh to MJ by ×3.6. Preserve the verified electricity flow’s reference property label Net calorific value as its database energy representation; it does not mean electricity combustion. Heat is useful delivered energy, distinct from fuel LHV/HHV input. Gas volumes require reference temperature/pressure and measured density/calorific value; no fixed wood heat value. [cp_energy; cp_energy_conditioning; cp_energy_heat; cp_fuel; cp_fuel_sawing; epa-wood-boiler-2022.]"
  - id: nox_quantity_basis
    applies_to: "all NOx emission rows"
    required_property_ref:
      name: "Mass; verified quantity convention"
      uuid: ""
    required_unit: "kg"
    rule: "Before calculation, document the actual measured or factor-derived NOx quantity convention, chemical/species scope, concentration and gas-state basis and its independently verified relation to the selected LCI flow and assessment method. Native Mass/kg does not establish an NO2-equivalent convention. Keep actual NO/NO2 species quantities and documented conversion/speciation evidence when an equivalent basis is used; no universal conversion or assumed split. Reconcile any aggregate with separately modelled NO/NO2 and keep N2O separately, without counting the same release twice. Missing convention/speciation or LCI/assessment compatibility leaves the raw result and its normalized exchange pending review; never silently label a mass as NO2-equivalent or invent zero."
