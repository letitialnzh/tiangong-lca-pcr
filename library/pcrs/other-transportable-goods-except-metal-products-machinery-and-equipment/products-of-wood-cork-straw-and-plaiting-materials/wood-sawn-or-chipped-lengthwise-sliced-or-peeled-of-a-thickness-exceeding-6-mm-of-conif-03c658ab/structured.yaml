  calculation_rules:
    - id: period_balance
      applies_to: "all inventory rows"
      rule: "Build and retain the original unallocated physical ledger from receipts, opening/closing stock and all measured outputs/losses for the same cohort. Normalize each unallocated exchange total by accepted net dispatch kg of that cohort, without a coproduct-share multiplier. Match internal handoff quantities on both sides before normalization; use the same denominator on both sides. Close physical mass/water/carbon balances in raw units first. The final product remains 1 kg. Preserve this ledger when producing the separate allocated burden account."
      inputs:
        - cp_reference
        - cp_material
        - cp_material_conditioning
        - cp_energy
        - cp_energy_conditioning
        - cp_energy_heat
        - cp_fuel
        - cp_fuel_sawing
        - cp_packaging
        - cp_waste
        - cp_waste_conditioning
        - cp_waste_heat
        - cp_emission
        - cp_emission_conditioning
        - cp_emission_heat
      output: "Unallocated physical exchanges per 1 kg reference flow"
      source_ids:
        - corrim-northern-lumber-2025
    - id: burden_ledger
      applies_to: "each joint-step burden account"
      rule: "For each step record its original shared burden, separately directly attributable burden, target output and validated dry-mass share. Assigned burden = step share × original shared burden + directly attributable burden. Trace inherited origin burdens exactly once. Normalize assigned external-input/elementary accounting values by the same accepted net product kg, keeping per 1 kg reference flow; label these as allocated LCI, distinct from unallocated physical cards. Never multiply matched internal transfers, coproduct physical outputs or the terminal 1 kg by a share."
      inputs:
        - cp_allocation
        - cp_allocation_conditioning
        - cp_allocation_heat
        - cp_material
        - cp_material_conditioning
        - cp_reference
        - cp_energy
        - cp_energy_conditioning
        - cp_energy_heat
        - cp_fuel
        - cp_fuel_sawing
        - cp_emission
        - cp_emission_conditioning
        - cp_emission_heat
      output: "Traceable product-specific burden/LCI ledger, separate from physical graph"
      source_ids:
        - corrim-northern-lumber-2025
    - id: drying_water_balance
      applies_to: "drying_water_vapour"
      rule: "For a batch with independently verified conserved dry matter, removed water=m_dry×(u_in−u_out). Deduct captured liquid water before assigning vapour. Otherwise close separate dry-matter and water balances including rejects, volatile losses and steam leakage; never equate shrinkage to lost dry mass."
      inputs:
        - cp_material
        - cp_material_conditioning
        - cp_reference
      output: "Net evaporated water mass"
      source_ids:
        - usda-wood-handbook-2021
    - id: pm_disjoint
      applies_to: "all particle rows"
      rule: "For comparable cumulative measurements: PM2.5; PM2.5–10=PM10−PM2.5; PM>10=total filterable PM−PM10. Nonnegative differences require identical activity, source, control and measurement basis. Never add total PM + PM10 + PM2.5. Condensable PM requires separate identity/method and cannot be silently assigned to a size fraction."
      inputs:
        - cp_emission
        - cp_emission_conditioning
        - cp_emission_heat
      output: "Disjoint particle mass fractions"
      source_ids:
        - epa-wood-boiler-2022
        - epa-sawmill-pte-2014
    - id: wood_carbon_balance
      applies_to: "wood carbon"
      rule: "Track carbon=m_dry×measured dry-basis carbon fraction separately in timber, each residue and ash. CO2 mass corresponds to carbon mass ×44/12 only for carbon demonstrably oxidised to CO2; account CO, CH4, organic releases and unburned carbon separately. Do not use a generic 50% wood-carbon or 99% oxidation default. Product-gate stored carbon remains a disclosed stock, not a negative foreground emission."
      inputs:
        - cp_material
        - cp_material_conditioning
        - cp_fuel
        - cp_fuel_sawing
        - cp_waste
        - cp_waste_conditioning
        - cp_waste_heat
        - cp_emission
        - cp_emission_conditioning
        - cp_emission_heat
      output: "Carbon balance and separate direct emissions"
      source_ids:
        - corrim-northern-lumber-2025
        - epa-wood-boiler-2022
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "each flow"
      requirement: "Exact product/waste/elementary type, names, route, compartment and reference property/unit. Any unresolved applicable UUID prevents a fully resolved exchange package."
      evidence: "Direct flow records and producer qualifiers"
    - id: quality_range
      applies_to: "site inventories"
      requirement: "Use measured values and observed variability; no industry range is inferred from one regional report or one site. No unmeasured conditional exchange is assigned zero. Factor-derived values are labelled estimates with uncertainty and sources; this PCR supplies no generic numeric amount ranges."
      evidence: "Underlying meter/test record, representativeness assessment and source conditions"
    - id: quality_completeness
      applies_to: "whole mill"
      requirement: "Close wood dry-matter, water, energy and carbon balances; record seasonal drying, site control devices, all relevant chemicals, VOC/HAP species, wastewater, combustion water and control reagents. Add missing physical exchanges individually before dataset release. Purchased heat and direct-fire variants require explicit completeness review."
      evidence: "Producer process diagram, material ledger, monitoring/permit species list and balance residual assessment"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference definition"
    rule: "Require declared kiln-dried coniferous state, thickness >6 mm, net 1 kg, required qualifiers and the exact linked finished output. Reject use of the kiln UUID for green/air-dried timber or a non-coniferous UUID for this product. A new route cannot pass on the representative definition."
    source_ids:
      - corrim-northern-lumber-2025
      - usda-wood-handbook-2021
  - rule_id: validate_balance
    applies_to: "all processes"
    rule: "Check identical EN/ZH denominator. In the unallocated physical graph require equal matched internal handoff quantities, unchanged coproduct physical outputs and terminal 1 kg, moisture conversion and source-specific mass/water/carbon balances. Separately check each joint step’s burden shares and their sum to one within recorded uncertainty, plus the trace from original burdens to assigned LCI. Allocation must never feed back into physical balance quantities. Unexplained residuals require review; no arbitrary closure tolerance."
    source_ids:
      - corrim-northern-lumber-2025
      - usda-wood-handbook-2021
  - rule_id: validate_air
    applies_to: "air emissions"
    rule: "Require individual substances and nonoverlapping particle classes with actual controls and factor/measurement applicability. PTE maxima, indoor or long-term-air UUIDs, wood-boiler factors for mobile diesel, and stacked nested PM are unacceptable. No omission of biogenic CO2 because a statistical GHG convention excludes it. NOx amounts require the documented compatible quantity convention under nox_quantity_basis; an NO2-equivalent monitoring result is not automatically the native LCI mass."
    source_ids:
      - epa-wood-boiler-2022
      - epa-sawmill-pte-2014
      - corrim-northern-lumber-2025
  - rule_id: validate_identity_gaps
    applies_to: "release readiness"
    rule: "Every applicable row needs verified exact identity or an explicitly unresolved gap; unresolved is not a pass. Confirm site-screened additional exchanges and complete upstream boundaries before any complete dataset or methodology claim."
    source_ids:
      - corrim-northern-lumber-2025
published_dataset_profile:
  dataset_role: "Site-specific manufacturing dataset with distinct unallocated physical graph and allocated product-specific LCI per declared kiln-dried timber output"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared-species, thickness, grade, moisture, kiln and boundary-matched production modelling after identity/completeness review"
  excluded_use: "EPD certification; structural equivalence; green/air-dried or glued product substitution; whole-building lifetime; unqualified carbon neutrality; a complete resolved dataset while applicable identities remain blank"
  required_metadata: "Site, time, species mix, measured geometry/grade/moisture, net kg/volume conversion, starting gate, supplier coverage, drying/heat route, raw unallocated records and equal internal handoff links; separate step burden shares and assigned-LCI audit, carbon accounting convention and exact flow identities"
  required_quality_disclosure: "Representativeness, calibrated records, estimated versus measured emissions, balance residuals, exclusions, unresolved UUIDs, missing empirical ranges and unreviewed scope"
  update_trigger: "Changed species, moisture/grade, product dimensions, kiln/fuel/control technology, upstream boundary, allocation, emission evidence or flow identity"
data_sources:
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory (2021), Wood handbook—wood as an engineering material, FPL-GTR-282; Ch.4 pp.4-1 and 4-11, Ch.13 pp.13-1–13-7. [Official GovInfo full original](https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf)."
    used_for: "Dry-basis moisture, density/volume-state distinction, oven-dry collection and air/kiln routes; no species-average density default"
  - id: "corrim-northern-lumber-2025"
    type: "literature"
    reference: "Puettmann / CORRIM, Life Cycle Assessment of Softwood Lumber Production—Northern Region (April 28 2025; revised May 20; edited July 22 2025), §§3.2.1–3.2.6, 3.3, 4.6–4.9, unallocated Tables 8–10 and fuel/energy stage-allocation Table 23. [Full original](https://corrim.org/wp-content/uploads/2025/07/LCA-Report-Northern-Lumber-Report-07222025.pdf)."
    used_for: "Process/boundary and mass-allocation evidence, dry wood balance, packaging attribution, carbon and site-resolved HAP; 2023 Northern US survey is not a global numeric range or certified PCR compliance"
  - id: "epa-wood-boiler-2022"
    type: "official_guidance"
    reference: "US EPA AP-42 §1.6, Wood Residue Combustion in Boilers, March 2022, §§1.6.1–1.6.4 and Tables 1.6-1–1.6-6. [Original](https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf)."
    used_for: "Boiler/fuel/control applicability and particle/gas accounting; factors require matched thermal input and moisture. Short-cycle GHG statistical exclusion does not remove LCI biogenic CO2"
  - id: "epa-sawmill-pte-2014"
    type: "official_guidance"
    reference: "US EPA Region 10 memorandum, Particulate Matter Potential to Emit Emission Factors for Activities at Sawmills, Excluding Boilers, Located in Pacific Northwest Indian Country, May 8 2014; cover and activity table. [Original](https://www.epa.gov/sites/default/files/2016-09/documents/spmpteef_memo.pdf)."
    used_for: "Source/activity screening and nested particle definitions; regulatory PTE maximum-capacity factors are not adopted as actual LCA emission amounts"
