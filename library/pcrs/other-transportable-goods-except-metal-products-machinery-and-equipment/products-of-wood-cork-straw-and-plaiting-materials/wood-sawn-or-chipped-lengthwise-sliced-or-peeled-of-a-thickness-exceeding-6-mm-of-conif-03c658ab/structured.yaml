      collection_method: "Retain immutable raw physical totals and handoff links. Measure stage burdens where possible; record direct versus shared burdens and each step share separately. Store assigned values with their raw-record links, never overwriting physical quantities. CORRIM Table 23 stage shares are case estimates, not defaults. Collect only actual conditioning stage records; retain the original fields and QA only where physically applicable to that stage. A shared master meter or source record is a reconciliation witness, not an extra exchange: retain each attributable external raw record once across companion protocols using measured stage/service attribution, with fractions reconciled to the master total. Keep internal sending/receiving records separately with equal state, period and quantity; do not add either endpoint as another external purchase or emission. All companions use the same complete accepted-output reporting pool, retaining failed/rework activity and raw native units."
      unit: "kg; MJ"
      frequency: "each cohort and joint step"
      temporal_coverage: "Declared representative production period, seasonal moisture/drying covered; no prescribed duration"
      site_scope: "One declared mill and process graph"
