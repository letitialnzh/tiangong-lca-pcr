allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "all processes"
    rule: "First preserve the unallocated physical ledger, then subdivide environmental burdens with stage metering and direct attribution. CORRIM §3.2.6 partitions environmental load; Tables 8–10 are unallocated inventories, and Table 23 contains fuel/energy stage shares. These are not permission to scale internal physical transfers or coproduct outputs; do not copy the regional stage percentages as defaults. Bark/chips/sawdust that exit before kiln drying receive only upstream joint-step burdens; lumber drying does not burden them. Product-specific packaging is wholly assigned to the dispatched product."
    source_ids:
      - corrim-northern-lumber-2025
  - rule_id: allocation_dry_mass
    applies_to: "unseparated joint wood steps"
    rule: "For comparable usable wood coproducts partition only the shared environmental burdens of each individual joint step using measured oven-dry mass shares: a_i=m_dry,i/sum(m_dry,j) over qualifying physical outputs of that step. Calculate each step’s shares independently; retain all original output masses unchanged, and keep the allocated result in a separate traceable account. The terminal reference remains 1 kg, not a_i kg. Reconcile moisture first; do not allocate by wet mass containing different water fractions. This dry-mass physical method is supported by the CORRIM wood-flow basis, not its regional average shares. Verify causal suitability; materially different cofunctions require explicit method review and economic-allocation sensitivity using contemporaneous gate values, not a price default."
    source_ids:
      - corrim-northern-lumber-2025
      - usda-wood-handbook-2021
  - rule_id: allocation_internal_fuel
    applies_to: "internal residue and heat"
    rule: "Keep internal bark/sawdust/chip physical transfers at their unallocated measured quantities; match only the routed internal portion of each coproduct to the corresponding heat input, reconciling stock movements. Carry inherited origin burdens separately into the heat burden account without reducing the matched physical quantity. Do not also count them as sold exports or allocate the same residue a second time. Attribute heat generation to actual useful heat deliveries; no avoided fossil-fuel credit in this attributional foreground. CHP, exported heat and other fuels need a reviewed additional energy-allocation model."
    source_ids:
      - corrim-northern-lumber-2025
      - epa-wood-boiler-2022
  - rule_id: allocation_waste
    applies_to: "wastes and recovery"
    rule: "Waste carries required handling/treatment burdens and does not receive a saleable-output allocation share by default. Declare end-of-waste and treatment boundary explicitly; saleability is evidence-dependent. No simultaneous recovery credit and allocated coproduct output. Do not discard carbon in collected ash or wood waste."
    source_ids:
      - corrim-northern-lumber-2025
      - epa-wood-boiler-2022
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "conditioning"
      flow_role: "accepted output"
      record_type: "weighing and acceptance record"
      raw_fields: "species; batch; measured dimensions; grade; net dispatch mass; tare; rejects; moisture sample; kiln route"
      collection_method: "Calibrated scale, net timber excluding packaging; reconcile dispatch with production and stock change. Validate >6 mm thickness and kiln state."
      unit: "kg"
      frequency: "each batch; aggregate period"
      temporal_coverage: "Declared representative production period, seasonal moisture/drying covered; no prescribed duration"
      site_scope: "One declared mill and process graph"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceable records; sample representativeness; reconciliation and uncertainty"
    - protocol_id: cp_material
      process_id: "sawing"
      flow_role: "wood and liquid exchanges"
      record_type: "mass and moisture ledger"
      raw_fields: "physical record id; cohort; step; origin/destination; unallocated wet mass; matched transfer id; species; stock change; moisture dry/wet basis; actual solid volume; density; internal partner; sale/waste status; actual owner sawing; raw_record_id; shared_meter_id; boundary/internal status; matched transfer id"
      collection_method: "Weigh each wood stream separately without applying burden allocation; pair representative moisture and density samples by batch. Oven-dry moisture at 101–105 °C to no appreciable mass change in 3-hour intervals; disclose volatile-extractive bias. Meter corrections require species/temperature evidence; above fibre saturation use gravimetric verification. [usda-wood-handbook-2021 Ch.13.] Collect only actual sawing stage records; retain the original fields and QA only where physically applicable to that stage. A shared master meter or source record is a reconciliation witness, not an extra exchange: retain each attributable external raw record once across companion protocols using measured stage/service attribution, with fractions reconciled to the master total. Keep internal sending/receiving records separately with equal state, period and quantity; do not add either endpoint as another external purchase or emission. All companions use the same complete accepted-output reporting pool, retaining failed/rework activity and raw native units."
      unit: "kg; m3"
      frequency: "each batch and stock close"
      temporal_coverage: "Declared representative production period, seasonal moisture/drying covered; no prescribed duration"
      site_scope: "One declared mill and process graph"
