system_boundary:
  rules:
    - rule_id: boundary_process
      applies_to: "mill production"
      rule: "Include actual log handling, debarking, sawing, drying route, trimming/straight planing, grading, packaging, on-site transport, dust collection and on-site heat if present. Purchased heat includes provider combustion upstream."
      source_ids:
        - corrim-northern-lumber-2025
    - rule_id: boundary_emissions
      applies_to: "emissions and waste"
      rule: "Screen each source and actual controls. Use emitted amounts after controls; collected dust/ash is waste or a separately justified coproduct. No general mass cutoff removes known toxic compounds. Add each other site-observed substance as a separate atomic row before release; absence requires evidence."
      source_ids:
        - corrim-northern-lumber-2025
        - epa-wood-boiler-2022
        - epa-sawmill-pte-2014
    - rule_id: boundary_carbon
      applies_to: "biogenic carbon"
      rule: "Retain wood-derived CO2, CO and CH4 separately from fossil flows. Track dry wood carbon in log inputs, timber/coproduced material, combusted residue, ash and losses. No new atmospheric CO2 uptake is created at the mill: forestry uptake is upstream, and product carbon crossing the gate is a material carbon balance, not a negative mill emission. Preserve upstream uptake once; disclose any complete-system accounting convention and sustainability evidence. Stored carbon is not an avoided-emission credit; service storage and end-of-life remain outside this gate."
      source_ids:
        - corrim-northern-lumber-2025
        - epa-wood-boiler-2022
    - rule_id: boundary_exclusion
      applies_to: "downstream and capital"
      rule: "Exclude dispatch beyond mill gate, construction, use, end-of-life and substitution credits from this manufacturing dataset. Declare capital/infrastructure and employee-activity treatment and assess significance; the CORRIM case exclusion is not a universal insignificance proof. Do not describe omitted stages as zero."
      source_ids:
        - corrim-northern-lumber-2025
