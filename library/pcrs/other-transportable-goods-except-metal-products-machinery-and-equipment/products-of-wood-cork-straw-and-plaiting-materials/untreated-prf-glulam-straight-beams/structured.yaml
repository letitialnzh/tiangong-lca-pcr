    type: "extension_guidance"
    reference: "Dynea Aerodux185 TDS, 05.2014, seven-page manufacturer original on distributor mirror; pp.1–3,5–7. [TDS](https://www.redwood-uk.com/wp-content/uploads/2025/02/RI130225001-Aerodux-185-TDS.pdf)"
    used_for: "Historical two-component PRF manufacturer example: separate liquid resin/powder, surface preparation, assembly/pressure/cure monitoring and contaminated washwater. Current formulation-specific TDS/SDS and qualification required; historic recipe, moisture/pressure/time values and approvals are not defaults."
  - id: "apa-a190-overview"
    type: "official_guidance"
    reference: "APA publisher overview of ANSI A190.1-2022; Scope and Key Requirements, lumber/adhesive, joints and quality-control sections. Full standard text is not assumed from this overview. [APA](https://www.apawood.org/what-we-do/standards-development/ansi-a1901-standard-for-structural-glued-laminated-timber/)"
    used_for: "Parallel-lamella glulam identity and qualification/QA evidence categories only; no certification or numeric specification asserted."
