allocation_rules:
  - rule_id: allocation_separate
    applies_to: "physical and burden ledgers"
    rule: "Keep physical inputs, all residue outputs and matched internal transfers unchanged. For a shared plant, first subdivide using stage meters and batch routing; directly attribute beam-line material consumption. Never multiply coproduct output masses or terminal 1 kg by an allocation share."
    source_ids: []
  - rule_id: allocation_status
    applies_to: "residue status"
    rule: "Distinguish waste sent to treatment/recovery from a deliberately produced marketed coproduct using actual legal, recipient and market evidence. Waste outputs receive their actual treatment burdens without avoided-energy/material credits. A sale price alone does not redefine every residue. If a true coproduct occurs, record its separate atomic output and applicable identity before completion."
    source_ids: []
  - rule_id: allocation_joint
    applies_to: "remaining shared burdens"
    rule: "If subdivision cannot resolve a joint burden, document a demonstrated causal physical relationship and allocate only that burden accordingly. Otherwise explicitly justify the selected alternative, such as economic allocation with period-matched prices and quantities, and sensitivity. No universal mass or revenue fraction is supplied. Record original burden, share, direct burden, target and provenance in cp_allocation; shares for each joint step sum to one."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "glulam_manufacture"
      flow_role: "accepted product"
      record_type: "Primary measured record"
      raw_fields: "batch; beam ID/configuration; accepted and rejected status; dimensions; tare; net mass; dispatch stock; grade/layup; wood moisture; adhesive retained"
      collection_method: "Calibrated net weighing excluding all packaging; link actual grade, layup, joint/bond qualification, inspections and dispatch. Reconcile accepted production, opening/closing stock and dispatch."
      unit: "kg"
      frequency: "Each batch/meter interval or transfer; aggregate declared period"
      temporal_coverage: "Declared representative production period with grade mix, ambient season, batch cure and maintenance coverage"
      site_scope: "One declared plant and segregated beam line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, traceable lots and records, current qualification/tests, sample representativeness, balances and uncertainty"
    - protocol_id: cp_material
      process_id: "glulam_manufacture"
      flow_role: "wood and water"
      record_type: "Primary measured record"
      raw_fields: "receipt lot; species; stage; raw wet/dry mass; actual solid volume; dimensions; paired moisture samples; water meter; stock and transfers; density"
      collection_method: "Weigh wood separately and measure solid dimensions at its actual moisture. Use documented oven-dry wood samples and species/temperature-corrected moisture meters. Retain water metering; do not infer finished composite dry wood from total mass."
      unit: "kg; m3"
      frequency: "Each batch/meter interval or transfer; aggregate declared period"
      temporal_coverage: "Declared representative production period with grade mix, ambient season, batch cure and maintenance coverage"
      site_scope: "One declared plant and segregated beam line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, traceable lots and records, current qualification/tests, sample representativeness, balances and uncertainty"
    - protocol_id: cp_adhesive
      process_id: "glulam_manufacture"
      flow_role: "PRF components and joint control"
      record_type: "Primary measured record"
      raw_fields: "resin/powder formulation; lot; current TDS/SDS; supplied/used/stock masses; mixing record; solids/water/volatiles; retained glue; joint geometry; face grade/position; surface time; assembly time; end pressure; face pressure; cure temperature/time; tests"
      collection_method: "Weigh separately supplied liquid resin and powder, reconcile batch mix and losses; record finger-joint and face-bond batches independently. Verify lamella placement and fresh clean parallel bonding surfaces, qualified spreading/clamping/cure controls and actual test results. Historic supplier values are examples, not defaults or current certification."
      unit: "kg"
      frequency: "Each batch/meter interval or transfer; aggregate declared period"
      temporal_coverage: "Declared representative production period with grade mix, ambient season, batch cure and maintenance coverage"
      site_scope: "One declared plant and segregated beam line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, traceable lots and records, current qualification/tests, sample representativeness, balances and uncertainty"
    - protocol_id: cp_energy
      process_id: "glulam_manufacture"
      flow_role: "electricity"
      record_type: "Primary measured record"
      raw_fields: "stage; meter; start/end; kWh; voltage; grid/provider; room/water heating; dust extraction; QA; idle/rework; transformer boundary"
      collection_method: "Meter each stage and reconcile line totals to purchase records; use measured causal attribution for shared utilities and document uncertainty. Convert kWh to MJ ×3.6; avoid double counting controls and electric heat."
      unit: "MJ"
      frequency: "Each batch/meter interval or transfer; aggregate declared period"
      temporal_coverage: "Declared representative production period with grade mix, ambient season, batch cure and maintenance coverage"
      site_scope: "One declared plant and segregated beam line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, traceable lots and records, current qualification/tests, sample representativeness, balances and uncertainty"
    - protocol_id: cp_packaging
      process_id: "glulam_manufacture"
      flow_role: "each component"
      record_type: "Primary measured record"
      raw_fields: "polymer; finished form; mass installed; mass discarded; dispatch; purchased/opening/closing stock"
      collection_method: "Weigh PE film and PP strap independently; reconcile installed film, scrap and stock. Exclude both from reference mass."
      unit: "kg"
      frequency: "Each batch/meter interval or transfer; aggregate declared period"
      temporal_coverage: "Declared representative production period with grade mix, ambient season, batch cure and maintenance coverage"
      site_scope: "One declared plant and segregated beam line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, traceable lots and records, current qualification/tests, sample representativeness, balances and uncertainty"
    - protocol_id: cp_maintenance
      process_id: "glulam_manufacture"
      flow_role: "hydraulic oil"
      record_type: "Primary measured record"
      raw_fields: "oil grade/additives; consumed make-up/replacement; retained charge; leakage; used-oil recipient; maintenance period"
      collection_method: "Record actual maintenance consumption and destination; attribute maintenance across its documented production coverage without repeated full-charge counts. Measure oil volume, temperature and formulation-specific density for any mass conversion, and confirm supplier reference basis. Add separate used-oil waste and elementary leaks where present."
      unit: "kg; m3"
      frequency: "Each batch/meter interval or transfer; aggregate declared period"
      temporal_coverage: "Declared representative production period with grade mix, ambient season, batch cure and maintenance coverage"
      site_scope: "One declared plant and segregated beam line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, traceable lots and records, current qualification/tests, sample representativeness, balances and uncertainty"
    - protocol_id: cp_waste
      process_id: "glulam_manufacture"
      flow_role: "each residue"
      record_type: "Primary measured record"
      raw_fields: "stage; unglued/glued; physical state; wet mass; wood moisture; cured resin; wastewater volume/composition; test specimens; rejects; recipient; waste/coproduct status; stock"
      collection_method: "Separate each listed waste by stage and contamination. Weigh solids and meter washwater with assays; verify receiving treatment/recovery and avoid double counting captured dust, glue retained in wood or glue washed into water."
      unit: "kg; m3"
      frequency: "Each batch/meter interval or transfer; aggregate declared period"
      temporal_coverage: "Declared representative production period with grade mix, ambient season, batch cure and maintenance coverage"
      site_scope: "One declared plant and segregated beam line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, traceable lots and records, current qualification/tests, sample representativeness, balances and uncertainty"
    - protocol_id: cp_emission
      process_id: "glulam_manufacture"
      flow_role: "each substance and size fraction"
      record_type: "Primary measured record"
      raw_fields: "species/CAS; source; outdoor medium; carbon origin; controls; outlet/fugitive method; concentration; dry/wet gas basis; gas flow; run/idle/cure time; detection limit; PM cut and filterable/condensable basis"
      collection_method: "Use representative post-control measurements over actual operations, including cure/storage and fugitives when relevant. Integrate concentration with matched gas flow and operating time in consistent units; document non-detects and uncertainty. Estimates need route/formulation/control-matched original factors with their activity basis; none is supplied here. Screen all actual species, not merely this list."
      unit: "kg"
      frequency: "Each batch/meter interval or transfer; aggregate declared period"
      temporal_coverage: "Declared representative production period with grade mix, ambient season, batch cure and maintenance coverage"
      site_scope: "One declared plant and segregated beam line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, traceable lots and records, current qualification/tests, sample representativeness, balances and uncertainty"
    - protocol_id: cp_allocation
      process_id: "glulam_manufacture"
      flow_role: "separate environmental burden account"
      record_type: "Primary measured record"
      raw_fields: "raw-record links; shared/direct burdens; step; target; causal measurement; coproduct evidence; share; price period; inherited origin; sensitivity"
      collection_method: "Retain physical ledger independently. Record direct attribution first, and only justified remaining allocation; do not overwrite physical quantities or duplicate inherited burdens."
      unit: "kg; MJ"
      frequency: "Each batch/meter interval or transfer; aggregate declared period"
      temporal_coverage: "Declared representative production period with grade mix, ambient season, batch cure and maintenance coverage"
      site_scope: "One declared plant and segregated beam line"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, traceable lots and records, current qualification/tests, sample representativeness, balances and uncertainty"
  calculation_rules:
    - id: period_balance
      applies_to: "all inventory rows"
      rule: "For one coherent cohort, reconcile receipts, opening/closing stock, accepted output, rework, rejected members, test specimens, residues and losses in raw physical units. Divide each unallocated physical exchange total by the same accepted net beam kg from cp_reference. Retain equal internal stage transfers and their raw records. The terminal product remains 1 kg."
      inputs:
        - cp_reference
        - cp_material
        - cp_adhesive
        - cp_energy
        - cp_packaging
        - cp_maintenance
        - cp_waste
        - cp_emission
      output: "Unallocated physical exchanges per 1 kg reference flow"
      source_ids: []
    - id: component_balance
      applies_to: "wood water adhesive and carbon"
      rule: "Close dry wood, water, adhesive solids/volatiles and carbon separately using measured component masses and stock changes. Do not subtract adhesive water from wood dry mass or regard composite oven loss as pure wood moisture. Allocate retained adhesive among accepted beams and glue-bearing residues from records, not assumed recipe or yield. Track wood and adhesive carbon separately and include measured emissions and wastewater carbon."
      inputs:
        - cp_material
        - cp_adhesive
        - cp_reference
        - cp_waste
        - cp_emission
      output: "Unallocated wood/water/adhesive/carbon balance with residual uncertainty"
      source_ids:
        - usda-wood-handbook-2021
    - id: particle_partition
      applies_to: "pm_fine; pm_mid; pm_coarse"
      rule: "For comparable cumulative measurements on identical source/control/activity and filterable basis, PM2.5-10=PM10-PM2.5 and PM>10=total filterable PM-PM10. Require nonnegative fractions and measured cut definitions. Never add cumulative PM10 or total PM to these disjoint fractions. Condensable PM requires its own method and applicable identity before use."
      inputs:
        - cp_emission
      output: "Disjoint actual particle masses"
      source_ids: []
    - id: burden_account
      applies_to: "shared environmental burdens"
      rule: "Keep assigned burden = directly attributable burden + justified share × remaining shared burden in a separate account. Normalize it by the same accepted net beam kg and retain original burden/record links. Allocation shares apply to environmental accounts only; all physical residue outputs and internal transfer totals remain unchanged."
      inputs:
        - cp_allocation
        - cp_reference
      output: "Traceable allocated LCI separate from physical graph"
      source_ids: []
  data_quality_requirements:
    - id: quality_structure
      applies_to: "lamellas joints and accepted product"
      requirement: "Retain actual species and grade combination, lamella positions, tension/compression orientation, dimensions, joint geometry, glue qualification and lot, stage settings, end-joint tests and face-bond shear/delamination results against the actual applicable specification. Record nonconforming batches and rework. A handbook description or database name is not strength or certification evidence."
      evidence: "usda-wood-handbook-2021; apa-a190-overview; actual qualification records"
    - id: quality_identity
      applies_to: "every applicable exchange"
      requirement: "Check physical product/waste/substance, formulation/state/route, reference property/unit and actual recipient medium. Confirm physical identity separately from provider and quantity compatibility; unresolved applicable UUIDs/providers prevent a fully resolved package, not a specific-name flow card."
      evidence: "Direct records, producer and supplier evidence"
    - id: quality_coverage
      applies_to: "whole production cohort"
      requirement: "Cover grade/species mix, ambient cure season, startup/idle/rework, all energy including dust control and test equipment, cleaning and maintenance. Screen actual materials/wastes/species absent from these cards and add separate atomic rows before release. Assess balance residuals and uncertainty; no generic yield, density, adhesive content, emission factor, strength or numeric amount range is provided."
      evidence: "Primary records, process diagram, current TDS/SDS, measurements and residual assessment"
validation_rules:
  - rule_id: validate_scope
    applies_to: "applicability"
    rule: "Reject selection for CLT, LVL, other excluded products/routes or unsupported species/adhesive combinations. Exactly one product output is the selected reference, finished, with 1 kg net accepted mass and complete qualifiers."
    source_ids: []
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "EN/ZH reference, per-kg inventory bases, protocol aggregation and normalization must agree. Positive accepted cohort mass is required; rejected beams and packaging cannot enter its denominator. Internal physical transfers match on both sides; allocated burdens cannot overwrite mass/water/carbon totals."
    source_ids: []
  - rule_id: validate_quality
    applies_to: "structural and bond claims"
    rule: "Claims require actual current specification, qualification and lot-linked tests, including lamella grade/placement and joints/interfaces. Missing evidence remains explicit; no default structural strength or certification is generated."
    source_ids:
      - usda-wood-handbook-2021
      - apa-a190-overview
  - rule_id: validate_emissions
    applies_to: "elementary flows and waste"
    rule: "Confirm exact chemical and outdoor-air medium, species mass and disjoint PM intervals. Track post-control amounts and captured waste separately; no cumulative particle double counting or wastewater-as-elementary shortcut. Conditional unmeasured emissions cannot be zeroed. Additional biogenic/fossil emissions require distinct accurate identities."
    source_ids: []
  - rule_id: validate_completeness
    applies_to: "dataset delivery"
    rule: "No complete resolved inventory claim until applicable exchanges/providers, formulations, quantities, treatment, qualifications and balances are verified. Report tests performed, skipped coverage, gaps and uncertainties; do not infer scientific approval from a projection or measurement check."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing dataset for the explicitly limited beam route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Qualified manufacturing input to compatible construction LCA with matching net-mass and upstream boundaries"
  excluded_use: "Generic engineered wood selector; certified strength/design service; CLT/LVL; complete building life cycle or substitution credits"
  required_metadata: "Scope and all required qualifiers; site/year/technology; functional denominator; stage map; supplier basis; controls; waste recipients; QA and allocation method; transport and upstream boundaries"
  required_quality_disclosure: "UUID/provider/formulation gaps; qualification evidence and actual test coverage; measurement representativeness; balances, uncertainty, allocation sensitivity and exclusions"
  update_trigger: "Changed species/grade/layup, adhesive/hardener, joint/press/cure route, treatment/coating, electricity boundary, recipient or measurement evidence"
data_sources:
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood handbook—wood as an engineering material, FPL-GTR-282 (2021), Ch.11 pp.11-18–11-21 (PDF294–297), Ch.4 p.4-1 eqs.4-1/4-2 (PDF95). [GovInfo](https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf)"
    used_for: "Lamella grading/position, finger-joint and face-bond controls, clamping, finishing/test specimens and wood moisture definition. Qualitative method only; no numerical strength, cure time or generic inventory factor adopted."
