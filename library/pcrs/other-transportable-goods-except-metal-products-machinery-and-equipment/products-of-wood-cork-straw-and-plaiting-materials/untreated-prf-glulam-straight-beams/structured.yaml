functional_unit:
  what: "Supply glulam beam material for declared structural application without establishing structural equivalence"
  how_much: "1 kg net accepted beam at factory gate, excluding packaging"
  how_well: "Actual species, lamella grade/position, beam dimensions, adhesive qualification and joint/bond acceptance records; no invented strength"
  how_long_or_cycle: "One declared production/dispatch accounting period; no service duration"
  reference_flow_link: "finished"
system_boundary:
  rules:
    - rule_id: boundary_stages
      applies_to: "glulam_manufacture"
      rule: "Include grade/moisture verification, defect removal, finger-joint cutting/gluing/end pressure/cure when present, fresh face planing, adhesive mixing/spreading, layup, hydraulic clamping/room cure, trimming, final inspection/test specimens, dust/exhaust control, cleaning, maintenance and actual dispatch protection. Record each stage independently within the aggregated foreground unit."
      source_ids:
        - usda-wood-handbook-2021
        - dynea-prf-tds-2014
    - rule_id: boundary_emissions
      applies_to: "all emissions and wastes"
      rule: "Quantify actual releases after controls; captured dust and glue-bearing cleaning water remain waste transfers. Outdoor-air records never represent workshop exposure or water discharge. Screen actual species from current formulation/SDS and measurements; add each missing applicable exchange individually before dataset completion, including used hydraulic oil, other consumables and any measured water vapour. No toxicity-based flow is removed by a mass cutoff."
      source_ids:
        - dynea-prf-tds-2014
    - rule_id: boundary_carbon
      applies_to: "wood and adhesive carbon"
      rule: "Keep wood biogenic carbon and adhesive fossil/biogenic carbon separately in inputs, accepted beams, residues, water and air losses, with measured/verified composition. Upstream forest uptake is inherited once, never invented at the glulam plant. Stored product carbon is not a negative foreground emission or avoided-emission credit. If direct biogenic CO2 is actually emitted, retain it separately in LCI even if a GHG reporting convention omits it; there is no default combustion in this route."
      source_ids:
        - usda-wood-handbook-2021
    - rule_id: boundary_downstream
      applies_to: "downstream use"
      rule: "Exclude transport after dispatch, installation, structural service and end-of-life from this manufacturing gate. State capital and personnel boundary treatment and significance explicitly; omitted stages are not zero. Fuel-based on-site operations, purchased heat and different adhesive/curing routes require a reviewed inventory extension."
      source_ids:
        - usda-wood-handbook-2021
boundary_abstraction:
  declared_starting_condition: "Delivered kiln-dried graded untreated coniferous sawn lumber and separately purchased PRF components"
  starting_condition_role: "Gate-to-gate foreground beam manufacturing; purchased lumber drying is upstream"
  product_classification_scope: "CPC 3.0 31627; narrower"
  recursive_input_rule: "Purchased compatible material remains an explicit input with supplier-gate burdens; no recursive reuse of this finished-beam reference as an internal intermediate"
  upstream_dataset_requirement: "Matched kiln-dried lumber including forestry, sawmilling and drying; delivery transport; both formulated PRF components; electricity, water, packaging, maintenance and waste providers. Physical UUID and quantity/provider compatibility require separate checks"
  disclosure: "Site, cohort, receipt/dispatch gates, supplier exclusions, control routes, losses, stock changes, unresolved identities/providers and transport modelling. Gate-to-gate is not complete cradle-to-gate"
