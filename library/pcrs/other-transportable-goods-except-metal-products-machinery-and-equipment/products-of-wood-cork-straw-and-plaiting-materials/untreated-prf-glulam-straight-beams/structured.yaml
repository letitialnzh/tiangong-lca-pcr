measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh accepted finished beams using calibrated scales in cp_reference, tare packaging separately. Net accepted product contains actual water and cured adhesive; reject and test-sample masses are outside this denominator."
  - id: wood_moisture
    applies_to: "unglued wood and separated wood component"
    required_property_ref:
      name: "dry-basis water fraction"
      uuid: ""
    required_unit: "dimensionless"
    rule: "u=(m_wet-m_dry)/m_dry; m_dry=m_wet/(1+u); percentages must be divided by 100. Use representative paired wood samples and a documented oven-dry method; never apply wood u to total adhesive-containing glulam mass. Retain adhesive solids, water and volatiles separately. [usda-wood-handbook-2021 Ch.4 eqs.4-1/4-2.]"
  - id: solid_volume
    applies_to: "wood_input"
    required_property_ref:
      name: "Volume; matched mass"
      uuid: ""
    required_unit: "m3; kg"
    rule: "Measure actual solid dimensions/volume at the recorded wood moisture; mass conversion uses same-lot wet density, not nominal section or a species-average/basic density. Verify supplier m3 state and measurement convention before linking. Final beam volume and load service never replace the accepted-kg denominator."
  - id: electric_energy
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value database energy property"
      uuid: ""
    required_unit: "MJ"
    rule: "Meter delivered electrical kWh at the below-1-kV consumer boundary and convert to MJ by ×3.6. Match provider voltage, grid mix, geography, year and loss boundary; no fuel heat interpretation."
