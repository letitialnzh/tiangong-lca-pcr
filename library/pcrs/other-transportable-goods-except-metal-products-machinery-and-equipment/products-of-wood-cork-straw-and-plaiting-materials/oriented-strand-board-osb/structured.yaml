measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use calibrated net accepted finished-board dispatch mass in cp_reference; exclude packaging."
  - id: same_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Reference product mass"
      uuid: ""
    required_unit: "kg"
    rule: "Every exchange uses per 1 kg reference flow; sum attributable period totals and divide by net accepted finished OSB mass from cp_reference."
  - id: moisture_basis
    applies_to: "wood and board measurements"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Collect actual wet and dry mass with cp_material/cp_reference. Dry-basis moisture u=(wet-dry)/dry; wet-basis w=(wet-dry)/wet; dry=wet/(1+u). Record denominator and method; adhesive/wax solids are not dry wood. [usda-wood-handbook-2021]"
  - id: energy_boundary
    applies_to: "in_electricity, in_purchased_steam"
    required_property_ref:
      name: "Energy"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert measured kWh to MJ using 3.6 MJ/kWh. For steam use measured delivered-minus-return enthalpy including condensate reference. A database MJ unit alone does not establish that boundary."
  - id: nox_quantity_basis
    applies_to: "air_nox"
    required_property_ref:
      name: "Mass; verified quantity convention"
      uuid: ""
    required_unit: "kg"
    rule: "Before calculation, document the actual measured or factor-derived NOx quantity convention, chemical/species scope, concentration and gas-state basis and its independently verified relation to the selected LCI flow and assessment method. Native Mass/kg does not establish an NO2-equivalent convention. Keep actual NO/NO2 species quantities and documented conversion/speciation evidence when an equivalent basis is used; no universal conversion or assumed split. Reconcile any aggregate with separately modelled NO/NO2 and keep N2O separately, without counting the same release twice. Missing convention/speciation or LCI/assessment compatibility leaves the raw result and its normalized exchange pending review; never silently label a mass as NO2-equivalent or invent zero."
