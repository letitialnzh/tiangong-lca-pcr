allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Maintain the unallocated physical wood/water/carbon ledger first. Internal bark, untreated fines, resin-bearing trims and sanding dust have separate transfer records with source/destination, moisture, composition and equal handoff quantities at both ends. Internal reuse cancels at the aggregate plant boundary but remains visible in stage balances. Sold co-products, internal fuels and externally discarded wastes are mutually exclusive destinations for each portion. Never multiply physical co-product output or an internal link by an allocation fraction. [corrim-osb-us-2025]"
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Assign directly attributable resin, pressing, grade/finishing and packaging burdens to OSB. Subdivide joint stages before allocating residual shared burdens to marketed outputs; document a physically justified dry-material basis and test an economic alternative when the physical relationship is inadequate. The separate burden account may use a_j = d_j / sum(d_k), where d_j is measured eligible exported dry material of each joint output under one declared basis. Finished board dry solids include binder/wax and must not be called dry wood; disclose whether the causal allocation basis uses measured wood fraction or total dry solids. Internal fuel is not a marketed output in this export denominator: trace its processing and combustion to the heat consumer; shared exported energy requires a separate causal allocation. No automatic substitution credit. [corrim-osb-us-2025]"
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "p_osb"
      flow_role: "finished OSB denominator"
      record_type: "collected_record"
      raw_fields: "batch grade, accepted/rejected count, net wet mass, packaging mass, dimensions, actual density, moisture basis and test"
      collection_method: "Calibrated dispatch weighing excluding packaging; lot sampling for moisture and actual thickness/volume/density; reconcile production, stocks, grade test and dispatch. Sum net accepted finished mass; denominator for every per 1 kg reference flow quantity"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_material
      process_id: "p_osb"
      flow_role: "each wood raw input"
      record_type: "collected_record"
      raw_fields: "lot/species, gate, bark status, wet/dry mass, moisture, strand dimensions, supplier steps, start/end stocks"
      collection_method: "Weigh receipts and stocks; representative oven-dry sampling and strand geometry checks; distinguish raw logs, green strands and dry screened strands; verify supplier evidence. Receipts + opening stock - closing stock, adjusted for returns; divide actual consumed mass by net accepted finished OSB mass"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_recipe
      process_id: "p_osb"
      flow_role: "each resin/wax/coating by layer"
      record_type: "collected_record"
      raw_fields: "commercial formulation, resin chemistry, solids, carrier water, free monomer, face/core layer ID, dosing mass, layup orientation, cure settings"
      collection_method: "Calibrated dosing/load-cell and supplier certificate reconciliation by layer. Record each actual complete resin/wax/coating supply once in its verified wet/dry provider basis; retain PF/pMDI/wax/active/carrier/additive analytical subledgers without extra purchases. Require supplier formulation preparation/delivery once; real independently purchased additions and onsite mixing/utilities stay separate. Sum actual external consumption by supply and layer, divide by accepted net OSB mass, and preserve raw stock/loss/internal-transfer ledgers. No assumed recipe."
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_energy
      process_id: "p_osb"
      flow_role: "electricity, purchased heat, internal heat"
      record_type: "collected_record"
      raw_fields: "meter/stage, supply voltage/mix, kWh, steam mass/pressure/temperature, condensate return, reference enthalpy, useful heat, recovery routing"
      collection_method: "Calibrated stage meters; steam supply-return enthalpy balance and thermal-oil/hot-water circuit measurements; separate boiler, dryer, press and RTO ownership. Sum attributable external energy once by carrier; divide by net accepted finished OSB mass; internal heat stays in stage ledger"
      unit: "MJ"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_fuel
      process_id: "p_osb"
      flow_role: "each mass-based fuel by combustor; natural gas uses cp_gas"
      record_type: "collected_record"
      raw_fields: "fuel identity/route, receipts/stocks, wet mass, dry moisture, measured LHV, ash, carbon origin, boiler/dryer/RTO ID"
      collection_method: "Calibrated fuel meters/weighing and stock balance with fuel analysis. Separate internal untreated bark/fines from resin-bearing trim fuel; fossil binder carbon remains fossil. Sum each externally consumed fuel separately by stage; divide by net accepted finished OSB mass; equal internal handoffs retained outside external totals"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_water
      process_id: "p_osb"
      flow_role: "tap water and each water circuit"
      record_type: "collected_record"
      raw_fields: "source, makeup/return meter, stock, cooling, abatement, resin carrier, evaporation, discharge, water density"
      collection_method: "Meter fresh supplied water and actual density; record circulation separately; reconcile wet wood/resin water with evaporation and liquid/wet-residue exits. Sum new externally supplied water once; divide by net accepted finished OSB mass; no repeated circulation"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_packaging
      process_id: "p_osb"
      flow_role: "each packaging material"
      record_type: "collected_record"
      raw_fields: "material/route, stock, tare mass, packs dispatched, reuse/returns and replacements"
      collection_method: "Weigh actual consumed individual material, reconcile dispatch and replacements; keep separate from net board mass. Sum consumed dispatch material separately by identity; divide by net accepted finished OSB mass"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_residue
      process_id: "p_osb"
      flow_role: "each co-product, waste and internal transfer"
      record_type: "collected_record"
      raw_fields: "stream, source/destination stage, chemistry/resin, moisture/dry mass, sales/treatment route, stock, same handoff ID"
      collection_method: "Separate calibrated weighing and moisture/chemistry testing; internal links use equal quantities and state at both ends; reconcile physical ledger before allocating burdens. Sum actual external exits by atomic stream; divide by net accepted finished OSB mass; internal transfers excluded from plant external totals"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_emission
      process_id: "p_osb"
      flow_role: "each species/size fraction and stack"
      record_type: "collected_record"
      raw_fields: "stage/stack/control, measured species/CAS, carbon origin, concentration, dry/wet gas basis, actual gas flow/time, PM method/filterable/condensable definition, detection limits"
      collection_method: "Post-control stack tests/CEMS or documented site-equipment-specific calculation; include mobile equipment separately. Record missing versus zero, shared stack once, emission speciation and disjoint PM. Sum actual post-control emission mass separately by species/origin or disjoint size fraction; divide by net accepted finished OSB mass"
      unit: "kg"
      frequency: "per lot and monthly reconciliation"
      temporal_coverage: "One representative production period with seasonal/grade coverage"
      site_scope: "Same site, grade/recipe and gate definition"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, source records, samples, supplier/test records and stock closure"
    - protocol_id: cp_gas
      process_id: "p_osb"
      flow_role: "gaseous natural gas by combustor"
      record_type: "collected_record"
      raw_fields: "meter/stage; actual m3; absolute P in Pa; T in K; dry/wet basis; water mole fraction; composition; Z; supply volume definition; supplier background m3 state; calibration"
      collection_method: "Calibrated gas meter and supplier billing/state records; collect matched pressure, temperature, water, composition and Z. Keep direct dryer, boiler/heater and RTO subtotals. Record quantity on its actual measured state first, then apply gas_volume_state only when both volume definitions are known. Sum consumed volume by stage in the same defined state and divide by net accepted finished OSB mass. Unknown basis leaves background linkage unresolved; no database secondary mass coefficient as density."
      unit: "m3"
      frequency: "continuous metering with monthly reconciliation"
      temporal_coverage: "same representative period as cp_reference"
      site_scope: "same site and gas supplier"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, gas analysis, supplier volume-basis declaration and exact background-unit correspondence"
  calculation_rules:
    - id: gas_volume_state
      applies_to: "in_gas"
      rule: "For the same gas amount, V_supplier = V_meter × (P_meter/P_supplier) × (T_supplier/T_meter) × (Z_supplier/Z_meter) × f_water; P is absolute Pa, T is K and Z is composition-specific compressibility. When converting wet meter volume to dry supplier volume, f_water = 1 - measured water mole fraction; f_water = 1 only if both definitions have the same moisture basis. This relationship requires consistent composition, no gas loss and documented meter/supplier state. Do not assume standard conditions, dry gas or Z=1. Unknown state/composition or an incompatible supplier definition leaves the background link unresolved. Divide the verified matched-state period volume by cp_reference net accepted OSB mass."
      inputs:
        - cp_gas
        - cp_reference
        - "supplier state definition"
      output: "supplier-matched m3 per 1 kg reference flow"
      source_ids:
        - oiml-gas-volume-2007
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "For each atomic exchange, divide the attributable period total by net accepted finished OSB mass in the same period; finished_osb = 1 kg. Aggregate sites by summed amounts / summed reference masses only for comparable grades/routes and disclosed weighting."
      inputs:
        - cp_reference
        - "linked collection protocol"
      output: "amount per 1 kg reference flow"
      source_ids:
        - corrim-osb-us-2025
    - id: volume_density
      applies_to: "reference product"
      rule: "Actual volume = sum(accepted panel length × width × thickness); actual wet density = corresponding net wet mass / actual volume. Convert area declarations using actual thickness and matched density/moisture, never nominal density or survey defaults."
      inputs:
        - cp_reference
      output: "Matched product volume/density and mass conversion"
      source_ids:
        - usda-wood-handbook-2021
    - id: wood_water_carbon
      applies_to: "p_osb stage ledger"
      rule: "Reconcile dry wood separately from dry resin/wax/coating solids and water: incoming plus opening stocks equals products, co-products, waste, combustion/emission exits plus closing stocks, with explicit unresolved residuals. Carbon inputs and stocks reconcile stored board/co-product carbon and measured gas/ash/waste carbon; separate biogenic wood and fossil resin/fuel carbon. Do not force balance by altering logs or dropping biogenic CO2."
      inputs:
        - cp_material
        - cp_recipe
        - cp_reference
        - cp_residue
        - cp_emission
      output: "Unallocated physical mass/water/carbon ledgers"
      source_ids:
        - usda-wood-handbook-2021
        - corrim-osb-us-2025
    - id: pm_partition
      applies_to: "air_pm25, air_pmcoarse, air_pmover10"
      rule: "For one compatible post-control sampling method, disjoint PM2.5–10 = cumulative PM10 - cumulative PM2.5; PM>10 = compatible total PM - cumulative PM10. Use only nonnegative supported differences; otherwise keep missing fractions unresolved. Do not sum PM10 with its PM2.5 subset or add condensable PM twice."
      inputs:
        - cp_emission
      output: "Disjoint outdoor-air fractions"
      source_ids:
        - epa-osb-2002
        - epa-wood-boiler-2022
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "p_osb"
      requirement: "Verify actual long-strand architecture and layer-specific recipe, receipt gate and grade. Do not generalize regional species or survey recipes to this product."
      evidence: "usda-wood-handbook-2021; corrim-osb-us-2025; epa-osb-2002"
    - id: dq_data
      applies_to: "all inventory rows"
      requirement: "Retain meter/test calibration, representative periods, stocks and missing-versus-zero treatment. A conditional absent flow requires evidence of absence; missing measurement is not zero."
      evidence: "collection protocols"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Exact physical/chemical flow, route, property and unit. Unresolved identities cannot be substituted by neighbouring products, mixed packaging, correction flows, generic VOC totals or mismatched medium."
      evidence: "flow identity and supplier records"
validation_rules:
  - rule_id: v_reference
    applies_to: "finished_osb"
    rule: "Exactly one finished reference output; net mass excludes packaging; all qualifiers and the actual layer architecture/grade must be provided."
    source_ids:
      - corrim-osb-us-2025
  - rule_id: v_basis
    applies_to: "all inventory rows"
    rule: "Reference amount, normalization basis and collection denominator agree in both languages; physical, water, carbon and energy ledgers reconcile before burden allocation."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: v_emissions
    applies_to: "p_osb"
    rule: "Include biogenic CO2 and fossil binder/fuel carbon separately. Verify each emission species and medium; never replace sulfur dioxide with sulfur oxides, propanal with propanol, or MDI monomer with polymeric resin. Speciate remaining identified organics as additional atomic rows; a VOC total is a closure diagnostic, not added to its species."
    source_ids:
      - epa-osb-2002
      - corrim-osb-us-2025
  - rule_id: v_scope_extension
    applies_to: "p_osb"
    rule: "Add each actual unlisted fuel, chemical, refrigerant, packaging component, wastewater outlet pollutant or exported heat as a separate exact exchange with a collection protocol. Different binder/treatment/overlay variants require applicability review. No unexamined cut-off based on small mass."
    source_ids:
      - epa-osb-2002
  - rule_id: v_case_limits
    applies_to: "p_osb"
    rule: "CORRIM is a 23-facility US 2022/2023 survey (report submitted 2025-03-21, edited 2025-07-22). Its numeric density, moisture, fuel mix, adhesive rates, yields and allocation percentages are not defaults. Resolve its repeated PM labels and conflicting by-product percentage/species labels against primary records before numerical use."
    source_ids:
      - corrim-osb-us-2025
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Matching OSB material supply with declared grade, recipe, orientation, moisture and boundary; explicit upstream links for cradle-to-gate"
  excluded_use: "Direct comparison of building service without scenario/function; fixed industry life/performance; random waferboard/particleboard; unreviewed treatment/overlay/binder variants"
  required_metadata: "All reference qualifiers, linked foreground protocols, stage ownership, supplier background scope, physical and burden ledgers, allocation and uncertainty"
  required_quality_disclosure: "Actual temporal/geographic/grade coverage, identity/measurement gaps, emission method and limits; no publication or scientific-review claim"
  update_trigger: "Changed product grade/recipe, strand geometry/orientation, moisture/thickness/density, gate, supplier, energy/abatement route or new primary evidence"
data_sources:
  - id: "corrim-osb-us-2025"
    type: "literature"
    reference: "Maureen Puettmann, Life Cycle Assessment of Oriented Strand Board Production – United States; submitted 2025-03-21, revisions 2025-04-02/05-06, edited 2025-07-22. https://corrim.org/wp-content/uploads/2025/07/LCA-Report-OSB-07222025.pdf"
    used_for: "Sections 3.2.3–3.2.6, 4.3–4.8, 5.2–5.4.5; Tables 7, 9–12 and Figure 4. US 23 mills, 2022/2023; route and collection evidence only, not universal numeric defaults; table-label conflicts require primary-data resolution."
  - id: "usda-wood-handbook-2021"
    type: "handbook"
    reference: "USDA Forest Products Laboratory, Wood handbook—wood as an engineering material, FPL-GTR-282 (2021). https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf"
    used_for: "Chapter 11 pp.11–10–11–11, OSB/particleboard distinction and layer-specific resin; Chapters 4/13 moisture methods. Historical species/processing examples do not fix current grade, recipe, density or lifetime."
  - id: "epa-osb-2002"
    type: "official_guidance"
    reference: "US EPA, AP-42 10.6.1 Waferboard/Oriented Strandboard Manufacturing (March 2002). https://www.epa.gov/sites/default/files/2020-10/documents/c10s06-1.pdf"
    used_for: "Sections 10.6.1.1–10.6.1.3, Figure 10.6.1-1, pp.1–4: identity, route and emissions/control ownership. Historical US guidance combines WB/OSB; applicability and species/technology/fuel/control must be verified, no universal factors."
  - id: "epa-wood-boiler-2022"
    type: "official_guidance"
    reference: "US EPA, AP-42 1.6 Wood Residue Combustion In Boilers (March 2022). https://www.epa.gov/system/files/documents/2022-03/c1s6_final.pdf"
    used_for: "Sections 1.6.1–1.6.3 and Table 1.6-1 notes: separate boiler combustion, fuel/control dependence and filterable/condensable PM. Not a direct-fired OSB dryer factor or proof of contaminated-trim applicability."
  - id: "oiml-gas-volume-2007"
    type: "standard"
    reference: "OIML R 140, Measuring systems for gaseous fuel (2007 E), sections 7.3.1–7.3.3, pp.30–32. https://www.oiml.org/en/files/pdf_r/r140-e07.pdf"
    used_for: "Metering/reference conditions, pressure-temperature-compressibility volume conversion and associated measurements. Used for engineering state correspondence only, not current legal-compliance certification or fixed standard P/T. Wet-to-dry mole correction and OSB normalization are declared method derivations requiring actual composition and measured state."
