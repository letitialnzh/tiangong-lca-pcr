  production_route: "Delivered panel logs or externally supplied unresinated strands → actual drying/screening → face/core resin and wax blending → oriented layer forming → hot pressing → cooling, trimming, conditional sanding/edge sealing → grading/packing"
  market_state: "Finished factory-gate panel for further construction/manufacture; actual grade and moisture, no fixed end-use scenario"
functional_unit:
  what: "Supply an accepted OSB panel material, without claiming an equal building service across grades"
  how_much: "1 kg net finished OSB at declared dispatch moisture, excluding packaging"
  how_well: "Actual grade/standard, layer count/orientation, strand geometry, thickness, board density at defined moisture, layer binder recipe and surface state"
  how_long_or_cycle: "One production accounting period; no use-stage service life assigned"
  reference_flow_link: "finished_osb"
system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Use one integrated foreground inventory p_osb through grading/packing. Preserve the following collection stages independently: s_receive (yard/conditioning/debarking/stranding only if inside the gate); s_dry (drying and screening, per face/core furnish); s_blend (separate layer recipe); s_form (orientation and layup); s_press (press cycle and cure); s_finish (cooling, trimming, optional sanding and edge sealing); s_pack; s_heat (boiler/thermal heater and actual internal heat recovery); s_control (dust collection/WESP/RTO/water treatment). [corrim-osb-us-2025; epa-osb-2002]"
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Assign direct-fired dryer fuel and the combined drying/combustion exhaust to s_dry; separate boiler fuel, ash and its stack to s_heat. Put RTO auxiliary fuel and final emissions at s_control. Shared dryer/press/RTO stacks are measured once after controls, with documented originating stages. Boiler AP-42 guidance does not supply direct-fired dryer factors. Recovered RTO heat lowers measured purchased fuel/heat; an internal loop is not a negative external heat export. Do not book useful onsite heat and its fuel as two purchased supplies. If heat leaves the plant, define one exact export flow and metered delivery boundary separately. [epa-osb-2002; epa-wood-boiler-2022]"
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Receiving gate for logs with explicit bark status, or receiving gate for externally supplied green/dried unresinated strands; disclose transport already included"
  starting_condition_role: "foreground_entry"
  product_classification_scope: "CPC 3.0 31432 OSB subset stated in section 1; classification does not define grade"
  recursive_input_rule: "Purchased OSB is not a raw strand input and cannot be recursively substituted. Rework stays in physical stock/transfer records; no duplicate finished reference output."
  upstream_dataset_requirement: "Matching forestry/log preparation, externally supplied strand production, each resin/wax/coating, fuel, electricity, water and packaging background; receiving-gate freight separately if absent upstream. External waste treatment must be linked."
  disclosure: "Foreground gate-to-gate, including onsite heat and controls; cradle-to-gate requires explicit upstream connections. Excludes installation, use and end of life unless separately modelled."
