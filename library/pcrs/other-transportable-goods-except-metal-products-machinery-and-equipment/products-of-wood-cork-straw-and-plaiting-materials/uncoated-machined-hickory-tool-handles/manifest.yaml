  reference_identity_decision:
    selected_uuid: d07bf4c9-7cd0-46ad-a6b3-2fd11fe08f98
    physical_identity: Broad published foreground wood-material Product flow, Mass/kg.
      Species, product form, dimensions, treatment, moisture, production route and
      provider explicitly unspecified; no roadside, raw-only, coating, densification
      or manufacturing-route restriction. This physically includes the declared single-material
      solid hickory finished handle subset.
    pcr_restriction: One accepted bare, sanded, uncoated, untreated, unglued, undensified
      true-hickory finished tool handle; actual botanical species, grip/fit geometry,
      product state and delivered moisture declared; 1 kg net finished wood excluding
      packaging/heads/ferrules. No arbitrary mixed-material assembly or invented performance.
    role: Foreground physical reference locator, not a supplier dataset, wood-industry
      average, lifecycle production inventory or evidence of quantity/background compatibility.
    remaining_dataset_requirements: Actual supplier/foreground Q weighing and acceptance,
      moisture, botanical species, provider route/gates, background quantity convention
      and site coverage; unknowns remain explicit, not physically rejected solely
      because the locator is broad.
    history: Original ranked Wood material query did not return d07 and that omission remains honestly recorded; a known controller-supplied UUID was independently resolved by state100 direct read. A later bounded Sawdust untreated product query also returned the same broad physical locator. Neither event establishes an exact handle/background dataset.
