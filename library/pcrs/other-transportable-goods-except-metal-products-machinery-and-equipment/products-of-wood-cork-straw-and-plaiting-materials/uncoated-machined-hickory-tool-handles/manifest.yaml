review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  methodology_review: Independent bounded controller scientific-design review completed for the narrower qualified solid true-hickory finished-handle scope; no publication approval. Classification decisions remain governed by the canonical mapping and its ADR references.
  completion_status: Authored candidate with compatible broad physical identities and aligned bilingual methodology. Two waste identities confirmed with actual collected-state qualifiers; actual site quantities, composition and supplier/receiver background compatibility remain pending. No complete factory dataset or exact hickory-industry background claimed.
  identity_decision:
    boundary: Sanded, uncoated solid true-hickory replacement tool handles, ready
      for fitting to a specified striking or garden tool. Purchased kiln-dried non-coniferous
      sawnwood >6 mm; conventional machining. No densification, resin, coating, ferrule,
      metal tool head or brush body.
    scaffold_decision: Keep the broad retained 31911 scaffold unchanged. This new
      semantic identity specifies one solid-hickory tool-handle route and preserves
      incompatible umbrella products for separate controller classification review.
    mapping_recommendation: Narrower solid-hickory finished-handle scope; current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs. Mapping acceptance does not establish publication approval or a complete site dataset.
    overlap: 31330 is roughly trimmed wood without turning/bending/other working;
      finished accepted handle geometry is a downstream product. 31520 resin-free
      heat-densified blank route is excluded. Existing material shaped timber and
      sawnwood are feedstock/profiles, not finished tool handles.
  unresolved_flow_uuids: []
  source_limits:
    usda: FPL-GTR-282 chapters 2 and 13 verified. No numeric handle mass, service
      life, manufacturing yield or industry energy default.
    corrim: Northern softwood lumber survey examined for applicability; not adopted
      as hickory handle quantities or allocation factors.
    epa: 2014 PTE memorandum is Pacific Northwest sawmill guidance excluding boilers;
      not an actual-emission factor for turning/sanding. No coefficients or particle
      shares transferred.
    arnold: Exact publisher webpage independently reopened and confirms custom hickory handles and sanded/finished options. Author original/extraction registration remains null and metadata-only; controller browser observation is separate, not a claim of acquired HTML or manufacturer quantitative data.
  flow_metadata_debts:
  - row_id: offcut
    uuid: acc22294-8e77-4784-988f-2499be3c60eb
    issue: CPC39282 agglomerated classification conflicts with broad woodworking offcut
      name/comment; treatment route empty. Conditionally retain physical identity
      for clean unagglomerated hickory offcuts; require receiving facility and supplier/source-data
      classification clarification. Do not claim all metadata verified.
  qualified_waste_identities:
  - row_id: spent_abrasive
    uuid: f0a52dd6-0027-4033-9068-f293526f958f
    limitation: Broad surface-finishing spent-abrasive Waste/Mass/kg physically includes the actual removed whole paper-backed sanding consumable, mineral/binder/backing and attached hickory wood. No metal-only or loose-powder restriction; actual paper construction, component/moisture masses, wear, contamination and receiving treatment/provider compatibility remain pending. No belt construction or waste-fraction default inferred.
  - row_id: sanding_dust
    uuid: 2a6c9b60-a075-45ec-b611-c3b4dd255935
    limitation: Generic industrial collected Dust Waste/Mass/kg with unspecified composition and treatment. Use only actual separate captured hickory/mineral/binder sanding dust with measured composition, moisture, dry component masses/carbon and receiving/provider acceptance; not stack emissions, clean sawdust or removed paper consumables. No exact mixture/treatment background claim.
  source_provider_limits:
  - Electric source50657322 geographyCN, user-side grid AC below1kV; actual site/provider region/year/mix and delivery/loss-boundary compatibility pending.
  - Cardboard8bde297e sourceC/E/F flute, fibre>=80%, contains recycled material and recyclable; actual packaging must qualify. Recyclable is a physical compatibility limit, not actual recovery or avoided credit.
  - Sandpaperb09187da source furniture-plantCN is a context/provider limit, not proof of this handle site or supplier inventory; actual whole paper/mineral/binder specification and mass remain collected.
  background_compatibility: UUID confirmation establishes physical identity only.
    Supplier species, moisture, voltage, paper composition, abrasive formulation,
    freight functional unit and waste treatment basis remain dataset-specific collection/selection
    requirements.
