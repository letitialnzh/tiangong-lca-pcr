    reference: "USDA Forest Products Laboratory, Wood Handbook—Wood as an Engineering Material, FPL-GTR-282 (2021), chapter 2 p.2–7 (PDF35), chapter 13 pp.13–1–13–3 (especially PDF324, Eq.13–1 and sampling/meter limitations). [Official retained edition](https://www.govinfo.gov/content/pkg/GOVPUB-A13-PURL-gpo158673/pdf/GOVPUB-A13-PURL-gpo158673.pdf)"
    used_for: "True-hickory handle-stock identity; moisture/dry-mass measurement. Not a handle-manufacturing parameter survey."
  - id: "arnold-hickory-handles"
    type: "literature"
    reference: "H. Arnold Wood Turning, Hickory Tool Handles, publisher page sections Custom Hickory Handles for OEM Production, Common Uses, Finishing & Options; page timestamp 2026-08-19, read 2026-10-12. [Primary manufacturer document](https://www.arnoldwood.com/wood-products/handles/hickory-tool-handles/)"
    used_for: "Technical market evidence for specified hickory tool-handle components and sanded versus finished options; not peer reviewed, no quantitative or kiln-route defaults."
  - id: "epa-sawmill-pte-2014"
    type: "official_guidance"
    reference: "US EPA Region 10, Particulate Matter Potential to Emit Emission Factors for Activities at Sawmills, Excluding Boilers, Located in Pacific Northwest Indian Country (2014-05-08), pp.1–2, scope footnote and PM/PM10/PM2.5 table headings. [Official memorandum](https://www.epa.gov/sites/default/files/2016-09/documents/spmpteef_memo.pdf)"
    used_for: "Scope limitation and nested particle-indicator caution only. Regional sawmill PTE coefficients and softwood drying shares are not adopted for actual hickory handle machining."
