measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is the positive total accepted net handle wood mass for one declared homogeneous production cohort, weighed using a calibrated scale after acceptance and before packaging; collect with cp_reference. Every physical row uses the same Q."
  - id: moisture_basis
    applies_to: "wood_input; finished_handle; offcut; captured_sawdust; sanding_dust; spent_abrasive"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Keep delivered/received wet mass and oven-dry wood mass separate. u=(m_wet-m_dry)/m_dry is dry-basis moisture fraction; m_dry=m_wet/(1+u). Sample each state representatively; meter corrections and volatile-extractive uncertainty must be retained [usda-wood-handbook-2021]."
  - id: electricity_quantity
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "The platform uses this energy property for electricity. Convert measured kWh to MJ with 3.6; this is electrical energy, not fuel combustion heat. Match user-side voltage, region/year, supplier and losses before background linkage."
  - id: transport_quantity
    applies_to: "inbound_transport"
    required_property_ref:
      name: "mass*distance"
      uuid: "118f2a40-50ec-457c-aa60-9bc6b6af9931"
    required_unit: "kg*km"
    rule: "Sum shipment kg × leg km. A background unit of t*km requires conversion by 1000; neither a mass-only transport flow nor truck mass represents freight work."
  - id: count_conversion
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Piece counts support acceptance and yield only. Convert counts through actual calibrated net weighing for each model/moisture stratum; do not invent a universal kg per handle or density."
