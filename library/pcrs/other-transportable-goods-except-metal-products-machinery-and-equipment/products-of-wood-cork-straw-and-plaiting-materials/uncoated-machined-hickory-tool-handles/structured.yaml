allocation_rules:
  - rule_id: allocation_single_product
    applies_to: "handle_unit"
    rule: "This baseline has one accepted product and separately segregated wastes sent to disclosed receiving treatment/recovery facilities. Assign its attributable manufacturing burdens to accepted handles; record actual waste-treatment burdens and any separately declared recycling convention without automatic substitution credits. A saleable coproduct is not silently labelled waste: identify its physical state, recipient and economic function and establish a separately justified allocation rule before using a coproduct route."
    source_ids: []
  - rule_id: allocation_shared_services
    applies_to: "electricity; inbound_transport"
    rule: "First meter/separate shared operations. Where separation is infeasible, use documented causal machine-time/power or actual transport service shares, retain totals and sensitivity. Equal-share, value-share and dry-wood share are not interchangeable or universal defaults."
    source_ids: []
  - rule_id: allocation_physical_ledgers
    applies_to: "all inventory rows"
    rule: "Keep unallocated wood, water, carbon and packaging physical ledgers distinct from the environmental burden account. Never multiply real residue/product output quantities or either end of an internal link by burden-allocation shares. Rejected/reworked wood is reconciled once and not counted as accepted output twice."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_reference
      process_id: "handle_unit"
      flow_role: "finished_handle"
      record_type: "acceptance/weighing"
      raw_fields: "botanical species; model/drawing; stage accepted and rejected counts; batch net wet mass Q; tare; moisture samples; oven-dry wood mass; measured dry-wood carbon fraction and method; acceptance defects"
      collection_method: "Weigh accepted bare handles using a calibrated scale after acceptance, excluding packaging; representative moisture sampling and oven-dry comparison or species-corrected meter with documented uncertainty. Retain grip/fit and grade checks."
      unit: "kg; count; moisture fraction"
      frequency: "Each accepted lot; representative moisture by lot/state"
      temporal_coverage: "Complete declared production period"
      site_scope: "Selected handle site and homogeneous cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration, tare records, drawing, inspection and moisture test originals"
    - protocol_id: cp_wood
      process_id: "handle_unit"
      flow_role: "wood_input"
      record_type: "receipt/stock/weighing"
      raw_fields: "botanical species; kiln-drying delivery gate; incoming dimensions >6 mm; receipt kg; opening/closing stock; reject/rework movements; moisture at each state; dry-wood carbon fraction from representative analysis or traceable compatible supplier evidence; supplier dataset basis"
      collection_method: "Trace invoices and inventory, weigh actual consumed net wood, sample moisture in each state; reconcile upstream stock species, treatment/drying and delivered quantity definition."
      unit: "kg; moisture fraction"
      frequency: "Each receipt and stock movement"
      temporal_coverage: "Same period as Q"
      site_scope: "Feedstock lots for selected cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier and batch records, calibration, moisture tests and background gate declaration"
    - protocol_id: cp_energy
      process_id: "handle_unit"
      flow_role: "electricity"
      record_type: "metering"
      raw_fields: "stage meter readings kWh; dates; voltage; supplier/region/year; extraction/compressor/packing meter or causal shared-service evidence; idle/startup quantities"
      collection_method: "Read calibrated meters; retain attributable stage and common-service totals, idle/startup coverage and utility invoice reconciliation. Electricity mix and user-side losses are selected separately."
      unit: "kWh; MJ"
      frequency: "Continuous or each production shift"
      temporal_coverage: "Same period as Q, representative duty cycles"
      site_scope: "Selected line plus attributable services"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, invoice reconciliation and service allocation records"
    - protocol_id: cp_aux
      process_id: "handle_unit"
      flow_role: "abrasive; packing_board"
      record_type: "invoice/stock/weighing"
      raw_fields: "new abrasive mineral/binder/backing/grit and mass; cardboard flute/fibre/recycled content and mass; opening/closing stock; stage losses; equipment bill and maintenance auxiliaries"
      collection_method: "Weigh actual fresh consumption with stock adjustment; distinguish whole abrasive paper from loose mineral; check packaging specification. Inspect maintenance and supplement every real lubricant/tool replacement as its own flow; exclude unrelated stock."
      unit: "kg"
      frequency: "Each issue and replacement/packing lot"
      temporal_coverage: "Same period as Q"
      site_scope: "Selected line and packaging cohort"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier specifications, weighing/stock records, maintenance bill and gap register"
    - protocol_id: cp_transport
      process_id: "handle_unit"
      flow_role: "inbound_transport"
      record_type: "freight records"
      raw_fields: "leg; supplier gate; shipment kg; actual distance km; truck/load class; allocation/load/empty-return definition; delivered dataset transport inclusion"
      collection_method: "Reconcile waybills and actual road legs; use shipment masses and distances, record background vehicle/load basis and prevent overlap with delivered material datasets."
      unit: "kg; km; kg*km"
      frequency: "Each inbound shipment"
      temporal_coverage: "Same cohort supply period as Q"
      site_scope: "Actual inbound legs only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Waybills, routing evidence, supplier delivery coverage and background quantity definition"
    - protocol_id: cp_residue
      process_id: "handle_unit"
      flow_role: "offcut; captured_sawdust; spent_abrasive; sanding_dust"
      record_type: "waste dispatch/stock tests"
      raw_fields: "segregated stream; mass/tare; opening/closing stock; wood moisture; wood/mineral fraction and each component dry carbon fraction; glue/coating status; destination/treatment; receipt; economic status"
      collection_method: "Weigh each distinct stream at dispatch with calibrated scales; retain moisture and representative wood/mineral composition, receiver acceptance and treatment evidence. Keep clean cutting dust, contaminated sanding dust and spent paper separate."
      unit: "kg; moisture and wood/mineral fractions"
      frequency: "Each dispatch, representative composition per stream/lot"
      temporal_coverage: "Same period as Q"
      site_scope: "Every waste source and receiving facility"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Waste receipts, calibration, contamination tests and receiver specifications"
    - protocol_id: cp_emission
      process_id: "handle_unit"
      flow_role: "pm25; pmcoarse; pmover10"
      record_type: "environmental release testing/activity"
      raw_fields: "source/control state; concentration and gas flow; test duration; operating hours; aerodynamic cut and filterable/condensable convention; wood/mineral carbon fraction; fugitive sampling; detection limits"
      collection_method: "Obtain representative actual after-control source tests and matched activity logs; document fugitives separately. Use compatible cumulative particle tests or directly measured exclusive bins. Unmeasured sources/unknown compatible size splits are gaps, not zero."
      unit: "kg; mg/m3; m3; h"
      frequency: "Representative source tests plus continuous activity/control logs"
      temporal_coverage: "Same period as Q with documented extrapolation"
      site_scope: "Actual environmental release points and fugitive sources, excluding captured waste and workplace exposure"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Original reports, method compatibility, controls, activity, uncertainty, medium and double-count audit"
  calculation_rules:
    - id: normalize_reference
      applies_to: "all inventory rows"
      rule: "x_i=q_i/Q; q_i is the attributable inventory-adjusted physical cohort total in its own unit. Q is accepted final net wood kg excluding packaging for that same cohort. Reference output Q/Q=1 kg. This normalization is not burden allocation."
      inputs:
        - q_i
        - Q
        - cp_reference
        - "linked protocol"
      output: "x_i per 1 kg reference flow"
      source_ids: []
    - id: calculate_moisture
      applies_to: "wood_input; finished_handle; offcut; captured_sawdust; spent_abrasive; sanding_dust"
      rule: "u=(m_wet-m_dry)/m_dry; m_dry=m_wet/(1+u); m_water=m_wet-m_dry; m_dry>0. u is a fraction: divide dry-basis percent by 100. For mixed sanding residues, first separate measured wood mass from mineral/binder mass; do not apply wood moisture to the whole mixture."
      inputs:
        - cp_reference
        - cp_wood
        - cp_residue
      output: "Wood dry mass and associated water kg"
      source_ids:
        - usda-wood-handbook-2021
    - id: calculate_electricity
      applies_to: "electricity"
      rule: "Energy_MJ=3.6 × attributable electricity_kWh; x_electricity=Energy_MJ/Q. Do not apply calorific-value or boiler-efficiency factors to electricity."
      inputs:
        - cp_energy
        - Q
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: calculate_transport
      applies_to: "inbound_transport"
      rule: "Work_kgkm=sum(shipment_kg × leg_km); Work_tkm=Work_kgkm/1000; x_transport=Work_kgkm/Q. Retain actual load/empty-return conventions in the compatible background service rather than counting the same leg twice."
      inputs:
        - cp_transport
        - Q
      output: "kg*km per 1 kg reference flow"
      source_ids: []
    - id: calculate_particles
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "E25=E_PM2.5; Ecoarse=E_PM10-E_PM2.5; Elarge=E_filterable_total-E_PM10. Only matched method/source/control/time/quantity basis permits subtraction; each fraction must be nonnegative within reported uncertainty. Air mass from concentration × actual matching gas volume uses 1 mg=0.000001 kg. Sum actual source interval emissions before dividing by Q. Do not sum nested PM2.5, PM10 and total as separate releases."
      inputs:
        - cp_emission
        - Q
      output: "Exclusive kg per 1 kg reference flow"
      source_ids:
        - epa-sawmill-pte-2014
    - id: reconcile_physical_ledgers
      applies_to: "all inventory rows"
      rule: "Dry wood input + opening dry stock = accepted dry wood + offcut dry wood + captured clean dry wood + measured wood in spent paper/sanding dust + wood-origin airborne particulate + closing dry stock + unexplained residual. Water input + opening water + measured uptake = water in accepted wood/residues + measured release + closing water + water residual. Carbon input + opening carbon = carbon in accepted wood/residues + wood-origin airborne carbon + closing carbon + carbon residual, using each measured dry carbon fraction. Any actual volatile carbon release needs a separate specific emission extension. Net atmospheric moisture exchange requires evidence, not a zero assumption. Quantify residuals and uncertainty; do not rename unmeasured loss as zero or manufacture an emission. Keep paper/mineral packaging and abrasive balances separate; internal transfers retain equal ends then cancel."
      inputs:
        - cp_reference
        - cp_wood
        - cp_aux
        - cp_residue
        - cp_emission
      output: "Separate physical dry-wood, water and carbon balances, residuals and material composition ledgers"
      source_ids:
        - usda-wood-handbook-2021
  data_quality_requirements:
    - id: quality_identity
      applies_to: "finished_handle"
      requirement: "Confirm one published usable reference flow and compatible property/unit basis before a completed dataset; no neighbouring-product substitution"
      evidence: "Verified identity plus drawing, species and acceptance records"
    - id: quality_quantities
      applies_to: "all inventory rows"
      requirement: "Preserve raw period totals, stage quantities, stock/rework adjustments, one common Q, actual uncertainty and all source coverage; no generic numeric defaults"
      evidence: "Linked protocols and separate physical/burden ledgers"
    - id: quality_background
      applies_to: "UUID-bearing flows"
      requirement: "Physical identity and background quantity compatibility are separate checks. Match wood species/drying/moisture, abrasive/board specification, user voltage and supply boundary, freight kg*km/t*km and receiver treatment; metadata contradiction or unknown compatibility is pending"
      evidence: "Supplier primary definitions, support property/unit records and dataset gates"
    - id: quality_completeness
      applies_to: "all inventory rows"
      requirement: "Unknown amounts or identities, uncovered equipment auxiliaries, volatile releases if present, atmospheric moisture exchanges and incompatible particle methods prevent a claim of complete LCI; make actual extensions atomic"
      evidence: "Site bill, gap register, source tests, stock balances and coverage audit"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_handle"
    rule: "Exactly one accepted finished product output uses the declared reference object and net 1 kg basis. Confirm its physical identity and quantity support; the broad locator must always carry the declared actual wood species, finished handle form, treatment/route, moisture and net mass qualifiers. Identity confirmation does not establish supplier/background quantity compatibility."
    source_ids: []
  - rule_id: validate_basis
    applies_to: "all inventory rows"
    rule: "English and Chinese use the same cohort Q, 1 kg net wood denominator, source IDs, row IDs, protocols and conversions. Counts, gross packed mass, dry mass and delivered wet mass cannot silently replace that denominator."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_route
    applies_to: "handle_unit"
    rule: "Verify solid true-hickory finished tool-handle status, final grip/fit, no densification/resin/coating/impregnation or installed metal. Neither 31330 rough sticks nor 31520 densified blanks satisfy it."
    source_ids:
      - usda-wood-handbook-2021
      - arnold-hickory-handles
  - rule_id: validate_atomic
    applies_to: "all inventory rows"
    rule: "Each selected flow is one exchange with verified reference property and unit. Missing identities stay concrete and unresolved; do not replace elementary emissions with correction/aggregate flows, or waste sandpaper with unused sandpaper."
    source_ids: []
  - rule_id: validate_mass_carbon
    applies_to: "all inventory rows"
    rule: "Review unallocated stock/wood/water/carbon balances and residuals with measured uncertainty. Captured wood, wood on paper, contaminated dust and environmental emissions are disjoint. Do not drop real biogenic CO2 from upstream/waste-treatment LCI or assign a universal wood-carbon fraction."
    source_ids:
      - usda-wood-handbook-2021
  - rule_id: validate_particles
    applies_to: "pm25; pmcoarse; pmover10"
    rule: "Confirm outdoor-air unspecified compartment and matching exclusive size definitions; exclude indoor exposures, nested double counting, negative interval differences and unsupported PTE-to-actual conversion."
    source_ids:
      - epa-sawmill-pte-2014
  - rule_id: validate_readiness
    applies_to: "all inventory rows"
    rule: "Confirm qualified reference applicability. Resolve waste identity gaps, real site coverage and supplier/background compatibility before declaring complete LCI; independently review methodology before reviewed status. Authored candidate guidance remains review-required. A passed mechanical check does not establish scientific approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset after actual foreground collection, identity completion and independent review"
  downstream_use: "background_dataset for fitting the declared uncoated solid-hickory handle into a separately modelled tool; no such dataset is produced by this PCR"
  allowed_use: "Compatible species/model/drawing, moisture, route, gate and quantity basis after gaps are resolved"
  excluded_use: "Lifetime/service substitution; complete tools; generic all-wood industry averages; cleaning handles/brush bodies; shoe lasts; coated, glued or densified handles; unsupported environmental declarations"
  required_metadata: "Reference UUID and properties, model/drawing/species, state/moisture and net mass, period/site, starting gate, process map, supplier/background gates, waste receivers, protocols and calculation versions"
  required_quality_disclosure: "Sampling/meter coverage, uncertainty, material/particle/biogenic-carbon ledgers, auxiliary extensions, supplier compatibility, allocation choices and remaining gaps"
  update_trigger: "Changed species/geometry/drying/finish/densification route, equipment/control/packaging, supplier quantity definitions, reference metadata or new evidence"
data_sources:
