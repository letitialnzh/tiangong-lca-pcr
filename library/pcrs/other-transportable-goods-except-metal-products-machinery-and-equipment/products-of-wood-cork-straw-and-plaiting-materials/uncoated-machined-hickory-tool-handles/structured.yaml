system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "handle_unit"
      rule: "Include receipt, sorting/rejects, sawing, turning/shaping, fitting features, sanding, extraction, inspection, packing and attributable shared electricity. Purchased kiln drying remains upstream. No onsite kiln, boiler, coating, adhesive application, thermal densification or metal-head assembly belongs to this route."
      source_ids:
        - usda-wood-handbook-2021
        - arnold-hickory-handles
    - rule_id: boundary_completeness
      applies_to: "all inventory rows"
      rule: "Inspect the actual equipment/material bill and maintenance log. Add every consumed lubricant, cutting tool, packaging component and resulting waste as a separately named atomic row if present; no collective placeholder, silent cut-off or unmeasured zero. Onsite internally generated compressed air is covered by its compressor electricity; purchased air would need a separate flow."
      source_ids: []
    - rule_id: boundary_carbon
      applies_to: "upstream and foreground ledgers"
      rule: "Retain biogenic CO2 in any actual upstream or separately modelled waste-treatment combustion LCI even if an LCIA convention excludes it from a headline total. No default onsite combustion is created by this dry mechanical route. Product carbon stock is disclosed separately; avoid a duplicate atmosphere uptake already represented upstream."
      source_ids: []
    - rule_id: boundary_emissions
      applies_to: "pm25; pmcoarse; pmover10"
      rule: "Measure actual post-control environmental releases and segregate captured wastes. EPA PTE sawmill factors exclude boilers and do not establish actual hickory turning/sanding releases or universal particle shares. Newly found species or moisture exchange require explicit atomic extensions and identity checks."
      source_ids:
        - epa-sawmill-pte-2014
