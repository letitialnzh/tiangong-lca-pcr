review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  methodology_review:
    status: "pending_independent_review"
    scientific_approval: false
  classification_review:
    proposed_relation: "narrower"
    decision: "Narrower scope retained. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate. Supports non-integrated virgin chemical-pulp unpigmented printing/writing paper, not all woodfree paperboard or mixed-furnish products."
  unresolved_flow_uuids:
    - row_id: "starch_wet"
      flow_name: "Cationic starch for papermaking"
      reason: "Conditional on the actual wet-end recipe. Verify modification, substitution, delivered solids and dry-active basis; generic native starch is not proof of a cationic derivative."
    - row_id: "cover_board"
      flow_name: "Recycled paperboard protective lid"
      reason: "Actual recycled-paperboard protective lid requires flat/layer construction, fibre route and coating evidence. Optical-assembly/electronic-case records and unspecified multi-material packaging do not establish this specific flat-board identity; do not assume corrugated construction from cardboard wording."
    - row_id: "tss"
      flow_name: "Total suspended solids, to fresh water"
      reason: "Only actual final-discharge suspended solids, with filtration method and dry-solids basis. A water-unspecified record or dissolved-solids record does not establish this freshwater suspended-solids identity."
  unresolved_compatibility:
    - row_id: "purchased_heat"
      reason: "GCV/MJ identity does not establish the supplier useful-heat quantity definition; require steam pressure, enthalpy/condensate and supplier correspondence."
    - row_id: "gas_pipeline"
      reason: "Supplier reference gas T/P, wet/dry composition, compressibility and background m3 definition require site evidence."
    - row_id: "nox"
      reason: "NO2-equivalent versus species-mass reporting must match monitor, LCI and LCIA; Mass/kg is insufficient."
    - row_id: "aox"
      reason: "Laboratory chlorine-equivalent must match aggregate flow/LCIA quantity definition."
    - row_id: "lng"
      reason: "e874 quantitativeReference internalID0 is Mass/kg, not Volume at ID1. Source reference Mass meanValue0.45 is a quantity anomaly, not density or default conversion; actual supplier mass/reference agreement, liquefaction-to-delivery gate/transport, cryogenic composition, tank stocks/vaporization/BOG and region/year remain required."
    - row_id: "wrapper_paper"
      reason: "936 conditional actual unbleached/uncoated kraft wrapper: supplied fibre/route/form/moisture and native Mass/gate/region/year agreement; no default virgin/recycled recipe, bag or polymer-layer substitution."
    - row_id: "ww_urea"
      reason: "3f actual CAS57-13-6 industrial ammonia/CO2-synthesis urea matching supplied grade/assay/form and native Mass reference; actual treatment recipe, water/impurities/coating and supplier region/year/gate required. Unspecified N nutrients do not establish use or dose."
    - row_id: "ww_acid"
      reason: "939 generic finished Phosphoric acid source has no CAS/concentration/route assay; actual H3PO4/CAS7664-38-2 is supplier evidence, not verified raw CAS. Supplied formulation/purity/water/active-vs-product Mass and actual manufacturing/gate/region/year correspondence required, no85%/wet-process/recipe default."
    - row_id: "collected_dust"
      reason: "2a conditional actual externally dispatched nonmetal paper-cutting collector dust, measured stock/tare/moisture/fibre/filler/sizing/carbon/hazard and lawful receiver/treatment/native as-collected Mass; total capture, internal return and emission bins separate, no default positive quantity or collection rate."
    - row_id: "discharged_water"
      reason: "5e is liquid Water freshwater emission Volume/m3, not resource/vapour. Actual mixed-liquid mass/volume/density, measured water fraction and compatible water-component density/state/reference required. Bulk volume remains pollutant-load basis; all indicators retain the named freshwater boundary, no default1000density or all-effluent-is-water assumption."
    - row_id: "grid_electricity"
      reason: "Raw supply geographyCN; actual supplier/region/year,1–35kV user gate/loss/native MJ background correspondence required. Physical AC identity is not a global grid background."
    - row_id: "akd_size"
      reason: "Actual supplied AKD emulsion complete formulation and native product-vs-active/carrier reference agreement; no whole emulsion mass silently treated as pure AKD or duplicated carrier/additives."
    - row_id: "retention_aid"
      reason: "Actual supplied CPAM formulation/charge/active/carrier and native product quantity correspondence; supplied product or components counted once, separately from actual wastewater use."
    - row_id: "ww_cpam"
      reason: "Same broad CPAM identity in a separate real treatment exchange; actual supplied formulation and receiver-stage/native quantity must match, not inferred from wet-end recipe."
  source_metadata_debts:
    - row_id: "pe_film"
      reason: "Names/CAS9002-88-4/comment identify PE film; source CPC29220 is inconsistent, supplier/source classification clarification remains open."
    - row_id: "wrapper_paper"
      reason: "936 names include uncoated packaging paper but source CPC32129 graph-paper classification does not verify the kraft-wrapper subset; actual unbleached uncoated kraft route/supplier background and source-classification clarification remain pending. Reference printing-paper output uses its independently constrained applicable subset."
    - row_id: "filler_gcc"
      reason: "699 generic Calcium carbonate source has no CAS or processing descriptor and is classified mineral-family15200; actual GCC particle/state/route/chemical/reference and supplier background required. No default CAS assay or slurry solids."
    - row_id: "filler_pcc"
      reason: "699 generic Calcium carbonate physical family can conditionally locate actual PCC, but mineral-family15200 does not verify precipitation manufacture. Actual route/particle/chemical/slurry-vs-dry native Mass/gate/region/year agreement required; raw CAS absent."
  unresolved_range_evidence: "No universal recipe, input, loss or emission ranges adopted. BREF has heterogeneous/historical examples and single-mill observations; require reporting-period foreground measurements before dataset release."
  furnish_verification: "Public Munken Pure and mill documents support woodfree uncoated product and external pulp route; they do not disclose brand-specific kraft/sulfite species proportions. Supplier lot certificates and actual issue records must resolve each selected pulp row; never infer absence of wood fibres or a kraft-only furnish."
