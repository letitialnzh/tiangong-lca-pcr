system_boundary:
  rules:
    - rule_id: boundary_mill
      applies_to: "mill production"
      rule: "Include reception, stock preparation, forming/pressing, drying, actual sizing/after-drying, calendering, rewinding/cutting, packaging and mill acceptance; stage meters remain distinct within one aggregate foreground unit."
      source_ids:
        - arctic-munkedal-emas-2024
        - jrc-pulp-paper-bref-2015
    - rule_id: boundary_upstream
      applies_to: "supplier interfaces"
      rule: "Do not move chemical-pulp cooking, bleaching or recovery into a non-integrated paper mill. Link the actual upstream chemical-pulp route and all external deliveries; inbound transport is linked separately if not in supplier delivery datasets."
      source_ids:
        - jrc-pulp-paper-bref-2015
    - rule_id: boundary_utilities
      applies_to: "utility and treatment ownership"
      rule: "Include actual onsite production/treatment operations and direct emissions once, or use supplier datasets for external operations. A contracted boiler on the premises still needs explicit ownership/boundary; no imported heat plus duplicated provider exhaust. If using self-generated electricity, identify its generator and emissions instead of relabelling it grid power."
      source_ids:
        - arctic-munkedal-emas-2024
    - rule_id: boundary_water
      applies_to: "water circuits"
      rule: "Record actual abstraction/purchased make-up, final discharge, product/sludge water, evaporation, return/export and storage change. White-water recirculation, broke return and condensate have equal physical quantities at both ends and no repeated environmental exchange."
      source_ids:
        - jrc-pulp-paper-bref-2015
    - rule_id: boundary_dust
      applies_to: "dry finishing and exhaust"
      rule: "Inspect cutting and rewinding dust sources and final outlets/fugitive releases; distinguish released particle fractions from captured dust and internally recycled material. Combustion dust uses actual included boiler evidence, not woodworking or sawmill factors."
      source_ids:
        - jrc-pulp-paper-bref-2015
    - rule_id: boundary_exclusions
      applies_to: "downstream operations"
      rule: "Stop at accepted unprinted reels/sheets at mill gate. Printing images/text, ink, binding, books, use, offsite delivery and end-of-life are downstream modules, never paper-mill manufacturing inventory."
      source_ids:
        - arctic-munken-pure-specification
    - rule_id: boundary_extensions
      applies_to: "actual recipe and equipment"
      rule: "The listed conditional flows are specific candidates, not a universal recipe. Every additional actual chemical, filler, packaging component, fuel, water source, refrigerant leak, waste and emission needs a separate atomic exchange and collection evidence; no bundled residual row or silent omission."
      source_ids:
        - jrc-pulp-paper-bref-2015
    - rule_id: procurement_preparations
      applies_to: "bought complete slurry, sizing and treatment preparations"
      rule: "Bought complete preparations are one compatible whole supplied-product exchange with their supplier manufacture, formulation/dispersion/emulsification, utilities, losses, packaging and delivery retained once. Constituents remain analytical composition/fate unless an explicitly evidenced supplier-expanded formulation inventory retains every one of those actual operations and boundaries; that expanded inventory and the whole supply are mutually exclusive for the same quantity. Pure ingredient UUIDs do not alone identify a complete preparation. Actual independently bought onsite additions, dilution/mixing water, utilities and losses remain separate real exchanges. Keep unknown complete-product identity/reference compatibility specific and unresolved; do not invent recipes or preparation factors."
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "External pulp/additives/packaging received at mill, external electricity/heat delivered, or river water abstracted onsite; end at accepted unprinted paper dispatch"
  starting_condition_role: "Physical foreground interface, not an upstream cut-off or zero-burden claim"
  product_classification_scope: "Narrower subset of CPC 3.0 32129: non-integrated virgin chemical-pulp printing/writing paper only"
  recursive_input_rule: "Same-grade internal broke remains a measured matched loop inside the mill; an external same-category paper input must be recorded and linked upstream, with a separate applicable method if its furnish/route changes category"
  upstream_dataset_requirement: "Named supplier-compatible pulp, filler, chemical, packaging, utility and external-treatment datasets; identity UUID is not a complete supplier dataset"
  disclosure: "Report onsite/offsite ownership and utility/treatment boundaries, actual steam reference state, internal loops, grade change, rejected output, transport boundary and missing foreground/background data"
