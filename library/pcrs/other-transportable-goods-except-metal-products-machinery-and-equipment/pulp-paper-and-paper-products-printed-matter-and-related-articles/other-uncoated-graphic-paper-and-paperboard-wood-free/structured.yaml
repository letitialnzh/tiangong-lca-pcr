allocation_rules:
  - rule_id: allocation_subdivision
    applies_to: "shared mill burdens"
    rule: "First subdivide grades/lines and support operations using actual meters and campaign records. Dedicated quantities go to their grade; shared residuals use documented causal drivers (dry fibre throughput, measured heat, machine hours or treatment pollution load as physically appropriate), not one assumed mass ratio for every burden."
    source_ids: []
  - rule_id: allocation_physical_ledger
    applies_to: "physical balances and links"
    rule: "Preserve the complete unallocated physical process map, dry-solids/water/carbon balances and equal internal-link quantities. Allocation applies only to attributable environmental burdens after physical reconciliation; never multiply the physical paper, co-product, waste or internal-transfer output by a burden share."
    source_ids: []
  - rule_id: allocation_residues
    applies_to: "broke, dust and sludge"
    rule: "Internal recovery is a real loop with its energy and losses included, without avoided virgin-pulp credit. External material recovery/treatment is recorded gross with ownership and destination; if a stream is demonstrably a saleable co-product, require real receiver-accepted specification/function and lawful product/use status rather than payment alone, then establish the physical function and governing allocation method separately, with sensitivity where a causal relation is unavailable."
    source_ids:
      - jrc-pulp-paper-bref-2015
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "paper_mill"
      flow_role: "Accepted net paper"
      record_type: "dispatch/scale/test records"
      raw_fields: "grade; order; gross paper lot; packaging/core tare; rejects; reel/sheet area/count; moisture; grammage; surface/acceptance results"
      collection_method: "Calibrated net weighing after all finishing; product tests and traceable measured moisture; reconcile production/dispatch and stock change Aggregation and reconciliation requirements: Sum accepted net paper Q; express accepted reference output as 1 kg; do not divide by machine reels before cutting losses"
      unit: "kg; g/m2; mass fraction"
      frequency: "Batch/shift continuous records; monthly reconciliation; applicable emission sampling plan"
      temporal_coverage: "Same complete representative period, normally twelve consecutive months"
      site_scope: "All represented grades, lines and included support operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; tare/quality tests"
    - protocol_id: cp_furnish
      process_id: "paper_mill"
      flow_role: "Pulp species and process lots"
      record_type: "supplier/receipt/issue/stock records"
      raw_fields: "supplier; pulp grade; species; hardwood/softwood; kraft/sulphite process; bleaching; virgin/recovered claim; net lot mass; measured solids; stock movement; background reference quantity"
      collection_method: "Weigh and reconcile opening stock plus receipts minus closing stock and transfers; retain supplier certificates and solids sampling for each incompatible lot Aggregation and reconciliation requirements: Preserve wet/dry physical balances; attribute grade consumption, divide by Q kg net accepted paper for per 1 kg reference flow"
      unit: "kg; dry-solids fraction"
      frequency: "Batch/shift continuous records; monthly reconciliation; applicable emission sampling plan"
      temporal_coverage: "Same complete representative period, normally twelve consecutive months"
      site_scope: "All represented grades, lines and included support operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier certificates; calibrated weights; solids tests"
    - protocol_id: cp_materials
      process_id: "paper_mill"
      flow_role: "Each filler, sizing and treatment chemical"
      record_type: "batch/SDS/issue/stock records"
      raw_fields: "chemical identity; CAS where relevant; modification/charge; delivered concentration; active solids; carrier water; batch dose; return/loss; process stage; supplier route; actual whole-product or supplier-expanded inventory choice; supplier preparation/emulsification utilities and losses; supplied packaging/delivery gate; independently bought onsite additions"
      collection_method: "Weigh batches and reconcile tanks/stock; resolve formulated-product versus constituents accounting once, keeping each physical exchange atomic Aggregation and reconciliation requirements: Grade-attributed amount / Q kg net accepted paper, per 1 kg reference flow; retain full physical water/chemical totals separately. Bought complete preparations are one compatible whole supplied-product exchange with their supplier manufacture, formulation/dispersion/emulsification, utilities, losses, packaging and delivery retained once. Constituents remain analytical composition/fate unless an explicitly evidenced supplier-expanded formulation inventory retains every one of those actual operations and boundaries; that expanded inventory and the whole supply are mutually exclusive for the same quantity. Pure ingredient UUIDs do not alone identify a complete preparation. Actual independently bought onsite additions, dilution/mixing water, utilities and losses remain separate real exchanges. Keep unknown complete-product identity/reference compatibility specific and unresolved; do not invent recipes or preparation factors."
      unit: "kg; active-solids fraction"
      frequency: "Batch/shift continuous records; monthly reconciliation; applicable emission sampling plan"
      temporal_coverage: "Same complete representative period, normally twelve consecutive months"
      site_scope: "All represented grades, lines and included support operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "SDS; supplier specs; scales; dose logs"
    - protocol_id: cp_energy
      process_id: "paper_mill"
      flow_role: "Electricity by production stage"
      record_type: "meter/invoice/allocation records"
      raw_fields: "supply/generator; voltage; grid versus own generation; meter/stage; kWh; shutdowns; shared loads; causal driver"
      collection_method: "Calibrated stage meters reconciled to site purchase/generation records; identify generator background rather than assuming zero burden for own power Aggregation and reconciliation requirements: 3.6 × attributable kWh / Q kg net accepted paper, per 1 kg reference flow; no duplicate purchased/self-generated amount"
      unit: "kWh; MJ"
      frequency: "Batch/shift continuous records; monthly reconciliation; applicable emission sampling plan"
      temporal_coverage: "Same complete representative period, normally twelve consecutive months"
      site_scope: "All represented grades, lines and included support operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; invoices; voltage; allocation workbook"
    - protocol_id: cp_heat
      process_id: "paper_mill"
      flow_role: "Imported heat definition and enthalpy"
      record_type: "supplier/steam/condensate/heat-meter records"
      raw_fields: "supplier reference energy definition; steam kg; actual absolute/gauge pressure; temperature; quality; condensate mass/enthalpy; losses; imported/exported energy; site allocation"
      collection_method: "Calibrated heat or mass/condition meters plus verified thermodynamic property method; reconcile supply and returned condensate enthalpy to supplier background basis. Retain pending when definition differs/unknown Aggregation and reconciliation requirements: Compatible attributable delivered energy / Q kg net accepted paper, per 1 kg reference flow; no direct provider emissions duplicated"
      unit: "MJ; kg; pressure; temperature"
      frequency: "Batch/shift continuous records; monthly reconciliation; applicable emission sampling plan"
      temporal_coverage: "Same complete representative period, normally twelve consecutive months"
      site_scope: "All represented grades, lines and included support operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier reference definition; calibrated meters; enthalpy reconciliation"
    - protocol_id: cp_fuel
      process_id: "paper_mill"
      flow_role: "Each actual onsite fuel"
      record_type: "receipts/tank/gas-meter analysis"
      raw_fields: "fuel route; liquid/gas state; mass/volume; T/P; dry/wet gas; composition; Z; calorific basis; stock change; vaporization; boil-off; background unit definition"
      collection_method: "Calibrated receipt mass or state-defined gas volume, supplier analysis and tank reconciliation; reference-state conversion only from actual compatible conditions Aggregation and reconciliation requirements: Fuel consumed after stock reconciliation and grade attribution / Q kg net accepted paper, per 1 kg reference flow; report real gas losses separately"
      unit: "kg; m3; MJ"
      frequency: "Batch/shift continuous records; monthly reconciliation; applicable emission sampling plan"
      temporal_coverage: "Same complete representative period, normally twelve consecutive months"
      site_scope: "All represented grades, lines and included support operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; supplier T/P/composition and reference-state statement"
    - protocol_id: cp_water
      process_id: "paper_mill"
      flow_role: "Abstraction, make-up and internal water"
      record_type: "flow meters/levels/moisture/balance"
      raw_fields: "intake source; purchased water; treatment; flow; density/temperature for kg conversion; returns; circuits; product/sludge water; evaporation; stocks"
      collection_method: "Meter external intakes/returns; reconcile stage loops and measured product/residue moisture; estimate evaporation only by verified water/exhaust balance and retain residual uncertainty Aggregation and reconciliation requirements: Each compatible external water exchange / Q kg net accepted paper, per 1 kg reference flow; internal loops reported in physical ledger only"
      unit: "m3; kg"
      frequency: "Batch/shift continuous records; monthly reconciliation; applicable emission sampling plan"
      temporal_coverage: "Same complete representative period, normally twelve consecutive months"
      site_scope: "All represented grades, lines and included support operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meters; measured density/moisture; balance closure"
    - protocol_id: cp_packaging
      process_id: "paper_mill"
      flow_role: "Each delivered package component"
      record_type: "packing bill/weight/ownership"
      raw_fields: "component; polymer/paper construction; supplier; transferred mass; cores; pallets; return system; reuse count; rejects"
      collection_method: "Weigh each component and reconcile packing bills and return records; identify actual film polymer and protective-board construction Aggregation and reconciliation requirements: Actual attributable component use / Q kg net accepted paper, per 1 kg reference flow; packaging excluded from Q"
      unit: "kg; use count"
      frequency: "Batch/shift continuous records; monthly reconciliation; applicable emission sampling plan"
      temporal_coverage: "Same complete representative period, normally twelve consecutive months"
      site_scope: "All represented grades, lines and included support operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "packing specification; scales; return ledger"
    - protocol_id: cp_residues
      process_id: "paper_mill"
      flow_role: "Each external solid residue and internal return"
      record_type: "weighing/collector/treatment manifests"
      raw_fields: "stream; source; wet/dry mass; solids; filler/chemical contamination; recovered dust; internal return; external destination; ownership"
      collection_method: "Separate weighing/tickets and solids samples for paper trim, collector dust, primary and biological sludge; reconcile mixed-stream totals without duplication Aggregation and reconciliation requirements: External grade-attributed residue / Q kg net accepted paper, per 1 kg reference flow; equal internal returns retained before burden allocation"
      unit: "kg; solids fraction"
      frequency: "Batch/shift continuous records; monthly reconciliation; applicable emission sampling plan"
      temporal_coverage: "Same complete representative period, normally twelve consecutive months"
      site_scope: "All represented grades, lines and included support operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weighbridge; collector logs; solids tests; receiver records"
    - protocol_id: cp_effluent
      process_id: "paper_mill"
      flow_role: "Final freshwater discharge and each indicator"
      record_type: "flow/lab/composite sampling"
      raw_fields: "outlet; named freshwater recipient; time interval; bulk effluent volume/mass; measured bulk/water-component densities and actual water fraction/reference state; COD/BOD duration; TSS method; TN as N; TP as P; AOX as Cl; detection limits; bypasses; background concentration"
      collection_method: "Flow-weighted final-discharge sampling and calibrated discharge meters; use applicable validated EN/ISO/national-equivalent methods. BREF BAT10 monitoring frequencies/footnotes guide coverage, not default annual masses. Establish source-specific COD–TOC correlation if substituting TOC Aggregation and reconciliation requirements: Interval pollutant loads and external discharge attributed to grade / Q kg net accepted paper, per 1 kg reference flow; retain non-overlapping intervals"
      unit: "m3; mg/L; kg indicator"
      frequency: "Batch/shift continuous records; monthly reconciliation; applicable emission sampling plan"
      temporal_coverage: "Same complete representative period, normally twelve consecutive months"
      site_scope: "All represented grades, lines and included support operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "accredited lab; standards; flowmeter; detection-limit and timing audit"
    - protocol_id: cp_air
      process_id: "paper_mill"
      flow_role: "Each direct species/particle release"
      record_type: "stack/fugitive/collector/carbon records"
      raw_fields: "source; included boiler or cutting line; outlet/control; airflow; T/P; moisture/O2 basis; concentration; interval; size-bin convention; fossil/biogenic carbon; NOx quantity convention; collector mass; leaks"
      collection_method: "Measure actual exhaust and relevant fugitives after controls with compatible volume/concentration state; retain particulate-size and gas-specific method. Use validated site carbon balances for CO2 when direct measurement is unavailable; no sawmill factor or generic paper factor Aggregation and reconciliation requirements: Sum source/time loads once and attribute burdens / Q kg net accepted paper, per 1 kg reference flow; particle bins or unsized total mutually exclusive"
      unit: "kg; mg/m3; m3; carbon kg"
      frequency: "Batch/shift continuous records; monthly reconciliation; applicable emission sampling plan"
      temporal_coverage: "Same complete representative period, normally twelve consecutive months"
      site_scope: "All represented grades, lines and included support operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "monitor calibration; state/O2 basis; source list; carbon/collector balance"
  calculation_rules:
    - id: calc_normalize
      applies_to: "all inventory rows"
      rule: "Normalized exchange = attributable reporting-period exchange / Q; Q = kg net accepted paper from cp_output. Keep the unallocated physical exchange separately; reference output equals 1 kg."
      inputs:
        - "linked collection protocols and raw records"
      output: "normalized exchanges and separate physical balances"
      source_ids: []
    - id: calc_stock
      applies_to: "pulp, chemicals, fuel, packaging"
      rule: "Physical consumption = opening stock + receipts - closing stock - external transfers, with return/loss reconciliation. Dry solids = measured delivered mass × measured dry fraction; no default air-dry convention."
      inputs:
        - "linked collection protocols and raw records"
      output: "normalized exchanges and separate physical balances"
      source_ids: []
    - id: calc_balance
      applies_to: "dry solids, water and carbon"
      rule: "Reconcile separate dry-solids, water and fossil/biogenic/carbonate carbon ledgers before allocation, including every physical product, internal loop, residue, discharge, evaporation and stock change; preserve unexplained residuals and do not force them to zero. COD/BOD/AOX diagnostics are not additional physical mass outputs."
      inputs:
        - "linked collection protocols and raw records"
      output: "normalized exchanges and separate physical balances"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: calc_heat
      applies_to: "purchased_heat"
      rule: "Delivered heat = incoming steam enthalpy flow - returned condensate enthalpy flow - documented boundary losses not already included in the delivery measurement, using actual states and a verified thermodynamic property method; link only after matching supplier GCV/MJ quantity definition. Calorific-value labels alone are insufficient."
      inputs:
        - "linked collection protocols and raw records"
      output: "normalized exchanges and separate physical balances"
      source_ids: []
    - id: calc_effluent
      applies_to: "water pollutant indicators"
      rule: "Interval kg load = concentration (mg/L) × interval discharge (m3) × 0.001; integrate matching intervals, retaining O2/N/P/Cl definition and detection-limit treatment; divide attributable total by Q. Do not infer a pollutant quantity from a BAT limit."
      inputs:
        - "linked collection protocols and raw records"
      output: "normalized exchanges and separate physical balances"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: calc_air
      applies_to: "direct gases and particles"
      rule: "Integrate concentration × compatible exhaust/fugitive volume, converting mg to kg with 0.000001. Match dry/wet, T/P and O2 normalization; particle total = measured disjoint bins, or one unsized total, never both. Carbon-balance CO2 = oxidized carbon mass × 44/12, using separate evidenced origins and subtracting carbon leaving in other measured forms."
      inputs:
        - "linked collection protocols and raw records"
      output: "normalized exchanges and separate physical balances"
      source_ids: []
    - id: calc_water_component
      applies_to: "discharged_water"
      rule: "M_liquid = measured final mixed-liquid mass or sum(V_liquid_i × measured rho_liquid_i); M_water = sum(M_liquid_i × measured water fraction_i); V_water = sum(M_water_i / compatible rho_water_i). Validate actual density/state/reference and water-content method; native water V_water/Q once. Bulk V_liquid remains the matched pollutant-load volume, not automatically pure water."
      inputs:
        - cp_effluent
        - cp_water
        - "actual fraction/density/reference"
        - Q
      output: "Actual freshwater water-component m3 per 1 kg accepted paper; unknown compatibility stays unresolved"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "pulp and product"
      requirement: "Verify kraft/sulphite, species, bleaching and non-dissolving identity per supplier lot; public product descriptions do not prove the actual recipe."
      evidence: "Supplier certificates, issue records and product tests"
    - id: dq_completeness
      applies_to: "all exchanges"
      requirement: "Prove occurrence or absence; distinguish missing from zero and include every actual additive, utility, residue and emission extension. Inventory identified high-impact substances separately where possible; COD/BOD/N/P/AOX indicators cannot hide them or replace their chemical identities, and overlapping diagnostics are not extra physical mass."
      evidence: "Source list, balances and meter coverage"
    - id: dq_compatibility
      applies_to: "UUID and quantity/background"
      requirement: "Assess physical identity separately from reference quantity and supplier-background compatibility; do not substitute neighbouring products, species or media for gaps."
      evidence: "Direct identity, supplier quantity definitions and reconciliation"
    - id: dq_period
      applies_to: "all foreground records"
      requirement: "Use one period, grade and boundary; report shutdown, grade changes, abnormal operation, measurement error and allocation sensitivity."
      evidence: "Period originals and uncertainty ledger"
    - id: dq_sources
      applies_to: "sources and quantity ranges"
      requirement: "Single-mill/BREF historical data do not provide universal recipes, amounts, emission factors or empirical bounds; a GHG summary cannot replace species LCI."
      evidence: "Source applicability, measurements and gap disclosure"
validation_rules:
  - rule_id: validation_scope
    applies_to: "product and furnish"
    rule: "Confirm non-integrated unprinted uncoated chemical-pulp printing/writing paper and all exclusions; require real supplier process/species evidence, not woodfree shorthand or classification label alone."
    source_ids: []
  - rule_id: validation_reference
    applies_to: "reference_out"
    rule: "Require exactly one accepted reference output of 1 kg with mass reference property/unit group, net paper basis and complete qualifiers; no internal transfer repeats the reference output."
    source_ids: []
  - rule_id: validation_measurement
    applies_to: "all rows"
    rule: "Require the same Q denominator in EN/ZH inventory, collection aggregation and calculations, with calibrated measurements and explicit moisture/solids conversions; unknown compatibility remains pending, not passing."
    source_ids: []
  - rule_id: validation_balances
    applies_to: "physical and allocated ledgers"
    rule: "Check dry solids, water and carbon before allocation; verify both ends of internal links, output before/after cutting and acceptance, residue destinations and separately allocated burdens; do not scale physical outputs by a burden share."
    source_ids: []
  - rule_id: validation_utilities
    applies_to: "energy supply"
    rule: "Verify source/route, exact reference property, supplier quantity definition and steam/gas states; external heat generation and onsite fuel combustion are mutually exclusive for the same delivered heat. Require distinct evidence for own electricity generation."
    source_ids: []
  - rule_id: validation_emissions
    applies_to: "air and final fresh water"
    rule: "Require exact medium/submedium/species/origin and quantity compatibility; do not use correction flows, duplicate NOx with NO/NO2, or drop biogenic CO2. Include dry-cutting/rewinding exhaust, fugitives and collected dust. Use disjoint particle bins or an alternative measured unsized total without overlap."
    source_ids:
      - jrc-pulp-paper-bref-2015
  - rule_id: validation_release
    applies_to: "foreground dataset handoff"
    rule: "An unresolved UUID, supplier-background basis, actual recipe, quantity, measurement gap or unsupported calculation prevents claiming a complete dataset. Declare checks performed/skipped, gaps and uncertainty; authored method is not scientific approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Site/grade-specific gate-to-gate non-integrated paper manufacture"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Paper-manufacturing foreground and compatible upstream-linked supply-chain models for the explicitly restricted grade, with complete evidence and quantities"
  excluded_use: "Integrated pulp manufacture; printed books/content; universal woodfree/CPC coverage; incompatible fibre/surface routes; claims based on unresolved quantities or identities"
  required_metadata: "All reference qualifiers; actual stage map; Q; physical/allocated ledgers; suppliers/background units; atomic exchange identities and units; source conditions; allocation/cut-offs; receiving media and waste destinations"
  required_quality_disclosure: "Meter/laboratory coverage and methods, representative period, missing identity or unit compatibility, proxy/background gaps, uncertainty, balance residuals, exact source applicability and review state"
  update_trigger: "Changed pulp species/process/bleaching, surface recipe, mill boundary, grade/delivery form, utility/treatment supplier, measured performance, allocation or source evidence"
data_sources:
  - id: "jrc-pulp-paper-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Production of Pulp, Paper and Board (2015), https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Chapter 7 §§7.1.1–7.1.10 (printed pp660–670), §7.2.2.3 introduction (p687) and Table7.7 (p688), BAT10 (p788), BAT50 Table8.20 (p811), wood-free glossary (p850). Process/method scope for stock, forming, drying, recycling, sizing, cutting dust and water monitoring; historical numbers are not recipes or emission quantities, and coating/integrated sections are not imported into this boundary."
  - id: "arctic-munkedal-emas-2024"
    type: "literature"
    reference: "Arctic Paper Munkedals AB, Environmental Report 2024, https://production.arcticpaper.com/globalassets/arcticpaper.com/09-support/certificates--statements/certificates/emas/emas2024_apm_eng.pdf"
    used_for: "Reporting year2024; original verifier dated2025-06-25. Printed pp3,5–7,12–15,18–20: real purchased-pulp mill manufacture, sizing/finishing and treatment. Public descriptions do not establish grade-specific recipes. Annual averages are single-site cases; air figures include external purchased-steam emissions and cannot be copied as direct mill emissions. No amounts/defaults adopted."
  - id: "arctic-munken-pure-specification"
    type: "literature"
    reference: "Arctic Paper, Munken Pure product specification, https://production.arcticpaper.com/brands/munken/munken-design-range/munken-pure/"
    used_for: "Basic information, Surface, Woodfree declaration and laminated-paper footnote: real uncoated offset-printing product, reel/sheet delivery and laminated exclusions. Producer targets do not define a universal functional or recipe guarantee; printability does not include the printing process."
