  title: Paper and paperboard, creped, crinkled, embossed or perforated
  mapping_type: narrower
version: 0.1.0
review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review: pending independent scientific review; controller identity and authoring-contract review completed,
    not publication
  scope_decision: One uncoated white chemical-pulp nominal 250 g/m2 fine-paper grade, two-sided mechanically roller-embossed
    linen, delivered as unprinted protected flat sheets from purchased unembossed base paper. No generic creping
    method.
  mapping_recommendation: "narrower to CPC 3.0 32142; only this physical route and endpoint, Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  deduplication: Existing 32129 uncoated virgin chemical-pulp printing/writing method can supply unembossed base
    paper, but does not cover linen roller embossing endpoint. Reviewed 32131 Yankee tissue and intake 32133 Clupak
    sack paper, filter/glassine/lamination/coating routes are distinct and excluded.
  unresolved_flow_rows: []
  provider_debts:
    steam_heat: GCV/MJ native identity has no pressure hard constraint; actual P/T/quality and k_bg net-enthalpy
      correspondence pending. CN supplier/location compatibility mandatory.
    electricity: Below 1 kV CN customer-side identity only with actual compatible provider; do not assign a Chinese
      mix to the representative European commercial product.
    lubricating_oil: Petroleum-fraction identity records 40.5 MJ/kg descriptor; actual formulation/descriptor compatibility
      required, not adopted as method factor.
    carton: Actual printed cut/fold/laminate folding paperboard ream carton only, as recorded in full EN/ZH direct
      metadata; incompatible corrugated carton or fibre split not presumed.
    waste_carton: Native identity includes 2% expert estimate; explicitly rejected as quantitative default.
    captured_dust: Broad industrial captured dust physically restricted to actual paper fibre/filler with contamination
      and receiver assay; EN/ZH comments differ in descriptive detail, no universal dust composition accepted.
    whole_effluent: Broad Waste liquid limited to measured paper-equipment water-only cleaning effluent transferred
      offsite; actual composition and receiver required.
    condensate_return: Only actual treated boiler-water condensate accepted by the industrial steam supplier for
      reuse, with verified composition, treatment history, quality specification and point of return, fits this
      broad industrial Process Water identity. Retain actual temperature, pressure, density and whole returned kg
      independently of heat-service MJ; returning it is neither a new purchased water supply nor a sale with an
      automatic substitution credit. The heat-service accounting includes documented return enthalpy once. Contaminated
      rejected water requires its own waste-state row and receiver; dairy condensate and pressure-specific supplied
      steam cannot substitute.
    waste_pe: Only actual unwashed LDPE protective-film scrap/unwrapping waste discarded separately at the converter
      gate fits this industrial discarded-material subset of Waste solid. Weigh its whole as-transferred mass and
      record LDPE/additives, adhering paper, dirt, moisture, actual solid state and receiver before linking compatible
      treatment. Retain the specific physical stream separately from wooden pallets despite the shared broad UUID.
      No washing, recycling yield, hazard status or treatment is inferred; cleaned recycling feed, PET and cord
      fabric remain incompatible substitutes.
    waste_pallet: Only an actual whole used wooden pallet discarded by this converter, including retained metal
      fasteners, fits this industrial discarded-article subset of Waste solid. Weigh full as-transferred mass and
      document species, wood moisture, preservatives, fasteners, contamination and receiver. Shipped or returned
      reusable pallets are physical packaging transfers, not this waste. Do not scale discarded mass by pallet service
      allocation, combine it with film waste, or infer crushing, agglomeration, hazard status or downstream treatment.
      Primary woodworking offcuts cannot represent this used whole article.
  source_limitations:
  - BREF printed670/PDF708 finishing mechanism only; no dust fraction, energy factor or assumed converter pulper.
  - Favini technical sheet header 19.09.2022 differs from archive name 16092022; PDF metadata modified March2026.
    Nominal250g/m2 identifies the commercial grade, not actual mass, default moisture/tolerance or recipe.
  - Ricoh June2021 PDF page3 corroborates actual uncoated textured LN2/S 250 grade; historical printer test does
    not establish current printing performance or any environmental factor.
  - Gmund original rendered DOM supports roll embossing with/without steam only; does not establish Favini as-run
    factory configuration.
  - No full ISO536/287 procedures acquired; producer table identifies methods only, actual validated laboratory
    SOP required.
