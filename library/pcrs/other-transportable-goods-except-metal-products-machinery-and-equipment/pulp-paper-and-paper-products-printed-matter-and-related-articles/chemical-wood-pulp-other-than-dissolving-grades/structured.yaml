measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reference output is 1 kg at the stated AD-equivalent basis. Measure net shipment mass and lot dry fraction using cp_output; sum accepted dry pulp solids and divide by 0.9 to obtain accepted reference-flow mass. Exclude wire, non-pulp packaging, rejected pulp and internal wrapping diversion."
  - id: volume_compatibility
    applies_to: "chips; gas; oxygen"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Preserve the actual Tiangong reference property. Chips require solid/bulk convention and measured packing; gases require supplier T/P, composition and normal/operating-volume equivalence. Quantity or background link stays pending when correspondence is unknown."
  - id: chemical_basis
    applies_to: "mass-referenced solid, hydrate and liquid chemical inputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record solid, hydrate or solution identity and actual assay. A 30% H2O2 solution is counted as solution kg; other chemicals must use the declared supplier active/solution reference basis, with carrier water reconciled once. Internal liquor is not make-up. Gas reagents such as oxygen preserve their native Volume/m3 reference under volume_compatibility; supplier purity/species mass may be an auxiliary composition ledger but is not a replacement mass exchange. Actual reference conditions and provider quantity correspondence remain required."
  - id: electricity_basis
    applies_to: "power"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Convert actual metered electrical kWh using 3.6 MJ/kWh; do not apply boiler efficiency or primary-energy factors to this exchange. Imported and exported power are separate measurements."
  - id: steam_balance
    applies_to: "internal steam ledger"
    required_property_ref:
      name: "Delivered heat"
      uuid: ""
    required_unit: "MJ"
    rule: "Measure steam mass, inlet/outlet pressure, temperature, condensate return and enthalpy differences; retain producer/consumer balances. Steam MJ property alone never proves net delivered heat. Unknown enthalpy prevents declaring heat-balance closure."
