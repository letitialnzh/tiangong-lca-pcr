allocation_rules:
  - rule_id: allocation_internal
    applies_to: "recycled liquor and steam"
    rule: "Internal black liquor, recovered alkali, condensates, steam and returned fibres carry the existing process burdens through their links. No waste credit, external input burden or allocation factor is created for an internal transfer."
    source_ids:
      - jrc-pulp-bref-2015
  - rule_id: allocation_separate_ledgers
    applies_to: "physical and burden accounting"
    rule: "Keep the unallocated mass/water/carbon/energy process ledger separate from the allocated environmental-burden ledger. Tall oil, turpentine and power retain their full measured physical outputs; never multiply co-product physical masses by the pulp allocation share. The normalized pulp reference remains 1 kg."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_hierarchy
    applies_to: "joint burdens"
    rule: "First directly assign separately measured operations, such as tall-oil acidulation or export power transformation. Investigate subdivision/system expansion; for a product-specific attributional dataset, justify any rejection of expansion. Allocate remaining joint burdens by a demonstrated causal physical relationship; if none is defensible, use documented same-period gate-value shares with sensitivity. No fixed allocation share or default credit is supplied."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_wastes
    applies_to: "residues and treatment"
    rule: "Classify each actual external residue by documented destination and applicable product/waste status. Treatment and transport burdens remain explicit. A recovery or sale intention alone does not establish zero burden or avoided production. Avoid simultaneous allocation and displacement credit for the same co-product."
    source_ids:
      - eu-pef-allocation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "kraft_market_mill"
      flow_role: "saleable pulp and external co-products"
      record_type: "shipment and quality records"
      raw_fields: "timestamp; batch; grade; species blend; gross/tare/wire/wrapping masses; net wet mass; dry fraction; product tests; stock change; tall oil/turpentine quantity and condition"
      collection_method: "Calibrated scale and dispatch/stock reconciliation; representative pulp lot oven-dry testing to constant mass, with documented temperature, sampling, volatile-loss assessment and repeatability; retain wet mass and dry solids separately. Aggregation: Sum accepted net dry pulp solids / 0.9 to derive reference-flow mass; each external co-product retains its measured amount per 1 kg reference flow."
      unit: "kg; dry fraction"
      frequency: "Each lot; monthly reconciliation"
      temporal_coverage: "12 consecutive representative months; justify a complete shorter start-up/campaign period separately"
      site_scope: "All declared mill stages and actual boundary outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; timestamps; test methods; reconciliation; uncertainty and gap records"
    - protocol_id: cp_material
      process_id: "kraft_market_mill"
      flow_role: "specific material inputs"
      record_type: "receipts issues and stock records"
      raw_fields: "flow identity; supplier; formulation/assay; hydrate; route; wet/dry mass; volume/packing; opening/closing stock; issue by stage"
      collection_method: "Reconcile actual receipts plus opening stock minus closing stock and transfers; calibrate scales/volume instruments and retain supplier SDS/specifications and actual dose logs. Aggregation: Sum actual external material use; divide each atomic flow by accepted reference-flow mass, per 1 kg reference flow; circulating recovery chemicals excluded from external use."
      unit: "kg; m3; assay"
      frequency: "Each receipt/issue; monthly"
      temporal_coverage: "12 consecutive representative months; justify a complete shorter start-up/campaign period separately"
      site_scope: "All declared mill stages and actual boundary outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; timestamps; test methods; reconciliation; uncertainty and gap records"
    - protocol_id: cp_utility
      process_id: "kraft_market_mill"
      flow_role: "gas oxygen and electricity"
      record_type: "meter and supplier records"
      raw_fields: "meter id; stage; imports; exports; generator; kWh; m3; temperature; pressure; composition; dry/wet basis; compressibility; supplier reference conditions; voltage; losses"
      collection_method: "Calibrated separate boundary meters, stage submeters and supplier bills; reconcile grid imports/export/self-generation and gas/oxygen reference volumes. Measure internal steam enthalpy separately in cp_balance. Aggregation: Sum each external metered exchange on its verified reference-unit basis / accepted reference-flow mass, per 1 kg reference flow; no import-export netting."
      unit: "kWh; MJ; m3"
      frequency: "Continuous totals; monthly"
      temporal_coverage: "12 consecutive representative months; justify a complete shorter start-up/campaign period separately"
      site_scope: "All declared mill stages and actual boundary outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; timestamps; test methods; reconciliation; uncertainty and gap records"
    - protocol_id: cp_water
      process_id: "kraft_market_mill"
      flow_role: "river abstraction final effluent and water loads"
      record_type: "flow meters and laboratory analyses"
      raw_fields: "intake/outlet ids; basin; liquid volumes; concentration; COD oxidation method; BOD conditions; N/P basis; AOX halogen equivalence; chlorate species; filter/drying method; uncertainty; selected-flow/LCIA water-quantity convention and proof; actual outlet mixture composition/H2O fraction; component mass; measured matched mixture density where used; temperature/pressure/phase; compatible H2O density/state/reference conversion and uncertainty"
      collection_method: "Measure gross intake and final freshwater discharge independently. Flow-proportional composite sampling with accredited methods; declare monitoring frequency per permit/process variation; concentration × matched discharged volume, with actual units and non-detect rules. Preserve missing intervals and individual hazardous-species analyses. Keep the entire bulk effluent volume for these load integrals and physical records. Determine waterreturn only under its proven selected-flow/LCIA quantity convention, using measured component and matched density/state evidence where the convention needs H2O-equivalent volume; no assumed additive component volumes or universal density. Unknown correspondence leaves that Water quantity pending without discarding bulk discharge or independently supported pollutant loads. Aggregation: Sum intake, separately recorded bulk discharge, convention-compatible waterreturn quantity where proven, and each final-outlet analytical load separately / accepted reference-flow mass, per 1 kg reference flow; never count internal wastewater transfer as emission."
      unit: "m3; mg/L; kg"
      frequency: "Continuous flow; justified sampling schedule"
      temporal_coverage: "12 consecutive representative months; justify a complete shorter start-up/campaign period separately"
      site_scope: "All declared mill stages and actual boundary outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; timestamps; test methods; reconciliation; uncertainty and gap records"
    - protocol_id: cp_air
      process_id: "kraft_market_mill"
      flow_role: "final air emissions"
      record_type: "stack fugitive and laboratory records"
      raw_fields: "outlet; equipment; species/CAS; mass basis; wet/dry/normal gas conditions; concentration; exhaust flow; operating hours; captured NCG; abatement state; fuel/wood-carbon origin; PM cumulative/bin definitions; detection limits"
      collection_method: "Use CEMS, representative calibrated stack tests and justified fugitive-source measurements; match concentration and exhaust volume on the same conditions/time. Speciate reduced sulphur and carbon origin; identify disturbances, bypass and start-up. No historical AP-42 emission factor is adopted. Aggregation: Sum actual final-outlet mass for each atomic species/origin/non-overlapping particle bin / accepted reference-flow mass, per 1 kg reference flow."
      unit: "kg; mg/m3; m3; hours"
      frequency: "Continuous/representative tests including disturbances"
      temporal_coverage: "12 consecutive representative months; justify a complete shorter start-up/campaign period separately"
      site_scope: "All declared mill stages and actual boundary outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; timestamps; test methods; reconciliation; uncertainty and gap records"
    - protocol_id: cp_waste
      process_id: "kraft_market_mill"
      flow_role: "external waste transfers"
      record_type: "weighbridge assay and treatment receipts"
      raw_fields: "origin; wet mass; solids; salts/metals; contamination; hazard status; external treatment; transport; internal recycling/combustion"
      collection_method: "Calibrated transfer weights and representative dry-solids/composition tests; reconcile treatment receipts with site records and account for inventory changes. Aggregation: Sum each specific external waste stream / accepted reference-flow mass, per 1 kg reference flow; internal recovery material is not external waste."
      unit: "kg; dry fraction"
      frequency: "Each shipment; monthly"
      temporal_coverage: "12 consecutive representative months; justify a complete shorter start-up/campaign period separately"
      site_scope: "All declared mill stages and actual boundary outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; timestamps; test methods; reconciliation; uncertainty and gap records"
    - protocol_id: cp_balance
      process_id: "kraft_market_mill"
      flow_role: "internal physical links and allocation evidence"
      record_type: "stage meter balance and joint-cost ledger"
      raw_fields: "link id; sender/receiver; time; wet/dry mass; carbon/Na/S/Ca; liquor solids; internal fibre; steam T/P/enthalpy; condensate; inventory changes; uncertainty; co-product price at gate; allocation justification"
      collection_method: "Meter both ends of internal flows on the same basis and reconcile stocks; retain separate real physical and allocated environmental ledgers. Determine carbon provenance through wood/chemical/carbonate transfers, not stack location alone. Document directly assigned operations and justified joint-burden shares. Aggregation: Retain complete physical ledger before allocation; report internal balances per 1 kg reference flow only as a separate normalized view. Burden shares apply to joint environmental exchanges, not co-product physical masses."
      unit: "kg; m3; MJ; currency"
      frequency: "Stage totals; monthly and annual"
      temporal_coverage: "12 consecutive representative months; justify a complete shorter start-up/campaign period separately"
      site_scope: "All declared mill stages and actual boundary outlets"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; timestamps; test methods; reconciliation; uncertainty and gap records"
  calculation_rules:
    - id: air_dry_output
      applies_to: "pulp"
      rule: "Q = sum(net accepted wet pulp mass × measured dry fraction) / 0.9; Q is accepted reference-flow kg. Keep actual shipment wet mass and dry solids in the separate physical balance."
      inputs:
        - cp_output
      output: "accepted reference-flow mass Q"
      source_ids:
        - jrc-pulp-bref-2015
    - id: normalize_period
      applies_to: "all external inventory rows"
      rule: "Exchange per 1 kg reference flow = verified period exchange amount / Q, using the same site, route and reporting period. No allocation is applied to physical co-product output amounts."
      inputs:
        - cp_output
        - cp_material
        - cp_utility
        - cp_water
        - cp_air
        - cp_waste
      output: "normalized external exchange"
      source_ids:
        - jrc-pulp-bref-2015
    - id: outlet_load
      applies_to: "final air/water species"
      rule: "Integrate matched concentration × discharged volume over time using recorded dimensional conversion; sum actual outlets. Preserve dry/wet gas and temperature/pressure definitions. Unknown intervals, non-detect rules or species-equivalent definitions require disclosure and review. Waterreturn is not one of these concentration×bulk-volume pollutant loads: preserve bulk effluent volume for the integrals, and derive its native m3 only under the proven selected-flow/LCIA water-quantity convention and measured H2O-component/density/state evidence where required by waterreturn/cp_water. Component volumes are not assumed additive and no universal density is introduced; unknown correspondence leaves the Water quantity pending."
      inputs:
        - cp_air
        - cp_water
      output: "period species/indicator load"
      source_ids:
        - jrc-pulp-bref-2015
    - id: electricity_convert
      applies_to: "power"
      rule: "Electrical MJ = metered kWh × 3.6; preserve the Net calorific value property of the verified product record."
      inputs:
        - cp_utility
      output: "electrical MJ"
      source_ids: []
    - id: joint_burden
      applies_to: "remaining joint environmental burdens"
      rule: "Assigned pulp burden = directly attributable pulp burden + justified pulp share × remaining joint burden. After direct assignment/subdivision, define the recipients of each same remaining joint burden explicitly. For a justified economic fallback, pulp share = V_pulp / (V_pulp + sum(V_c)), where V_pulp is contemporaneous pulp gate value and c is every applicable jointly produced co-product recipient at that same gate/period, with consistent quality, quantities and currency. The denominator includes pulp itself and all those recipients; require an admissible strictly positive total and recipient shares summing to one. Unsupported zero/negative value or recipient-set cases remain for review, not default shares. Preserve full physical outputs separately."
      inputs:
        - cp_balance
        - cp_output
      output: "pulp environmental-burden ledger"
      source_ids:
        - eu-pef-allocation-2021
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: dq_scope
      applies_to: "kraft_market_mill"
      requirement: "One verified route and product grade; declare species and actual chemicals. No classification-label recipe or automatic route mixing."
      evidence: "cp_output; cp_material"
    - id: dq_balance
      applies_to: "all flows"
      requirement: "Physical mass/water/carbon/Na/S/Ca and energy balances with stocks and uncertainty; allocated burden ledger is separate. Reject duplicated black liquor, internal steam and pulp hand-off."
      evidence: "cp_balance"
    - id: dq_primary
      applies_to: "all external rows"
      requirement: "Use real site data and assay; retain zero/non-occurrence evidence, non-detects and missing intervals. No historical recipe, yield or factor is a site measurement."
      evidence: "cp_material; cp_utility; cp_air; cp_water; cp_waste"
    - id: dq_background
      applies_to: "UUID and supply links"
      requirement: "Verify physical identity separately from dataset amount, concentration, volume, moisture, geography/year, route and LCIA equivalence. Retain specific gaps; do not use a nearest-name correction flow."
      evidence: "supplier reference definitions; cp_output; cp_utility"
    - id: dq_sources
      applies_to: "source applicability"
      requirement: "BREF/EPA provide process and measurement guidance, not universal quantities. The producer page supports an actual dried/baled softwood route only, not representative recipe or mill-wide numerical averages. PEF provides a general allocation hierarchy, not PEF conformity."
      evidence: "jrc-pulp-bref-2015; epa-chemical-pulping-1990; metsa-pulp-production; eu-pef-allocation-2021"
validation_rules:
  - rule_id: validation_scope
    applies_to: "reference product"
    rule: "Reject dissolving-grade, unbleached, sulphite, soda, mechanical/semichemical, bamboo/nonwood, hardwood and recycled pulp; reject wet integrated pulp transferred directly to paper manufacture. Verify the declared pine/spruce continuous kraft and oxygen/D-EOP-D ECF route."
    source_ids:
      - jrc-pulp-bref-2015
  - rule_id: validation_reference
    applies_to: "quantity and output identity"
    rule: "Require exactly one final pulp reference row, complete qualifiers, calibrated net mass and lot dry matter; normalize every external row to the same 1 kg air-dry-equivalent denominator. Actual physical balances use measured masses, not the standardized output mass."
    source_ids:
      - jrc-pulp-bref-2015
  - rule_id: validation_links
    applies_to: "physical completeness"
    rule: "Reconcile dry wood, accepted pulp, dissolved organics, rejects, recovery, water and carbon including stock changes; report balance residuals and measurement uncertainty rather than inventing a closure tolerance. Internal link pairs must match. Black liquor may not appear as both external fuel and waste."
    source_ids:
      - jrc-pulp-bref-2015
      - epa-chemical-pulping-1990
  - rule_id: validation_emissions
    applies_to: "emission definitions"
    rule: "Preserve final outlet, medium, source origin, species, analytical method and uncertainty. Do not stack overlapping particle intervals, TRS with its species, NOx with NO/NO2, or totals with their constituent burdens. Keep biogenic CO2. Use sum indicators as declared indicators, not invented substances or substitute chemical recipes."
    source_ids:
      - jrc-pulp-bref-2015
  - rule_id: validation_dataset_gaps
    applies_to: "executable dataset"
    rule: "An identity lookup is not a complete background dataset. Missing UUID, unresolved supplier reference amount, incompatible concentration/volume basis, unknown emission equivalence, absent site amount or unsupported relationship remains pending; do not report complete validation. A measured non-occurrence may be zero, but missing data is never zero."
    source_ids:
      - jrc-pulp-bref-2015
published_dataset_profile:
  dataset_role: "Attributional mill-gate product dataset for the declared softwood route"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply to downstream paper/tissue/board modelling after identity, basis and scope compatibility checks"
  excluded_use: "Other pulping routes, dissolving pulp, hardwood/bamboo, integrated wet pulp, complete paper LCA or a claimed industry-average recipe"
  required_metadata: "All reference qualifiers; upstream supplier datasets and transports; site/time; process graph; physical and burden ledgers; allocation decisions; emission definitions; treatment and remaining gaps"
  required_quality_disclosure: "Primary-data coverage; completeness; exact and unresolved identities; supplier basis compatibility; uncertainty; abnormal periods; proxies; source limitations and unreviewed scope"
  update_trigger: "Species, pulping/bleaching chemistry, recovery/CHP, fuel/water/outlet, supplier reference basis or product specification changes"
data_sources:
  - id: "jrc-pulp-bref-2015"
    type: "official_guidance"
    reference: "JRC (2015), Best Available Techniques Reference Document for the Production of Pulp, Paper and Board, DOI 10.2791/370629. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "§2.2 monitoring and printed p49 net production/90% AD basis; §2.3.2 printed p67 site treatment chemicals; §§3.1.1–3.1.12 printed pp196–208 kraft route, recovery, oxygen/ECF, drying and ClO2 preparation. Historic examples do not establish default amounts."
  - id: "epa-chemical-pulping-1990"
    type: "official_guidance"
    reference: "US EPA, AP-42 §10.2 Chemical Wood Pulping, September 1990, reformatted January 1995. https://www.epa.gov/sites/default/files/2020-10/documents/c10s02.pdf"
    used_for: "§10.2.2.1–.2 and Figure10.2-1, printed pp10.2-1–4: kraft recovery and reduced-sulphur/particulate species screening only; direct-contact legacy configurations and historical emission factors are not adopted."
  - id: "metsa-pulp-production"
    type: "literature"
    reference: "Metsä Fibre, Pulp production. https://www.metsagroup.com/metsafibre/about-metsafibre/pulp-production/"
    used_for: "Sections From wood to chips, From chips to pulp, Pulp units ready for the world, Resource-efficient production process: actual pine/spruce softwood, wash/bleach/dry/bale, recovery and by-products; no factory quantity, universal recipe or representative average adopted."
  - id: "eu-pef-allocation-2021"
    type: "official_guidance"
    reference: "European Commission, C(2021)9332 final, Annex I §4.5, printed pp63–64. https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "General multifunctionality hierarchy and justified economic fallback; no sector factor, recycling formula or PEF-conformity claim."
