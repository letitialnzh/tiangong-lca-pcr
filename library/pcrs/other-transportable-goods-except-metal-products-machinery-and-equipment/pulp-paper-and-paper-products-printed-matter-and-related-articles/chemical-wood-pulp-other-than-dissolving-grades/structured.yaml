system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "mill foreground"
      rule: "Include received debarked pine/spruce chips, screening/rechipping, continuous kraft digestion, brownstock washing/screening, oxygen delignification, D-EOP-D ECF bleaching with interstage washing, final screening, dewatering, steam drying, cutting and baling. Other pulping/bleaching routes require a different methodology."
      source_ids:
        - jrc-pulp-bref-2015
    - rule_id: boundary_recovery
      applies_to: "chemical and utility recovery"
      rule: "Include indirect multi-effect black-liquor evaporation, condensate stripping, recovery boiler/CHP, smelt dissolution, green-liquor clarification, recausticising, lime-mud washing/reburning and non-condensable gas collection/combustion. Include water/biological effluent treatment, pollution controls, on-site methanol/sulphuric-acid vacuum ClO2 manufacture and gas-fired kiln/auxiliary heat. No purchased steam or heat is selected in this route."
      source_ids:
        - jrc-pulp-bref-2015
        - epa-chemical-pulping-1990
    - rule_id: boundary_internal
      applies_to: "internal physical links"
      rule: "Keep weak/concentrated black liquor, white/green liquor, lime mud/CaO, ClO2 solution, condensate, process steam, pulp transfers and captured NCG inside the integrated mill unit. cp_balance keeps each sending/receiving link on the same amount, state and time basis. Internal black liquor is neither purchased fuel nor a zero-burden waste output."
      source_ids:
        - jrc-pulp-bref-2015
    - rule_id: boundary_upstream
      applies_to: "supply and external treatment"
      rule: "Foreground starts at received chips; forestry, harvesting, debarking/chipping outside the site, input transport and upstream chemical/electricity/fuel supply remain linked upstream activities, not omitted burdens. Include actual transport distances/modes and external waste treatment in the completed product system. Exclude downstream papermaking, customer transport after gate, use and end-of-life from the foreground."
      source_ids:
        - jrc-pulp-bref-2015
    - rule_id: boundary_completeness
      applies_to: "actual auxiliaries"
      rule: "This inventory is a mandatory screening list, not permission to omit actual process aids, antifoams, lubricants, cleaning chemicals, nutrients, refrigerants, other emissions or mineral-carbon inputs. Add each confirmed exchange as one specific row with actual composition, UUID audit and primary measurement; do not fold it into a listed flow or infer zero. Additional chemistry must not alter the declared pulping/bleaching route."
      source_ids:
        - jrc-pulp-bref-2015
boundary_abstraction:
  declared_starting_condition: "Received debarked untreated pine/spruce pulpwood chips at mill gate; actual chemicals and utilities at declared supply points"
  starting_condition_role: "Foreground integrated market-pulp manufacture, not paper manufacture"
  product_classification_scope: "CPC 3.0 32112; narrower"
  recursive_input_rule: "Internal same-grade pulp rework stays inside the unit and is not netted against final output. Purchased same-category pulp is outside this virgin-chip route and requires a separately assessed method/dataset."
  upstream_dataset_requirement: "Actual wood species/moisture and chip production; reagent state/assay; gas volume; oxygen normal volume; grid region/voltage/year; transport and external waste destinations. Identity UUID alone does not establish dataset suitability."
  disclosure: "Site, reporting year, route, capacity/utilisation, product quality, recovery/CHP, freshwater catchment/outlet, all imports/exports, conditional auxiliaries, inventory gaps and cut-offs"
