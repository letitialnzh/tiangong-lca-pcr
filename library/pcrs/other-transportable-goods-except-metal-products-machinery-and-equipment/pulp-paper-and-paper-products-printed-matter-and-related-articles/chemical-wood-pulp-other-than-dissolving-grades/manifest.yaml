    conflict: Concordant ferric chloride/三氯化铁, CAS7705-08-0 and inorganic crystalline FeCl3 comment contradict organic-family
      classification. No opposing treatment route.
    disposition: Retain conditional actual anhydrous solid FeCl3 physical identity only; supplier assay/form/hydrate and provider
      compatibility required. Provider/source classification clarification pending; no claim that classification or matched
