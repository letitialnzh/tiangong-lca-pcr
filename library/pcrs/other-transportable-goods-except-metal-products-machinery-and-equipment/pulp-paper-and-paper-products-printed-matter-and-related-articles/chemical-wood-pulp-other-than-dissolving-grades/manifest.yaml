  unresolved_flow_identities:
  - row_id: nas
    selected_flow: Sodium sulfide make-up, industrial Na2S
    reason: 'Reject a3b3c67f: explicit hydrometallurgical recycling route does not establish industrial make-up reagent for
      this method.'
  - row_id: exportpower
    selected_flow: Net exported electricity from kraft recovery turbine
    reason: 'Reject b72bc1dd: Chinese national biomass-at-plant 35–330kV interface does not identify the selected site export
      boundary.'
  - row_id: tss
    selected_flow: Suspended solids to fresh water
    reason: No compatible exact record confirmed in bounded successful searches; retain named atomic flow without UUID.
  quantity_background_compatibility:
  - row_id: pulp
    condition: One kg air-dry equivalent at 90% dry matter is a reporting convention; supplier/background output moisture
      basis must agree.
  - row_id: chips
    condition: Solid/bulk volume, packing, wet/dry mass and supplier reference-volume convention need site/supplier reconciliation.
  - row_id: gas
    condition: Temperature, pressure, wet/dry composition, compressibility and supplier m3 reference definition are required.
  - row_id: oxygen
    condition: Normal volume, purity and supplier reference T/P must be reconciled; secondary mass is not operating density.
  - row_id: nox
    condition: NO2-equivalent versus actual NO+NO2 mass remains dataset-specific; Mass/kg identity is not quantitative proof.
  - row_id: bod
    condition: Incubation time/conditions and BOD definition must match target characterisation.
  - row_id: aox
    condition: Halogen-equivalent kg definition must match monitoring/characterisation, not be inferred from Mass/kg.
  - row_id: power
    condition: Raw CN source supply geography requires actual provider/geography/year/grid/voltage/loss compatibility; no
      implicit China/global background.
  - row_id: naoh
    condition: Selected industrial solid 95%–98% purity is actual supplier applicability requirement, not plant dose/default
      assay.
  - row_id: acid
    condition: Selected industrial acid 93%–98% concentration requires actual supplied solution/active reference compatibility,
      not mill recipe/default concentration.
  - row_id: phosacid
    condition: Generic finished phosphoric acid has unspecified concentration/reference active-versus-solution basis. Actual
      nutrient formulation, assay, H3PO4/P, carrier water and provider mass-reference correspondence mandatory; unknown correspondence
      pending, no85% assumed.
  identity_qualifications:
  - row_id: tall
    condition: Broad generic tall-oil physical identity restricted to crude acidulated output; rejected specific record carried
      Mining route.
  - row_id: turp
    condition: Broad turpentine identity restricted to recovered crude sulphate turpentine; supplier composition/state remains
      necessary.
  - row_id: peroxide
    condition: Adopted 30% aqueous-product identity only; source record mentions textile use without limiting production route.
      Concentration is not a generic pulp-mill recipe.
  - row_id: pam
    condition: Non-ionic PAM only; do not generalise to ionic formulations.
  - row_id: dregs
    uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
    condition: Broad industrial solid Waste locator restricted to actual separately collected green-liquor clarification dregs.
      Actual wet/dry mass, water, salts/metals/fibre/contamination, hazard state, stocks and specific receiver/provider acceptance
      remain independently traceable. Same UUID does not merge streams or establish a disposal/recovery route or treatment
      background; liquid or saleable Product requires separately applicable identity.
  - row_id: grits
    uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
    condition: Broad industrial solid Waste locator restricted to actual separately collected slaking/causticising lime grits.
      Actual wet/dry mass, water, salts/metals/fibre/contamination, hazard state, stocks and specific receiver/provider acceptance
      remain independently traceable. Same UUID does not merge streams or establish a disposal/recovery route or treatment
      background; liquid or saleable Product requires separately applicable identity.
  - row_id: sludge
    uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
    condition: Broad industrial solid Waste locator restricted to actual separately collected dewatered biological sludge
      from this kraft-mill WWTP. Actual wet/dry mass, water, salts/metals/fibre/contamination, hazard state, stocks and specific
      receiver/provider acceptance remain independently traceable. Same UUID does not merge streams or establish a disposal/recovery
      route or treatment background; liquid or saleable Product requires separately applicable identity.
  - row_id: rejects
    uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
    condition: Broad industrial solid Waste locator restricted to actual separately collected unrecovered fibre screening
      rejects leaving this mill. Actual wet/dry mass, water, salts/metals/fibre/contamination, hazard state, stocks and specific
      receiver/provider acceptance remain independently traceable. Same UUID does not merge streams or establish a disposal/recovery
      route or treatment background; liquid or saleable Product requires separately applicable identity.
  - row_id: phosacid
    uuid: 9396269a-cf0d-4b38-ae6d-ab6b91e1dc87
    condition: Broad finished phosphoric-acid Product locator restricted to the actual industrial nutrient formulation. Actual
      concentration, composition, supplied mass, active H3PO4/P, carrier water and provider active-versus-solution reference
      remain mandatory and unresolved until verified; no 85% default or matched background inferred.
  - row_id: waterreturn
    uuid: 5e50fc01-19c6-4377-a1cc-bc65a12498ea
    condition: 'Actual metered liquid river return only: Water CAS7732-18-5, Elementary flow, Emissions to fresh water, Volume/m3.
      No resource abstraction, rainfall, vapour or internal transfer substitution; separate pollutant loads and actual receiving-basin/impact
      compatibility required.'
