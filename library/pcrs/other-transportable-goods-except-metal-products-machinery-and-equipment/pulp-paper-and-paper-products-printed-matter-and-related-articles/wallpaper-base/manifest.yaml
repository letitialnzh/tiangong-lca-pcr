    uuid: 46854df3-e13d-4a5a-9e11-6319f1f8347e
    reason: Direct record has English-only baseName. Both selected-flow displays preserve phosphorus, total and Chinese card explicitly discloses missing official name.
  independent_scientific_review: "Independent controller source, raw identity/native-unit and complete bilingual design review accepted the narrower purchased-chemical-pulp papermaking route with explicit provider and remaining identity gaps; not publication approval. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  controller_repairs:
    original_commit: d0b894555bd7edd874f2d8a0da9cd57a15a38d03
    history: Original immutable intake and controller-audit.json preserve all author queries/direct reads, eight gap decisions, the water-medium SO2 error and native-name wrapper
      defect. Fresh qualified references do not claim exact recipes or completed background links.
    qualified_references:
    - row_id: steam
      uuid: fcf9e128-688f-42f0-9dca-85d2319cfac5
      limits: Conditional actual purchased industrial-boiler steam heat delivered through saturated process steam. The broad source has no pressure/temperature field and native
        Gross calorific value/MJ; it does not establish a specific saturated state or net heat. Collect actual steam mass, P/T/dryness, delivery/return and other outgoing enthalpy,
        condensate, losses and provider generation/gate; verify the provider conversion to its GCV reference quantity separately. Never equate net delivered enthalpy to GCV
        or use mass directly as MJ. The 11.0 MPaG and recovered-fibre-fluting records are not substituted. A different actual supply route needs a compatible identity; internal
        boiler steam is an internal transfer, not another external purchase.
    - row_id: sludge
      uuid: b48b29ab-4ead-4413-9adb-07631cd7af09
      limits: Conditional actual dewatered wastewater sludge from this paper-production mill. The broad paper-production sludge source has no hard treatment or composition
        limit. Keep primary fibre/filler sludge and excess biological sludge as distinct actual dataset rows even when using the same locator; do not invent a blended cake.
        Record each wet cake, dry solids, moisture, fibre/biomass/mineral/chemical fractions, carbon origin, dewatering, stocks and recipient/provider wet/dry basis. Internal
        returned sludge is not external waste; no assumed disposal, recycled content or energy credit.
    - row_id: effluent
      uuid: bdfc32cf-8028-40a8-a2e4-2d73422ece34
      limits: Only actual untreated chemical-pulp papermaking wastewater handed to an external treatment operator uses this broad industrial Waste liquid locator, which explicitly
        includes wastewater without an opposing origin/treatment route. Native Mass/kg is complete wet handover mass measured directly or measured volume times actual effluent
        density at the same temperature/state; retain volume, H2O, suspended/dissolved solids, COD/BOD/N/P, chemicals, stocks and receiver/provider basis separately. Pollutant
        indicators are composition evidence, not complete liquid mass. Do not duplicate the same externally treated branch as foreground liquid-water or pollutant releases;
        separately document real split branches.
    - row_id: cutting_dust
      uuid: 2a6c9b60-a075-45ec-b611-c3b4dd255935
      limits: 'Actual captured and separately exported uncoated base-paper dry-slitting/reeling dust: fibres plus actual retained filler/sizing solids and moisture, with no
        assumed purity or particle share. Broad industrial collector Dust has compatible Waste/Mass identity and no opposing material/treatment route; actual composition, hazardous/status
        assessment, physical collected state and receiver/provider requirements remain to be verified. Weigh captured, internally returned and exported quantities separately
        with stocks. Internal returns have equal sending/receiving amounts; captured waste is not escaped atmospheric PM. Record actual post-control releases in the three disjoint
        bins, with no default capture factor or credit. Source general housekeeping advice is not a sampling/frequency rule.'
    - row_id: so2
      uuid: fe0acd60-3ddc-11dd-ac48-0050c2490048
      limits: SO2 CAS7446-09-5 Mass/kg emissions to air unspecified; actual stack/receiver and LCIA subcompartment compatibility remain required.
    liquid_water: Own bounded100 query contains5e50; actual H2O component and discharge-state density required. Same external-treatment branch excludes direct water/pollutant
      outputs.
    aquatic_media: COD/BOD/TSS/N/P source media are unspecified water. Any known receiver needs compatible subcompartment identity before dataset linkage; freshwater carrier
      does not silently correct pollutant metadata.
    provider_debt: CN MV supply actual region/year/mix/voltage/loss gate; HK tapwater at treatment-plant gate/transport; actual starch hypochlorite route/GMP grade; all actual
      formulations and provider wet/dry bases remain pending. PE source CPC29220 defect remains disclosed.
    gap_reasons:
      kaolin: Only explicitly named mine or unrelated products found; processed filler identity not established.
      pae: No compatible PAE; epoxy/DGEBA/two-part resins are different chemistry.
    historical_unresolved_flow_identities:
    - row_id: gcc
      selected_flow: Ground calcium carbonate, papermaking filler
      uuid: null
      reason: Ground paper-grade CaCO3 not verified; reject limestone powder with CAS 587-26-8 and precipitated/coarse/mineral substitutes. Generic calcium carbonate classification
        and route lack paper-grade grinding evidence.
    - row_id: pcc
      selected_flow: Precipitated calcium carbonate, papermaking filler
      uuid: null
      reason: No verified precipitated paper-grade CaCO3 identity; mineral calcite and coarse >63 micrometre records are incompatible substitutes.
    - *id001
    - *id002
    - row_id: steam
      selected_flow: Purchased saturated process steam
      uuid: null
      reason: Direct read of 293f9fd9-5182-4d35-8aa5-ce73d4f322b7 name.flowProperties proves 11.0 MPaG; actual pressure must match (0.45 MPaG is a different identity). High-pressure
        steam and recovered-fibre-fluting steam identities do not establish saturated papermaking delivery; remaining net heat supply definition requires supplier/state evidence.
    - row_id: sludge
      selected_flow: Dewatered papermaking wastewater sludge
      uuid: null
      reason: Generic sludge candidate has water-treatment-chemical treatment field and no verified papermaking cake definition; municipal source-specific and generic solid
        waste candidates are not exact substitutes.
    - row_id: effluent
      selected_flow: Untreated chemical-pulp papermaking wastewater to external treatment
      uuid: null
      reason: Recovered-fibre fluting wastewater and untreated direct-discharge wastewater records have incompatible routes; specific chemical-pulp papermaking wastewater-to-treatment
        identity unresolved.
    - row_id: cutting_dust
      selected_flow: Collected uncoated base-paper dry-cutting dust to external receiver
      uuid: null
      reason: Search returned unspecified waste paper, separator-paper scraps, paper-landfill treatment and packaging waste, none verifies the collected dry-cutting dust state/receiver;
        keep a specific atomic dust stream and blank UUID.
    conditional_nmvoc:
      row_id: nmvoc
      uuid: 08a91e70-3ddc-11dd-a302-0050c2490048
      reason: Original EPA AP42 gas-combustion section explicitly lists VOCs, while original inventory omitted their non-methane component. One conditional measured sum-indicator
        row added without new production or combustion route. Actual chemistry, monitoring mass convention and carbon composition remain pending; no methane or constituent
        double characterization, factor or assumed zero.
      query: Own bounded100 NMVOC query returned this UUID; own fresh state100 direct confirms Mass/kg and emissions to air unspecified.
    broad_carbonate_reconsideration:
      rows:
      - gcc
      - pcc
      uuid: 699cf1be-0ca2-4c34-af60-fd58a8e9d549
      decision: 'Retain exact broad CaCO3 chemical identity with separately required actual ground/precipitated grades and reference bases. Earlier reviewer exclusion for missing
        processing evidence is preserved in original audit, then reconsidered under consistent physical-evidence policy: no opposing species/state/route field; isolated current15200/raw
        source399 classification is disclosed metadata debt, not hard manufacturing evidence. Source CAS absent, actual chemical assay/grade/provider verification pending;
        no exact filler recipe/background or automatic whole-slurry quantity.'
      source_flow_classification_review: Native CPC15200 calcareous stone, preserved original399 taxonomy versus generic CaCO3 names. Source/provider clarification remains
        pending; neither category is silently rewritten.
      quantity: Actual delivery, solids, CaCO3/other minerals/additives/water and provider wet/dry reference basis remain separate; missing conversion prevents completed link.
      actual_constraints: GCC ground route and PCC precipitation/crystal route remain independently required; neither becomes the other or a coarse calcite/contradictory-CAS
        limestone proxy.
