  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  independent_review: "Independent controller source, raw identity/native-unit and complete bilingual design review accepted the narrower purchased-chemical-pulp papermaking route with explicit provider and remaining identity gaps; not publication approval. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  scope_decision: "Retained unpublished wallpaper-base identity; purchased bleached kraft papermaking-grade pulp, wet-laid uncoated and unsaturated paper. CPC 32124 coverage is limited to the narrower scope. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate. Mechanical/recovered-fibre/nonwoven/pigment-coated or impregnated routes excluded."
  unresolved_flow_identities:
  - &id001
    row_id: kaolin
    selected_flow: Kaolin clay, papermaking filler
    uuid: null
    reason: Candidate English baseName denotes a specific kaolin mine and provides no processed papermaking filler or grade evidence; do not assert exact identity.
  - &id002
    row_id: pae
    selected_flow: Polyamide-epichlorohydrin wet-strength resin solution
    uuid: null
    reason: No compatible PAE solution identity after English and Chinese searches; epoxy-resin and unrelated epichlorohydrin candidates rejected.
  range_evidence: No general recipe, moisture, yield, dosage, utilities, residue or emission ranges adopted. Historic patent and single-product grammage values are not defaults;
    real site collection is required.
  quantity_basis_debts:
  - Pulp supplier wet/air-dry/oven-dry definition and species/bleaching must match the broader non-dissolving pulp identity.
  - AKD emulsified delivery mass, CPAM concentration and oxidised starch grade must match supplier background reference basis; no database concentration transferred as default.
  - Gas Volume/m3 identity verified; reference T/P, wet/dry composition, compressibility and supplier background convention remain site-dependent, not verified site data.
  - External steam delivery state and net useful enthalpy compatibility remain unresolved; no high-pressure or fluting-specific record used as substitute.
  - NOx sum identity verified but NO2-equivalent or species-mass quantity convention is not established by that record. Require monitoring and LCI/LCIA agreement before linking.
  source_metadata_defects:
  - row_id: pefilm
    uuid: e64eb06c-6dc9-45f1-b003-3dc6c44b27e2
    issue: CPC29220 classification is inconsistent with PE film name, CAS9002-88-4 and description. Physical film identity conditionally retained; supplier/source clarification
      required.
  rejected_incompatible_identities:
  - cb76e585-1287-4a42-a89e-db0102154fa0 classified as dissolving-grade pulp; replaced by verified non-dissolving pulp identity.
  - 76de3e65-5386-4b36-935d-6a26f1c714d2 TMP has chemical-treatment route and misplaced machine classification; mechanical pulp outside this method scope.
  - 296553d5-5b49-4d7f-8148-341b966edc23 wastewater belongs to integrated recovered-fibre fluting; incompatible with selected pulp route.
  - d2d44ce1-c0f4-461d-9413-f4b33e0d200f manganese-residue wash wastewater not applicable.
  localization_exception:
