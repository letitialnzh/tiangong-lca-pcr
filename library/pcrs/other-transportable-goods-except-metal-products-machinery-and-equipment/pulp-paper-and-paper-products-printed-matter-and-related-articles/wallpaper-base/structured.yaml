allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Keep the physical process/solids/water/carbon ledger separate from the allocated environmental-burden ledger. Internal sheet/broke/water links have equal amounts at both ends on the same basis, with measured storage changes and losses explicitly reconciled. Do not mechanically multiply a co-product physical output by an allocation share. Attribute grade-specific pulp, chemicals and metered utilities directly; subdivide shared utilities where feasible. If inseparable co-products remain, investigate subdivision/system expansion first, then a demonstrated relevant physical relation, then another justified relation such as economic allocation; disclose method, denominator, coefficients and sensitivity. No automatic waste-paper credit or default mass allocation is prescribed. Internal broke is not a co-product; external trim/sludge status and treatment must be evidenced. Source: eu-pef-allocation-2021, with the recycling-specific requirements of the adopted study method kept explicit."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_production
      process_id: "paper_mill"
      flow_role: "reference mass and solids"
      record_type: "Measured raw record"
      raw_fields: "reel id; grade; gross mass; core/wrapping tare; accepted net mass S; wet-basis moisture w; rejection; opening/closing stocks"
      collection_method: "Calibrated net weighing, acceptance records and representative delivery-state gravimetric moisture samples; retain drying endpoint, test method, conditioning and replicate uncertainty."
      unit: "kg; mass fraction"
      frequency: "Each lot or continuous metering; emissions by representative operating state and actual monitoring plan"
      temporal_coverage: "Same period as delivered product; disclose missing records"
      site_scope: "Same mill and grade, relevant points; retain stage ids"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, chain of custody, sample/lab QA, supplier basis and balance residual"
    - protocol_id: cp_materials
      process_id: "paper_mill"
      flow_role: "each pulp, filler and chemical"
      record_type: "Measured raw record"
      raw_fields: "supplier; lot; species/grade; incoming whole-formulation mass; each actual component/additive/carrier water; measured moisture/solids; purity; active concentration; each dose; stock change; retained solids"
      collection_method: "Calibrated receiving scales/flowmeters, lot COA and independently checked solids samples; reconcile delivered and consumed material, dry blend and background reference basis per material."
      unit: "kg; mass fraction"
      frequency: "Each lot or continuous metering; emissions by representative operating state and actual monitoring plan"
      temporal_coverage: "Same period as delivered product; disclose missing records"
      site_scope: "Same mill and grade, relevant points; retain stage ids"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, chain of custody, sample/lab QA, supplier basis and balance residual"
    - protocol_id: cp_energy
      process_id: "paper_mill"
      flow_role: "electricity, gas and external steam"
      record_type: "Measured raw record"
      raw_fields: "stage meter kWh; gas volume T/P wet/dry composition Z; steam mass P/T dryness and return enthalpy; supplier background reference; operating time"
      collection_method: "Calibrated meters and invoices, supplier reference-state declaration, steam/condensate measurements and heat balance; segregate purchased and internal transfers."
      unit: "MJ; m3; kg"
      frequency: "Each lot or continuous metering; emissions by representative operating state and actual monitoring plan"
      temporal_coverage: "Same period as delivered product; disclose missing records"
      site_scope: "Same mill and grade, relevant points; retain stage ids"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, chain of custody, sample/lab QA, supplier basis and balance residual"
    - protocol_id: cp_water
      process_id: "paper_mill"
      flow_role: "fresh water, vapour and external effluent"
      record_type: "Measured raw record"
      raw_fields: "make-up volume; source; complete wet effluent mass and matched density/temperature; H2O component fraction/mass and water density; receiver and external/direct branch; white-water and condensate links; web moisture; evaporation; discharge; boiler blowdown; stocks"
      collection_method: "Calibrated flowmeters and moisture/exhaust measurements; reconcile fresh input, material-carried water, product water, evaporation, outgoing waste water and stock change."
      unit: "m3; kg"
      frequency: "Each lot or continuous metering; emissions by representative operating state and actual monitoring plan"
      temporal_coverage: "Same period as delivered product; disclose missing records"
      site_scope: "Same mill and grade, relevant points; retain stage ids"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, chain of custody, sample/lab QA, supplier basis and balance residual"
    - protocol_id: cp_air
      process_id: "paper_mill"
      flow_role: "each named air emission"
      record_type: "Measured raw record"
      raw_fields: "point/source; species; source carbon; size bin; measured concentration; gas flow; duration; T/P; oxygen; wet/dry and condensable basis; method; capture/oxidation"
      collection_method: "Representative stack or fugitive measurement and source-specific carbon/gas balance; pair flow and concentration at matching reference conditions. Any factor needs an actual source, technology and control match."
      unit: "kg"
      frequency: "Each lot or continuous metering; emissions by representative operating state and actual monitoring plan"
      temporal_coverage: "Same period as delivered product; disclose missing records"
      site_scope: "Same mill and grade, relevant points; retain stage ids"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, chain of custody, sample/lab QA, supplier basis and balance residual"
    - protocol_id: cp_effluent
      process_id: "paper_mill"
      flow_role: "each named environmental water load"
      record_type: "Measured raw record"
      raw_fields: "final discharge point/receiver; volume; matched concentration; analyte definition; COD/BOD test; total N/P versus species; date; treatment state; QA"
      collection_method: "Flow-proportional composite sampling with paired discharge flow and laboratory analysis; final release only after actual on-site treatment. Record analytical coverage, detection limits and actual BOD period."
      unit: "kg"
      frequency: "Each lot or continuous metering; emissions by representative operating state and actual monitoring plan"
      temporal_coverage: "Same period as delivered product; disclose missing records"
      site_scope: "Same mill and grade, relevant points; retain stage ids"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, chain of custody, sample/lab QA, supplier basis and balance residual"
    - protocol_id: cp_residues
      process_id: "paper_mill"
      flow_role: "external paper trim and sludge"
      record_type: "Measured raw record"
      raw_fields: "stream identity; wet/dry mass; solids; ash; contaminants; sender/receiver; treatment; recovered internal broke; captured cutting dust, internal dust return and exported dust; stock change"
      collection_method: "Calibrated weighbridge/scale, solids tests and receiver tickets; separate actual atomic waste types and internal returns."
      unit: "kg"
      frequency: "Each lot or continuous metering; emissions by representative operating state and actual monitoring plan"
      temporal_coverage: "Same period as delivered product; disclose missing records"
      site_scope: "Same mill and grade, relevant points; retain stage ids"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, chain of custody, sample/lab QA, supplier basis and balance residual"
    - protocol_id: cp_packaging
      process_id: "paper_mill"
      flow_role: "PE film and paperboard core"
      record_type: "Measured raw record"
      raw_fields: "material identity; lot; consumption; tare; shipped mass; documented core reuse; scrap destination"
      collection_method: "Weigh materials separately and reconcile purchases, stock and shipments; retain supplier grade and reuse records; packaging excluded from S."
      unit: "kg"
      frequency: "Each lot or continuous metering; emissions by representative operating state and actual monitoring plan"
      temporal_coverage: "Same period as delivered product; disclose missing records"
      site_scope: "Same mill and grade, relevant points; retain stage ids"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, chain of custody, sample/lab QA, supplier basis and balance residual"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "Q_ref = Q_period / S; S is accepted net delivered base paper in kg for the same period; Q_ref is the exchange per 1 kg reference flow."
      inputs:
        - Q_period
        - S
        - cp_production
      output: "Q_ref"
      source_ids:
        - jrc-paper-bref-2015
    - id: solids_balance
      applies_to: "pulp_soft; pulp_hard; gcc; pcc; kaolin; starch_ox; akd; pae; pam; wallpaper_base; broke; sludge; cutting_dust"
      rule: "m_dry = m_delivered × measured_solids_fraction; D = S × (1-w); reconcile each incoming solid to product retention, dry exported waste, released solids and stock change. Internal returns cancel across matching boundary ends; packaging stays separate."
      inputs:
        - cp_materials
        - cp_production
        - cp_residues
      output: "Physical solids ledger and residual"
      source_ids:
        - jrc-paper-bref-2015
    - id: utility_reconciliation
      applies_to: "electricity; gas; steam"
      rule: "Meter kWh × 3.6 = MJ; reconcile same-state stage meters to main meter. Gas volume conversion requires declared T/P, wet/dry and Z. Physical net steam heat = sum(m_in × h_in) - sum(m_return × h_return) - other documented outgoing enthalpy at the declared boundary, with losses separately recorded. Supplier GCV reference demand requires its independently documented conversion; no net/GCV equivalence, default constants or extra internal-steam input."
      inputs:
        - cp_energy
      output: "Compatible utility amounts and internal heat ledger"
      source_ids:
        - jrc-paper-bref-2015
    - id: water_balance
      applies_to: "water_input; water_vapor; liquid_water; effluent; wallpaper_base; sludge; cutting_dust"
      rule: "Fresh input + material-carried water + actual combustion water = product water + evaporation + outgoing effluent/waste-carried water + stock change; use measured density for volumes and match internal white-water/condensate amounts on both ends."
      inputs:
        - cp_water
        - cp_materials
        - cp_production
        - cp_residues
      output: "Physical water ledger and residual"
      source_ids:
        - jrc-paper-bref-2015
    - id: effluent_load
      applies_to: "cod; bod; tss; n_water; p_water"
      rule: "Load_kg = sum(V_i_m3 × c_i_mg_per_L × 0.001) using time-matched flow/concentration and the same analytical definition; divide by S for normalization. Loads sent to external treatment are not duplicate environmental releases."
      inputs:
        - cp_effluent
        - cp_production
      output: "Individual aquatic loads"
      source_ids:
        - jrc-paper-bref-2015
    - id: air_load
      applies_to: "co2_fossil; co2_bio; co; nmvoc; nox; so2; ch4; n2o; bio_ch4; pm25; pmcoarse; pmover10"
      rule: "Integrate same-state concentration × gas flow × time per point and species, then divide by S; otherwise use measured activity and an actually cited compatible source-specific factor with uncertainty, not a generic default."
      inputs:
        - cp_air
        - cp_production
      output: "Individual air loads"
      source_ids:
        - jrc-paper-bref-2015
        - epa-natural-gas-combustion
    - id: wastewater_native_quantity
      applies_to: "effluent"
      rule: "X_wet = measured whole handover mass or sum(V_handover × rho_effluent at matched T/state); exchange = X_wet/S. Retain water/dry constituents, stocks and receiver; pollutant loads are not whole-liquid mass. Exclude duplicate direct outputs for the same external-treatment branch."
      inputs:
        - cp_water
        - cp_effluent
        - cp_production
      output: "kg wet wastewater per kg accepted net paper"
      source_ids: []
    - id: freshwater_carrier_quantity
      applies_to: "liquid_water"
      rule: "m_H2O = sum(m_final_effluent × measured water_fraction), or equivalent verified water account; V_H2O = sum(m_H2O/rho_H2O(T)); exchange = V_H2O/S. No automatic pure-water density or whole-effluent substitution; actual branch and freshwater receiver required."
      inputs:
        - cp_water
        - cp_effluent
        - cp_production
      output: "m3 liquid H2O per kg accepted net paper"
      source_ids: []
    - id: cutting_dust_ledger
      applies_to: "cutting_dust; pm25; pmcoarse; pmover10"
      rule: "Actual generated cutting dust plus opening stock = measured post-capture internal return/export, escaped cutting-source disjoint PM and closing stock, with composition/moisture and residual recorded on matched bases. Other boiler/handling PM source masses remain separate. Captured dust is not emitted PM; inclusive PM10/total dust are not added to the three bins. No assumed capture share."
      inputs:
        - cp_residues
        - cp_air
        - cp_materials
      output: "Separate physical dust mass and escaped particle ledger"
      source_ids: []
    - id: nonmethane_voc_quantity
      applies_to: "nmvoc"
      rule: "Use compatible measured sum of non-methane constituent chemical masses or a documented monitoring conversion, divided by S. Total hydrocarbons minus methane only when definitions and periods match. Mass-as-C or propane equivalents require actual speciation/basis; unknown conversion remains pending. Do not double characterize aggregate and constituents."
      inputs:
        - cp_air
        - cp_energy
        - cp_production
      output: "kg compatible NMVOC per kg accepted paper"
      source_ids:
        - epa-natural-gas-combustion
    - id: burden_allocation
      applies_to: "all inventory rows"
      rule: "Assign attributable burdens directly; distribute remaining shared burdens with evidenced coefficients summing to 1. Retain burden and complete physical ledgers separately without scaling physical co-product deliveries."
      inputs:
        - "Physical ledger"
        - submetering
        - "evidenced allocation coefficients"
      output: "Allocated burden ledger"
      source_ids:
        - eu-pef-allocation-2021
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: identity_basis
      applies_to: "all inventory rows"
      requirement: "Verify each identity and supplier/receiver background basis separately; UUID is not a completed dataset. Missing identity cannot be replaced by adjacent products."
      evidence: "Supplier COA, route and background definition"
    - id: coverage
      applies_to: "all inventory rows"
      requirement: "Keep applicability, measured positive value, confirmed non-use, missing record and below-detection states distinct. Declare actual furnish and every used chemical, packaging component and emitted species as individually verified atomic rows. Conditional rows imply no default quantity."
      evidence: "Material ledger, operating records, monitoring and explicit gaps"
    - id: balances
      applies_to: "paper_mill"
      requirement: "Report stage and whole-boundary solids/water/carbon balances; match internal ends and explain residuals/uncertainty. Retained paper biogenic carbon is not an automatic negative-emission credit."
      evidence: "Physical ledger and separate burden ledger"
    - id: comparability
      applies_to: "wallpaper_base"
      requirement: "Different furnish, filler, sizing, moisture, grammage or surface states cannot claim functional equivalence solely by kg."
      evidence: "Purchaser specifications and acceptance tests"
    - id: ranges
      applies_to: "all inventory rows"
      requirement: "Do not convert historic patent or single-producer quantities into generic ranges; collect actual site data and retain unknowns as gaps."
      evidence: "Actual measurements and scoped originals"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Require exactly one accepted reference output linked to wallpaper_base; 1 kg and the same net-delivery denominator in both languages, every row and every protocol. Check qualifiers, chemistry/species, reference property, unit group, environmental medium and quantity/background basis separately. All actual inputs and emissions must be atomic and traced to collection; any missing foreground measurement, unsupported NOx convention, unresolved steam delivery basis or incompatible background keeps dataset validation incomplete. Verify absence of decorative/impregnated/nonwoven product claims, no nested PM double counting, no duplicated raw-effluent/final-release burdens, no double counting of captured/reused dry-cutting dust and escaped PM, no dropped biogenic CO2, and separate physical versus allocated ledgers. A method inspection does not establish a factory measurement or scientific approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground base-paper manufacturing dataset for downstream use after data quality checks"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared compatible base-paper supply; upstream link for wallpaper conversion"
  excluded_use: "Complete decorative wallpaper, installation/service life, nonwoven substrates, other furnish routes and generic pulping"
  required_metadata: "pulp supplier and species; non-dissolving bleached kraft grade; measured pulp solids; actual softwood/hardwood dry blend; each filler mineral and ground/precipitated route; each wet-end and surface-size chemical and supplied/active basis; uncoated and not latex-saturated; grammage and test conditioning; measured wet-basis delivery moisture; reel net mass, core and packaging tare; grade acceptance criteria; energy supply and receiving-water route; site and reporting period"
  required_quality_disclosure: "Boundary, source year/geography, sample coverage, raw bases, unresolved identity/background, allocation and balance uncertainty"
  update_trigger: "Changes in recipe, pulp, supplier, sizing, surface, delivery moisture, energy/treatment route, measurement or specification"
