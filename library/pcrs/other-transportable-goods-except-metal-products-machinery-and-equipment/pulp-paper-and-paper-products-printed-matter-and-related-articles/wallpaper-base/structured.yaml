    applies_to: "wallpaper_base"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Net delivered mass excludes wrapping and core; measure wet-basis moisture w = water mass/net wet paper mass and D = S × (1-w). No assumed oven-dry or standard-conditioned mass."
  - id: material_basis
    applies_to: "pulp_soft; pulp_hard; gcc; pcc; kaolin; starch_ox; akd; pae; pam"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record supplied mass and solids for each material; distinguish active/dry quantity from supply basis. Convert to actual supplier reference quantity without transferring database recipes or concentrations."
  - id: energy_basis
    applies_to: "electricity; gas; steam"
    required_property_ref:
      name: "Declared reference property"
      uuid: ""
    required_unit: "MJ; m3; kg"
    rule: "Measured electricity kWh × 3.6 gives MJ; gas uses a supplier-compatible volume basis. Preserve purchased-steam mass/state and verify net heat from delivery/return enthalpy, not an MJ label."
  - id: liquid_discharge
    applies_to: "liquid_water"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "Record only final liquid-water volume discharged to fresh water, not withdrawal; reconcile water mass using measured density and do not duplicate carrier volume for each pollutant."
  - id: elementary_basis
    applies_to: "co2_fossil; co2_bio; co; nmvoc; nox; so2; ch4; n2o; bio_ch4; pm25; pmcoarse; pmover10; cod; bod; tss; n_water; p_water; water_vapor"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Distinguish species, fossil/biogenic source and compartment. COD/BOD are O2 demand, total N is N, total P is P; unknown NOx mass convention keeps linkage pending. Three particle bins are disjoint."
