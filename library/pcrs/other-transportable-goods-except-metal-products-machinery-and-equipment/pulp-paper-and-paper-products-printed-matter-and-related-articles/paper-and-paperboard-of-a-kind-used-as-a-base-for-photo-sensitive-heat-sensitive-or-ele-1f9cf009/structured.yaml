measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use accepted paper net mass Q in cp_mass at actual delivery moisture; exclude core, wrappers and pallet. Normalize every external exchange to 1 kg reference flow."
  - id: dry_basis
    applies_to: "pulp, paper, sludge and chemicals"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record wet/as-received and dry masses separately: m_dry = m_wet * (1 - w), where w is measured wet-basis moisture fraction. Supplier air-dry conventions must be declared, not assumed from BREF examples."
  - id: electricity_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the reference-property name from the direct record. E_MJ = 3.6 * E_kWh is a unit conversion only; reconcile the delivered supply interface and background."
  - id: steam_basis
    applies_to: "steam_heat"
    required_property_ref:
      name: "Gross calorific value"
      uuid: "93a60a56-a3c8-14da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Collect delivery and return enthalpy under cp_heat. A GCV/MJ property alone does not prove net delivered heat. Require a supplier-defined conversion k_bg before linking H_bg = k_bg * H_net; an unknown k_bg blocks the numeric supplier link."
  - id: formulation_basis
    applies_to: "chemical rows"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep commercial-product mass, water, active solids and other ingredients distinct. Use measured concentration and supplier reference definition; never substitute emulsion mass for pure active mass or count constituents twice."
