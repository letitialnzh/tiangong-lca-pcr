allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "allocation_subdivision: First isolate the actual thermal-base-paper campaign using production lots, submetering and causal service records. Other mill grades retain their own physical production quantities. A shared-meter share may apply to an environmental-burden account, never to the measured real mass of pulp, accepted paper, broke or internal transfers."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_residues: No automatic avoided-product or energy-recovery credit for internal broke, white water or exported waste. Record exported material fate and legal/physical waste status. A genuine saleable co-product requires separately evidenced subdivision or causal allocation and transparent physical and allocated ledgers; economic allocation is not inferred from waste revenue. This default route has one reference product, not an invented pulp co-product."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "papermaking"
      flow_role: "reference output"
      record_type: "weighing"
      raw_fields: "lot; reel; gross mass; core and wrapper tare; accepted net mass; moisture w; grammage; grade; beginning/end accepted stock"
      collection_method: "Calibrated reel scale and traceable tare; representative gravimetric moisture sample to documented constant-dry-mass endpoint; record method, temperature, sampling and repeatability. Reconcile accepted production and dispatch stocks. Preserve physical period totals, perform the following aggregation, then divide by Q from cp_mass to produce amounts per 1 kg reference flow: Q = sum accepted net paper mass; exclude returned/rejected lots and packaging"
      unit: "kg"
      frequency: "Every lot and moisture sample"
      temporal_coverage: "Same complete declared period"
      site_scope: "Accepted uncoated grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; acceptance certificates; moisture records"
    - protocol_id: cp_material
      process_id: "papermaking"
      flow_role: "pulp and individual chemical/maintenance input"
      record_type: "stock and dosing"
      raw_fields: "row_id; supplier; species/CAS where relevant; grade; supply route; lot; delivered mass; stock changes; formulation; solids; dosing; background reference basis"
      collection_method: "Reconcile receipts, calibrated dosing scales and beginning/end stores for each atomic material; measure moisture/solids and retain supplier composition documents. Account constituent water exactly once. Preserve physical period totals, perform the following aggregation, then divide by Q from cp_mass to produce amounts per 1 kg reference flow: X_i = receipts + opening stock - closing stock - other-grade transfers; preserve physical total and trace attributable use"
      unit: "kg"
      frequency: "Each delivery and dosing lot"
      temporal_coverage: "Same complete declared period"
      site_scope: "Thermal-base-paper campaign"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Invoices; scale/doser calibration; assays; supplier basis"
    - protocol_id: cp_water
      process_id: "papermaking"
      flow_role: "purchased water and external wastewater"
      record_type: "meter and laboratory"
      raw_fields: "row_id; meter total; volume; temperature; density; receiver; inlet/outlet stock; moisture; COD; BOD; TSS; N/P; constituent analysis"
      collection_method: "Calibrated water/effluent totalizers; flow-proportional representative composite sampling and documented lab methods. Measure separate actual densities and temperatures for purchased water and wastewater; X_water = V_water*rho_water and X_wastewater = V_wastewater*rho_wastewater, or independently calibrated whole-liquid weighing. Retain each water fraction for the water balance; neither density is defaulted to 1000 kg/m3. Record treatment-inlet composition and trace the receiving external plant. Preserve physical period totals, perform the following aggregation, then divide by Q from cp_mass to produce amounts per 1 kg reference flow: Aggregate net boundary volumes; keep recycled white water separate; reconcile water balance and inlet pollutants with external treatment inputs"
      unit: "m3; kg"
      frequency: "Continuous totals; representative samples"
      temporal_coverage: "Same complete declared period"
      site_scope: "Mill boundary excluding external treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; laboratory blanks/standards; receiver records"
    - protocol_id: cp_energy
      process_id: "papermaking"
      flow_role: "grid electricity"
      record_type: "submeter"
      raw_fields: "supply voltage; region; time; meter kWh; preparation/drying/sizing/finishing readings; loads; transformations; other grades"
      collection_method: "Calibrated submetering with campaign timestamps; reconcile whole-site and grade/stage records, supply interface and transformer boundary. Preserve physical period totals, perform the following aggregation, then divide by Q from cp_mass to produce amounts per 1 kg reference flow: E_MJ = 3.6 * E_kWh; retain separate physical meter total and causal attributable consumption"
      unit: "kWh; MJ"
      frequency: "Continuous and campaign totals"
      temporal_coverage: "Same complete declared period"
      site_scope: "Purchased-grid interface and scoped equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; bills; reconciliation; supplier mix"
    - protocol_id: cp_heat
      process_id: "papermaking"
      flow_role: "delivered steam heat"
      record_type: "enthalpy and supplier definition"
      raw_fields: "steam mass; pressure; temperature; quality; enthalpy; condensate mass and return enthalpy; vent/blowdown; supplier reference state; k_bg; drying/sizing loads"
      collection_method: "Calibrated steam/condensate meters and pressure/temperature records; use documented thermodynamic tables and measured steam quality; reconcile all return/vent states with supplier energy accounting. Supplier must define how net delivered heat relates to the GCV reference. Preserve physical period totals, perform the following aggregation, then divide by Q from cp_mass to produce amounts per 1 kg reference flow: H_net = (sum m_s*h_s - sum m_r*h_r)/1000; declare reference states for unreturned streams; H_bg = k_bg*H_net only with verified k_bg"
      unit: "kg; kJ/kg; MJ"
      frequency: "Continuous totals and state readings"
      temporal_coverage: "Same complete declared period"
      site_scope: "External supply boundary to drying/redrying"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; enthalpy method/version; return ledger; supplier agreement"
    - protocol_id: cp_pack
      process_id: "papermaking"
      flow_role: "each packaging input"
      record_type: "weigh and reuse"
      raw_fields: "row_id; net installed mass; core dimensions; packing count; grade; supplier; pallet reuse/replacement and losses"
      collection_method: "Weigh individual installed components net of offcuts; reconcile issued stock, waste and reuse records; exclude packaging from Q. Preserve physical period totals, perform the following aggregation, then divide by Q from cp_mass to produce amounts per 1 kg reference flow: X_i = attributable component consumption; reuse service and replacement based on actual records without default lifetime"
      unit: "kg"
      frequency: "Each packing lot"
      temporal_coverage: "Same complete declared period"
      site_scope: "Finished reels leaving gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Packing list; scale calibration; reuse log"
    - protocol_id: cp_waste
      process_id: "papermaking"
      flow_role: "each exported waste"
      record_type: "weighbridge and recipient"
      raw_fields: "row_id; wet mass; dry solids; origin; contamination; receiver; treatment route; internal recovery; stock"
      collection_method: "Calibrated scales and waste manifests; sample solids/composition, including separately collected paper-cutting dust and its collector opening/closing stocks; reconcile internal returned fibre and exported rejects independently; retain receiver confirmation. Preserve physical period totals, perform the following aggregation, then divide by Q from cp_mass to produce amounts per 1 kg reference flow: X_i = net exported waste mass; no internal broke as an export; record fate without automatic credit"
      unit: "kg"
      frequency: "Each consignment"
      temporal_coverage: "Same complete declared period"
      site_scope: "External waste gate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Waste manifests; receiver; sample and weighing records"
    - protocol_id: cp_air
      process_id: "papermaking"
      flow_role: "each elementary emission"
      record_type: "measurement and balance"
      raw_fields: "row_id; species; CAS; carbon origin; medium/submedium; sampling location; size bins; concentration; dry/wet gas basis; flow; time; control status; water balance"
      collection_method: "Representative outlet and fugitive monitoring or an explicitly supported closed balance; retain operating hours, blanks, uncertainty and control conditions. Screen actual cutting/winding sources and controls; measure residual outdoor dust separately from captured material and internal recovery. Do not treat detection limits as zero. Identify fossil/biogenic source independently. Preserve physical period totals, perform the following aggregation, then divide by Q from cp_mass to produce amounts per 1 kg reference flow: X_i = sum c_i*V_i/1000000 for c_i in mg/m3 and matching V_i in m3; use disjoint PM bins; H2O may use closed water balance; no unmeasured emission factor"
      unit: "kg"
      frequency: "Representative operating modes and period totals"
      temporal_coverage: "Same complete declared period"
      site_scope: "Actual outdoor releases from scoped equipment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Lab methods; calibration; operating log; detection limits; balance residuals"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "q_i = X_i / Q; X_i is the measured grade-attributable exchange amount; Q is accepted net paper kg from the same period and route. Reference product q = Q/Q = 1 kg."
      inputs:
        - X_i
        - Q
        - cp_mass
        - "row protocol"
      output: "amount per 1 kg reference flow"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: dry_solids
      applies_to: "physical ledger"
      rule: "m_dry = m_wet * (1 - w); w is measured, no default pulp/finished-paper moisture"
      inputs:
        - m_wet
        - w
        - cp_mass
        - cp_material
        - cp_waste
      output: "kg dry solids"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: steam_link
      applies_to: "steam_heat"
      rule: "H_bg = k_bg * H_net; use cp_heat enthalpy balance and supplier-defined reference basis; unknown k_bg is pending and does not equal 1"
      inputs:
        - cp_heat
        - "supplier definition"
      output: "MJ; pending if unknown"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: physical_balances
      applies_to: "material/water/carbon ledgers"
      rule: "For each conserved quantity: external inputs = accepted paper + dispatched packaging + external wastes + elementary releases + returned utility water + closing-minus-opening stocks + documented residual. Include real dispatched cores, wrappers and pallets even though excluded from Q. Reconcile steam supply/condensate return as a separate physical utility-water circuit when the LCI energy exchange is net heat; do not count supply steam as purchased process water or its condensate as external wastewater. Internal recirculation cancels once, with equal sender/receiver quantities. Use each particulate stream’s actual carried moisture in the water ledger without duplicating vapour; do not invent a moisture fraction or treat a dry particulate metric as extra water. Carbon uses measured elemental fractions; actual biogenic CO2 remains in the inventory."
      inputs:
        - cp_mass
        - cp_material
        - cp_water
        - cp_waste
        - cp_air
        - "measured composition"
      output: "unallocated kg solids/water/C and explained residual"
      source_ids:
        - jrc-pulp-paper-bref-2015
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every row"
      requirement: "Verify physical identity, route, grade, chemical/CAS consistency, reference property and unit; identity and numeric background compatibility are separate decisions. Unresolved rows remain specific with no substitute UUID."
      evidence: "Supplier specifications and actual reference definitions"
    - id: dq_completeness
      applies_to: "foreground and upstream"
      requirement: "Reconcile physical solids/water/carbon ledgers and all utility/stage records. Add each actual unlisted chemical, packaging waste, VOC species or direct emission as its own atomic row. Neither this conditional list nor a non-detect alone proves absence."
      evidence: "Process diagram; purchase/reject records; balance residual and uncertainty"
    - id: dq_temporal
      applies_to: "collection period"
      requirement: "Same period and grade for Q and all exchanges; document coverage, abnormal operations, uncertainty and supplier vintage. No historical single-mill factor as a generic default."
      evidence: "Time-stamped logs and complete record coverage"
    - id: dq_linkage
      applies_to: "steam_heat; akd; pam; pulp; wastewater"
      requirement: "Missing supplier enthalpy/formulation/moisture bases or compatible external treatment are explicit dataset gaps, even when flow identity is known. Do not report a linked complete dataset until resolved."
      evidence: "Supplier contracts and independently documented background quantities"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "validate_product: Require all reference qualifiers and exactly one base_paper output at 1 kg; reject an imaging coating, incompatible furnish or the unsupported mill route [andhra-thermal-base]."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "validate_measurement: Q must be positive, finite, net of packaging and common to every normalized row in both languages. Preserve mass/volume/NCV/GCV distinctions and documented conversions; missing steam or chemical supplier-basis compatibility makes the concrete dataset incomplete."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "validate_balances: Check unallocated physical mass/water/carbon balances before allocation; explain residuals with measurement uncertainty and stock changes. Require equal internal-link endpoints, disjoint PM fractions and no duplicated treatment/combustion emissions. Real biogenic CO2 must remain visible independent of LCIA or GHG reporting conventions."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "validate_completeness: Reject unresolved positive-exchange identity or missing upstream/treatment linkage when delivering a complete dataset. An absent exchange needs evidenced nonoccurrence; a pending row, detection limit or unavailable tool is not a passing result."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground manufacturing data package; linked cradle-to-gate product dataset only after upstream and treatment compatibility is established"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Uncoated thermal base-paper supply to a downstream coater within the declared route and quality scope"
  excluded_use: "Finished thermal recording paper; photo/electrosensitive grades; complete label; universal CPC 32123 proxy; direct claims about the named producer’s LCI"
  required_metadata: "Reference qualifiers; gates; site; period; stage meters; supplier bases; all actual atomic exchanges; treatment recipient"
  required_quality_disclosure: "Physical and allocated ledgers; balance residuals; uncertainty; identities; missing upstream links; pending steam/formulation bases; applicability limits"
  update_trigger: "Changed furnish, coating state, sizing formulation, utility interface, treatment route, supplier reference basis or purchaser specification"
data_sources:
  - id: "jrc-pulp-paper-bref-2015"
