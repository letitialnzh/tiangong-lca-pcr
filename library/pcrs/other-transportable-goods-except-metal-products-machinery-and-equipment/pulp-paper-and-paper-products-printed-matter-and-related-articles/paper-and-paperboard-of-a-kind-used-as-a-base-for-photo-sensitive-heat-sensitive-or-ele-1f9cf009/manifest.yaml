    statement: "Uncoated thermal base-paper reels from purchased ECF-bleached chemical pulp; external electricity/industrial steam and external wastewater treatment. No functional coating, integrated pulping, paperboard or photo/electrosensitive method. Retained matching unpublished scaffold promoted; no overlap with material corrugated-paper PCR."
  mapping_proposal:
    status: "see_canonical_mapping"
    relation: "narrower"
    reason: "Only thermal base paper and the stated purchased-pulp route are supported; CPC 32123 also includes photo/electrosensitive paper and paperboard. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  reference_flow_identity:
    status: "verified_physical_subset"
    uuid: "a0b357fa-9e43-483e-806d-6a2f5c9c6357"
    limitation: "Broad uncoated-base product contains the target physical subset with no contrary material or route limitation. Actual grade, moisture and upstream dataset compatibility remain foreground requirements."
  unresolved_inventory_uuids:
    - row_id: "cationic_starch"
      reason: "Native Starch and food-grade modified starch do not confirm cationic papermaking starch. Positive exchange requires exact identity before dataset delivery."
  quantity_background_compatibility:
    - row_id: "steam_heat"
      status: "pending_supplier_definition"
      reason: "Physical boiler-steam-for-paper-drying identity confirmed; reference property is Gross calorific value/MJ. Net delivered enthalpy and supplier reference-energy conversion k_bg must be reconciled. No database benchmark adopted."
    - row_id: "akd"
      status: "pending_supplier_formulation"
      reason: "Synthesis/emulsification identity does not define emulsion strength or wet/active reference mass. Supplier commercial formulation and background reference basis required."
    - row_id: "pam"
      status: "pending_supplier_solids_basis"
      reason: "Cationic polymer identity confirmed; charge/grade and commercial dry/wet reference mass require supplier evidence."
    - row_id: "process_water"
      status: "requires_site_density"
      reason: "Tap-water identity has Mass/kg reference; secondary volume coefficient is not prescribed site density."
    - row_id: "calcium_carbonate"
      status: "requires_supplier_species_grade"
      reason: "Source calcium-carbonate/limestone-filler identity and CPC15200 are limited to actual compatible ground natural carbonate; species, processing, purity and paper-filler particle grade require supplier proof. No verified source CAS or generic PCC applicability."
  conditional_identity_limits:
    electricity: "CN 1–35 kV source; actual geography/year/mix/gate required."
    kraft_wrap: "Broad packaging-paper name versus CPC32129 graphic-paper classification debt; actual uncoated wrapping sheet and supplier basis required."
    calcium_carbonate: "Limestone-filler synonym and CPC15200 calcareous-stone source; no PCC, modified or formulated-filler substitution."
    wastewater: "Broad industrial Waste liquid; actual virgin-pulp papermaking effluent composition/receiver/treatment required. Native Mass/kg uses measured whole liquid or V times actual rho(T); water fraction is separate."
    collected_dust: "Actual exported collected dry-paper dust, separate from internal recovery and outdoor elementary PM; actual composition, moisture and receiver."
    sodium_hydroxide: "Actual compatible 95–98% industrial solid grade only."
    lubricant: "Actual whole formulation and petroleum fraction at least70% require SDS; 40.5MJ/kg source descriptor is not a factor."
    pallet: "Complete pallet mass includes fasteners; wood moisture/carbon separately measured."
  uuid_metadata_limitations: "Broad identities are conditionally scoped to real physical inputs. No verification of absent CAS, formulation, species or producer-specific inventory is claimed. Dissolving-pulp and wet-rendering-steam candidates rejected; names alone do not override contradictory metadata."
  evidence_scope: "JRC papermaking Chapter 7 and actual Andhra product description read. CTMP shared fragments rejected for this route. No historical or single-factory quantities adopted. Foreground protocols are requirements for future real collection, not fabricated measured data."
  scientific_review: "Not independently scientifically reviewed; controller acceptance and integration required."
