allocation_rules:
  - rule_id: allocate_campaign
    applies_to: "foreground_burden_allocation"
    rule: "First subdivide grades/campaigns and directly meter inputs and releases; investigate system expansion if compatible with the study goal. If these cannot resolve multifunctionality, demonstrate a relevant quantifiable physical relationship; only then consider another justified relationship such as economic value. No fixed allocation fraction or automatic mass allocation is prescribed."
    source_ids:
      - eu-pef-2021
  - rule_id: allocate_ledger
    applies_to: "foreground_burden_allocation"
    rule: "Keep full actual co-product/waste outputs and internal links in physical mass/water/carbon balances. Apply allocation shares to attributable environmental burdens in a separate ledger; never mechanically multiply actual recovered-paper output by a burden share. Record total, drivers and reconciliation for each shared meter."
    source_ids:
      - eu-pef-2021
      - jrc-paper-bref-2015
  - rule_id: allocate_recovery
    applies_to: "foreground_burden_allocation"
    rule: "Classify off-site recovered broke according to actual receiver acceptance/specification/function and lawful product/use status, not payment alone, alongside its economic/material role. Do not give internal broke, recycled water, captured dust or returned condensate a default avoided-production credit. Disclose the chosen recycling/end-of-waste convention and consistent receiver linkage before any credit."
    source_ids:
      - eu-pef-2021
      - jrc-paper-bref-2015
dataset_production:
  collection_protocols:
    - protocol_id: cp_production
      process_id: "sack_paper"
      flow_role: "finished"
      record_type: "Production and quality record"
      raw_fields: "reel/lot/grade; gross mass; core/wrap tare; net accepted paper mass P; delivery wet-basis moisture w; rejects; period; MD/CD tensile/stretch/TEA; grammage; air resistance; methods/conditioning; Clupak stage state"
      collection_method: "Use calibrated reel scales and acceptance records, moisture tests and grade tests; align production and exchange periods. Exclude rejected/recycled paper and nonpaper tare."
      unit: "kg; %; declared test units"
      frequency: "Each reel/lot and campaign"
      temporal_coverage: "Full representative production period including abnormal/startup/grade-change intervals"
      site_scope: "Selected machine and accepted grade"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale calibration; tare checks; moisture/test certificates; campaign closure"
    - protocol_id: cp_inputs
      process_id: "sack_paper"
      flow_role: "Material and packaging inputs"
      record_type: "Weighing, procurement and formulation records"
      raw_fields: "material/UUID; supplier; lot; delivery quantity; moisture/active solids; composition/SDS; inventory changes; packaging tare; blanket service and replacements; actual whole-product or supplier-expanded preparation inventory; supplier formulation/emulsification utilities/losses; packaging/delivery; actual separate onsite additions"
      collection_method: "Reconcile delivery, consumption and opening/closing stock on calibrated scales. Determine actual supplier reference quantities; document chemical non-use and material consumable coverage. Bought complete preparations are one compatible whole supplied-product exchange with their supplier manufacture, formulation/dispersion/emulsification, utilities, losses, packaging and delivery retained once. Constituents remain analytical composition/fate unless an explicitly evidenced supplier-expanded formulation inventory retains every one of those actual operations and boundaries; that expanded inventory and the whole supply are mutually exclusive for the same quantity. Pure ingredient UUIDs do not alone identify a complete preparation. Actual independently bought onsite additions, dilution/mixing water, utilities and losses remain separate real exchanges. Keep unknown complete-product identity/reference compatibility specific and unresolved; do not invent recipes or preparation factors."
      unit: "kg"
      frequency: "Each receipt/lot and campaign"
      temporal_coverage: "Same cp_production period with service-period adjustment disclosed"
      site_scope: "Selected grade, supply boundary and replacement service"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "invoices; supplier definitions; SDS; weighing/stock reconciliation"
    - protocol_id: cp_utilities
      process_id: "sack_paper"
      flow_role: "electricity; steam; condensate; water"
      record_type: "Meter and supplier records"
      raw_fields: "meter start/end; stage; grade; kWh; voltage/grid; steam mass P/T/dryness; condensate mass/state; supplied-water volume/density; supplier reference boundary; stock/storage losses"
      collection_method: "Use calibrated meters and paired delivery/return state measurements; reconcile stage meters with bills, supplier definitions and internal recovery diagram."
      unit: "kWh; MJ; kg; m3"
      frequency: "Continuous/shift totals and each supplier settlement"
      temporal_coverage: "Same cp_production period; all relevant operating intervals"
      site_scope: "Mill supply interface, stages and effluent treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; enthalpy method; supplier background definition; bill reconciliation"
    - protocol_id: cp_waste
      process_id: "sack_paper"
      flow_role: "broke; rejects; primary_sludge; bio_sludge; dust_waste; spent_blanket"
      record_type: "Waste shipment and internal balance records"
      raw_fields: "origin; stream; wet/dry mass; moisture; fibre/inorganic/chemical composition; capture/reuse; contamination; receiver; destination/date/treatment; stock change"
      collection_method: "Weigh each stream separately; sample solids/composition; reconcile receiver tickets and internal recovery at identical linked quantities. Track sludge conditioning constituents individually when used."
      unit: "kg"
      frequency: "Each shipment and matched batch/shift"
      temporal_coverage: "Same cp_production period; include stored waste and stock changes"
      site_scope: "Generation and handover boundaries, with each receiver distinct"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale records; dry-solids tests; waste acceptance specifications; receiver tickets"
    - protocol_id: cp_effluent
      process_id: "sack_paper"
      flow_role: "cod; bod; tss; nitrogen; phosphorus; water_return"
      record_type: "Effluent flow and analytical records"
      raw_fields: "outfall/receiving medium; time interval; bulk effluent volume V/mass; actual mixture/water-component density/state and validated water mass fraction; paired concentrations c; units; analytical method; BOD duration; nitrogen species coverage; blank/correction; bypass and outages"
      collection_method: "Meter final discharged volume and obtain representative flow-proportional composites matched to the same period; retain method, detection limit and non-detect treatment. Include separately evidenced bypass loads."
      unit: "m3; mg/L; kg"
      frequency: "Interval flow with representative paired analyses; retain actual sampling plan"
      temporal_coverage: "Same cp_production period; cover normal and abnormal operation"
      site_scope: "Final fresh-water outfall after treatment"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "flow calibration; sampling representativeness; laboratory QA; receiving-body proof"
    - protocol_id: cp_air
      process_id: "sack_paper"
      flow_role: "water_air; co2_bio; co2_fossil; methane_bio; n2o; pm25; pm2510; pm10plus"
      record_type: "Outdoor release and carbon/water balance records"
      raw_fields: "source; medium; species; carbon origin; matched gas flow/humidity/concentration/time; wet/dry and reference T/P; size convention; capture/reuse; operating interval; validated model inputs"
      collection_method: "Use representative source measurements after controls or a validated site mass-balance/model with explicit measured inputs and uncertainty. Reconcile water and biogenic/fossil carbon independently; do not substitute COD for carbon."
      unit: "kg; declared compatible gas and test units"
      frequency: "Measured intervals and representative source tests matched to operating states"
      temporal_coverage: "Same cp_production period including startup/abnormal periods"
      site_scope: "Dryer/Clupak, rewinder/cutter and primary/aerobic treatment outdoor releases"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling location/method; gas calibration; disjoint particle audit; model validation and carbon closure"
  calculation_rules:
    - id: normalize_campaign
      applies_to: "all inventory rows"
      rule: "q = A / P; A is the actual attributed exchange amount for the campaign; P is kg net accepted as-delivered paper in cp_production. Reference output is 1 kg; other numerator units are preserved. Sum exchange amounts before division, not arithmetic means of specific ratios."
      inputs:
        - A
        - P
        - cp_production
        - "relevant row protocol"
      output: "exchange amount per 1 kg reference flow"
      source_ids:
        - jrc-paper-bref-2015
    - id: solid_reconciliation
      applies_to: "pulp; finished; rejects; primary_sludge; bio_sludge; broke"
      rule: "D = W × (1-w); W is measured wet mass and w is measured water mass fraction of that same stream. Record dry solids for physical balance; retain actual supplier/delivery reference quantity separately."
      inputs:
        - W
        - w
        - cp_inputs
        - cp_production
        - cp_waste
      output: "dry-solid mass D"
      source_ids:
        - billerud-sack-handbook-2025
        - jrc-paper-bref-2015
    - id: effluent_load
      applies_to: "cod; bod; tss; nitrogen; phosphorus"
      rule: "L = sum(c_i × V_i × 0.001); c_i is mg/L and V_i is m3 for the same interval; L is kg of the specified indicator/species. Divide the summed load by P. Bypass is a separately matched measured interval, not an arbitrary uplift."
      inputs:
        - c_i
        - V_i
        - P
        - cp_effluent
        - cp_production
      output: "kg indicator/species per 1 kg reference flow"
      source_ids:
        - jrc-paper-bref-2015
    - id: steam_reconciliation
      applies_to: "steam; condensate"
      rule: "Preserve measured gross supplied mass and external return mass in the physical inventory. Derive Q_net from actual supply/return mass and compatible specific enthalpy states, deducting only documented losses outside the meter boundary. Link to the supplier unit only after its reference boundary matches; unknown states remain pending."
      inputs:
        - cp_utilities
        - "supplier definition"
        - "measured mass/enthalpy states"
      output: "physical steam/return mass and separately reconciled useful heat"
      source_ids:
        - jrc-paper-bref-2015
    - id: water_component
      applies_to: "water_return"
      rule: "M_liquid = measured mass or sum(V_bulk_i × measured rho_liquid_i); M_water_i = M_liquid_i × validated water fraction_i; V_water = sum(M_water_i / compatible rho_water_i); normalize V_water/P once. Bulk V remains pollutant-load volume; no assumed density/fraction or receiver broadening."
      inputs:
        - cp_effluent
        - "actual fraction/density/state/reference"
        - P
      output: "actual native water m3 per kg accepted paper"
      source_ids:
        - jrc-paper-bref-2015
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: scope_quality
      applies_to: "finished; pulp"
      requirement: "Verify all reference qualifiers and real grade acceptance, including absence of intentional wet strength, sizing or coating. Broad UUID identity is separate from physical quantity and background compatibility."
      evidence: "supplier specifications; process records; grade tests"
    - id: period_quality
      applies_to: "all inventory rows"
      requirement: "Use a representative declared site/year/campaign; reconcile stock changes, service-life quantities, abnormal operation and grade allocation. Do not extrapolate a short trial as an industry mean."
      evidence: "complete period ledger and justified sampling"
    - id: balance_quality
      applies_to: "sack_paper"
      requirement: "Close dry-fibre/solid, water, biogenic carbon and fossil carbon balances before applying environmental-burden shares. Use measured constituent carbon; do not turn COD/BOD into carbon without verified composition. Explain uncertainty and residuals."
      evidence: "matched stage diagrams, tests, internal links and separate burden ledger"
    - id: gap_quality
      applies_to: "all inventory rows"
      requirement: "Record unsupported UUIDs, receiver definitions, monitoring methods or conversions as explicit gaps. Document non-applicability with evidence; no default positive flow or zero. Add identified unlisted atomic exchanges before data-package completion."
      evidence: "gap register; supplier readback; actual monitored scope"
validation_rules:
  - rule_id: validate_reference
    applies_to: "foreground_dataset_conformance"
    rule: "Exactly one reference-product output links finished to the reference UUID and 1 kg net paper. Intermediate/final paper is not repeated with the same reference identity. Both languages use the same denominator, collection period and calculations."
    source_ids:
      - billerud-sack-handbook-2025
  - rule_id: validate_balance
    applies_to: "foreground_dataset_conformance"
    rule: "Reconcile physical output/input/stock amounts, identical internal links, pulp solids, paper moisture, separated waste composition, water and carbon closure. Burden allocation must not distort physical co-product quantities."
    source_ids:
      - jrc-paper-bref-2015
      - eu-pef-2021
  - rule_id: validate_emissions
    applies_to: "foreground_dataset_conformance"
    rule: "Verify actual outdoor-air/fresh-water medium and quantity definitions. Do not replace fresh-water TSS with dissolved solids or unspecified water; do not add cumulative and disjoint particle bins. Keep gross biogenic CO2. Hazardous species and other detected releases require separate atomic rows."
    source_ids:
      - jrc-paper-bref-2015
  - rule_id: validate_compatibility
    applies_to: "foreground_dataset_conformance"
    rule: "A successful identity lookup is not a complete dataset. Require supplier quantity/state/boundary compatibility, including steam enthalpy/return, pulp moisture, utility voltage and waste receiver. An unresolved flow or missing measurement remains explicit; report findings and skipped/inconclusive scope."
    source_ids:
      - jrc-paper-bref-2015
published_dataset_profile:
  dataset_role: "Foreground process dataset for a defined purchased-pulp Clupak paper campaign"
  downstream_use: "secondary_dataset and/or background_dataset only after compatible evidence linkage and quality assessment"
  allowed_use: "Upstream paper input to an explicitly compatible sack-conversion model; site-specific manufacturing assessment"
  excluded_use: "Other kraft-paper/board routes, integrated pulping, finished-sack service comparisons by mass alone, or unsupported zero-emission claims"
  required_metadata: "All reference qualifiers; site/time; pulp supply; grade acceptance; Clupak route; utility interface; treatment/outfall; allocation; receiver links; infrastructure/transport scope"
  required_quality_disclosure: "Actual primary data, missing UUIDs/measurements and background compatibility, balances, allocation uncertainty and independent review state"
  update_trigger: "Furnish, sizing/wet-strength/coating, compaction technology, supplier quantity basis, energy/treatment/receiver route, grade specification or source-method changes"
data_sources:
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Production of Pulp, Paper and Board (2015), DOI 10.2791/370629. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "§2.1.1 purchased versus integrated mills; §2.2.2 monitoring, Fig.2.3 and net paper production; §2.3.2.1 chemicals/additives; §2.4 water supply; §§7.1.1–7.1.5 stock/refining, drying, water/broke circuits and optional sizing; §7.1.10 cutting dust/dispatch; §7.1.11.5 kraftliner versus fluting. Qualitative process/measurement scope only; no BAT values, recipes or example-mill defaults."
  - id: "billerud-sack-handbook-2025"
    type: "handbook"
    reference: "Billerud, Handbook for Sack Kraft Papers and Paper Sacks, file edition sack-handbook-251218. https://www.billerud.com/globalassets/billerud/packaging-materials/sack-paper/sack-handbook-251218.pdf"
    used_for: "Printed pp.8,10,12,16–18: chemical-pulp sack paper, stretch/porosity and separate wet-strength/coating functions, moisture, wrapping and declared test methods. Manufacturer quality guidance, not a universal furnish or grade threshold."
  - id: "lahti-clupak-2015"
    type: "literature"
    reference: "Jussi Antero Lahti, Clupak process and its significance for the properties of extensible kraft paper, TU Graz dissertation (2015), DOI 10.3217/nxecf-99f14. https://repository.tugraz.at/publications/nxecf-99f14"
    used_for: "Abstract; §2.2.1–2.2.3 (printed pp.15–17, PDF27–29), Fig.2.6: moist-web MD compaction in the dryer by rubber blanket; §4.2 limitations/counterevidence on air permeance and trial interpretation. No trial operating points, numerical recipe or assumed porosity relationship adopted."
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279, Annex I §4.5 (decision hierarchy, Annex PDF pp.63–64). https://environment.ec.europa.eu/publications/recommendation-use-environmental-footprint-methods_en"
    used_for: "General multifunctionality hierarchy: investigate subdivision/system expansion, physical relationship, then other justified relationship; not paper-specific fractions or automatic recovered-paper credits."
