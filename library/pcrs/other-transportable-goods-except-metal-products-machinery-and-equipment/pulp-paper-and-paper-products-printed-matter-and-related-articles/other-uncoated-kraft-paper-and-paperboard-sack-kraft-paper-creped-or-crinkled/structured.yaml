system_boundary:
  rules:
    - rule_id: boundary_complete
      applies_to: "foreground_system_boundary"
      rule: "Include stock preparation/refining, forming/pressing, partial drying, Clupak compaction/final drying, trim/wind/wrap, measured utility losses, white-water/broke recovery, dust collection and primary/aerobic treatment. Record stage meters in a single foreground unit to avoid duplicate reference outputs."
      source_ids:
        - jrc-paper-bref-2015
        - lahti-clupak-2015
    - rule_id: boundary_route
      applies_to: "foreground_system_boundary"
      rule: "No in-place extension to integrated pulping, recovery boilers, lime kilns, other fuels, anaerobic wastewater reactors or sludge incineration. Establish their own complete process/emission evidence before adapting the boundary."
      source_ids:
        - jrc-paper-bref-2015
    - rule_id: boundary_losses
      applies_to: "foreground_system_boundary"
      rule: "Capture startup, grade-change, rejected lots, cleaning, bypass and abnormal release periods in the campaign. Missing measurements are gaps, not zero. Add every identified additional input, waste and pollutant as a distinct physical flow with applicable evidence."
      source_ids:
        - jrc-paper-bref-2015
    - rule_id: procurement_preparations
      applies_to: "foreground_system_boundary"
      rule: "Bought complete preparations are one compatible whole supplied-product exchange with their supplier manufacture, formulation/dispersion/emulsification, utilities, losses, packaging and delivery retained once. Constituents remain analytical composition/fate unless an explicitly evidenced supplier-expanded formulation inventory retains every one of those actual operations and boundaries; that expanded inventory and the whole supply are mutually exclusive for the same quantity. Pure ingredient UUIDs do not alone identify a complete preparation. Actual independently bought onsite additions, dilution/mixing water, utilities and losses remain separate real exchanges. Keep unknown complete-product identity/reference compatibility specific and unresolved; do not invent recipes or preparation factors."
      source_ids: []
