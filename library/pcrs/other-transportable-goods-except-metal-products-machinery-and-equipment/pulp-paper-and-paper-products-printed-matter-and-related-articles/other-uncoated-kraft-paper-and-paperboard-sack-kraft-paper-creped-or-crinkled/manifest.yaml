review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  scientific_review: Not independently scientifically reviewed or published. Classification acceptance is owned
    by the controller.
  scope_decision: Uncoated, unsized, non-wet-strength virgin unbleached softwood kraft sack paper mechanically compacted
    with a Clupak unit, supplied in reels before sack conversion. Purchased-pulp mill with purchased electricity,
    water and steam; on-site primary/aerobic treatment and fresh-water discharge. Excludes kraftliner, fluting and
    all other 32133 products.
  mapping_recommendation: "narrower to CPC 3.0 32133; Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate. Retained scaffold semantically includes the chosen subset."
  unresolved_flow_rows:
  - row_id: blanket
    reason: Actual Clupak elastic compaction article construction is not established by household warming-textile
      Blanket records. Vulcanized conveyor/transmission belting is only a future lead if supplier proves actual
      vulcanized belting construction/function and native quantity, not an assumption about this replacement blanket.
  - row_id: condensate
    reason: Actual external supplier-returned steam condensate is a physical utility return, not a water-resource
      emission, milk condensate or Korean biopile water input; no invented independent market. Internal recovery
      remains matched physical links.
  - row_id: tss
    reason: Actual named freshwater total suspended solids requires matching analytical method and receiving medium;
      fresh state100618 is unspecified-water suspended solids and cannot replace freshwater or dissolved-solids
      records.
  quantity_compatibility_pending:
  - Steam actual header pressure, temperature, dryness, return state and supplier quantity boundary; neither candidate
    pressure nor an MJ property proves compatibility.
  - Pulp delivery solids and supplier dry/air-dry/as-delivered reference quantity.
  - CPAM formulation/active basis, sodium hydroxide supplied/active basis, blanket construction/service period and
    exact supplier datasets.
  - Primary and biological sludge use a broad identity but require separate actual composition, wet/dry basis and
    receiver treatment.
  - BOD test duration and method versus LCI/LCIA quantity definition; unknown compatibility remains pending.
  - Measured particle fractions, effluent chemical indicators and carbon origins; no default factors provided.
  - Steamcbc native GCV/MJ requires supplier correspondence to measured net enthalpy; gross steam/return mass physical
    ledger retained, no source benchmark or fixed pressure default.
  - 'PDMS4af source polysiloxane family has no CAS/antifoam recipe: actual primary PDMS polymer/CAS/form/grade/carrier
    and native quantity/background correspondence pending.'
  - 851 actual wet kraft-pulp screening rejects,2a captured nonmetal kraft-paper dust andb481 retired rubber/composite
    Clupak blanket require independent measured construction/composition/moisture/hazard/receiver/native quantities,
    not mixed waste or tyre/specific-polymer/default recycling assumptions.
  - Raw electricityCN supplier/region/year/user-gate/loss native MJ correspondence; NaOH industrial solid95–98%
    actual supplied grade only; tap-water secondary1000kg/m3 is not a density default.
  - 'Freshwater Water5e measured water component versus mixed effluent bulk volume: real water fraction and compatible
    component density/state/reference; matched indicator outfall, no default pure-water share.'
  identity_metadata_caveats:
  - row_id: finished
    uuid: 936bdcb2-06b6-4ee9-8e7c-2f7762aba298
    issue: Names/synonyms explicitly include uncoated packaging paper with no restrictive production route; classification
      field points to wood-free graphic paper. Adopt physical packaging subset conditionally; request source classification
      clarification, not complete metadata validation.
  - row_id: cod
    uuid: 08a91e70-3ddc-11dd-97ed-0050c2490048
    issue: Direct read provides English baseName only; retain it and explicitly declare missing Chinese name.
  evidence_limitations:
  - BREF describes unit operations and monitoring; industry ranges, BAT-AELs and example-mill numbers are not inventory
    defaults.
  - Billerud describes sack-paper functions and tests; its grade thresholds are not universal acceptance values.
  - Lahti 2015 describes Clupak compaction and limited experiments; its operating points, furnish and numerical
    results are not general recipes.
  - Non-integrated purchased-pulp route is a declared modelling restriction, not a claim about the observed producer
    factories.
  independent_repair_note: Controller independently reviewed complete bilingual method and original primary-source
    contexts; original audit retained. Five conditional physical locators added and same Water UUID fresh-query
    witness repaired; no mapping/publication/scientific status promoted. Three identity gaps remain; provider/quantity/background
    compatibility and actual quantities still unresolved. BREF additive locator corrected to2.3.2.1,2.4 is water
    supply.
