  conditional_identity_links:
  - row_id: glassine
    uuid: 89996c15-334b-4f79-ad2c-e21d667f9c80
    limitation: Broad original explicitly includes glassine; no acid-parchment, tracing or greaseproof substitute. Upstream
      background must describe actual unsiliconized glassine.
  - row_id: electricity
    uuid: 50657322-939c-4829-a87b-47c093bfa6a7
    limitation: Raw CN supply location, <1kV grid-average consumption-to-user and native Net calorific value/MJ are retained;
      actual country/site/year/voltage/provider/background pending, no foreground CN default.
  - row_id: pe_wrap
    uuid: e64eb06c-6dc9-45f1-b003-3dc6c44b27e2
    limitation: Name/CAS9002-88-4/comment identify PE film; source CPC29220 inconsistent. Physical identity conditionally
      retained, supplier and classification clarification pending.
  - row_id: cleaning_water
    uuid: d1e0e36c-07f0-4a75-bdcb-efb5d9e2ac36
    limitation: Generic treated tap-water supply, Mass/kg reference verified. Viscose-specific CTUe water, Hong Kong background
      and raw reservoir water rejected for this generic row.
  - row_id: ipa_cleaner
    uuid: a4a75541-e156-4e30-947c-ba067a682afd
    limitation: Raw China production mix and absent CAS/purity do not establish generic-world background or pure-species reference
      basis; verify actual site/year/provider/SDS composition/CAS and delivered-grade versus pure-IPA mass before linking
      or measured conversion.
  - row_id: polyester_wipe
    uuid: 5ac0c411-47ce-40ed-8ce1-9aaf9c351ca4
    limitation: Direct record includes nonwoven polyester fabrics with no incompatible treatment; supplier confirms composition.
      CPC27999 quilted-article classification is inconsistent with broad nonwoven description; disclose clarification debt.
  - row_id: release_paper
    uuid: faaae1a8-97af-4a26-bdb2-198abfc0d8e4
    limitation: Broad coated-paper foreground physical identity; actual complete glassine plus functional silicone coating
      and dispatch moisture required. No printed/aqueous-varnish/mineral-coating recipe or matched supplier/background inferred.
      Historical52314534 reinforced-with-fibre route is not adopted as ordinary glassine; original judgment preserved in evidence.
  - row_id: uncoated_trim
    uuid: f140a5a2-5318-4d06-956f-a87b9c6fda25
    limitation: Unspecified waste-paper original has no conflicting treatment/source restriction; conditional physical subset
      requires clean uncoated glassine and identified receiver.
  - row_id: silicone_base
    uuid: 59808a77-a33c-493f-8e5f-c0eb3e837943
    limitation: 'This broad coating-material identity locates only the actual neat pre-catalyzed hexenyl-functional liquid
      base as a whole delivered formulation, including its declared platinum complex, inhibitor and other supplied constituents.
      Require supplier/SDS and grade-specific complete composition, water/volatile/solids definitions, reactive functionality
      and mass reference before background linkage. It is neither pure PDMS nor the mixed bath: do not count included catalyst/inhibitor
      separately or include separately dosed crosslinker mass here.'
  - row_id: hydride_crosslinker
    uuid: 4af74934-ef9f-40c1-9de6-e6223ca0b4fe
    limitation: The broad polysiloxane-fluid identity conditionally covers only the actual undiluted silicon-hydride-functional
      polysiloxane crosslinker supplied as this separate product. Verify supplier/SDS complete grade composition, SiH functionality
      and assay definition, delivered mass basis and compatibility with the declared hexenyl base and primary production route.
      The raw record has no CAS and does not verify a particular functional polymer, purity or background; ordinary nonfunctional
      PDMS, chlorosilanes, elemental silicon and silicone adhesive do not substitute. Any supplied inhibitor or other constituent
      remains in its delivered product mass and supplier composition account, without an invented amount or duplicate feed.
  - row_id: coated_trim
    uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
    limitation: Retain this independent actual silicone-coated glassine trim/rejected-web solid, with paper/coating composition,
      cure state, moisture and actual receiver acceptance. The broad industrial solid-waste identity determines neither recyclability
      nor treatment, hazardous status, receiving background or avoided credit; other separately generated streams cannot be
      merged here.
  - row_id: spent_wipe
    uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
    limitation: Retain this independent contaminated polyester-cloth solid, including its measured retained silicone, IPA
      and water; establish actual collection state and receiver acceptance. The broad industrial solid-waste identity is not
      clean polymer scrap or proof of hazard class/treatment. Its retained solvent/water stays in the whole wet cloth mass
      and constituent ledger, never a second external liquid transfer.
  - row_id: collected_dust
    uuid: 851fd235-5a89-4cf9-b7da-5c278ed1dcbb
    limitation: Retain this independent captured solid glassine/coating cutting-dust stream with stage, composition, moisture
      and receiver acceptance; captured coating mist returned internally is a paired internal record, while a separately exported
      mist residue needs its own reviewed atomic row. The broad industrial solid-waste identity implies no receiving treatment/hazard
      class or background match. Captured mass is not also released outdoor PM.
  - row_id: spent_bath
    uuid: bdfc32cf-8028-40a8-a2e4-2d73422ece34
    limitation: Retain this independent actual uncured liquid bath drain-down/expired formulation, with full base/crosslinker/catalyst/inhibitor
      composition and measured water/volatile/solids fractions at transfer. Verify actual liquid collection state and receiving
      conditions; cured solid residue requires a separately reviewed solid identity/row. Broad industrial waste-liquid identity
      is not a pure silicone chemical, paint recipe, hazard classification, treatment or credit.
  - row_id: aqueous_effluent
    uuid: bdfc32cf-8028-40a8-a2e4-2d73422ece34
    limitation: 'Retain this independent actual whole wet off-site cleaning wastewater: water plus actual paper fines, coating
      and any measured IPA, with receiver/treatment compatibility and sampling state. Use weighed whole-stream mass or actual
      volume and matching measured density, never an assumed 1000 kg/m3. Constituent H2O/IPA/dry solids belong to reconciliation
      subledgers, not additional external waste or freshwater-emission rows for the same transfer. Broad industrial waste-liquid
      identity establishes neither actual hazard status nor treatment/background.'
  - row_id: spent_ipa
    uuid: bdfc32cf-8028-40a8-a2e4-2d73422ece34
    limitation: Retain this independent actual liquid receiver transfer of spent IPA with measured water, coating and other
      supplied constituents, sampling state and compatible receiver/treatment. Weigh the whole mixture; obtain matching actual
      density for volume conversion. Keep pure IPA and H2O masses as constituent subledgers only, exclude solvent already
      exported in wipes/aqueous effluent, and infer no hazard class, recycling yield, treatment/background or credit from
      this broad industrial waste-liquid identity.
  remaining_evidence_requirements:
  - Actual site supplier grades, moisture, SiH/reactive-group assays, coat weight/cure/release trials, stage meters, aerosol
    size-resolved boundary measurements, receiver acceptance and background quantity/geography compatibility are required
    before a complete linked dataset. No foreground amount is invented.
  - PE-film CPC29220 and nonwoven-polyester CPC27999 source classifications conflict with physical names/comments; obtain
    source clarification. No CAS or hard route conflict is waived.
  - The neat pre-catalyzed two-feed coating system excludes separately dosed catalyst, modifier and anti-mist additives. Actual
    additional ingredients or emissions require their own named atomic exchanges and evidence before claiming complete scope.
  - All-electric thermal curing is the scoped energy configuration; steam, combustion, oxidizers and integrated papermaking
    require separately reviewed inventories, not zeroed exchanges.
  physical_accounting_review:
    whole_wet_external_residues: one separate exchange per actual stream; constituent H2O/IPA/paper/coating ledgers do not
      create additional external transfers
    packaging: actual separately measured core/wrap inputs, stocks, returns/losses and shipped tare preserved in independent
      physical ledgers, excluded from Q_ref
    dry_balance_scope: paper/coating constituents only; independent cleaning/cloth/packaging accounts prevent omitted or double-counted
      material
    carbon_origin: actual supplied constituent origin/fractions required, unknown not assigned by generic material name
    inventory_and_amounts: all22 stable cards retained; original amount dictionaries and denominator unchanged; no numeric
      ranges or recipes fabricated
