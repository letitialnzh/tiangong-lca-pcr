    required_property_ref:
      name: ""
      uuid: ""
    required_unit: ""
    rule: "Every exchange uses per 1 kg reference flow. Collect reporting-period totals at matching stocks and dates, apply normalize_reference; do not divide by gross roll mass or input glassine mass."
