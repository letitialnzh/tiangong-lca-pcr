    applies_to: "mass/water/carbon balance"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For each weighed wet stream dry mass = wet mass × (1 - measured wet-basis water fraction). Formulated base and crosslinker use delivered mass and measured solids/functionality; pure-chemical and mixture masses are not interchangeable. Supplier reactive-group definitions govern any SiH/reactive-group calculation; no fixed mix ratio."
