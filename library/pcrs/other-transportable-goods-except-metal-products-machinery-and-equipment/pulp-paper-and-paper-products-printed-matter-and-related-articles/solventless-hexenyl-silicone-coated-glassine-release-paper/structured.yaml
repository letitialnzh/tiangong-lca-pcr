    applies_to: "paper/coating balance"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Area A = accepted width × accepted length, excluding trim; single-side cured coating mass = A × measured coat weight / 1000 when coat weight is in g/m2. Reconcile with base-paper dry mass and paper moisture; do not equate bath charge with retained coating."
