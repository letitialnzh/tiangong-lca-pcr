allocation_rules:
  - rule_id: allocation_separate
    applies_to: "coating_unit"
    rule: "First subdivide product campaigns and stage meters; assign recipe-specific inputs, rejects and cleaning directly. Shared electric use follows measured equipment time/load, with startup and idle consumption assigned and disclosed. No default allocation fraction.  Demonstrate that the measured time/load driver explains shared electric demand; otherwise collect better subdivision evidence before allocating."
    source_ids:
      - eu-pef-allocation-2021
      - dow-hexenyl-guide
      - jrc-pulp-paper-bref-2015
  - rule_id: allocation_physical
    applies_to: "material_balance"
    rule: "Keep unallocated physical mass, moisture and carbon ledgers separate from allocated environmental loads. Never multiply physical co-product outputs or internal transfers by burden shares."
    source_ids:
      - jrc-pulp-paper-bref-2015
  - rule_id: allocation_residue
    applies_to: "residue_receiver"
    rule: "Clean trim sale does not automatically justify a substitution credit or co-product status. Disclose economic/physical status and receiver, use one declared recycling/allocation convention, and avoid simultaneous avoided-paper credit and downstream recycling credit. Require independent review if a genuine co-product creates a new allocation problem."
    source_ids:
      - eu-pef-allocation-2021
      - jrc-pulp-paper-bref-2015
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "coating_unit"
      flow_role: "release_paper"
      record_type: "measured_record"
      raw_fields: "roll ID; gross mass; core/wrap tare; accepted net Q_ref; rejected mass; width; length; wet-basis moisture; substrate grade; coat weight; cure/anchorage/release results; adhesive/aging/peel conditions"
      collection_method: "Calibrated weighing and moisture sampling linked to dispatched rolls; record coating/cure test method, calibration and sampling age. Determine coat weight with a substrate/formulation-calibrated method; no copied supplier trial value. Sum accepted net roll paper mass for Q_ref; exclude packaging and rejects. Report the matching-period row total divided by Q_ref for per 1 kg reference flow; retain original totals and stocks."
      unit: "kg; m; g/m2"
      frequency: "Each accepted roll and representative samples per coating batch"
      temporal_coverage: "Declared representative reporting period including changeovers, startup, losses and closing stocks"
      site_scope: "One coating converter and declared line/grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, dated samples, uncertainty and reconciliation retained"
    - protocol_id: cp_material
      process_id: "coating_unit"
      flow_role: "material input"
      record_type: "measured_record"
      raw_fields: "supplier/grade; receipt and consumption mass; opening/closing stock; returned mass; paper moisture/grammage; formulation SDS/solids; catalyst content; crosslinker/reactive-group definitions; core/wrap mass, opening/closing stocks, shipped tare, external returns/losses; actual constituent carbon origin"
      collection_method: "Weigh each delivered material independently; reconcile receipts plus opening stock minus closing stock and external returns with dosing/dispatch records. No recipe or chemical-property defaults. Retain separate supplier/grade totals and paper/coating balances before normalization. Report the matching-period row total divided by Q_ref for per 1 kg reference flow; retain original totals and stocks."
      unit: "kg"
      frequency: "Each lot/batch and period stock closure"
      temporal_coverage: "Declared representative reporting period including changeovers, startup, losses and closing stocks"
      site_scope: "One coating converter and declared line/grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, dated samples, uncertainty and reconciliation retained"
    - protocol_id: cp_energy
      process_id: "coating_unit"
      flow_role: "electricity"
      record_type: "measured_record"
      raw_fields: "meter ID; stage; kWh readings; run/idle/startup times; actual voltage; shared load; background region/year"
      collection_method: "Use calibrated stage meters, including oven and extraction; reconcile with unit intake, retain measured shared-service drivers. Sum recorded kWh, convert by 3.6 to MJ, retain stage subledgers. Report the matching-period row total divided by Q_ref for per 1 kg reference flow; retain original totals and stocks."
      unit: "kWh; MJ"
      frequency: "Continuous readings with batch/shift closure"
      temporal_coverage: "Declared representative reporting period including changeovers, startup, losses and closing stocks"
      site_scope: "One coating converter and declared line/grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, dated samples, uncertainty and reconciliation retained"
    - protocol_id: cp_cleaning
      process_id: "coating_unit"
      flow_role: "cleaning"
      record_type: "measured_record"
      raw_fields: "cleaning event; agent approval/SDS; IPA purity; water and wipe mass; solvent inventory; retained/recovered solvent in separate waste streams; residual solvent on product; exhaust mass"
      collection_method: "Weigh or meter actual agents independently; analyze IPA fraction and reconcile it across liquid, wipe, wastewater, stocks and outdoor release. Keep closed-container transfer records. Aggregate each chemical and destination separately; retain unclosed solvent balance as unknown. Report the matching-period row total divided by Q_ref for per 1 kg reference flow; retain original totals and stocks."
      unit: "kg; m3 with measured density"
      frequency: "Each cleaning event and stock closure"
      temporal_coverage: "Declared representative reporting period including changeovers, startup, losses and closing stocks"
      site_scope: "One coating converter and declared line/grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, dated samples, uncertainty and reconciliation retained"
    - protocol_id: cp_residue
      process_id: "coating_unit"
      flow_role: "waste output"
      record_type: "measured_record"
      raw_fields: "row_id; stage; waste mass; moisture; coating/IPA/cloth fractions; cure state; internal return; receiver; receiver acceptance; destination treatment"
      collection_method: "Separate uncoated trim, coated trim, bath residue, wipes, effluent, spent IPA and captured dust; weigh only external transfers; match receiver records and actual composition. Sum by atomic stream and destination; reconcile generated waste with stocks and internal returns. Report the matching-period row total divided by Q_ref for per 1 kg reference flow; retain original totals and stocks."
      unit: "kg"
      frequency: "Each collection/transfer and period closure"
      temporal_coverage: "Declared representative reporting period including changeovers, startup, losses and closing stocks"
      site_scope: "One coating converter and declared line/grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, dated samples, uncertainty and reconciliation retained"
    - protocol_id: cp_air
      process_id: "coating_unit"
      flow_role: "particulate output"
      record_type: "measured_record"
      raw_fields: "source/stage; capture device; test method; sample volume; aerodynamic size bins; blank correction; mg/m3; flow/time; operating states; emitted mass; paper/silicone fractions"
      collection_method: "Use route-appropriate size-resolved exhaust/fugitive measurements with actual volumetric basis and periods; document captured and released material separately. If only total dust or cumulative PM10 is available, do not invent fractions. Integrate post-control boundary releases for each non-overlapping size bin. Report the matching-period row total divided by Q_ref for per 1 kg reference flow; retain original totals and stocks."
      unit: "mg/m3; m3; kg"
      frequency: "Representative tests covering normal runs, startup and cutting; retain actual integration periods"
      temporal_coverage: "Declared representative reporting period including changeovers, startup, losses and closing stocks"
      site_scope: "One coating converter and declared line/grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, dated samples, uncertainty and reconciliation retained"
    - protocol_id: cp_water
      process_id: "coating_unit"
      flow_role: "water balance"
      record_type: "measured_record"
      raw_fields: "paper wet masses and moisture; supplied base/crosslinker and cleaner water fractions; cloth/core/wrap moisture and shipped tare; cleaning water; independent liquid/solid waste and external-return water; stocks; exhaust humidity/flow; ambient inlet humidity"
      collection_method: "Reconcile process water with calibrated weights/meters and moisture assays; verify exhaust water after subtracting incoming ambient vapour. No assumed density or cure-generated water. Reconcile net evaporated water and retained/transfer water before normalization. Report the matching-period row total divided by Q_ref for per 1 kg reference flow; retain original totals and stocks."
      unit: "kg; m3 with measured density"
      frequency: "Same roll/batch records and period stocks"
      temporal_coverage: "Declared representative reporting period including changeovers, startup, losses and closing stocks"
      site_scope: "One coating converter and declared line/grade campaigns"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw records, dated samples, uncertainty and reconciliation retained"
  calculation_rules:
    - id: normalize_reference
      applies_to: "all inventory rows"
      rule: "q_ref = q_period / Q_ref; q_period is this row’s measured or calculated reporting-period exchange; Q_ref is accepted net paper mass in kg; q_ref is amount per 1 kg reference flow."
      inputs:
        - q_period
        - Q_ref
        - cp_output
      output: "q_ref"
      source_ids: []
    - id: area_coating
      applies_to: "retained coating"
      rule: "m_coat = A × coat_g_m2 / 1000; A = accepted width × accepted length. Measured single-side coat weight is grade/calibration specific; do not use supplier example values."
      inputs:
        - cp_output
        - coat_g_m2
        - A
      output: "m_coat kg"
      source_ids:
        - dow-hexenyl-guide
    - id: packaging_ledger
      applies_to: "paper_core; pe_wrap"
      rule: "For each material separately, external receipts + opening stock = actual mass shipped with rolls + separately recorded external waste/loss + closing stock + external unused-material returns. Internal reusable cores cancel in the asset ledger. Keep these measured physical departures in cp_output/cp_material tare and dispatch records, outside Q_ref; any actual external packaging waste needs its own atomic row/receiver, not forced into paper/coating residues. No burden share changes physical mass."
      inputs:
        - cp_material
        - cp_output
        - cp_residue
      output: "separate core/wrap physical ledgers"
      source_ids: []
    - id: dry_balance
      applies_to: "physical paper and coating"
      rule: "External dry paper/coating receipts + opening dry stock = dry accepted paper + dry exported paper/coating constituents + dry emitted paper/coating particulate/other specifically measured coating species + closing dry stock + external unused-paper/coating returns. This ledger contains only paper/coating constituents of mixed residues, not whole wet waste, IPA cleaner, wipe material, core or wrap; retain their separate constituent/material accounts without duplicating a waste transfer. Internal transfers cancel; consumed amounts are reconciled separately and never combined with a second stock adjustment. Residual disagreement remains explicit uncertainty, not forced zero."
      inputs:
        - cp_material
        - cp_output
        - cp_residue
        - cp_air
      output: "unallocated dry physical ledger"
      source_ids: []
    - id: water_balance
      applies_to: "water_vapour"
      rule: "Measured water in all actual incoming materials/cleaning + opening water stock = water in accepted paper, shipped packaging, independent residues and external unused-material returns + closing water stock + net process water vapour. Include measured formulation, cleaner and cloth/packaging moisture where present, without assuming marketing solids content proves zero water; whole wet external residues occur only once, with H2O in constituent subledgers. Separate ambient ventilation water. Do not assume addition cure creates stoichiometric water."
      inputs:
        - cp_water
        - cp_output
        - cp_residue
      output: "net process water kg"
      source_ids: []
    - id: ipa_balance
      applies_to: "ipa_air"
      rule: "External IPA receipts + opening IPA stock = IPA in separately exported liquid/wipes/effluent + closing IPA stock + external unused-IPA returns + retained product IPA + outdoor emitted IPA. Internally recovered solvent cancels, and recovery-bound exported liquid belongs to one liquid transfer only; never treat total liquid as pure IPA."
      inputs:
        - cp_cleaning
        - cp_residue
      output: "IPA species balance kg"
      source_ids:
        - epa-paper-coating-2007
    - id: particulate_integration
      applies_to: "outdoor particulate rows"
      rule: "m_i = sum(c_i × V_i) / 1000000 for c_i in mg/m3 and matching V_i in m3. PM10 - PM2.5 gives the middle bin only when tests have matching source/time/control bases; total dust - PM10 gives >10 only with a compatible measured total. Never add cumulative PM10 to its component bins."
      inputs:
        - cp_air
      output: "each disjoint bin kg"
      source_ids: []
    - id: carbon_ledger
      applies_to: "physical carbon"
      rule: "Keep paper, coating, IPA, cloth, core and wrap carbon separately with measured or supplier-supported constituent carbon fractions and biogenic/fossil origin, stocks and destinations; unknown fractions/origins remain unknown. Include actual core/wrap shipped out and external residue/return constituents, excluding them from net reference paper mass and never assigning source origin from a generic name. Retained carbon is not an immediate negative CO2 emission. Record measured biogenic CO2 if present regardless of a GHG reporting convention; do not infer carbon conversion or combustion in this all-electric route."
      inputs:
        - cp_material
        - cp_output
        - cp_residue
        - cp_air
        - cp_cleaning
      output: "unallocated source-separated carbon ledger"
      source_ids: []
  data_quality_requirements:
    - id: identity_compatibility
      applies_to: "all linked exchanges"
      requirement: "Verify physical identity separately from quantity/background compatibility. Broad product rows require actual subset evidence; incompatible species/CAS/route are not proxies. Unresolved rows block a fully linked dataset, not their collection protocol."
      evidence: "SDS, supplier declaration, grade, receiver and background definitions"
    - id: measurement_complete
      applies_to: "all rows and balances"
      requirement: "Retain raw data and uncertainty; missing readings, undetected values and proven absent activities are distinct. No invented recipe, coat weight, efficiency, particle split or process emission factor."
      evidence: "Calibration, detection limits, matching denominators and reconciliation"
    - id: performance_tests
      applies_to: "reference paper"
      requirement: "Report substrate/formulation-specific coat-weight, cure, anchorage and release tests and their aging/adhesive/peel conditions. Supplier demonstration recipes, trial limits and setpoints are case evidence, never universal defaults."
      evidence: "dow-hexenyl-guide"
    - id: source_scope
      applies_to: "method evidence"
      requirement: "BREF §7.1.10 supports cutting-dust and trim collection, not silicone recipe or coated-trim recyclability. EPA2007 supports cleaning-source identification only; historic industry factors and legal thresholds are not imported."
      evidence: "jrc-pulp-paper-bref-2015; epa-paper-coating-2007"
validation_rules:
  - rule_id: validate_reference
    applies_to: "reference_paper"
    rule: "Require all reference qualifiers, positive Q_ref, one product output release_paper and the same 1 kg denominator in both languages; reject gross-roll, area-only or unqualified paper substitutes."
    source_ids:
      - dow-hexenyl-guide
  - rule_id: validate_route
    applies_to: "coating_unit"
    rule: "Require unsiliconized glassine, one-side neat hexenyl addition cure, compatible two-feed supplier identities and all-electric utility proof. Additional real components, utilities, emissions or treatment require complete atomic extensions; exclude a changed coating route."
    source_ids:
      - dow-hexenyl-guide
      - wacker-release-systems
  - rule_id: validate_ledgers
    applies_to: "physical_accounting"
    rule: "Reconcile mass, water and separately sourced carbon before burden allocation; internal transfers match at both ends. Particle bins must be disjoint; collected dust, aerosol composition and emitted fractions cannot double count. Unclosed balances and unsupported size fractions are inconclusive, not passing."
    source_ids:
      - jrc-pulp-paper-bref-2015
      - wacker-release-systems
  - rule_id: validate_cleaning
    applies_to: "cleaning"
    rule: "Conditional cleaning rows require actual presence/absence evidence and species balances. A waste transfer is not a direct water emission; assess actual receiving treatment separately. Any actual measured biogenic CO2 remains in LCI, and other detected species require named rows."
    source_ids:
      - epa-paper-coating-2007
  - rule_id: validate_linkage
    applies_to: "data_package"
    rule: "Check actual flow property/unit, composition, source category and supply/receiver bases. Resolve blank UUID rows and disclosed source defects before claiming complete background linkage; identity lookup alone or mechanical PCR checks do not establish scientific approval."
    source_ids:
      - dow-hexenyl-guide
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "A measured converter-gate exchange supplying one qualified silicone-coated glassine paper input"
  allowed_use: "Only matching single-sided neat hexenyl addition-cured glassine and the disclosed electric/cleaning configuration after all identity and quantity links are complete"
  excluded_use: "Generic CPC32149 average, finished label/packaging, different cure chemistry, double-sided or polymer-film substrate, fuel/steam plant, unqualified upstream paper or fully linked claims with unresolved rows"
  required_metadata: "Site/period, grade/recipe identity, functional qualifiers, Q_ref and moisture, upstream links, meters, stocks, source scope, receivers and recycling/allocation convention"
  required_quality_disclosure: "Uncertainty, missing data, proven absences, source-classification defects, unclosed balances, background compatibility, unresolved identities and independent-review status"
  update_trigger: "Changed substrate, formulation/cure/side count, utilities, cleaning, emissions, receiver or source data; recalculate balances and recheck applicability"
data_sources:
  - id: "dow-hexenyl-guide"
    type: "handbook"
    reference: "[Dow SYL-OFF Solventless Platinum-Catalyzed Hexenyl Silicone Release Coatings](https://www.dow.com/documents/30/30-1162-01-syl-off-solventless-hexenyl-formulation-guide.pdf?iframe=true), pp.2–5, General information/Product range/Product handling/Application information"
    used_for: "Chemistry, pre-catalyzed delivered base, glassine compatibility, coating/cure/performance variables; no quantitative recipe or trial setpoint adopted"
  - id: "wacker-release-systems"
    type: "handbook"
    reference: "[WACKER DEHESIVE release systems](https://www.wacker.com/h/medias/6188-EN.pdf), PDF p.11 / printed pp.20–21"
    used_for: "Independent solventless roll-coating and mist context; formulation/catalyst specifics remain supplier-dependent"
  - id: "jrc-pulp-paper-bref-2015"
    type: "official_guidance"
    reference: "[JRC Production of Pulp, Paper and Board BREF (2015)](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf), §7.1.10, printed p.670 / PDF p.708"
    used_for: "Reeling/cutting/dispatch, dust and trim collection; no silicone chemistry, emission factor or coated-waste recycling guarantee"
  - id: "epa-paper-coating-2007"
    type: "official_guidance"
    reference: "[US EPA 453/R-07-003, Control Techniques Guidelines for Paper, Film, and Foil Coatings (2007)](https://nepis.epa.gov/Exe/ZyPURL.cgi?Dockey=P100957P.TXT), IV.A–B and V.B"
    used_for: "Thermal curing and cleaning-source identification, separate solvent/wipe transfers; qualitative process support, not a present legal compliance test or default solvent/factor"
  - id: "eu-pef-allocation-2021"
    type: "official_guidance"
    reference: "[European Commission Environmental Footprint Annexes (2021)](https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf), Annex I §4.5, pp.63–64"
    used_for: "Subdivision-first and justified underlying physical relationship for shared burdens; no paper-specific fraction or claim of complete PEF conformity"
