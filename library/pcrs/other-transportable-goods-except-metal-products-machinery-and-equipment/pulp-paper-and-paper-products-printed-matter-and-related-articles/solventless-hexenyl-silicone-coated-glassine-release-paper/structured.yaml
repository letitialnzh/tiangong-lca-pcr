      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Convert metered kWh to MJ with 1 kWh = 3.6 MJ, then normalize. Preserve the original property label and user-side voltage; the label is not a fuel heating value or proof of steam enthalpy."
