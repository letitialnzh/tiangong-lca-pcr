          description: "Final-outlet AOX with the laboratory halogen-mass convention; require agreement with the flow/LCIA sum definition before quantitative use. ECF is not proof of zero AOX; identify high-impact substances separately where possible. Emissions to water, unspecified; disclose the actual receptor and retarget known freshwater/marine releases. The direct record has no Chinese baseName; retain its original English display."
          amount:
            expression: "Use cp_effluent measured external quantity for the same period divided by D. Conditional absence requires screening evidence; missing quantity is not zero."
            value_mode: "foreground_record"
            specificity: "site_specific"
            basis:
              text: "per 1 kg reference flow"
              kind: "reference_flow"
            evidence:
              kind: "collected_record"
              collection_protocol_id: cp_effluent
              source_ids:
                - eu-pulp-bref-2015
                - epa-chemical-pulp-1990
            ranges: []
allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "First subdivide stage meters and shared services where causal use can be measured. Keep a physical mass/water/carbon/Mg/S/energy ledger separate from the allocated environmental-burden account. Internally recovered chemicals, fuel liquor and process steam are loops, not sold co-products and earn no avoided-purchase credit on top of reduced purchases. Net exported electricity and useful heat are co-products only with actual recipient, accepted delivery and consistent net basis. Keep their full physical quantities after allocation. For inseparable shared burdens, document the goal-specific physical causal relationship first. If it cannot be justified, use a disclosed economic allocation based on comparable period, currencies and saleable output prices, with sensitivity to alternatives. A share is product revenue divided by total revenue from actual joint products; shares sum to one. Apply shares to joint environmental burdens, not to physical co-product outputs or internal link quantities. A mass share between pulp kg and energy MJ is invalid. Do not combine allocation with substitution credits for the same exported energy. These are PCR modelling requirements, not a claim that the BREF prescribes an LCA allocation formula. [eu-pulp-bref-2015 §4.1.4 for physical recovery/energy separation]"
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_pulp
      process_id: "mill"
      flow_role: "Accepted pulp and dry denominator"
      record_type: "lot mass and assay"
      raw_fields: "lot; species; cook base; ECF stages; buyer specification; quality tests; net wet mass m_lot; representative sample dry fraction d_lot; packaging tare; rejected lots; opening/closing stock"
      collection_method: "Calibrated net weighing excluding wrapping/strapping; sample across bale locations and lots using a documented stratified site plan, sealed moisture samples, replicate oven-dry assays to constant mass and retained lab method/calibration. Use the applicable solid-pulp dry-matter method after checking non-water volatiles; separately validate saleable-lot sampling. Reject incomplete CoA lots."
      unit: "kg; fraction"
      frequency: "Each accepted lot and moisture-changing event"
      temporal_coverage: "Entire declared production period including startup/upset"
      site_scope: "Same mill, eucalyptus and declared route; subdivide other grades"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibrations, sampling plan, raw wet/dry weights, replicate variation, CoA and stock reconciliation"
    - protocol_id: cp_material
      process_id: "mill"
      flow_role: "External wood, chemicals and packaging"
      record_type: "material ledger"
      raw_fields: "purchase/stock/return; supplier; exact substance and form; concentration; wet/dry mass; wood species; chip volume; packing; density protocol; actual stage; internal recycle"
      collection_method: "Weigh or meter actual external consumption with opening stock plus receipts less closing stock and returned material; record stage dosing independently of fresh purchase. Use paired chip wet/dry mass and measured volume; retain supplier reference-basis proof."
      unit: "kg; m3; fraction"
      frequency: "Per delivery and batch"
      temporal_coverage: "Entire declared production period including startup/upset"
      site_scope: "Same mill, eucalyptus and declared route; subdivide other grades"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier assays, scale/meter calibration, inventory receipts and stage-material balance"
    - protocol_id: cp_energy
      process_id: "mill"
      flow_role: "Import, generation, own use, export and fuel"
      record_type: "energy ledger"
      raw_fields: "meter identifier; voltage; imported/generated/own-use/exported kWh; gas volume T/P/Z wet/dry composition; steam/condensate masses P/T/quality/enthalpy; losses; receiving interface"
      collection_method: "Separate calibrated meters and fuel records, matched to production timestamps. Reconcile CHP fuel/recovered-organic energy, boiler/generator efficiency, own use and independent import/export. Verify background gas volume and heat convention in writing; an unverified steam identity is not usable net heat."
      unit: "kWh; MJ; m3; kg"
      frequency: "Continuous meters and daily reconciliation"
      temporal_coverage: "Entire declared production period including startup/upset"
      site_scope: "Same mill, eucalyptus and declared route; subdivide other grades"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Energy diagram, supplier conventions, calibration and heat balance"
    - protocol_id: cp_water
      process_id: "mill"
      flow_role: "Water abstraction, supply, return and evaporation"
      record_type: "water ledger"
      raw_fields: "intake source/basin; tap supply; fresh make-up; circulation; wood water; reaction water; final liquid discharge/bypass and named freshwater/marine receptor/location; evaporation; product/sludge water; stock change; interval final mixed-liquid mass/volume and representative mixture density; independently validated water fraction; corresponding H2O-component density/state/reference; selected flow/LCIA quantity convention"
      collection_method: "Independent intake/outlet meters, pulp/wood/sludge moisture measurements and dryer/cooling balance; disclose evaporation measured or balance-derived and associated uncertainty. Reconcile liquid volume to mass with site temperature/density where needed. For quantity, water_out represents actual liquid H2O-component volume, not automatically whole mixed-effluent volume. Keep bulk final outlet/bypass volume for cp_effluent pollutant loads. Determine each final liquid mass from measured mass or matched bulk volume and representative actual mixture density; determine H2O mass with an independently validated water mass fraction, then native H2O volume with a corresponding compatible water-component density/state/reference convention. Do not assume water fraction1, density1000kg/m3 or additive component volumes. Missing fraction/density/quantity convention remains unresolved alongside receptor identity before LCIA."
      unit: "m3; kg"
      frequency: "Continuous meters and matched daily totals"
      temporal_coverage: "Entire declared production period including startup/upset"
      site_scope: "Same mill, eucalyptus and declared route; subdivide other grades"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Water diagram, calibration and balanced uncertainty"
    - protocol_id: cp_air
      process_id: "mill"
      flow_role: "Each species and exclusive particulate interval"
      record_type: "release monitoring"
      raw_fields: "source; fuel carbon origin; stack/fugitive; species; concentration; gas flow; duration; temperature/pressure; moisture/O2 convention; detection limit; controls; PM cut; NOx definition"
      collection_method: "Use measured species concentrations and compatible volumetric gas flow integrated over release time, including startup/upset; correct dilution/O2/wet-dry conventions consistently. Site-specific carbon balance may support CO2 after reconciliation. Screen each source for additional organics/metals; unknown values are gaps, not zero."
      unit: "kg; mg/m3; m3; time"
      frequency: "Continuous where available; documented representative campaigns otherwise"
      temporal_coverage: "Entire declared production period including startup/upset"
      site_scope: "Same mill, eucalyptus and declared route; subdivide other grades"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Monitoring method, raw signals, calibration, detection limits, operating coverage and C/Mg/S balances"
    - protocol_id: cp_effluent
      process_id: "mill"
      flow_role: "Final outlet pollutants and internal treatment loads"
      record_type: "water-quality ledger"
      raw_fields: "stream location; inlet/outlet/bypass; flow; sample time; COD as O2; TN as N; TP as P; AOX convention; dissolved solids/TOC; sludge; treatment route"
      collection_method: "Take flow-proportional composite final-outlet samples and paired calibrated discharge volumes over the same intervals. Sample bleach filtrates and condensates separately at treatment inlets; use inlet measurements for treatment/organic balance, not duplicate releases. Retain chemical species, laboratory methods and detection limits."
      unit: "mg/L; m3; kg"
      frequency: "Flow continuously; composite samples per operating day with documented campaign coverage"
      temporal_coverage: "Entire declared production period including startup/upset"
      site_scope: "Same mill, eucalyptus and declared route; subdivide other grades"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Laboratory QA, sample-chain records, flow meters, treatment diagram and bypass reconciliation"
    - protocol_id: cp_waste
      process_id: "mill"
      flow_role: "Individual off-site waste stream"
      record_type: "waste manifest"
      raw_fields: "waste identity; stage and solid form; wet mass; dry fraction; measured constituents/organic carbon/Mg/S/contamination; internal recycle; lawful waste status; accepting receiver; treatment and provider reference basis; transfer date"
      collection_method: "Calibrated weighed consignment and representative solids/composition assay for each separately identified stream; reconcile recycled versus shipped amounts and verify actual receiver treatment."
      unit: "kg; fraction"
      frequency: "Every consignment"
      temporal_coverage: "Entire declared production period including startup/upset"
      site_scope: "Same mill, eucalyptus and declared route; subdivide other grades"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighbridge tickets, assays, waste manifest and receiver acceptance"
  calculation_rules:
    - id: dry_output
      applies_to: "pulp_out"
      rule: "D = Σ(m_lot × d_lot); m_lot excludes packaging; d_lot is the measured dry fraction; reject nonconforming lots."
      inputs:
        - m_lot
        - d_lot
        - cp_pulp
      output: "D in kg oven-dry accepted pulp"
      source_ids:
        - iso-solid-dry-matter-2022
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Period-specific exchange = sum of actual external quantity / D; keep numerator unit; 1 kg accepted dry reference output. Do not average daily intensities without dry-production weights."
      inputs:
        - "period exchange totals"
        - D
        - cp_pulp
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: dry_wet_conversion
      applies_to: "wood, pulp_out, sludge"
      rule: "dry mass = net wet mass × (1-w); dry mass = net wet mass / (1+u); w and u are distinct wet/dry-basis moisture fractions. BREF ADt is 90% solids only when that source convention is explicitly used: 1 ADt = 900 kg dry solids, not measured delivery moisture."
      inputs:
        - "net wet mass"
        - "w or u"
        - cp_material
        - cp_pulp
        - cp_waste
      output: "kg dry solids"
      source_ids:
        - eu-pulp-bref-2015
        - iso-solid-dry-matter-2022
    - id: effluent_load
      applies_to: "cod, nwater, pwater, aox"
      rule: "Load kg = Σ(C_j mg/L × V_j m3) / 1000 for matched sampling intervals; normalize by D. Retain pollutant-equivalent convention; add separately measured bypass once."
      inputs:
        - C_j
        - V_j
        - D
        - cp_effluent
      output: "kg indicator per 1 kg reference flow"
      source_ids:
        - eu-pulp-bref-2015
    - id: physical_balance
      applies_to: "mill"
      rule: "For conserved C, Mg and S separately: external inputs + opening stock = external outputs + closing stock; reactions change species/phase but cannot create an element-balance offset. Dry-solids and water ledgers additionally record measured or independently supported species/phase transformations, including oxygen uptake and reaction water; cancel equal internal links. Report unexplained residual with measurement uncertainty, never repair by invented correction emissions."
      inputs:
        - "stage ledgers"
        - composition
        - stocks
        - cp_material
        - cp_water
        - cp_air
        - cp_effluent
      output: "pre-allocation physical balances"
      source_ids:
        - eu-pulp-bref-2015
    - id: export_heat
      applies_to: "heat_out"
      rule: "Delivered heat MJ = (Σ steam mass × delivery specific enthalpy - Σ returned condensate mass × return specific enthalpy - declared delivery losses) / 1000 when enthalpy is in kJ/kg and loss quantities are kJ; deduct only losses not already reflected in the delivery measurement, without double deduction. Use the same state/reference convention and explicitly verified provider net-heat reference quantity; NCV/MJ metadata alone does not prove that correspondence. Do not substitute fuel heat or gross boiler heat."
      inputs:
        - cp_energy
        - "steam/condensate metering"
        - "enthalpy convention"
      output: "raw same-period net delivered MJ; then normalize once by D under normalize_period"
      source_ids:
        - eu-pulp-bref-2015
    - id: final_water_component
      applies_to: "water_out"
      rule: "M_liquid_i = measured final liquid mass or V_bulk_i × measured rho_liquid_i; M_water_i = M_liquid_i × independently validated water fraction_i; V_water = sum(M_water_i / compatible rho_water_i). Native V_water/D once; bulk V_bulk remains pollutant-load volume. All quantities have matching interval/state/reference; unknown remains unresolved."
      inputs:
        - cp_water
        - cp_effluent
        - "water fraction"
        - "compatible density"
        - D
      output: "native H2O-component m3 per 1kg accepted oven-dry pulp"
      source_ids: []
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "One physical exchange per row; selected UUID is not quantity/background approval. Keep unknown identity/amount gaps specific; add actual extra chemicals, nutrient salts, VOC species and wastes individually."
      evidence: "Supplier/product evidence; flow record; site ledger"
    - id: purity
      applies_to: "pulp_out"
      requirement: "Buyer specification, applicable methods and measured alpha-cellulose, viscosity, residual hemicellulose/lignin, ash/metals and dissolution performance; brightness/classification label does not establish acceptance."
      evidence: "Lot CoA and cp_pulp"
    - id: scope
      applies_to: "mill"
      requirement: "Declare period/geography/species/base/ECF sequence; meter shared grades separately; include upset, stock, rejects and broke."
      evidence: "Plant diagram, production log and meters"
    - id: source_limits
      applies_to: "mill"
      requirement: "Do not transfer historical or single-mill doses, recovery rates, yields or emission ranges. Public standard scope is not full-standard access or proof of saleable-lot compliance."
      evidence: "eu-pulp-bref-2015; sappi-pulp-2015; iso-solid-dry-matter-2022"
    - id: missing_not_zero
      applies_to: "all inventory rows"
      requirement: "Retain conditional-absence evidence, detection limits and coverage; a search hit does not establish a positive release; unknown/unmonitored is not zero."
      evidence: "cp_air; cp_effluent; cp_waste"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Reject applicability when species, cook base, bleaching route, delivery state or end-use quality is missing or incompatible. Require exactly one pulp_out quantitative reference; both languages use 1 kg dry solids, the same D, rows, units, qualifiers and aggregation. Verify chip and pulp moisture separately; reject gross package mass, air-dry trading mass or unconverted wet mass as the dry denominator. Check physical solids/water/C/Mg/S and energy ledgers before checking allocation accounts. Internal links must match at both ends. Check fresh versus recovered chemicals and actual routing of dissolved organics, bleach sodium and condensates. Verify CHP gross generation, own use, imports, exports and heat return; do not multiply physical output by allocation shares. Allocation shares must sum to one and apply only to assigned shared burdens. Check final treated effluent once, bypasses, sludge moisture, receiver/treatment and missing pollutant species. Do not use kraft/sawmill emission factors for sulphite recovery or auxiliary boilers without route-specific evidence. Reject overlapping particulate totals, NOx/NO/NO2 duplication, fossil/biogenic confusion, erased biogenic CO2 and indicator/species-basis substitutions. Unknown gas volume, chip volume, NOx, AOX, heat or supplier pulp-mass conventions prevent those quantitative links from being treated as complete."
    source_ids: []
published_dataset_profile:
  dataset_role: "manufacturing_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Textile dissolving-pulp manufacture for the declared subset; upstream background only after external links are complete"
  excluded_use: "Whole-CPC32111 averages; papergrade; other wood/base/PHK; slurry; TCF; high-viscosity chemical specialty pulp; downstream fibres/service life"
  required_metadata: "All reference qualifiers, D, stage material/water/carbon/Mg/S/energy maps, recovery/effluent route, allocation basis/recipients and upstream links"
  required_quality_disclosure: "Measurement coverage, uncertainty, unresolved identity/quantity bases, unknown releases and supplier/treatment gaps; no complete-dataset or reviewed-methodology claim"
  update_trigger: "Changes to wood, cooking, bleaching/generator, purity target, moisture basis, recovery/energy, receptor/treatment or supplier basis"
