measurement_rules:
  - id: dry_basis
    applies_to: "pulp_out"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use cp_pulp measured lot net wet mass and dry fraction to determine D = Σ(m_lot × d_lot), excluding packaging; every inventory denominator is 1 kg accepted oven-dry pulp in the same period. ISO 638-1:2022 public scope supports solid-pulp sample dry matter, not saleable-lot sampling/mass; cp_pulp separately defines lot sampling, rejections and stock reconciliation."
  - id: moisture_basis
    applies_to: "wood, pulp_out, sludge"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Wet-basis w = water mass/net wet mass; d = 1-w. For dry-basis u = water mass/dry mass, d = 1/(1+u). Declare the assay basis; distinguish percent from fraction; measure wood and pulp independently."
  - id: chemical_basis
    applies_to: "naoh, h2o2, clo2, chlorate, acid"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep purchased solution mass separate from active mass; active mass = solution mass × measured mass fraction. Species ClO2 mass differs from active chlorine reported as Cl2 oxidation equivalent; retain the original definition."
  - id: energy_basis
    applies_to: "electricity_in, electricity_out, heat_out, gas"
    required_property_ref:
      name: "Energy or Volume"
      uuid: ""
    required_unit: "MJ or m3"
    rule: "Convert electricity kWh by 3.6 to MJ; match gas volume state. Net useful exported heat is steam outward enthalpy flow less return condensate and losses assigned at the stated interface; an MJ property or steam mass does not establish compatible heat basis."
  - id: water_species_basis
    applies_to: "cod, nwater, pwater, aox, nox, n2o"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "COD is as O2, nitrogen as N, phosphorus as P; retain AOX halogen definition. Verify NOx NO2-equivalent convention; distinguish N2O from N2O-N. Pollutant indicators are not dry-organic-matter quantities."
  - id: final_water_quantity
    applies_to: "water_out"
    required_property_ref:
      name: "Volume"
      uuid: ""
    required_unit: "m3"
    rule: "For quantity, water_out represents actual liquid H2O-component volume, not automatically whole mixed-effluent volume. Keep bulk final outlet/bypass volume for cp_effluent pollutant loads. Determine each final liquid mass from measured mass or matched bulk volume and representative actual mixture density; determine H2O mass with an independently validated water mass fraction, then native H2O volume with a corresponding compatible water-component density/state/reference convention. Do not assume water fraction1, density1000kg/m3 or additive component volumes. Missing fraction/density/quantity convention remains unresolved alongside receptor identity before LCIA."
