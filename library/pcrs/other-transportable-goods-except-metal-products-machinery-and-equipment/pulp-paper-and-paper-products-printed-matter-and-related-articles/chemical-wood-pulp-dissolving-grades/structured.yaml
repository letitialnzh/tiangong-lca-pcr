system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "Include chip handling, cooking, washing/screening, hot alkaline extraction and declared ECF stages, chemical generation where on-site, final screening, pressing/drying/baling, spent-liquor evaporation/stripping, MgO/SO2 recovery and cooking-acid preparation, CHP/auxiliary combustion, water treatment, wastewater collection/treatment and residue handling. Exclude downstream dissolution/spinning, buyer use/end of life and new biorefinery products. Any lignosulphonate, ethanol, acetic-acid or furfural recovery for sale requires a reviewed scope extension with separate atomic product and process evidence; do not call internally burnt organics a sold co-product. [eu-pulp-bref-2015 §§4.1.1.3, 4.1.2–4.1.5; epa-chemical-pulp-1990 §10.2.3] Maintain stage-resolved physical dry-solids, water, carbon, Mg and S balances before allocation. The fibre line passes pulp internally to purification and drying; weak liquor passes to evaporation/recovery, recovered chemicals return to cooking, and condensate/bleach filtrates pass to the actual recovery or treatment train. Record the same quantity and state at both ends of each internal link. Do not return sodium-rich bleach effluent automatically into magnesium recovery. Dissolved wood organics are measured by dry organic solids/TOC/carbon evidence and separately tracked through recovered fuel, products if approved, treated effluent, sludge and air releases; COD cannot substitute for their mass. [eu-pulp-bref-2015 §§4.1.3–4.1.5] Wastewater treatment is inside this declared foreground. Residual final discharge is emitted once; raw bleach or condensate load is an internal treatment inlet, not another environmental emission. Record bypasses and external treatment explicitly. Do not combine a wastewater-treatment background with the same on-site treatment inputs/emissions. Site-specific combustion and release evidence supersedes old AP-42 examples; auxiliary wood-residue boilers use the independent EPA boiler source screening and require a verified site method and cannot use kraft-recovery or sawmill-dust factors. [eu-pulp-bref-2015 §§4.1.3.4, 4.2.2; epa-chemical-pulp-1990 §§10.2.2–10.2.3]"
      source_ids: []
boundary_abstraction:
  declared_starting_condition: "Debarked eucalyptus chips delivered at mill gate; purchased chemicals and utilities"
  starting_condition_role: "Foreground manufacturing start; upstream burdens are not zero"
  product_classification_scope: "The stated narrower subset of CPC 3.0 32111"
  recursive_input_rule: "Track same-category broke/reprocessing in one physical ledger; internal returns do not generate another upstream pulp-production burden. Purchased dissolving pulp needs qualified supplier data and does not masquerade as the chip-start route."
  upstream_dataset_requirement: "Wood-chip supply must cover forestry, harvesting, debarking/chipping and actual inbound transport; chemicals, purchased energy and external waste treatment need nonzero background matched to geography, route, concentration, unit and boundary."
  disclosure: "Foreground is one integrated manufacturing unit; disclose shared assets/other pulp grades, condensate/cooling loops, chemical generators, recovery, utilities and wastewater treatment; disclose every upstream/external treatment gap."
