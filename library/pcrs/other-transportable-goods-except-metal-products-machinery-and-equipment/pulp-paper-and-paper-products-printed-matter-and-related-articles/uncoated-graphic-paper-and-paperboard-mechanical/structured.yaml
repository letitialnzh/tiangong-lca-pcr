      record_type: "primary measured/traceable records"
      raw_fields: "intake/discharge flow; source/recipient; process evaporation; water in pulp/chemicals/paper/sludge; rainfall; boiler combustion water; internal I/II/filtrate/condensate; storage change; bypass"
