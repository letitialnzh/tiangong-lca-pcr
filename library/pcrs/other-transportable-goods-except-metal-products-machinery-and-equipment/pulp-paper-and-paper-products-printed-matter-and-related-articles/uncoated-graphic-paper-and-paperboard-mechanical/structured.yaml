measurement_rules:
  - id: reference_mass
    applies_to: "finished_paper"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use calibrated net paper weighing after final slitter/winder; exclude core, wrapper, rejects, internal broke and rework. Retain actual moisture, not assumed air-dry or oven-dry output."
  - id: common_basis
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "row unit / kg paper"
    rule: "Use per 1 kg reference flow in both languages; protocols aggregate over the same actual net accepted paper P in kg and period. P must be positive."
  - id: dry_furnish
    applies_to: "tmp_pulp; kraft_pulp; kaolin; primary_sludge; bio_sludge"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep delivered wet mass, measured dry-solids fraction, oven-dry fibre, ash and residual water separately; no fixed 90% pulp dryness or sheet moisture. Fibre share excludes minerals, chemicals and packaging."
  - id: energy_volume
    applies_to: "gas; electricity"
    required_property_ref:
      name: "Volume / Net calorific value"
      uuid: ""
    required_unit: "m3 / MJ"
    rule: "Gas m3 requires measured T/P/Z/composition/dry-wet and matching supplier reference; electricity uses the verified Net calorific value energy chain, 1 kWh = 3.6 MJ. Do not apply gas secondary Mass coefficient as density."
