      unit: "kg"
      frequency: "reel/campaign"
      temporal_coverage: "Same complete declared campaign/year; include downtime and stock changes"
      site_scope: "Selected line plus causally attributable onsite support"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, methods, supplier certificates, coverage, uncertainty and reconciliation"
    - protocol_id: cp_water
      process_id: "sc_papermaking"
