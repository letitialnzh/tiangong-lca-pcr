  calculation_rules:
    - id: net_basis
      applies_to: "all inventory rows"
      rule: "x_i = X_i / P; X_i is attributable net exchange over the same period; P is accepted net finished paper in kg. The finished_paper row is exactly 1 kg."
      inputs:
        - X_i
        - P
        - cp_output
      output: "x_i"
      source_ids:
        - jrc-paper-bref-2015
    - id: dry_components
      applies_to: "tmp_pulp; kraft_pulp; kaolin; primary_sludge; bio_sludge"
      rule: "D_i = W_i * s_i; water_i = W_i - D_i; fibre and ash subdivisions require measured composition, not inferred yield. Fibre share = dry TMP fibre / total dry fibre, excluding minerals."
      inputs:
        - W_i
        - s_i
        - cp_furnish
        - cp_residues
      output: "D_i; water_i; fibre share"
      source_ids:
        - jrc-paper-bref-2015
    - id: effluent_load
      applies_to: "cod; bod; tss; nitrogen; phosphorus; aox"
      rule: "L_j = sum(C_j,t * V_t * 0.001); C in mg/L, V in m3, L in kg. Pair concentration and flow at the same final outfall and interval; include bypass; normalize by P. Do not multiply separate annual means."
      inputs:
        - C_j
        - t
        - V_t
        - cp_effluent
        - P
      output: "L_j / P"
      source_ids:
        - jrc-paper-bref-2015
    - id: air_load
      applies_to: "co2_fossil; co2_bio; co; nox; so2; ch4; ch4_bio; n2o; pm25; pmcoarse; pmover; formaldehyde; benzene"
      rule: "L_j = sum(c_j,t * v_t * dt * 0.000001) for c in mg/m3, v in m3/h, dt in h and identical gas-reference conditions. Reference-O2 correction cannot be applied to concentration alone while retaining incompatible actual gas volume."
      inputs:
        - c_j
        - t
        - v_t
        - dt
        - cp_air
        - cp_dust
        - P
      output: "L_j / P"
      source_ids:
        - jrc-paper-bref-2015
    - id: particle_partition
      applies_to: "pm25; pmcoarse; pmover"
      rule: "E_small = measured PM2.5; E_coarse = measured PM10 - measured PM2.5; E_large = measured TSP - measured PM10 only if sampling/condensable coverage match and all differences are nonnegative. Otherwise retain unresolved size data; no assumed fractions."
      inputs:
        - cp_dust
        - "matched cumulative loads"
      output: "mutually exclusive emitted bins"
      source_ids:
        - jrc-paper-bref-2015
    - id: component_balance
      applies_to: "sc_papermaking"
      rule: "For each water, long-fibre, fines, mineral/ash and carbon component: external inputs + generated component = paper + packaging export + net residues + final emissions + inventory change + quantified residual. Internal links cancel only with equal amounts at both ends. Carbon bookkeeping uses kg C from measured stream carbon content or explicitly documented chemical stoichiometry, separately identifying biogenic, fossil and mineral carbon; the wood/kaolin name is not a carbon-content factor. COD/BOD oxygen demand is not physical carbon mass. Include only actual moisture carried by particulate streams, separately from vapour, and reconcile pure-water-component discharge versus mixed-effluent volume without duplicate pollutant/solid mass."
      inputs:
        - cp_furnish
        - cp_output
        - cp_water
        - cp_residues
        - cp_air
        - cp_dust
        - cp_effluent
      output: "unallocated balance and residual"
      source_ids:
        - jrc-paper-bref-2015
    - id: burden_partition
      applies_to: "shared burdens"
      rule: "B_SC = B_direct,SC + sum(B_shared,k * f_SC,k); each f is justified by a measured causal driver and sums to one across served outputs. Keep actual physical exports unchanged."
      inputs:
        - "shared burden"
        - "driver records"
        - cp_energy
        - cp_effluent
      output: "assigned burden ledger"
      source_ids:
        - eu-pef-allocation-2021
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Verify actual physical subset, name/CAS/route/name properties, supplier reference amount and unit chain; UUID resolution alone is not dataset compatibility. Blank UUID remains a named atomic gap."
      evidence: "Supplier specifications; direct flow metadata; basis reconciliation"
    - id: dq_period
      applies_to: "all inventory rows"
      requirement: "Use a complete same-period net production denominator; include changes, offgrade campaigns, shutdowns, monitoring gaps and uncertainty. Do not use installed capacity."
      evidence: "Production/meter logs and calibration"
    - id: dq_completeness
      applies_to: "all exchanges"
      requirement: "BREF and AP-42 define evidence scope, not recipes or default loads. Actual chemicals, gases and residues outside listed cards require named additional rows; unknown is not absent."
      evidence: "Purchase/SDS/maintenance and environmental registers"
    - id: dq_indicators
      applies_to: "water emissions"
      requirement: "COD/BOD and TN/TP/AOX are analytical indicators, not independent molecular species. Preserve analytical/species data and choose nonduplicating LCIA treatment; do not hide high-impact species in sum indicators."
      evidence: "Laboratory method, speciation and LCIA reconciliation"
validation_rules:
  - rule_id: validate_scope
    applies_to: "finished_paper"
    rule: "Fail applicability when virgin TMP/bleached softwood kraft/kaolin SC route, at least 10% dry mechanical fibre, no pigment coating or no surface-sizing evidence is missing or contradicted; a CPC label or broad UUID does not replace those facts."
    source_ids:
      - jrc-paper-bref-2015
      - upm-cat-g-2026
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Require one final 1 kg output, same denominator and temporal aggregation, supported reference property/unit chain, measured moisture/active fraction and supplier/background quantity compatibility. Unsupported conversions or unknown gas volume conventions remain incomplete."
    source_ids:
      - jrc-paper-bref-2015
  - rule_id: validate_loops_residues
    applies_to: "water/fibre/mineral/carbon ledger"
    rule: "Reconcile equal internal links and separate paper, recovered-stock, primary sludge, biological sludge, wet rejects, captured dust and residual effluent destinations. Any unexplained residual needs investigation, not arbitrary proportional balancing or duplicate allocation. Require actual receivers and offsite treatment."
    source_ids:
      - jrc-paper-bref-2015
      - eu-pef-allocation-2021
  - rule_id: validate_emissions
    applies_to: "all elementary outputs"
    rule: "Require correct compartment/species/carbon origin, matched monitoring conditions, nonoverlapping particle bins and separate capture. Retain biogenic CO2 in LCI. NOx excludes N2O and needs explicit NO2-equivalent/species compatibility; COD/BOD/TN/TP/AOX overlap requires explicit LCIA exclusion/mapping. No measurements or quantified justified estimates means incomplete, not passed."
    source_ids:
      - jrc-paper-bref-2015
      - epa-gas-combustion-2026
published_dataset_profile:
  dataset_role: "foreground_process"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Qualified SC supply at factory gate with explicit upstream and residue-treatment links; printing model input after service/quality assessment"
  excluded_use: "Complete CPC 32125 coverage, all cultural paper, printed-product footprint, verified commercial recipe, comparative printing equivalence, independent scientific approval"
  required_metadata: "All reference qualifiers; site/year/campaign; grade and quantity bases; supplier datasets; transport; treatment and receiver; physical and burden ledgers; actual additional exchanges"
  required_quality_disclosure: "Identity gaps, source metadata conflicts, measurement/monitoring coverage, uncertainty, LCIA overlaps, allocation sensitivity and missing foreground records"
  update_trigger: "Furnish, pulp treatment, sizing/coating, utilities, packaging, water/sludge route, product quality or measurement/background reference change"
data_sources:
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Production of Pulp, Paper and Board (2015), DOI 10.2791/370629; [original PDF](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf), §§2.2.2, 7.1.1–7.1.10; Figure 7.3 printed 664; glossary printed 850"
    used_for: "General papermaking, white-water fibre/fines/filler recovery, broke, distinct sizing/coating, calendering/cutting dust, monitoring and net-production basis. European 2015 scope; case amounts, recipes and BAT-AELs are not adopted as universal quantities."
  - id: "upm-cat-g-2026"
    type: "handbook"
    reference: "UPM Cat G, dated 05.10.2026, p.1 [producer PDF](https://www.upmpaper.com/siteassets/images/products--services/paper-catalog/public/upm_cat_g_en_232002.pdf)"
    used_for: "Commercial SC grade example, chemical/mechanical pulp and fillers, rotogravure reels and packaging options. Does not establish exact pulp subtype/ratio, kaolin recipe, non-integration or sizing absence; informative technical targets not defaults."
  - id: "epa-gas-combustion-2026"
    type: "official_guidance"
    reference: "US EPA AP-42 §1.4 Natural Gas Combustion, header 10/26, §§1.4.1–1.4.3, pp.1.4-1–1.4-3 [original PDF](https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf)"
    used_for: "External gas-boiler pollutant/species coverage and testing conditions only. Not paper-cutting dust, biomass/sludge firing or site-specific permit evidence; no numerical factors/heating values adopted."
  - id: "eu-pef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation C(2021)9332 final, Annex I §4.5, printed pp.63–64 [original annex](https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf)"
    used_for: "General subdivision/physical/other-relationship allocation hierarchy; no paper-specific shares or claim of full PEF conformance."
