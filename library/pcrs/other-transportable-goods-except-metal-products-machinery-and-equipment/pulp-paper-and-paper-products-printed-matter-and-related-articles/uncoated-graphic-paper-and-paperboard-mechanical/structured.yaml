allocation_rules:
  - rule_id: allocation_single_product
    applies_to: "qualified SC campaign"
    rule: "One saleable paper output; internal stock/broke/fines/filler recovery are not coproducts and receive no allocation share or avoided-pulp credit. Assign collection/treatment of actual net waste to its source campaign unless a justified subsequent model establishes a different waste/secondary-product boundary."
    source_ids:
      - jrc-paper-bref-2015
      - eu-pef-allocation-2021
  - rule_id: allocation_shared_loads
    applies_to: "multi-grade mill utilities/treatment"
    rule: "Prefer campaign/line subdivision and direct meters. For shared remaining burdens use a demonstrated physical relationship: measured steam/enthalpy or electrical duty, and measured hydraulic/organic/solids treatment drivers for wastewater and sludge. Document driver tests, boundary and sensitivity; product-mass shares are not a universal treatment or energy driver. If physical relation fails, justify another relationship using contemporary values; no default allocation factor."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_two_ledgers
    applies_to: "all mass/water/carbon balances"
    rule: "Preserve the unallocated physical graph and component mass/water/carbon balance separately from the partitioned environmental-burden ledger. Allocation changes assigned burdens, not measured coproduct/export masses or either end of an internal link. No simultaneous sludge diversion credit and raw-material recovery credit for the same solids."
    source_ids:
      - jrc-paper-bref-2015
      - eu-pef-allocation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "sc_papermaking"
      flow_role: "accepted SC paper"
      record_type: "primary measured/traceable records"
      raw_fields: "grade/campaign; reel net weight; wrapper/core tare; moisture; grammage; rejects; start/end inventories"
      collection_method: "Calibrated final reel weighing and quality release; reconcile sales and inventory."
      unit: "kg"
      frequency: "each reel and campaign"
      temporal_coverage: "Same complete declared campaign/year; include downtime and stock changes"
      site_scope: "Selected line plus causally attributable onsite support"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, methods, supplier certificates, coverage, uncertainty and reconciliation"
    - protocol_id: cp_furnish
      process_id: "sc_papermaking"
      flow_role: "TMP/kraft/kaolin; internal component balance"
      record_type: "primary measured/traceable records"
      raw_fields: "supplier/species/route; receipts; stocks; pulp dry solids; kaolin purity/ash; TMP fibre fraction; white-water flow/long-fibre/fines/ash; save-all return/purge"
      collection_method: "Weigh receipts/issues; laboratory dry-solids, fibre fraction and ash; matched internal-link meters, sampling and inventories."
      unit: "kg"
      frequency: "lot/shift and grade change"
