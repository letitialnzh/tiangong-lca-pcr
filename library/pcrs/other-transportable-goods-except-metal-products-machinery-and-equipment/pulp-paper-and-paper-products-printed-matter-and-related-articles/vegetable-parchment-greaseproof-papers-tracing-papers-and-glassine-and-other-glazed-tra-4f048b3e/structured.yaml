allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "all inventory rows"
    rule: "Separate grade campaigns and direct meters first. For genuinely shared activities investigate subdivision/system expansion, then demonstrate a relevant underlying physical relationship; only if neither is defensible may a documented other relationship such as economic value be used. No automatic mass allocation, paper yield factor, recycled-paper credit or universal price ratio."
    source_ids:
      - ec-pef-method-2021
  - rule_id: allocation_ledgers
    applies_to: "all inventory rows"
    rule: "Preserve the unallocated physical mass/water/carbon ledger and full product/waste quantities, separately from the product-attributed environmental burden ledger. Allocation partitions burdens; it must not multiply real co-product outputs or internal-link quantities by an allocation share. Do not call internally recovered broke a sold co-product. Record actual receivers and any genuine off-spec sales independently."
    source_ids:
      - ec-pef-method-2021
      - jrc-pulp-paper-bref-2015
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "papermaking"
      flow_role: "finished"
      record_type: "weighing"
      raw_fields: "lot; grade; reel gross; actual tare; accepted net Q; moisture w; buyer acceptance"
      collection_method: "Calibrated reel scale; subtract actual cores/wrappers; validated sampling and oven-dry/gravimetric moisture method with recorded conditions; reconcile delivery and stock changes"
      unit: "kg"
      frequency: "each lot"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_material
      process_id: "papermaking"
      flow_role: "pulp; core; wrap"
      record_type: "purchase_and_stock"
      raw_fields: "supplier; grade/species/route; commercial mass; moisture; opening/closing stock; returns; actual core/film tare"
      collection_method: "Weigh incoming/consumed distinct materials and reconcile invoices, stock and rejected deliveries; separate each pulp grade and packaging component"
      unit: "kg"
      frequency: "receipt and lot"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_energy
      process_id: "papermaking"
      flow_role: "electricity"
      record_type: "meter"
      raw_fields: "meter id; voltage; interval; stage; opening/closing kWh; WWTP exclusion; supplier mix/loss basis"
      collection_method: "Calibrated meters/submeters; retain refiner, paper-machine, finishing and treatment records, including changeovers and cleaning This protocol attributes only actual papermaking rows/sources; the other process uses cp_energy_wwtp. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kWh; MJ"
      frequency: "continuous totals by shift"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity; actual owning process: papermaking"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_energy_wwtp
      process_id: "wwtp"
      flow_role: "wwtp_electricity"
      record_type: "meter"
      raw_fields: "meter id; voltage; interval; stage; opening/closing kWh; attributable WWTP electricity; shared-master-meter overlap; exclusion of unrelated site activities; supplier mix/loss basis"
      collection_method: "Calibrated meters/submeters; retain refiner, paper-machine, finishing and treatment records, including changeovers and cleaning This protocol attributes only actual wwtp rows/sources; the other process uses cp_energy. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kWh; MJ"
      frequency: "continuous totals by shift"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity; actual owning process: wwtp"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_heat
      process_id: "papermaking"
      flow_role: "drying_heat"
      record_type: "enthalpy_balance"
      raw_fields: "steam mass; inlet absolute/gauge pressure; temperature; dryness; condensate mass/pressure/temperature; losses; supplier reference definition; k_bg"
      collection_method: "Calibrated steam/condensate meters and condition sensors; use validated enthalpy data and reconcile inlet-minus-return energy with supplier delivery contract; no default conversion"
      unit: "kg; MJ"
      frequency: "continuous totals by shift"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_water
      process_id: "papermaking"
      flow_role: "water; effluent_transfer; vapour"
      record_type: "water_balance"
      raw_fields: "makeup mass/volume/density; internal white-water and effluent volumes; steam/condensate separate; paper/sludge moisture; dryer and treatment exhaust humidity/flow; treatment evaporation; stocks; measured rho_eff(T,composition); water mass fraction; rho_water(T); whole wastewater mass and component-water volume"
      collection_method: "Calibrated flowmeters, density/temperature measurements and representative dryer and treatment-unit moisture balances; pair internal transfer readings; reconcile water physically before attribution This protocol attributes only actual papermaking rows/sources; the other process uses cp_water_wwtp. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kg; m3"
      frequency: "continuous and shift"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity; actual owning process: papermaking"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_water_wwtp
      process_id: "wwtp"
      flow_role: "wwtp_water; wastewater_in; wwtp_vapour"
      record_type: "water_balance"
      raw_fields: "makeup mass/volume/density; internal white-water and effluent volumes; steam/condensate separate; paper/sludge moisture; dryer and treatment exhaust humidity/flow; treatment evaporation; stocks; measured rho_eff(T,composition); water mass fraction; rho_water(T); whole wastewater mass and component-water volume  reaction-water generation/consumption and evidence; oxygen uptake for total-mass reconciliation;"
      collection_method: "Calibrated flowmeters, density/temperature measurements and representative dryer and treatment-unit moisture balances; pair internal transfer readings; reconcile water physically before attribution This protocol attributes only actual wwtp rows/sources; the other process uses cp_water. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities.  Include independently supported reaction-water terms; do not assume water is conserved across biological conversion or absorb reaction terms into unexplained residuals."
      unit: "kg; m3"
      frequency: "continuous and shift"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity; actual owning process: wwtp"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_chemical
      process_id: "wwtp"
      flow_role: "pac; pam; naoh; urea; phosphoric"
      record_type: "dosing_and_stock"
      raw_fields: "trade name; SDS/CAS; ionic state; assay/active solids; commercial mass; solution water; dosing meter; stock; supplier reference basis"
      collection_method: "Reconcile each actual complete supply, dosing, storage and invoices; assay actual lots and match provider reference units. Independently bought reagents and onsite mixing/dilution water/utilities are real separate inputs. Included formulation water/additives are analytical only, never duplicate purchases. Complete bought solutions or supplier-process reconstruction must cover actual preparation/manufacture, auxiliary/loss/utility and delivery burdens once; active conversion alone is insufficient."
      unit: "kg"
      frequency: "every delivery and dosing shift"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_waste
      process_id: "papermaking"
      flow_role: "reject; dust_collected"
      record_type: "weighing_and_receipt"
      raw_fields: "stream; wet mass; dry solids; composition; contamination; receiver; acceptance; disposal route; internal recovery excluded"
      collection_method: "Weigh each dispatched stream separately and reconcile manifests, sludge solids tests and receiver receipts; collected dust is not emitted PM This protocol attributes only actual papermaking rows/sources; the other process uses cp_waste_wwtp. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity; actual owning process: papermaking"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_waste_wwtp
      process_id: "wwtp"
      flow_role: "primary_sludge; bio_sludge"
      record_type: "weighing_and_receipt"
      raw_fields: "stream; wet mass; dry solids; composition; contamination; receiver; acceptance; disposal route; internal recovery excluded"
      collection_method: "Weigh each dispatched stream separately and reconcile manifests, sludge solids tests and receiver receipts; collected dust is not emitted PM This protocol attributes only actual wwtp rows/sources; the other process uses cp_waste. Retain complete raw stage/component/stock/gate records. Count a shared master-meter/final-outlet external exchange once in one explicitly corresponding row; source decomposition creates no second exchange, and paired internal-transfer ends retain equal quantities."
      unit: "kg"
      frequency: "each dispatch"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity; actual owning process: wwtp"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_effluent
      process_id: "wwtp"
      flow_role: "effluent_water; cod; bod; tss; tn; tp; aox"
      record_type: "outfall_sampling"
      raw_fields: "receiver; flow volume V_t; same-interval C_t; method; duration; N/P/AOX basis; detection/quantification limits; calibration; reuse/bypass; measured rho_eff(T,composition); water mass fraction; rho_water(T); whole wastewater mass and component-water volume"
      collection_method: "Representative preferably flow-proportional composites at final freshwater outfall and calibrated same-interval volume; record actual sample coverage, bypasses and uncertainty"
      unit: "m3; mg/L; kg"
      frequency: "continuous flow; representative composites"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_air
      process_id: "papermaking"
      flow_role: "pm_fine; pm_coarse; pm_large"
      record_type: "emission_measurement"
      raw_fields: "source; exhaust dry/wet volume; sampling T/P; duration; size-band mass; captured dust; cleaning; detection limit; uncertainty"
      collection_method: "Representative calibrated duct/release measurements after capture and validated fugitive-release assessment; distinguish ambient concentration from emitted mass; BREF 7.1.10 provides cutting relevance, not a factor"
      unit: "kg"
      frequency: "representative operation and cleaning"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
    - protocol_id: cp_gas
      process_id: "wwtp"
      flow_role: "co2_bio; co2_fossil; ch4_bio; ch4_fossil; n2o"
      record_type: "gas_measurement_and_balance"
      raw_fields: "source; gas species mass; dissolved gas; net exhaust/ambient difference; flow/T/P/moisture; periods; fossil/biogenic carbon; nitrogen; detection limits; recovery; sludge/effluent carbon"
      collection_method: "Representative net gas-release measurement with calibrated instrumentation, actual C/N source tracing and physical balance; measure plant releases separately from receiving-water generation. Resolve unknown fossil/biogenic splits rather than relabelling totals"
      unit: "kg species"
      frequency: "representative coverage across operation"
      temporal_coverage: "one complete representative declared production period, including abnormal operation"
      site_scope: "same selected line/grade and allocated shared services; record every excluded site activity"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; original logs; receipt/lab method; coverage, uncertainty and reconciliation residual"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "all inventory rows"
      rule: "q_i = X_i / Q; X_i is measured grade-attributable exchange in the declared unit, Q is accepted net paper kg in the same period. finished = Q/Q = 1 kg. Internal link ends retain equal X_i and q_i."
      inputs:
        - X_i
        - Q
        - cp_mass
        - "row protocol"
      output: "amount per 1 kg reference flow"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: effluent_load
      applies_to: "cod; bod; tss; tn; tp; aox"
      rule: "L_i = sum(C_i,t * V_t) / 1000, for C in mg/L and V in m3, giving kg measured indicator/species. Normalize L_i/Q. Sum loads and Q before dividing; never average concentration-only daily ratios."
      inputs:
        - C_i
        - t
        - V_t
        - Q
        - cp_effluent
      output: "kg load per 1 kg reference flow"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: steam_link
      applies_to: "drying_heat"
      rule: "H_net = sum(m_in * h_in) - sum(m_return * h_return), with measured pressure/temperature/dryness and defined utility-return boundary; H_bg = k_bg * H_net only with supplier-defined compatible k_bg. No generic boiler efficiency or kg-steam factor."
      inputs:
        - cp_heat
        - "supplier definition"
      output: "supplier-reference MJ; pending if compatibility unknown"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: physical_balances
      applies_to: "unallocated physical ledgers"
      rule: "Elemental carbon is conserved: external carbon inputs = external carbon outputs + closing-minus-opening carbon stocks + documented residual, using each stream’s measured or evidenced kg C content. Dry solids and H2O are not independently conserved across biological or chemical reactions: for each component, external inputs + reaction generation - reaction consumption = external outputs + closing-minus-opening stocks + documented residual. Record actual solids conversion, oxygen uptake for total-mass reconciliation and reaction-water generation/consumption from measured or independently supported site chemistry; do not assume reaction yields or substitute COD for carbon mass. Reconcile dispatched paper/packaging, waste, elementary releases and utility returns on their own component bases; internal links cancel once. Keep reaction terms distinct from measurement/model uncertainty, and never force closure or infer evaporation by treating reaction-generated water as unexplained error. Preserve physical quantities before burden allocation."
      inputs:
        - cp_mass
        - cp_material
        - cp_water
        - cp_water_wwtp
        - cp_waste
        - cp_waste_wwtp
        - cp_effluent
        - cp_air
        - cp_gas
      output: "physical quantities, residual and uncertainty"
      source_ids:
        - jrc-pulp-paper-bref-2015
        - epa-wastewater-basics
        - ec-pef-method-2021
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "every row"
      requirement: "Physical name, CAS when chemical, source route, material state, emission medium/submedium, fossil/biogenic origin, property and unit must agree. A search hit or broad name alone is insufficient. Unknown identities remain specific and blank."
      evidence: "direct identity and actual supplier/site specification"
    - id: dq_quantity
      applies_to: "all inventory rows"
      requirement: "Use actual site data, same Q and period, measured moisture/active content and explicit background basis. No historical/single-site values or database recipe values become generic quantities."
      evidence: "original records; calibration; supplier definition"
    - id: dq_complete
      applies_to: "foreground and links"
      requirement: "Reconcile stage meters and physical mass/water/C/N balances. Add every observed material, process aid, transport service, packaging component and emission species as a separate atomic row. Document zeros, nondetects and missing data distinctly; neither uncoated nor PFAS-free proves all process aids absent."
      evidence: "process diagram; chemical register; procurement; balance residuals"
validation_rules:
  - rule_id: validate_scope
    applies_to: "reference product"
    rule: "Reject acid parchmentization, functional coatings, supercalendered glassine or regenerated-cellulose film from this method; verify actual barrier route and required qualifiers, not a trade name."
    source_ids:
      - nordic-natural-greaseproof-2022
      - hubbe-pruszynski-greaseproof-2020
      - ahlstrom-glassine-ep2931972a1
  - rule_id: validate_quantity
    applies_to: "all inventory rows"
    rule: "Require exactly one external finished-paper reference output, same Q across all rows/protocols, equal internal-link ends and complete conversion evidence. Unknown steam or supplier quantity conventions fail a claim of a complete linked dataset."
    source_ids:
      - jrc-pulp-paper-bref-2015
  - rule_id: validate_releases
    applies_to: "elementary outputs"
    rule: "Match actual medium/species and analytical quantity basis. Do not duplicate nested particles, captured dust, untreated wastewater or COD/BOD as carbon. Keep biogenic CO2 in LCI and fossil/biogenic methane distinct. No correction flow substitutes for a direct release."
    source_ids:
      - jrc-pulp-paper-bref-2015
      - ipcc-wastewater-2019
  - rule_id: validate_evidence
    applies_to: "all inventory rows"
    rule: "Review physical identity and quantitative background compatibility independently. Unresolved identities, unsupported measurements, unexplained residuals and missing treatment links remain explicit; validation does not approve scientific methodology."
    source_ids:
      - jrc-pulp-paper-bref-2015
      - ec-pef-method-2021
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Qualified manufacturing input for downstream greaseproof-paper conversion"
  allowed_use: "Same physical uncoated mechanical-barrier route with explicitly compatible quantities and upstream/treatment links"
  excluded_use: "All CPC 32137 as a single mix; parchment, coated baking/release, glassine, tracing, cellophane; unsupported full-life-cycle comparison"
  required_metadata: "All reference qualifiers, original period/site, stage coverage, pulp grade/basis, utilities, composition, process diagram and source dates"
  required_quality_disclosure: "Uncertainty, data gaps, identity versus numeric linkage debt, outfall/air coverage, unallocated balances and separate burden allocation"
  update_trigger: "Changed furnish/barrier/finishing, supply convention, utility/treatment route, emissions or product acceptance specification"
data_sources:
  - id: "jrc-pulp-paper-bref-2015"
    type: "official_guidance"
    reference: "Best Available Techniques Reference Document for the Production of Pulp, Paper and Board; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf; 2015, Chapters 2 and 7; PDF pp. 86–88, 104–105, 698–702, 708, 713–714"
    used_for: "Qualitative non-integrated papermaking, high refining, COD release, slower dewatering/drying, cutting dust, treatment chemicals and same-period concentration/flow/net-output measurement. Numerical examples and BAT values are not defaults."
  - id: "nordic-natural-greaseproof-2022"
    type: "literature"
    reference: "Nordic Paper: Natural Greaseproof paper brochure; https://www.nordic-paper.com/sites/default/files/2022-01/Natural%20Greaseproof%20paper_brochure_2022.pdf; 2022 brochure, PDF pp. 3–5"
    used_for: "Producer evidence of a mechanical cellulose barrier; the same brochure documents silicone-coated and wet-strength variants. Supports existence of a route family, not one mill’s full formulation, utility route or quantities."
  - id: "hubbe-pruszynski-greaseproof-2020"
    type: "literature"
    reference: "Hubbe and Pruszynski: Greaseproof paper products: A review emphasizing ecofriendly approaches; https://bioresources.cnr.ncsu.edu/resources/greaseproof-paper-products-a-review-emphasizing-ecofriendly-approaches/; 2020; Parchmentized Paper, Refining, Calendering"
    used_for: "Route distinctions only: acid-gelled parchment, extensive refining, natural greaseproof without supercalendering, coatings and glassine. No historical recipes or experimental numerical factors adopted."
  - id: "ahlstrom-gvp-technology"
    type: "literature"
    reference: "Ahlstrom: Genuine Vegetable Parchment technology; https://www.ahlstrom.com/products/technologies/genuine-vegetable-parchment-technology/; Accessed 2026-10-12; history and two-stage parchmentization paragraphs"
    used_for: "Producer confirms separate papermaking and cellulose-gelling parchmentization. A no-additive finished-product claim does not prove no process chemicals. No acid recipe adopted."
  - id: "ahlstrom-glassine-ep2931972a1"
    type: "literature"
    reference: "Ahlstrom: A method of manufacturing of glassine paper, EP2931972A1; https://patents.google.com/patent/EP2931972A1/en; 2015-10-21; description [0001]–[0006]"
    used_for: "Primary patent distinguishes glassine release base, remoistening/offline supercalendering and an alternative online film-forming/multi-nip route. Patent setpoints are not universal requirements and these routes are excluded here."
  - id: "ec-pef-method-2021"
    type: "official_guidance"
    reference: "European Commission Recommendation (EU) 2021/2279, Annex I; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf; 2021-12-16, Section 4.5, PDF pp. 63–64"
    used_for: "Multifunctionality hierarchy only. Applying this hierarchy does not claim PEF compliance or import unrelated animal-specific allocations."
  - id: "ipcc-wastewater-2019"
    type: "official_guidance"
    reference: "IPCC 2019 Refinement, Volume 5, Chapter 6 Wastewater Treatment and Discharge; https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/5_Volume5/19R_V5_6_Ch06_Wastewater.pdf; 2019, Sections 6.1, 6.2.3, 6.4 and Appendix 6A.1"
    used_for: "Industrial methane/nitrous-oxide pathways and carbon-origin scope only. No domestic-water factors, industry average loads or national-total exclusion of biogenic CO2 imported into this LCI."
  - id: "epa-wastewater-basics"
    type: "official_guidance"
    reference: "John R. Buchanan, Wastewater Basics 101, US EPA-hosted original; https://www.epa.gov/sites/default/files/2015-06/documents/epa-mou_wastewater_basics_101.pdf; PDF p.15, Aerobic Biotransformation"
    used_for: "General oxygen-consuming biological conversion of organic matter to CO2, H2O and biomass/residue; supports reaction terms, not a paper-mill recipe, default yield, amount or emission factor."
  - id: "upm-glassine-terminology"
    type: "literature"
    reference: "UPM, Labeling Materials, official Chinese product page; https://www.upmspecialtymaterials.com/cn/zh-hans-pages/upm-labeling-materials/; Products and brands, glassine description"
    used_for: "Chinese glassine terminology and supercalendered fibre-paper identity only; no product-specific grammage or performance default adopted."
  - id: "gb-cellophane-2009"
    type: "standard"
    reference: "GB/T 24695-2009, Cellophane used for food packaging / 食品包装用玻璃纸; official bilingual title https://openstd.samr.gov.cn/bzgk/std/newGbInfo?hcno=4886854AC267120FA0757B2DDFA20BC9"
    used_for: "Terminology distinction only: the official Chinese name 玻璃纸 corresponds to cellophane. No full-standard compliance or test procedure is claimed."
normative_context:
  normalization: "utf8-lf-v1"
  source_sha256: "sha256:cbf3d5899051c549a2e9eab792058832de5638d3da5f9485828a307f7c214a79"
  identity_scope: "projection_snapshot"
  units:
    - unit_id: "normative_8389"
      family: "system_boundary"
      span:
        start:
          offset: 8389
          line: 70
          column: 1
        end:
          offset: 10617
          line: 89
          column: 1
      markdown: "## 5. System Boundary\n\n### Boundary Abstraction\n\n| Field | Value |\n| --- | --- |\n| declared_starting_condition | Received purchased bleached chemical papermaking pulp and external utilities |\n| starting_condition_role | Foreground manufacturing entry |\n| product_classification_scope | Mechanical uncoated greaseproof subset of CPC 32137; not its incompatible sibling routes |\n| recursive_input_rule | Purchased same-category paper is an upstream product, not a reason to reproduce its manufacture here. A converting-only route is excluded; own internal broke is an internal return, not a purchased recursive input. |\n| upstream_dataset_requirement | Require compatible cradle-to-gate pulp, utility, chemical and packaging datasets and external waste treatment; physical flow identity alone is insufficient |\n| disclosure | Disclose collected gate-to-gate scope separately from upstream/downstream links; missing links never imply zero burden or complete cradle-to-gate coverage |\n\n| rule_id | applies_to | rule | source_ids |\n| --- | --- | --- | --- |\n| boundary_include | all inventory rows | Include stock preparation, refining, wet forming, pressing, drying, finishing, dispatch, cleaning, internal recovery and primary/aerobic treatment; add each actual process chemical and waste as a separate specific row. Keep start-ups, grade changes and cleaning in the actual collection period. | jrc-pulp-paper-bref-2015 |\n| boundary_services | all inventory rows | External electricity/steam generation and water supply are background links: do not duplicate their combustion or abstraction emissions here. On-site boilers, pulping/bleaching or anaerobic digestion require another evidenced scope; downstream receiving-water gas generation and disposal are separately linked. | jrc-pulp-paper-bref-2015; ipcc-wastewater-2019 |\n| boundary_links | all inventory rows | Internal effluent_transfer and wastewater_in have equal whole-mixture masses, volumes, density and composition. Return white water, fibre, activated sludge and condensate are recorded in physical ledgers and cancel once. Record only final outfall releases to the environment; do not add untreated loads or waste-transfer loads twice. | jrc-pulp-paper-bref-2015 |\n\n"
      headings:
        - kind: "heading"
          span:
            start:
              offset: 383
              line: 10
              column: 1
            end:
