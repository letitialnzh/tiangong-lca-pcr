measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Measure Q as accepted paper net mass in cp_mass. All rows use the same period, route and per 1 kg reference flow denominator. Core/wrapper and rejected or internal paper are excluded from Q."
  - id: wet_dry_basis
    applies_to: "pulp, paper, wastes and chemicals"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep m_dry = m_wet * (1 - w), with measured wet-basis w. Supplier air-dry conventions must be stated. Physical fibre and water balances use actual solids/moisture; never assume a pulp or paper moisture percentage."
  - id: electricity_basis
    applies_to: "electricity; wwtp_electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Preserve the reference property; E_MJ = 3.6 * E_kWh is only a unit conversion. Exclude duplicated WWTP meter quantities; verify supplier quantity, region, voltage and loss basis."
  - id: steam_basis
    applies_to: "drying_heat"
    required_property_ref:
      name: "Gross calorific value"
      uuid: "93a60a56-a3c8-14da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "cp_heat defines measured net delivery H_net; a supplier must establish H_bg = k_bg * H_net for the selected energy convention, including pressure, dryness and condensate returns. An unknown k_bg is pending, not one."
  - id: water_basis
    applies_to: "water; wwtp_water; effluent_transfer; wastewater_in; effluent_water"
    required_property_ref:
      name: "Mass / Volume"
      uuid: ""
    required_unit: "kg; m3"
    rule: "Process water and whole wastewater mass use measured density and volume; both internal transfer ends preserve equal whole mass, volume and composition. Final elementary water is only component volume, with whole effluent volume retained for pollutant loads. Keep the utility steam/condensate ledger separate."
