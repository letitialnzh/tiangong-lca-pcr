allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "converting"
    rule: "Attribute consumption with stage/batch meters and production records before sharing burdens. For mixed orders, use observed causal machine time/load or throughput only where the measured relationship supports it; document denominator, idle/changeover and excluded orders. No fixed allocation share."
    source_ids: []
  - rule_id: allocation_physical
    applies_to: "all inventory rows"
    rule: "Keep the complete physical material/water/carbon ledger and equal internal links before allocating environmental burdens. Do not multiply physical product, trim, waste or internal-transfer quantities by an allocation share. Separate burden shares from physical output masses."
    source_ids: []
  - rule_id: allocation_waste
    applies_to: "trim_output; reject_output; dust_output"
    rule: "Classify the actual receiver/legal-economic status; this route reports paper scraps as waste for offsite treatment/recycling. No automatic substitution credit or co-product share. If scraps become co-products, independently justify the allocation method and positive data before using it."
    source_ids: []
  - rule_id: allocation_recycle
    applies_to: "all inventory rows"
    rule: "Document upstream recycled-paper accounting and the downstream recycling boundary consistently. Internal paper/gum returns do not create saleable output or duplicate avoided burdens."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "converting"
      flow_role: "envelope_output"
      record_type: "measurement_record"
      raw_fields: "order; accepted lot mass; tare; moisture; counts; rejected lots; dimensions; stock/dispatch reconciliation"
      collection_method: "Calibrated scales and lot acceptance records; weigh conditioned empty envelopes excluding carton/contents. Counts and sample mass are QA, not an unmeasured count-to-mass denominator."
      unit: "kg"
      frequency: "Each batch/shift; transfers and maintenance per event"
      temporal_coverage: "Declared representative period covering all orders, startup/idle and seasonal conditions; disclose gaps"
      site_scope: "Named converter, matched lines and orders"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/receiver receipts, tests, uncertainty and reconciliation"
    - protocol_id: cp_materials
      process_id: "converting"
      flow_role: "paper_input; box_input"
      record_type: "measurement_record"
      raw_fields: "lot; supplier; net received/issued/returned quantities; stocks; full packaging dispatch/return/discard; moisture; carton empty mass; paper grade/grammage/furnish"
      collection_method: "Weigh issue/return stocks and cartons; reconcile invoices and stage cutting/scrap records with attributable accepted output. Keep fibre/dry-solids and as-received mass separate."
      unit: "kg"
      frequency: "Each batch/shift; transfers and maintenance per event"
      temporal_coverage: "Declared representative period covering all orders, startup/idle and seasonal conditions; disclose gaps"
      site_scope: "Named converter, matched lines and orders"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/receiver receipts, tests, uncertainty and reconciliation"
    - protocol_id: cp_adhesive
      process_id: "converting"
      flow_role: "seam_glue_input; flap_gum_input"
      record_type: "measurement_record"
      raw_fields: "separate grade/lot; full formula; SDS/TDS; supplier mass basis; wet issued/returned/stocks; solids; carrier water; additives; viscosity; density; application stage"
      collection_method: "Separate wet weighings for seam and flap gums, validated solids/water tests and supplier records. Keep recovered gum internal; audit each volatile species and mass fraction. Declare uncertainty and no invented formulation."
      unit: "kg"
      frequency: "Each batch/shift; transfers and maintenance per event"
      temporal_coverage: "Declared representative period covering all orders, startup/idle and seasonal conditions; disclose gaps"
      site_scope: "Named converter, matched lines and orders"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/receiver receipts, tests, uncertainty and reconciliation"
    - protocol_id: cp_water
      process_id: "converting"
      flow_role: "water_input; effluent_output"
      record_type: "measurement_record"
      raw_fields: "meter volumes; event density; dilution/cleaning location; tank stocks; effluent kg/m3; water fraction; COD/TOC; TSS; pH; additives; receiver"
      collection_method: "Meter fresh tap water; sample the actual waste tank and weigh/measure transfer before accepted offsite treatment. Separate pollutant loads from bulk waste mass and from the water balance. No water withdrawal/emission double counting."
      unit: "kg; m3"
      frequency: "Each batch/shift; transfers and maintenance per event"
      temporal_coverage: "Declared representative period covering all orders, startup/idle and seasonal conditions; disclose gaps"
      site_scope: "Named converter, matched lines and orders"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/receiver receipts, tests, uncertainty and reconciliation"
    - protocol_id: cp_energy
      process_id: "converting"
      flow_role: "electricity_input"
      record_type: "measurement_record"
      raw_fields: "meter ID; stage/shift kWh; idle/changeover; pressure-air load; dryer/fan runtime; voltage; grid supplier/year; supply loss boundary"
      collection_method: "Use calibrated process submeters and reconciled common meter, retain actual causal attribution and verified kWh-MJ conversion. Electric drying is measured, not borrowed from steam demand."
      unit: "MJ"
      frequency: "Each batch/shift; transfers and maintenance per event"
      temporal_coverage: "Declared representative period covering all orders, startup/idle and seasonal conditions; disclose gaps"
      site_scope: "Named converter, matched lines and orders"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/receiver receipts, tests, uncertainty and reconciliation"
    - protocol_id: cp_waste
      process_id: "converting"
      flow_role: "trim_output; reject_output; dust_output"
      record_type: "measurement_record"
      raw_fields: "separate stream mass; moisture; paper/gum fractions; stocks; internal rework; receipt; recipient acceptance/treatment; dust-capture records"
      collection_method: "Weigh separate bins at dispatch and record composition, hazard and actual receiver. Remove internal rework from external transfer totals without losing its physical production ledger."
      unit: "kg"
      frequency: "Each batch/shift; transfers and maintenance per event"
      temporal_coverage: "Declared representative period covering all orders, startup/idle and seasonal conditions; disclose gaps"
      site_scope: "Named converter, matched lines and orders"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/receiver receipts, tests, uncertainty and reconciliation"
    - protocol_id: cp_maintenance
      process_id: "converting"
      flow_role: "hydraulic_input; spent_hydraulic_output"
      record_type: "measurement_record"
      raw_fields: "press ID; fluid grade/composition; supplied litres; additions; reservoir and store stocks; drained kg/litres; density; leaks; receiver"
      collection_method: "Meter/weigh actual external additions and drained oil, survey leaks and maintain an in-use fluid balance. Attribute actual maintenance over covered use; do not equate circulating reservoir volume with consumption."
      unit: "m3; kg"
      frequency: "Each batch/shift; transfers and maintenance per event"
      temporal_coverage: "Declared representative period covering all orders, startup/idle and seasonal conditions; disclose gaps"
      site_scope: "Named converter, matched lines and orders"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/receiver receipts, tests, uncertainty and reconciliation"
    - protocol_id: cp_transport
      process_id: "converting"
      flow_role: "transport_input"
      record_type: "measurement_record"
      raw_fields: "supplier leg; gross tonnes; actual road km; vehicle class; load fraction; return leg; already-included supply freight"
      collection_method: "Use bills of lading, measured consignment mass and route records; calculate freight service per leg and reconcile overlap with supplied-material backgrounds."
      unit: "kg*km"
      frequency: "Each batch/shift; transfers and maintenance per event"
      temporal_coverage: "Declared representative period covering all orders, startup/idle and seasonal conditions; disclose gaps"
      site_scope: "Named converter, matched lines and orders"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/receiver receipts, tests, uncertainty and reconciliation"
    - protocol_id: cp_evaporation
      process_id: "converting"
      flow_role: "water_vapour_output"
      record_type: "measurement_record"
      raw_fields: "gum carrier water; added water; paper/product moisture; water fraction in all wastes; opening/closing stocks; ventilation discharge; uncertainty"
      collection_method: "Close actual water input-output-stock balance on water components; verify nonnegative physically plausible evaporation and discharge location. Retain unexplained residual as pending."
      unit: "kg"
      frequency: "Each batch/shift; transfers and maintenance per event"
      temporal_coverage: "Declared representative period covering all orders, startup/idle and seasonal conditions; disclose gaps"
      site_scope: "Named converter, matched lines and orders"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/receiver receipts, tests, uncertainty and reconciliation"
    - protocol_id: cp_air
      process_id: "converting"
      flow_role: "pm25_output; pmcoarse_output; pmover10_output"
      record_type: "measurement_record"
      raw_fields: "outlet/fugitive location; sampled air volume/time; operating hours; controls; size fractions; captured mass; blanks; uncertainty; paper/filler/gum composition"
      collection_method: "Site-specific size-resolved air monitoring with actual method, comparable conditions and uncertainty; reconcile captured waste separately. BREF only identifies a cutting-dust question, not a sampling standard or factor."
      unit: "kg"
      frequency: "Each batch/shift; transfers and maintenance per event"
      temporal_coverage: "Declared representative period covering all orders, startup/idle and seasonal conditions; disclose gaps"
      site_scope: "Named converter, matched lines and orders"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, raw logs, supplier/receiver receipts, tests, uncertainty and reconciliation"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "For each non-reference exchange, normalized amount = attributable total physical exchange for the period / accepted net finished envelope kg for that period. Preserve physical totals and units; only envelope_output is fixed at 1 kg."
      inputs:
        - "period row totals"
        - cp_output
        - "applicable row protocol"
      output: "exchange amount per 1 kg reference flow"
      source_ids: []
    - id: component_balance_worksheet
      applies_to: "converting physical material/water/carbon and packaging/container/oil ledgers"
      rule: "Keep component worksheets before normalization: dry paper issued plus dry adhesive solids equals accepted-envelope dry solids plus the dry components of external trim/rejects/dust/effluent plus stock change, with any additional measured loss disclosed. Packaging and hydraulic-fluid balances are separate. For the actual carton and each supplier-owned returnable gum container, record full receipts plus opening stock equal full dispatch/return transfers plus actual discarded mass plus closing stock. Outgoing packaging is additional to net envelopes; never shrink physical transfers by reuse or burden shares. Material providers cover container manufacture/service only when documented; avoid double-counting while preserving physical return records. Water entering in paper, supplied wet gums and added tap water equals water retained in envelopes and all wastes plus evaporation and water stock change. Determine water content separately from gross effluent kg. Record biogenic and fossil carbon fractions of actual paper and additives through product, waste and any actual air/water releases; no biogenic CO2 removal by GHG-reporting convention. No carbon reaction or direct combustion is assumed. Record uncertainty and explain residuals; a balance cannot infer unknown recipe proportions."
      inputs:
        - cp_materials
        - cp_adhesive
        - cp_water
        - cp_output
        - cp_waste
        - cp_maintenance
        - cp_evaporation
        - "actual composition and stocks"
      output: "unnormalized physical component/water/carbon and gross package/container/oil stock ledgers; residuals and uncertainty"
      source_ids: []
    - id: native_quantity_worksheet
      applies_to: "electricity_input; transport_input; pm25_output; pmcoarse_output; pmover10_output; water_vapour_output"
      rule: "Electricity: retain 3.6 times actual kWh in MJ. Freight: retain measured gross tonnes and actual leg kilometres, multiply their per-leg product by1000 to native kg*km, removing overlap with already included transport. PM2.5-to-10 may be compatible cumulative PM10 minus PM2.5; above-10 may be compatible total particles minus PM10. Differences need comparable size methods and nonnegative results. Water-vapour estimation uses the measured water-component balance; unresolved carrier water cannot be guessed. These supporting worksheets do not change the common reference denominator."
      inputs:
        - cp_energy
        - cp_transport
        - cp_air
        - cp_evaporation
        - cp_water
        - cp_output
      output: "raw native-unit worksheets and compatible particle/water evidence; normalization remains once under normalize_period"
      source_ids: []
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all inventory rows"
      requirement: "Verify physical composition/state, supplier and receiver reference basis separately from UUID identity; empty UUID is explicit missing linkage."
      evidence: "Supplier grade/formula, raw identity and unit records, receiver acceptance"
    - id: quality_coverage
      applies_to: "converting"
      requirement: "No generic recipe, yield, moisture, density, emission factor or background selected from historical/single-factory observations; use actual period coverage and uncertainty."
      evidence: "Site protocols, logs and balances"
    - id: quality_sources
      applies_to: "converting"
      requirement: "JRC draft is qualitative context, BREF applies to pulp/paper and paper finishing, producers establish described capabilities only. Foreground measurement remains required; source dates and conditions must be disclosed."
      evidence: "Located originals with bounded applicability"
validation_rules:
  - rule_id: validation_route
    applies_to: "envelope_output"
    rule: "Require every declared qualifier and reject data from windows, printed/security-coated stock, peel-seal, latex self-seal or onboard papermaking unless separately reviewed. The broad reference name never expands scope automatically."
    source_ids: []
  - rule_id: validation_denominator
    applies_to: "all inventory rows"
    rule: "Exactly one reference product output is 1 kg accepted net conditioned empty envelopes. All collection/aggregation/inventory bases use this same denominator; intermediate blanks remain internal."
    source_ids: []
  - rule_id: validation_balance
    applies_to: "converting"
    rule: "Reconcile physical paper/adhesive/water/carbon and separate oil/packaging stocks before burden attribution; identify all residuals and uncertainties. Negative incompatible PM differences or unexplained stock loss remain pending."
    source_ids: []
  - rule_id: validation_linkage
    applies_to: "all inventory rows"
    rule: "UUID identity alone does not establish a provider dataset. Verify complete route, grade, reference property/unit, moisture/concentration, geography/year and treatment boundary. Blank identities and unsupported bases remain disclosed gaps, not matched backgrounds or zeros."
    source_ids: []
  - rule_id: validation_emissions
    applies_to: "all elementary outputs"
    rule: "Require actual outlet/medium/species/size evidence; separate air releases from captured waste and bulk effluent transfers. No size double counting, correction-flow substitution, unmeasured zero or biogenic-CO2 deletion. Expand actual chemistry/combustion route inventory before completeness claims."
    source_ids:
      - eu-paper-bref-2015
  - rule_id: validation_readiness
    applies_to: "converting"
    rule: "This candidate methodology is unreviewed. A quantified dataset is incomplete until foreground protocols, supplier formulas, unresolved flow/provider links, actual emissions and receiver acceptance are supplied; methodology authorship is not scientific approval."
    source_ids: []
published_dataset_profile:
  dataset_role: "foreground_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "After data completeness checks: supplier-specific unprinted windowless gummed envelope manufacture, per 1 kg net gate output"
  excluded_use: "All CPC32192 products by label alone; postal service; printed/windowed/liner variants; Ecolabel certification; uncollected recipe; approval or universal benchmark"
  required_metadata: "Reference qualifiers, source scope, measured period, site, process map, physical balances, allocation method, raw protocols, backgrounds and waste treatment"
  required_quality_disclosure: "Independent review absent; missing identities/providers/measurements, uncertainty, exclusions, chemical/particulate completeness and representativeness"
  update_trigger: "Paper grade/furnish, either adhesive formulation, window/printing/closure route, energy supply, transport mode, output quality or waste treatment changes"
