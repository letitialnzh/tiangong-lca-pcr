classification_refs:
- system: CPC
  version: '3.0'
  code: '32192'
  title: Envelopes, letter cards, plain postcards and correspondence cards of paper or paperboard; boxes, pouches,
    wallets and writing compendiums, of paper or paperboard, containing paper stationery
  mapping_type: narrower
review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  scientific_review_status: pending independent scientific review; controller authoring and identity review completed
  semantic_scope:
    route: Purchased uncoated woodfree envelope-grade sheets; die-cut blanks; aqueous synthetic-resin seam dispersion;
      aqueous dextrin-based remoistenable flap gum; electric drying; no printing, window, release strip or self-seal;
      hydraulic die press; low-voltage grid supply.
    mapping_recommendation: narrower
    reason: Only this manufactured correspondence-envelope subset of mixed CPC32192 is covered; cards, stationery
      sets and other closure/window/printing routes are excluded. Controller acceptance remains required.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  unresolved_flow_rows:
  - box_input
  unresolved_identity_details:
    box_input: Candidate corrugated box hard-limits 16.6% primary/83.4% recycled fibre; no basis to impose this
      blend. Folding Paper box route/structure differs.
  quantity_background_compatibility:
    envelope_output: Broad manufactured Product Mass/kg UUID contains selected envelope subset; requires net empty
      conditioned gate output. It is not a specific envelope background dataset.
    paper_input: Raw name/comment support uncoated envelope grade, but CPC32129 classification is not proof of actual
      fibre furnish. Declare chemical pulp, recycled fraction, moisture, grade and provider.
    water_input: Direct Mass/kg reference; measured volume-density conversion and actual supplier supply boundary,
      no secondary property density default.
    electricity_input: Raw <1kV consumption-mix AC, NCV/MJ property. Site provider/year/mix/voltage/loss boundary
      must match, unit conversion alone does not establish background. Source location CN must match actual electricity
      supplier; no generic-name geographic substitution.
    hydraulic_input: Raw reference Volume/m3; actual mineral-base formulated fluid grade and measured density required.
      Database secondary mass factor is not density. Reservoir circulation is internal.
    paper_waste_outputs: Clean trim and actual paper-dominant gummed rejects retain distinct paper-waste kg; collected
      cutting dust uses dedicated Dust Waste identity. Keep all three full masses/compositions/receivers separate.
    seam_glue_input: Broad manufactured Adhesives Product Mass/kg UUID contains one actual aqueous synthetic-resin
      envelope seam formulation. Examples of heavy substrates are not exclusive scope. No CAS/route/phase restriction
      contradicts it. Require actual supplied wet grade/full formula, solids/carrier water, additives, supplier
      reference quantity and production model; no dry-polymer or construction-adhesive background substitution.
    flap_gum_input: One actual supplied aqueous dextrin-based remoistenable flap formulation fits the broad manufactured
      adhesive family; examples of heavy substrates in the source do not limit it exclusively to construction. Require
      actual dextrin chemistry, any resin component, all additives, carrier water and measured solids, wet mass
      and compatible supplier reference quantity/production basis. The complete wet adhesive is neither dry dextrin
      nor the separately supplied synthetic-resin seam adhesive. Keep the two formulations and their physical quantities
      separate despite their shared broad UUID. Purchased carrier water is not another fresh-water purchase. No
      default composition, concentration or coating weight; exclude peel/seal hot melt, latex self-seal and release
      liners.
    transport_input: 'One actual inbound diesel-road freight service, with measured gross consignment mass including
      packaging, actual route km, vehicle/fuel/emission class, loading and return convention. This broad road-freight
      identity has no fixed truck-size restriction but does not choose a provider. Native reference is mass*distance
      in kg*km: multiply measured tonne-kilometres by exactly1000, or sum gross kg times km; preserve original tonnes/distance
      records and the same accepted-envelope denominator. Do not count service plus its embedded fuel/exhaust again.
      Other modes require separate reviewed rows.'
    effluent_output: Actual combined liquid effluent from water-only cleaning of the two stated aqueous gums fits
      the industrial-cleaning Waste liquid family only with verified liquid state, whole composition, tank origin
      and accepted offsite receiver. Weigh whole wet transfer or use actual V*rho(T); measure H2O fraction independently
      and multiply it by wet mass for the water ledger. Suspended/dissolved gum solids, additives, COD/TOC and pH
      are characterized separately, not summed as overlapping physical masses. No generic hazard class or treatment
      is inferred. This is not direct freshwater release; unused concentrated gum, gel/dry residue, oil and spills
      require their own physical rows when present.
    spent_hydraulic_output: Actual petroleum/mineral-base hydraulic fluid used for power transfer and lubrication
      and contaminated through use fits this used-lubricating-oil family. Require actual base-oil/additive composition,
      lubricating function, water/solid contamination, full as-drained kg, measured volume/density and accepting
      receiver. The supplied hydraulic fluid remains native Volume/m3 and its oil-reservoir/additions/drainage balance
      uses actual density, never a database secondary-property factor. No metal-machining origin, fixed replacement
      period, hazard status, regeneration or combustion credit is assumed. Oil-bearing wipes/filters and leaks remain
      separate actual streams.
    dust_output: Actual dry paper-cutting dust retained by extraction/cleaning and exported as one separately weighed
      industrial dust stream. Verify fibre/filler composition, moisture, actual clean state, no mixed oil/chemical
      sweepings and receiver acceptance. The dedicated captured-dust Waste identity does not imply emitted PM or
      merge dust with trim/rejected envelopes. Full captured mass and any internal return remain distinct; no assumed
      receiver treatment or capture efficiency.
  remaining_site_requirements:
  - No real factory amounts are supplied. Complete declared protocols, supplier formulations, actual mass/water/carbon
    balances, emissions size analysis, external effluent/used-oil acceptance and compatible backgrounds before releasing
    a quantified dataset.
  - Inspect all external maintenance additions, packaging from inbound supplies, volatile ingredient species and
    spills. Add every actual atomic exchange; source-bounded route does not authorize silent omissions or zeros.
    Bulk adhesives are specified with returnable supplier-owned containers; account their lifetime/transport burdens
    once in supplied-material background and audit this boundary.
  - Foreground is electric, with no boiler, direct combustion, biological wastewater treatment or direct surface-water
    discharge in the selected route. Do not delete actual fossil or biogenic CO2 from expanded foreground or upstream
    LCI on the basis of a GHG reporting convention.
  - Additional window, print, liner, steam, different closure, onsite treatment or freight mode requires separately
    evidenced applicability/inventory review rather than adding alternative materials to a default recipe.
  integration_required: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate. Shared alias/catalog/coverage integration is governed by those accepted decisions; regenerate and validate derivatives after source changes. Independent methodology review and existing source/provider gaps remain separate requirements."
