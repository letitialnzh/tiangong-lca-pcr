allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "tissue_mill"
    rule: "Use product/line/campaign submetering to avoid allocation first. Where inseparable shared utilities/treatment remain, demonstrate a causal physical relation using measured electricity, steam enthalpy or pollutant loads; mass is justified only for compatible grades. If physical attribution cannot be supported, document an independently reviewed alternative and sensitivity rather than inventing a fixed share."
    source_ids:
      - eu-pef-multifunctionality-2021
  - rule_id: allocation_physical
    applies_to: "all inventory rows"
    rule: "Retain unallocated material/water/carbon balances and actual co-product/waste quantities separately from the allocated environmental-burden ledger. Internal broke recycling creates no co-product credit; external recovered-paper/sludge treatment and substitution require receiver and selected end-of-life method, never an automatic avoided-product credit."
    source_ids:
      - jrc-pp-bref-2015
      - eu-pef-multifunctionality-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "tissue_mill"
      flow_role: "reference output"
      record_type: "weighing and laboratory"
      raw_fields: "reel/campaign/grade ID; gross mass; core/spool/wrap tare; accepted net tissue mass; gate moisture and sample/test SOP; quality acceptance; opening/closing accepted stock"
      collection_method: "Calibrated reel weighing with measured tare; matched gate sample and validated moisture/dry-matter method, test volatile-loss applicability; reconcile produced, accepted, dispatched and stock"
      unit: "kg; mass fraction"
      frequency: "Each lot and stage interval; emissions per monitoring plan"
      temporal_coverage: "Full declared campaign including starts, breaks, grade changes and stock changes"
      site_scope: "Declared mill/line and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, laboratory SOP, supplier definitions and complete raw records"
    - protocol_id: cp_furnish
      process_id: "tissue_mill"
      flow_role: "pulp input"
      record_type: "lot receipts and stock records"
      raw_fields: "hardwood/softwood species; origin; supplier/grade; kraft/bleach route; delivered wet mass; actual dry solids; supplier mass definition; stock changes"
      collection_method: "Separate calibrated lot weighing/dry-matter tests and audited issue/stock balance for each pulp; no inference from forest certification alone"
      unit: "kg; mass fraction"
      frequency: "Each lot and stage interval; emissions per monitoring plan"
      temporal_coverage: "Full declared campaign including starts, breaks, grade changes and stock changes"
      site_scope: "Declared mill/line and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, laboratory SOP, supplier definitions and complete raw records"
    - protocol_id: cp_utilities
      process_id: "tissue_mill"
      flow_role: "electricity/gas/steam"
      record_type: "stage submeter and supplier records"
      raw_fields: "stage/source meters; electricity voltage and kWh; gas m3 T/P wet/dry/Z composition; steam supply/return kg, pressure absolute/gauge, temperature, dryness, enthalpy; provider convention; boiler/hood operating/control history"
      collection_method: "Time-matched calibrated meters and supplier definitions; separate own boiler versus bought steam; retain pressure/enthalpy evidence and reject unsupported quantity links"
      unit: "kWh; MJ; m3; kg"
      frequency: "Each lot and stage interval; emissions per monitoring plan"
      temporal_coverage: "Full declared campaign including starts, breaks, grade changes and stock changes"
      site_scope: "Declared mill/line and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, laboratory SOP, supplier definitions and complete raw records"
    - protocol_id: cp_water
      process_id: "tissue_mill"
      flow_role: "water supply/evaporation"
      record_type: "water meters and stage balance"
      raw_fields: "make-up kg/m3; density/temperature; white-water circuits; condensate; paper/pulp/chemical water; treatment discharge; humidity; stock water changes"
      collection_method: "Calibrated external and internal meters with matched material-water balances; circulation separately from net exchange; quantify evaporation with uncertainty"
      unit: "kg; m3"
      frequency: "Each lot and stage interval; emissions per monitoring plan"
      temporal_coverage: "Full declared campaign including starts, breaks, grade changes and stock changes"
      site_scope: "Declared mill/line and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, laboratory SOP, supplier definitions and complete raw records"
    - protocol_id: cp_chemicals
      process_id: "tissue_mill"
      flow_role: "each actual chemical"
      record_type: "recipe and supply balance"
      raw_fields: "specific component, CAS, supplier/SDS and grade; wet-end/coating/treatment location; as-supplied mass; active/dry solids; carrier water; issue, return and stock"
      collection_method: "Calibrated dosing-tank mass balances and invoice/inventory reconciliation. Record each actual complete purchased chemical/formulation once in compatible supplier quantity and preparation/delivery boundary; keep included polymer/oil/carrier/additives as analytical balances only. Independently bought onsite ingredients/adjustments and actual mixing water/utilities are separate exchanges. Add audited rows for actual additional supplies, not merely supplier-listed constituents."
      unit: "kg; mass fraction"
      frequency: "Each lot and stage interval; emissions per monitoring plan"
      temporal_coverage: "Full declared campaign including starts, breaks, grade changes and stock changes"
      site_scope: "Declared mill/line and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, laboratory SOP, supplier definitions and complete raw records"
    - protocol_id: cp_packaging
      process_id: "tissue_mill"
      flow_role: "film/core"
      record_type: "weighing and use records"
      raw_fields: "PE composition; film/core tare and issues; loss; core reuse; durable spool returns; supplier route"
      collection_method: "Measured component weighing and campaign stock/use balance; physical returns/discards remain complete; only service burdens and replacement use are apportioned over documented actual uses; exclude all tare from P"
      unit: "kg; count"
      frequency: "Each lot and stage interval; emissions per monitoring plan"
      temporal_coverage: "Full declared campaign including starts, breaks, grade changes and stock changes"
      site_scope: "Declared mill/line and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, laboratory SOP, supplier definitions and complete raw records"
    - protocol_id: cp_residues
      process_id: "tissue_mill"
      flow_role: "each waste export"
      record_type: "scale and receiver records"
      raw_fields: "individual waste mass; moisture/solids; composition/contamination; receiver; treatment; internal return; collector stock"
      collection_method: "Calibrated weighing of actual external loads with representative solids tests and receiver manifests; record captured versus emitted dust separately"
      unit: "kg; mass fraction"
      frequency: "Each lot and stage interval; emissions per monitoring plan"
      temporal_coverage: "Full declared campaign including starts, breaks, grade changes and stock changes"
      site_scope: "Declared mill/line and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, laboratory SOP, supplier definitions and complete raw records"
    - protocol_id: cp_air
      process_id: "tissue_mill"
      flow_role: "each atmospheric species"
      record_type: "source test and operating history"
      raw_fields: "species/CAS; fossil/biogenic; source/stack; flow, concentration, time; oxygen correction; dry/wet gas T/P; method/detection/uncertainty; controls; gas composition; NOx convention"
      collection_method: "Use actual matched source-test or continuous records and operating periods; fuel-carbon/sulfur calculation needs measured composition and residual reconciliation. Missing measurement is pending, not zero; AP42 boiler factors need separate applicability if later used"
      unit: "kg; concentration; flow"
      frequency: "Each lot and stage interval; emissions per monitoring plan"
      temporal_coverage: "Full declared campaign including starts, breaks, grade changes and stock changes"
      site_scope: "Declared mill/line and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, laboratory SOP, supplier definitions and complete raw records"
    - protocol_id: cp_dust
      process_id: "tissue_mill"
      flow_role: "three particulate intervals"
      record_type: "stack/fugitive size measurement"
      raw_fields: "cutting/creping/winding source; sampler size definition; total/PM10/PM2.5; control efficiency; captured collector mass; wet/dry basis; period and uncertainty"
      collection_method: "Measure actual outlet and relevant fugitive escaped dust with compatible size-resolved sampling; matched differences only; plant cutting/rewinding dust has no boiler or sawmill default factor"
      unit: "kg; particle size"
      frequency: "Each lot and stage interval; emissions per monitoring plan"
      temporal_coverage: "Full declared campaign including starts, breaks, grade changes and stock changes"
      site_scope: "Declared mill/line and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, laboratory SOP, supplier definitions and complete raw records"
    - protocol_id: cp_effluent
      process_id: "tissue_mill"
      flow_role: "each water-discharge indicator"
      record_type: "flow and laboratory sampling"
      raw_fields: "receiver/route; measured whole-effluent m3; actual temperature, density and water fraction; time-matched concentration mg/L; COD/BOD test; TN/N2 exclusion; TP elemental basis; TSS filtration; AOX chlorine-equivalent basis; actual toxic species; raw versus treated points"
      collection_method: "Flow-weighted representative treated-outlet sampling and accredited methods; COD/TSS daily, BOD and N/P weekly as BAT reference with relevant footnotes/site conditions; AOX and relevant metals/chelants assessed by actual chemistry. Include bypass/upset intervals; no concentration-limit-to-emission shortcut"
      unit: "m3; mg/L; kg"
      frequency: "Each lot and stage interval; emissions per monitoring plan"
      temporal_coverage: "Full declared campaign including starts, breaks, grade changes and stock changes"
      site_scope: "Declared mill/line and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, laboratory SOP, supplier definitions and complete raw records"
    - protocol_id: cp_carbon
      process_id: "tissue_mill"
      flow_role: "biogenic carbon fate"
      record_type: "carbon balance and treatment evidence"
      raw_fields: "measured fibre/chemical carbon; product carbon; exports; stocks; treatment carbon gases; captured gas oxidation; fossil segregation"
      collection_method: "Retain physical carbon inputs/outputs and stock changes; quantify measured/model-supported biogenic CO2/CH4 pathways separately, disclose residual; do not infer carbon from COD without supported conversion"
      unit: "kg C; kg species"
      frequency: "Each lot and stage interval; emissions per monitoring plan"
      temporal_coverage: "Full declared campaign including starts, breaks, grade changes and stock changes"
      site_scope: "Declared mill/line and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, laboratory SOP, supplier definitions and complete raw records"
  calculation_rules:
    - id: accepted_mass
      applies_to: "parent_reel"
      rule: "P = sum(gross accepted reel mass - measured core/spool tare - measured wrap tare); reconcile production, delivery and stock; no rejected or returned internal broke in P."
      inputs:
        - cp_mass
      output: "P"
      source_ids:
        - iso-solid-dry-matter-scope-2022
    - id: same_reference_normalization
      applies_to: "all inventory rows"
      rule: "x = X / P, where X is the actual attributable campaign exchange in its row unit and P is accepted net tissue kg at measured gate moisture; retain raw physical ledger and allocated burden ledger separately."
      inputs:
        - cp_mass
        - "each linked row protocol"
      output: "x"
      source_ids:
        - jrc-pp-bref-2015
    - id: dry_conversion
      applies_to: "mass-based pulp, tissue, chemical/formulation and residue moisture-component ledgers"
      rule: "d = m*(1-w); D = sum(d for accepted tissue); dry-output intensity I_d becomes delivered-output intensity I_d*D/P. Measured total dry solids is not automatically pure cellulose mass. Auxiliary component mass/moisture does not replace native gas Volume/m3, steam GCV/MJ or electricity NCV/MJ references."
      inputs:
        - cp_mass
        - cp_furnish
        - cp_chemicals
        - cp_residues
      output: "measured dry/wet basis"
      source_ids:
        - iso-solid-dry-matter-scope-2022
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "MJ = 3.6 * kWh; x = MJ/P."
      inputs:
        - cp_utilities
        - cp_mass
      output: "MJ/kg"
      source_ids:
        - jrc-pp-bref-2015
    - id: steam_reconciliation
      applies_to: "steam"
      rule: "H_net = sum(m_supply*h_supply - m_return*h_return) at the declared interface; match enthalpy datum, state, storage and actual boundary losses once. Q_bg = k_bg*H_net under the verified provider MJ definition; x = Q_bg/P. Never subtract already included losses twice or set k_bg=1 by assumption. Preserve physical steam/condensate kg separately."
      inputs:
        - cp_utilities
        - cp_mass
      output: "provider-reference MJ/kg tissue and separate physical heat/mass reconciliation"
      source_ids:
        - jrc-pp-bref-2015
    - id: water_pollutant_load
      applies_to: "cod, bod, tn, tp, tss, aox"
      rule: "L = sum(c_k * V_k * 0.001), with c_k in mg/L and matched discharge V_k in m3; x = L/P. COD/BOD as O2, N as N, P as P, AOX as Cl; keep indicators out of physical mass sums."
      inputs:
        - cp_effluent
        - cp_mass
      output: "kg indicator/kg"
      source_ids:
        - eu-paper-bat-2014
    - id: particle_partition
      applies_to: "pm_fine, pm_coarse, pm_large"
      rule: "Fine = measured PM2.5; coarse = matched PM10 - PM2.5; large = matched total - PM10 only with identical sampling definitions; x = fraction/P. Do not add total or PM10 to the three fractions; unknown partition remains pending."
      inputs:
        - cp_dust
        - cp_mass
      output: "kg fraction/kg"
      source_ids:
        - jrc-pp-bref-2015
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Inspect complete name, CAS, classification, route, comment, reference property/unit and exact species/medium. Verify supplier quantity compatibility separately from identity; disclose metadata conflicts."
      evidence: "supplier/SDS; verified identities"
    - id: balances
      applies_to: "tissue_mill"
      requirement: "Close wet mass, dry solids, water and carbon physically with stocks and uncertainty; retain internal-link equality and dust capture/export/air partition. Environmental attribution cannot repair a physical imbalance."
      evidence: "stage ledger and laboratory"
    - id: route_scope
      applies_to: "tissue_mill"
      requirement: "No inherited wood-processing data or historic single-mill recipe becomes a tissue default. This route requires verified actual drying, creping, furnish, chemistry and gate moisture."
      evidence: "BREF and actual collection"
    - id: coverage
      applies_to: "tissue_mill"
      requirement: "Full campaign includes start-ups, downtime, breaks, cleaning, rejected reels, relevant waste/air/water pathways and background transport links; reveal unsupported methods and unresolved values without setting them to zero."
      evidence: "complete campaign records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "parent_reel"
    rule: "Require exactly one accepted final product output linked by parent_reel and reference UUID, at 1 kg net tissue; EN/ZH amount, denominator, aggregation and formulas agree. Do not introduce a second reference output for winding-to-wrapping transfer."
    source_ids:
      - jrc-pp-bref-2015
  - rule_id: validate_applicability
    applies_to: "tissue_mill"
    rule: "Confirm virgin purchased bleached kraft pulp, CWP press/Yankee/hood/blade-creping route and single-ply parent-reel state; reject retail converted products, airlaid/nonwoven, TAD/hybrid and recovered-fibre/integrated-pulping claims under this PCR."
    source_ids:
      - jrc-pp-bref-2015
      - sofidel-parent-reels
  - rule_id: validate_inventory
    applies_to: "all inventory rows"
    rule: "Require each exchange to be atomic with matching actual substance, medium/submedium, origin, property/unit and supplier quantity convention. Missing identity, steam pressure/enthalpy, gas m3 definition or NOx basis remains unresolved; do not advertise a complete dataset."
    source_ids:
      - jrc-pp-bref-2015
  - rule_id: validate_conservation
    applies_to: "tissue_mill"
    rule: "Reconcile physical mass/water/carbon and equal internal links before environmental allocation. Capture/return/export/emission dust quantities do not overlap; three airborne size fractions do not include nested totals. Preserve actual biogenic CO2 and distinct fossil/biogenic methane."
    source_ids:
      - jrc-pp-bref-2015
      - eu-pef-multifunctionality-2021
  - rule_id: validate_discharge
    applies_to: "tissue_mill"
    rule: "Require actual receiving medium and treatment boundary; direct freshwater discharge and off-site wastewater transfer cannot duplicate the same load. Known toxic organochlorine/metals and other actual emissions require individual species rows and reconciliation with COD/BOD/TN/TP/AOX indicators. Missing measurements are not non-detects or zero emissions."
    source_ids:
      - eu-paper-bat-2014
published_dataset_profile:
  dataset_role: "foreground_data_production"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Reviewed supplier/line-specific upstream inventory of creped parent reels for a converter, with actual quality/state and compatible reference quantity"
  excluded_use: "Complete CPC32131 coverage; consumer roll/sheet functional comparison; paper-wadding/nonwoven or TAD/hybrid/recycled routes; scientific/publication approval or full cradle-to-gate claim from UUID identity alone"
  required_metadata: "Site/year/campaign; fibre origin and grade; machine/press/dryer/creping/rewind state; recipe and supply conventions; gate moisture/net mass and quality; upstream links; treatment/receiver; allocation/balance ledgers"
  required_quality_disclosure: "Actual monitoring coverage, unresolved identities/bases/providers, measured uncertainty, sample/SOP limitations, source metadata defects and exclusions; no generic numerical defaults"
  update_trigger: "Change of fibre/chemistry/drying/creping or delivery state, utility provider/basis, wastewater route, dust controls or acceptance quality; new evidence resolving gaps"
data_sources:
  - id: "jrc-pp-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Production of Pulp, Paper and Board (2015); https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Sections 7.1.1–7.1.4, 7.1.10, 7.1.11.3; printed pp. 660, 664–665, 670, 672–674. Technical routes, broke/white-water recovery and cutting dust; EU context, not universal amounts; conventional virgin-pulp branch selected."
  - id: "sofidel-parent-reels"
    type: "handbook"
    reference: "Sofidel, Parent Reels and Production Cycle; https://www.sofidel.com/en/business-lines/parent-reels/"
    used_for: "Parent Reels and Production Cycle steps 1–4 and 7: producer evidence for pulp preparation, parent-reel acceptance and separate downstream conversion. Producer example only, no fixed furnish, moisture or energy value; cycle URL https://www.sofidel.com/en/about-us/production-cycle/."
  - id: "solenis-pae-scope"
    type: "handbook"
    reference: "Solenis, Kymene Wet Strength Additives; https://www.solenis.com/en/the-solenis-way/innovation-solenis/our-product-innovations/kymene-wet-strength-additives/"
    used_for: "Technology Overview: PAE for tissue/towel wet strength and chlorinated by-products. Supplier scope, not dosage, solids content or universal additive requirement."
  - id: "ep-creping-2019"
    type: "literature"
    reference: "EP 2661285 B1, Creping adhesive compositions and methods of using those compositions; granted 27 March 2019; https://patentimages.storage.googleapis.com/98/9c/f7/a97cf4334331c9/EP2661285B1.pdf"
    used_for: "PDF p.2, paragraphs 0001–0004: PAE/PVOH coating chemistry and Yankee creping mechanism; patent route example only, no trial formulation/quantity adopted."
  - id: "iso-solid-dry-matter-scope-2022"
    type: "standard"
    reference: "ISO 638-1:2022, official solid-material dry-matter scope and notes; https://committee.iso.org/standard/83614.html?browse=ics"
    used_for: "Official abstract only: solid pulp/paper samples, non-water volatile-loss restriction; total dry matter includes dissolved solids. Not slush pulp or saleable lot mass. Full sampling/test compliance requires actual validated SOP; no claimed access to full standard."
  - id: "epa-ap42-gas-2026"
    type: "official_guidance"
    reference: "US EPA AP-42 Section 1.4 Natural Gas Combustion, corrected October 2026; https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf"
    used_for: "Sections 1.4.1–1.4.3 and disclaimer, pp.1.4-1–1.4-3: combustion sources/species and preference for source testing. Boiler source does not establish paper-cutting dust or a hood-specific factor; no published factor used as a default."
  - id: "eu-paper-bat-2014"
    type: "official_guidance"
    reference: "Commission Implementing Decision 2014/687/EU; https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32014D0687"
    used_for: "BAT 10 monitoring table and applicability footnotes: water COD/BOD/TSS/N/P, conditional AOX, chelants/metals. Official web scope/table excerpt only. Monitoring context only; no regulatory limit or BAT-AEL becomes a universal inventory quantity."
  - id: "eu-pef-multifunctionality-2021"
    type: "official_guidance"
    reference: "Commission Recommendation (EU) 2021/2279, Annex I section 4.5; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "PDF p.63: subdivision/system expansion and justified underlying physical allocation hierarchy; general method only, no fixed tissue share or complete PEF-conformance claim."
