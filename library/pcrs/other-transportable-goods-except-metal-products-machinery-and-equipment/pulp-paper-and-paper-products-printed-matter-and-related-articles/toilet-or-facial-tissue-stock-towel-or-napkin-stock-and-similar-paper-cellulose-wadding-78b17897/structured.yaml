measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "P is weighed accepted net tissue at the actual mill-gate moisture, excluding all cores/spools/wrappers and rejected/internal broke; collect using cp_mass. All inventory rows use this same 1 kg denominator."
  - id: dry_wet_basis
    applies_to: "mass-based pulp, tissue, chemical/formulation and residue moisture-component ledgers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Record m and same-lot wet-basis moisture w; dry solids d = m*(1-w). A dry-output intensity converts to delivered-output intensity using measured dry output D/P. Do not equate pulp supplier air-dry tonnes, oven-dry tonnes and delivered tonnes. ISO source is scope-only; obtain an applicable validated sampling/test SOP. Auxiliary component mass/moisture does not replace native gas Volume/m3, steam GCV/MJ or electricity NCV/MJ references."
  - id: utility_basis
    applies_to: "natural_gas, steam, electricity"
    required_property_ref:
      name: "Volume / Gross calorific value / Net calorific value"
      uuid: ""
    required_unit: "m3 / MJ / MJ"
    rule: "Match gas volume conditions, physical steam/condensate mass and enthalpy, supplied-heat provider reference MJ and grid-voltage interfaces independently. 1 kWh = 3.6 MJ is exact unit conversion, not efficiency. A GCV property does not establish net delivered heat; actual k_bg is required."
  - id: chemical_basis
    applies_to: "wet_strength, retention_aid, defoamer, yankee_adhesive, yankee_pae, release_oil, wwtp_pac"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Distinguish as-supplied formulated mass, dry solids and active ingredient; separate carrier water and each other actual chemical component without double counting dilution water."
  - id: emission_basis
    applies_to: "co2_fossil; co2_biogenic; co; nox; n2o; methane; methane_biogenic; so2; voc_ethane; pm_fine; pm_coarse; pm_large; water_vapour; effluent_water; cod; bod; tn; tp; aox; tss"
    required_property_ref:
      name: "Mass / Volume"
      uuid: ""
    required_unit: "kg / m3"
    rule: "Match elementary species/origin/medium and quantity definition. COD/BOD use oxygen equivalent, AOX chlorine equivalent, total N/P elemental mass; these indicators are not additive physical species. NOx-to-NO2 convention remains pending until proven. Use mutually exclusive particulate intervals and retain biogenic CO2."
