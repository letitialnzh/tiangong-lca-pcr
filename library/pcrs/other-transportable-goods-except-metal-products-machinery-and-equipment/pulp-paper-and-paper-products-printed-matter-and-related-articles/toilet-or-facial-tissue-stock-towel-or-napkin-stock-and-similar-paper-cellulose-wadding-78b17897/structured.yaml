system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "tissue_mill"
      rule: "Include all actual stock preparation, forming/pressing/vacuum, Yankee/hood drying, blade creping, parent-reel winding/edge cutting, accepted-reel conditioning and protection, broke/white-water recovery and attributable utilities/treatment within the declared gate. Keep included combustion emissions."
      source_ids:
        - jrc-pp-bref-2015
    - rule_id: boundary_conversion
      applies_to: "tissue_mill"
      rule: "Stop at the accepted single-ply parent reel: downstream ply bonding, embossing, perforation, folding, log cutting and consumer packaging belong to separate conversion. An integrated plant must separate meters/records and link this upstream output once."
      source_ids:
        - sofidel-parent-reels
    - rule_id: boundary_water
      applies_to: "tissue_mill"
      rule: "Internal white water, recovered fibres, broke and condensate returns are conserved links. Off-site untreated wastewater transfer and on-site treated direct discharge are alternative routes for the same water, not simultaneous burdens."
      source_ids:
        - jrc-pp-bref-2015
    - rule_id: boundary_heat
      applies_to: "tissue_mill"
      rule: "An included gas boiler records fuel and actual emissions; its steam is internal. External steam records the supplier input once and its generation burden upstream. Shared utilities need measured allocation; no duplicate fuel and purchased-steam production."
      source_ids:
        - jrc-pp-bref-2015
        - epa-ap42-gas-2026
