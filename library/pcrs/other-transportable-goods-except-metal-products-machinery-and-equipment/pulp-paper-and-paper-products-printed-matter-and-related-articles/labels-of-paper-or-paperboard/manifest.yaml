  supplier_basis_review:
  - 'labelstock: broad retail label-stock identity; verify complete unprinted laminate mass and supplier background
    including papermaking, silicone coating/cure and acrylic PSA coat/dry/lamination. No industry estimate adopted.'
  - 'electricity: actual 1–35 kV incoming supply, geography/year and user transformer boundary; NCV property is
    energy accounting only.'
  - 'tap water: reference mass/kg; metered volume requires actual density and temperature, not an assumed database
    coefficient.'
  - 'ink_residue: broad waste identity; expert-judgement amount not used; actual aqueous formulation and receiver
    required.'
  - Labelstock 5f6bda17 is CN retail-container stock, not unrestricted application/geography; complete unprinted
    laminate and supplier background still require evidence.
  - Electricity source CN; actual supply compatibility pending.
  range_evidence_need: No generic recipe, coat weight, yield, water/energy or emission interval established from
    independent compatible originals. All variable amounts require actual collection; range warnings remain disclosed.
  foreground_state: Methodology for future collection, not a measured factory dataset. Electricity-only drying;
    no onsite boiler, steam or oxidizer. Offsite washwater and wastes; no foreground receiving-water outfall.
  translation_review: Controller checked aligned EN/ZH official names and physical rules; scientific review not
    established.
  conditional_flow_compatibility:
    ink: The selected broad printing-ink record has aqueous synonyms and a Chinese water-dilutable/dispersed binder
      description; its English comment gives usual oil-based examples without a mandatory oil recipe. It has no
      flexography-excluding route, but this language difference remains a source/provider clarification debt. Use
      only the actual black aqueous flexographic formulation, complete supplied wet kg, verified composition and
      compatible provider; do not infer default oil/varnish, density or printability from the record.
    matrix: The broad discarded-industrial-solid family identifies this one actual separated paper/PSA/ink matrix
      stream only. Preserve its complete measured wet mass, dry composition, moisture and receiver; the shared broad
      UUID does not merge it with rejects or spent plates or authorize a clean-paper background. No default recycling,
      hazard or treatment.
    liner_waste: The unspecified paper/paperboard-scrap family can identify the actual paper-dominant glassine trim
      with its silicone coating and contamination retained. Its lack of a clean-broke route does not establish repulpability,
      end-of-waste status or a recycling credit. Require actual liner composition, full as-transferred kg, H2O and
      receiver compatibility; it is not the delivered continuous liner.
    reject: Use the broad industrial discarded-solid identity only for this one whole paper/PSA/siliconized-glassine
      reject, keeping each layer, actual ink and moisture in its complete mass. Separate it from stripped matrix
      and liner-only trim despite shared identity with other industrial solids; require actual disposal/recovery
      acceptance without assumed treatment.
    wash: The industrial-cleaning liquid family is conditional on the actual liquid mixture, tank origin, full chemistry
      and accepting receiver. Weigh whole wet transfer or use measured V*rho(T); measure the H2O fraction independently
      for the water ledger. Suspended/dissolved ink and COD/BOD characterize the stream, not additive overlapping
      masses or direct elementary releases. Retain concentrated waste ink and gel/solid residue separately; no generic
      hazardous classification follows.
    dust_waste: Use the industrial captured-dust Waste identity for this actual individually collected dry cutting/slitting
      dust, with fibre, PSA/silicone/ink contamination, moisture and receiver verified. Full captured mass and any
      internal return remain separate from exported airborne particle bins. No cleaning frequency or capture efficiency
      is prescribed.
    plate_waste: This actual retired photopolymer plate plus its actual backing is one discarded industrial solid
      item; verify polymer/backing/ink contamination, full kg and receiver independently. Preserve original physical
      retirements and retained stock, separate from burden shares by service life; do not use a prepress-origin-only
      waste record.
