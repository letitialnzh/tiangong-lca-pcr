allocation_rules:
  - rule_id: allocation_jobs
    applies_to: "all inventory rows"
    rule: "Use subdivision or justified system expansion first, then an evidenced underlying physical relationship, and only then a justified other relationship such as actual economic values. System expansion requires actual functions and displaced supply; no automatic credit. Separate jobs by direct measurement first. Attribute shared drive, drying, extraction and cleaning from recorded machine time/energy and actual causal drivers, including setup for the job; document why preceding hierarchy steps cannot apply. Keep the unallocated physical mass/water/carbon ledger and environmental burden attribution ledger separate."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_residues
    applies_to: "matrix; liner_waste; reject; dust_waste; ink_residue; wash; core_shipped; box_shipped"
    rule: "No saleable co-product is presumed. Account actual waste treatment without an automatic avoided-production credit. Do not multiply physical outputs by a burden allocation share; packaging is delivered with the reference service, not an independent revenue product. Any genuine co-product needs a reviewed causal allocation basis."
    source_ids:
      - celab-label-terminology-2023
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "convert_labels"
      flow_role: "finished web"
      record_type: "lot weighing"
      raw_fields: "lot; paper/PSA/liner grade; moisture; gross reel mass; core tare; accepted reference-web mass; label count/area; release/print/adhesion tests"
      collection_method: "Weigh accepted rolls on calibrated scales, subtract actual cores and transport packaging; retain liner. Record conditioning and matched acceptance."
      unit: "kg"
      frequency: "every lot"
      temporal_coverage: "complete representative production period"
      site_scope: "converter accepted product"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; tare records; release and print tests"
    - protocol_id: cp_stock
      process_id: "convert_labels"
      flow_role: "labelstock"
      record_type: "receipt and consumption ledger"
      raw_fields: "supplier; lot; supplied laminate net mass; opening/closing stock; returns; paper, PSA and liner composition; dry coat mass; supplier gate and process coverage"
      collection_method: "Weigh supplied webs without core, reconcile receipts and stocks; obtain supplier component mass and silicone-cure/PSA coat/dry/laminate evidence."
      unit: "kg"
      frequency: "every receipt and campaign"
      temporal_coverage: "same complete period"
      site_scope: "selected laminate grade at converter"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier specification; upstream coverage; mass reconciliation"
    - protocol_id: cp_ink
      process_id: "convert_labels"
      flow_role: "ink"
      record_type: "formulation and issue ledger"
      raw_fields: "ink grade/colour; wet issues; returns; stock change; water/solids; ethanol/NH3/other species; coverage; retained dry ink; ink-waste amount"
      collection_method: "Weigh wet ready-to-use black ink, obtain formulation and actual print coverage; track reuse and residual ink, not a literature recipe."
      unit: "kg"
      frequency: "each job and lot"
      temporal_coverage: "same complete period"
      site_scope: "black water-based flexographic press"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "scale; supplier SDS/composition; print acceptance"
    - protocol_id: cp_energy
      process_id: "convert_labels"
      flow_role: "electricity"
      record_type: "submeter"
      raw_fields: "press; dryer; extraction; slitter/rewinder; packing; kWh; job-time; meter voltage; transformer scope; region/year"
      collection_method: "Read calibrated submeters by stage; include attributable idle/setup load; sum once and convert recorded kWh to MJ."
      unit: "MJ"
      frequency: "each job plus period totals"
      temporal_coverage: "same complete period"
      site_scope: "user-side electric converting"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter calibration; bills; allocation record; voltage/provider basis"
    - protocol_id: cp_water
      process_id: "convert_labels"
      flow_role: "water; water_vapour"
      record_type: "weighing and water balance"
      raw_fields: "dilution; washing; metered volume; temperature; measured density; ink water; product moisture; washwater; evaporation; opening/closing water stocks"
      collection_method: "Weigh added tap water or convert actual metered volume with measured density; use independently measured H2O fractions of whole ink residue and washwater, not their total wet kg; close same-period water balance for evaporation with uncertainty."
      unit: "kg"
      frequency: "each dilution/wash and period"
      temporal_coverage: "same complete period"
      site_scope: "converter; no freshwater outfall"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "meter/scale; density measurement; water-balance residual"
    - protocol_id: cp_pack
      process_id: "convert_labels"
      flow_role: "core; box; core_shipped; box_shipped"
      record_type: "packaging ledger"
      raw_fields: "grade; count; weighed unit mass; opening/closing stocks; reuse; purchases; shipped quantity; damaged quantity; carton fibre composition"
      collection_method: "Weigh actual paper cores and corrugated cartons by grade; reconcile full receipts plus opening stocks against full dispatch/return, damage/discard and closing stocks, separately from web mass. Include incoming laminate cores and ink containers as their actual distinct physical transfers; reuse or service allocation never shrinks transferred mass."
      unit: "kg"
      frequency: "each dispatch and stock period"
      temporal_coverage: "same complete period"
      site_scope: "converter packaging"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "tare weights; dispatch records; packaging balance"
    - protocol_id: cp_plate
      process_id: "convert_labels"
      flow_role: "plate; plate_waste"
      record_type: "plate stock and service ledger"
      raw_fields: "plate/backing material; prepared mass; purchase; reuse impressions; replacement; retained/retired mass; jobs served; receiver"
      collection_method: "Weigh prepared and spent plates; retain opening/closing stocks and actual service history; attribute consumed plate burden to served jobs without altering the physical stocks."
      unit: "kg"
      frequency: "each plate and replacement"
      temporal_coverage: "same complete period plus plate service history"
      site_scope: "black-image press plate"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier plate preparation; service records; receiver evidence"
    - protocol_id: cp_waste
      process_id: "convert_labels"
      flow_role: "matrix; liner_waste; reject; wash; ink_residue; dust_waste"
      record_type: "segregated waste weighing"
      raw_fields: "stream id; wet mass; dry fraction; paper/PSA/silicone/ink composition; sampling; collector capture; receiver; carrier; actual treatment; stock change"
      collection_method: "Segregate and weigh each stream; sample washwater and residues; reconcile internal returns before external removal; retain receiver acceptance."
      unit: "kg"
      frequency: "each removal and complete period"
      temporal_coverage: "same complete period"
      site_scope: "converter/offsite handoff"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "weigh tickets; sampling; composition; receiver treatment"
    - protocol_id: cp_air
      process_id: "convert_labels"
      flow_role: "pm25; pmcoarse; pmover10"
      record_type: "size-resolved exhaust and fugitive survey"
      raw_fields: "source; sampling standard/method; measured concentration; actual exhaust volume; temperature; pressure; moisture; size cut; captured dust; duration; uncertainty; detection limits"
      collection_method: "Survey cutting/slitting/rewinding and collectors; sample representative exhaust and substantiate fugitive releases; retain compatible nonoverlapping size fractions; no default factor."
      unit: "kg"
      frequency: "representative campaigns and operating-hour reconciliation"
      temporal_coverage: "same complete period"
      site_scope: "outdoor air release after collection"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "sampling protocol; blank/detection limits; size-cut consistency; collector mass"
    - protocol_id: cp_species
      process_id: "convert_labels"
      flow_role: "ethanol; ammonia"
      record_type: "species mass balance and emission measurement"
      raw_fields: "supplier CAS/fractions; ink/stock input; retained species; liquid-waste species; inventory change; capture; recovery; exhaust and fugitive measurements; feedstock origin"
      collection_method: "Inventory actual chemicals and reconcile each species through product, liquid waste, stocks, recovery and outside-air release; measure where balance cannot close. Add other confirmed species individually."
      unit: "kg"
      frequency: "each formulation/job plus exhaust campaign"
      temporal_coverage: "same complete period"
      site_scope: "converter outside-air release"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "supplier composition; analytical method; CAS; mass balance; uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Divide each actual attributable period exchange by the accepted reference-web mass of the same period. finished_labels is 1 kg on this basis. Never divide by gross roll mass including cores."
      inputs:
        - cp_output
        - cp_stock
        - cp_ink
        - cp_energy
        - cp_water
        - cp_pack
        - cp_plate
        - cp_waste
        - cp_air
        - cp_species
      output: "Exchange per 1 kg reference flow"
      source_ids:
        - celab-label-terminology-2023
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "1 kWh = 3.6 MJ; conversion from the verified Units of energy, not a printing emission factor"
      inputs:
        - cp_energy
      output: "Electrical MJ per 1 kg reference flow"
      source_ids: []
    - id: physical_balance
      applies_to: "all inventory rows"
      rule: "Reconcile incoming laminate/ink/water with accepted web, separate residues, washwater, actual air losses and stock changes before burden attribution. Track facestock, adhesive, liner, ink solids, water and chemical carbon separately; no universal loss factor."
      inputs:
        - cp_stock
        - cp_ink
        - cp_water
        - cp_output
        - cp_waste
        - cp_air
        - cp_species
      output: "Unallocated physical balances and residual uncertainty"
      source_ids:
        - epa-printing-ap42
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: quality_scope
      applies_to: "all inventory rows"
      requirement: "One complete representative period/site and one declared laminate grade; report startup, downtime, stocks and uncertainty. Supplier quantities, bounds and defaults are not inferred from flow identity."
      evidence: "Meter/scale and supplier records; reconciled ledgers"
    - id: quality_release
      applies_to: "finished_labels"
      requirement: "Report actual label area/count and matrix layout, delivered liner fraction and mass, release/adhesion/print acceptance, conditioning and declared service. Mass alone does not establish equivalent labelling function."
      evidence: "cp_output; cp_stock"
    - id: quality_missing
      applies_to: "all inventory rows"
      requirement: "Unresolved UUID, provider mismatch, absent composition/receiver or unsupported measurement is explicit incomplete evidence. Survey actual lubricants, replacement blades/dies, filters/wipes, cleaners and separate spent streams; prove absence or add actual atomic exchanges before completion. Add actual missing atomic inputs/emissions; absence or a zero needs evidence. No factory data have been collected by this PCR."
      evidence: "Collection protocols and dataset completeness record"
validation_rules:
  - rule_id: validation_reference
    applies_to: "finished_labels"
    rule: "Require exactly one finished reference output, 1 kg including liner but excluding core/carton; all period amounts and aggregation share this denominator. Confirm broad paper-label identity and narrow physical route separately from supplier quantity compatibility."
    source_ids:
      - herma-labelstock-2026
  - rule_id: validation_waste
    applies_to: "matrix; liner_waste; reject; wash; dust_waste"
    rule: "Require separate mass/composition/destination records. No duplication of continuous shipped liner as manufacturing waste, no clean-paper proxy for adhesive matrix, no elementary water discharge at offsite handoff."
    source_ids:
      - celab-label-terminology-2023
  - rule_id: validation_air
    applies_to: "pm25; pmcoarse; pmover10; ethanol; ammonia; water_vapour"
    rule: "Verify particle bins are disjoint, emissions are after capture and outside-air/non-long-term; verify each chemical CAS, origin and mass basis. Do not equate VOC carbon reporting with compound mass, amine with NH3, soil with air, or unknown quantity with zero."
    source_ids:
      - jrc-paper-bref-2015
      - epa-printing-ap42
  - rule_id: validation_coverage
    applies_to: "all inventory rows"
    rule: "Methodological review and actual data completeness remain independent. Incompatible grade, printing chemistry, heat/oxidizer or onsite coating route is outside this method until reviewed. Publish no dataset without closing required provider and physical balances."
    source_ids:
      - herma-labelstock-2026
      - epa-printing-ap42
published_dataset_profile:
  dataset_role: "foreground_production_dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Declared factory-gate paper-label converting for the specified physical laminate/printing/delivery route"
  excluded_use: "Whole CPC32197 default; other excluded labels; finished packaging product, customer labelling, downstream liner disposal; complete cradle-to-grave claims"
  required_metadata: "Reference qualifiers; supplier process gates; all protocols; stock balances; stage meters; transport and treatment links; uncertainty; allocation; geography/year"
  required_quality_disclosure: "Future collection versus measured data; actual provider compatibility; unresolved flow identities/ranges; emission and waste coverage; independent review state"
  update_trigger: "Paper/liner/PSA grade, silicone cure, ink formulation, drying route/voltage, cutting layout, waste destination, supplier dataset or reference conditioning changes"
data_sources:
  - id: "herma-labelstock-2026"
    type: "handbook"
    reference: "https://shop.material.herma.com/product-details/HH12075/"
    used_for: "Producer-specific construction and die-cut capability; no quantities or generic performance defaults."
  - id: "herma-acrylic-dispersion"
    type: "handbook"
    reference: "https://www.herma.com/material/products/adhesives/migration-safety/"
    used_for: "Acrylic dispersion adhesive identity of the real product example only; no migration approval asserted for a final printed package."
  - id: "celab-label-terminology-2023"
    type: "handbook"
    reference: "https://celab-europe.org/celab-europe-regulatory-summary-2023/"
    used_for: "Physical laminate, matrix and liner boundaries. Dated legal statements and recycling guarantees are not adopted."
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Paper cutting can generate dust. Papermill broke recycling does not establish repulpability of adhesive matrix; no emission factor."
  - id: "epa-printing-ap42"
    type: "official_guidance"
    reference: "https://www.epa.gov/sites/default/files/2020-10/documents/c4s09-1.pdf"
    used_for: "Historical process/emission-point and balance method only. No ink recipe, solvent percentage, retained-solvent or per-capita factor is adopted; use actual formulation and release."
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf#page=63"
    used_for: "General multifunctionality hierarchy; actual physical output ledger separate; no claim of full PEF conformity."
