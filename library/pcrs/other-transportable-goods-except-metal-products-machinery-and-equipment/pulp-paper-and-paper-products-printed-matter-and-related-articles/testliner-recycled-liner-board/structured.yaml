system_boundary:
  rules:
    - rule_id: boundary_recovery
      applies_to: "accepted recovered paper"
      rule: "Do not infer zero prior burden from a waste label, recycled content or payment. Declare the actual waste/product handover, supplier and operations already completed; retain collection, sorting, baling and transport either upstream or within foreground once. Prior product-life allocation requires an explicit governing method and evidence; absent proof remains a gap."
      source_ids:
        - jrc-ppb-2015
        - eu-pef-2021
    - rule_id: boundary_mill
      applies_to: "testliner mill"
      rule: "Include receiving and actual mill sorting, pulping, ragger/cleaner/coarse and fine screening, conditional fractionation/dispersing/refining, stock preparation, forming, pressing, drying, actual starch sizing and after-drying, reeling/cutting/dispatch and associated utilities/effluent treatment. No default machine arrangement or recipe follows from the historical example flowsheet."
      source_ids:
        - jrc-ppb-2015
        - fefco-paper-production
    - rule_id: boundary_deinking
      applies_to: "fibre preparation"
      rule: "Confirm absence of flotation/wash deinking and bleaching using process flow, equipment/chemical records and every ply furnish. Dispersing ink specks is not deinking. White-top deinked recycled products are real counterexamples; this PCR excludes them and does not generalize absence of deinking to CPC 32135."
      source_ids:
        - jrc-ppb-2015
        - fefco-paper-production
        - smurfit-wt2000
    - rule_id: boundary_links
      applies_to: "physical internal links"
      rule: "Retain the stage graph, dry-fibre/solids, water and carbon balances before burden allocation. Match both ends of stock, white-water, broke, steam/condensate and captured-biogas/dust links on period, state and quantity, with storage changes. Internal reuse is neither a second purchase nor an external release or credit."
      source_ids:
        - jrc-ppb-2015
    - rule_id: boundary_outlets
      applies_to: "utilities and final discharges"
      rule: "Include actual onsite gas boilers and water/effluent treatment; purchased energy includes its supply background once. Treat external wastewater as a treatment handover; direct elementary outlets are only actual mill releases after onsite control. Preserve size-resolved cutting/rewinding/yard dust, boiler species and biological carbon where present."
      source_ids:
        - jrc-ppb-2015
        - epa-gas-combustion
    - rule_id: boundary_complete
      applies_to: "site-specific inventory"
      rule: "Each listed card is one screening exchange with no presumed positive amount. Establish actual presence/absence; add every other real chemical, fuel, water source, emission, transport service, waste and dispatch material as a separate audited atomic row. Inspect actual paper-machine wires/felts, hydraulic/lubricating fluids, cleaning aids, maintenance replacements and utility/treatment stocks, separating installed capital from actual consumed replacements or losses. Screen actual boiler non-methane VOCs and treatment gases with species-specific evidence; add actual external streams without prescribing positive amounts or default identities. Do not claim a complete site dataset with unexamined aids or unresolved reference bases."
      source_ids:
        - jrc-ppb-2015
boundary_abstraction:
  declared_starting_condition: "Recovered old corrugated containers received as documented waste or sorted secondary product, with actual prior recovery and transport state"
  starting_condition_role: "Foreground gate-to-gate mill start; upstream recovery boundary must be represented and disclosed"
  product_classification_scope: "CPC 3.0:32135; narrower"
  recursive_input_rule: "Internal broke stays an internal link. Externally purchased recovered paper has its own actual state and upstream dataset; do not recursively count the prior testliner life without a governing recycling method or suppress recovery burdens."
  upstream_dataset_requirement: "Accepted-state compatible recovery/sorting/transport; actual electricity/heat/fuel, materials and water supply; receiver-specific external treatment; disclose missing reference bases"
  disclosure: "Physical and allocation ledgers; supplier/legal state; previous operations; actual non-deinking and every ply; onsite/offsite utilities/treatment; exclusions and gaps"
