allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared mill burdens"
    rule: "First isolate directly attributable stages/meters and product campaigns. For remaining shared burdens use a demonstrated causal physical relationship; economic allocation is a disclosed sensitivity-supported last resort. Record coproduct function/status, method, shares and denominator. Waste treatment remains a burden; a revenue receipt alone does not establish a coproduct."
    source_ids:
      - eu-pef-2021
  - rule_id: allocation_physical
    applies_to: "physical and burden ledgers"
    rule: "Keep actual coproduct/waste masses unchanged in the physical ledger; partition environmental burdens in a separate allocation ledger. Do not multiply physical coproduct outputs by the paper burden share. Internal broke/white-water/biogas loops cancel internally after stock reconciliation and do not receive substitution benefits."
    source_ids:
      - eu-pef-2021
      - jrc-ppb-2015
  - rule_id: allocation_no_credit
    applies_to: "recovery and exported residues"
    rule: "This attributional mill dataset contains no automatic virgin-fibre, fuel, electricity, landfill or recovered-material substitution credit. Any separately requested consequential/system-expanded scenario requires an independently defined counterfactual, receiver/product equivalence and nonduplicated burdens; keep it outside this reference inventory."
    source_ids:
      - eu-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "testliner_mill"
      flow_role: "reference output"
      record_type: "scale and lot quality"
      raw_fields: "lot; accepted net mass Q; moisture wet basis; grammage; ply/fibre origin; product form; rejected output; core/wrap tare"
      collection_method: "Weigh calibrated net accepted reels/sheets and sample moisture by a validated oven-dry method to constant mass; retain conditioning and loss-of-solids limitations. Measure grammage by calibrated area/mass records; verify ply source and absent deinking."
      unit: "kg; g/m2; moisture fraction"
      frequency: "each lot and period reconciliation"
      temporal_coverage: "Same declared complete reporting period"
      site_scope: "Declared mill, stages, supplier/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceable lots; method/QA; uncertainty and coverage"
    - protocol_id: cp_material
      process_id: "testliner_mill"
      flow_role: "material/chemical/packing"
      record_type: "delivery and consumption balance"
      raw_fields: "batch; material CAS/grade; legal status; supplier; gross/tare; moisture; purity/active solids; opening/closing stocks; purchase; consumption; upstream operations"
      collection_method: "Reconcile weighed deliveries, opening/closing stocks and issue records to net use by stage/campaign. Keep product/waste status proof and documented origin; retain solution carrier water separately from dry active ingredient, without duplicating purchased solution mass."
      unit: "kg"
      frequency: "each delivery/issue; monthly balance"
      temporal_coverage: "Same declared complete reporting period"
      site_scope: "Declared mill, stages, supplier/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceable lots; method/QA; uncertainty and coverage"
    - protocol_id: cp_utility
      process_id: "testliner_mill"
      flow_role: "electricity/steam/gas"
      record_type: "meter and supplier quantity definition"
      raw_fields: "meter; voltage; grid; supplier reference unit/basis; reading intervals; steam T/P/quality; inlet/return enthalpy; condensate mass; gas T/P/composition/Z; heating-value basis"
      collection_method: "Read calibrated supply/stage meters and reconcile bills/generation. Convert kWh with 3.6 MJ/kWh. For steam retain enthalpy and condensate balance separately from supplier GCV/MJ definition; no net-heat assumption. For gas use supplier-compatible reference conditions and documented gas-state correction, never an arbitrary mass coefficient."
      unit: "MJ; m3; original meter units"
      frequency: "continuous/period readings"
      temporal_coverage: "Same declared complete reporting period"
      site_scope: "Declared mill, stages, supplier/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceable lots; method/QA; uncertainty and coverage"
    - protocol_id: cp_water
      process_id: "testliner_mill"
      flow_role: "abstraction/effluent/vapour"
      record_type: "meters and outlet laboratory"
      raw_fields: "source/receiver; whole-effluent volume and wet mass intervals; actual mixture density/state; independent H2O mass fraction; water density at discharge temperature; inlet/outlet stocks; hood flow/humidity; COD oxygen equivalent; TN as N; TP as P; TSS dry mass; detection limits; sample timestamps; external treatment"
      collection_method: "Meter abstraction/supply and final discharge independently; sample matched final outlets using flow-proportional composite samples or justified alternatives, laboratory method/QA and actual flow. Reconcile evaporated water with measured humidity/airflow or water balance uncertainty. Keep onsite inflow/recirculation internal and external treatment handover distinct. For the external Waste liquid Mass/kg locator, retain original volume and apply actual mixture density/temperature or direct weighing; collect water fraction separately and never substitute liquid mass for water or dry pollutant load. For direct water_return additionally collect matched whole final-effluent volume or wet mass, actual mixture density and discharge temperature/state; derive H2O mass using an independently measured water mass fraction or verified component balance, then divide by documented water density at that temperature for H2O-component volume. Preserve bulk effluent volume separately for pollutant-load integration. Verify this component-volume convention against the selected flow and assessment method quantity definition; unknown composition, density or convention remains pending without defaults."
      unit: "m3; kg; original lab concentration units"
      frequency: "continuous flow; representative composites and all abnormal intervals"
      temporal_coverage: "Same declared complete reporting period"
      site_scope: "Declared mill, stages, supplier/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceable lots; method/QA; uncertainty and coverage"
    - protocol_id: cp_air
      process_id: "testliner_mill"
      flow_role: "outdoor gas/particle"
      record_type: "source test and operating records"
      raw_fields: "outlet; species/CAS; fossil/biogenic origin; concentration; gas flow; normal T/P; oxygen; wet/dry; filterable/condensable PM; aerodynamic cut; time; control/capture; uncertainty"
      collection_method: "Measure matched pollutant concentration and discharged gas flow with compatible reference conditions and operating coverage. Inventory real released mass including abnormal/fugitive intervals; retain NOx equivalence proof and disjoint PM fractions. Document equipment-specific surrogate/factor applicability when direct measurement is unavailable; AP42 averages are not site defaults or permit limits."
      unit: "kg; original concentration/flow units"
      frequency: "representative source tests and continuous activity; abnormal events"
      temporal_coverage: "Same declared complete reporting period"
      site_scope: "Declared mill, stages, supplier/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceable lots; method/QA; uncertainty and coverage"
    - protocol_id: cp_waste
      process_id: "testliner_mill"
      flow_role: "external reject/sludge/broke"
      record_type: "weighing and transfer record"
      raw_fields: "origin stage; one stream identity; wet mass; dry solids; fibre/plastic/metal/mineral composition; carbon; treatment; legal status; receiver; stock change"
      collection_method: "Weigh each external waste consignment with representative solids/composition samples and transfer/receiver records. Separate primary/biological sludge and nonmatching rejects; internal returns are not external wastes. Resolve actual recipient treatment and recoverability without automatic credit."
      unit: "kg"
      frequency: "each shipment; period reconciliation"
      temporal_coverage: "Same declared complete reporting period"
      site_scope: "Declared mill, stages, supplier/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceable lots; method/QA; uncertainty and coverage"
    - protocol_id: cp_balance
      process_id: "testliner_mill"
      flow_role: "internal physical balances"
      record_type: "paired stage logs"
      raw_fields: "link id; sender/receiver; period; quantity; state; dry solids; carbon/water; storage; measured residual; uncertainty; allocation ledger"
      collection_method: "Reconcile paired links, stocks and measured losses before allocation. Keep physical outputs unchanged; use measured causal drivers for shared environmental burdens and record allocation sums/sensitivity. Document residual uncertainty rather than impose a made-up tolerance."
      unit: "kg; m3; MJ"
      frequency: "same reporting period and campaigns"
      temporal_coverage: "Same declared complete reporting period"
      site_scope: "Declared mill, stages, supplier/receiver"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; traceable lots; method/QA; uncertainty and coverage"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Exchange per 1 kg reference flow = actual compatible period exchange / accepted net paper Q kg; the paper denominator remains as sold. Physical coproduct amounts remain measured; only the separate burden ledger receives allocation shares."
      inputs:
        - cp_output
        - cp_material
        - cp_utility
        - cp_water
        - cp_air
        - cp_waste
      output: "Normalized exchange"
      source_ids:
        - jrc-ppb-2015
    - id: outlet_load
      applies_to: "final air/water outlets"
      rule: "Integrate matched concentration × discharged volume over observed intervals, retaining unit conversion and actual normal/wet/dry/oxygen bases. Keep COD oxygen equivalent, TN as N and TP as P; do not invent a total-N or NOx equivalence."
      inputs:
        - cp_air
        - cp_water
      output: "Actual period released load"
      source_ids:
        - jrc-ppb-2015
    - id: balance_check
      applies_to: "stock and internal links"
      rule: "Dry solids = measured wet mass × (1 − measured wet-basis moisture); reconcile dry fibre/additives/losses and separate water/carbon ledgers using stock changes and uncertainty. No assumed yield, carbon content or closure tolerance."
      inputs:
        - cp_output
        - cp_material
        - cp_balance
        - cp_water
        - cp_air
        - cp_waste
      output: "Reconciled physical balances"
      source_ids:
        - jrc-ppb-2015
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: dq_identity
      applies_to: "all exchanges"
      requirement: "Check name, CAS, route, medium/submedium, origin, reference property/unit and raw metadata consistency. Retain explicit classifications/quantity-basis defects; UUID success does not cure them."
      evidence: "cp_material; cp_air; cp_water; supplier evidence"
    - id: dq_primary
      applies_to: "amounts and applicability"
      requirement: "Representative actual measurements, traceable period and justified estimates only; unknown differs from zero. Historical EU/mill examples are not universal recipes or amount defaults."
      evidence: "all collection protocols"
    - id: dq_background
      applies_to: "upstream and treatment links"
      requirement: "Require accepted raw-material state, previous recovery operations, actual utility route/reference basis and receiver-specific waste treatment. Disclose missing links and quantify sensitivity when support becomes available."
      evidence: "cp_material; cp_utility; cp_waste"
    - id: dq_balances
      applies_to: "physical and allocated inventory"
      requirement: "Retain original measured physical accounts and a separate burden allocation ledger; flag nonclosing residuals and overlapping analytical/emission definitions."
      evidence: "cp_balance"
validation_rules:
  - rule_id: validation_identity
    applies_to: "reference and applicability"
    rule: "Require exactly one final finished-product reference output, 1 kg net paper at actual as-sold moisture. Confirm natural-brown/uncoated grade, 100% externally recovered dry-fibre origin, no deinking/bleaching, actual stock route and every qualifier. An unresolved reference UUID blocks authored delivery."
    source_ids:
      - jrc-ppb-2015
      - fefco-paper-production
  - rule_id: validation_measurement
    applies_to: "all rows"
    rule: "EN/ZH must share the same reference mass, normalization and collection aggregation. Require property/unit compatibility, calibrated records, moisture/solids basis and matched period. Gas volume conditions, steam supplier heat basis and NOx equivalence remain pending until proven; identity resolution is not a complete background dataset."
    source_ids:
      - jrc-ppb-2015
  - rule_id: validation_balances
    applies_to: "physical loops and final releases"
    rule: "Reconcile internal links and stock changes before normalization/allocation; confirm external reject/sludge composition and receivers. Do not duplicate external treatment loads, water abstraction and supply, internally captured dust/biogas, cumulative PM bins, COD/BOD/TOC or nutrient totals/constituents. Retain biogenic CO2."
    source_ids:
      - jrc-ppb-2015
  - rule_id: validation_completeness
    applies_to: "completed foreground package"
    rule: "Missing exchange identity, route/amount, analytical or supplier reference basis, or unexplained balance residual remains a specific gap, never zero. Record performed/skipped checks and uncertainty. Measured non-occurrence differs from missing data; this method does not establish scientific review, legal classification or TIDAS schema approval."
    source_ids:
      - jrc-ppb-2015
published_dataset_profile:
  dataset_role: "Attributed foreground mill production unit for the bounded testliner grade"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Route/grade-compatible liner input for downstream corrugator models after unresolved dataset evidence is supplied"
  excluded_use: "Unqualified general CPC coverage; white/deinked/mixed-virgin/specialty routes; complete boxes; credit scenarios; a generic measured plant recipe"
  required_metadata: "Every reference qualifier; physical boundary; upstream recovery allocation; complete raw records and normalized inventories; period; source/background references; method and allocation ledger"
  required_quality_disclosure: "Confirmed/conditional/missing identities; reference-basis compatibility; omitted scope; measurement uncertainty; residuals; checks performed/skipped; remaining evidence gaps"
  update_trigger: "Changed fibre grade/status or ply; deinking/bleaching/sizing route; utility supply; treatment/receiver; new reliable evidence or resolved identity/basis debt"
data_sources:
  - id: "jrc-ppb-2015"
    type: "official_guidance"
    reference: "JRC (2015), Best Available Techniques Reference Document for the Production of Pulp, Paper and Board. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Sections 6.1.1–6.1.2, Figure 6.1 (printed pp.550–555), 6.2.2 water/wastes; 7.1 forming/drying/sizing, 7.1.4 broke (printed p.665/PDF p.703), 7.1.10 cutting dust (printed p.670/PDF p.708); 2.2.2 monitoring. Process scope and measurement support only; historical examples/BAT quantities are not defaults."
  - id: "fefco-paper-production"
    type: "handbook"
    reference: "FEFCO, European Database for Corrugated Board Life Cycle Studies: Paper production process. https://www.fefco.org/lca/dscription-of-production-system/paper-production"
    used_for: "Recovered-container slushing/cleaning; normal absence of deinking; multi-ply testliner, starch sizing and reel dispatch. Industry description only, no generic numerical recipe or automatic recycling allocation adopted."
  - id: "smurfit-wt2000"
    type: "handbook"
    reference: "Smurfit Kappa, Testliner WT2000. https://www.smurfitkappa.com/us/products-and-services/containerboard/testliner-wt2000"
    used_for: "Specific white-top recycled product with deinked top ply; counterevidence for a universal non-deinking claim. Excluded here; location of deinking and amounts are not inferred."
  - id: "epa-gas-combustion"
    type: "official_guidance"
    reference: "US EPA, AP-42 §1.4 Natural Gas Combustion (October 2026, retained disclaimer edition with 10/26 page footer). https://www.epa.gov/sites/default/files/2020-09/documents/1.4_natural_gas_combustion.pdf"
    used_for: "Actual gas-boiler firing/emission screening and limits of factor use, pp.1.4-1–1.4-3. Not applicable to paper dust, biogas or non-gas boilers; no default factors or fuel composition adopted."
  - id: "eu-pef-2021"
    type: "official_guidance"
    reference: "European Commission (2021), Recommendation (EU) 2021/2279, Annex I §4.5, pp.63–64. https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Allocation hierarchy and evidence requirements for substitution. This PCR chooses an attributional no-credit foreground inventory; it does not adopt the full PEF/CFF recycling formula or claim PEF compliance."
