review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  scientific_review: "independent_controller_review_with_explicit_identity_and_quantity_debts"
  mapping_review:
    proposed_relation: "narrower"
    reason: "Natural-brown uncoated non-deinked stock with all externally supplied fibre recovered; excludes white-top deinked, virgin-reinforced, coloured/coated/specialty and purchased-pulp-only variants."
    acceptance: "see_canonical_mapping"
  inventory_contract:
    atomic_flows: "v1"
    localized_flow_names: "tiangong_zh_v1"
  unresolved_flow_rows:
    - row_id: "tss"
      reason: "Freshwater TSS identity remains unresolved: actual suspended-solids candidate is water-unspecified; dissolved-solids freshwater records are physically different and not adopted."
  unresolved_quantity_and_background:
    - row_id: "steam"
      reason: "GCV/MJ reference does not prove net delivered steam heat. Require supplier reference quantity, actual pressure/temperature/quality, condensate and enthalpy compatibility; no benchmark adopted."
    - row_id: "natural_gas"
      reason: "Physical gaseous pipeline identity is conditional; actual meter T/P/composition/Z and supplier/background reference m3 compatibility remain site-specific. Secondary mass coefficient is not density."
    - row_id: "nox"
      reason: "NOx Mass/kg record does not establish NO2-equivalent quantity. Monitoring, LCI and LCIA equivalence must be proven; exclude N2O and duplicate NO/NO2."
    - row_id: "wastewater"
      reason: "Waste liquid Mass/kg physical locator requires actual liquid gate state, whole-mixture density/temperature or weighing, water fraction, constituent loads and receiver-specific treatment; original m3 collection retained, no 1000 kg/m3 default."
  metadata_qualifications:
    - row_id: "electricity"
      reason: "Raw supply location CN and 1–35 kV grid-consumption mix are source metadata, not a foreground country default. Actual site/year/provider/voltage/mix and background reference compatibility remain pending."
    - row_id: "sorting_reject; pulper_reject; screen_reject; captured_dust"
      reason: "Same broad industrial Waste solid Mass/kg locator, but four separate actual sources, compositions, moisture/phase, measured quantities and receivers. No merged reject or automatic treatment, legal status, credit or matched background."
    - row_id: "steel_wire_waste"
      reason: "Broad Scrap steel Waste/Mass/kg with empty treatment route conditionally covers actual segregated steel bale wire; verify alloy/coating/contamination, waste state and receiver. Wafer/formed-welded specific alternatives stay rejected."
    - row_id: cod
      reason: Freshwater COD direct record has no official Chinese baseName; canonical English name is retained with explicitly nonofficial Chinese explanatory text, not an invented official localization.
    - row_id: "pe_wrap"
      reason: "Physical PE film name/CAS/comment are compatible, but source CPC baggage classification is inconsistent; supplier/grade and classification clarification pending."
    - row_id: "recovered_product"
      reason: "Product-flow type and sorted recycled raw-material description are compatible with the documented sorted-product subset, but point-of-generation waste mix wording does not establish product/end-of-waste legal status; require proof."
    - row_id: "modified_starch"
      reason: "Industrial wet-process qualifiers versus food-use general comment; supplier modification/grade and background compatibility must be demonstrated, not assumed."
    - row_id: "primary_sludge"
      reason: "Broad paper-production sludge identity conditionally covers primary fibre sludge only with measured composition, wet/dry basis and receiving treatment; no recipe or treatment inferred."
    - row_id: "bio_sludge"
      reason: "Broad paper-production sludge identity independently constrained to excess biological sludge with measured biomass/fibre/chemical composition, wet/dry basis and receiver; not internal return sludge."
  evidence_limitations:
    - "Independent original-query audit found the adopted liquid-water return absent from its two bound author responses; fresh water-only search and state-100 direct independently supply an actual witness, without rewriting old evidence."
    - "Retained EPA PDF has 10/26 page footers and verified source registration October 2026; canonical source label corrected from July 1998. BREF selected fragments use explicit LF lines with no form-feed drift; printed/PDF page locators independently checked."
    - "Historical BREF and individual producer observations define bounded process evidence only; no numeric defaults, generic recipes, independent scientific approval or measured factory dataset."
    - "Actual absence of deinking must be established for every ply; white-top producer evidence prevents a category-wide absence claim."
    - "Upstream recovery status/operations, allocation and waste receivers require concrete foreground/supplier evidence; no unproved zero burden or substitution credit."
