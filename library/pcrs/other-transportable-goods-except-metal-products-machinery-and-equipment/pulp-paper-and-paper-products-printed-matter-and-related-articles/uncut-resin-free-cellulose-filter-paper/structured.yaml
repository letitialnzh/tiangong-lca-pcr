allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "allocation_subdivide: First avoid allocation using batches, grade-specific records and measured machine-time/submeters; retain an independent unallocated physical ledger for materials, water, dry solids and carbon. Do not mechanically multiply physical paper, broke, sludge or condensate outputs by an environmental-burden allocation share. Both endpoints of an internal stage transfer must have the same physical amount."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "allocation_shared: At a multi-grade mill attribute actual stock preparation, porosity-preserving dewatering/drying, grade changes and cleaning before allocating inseparable utilities using evidenced causal drivers such as metered electricity/heat or occupancy time. Mass or economic allocation requires explanation of causal limits, actual period/prices and sensitivity; do not apply one tonne-of-paper coefficient to all speciality grades. This allocation order is an explicit PCR method choice; BREF supports only the factual grade-change and water/energy differences [jrc-pulp-paper-bref-2015, 7.1.11.4]."
    source_ids: []
  - rule_id: allocation_rule_3
    applies_to: "foreground_burden_allocation"
    rule: "allocation_residuals: Link wastes to actual receiving treatment without automatic credits from sale or a co-product label. For a usable sold co-product, first identify it and retain its full physical yield, then decide appropriate allocation or independently reviewed substitution; apply no unsupported avoided-emission credit in the baseline inventory. Count reuse and releases once."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "filter_mill"
      flow_role: "finished_filter"
      record_type: "foreground_record"
      raw_fields: "batch; grade; reel ID; net paper mass Q; packaging/core tare; moisture; grammage/caliper/porosity/retention-rate/ash/strength tests and conditions; rejects/stocks"
      collection_method: "Calibrated weighing with reel-specific tare, traceable sales/stocks and actual customer grade tests retaining pressure and particle definitions. First retain unallocated physical period totals. Specific aggregation: net accepted paper mass Q of the same period at actual moisture, excluding packaging; then divide by cp_mass Q to report per 1 kg reference flow."
      unit: "kg"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
    - protocol_id: cp_fibre
      process_id: "filter_mill"
      flow_role: "wood_pulp; cotton_pulp"
      record_type: "foreground_record"
      raw_fields: "each pulp supplier; purification/bleaching route; grade; batch; net received wet mass; solids; stocks; internal broke"
      collection_method: "Weigh each pulp separately, reconcile receipt/issues and representative moisture assays, obtain supplier upstream reference basis. First retain unallocated physical period totals. Specific aggregation: attributable period quantity of each external pulp / Q; internal broke cancels separately; this is the single normalization to per 1 kg reference flow."
      unit: "kg"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
    - protocol_id: cp_energy
      process_id: "filter_mill"
      flow_role: "electricity"
      record_type: "foreground_record"
      raw_fields: "stage electricity meters; inlet voltage; load/time; changeover/downtime; shared driver; supplier region/period"
      collection_method: "Calibrated meters and supplier bills, reconcile stage meters to mill total and attribute shared grade loads by evidenced driver. First retain unallocated physical period totals. Specific aggregation: attributable purchased electricity / Q; unit-group conversion of kWh to MJ only; this is the single normalization to per 1 kg reference flow."
      unit: "kWh; MJ"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
    - protocol_id: cp_steam
      process_id: "filter_mill"
      flow_role: "steam; condensate_return"
      record_type: "foreground_record"
      raw_fields: "inlet pressure/temperature/dryness; steam mass flow; returned-condensate mass/temperature; vents/leaks; stocks; supplier pressure and mass/energy reference basis"
      collection_method: "Calibrated inlet/return meters, matched-period thermodynamic states and pipe losses reconciled to supplier invoice; missing supplier definition leaves quantity link pending. First retain unallocated physical period totals. Specific aggregation: each actual external steam/condensate mass separately / Q; retain separate unallocated enthalpy balance; this is the single normalization to per 1 kg reference flow."
      unit: "kg; MJ"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
    - protocol_id: cp_water
      process_id: "filter_mill"
      flow_role: "process_water; river_water; groundwater; water_air"
      record_type: "foreground_record"
      raw_fields: "purchased/abstracted water source; calibrated meters; density/temperature; white-water recycle; cleaning/cooling; actual H2O fractions; recovered condensate; moisture in solids; evaporation; stock change"
      collection_method: "Meter separate sources, reconcile environmental/technosphere boundaries, use actual density and collect moisture/evaporation physical basis and uncertainty. First retain unallocated physical period totals. Specific aggregation: each external water quantity / Q; internal circulation recorded separately without duplicate external exchanges; this is the single normalization to per 1 kg reference flow."
      unit: "kg; m3"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
    - protocol_id: cp_chemical
      process_id: "filter_mill"
      flow_role: "cleaning_naoh; peroxide"
      record_type: "foreground_record"
      raw_fields: "each commercial name/composition/CAS; supplier; concentration; wet mass; active content; receipts/issues/stocks; cleaning/changeover use; disposal"
      collection_method: "Reconcile purchases, weighing/dosing logs and safety/quality certificates for each substance; include a specific solution only with actual use evidence, add other substances separately. First retain unallocated physical period totals. Specific aggregation: actual consumed mass of each commercial solution / Q; avoid duplicated active/solvent mass; this is the single normalization to per 1 kg reference flow."
      unit: "kg"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
    - protocol_id: cp_pack
      process_id: "filter_mill"
      flow_role: "wrap; film; core"
      record_type: "foreground_record"
      raw_fields: "net mass of each packaging item; grade; core specification; new/returned receipts; opening/closing stocks; dispatch/return/internal reuse/damage/loss/discard; actual unit mass; actual cycles; dispatched amounts; waste"
      collection_method: "Weigh each component, reconcile stocks/despatch and link reusable-item burdens by real use cycles; do not divide dispatched physical mass by an assumed lifetime. First retain unallocated physical period totals. Specific aggregation: actual consumed quantity of each component / Q; retain complete physical dispatch ledger; this is the single normalization to per 1 kg reference flow."
      unit: "kg"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
    - protocol_id: cp_waste
      process_id: "filter_mill"
      flow_role: "screen_rejects; primary_sludge; biosludge; collected_dust; discarded_broke"
      record_type: "foreground_record"
      raw_fields: "each exported stream; source stage; net wet mass; dry fraction; composition/contamination; receiver/route/acceptance; internal recovery"
      collection_method: "Calibrated stream-specific weighing and transfer tickets, separate sludge/reject sampling, distinguish captured dust, airborne release and internal return. First retain unallocated physical period totals. Specific aggregation: actual exported mass of each stream / Q; no waste output without evidence of crossing the boundary; this is the single normalization to per 1 kg reference flow."
      unit: "kg"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
    - protocol_id: cp_effluent
      process_id: "filter_mill"
      flow_role: "exported_wastewater; water_fresh"
      record_type: "foreground_record"
      raw_fields: "flow/sampling interval; actual transfer/outfall; pretreatment; receiver; temperature/state; measured density; wet mass; H2O fraction; analysed loads; stocks; uncovered periods"
      collection_method: "Calibrated flow meters and representative flow-matched composite sampling; separate on-site/external-treatment branches and reconcile receiver dataset. First retain unallocated physical period totals. Specific aggregation: each exported whole-liquid wet mass and final freshwater H2O-component volume separately / Q; count the same water once; this is the single normalization to per 1 kg reference flow."
      unit: "kg; m3"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
    - protocol_id: cp_species
      process_id: "filter_mill"
      flow_role: "ammonium; nitrate; phosphate; toc"
      record_type: "foreground_record"
      raw_fields: "each species concentration/basis; matched-interval water volume; assay method/limits/non-detect; N/P/C mass definitions; other known chemical species; COD/BOD/TSS/TN/TP/AOX indicators"
      collection_method: "Use matched final-outfall flows/assays to calculate species loads; document molar-mass source and stoichiometry for conversions. Keep COD and other aggregate tests as separate QA indicators, never fabricated speciation. First retain unallocated physical period totals. Specific aggregation: sum interval-specific loads / Q; avoid double counting resolved species with carbon/nitrogen/phosphorus aggregates; this is the single normalization to per 1 kg reference flow."
      unit: "mg/l; kg; m3"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
    - protocol_id: cp_air
      process_id: "filter_mill"
      flow_role: "pm25; pm2510; pmover10"
      record_type: "foreground_record"
      raw_fields: "exhaust/fugitive source; sampling position; temperature/humidity/pressure and standard/actual state; wet/dry gas basis; flow/duration; disjoint size fractions; collected dust; operation; uncertainty"
      collection_method: "Inspect actual dry reeling/trim and dryer exhaust, measure size-specific residual outdoor release with concentration/airflow at the same gas state; no universal cutting factor. First retain unallocated physical period totals. Specific aggregation: actual release of each disjoint particle fraction / Q; collected dust is not added as airborne release; this is the single normalization to per 1 kg reference flow."
      unit: "kg; mg/m3; m3"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
    - protocol_id: cp_bio
      process_id: "filter_mill"
      flow_role: "co2_bio; ch4_bio; n2o"
      record_type: "foreground_record"
      raw_fields: "treatment route; C/N origin/composition; influent/effluent/sludge; measured gas/dissolved gas; capture/oxidation; method applicability/uncertainty"
      collection_method: "Actual gas measurements or evidenced site species/C/N-conversion method; no unverified COD-to-CO2 or default methane factor. First retain unallocated physical period totals. Specific aggregation: actual release load of each gas / Q; distinguish biogenic/fossil carbon; this is the single normalization to per 1 kg reference flow."
      unit: "kg"
      frequency: "per batch/continuous, including abnormal/changeover records"
      temporal_coverage: "same complete representative production period; disclose gaps/abnormality"
      site_scope: "declared grade and attributable shared units"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration, raw tickets/assays, supplier definitions and reconciliation uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "Divide each actual attributable external exchange quantity by net accepted paper mass Q of the same period; finished_filter is fixed at 1 kg. Reconcile physical balances using original unallocated amounts, not physical co-product yields multiplied by burden-allocation shares."
      inputs:
        - cp_mass
        - "all collection protocols"
      output: "per 1 kg reference flow"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: species_load
      applies_to: "ammonium, nitrate, phosphate, toc"
      rule: "For each interval, load kg = concentration mg/l * matched volume m3 * 0.001; first reconcile the assay species/N/P/C basis using traceable stoichiometry, then sum and divide by Q. Unknown species composition is not inferred from an aggregate indicator."
      inputs:
        - cp_species
        - cp_effluent
        - cp_mass
      output: "kg species or measured DOC carbon per 1 kg reference flow"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: particle_load
      applies_to: "pm25, pm2510, pmover10"
      rule: "Determine interval mass from actual concentration, state-matched airflow and duration or an evidenced fugitive method; count disjoint PM2.5, PM2.5–PM10 and >PM10 once, sum the period and divide by Q. Do not add cumulative PM10/TSP to these fractions; unresolved size splits remain gaps."
      inputs:
        - cp_air
        - cp_mass
      output: "kg per disjoint particle fraction per 1 kg reference flow"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: steam_compatibility
      applies_to: "steam, condensate_return"
      rule: "Normalize actual steam and return masses separately; retain an inlet/return/vent/leak/stock enthalpy balance. Supplier mass or energy reference definition must explicitly match the site; an unknown definition is neither net delivered heat nor a conversion factor of 1."
      inputs:
        - cp_steam
        - cp_mass
        - "supplier definition"
      output: "kg steam and returned condensate; separate heat QA and compatible provider link"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: physical_balances
      applies_to: "material, water and carbon ledgers"
      rule: "Unallocated external inputs = physical paper/packaging/core dispatch + exported wastes + elementary releases + utility return + closing-minus-opening stocks + explained residual. Reconcile solids/water in each wet stream; keep steam-water and process-water circuits distinct, with equal internal endpoints cancelled once. Carbon follows actual composition/origin; retain actual biogenic CO2 and avoid duplicate DOC/identified chemical carbon."
      inputs:
        - "all collection protocols"
        - "measured stream composition"
      output: "unallocated solids/water/carbon ledgers and explained residual"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: effluent_native_basis
      applies_to: "exported_wastewater; water_fresh"
      rule: "Whole handed-off liquid kg = measured V_m3 × measured effluent density_kg/m3 at the same T/state, or direct wet weighing. Final liquid H2O m3 = actual H2O component kg / documented water density at discharge T. Divide each resulting external quantity by Q once; treatment-transfer and direct-discharge branches are mutually exclusive."
      inputs:
        - cp_effluent
        - cp_water
        - cp_mass
      output: "kg whole external liquid and m3 final H2O carrier per 1 kg reference flow"
      source_ids:
        - jrc-pulp-paper-bref-2015
  data_quality_requirements:
    - id: dq_grade
      applies_to: "finished_filter"
      requirement: "Retain grade, filtration-test conditions, porosity and furnish; mill-gate paper mass cannot replace functional comparison of final filters."
      evidence: "hahnemuhle-filter-catalog; customer specification"
    - id: dq_identity
      applies_to: "all inventory rows"
      requirement: "Check name/CAS/classification/route/compartment/property/unit for each row. Decide physical identity, quantity basis and supplier/receiver compatibility separately; unresolved identities retain specific names and blank UUID."
      evidence: "supplier/receiver records; direct identity and property definitions"
    - id: dq_balance
      applies_to: "all inventory rows"
      requirement: "Reconcile complete same-period physical mass/water/carbon ledgers, quantify residual/measurement uncertainty; allocated burdens do not substitute for physical balances."
      evidence: "cp_mass; stock and calibrated stage records"
    - id: dq_emissions
      applies_to: "all elementary outputs"
      requirement: "Separate size-resolved airborne dust, captured dust and waterborne particles; add each actual species. One non-detect proves no period-wide zero; any external factor needs actual technology/operation applicability, not a transplanted single-mill default."
      evidence: "cp_air; cp_species; cp_bio; jrc-pulp-paper-bref-2015"
    - id: dq_linkage
      applies_to: "all positive external exchanges"
      requirement: "A concrete data package remains incomplete while actual amounts, supplier reference conditions, cotton-purification burden, steam or external-treatment links are unknown; methodology text is not a completed dataset."
      evidence: "supplier and treatment reference definitions; collection records"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "validate_scope: Require all reference qualifiers and exactly one finished_filter output at 1 kg; reject cigarette, resin-hardened, coated/impregnated, converted filter media and unsupported routes. Neither shared CPC nor a broad UUID widens scope."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "validate_measurement: All rows use the same positive finite Q at actual delivery moisture; EN/ZH reference amount, denominator, collection aggregation and formulas agree. Property/unit/species/supplier definitions must match; unknown steam pressure/heat basis, purified-pulp state or unsupported conversion cannot pass."
    source_ids: []
  - rule_id: validation_rule_3
    applies_to: "foreground_dataset_conformance"
    rule: "validate_physical: Check unallocated mass/water/carbon, stocks/residuals and equal internal endpoints. Packaging is outside reference-paper mass but remains in physical dispatch. Captured dust is not airborne release; particle fractions are disjoint; transferred/direct-discharge water is not duplicated; retain real biogenic CO2."
    source_ids: []
  - rule_id: validation_rule_4
    applies_to: "foreground_dataset_conformance"
    rule: "validate_dataset_completeness: Resolve identity, amount, supply and receiving-treatment links for every actual positive exchange before delivering a complete dataset. Add each actual unlisted substance as a specific atomic row; evidenced nonoccurrence may be not applicable. Blank UUID, missing monitoring, tool failure or absent measurements are not zero or successful validation."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground filter-paper manufacturing package; cradle-to-gate dataset only after compatible supplier and receiving-treatment links"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Supply of uncut qualitative cellulose filter base paper within the stated grade/route; consumer models subsequent conversion"
  excluded_use: "Proxy for all CPC32136; cigarette, ashless/hardened filters, formed filters, membranes; mass-only filtration service comparison; claims of measured LCI at the cited producer"
  required_metadata: "Reference qualifiers; process/boundaries; each atomic row; site/period; mass/water/carbon ledgers; allocation drivers; supplier/treatment links"
  required_quality_disclosure: "Identity/amount/upstream gaps; steam pressure and return basis; purified-cotton-pulp identity; unknown pollutants/measurement limits; metadata defects; balance residual and uncertainty"
  update_trigger: "Changed pulp/purification, resin or impregnation, porosity/performance grade, dewatering/drying, energy interface, packaging/treatment or supplier reference basis"
data_sources:
  - id: "jrc-pulp-paper-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Production of Pulp, Paper and Board (2015), JRC95678, DOI 10.2791/370629. https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf ; 2.2.2.1.4–2.2.2.2 (printed pp.48–50), 7.1.1–7.1.3 (pp.660–665), 7.1.10 (p.670), 7.1.11.4 (pp.674–676), 7.2.2.3 (pp.687–688)"
    used_for: "Original supports papermaking stages, filter-paper porosity/drying distinctions, grade-change/water-loop limits, net saleable output and matched flow/concentration measurement. Sector/case quantities are not default recipes/values; allocation and specific site protocols are explicit PCR choices."
  - id: "hahnemuhle-filter-catalog"
    type: "literature"
    reference: "Hahnemühle, Filter Papers & Membranes, official English catalogue, https://www.hahnemuehle.com/fileadmin/user_upload/bilder/Filtration/pdf/web-10603856_Katalog_Filtration_EN.pdf ; PDF pp.60/62/64/66/74/124 (printed pp.59/61/63/65/73/123); dated access snapshot 2026-10-11"
    used_for: "Producer original distinguishes ordinary highly pure qualitative paper from resin-hardened/ashless, glass/quartz and other media; supports reel delivery and filtration-test qualifiers. Grade-specific performance/purity/output are not universal values; no factory purification/energy recipe is inferred."
  - id: "hahnemuhle-paper-manufacturing"
    type: "literature"
    reference: "Hahnemühle, Paper manufacturing, https://www.hahnemuehle.com/en/about-us/paper-quality.html ; Fourdrinier paper machine and continuously checked/wound paper paragraphs; dated access snapshot 2026-10-11"
    used_for: "Supports only that its Fourdrinier machine also makes filter paper which is dried/checked/wound. Mixed art-paper pressing/smoothing description does not prove this grade’s process; BREF and actual acceptance govern porosity preservation."
  - id: "ipcc-wastewater-2019"
    type: "official_guidance"
    reference: "IPCC, 2019 Refinement to the 2006 IPCC Guidelines for National Greenhouse Gas Inventories, Volume 5 Chapter 6, https://www.ipcc-nggip.iges.or.jp/public/2019rf/pdf/5_Volume5/19R_V5_6_Ch06_Wastewater.pdf ; 6.1 (p.6.7), 6.2.3 (pp.6.30–6.31), industrial N2O in 6.4.1.1 (pp.6.44–6.45)"
    used_for: "Supports only industrial wastewater CH4/N2O route, C/N-source and quantity-basis distinctions. Prefer actual point-source data; adopt no national/sector default factors or downstream receiving-water release as foreground. Its biogenic-CO2 reporting exclusion is not an LCI omission rule."
