measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Q is cp_mass net paper mass of the same period and accepted grade at actual moisture, excluding cores/packaging, broke and rejects. Divide every external exchange by the same positive finite Q to express per 1 kg reference flow."
  - id: moisture_basis
    applies_to: "wood_pulp, cotton_pulp, finished_filter, screen_rejects, primary_sludge, biosludge, collected_dust, discarded_broke"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep wet/as-received mass and measured wet-basis moisture w; dry mass equals wet mass multiplied by (1 - w). Air-dry pulp conventions, oven-dry fibre and delivered paper mass are distinct; an unknown supplier basis blocks the quantity link."
  - id: electricity_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "The direct reference property is Net calorific value; the verified unit group gives 1 kWh = 3.6 MJ. This converts the electricity unit only; it establishes neither fuel heating value nor supplier region/voltage/mix compatibility."
  - id: steam_basis
    applies_to: "steam, condensate_return"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "0.45 MPaG is a condition of the selected steam identity, not a site default. cp_steam records actual steam mass, return, vents, leaks and stocks; usable heat comes from matched inlet/return enthalpy and loss balance. A supplier MJ or different-pressure basis needs evidenced compatibility with measured site heat or mass; the unit alone does not establish net delivered heat."
  - id: solution_basis
    applies_to: "cleaning_naoh, peroxide"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Distinguish commercial solution mass, active mass and solvent water; solution mass is not pure substance mass. 50% limits the identified commercial product and prescribes no site recipe/dose; another concentration requires an appropriate identity and supplier basis."
  - id: water_basis
    applies_to: "process_water, river_water, groundwater, exported_wastewater, water_fresh"
    required_property_ref:
      name: "Mass; Volume"
      uuid: ""
    required_unit: "kg; m3"
    rule: "Use each row’s actual reference property. Convert water mass/volume using measured/traceable density and temperature, not a database secondary factor. Withdrawal, internal recycle, utility return, exported wastewater and final discharge have separate ledgers."
  - id: species_basis
    applies_to: "ammonium, nitrate, phosphate, toc, n2o"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Assay reporting must define species or carbon mass. N/P-based results need stated species stoichiometry and traceable molar masses; total N/P or COD cannot substitute for a specific species. DOC is measured carbon mass only and cannot hide known chemical emissions."
