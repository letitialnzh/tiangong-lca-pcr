system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "boundary_mill: Include stock preparation/disintegration/screening, filter-grade refining, wet forming, porosity-preserving dewatering, drying, quality control, reeling/trim handling, packaging, electric internal handling and attributable on-site effluent treatment. Add each actual aid, packaging component, waste and direct emission as an atomic row. Aggregate into one foreground unit while retaining independent stage meters; do not output the same paper again between manufacture and packaging [jrc-pulp-paper-bref-2015, 7.1.1–7.1.3, 7.1.10, 7.1.11.4]."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "boundary_services: Link fibre purification, pulping/bleaching and steam-supply combustion through compatible upstream units; do not duplicate their resource withdrawals or emissions in this foreground. Split externally transferred wastewater and directly discharged on-site treated water by their actual quantities; do not count the same water/pollutants both at transfer and outfall. On-site boilers, acid washing, wet-strength resin or composite-fibre routes need prior evidence/method expansion, not silent inclusion."
      source_ids: []
    - rule_id: system_boundary_rule_3
      applies_to: "foreground_system_boundary"
      rule: "boundary_recovery: Match internal sender/receiver amounts for white water, wet/dry broke and recovered fibre in the physical process diagram; cancel internal recirculation once in the aggregated external inventory. Collect actual cleanliness constraints, grade-change flushing, downtime and effluent loads; assume neither closed water circuits nor zero losses [jrc-pulp-paper-bref-2015, 7.1.3, 7.1.11.4]."
      source_ids: []
