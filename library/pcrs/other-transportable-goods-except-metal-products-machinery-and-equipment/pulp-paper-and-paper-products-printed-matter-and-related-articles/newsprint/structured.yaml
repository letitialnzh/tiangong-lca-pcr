measurement_rules:
  - id: net_paper
    applies_to: "newsprint"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Weigh accepted reels on calibrated scales; subtract individually recorded core and packaging tare. P = sum of net delivered paper masses for the same grade/time. Reject gross mass, roll count, area or grammage as automatic reference equivalents. Use cp_mass."
  - id: dry_wet
    applies_to: "mass-based material/product/residue and analytical moisture-component ledgers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "For lot j, dry solids d_j = m_j * (1-w_j), with wet-basis moisture w_j measured for that lot. For the dry-to-delivered product conversion, D = sum d_j over accepted paper lots only, matching P; other streams retain separate dry totals. Net delivered reference remains P, not D or an assumed air-dry tonne. Convert a dry-basis intensity by the measured D/P; retained moisture is part of delivered paper. These are auxiliary mass/moisture calculations only for the stated material/component scopes; native electricity MJ and water Volume/m3 exchanges retain their own reference property/unit. Independently measured component mass does not replace a native energy/volume numerator."
  - id: chemical_basis
    applies_to: "mass-referenced chemical, formulation and mineral inputs"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep supplied formulation mass, dry solids and active-species mass distinct. Use supplier concentration, hydration and background reference definition, not database recipe metadata, to establish the exchange basis."
  - id: steam_basis
    applies_to: "steam"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Steam mass is not useful heat. Reconcile measured supply/return enthalpy, condensate loss and pipe-loss boundary with supplier reference. Keep steam water/condensate in the physical balance without duplicating purchased process water."
