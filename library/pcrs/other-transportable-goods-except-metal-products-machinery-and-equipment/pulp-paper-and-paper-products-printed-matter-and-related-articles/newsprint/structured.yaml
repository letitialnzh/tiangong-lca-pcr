      quality_evidence: "Calibration; sample chain; supplier/receiver record; uncertainty"
    - protocol_id: cp_gases
      process_id: "pm"
      flow_role: "individual gas"
      record_type: "meter/laboratory/transaction record"
      raw_fields: "gas species; flow; concentration; dry/wet basis; T/P; test period; carbon/nitrogen origin; dissolved gas; model/factor provenance"
      collection_method: "Measure treatment off-gases and sludge-handling releases, or justify a source-bound site carbon/nitrogen-fate model using actual records and uncertainty. An unmeasured gas is unresolved, not zero; keep biogenic CO2 in LCI."
      unit: "Original row unit; retain raw basis"
      frequency: "Each lot or metering/sampling interval"
      temporal_coverage: "Same complete declared campaign including changes and losses"
      site_scope: "Selected grade and node; upstream links identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample chain; supplier/receiver record; uncertainty"
    - protocol_id: cp_dust
      process_id: "pm"
      flow_role: "cutting and winding particles"
      record_type: "outlet/fugitive measurement"
      raw_fields: "aerodynamic size cut; concentration; paired air volume; T/P and dry/wet basis; interval; control state; paper grade; fibre/mineral composition; moisture; collected and returned dust"
      collection_method: "Use calibrated size-resolved sampling appropriate to the outlet or fugitive release and simultaneous air-flow records. Derive each non-overlapping mass from compatible concentration and volume, aggregating actual operating periods. No universal paper-dust factor; unmeasured means unresolved, with evidence required for either positive or zero release."
      unit: "kg; retain original concentration and volume units"
      frequency: "Each representative condition and actual release interval"
      temporal_coverage: "Same complete declared campaign"
      site_scope: "Actual cutting/winding and site boundary; exclude internal circulating and captured dust"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration, sampling method, matched operating state and uncertainty"
  calculation_rules:
    - id: campaign_mass
      applies_to: "newsprint"
      rule: "P = sum(gross reel mass - measured core tare - measured wrapper tare - measured film tare); delivered net mass only, excluding rejects and internal broke."
      inputs:
        - cp_mass
      output: "P"
      source_ids:
        - iso638-solid-scope
    - id: dry_conversion
      applies_to: "mass-based material/product/residue and analytical moisture-component ledgers"
      rule: "d_j = m_j * (1-w_j); D = sum d_j for accepted paper lots only, matching P, without summing other input/output solids into D; a product-dry-mass intensity I_d becomes delivered-mass intensity I_d * D/P. No assumed 90% air-dry basis. These are auxiliary mass/moisture calculations only for the stated material/component scopes; native electricity MJ and water Volume/m3 exchanges retain their own reference property/unit. Independently measured component mass does not replace a native energy/volume numerator."
      inputs:
        - cp_mass
        - cp_furnish
        - cp_recipe
        - cp_residues
      output: "measured dry/wet conversion"
      source_ids:
        - iso638-solid-scope
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "x = X / P, with X the attributable campaign exchange in its original row unit and P measured delivered net paper kg; preserve unallocated physical and allocated-burden ledgers separately."
      inputs:
        - cp_mass
        - "all applicable row protocols"
      output: "x"
      source_ids:
        - jrc-pp-bref-2015
    - id: effluent_load
      applies_to: "cod, tss, nitrogen, phosphorus"
      rule: "L = sum(c_k * V_k * 0.001), where c_k is the matching pollutant concentration in mg/L and V_k is measured discharge m3 for the same interval; x = L/P. COD uses O2 equivalent, N uses N and P uses P."
      inputs:
        - cp_effluent
        - cp_mass
      output: "kg pollutant per kg delivered paper"
      source_ids:
        - jrc-pp-bref-2015
    - id: electricity_units
      applies_to: "electricity"
      rule: "MJ = 3.6 * metered kWh; x = MJ/P. Preserve the verified Net calorific value property label without treating electric energy as fuel heat."
      inputs:
        - cp_utilities
        - cp_mass
      output: "MJ per kg delivered paper"
      source_ids:
        - jrc-pp-bref-2015
    - id: steam_enthalpy
      applies_to: "steam"
      rule: "H_net = sum(m_supply * h_supply - m_return * h_return) across the same metering boundary, including documented condensate losses and delivery convention; compare with supplier background definition before linking. Retain measured steam mass as its separate exchange basis."
      inputs:
        - cp_utilities
        - "supplier enthalpy convention"
      output: "net heat reconciliation; steam kg"
      source_ids:
        - jrc-pp-bref-2015
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Actual species, medium/submedium, origin, route, treatment and property/unit must match the adopted record and supplier dataset. Unresolved identities are explicit; do not use correction flows or adjacent products."
      evidence: "Direct identity and supplier specification"
    - id: balances
      applies_to: "pm"
      requirement: "Close independent wet mass, dry solids, ash, water and carbon balances using stocks, rejects, product and escaped particle intervals; account separately for actual dust fibre, ash, moisture and carbon origin, without duplicating internal return, collected waste or outdoor release. Disclose residual and uncertainty. COD is not a carbon-balance mass."
      evidence: "Physical stage ledgers, laboratory tests"
    - id: coverage
      applies_to: "pm"
      requirement: "Document full campaign, downtime, grade changes, purchased supplies, transport and all actual chemicals; no dataset completeness claim while important quantities or links are unresolved."
      evidence: "Campaign and receiver records"
    - id: emission_basis
      applies_to: "all inventory rows"
      requirement: "Retain sum-indicator/species reconciliation; avoid nested totals or size fractions counted twice. Boilers require their own source and emissions if later included, not sawmill dust evidence."
      evidence: "Analytical reports and justified applicability"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Require one completed output linked by newsprint and its reference UUID; it equals 1 kg of net delivered paper. Match bilingual reference, row identities, denominators, aggregation and equations. Reject automatic g/m2-to-kg, area-to-kg or roll-count-to-kg equivalence: measured same-lot area times actual grammage divided by 1000 is only a QA estimate until reconciled to weighed net mass and moisture. Do not use double reference outputs for an internal reel-to-wrapping handover. Check original stage meters and equal internal-link quantities. Missing receiver, solids/active fraction, pulp route, utility reference basis or material flow identity prevents a complete dataset. Record skipped measurement/emission methods and remaining uncertainty; database identities do not prove measured inventory or scientific approval. [jrc-pp-bref-2015, iso638-solid-scope]"
    source_ids: []
