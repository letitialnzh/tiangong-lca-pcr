allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "First separate grades and upstream pulping/energy nodes using direct metering and subdivision. Internal broke or white-water recovery is not a co-product and carries no substitution credit. Keep gross physical fibre, dry solids, mineral ash, water, energy and fossil/biogenic carbon ledgers distinct from the allocated environmental-burden ledger. Never multiply physical co-product quantities by burden shares; keep linked transfer quantities equal. For shared meters, use measured causal drivers (dryer evaporation/enthalpy, machine hours and actual loads), documenting grade-change losses and idle consumption. If subdivision cannot resolve a genuinely shared process, state the causal physical allocation rationale and sensitivity; a demonstrably unsupported physical relationship needs separately justified economic allocation and review. Residue sales do not automatically establish co-product status. Any substitution, avoided burden or recovered-input convention requires explicit study rules, evidence and sensitivity, not an automatic credit. These are author methodological requirements informed by BREF process differentiation, not a claim that BREF prescribes LCA allocation."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "pm"
      flow_role: "accepted paper"
      record_type: "meter/laboratory/transaction record"
      raw_fields: "gross reel mass; core tare; wrapper/film tare; net mass; lot; moisture; ash; grade; width; area; grammage"
      collection_method: "Calibrated reel scales and dispatch acceptance records; paired representative sealed moisture samples, wet/dry weighing to constant mass using a documented applicable laboratory method. Retain temperature, volatile-material screening and uncertainty. ISO 638-1 scope describes solid samples, not slush or saleable pulp lots."
      unit: "Original row unit; retain raw basis"
      frequency: "Each lot or metering/sampling interval"
      temporal_coverage: "Same complete declared campaign including changes and losses"
      site_scope: "Selected grade and node; upstream links identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample chain; supplier/receiver record; uncertainty"
    - protocol_id: cp_furnish
      process_id: "pm"
      flow_role: "pulp receipt"
      record_type: "meter/laboratory/transaction record"
      raw_fields: "supplier lot; species; pulping/bleaching route; wet mass; solids; ash; storage change; upstream link"
      collection_method: "Reconcile delivery weigh tickets, tank mass/volume with density, laboratory solids and supplier lot certificates; dry furnish fractions use actual measured dry solids."
      unit: "Original row unit; retain raw basis"
      frequency: "Each lot or metering/sampling interval"
      temporal_coverage: "Same complete declared campaign including changes and losses"
      site_scope: "Selected grade and node; upstream links identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; sample chain; supplier/receiver record; uncertainty"
    - protocol_id: cp_recipe
