      collection_method: "Pair flow-proportional composite samples and simultaneous discharge meters; capture grade changes, upsets and bypasses. Record laboratory analytical methods and scope; retain separate pollutant and carrier-water amounts."
      unit: "Original row unit; retain raw basis"
      frequency: "Each lot or metering/sampling interval"
      temporal_coverage: "Same complete declared campaign including changes and losses"
      site_scope: "Selected grade and node; upstream links identified"
