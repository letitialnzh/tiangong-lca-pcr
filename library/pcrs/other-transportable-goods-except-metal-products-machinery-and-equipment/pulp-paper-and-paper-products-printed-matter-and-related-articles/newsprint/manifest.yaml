review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  scientific_review: Independent controller source/identity/measurement review performed; independent
    scientific approval and publication remain pending.
  classification_scope_review: "Narrower CPC 3.0 32121 scope: unprinted machine-finished newsprint reels from specified pulp routes, papermaking node only. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  unresolved_flow_rows:
  - kaolin
  - calcium_carbonate
  - cationic_starch
  - steam
  - tss
  identity_limitations:
    tmp_pulp: Broad virgin wood-based pulp is limited to proven pure TMP without chemical pretreatment;
      supplier species/refining/brightness route and actual delivered dry-mass basis remain required.
      The named TMP candidate with chemical-treatment contradiction remains excluded.
    kaolin: Mine-name candidate is not a paper-grade filler identity.
    calcium_carbonate: Calcite/limestone do not establish precipitated paper-grade filler.
    cationic_starch: Unmodified starch does not establish cationic modification.
    steam: 'Prior generic adoption withdrawn: direct record specifies 11.0 MPaG. Actual pressure and supply
      basis not established; alternative fixed pressures and Mass-labelled heat without an explicit steam
      quantity convention do not close the gap.'
    wrapper: The broad uncoated-paper identity is used only for the actual unbleached kraft reel-wrapping
      sheet; declare kraft furnish, basis weight, moisture, uncoated and unlaminated state, and provider
      gate. Its CPC 32129 graphic-paper classification does not establish packaging grade and remains
      a source-metadata clarification debt. No finished bag or purchased laminate is represented. Separately
      purchased glue is a separate row; do not split an actual supplied composite into duplicate purchases.
    screen_reject: The broad Waste solid identity locates only this independently exported wet screening
      reject, with actual fibre/mineral/contaminant composition, wet mass, solids, origin and receiving
      treatment. It does not merge this stream with sludge or authorize an unspecified disposal route.
      Reject transferred internally to the wastewater plant is counted there once, not also as external
      screen waste.
    primary_sludge: The paper-production-sludge identity conditionally locates separately removed dewatered
      primary sludge only. Retain source stage, wet and dry masses, fibre/fines/mineral ash/additives,
      carbon origin, actual hazard assessment and receiver route. It is neither the biological sludge
      row nor returned fibre. If combined before removal, measure and model the actual combined stream
      once with a reviewed identity rather than duplicate totals.
    bio_sludge: The same broad paper-production-sludge identity locates a different, separately removed
      excess biological sludge from the declared aerobic paper-mill treatment. Measure wet/dry mass, biomass/mineral/additive
      composition, fossil and biogenic carbon, stocks and receiving route independently. It is not municipal
      sludge, return activated sludge or the primary-sludge quantity; no treatment or hazard category
      is assumed from the UUID.
    return_water: CAS 7732-18-5; liquid water emitted to a named freshwater receiver only, measured in
      native m3 after on-site treatment. Retain actual water content, temperature/density and outfall
      timing; distinguish carrier water from dissolved/suspended pollutant quantities and reconcile the
      physical balance without counting pollutants again as pure water. This is not river withdrawal,
      vapour, wastewater transferred to another treatment plant or discharge to sea.
    tss: Only unspecified-water TSS found; freshwater identity remains pending.
    cod: Freshwater direct-read record provides no Chinese baseName; Chinese rendering retains exact English
      baseName and discloses missing official localization.
    film: Name/CAS/comment confirm PE film; isolated CPC 29220 classification is inconsistent. Supplier
      confirmation and source-classification clarification remain due. This locator is limited to unsupported,
      non-self-adhesive, non-laminated PE film; do not interpret the conflicting CPC 29220 source classification
      as the actual resin or grade.
    bentonite: The record is a natural mineral mix at a mining site, not evidence of delivered activated
      papermaking aid. Its physical locator is conditional on actual compatible unmodified bentonite mineral;
      declare beneficiation, particle grade, slurry preparation and supplier gate separately. Chemically
      activated or formulated products require separately reviewed identities and processing burdens.
    electricity: The source supply geography is CN. Actual site/year/voltage/provider compatibility must
      be established; this record is not automatically a global electricity background.
    dip_pulp: The source descriptor lists 90% paper fibre and 10% moisture; this is a supplier-reference
      compatibility condition, not actual furnish, fibre fraction or a universal air-dry conversion. Distinguish
      oven-dry solids, fibre and mineral ash by actual assay.
  background_compatibility: UUID identity confirmation is separate from actual supplier datasets. Pulp
    moisture/route, reagent solids/concentration, medium-voltage supply, packaging and steam delivery
    basis must match before complete foreground datasets are claimed.
  source_scope: JRC BREF 2015 supplies process descriptions, not default recipes, quantities, BAT limits
    as LCI factors, or full integrated pulping data. Manufacturer pages supply product/route distinctions
    only.
  translation_review: Controller checked aligned bilingual quantities, scope and bounded repair; scientific
    translation approval not asserted.
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  particle_scope_review: BREF 7.1.10 explicitly identifies cutting dust potential. Four conditional rows
    now preserve collected dust and three non-overlapping outdoor particle intervals with actual measurements,
    no default emissions and no internal-loop double count.
