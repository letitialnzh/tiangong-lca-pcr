measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Use accepted cured empty sack net mass from cp_output; exclude rejected bags, wrap and pallets. Measure residual moisture rather than substituting oven-dry mass."
  - id: same_denominator
    applies_to: "all inventory rows"
    required_property_ref:
      name: "Declared row property"
      uuid: ""
    required_unit: "Declared row unit"
    rule: "Every row and collection aggregation is per 1 kg reference flow from the same accepted campaign; total exchanges are divided by total accepted net sack mass in kg. Bag-count records require a measured same-configuration net bag mass, never a guessed weight."
  - id: wet_dry_basis
    applies_to: "paper_input; starch_glue; residues"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep actual wet and dry quantities separate, with measured moisture/solids and supplier reference basis; a generic flow identity does not establish wet/dry provider compatibility."
  - id: electrical_energy
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Retain the original property label for electrical work; convert metered kWh by 1 kWh = 3.6 MJ from the verified unit group. Match below-1-kV user supply and do not interpret this as a fuel calorific value or heat delivery."
  - id: freight_basis
    applies_to: "inbound_road"
    required_property_ref:
      name: "mass*distance"
      uuid: "118f2a40-50ec-457c-aa60-9bc6b6af9931"
    required_unit: "kg*km"
    rule: "Sum measured consignment kg × actual route km; 1 t*km = 1000 kg*km from the unit group. Match supplier load/empty-return definition; no default distance."
