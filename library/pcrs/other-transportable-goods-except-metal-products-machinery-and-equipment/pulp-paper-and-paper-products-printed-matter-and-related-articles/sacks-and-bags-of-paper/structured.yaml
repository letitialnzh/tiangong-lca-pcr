allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "paper-sack-converting"
    rule: "Prefer process subdivision and direct campaign/stage attribution. Investigate system expansion where justified by the study; otherwise use a demonstrated causal physical relationship, and only then a justified other relationship. Do not preset mass or revenue shares."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_physical
    applies_to: "recovered_trim; finished_bag"
    rule: "Keep full actual sack/trim/waste masses in the physical ledger. Delivered wrapping/pallet outputs are accompanying packaging, not co-products; their physical transfers do not cancel upstream packaging burdens. Any burden share acts on attributable environmental burdens, not on the physical kilograms of co-products or on equality of internal transfer quantities. Document marketability before declaring trim a co-product; no automatic avoided-paper credit."
    source_ids:
      - ec-pef-2021
  - rule_id: allocation_shared
    applies_to: "electricity; inbound_road; wood_pallet"
    rule: "Record directly metered stage use where possible; shared utilities require actual driver records and reconciliation. Separate returnable pallet physical movements from amortised production/service burdens, with measured trips/losses. Do not infer an industry allocation coefficient."
    source_ids:
      - ec-pef-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "paper_sack_converting"
      flow_role: "finished_bag"
      record_type: "measured campaign records"
      raw_fields: "accepted lot masses; bag counts; configuration; moisture; dimensions; rated load; test conditions; rejected lots"
      collection_method: "Weigh accepted cured empty sacks on calibrated scales with packaging tare; sample same-configuration unit mass if only count records exist; retain moisture/performance results."
      unit: "kg"
      frequency: "Each campaign; every relevant event and representative test"
      temporal_coverage: "Declared representative period including starts/stops/rejects; disclose coverage"
      site_scope: "Declared site and eligible configuration only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; lot traceability; stock/meter reconciliation; supplier/test/receiver evidence"
    - protocol_id: cp_materials
      process_id: "paper_sack_converting"
      flow_role: "paper_input; starch_glue"
      record_type: "measured campaign records"
      raw_fields: "receipts/issues/returns; beginning/end stocks; paper grade/plies/grammage/moisture; glue formulation/solids/grade/supplied basis"
      collection_method: "Weigh material issues and returns; reconcile purchased lots and stock changes to each campaign. Retain supplier grade/SDS and wet/dry provider declarations. Measure seam and bottom glue separately then sum once."
      unit: "kg"
      frequency: "Each campaign; every relevant event and representative test"
      temporal_coverage: "Declared representative period including starts/stops/rejects; disclose coverage"
      site_scope: "Declared site and eligible configuration only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; lot traceability; stock/meter reconciliation; supplier/test/receiver evidence"
    - protocol_id: cp_energy
      process_id: "paper_sack_converting"
      flow_role: "electricity"
      record_type: "measured campaign records"
      raw_fields: "start/end kWh; meter calibration; voltage; stage/runtime; shared driver; supply geography/time/losses"
      collection_method: "Use stage and shared-service meters covering drives, extraction, handling and attributable lighting. Reconcile campaign sums to the site meter and provider boundary."
      unit: "MJ"
      frequency: "Each campaign; every relevant event and representative test"
      temporal_coverage: "Declared representative period including starts/stops/rejects; disclose coverage"
      site_scope: "Declared site and eligible configuration only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; lot traceability; stock/meter reconciliation; supplier/test/receiver evidence"
    - protocol_id: cp_water
      process_id: "paper_sack_converting"
      flow_role: "wash_water; cleaning_wastewater"
      record_type: "measured campaign records"
      raw_fields: "cleaning/dilution events; supply volume/mass/temperature/density; effluent mass/volume; starch load; receiver and treatment gate"
      collection_method: "Weigh water and effluent or use calibrated volume meters with measured temperature-specific density; separately collect effluent, sample composition and confirm the external receiver. Do not double count water already in purchased glue."
      unit: "kg"
      frequency: "Each campaign; every relevant event and representative test"
      temporal_coverage: "Declared representative period including starts/stops/rejects; disclose coverage"
      site_scope: "Declared site and eligible configuration only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; lot traceability; stock/meter reconciliation; supplier/test/receiver evidence"
    - protocol_id: cp_packaging
      process_id: "paper_sack_converting"
      flow_role: "paper_wrap; wood_pallet; dispatched_wrap; dispatched_pallet"
      record_type: "measured campaign records"
      raw_fields: "wrapping and pallet grade; weighed mass; dispatch lot; one-way/returnable status; trips/losses"
      collection_method: "Weigh actual gate wrapping and one-way pallets excluding sack net mass; retain physical two-way asset logs for returnable pallets and a separately reviewed service allocation."
      unit: "kg"
      frequency: "Each campaign; every relevant event and representative test"
      temporal_coverage: "Declared representative period including starts/stops/rejects; disclose coverage"
      site_scope: "Declared site and eligible configuration only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; lot traceability; stock/meter reconciliation; supplier/test/receiver evidence"
    - protocol_id: cp_transport
      process_id: "paper_sack_converting"
      flow_role: "inbound_road"
      record_type: "measured campaign records"
      raw_fields: "consignment mass; origin/destination; measured route km; truck/load/empty return; supplier-delivered coverage"
      collection_method: "Use weighbridge/dispatch records and actual route logs for contracted inbound road legs absent from other providers. Calculate kg*km separately for each leg."
      unit: "kg*km"
      frequency: "Each campaign; every relevant event and representative test"
      temporal_coverage: "Declared representative period including starts/stops/rejects; disclose coverage"
      site_scope: "Declared site and eligible configuration only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; lot traceability; stock/meter reconciliation; supplier/test/receiver evidence"
    - protocol_id: cp_residues
      process_id: "paper_sack_converting"
      flow_role: "recovered_trim; reject_bags; collected_dust; waste_glue"
      record_type: "measured campaign records"
      raw_fields: "segregated stream mass; moisture/solids; glue contamination; internal rework; receiver acceptance; dispatch documents"
      collection_method: "Weigh each atomic residue separately and sample moisture/composition; reconcile captures, internal returns and off-site shipments. Do not merge fine dust with clean commercial trim or wet glue with rejected sack mass."
      unit: "kg"
      frequency: "Each campaign; every relevant event and representative test"
      temporal_coverage: "Declared representative period including starts/stops/rejects; disclose coverage"
      site_scope: "Declared site and eligible configuration only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; lot traceability; stock/meter reconciliation; supplier/test/receiver evidence"
    - protocol_id: cp_moisture
      process_id: "paper_sack_converting"
      flow_role: "water_vapor"
      record_type: "measured campaign records"
      raw_fields: "paper/glue water; accepted/rejected/residue moisture; washwater; stock changes; cure climate; ventilation destination; atmospheric uptake"
      collection_method: "Use traceable moisture/solids measurements before/after curing and a bounded water balance, with measured atmospheric uptake if present. Quantify only net evaporative emission reaching the environment; unresolved terms prevent a complete balance."
      unit: "kg"
      frequency: "Each campaign; every relevant event and representative test"
      temporal_coverage: "Declared representative period including starts/stops/rejects; disclose coverage"
      site_scope: "Declared site and eligible configuration only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; lot traceability; stock/meter reconciliation; supplier/test/receiver evidence"
    - protocol_id: cp_air
      process_id: "paper_sack_converting"
      flow_role: "pm25; pm_coarse; pm_large"
      record_type: "measured campaign records"
      raw_fields: "sampling method; dry/wet gas basis; ventilation flow; time; filterable/condensable scope; size fractions; capture destination; fugitive evidence; detection limits"
      collection_method: "Measure external dust discharge by qualified size-selective sampling and ventilation records; EPA201A is an option only for compatible dry stationary-source sampling with all method conditions met. It is not a fugitive method. Assess fugitive transfers separately; unknown fractions are pending, not zero."
      unit: "kg"
      frequency: "Each campaign; every relevant event and representative test"
      temporal_coverage: "Declared representative period including starts/stops/rejects; disclose coverage"
      site_scope: "Declared site and eligible configuration only"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; lot traceability; stock/meter reconciliation; supplier/test/receiver evidence"
  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "Divide each actual attributable campaign exchange by the accepted net cured empty sack mass in kg from cp_output; retain row numerator units. Never divide by gross packed mass or nominal rated load."
      inputs:
        - cp_output
        - "campaign records"
      output: "exchange per 1 kg reference flow"
      source_ids: []
    - id: electricity_conversion
      applies_to: "electricity"
      rule: "Metered kWh × 3.6 MJ/kWh, then the same campaign denominator."
      inputs:
        - cp_energy
        - cp_output
      output: "MJ per 1 kg reference flow"
      source_ids: []
    - id: transport_calculation
      applies_to: "inbound_road"
      rule: "Sum actual consignment kg × actual route km, then the same campaign denominator."
      inputs:
        - cp_transport
        - cp_output
      output: "kg*km per 1 kg reference flow"
      source_ids: []
    - id: whole_liquid_mass
      applies_to: "waste_glue; cleaning_wastewater"
      rule: "A_wet_kg = V_m3 * rho_mixture(T), or direct calibrated wet weighing. Water-component mass is A_wet_kg*x_water; retain actual solids/other constituents and whole effluent volume for pollutant loads. Divide by the same Q only once; do not use a pure-water density or create duplicate treatment."
      inputs:
        - cp_residues
        - cp_water
        - cp_output
      output: "kg per 1 kg reference flow and separate physical water balance"
      source_ids: []
    - id: water_balance
      applies_to: "water_vapor"
      rule: "Water entering in paper, wet glue and supplied cleaning/dilution water plus measured atmospheric uptake = water retained in accepted sacks, residues, cleaning effluent and inventory increase plus external water-vapour emission. Retain unresolved terms and uncertainty; do not force closure with an assumed factor."
      inputs:
        - cp_materials
        - cp_water
        - cp_moisture
        - cp_output
        - cp_residues
      output: "Physical water balance and conditional emission"
      source_ids:
        - billerud-sack-handbook
    - id: particle_intervals
      applies_to: "pm25; pm_coarse; pm_large"
      rule: "Use mutually exclusive measured aerodynamic intervals. Coarse fraction = compatible PM10 − PM2.5; >10 fraction = compatible total filterable particulate − PM10. Pair tests on the same gas/temperature/filterable scope; negative differences or incompatible totals require review. Do not add cumulative PM10 or total PM to the three interval exchanges."
      inputs:
        - cp_air
        - cp_output
      output: "Exclusive particle masses per 1 kg reference flow"
      source_ids:
        - epa-method-201a-2020
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: qa_route
      applies_to: "paper-sack-converting"
      requirement: "Verify all exclusion/eligibility claims from the actual BOM, flow diagram, glue SDS and equipment records; unknown liner or printing state is not evidence of absence."
      evidence: "Site route record and BOM"
    - id: qa_provider
      applies_to: "all inventory rows"
      requirement: "Resolve UUID identity separately from quantity/provider basis. Retain exact material state, geography/year, declared reference quantity, background coverage and receiver interfaces; disclose unresolved links."
      evidence: "Supplier declarations and reviewed dataset linkage"
    - id: qa_balance
      applies_to: "paper-sack-converting"
      requirement: "Reconcile stage transfers, material solids, water and carbon before allocation. Keep biogenic and fossil carbon origins distinct; preserve real biogenic CO2 exchanges if present upstream or in an added actual process regardless of climate reporting exclusions. No direct combustion is inferred for this route."
      evidence: "Physical balance ledger and separate allocated burden ledger"
    - id: qa_air
      applies_to: "cp_air"
      requirement: "Assess actual external particulate and ventilation, collected dust and fugitive scope independently. No sawmill PTE factor, default particle distribution or forced positive emission."
      evidence: "Qualified test reports and capture/destination records"
    - id: qa_maintenance
      applies_to: "paper-sack-converting"
      requirement: "Before completing a site inventory, survey actual cutting knives, belts, adhesive-application parts, lubricants, cleaning agents, packaging losses and replaced equipment consumables. Record material/formulation, issue/return, stock, service use, wear and the full discarded physical item separately. Add each actual exchange as an atomic row with its own verified identity and measurement; no default maintenance package, lifetime, frequency or zero use is assumed. Returnable pallet and wrapping losses retain whole physical masses and do not shrink with burden allocation."
      evidence: "Itemized purchase/issue/return/stock/maintenance, measured service and whole discarded-item records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_bag"
    rule: "Exactly one finished sack reference product output must declare 1 kg accepted net mass and required qualifiers. No intermediate sack output may reuse its reference UUID."
    source_ids:
      - billerud-sack-handbook
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Inventory bases, campaign aggregation and both language renderings use per 1 kg reference flow with cp_output net mass; every amount has a traceable protocol and no fabricated quantity."
    source_ids: []
  - rule_id: validate_route
    applies_to: "paper-sack-converting"
    rule: "Reject claims of complete applicability when printing, film/liner, valve, handles, heat supply, combustion or papermaking occurs without separately reviewed coverage. Classification mapping acceptance does not itself establish methodology approval or complete dataset coverage."
    source_ids:
      - billerud-sack-handbook
  - rule_id: validate_balance
    applies_to: "all inventory rows"
    rule: "Require reconciled physical material/water/carbon records, compatible upstream/treatment providers and a separately justified burden allocation. Unresolved identity, provider basis, atmosphere uptake or particle fractions makes affected dataset coverage incomplete."
    source_ids:
      - ec-pef-2021
  - rule_id: validate_particles
    applies_to: "pm25; pm_coarse; pm_large; collected_dust"
    rule: "Keep external exclusive air fractions distinct from captured waste, internal reuse and workplace measurements. EPA201A is not applicable to water-droplet emissions or fugitive ambient sampling; no unsupported size-fraction subtraction."
    source_ids:
      - epa-method-201a-2020
published_dataset_profile:
  dataset_role: "foreground production dataset"
  downstream_use: "secondary_dataset; background_dataset"
  allowed_use: "Eligible empty-sack supply at declared converter gate after upstream and receiver links are completed; scaling by measured net sack mass for the same configuration."
  excluded_use: "Raw paper manufacture; filled goods or customer closure; equal-performance claims without evidence; printed/lined/valved/handled/sewn bags; universal bag recipe or unqualified cradle-to-gate inventory."
  required_metadata: "Required qualifiers; BOM/route; physical ledger; measured amounts/protocols; providers and quantity bases; site/period; allocation; gate packaging and transport; waste receivers."
  required_quality_disclosure: "Candidate methodology review state; sampling uncertainty; exclusions; any unresolved identity/quantity/provider; air and water completeness; no methodology approval implied by technical checks."
  update_trigger: "Changes in sack design, paper/glue composition, liner/printing/valve/closure route, curing energy, supplier, treatment, transport, performance or measured quality."
data_sources:
  - id: "billerud-sack-handbook"
    type: "handbook"
    reference: "[Billerud, Handbook for Sack Kraft Papers and Paper Sacks (2025-12-18 file edition)](https://www.billerud.com/globalassets/billerud/packaging-materials/sack-paper/sack-handbook-251218.pdf); printed/PDF pp.25,28,30–32,53"
    used_for: "Open-mouth pasted sack identification; conditional tube/bottom conversion; curing water mechanism and glue performance. No numerical recipe/time/strength default."
  - id: "eu-pp-bref-2015"
    type: "official_guidance"
    reference: "[European Commission JRC, Production of Pulp, Paper and Board BREF (2015)](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf); DOI 10.2791/370629; §7.1.10, printed p.670/PDF p.708"
    used_for: "Upstream pulp/paper scope and qualitative finishing cutting-dust recognition; converter analogy requires actual site checks. No mill emission quantities imported."
  - id: "epa-method-201a-2020"
    type: "official_guidance"
    reference: "[US EPA, Method 201A (October 7, 2020)](https://www.epa.gov/sites/default/files/2019-08/documents/method_201a_0.pdf); §§1–4, PDF pp.1–3"
    used_for: "Conditional compatible stationary-source filterable PM size sampling, limitations and exclusive-interval interpretation. No fugitive factor."
  - id: "ec-pef-2021"
    type: "official_guidance"
    reference: "[European Commission, C(2021)9332 Annex I](https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf); §4.5, PDF pp.63–64"
    used_for: "Allocation hierarchy; document causal relationship and discarded alternatives. Not a PEF compliance claim."
