allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "Apply the hierarchy in eu-pef-annex-2021 section 4.5 as an explicit methodological choice: first attribute separable operations by subdivision; examine feasible system expansion with stated additional functions; otherwise justify a relevant causal physical relationship, or an economic relationship when physical causality cannot be substantiated. Do not automatically use wet-mass shares for water-rich sludge. Record allocation factors, prices/period, outputs, shared processes and sensitivity; distinguish waste treatment from a saleable co-product with demonstrated function and receiving market."
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Maintain two linked ledgers: (1) unallocated physical quantities and dry-fibre/dry-solid/water/carbon balances, including full co-product outputs and identical internal transfers; (2) attributed environmental burdens and credits. Allocation shares do not physically reduce co-product output or internal-link quantities. Foreground treatment burdens follow the actual receiver. A recovered-paper input is not automatically burden-free: document collection, sorting, transport, previous-life burden and credit sharing, quality at substitution and upstream dataset convention. PEF CFF is an available programme-specific convention with stated parameters, not a default imposed here. Do not combine an avoided-production credit with a background dataset already including that credit; no blanket virgin-fibre substitution or fertilizer/energy credit is permitted."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_product
      process_id: "p1"
      flow_role: "finished_pulp"
      record_type: "accepted-output and laboratory record"
      raw_fields: "batch; gross/tare/net mass Q; delivery moisture; dry solids; ash; fibre/nonfibre composition; brightness; dirt/stickies; grade; supplier tolerance"
      collection_method: "Calibrated weighbridge/bale scales; representative batch moisture/oven-dry and ash assays under declared independently validated methods with drying/ashing conditions and uncertainty retained; fibre composition method and uncertainty; release-quality record"
      unit: "kg; fractions"
      frequency: "Each batch; matched campaign"
      temporal_coverage: "Full matched production campaign; record dates and idle/startup periods"
      site_scope: "Only qualified accepted dried pulp; opening/closing stock and off-spec stock reconciled"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration; sample representativeness; laboratory method/version and report; supplier/background state agreement"
    - protocol_id: cp_feed
      process_id: "p1"
      flow_role: "recovered_paper"
      record_type: "receipt and composition sampling"
      raw_fields: "supplier; grade/source mass fractions; gross/tare; moisture; dry solids; fibre; ash; plastics; metals; ink/coatings/adhesives; stock change"
      collection_method: "Weigh each receipt; stratified representative sorting/composition and dry-matter tests by grade/source; retain analytical definition of fibre and nonfibre contaminants"
      unit: "kg; fractions"
      frequency: "Each load/batch; representative grade sampling"
      temporal_coverage: "Full matched production campaign; record dates and idle/startup periods"
      site_scope: "All accepted feed to the selected campaign, with warehouse reconciliation"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Grade tickets; scales; sample design; dry matter and contaminant laboratory reports"
    - protocol_id: cp_utilities
      process_id: "p1"
      flow_role: "electricity; gas; purchased_heat"
      record_type: "meter and supplier reconciliation"
      raw_fields: "stage meters; inlet/return; gas T/P/humidity/composition/Z; supplier reference volume; steam mass/T/P/quality/enthalpy; output Q; shared-use allocation"
      collection_method: "Calibrated energy and flow meters; supplier quantity definitions; inlet minus return enthalpy balance; reconcile stages and purchased/generated utilities without duplication"
      unit: "MJ; m3; kg; kWh"
      frequency: "Continuous/daily totals; all operating modes"
      temporal_coverage: "Full matched production campaign; record dates and idle/startup periods"
      site_scope: "Selected route and attributable on-site utility operations"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration; supplier definition; enthalpy calculation; allocation and balance residual"
    - protocol_id: cp_water
      process_id: "p1"
      flow_role: "fresh_water; untreated_effluent; final_liquid_water; evaporated_water"
      record_type: "water-meter and water balance"
      raw_fields: "fresh inlet; internal loops; pre/post treatment flow; as-sent wastewater and final-discharge liquid mass/volume, representative liquid/water-component densities at actual state, measured water fraction and receiver quantity basis; condensate; water in pulp/sludge/reject; evaporation; storage; Q; receiver"
      collection_method: "Calibrated flow meters and measured stream moisture; independent supply/discharge and storage reconciliation; measured evaporation or uncertainty-bounded water-balance residual"
      unit: "m3; kg"
      frequency: "Continuous/daily; each residue batch"
      temporal_coverage: "Full matched production campaign; record dates and idle/startup periods"
      site_scope: "Whole foreground water circuit and actual treatment boundary"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter/sample records; measured density for mass-volume conversion; balance uncertainty"
    - protocol_id: cp_chemicals
      process_id: "p1"
      flow_role: "chemical and PE-film inputs"
      record_type: "weighed dose and supplier specification"
      raw_fields: "separate chemical identity; solution mass; active fraction; density; silicate modulus; purity; dose stage; polymer; film mass; stock; Q"
      collection_method: "Calibrated dosing scales/meters reconciled with receipts and stock; supplier assays; supplied-solution quantities distinguished from active substance and dilution water"
      unit: "kg; fractions"
      frequency: "Each dose/batch; campaign stock totals"
      temporal_coverage: "Full matched production campaign; record dates and idle/startup periods"
      site_scope: "Each actual atomic chemical and packaging input"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Assays/SDS; polymer/film verification; dose calibration; no source recipe copied"
    - protocol_id: cp_residues
      process_id: "p1"
