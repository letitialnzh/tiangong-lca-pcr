  calculation_rules:
    - id: campaign_normalization
      applies_to: "all inventory rows"
      rule: "a = A / Q; A is an attributable measured campaign exchange in its declared unit; Q is accepted composition-compatible delivered pulp in kg. Retain full physical quantities before burden allocation."
      inputs:
        - A
        - Q
        - cp_product
      output: "Exchange per 1 kg reference flow"
      source_ids:
        - eu-pulp-paper-bref-2015
    - id: dry_material_balance
      applies_to: "recovered_paper; finished_pulp; pulping_reject; deinking_sludge; primary_treatment_sludge; biological_treatment_sludge; captured_dust"
      rule: "D = W × (1 − w); W is separately measured wet mass, w is measured water mass fraction. F = D × f, where f is measured dry-fibre fraction, not an assumption that all dry solids are cellulose. Dry-fibre yield = accepted output F / consumed feed F; dry-solids yield = accepted output D / consumed feed D. Include storage and off-spec stock changes."
      inputs:
        - W
        - w
        - f
        - cp_feed
        - cp_product
        - cp_residues
      output: "Separate physical fibre and dry-solids balances; no universal yield"
      source_ids:
        - eu-pulp-paper-bref-2015
    - id: water_load
      applies_to: "cod_water; suspended_solids; nitrogen_water; phosphorus_water"
      rule: "L = sum(C_i × V_i × 0.001), for compatible concentration C_i in mg/L and interval volume V_i in m3; L is kg of the declared analytical species/indicator. Normalize L / Q once. Do not sum concentration averages without matched flow."
      inputs:
        - C_i
        - V_i
        - cp_discharge
        - Q
      output: "Final direct discharge load per reference flow"
      source_ids:
        - eu-pulp-paper-bat-2014
    - id: physical_balances
      applies_to: "P1"
      rule: "For conserved elemental carbon: measured inputs = all physical carbon outputs + stock change; reactions change species/phase, not an elemental-carbon offset. Dry-solids and water ledgers separately include independently measured or supported transformations and actual oxygen/reaction-water terms; internal returns cancel. Carbon outputs include fibre, residues, wastewater and gaseous species with their own elemental-carbon fractions. Disclose balance residual and measurement uncertainty; do not force closure by inventing CO2 or yield. Keep the allocation burden ledger separate."
      inputs:
        - cp_feed
        - cp_product
        - cp_water
        - cp_residues
        - cp_air
      output: "Unallocated physical balances and explained residual"
      source_ids:
        - eu-pulp-paper-bref-2015
    - id: liquid_waste_mass
      applies_to: "untreated_effluent"
      rule: "Native as-sent liquid mass m = sum(V_i m3 × measured rho_i kg/m3), or calibrated directly measured mass; normalize m/Q once. Water mass = m × measured water fraction; keep volume for treatment/indicator loads and do not assume density1000 or all wastewater is water."
      inputs:
        - cp_water
        - "actualT/composition/density"
        - Q
      output: "Nativekg per 1kg reference flow"
      source_ids:
        - eu-pulp-paper-bref-2015
    - id: road_freight_quantity
      applies_to: "inbound_freight"
      rule: "F = sum(payload kg × actual km); 1 t*km = 1000 kg*km. Native service amount is F/Q once, with actual load/empty-return/provider-gate convention and no duplicate fuel/transport."
      inputs:
        - cp_transport
        - Q
      output: "Nativekg*km per 1kg reference flow"
      source_ids:
        - eu-pulp-paper-bref-2015
    - id: purchased_net_heat
      applies_to: "purchased_heat"
      rule: "NetMJ = (sum(delivered steam kg × common-reference enthalpy kJ/kg) - sum(return condensate kg × return enthalpy kJ/kg) - losses kJ not already in the delivery measurement)/1000; normalize once by Q. Verify explicit provider net-heat versus source NCV reference correspondence; no heating-value/efficiency default."
      inputs:
        - cp_utilities
        - "state/enthalpy/reference agreement"
        - Q
      output: "Verified netMJ per 1kg reference flow"
      source_ids:
        - eu-pulp-paper-bref-2015
    - id: final_water_component
      applies_to: "final_liquid_water"
      rule: "M_liquid = sum(V_liquid_i × measured rho_liquid_i) or measured final liquid mass; M_water = sum(M_liquid_i × measured water fraction_i); V_water = sum(M_water_i / compatible rho_water_i). Density states and water-content method are independently validated; native V_water/Q once. Keep bulk V_liquid for COD/TSS/N/P loads; do not assume all effluent is water or a default density of 1000 kg/m3. Reconcile actual treatment branches and receiving media."
      inputs:
        - cp_water
        - cp_discharge
        - "water fraction"
        - "compatible density"
        - Q
      output: "Actual water-component m3 per 1 kg reference flow"
      source_ids:
        - eu-pulp-paper-bref-2015
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "P1"
      requirement: "Confirm actual route and each atomic flow; unresolved UUIDs remain specific named exchanges and block claims of complete identity linkage, not silently zero quantities."
