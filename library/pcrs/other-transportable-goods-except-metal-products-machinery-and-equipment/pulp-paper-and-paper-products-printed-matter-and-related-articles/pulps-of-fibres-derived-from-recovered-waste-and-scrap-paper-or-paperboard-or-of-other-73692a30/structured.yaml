      evidence: "All collection protocols"
    - id: quality_evidence
      applies_to: "P1"
      requirement: "Use actual foreground amounts; published historical or producer cases do not establish a universal dose, fibre yield, energy or water factor. Report detection limits, substitutions, uncertainty and missing flow/quantity compatibility."
      evidence: "eu-pulp-paper-bref-2015; epa-ap42-gas-2026"
    - id: quality_allocation
