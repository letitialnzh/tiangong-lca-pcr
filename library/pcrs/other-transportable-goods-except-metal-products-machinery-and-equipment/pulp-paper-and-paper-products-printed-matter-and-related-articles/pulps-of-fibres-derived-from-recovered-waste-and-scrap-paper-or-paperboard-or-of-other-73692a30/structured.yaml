      raw_fields: "source stage/collector; externally dispatched versus internally returned material; stock and tare; wet/dry mass; fibre; ash; carbon; contaminants; hazard; dewatering; receiver/treatment; storage; Q"
      collection_method: "Calibrated separate stream weighing; representative dry matter/composition/carbon analyses; shipment/receiver reconciliation. Distinct sludge types remain separate and further split when physically separately dispatched"
      unit: "kg; fractions"
      frequency: "Each batch/dispatch; campaign reconciliation"
      temporal_coverage: "Full matched production campaign; record dates and idle/startup periods"
      site_scope: "Actual rejects, deinking sludge, actual on-site treatment sludge and separately captured dust"
