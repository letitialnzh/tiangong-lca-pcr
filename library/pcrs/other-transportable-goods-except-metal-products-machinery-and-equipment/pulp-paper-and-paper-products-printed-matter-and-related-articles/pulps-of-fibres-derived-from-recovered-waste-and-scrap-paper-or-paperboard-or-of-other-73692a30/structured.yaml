      requirement: "Retain full physical flows and stage links alongside burden allocation; document receiver function and recycled-input convention and test credit double counting."
      evidence: "eu-pef-annex-2021"
validation_rules:
  - rule_id: validation_rule_1
    applies_to: "foreground_dataset_conformance"
    rule: "Reject a data package that lacks reference qualifiers, measured accepted output Q, actual input composition or dry-fibre/dry-solids yield basis. Check every exchange denominator against 1 kg qualified delivered pulp and every internal transfer at both ends. Verify utilities by stage, gas/steam supplier quantity definitions and electricity voltage; unresolved steam basis or NOx-equivalence stays pending."
    source_ids: []
  - rule_id: validation_rule_2
    applies_to: "foreground_dataset_conformance"
    rule: "Check that coarse reject, deinking sludge, treatment sludge and wastewater have independent quantities and receivers; final direct-water emissions apply only to the on-site treatment route. Elementary identities require the actual medium/submedium and species or analytical indicator. The listed unspecified outdoor-air/water compartment is not a substitute for a known specific receptor: select and direct-read the matching subcompartment for that dataset. No correction flow is accepted. PM2.5, PM2.5–PM10 and >PM10 are disjoint; do not add a cumulative PM10 or total dust row on top. Retain biogenic CO2 in LCI. Source-specific toxic substances require separate rows even when COD/TN/TP are reported. Missing measurement, identity, speciation or applicable flow coverage remains incomplete, with checks performed/skipped and reasons disclosed."
    source_ids: []
