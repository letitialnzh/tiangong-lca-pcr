review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  methodology_review: "pending independent scientific review; no publication approval"
  scope_decision: "Only washed, bleached, deinked recovered-paper pulp with a verified dried market-delivery basis. Non-deinked board pulp and primary nonwood plant pulp remain outside this record. CPC 32114 is broader; the mapping covers a narrower subset. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  reference_identity: "35b4a2f9-d344-4cc9-85a1-8eb4039ef21c includes deinking in its generalComment and washing/bleaching in its route. Its nominal 90% paper-fibre/10% moisture state must be reconciled with measured fibre, ash, nonfibre material and supplier quantity definitions; dry solids are not automatically paper fibre."
  unresolved_flow_uuids:
    - row_id: "silicate_solution"
      reason: "Only >99.5% melting-route sodium silicate found; solution comment does not override conflicting concentration/state metadata. Aqueous solution mass remains unverified; do not invent conversion or chemical recipe."
  quantity_compatibility:
    - row_id: "gas"
      issue: "Volume/m3 identity verified; supplier reference T/P, wet/dry composition and compressibility must match site records. Nonreference mass coefficient is not density."
    - row_id: "nox_air"
      issue: "NOx identity has Mass/kg, not a verified NO2-equivalent quantity definition; monitoring, LCI and LCIA basis compatibility must be demonstrated. Excludes N2O; no parallel NO/NO2 total."
    - row_id: "finished_pulp"
      issue: "Nominal fibre/moisture metadata is an identity qualifier, not a universal recipe or a measured yield; actual supplier tolerance and composition compatibility are collection requirements."
    - row_id: "purchased_heat"
      issue: "e754 generic industrial heat Product NCV/MJ is conditional physical supply identity, not proof of delivered net enthalpy. Actual supplier gate/region/year, steam/return state/common-reference enthalpy and provider net quantity agreement remain required; no fixed pressure or GCV substitution, no double loss subtraction."
    - row_id: "inbound_freight"
      issue: "4f1 road-freight native mass*distance kg*km,1t*km=1000kg*km. Verify actual diesel vehicle/payload/distance/load/empty-return/provider region/year/service basis and absence of upstream duplication; no assumed case distance or fuel."
    - row_id: "untreated_effluent"
      issue: "bdf industrial liquid waste native Mass/kg; measure as-sent mass or actualV*rho(T/composition), water fraction and contaminant/species basis. Actual accepting external-treatment receiver/gate/reference quantity required; not environmental discharge or default1000density. Generic hazard wording does not establish legal hazard classification."
    - row_id: "pulping_reject"
      issue: "851 industrial-solid locator restricted to one actual mixed coarse recovered-paper pulper/screen reject, measured wet/dry/fibre/plastic/metal/ash/ink/carbon/hazard and lawful receiver/provider treatment/Mass compatibility. Internal returns are not exported waste."
    - row_id: "flotation_soap"
      issue: "d145 broad Sodium carboxylate conditionally locates actual single sodium oleate. Source has no CAS or exact species assay; actual supplier/SDS must prove oleate/Na identity, actualCAS143-19-1, supplied form/active fraction/water/additives and Mass/gate/year compatibility. No fabricated raw CAS, purity, recipe or substitute acid/other surfactant."
    - row_id: "captured_dust"
      issue: "Conditional actual externally dispatched industrial-collector nonmetal dust2a, measured as-collected mass/moisture/fibre/minerals/ink/adhesive/carbon/contamination, collection stage/stock/internalreturn and lawful receiver/provider route/Mass basis. No default generation, collection percentage or positive amount; actual absence screening and separate PM/return accounting."
    - row_id: "electricity"
      issue: "Raw CN user consumption mix1–35kV; actual supplier/region/year/voltage/loss/gate/MJ-reference compatibility, not globally applicable background."
    - row_id: "fresh_water"
      issue: "Raw HK Hong Kong water-treatment supply; actual supplier/basin/treatment/region/year/gate/Volume compatibility. Secondary1000kg/m3 is not actual density."
    - row_id: "peroxide_solution"
      issue: "Raw CN textile-use context and at-plant inorganic50%aqueous reagent; actual industrial grade/stabilizers/formulation/route/region/year/whole-solution Mass/gate needed. Textile case quantities/background are not pulp defaults."
    - row_id: "final_liquid_water"
      issue: "Conditional actual liquid water component after on-site treatment/direct outfall. a387 unspecified medium is provisional only; actual named receptor/location must be established, known freshwater/marine must use verified specific identities consistent with COD/TSS/N/P. External-treatment waste branch remains distinct/actual measured split. Determine actual water mass from measured final liquid mass and water fraction, then compatible water-component density/state to nativeVolume; total mixed wastewater mass/volume is not pure water. Unknown density/fraction/media remains dataset gap; no1000default."
  source_metadata_caveats:
    - row_id: "pe_film"
      issue: "Name/CAS 9002-88-4/comment establish PE film but CPC29220 is misplaced; verify supplied polymer/film and upstream dataset, retain source-classification clarification debt."
    - row_id: "phosphorus_water"
      issue: "Direct unspecified-water total phosphorus record has no Chinese baseName; preserve original English display and disclose missing Chinese name."
  conditional_particle_screening: "Original three disjoint PM rows cover actual external releases. Independently queried captured_dust adds only actual externally dispatched collector material; internal fibre return and collected mass are separately metered and are not air PM. BAT42 supports recovered-paper-yard screening; BREF7.1.10 finished-paper cutting is not used as pulp-drying evidence/default. No positive dust amount assumed."
  integration_review: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate. Shared alias/catalog/coverage integration is governed by those accepted decisions; regenerate and validate derivatives after source changes. Independent methodology review and existing source/provider gaps remain separate requirements."
