      record_type: "monitoring or site carbon/nitrogen balance"
      raw_fields: "gas species; gas volume; concentration; wet/dry T/P; captured/oxidised/fugitive quantity; fossil/biogenic carbon; dissolved/sludge carbon; nitrogen transformation; molecular basis; uncertainty; period"
      collection_method: "Measure relevant actual treatment/storage gas releases or use a traceable site-specific carbon/nitrogen model with measured inputs, documented conversion and uncertainty. Preserve origin split and identify unknown speciation; no generic positive factor."
      unit: "kg"
      frequency: "representative process cycle, including upset/storage events"
      temporal_coverage: "same reporting period, covering actual grade production and operating changes"
      site_scope: "declared mill and route; treatment receiver separately identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; methods; representative sampling; balances; uncertainty"
  calculation_rules:
    - id: period_normalization
      applies_to: "all inventory rows"
      rule: "For each stream, divide the attributable reporting-period exchange quantity by the net accepted paper output in kg from the same period; express the result per 1 kg reference flow. Do not divide by design capacity or average daily intensities."
      inputs:
        - "period exchange quantity"
        - "same-period net paper kg"
      output: "exchange per 1 kg reference flow"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: dry_matter_reconciliation
      applies_to: "nssc_pulp, fluting_output, screen_reject, primary_sludge, biological_sludge"
      rule: "Dry solids equal measured wet mass multiplied by measured solids fraction. Supplier AD/oven-dry basis conversion requires its documented reference dryness; separately account carried water. Net reference output remains actual accepted paper mass at declared moisture."
      inputs:
        - "wet mass"
        - "measured solids"
        - "supplier basis"
      output: "separate wet/dry and carried-water records"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: electricity_conversion
      applies_to: "paper_electricity, ww_electricity"
      rule: "Convert measured kWh to MJ by multiplying by 3.6; retain the selected Net calorific value platform property label without treating electricity as a fuel. Reconcile attributable losses once against the site supply meter."
      inputs:
        - "meter kWh"
        - "site loss reconciliation"
      output: "MJ"
      source_ids: []
    - id: water_pollutant_load
      applies_to: "cod_water, bod_water, tss_water, tn_water, tp_water"
      rule: "For matching sampling intervals, multiply measured concentration in mg/L by corresponding flow in m3 and divide by 1000 to obtain kg; sum interval loads before dividing by same-period net accepted paper kg. Preserve oxygen/N/P/solids analytical bases and detection limits."
      inputs:
        - "matching concentration"
        - "effluent volume"
        - "net paper kg"
      output: "kg per 1 kg reference flow"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: steam_basis_reconciliation
      applies_to: "drying_steam, condensate_return"
      rule: "Using one common reference state, derive H_net from actual supplied steam enthalpy flow minus returned enthalpy flow and undelivered thermal losses within the supplier boundary, counting each loss once. q_heat=H_net*k_bg/P, with P net accepted paper kg and k_bg documented provider-reference GCV MJ per net delivered MJ. Unknown k_bg leaves background linking incomplete; no fuel calorific ratio, default one or source benchmark substitutes for it. Preserve steam/condensate kg separately and do not credit return heat again after subtracting it."
      inputs:
        - "steam and condensate records"
        - "supplier basis"
        - k_bg
        - P
      output: "provider-reference MJ per 1 kg reference flow; separate physical mass ledger"
      source_ids:
        - jrc-pulp-paper-bref-2015
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: quality_route
      applies_to: "nssc_pulp"
      requirement: "Confirm actual fibre species, virgin status, sodium-NSSC and recovery system; similar strength or CPC label is insufficient."
      evidence: "supplier records and route-specific upstream data"
    - id: quality_balance
      applies_to: "all inventory rows"
      requirement: "Use complete campaign totals, stock changes and stage records, matched wet/dry quantity definitions, measured uncertainty and residual reconciliation; no invented balancing stream."
      evidence: "cp_output and all applicable protocols; jrc-pulp-paper-bref-2015"
    - id: quality_gap
      applies_to: "all inventory rows"
      requirement: "Disclose exact identity and background gaps independently, all additional actual chemicals/species and sampling omissions; unknown is not absence."
      evidence: "supplier/laboratory records, process map and completeness ledger"
validation_rules:
  - rule_id: validate_scope
    applies_to: "dataset applicability"
    rule: "Verify virgin hardwood sodium-NSSC fibre and stated finishing/utility route. Different fibre/pulping methods require independent recipes, emission coverage and upstream data; no grade label proves equivalence."
    source_ids:
      - jrc-pulp-paper-bref-2015
      - valmet-nssc
  - rule_id: validate_denominator
    applies_to: "all inventory rows"
    rule: "Exactly one reference output is 1 kg net accepted paper. All exchange quantities and protocol aggregation use this same reference; gross reel/core mass, installed capacity, internal broke and wet-pulp tonnes cannot replace net accepted paper mass."
    source_ids:
      - jrc-pulp-paper-bref-2015
  - rule_id: validate_utilities
    applies_to: "background linking"
    rule: "Confirm grid supply voltage/loss boundary, water supply route and steam pressure, saturation, return and quantity basis. Identity UUIDs and reference properties alone do not establish background compatibility; unresolved supply definitions block complete dataset linking."
    source_ids:
      - jrc-pulp-paper-bref-2015
  - rule_id: validate_balance
    applies_to: "physical links and accounts"
    rule: "Reconcile wet/dry fibre, chemicals, product moisture, water, sludge, air losses, carbon and energy. raw_effluent transfer is equal at both ends; internal recovery is not an external purchase or release. Show balance residuals against measured uncertainty; do not impose an invented universal tolerance."
    source_ids:
      - jrc-pulp-paper-bref-2015
  - rule_id: validate_emissions
    applies_to: "elementary exchanges"
    rule: "Check receiving medium, species, fossil/biogenic origin and molecular/element/oxygen basis. Use disjoint PM fractions and retain collected solid dust separately. COD/BOD and nutrient totals are analytical indicators, not sums of additive pollutant masses; known specific species cannot be hidden or charged twice. Retain biogenic CO2 in LCI."
    source_ids:
      - jrc-pulp-paper-bref-2015
  - rule_id: validate_gaps
    applies_to: "completeness"
    rule: "Blank UUIDs, unmeasured exchanges, unknown speciation, missing providers and unsupported conversions remain explicit. Zero needs a measured or justified non-occurrence record; missing is not zero. An authored PCR is guidance for collection, not proof of a completed plant LCI or scientific approval."
    source_ids:
      - jrc-pulp-paper-bref-2015
published_dataset_profile:
  dataset_role: "secondary_dataset; background_dataset"
  downstream_use: "Route- and grade-matched fluting input to a corrugated-board model after complete evidence-based foreground production"
  allowed_use: "Declared uncoated virgin-hardwood NSSC reels with verified upstream and utility/treatment links"
  excluded_use: "Full CPC 32134 average; straw/recycled/CTMP/kraft substitution; finished board/box output; universal recipe; incomplete cradle-to-gate LCI"
  required_metadata: "Qualifiers, reporting/site/technology scope, unallocated physical map and attributed burden account, suppliers, quantity bases, methods, boundary, allocation and update date"
  required_quality_disclosure: "Uncertainty, temporal representativeness, all UUID/provider/speciation gaps, substitutions, omitted scopes, balances and measured versus modelled quantities; no methodology-review claim"
  update_trigger: "Fibre/pulping/recovery change; formulation or sizing change; utility supplier/pressure change; treatment/receiver change; product specification or material measurement change"
data_sources:
  - id: "jrc-pulp-paper-bref-2015"
    type: "official_guidance"
    reference: "JRC, Best Available Techniques Reference Document for the Production of Pulp, Paper and Board (2015). https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Sections 2.2.2.1.4–1.5 (net production and water-load monitoring, PDF pp86–88); 4.1.1.5 and Figure 4.2 (NSSC, PDF pp413–414); 7.1.1–4, 7.1.10–11 and containerboard description (PDF pp698, 700, 702–704, 708, 715). Qualitative process and measurement support; no historical quantities or BAT-AEL defaults."
  - id: "fefco-paper-production"
    type: "official_guidance"
    reference: "FEFCO, Paper production process. https://www.fefco.org/lca/dscription-of-production-system/paper-production"
    used_for: "Primary versus recovered fluting, NSSC/papermaking sequence, single-ply medium, winder and shipment before corrugation. Typical integrated-mill description is not evidence that this foreground contains pulping or that purchased-pulp mills are typical. Retrieved 2026-10-12."
  - id: "valmet-nssc"
    type: "literature"
    reference: "Valmet, NSSC pulping. https://www.valmet.com/pulp/mechanical-pulping/nssc-pulping/"
    used_for: "Manufacturer process description supports hardwood sulphite/carbonate impregnation, cooking, refining/washing and fluting applicability. Supplier operating times, temperatures and energy figures are not adopted as generic recipe or factors. Retrieved 2026-10-12."
  - id: "ec-pef-2021-multifunctionality"
    type: "official_guidance"
    reference: "European Commission, Recommendation (EU) 2021/2279, Annex I section 4.5, PDF pp63–64. https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "General allocation hierarchy only; no claim of full PEF conformity or default fraction."
