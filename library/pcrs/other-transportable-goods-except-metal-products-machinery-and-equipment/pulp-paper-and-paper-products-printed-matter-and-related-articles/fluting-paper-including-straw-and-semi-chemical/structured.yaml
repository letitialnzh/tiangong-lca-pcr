allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "shared production burdens"
    rule: "First isolate measured papermaking, utilities and treatment; examine subdivision or system expansion before allocation. Then use a causally justified physical relation; economic allocation is a disclosed fallback with reasons, same-period prices and sensitivity. No fixed allocation fraction is prescribed."
    source_ids:
      - ec-pef-2021-multifunctionality
  - rule_id: allocation_physical
    applies_to: "physical and burden accounts"
    rule: "Keep unallocated fibre, water, carbon and energy balances separate from the attributed environmental-burden account. Preserve measured physical co-product outputs and equal internal links; do not multiply physical output by an allocation fraction. Assign attributable burdens once, with residual allocation sums and uncertainty reconciled."
    source_ids:
      - ec-pef-2021-multifunctionality
      - jrc-pulp-paper-bref-2015
  - rule_id: allocation_residuals
    applies_to: "broke and sludge"
    rule: "Internal broke/white-water recovery is not a co-product. Determine waste versus co-product status from actual quality, legal/receiver acceptance and destination; a sale price does not establish displacement. No recycling or steam-return credit without the selected system model and compatible receiver evidence."
    source_ids:
      - ec-pef-2021-multifunctionality
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "nssc_papermaking"
      flow_role: "fluting_output"
      record_type: "weighing"
      raw_fields: "grade; reel id; net paper kg; core/wrap tare; moisture; grammage; thickness; CMT/SCT test method; reporting period"
      collection_method: "Calibrated reel weighing after the final slitter-winder; traceable tare and accepted/rejected lot records; sample moisture and purchaser quality by actual test protocol."
      unit: "kg"
      frequency: "each reel and representative grade/moisture lot"
      temporal_coverage: "same reporting period, covering actual grade production and operating changes"
      site_scope: "declared mill and route; treatment receiver separately identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; methods; representative sampling; balances; uncertainty"
    - protocol_id: cp_inputs
      process_id: "nssc_papermaking"
      flow_role: "pulp and each actual chemical/water/packaging input"
      record_type: "receipt and meter"
      raw_fields: "supplier; input grade/route; mass or volume; solids/moisture; formulation/carrier; tank/inventory change; period; meter id; background reference basis"
      collection_method: "Weigh deliveries, reconcile opening/closing stocks and stage dose records, meter fresh network water; preserve each chemical as a separate exchange. Inspect pulp supplier NSSC/recovery chain."
      unit: "kg; m3"
      frequency: "continuous meters; each delivery and batch"
      temporal_coverage: "same reporting period, covering actual grade production and operating changes"
      site_scope: "declared mill and route; treatment receiver separately identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; methods; representative sampling; balances; uncertainty"
    - protocol_id: cp_utilities
      process_id: "nssc_papermaking"
      flow_role: "steam and electricity"
      record_type: "utility metering"
      raw_fields: "stage kWh; site kWh; voltage; losses; steam kg; delivery pressure/temperature; steam quality; condensate kg/temperature/pressure; supplier net heat definition; period; supplier k_bg; paired enthalpy reference and thermal losses; provider-reference MJ"
      collection_method: "Reconcile calibrated site and stage meters including preparation, drying and finishing; measure paired steam delivery and return conditions; obtain supply definitions before thermal-background linking."
      unit: "kWh; kg; MJ; pressure; temperature"
      frequency: "continuous with campaign checks"
      temporal_coverage: "same reporting period, covering actual grade production and operating changes"
      site_scope: "declared mill and route; treatment receiver separately identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; methods; representative sampling; balances; uncertainty"
    - protocol_id: cp_residuals
      process_id: "nssc_papermaking"
      flow_role: "screen rejects; exported broke; collected dust"
      record_type: "weighing and receipt"
      raw_fields: "separate stream id; wet mass; dry solids; fibre; additives/contamination; recovery or export; receiver; treatment; period"
      collection_method: "Weigh each exported stream and sample its composition; separately log internal wet/dry broke and dust rework. Do not combine screening rejects, paper waste and dust."
      unit: "kg"
      frequency: "each dispatch and representative lot"
      temporal_coverage: "same reporting period, covering actual grade production and operating changes"
      site_scope: "declared mill and route; treatment receiver separately identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; methods; representative sampling; balances; uncertainty"
    - protocol_id: cp_air
      process_id: "nssc_papermaking"
      flow_role: "cutting dust; drying vapour"
      record_type: "release monitoring"
      raw_fields: "source; operating hours; exhaust flow; temperature/pressure; wet/dry basis; size-resolved concentration; collector solids; fugitive estimate method; humidity; period"
      collection_method: "Test actual slitting/rewinding exhaust and fugitive releases after controls; use disjoint aerodynamic particle-size data, paired exhaust conditions and drying-water balance. Document non-occurrence rather than assume zero."
      unit: "kg; gas volume; concentration"
      frequency: "representative stable runs; startup and changes included"
      temporal_coverage: "same reporting period, covering actual grade production and operating changes"
      site_scope: "declared mill and route; treatment receiver separately identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; methods; representative sampling; balances; uncertainty"
    - protocol_id: cp_effluent
      process_id: "effluent_treatment"
      flow_role: "internal transfer and final water/pollutants"
      record_type: "flow and laboratory sampling"
      raw_fields: "inlet/outlet volume; coincident sample concentration; COD method; BOD duration; TSS method; TN organic/inorganic scope; TP as P; receiver; uncertainty; period; rho_eff(T,composition); water mass fraction; rho_water(T); whole-mixture kg; component water volume"
      collection_method: "Calibrated flow meters and flow-weighted representative samples at matched times; retain analytical methods, detection limits and receiving-water evidence. Preserve identical raw-effluent transfer records on both process ends; offsite transfers use receiver records."
      unit: "m3; mg/L; kg"
      frequency: "continuous flow; representative daily composite and event samples"
      temporal_coverage: "same reporting period, covering actual grade production and operating changes"
      site_scope: "declared mill and route; treatment receiver separately identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; methods; representative sampling; balances; uncertainty"
    - protocol_id: cp_ww_inputs
      process_id: "effluent_treatment"
      flow_role: "treatment power and each reagent"
      record_type: "meter and dose ledger"
      raw_fields: "treatment kWh; separate tap-water m3; reagent identity; grade; wet dose; solids/purity; stocks; carrier; period; upstream reference basis"
      collection_method: "Separate treatment power/fresh water from papermaking. Meter dosing and reconcile each real complete chemical/formulation purchase, stock and dose in compatible wet/dry reference units, with actual supplier manufacture/preparation/delivery once; included constituents are analytical balances only. Real separate ingredients and onsite mixing/dilution utilities are independently recorded. A documented supplier-process reconstruction preserves whole supplied quantities and all constituent/preparation/utility/loss burdens without duplicating mill inputs."
      unit: "kWh; m3; kg"
      frequency: "continuous power; each dose/batch"
      temporal_coverage: "same reporting period, covering actual grade production and operating changes"
      site_scope: "declared mill and route; treatment receiver separately identified"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "calibration; traceable receipts; methods; representative sampling; balances; uncertainty"
