      collection_method: "Weigh separately at dispatch and analyse representative composition/dry matter; reconcile primary clarification and biological excess sludge against treatment records."
      unit: "kg"
      frequency: "each export and representative sample"
      temporal_coverage: "same reporting period, covering actual grade production and operating changes"
      site_scope: "declared mill and route; treatment receiver separately identified"
