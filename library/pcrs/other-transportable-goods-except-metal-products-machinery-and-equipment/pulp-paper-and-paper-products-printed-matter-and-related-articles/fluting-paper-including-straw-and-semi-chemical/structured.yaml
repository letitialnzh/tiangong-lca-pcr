system_boundary:
  rules:
    - rule_id: boundary_route
      applies_to: "papermaking"
      rule: "Include receipt/slushing, screening, refining, stock/chemical preparation, forming, pressing, drying, ventilation, water/fibre recovery, slitting/rewinding and dispatch. One aggregate papermaking unit avoids duplicate product outputs; retain independent stage meters and unallocated physical links."
      source_ids:
        - jrc-pulp-paper-bref-2015
        - fefco-paper-production
    - rule_id: boundary_upstream
      applies_to: "pulp supply"
      rule: "This is supplied-pulp papermaking, not an inventory of an integrated NSSC mill. Do not transfer Heinola quantities or imply its integrated site is non-integrated. A linked, qualified upstream pulp module covers cooking, defibration, washing and the actual recovery route; missing burdens are disclosed and block complete cradle-to-gate use."
      source_ids:
        - jrc-pulp-paper-bref-2015
        - valmet-nssc
    - rule_id: boundary_utilities
      applies_to: "utility supply"
      rule: "This route purchases grid electricity, treated network water and drying steam. Onsite fuel-fired boilers, CHP and own abstraction need additional qualified processes and atomic flows; do not omit them while calling this route complete. Match steam pressure and supplier heat/return basis; record no automatic condensate credit."
      source_ids:
        - jrc-pulp-paper-bref-2015
    - rule_id: boundary_treatment
      applies_to: "effluent treatment"
      rule: "Include onsite treatment when present; raw_effluent_out and raw_effluent_in are an equal internal link. For external treatment, remove the onsite module from the instantiated model and require a receiver-specific treatment dataset; final emissions belong to the treating unit, never to both."
      source_ids:
        - jrc-pulp-paper-bref-2015
    - rule_id: boundary_exclusions
      applies_to: "downstream conversion"
      rule: "End at saleable unconverted fluting reels. Corrugator conditioning/fluting, adhesive bonding to liners, board cutting and box conversion are separate downstream product systems. Capital and maintenance coverage must follow declared study requirements; any actual recurrent material or emission missing here requires a separately documented atomic row before completeness is claimed."
      source_ids:
        - fefco-paper-production
        - jrc-pulp-paper-bref-2015
boundary_abstraction:
  declared_starting_condition: "Virgin hardwood sodium-NSSC pulp delivered to the papermaking input boundary, with wet/dry basis and supplier chain documented"
  starting_condition_role: "Upstream intermediate supplied pulp; not an exemption for pulping burdens"
  product_classification_scope: "Only the specified NSSC subset of CPC 32134, before corrugation; no full-leaf equivalence"
  recursive_input_rule: "Own wet/dry broke and recovered white-water fibres remain internal; no credit or saleable-output count for recirculation. Purchased finished fluting or externally recovered paper is outside this route."
  upstream_dataset_requirement: "Require route-specific pulp including hardwood sourcing, NSSC chemicals/defibration, actual spent-liquor recovery, emissions and delivery; actual grid, steam, water, chemicals, packaging and waste-treatment providers with compatible quantities"
  disclosure: "Site, period, grade, pulp origin/route, moisture, papermaking and treatment scope, utility delivery/return definitions, internal loops, cutoffs, allocation and gaps; an integrated mill must separately qualify its upstream pulp module before reuse"
