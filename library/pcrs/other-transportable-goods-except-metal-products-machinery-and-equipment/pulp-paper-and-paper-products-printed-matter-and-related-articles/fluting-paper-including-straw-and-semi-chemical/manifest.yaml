review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  independent_scientific_review: pending; authored guidance is not methodology approval
  mapping_review: "CPC 3.0 32134 narrower: virgin hardwood sodium-NSSC fluting from supplied pulp only; Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  unresolved_flow_uuids:
  - row_id: defoamer_pdms
    flow: Polydimethylsiloxane-based aqueous antifoam emulsion
    issue: 'Conditional: an actually used PDMS aqueous antifoam emulsion, with composition, delivered mass and solids
      measured. Neat silicone, silica and silicone adhesive are not the emulsion; no precise UUID is established.
      Other antifoam chemistries need separate rows.'
  - row_id: condensate_return
    flow: Condensate returned to steam supplier
    issue: 'Conditional: measured liquid condensate returned across the boundary to the steam supplier. Record mass,
      temperature and return pressure; match the supplier return convention. Internal condensate circulation is
      an internal link, not a second external utility purchase or credit.'
  - row_id: tss_water
    flow: Suspended solids to fresh water
    issue: Freshwater suspended-solids load based on the actual laboratory method, sample and concurrent effluent
      flow. The available water-unspecified identity is not adopted as a freshwater proxy. Particulate constituents
      already represented individually must not be counted twice.
  background_compatibility_review:
  - All pulp, utilities, formulations and waste receivers require actual primary quantity/background reference compatibility
    before completed dataset use.
  - Paper Pulp and finished-fluting flows are broad physical identities restricted by this PCR, not ready-made sodium-NSSC
    production datasets.
  - Primary and biological sludge share only broad paper-production identity; independent composition/receiver and
    treatment burdens remain required.
  - PE film source CPC classification is inconsistent with physical name/CAS/comment; physical identity conditionally
    retained, source metadata and supplier clarification pending.
  - 'Freshwater COD flow has no Chinese baseName: retain English display with explicit Chinese missing-name note.'
  - 'Nitrogen/phosphorus/COD/BOD are sum indicators: site speciation and LCIA coverage must prevent masking and
    double counting.'
  - Steam physical identity is qualified only with actual delivery/return conditions and supplier k_bg converting
    net delivered enthalpy to its GCV-reference MJ; no assumed conversion or source benchmark. Condensate product
    identity remains unresolved.
  - CN electricity and Hong Kong tap-water source geography require actual supplier compatibility or identity reassessment.
  - Whole wastewater mass and water-component volume require measured density/composition/temperature; preserve
    equal internal transfers without duplicated treatment burdens.
  - Uncoated kraft wrapper uses broad packaging-paper physical identity with incompatible graphic-paper source classification
    retained as metadata debt; supplier furnish, grade and background remain required.
  - Ferric chloride anhydrous solid identity cannot silently represent solution kg; organic source classification
    is conflicting metadata.
  source_limitations:
  - BREF 2015 qualitative original process/measurement evidence, including historical integrated Heinola illustration,
    is not a purchased-pulp factory recipe or current industry average.
  - FEFCO generally describes integrated fluting production; this method declares a supplied-pulp foreground and
    requires the full upstream pulp module.
  - Valmet process evidence has not been adopted as default temperatures, residence time, energy or chemical doses.
