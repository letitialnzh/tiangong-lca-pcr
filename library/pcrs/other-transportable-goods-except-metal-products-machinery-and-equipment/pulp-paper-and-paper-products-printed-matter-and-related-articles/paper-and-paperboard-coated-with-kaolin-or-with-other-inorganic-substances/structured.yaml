allocation_rules:
  - rule_id: allocation_subdivide
    applies_to: "all inventory rows"
    rule: "Subdivide by physically recorded campaign/grade and meter scope first. Attribute kitchen/dryer/finisher and shared support by documented causal physical drivers using cp_energy/cp_material. A chosen driver needs plant evidence and uncertainty disclosure; this PCR supplies no generic allocation fraction."
    source_ids:
      - jrc-paper-bref-2015
  - rule_id: allocation_burdens
    applies_to: "all inventory rows"
    rule: "Maintain a full pre-allocation physical flow/mass/water/carbon ledger and a separate attributed environmental burden ledger. Preserve whole output/waste/packaging and equal internal transfers; do not multiply physical co-product quantities by a burden-allocation fraction."
    source_ids: []
  - rule_id: allocation_recovery
    applies_to: "broke; coating_reject; captured_dust; packaging"
    rule: "Internal rework/recovery is neither a purchased avoided-product credit nor an external output. Record external waste treatment and separately identified actual saleable downgraded material according to legal product/waste status, receiver-accepted specifications, actual function/use and recipient contracts. Payment alone does not establish product status. A genuine product requires its own compatible Product flow identity; do not relabel a Waste flow exchange merely because it earns revenue. If a saleable co-product remains inseparable, document a reviewed physical relationship or justified economic sensitivity before dataset acceptance; never relabel waste solely to earn credit."
    source_ids: []
  - rule_id: allocation_packaging
    applies_to: "wrapper_shipped; film_shipped; core_shipped"
    rule: "Shipped ancillary packaging is not a marketable co-product and creates no allocation share. Reuse burdens follow a documented return/life evidence ledger, while full physical masses remain unchanged."
    source_ids: []
dataset_production:
  collection_protocols:
    - protocol_id: cp_output
      process_id: "coating"
      flow_role: "accepted paper"
      record_type: "weighing and quality records"
      raw_fields: "campaign; grade; net paper P; gross/tare/core/wrapper masses; accepted stocks; moisture w; grammage; area A; coating sides/layers; finish; acceptance/reject record"
      collection_method: "Calibrated reel/sheet weighing with component tare; representative sealed moisture/solids samples and validated paper/coating-appropriate laboratory method; cross-check moisture scanner and area/grammage"
      unit: "kg; m2; g/m2; wet-basis fraction"
      frequency: "Each accepted lot and representative samples"
      temporal_coverage: "Full declared reporting period"
      site_scope: "Selected coating line and same accepted grades"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Scale calibration, sample custody, laboratory method/volatile correction and acceptance specification"
    - protocol_id: cp_material
      process_id: "coating"
      flow_role: "base paper and blade"
      record_type: "receipts, stock, issues and maintenance"
      raw_fields: "lot; actual grade/composition; opening/closing stock; receipts; returns; line issues; net mass; moisture; blade alloy/treatment and replacements"
      collection_method: "Weigh or trace supplier-certified receipt/issue masses; reconcile stock and maintenance records; verify supplier production scope"
      unit: "kg"
      frequency: "Each lot/issue/change"
      temporal_coverage: "Same declared reporting period"
      site_scope: "Selected line/campaign and attributed shared maintenance"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Supplier CoA, invoices, calibrated scales and reconciliation"
    - protocol_id: cp_recipe
      process_id: "coating"
      flow_role: "each pigment, binder, additive or complete colour"
      record_type: "lot recipe and analytical records"
      raw_fields: "supplier formulation; SDS/CoA; constituent identity; batch wet mass; solids/water/active fractions; pigment route/size; each face/layer; retained dry coat; residual monomers; stocks; recirculation/recovery; background basis"
      collection_method: "Verify actual recipe by supplier documents and lot assays; weigh each preparation addition; measure solids/moisture and retained coat by validated grade-specific differential/assay methods; distinguish complete procurement from component reconstruction"
      unit: "kg; g/m2; dimensionless fractions"
      frequency: "Each recipe/lot/layer and change"
      temporal_coverage: "Same declared reporting period"
      site_scope: "Actual coating kitchen, each coating face/pass and its purchased lots"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Lot assays, recipe reconciliation, background boundary and retained-coat tests"
    - protocol_id: cp_energy
      process_id: "coating"
      flow_role: "electricity"
      record_type: "meter records"
      raw_fields: "voltage; supplier/mix/year; import meter; stage submeters; cooker/heater/fans/coater/calender/slitter/extraction/packing; startups; shared drivers"
      collection_method: "Read calibrated electrical meters; reconcile master and stage totals and justified causal shared-use attribution; record actual dryer and unheated calender/bypass equipment"
      unit: "kWh; MJ"
      frequency: "Continuous with campaign reconciliation"
      temporal_coverage: "Same declared reporting period"
      site_scope: "Entire selected foreground including actual stage support"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meters, utility contracts, equipment heat-source records and shared-use evidence"
    - protocol_id: cp_water
      process_id: "coating"
      flow_role: "fresh tap water"
      record_type: "meter and density records"
      raw_fields: "fresh volume or mass; actual temperature/density; kitchen/cleaning use; recipe-carrier water; recirculation; opening/closing tanks; water recovery"
      collection_method: "Use calibrated meter/weighing and measured supply density at state; keep fresh, carrier, internal and recovered water separate"
      unit: "kg; m3; kg/m3"
      frequency: "Continuous meters and representative density samples"
      temporal_coverage: "Same declared reporting period"
      site_scope: "Actual fresh-water interface and kitchen/cleaning"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Meter calibration, density samples and water reconciliation"
    - protocol_id: cp_pack
      process_id: "coating"
      flow_role: "each wrapper, film and core input/output"
      record_type: "purchase and dispatch ledger"
      raw_fields: "material; construction; physical mass; opening/closing stock; issues; shipped mass; damage/discards; full returned core mass; reuse cycles; supplier"
      collection_method: "Weigh each actual packaging component and reconcile purchases, stocks, dispatch and returns independently of net paper mass"
      unit: "kg"
      frequency: "Each shipment/lot and return"
      temporal_coverage: "Same declared reporting period"
      site_scope: "Packing and dispatch/returns interfaces"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Mass/tare records, supplier specifications and separate return/discard receipts"
    - protocol_id: cp_waste
      process_id: "coating"
      flow_role: "each external waste stream"
      record_type: "weighing, analysis and recipient records"
      raw_fields: "whole wet mass; actual density/volume; water/solids; fibre/pigment/binder; COD and relevant species/load; blade alloy/coating; recipient and treatment; internal recovery"
      collection_method: "Separately weigh external broke, concentrated colour, dilute wash, captured dust and worn blades; analyze representative fractions and recipient-required pollutants; validate transport/treatment receipts"
      unit: "kg; m3; kg/m3; mg/L"
      frequency: "Each dispatch plus representative samples/cleaning events"
      temporal_coverage: "Same declared reporting period"
      site_scope: "Each actual waste exit and recipient"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Weighbridge/lab reports, treatment contracts, contaminant acceptance and stock closure"
    - protocol_id: cp_air
      process_id: "coating"
      flow_role: "each actual outdoor elementary emission"
      record_type: "emissions testing and water balance"
      raw_fields: "dryer/cutting/handling path; controls; outdoor medium; exhaust flow; wet/dry standard state; concentrations/species; times; water balance; humidity; exclusive particle bins; detection/uncertainty"
      collection_method: "Use representative accredited source/fugitive monitoring and time/flow-integrated mass; validate evaporation with measured water balance and humidity; match particle methods/periods before subtraction; preserve all detected species"
      unit: "kg; mg/m3; m3/time; time"
      frequency: "Representative campaigns/control states with operating duration"
      temporal_coverage: "Same declared reporting period"
      site_scope: "Actual post-control exhaust and fugitive site exits"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Sampling/flow method, blanks/detection limits, control operation and mass-balance uncertainty"
  calculation_rules:
    - id: normalize_period
      applies_to: "all inventory rows"
      rule: "n_i = attributable period exchange amount A_i / accepted net paper mass P; record n_i per 1 kg reference flow. P includes actual gate water and coating, excludes all packaging. Reference output is 1 kg."
      inputs:
        - A_i
        - P
        - cp_output
        - "applicable collection protocol"
      output: "n_i"
      source_ids: []
    - id: net_consumption
      applies_to: "input rows"
      rule: "External consumption = opening stock + receipts - closing stock - external returns; reconcile issues, spills and internally recovered quantities separately. Do not add recirculation throughput to external consumption."
      inputs:
        - cp_material
        - cp_recipe
        - cp_water
        - cp_pack
      output: "actual external consumption"
      source_ids: []
    - id: paper_composition
      applies_to: "product"
      rule: "Accepted dry paper = P * (1-w_product); retained dry base solids plus retained dry coating solids must equal that value within documented measurement uncertainty. P*w_product is retained product water. Measure base dry solids and each coating ingredient retention; do not assume every consumed ingredient is retained."
      inputs:
        - cp_output
        - cp_recipe
        - cp_material
      output: "accepted fibre/mineral/polymer/additive and water ledger"
      source_ids: []
    - id: coating_solids
      applies_to: "product; gcc; kaolin; latex; starch; dispersant; lubricant; alkali; defoamer; coating_colour"
      rule: "Retained dry coat = A * sum(c_s,l) / 1000; cross-check with independent ingredient solids input, externally lost solids and colour/paper stock change. Keep actual C1S/C2S layers distinct and whole-colour constituents only in the composition ledger when their complete background is used."
      inputs:
        - cp_recipe
        - cp_output
      output: "retained coating solids and constituents"
      source_ids: []
    - id: water_closure
      applies_to: "evaporated_water; water; effluent"
      rule: "Input water in base paper, every delivered formulation and fresh supply + opening water stocks = retained product water + external waste water fractions + net outdoor evaporation + closing stocks + other measured external water exits. Condensation/internal recovery is not a new external input. Investigate residuals against uncertainty; never force missing data to evaporation."
      inputs:
        - cp_output
        - cp_recipe
        - cp_material
        - cp_water
        - cp_waste
        - cp_air
      output: "separate physical water ledger"
      source_ids: []
    - id: carbon_closure
      applies_to: "base_paper; product; recipe; wastes; styrene"
      rule: "Track biogenic fibre/starch carbon and fossil polymer/additive carbon separately by actual assays or supplier composition, and reconcile product, waste, emission and stock changes. No assumed cellulose-carbon fraction or combustion CO2 is imposed. Upstream/external-treatment datasets must retain their actual biogenic CO2 exchanges even if an impact reporting convention treats them separately."
      inputs:
        - cp_material
        - cp_recipe
        - cp_output
        - cp_waste
        - cp_air
      output: "separate physical carbon ledger"
      source_ids: []
    - id: air_load
      applies_to: "pm25; pm25_10; pm10plus; styrene"
      rule: "For each matched measured species/bin, integrate concentration * compatible exhaust flow * operating duration with recorded unit/state conversions and divide period mass by P. Report fugitive mass separately before summing the same species; do not add VOC totals to speciated VOC or PM10 totals to exclusive bins."
      inputs:
        - cp_air
        - cp_output
      output: "actual speciated outdoor emissions per reference flow"
      source_ids: []
    - id: complete_period_normalization
      applies_to: "all inventory rows"
      rule: "Every existing campaign, batch or lot amount rule and linked collection protocol uses one documented complete reporting-period pool for the same declared product, grade, route, configuration, site and reference state. Accepted-lot wording identifies the denominator only; retain all attributable startup, shutdown, wholly failed or zero-output batches, rejects, work in progress and rework in the raw native-unit numerator records. Count reworked reference product once only when finally accepted. Sum each attributable exchange over this matched pool, divide once by its strictly positive accepted reference-product quantity in the declared denominator unit, and scale to the declared reference quantity. Do not average batch ratios, drop a failed batch, pool unrelated products/periods or replace native numerator units. If the entire matched pool has no accepted output, retain the unnormalized absolute inventory and require review; issue no normalized result or fabricated output. Preserve stock/return and physical-transfer ledgers independently of burden allocation; allocation never removes already-incurred failed/rework activity."
      inputs:
        - "all linked raw collection protocols"
        - "accepted reference-product pool"
        - "stock and rework links"
      output: "native exchange unit per declared reference quantity; zero-output pool remains unnormalized"
      source_ids: []
  data_quality_requirements:
    - id: quality_identity
      applies_to: "all rows"
      requirement: "Verify actual physical material, complete recipe, wet/dry state and every hard native route/concentration/voltage qualification. Resolve blank UUID rows before linking background data; record actual supplier/recipient compatibility separately from identity."
      evidence: "Supplier assays/specifications, native identity and background boundary"
    - id: quality_closure
      applies_to: "all rows"
      requirement: "Reconcile period-specific physical mass, water, carbon, layer retention, equal internal transfers and packaging with uncertainty. Preserve pre-allocation ledger separately."
      evidence: "All protocol records and documented residual investigation"
    - id: quality_emissions
      applies_to: "elementary rows"
      requirement: "Distinguish measured absence, below detection, omitted pathway and missing measurement; quantify compatible particle bins and chemical masses. Add each additional actual detected species as its own row."
      evidence: "Representative monitoring, controls, scope and detection report"
    - id: quality_complete
      applies_to: "all rows"
      requirement: "Declare actual recipe additions, cleaners, blade/roll/knife maintenance, packaging discards and other consumed materials as additional atomic rows when present. This inventory is a selected route core, not permission to omit actual exchanges or infer zero for blanks."
      evidence: "Stock/maintenance/SDS completeness audit"
    - id: quality_sources
      applies_to: "all rows"
      requirement: "Do not transfer historical BREF mill numbers, supplier marketing savings or another product recipe as defaults. Quantitative data use actual recorded period/grade and applicable upstream boundary."
      evidence: "Source applicability and original collection records"
validation_rules:
  - rule_id: validate_reference
    applies_to: "product"
    rule: "Exactly one final reference product output is 1 kg accepted net wet paper. No intermediate output reuses its UUID; packaging is excluded from P and tracked at full mass. Required physical/route qualifiers must be complete."
    source_ids: []
  - rule_id: validate_formulation
    applies_to: "all recipe rows"
    rule: "Require actual constituent identities/assays, C1S/C2S layer masses and retained moisture. Reject double counting complete purchased colour versus included ingredients, arbitrary active/wet conversion, pigment-route substitution or a fabricated recipe."
    source_ids:
      - jrc-paper-bref-2015
  - rule_id: validate_measurement
    applies_to: "all inventory rows"
    rule: "Every row, collection aggregation and calculation must normalize to the same P and period, with the actual native reference property and compatible supplier quantity basis. Unknown density/solids/provider scope stays unresolved."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "coating"
    rule: "Verify actual electric drying, cold calender/bypass and external effluent route. A real boiler/steam/heated calender/onsite treatment/direct discharge cannot be hidden; reject application of this route until complete additional methodology is available."
    source_ids:
      - jrc-paper-bref-2015
      - valmet-electric-coating-drying
  - rule_id: validate_emissions
    applies_to: "elementary rows; captured_dust"
    rule: "Verify species/CAS, outdoor-air receiving subcompartment, property/unit and bound source measurements. Keep captured dust separate from emitted dust, mutually exclusive particle bins and speciated VOC; no correction flow or assumed positive emission. If actual receiving subcompartment is known, use its corresponding verified identity rather than an unspecified-air default."
    source_ids: []
  - rule_id: validate_balances
    applies_to: "all inventory rows"
    rule: "Check physical solids/water/carbon and packaging closures, equal internal links and distinct allocated burdens. Disclose unexplained gaps and uncertainty; do not force a balance by altering output mass or deleting biogenic CO2 from supplier/treatment inventories."
    source_ids: []
  - rule_id: validate_readiness
    applies_to: "all rows"
    rule: "Unresolved flow identities, scientific review, missing actual collection or incompatible background bases must remain explicit. This candidate methodology is not independent approval, actual plant validation or publication."
    source_ids: []
published_dataset_profile:
  dataset_role: "Foreground off-machine coating process; downstream secondary_dataset or background_dataset only after actual data qualification"
  downstream_use: "Declared unprinted mineral-coated paper input to printing/converting; compatible grade and wet-reference basis"
  allowed_use: "Physical subset and actual electric-air/cold-finishing/external-waste route after qualifiers, collection and provider compatibility are complete"
  excluded_use: "Full CPC leaf coverage; integrated paper/pulp or board routes; different heat sources, coatings/lamination; comparative claims across unmatched paper functions; treating candidate status as review/publication"
  required_metadata: "Actual product/site/period; base grade/furnish and suppliers; full wet formulation and layers; moisture/grammage; equipment and energy; measured quantity bases; packing/returns; waste recipients; internal links; upstream references; allocation ledger and original protocols"
  required_quality_disclosure: "Measurement uncertainty/coverage; unmeasured exchanges and blank identities; native metadata defects; provider-basis gaps; source applicability; allocation sensitivity; separate biogenic/fossil carbon; scientific and translation review states"
  update_trigger: "Actual recipe/base grade/layers/moisture/route/supply voltage/provider/treatment/packaging changes; new measurement or contradictory identity evidence"
data_sources:
  - id: "jrc-paper-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Best Available Techniques Reference Document for the Production of Pulp, Paper and Board (2015), DOI 10.2791/370629; [official PDF](https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf), printed pp.48-50, 665, 667-670 (PDF86-88,703,705-708)"
    used_for: "Papermaking monitoring context; broke interface; coating ingredients, application, recovery/wash segregation and possible VOC; calendering and cutting dust. Descriptive route support only: no historical factory values, recipes, efficiencies or BAT limits adopted as generic quantities. Onsite papermaking/broke repulping is excluded here."
  - id: "valmet-electric-coating-drying"
    type: "handbook"
    reference: "[Valmet coating drying for board and paper machines](https://www.valmet.com/board-and-paper/board-and-paper-machines/coating-drying/), section Replacing gas with electricity, publisher page snapshot 2026-10-11"
    used_for: "Electric-heated coating air-dryer capability; no claimed efficiency/savings factor, product-zero-emission claim or particular mill installation. Actual equipment/meter evidence remains mandatory."
  - id: "upm-face-papers"
    type: "handbook"
    reference: "[UPM Specialty Materials Face papers](https://www.upmspecialtymaterials.com/products/paper-catalogue/categories/face-papers/), introductory product portfolio, publisher page snapshot 2026-10-11"
    used_for: "Producer example of C1S/C2S and woodfree uncoated paper market states; no producer recipe, process inventory or proof of this selected factory route."
