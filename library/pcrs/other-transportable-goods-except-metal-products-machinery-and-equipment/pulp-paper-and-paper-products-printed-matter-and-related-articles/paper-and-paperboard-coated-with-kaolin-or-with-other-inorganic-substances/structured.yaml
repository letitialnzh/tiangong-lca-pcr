measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "Reference amount is 1 kg net accepted paper including retained coating and actual water, excluding transport packaging. Collect accepted paper mass P using cp_output. Every inventory quantity and protocol aggregate is per 1 kg reference flow."
  - id: moisture_recipe
    applies_to: "base_paper; product; recipe and wastes"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Use wet-basis water fraction w = water mass / whole wet mass. Dry matter = wet mass * (1-w). Keep base fibre/filler/sizing, coating solids and water distinct. An oven-loss result needs a paper/coating-appropriate validated method and correction for non-water volatiles; do not transplant a wood assay."
  - id: formulation_basis
    applies_to: "gcc; kaolin; latex; starch; dispersant; lubricant; alkali; defoamer; coating_colour"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Declare whole delivered formulation versus isolated active/component basis and supplier reference quantity. Wet latex/dispersions are not dry polymer or mineral mass. Record each actual constituent, active fraction and carrier; never count complete upstream colour and the same included ingredients again."
  - id: water_conversion
    applies_to: "water; effluent"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Convert measured liquid volume by measured actual density at its sampling state. Effluent density is not pure-water density. Composition water fraction remains separate from the whole effluent mass."
  - id: electricity_units
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: ""
    required_unit: "MJ"
    rule: "Native electricity reference property is Net calorific value; convert metered kWh using 3.6 MJ/kWh. This is an energy-unit conversion, not a heating-value or dryer-efficiency assumption. Verify 1-35 kV supply/provider scope."
  - id: coating_area
    applies_to: "product; recipe"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure substrate area A and retained dry coat weight c_s,l for each actual face/layer. Retained coat solids = A * sum(c_s,l) / 1000 when A is m2 and c_s,l is g/m2. Never automatically double a C1S coating quantity to obtain C2S."
  - id: air_bins
    applies_to: "pm25; pm25_10; pm10plus; styrene"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep mutually exclusive particle bins, measured outdoor receiving medium and specified chemical mass definitions. Total VOC/as-carbon is not styrene mass. Quantities, controls and uncertainty require cp_air; no default positive releases."
