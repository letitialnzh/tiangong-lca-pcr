review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  methodology_basis: "JRC pulp/paper BREF 2015 descriptive process and monitoring originals; Valmet electric coating air-drying capability; UPM C1S/C2S market-state evidence; future foreground protocols, no generic recipe or plant quantities."
  mapping_recommendation: "narrower CPC 3.0 32143: purchased woodfree paper, off-machine aqueous GCC/kaolin coating and electric air drying; board, integrated papermaking and incompatible coatings/routes are outside scope. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  independent_review: "Not independently scientifically reviewed or published. Translation alignment is author-checked, not reviewed."
  unresolved_flow_uuids:
    - row_id: "kaolin"
      selected_flow: "Paper-coating grade kaolin pigment"
      reason: "Conditional separate kaolin procurement. Record hydrous/calcined state, grade, mineral purity, particle size and water fraction. Mine-site and other-product hits do not establish a processed coating pigment identity."
    - row_id: "latex"
      selected_flow: "Aqueous carboxylated styrene-butadiene latex"
      reason: "Conditional separately purchased binder formulation: supplier-confirmed carboxylated SB latex with actual solids, water, residual monomers and auxiliaries. Record whole emulsion mass for a matching formulation dataset. The broad two-monomer styrene/butadiene polymer row does not establish this carboxylated aqueous formulation or its concentration."
    - row_id: "lubricant"
      selected_flow: "Calcium stearate coating lubricant"
      reason: "Only if separately added. Identify calcium stearate, grade, actual dispersion composition and active fraction. Neither sodium carboxylate nor calcium phosphate matches. Whole purchased dispersions require formulation-specific background; an active-only reconstruction includes carrier and auxiliaries once."
    - row_id: "blade"
      selected_flow: "Steel paper-coating doctor blade"
      reason: "Conditional actual steel coater blade replacement. Record alloy, any hard surface treatment, dimensions, mass, purchased replacements and service interval. A steel saw blade or machinery component is not a paper-coating blade. Other actual knives, roll covers, lubricant oils or cleaning agents require separately specified rows and verified quantities."
  identity_limitations:
    - row_id: "starch"
      condition: "Conditional separately added oxidized starch in the actual colour recipe. The native comment specifies starch oxidized with sodium hypochlorite under good manufacturing practice; actual material/oxidation route, grade and delivered water must match before using this locator. Its food-use context does not establish a paper-grade background or dosage. Other oxidation routes need another verified identity. Meter actual electric cooking and fresh water; do not infer dosage from literature examples or repeat upstream base-paper sizing."
    - row_id: "spent_blade"
      condition: "Only one actual spent steel paper-coating doctor blade stream sent externally is represented. Native Waste solid explicitly includes discarded industrial material, scrap metal and machinery, with no prescribed treatment route; this is a conditional physical locator, not a fabrication-offcut or machine-shop-swarf background. Preserve measured whole solid mass, actual alloy, dimensions, surface coating, moisture and adhered coating-colour residues, replacement/dispatch records, legal waste status, recipient acceptance and actual treatment. Each distinct actual blade or separately collected residue needs its own physical record. Match recipient composition, recovery/treatment boundary and native whole-mass reference before linking data; do not assume clean steel, treatment, saleable coproduct status or avoided credit."
    - row_id: "coating_colour"
      condition: "Alternative to reconstructing the components of that purchased lot: this is one complete supplied liquid formulation exchange, not a selector or the finished coated paper. Native Product Coating explicitly includes materials applied as liquids, without a hard material or supply route; it conditionally locates this actual aqueous mineral-pigment/carboxylated-SB colour, not an exact recipe. Confirm actual liquid phase, full pigment/binder/auxiliary/water composition, supplier boundary, lot assays and native whole-wet mass reference. Use measured whole wet mass only with a compatible complete upstream formulation dataset; an already applied dry layer or a generic paint background is not automatically compatible. All already included constituents are composition observations, not repeated inventory inputs. Separately purchased adjustments remain separate inputs. Background formulation and quantity compatibility remain pending until demonstrated."
    - row_id: "dispersant"
      condition: "Only if the actual recipe separately uses polymeric sodium polyacrylate. The native Sodium carboxylate family has no CAS or molecular-mass/form specification; its generic salt definition conditionally includes the actual polymeric sodium carboxylate, not proof of an exact polymer or supplier formulation. Supplier SDS/CoA must establish actual CAS, polymer structure, molecular-mass distribution, neutralization, grade, additives, water/active fraction and supplied physical state. Match the native mass reference and provider boundary to the actual isolated salt or complete supplied formulation; never substitute a small-molecule salt, monomer or polyacrylic acid background, or count a whole solution as dry polymer. In component reconstruction, carrier/auxiliary inputs need separate actual rows and quantities; in a matching whole-formulation background count included constituents only as composition observations."
    - row_id: "gcc"
      condition: "Conditional separate procurement: actual fine-ground CaCO3 pigment, with measured purity, particle distribution and delivered water fraction. The broad identity has no CAS or grinding specification and a calcareous-stone classification; provider compatibility requires supplier confirmation, not a generic limestone dataset. A wet slurry is not one kg dry CaCO3."
    - row_id: "alkali"
      condition: "Conditional actual solid industrial-grade procurement only; direct name specifies purity 95%-98%. Require the actual grade to meet that restriction, measure water/impurities and dissolution water. It is not an arbitrary caustic solution or pure active-NaOH mass. Other concentration/form requires its own verified identity."
    - row_id: "defoamer"
      condition: "Only separately procured primary PDMS fluid or a verified component reconstruction: the source is a broad primary polysiloxane family. Require supplier-confirmed PDMS species, primary route and pure-polymer quantity/provider basis. It does not identify a complete aqueous defoamer emulsion. Additional surfactant/carrier constituents need their own atomic rows if present."
    - row_id: "electricity"
      condition: "One net imported electricity exchange; retain separate kitchen/cooker, coater, electric hot-air heater/fans, cold calender, slitter, extraction and packing meter records. Native identity requires 1-35 kV grid-average supply to user and its raw geography is CN. Confirm actual voltage, supplier region, reporting year, consumption mix and loss boundary; identifying physical alternating current does not establish a global or automatically matching background. Require a compatible actual supply dataset and native quantity basis; incompatible supply needs its own verified identity/provider decision. Native property is Net calorific value, MJ: metered kWh converts by 3.6 MJ/kWh without assigning fuel heating value."
    - row_id: "water"
      condition: "Fresh imported treated tap water for preparation and cleaning only, measured separately from water already in purchased emulsions/slurries. The reference property is Mass/kg; volumetric meters require actual density at measured state. Confirm source treatment and supplier boundary; internal recirculation is not a fresh import."
    - row_id: "wrapper"
      condition: "Conditional purchased uncoated paper wrapper of verified compatible grade; no plastic-laminated, impregnated or bag-converted material is represented by this row. Record moisture, supplier and actual mass; distinguish from the base-paper web."
    - row_id: "film"
      condition: "Conditional actual polyethylene film, CAS9002-88-4, excluding PET and multilayer laminates. Its name/CAS/comment support film but source classification points to bags/luggage; disclose that defect and verify polymer, additives, thickness and supplier. Do not borrow source quantities."
    - row_id: "product"
      condition: "One finished reference product after coating, drying, any actual cold calendering, reeling/cutting and acceptance. It is unprinted, not laminated/impregnated, and contains the actual retained coating plus water. The broad record also describes varnish examples but has no mandatory varnish/printing route; use only this physically delimited mineral-coated subset with supplier/product evidence."
    - row_id: "effluent"
      condition: "Separate actual diluted cleaning effluent sent to a contracted offsite treatment route; the broad liquid-waste identity includes industrial wastewater. Record whole wet mass from weighing or measured volume times actual effluent density, pollutant concentrations/loads and water fraction. Do not use manganese-slag wastewater or treat the whole liquid as pure water. No direct freshwater discharge is represented here."
  foreground_compatibility_pending: "No actual plant dataset supplied. Actual grade/formulation assays, retained coat masses, moisture, supplier background quantity definitions, receipts/meters, emission measurements and recipient acceptance must be verified before producing quantitative data. A resolved physical UUID is not a resolved background dataset."
