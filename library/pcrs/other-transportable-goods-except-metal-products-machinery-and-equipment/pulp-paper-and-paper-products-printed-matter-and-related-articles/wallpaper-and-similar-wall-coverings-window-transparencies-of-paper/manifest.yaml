review_metadata:
  classification_mapping_authority: "Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  inventory_contract:
    atomic_flows: v1
    localized_flow_names: tiangong_zh_v1
  independent_review: Controller authoring, bilingual, primary-source and row-native review completed; independent
    scientific approval remains pending.
  scope_decision: Promote the retained unpublished scaffold for the narrower wet-laid cellulose-paper wallpaper
    subset. Purchased press-ready water-based gravure inks; no PET/nonwoven backing, decorative PVC, laminate, overvarnish,
    factory paste, window transparency, integrated papermaking, solvent/UV printing, on-site wastewater treatment
    or thermal off-gas oxidation. Existing wallpaper-base PCR is upstream, not the finished product.
  unresolved_flow_identities:
  - row_id: box
    selected_flow: Finished corrugated paperboard shipping box
    uuid: null
    reason: 'Only a composition-specific corrugated box, laminated folding box, generic packaging or unconverted
      board found. Actual composition/route unknown: keep a specific finished corrugated shipping-box identity unresolved.'
  source_limitations: STS2020 supports aqueous wallpaper rotogravure, drying/cleaning and residual VOC questions;
    IGI2024 group-average recipe, quantities and life scenarios are not defaults. Borastapeter material/FAQ pages
    establish real paper-versus-PET/nonwoven and aqueous non-PVC product distinctions, not all manufacturers or
    rotogravure prevalence. Paper BREF7.1.10 applies to paper slitting/trim/dust, not wallpaper ink or boiler factors;
    AP42 1.4 header10/26 is separate gas-boiler/furnace source. No wood-processing survey used.
  provider_compatibility:
    reference: Broad finished-paper flow includes target subset, no opposing route/material qualifier. Actual paper
      structure, ink route, net mass, moisture, grammage and supplier dataset boundary must match; no borrowed recipe.
    paper: Actual purchased chemical/mechanical/recovered furnish must be declared; existing chemical-pulp wallpaper-base
      PCR is reusable only for its own supported scope.
    ink: Adopt aqueous gravure-specific identity; formulation, colour, solids, solvents/neutraliser, delivered wet
      quantity and compatible provider remain site-specific.
    gas: Volume/m3; T/P, wet/dry composition, compressibility and supplier/background m3 convention required. CAS74-82-8
      denotes methane-dominant gas record, not pure-methane assay. Secondary mass coefficient is not density.
    electricity: Native Net calorific value/MJ; actual customer-side1–35kV, geography/year/grid mix/loss gate required.
      Source location CN; require actual compatible geography or another verified identity/provider.
    water: Native Mass/kg; actual density and supplier delivery gate required, no borrowed1000kg/m3 default.
    pe_film: Name/CAS9002-88-4/comment establish PE film; isolated CPC29220 classification conflicts and needs source/provider
      clarification. Only actual PE shrink-film, not all polyolefins.
    waste_ink: 'One separately collected liquid aqueous-gravure waste-ink residue fits the broad industrial Waste
      liquid family only after confirming its actual liquid state, pigment/binder/solvent/H2O composition, full
      as-transferred wet kg, hazard classification and receiving treatment. Retain the original measured residue
      quantity separately from bulk cleaning effluent, with no expert default waste fraction. Gel or dried scrap
      is not silently assigned this liquid identity: if present, preserve its full separately measured quantity
      in a distinct physically specific row with verified identity before dataset completion. A source inline Mass
      label cannot override a conflicting native property UUID. Measure the H2O fraction for the water ledger; never
      treat whole residue kg as water or infer a generic hazardous status.'
    nox: Aggregate Mass/kg does not prove NO2-equivalent quantity. Monitoring and LCI/LCIA definition pending until
      site evidence; N2O separate.
    nmvoc: Retain species, measured compound/carbon mass convention and residual sum ledger; no double LCIA characterisation.
    particles: Three disjoint post-control bins, actual filterable/condensable sampling convention and captured-versus-exported
      dust separate; no default size share.
    air_compartment: All selected elementary records are outdoor-air unspecified. Actual stack/fugitive/receiver
      and LCIA media compatibility required; no indoor, water, resource, long-term or correction substitutions.
    effluent: One actual liquid aqueous-gravure press-cleaning effluent transferred to documented external treatment.
      The broad industrial-cleaning Waste liquid identity is conditional on actual liquid state, full composition
      and receiver acceptance; no universal treatment or hazard class follows from it. Preserve whole wet kg or
      actual measured V*rho(T), and measure H2O fraction independently for the water balance. Dissolved/suspended
      ink, COD/BOD, nitrogen/phosphorus and pH characterize the whole stream; overlapping analytical indicators
      are not additive constituent masses or separate foreground water emissions. Concentrated waste ink stays a
      separate physical row. Link a compatible external treatment process, keeping its releases outside this foreground.
  remaining_review:
  - "Independent scientific review remains pending; no publication approval. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
  - All site amounts, formula/grade acceptance, service conditions and background providers await actual collection.
  - On-site boilers/treatment, steam/heat imports, coatings/lamination, solvent cleaners or different printing routes
    require independently supported method extension and individually verified flows.
