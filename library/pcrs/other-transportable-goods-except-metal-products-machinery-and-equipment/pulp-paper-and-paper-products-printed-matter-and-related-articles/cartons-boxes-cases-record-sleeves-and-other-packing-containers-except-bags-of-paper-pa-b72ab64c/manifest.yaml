  classification_proposal: "CPC 3.0 32153 narrower: unprinted C-flute single-wall FEFCO 0201-G only; other containers, office articles, folding solid-board cartons and printed/laminated variants excluded. Current classification decisions are governed by classifications/mappings/cpc-3.0-to-pcr.yaml and its acceptance.decision_ref ADRs; methodology and translation review remain separate."
