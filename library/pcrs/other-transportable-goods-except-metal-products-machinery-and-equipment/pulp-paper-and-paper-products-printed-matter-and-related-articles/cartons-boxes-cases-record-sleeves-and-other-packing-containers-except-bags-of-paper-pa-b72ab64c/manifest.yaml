  unresolved_flow_identities:
    - row_id: "strap_in"
      candidate_flow: "Polypropylene strapping band"
      reason: "Record only actual PP strapping issued for flat-box bundles; verify polymer grade, additives, width and mass. Resin, yarn, farm-gate twine and nylon cable ties are not verified strapping identities. UUID remains unresolved. No pallet, film or other packing is silently represented by this row; add actual components separately before dataset completion."
    - row_id: "strap_dispatch"
      candidate_flow: "Polypropylene strapping band"
      reason: "Actual full accompanying PP strapping is tracked separately from net boxes, offcuts and stocks. Finished strapping identity remains unresolved, as for strap_in; a physical output cannot be hidden or replaced with tape, metal or resin."
  physical_flow_review: "Three measured residue rows use actual captured-dust or liquid-waste identities. One accompanying strapping output is added to close the physical packaging account, without changing the15 original row amounts or reducing external masses by allocation. Actual supplier, composition and receiver compatibility remain pending."
  provider_basis_pending:
    - "Reference UUID 4f197bec-7b3b-11dd-ad8b-0800200c9a66 requires actual total-fibre split compatibility with 16.6% primary / 83.4% recycled; never adopt these fractions as site recipe or allocation. Incompatible actual product requires a different verified reference identity."
    - "Incoming board UUID 8bde297e-98df-463f-bcb4-0db52bf6e0b5 requires C-flute, fibre >=80%, recycled material, unprinted/uncoated supply and compatible corrugator background; no inherited take-up factor or glue dose."
    - "Starch adhesive supply state/solids/additives and wet/dry upstream reference are not established by Mass/kg identity. Actual supplier SDS and formulation are required."
    - "Tap-water source has Hong Kong production/treatment context; verify actual provider geography and delivery reference. Site water balance needs measured density, not source screening coefficient."
    - "Electricity source is CN low-voltage customer-side consumption mix; verify actual voltage/geography/delivery and transformer coverage."
    - "PP waste identity includes mechanical recycling; actual receiver/material compatibility required."
    - "Exact size-resolved outdoor particle measurement, water/solid/carbon balance and glue volatile screening require real site protocols before a completed dataset."
