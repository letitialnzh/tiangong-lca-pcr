              text: "per reference flow"
              kind: "reference_flow"
            evidence:
              kind: "calculated_from_collection"
              collection_protocol_id: cp_water
              source_ids:
                - fefco-recyclability-2025
            ranges: []
allocation_rules:
  - rule_id: allocation_hierarchy
    applies_to: "shared units"
    rule: "Prefer measured subdivision; investigate system expansion consistently with study scope; when allocation is necessary justify relevant physical relations before other relations such as economic allocation, and retain sensitivity. No universal share."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_physical
    applies_to: "physical and burden ledgers"
    rule: "Preserve actual gross product, waste, water and carbon quantities and equal internal links in a physical ledger. Apply allocation only in a separate environmental-burden ledger; never multiply physical co-product output by a burden share."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: allocation_waste
    applies_to: "trim_out; strap_waste_out"
    rule: "Positive waste value alone does not establish a co-product. Retain material state, actual receiver/continuing use and waste or product decision. No automatic avoided-paper/plastic credit or second upstream charge for internal returns; any broader recycling method needs separately disclosed assumptions."
    source_ids:
      - eu-pef-allocation-2021
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "box_converter"
      flow_role: "reference output"
      record_type: "scale/meter/supplier/laboratory records"
      raw_fields: "gross/tare/net Q; accepted/rejected production; order/drawing/0201-G; dimensions; C flute; fibre split/grade; gate moisture; joint acceptance; dispatch/stock"
      collection_method: "Calibrated net weighing and representative gate-moisture tests; reconcile production, dispatch and stocks"
      unit: "kg; mass fraction; dimensions"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared representative period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared loads"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; SOP; supplier definitions; sample chain; raw records; uncertainty"
    - protocol_id: cp_board
      process_id: "box_converter"
      flow_role: "purchased board"
      record_type: "scale/meter/supplier/laboratory records"
      raw_fields: "supplier/mill; grade; C-flute geometry; unprinted/uncoated declaration; recycled/primary fibre; filler; sheet mass/moisture; issues/returns/opening/closing stock; upstream corrugator basis"
      collection_method: "Per-grade calibrated receipt and stock balance; independently verify supplier paper/corrugation cut point"
      unit: "kg; mass fraction"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared representative period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared loads"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; SOP; supplier definitions; sample chain; raw records; uncertainty"
    - protocol_id: cp_glue
      process_id: "box_converter"
      flow_role: "joint adhesive"
      record_type: "scale/meter/supplier/laboratory records"
      raw_fields: "supplier/SDS; natural starch origin/modification; supplied wet mass; solids; additives/CAS/volatiles; dosing/returns/waste/stock; provider wet/dry basis; joint acceptance"
      collection_method: "Calibrated dosing/stock balance, validated solids and formulation review; no double count of carrier water or supplied ingredients"
      unit: "kg; mass fraction"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared representative period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared loads"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; SOP; supplier definitions; sample chain; raw records; uncertainty"
    - protocol_id: cp_energy
      process_id: "box_converter"
      flow_role: "electricity"
      record_type: "scale/meter/supplier/laboratory records"
      raw_fields: "stage kWh; meter coverage; voltage; supplier geography/mix; transformers; idle/start/stop; on-site combustion/heat absence"
      collection_method: "Calibrated non-overlapping interval meters and documented attributable shared-load allocation"
      unit: "kWh; MJ"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared representative period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared loads"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; SOP; supplier definitions; sample chain; raw records; uncertainty"
    - protocol_id: cp_pack
      process_id: "box_converter"
      flow_role: "strapping and extra gate packaging"
      record_type: "scale/meter/supplier/laboratory records"
      raw_fields: "PP strapping grade/additives/width; full issued/dispatched/returned masses; opening/closing stock; actual scrap/loss; finished-bundle tare; pallet/film/other component presence"
      collection_method: "Weigh individual issued packing components; audit all external packaging; reusable on-site handling stays internal"
      unit: "kg"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared representative period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared loads"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; SOP; supplier definitions; sample chain; raw records; uncertainty"
    - protocol_id: cp_waste
      process_id: "box_converter"
      flow_role: "each solid/wet waste export"
      record_type: "scale/meter/supplier/laboratory records"
      raw_fields: "stream; mass/moisture/solids/carbon; starch/filler/polymer contamination; captured dust; collector stocks; internal return; receiver/treatment/acceptance"
      collection_method: "Weigh separate loads with representative composition and receiver tickets; reconcile collector and waste stock"
      unit: "kg; mass fraction"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared representative period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared loads"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; SOP; supplier definitions; sample chain; raw records; uncertainty"
    - protocol_id: cp_air
      process_id: "box_converter"
      flow_role: "each actual outdoor release"
      record_type: "scale/meter/supplier/laboratory records"
      raw_fields: "source/exhaust/fugitive; aerodynamic cut; concentration; gas volume T/P wet/dry; hours; actual capture; blanks/detection limits; outdoor medium; uncertainty; volatile-species screening"
      collection_method: "Site-approved representative size-resolved exhaust/fugitive sampling and matched concentration/volume integration; formulation/site screening establishes absence or need for extra species"
      unit: "kg; gas volume; concentration"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared representative period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared loads"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; SOP; supplier definitions; sample chain; raw records; uncertainty"
    - protocol_id: cp_water
      process_id: "box_converter"
      flow_role: "water, rinse and vapour"
      record_type: "scale/meter/supplier/laboratory records"
      raw_fields: "external m3; temperature/density; board/glue/product/waste water; separate rinse mass/solids/COD; receiver; water stocks; ventilation humidity/boundary"
      collection_method: "Calibrated water/effluent meters and sampled density/solids; matched gross physical water balance; investigate residuals"
      unit: "m3; kg; mass fraction"
      frequency: "each lot and matched stage interval"
      temporal_coverage: "full declared representative period including starts/stops, rejects and stock changes"
      site_scope: "declared converting line and attributable shared loads"
      aggregation_rule: "per reference flow"
      quality_evidence: "calibration; SOP; supplier definitions; sample chain; raw records; uncertainty"
  calculation_rules:
    - id: normalize_exchange
      applies_to: "all non-reference rows"
      rule: "q_i = A_i / Q; A_i is the same-period external exchange total in its row unit; Q is accepted net gate-moist box kg."
      inputs:
        - cp_mass
        - cp_board
        - cp_glue
        - cp_energy
        - cp_pack
        - cp_waste
        - cp_air
        - cp_water
      output: "row amount per reference flow"
      source_ids: []
    - id: electricity_mj
      applies_to: "electricity_in"
      rule: "A_MJ = 3.6 * A_kWh; verified energy-unit conversion, metered at the declared delivery point."
      inputs:
        - cp_energy
      output: "MJ per reference flow"
      source_ids: []
    - id: solids_water
      applies_to: "board/glue/box/wastes"
      rule: "m_solid = m_wet * s; m_water = m_wet * (1-s); s is measured solids mass fraction with method/volatile applicability checked. Keep gate-moist reference mass unchanged."
      inputs:
        - cp_mass
        - cp_board
        - cp_glue
        - cp_waste
        - cp_water
      output: "separate physical solids and water"
      source_ids: []
    - id: whole_liquid_mass
      applies_to: "effluent_out; glue_waste_out"
      rule: "A_wet_kg = V_m3*rho_mixture(T), or direct calibrated whole-wet weighing. Water-component mass = A_wet_kg*x_water; retain actual solids/other constituents and whole effluent volume for pollutant loads. Divide by the same Q once."
      inputs:
        - cp_water
        - cp_waste
        - cp_mass
      output: "kg per reference flow and separate physical water balance"
      source_ids: []
    - id: physical_balance
      applies_to: "box_converter"
      rule: "For solids, water and carbon separately: inputs = net product + accompanying packaging dispatched + exported waste + environmental release + stock change; equal internal links cancel. Water mass = volume * measured density. Measure carbon content and origin; no generic carbon fraction or CO2 factor."
      inputs:
        - cp_mass
        - cp_board
        - cp_glue
        - cp_pack
        - cp_water
        - cp_waste
        - cp_air
      output: "unallocated physical ledger and residual"
      source_ids: []
    - id: pm_exclusive
      applies_to: "pm25_out; pmcoarse_out; pmover10_out"
      rule: "PM2.5-10 = matched cumulative PM10 - PM2.5; >10 = comparable total particulate - PM10. Only compatible definitions/conditions/detection limits allow subtraction; investigate negative differences; otherwise measure the exclusive bin."
      inputs:
        - cp_air
      output: "exclusive kg per reference flow"
      source_ids: []
  data_quality_requirements:
    - id: identity
      applies_to: "all rows"
      requirement: "Verify full multilingual name, species/CAS when relevant, material form, hard route, medium/submedium, classification and property/unit; physical identity does not prove provider quantity compatibility."
      evidence: "supplier records; direct flow/property/unit records"
    - id: measurement
      applies_to: "all protocols"
      requirement: "Use matched actual site/period, calibrated measurement and uncertainties. Missing quantities, unknown receiver/particle split or compatibility are pending, never default zero or inherited recipe."
      evidence: "cp_mass; cp_board; cp_glue; cp_energy; cp_pack; cp_waste; cp_air; cp_water"
    - id: emission_coverage
      applies_to: "actual route"
      requirement: "Screen dust, retained adhesives/additives and actual utility/waste facilities. Add every relevant atomic species before completion; preserve biogenic CO2 when actually present even if a GHG account treats it differently. No assumed incineration/biological loss occurs inside the declared route."
      evidence: "cp_air; cp_glue; cp_energy; cp_waste; actual site diagram"
validation_rules:
  - rule_id: validate_scope
    applies_to: "product"
    rule: "Verify 0201-G geometry, single-wall C flute, absent printing/coating and actual wet starch joint; classification name cannot establish method applicability."
    source_ids:
      - fefco-code-2022
      - fefco-box-production
  - rule_id: validate_reference
    applies_to: "box_out"
    rule: "Exactly one product output is linked by box_out or the reference UUID; it is 1 kg net gate-moist box. Verify record fibre restrictions and background compatibility before complete dataset acceptance."
    source_ids: []
  - rule_id: validate_boundary
    applies_to: "box_converter"
    rule: "Upstream corrugation/embedded glue and converter joint glue are distinct; prove no overlapping manufacture or utilities and no direct-water emission double count for exported rinse."
    source_ids:
      - fefco-box-production
      - fefco-recyclability-2025
  - rule_id: validate_physical
    applies_to: "all rows"
    rule: "Every protocol and quantity uses the same positive Q and per reference flow. Review mass/water/carbon residuals and equal internal links before a separate allocation ledger."
    source_ids:
      - eu-pef-allocation-2021
  - rule_id: validate_air
    applies_to: "particle and vapour rows"
    rule: "Three particle bins are exclusive and separate from captured dust; do not add cumulative totals. Missing source/species measurements or unexplained water residuals prevent complete acceptance; no zero inferred from unprinted or starch labels."
    source_ids:
      - ec-paper-bref-2015
  - rule_id: validate_completeness
    applies_to: "dataset"
    rule: "Resolve or explicitly review blank UUIDs, actual added packing/chemicals/transport and provider bases before calling a dataset complete. Guidance identity is not measurement evidence, scientific approval or product certification."
    source_ids: []
published_dataset_profile:
  dataset_role: "secondary_dataset"
  downstream_use: "Compatible empty flat-box input to product-packing models; upstream sheet dataset remains separate"
  allowed_use: "Only actual within-scope boxes with completed inventory, identity and quantity compatibility"
  excluded_use: "All CPC 32153 coverage; printed/solid-board/die-cut containers; filled package service comparison; unknown fibre/provider bases"
  required_metadata: "Structure/drawing, dimensions, grade/fibre split, net mass/moisture, joint formulation, gate state, supplier cut points, place/period/utilities, receivers and transport"
  required_quality_disclosure: "Measurement/identity gaps, provider bases, calibration, particle coverage, balances/residuals, allocation, uncertainty and review state"
  update_trigger: "Change in structure/board/glue/printing, supplier/energy/effluent route, packaging, period or material source"
data_sources:
  - id: "fefco-box-production"
    type: "extension_guidance"
    reference: "FEFCO, Corrugated board production, publisher snapshot read 2026-10-11; https://www.fefco.org/lca/dscription-of-production-system/corrugated-board-production"
    used_for: "Construction, sheet/box/integrated plant boundaries and RSC converting; printing may be absent; examples and industry averages are not quantities for this route."
  - id: "fefco-code-2022"
    type: "standard"
    reference: "FEFCO International Fibreboard Case Code, 2022, 12th edition, pp.5 and 18; https://www.fefco.org/sites/default/files/files/styles/thumbnail/public/FEFCO%20Code_WEBprotected.pdf"
    used_for: "0201 construction drawing and glued manufacturer-joint suffix G; no universal geometry, quality limit or certification."
  - id: "fefco-recyclability-2025"
    type: "extension_guidance"
    reference: "FEFCO, Corrugated Packaging Recyclability Guidelines, 2025, fourth edition, p.7 and Annex 1 PDF p.14; https://www.fefco.org/sites/default/files/documents/FEFCO-Recyclability-Guidelines-UPDATE%202025%20final_0.pdf"
    used_for: "Starch adhesive for box making/closure; inks include resins/solvents/additives. Recycling guidance does not establish a glue recipe, VOC-free production or recovery credit."
  - id: "ec-paper-bref-2015"
    type: "official_guidance"
    reference: "European Commission JRC, Production of Pulp, Paper and Board BREF, 2015, section 7.1.10 printed p.670/PDF p.708; https://bureau-industrial-transformation.jrc.ec.europa.eu/sites/default/files/2019-11/PP_revised_BREF_2015.pdf"
    used_for: "Paper-machine cutting dust and trim: only qualitative physical analogy motivates independent converter dust measurement. No converter emission factors, energy/water defaults or mill-broke recycling assumption."
  - id: "eu-pef-allocation-2021"
    type: "official_guidance"
    reference: "Commission Recommendation C(2021) 9332 final / (EU) 2021/2279, Annex I 4.5, pp.63-64; https://environment.ec.europa.eu/system/files/2021-12/Annexes%201%20to%202.pdf"
    used_for: "Subdivision/system expansion, physical then other justified allocation hierarchy; no fixed shares or claim of complete PEF conformity."
