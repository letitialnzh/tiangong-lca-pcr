system_boundary:
  rules:
    - rule_id: boundary_sheet_box
      applies_to: "converter"
      rule: "Begin at sheet receipt. Include slotting/scoring, folding, wet joint gluing, conditioning, acceptance, dust capture, cleaning and gate bundling with all attributable utilities."
      source_ids:
        - fefco-box-production
        - fefco-code-2022
    - rule_id: boundary_upstream
      applies_to: "board_in"
      rule: "Supplier pulp/papermaking/corrugation and embedded starch are included once in upstream sheets, not reinjected as converter inputs; do not substitute flat-layer board or corrugator-only results for finished boxes."
      source_ids:
        - fefco-box-production
    - rule_id: boundary_ink
      applies_to: "product"
      rule: "Demonstrate no print/varnish from order, inspection and chemical issues. Printed, coated or laminated variants require explicit ink/plate/cleaner/waste/species and utility methods before use. Starch glue or water-based ink labels do not demonstrate zero air release."
      source_ids:
        - fefco-box-production
        - fefco-recyclability-2025
    - rule_id: boundary_residuals
      applies_to: "converter"
      rule: "Export rinse for external treatment; no on-site biological treatment or combustion occurs in this route. If found, reassess scope and include actual species, including biogenic CO2, instead of assuming zero from GHG reporting convention. No pulper means exported trim is not internally recycled mill broke."
      source_ids:
        - ec-paper-bref-2015
