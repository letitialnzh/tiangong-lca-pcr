measurement_rules:
  - id: reference_mass
    applies_to: "reference product"
    required_property_ref:
      name: "Mass"
      uuid: "93a60a56-a3c8-11da-a746-0800200b9a66"
    required_unit: "kg"
    rule: "P is the accepted net finished tissue mass at measured gate moisture including retained adhesive solids and excluding cores/packaging/rejects. Collect using cp_mass. Every row uses the same 1 kg denominator."
  - id: wet_dry_basis
    applies_to: "mass-based tissue, core, adhesive/formulation, packaging and waste moisture-component ledgers"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Keep measured wet mass m and wet-basis moisture w for each actual stream; dry solids = m*(1-w). Do not equate delivered parent-reel kg with dry kg. Supplier backgrounds require matching moisture and composition. No fixed moisture or loss fraction. Native electricity NCV/MJ is outside this mass/moisture rule; measured auxiliary material water/solids never replace the energy numerator."
  - id: component_basis
    applies_to: "adhesive, adhesive_water, water"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Measure formulated adhesive and retained/lost polymer and water independently. Pure-polymer kg is not emulsion kg. Volume-to-mass water conversion uses actual measured density and conditions; database secondary coefficients do not establish a site density."
  - id: electricity_basis
    applies_to: "electricity"
    required_property_ref:
      name: "Net calorific value"
      uuid: "93a60a56-a3c8-11da-a746-0800200c9a66"
    required_unit: "MJ"
    rule: "Convert metered kWh using exact 3.6 MJ/kWh, preserving actual provider voltage/grid and loss interface. This is unit conversion, not efficiency or a thermal-energy equivalence."
  - id: emission_basis
    applies_to: "pm25, pmcoarse, pmover10, water_evaporation"
    required_property_ref:
      name: "Mass"
      uuid: ""
    required_unit: "kg"
    rule: "Only releases crossing to outdoor air; preserve size interval and water-vapour identity. Collected solid dust is waste, not an air elementary flow. Do not sum cumulative PM10/PM2.5 with exclusive intervals. No CO2 from dry cutting is presumed; retain actual upstream biogenic CO2 in linked LCI even when a GHG reporting metric omits it."
