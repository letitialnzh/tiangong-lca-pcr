allocation_rules:
  - rule_id: allocation_rule_1
    applies_to: "foreground_burden_allocation"
    rule: "First use separately metered stages/grades and direct material records to avoid allocation. Shared compressor, fan, electric handling and packing utilities require a demonstrated causal driver (metered energy or measured equipment load and hours), a common period and a reconciliation to facility totals. If subdivision/physical causality cannot resolve shared burdens, disclose the allocation basis, alternatives and sensitivity and obtain methodological review; no automatic mass or revenue split. Waste is not automatically a co-product because it is sold, and no avoided-production credit is assumed. Genuine product status requires lawful product/waste identity, receiver-accepted specifications and actual use/function; payment alone is insufficient. A status change requires another verified Product flow identity, not relabelling a Waste exchange merely because it earns revenue. [epa-lca-2006]"
    source_ids: []
  - rule_id: allocation_rule_2
    applies_to: "foreground_burden_allocation"
    rule: "Keep full unallocated mass/water/carbon balances and every actual product/waste output in the physical ledger. A separate environmental-burden ledger may allocate joint loads; its shares sum to one for the same period. Never multiply actual co-product output or an internal transfer by an environmental allocation share. Product and waste treatments require consistent supplier/receiver recycling conventions; do not combine a cut-off approach with unearned substitution credits."
    source_ids: []
  - rule_id: allocation_causal
    applies_to: "dry_conversion"
    rule: "Use subdivision and measured causal allocation for shared burdens; unresolved allocation requires disclosed alternatives and sensitivity review."
    source_ids:
      - epa-lca-2006
  - rule_id: allocation_physical
    applies_to: "dry_conversion"
    rule: "Keep full actual product/waste/internal-transfer physical quantities separate from allocated environmental loads; never scale physical outputs by allocation shares."
    source_ids:
      - epa-lca-2006
dataset_production:
  collection_protocols:
    - protocol_id: cp_mass
      process_id: "dry_conversion"
      flow_role: "finished_rolls"
      record_type: "Foreground measurement and records"
      raw_fields: "Grade/lot; accepted/rejected mass; gross pack mass; core/wrap tare; measured moisture; retained dry adhesive; roll/sheet count"
      collection_method: "Calibrated weighing of unpacked/de-cored accepted product or same-lot gross/tare reconciliation. Sample grades/ply/dimensions and use a validated moisture SOP; counts reconcile actual batch mass, never a universal piece mass. P = accepted net finished tissue campaign mass; product row 1 kg; other rows divide by P"
      unit: "kg"
      frequency: "Every lot and representative moisture samples"
      temporal_coverage: "Same declared production campaign including rejects, starts/stops and stocks"
      site_scope: "Declared converter and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original tickets; validated sampling; uncertainty and coverage"
    - protocol_id: cp_materials
      process_id: "dry_conversion"
      flow_role: "parent_reel, core, pe_film, box, pallet"
      record_type: "Foreground measurement and records"
      raw_fields: "Supplier/lot/grade; actual receipt/usage/dispatch/returns; moisture; measured dry-solids/carbon fractions and method; stocks; packaging components; pallet trips"
      collection_method: "Weigh segregated materials and reconcile invoices to beginning/end stocks, internal links and dispatch component records; match actual supplier reference basis, not a generic recipe. Attributable net campaign input divided by P; physical dispatch/return quantities retained separately"
      unit: "kg"
      frequency: "Each lot and stock reconciliation"
      temporal_coverage: "Same declared production campaign including rejects, starts/stops and stocks"
      site_scope: "Declared converter and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original tickets; validated sampling; uncertainty and coverage"
    - protocol_id: cp_utilities
      process_id: "dry_conversion"
      flow_role: "electricity"
      record_type: "Foreground measurement and records"
      raw_fields: "Meter start/end; stage kWh; voltage; compressor/fan load/hours; handling/packing; losses/provider"
      collection_method: "Calibrated submeter and invoice reconciliation. Shared utilities require measured causal allocation; retain separate stage and joint-load ledgers. Attributable kWh times 3.6 divided by P"
      unit: "MJ"
      frequency: "Continuous meters; lot/campaign totals"
      temporal_coverage: "Same declared production campaign including rejects, starts/stops and stocks"
      site_scope: "Declared converter and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original tickets; validated sampling; uncertainty and coverage"
    - protocol_id: cp_adhesive
      process_id: "dry_conversion"
      flow_role: "adhesive, adhesive_water"
      record_type: "Foreground measurement and records"
      raw_fields: "Trade grade/SDS/CAS; supplied mass; measured solids/water fractions; retained and waste solids/water; background kg convention"
      collection_method: "Supplier lot certificate, complete wet adhesive weighing and validated solids/water assays close the component balance. Record the complete purchased lot once; component masses are analytical or supplier-reconstruction demands, not independent converter purchases. Match actual provider wet/dry reference and retain full polymer/formulation preparation, actual emulsification/auxiliaries/utilities/losses and delivery once. Require compatible complete-supply card/provider or documented supplier-process reconstruction before use; no whole-background plus component duplicate. Normalize actual attributable supplied quantities by P while retaining all raw component/stock/retention/waste records."
      unit: "kg"
      frequency: "Each formulation lot and application batch"
      temporal_coverage: "Same declared production campaign including rejects, starts/stops and stocks"
      site_scope: "Declared converter and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original tickets; validated sampling; uncertainty and coverage"
    - protocol_id: cp_waste
      process_id: "dry_conversion"
      flow_role: "tissue_trim, captured_dust, core_waste, board_waste, pe_waste"
      record_type: "Foreground measurement and records"
      raw_fields: "Stream identity; wet/dry mass; moisture; contamination; stock change; internal reuse; receiver tickets/acceptance"
      collection_method: "Separate bins and calibrated weighing; reconcile transfer notes with process loss and inventory. Distinguish paper dust, paper trim, core, board and PE film; no assumed waste ratio or receiver yield. Each actual external stream mass divided by P; internal reuse excluded"
      unit: "kg"
      frequency: "Every removal and campaign balance"
      temporal_coverage: "Same declared production campaign including rejects, starts/stops and stocks"
      site_scope: "Declared converter and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original tickets; validated sampling; uncertainty and coverage"
    - protocol_id: cp_emissions
      process_id: "dry_conversion"
      flow_role: "pm25, pmcoarse, pmover10"
      record_type: "Foreground measurement and records"
      raw_fields: "Outlet/control; size bins; method/temperature/droplets; concentration; compatible exhaust volume; runtime; fugitive scope; uncertainty/detection limits"
      collection_method: "Representative same-stream stationary-source size tests, with a valid site plan. EPA201A applies to filterable stationary emissions with its temperature/droplet constraints; condensable PM needs an applicable complementary method when relevant. It is not a fugitive or universal-total-dust method. Assess building/fugitive releases separately with an evidenced site method. Compatible concentration times actual exhaust volume and runtime, plus distinct fugitive releases; each exclusive particle-bin mass divided by P"
      unit: "kg"
      frequency: "Representative grades/loads and verified operating coverage"
      temporal_coverage: "Same declared production campaign including rejects, starts/stops and stocks"
      site_scope: "Declared converter and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original tickets; validated sampling; uncertainty and coverage"
    - protocol_id: cp_water
      process_id: "dry_conversion"
      flow_role: "water, wastewater, water_evaporation"
      record_type: "Foreground measurement and records"
      raw_fields: "Dilution/cleaning meters; measured density; carrier water; product moisture; liquid solids; net evaporation; stock changes; receiver"
      collection_method: "Weigh or meter each water interface and measure density/temperature when volume is converted; segregate PVAc cleaning liquid and obtain receiver records. Reconcile water entering/leaving with actual tissue/adhesive moisture and stocks, with residual uncertainty disclosed. Each actual attributable water-interface mass divided by P; unknown balance residual stays pending"
      unit: "kg"
      frequency: "Every batch/cleaning transfer and campaign reconciliation"
      temporal_coverage: "Same declared production campaign including rejects, starts/stops and stocks"
      site_scope: "Declared converter and actual suppliers/receivers"
      aggregation_rule: "per 1 kg reference flow"
      quality_evidence: "Calibration; original tickets; validated sampling; uncertainty and coverage"
  calculation_rules:
    - id: normalize_campaign
      applies_to: "all inventory rows"
      rule: "Collected attributable campaign amount / accepted net finished tissue output P; finished_rolls is 1 kg reference flow."
      inputs:
        - "campaign amounts"
        - P
        - cp_mass
      output: "Exchange per 1 kg reference flow"
      source_ids:
        - epa-lca-2006
    - id: reconcile_physical
      applies_to: "dry_conversion"
      rule: "Incoming material = accepted finished tissue + cores/packing dispatched + actual segregated wastes/releases + net stock change, by component and measured wet/dry state; matched internal transfers cancel. Document unexplained residuals before allocation."
      inputs:
        - cp_materials
        - cp_mass
        - cp_adhesive
        - cp_waste
        - cp_water
      output: "Unallocated physical ledger and residuals"
      source_ids:
        - epa-lca-2006
    - id: pm_partition
      applies_to: "pm25, pmcoarse, pmover10"
      rule: "For compatible same-stream measurements only: coarse = cumulative PM10 - PM2.5; over10 = total filterable PM - PM10 when total test is valid. Preserve method uncertainty and condensable scope; reject incompatible or negative differences."
      inputs:
        - cp_emissions
      output: "Mutually exclusive outdoor-air particle masses"
      source_ids:
        - epa-method-201a-2020
  data_quality_requirements:
    - id: identity
      applies_to: "all inventory rows"
      requirement: "Physical identity, route, composition, property and unit must match; unknown UUID/provider basis remains explicit. Use exact official Chinese names when supplied."
      evidence: "Supplier specs/SDS; identity and quantity definitions"
    - id: period
      applies_to: "all inventory rows"
      requirement: "Use one common complete campaign, disclosing grade coverage, starts/stops/rejects and stocks; do not import historical/single-site averages as universal factors."
      evidence: "cp_mass; cp_materials; cp_utilities"
    - id: uncertainty
      applies_to: "all inventory rows"
      requirement: "Report measured/missing/estimated status, detection limits, calibration and residual uncertainties. Absence of data is not zero."
      evidence: "cp_emissions; cp_water; epa-lca-2006"
    - id: completeness
      applies_to: "dry_conversion"
      requirement: "Demonstrate actual chemicals, utilities, packaging, wastes, releases and provider/receiver interfaces; disallow route expansion or incomplete cradle-to-gate claims without evidence."
      evidence: "epa-lca-2006"
validation_rules:
  - rule_id: validate_reference
    applies_to: "finished_rolls"
    rule: "Exactly one reference product output; P > 0, 1 kg net finished tissue and compatible quality/moisture. Counts never substitute for measured mass."
    source_ids:
      - epa-lca-2006
  - rule_id: validate_boundary
    applies_to: "dry_conversion"
    rule: "Parent-reel upstream included once; no repeated integrated pulp/paper/drying load; identical internal transfer sending/receiving quantities."
    source_ids:
      - sofidel-production-cycle
  - rule_id: validate_components
    applies_to: "all inventory rows"
    rule: "Close individual tissue/core/adhesive/wrap/box/pallet/water/stock and full dispatch/return/waste physical ledgers and distinguish physical outputs from allocated environmental loads. No default glue concentration, packaging waste ratio or paper moisture."
    source_ids:
      - epa-lca-2006
  - rule_id: validate_emissions
    applies_to: "pm25, pmcoarse, pmover10, water_evaporation"
    rule: "Exact medium/species/size scope and amount definition; when the actual outdoor receiving subcompartment is known, use its corresponding verified identity rather than concealing that environment with unspecified air; no nested PM duplicate, no captured-dust air release; an incomplete particle test or water balance is inconclusive, not passing."
    source_ids:
      - epa-method-201a-2020
  - rule_id: validate_links
    applies_to: "all inventory rows"
    rule: "An unresolved UUID or incompatible provider amount for an actual positive exchange prevents complete linked dataset validation. A fully documented absent conditional exchange may be zero; missing data may not."
    source_ids:
      - epa-lca-2006
