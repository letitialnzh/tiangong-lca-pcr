system_boundary:
  rules:
    - rule_id: system_boundary_rule_1
      applies_to: "foreground_system_boundary"
      rule: "An integrated paper machine may supply the parent reel internally: preserve its actual kg/moisture/grade and equal sending/receiving amounts, and include either the upstream papermaking unit once or its compatible background once. Never add both a purchased-parent-reel production burden and the same integrated pulp/forming/drying burden. Attribute conversion utilities independently. In this aggregated conversion unit, rewinding, cutting and packing retain stage meters and balances; intermediate identical toilet-roll products remain internal."
      source_ids: []
    - rule_id: system_boundary_rule_2
      applies_to: "foreground_system_boundary"
      rule: "Include attributable dust collection, compressed air, electric handling, cleaning and packing; record actual maintenance supplies, wastewater and rejects. This inventory specifies the declared route, not permission to omit a real chemical, lubricant, refrigerant leak, other packaging component or pollutant. Any actual additional exchange requires a separate atomic row and compatible identity/measurement evidence before completeness is claimed. No universal cut-off; justify scope omissions and sensitivity. Onsite wastewater treatment or direct water discharge requires additional treatment inputs, pollutant-specific basic flows and sludge composition/receiver evidence, so it is not covered by an offsite-transfer row. [epa-lca-2006]"
      source_ids: []
    - rule_id: boundary_once
      applies_to: "dry_conversion"
      rule: "Link compatible upstream parent-reel production/delivery exactly once; do not repeat integrated pulp/forming/drying loads."
      source_ids:
        - sofidel-production-cycle
    - rule_id: boundary_stage_links
      applies_to: "dry_conversion"
      rule: "Preserve equal actual internal transfers and separate stage utility, product, water and waste records within one aggregated conversion unit."
      source_ids:
        - jrc-pp-bref-2015
    - rule_id: system_boundary_rule_5
      applies_to: "foreground_system_boundary"
      rule: "Maintain separate full physical ledgers for each cardboard core, PE wrap, corrugated box and wooden pallet: actual receipts/issues, dispatch, returns, beginning/end stocks and external waste, matched to the same campaign and net tissue P. Supplier parent-reel cores/wrapping carried with incoming tissue are component observations with compatible supplier boundaries, not unexplained extra purchases; disclose their measured incoming and discarded/returned amounts. Outgoing ancillary components remain outside P and are not allocable coproducts. Pallet dispatch/return mass and ownership/trips stay physical; an allocated reusable-pallet production service is a separate burden convention and must never scale the physical pallet masses. Record each actual packaging grade/source stratum and uncertainty rather than forcing a generic ratio."
      source_ids: []
