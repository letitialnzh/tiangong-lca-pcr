  conditional_identity_details:
    adhesive_water: "Conditional actual water component carried in the documented binary purchased PVAc/water formulation. Native Process water is Product/Mass/kg, for blending and formulation, at-plant GLO production mix; this conditionally matches actual formulation-carrier water, not a kg-emulsion or global background. The raw record supplies no CAS or water-quality specification. Verify actual water source, treatment/purity/grade, supplier production boundary, measured water fraction and native kg-water reference before component reconstruction. Determine component mass from actual supplied mass and validated water assay; never treat whole emulsion as water. Do not count this carrier again as onsite dilution tap water or duplicate a complete emulsion background. If actual grade/reference cannot match, retain the provider/identity substitution unresolved; CTUe or number-of-items water records cannot substitute for kg."
    box: "Conditional actual finished corrugated shipping box. Native corrugated board boxes has Mass/kg and explicitly specifies 16.6% primary and 83.4% recycled fibre. Use this locator only with demonstrated actual supply/reference compatibility with that restriction; these source fractions are neither a factory recipe nor universal defaults. Record actual dimensions, grade, coatings/printing, fibre fractions and their assay basis, moisture, full mass, supplier geography/year and quantity definition. If actual fibre composition differs or remains unverified, obtain another compatible identity/provider and do not treat the conditional UUID as a resolved dataset. Link actual corrugated-box manufacture, not a folding-carton route or packaging bundle. No default recycled-content credit, waste ratio or avoided burden is created."
    pe_waste: "One segregated actual unwashed solid PE-film stream, including removed incoming wrap or packing scrap. Native Waste solid explicitly includes discarded industrial material, without a prescribed treatment route; this is a conditional physical locator, not an exact polymer or treatment dataset. Verify actual PE species/CAS from supplier material records, film grade/form, additives, moisture, contamination/adhered material, separate source masses and legal waste status. Weigh the complete actual stream and verify receiver acceptance, transport/treatment boundary and native whole-mass reference. Do not merge PET/PP or laminated waste into this entry; separately identify other actual materials. Keep actual unwashed gate state; cleaned mechanical-recycling or optical-assembly records cannot substitute. No assumed washing, recovery yield, saleable-product status or avoided virgin-resin credit."
    wastewater: "Conditional separately collected liquid from actual adhesive-equipment cleaning sent to offsite treatment. Native Waste liquid explicitly includes industrial cleaning wastewater with no prescribed treatment; it conditionally locates this actual PVAc-containing mixture, not a direct water emission. Measure complete wet liquid mass by weighing or actual mixture volume times measured mixture density at its state; mixed-liquid mass is not pure-water mass. Record measured water fraction, PVAc solids and every other actual constituent/load, stock changes, transport, named receiver acceptance and treatment/reference-quantity compatibility. Keep the actual component-water balance separately; do not use a pure-water density for the mixture or enter receiver emissions as foreground discharge. No onsite paper-mill sludge or default treatment is assumed."
    core_waste: "Actual discarded used parent-reel cores and rejected purchased cardboard cores, physically segregated from tissue trim and boxes. Native unspecified waste-paper identity and paper/paperboard waste classification include this material family without an imposed generation or treatment route; they do not prove a core-specific background. Keep separate actual source records, dimensions, board/adhesive/coating composition, contamination, whole wet mass, moisture, stocks and receiver acceptance/reference basis. Verify each actual paperboard-core stream and downstream treatment before linking data. The packaging-trim/reject-only a318 record cannot cover used incoming cores. Do not borrow its 2% estimate, assume recycling or erase the original used-core exit."
    board_waste: "Actual corrugated-box scrap and damaged/removed cardboard packaging, segregated from cores and tissue trim. Native unspecified waste-paper family includes paperboard waste without an imposed packing-only generation or treatment route; provider compatibility remains conditional on the actual material. Separately reconcile incoming unpacking and outgoing packing losses, measured whole wet mass/moisture, fibre/adhesive/coating/printing contamination, stocks and actual receiver/reference basis. Verify each source stratum before aggregation; if physical composition or receiver differs, keep separate actual records. The packing-generated 722 record and its 2% source estimate cannot silently stand for incoming removed packaging or a generic PCR loss rate. No recovery yield or avoided credit is assumed."
