schema_version: 1
id: "module.system-conditions.multi-period-production"
version: "0.2.0"
status: "candidate"
title:
  en-US: "Multi-period Production System Condition"
  zh-CN: "跨期间生产系统条件"
description:
  en-US: "A pre-PCR framework for a production system whose activities, burdens, or outputs span more than one reporting period. It asks the PCR to determine the current product's period structure and attribution method."
  zh-CN: "适用于活动、负荷或产出跨越多个报告期间的生产系统的 PCR 前框架。它要求 PCR 确定当前产品的期间结构和归属方法。"
depends_on:
  - module_id: "module.activities.primary-biological-production"
    version: "0.2.0"
applicability:
  domains:
    - "production systems spanning multiple reporting periods"
  subjects:
    - "any current product for which establishment, operation, replacement, storage, rotation, or other phases cross periods"
  excluded_activities:
    - "a multi-period condition inferred only from a product name"
    - "product-specific cycle length, yield, age distribution, or annualization value"
    - "cross-period attribution without current-product evidence"
parameters:
  - parameter_id: "multi_period_decision"
    label:
      en-US: "Multi-period condition decision"
      zh-CN: "跨期间条件决定"
    description:
      en-US: "The current-product evidence-based decision on whether the system spans more than one reporting period."
      zh-CN: "基于当前产品证据判断系统是否跨越多个报告期间。"
    data_type: "boolean"
    unit: "applicable or not applicable"
    required: true
    supplied_by: "pcr"
    source_ids:
      - "iso_14044"
  - parameter_id: "period_structure"
    label:
      en-US: "Period structure"
      zh-CN: "期间结构"
    description:
      en-US: "The current-product phases and time basis established from evidence when the condition is active."
      zh-CN: "条件激活时，根据证据确定的当前产品阶段和时间基准。"
    data_type: "string"
    unit: "declared period structure"
    required: false
    supplied_by: "pcr"
    source_ids:
      - "iso_14044"
boundary_rules:
  - rule_id: "test_for_multi_period_structure"
    inclusion: "conditional"
    activity: "multi_period_production_structure"
    rule:
      en-US: "Test whether the current product has phases, assets, operations, or outputs that cross reporting periods; activate this condition only when evidence supports it."
      zh-CN: "调查当前产品是否存在跨报告期间的阶段、资产、操作或产出；仅当证据支持时激活该条件。"
    source_ids:
      - "iso_14044"
  - rule_id: "ask_for_phase_attribution"
    inclusion: "conditional"
    activity: "multi_period_attribution"
    rule:
      en-US: "When active, investigate the current-product phase structure, time basis, burden attribution, output attribution, replacement, and termination treatment."
      zh-CN: "激活后，调查当前产品的阶段结构、时间基准、负荷归属、产出归属、更新和终止处理。"
    source_ids:
      - "iso_14044"
  - rule_id: "exclude_inherited_cycle_values"
    inclusion: "exclude"
    activity: "inherited_cycle_value"
    rule:
      en-US: "Do not inherit a cycle length, age distribution, yield, or annualization value from another product."
      zh-CN: "不得从其他产品继承周期长度、年龄分布、产率或年化数值。"
    source_ids:
      - "iso_14044"
inventory_patterns:
  - pattern_id: "multi_period_phase_inputs"
    direction: "input"
    flow_type: "product"
    flow_role:
      en-US: "Current-product inputs assigned to an evidenced phase or period"
      zh-CN: "归属于有证据支持的当前产品阶段或期间的投入"
    required: true
    amount_source: "foreground_record"
    collection_protocol_id: "multi_period_framework_questions"
    condition:
      en-US: "Activate only when current-product evidence establishes a multi-period condition and a phase attribution need."
      zh-CN: "仅当当前产品证据建立跨期间条件且存在阶段归属需要时激活。"
    source_ids:
      - "iso_14044"
  - pattern_id: "multi_period_phase_outputs"
    direction: "output"
    flow_type: "product"
    flow_role:
      en-US: "Current-product outputs assigned to an evidenced phase or period"
      zh-CN: "归属于有证据支持的当前产品阶段或期间的产出"
    required: true
    amount_source: "foreground_record"
    collection_protocol_id: "multi_period_framework_questions"
    condition:
      en-US: "The PCR must establish the current product's output attribution and reference basis."
      zh-CN: "PCR 必须确定当前产品的产出归属和参考基准。"
    source_ids:
      - "iso_14044"
  - pattern_id: "multi_period_residues"
    direction: "output"
    flow_type: "waste"
    flow_role:
      en-US: "Potential phase, replacement, or termination residues to investigate"
      zh-CN: "需要调查的潜在阶段、更新或终止残余物"
    required: false
    amount_source: "foreground_record"
    collection_protocol_id: "multi_period_framework_questions"
    condition:
      en-US: "Activate only when current-product evidence identifies a material residue or secondary output."
      zh-CN: "仅当当前产品证据识别出重大残余物或次级产出时激活。"
    source_ids:
      - "iso_14044"
collection_protocols:
  - protocol_id: "multi_period_framework_questions"
    applies_to:
      - "multi_period_phase_inputs"
      - "multi_period_phase_outputs"
      - "multi_period_residues"
    record_type:
      en-US: "Current-product multi-period evidence record"
      zh-CN: "当前产品跨期间证据记录"
    required_fields:
      - "multi-period decision"
      - "phase or period"
      - "input or output category"
      - "property and unit"
      - "time and attribution basis"
      - "current-product evidence source"
    collection_method:
      en-US: "Search current-product sources, management records, production records, or a disclosed period model."
      zh-CN: "检索当前产品来源、管理记录、生产记录或已披露的期间模型。"
    unit: "to be determined for the current product"
    frequency: "each active phase and reporting period"
    temporal_coverage:
      en-US: "The complete period structure represented by the current PCR evidence."
      zh-CN: "当前 PCR 证据所代表的完整期间结构。"
    site_scope:
      en-US: "The current product system and materially different period structures."
      zh-CN: "当前产品系统及存在重大差异的期间结构。"
    aggregation_rule:
      en-US: "Aggregate only after phase, time basis, property, unit, and attribution method are reconciled."
      zh-CN: "仅在阶段、时间基准、属性、单位和归属方法核对一致后汇总。"
    quality_evidence:
      - "current-product source"
      - "management or production record"
      - "disclosed period model"
    source_ids:
      - "iso_14044"
calculation_rules:
  - rule_id: "apply_pcr_defined_period_attribution"
    applies_to:
      - "multi_period_phase_inputs"
      - "multi_period_phase_outputs"
    expression: "current_product_period_attributed_amount = current_product_phase_amount * current_product_attribution_rule"
    inputs:
      - "current_product_phase_amount"
      - "current_product_attribution_rule"
    output: "current_product_period_attributed_amount"
    output_unit: "defined by the current PCR"
    source_ids:
      - "iso_14044"
allocation_rules:
  - rule_id: "require_current_product_period_attribution"
    priority: 1
    method: "pcr_declared_allocation_method"
    rule:
      en-US: "The PCR must investigate and justify how current-product burdens, outputs, replacement, and termination are attributed across the evidenced periods."
      zh-CN: "PCR 必须调查并说明当前产品的负荷、产出、更新和终止如何在有证据支持的期间之间归属。"
    condition:
      en-US: "Activate only when the current-product multi-period decision is true."
      zh-CN: "仅当当前产品的跨期间决定为真时激活。"
    source_ids:
      - "iso_14044"
validation_rules:
  - rule_id: "multi_period_decision_is_evidenced"
    severity: "error"
    check: "The PCR records current-product evidence for activating or excluding the multi-period condition."
    message:
      en-US: "The multi-period condition requires a current-product evidence-based decision."
      zh-CN: "跨期间条件需要基于当前产品证据作出决定。"
    source_ids:
      - "iso_14044"
  - rule_id: "period_structure_is_defined"
    severity: "error"
    check: "An active condition defines its current-product phases, time basis, and attribution basis."
    message:
      en-US: "An active multi-period condition needs a defined phase and attribution structure."
      zh-CN: "激活的跨期间条件必须定义阶段和归属结构。"
    source_ids:
      - "iso_14044"
  - rule_id: "inherited_values_are_rejected"
    severity: "warning"
    check: "Cycle or annualization values are supported by current-product evidence rather than inherited from another product."
    message:
      en-US: "Cycle and attribution values need current-product evidence."
      zh-CN: "周期和归属数值需要当前产品证据。"
    source_ids:
      - "iso_14044"
data_quality_rules:
  - rule_id: "multi_period_representativeness"
    dimension: "representativeness"
    requirement:
      en-US: "Use evidence representative of the current product's phases, periods, site, and production system."
      zh-CN: "使用代表当前产品阶段、期间、场址和生产系统的证据。"
    source_ids:
      - "iso_14044"
  - rule_id: "multi_period_evidence_traceability"
    dimension: "data_quality"
    requirement:
      en-US: "Record the current-product source supporting the multi-period decision and every active attribution rule."
      zh-CN: "记录支持跨期间决定和每项已激活归属规则的当前产品来源。"
    source_ids:
      - "iso_14044"
sources:
  - source_id: "iso_14044"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines"
    url: "https://www.iso.org/standard/38498.html"
    supports:
      - "life-cycle study framework"
      - "inventory definition"
      - "data quality and allocation"
