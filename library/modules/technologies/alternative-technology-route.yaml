schema_version: 0
id: module.technology.alternative-technology-route
version: 0.1.0
status: candidate
kind: technology
title: Alternative technology route
purpose: Describe an evidenced alternative implementation of a selected parent activity.
activation:
  question: Does the selected route change topology, inventory categories, calculation, data requirements, or validation relative to its parent?
  signals:
    - technology_delta
  evidence:
    - declared parent activity
    - current product and route evidence showing the changed requirements
  outcomes:
    applicable: attach_an_explicit_route_delta_to_the_parent
    not_applicable: retain_the_difference_as_a_pcr_parameter_or_choice
    unresolved: do_not_promote_the_route_until_parent_and_delta_are_evidenced
owns:
  - parent activity reference
  - route delta declaration
  - coexistence and mutual-exclusion rules
  - route-specific evidence prompts
excludes:
  - independent product interface
  - parent activity rules
  - technology performance values, factors, and concrete flows
interfaces:
  inherited: [parent_activity_inputs, parent_activity_outputs, parent_handoff]
  delta: [changed_topology, changed_inventory_categories, changed_calculation_or_validation]
authoring:
  target_sections: [product_category_identity, system_boundary, process_map, validation_rules]
  evidence_policy: current_product_and_route
  generation_rule: >-
    Use the obligations to describe only the evidenced delta from the selected parent activity.
obligations:
  - declare the parent activity
  - describe the delta by requirement category
  - state route coexistence or mutual exclusion
  - collect current evidence for each claimed delta
validation:
  - parent_activity_is_required
  - evidenced_delta_is_required
  - mutually_exclusive_routes_require_resolution
composition:
  depends_on: [selected_parent_activity]
  coexists_with: [system_condition]
  conflicts_with: [technology_without_parent, route_label_without_delta]
tests:
  - agriculture-managed-production-node
  - mining-extraction-and-treatment
  - electricity-generation-route
