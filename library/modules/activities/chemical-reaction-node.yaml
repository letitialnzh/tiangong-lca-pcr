schema_version: 0
id: module.activity.chemical-reaction-node
version: 0.1.0
status: candidate
kind: activity
title: Chemical reaction node
purpose: Describe an independent composition-changing reaction between declared reactant and output states.
activation:
  question: Does the route transform input substances through a declared chemical or biochemical reaction?
  signals:
    - chemical_reaction_route
  evidence:
    - route description showing reactants and reaction responsibility
    - current PCR evidence for the reaction boundary and output hand-off
  outcomes:
    applicable: declare_a_distinct_chemical_reaction_node
    not_applicable: keep_reaction_inside_an_existing_node
    unresolved: retain_reaction_boundary_ambiguity_and_request_route_evidence
owns:
  - reactant and reaction-service role slots
  - reaction boundary and conversion completeness questions
  - checks for products, by-products, unreacted inputs, and losses
excludes:
  - substance or product identity
  - reaction pathway, yield, and factors
  - quantities, factors, and flow UUIDs
interfaces:
  inputs: [reactant_roles, reaction_service_roles]
  process: [chemical_or_biochemical_reaction_responsibility]
  outputs: [product_composition_state, by_product_state, unreacted_or_loss_state, downstream_handoff]
obligations:
  - identify every reactant role
  - identify the changed composition state and hand-off
  - distinguish products, by-products, unreacted inputs, and losses
  - record the reaction boundary without inventing a pathway or yield
validation:
  - applicable_node_requires_reactant_and_output_states
  - applicable_node_requires_reaction_handoff
  - by_product_and_unreacted_roles_require_explicit_classification
composition:
  depends_on: []
  coexists_with: [material-treatment-node, formulation-blending-node, technology, system_condition]
  conflicts_with: [duplicate_chemical_reaction_node, reaction_label_without_composition_change]
tests:
  - cross-domain-chemical-reaction
