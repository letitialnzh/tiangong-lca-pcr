schema_version: 0
id: module.activity.preservation-stabilization-node
version: 0.1.0
status: candidate
kind: activity
title: Preservation and stabilization node
purpose: Describe an independent intervention that preserves or stabilizes a declared usable product or material state.
activation:
  question: Does the route preserve or stabilize a declared usable state through a bounded intervention?
  signals:
    - preservation_stabilization_route
  evidence:
    - route description showing the pre-intervention and post-intervention states
    - current product and route evidence for the preservation boundary and hand-off
  outcomes:
    applicable: declare_a_distinct_preservation_or_stabilization_node
    not_applicable: keep_preservation_inside_an_existing_node
    unresolved: retain_stability_state_ambiguity_and_request_route_evidence
owns:
  - stability-state interface slots
  - preservation boundary and condition questions
  - checks for interventions, residues, losses, and rejected outputs
excludes:
  - product identity and shelf-life values
  - preservation technology and treatment factors
  - quantities, factors, and flow UUIDs
interfaces:
  inputs: [pre_intervention_usable_state, preservation_input_roles]
  process: [preservation_or_stabilization_responsibility]
  outputs: [post_intervention_usable_state, residue_or_loss_state, downstream_handoff]
authoring:
  target_sections: [system_boundary, process_map, process_inventory]
  evidence_policy: current_product_and_route
  generation_rule: >-
    Use the obligations as mandatory English PCR writing questions and answer them with current-product evidence.
obligations:
  - identify the usable state before intervention
  - identify the stabilized state and hand-off
  - identify preservation inputs and service roles
  - distinguish residues, losses, and rejected outputs
validation:
  - applicable_node_requires_before_and_after_usable_states
  - applicable_node_requires_preservation_handoff
  - residue_and_loss_roles_require_explicit_classification
composition:
  depends_on: []
  coexists_with: [material-treatment-node, packaging-presentation-node, technology, system_condition]
  conflicts_with: [duplicate_preservation_node, stability_claim_without_bounded_intervention]
tests:
  - cross-domain-preservation-stabilization
