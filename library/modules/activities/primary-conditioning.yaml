schema_version: 1
id: "module.activities.primary-conditioning"
version: "0.2.0"
status: "candidate"
title:
  en-US: "Primary Conditioning Activity Framework"
  zh-CN: "初级整理处理活动框架"
description:
  en-US: "A conditional pre-PCR framework for handling between the production or transfer stage and the next declared gate. The PCR must establish whether such handling exists and what it contains for the current product."
  zh-CN: "适用于生产或转移阶段与下一个声明交接门之间处理活动的条件性 PCR 前框架。PCR 必须针对当前产品确定该处理是否存在以及具体包含什么。"
depends_on: []
applicability:
  domains:
    - "declared handling or conditioning stage"
  subjects:
    - "products with sorting, grading, cleaning, cooling, drying, storage, or equivalent handling before the next gate"
  excluded_activities:
    - "product-specific handling technology and quantities"
    - "industrial transformation that creates a new product category"
    - "handling assumed only from another product PCR"
parameters:
  - parameter_id: "conditioning_presence"
    label:
      en-US: "Conditioning presence"
      zh-CN: "整理处理是否存在"
    description:
      en-US: "The current-product evidence-based decision on whether a conditioning stage crosses the declared boundary."
      zh-CN: "基于当前产品证据判断整理处理阶段是否跨越声明边界。"
    data_type: "boolean"
    unit: "applicable or not applicable"
    required: true
    supplied_by: "pcr"
    source_ids:
      - "iso_14044"
boundary_rules:
  - rule_id: "investigate_conditioning_slot"
    inclusion: "conditional"
    activity: "primary_conditioning"
    rule:
      en-US: "Investigate whether a distinct conditioning process exists before the next declared gate; activate it only when current-product evidence supports inclusion."
      zh-CN: "调查下一个声明交接门之前是否存在独立整理处理过程；仅当当前产品证据支持纳入时激活。"
    source_ids:
      - "iso_14044"
  - rule_id: "ask_for_conditioning_services"
    inclusion: "conditional"
    activity: "conditioning_inputs"
    rule:
      en-US: "If conditioning is active, investigate the material, energy, water, equipment, and service categories used by the current product route."
      zh-CN: "如果整理处理被激活，调查当前产品路线使用的材料、能源、水、设备和服务类别。"
    source_ids:
      - "iso_14044"
  - rule_id: "defer_transformation_boundary"
    inclusion: "exclude"
    activity: "industrial_transformation"
    rule:
      en-US: "Do not classify an operation as conditioning when current-product evidence shows that it materially transforms the product into a new category."
      zh-CN: "当当前产品证据显示某操作将产品实质转化为新类别时，不得将其归为整理处理。"
    source_ids:
      - "iso_14044"
inventory_patterns:
  - pattern_id: "conditioning_inputs"
    direction: "input"
    flow_type: "product"
    flow_role:
      en-US: "Current-product conditioning input categories to investigate"
      zh-CN: "需要调查的当前产品整理处理投入类别"
    required: true
    amount_source: "foreground_record"
    collection_protocol_id: "conditioning_framework_questions"
    condition:
      en-US: "Use only when the conditioning presence decision is true and current-product evidence identifies the category."
      zh-CN: "仅当整理处理存在且当前产品证据识别出该类别时使用。"
    source_ids:
      - "iso_14044"
  - pattern_id: "conditioned_output"
    direction: "output"
    flow_type: "product"
    flow_role:
      en-US: "Current-product output after the conditioning stage"
      zh-CN: "当前产品经过整理处理后的产出"
    required: true
    amount_source: "foreground_record"
    collection_protocol_id: "conditioning_framework_questions"
    condition:
      en-US: "The PCR must establish the input state, output state, measurement point, and evidence for the current product."
      zh-CN: "PCR 必须确定当前产品的输入状态、输出状态、计量点和证据。"
    source_ids:
      - "iso_14044"
  - pattern_id: "conditioning_losses"
    direction: "output"
    flow_type: "waste"
    flow_role:
      en-US: "Potential handling losses or residues to investigate"
      zh-CN: "需要调查的潜在处理损失或残余物"
    required: false
    amount_source: "foreground_record"
    collection_protocol_id: "conditioning_framework_questions"
    condition:
      en-US: "Activate only when current-product evidence identifies a material loss or residue."
      zh-CN: "仅当当前产品证据识别出重大损失或残余物时激活。"
    source_ids:
      - "iso_14044"
collection_protocols:
  - protocol_id: "conditioning_framework_questions"
    applies_to:
      - "conditioning_inputs"
      - "conditioned_output"
      - "conditioning_losses"
    record_type:
      en-US: "Current-product conditioning evidence record"
      zh-CN: "当前产品整理处理证据记录"
    required_fields:
      - "conditioning presence decision"
      - "operation and route"
      - "input or output category"
      - "property and unit"
      - "measurement point and period"
      - "evidence source"
    collection_method:
      en-US: "Search current-product sources, facility records, foreground records, or disclosed estimates."
      zh-CN: "检索当前产品来源、设施记录、前景记录或已披露的估算。"
    unit: "to be determined for the current product"
    frequency: "each active conditioning operation and reporting period"
    temporal_coverage:
      en-US: "The period represented by the current PCR evidence."
      zh-CN: "当前 PCR 证据所代表的期间。"
    site_scope:
      en-US: "The current product route and materially different handling systems."
      zh-CN: "当前产品路线及存在重大差异的处理系统。"
    aggregation_rule:
      en-US: "Aggregate only after product state, route, period, property, unit, and evidence basis are reconciled."
      zh-CN: "仅在产品状态、路线、期间、属性、单位和证据基础核对一致后汇总。"
    quality_evidence:
      - "current-product source"
      - "facility or foreground record"
      - "disclosed estimate"
    source_ids:
      - "iso_14044"
calculation_rules:
  - rule_id: "apply_pcr_defined_conditioning_yield"
    applies_to:
      - "conditioned_output"
    expression: "current_product_conditioning_yield = current_product_conditioned_output / current_product_conditioning_input"
    inputs:
      - "current_product_conditioned_output"
      - "current_product_conditioning_input"
    output: "current_product_conditioning_yield"
    output_unit: "defined by the current PCR"
    source_ids:
      - "iso_14044"
allocation_rules:
  - rule_id: "require_current_product_conditioning_allocation"
    priority: 1
    method: "pcr_declared_allocation_method"
    rule:
      en-US: "If conditioning produces multiple intended outputs, investigate and justify the treatment from current-product evidence."
      zh-CN: "如果整理处理产生多个预期产出，必须基于当前产品证据调查并说明处理方式。"
    condition:
      en-US: "Activate only when current-product evidence identifies multiple intended outputs."
      zh-CN: "仅当当前产品证据识别出多个预期产出时激活。"
    source_ids:
      - "iso_14044"
validation_rules:
  - rule_id: "conditioning_presence_is_evidenced"
    severity: "error"
    check: "The PCR records a current-product evidence-based decision to activate or exclude conditioning."
    message:
      en-US: "Conditioning must be activated or excluded using current-product evidence."
      zh-CN: "必须依据当前产品证据激活或排除整理处理。"
    source_ids:
      - "iso_14044"
  - rule_id: "conditioning_states_are_defined"
    severity: "error"
    check: "An active conditioning stage defines its input state, output state, gate, property, and unit."
    message:
      en-US: "An active conditioning stage needs defined product states and measurement basis."
      zh-CN: "激活的整理处理阶段必须定义产品状态和计量基准。"
    source_ids:
      - "iso_14044"
  - rule_id: "conditioning_losses_are_explained"
    severity: "warning"
    check: "Investigated but inactive conditioning-loss categories have a current-product rationale."
    message:
      en-US: "Investigated but inactive conditioning-loss categories need a disclosed rationale."
      zh-CN: "已调查但未激活的整理处理损失类别需要披露依据。"
    source_ids:
      - "iso_14044"
data_quality_rules:
  - rule_id: "conditioning_evidence_representativeness"
    dimension: "representativeness"
    requirement:
      en-US: "Use evidence representative of the current conditioning route, facility, period, and product state."
      zh-CN: "使用代表当前整理处理路线、设施、期间和产品状态的证据。"
    source_ids:
      - "iso_14044"
  - rule_id: "conditioning_evidence_traceability"
    dimension: "data_quality"
    requirement:
      en-US: "Record the current-product source supporting the activation decision and every active category."
      zh-CN: "记录支持激活决定和每个已激活类别的当前产品来源。"
    source_ids:
      - "iso_14044"
sources:
  - source_id: "iso_14044"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines"
    url: "https://www.iso.org/standard/38498.html"
    supports:
      - "life-cycle study framework"
      - "inventory definition"
      - "data quality and allocation"
