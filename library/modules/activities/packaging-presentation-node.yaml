schema_version: 0
id: module.activity.packaging-presentation-node
version: 0.1.0
status: candidate
kind: activity
title: Packaging and presentation node
purpose: Describe an independent product-route responsibility that encloses, protects, labels, or presents a product before its declared hand-off.
activation:
  question: Does the route enclose, protect, label, or present a product inside the declared product system boundary?
  signals:
    - packaging_presentation_route
  evidence:
    - route description showing the prior product state and package boundary
    - current PCR evidence for the packaging hand-off and reuse or end-of-use treatment
  outcomes:
    applicable: declare_a_distinct_packaging_or_presentation_node
    not_applicable: keep_packaging_outside_the_declared_product_boundary
    unresolved: retain_product_package_boundary_ambiguity_and_request_route_evidence
owns:
  - product and package interface slots
  - packaging boundary and material-role questions
  - checks for packaging inputs, rejects, reuse, and end-of-use hand-off
excludes:
  - product identity and market channel
  - packaging material choice and distribution service
  - quantities, factors, and flow UUIDs
interfaces:
  inputs: [prior_product_state, packaging_material_roles]
  process: [packaging_or_presentation_responsibility]
  outputs: [protected_or_presented_product_state, package_reject_state, downstream_handoff]
obligations:
  - identify the product state before packaging
  - identify the protected or presented product state and hand-off
  - identify packaging material roles and reuse status
  - keep distribution and logistics outside this activity unless separately declared
validation:
  - applicable_node_requires_product_and_package_boundary
  - applicable_node_requires_packaged_output_and_handoff
  - packaging_reuse_and_end_of_use_require_explicit_classification
composition:
  depends_on: []
  coexists_with: [preservation-stabilization-node, grading-sorting-node, technology, system_condition]
  conflicts_with: [duplicate_packaging_node, distribution_service_as_product_activity]
tests:
  - cross-domain-packaging-presentation
