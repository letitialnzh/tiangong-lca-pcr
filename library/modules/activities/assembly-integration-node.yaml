schema_version: 0
id: module.activity.assembly-integration-node
version: 0.1.0
status: candidate
kind: activity
title: Assembly and integration node
purpose: Describe an independent responsibility that joins or integrates multiple component inputs into an assembled output.
activation:
  question: Does the route join or integrate two or more independently identified components into a declared assembled output?
  signals:
    - assembly_integration_route
  evidence:
    - route description showing component inputs and joining responsibility
    - current PCR evidence for the assembly boundary and product hand-off
  outcomes:
    applicable: declare_a_distinct_assembly_or_integration_node
    not_applicable: keep_joining_inside_an_existing_node
    unresolved: retain_component_or_handoff_ambiguity_and_request_route_evidence
owns:
  - component-role and assembly interface slots
  - assembly boundary and completeness questions
  - checks for component inputs, losses, and rejected assemblies
excludes:
  - component or product identity
  - assembly technology or performance
  - quantities, factors, and flow UUIDs
interfaces:
  inputs: [component_inputs, assembly_service_roles]
  process: [assembly_or_integration_responsibility]
  outputs: [assembled_output_state, rejected_assembly_state, downstream_handoff]
obligations:
  - enumerate every component input role
  - identify the assembled output state and hand-off
  - identify joining service roles without inventing performance values
  - distinguish rejected assemblies and losses from intended output
validation:
  - applicable_node_requires_two_or_more_component_roles
  - applicable_node_requires_assembled_output_and_handoff
  - rejected_assembly_roles_require_explicit_classification
composition:
  depends_on: []
  coexists_with: [forming-fabrication-node, surface-finishing-node, technology, system_condition]
  conflicts_with: [duplicate_assembly_node, embedded_assembly_without_boundary_resolution]
tests:
  - cross-domain-assembly-integration
