schema_version: 0
id: module.activity.independent-process-node
version: 0.1.0
status: candidate
kind: activity
title: Independent process node
purpose: >-
  Describe a distinct modelling responsibility that has its own input roles, output state, and
  hand-off point.
activation:
  question: Does the route contain an independent process responsibility that needs its own collection or validation?
  signals:
    - process_map
  evidence:
    - route description and selected boundary
    - current PCR evidence for the responsibility and hand-off
  outcomes:
    applicable: declare_a_distinct_process_node
    not_applicable: keep_the_responsibility_in_an_existing_node
    unresolved: retain_the_ambiguity_and_request_route_evidence
owns:
  - process-node role slots
  - node-specific boundary and hand-off questions
  - completeness checks for declared node roles
excludes:
  - universal PCR contract rules
  - product identity, quantities, factors, and flow UUIDs
interfaces:
  inputs: [upstream_input_roles]
  process: [independent_responsibility]
  outputs: [output_state, downstream_handoff]
obligations:
  - identify input roles
  - identify output state and hand-off
  - explain why the responsibility is independent
  - expose unresolved or shared roles
validation:
  - applicable_node_requires_input_or_service_roles
  - applicable_node_requires_output_state_and_handoff
  - duplicate_responsibility_requires_resolution
composition:
  depends_on: []
  coexists_with: [technology, system_condition]
  conflicts_with: [duplicate_activity_for_same_responsibility]
tests:
  - agriculture-managed-production-node
  - mining-extraction-and-treatment
  - electricity-generation-route
