schema_version: 1
id: "module.activities.harvest-or-capture"
version: "0.2.0"
status: "candidate"
title:
  en-US: "Harvest or Capture Activity Framework"
  zh-CN: "采收或捕捞活动框架"
description:
  en-US: "A pre-PCR framework for a removal or transfer process. It tells the PCR to investigate the current-product harvest or capture route without supplying route-specific equipment, quantities, or factors."
  zh-CN: "适用于移出或转移过程的 PCR 前框架。它要求 PCR 调查当前产品的采收或捕捞路线，但不提供路线特定的设备、数量或因子。"
depends_on: []
applicability:
  domains:
    - "biological product removal or transfer"
  subjects:
    - "products whose declared route includes harvest, landing, felling, collection, or capture"
  excluded_activities:
    - "product-specific harvest practice and equipment"
    - "product-specific yield, loss, and flow identity"
    - "post-gate transformation unless explicitly declared by the PCR"
parameters:
  - parameter_id: "transfer_route"
    label:
      en-US: "Removal or transfer route"
      zh-CN: "移出或转移路线"
    description:
      en-US: "The current-product route that must be established from evidence."
      zh-CN: "必须根据当前产品证据确定的路线。"
    data_type: "string"
    unit: "declared route"
    required: true
    supplied_by: "pcr"
    source_ids:
      - "iso_14044"
  - parameter_id: "transfer_gate"
    label:
      en-US: "Transfer gate"
      zh-CN: "转移交接门"
    description:
      en-US: "The current-product measurement point at which the declared output crosses the activity boundary."
      zh-CN: "当前产品声明产出跨越活动边界的计量点。"
    data_type: "string"
    unit: "declared gate"
    required: true
    supplied_by: "pcr"
    source_ids:
      - "iso_14044"
boundary_rules:
  - rule_id: "require_transfer_process_slot"
    inclusion: "include"
    activity: "product_transfer"
    rule:
      en-US: "Create a removal or transfer process slot when the current product route includes harvest, landing, felling, collection, or capture."
      zh-CN: "当当前产品路线包括采收、上岸、采伐、收集或捕捞时，建立移出或转移过程位置。"
    source_ids:
      - "iso_14044"
  - rule_id: "ask_for_current_transfer_inputs"
    inclusion: "conditional"
    activity: "transfer_inputs"
    rule:
      en-US: "Investigate which current-product fuel, energy, material, equipment, service, or loss categories cross the declared transfer boundary."
      zh-CN: "调查当前产品中哪些燃料、能源、材料、设备、服务或损失类别跨越声明的转移边界。"
    source_ids:
      - "iso_14044"
  - rule_id: "defer_post_gate_processing"
    inclusion: "exclude"
    activity: "post_gate_processing"
    rule:
      en-US: "Leave post-gate transformation and distribution to the PCR unless the current scope explicitly includes them."
      zh-CN: "除非当前范围明确纳入，否则将交接门后的加工和配送留给 PCR 另行决定。"
    source_ids:
      - "iso_14044"
inventory_patterns:
  - pattern_id: "transfer_inputs"
    direction: "input"
    flow_type: "product"
    flow_role:
      en-US: "Current-product transfer input categories to investigate"
      zh-CN: "需要调查的当前产品转移投入类别"
    required: true
    amount_source: "foreground_record"
    collection_protocol_id: "transfer_framework_questions"
    condition:
      en-US: "Activate categories only after current-product evidence establishes that they are used and material."
      zh-CN: "只有当前产品证据确认某类别被使用且具有重大性时才激活。"
    source_ids:
      - "iso_14044"
  - pattern_id: "transferred_output"
    direction: "output"
    flow_type: "product"
    flow_role:
      en-US: "Declared output at the current-product transfer gate"
      zh-CN: "当前产品转移交接门处的声明产出"
    required: true
    amount_source: "foreground_record"
    collection_protocol_id: "transfer_framework_questions"
    condition:
      en-US: "The PCR must establish current-product identity, state, property, unit, measurement point, and reference relationship."
      zh-CN: "PCR 必须确定当前产品的身份、状态、属性、单位、计量点和参考关系。"
    source_ids:
      - "iso_14044"
  - pattern_id: "transfer_losses_or_secondary_outputs"
    direction: "output"
    flow_type: "waste"
    flow_role:
      en-US: "Potential transfer losses or secondary outputs to investigate"
      zh-CN: "需要调查的潜在转移损失或次级产出"
    required: false
    amount_source: "foreground_record"
    collection_protocol_id: "transfer_framework_questions"
    condition:
      en-US: "Activate only when current-product evidence identifies a material loss or secondary output."
      zh-CN: "仅当当前产品证据识别出重大损失或次级产出时激活。"
    source_ids:
      - "iso_14044"
collection_protocols:
  - protocol_id: "transfer_framework_questions"
    applies_to:
      - "transfer_inputs"
      - "transferred_output"
      - "transfer_losses_or_secondary_outputs"
    record_type:
      en-US: "Current-product transfer evidence record"
      zh-CN: "当前产品转移证据记录"
    required_fields:
      - "current-product route"
      - "transfer operation"
      - "input or output category"
      - "property and unit"
      - "measurement point and period"
      - "evidence source"
    collection_method:
      en-US: "Search current-product literature, official guidance, foreground records, or disclosed estimates."
      zh-CN: "检索当前产品文献、官方指南、前景记录或已披露的估算。"
    unit: "to be determined for the current product"
    frequency: "each applicable transfer operation and reporting period"
    temporal_coverage:
      en-US: "The period represented by the current PCR evidence."
      zh-CN: "当前 PCR 证据所代表的期间。"
    site_scope:
      en-US: "The current product route and materially different transfer systems."
      zh-CN: "当前产品路线及存在重大差异的转移系统。"
    aggregation_rule:
      en-US: "Aggregate only after route, period, property, unit, and evidence basis are reconciled."
      zh-CN: "仅在路线、期间、属性、单位和证据基础核对一致后汇总。"
    quality_evidence:
      - "current-product source"
      - "foreground record"
      - "disclosed estimate"
    source_ids:
      - "iso_14044"
calculation_rules:
  - rule_id: "apply_pcr_defined_transfer_normalization"
    applies_to:
      - "transfer_inputs"
    expression: "current_product_normalized_transfer_input = current_product_transfer_input / current_product_transferred_output"
    inputs:
      - "current_product_transfer_input"
      - "current_product_transferred_output"
    output: "current_product_normalized_transfer_input"
    output_unit: "defined by the current PCR"
    source_ids:
      - "iso_14044"
allocation_rules:
  - rule_id: "require_current_product_transfer_allocation"
    priority: 1
    method: "pcr_declared_allocation_method"
    rule:
      en-US: "If the current transfer route produces multiple intended outputs, investigate and justify the treatment from current-product evidence."
      zh-CN: "如果当前转移路线产生多个预期产出，必须基于当前产品证据调查并说明处理方式。"
    condition:
      en-US: "Activate only when current-product evidence identifies multiple intended outputs."
      zh-CN: "仅当当前产品证据识别出多个预期产出时激活。"
    source_ids:
      - "iso_14044"
validation_rules:
  - rule_id: "transfer_route_has_current_evidence"
    severity: "error"
    check: "The PCR contains current-product evidence for the removal or transfer route and gate."
    message:
      en-US: "The transfer route and gate need current-product evidence."
      zh-CN: "转移路线和交接门需要当前产品证据。"
    source_ids:
      - "iso_14044"
  - rule_id: "transferred_output_is_defined"
    severity: "error"
    check: "The PCR defines the transferred output and its measurement basis."
    message:
      en-US: "The current PCR must define the transferred output and measurement basis."
      zh-CN: "当前 PCR 必须定义转移产出和计量基准。"
    source_ids:
      - "iso_14044"
  - rule_id: "transfer_losses_are_explained"
    severity: "warning"
    check: "Investigated but inactive transfer-loss categories have a current-product rationale."
    message:
      en-US: "Investigated but inactive transfer-loss categories need a disclosed rationale."
      zh-CN: "已调查但未激活的转移损失类别需要披露依据。"
    source_ids:
      - "iso_14044"
data_quality_rules:
  - rule_id: "transfer_evidence_representativeness"
    dimension: "representativeness"
    requirement:
      en-US: "Use evidence representative of the current transfer route, site, period, and output state."
      zh-CN: "使用代表当前转移路线、场址、期间和产出状态的证据。"
    source_ids:
      - "iso_14044"
  - rule_id: "transfer_evidence_traceability"
    dimension: "data_quality"
    requirement:
      en-US: "Record the current-product source supporting every activated transfer category."
      zh-CN: "记录每个已激活转移类别所依据的当前产品来源。"
    source_ids:
      - "iso_14044"
sources:
  - source_id: "iso_14044"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines"
    url: "https://www.iso.org/standard/38498.html"
    supports:
      - "life-cycle study framework"
      - "inventory definition"
      - "data quality and allocation"
