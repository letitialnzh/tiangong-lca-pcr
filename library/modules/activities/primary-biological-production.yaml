schema_version: 1
id: "module.activities.primary-biological-production"
version: "0.2.0"
status: "candidate"

title:
  en-US: "Primary Biological Production Activity Framework"
  zh-CN: "初级生物生产活动框架"

description:
  en-US: "A pre-PCR framework that requires a biological production process to be considered. It defines stable process interfaces and evidence questions; it does not provide product-specific practices, quantities, factors, or conclusions."
  zh-CN: "在 PCR 生成前要求考虑生物生产过程的框架。它定义稳定的过程接口和证据问题，但不提供产品特定的实践、数量、因子或结论。"

depends_on: []

applicability:
  domains:
    - "declared biological production systems"
  subjects:
    - "any product with a controlled biological production stage"
  excluded_activities:
    - "product identity and classification selection"
    - "site-specific practice, quantity, factor, and flow selection"
    - "downstream transformation unless explicitly declared by the PCR"

parameters:
  - parameter_id: "production_route"
    label:
      en-US: "Production route"
      zh-CN: "生产路线"
    description:
      en-US: "The current-PCR route description that must be established from product evidence."
      zh-CN: "必须根据当前产品证据确定的 PCR 生产路线描述。"
    data_type: "string"
    unit: "declared route"
    required: true
    supplied_by: "pcr"
    source_ids:
      - "iso_14044"
  - parameter_id: "production_period"
    label:
      en-US: "Production period"
      zh-CN: "生产期间"
    description:
      en-US: "The time or biological cycle represented by the current-PCR foreground data."
      zh-CN: "当前 PCR 前景数据所代表的时间或生物周期。"
    data_type: "string"
    unit: "declared period"
    required: true
    supplied_by: "pcr_or_foreground_dataset"
    source_ids:
      - "iso_14044"

boundary_rules:
  - rule_id: "require_production_process_slot"
    inclusion: "include"
    activity: "biological_production"
    rule:
      en-US: "Create a production process slot and investigate the operations needed to obtain the declared product output. The concrete operations must be established for the current product."
      zh-CN: "建立生产过程位置，并调查获得声明产品产出所需的操作。具体操作必须针对当前产品确定。"
    source_ids:
      - "iso_14044"
  - rule_id: "ask_for_route_specific_inputs"
    inclusion: "conditional"
    activity: "production_inputs"
    rule:
      en-US: "Ask which material, energy, water, service, and emission categories are material for the selected route; do not assume a category is present without current-product evidence."
      zh-CN: "调查所选路线中哪些材料、能源、水、服务和排放类别具有重大性；没有当前产品证据时不得假定其存在。"
    source_ids:
      - "iso_14044"
  - rule_id: "defer_product_specific_practice"
    inclusion: "exclude"
    activity: "copied_product_practice"
    rule:
      en-US: "Do not copy a practice, factor, quantity, flow identity, or allocation choice from another product into this activity framework."
      zh-CN: "不得将其他产品的实践、因子、数量、流身份或分配选择复制到该活动框架中。"
    source_ids:
      - "iso_14044"

inventory_patterns:
  - pattern_id: "production_inputs"
    direction: "input"
    flow_type: "product"
    flow_role:
      en-US: "Current-product production input categories to be identified and evidenced"
      zh-CN: "需要识别并取得证据的当前产品生产投入类别"
    required: true
    amount_source: "foreground_record"
    collection_protocol_id: "production_framework_questions"
    condition:
      en-US: "The PCR must determine which input categories apply and collect current-product evidence before writing rows."
      zh-CN: "PCR 必须在写入清单行之前确定哪些投入类别适用，并收集当前产品证据。"
    source_ids:
      - "iso_14044"
  - pattern_id: "production_output"
    direction: "output"
    flow_type: "product"
    flow_role:
      en-US: "Declared production output interface"
      zh-CN: "声明生产产出接口"
    required: true
    amount_source: "foreground_record"
    collection_protocol_id: "production_framework_questions"
    condition:
      en-US: "The PCR must define the product state, measurement point, reference basis, and evidence for the current product."
      zh-CN: "PCR 必须定义当前产品的状态、测量点、参考基准和证据。"
    source_ids:
      - "iso_14044"
  - pattern_id: "production_secondary_outputs"
    direction: "output"
    flow_type: "waste"
    flow_role:
      en-US: "Potential losses, residues, or secondary outputs to investigate"
      zh-CN: "需要调查的潜在损失、残余物或次级产出"
    required: false
    amount_source: "foreground_record"
    collection_protocol_id: "production_framework_questions"
    condition:
      en-US: "Activate only when current-product evidence shows a material secondary output or loss."
      zh-CN: "仅当当前产品证据显示存在重大次级产出或损失时激活。"
    source_ids:
      - "iso_14044"

collection_protocols:
  - protocol_id: "production_framework_questions"
    applies_to:
      - "production_inputs"
      - "production_output"
      - "production_secondary_outputs"
    record_type:
      en-US: "Current-product production evidence record"
      zh-CN: "当前产品生产证据记录"
    required_fields:
      - "current-product route"
      - "process operation"
      - "input or output category"
      - "property and unit"
      - "measurement point and period"
      - "evidence source"
    collection_method:
      en-US: "Search current-product literature, official guidance, supplier records, foreground records, or a disclosed estimation method."
      zh-CN: "检索当前产品文献、官方指南、供应商记录、前景记录或已披露的估算方法。"
    unit: "to be determined for the current product"
    frequency: "each applicable process and reporting period"
    temporal_coverage:
      en-US: "The period represented by the current PCR evidence."
      zh-CN: "当前 PCR 证据所代表的期间。"
    site_scope:
      en-US: "The current product route and materially different foreground systems."
      zh-CN: "当前产品路线及存在重大差异的前景系统。"
    aggregation_rule:
      en-US: "Aggregate only after route, period, property, unit, and evidence basis are reconciled."
      zh-CN: "仅在路线、期间、属性、单位和证据基础核对一致后汇总。"
    quality_evidence:
      - "current-product source"
      - "foreground record"
      - "disclosed estimate"
    source_ids:
      - "iso_14044"

calculation_rules:
  - rule_id: "apply_pcr_defined_output_normalization"
    applies_to:
      - "production_inputs"
    expression: "current_product_normalized_amount = current_product_amount / current_product_declared_output"
    inputs:
      - "current_product_amount"
      - "current_product_declared_output"
    output: "current_product_normalized_amount"
    output_unit: "defined by the current PCR"
    source_ids:
      - "iso_14044"

allocation_rules:
  - rule_id: "require_current_product_allocation_decision"
    priority: 1
    method: "pcr_declared_allocation_method"
    rule:
      en-US: "If the current product has multiple intended outputs, the PCR must investigate and justify the selected allocation or substitution treatment from current-product evidence."
      zh-CN: "如果当前产品具有多个预期产出，PCR 必须基于当前产品证据调查并说明所选分配或替代处理。"
    condition:
      en-US: "Activate only when current-product evidence identifies multiple intended outputs."
      zh-CN: "仅当当前产品证据识别出多个预期产出时激活。"
    source_ids:
      - "iso_14044"

validation_rules:
  - rule_id: "production_route_has_current_evidence"
    severity: "error"
    check: "The PCR contains current-product evidence for the selected production route and period."
    message:
      en-US: "The production route and period need current-product evidence; the framework cannot supply them."
      zh-CN: "生产路线和期间需要当前产品证据，框架本身不能提供这些内容。"
    source_ids:
      - "iso_14044"
  - rule_id: "production_output_is_defined"
    severity: "error"
    check: "The PCR defines one current-product output interface with property, unit, measurement point, and reference basis."
    message:
      en-US: "The current PCR must define its product output interface."
      zh-CN: "当前 PCR 必须定义产品产出接口。"
    source_ids:
      - "iso_14044"
  - rule_id: "unresolved_categories_are_disclosed"
    severity: "warning"
    check: "Input or secondary-output categories that were investigated but not activated have a disclosed rationale."
    message:
      en-US: "Investigated but inactive categories need a disclosed current-product rationale."
      zh-CN: "已调查但未激活的类别需要披露当前产品依据。"
    source_ids:
      - "iso_14044"

data_quality_rules:
  - rule_id: "current_product_representativeness"
    dimension: "representativeness"
    requirement:
      en-US: "Use evidence representative of the current product route, geography, period, and production system; do not inherit these dimensions from another product."
      zh-CN: "使用代表当前产品路线、地域、期间和生产系统的证据；不得从其他产品继承这些维度。"
    source_ids:
      - "iso_14044"
  - rule_id: "evidence_traceability"
    dimension: "data_quality"
    requirement:
      en-US: "Record which current-product source supports each activated category or rule."
      zh-CN: "记录每个已激活类别或规则所依据的当前产品来源。"
    source_ids:
      - "iso_14044"

sources:
  - source_id: "iso_14044"
    type: "standard"
    reference: "ISO 14044:2006, Environmental management — Life cycle assessment — Requirements and guidelines"
    url: "https://www.iso.org/standard/38498.html"
    supports:
      - "life-cycle study framework"
      - "inventory definition"
      - "data quality and allocation"
